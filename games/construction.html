  /* ============================================================================
     PHASE 1: YELLOW EXCAVATOR SCOOP
     ============================================================================ */
  function buildPhase1(){
    moundsRow.innerHTML = "";
    dockExcavator.innerHTML = "";

    for(var i = 0; i < MOUND_COUNT; i++){
      (function(idx){
        /* Interactive glowing dirt mound */
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "dirt-mound";
        btn.dataset.mound = String(idx);
        btn.setAttribute("aria-label", "Scoop dirt pile " + (idx + 1));
        btn.innerHTML = '<span class="mound-hand" aria-hidden="true">👇</span>'
          + dirtMoundSvg(idx)
          + '<span class="mound-num">' + (idx + 1) + '</span>';
        btn.addEventListener("click", function(){
          unlockAudioOnce();
          scoopMound(idx, false);
        });
        moundsRow.appendChild(btn);

        /* Dock scoop counter badge (tapping badge also scoops!) */
        var badge = document.createElement("button");
        badge.type = "button";
        badge.className = "scoop-badge";
        badge.dataset.badge = String(idx);
        badge.setAttribute("aria-label", "Dirt scoop " + (idx + 1));
        badge.innerHTML = '<span aria-hidden="true">🪨</span><span class="badge-chk" aria-hidden="true">✓</span>';
        badge.addEventListener("click", function(){
          unlockAudioOnce();
          if(!moundsScoopedMap[idx]) scoopMound(idx, false);
        });
        dockExcavator.appendChild(badge);
      })(i);
    }

    resetExcavatorPose();
    updateTruckDirtPiles();
  }

  function resetExcavatorPose(){
    exBoomGroup.style.transform = "rotate(0deg)";
    exArmGroup.style.transform = "rotate(0deg)";
    exBucketGroup.style.transform = "rotate(0deg)";
    exBucketDirt.setAttribute("opacity", "0");
    exDragHandle.classList.remove("busy");
  }

  function updateTruckDirtPiles(){
    for(var n = 1; n <= 4; n++){
      var pile = $("truckDirtPile" + n);
      if(pile){
        var show = (n <= moundsScooped) || (IS_RILEY && moundsScooped >= 3 && n === 4);
        pile.setAttribute("opacity", show ? "1" : "0");
      }
    }
  }

  function scoopMound(idx, instant){
    if(dead || phase !== "excavator" || moundsScoopedMap[idx]) return;
    if(!instant && excavatorBusy) return;

    hasInteracted = true;
    idleVoiceReminded = false;
    hideIdleHints();
    moundsScoopedMap[idx] = true;
    moundsScooped++;

    var moundBtn = moundsRow.querySelector('[data-mound="' + idx + '"]');
    var badgeBtn = dockExcavator.querySelector('[data-badge="' + idx + '"]');

    if(instant){
      if(moundBtn) moundBtn.classList.add("scooped");
      if(badgeBtn) badgeBtn.classList.add("filled");
      updateTruckDirtPiles();
      return;
    }

    excavatorBusy = true;
    exDragHandle.classList.add("busy");
    excavatorScoopSfx();

    /* Exhaust smoke puff */
    exExhaustPuff.classList.remove("puff");
    void exExhaustPuff.offsetWidth;
    exExhaustPuff.classList.add("puff");

    /* Step 1: Swing boom & arm down into the glowing dirt mound */
    var reachAngle = 14 + idx * 5;
    exBoomGroup.style.transform = "rotate(" + reachAngle + "deg)";
    exArmGroup.style.transform = "rotate(" + (18 + idx * 4) + "deg)";
    exBucketGroup.style.transform = "rotate(34deg)";

    var mr = moundBtn ? moundBtn.getBoundingClientRect() : null;
    later(function(){
      if(moundBtn) moundBtn.classList.add("scooped");
      exBucketDirt.setAttribute("opacity", "1");
      if(mr) spawnDustBurst(mr.left + mr.width * 0.5, mr.top + mr.height * 0.45, 14);

      /* Step 2: Lift full bucket high and swing over the Dump Truck bed */
      exBoomGroup.style.transform = "rotate(-16deg)";
      exArmGroup.style.transform = "rotate(-26deg)";
      exBucketGroup.style.transform = "rotate(-12deg)";
    }, 280);

    later(function(){
      /* Step 3: Dump dirt right into the Dump Truck bed! */
      exBoomGroup.style.transform = "rotate(6deg)";
      exArmGroup.style.transform = "rotate(-44deg)";
      exBucketGroup.style.transform = "rotate(-62deg)";
      exBucketDirt.setAttribute("opacity", "0");

      updateTruckDirtPiles();
      if(badgeBtn) badgeBtn.classList.add("filled");

      p1TruckGroup.classList.remove("bounce");
      void p1TruckGroup.offsetWidth;
      p1TruckGroup.classList.add("bounce");

      var wr = excavatorWorld.getBoundingClientRect();
      spawnDustBurst(wr.left + wr.width * 0.74, wr.top + wr.height * 0.46, 10);
      spawnSparkles(wr.left + wr.width * 0.74, wr.top + wr.height * 0.42, 10);

      dirtDropSfx(moundsScooped);
      hootCheer();

      /* Hoot counts aloud (name-number-1..4 / 1..3 for Riley) */
      enqueueVoice("name-number-" + moundsScooped + ".mp3", true);
    }, 640);

    later(function(){
      resetExcavatorPose();
      excavatorBusy = false;

      if(moundsScooped >= MOUND_COUNT){
        phaseDone.excavator = true;
        updateHud(false);
        playConGuide("hoot-con-scoop", "hoot-great-job", false);
        later(function(){
          if(phase === "excavator") enterPhase("roller", false);
        }, 1450);
      } else {
        armIdle(false);
      }
    }, 1020);
  }

  /* Drag excavator bucket handle to any mound OR tap handle to scoop next mound! */
  exDragHandle.addEventListener("pointerdown", function(e){
    if(dead || phase !== "excavator" || excavatorBusy) return;
    e.preventDefault();
    unlockAudioOnce();
    hasInteracted = true;
    hideIdleHints();
    bucketDragState = { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, moved: false };
    try{ exDragHandle.setPointerCapture(e.pointerId); }catch(err){}
  });
  exDragHandle.addEventListener("pointermove", function(e){
    if(!bucketDragState) return;
    var dist = Math.hypot(e.clientX - bucketDragState.startX, e.clientY - bucketDragState.startY);
    if(dist > 12) bucketDragState.moved = true;
    if(bucketDragState.moved){
      var wr = excavatorWorld.getBoundingClientRect();
      var px = Math.max(12, Math.min(88, ((e.clientX - wr.left) / wr.width) * 100));
      var py = Math.max(20, Math.min(86, ((e.clientY - wr.top) / wr.height) * 100));
      exDragHandle.style.left = px.toFixed(1) + "%";
      exDragHandle.style.top = py.toFixed(1) + "%";

      /* Highlight mound under finger and scoop immediately when close! */
      var mounds = moundsRow.querySelectorAll(".dirt-mound");
      for(var i = 0; i < mounds.length; i++){
        var idx = Number(mounds[i].dataset.mound);
        if(moundsScoopedMap[idx]) continue;
        var r = mounds[i].getBoundingClientRect();
        var hit = e.clientX >= r.left - 24 && e.clientX <= r.right + 24 && e.clientY >= r.top - 24 && e.clientY <= r.bottom + 24;
        mounds[i].classList.toggle("hot", hit);
        if(hit){
          mounds[i].classList.remove("hot");
          bucketDragState = null;
          exDragHandle.style.left = "47%";
          exDragHandle.style.top = "47%";
          try{ exDragHandle.releasePointerCapture(e.pointerId); }catch(err){}
          scoopMound(idx, false);
          return;
        }
      }
    }
  });
  function endBucketDrag(e){
    if(!bucketDragState) return;
    var wasMoved = bucketDragState.moved;
    bucketDragState = null;
    exDragHandle.style.left = "47%";
    exDragHandle.style.top = "47%";
    moundsRow.querySelectorAll(".dirt-mound").forEach(function(m){ m.classList.remove("hot"); });
    try{ if(e && e.pointerId != null) exDragHandle.releasePointerCapture(e.pointerId); }catch(err){}
    if(!wasMoved){
      /* Tapping the bucket handle scoops the next glowing mound! */
      for(var i = 0; i < MOUND_COUNT; i++){
        if(!moundsScoopedMap[i]){ scoopMound(i, false); break; }
      }
    }
  }
  exDragHandle.addEventListener("pointerup", endBucketDrag);
  exDragHandle.addEventListener("pointercancel", endBucketDrag);

  /* ============================================================================
     PHASE 2: DUMP & STEAMROLL ROAD
     ============================================================================ */
  function setupPhase2(){
    rollerSubStep = "dump";
    rollProgress = 0;
    isRollingDrag = false;

    p2DumpBtn.hidden = false;
    p2DumpBtn.classList.remove("tipping", "parked", "show-hand");
    p2DumpBtn.classList.add("glow-cue");
    roadTrack.classList.remove("rocks-poured");
    roadSmoothOverlay.style.width = "0%";
    roadSmoothOverlay.classList.remove("complete");
    steamrollerWrap.classList.remove("ready", "rolling");
    steamrollerWrap.style.left = "4%";

    tipBtn.hidden = false;
    rollTapBtn.hidden = true;
    rollMeterWrap.hidden = true;
    rollMeterFill.style.width = "0%";
  }

  function triggerDumpRocks(instant){
    if(dead || phase !== "roller" || rollerSubStep !== "dump") return;
    hasInteracted = true;
    idleVoiceReminded = false;
    hideIdleHints();

    rollerSubStep = "roll";
    p2DumpBtn.classList.remove("glow-cue");
    p2DumpBtn.classList.add("tipping");

    if(instant){
      roadTrack.classList.add("rocks-poured");
      p2DumpBtn.classList.add("parked");
      p2DumpBtn.hidden = true;
      steamrollerWrap.classList.add("ready");
      tipBtn.hidden = true;
      rollTapBtn.hidden = false;
      rollMeterWrap.hidden = false;
      return;
    }

    dumpPourSfx();
    hootCheer();

    later(function(){
      roadTrack.classList.add("rocks-poured");
      var rr = roadTrack.getBoundingClientRect();
      spawnDustBurst(rr.left + rr.width * 0.55, rr.top + rr.height * 0.45, 16);
      spawnSparkles(rr.left + rr.width * 0.55, rr.top + rr.height * 0.35, 8);
    }, 240);

    later(function(){
      p2DumpBtn.classList.add("parked");
      steamrollerWrap.classList.add("ready");
      tipBtn.hidden = true;
      rollTapBtn.hidden = false;
      rollMeterWrap.hidden = false;
      playConGuide("hoot-con-roll", "hoot-tap-big-btn", false);
      armIdle(true);
      later(function(){
        if(rollerSubStep !== "dump") p2DumpBtn.hidden = true;
      }, 560);
    }, 820);
  }

  function applyRollProgress(nextPct, fromRub){
    if(dead || phase !== "roller" || rollerSubStep !== "roll") return;
    var finishGate = IS_RILEY ? 88 : 92;
    rollProgress = Math.max(rollProgress, Math.min(100, nextPct));
    if(rollProgress >= finishGate) rollProgress = 100;

    roadSmoothOverlay.style.width = rollProgress.toFixed(1) + "%";
    rollMeterFill.style.width = rollProgress.toFixed(1) + "%";

    /* Keep steamroller nose right at the paving edge */
    var leftPct = 4 + (rollProgress / 100) * 68;
    steamrollerWrap.style.left = leftPct.toFixed(1) + "%";
    steamrollerWrap.classList.add("rolling");

    rollerPurrSfx(rollProgress);

    var rr = roadTrack.getBoundingClientRect();
    if(rr.width && (!fromRub || Math.random() < 0.38)){
      spawnSparkles(rr.left + rr.width * (rollProgress / 100), rr.top + rr.height * 0.42, fromRub ? 3 : 7);
    }

    if(rollProgress >= 100){
      completeRoadRolling(false);
    } else {
      later(function(){
        if(!isRollingDrag) steamrollerWrap.classList.remove("rolling");
      }, 260);
    }
  }

  function completeRoadRolling(instant){
    if(rollerSubStep === "done") return;
    rollerSubStep = "done";
    isRollingDrag = false;
    rollProgress = 100;
    roadSmoothOverlay.style.width = "100%";
    roadSmoothOverlay.classList.add("complete");
    rollMeterFill.style.width = "100%";
    steamrollerWrap.style.left = "74%";
    steamrollerWrap.classList.remove("rolling");
    phaseDone.roller = true;
    hideIdleHints();
    updateHud(false);

    if(instant) return;

    dirtDropSfx(4);
    hootCheer();
    var rr = roadTrack.getBoundingClientRect();
    spawnSparkles(rr.left + rr.width * 0.5, rr.top + rr.height * 0.4, 18);
    playConGuide("hoot-con-smooth", "hoot-amazing", false);

    later(function(){
      if(phase === "roller") enterPhase("crane", false);
    }, 1550);
  }

  /* Phase 2 Event Listeners (Dump Truck Tap + Tip Button + Road Rub/Tap + Roll Button) */
  p2DumpBtn.addEventListener("click", function(){
    unlockAudioOnce();
    triggerDumpRocks(false);
  });
  tipBtn.addEventListener("click", function(){
    unlockAudioOnce();
    triggerDumpRocks(false);
  });

  rollTapBtn.addEventListener("click", function(){
    if(dead || phase !== "roller" || rollerSubStep !== "roll") return;
    unlockAudioOnce();
    hasInteracted = true;
    idleVoiceReminded = false;
    hideIdleHints();
    var step = IS_RILEY ? 34 : 26;
    applyRollProgress(rollProgress + step, false);
    if(rollProgress < 100) armIdle(false);
  });

  roadZone.addEventListener("pointerdown", function(e){
    if(dead || phase !== "roller") return;
    e.preventDefault();
    unlockAudioOnce();
    hasInteracted = true;
    idleVoiceReminded = false;
    hideIdleHints();

    /* Extra forgiving: tapping road during dump step also tips the dump truck! */
    if(rollerSubStep === "dump"){
      triggerDumpRocks(false);
      return;
    }
    if(rollerSubStep !== "roll") return;

    isRollingDrag = true;
    lastRollX = e.clientX;
    try{ roadZone.setPointerCapture(e.pointerId); }catch(err){}

    /* Single tap advances smoothly (extra forgiving for Riley!) */
    var tapBoost = IS_RILEY ? 34 : 25;
    var rr = roadTrack.getBoundingClientRect();
    var pointerPct = Math.max(0, Math.min(100, ((e.clientX - rr.left) / rr.width) * 100));
    var targetPct = Math.max(rollProgress + tapBoost, pointerPct);
    applyRollProgress(targetPct, false);
  });

  roadZone.addEventListener("pointermove", function(e){
    if(dead || !isRollingDrag || phase !== "roller" || rollerSubStep !== "roll") return;
    e.preventDefault();
    var dx = Math.abs(e.clientX - lastRollX);
    lastRollX = e.clientX;
    if(dx < 2) return;
    var rr = roadTrack.getBoundingClientRect();
    var mult = IS_RILEY ? 1.48 : 1.18;
    var deltaPct = (dx / Math.max(180, rr.width)) * 100 * mult;
    var pointerPct = Math.max(0, Math.min(100, ((e.clientX - rr.left) / rr.width) * 100));
    applyRollProgress(Math.max(rollProgress + deltaPct, pointerPct), true);
  });

  function stopRoadRoll(e){
    if(!isRollingDrag) return;
    isRollingDrag = false;
    steamrollerWrap.classList.remove("rolling");
    try{ if(e && e.pointerId != null) roadZone.releasePointerCapture(e.pointerId); }catch(err){}
    if(phase === "roller" && rollerSubStep === "roll") armIdle(false);
  }
  roadZone.addEventListener("pointerup", stopRoadRoll);
  roadZone.addEventListener("pointercancel", stopRoadRoll);

  /* ============================================================================
     PHASE 3: CRANE RAINBOW BRIDGE BUILDER (TAP OR DRAG!)
     ============================================================================ */
  function getBridgeSlotBox(idx){
    /* Span cleanly between left abutment (x=150) and right abutment (x=690) */
    var spanStart = 152;
    var spanWidth = 536;
    var gap = 10;
    var w = (spanWidth - gap * (BLOCK_COUNT - 1)) / BLOCK_COUNT;
    var x = spanStart + idx * (w + gap);
    /* Gentle Pixar rainbow bridge arch curve */
    var norm = (idx + 0.5) / BLOCK_COUNT - 0.5; /* -0.5 .. +0.5 */
    var archLift = Math.round((1 - norm * norm * 4) * 28);
    var y = 266 - archLift;
    return { x: Math.round(x), y: y, w: Math.round(w), h: 78, cx: Math.round(x + w * 0.5) };
  }

  function renderBridgeSlots(){
    var html = "";
    ACTIVE_BLOCKS.forEach(function(blk, idx){
      var box = getBridgeSlotBox(idx);
      var placed = !!blocksPlacedMap[blk.id];
      html += '<g class="bridge-slot' + (placed ? ' placed' : '') + '" data-slot-id="' + blk.id + '" data-slot-idx="' + idx + '">'
        + '<svg class="slot-ghost" x="' + box.x + '" y="' + box.y + '" width="' + box.w + '" height="' + box.h + '" viewBox="0 0 104 80">'
        + '<rect x="6" y="8" width="92" height="64" rx="14" fill="rgba(255,253,245,.42)" stroke="' + blk.fill + '" stroke-width="5" stroke-dasharray="10 7" filter="url(#bridgeGlowF)"/>'
        + '<text x="52" y="49" text-anchor="middle" font-family="Fredoka,Nunito,sans-serif" font-size="28" font-weight="900" fill="' + blk.stroke + '" opacity=".85">' + blk.num + '</text>'
        + '</svg>'
        + '<svg class="slot-solid" x="' + box.x + '" y="' + box.y + '" width="' + box.w + '" height="' + box.h + '" viewBox="0 0 104 80">'
        + bridgeBlockInnerSvg(blk)
        + '</svg>'
        + '</g>';
    });
    bridgeSlotsLayer.innerHTML = html;
    updateSuggestedBridgeSlot();
  }

  function updateSuggestedBridgeSlot(){
    var slots = bridgeSlotsLayer.querySelectorAll(".bridge-slot");
    var picked = false;
    for(var i = 0; i < slots.length; i++){
      var id = slots[i].getAttribute("data-slot-id");
      var isPlaced = !!blocksPlacedMap[id];
      slots[i].classList.toggle("placed", isPlaced);
      slots[i].classList.remove("suggest", "hover-hot");
      if(!isPlaced && !picked){
        slots[i].classList.add("suggest");
        picked = true;
      }
    }
  }

  function buildPhase3Dock(){
    dockCrane.innerHTML = "";
    ACTIVE_BLOCKS.forEach(function(blk, idx){
      var tile = document.createElement("button");
      tile.type = "button";
      tile.className = "block-tile";
      tile.dataset.blockId = blk.id;
      tile.dataset.blockIdx = String(idx);
      tile.setAttribute("aria-label", "Bridge block " + blk.num);
      tile.style.setProperty("--blk-bg", blk.bg);
      tile.style.setProperty("--blk-shadow", blk.shadow);
      tile.innerHTML = '<span class="tile-hand" aria-hidden="true">👆</span>'
        + bridgeBlockSvg(blk)
        + '<span class="tile-check" aria-hidden="true">✓</span>';

      /* Pointer Tap OR Magnetic Drag! */
      tile.addEventListener("pointerdown", function(e){
        if(dead || phase !== "crane" || craneBusy || blocksPlacedMap[blk.id]) return;
        e.preventDefault();
        unlockAudioOnce();
        hasInteracted = true;
        idleVoiceReminded = false;
        hideIdleHints();
        blockDragState = {
          blk: blk,
          idx: idx,
          tile: tile,
          pointerId: e.pointerId,
          startX: e.clientX,
          startY: e.clientY,
          moved: false
        };
        try{ tile.setPointerCapture(e.pointerId); }catch(err){}
      });

      tile.addEventListener("pointermove", function(e){
        if(!blockDragState || blockDragState.tile !== tile) return;
        var dist = Math.hypot(e.clientX - blockDragState.startX, e.clientY - blockDragState.startY);
        if(!blockDragState.moved && dist > 10){
          blockDragState.moved = true;
          dragGhost.innerHTML = bridgeBlockSvg(blk);
          dragGhost.hidden = false;
          clickPopSfx(620);
        }
        if(blockDragState.moved){
          dragGhost.style.left = e.clientX + "px";
          dragGhost.style.top = e.clientY + "px";
          var dockTop = dockCrane.getBoundingClientRect().top;
          var near = e.clientY < dockTop + 20;
          var slotEl = bridgeSlotsLayer.querySelector('[data-slot-id="' + blk.id + '"]');
          if(slotEl) slotEl.classList.toggle("hover-hot", near);
        }
      });

      function finishBlockDrag(e){
        if(!blockDragState || blockDragState.tile !== tile) return;
        var ds = blockDragState;
        blockDragState = null;
        dragGhost.hidden = true;
        try{ tile.releasePointerCapture(ds.pointerId); }catch(err){}
        var slotEl = bridgeSlotsLayer.querySelector('[data-slot-id="' + ds.blk.id + '"]');
        if(slotEl) slotEl.classList.remove("hover-hot");

        if(!ds.moved){
          snapBridgeBlock(ds.blk, ds.idx, false);
        } else {
          var dockTop = dockCrane.getBoundingClientRect().top;
          if(e.clientY < dockTop + 24){
            snapBridgeBlock(ds.blk, ds.idx, false);
          } else {
            armIdle(false);
          }
        }
      }

      tile.addEventListener("pointerup", finishBlockDrag);
      tile.addEventListener("pointercancel", function(){
        if(!blockDragState || blockDragState.tile !== tile) return;
        blockDragState = null;
        dragGhost.hidden = true;
        armIdle(false);
      });

      /* Keyboard / automated click support */
      tile.addEventListener("click", function(){
        if(dead || phase !== "crane" || craneBusy || blocksPlacedMap[blk.id]) return;
        unlockAudioOnce();
        snapBridgeBlock(blk, idx, false);
      });

      dockCrane.appendChild(tile);
    });
  }

  /* Tapping directly on any glowing silhouette slot on the bridge also lifts & snaps its matching block! */
  craneSceneSvg.addEventListener("click", function(e){
    if(dead || phase !== "crane" || craneBusy) return;
    var g = e.target && e.target.closest ? e.target.closest(".bridge-slot") : null;
    if(!g) return;
    var id = g.getAttribute("data-slot-id");
    var idx = Number(g.getAttribute("data-slot-idx"));
    if(id && !blocksPlacedMap[id] && ACTIVE_BLOCKS[idx]){
      unlockAudioOnce();
      snapBridgeBlock(ACTIVE_BLOCKS[idx], idx, false);
    }
  });

  function setCranePosition(x, cableY){
    craneTrolleyGroup.setAttribute("transform", "translate(" + x + ", 0)");
    craneCableLine.setAttribute("y2", String(cableY));
    craneHookGroup.setAttribute("transform", "translate(0, " + cableY + ")");
  }

  function snapBridgeBlock(blk, idx, instant){
    if(dead || phase !== "crane" || blocksPlacedMap[blk.id]) return;
    if(!instant && craneBusy) return;

    hasInteracted = true;
    idleVoiceReminded = false;
    hideIdleHints();
    blocksPlacedMap[blk.id] = true;
    blocksPlaced++;

    var tile = dockCrane.querySelector('[data-block-id="' + blk.id + '"]');
    if(tile) tile.classList.add("placed");

    var box = getBridgeSlotBox(idx);

    if(instant){
      updateSuggestedBridgeSlot();
      return;
    }

    craneBusy = true;
    clickPopSfx(540 + idx * 80);

    /* Step 1: Crane trolley glides over target slot carrying the bright block */
    hookCarriedBlock.innerHTML = bridgeBlockInnerSvg(blk);
    setCranePosition(box.cx, 128);

    later(function(){
      /* Step 2: Lower crane cable down into the bridge slot */
      setCranePosition(box.cx, box.y - 24);
    }, 320);

    later(function(){
      /* Step 3: Release & magnetically snap block into bridge! */
      hookCarriedBlock.innerHTML = "";
      updateSuggestedBridgeSlot();
      blockSnapSfx(blocksPlaced);
      hootCheer();

      var slotEl = bridgeSlotsLayer.querySelector('[data-slot-id="' + blk.id + '"]');
      var sr = slotEl ? slotEl.getBoundingClientRect() : craneSceneSvg.getBoundingClientRect();
      if(sr.width){
        spawnSparkles(sr.left + sr.width * 0.5, sr.top + sr.height * 0.5, 14);
      }

      if(blocksPlaced < BLOCK_COUNT){
        if(blocksPlaced % 2 === 1){
          enqueueVoice("name-number-" + blocksPlaced + ".mp3", true);
        } else {
          playConGuide("hoot-con-snap", "hoot-super", false);
        }
      }

      /* Retract hook cleanly */
      setCranePosition(box.cx, 128);
    }, 640);

    later(function(){
      craneBusy = false;
      if(blocksPlaced >= BLOCK_COUNT){
        enterFinale(false);
      } else {
        armIdle(false);
      }
    }, 920);
  }

  /* ============================================================================
     GRAND FINALE CELEBRATION: CONFETTI, PARADE & HONKING!
     ============================================================================ */
  function enterFinale(instant){
    phase = "finale";
    phaseDone.crane = true;
    stars++;
    completedRuns++;

    stage.setAttribute("data-phase", "finale");
    phaseExcavator.hidden = true;
    phaseRoller.hidden = true;
    phaseCrane.hidden = false;

    dockExcavator.hidden = true;
    dockRoller.hidden = true;
    dockCrane.hidden = true;
    dockFinale.hidden = false;

    paradeLayer.hidden = false;
    setCranePosition(200, 114);
    hookCarriedBlock.innerHTML = "";
    hideIdleHints();
    updateHud(true);

    if(instant) return;

    finaleFanfareSfx();
    showerConfetti(64);
    hootCheer();
    var sr = phaseCrane.getBoundingClientRect();
    if(sr.width) spawnSparkles(sr.left + sr.width * 0.5, sr.top + sr.height * 0.45, 20);

    later(function(){
      if(phase === "finale") truckHonkSfx();
    }, 480);

    later(function(){
      if(phase === "finale") playConGuide("hoot-con-win", "hoot-win-yay", false);
    }, 980);
  }

  function triggerHonk(vehicleBtn){
    if(dead) return;
    unlockAudioOnce();
    honkCount++;
    truckHonkSfx();
    hootCheer();

    honkBurst.classList.remove("show");
    void honkBurst.offsetWidth;
    honkBurst.classList.add("show");

    var targets = vehicleBtn ? [vehicleBtn] : Array.prototype.slice.call(paradeLayer.querySelectorAll(".parade-vehicle"));
    targets.forEach(function(v){
      v.classList.remove("honk-jump");
      void v.offsetWidth;
      v.classList.add("honk-jump");
    });

    var r = (vehicleBtn || honkBtn).getBoundingClientRect();
    if(r.width) spawnSparkles(r.left + r.width * 0.5, r.top + r.height * 0.35, 12);

    playConGuide("hoot-con-honk", "hoot-yay-2", false);
  }

  /* ============================================================================
     PHASE TRANSITIONS & FULL REPLAY
     ============================================================================ */
  function enterPhase(targetPhase, isBoot){
    clearTimers();
    if(!isBoot) clearVoice(true);
    excavatorBusy = false;
    craneBusy = false;
    isRollingDrag = false;
    blockDragState = null;
    bucketDragState = null;
    dragGhost.hidden = true;
    idleVoiceReminded = false;
    hideIdleHints();

    phase = targetPhase;
    stage.setAttribute("data-phase", targetPhase);

    phaseExcavator.hidden = targetPhase !== "excavator";
    phaseRoller.hidden = targetPhase !== "roller";
    phaseCrane.hidden = (targetPhase !== "crane" && targetPhase !== "finale");

    dockExcavator.hidden = targetPhase !== "excavator";
    dockRoller.hidden = targetPhase !== "roller";
    dockCrane.hidden = targetPhase !== "crane";
    dockFinale.hidden = targetPhase !== "finale";

    paradeLayer.hidden = targetPhase !== "finale";

    if(targetPhase === "excavator"){
      moundsScoopedMap = {};
      moundsScooped = 0;
      buildPhase1();
    } else if(targetPhase === "roller"){
      setupPhase2();
    } else if(targetPhase === "crane"){
      blocksPlacedMap = {};
      blocksPlaced = 0;
      hookCarriedBlock.innerHTML = "";
      setCranePosition(420, 148);
      renderBridgeSlots();
      buildPhase3Dock();
    }

    updateHud(false);
    speakCurrentPhaseGuide(!!isBoot);
    armIdle(true);
  }

  function startFreshBuild(isBoot){
    phaseDone = { excavator: false, roller: false, crane: false };
    rollerSubStep = "dump";
    rollProgress = 0;
    blocksPlacedMap = {};
    blocksPlaced = 0;
    hasInteracted = false;
    enterPhase("excavator", !!isBoot);
  }

  /* ================= GLOBAL BUTTON & POINTER WIRING ================= */
  phasePills.forEach(function(btn){
    btn.addEventListener("click", function(){
      var target = btn.dataset.phaseBtn;
      if(!target) return;
      unlockAudioOnce();
      clickPopSfx(740);
      enterPhase(target, false);
    });
  });

  honkBtn.addEventListener("click", function(){
    triggerHonk(null);
  });
  paradeLayer.querySelectorAll(".parade-vehicle").forEach(function(v){
    v.addEventListener("click", function(){
      triggerHonk(v);
    });
  });

  againBtn.addEventListener("click", function(){
    unlockAudioOnce();
    clickPopSfx(860);
    startFreshBuild(false);
  });

  soundBtn.addEventListener("click", function(){
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    soundBtn.setAttribute("aria-label", soundOn ? "Turn Sound Off" : "Turn Sound On");
    if(!soundOn){
      clearVoice(true);
    } else {
      unlockAudioOnce();
      clickPopSfx(880);
      speakCurrentPhaseGuide(false);
    }
  });

  /* Direct tap on Construction Hoot -> cheers + repeats current step's spoken guidance! */
  hootBtn.addEventListener("click", function(){
    unlockAudioOnce();
    hootCheer();
    clickPopSfx(960);
    window.__bellyArmed = true;
    setTimeout(function(){ window.__bellyArmed = false; }, 500);
    speakCurrentPhaseGuide(false);
  });

  /* Smooth eye-tracking on Construction Hoot */
  function trackEyes(x, y){
    var r = hootBtn.getBoundingClientRect();
    if(!r.width) return;
    var dx = Math.max(-4.5, Math.min(4.5, (x - (r.left + r.width * 0.5)) / 48));
    var dy = Math.max(-3.5, Math.min(4.5, (y - (r.top + r.height * 0.44)) / 48));
    hootPupils.setAttribute("transform", "translate(" + dx.toFixed(1) + "," + dy.toFixed(1) + ")");
  }
  stage.addEventListener("pointermove", function(e){ trackEyes(e.clientX, e.clientY); });
  stage.addEventListener("pointerdown", function(e){ trackEyes(e.clientX, e.clientY); });

  /* Clean Teardown */
  function teardown(){
    dead = true;
    clearTimers();
    if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    if(idleVoiceTimer){ clearTimeout(idleVoiceTimer); idleVoiceTimer = null; }
    clearVoice(true);
  }
  window.addEventListener("pagehide", teardown);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) clearVoice(false);
  });

  /* ================= BOOT & PUBLIC AUTOMATED QA HOOK ================= */
  startFreshBuild(true);

  function snapshot(){
    return {
      phase: phase,
      subStep: rollerSubStep,
      isRiley: IS_RILEY,
      moundsTotal: MOUND_COUNT,
      moundsScooped: moundsScooped,
      rollProgress: Math.round(rollProgress),
      blocksTotal: BLOCK_COUNT,
      blocksPlaced: blocksPlaced,
      stars: stars,
      completedRuns: completedRuns,
      honkCount: honkCount
    };
  }

  function finishPhaseForTest(){
    clearTimers();
    if(phase === "excavator"){
      for(var i = 0; i < MOUND_COUNT; i++){
        if(!moundsScoopedMap[i]) scoopMound(i, true);
      }
      phaseDone.excavator = true;
      enterPhase("roller", false);
    } else if(phase === "roller"){
      if(rollerSubStep === "dump") triggerDumpRocks(true);
      completeRoadRolling(true);
      enterPhase("crane", false);
    } else if(phase === "crane"){
      ACTIVE_BLOCKS.forEach(function(blk, idx){
        if(!blocksPlacedMap[blk.id]) snapBridgeBlock(blk, idx, true);
      });
      enterFinale(true);
    }
    return snapshot();
  }

  window.__constructionGame = {
    snapshot: snapshot,
    finishPhaseForTest: finishPhaseForTest
  };
})();
</script>
