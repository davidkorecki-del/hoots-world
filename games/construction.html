<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>
window.__HOOT_GAME_KEY__="construction";
window.__HOOT_SELF_COACH__=true;
</script>
<script src="js/hoot-game-head.js?v=llprev3e159"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Hoot's Construction Yard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --sky-top:#38bdf8;
    --sky-mid:#8be0ff;
    --sky-warm:#ffebb3;
    --earth-hi:#e8b36b;
    --earth-mid:#c98a42;
    --earth-deep:#8c5420;
    --cat-hi:#ffe047;
    --cat-mid:#f5b700;
    --cat-deep:#c47f00;
    --steel-hi:#64748b;
    --steel-deep:#334155;
    --asphalt-hi:#525b68;
    --asphalt-deep:#2d3440;
    --cream:#fffdf6;
    --gold:#ffd84d;
    --gold-deep:#c27803;
    --ink:#3b2310;
    --red:#ef4444;
    --orange:#f97316;
    --green:#22c55e;
    --blue:#3b82f6;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{
    height:100%;
    width:100%;
    margin:0;
    padding:0;
    overflow:hidden;
  }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#47b8ff;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ================= FULLSCREEN PIXAR CONSTRUCTION YARD STAGE ================= */
  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:linear-gradient(180deg, #38bdf8 0%, #8be0ff 36%, #ffe6a8 68%, #d99b52 100%);
  }

  .backdrop{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
  }
  #yardBg{
    background-image:
      url("assets/construction3d/bg_yard.jpg"),
      linear-gradient(180deg, #38bdf8 0%, #8be0ff 36%, #ffe6a8 68%, #d99b52 100%);
  }
  #yardBg::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at 50% 42%, rgba(255,250,230,.06) 34%, rgba(68,36,8,.24) 100%);
  }

  #skyAmbient{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
    overflow:hidden;
  }
  #skyAmbient svg{
    width:100%;
    height:100%;
    display:block;
    opacity:.42;
  }
  .cloud-float{ animation:cloudDrift 34s linear infinite; }
  .cloud-float-slow{ animation:cloudDrift 48s linear infinite reverse; }
  @keyframes cloudDrift{
    0%{ transform:translateX(-24px); }
    50%{ transform:translateX(32px); }
    100%{ transform:translateX(-24px); }
  }
  .sun-rays{
    transform-origin:1090px 92px;
    animation:sunSpin 36s linear infinite;
  }
  @keyframes sunSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  /* ================= TOP HUD (3 BIG PHASE PILLS + STARS + SOUND) ================= */
  #hud{
    position:relative;
    z-index:20;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 4px max(12px, env(safe-area-inset-left));
    pointer-events:none;
  }
  #phaseBar{
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:auto;
  }
  .phase-pill{
    position:relative;
    width:70px;
    height:70px;
    min-width:68px;
    min-height:68px;
    padding:5px;
    border-radius:22px;
    border:4px solid #fffdf5;
    background:var(--pill-bg, linear-gradient(180deg, #ffe047 0%, #f59e0b 100%));
    box-shadow:0 5px 0 var(--pill-shadow, #b45309), 0 8px 18px rgba(59,35,16,.24);
    display:grid;
    place-items:center;
    cursor:pointer;
    outline:none;
    transition:transform .16s cubic-bezier(.34,1.65,.5,1), box-shadow .16s, filter .16s;
  }
  .phase-pill svg{
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));
  }
  .phase-pill:active{ transform:translateY(3px) scale(.93); }
  .phase-pill.active{
    transform:translateY(-3px) scale(1.07);
    border-color:#ffd84d;
    box-shadow:0 6px 0 var(--pill-shadow, #b45309), 0 0 0 4px rgba(255,216,77,.7), 0 10px 22px rgba(59,35,16,.28);
  }
  .phase-pill .done-badge{
    position:absolute;
    top:-6px;
    right:-6px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    border:2.5px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,.28);
    display:grid;
    place-items:center;
    color:#fff;
    font-size:15px;
    font-weight:900;
    line-height:1;
    opacity:0;
    transform:scale(.3);
    transition:opacity .28s, transform .38s cubic-bezier(.34,1.9,.5,1);
    pointer-events:none;
  }
  .phase-pill.done .done-badge{
    opacity:1;
    transform:scale(1);
  }

  .hud-right{
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:auto;
  }
  #starPill{
    min-width:76px;
    min-height:68px;
    height:70px;
    padding:0 16px 0 12px;
    border-radius:999px;
    border:4px solid #fffdf5;
    background:linear-gradient(180deg, #fff6d6 0%, #ffe299 100%);
    box-shadow:0 5px 0 #c27803, 0 8px 18px rgba(59,35,16,.22);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:var(--ink);
  }
  #starPill.bump{ animation:starBump .48s cubic-bezier(.34,1.85,.5,1); }
  @keyframes starBump{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.2) rotate(-5deg); }
    100%{ transform:scale(1); }
  }
  .star-glyph{
    font-size:30px;
    line-height:1;
    filter:drop-shadow(0 2px 0 rgba(255,255,255,.85));
  }
  #starNum{
    font-size:28px;
    font-weight:700;
    line-height:1;
    min-width:20px;
    text-align:center;
  }

  #soundBtn{
    width:70px;
    height:70px;
    min-width:68px;
    min-height:68px;
    border-radius:50%;
    border:4px solid #fffdf5;
    background:linear-gradient(180deg, #ff9f43 0%, #e66b17 100%);
    box-shadow:0 5px 0 #9f4308, 0 8px 18px rgba(59,35,16,.24);
    color:#fff;
    font-size:28px;
    line-height:1;
    display:grid;
    place-items:center;
    cursor:pointer;
    outline:none;
    transition:transform .14s cubic-bezier(.34,1.6,.5,1);
  }
  #soundBtn:active{ transform:translateY(3px) scale(.93); }

  /* ================= MAIN ARENA ================= */
  #arena{
    position:relative;
    z-index:10;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:1180px;
    margin:0 auto;
    padding:4px clamp(10px, 2vw, 24px) 6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(10px, 2vw, 24px);
  }

  /* Construction Hard-Hat Hoot Buddy */
  #hootWrap{
    position:relative;
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    align-self:flex-end;
    padding-bottom:6px;
    z-index:14;
  }
  #hootBtn{
    width:clamp(124px, 15.5vw, 178px);
    height:clamp(136px, 17vw, 196px);
    min-width:72px;
    min-height:72px;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    outline:none;
    position:relative;
    filter:drop-shadow(0 10px 14px rgba(59,35,16,.3));
    transition:transform .2s cubic-bezier(.34,1.65,.5,1);
    animation:hootIdle 3.2s ease-in-out infinite;
  }
  #hootBtn svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }
  #hootBtn.cheer{
    animation:hootCheer .62s cubic-bezier(.34,1.85,.5,1) 2 !important;
  }
  @keyframes hootIdle{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-5px) rotate(-1.6deg); }
  }
  @keyframes hootCheer{
    0%,100%{ transform:translateY(0) scale(1) rotate(0deg); }
    42%{ transform:translateY(-22px) scale(1.1) rotate(-6deg); }
    74%{ transform:translateY(-5px) scale(1.03) rotate(5deg); }
  }

  /* Play Stage Card */
  #playStage{
    position:relative;
    flex:1 1 auto;
    min-width:0;
    height:100%;
    max-width:860px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .scene-card{
    position:relative;
    width:100%;
    height:100%;
    max-height:560px;
    border-radius:30px;
    overflow:hidden;
    border:5px solid #ffd84d;
    background:rgba(255, 250, 236, 0.24);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    box-shadow:
      0 10px 0 #a16207,
      0 20px 36px rgba(59,35,16,.34),
      inset 0 3px 0 rgba(255,255,255,.72);
    display:flex;
    flex-direction:column;
  }
  /* Subtle safety hazard stripe trim along top inner rim */
  .scene-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:10px;
    z-index:20;
    pointer-events:none;
    background:repeating-linear-gradient(
      -45deg,
      #ffd84d 0 14px,
      #334155 14px 28px
    );
    opacity:.88;
  }

  /* ================= PHASE 1: YELLOW EXCAVATOR SCOOP ================= */
  #phaseExcavator{
    background:linear-gradient(180deg, rgba(139,224,255,.46) 0%, rgba(255,235,180,.42) 48%, rgba(212,155,84,.88) 54%, rgba(164,104,44,.95) 100%);
  }
  #excavatorWorld{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    height:100%;
    touch-action:none;
  }
  #exSceneSvg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
    z-index:3;
  }
  /* Articulated excavator joints */
  #exBoomGroup{
    transform-origin:226px 268px;
    transition:transform .38s cubic-bezier(.34,1.35,.5,1);
  }
  #exArmGroup{
    transform-origin:350px 158px;
    transition:transform .36s cubic-bezier(.34,1.35,.5,1);
  }
  #exBucketGroup{
    transform-origin:424px 236px;
    transition:transform .28s cubic-bezier(.34,1.4,.5,1);
  }
  #exExhaustPuff{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
  }
  #exExhaustPuff.puff{
    animation:smokePuff .65s ease-out forwards;
  }
  @keyframes smokePuff{
    0%{ opacity:.92; transform:translate(0,0) scale(.5); }
    100%{ opacity:0; transform:translate(-18px,-36px) scale(1.7); }
  }
  #p1TruckGroup{
    transform-origin:680px 318px;
  }
  #p1TruckGroup.bounce{
    animation:truckBounce .46s cubic-bezier(.34,1.7,.5,1);
  }
  @keyframes truckBounce{
    0%,100%{ transform:translateY(0) scale(1,1); }
    35%{ transform:translateY(6px) scale(1.03,.95); }
    70%{ transform:translateY(-5px) scale(.99,1.03); }
  }

  /* Draggable bucket handle overlay so dragging OR tapping works naturally */
  #exDragHandle{
    position:absolute;
    left:47%;
    top:47%;
    width:82px;
    height:82px;
    margin:-41px 0 0 -41px;
    border-radius:50%;
    border:4px dashed rgba(255,232,120,.85);
    background:radial-gradient(circle, rgba(255,216,77,.28) 0%, rgba(255,216,77,0) 70%);
    z-index:8;
    cursor:grab;
    touch-action:none;
    display:grid;
    place-items:center;
    font-size:28px;
    transition:opacity .25s ease, transform .2s ease;
    animation:handlePulse 2s ease-in-out infinite;
  }
  #exDragHandle:active{ cursor:grabbing; transform:scale(1.1); }
  #exDragHandle.busy{ opacity:0; pointer-events:none; }
  @keyframes handlePulse{
    0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(255,216,77,.5); }
    50%{ transform:scale(1.07); box-shadow:0 0 0 12px rgba(255,216,77,0); }
  }

  /* Interactive glowing dirt & boulder mounds (>=76px touch target!) */
  #moundsRow{
    position:absolute;
    left:0;
    right:0;
    bottom:4%;
    z-index:10;
    display:flex;
    align-items:flex-end;
    justify-content:space-evenly;
    padding:0 12px;
    gap:8px;
    pointer-events:none;
  }
  .dirt-mound{
    position:relative;
    pointer-events:auto;
    width:clamp(80px, 16vw, 128px);
    height:clamp(76px, 13vw, 108px);
    min-width:74px;
    min-height:72px;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    outline:none;
    touch-action:none;
    transition:transform .24s cubic-bezier(.34,1.7,.5,1), opacity .35s ease;
  }
  .dirt-mound svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
    filter:drop-shadow(0 6px 8px rgba(59,35,16,.34));
  }
  .dirt-mound:not(.scooped){
    animation:moundGlow 1.7s ease-in-out infinite alternate;
  }
  .dirt-mound:not(.scooped):active{
    transform:scale(.9);
  }
  .dirt-mound.hot{
    transform:scale(1.14);
    filter:drop-shadow(0 0 18px #ffd84d);
  }
  .dirt-mound.scooped{
    opacity:.22;
    transform:scale(.72) translateY(14px);
    pointer-events:none;
    animation:none;
  }
  @keyframes moundGlow{
    from{ filter:drop-shadow(0 0 6px rgba(255,216,77,.48)); }
    to{ filter:drop-shadow(0 0 18px rgba(255,216,77,.98)); }
  }
  .mound-num{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:30px;
    height:30px;
    border-radius:50%;
    background:linear-gradient(180deg, #fff9d6 0%, #ffd84d 100%);
    border:2.5px solid #fff;
    box-shadow:0 3px 0 #b45309;
    display:grid;
    place-items:center;
    font-size:17px;
    font-weight:900;
    color:#5c2d06;
    pointer-events:none;
  }
  .dirt-mound.scooped .mound-num{ display:none; }
  .mound-hand{
    position:absolute;
    top:-24px;
    left:50%;
    transform:translateX(-50%);
    font-size:34px;
    line-height:1;
    pointer-events:none;
    display:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.38));
    animation:handBounce .85s ease-in-out infinite;
  }
  .dirt-mound.show-hand .mound-hand{ display:block; }

  @keyframes handBounce{
    0%,100%{ transform:translate(-50%, 0); }
    50%{ transform:translate(-50%, -10px); }
  }

  /* ================= PHASE 2: DUMP & STEAMROLL ROAD ================= */
  #phaseRoller{
    background:linear-gradient(180deg, rgba(139,224,255,.46) 0%, rgba(254,240,192,.44) 48%, rgba(163,216,108,.85) 54%, rgba(114,173,68,.94) 100%);
  }
  #rollerWorld{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:18px 0 0;
  }
  #rollerUpper{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
  }

  /* Interactive Dump Truck in Phase 2A */
  #p2DumpBtn{
    position:absolute;
    right:7%;
    bottom:-18px;
    width:clamp(190px, 34vw, 290px);
    height:clamp(145px, 26vw, 220px);
    min-width:120px;
    min-height:110px;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    outline:none;
    z-index:8;
    transition:transform .55s cubic-bezier(.34,1.3,.5,1), opacity .45s ease;
    filter:drop-shadow(0 10px 14px rgba(59,35,16,.3));
  }
  #p2DumpBtn svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }
  #p2DumpBtn.glow-cue{
    animation:truckPulse 1.35s ease-in-out infinite;
  }
  @keyframes truckPulse{
    0%,100%{ transform:scale(1); filter:drop-shadow(0 0 8px rgba(255,216,77,.6)); }
    50%{ transform:scale(1.05); filter:drop-shadow(0 0 22px rgba(255,216,77,1)); }
  }
  #p2DumpBed{
    transform-origin:116px 142px;
    transition:transform .55s cubic-bezier(.28,1.32,.46,1);
  }
  #p2DumpBtn.tipping #p2DumpBed{
    transform:rotate(-44deg);
  }
  #p2DumpBtn.parked{
    transform:translateX(120%) scale(.88);
    opacity:0;
    pointer-events:none;
  }
  #dumpHand{
    position:absolute;
    top:-8px;
    left:46%;
    font-size:40px;
    line-height:1;
    pointer-events:none;
    display:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));
    animation:handBounce .85s ease-in-out infinite;
  }
  #p2DumpBtn.show-hand #dumpHand{ display:block; }

  /* Interactive Road Strip (Rub OR Tap anywhere!) */
  #roadZone{
    position:relative;
    flex:0 0 auto;
    width:100%;
    height:clamp(146px, 34%, 198px);
    background:linear-gradient(180deg, #b88b58 0%, #8c5f32 100%);
    border-top:5px solid #e2b878;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px 14px 16px;
    touch-action:none;
    cursor:pointer;
  }
  #roadTrack{
    position:relative;
    width:100%;
    height:100%;
    min-height:112px;
    border-radius:26px;
    overflow:hidden;
    border:4px solid #fff6d6;
    background:linear-gradient(180deg, #8b5a2b 0%, #6d421c 100%);
    box-shadow:inset 0 8px 18px rgba(34,18,6,.55), 0 6px 14px rgba(59,35,16,.28);
    touch-action:none;
  }
  /* Bumpy pothole & poured rocks underlay */
  #roadBumpyLayer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
    z-index:2;
  }
  #roadRocksGroup{
    opacity:0;
    transform:translateY(-24px);
    transition:opacity .45s ease, transform .5s cubic-bezier(.34,1.4,.5,1);
  }
  #roadTrack.rocks-poured #roadRocksGroup{
    opacity:1;
    transform:translateY(0);
  }

  /* Smooth rolled dark asphalt overlay (expands width 0% -> 100%!) */
  #roadSmoothOverlay{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:0%;
    z-index:4;
    overflow:hidden;
    background:linear-gradient(180deg, #4b5563 0%, #374151 45%, #1f2937 100%);
    border-right:5px solid #ffd84d;
    box-shadow:inset 0 4px 10px rgba(255,255,255,.16);
    transition:width .16s ease-out;
  }
  #roadSmoothOverlay::after{
    content:"";
    position:absolute;
    left:14px;
    right:14px;
    top:50%;
    height:10px;
    margin-top:-5px;
    background:repeating-linear-gradient(90deg, #ffd84d 0 36px, transparent 36px 64px);
    border-radius:5px;
    opacity:.95;
  }
  #roadSmoothOverlay.complete{
    border-right-color:transparent;
    box-shadow:inset 0 0 28px rgba(255,216,77,.55);
  }

  /* Yellow Pixar Steamroller riding across the road */
  #steamrollerWrap{
    position:absolute;
    left:4%;
    bottom:26%;
    width:clamp(146px, 24vw, 206px);
    height:clamp(112px, 18.5vw, 158px);
    z-index:11;
    pointer-events:none;
    transform:translateX(-140%);
    opacity:0;
    transition:left .16s ease-out, transform .5s cubic-bezier(.34,1.4,.5,1), opacity .35s ease;
    filter:drop-shadow(0 8px 12px rgba(34,20,6,.36));
  }
  #steamrollerWrap.ready{
    transform:translateX(-18%);
    opacity:1;
  }
  #steamrollerWrap.rolling{
    animation:rollerRumble .22s ease-in-out infinite alternate;
  }
  @keyframes rollerRumble{
    from{ margin-bottom:0px; }
    to{ margin-bottom:4px; }
  }
  #steamrollerWrap svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }
  #rollerDrum{
    transform-box:fill-box;
    transform-origin:center;
  }
  #steamrollerWrap.rolling #rollerDrum{
    animation:drumSpin .42s linear infinite;
  }
  @keyframes drumSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  /* Swipe / Rub hand hint across the bumpy road */
  #rollHint{
    position:absolute;
    left:52%;
    top:48%;
    z-index:12;
    font-size:44px;
    line-height:1;
    pointer-events:none;
    opacity:0;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.45));
    transition:opacity .28s ease;
  }
  #rollHint.show{
    opacity:1;
    animation:rollSwipe 1.45s ease-in-out infinite;
  }
  @keyframes rollSwipe{
    0%{ transform:translate(-75px, -50%) rotate(-12deg) scale(1); }
    50%{ transform:translate(65px, -50%) rotate(10deg) scale(1.12); }
    100%{ transform:translate(-75px, -50%) rotate(-12deg) scale(1); }
  }

  /* ================= PHASE 3 & FINALE: CRANE RAINBOW BRIDGE ================= */
  #phaseCrane{
    background:linear-gradient(180deg, rgba(139,224,255,.52) 0%, rgba(255,244,204,.46) 52%, rgba(56,189,248,.82) 66%, rgba(14,116,144,.94) 100%);
  }
  #craneWorld{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    height:100%;
  }
  #craneSceneSvg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:4;
  }

  /* Animated Crane Trolley + Cable + Hook */
  #craneTrolleyGroup{
    transition:transform .46s cubic-bezier(.32,1.18,.44,1);
  }
  #craneCableLine{
    transition:y2 .34s cubic-bezier(.32,1.18,.44,1);
  }
  #craneHookGroup{
    transition:transform .34s cubic-bezier(.32,1.18,.44,1);
  }

  /* Bridge Slots */
  .bridge-slot{
    cursor:pointer;
    transition:filter .2s ease;
  }
  .bridge-slot .slot-ghost{
    opacity:.68;
    transition:opacity .25s ease;
  }
  .bridge-slot.suggest .slot-ghost{
    opacity:1;
    animation:slotGlow 1.1s ease-in-out infinite alternate;
  }
  .bridge-slot.hover-hot .slot-ghost{
    opacity:1;
    filter:drop-shadow(0 0 16px #ffd84d);
  }
  @keyframes slotGlow{
    from{ filter:drop-shadow(0 0 4px rgba(255,216,77,.55)); }
    to{ filter:drop-shadow(0 0 18px rgba(255,216,77,1)); }
  }
  .bridge-slot .slot-solid{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    transform:scale(.45) translateY(-28px);
    pointer-events:none;
  }
  .bridge-slot.placed .slot-ghost{ opacity:0; }
  .bridge-slot.placed .slot-solid{
    opacity:1;
    transform:scale(1) translateY(0);
    animation:blockSnapPop .52s cubic-bezier(.34,1.8,.5,1);
  }
  @keyframes blockSnapPop{
    0%{ transform:scale(.5) translateY(-32px) rotate(-6deg); opacity:.4; }
    62%{ transform:scale(1.1) translateY(3px) rotate(3deg); opacity:1; }
    100%{ transform:scale(1) translateY(0) rotate(0deg); opacity:1; }
  }

  /* Rainbow Aura & Parade Lane on Bridge in Grand Finale! */
  #bridgeRainbowGlow{
    opacity:0;
    transition:opacity .7s ease;
  }
  #stage[data-phase="finale"] #bridgeRainbowGlow{
    opacity:1;
    animation:rainbowPulse 2.4s ease-in-out infinite alternate;
  }
  @keyframes rainbowPulse{
    from{ filter:drop-shadow(0 0 10px rgba(255,216,77,.6)); }
    to{ filter:drop-shadow(0 0 26px rgba(255,255,255,.95)); }
  }

  #paradeLayer{
    position:absolute;
    left:0;
    right:0;
    bottom:min(44%, 25vw);
    height:clamp(88px, 14vw, 126px);
    z-index:12;
    pointer-events:none;
    overflow:hidden;
  }
  .parade-track{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-end;
    gap:34px;
    width:max-content;
    padding-bottom:6px;
    animation:paradeDrive 8.4s linear infinite;
  }
  @keyframes paradeDrive{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(110vw); }
  }
  .parade-vehicle{
    pointer-events:auto;
    width:clamp(108px, 17vw, 152px);
    height:clamp(84px, 13.5vw, 118px);
    min-width:74px;
    min-height:74px;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    outline:none;
    position:relative;
    filter:drop-shadow(0 8px 10px rgba(34,20,6,.3));
    animation:vehicleBob .52s ease-in-out infinite alternate;
  }
  .parade-vehicle:nth-child(2){ animation-delay:.16s; }
  .parade-vehicle:nth-child(3){ animation-delay:.32s; }
  .parade-vehicle.honk-jump{
    animation:vehicleHonk .55s cubic-bezier(.34,1.9,.5,1) !important;
  }
  @keyframes vehicleBob{
    from{ transform:translateY(0); }
    to{ transform:translateY(-5px); }
  }
  @keyframes vehicleHonk{
    0%,100%{ transform:translateY(0) scale(1); }
    45%{ transform:translateY(-22px) scale(1.14) rotate(-5deg); }
    75%{ transform:translateY(-6px) scale(1.04) rotate(4deg); }
  }
  .parade-vehicle svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }

  /* Honk burst badge */
  #honkBurst{
    position:absolute;
    top:12%;
    left:50%;
    transform:translateX(-50%) scale(.4);
    z-index:18;
    pointer-events:none;
    font-size:48px;
    line-height:1;
    opacity:0;
    filter:drop-shadow(0 6px 12px rgba(255,140,0,.6));
  }
  #honkBurst.show{
    animation:honkWave 1.05s cubic-bezier(.25,1.55,.5,1);
  }
  @keyframes honkWave{
    0%{ opacity:0; transform:translateX(-50%) scale(.35) rotate(-10deg); }
    28%{ opacity:1; transform:translateX(-50%) scale(1.24) rotate(8deg); }
    72%{ opacity:1; transform:translateX(-50%) scale(1.06) rotate(-4deg); }
    100%{ opacity:0; transform:translateX(-50%) translateY(-22px) scale(1.32) rotate(10deg); }
  }

  /* ================= BOTTOM TOOL & BLOCK DOCK ================= */
  #bottomDock{
    position:relative;
    z-index:18;
    flex:0 0 auto;
    height:calc(98px + env(safe-area-inset-bottom));
    padding:8px max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    background:linear-gradient(180deg, #9c5b24 0%, #744016 36%, #4f290c 100%);
    border-top:5px solid #ffd84d;
    box-shadow:inset 0 3px 0 rgba(255,248,200,.72), 0 -6px 20px rgba(45,22,6,.38);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .dock-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(10px, 2.2vw, 20px);
    width:100%;
    max-width:660px;
  }

  /* Phase 1 dock: visual scoop counter buttons */
  .scoop-badge{
    position:relative;
    width:76px;
    height:76px;
    min-width:68px;
    min-height:68px;
    border-radius:20px;
    border:4px dashed rgba(255,232,160,.62);
    background:rgba(45,20,6,.42);
    display:grid;
    place-items:center;
    cursor:pointer;
    outline:none;
    font-size:32px;
    line-height:1;
    transition:transform .18s cubic-bezier(.34,1.7,.5,1), background .25s, border-color .25s, box-shadow .25s;
  }
  .scoop-badge:active{ transform:scale(.92); }
  .scoop-badge.filled{
    border-style:solid;
    border-color:#ffd84d;
    background:radial-gradient(circle at 35% 30%, #fffef8 0%, #ffe699 100%);
    box-shadow:0 4px 0 #b87300, 0 0 16px rgba(255,216,77,.8);
    animation:tilePop .45s cubic-bezier(.34,1.85,.5,1);
    cursor:default;
  }
  .scoop-badge .badge-chk{
    position:absolute;
    top:-7px;
    right:-7px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:#16a34a;
    border:2.5px solid #fff;
    color:#fff;
    font-size:15px;
    font-weight:900;
    display:grid;
    place-items:center;
    opacity:0;
    transform:scale(.3);
    transition:opacity .25s, transform .35s cubic-bezier(.34,1.9,.5,1);
  }
  .scoop-badge.filled .badge-chk{
    opacity:1;
    transform:scale(1);
  }

  /* Phase 2 dock: Big glowing Dump ⬇️ or Roll 🚜➡️ CTA + Road Gauge */
  .dock-cta{
    min-width:118px;
    min-height:74px;
    height:76px;
    padding:0 24px;
    border-radius:999px;
    border:4px solid #fffdf5;
    font-family:"Fredoka",sans-serif;
    font-size:34px;
    font-weight:700;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
    outline:none;
    transition:transform .16s cubic-bezier(.34,1.65,.5,1);
  }
  .dock-cta:active{ transform:translateY(3px) scale(.93); }
  #tipBtn{
    background:linear-gradient(180deg, #ffd84d 0%, #f59e0b 100%);
    color:#4a2204;
    box-shadow:0 6px 0 #b45309, 0 0 22px rgba(255,216,77,.85);
    animation:ctaPulse 1.35s ease-in-out infinite;
  }
  #rollTapBtn{
    background:linear-gradient(180deg, #ffe047 0%, #eab308 100%);
    color:#4a2204;
    box-shadow:0 6px 0 #a16207, 0 0 22px rgba(255,216,77,.85);
    animation:ctaPulse 1.35s ease-in-out infinite;
  }
  @keyframes ctaPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }

  #rollMeterWrap{
    flex:1 1 auto;
    max-width:260px;
    height:34px;
    border-radius:999px;
    border:4px solid #fffdf5;
    background:rgba(36,18,6,.55);
    overflow:hidden;
    box-shadow:inset 0 3px 6px rgba(0,0,0,.45);
    position:relative;
  }
  #rollMeterFill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, #facc15 0%, #4ade80 100%);
    box-shadow:0 0 12px rgba(74,222,128,.75);
    transition:width .18s ease-out;
  }

  /* Phase 3 dock: Big colorful Bridge Block tiles (>=74px) */
  .block-tile{
    position:relative;
    flex:0 0 auto;
    width:78px;
    height:76px;
    min-width:70px;
    min-height:70px;
    padding:5px;
    border-radius:20px;
    border:4px solid #fffdf5;
    background:var(--blk-bg, linear-gradient(180deg, #f87171 0%, #dc2626 100%));
    box-shadow:0 5px 0 var(--blk-shadow, #991b1b), 0 0 18px rgba(255,216,77,.72);
    display:grid;
    place-items:center;
    cursor:grab;
    outline:none;
    touch-action:none;
    transition:transform .18s cubic-bezier(.34,1.7,.5,1), opacity .25s, box-shadow .25s;
  }
  .block-tile:active{ transform:scale(.92); cursor:grabbing; }
  .block-tile svg{
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
  }
  .block-tile.hint-next{
    animation:tileHintBob 1.1s ease-in-out infinite;
  }
  @keyframes tileHintBob{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-6px) scale(1.08); }
  }
  @keyframes tilePop{
    0%{ transform:scale(.5); }
    65%{ transform:scale(1.16); }
    100%{ transform:scale(1); }
  }
  .block-tile.placed{
    border-color:#4ade80;
    background:linear-gradient(180deg, #dcfce7 0%, #bbf7d0 100%);
    box-shadow:0 3px 0 #15803d;
    opacity:.75;
    cursor:default;
    pointer-events:none;
    animation:none;
  }
  .block-tile.placed svg{ opacity:.32; }
  .block-tile .tile-check{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-size:34px;
    color:#15803d;
    font-weight:900;
    opacity:0;
    transform:scale(.3);
    pointer-events:none;
    transition:opacity .25s, transform .35s cubic-bezier(.34,1.9,.5,1);
  }
  .block-tile.placed .tile-check{
    opacity:1;
    transform:scale(1);
  }
  .tile-hand{
    position:absolute;
    top:-28px;
    left:50%;
    transform:translateX(-50%);
    font-size:32px;
    line-height:1;
    pointer-events:none;
    display:none;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.4));
    animation:handBounce .85s ease-in-out infinite;
  }
  .block-tile.show-hand .tile-hand{ display:block; }

  /* Finale dock: Big glowing 📣 Honk + 🏗️ Build Again buttons */
  #honkBtn{
    background:linear-gradient(180deg, #ffd84d 0%, #f59e0b 100%);
    color:#542800;
    box-shadow:0 6px 0 #b45309, 0 0 22px rgba(255,216,77,.82);
  }
  #againBtn{
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff;
    box-shadow:0 6px 0 #14532d, 0 0 26px rgba(74,222,128,.85);
    animation:ctaPulse 1.45s ease-in-out infinite;
  }

  /* ================= DRAGGED GHOST & FLYING FX LAYER ================= */
  #fxLayer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:35;
    overflow:hidden;
  }
  #dragGhost{
    position:fixed;
    left:0;
    top:0;
    width:116px;
    height:106px;
    margin:-53px 0 0 -58px;
    pointer-events:none;
    z-index:45;
    filter:drop-shadow(0 12px 16px rgba(59,35,16,.38)) drop-shadow(0 0 14px rgba(255,216,77,.9));
    transform:scale(1.1);
  }
  #dragGhost svg{ width:100%; height:100%; display:block; }

  .fx-spark{
    position:absolute;
    font-size:28px;
    line-height:1;
    pointer-events:none;
    filter:drop-shadow(0 0 8px rgba(255,220,90,.95));
  }
  .fx-dust{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
  }
  .fx-conf{
    position:absolute;
    border-radius:4px;
    pointer-events:none;
  }

  /* ================= RESPONSIVE: iPHONE PORTRAIT (390x844) ================= */
  @media (max-width:640px){
    #hud{
      gap:6px;
      padding:max(8px, env(safe-area-inset-top)) 6px 2px;
    }
    #phaseBar{ gap:6px; }
    .phase-pill{
      width:68px;
      height:68px;
      min-width:68px;
      min-height:68px;
      border-radius:18px;
      padding:4px;
    }
    .hud-right{ gap:6px; }
    #starPill{
      min-width:70px;
      min-height:68px;
      height:68px;
      padding:0 10px 0 8px;
      gap:4px;
    }
    .star-glyph{ font-size:24px; }
    #starNum{ font-size:22px; }
    #soundBtn{
      width:68px;
      height:68px;
      min-width:68px;
      min-height:68px;
      font-size:24px;
    }

    #arena{
      flex-direction:column;
      justify-content:flex-start;
      gap:4px;
      padding:14px 8px 8px;
    }
    #hootWrap{
      align-self:flex-start;
      padding-bottom:0;
      margin-top:10px;
      margin-left:6px;
    }
    #hootBtn{
      width:96px;
      height:102px;
    }
    #hootBtn.cheer{
      animation:hootCheerCompact .62s cubic-bezier(.34,1.85,.5,1) 2 !important;
    }
    @keyframes hootCheerCompact{
      0%,100%{ transform:translateY(0) scale(1) rotate(0deg); }
      42%{ transform:translateY(-8px) scale(1.05) rotate(-5deg); }
      74%{ transform:translateY(-2px) scale(1.02) rotate(4deg); }
    }
    #playStage{
      width:100%;
      flex:1 1 auto;
      height:auto;
      min-height:0;
    }
    .scene-card{
      border-radius:24px;
      max-height:100%;
    }

    .dirt-mound{
      width:78px;
      height:74px;
      min-width:72px;
      min-height:70px;
    }
    #moundsRow{
      bottom:4%;
      padding:0 4px;
      gap:4px;
    }
    #exDragHandle{
      width:74px;
      height:74px;
      margin:-37px 0 0 -37px;
    }

    #roadZone{
      height:152px;
      padding:10px 8px 12px;
    }
    #p2DumpBtn{
      width:190px;
      height:142px;
      right:4%;
      bottom:-14px;
    }
    #steamrollerWrap{
      width:138px;
      height:108px;
      bottom:28%;
    }

    #bottomDock{
      height:calc(92px + env(safe-area-inset-bottom));
      padding:6px 8px max(6px, env(safe-area-inset-bottom));
    }
    .dock-row{ gap:8px; }
    .scoop-badge{
      width:70px;
      height:70px;
      min-width:68px;
      min-height:68px;
      border-radius:16px;
      font-size:28px;
    }
    .block-tile{
      width:72px;
      height:70px;
      min-width:68px;
      min-height:68px;
      border-radius:16px;
    }
    .dock-cta{
      min-width:104px;
      min-height:70px;
      height:70px;
      padding:0 18px;
      font-size:28px;
    }
    #rollMeterWrap{
      max-width:160px;
      height:28px;
    }
  }

  /* Compact iPad / Desktop landscape height tuning */
  @media (min-width:641px) and (max-height:790px){
    #hootBtn{
      width:clamp(112px, 14vw, 152px);
      height:clamp(124px, 15.6vw, 168px);
    }
    .scene-card{
      max-height:530px;
    }
    #bottomDock{
      height:calc(94px + env(safe-area-inset-bottom));
    }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01s !important; }
  }
</style>
</head>
<body>
<div id="stage" data-phase="excavator">
  <!-- Shared Pixar Construction SVG Gradients (always mounted so Safari/WebKit resolves url(#...) across all phases!) -->
  <svg id="sharedDefs" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none" aria-hidden="true">
    <defs>
      <linearGradient id="catYellow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffe761"/>
        <stop offset="52%" stop-color="#f5b700"/>
        <stop offset="100%" stop-color="#cc8400"/>
      </linearGradient>
      <linearGradient id="catOrange" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fb923c"/>
        <stop offset="100%" stop-color="#c2410c"/>
      </linearGradient>
      <linearGradient id="cabGlass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e0f2fe"/>
        <stop offset="60%" stop-color="#7dd3fc"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <linearGradient id="steelGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#94a3b8"/>
        <stop offset="100%" stop-color="#475569"/>
      </linearGradient>
      <linearGradient id="dirtFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c68642"/>
        <stop offset="100%" stop-color="#7c471b"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- ============ PIXAR CONSTRUCTION YARD BACKDROP ============ -->
  <div id="yardBg" class="backdrop" aria-hidden="true"></div>

  <!-- Ambient drifting clouds & warm golden sun -->
  <div id="skyAmbient" aria-hidden="true">
    <svg viewBox="0 0 1200 720" preserveAspectRatio="xMidYMin slice">
      <g class="sun-rays" fill="none" stroke="#fff7c2" stroke-width="8" stroke-linecap="round">
        <line x1="1090" y1="22" x2="1090" y2="42"/>
        <line x1="1090" y1="142" x2="1090" y2="162"/>
        <line x1="1020" y1="92" x2="1040" y2="92"/>
        <line x1="1140" y1="92" x2="1160" y2="92"/>
        <line x1="1040" y1="42" x2="1055" y2="57"/>
        <line x1="1125" y1="127" x2="1140" y2="142"/>
        <line x1="1140" y1="42" x2="1125" y2="57"/>
        <line x1="1055" y1="127" x2="1040" y2="142"/>
      </g>
      <circle cx="1090" cy="92" r="36" fill="#ffe566"/>
      <g class="cloud-float" fill="#ffffff">
        <ellipse cx="210" cy="94" rx="54" ry="26"/>
        <ellipse cx="250" cy="84" rx="42" ry="28"/>
        <ellipse cx="288" cy="96" rx="38" ry="20"/>
      </g>
      <g class="cloud-float-slow" fill="#ffffff">
        <ellipse cx="760" cy="112" rx="60" ry="26"/>
        <ellipse cx="810" cy="98" rx="46" ry="30"/>
        <ellipse cx="854" cy="112" rx="40" ry="22"/>
      </g>
    </svg>
  </div>

  <!-- ============ TOP HUD: 3 BIG VISUAL PHASE PILLS + STARS + SOUND ============ -->
  <header id="hud">
    <nav id="phaseBar" aria-label="Construction steps">
      <button class="phase-pill active" data-phase-btn="excavator" type="button" aria-label="Scoop dirt" aria-pressed="true" style="--pill-bg:linear-gradient(180deg,#ffe047,#f59e0b);--pill-shadow:#b45309">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <rect x="12" y="54" width="38" height="12" rx="6" fill="#334155" stroke="#1e293b" stroke-width="2.5"/>
          <circle cx="20" cy="60" r="3.5" fill="#94a3b8"/><circle cx="31" cy="60" r="3.5" fill="#94a3b8"/><circle cx="42" cy="60" r="3.5" fill="#94a3b8"/>
          <rect x="14" y="34" width="32" height="21" rx="6" fill="#facc15" stroke="#78350f" stroke-width="2.5"/>
          <rect x="26" y="38" width="16" height="11" rx="3" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/>
          <path d="M44,44 L58,20 L70,38" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M64,38 L75,44 L67,54 L59,46 Z" fill="#475569" stroke="#1e293b" stroke-width="2"/>
        </svg>

(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };

  /* ================= AGE-ADAPTIVE PROFILE (RILEY = kidb, ZANE = default) ================= */
  var IS_RILEY = false;

    var sp = new URLSearchParams(window.location.search || "");

  var MOUND_COUNT = IS_RILEY ? 3 : 4;
  var BLOCK_COUNT = IS_RILEY ? 3 : 4;

  /* ================= DOM REFERENCES ================= */
  var stage = $("stage");
  var starPill = $("starPill");
  var starNum = $("starNum");
  var soundBtn = $("soundBtn");
  var hootBtn = $("hootBtn");
  var hootPupils = $("hootPupils");
  var phasePills = Array.prototype.slice.call(document.querySelectorAll(".phase-pill"));

  /* Phase 1 */
  var phaseExcavator = $("phaseExcavator");
  var excavatorWorld = $("excavatorWorld");
  var exBoomGroup = $("exBoomGroup");
  var exArmGroup = $("exArmGroup");
  var exBucketGroup = $("exBucketGroup");
  var exBucketDirt = $("exBucketDirt");
  var exExhaustPuff = $("exExhaustPuff");
  var p1TruckGroup = $("p1TruckGroup");
  var exDragHandle = $("exDragHandle");
  var moundsRow = $("moundsRow");
  var dockExcavator = $("dockExcavator");

  /* Phase 2 */
  var phaseRoller = $("phaseRoller");

  var roadZone = $("roadZone");
  var roadTrack = $("roadTrack");
  var roadSmoothOverlay = $("roadSmoothOverlay");
  var steamrollerWrap = $("steamrollerWrap");
  var rollHint = $("rollHint");
  var dockRoller = $("dockRoller");
  var tipBtn = $("tipBtn");
  var rollTapBtn = $("rollTapBtn");
  var rollMeterWrap = $("rollMeterWrap");
  var rollMeterFill = $("rollMeterFill");

  /* Phase 3 & Finale */
  var phaseCrane = $("phaseCrane");
  var craneSceneSvg = $("craneSceneSvg");
  var craneTrolleyGroup = $("craneTrolleyGroup");
  var craneCableLine = $("craneCableLine");
  var craneHookGroup = $("craneHookGroup");
  var hookCarriedBlock = $("hookCarriedBlock");
  var bridgeSlotsLayer = $("bridgeSlotsLayer");
  var paradeLayer = $("paradeLayer");
  var honkBurst = $("honkBurst");
  var dockCrane = $("dockCrane");
  var dockFinale = $("dockFinale");
  var honkBtn = $("honkBtn");
  var againBtn = $("againBtn");

  var dragGhost = $("dragGhost");
  var fxLayer = $("fxLayer");

  /* ================= GAME STATE ================= */
  var phase = "excavator"; /* "excavator" | "roller" | "crane" | "finale" */
  var rollerSubStep = "dump"; /* "dump" | "roll" | "done" */
  var phaseDone = { excavator: false, roller: false, crane: false };
  var moundsScoopedMap = {};
  var moundsScooped = 0;
  var excavatorBusy = false;
  var rollProgress = 0;
  var isRollingDrag = false;
  var lastRollX = 0;
  var lastRollSfxAt = 0;
  var blocksPlacedMap = {};
  var blocksPlaced = 0;
  var craneBusy = false;
  var stars = 0;
  var completedRuns = 0;
  var honkCount = 0;

  var soundOn = true;
  var dead = false;
  var hasInteracted = false;
  var idleVoiceReminded = false;
  var timers = [];
  var idleTimer = null;
  var idleVoiceTimer = null;
  var blockDragState = null;
  var bucketDragState = null;

  /* Bridge Block Palette (shape + number + Pixar gradient) */
  var ALL_BLOCKS = [
    { id: "b1", num: "1", shape: "circle",   bg: "linear-gradient(180deg,#f87171,#dc2626)", shadow: "#991b1b", fill: "#ef4444", rim: "#fca5a5", stroke: "#7f1d1d" },
    { id: "b2", num: "2", shape: "triangle", bg: "linear-gradient(180deg,#fbbf24,#ea580c)", shadow: "#9a3412", fill: "#f97316", rim: "#fed7aa", stroke: "#7c2d12" },
    { id: "b3", num: "3", shape: "square",   bg: "linear-gradient(180deg,#4ade80,#16a34a)", shadow: "#14532d", fill: "#22c55e", rim: "#bbf7d0", stroke: "#14532d" },
    { id: "b4", num: "4", shape: "star",     bg: "linear-gradient(180deg,#60a5fa,#2563eb)", shadow: "#1e3a8a", fill: "#3b82f6", rim: "#bfdbfe", stroke: "#1e3a8a" }
  ];
  var ACTIVE_BLOCKS = ALL_BLOCKS.slice(0, BLOCK_COUNT);

  /* ================= HOOT_HAVE-GATED STUDIO VOICE QUEUE (ZERO SYNTHESIS!) ================= */
  var audioCtx = null;
  var voiceEl = new Audio();
  voiceEl.preload = "auto";
  var voiceQueue = [];
  var voicePlaying = false;
  var audioUnlocked = false;
  var pendingBootClip = null;

  function hasHootClip(id){
    try{
      if(window.parent && window.parent.HOOT_HAVE && window.parent.HOOT_HAVE[id]) return true;
    }catch(e){}
    return false;
  }

  function resolveConClip(customId, fallbackId){
    var chosen = (customId && hasHootClip(customId)) ? customId : fallbackId;
    return chosen ? (chosen.indexOf(".mp3") >= 0 ? chosen : chosen + ".mp3") : null;
  }

  function unlockAudioOnce(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    getAudioCtx();
    try{
      if(!voicePlaying){
        voiceEl.muted = true;
        var p = voiceEl.play();
        if(p && p.then){
          p.then(function(){
            voiceEl.pause();
            voiceEl.currentTime = 0;
            voiceEl.muted = false;
            if(pendingBootClip){
              var c = pendingBootClip;
              pendingBootClip = null;
              enqueueVoice(c, true);
            }
          }).catch(function(){ voiceEl.muted = false; });
        } else {
          voiceEl.muted = false;
        }
      }
    }catch(e){ voiceEl.muted = false; }
  }
  stage.addEventListener("pointerdown", unlockAudioOnce, { passive: true, capture: true });

  function getAudioCtx(){
    if(!soundOn) return null;
    try{
      if(!audioCtx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(AC) audioCtx = new AC();
      }
      if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }catch(e){}
    return audioCtx;
  }

  function clearVoice(stopCurrent){
    voiceQueue.length = 0;
    if(stopCurrent){
      voicePlaying = false;
      try{ voiceEl.pause(); voiceEl.currentTime = 0; }catch(e){}
    }
  }

  function pumpVoice(){
    if(dead || !soundOn || voicePlaying || !voiceQueue.length) return;
    var clip = voiceQueue.shift();
    voicePlaying = true;
    voiceEl.muted = false;
    voiceEl.src = "assets/voice/" + clip;
    var p = voiceEl.play();
    if(p && p.catch){
      p.catch(function(){
        voicePlaying = false;
        if(!audioUnlocked && !pendingBootClip) pendingBootClip = clip;
        pumpVoice();
      });
    }
  }
  voiceEl.addEventListener("ended", function(){
    voicePlaying = false;
    pumpVoice();
  });
  voiceEl.addEventListener("error", function(){
    voicePlaying = false;
    pumpVoice();
  });

  function enqueueVoice(clip, interrupt){
    if(dead || !soundOn || !clip) return;
    if(clip.indexOf(".mp3") < 0) clip = clip + ".mp3";
    if(interrupt) clearVoice(true);
    voiceQueue.push(clip);
    pumpVoice();
  }

  function playConGuide(customId, fallbackId, isBoot){
    var clip = resolveConClip(customId, fallbackId);
    if(!clip || dead || !soundOn) return;
    if(isBoot){
      try{
        if(window.parent && typeof window.parent.__hwPlayAfterIntro === "function"){
          window.parent.__hwPlayAfterIntro(function(){
            if(!dead && phase === "excavator" && !hasInteracted){
              enqueueVoice(clip, true);
            }
          });
          return;
        }
      }catch(e){}
    }
    enqueueVoice(clip, true);
  }

  function speakCurrentPhaseGuide(isBoot){
    if(phase === "excavator"){
      if(isBoot){
        playConGuide("hoot-con-welcome", "hoot-welcome", true);
      } else {
        playConGuide("hoot-con-dig", "hoot-tap-big-btn", false);
      }
    } else if(phase === "roller"){
      if(rollerSubStep === "dump"){
        playConGuide("hoot-con-dump", "hoot-tap-big-btn", false);
      } else {
        playConGuide("hoot-con-roll", "hoot-tap-big-btn", false);
      }
    } else if(phase === "crane"){
      playConGuide("hoot-con-crane", "hoot-tap-big-btn", false);
    } else if(phase === "finale"){
      playConGuide("hoot-con-win", "hoot-win-yay", false);
    }
  }

  /* ================= WEB AUDIO PIXAR CONSTRUCTION SFX ================= */
  var crunchBuf = null;
  function getNoiseBuf(ctx){
    if(crunchBuf) return crunchBuf;
    var len = Math.floor(ctx.sampleRate * 0.28);
    crunchBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = crunchBuf.getChannelData(0);
    for(var i = 0; i < len; i++){
      d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * (i / len));
    }
    return crunchBuf;
  }

  function clickPopSfx(freq){
    var ctx = getAudioCtx();
    if(!ctx) return;
    var t = ctx.currentTime;
    try{
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq || 660, t);
      osc.frequency.exponentialRampToValueAtTime((freq || 660) * 1.28, t + 0.08);
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(t);

  /* ================= IDLE VISUAL & VOICE HELPER ================= */
  function hideIdleHints(){
    moundsRow.querySelectorAll(".dirt-mound").forEach(function(m){ m.classList.remove("show-hand"); });
    p2DumpBtn.classList.remove("show-hand");
    rollHint.classList.remove("show");
    dockCrane.querySelectorAll(".block-tile").forEach(function(t){ t.classList.remove("show-hand", "hint-next"); });
  }

  function showPhaseVisualCue(){
    if(dead) return;
    if(phase === "excavator"){
      var mounds = moundsRow.querySelectorAll(".dirt-mound");
      for(var i = 0; i < mounds.length; i++){
        if(!moundsScoopedMap[i]){
          mounds[i].classList.add("show-hand");
          break;
        }
      }
    } else if(phase === "roller"){
      if(rollerSubStep === "dump"){
        p2DumpBtn.classList.add("show-hand");
      } else if(rollerSubStep === "roll"){
        rollHint.classList.add("show");
      }
    } else if(phase === "crane"){
      var tiles = dockCrane.querySelectorAll(".block-tile");
      for(var j = 0; j < tiles.length; j++){
        var id = tiles[j].dataset.blockId;
        if(!blocksPlacedMap[id]){
          tiles[j].classList.add("show-hand", "hint-next");
          break;
        }
      }
    }
  }

  function armIdle(fastVisual){
    hideIdleHints();
    if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    if(idleVoiceTimer){ clearTimeout(idleVoiceTimer); idleVoiceTimer = null; }
    if(dead || phase === "finale") return;
    var delay = fastVisual ? 1200 : 2800;
    idleTimer = setTimeout(showPhaseVisualCue, delay);
    if(!idleVoiceReminded){
      idleVoiceTimer = setTimeout(function(){
        if(dead || phase === "finale") return;
        idleVoiceReminded = true;
        speakCurrentPhaseGuide(false);
      }, 9500);
    }
  }

  /* ================= HUD UPDATE ================= */
  function updateHud(animateStar){
    starNum.textContent = String(stars);
    if(animateStar){
      starPill.classList.remove("bump");
      void starPill.offsetWidth;
      starPill.classList.add("bump");
    }
    phasePills.forEach(function(btn){
      var p = btn.dataset.phaseBtn;
      var active = (phase === p) || (phase === "finale" && p === "crane");
      btn.classList.toggle("active", active);
      btn.setAttribute("aria-pressed", active ? "true" : "false");
      btn.classList.toggle("done", !!phaseDone[p]);
    });
  }
