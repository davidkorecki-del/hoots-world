<!doctype html>
<html lang="en">
<head>
<base href="../">

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>3D Pizza Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#241710; --gold:#ffd43b; --outline:#241710; --warm:#fff9f0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; width:100%; height:100%; overflow:hidden; font-family:"Nunito",system-ui,sans-serif; background:#2b160c; touch-action:none; }

  #stage{ position:fixed; inset:0; width:100%; height:100dvh; overflow:hidden; background:#2b160c; }
  #gameCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:1; touch-action:none; }

  /* Top HUD */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding:max(10px, env(safe-area-inset-top)) 14px 0 14px;
    pointer-events:none;
  }
  .hud-left{ display:flex; align-items:center; gap:10px; pointer-events:auto; max-width:min(58vw, 540px); }
  #hootBtn{
    width:66px; height:66px; flex:0 0 66px; border-radius:50%;
    border:4px solid #fff;
    background:radial-gradient(circle at 35% 30%, #fff4b8, #ffc93c 65%, #ea580c 100%);
    box-shadow:0 6px 0 var(--outline), 0 0 22px rgba(251,146,60,.6);
    padding:4px; cursor:pointer;
    animation:hootBob 2.2s ease-in-out infinite alternate;
  }
  #hootBtn:active{ transform:scale(.9); }
  @keyframes hootBob{ from{ transform:translateY(0); } to{ transform:translateY(-5px); } }
  #promptBubble{
    background:rgba(255,252,245,.97); color:var(--ink);
    border:4px solid var(--outline); border-radius:22px;
    padding:9px 15px; font-family:"Fredoka",sans-serif; font-weight:700;
    font-size:clamp(14px, 2vw, 17.5px); line-height:1.22;
    box-shadow:0 6px 0 var(--outline), 0 12px 26px rgba(0,0,0,.38);
  }
  #promptBubble b{ color:#dc2626; }

  .hud-right{ display:flex; align-items:center; gap:8px; pointer-events:auto; flex-shrink:0; }
  #chefBadges{
    display:flex; align-items:center; gap:5px;
    background:rgba(43,22,12,.88); border:3.5px solid #fde047;
    border-radius:999px; padding:4px 9px; box-shadow:0 5px 0 var(--outline);
  }
  .cbadge{
    position:relative; width:38px; height:38px; border-radius:50%;
    border:3px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12);
    display:grid; place-items:center; font-size:20px; cursor:pointer; padding:0;
    filter:grayscale(1) opacity(.48); transition:transform .35s cubic-bezier(.34,1.8,.5,1), filter .3s;
  }
  .cbadge.active-cust{ border-color:#fb923c; box-shadow:0 0 12px rgba(251,146,60,.95); filter:grayscale(.25) opacity(.92); }
  .cbadge.served{
    filter:none; border-color:var(--outline);
    background:radial-gradient(circle at 32% 28%, #fef08a, #facc15 65%, #d97706 100%);
    box-shadow:0 0 16px rgba(250,204,21,.95);
    animation:popBadge .55s cubic-bezier(.34,1.8,.5,1);
  }
  .cbadge-check{
    position:absolute; right:-4px; bottom:-4px; font-size:12px; line-height:1;
    background:#16a34a; color:#fff; border-radius:50%; width:16px; height:16px;
    display:grid; place-items:center; border:2px solid #fff;
  }
  @keyframes popBadge{ 0%{ transform:scale(.4) rotate(-18deg); } 65%{ transform:scale(1.28) rotate(8deg); } 100%{ transform:scale(1) rotate(0); } }

  #starPill{
    display:flex; align-items:center; gap:6px;
    background:#fffef8; border:4px solid var(--outline); border-radius:999px;
    padding:6px 13px; font-family:"Fredoka",sans-serif; font-weight:800; font-size:19px; color:var(--ink);
    box-shadow:0 5px 0 var(--outline);
  }
  #doneBtn{
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:16.5px;
    padding:8px 15px; cursor:pointer; white-space:nowrap;
    box-shadow:0 5px 0 var(--outline); text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  #doneBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--outline); }

  /* Visual Picture Order Ticket (Pre-reader friendly — icons + counts, zero reading needed!) */
  #orderTicket{
    position:absolute; right:14px; top:86px; z-index:11;
    background:rgba(255,252,245,.96); border:4px solid var(--outline); border-radius:22px;
    padding:8px 12px; box-shadow:0 7px 0 var(--outline), 0 12px 26px rgba(0,0,0,.35);
    display:flex; flex-direction:column; gap:6px; min-width:148px; max-width:210px;
  }
  .ticket-head{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:14.5px; color:#9a3412;
    border-bottom:2px dashed #fdba74; padding-bottom:4px;
  }
  .ticket-list{ display:flex; flex-direction:column; gap:5px; }
  .ticket-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:#fff7ed; border:2.5px solid #fed7aa; border-radius:12px; padding:4px 8px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:15px; color:var(--ink);
  }
  .ticket-row.done{ background:#dcfce7; border-color:#4ade80; color:#166534; }
  .ticket-row-ic{ display:flex; align-items:center; gap:5px; }
  .ticket-row-ic img{ width:24px; height:24px; object-fit:contain; }
  .ticket-row-dot{ width:18px; height:18px; border-radius:50%; border:2.5px solid var(--outline); display:inline-block; }

  /* Big Center Action Button (BAKE / SERVE / NEXT ORDER) */
  #actionStage{
    position:absolute; left:0; right:0; bottom:94px; z-index:12;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    pointer-events:none; padding:0 12px;
  }
  .hero-action-btn{
    pointer-events:auto;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    border:5px solid #fff; border-radius:999px;
    padding:10px 26px; cursor:pointer;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:clamp(20px, 3.2vw, 27px); color:#fff;
    text-shadow:0 3px 0 rgba(36,23,16,.48);
    animation:heroPulse .55s ease-in-out infinite alternate;
  }
  .hero-action-btn:active{ transform:translateY(5px); }
  #bakeBtn{
    background:radial-gradient(circle at 35% 25%, #fdba74 0%, #ea580c 52%, #b91c1c 100%);
    box-shadow:0 10px 0 var(--outline), 0 0 38px rgba(234,88,12,.92);
  }
  #serveBtn{
    background:radial-gradient(circle at 35% 25%, #fef08a 0%, #f59e0b 55%, #b45309 100%);
    box-shadow:0 10px 0 var(--outline), 0 0 38px rgba(250,204,21,.92);
  }
  #nextOrderBtn{
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    box-shadow:0 10px 0 var(--outline), 0 0 38px rgba(74,222,128,.9);
  }
  @keyframes heroPulse{
    from{ transform:scale(1); box-shadow:0 10px 0 var(--outline), 0 0 0 0 rgba(253,224,71,.7); }
    to{ transform:scale(1.06); box-shadow:0 10px 0 var(--outline), 0 0 0 10px rgba(253,224,71,.95); }
  }
  .tap-finger{ display:inline-block; font-size:30px; line-height:1; animation:fingerHop .5s ease-in-out infinite alternate; }
  @keyframes fingerHop{ from{ transform:translateY(0); } to{ transform:translateY(-8px) scale(1.15); } }

  /* Giant Oven Timer Countdown */
  #ovenBanner{
    position:absolute; left:50%; top:24%; transform:translate(-50%, -50%) scale(.4);
    z-index:15; pointer-events:none; opacity:0;
    font-family:"Fredoka",sans-serif; font-weight:800;
    font-size:clamp(60px, 12vw, 112px); color:#fde047;
    text-shadow:0 7px 0 #241710, 0 0 42px rgba(251,146,60,.98);
    transition:transform .2s cubic-bezier(.34,1.8,.5,1), opacity .2s;
    white-space:nowrap;
  }
  #ovenBanner.show{ opacity:1; transform:translate(-50%, -50%) scale(1); }

  /* Bottom Ingredient & Kitchen Bar */
  #kitchenBar{
    position:absolute; left:50%; bottom:max(10px, env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:11;
    width:min(97vw, 900px);
    background:linear-gradient(180deg, rgba(68,36,18,.95) 0%, rgba(38,19,10,.97) 100%);
    backdrop-filter:blur(10px);
    border:4px solid #fb923c; border-radius:26px;
    padding:8px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 8px 0 #1b0d06, 0 14px 32px rgba(0,0,0,.52), inset 0 2px 0 rgba(255,255,255,.22);
  }
  #traySlots{
    display:flex; align-items:center; justify-content:center; gap:8px; flex:1 1 auto;
  }
  .ing-btn{
    position:relative; min-width:64px; height:64px; border-radius:20px;
    border:4px solid #fff; cursor:pointer; padding:4px 8px;
    background:linear-gradient(180deg, #fffbeb 0%, #fde68a 100%);
    box-shadow:0 5px 0 #1b0d06, inset 0 3px 0 rgba(255,255,255,.7);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:12px; color:var(--ink);
    transition:transform .16s cubic-bezier(.34,1.8,.5,1), box-shadow .16s;
  }
  .ing-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #1b0d06; }
  .ing-btn img{ width:36px; height:36px; object-fit:contain; filter:drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .ing-btn .ing-emo{ font-size:28px; line-height:1; }
  .ing-btn.sel{
    border-color:#fde047; background:linear-gradient(180deg, #fef08a 0%, #f59e0b 100%);
    transform:translateY(-4px) scale(1.06);
  }
  .ing-btn.wanted{
    border-color:#4ade80;
    box-shadow:0 0 0 4px #4ade80, 0 5px 0 #1b0d06, 0 0 24px rgba(74,222,128,.9);
    animation:wantPulse .7s ease-in-out infinite alternate;
  }
  @keyframes wantPulse{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-5px) scale(1.06); } }
  .ing-badge{
    position:absolute; top:-8px; right:-6px; min-width:22px; height:22px; border-radius:999px;
    background:#16a34a; color:#fff; border:2.5px solid #fff; padding:0 5px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:12px;
    display:grid; place-items:center; box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .kitchen-controls{ display:flex; align-items:center; gap:7px; flex-shrink:0; }
  .k-pill{
    border:3.5px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
    color:var(--ink); font-family:"Fredoka",sans-serif; font-weight:800; font-size:14px;
    padding:8px 13px; cursor:pointer; white-space:nowrap;
    box-shadow:0 4px 0 var(--outline);
  }
  .k-pill:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--outline); }
  #modeBtn{ background:linear-gradient(180deg, #bae6fd 0%, #38bdf8 100%); }
  #bellCtrlBtn{ background:linear-gradient(180deg, #fed7aa 0%, #fb923c 100%); }

  /* Win Overlay */
  #winOverlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(28,14,8,.76); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .win-card{
    background:linear-gradient(180deg, #fffef8 0%, #fef3c7 100%);
    border:6px solid var(--outline); border-radius:34px;
    padding:26px 24px; text-align:center; max-width:450px; width:100%;
    box-shadow:0 14px 0 var(--outline), 0 26px 50px rgba(0,0,0,.55);
  }
  .win-trophy{ font-size:64px; line-height:1.1; margin-bottom:8px; }
  .win-card h2{ margin:0 0 8px; font-family:"Fredoka",sans-serif; font-size:32px; color:var(--ink); }
  .win-card p{ margin:0 0 18px; font-weight:800; font-size:17px; color:#443329; }
  .win-btns{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; }
  .big-play, .win-btn{
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:20px;
    padding:12px 26px; cursor:pointer; box-shadow:0 6px 0 var(--outline);
  }

  @media (max-width: 740px){
    #hud{
      flex-wrap:wrap; align-items:center; gap:6px;
      padding:max(8px, env(safe-area-inset-top)) 10px 0 10px;
    }
    .hud-left{ display:contents; }
    #hootBtn{ width:52px; height:52px; flex:0 0 52px; order:1; border-width:3px; }
    .hud-right{ order:2; margin-left:auto; gap:6px; }
    #chefBadges{ display:none; }
    #starPill{ font-size:17px; padding:5px 11px; border-width:3px; }
    #doneBtn{ font-size:15px; padding:6px 12px; border-width:3px; }
    #promptBubble{
      order:3; flex:1 0 100%; width:100%;
      padding:7px 12px; border-width:3px; border-radius:16px;
      font-size:13.5px; line-height:1.2; text-align:center;
    }
    #orderTicket{
      left:10px; right:auto; top:132px;
      padding:6px 9px; border-width:3px; border-radius:16px; min-width:0; max-width:142px;
      gap:4px;
    }
    .ticket-head{ font-size:12.5px; padding-bottom:2px; }
    .ticket-row{ padding:3px 6px; font-size:13px; border-width:2px; }
    .ticket-row-ic img{ width:20px; height:20px; }

    #kitchenBar{
      width:min(96vw, 440px); padding:7px 8px; border-radius:22px; border-width:3.5px;
      flex-direction:column; align-items:stretch; gap:6px;
    }
    #traySlots{ gap:5px; flex-wrap:nowrap; width:100%; }
    .ing-btn{ flex:1 1 0; min-width:0; height:56px; border-radius:16px; border-width:3px; padding:3px 2px; font-size:10.5px; }
    .ing-btn img{ width:30px; height:30px; }
    .ing-btn .ing-emo{ font-size:23px; }
    .kitchen-controls{ display:grid; grid-template-columns:1fr 1fr; gap:6px; width:100%; }
    .k-pill{ font-size:12.5px; padding:6px 8px; border-width:3px; text-align:center; }

    #actionStage{ bottom:132px; }
    .hero-action-btn{ padding:11px 22px; font-size:21px; border-width:5px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gameCanvas" aria-label="Pixar 3D Pizza Shop"></canvas>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-left">
      <button id="hootBtn" type="button" aria-label="Tap Hoot to hear again">
        <svg viewBox="0 0 200 210" aria-hidden="true"><path d="M82 178 L100 205 L118 178 Z" fill="#8a5a33"/><ellipse cx="34" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(14 34 128)"/><ellipse cx="166" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(-14 166 128)"/><ellipse cx="100" cy="118" rx="66" ry="72" fill="#a06a3b"/><ellipse cx="100" cy="140" rx="44" ry="46" fill="#fdeed3"/><path d="M52 44 Q40 14 62 22 Q74 27 70 48 Z" fill="#8a5a33"/><path d="M148 44 Q160 14 138 22 Q126 27 130 48 Z" fill="#8a5a33"/><circle cx="100" cy="72" r="52" fill="#a06a3b"/><ellipse cx="78" cy="74" rx="24" ry="26" fill="#fdeed3"/><ellipse cx="122" cy="74" rx="24" ry="26" fill="#fdeed3"/><circle cx="78" cy="72" r="11" fill="#17324f"/><circle cx="122" cy="72" r="11" fill="#17324f"/><circle cx="82" cy="68" r="4" fill="#fff"/><circle cx="126" cy="68" r="4" fill="#fff"/><circle cx="56" cy="94" r="8" fill="#ffb59d" opacity=".85"/><circle cx="144" cy="94" r="8" fill="#ffb59d" opacity=".85"/><path d="M90 88 Q100 84 110 88 Q106 102 100 104 Q94 102 90 88 Z" fill="#ff9f1c" stroke="#e07f00" stroke-width="1.5"/></svg>
      </button>
      <div id="promptBubble" aria-live="polite">🍕 <b>HOOT'S 3D PIZZA SHOP!</b> Tap the dough to stretch and toss it high!</div>
    </div>
    <div class="hud-right">
      <div id="chefBadges" aria-label="Hungry customers served">
        <button type="button" class="cbadge active-cust" data-ci="0" title="Bunny's Order">🐰<span class="cbadge-check" hidden>✓</span></button>
        <button type="button" class="cbadge" data-ci="1" title="Puppy's Order">🐶<span class="cbadge-check" hidden>✓</span></button>
        <button type="button" class="cbadge" data-ci="2" title="Kitten's Order">🐱<span class="cbadge-check" hidden>✓</span></button>
        <button type="button" class="cbadge" data-ci="3" title="Bear's Party Pizza">🐻<span class="cbadge-check" hidden>✓</span></button>
      </div>
      <div id="starPill">⭐ <span id="starCount">0</span></div>
      <button id="doneBtn" type="button">🏆 Done</button>
    </div>
  </div>

  <!-- Visual Order Ticket (picture-first for age 2-4!) -->
  <div id="orderTicket" aria-label="Customer visual pizza order">
    <div class="ticket-head"><span id="ticketTitle">🐰 Bunny's Pizza</span><span id="ticketBadge">📋</span></div>
    <div class="ticket-list" id="ticketList"></div>
  </div>

  <!-- Big Oven Timer Banner -->
  <div id="ovenBanner" aria-live="assertive">🔥 3</div>

  <!-- Phase Action Controls (BAKE / SERVE / NEXT ORDER) -->
  <div id="actionStage">
    <button id="bakeBtn" class="hero-action-btn" type="button" hidden><span>🔥 BAKE PIZZA!</span><span class="tap-finger" aria-hidden="true">👆</span></button>
    <button id="serveBtn" class="hero-action-btn" type="button" hidden><span>🔔 SERVE PIZZA!</span><span class="tap-finger" aria-hidden="true">👆</span></button>
    <button id="nextOrderBtn" class="hero-action-btn" type="button" hidden><span>🍕 Next: 🐶 Puppy!</span><span class="tap-finger" aria-hidden="true">👆</span></button>
  </div>

  <!-- Bottom Ingredient Tray & Controls -->
  <div id="kitchenBar" role="group" aria-label="Pizza ingredients and kitchen tools">
    <div id="traySlots"></div>
    <div class="kitchen-controls">
      <button type="button" id="modeBtn" class="k-pill">📋 Orders</button>
      <button type="button" id="bellCtrlBtn" class="k-pill">🔔 Ding!</button>
    </div>
  </div>

  <!-- Win Overlay -->
  <div id="winOverlay" hidden>
    <div class="win-card">
      <div class="win-trophy" aria-hidden="true">🍕👑🐰🐶🐱🐻</div>
      <h2>Master Pizza Chef!</h2>
      <p id="winSummary">You tossed dough high in the air, swirled yummy sauces, counted 3D toppings, baked in the roaring brick oven, sliced, and served our hungry friends!</p>
      <div class="win-btns">
        <button id="againBtn" class="big-play" type="button">↻ Cook Again</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================================
     1. VOICE ENGINE (100% Real Studio Hoot Clips, Atomic Generation Guard)
     ========================================================================= */
  var voiceA = new Audio();
  var voiceGen = 0, lastStepClips = null, idleHelpTimer = null, idleHelpReminded = false;
  var won = false;

  function hasClip(id){
    try{
      if(window.parent && window.parent.HOOT_HAVE && window.parent.HOOT_HAVE[id]) return true;
      if(window.HOOT_HAVE && window.HOOT_HAVE[id]) return true;
    }catch(e){}
    return false;
  }
  function resolveCmd(preferredId, fallbacks){
    if(preferredId && hasClip(preferredId)) return [preferredId];
    return (fallbacks && fallbacks.length) ? fallbacks.slice() : [];
  }
  function clearIdleHelp(){
    if(idleHelpTimer){ clearTimeout(idleHelpTimer); idleHelpTimer = null; }
  }
  function armIdleHelp(){
    clearIdleHelp();
    if(won || !lastStepClips || !lastStepClips.length || idleHelpReminded) return;
    idleHelpTimer = setTimeout(function(){
      if(won || !lastStepClips || !lastStepClips.length) return;
      idleHelpReminded = true;
      playVoice(lastStepClips);
    }, 11500);
  }
  window.addEventListener("pointerdown", function(){
    idleHelpReminded = false;
    armIdleHelp();
  }, true);

  function playVoice(clips){
    if(!clips || !clips.length) return;
    var myGen = ++voiceGen, i = 0;
    voiceA.onended = null; voiceA.onerror = null;
    try{ voiceA.pause(); }catch(e){}
    function step(){
      if(myGen !== voiceGen || i >= clips.length) return;
      var id = clips[i++];
      if(!id){ step(); return; }
      voiceA.src = "assets/voice/" + id + ".mp3";
      voiceA.onended = step; voiceA.onerror = step;
      var p = voiceA.play(); if(p && p.catch) p.catch(function(){});
    }
    step();
  }
  function setStepVoice(preferredId, fallbacks, speakNow){
    var seq = resolveCmd(preferredId, fallbacks);
    lastStepClips = seq;
    idleHelpReminded = false;
    armIdleHelp();
    if(speakNow !== false && seq.length) playVoice(seq);
  }

  /* =========================================================================
     2. TACTILE KITCHEN WEBAUDIO SYNTHESIZER
     ========================================================================= */
  var actx = null;
  function ac(){
    if(!actx){ var A = window.AudioContext || window.webkitAudioContext; if(A) actx = new A(); }

  function drawCover(img, alpha, zoom){
    if(!img || !img.complete || !img.naturalWidth) return false;
    ctx.save();

    var z = zoom || 1.0;
    var sc = Math.max(W / img.naturalWidth, H / img.naturalHeight) * z;
    var dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;

  /* Inverse perspective mapping from screen pointer (sx, sy) to normalized pizza coords (rx, ry) */

    } else if(phase === "cheese"){
      var btnC = document.createElement("button");
      btnC.type = "button"; btnC.className = "ing-btn wanted";
      btnC.style.minWidth = "175px";
      btnC.innerHTML = '<img src="assets/pizza3d/sprite_tool_grater.png' + VER + '" alt="Cheese"><span>Grate Cheese! (' + cheeseShakes + '/3)</span>';
      btnC.addEventListener("pointerdown", function(e){ e.preventDefault(); e.stopPropagation(); shakeCheese(); });
      traySlots.appendChild(btnC);
    } else if(phase === "dough"){
      var btnD = document.createElement("button");
      btnD.type = "button"; btnD.className = "ing-btn wanted";
      btnD.style.minWidth = "185px";
      var rollStep = Math.min(3, Math.floor(doughRoll * 3 + 0.05));
      btnD.innerHTML = '<img src="assets/pizza3d/sprite_tool_rolling_pin.png' + VER + '" style="width:46px;height:28px" alt="Roll"><span>' + (rollStep < 2 ? "Roll Dough! (" + rollStep + "/3)" : "Roll &amp; Toss High! ✨") + '</span>';
      btnD.addEventListener("pointerdown", function(e){ e.preventDefault(); e.stopPropagation(); triggerDoughRollPass(); });
      traySlots.appendChild(btnD);
    } else if(phase === "slice"){
      var cutsLeft = cutDone.filter(function(c){ return !c; }).length;
      var btnS = document.createElement("button");
      btnS.type = "button"; btnS.className = "ing-btn wanted";
      btnS.style.minWidth = "175px";
      btnS.innerHTML = '<img src="assets/pizza3d/sprite_tool_cutter.png' + VER + '" alt="Slice"><span>Slice Pizza! (' + (3 - cutsLeft) + '/3)</span>';
      btnS.addEventListener("pointerdown", function(e){ e.preventDefault(); e.stopPropagation(); performNextSlice(); });
      traySlots.appendChild(btnS);
    } else {
      var info = document.createElement("div");
      info.style.cssText = 'color:#fde68a;font-family:"Fredoka",sans-serif;font-weight:800;font-size:15px;padding:6px 10px;text-align:center;';
      info.textContent = phase === "baking" ? "🔥 Baking flat on the 900°F stone oven hearth…" : (phase === "eating" ? "😋 Nom nom nom! Fresh wood-fired pizza!" : "🍕 Tap the glowing button above!");
      traySlots.appendChild(info);
    }
  }

  /* =========================================================================
     6. STAGE TRANSITIONS (ROLL DOUGH -> SWIRL SAUCE -> GRATE CHEESE -> TOPPINGS -> FLAT OVEN BAKE -> SLICE -> SERVE)
     ========================================================================= */
  function clearSauceMask(){
    smCtx.clearRect(0, 0, PBUF_SZ, PBUF_SZ);
    scCtx.clearRect(0, 0, PBUF_SZ, PBUF_SZ);
  }

  function startNewOrder(speakNow){
    roundGen++;
    phase = "dough";
    doughTaps = 0; doughRoll = 0; doughMilestones = 0; doughScale = 0.52; doughTossT = 0; doughSpinAngle = 0; doughBounce = 0.5;
    rollingPinPos = -0.18; rollingPinSpin = 0; rollingDragging = false; rollAutoAnim = null; rollSfxCd = 0;
    var cust = CUSTOMERS[custIdx % CUSTOMERS.length];
    activeSauce = "red";
    saucePct = 0; clearSauceMask(); ladleShowT = 0; swipingSauce = false; ladleSwipeAnim = null;
    cheeseShakes = 0; fallingCheese = []; graterTiltT = 0;
    placedToppings = []; flyingToppings = []; draggedTop = null;
    bakeProgress = 0; ovenTimerT = 0; ovenBubbles = []; steamWisps = []; ovenEmbers = [];
    cutDone = [false, false, false]; cutterAnim = null; swipingCut = false;
    serveAnimT = 0; slicesEaten = 0; liftedSlice = null; custHopT = 1.0; custFlipT = 0; hootBounceT = 0.8;

    bakeBtn.hidden = true; serveBtn.hidden = true; nextOrderBtn.hidden = true;
    ovenBanner.classList.remove("show");
    updateChefBadges();
    renderOrderTicket();
    renderTray();

    bubble.innerHTML = cust.emo + " <b>" + cust.name.toUpperCase() + " WANTS PIZZA!</b> Rub or tap to <b>ROLL THE DOUGH</b> flat and <b>TOSS IT HIGH!</b>";
    setStepVoice("hoot-piz-welcome", ["hoot-ready-go", "hoot-tap-big-btn"], speakNow !== false);
  }

  /* Continuous realistic rolling-pin flattening progression (driven by BOTH finger drag AND animated tap roll!) */
  function advanceDoughRoll(deltaRoll){
    if(phase !== "dough" || doughTossT > 0) return;
    doughRoll = Math.min(1, doughRoll + deltaRoll);
    doughScale = 0.52 + doughRoll * 0.46;
    var pg = getPizzaGeom();
    if(rollSfxCd <= 0){
      sfxWoodRoll();
      rollSfxCd = 0.28;
      spawnFlourPuff(pg.cx + (Math.random() - 0.5) * pg.r * doughScale, pg.cy + rollingPinPos * pg.r * pg.tiltY * 0.7, 5);
    }
    if(doughRoll >= 0.34 && doughMilestones < 1){
      doughMilestones = 1; doughTaps = 1; hootBounceT = 0.65;
      sfxPlop(1); playVoice(["name-number-1"]);
      spawnFloatText(pg.cx, pg.cy - pg.r * pg.tiltY * 0.9, "🥖 ROLLING!", "#fde047");
      renderTray();
    } else if(doughRoll >= 0.68 && doughMilestones < 2){
      doughMilestones = 2; doughTaps = 2; hootBounceT = 0.65;
      sfxPlop(2); playVoice(resolveCmd("hoot-piz-toss", ["name-number-2"]));
      spawnFloatText(pg.cx, pg.cy - pg.r * pg.tiltY * 0.9, "✨ FLATTER!", "#fde047");
      renderTray();
    } else if(doughRoll >= 0.99 && doughMilestones < 3){
      doughMilestones = 3; doughTaps = 3; rollAutoAnim = null; rollingDragging = false;
      doughTossT = 0.001;
      sfxTossWhoosh();
      playVoice(["name-number-3"]);
      spawnFlourPuff(pg.cx, pg.cy, 16);
      spawnSparkles(pg.cx, pg.cy - 20, 18, ["#fde047", "#fffbeb", "#fb923c"], 210);
      spawnFloatText(pg.cx, pg.cy - pg.r * pg.tiltY, "🍕 BIG TOSS!!", "#fde047");
    }
  }

  /* Smooth physical back-and-forth wooden rolling-pin animation pass (for tapping dough or button!) */
  function triggerDoughRollPass(){
    if(phase !== "dough" || doughTossT > 0) return;
    var nextGoal = doughRoll < 0.33 ? 0.36 : (doughRoll < 0.67 ? 0.70 : 1.0);
    rollAutoAnim = { t: 0, startRoll: doughRoll, targetRoll: nextGoal, dir: (doughMilestones % 2 === 0 ? 1 : -1) };
    sfxWoodRoll();
  }

  function enterSauceStage(){
    phase = "sauce";
    activeSauce = "red";
    clearSauceMask();
    ladleSwipeAnim = null;
    renderOrderTicket();
    renderTray();
    if(freePlay){
      bubble.innerHTML = "🍅 <b>SWIRL THE SAUCE!</b> Pick Marinara, Pesto, or Garlic and swirl it over the dough!";
      setStepVoice("hoot-piz-sauce", ["hoot-tap-big-btn"], true);
    } else {
      bubble.innerHTML = "🍅 <b>SWIRL THE RED SAUCE!</b> Rub or tap the dough to spread glossy <b>Red Marinara Sauce</b>!";
      setStepVoice("hoot-piz-sauce", ["hoot-tap-big-btn"], true);
    }
  }

  function stampSauceBrush(rx, ry, radiusNorm){
    var bx = (0.5 + rx * 0.5) * PBUF_SZ;
    var by = (0.5 + ry * 0.5) * PBUF_SZ;
    var br = (radiusNorm || 0.30) * PBUF_SZ * 0.5;
    var g = smCtx.createRadialGradient(bx, by, br * 0.22, bx, by, br);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.68, "rgba(255,255,255,0.88)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    smCtx.fillStyle = g;
    smCtx.beginPath(); smCtx.arc(bx, by, br, 0, Math.PI * 2); smCtx.fill();
  }

  /* Trigger a smooth circular spiral ladle sweep across the dough when tapped! */
  function triggerSauceSwirlPass(){
    if(phase !== "sauce") return;
    var baseAng = saucePct * Math.PI * 5.0;
    ladleSwipeAnim = { t: 0, a0: baseAng, a1: baseAng + Math.PI * 1.15, r0: 0.14 + saucePct * 0.42, r1: Math.min(0.68, 0.32 + saucePct * 0.45) };
    sfxSauceSwirl();
  }

  function addSauceAt(x, y, pctStep){
    if(phase !== "sauce") return;
    var pg = getPizzaGeom();
    var p = screenToPizza(x, y, pg);
    var rx = p.rx, ry = p.ry;
    if(p.dist > 0.72){ rx = (rx / p.dist) * 0.72; ry = (ry / p.dist) * 0.72; }
    ladleX = pg.cx + rx * pg.r;
    ladleY = pg.cy + ry * pg.r * pg.tiltY;
    ladleShowT = 0.75;

    stampSauceBrush(rx, ry, 0.42 + Math.random() * 0.12);
    saucePct = Math.min(1, saucePct + (pctStep || 0.14));
    renderOrderTicket();

    if(saucePct >= 0.78){
      saucePct = 1.0;
      ladleSwipeAnim = null;
      sfxPlop(5);
      var sObj = SAUCES.find(function(s){ return s.key === activeSauce; }) || SAUCES[0];
      spawnSparkles(pg.cx, pg.cy, 16, [sObj.hi, "#fde047", "#ffffff"], 180);
      spawnFloatText(pg.cx, pg.cy - pg.r * pg.tiltY * 0.9, "🍅 YUMMY SAUCE!", "#fde047");
      var myGen = roundGen;
      setTimeout(function(){ if(myGen === roundGen && phase === "sauce" && !won) enterCheeseStage(); }, 540);
    }
  }

  function enterCheeseStage(){
    phase = "cheese";
    cheeseShakes = 0;
    fallingCheese = [];
    renderOrderTicket();
    renderTray();
    bubble.innerHTML = "🧀 <b>SPRINKLE MELTING CHEESE!</b> Tap the pizza or grater <b>3 times</b>!";
    setStepVoice("hoot-piz-cheese", ["hoot-tap-big-btn"], true);
  }

  function shakeCheese(){
    if(phase !== "cheese") return;
    cheeseShakes++;
    graterTiltT = 1.0;
    hootBounceT = 0.7;
    var pg = getPizzaGeom();
    sfxPlop(cheeseShakes + 1);
    playVoice(["name-number-" + cheeseShakes]);
    /* Spawn fluttering delicate mozzarella shreds falling from the 3D stainless grater! */
    for(var i = 0; i < 28; i++){
      var a = Math.random() * Math.PI * 2, rad = Math.sqrt(Math.random()) * 0.72;
      fallingCheese.push({
        x0: pg.cx + pg.r * 0.35 + (Math.random() - 0.5) * 55,
        y0: pg.cy - pg.r * pg.tiltY * 0.95 + (Math.random() - 0.5) * 24,
        x1: pg.cx + Math.cos(a) * pg.r * rad,
        y1: pg.cy + Math.sin(a) * pg.r * pg.tiltY * rad,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 8,
        len: 10 + Math.random() * 9,
        t: 0,
        gold: masterChefUnlocked && i % 5 === 0
      });
    }
    spawnSparkles(pg.cx, pg.cy - 10, 14, ["#fef9c3", "#fde047", "#ffffff"], 170);
    spawnFloatText(pg.cx, pg.cy - pg.r * pg.tiltY * 0.85, "🧀 " + cheeseShakes + "!", "#fde047");
    renderTray();

    if(cheeseShakes >= 3){
      var myGen = roundGen;
      setTimeout(function(){ if(myGen === roundGen && phase === "cheese" && !won) enterToppingsStage(); }, 680);
    }
  }

  function enterToppingsStage(){
    phase = "toppings";
    var cust = CUSTOMERS[custIdx % CUSTOMERS.length];
    activeTopKey = cust.wants[0] ? cust.wants[0].key : "pep";
    bakeBtn.hidden = !freePlay;
    renderOrderTicket();
    renderTray();
    if(freePlay){
      bubble.innerHTML = "🍄 <b>FREE PLAY!</b> Add any <b>3D Toppings</b> you like, then tap <b>🔥 BAKE PIZZA!</b>";
    } else {
      bubble.innerHTML = "🍄 <b>ADD " + cust.name.toUpperCase() + "'S TOPPINGS!</b> Tap the glowing bowls to count them onto the pizza!";
    }
    setStepVoice("hoot-piz-toppings", ["hoot-tap-big-btn"], true);
  }

  function checkOrderSatisfied(){
    if(freePlay) return placedToppings.length + flyingToppings.length >= 1;
    var cust = CUSTOMERS[custIdx % CUSTOMERS.length];
    return cust.wants.every(function(w){ return countPlaced(w.key) >= w.count; });
  }

  function tossToppingOntoPizza(topKey, fromX, fromY, targetRx, targetRy){
    if(phase !== "toppings") return;
    var pg = getPizzaGeom();
    var rx = targetRx, ry = targetRy;
    if(rx === undefined || ry === undefined){
      var idx = placedToppings.length + flyingToppings.length;
      var ang = idx * 2.39996 + (Math.random() - 0.5) * 0.32;
      var rad = Math.min(0.66, 0.22 + Math.sqrt((idx % 12) + 1) * 0.135);
      rx = Math.cos(ang) * rad;
      ry = Math.sin(ang) * rad;
    }
    var countNow = countPlaced(topKey) + 1;
    totalStars++; starCountEl.textContent = String(totalStars);
    sfxPlop(countNow);
    if(countNow <= 10) playVoice(["name-number-" + countNow]);

    var tx = pg.cx + rx * pg.r, ty = pg.cy + ry * pg.r * pg.tiltY;
    flyingToppings.push({
      key: topKey, x0: fromX, y0: fromY, cx: (fromX + tx) * 0.5, cy: Math.min(fromY, ty) - 105,
      x1: tx, y1: ty, rx: rx, ry: ry, rot: (Math.random() - 0.5) * 1.4, t: 0, num: countNow
    });
    renderOrderTicket();
    renderTray();

    if(!freePlay && checkOrderSatisfied()){
      var myGen = roundGen;
      setTimeout(function(){ if(myGen === roundGen && phase === "toppings" && !won) enterBakeReadyStage(); }, 760);
    } else if(freePlay){
      bakeBtn.hidden = false;
    }
  }

  function enterBakeReadyStage(){
    phase = "bake";
    bakeBtn.hidden = false;
    renderOrderTicket();
    renderTray();
    bubble.innerHTML = "🔥 <b>READY TO BAKE!</b> Tap <b>🔥 BAKE PIZZA!</b> to slide it into the roaring brick oven!";
    setStepVoice("hoot-piz-bake", ["hoot-ready-go", "hoot-tap-big-btn"], true);
  }

  function startBakingStage(){
    if(phase !== "bake" && !(phase === "toppings" && freePlay)) return;
    var myGen = roundGen;
    phase = "baking";
    bakeBtn.hidden = true;
    bakeProgress = 0; ovenTimerT = 0; ovenBubbles = []; steamWisps = []; ovenEmbers = [];
    /* Seed realistic drifting brick-oven wood embers */
    for(var ei = 0; ei < 26; ei++){
      ovenEmbers.push({
        x: W * (0.48 + Math.random() * 0.44),
        y: H * (0.36 + Math.random() * 0.24),
        vx: -18 - Math.random() * 35,
        vy: -32 - Math.random() * 68,
        r: 1.4 + Math.random() * 2.2,
        life: Math.random(),
        phase: Math.random() * Math.PI * 2
      });
    }
    renderOrderTicket();
    renderTray();
    sfxOvenSizzle(3.6);
    bubble.innerHTML = "🔥 <b>SIZZLING IN THE BRICK OVEN!</b> Watch the crust brown and the mozzarella bubble!";
    playVoice(resolveCmd("hoot-piz-baking", ["hoot-super"]));

    var steps = [
      { ms: 700,  txt: "🔥 3", clip: null },
      { ms: 1650, txt: "🔥 2", clip: null },
      { ms: 2600, txt: "🔥 1", clip: null },
      { ms: 3500, txt: "🔔 DING!!", clip: "ding" }
    ];
    steps.forEach(function(s){
      setTimeout(function(){
        if(myGen !== roundGen || won || phase !== "baking") return;
        ovenBanner.textContent = s.txt;
        ovenBanner.classList.remove("show"); void ovenBanner.offsetWidth;
        ovenBanner.classList.add("show");
        if(s.clip === "ding"){
          sfxBellDing();
          setTimeout(function(){
            ovenBanner.classList.remove("show");
            if(myGen === roundGen && phase === "baking" && !won) enterSliceStage();
          }, 760);
        } else {
          sfxPlop(2);
        }
      }, s.ms);
    });
  }

  function enterSliceStage(){
    phase = "slice";
    bakeProgress = 1.0;
    cutDone = [false, false, false];
    renderOrderTicket();
    renderTray();
    var pg = getPizzaGeom();
    spawnSparkles(pg.cx, pg.cy, 20, ["#fde047", "#fb923c", "#ffffff"], 200);
    bubble.innerHTML = "🍕 <b>HOT OUT OF THE OVEN!</b> Swipe or tap the glowing guide to <b>SLICE THE PIZZA</b>!";
    setStepVoice("hoot-piz-slice", ["hoot-tap-big-btn"], true);
  }

  function performNextSlice(){
    if(phase !== "slice") return;
    var idx = cutDone.indexOf(false);
    if(idx < 0) return;
    cutDone[idx] = true;
    var ang = cutAngles[idx];
    cutterAnim = { ang: ang, t: 0 };
    sfxSliceCrunch();
    var cutNum = cutDone.filter(Boolean).length;
    playVoice(["name-number-" + cutNum]);
    var pg = getPizzaGeom();
    spawnSparkles(pg.cx, pg.cy, 14, ["#fde047", "#ffffff", "#fb923c"], 190);
    spawnFloatText(pg.cx, pg.cy - pg.r * pg.tiltY * 0.9, "🔪 SLICE " + cutNum + "!", "#fde047");
    renderTray();
    if(cutDone.every(Boolean)){
      var myGen = roundGen;
      setTimeout(function(){ if(myGen === roundGen && phase === "slice" && !won) enterServeStage(); }, 580);
    }
  }

  function enterServeStage(){
    phase = "serve";
    serveBtn.hidden = false;
    renderTray();
    var cust = CUSTOMERS[custIdx % CUSTOMERS.length];
    bubble.innerHTML = "🔔 <b>DINNER IS SERVED!</b> Tap the shiny <b>SERVE PIZZA</b> bell for " + cust.emo + " <b>" + cust.name + "</b>!";
    setStepVoice("hoot-piz-serve", ["hoot-tap-big-btn"], true);
  }

  function startServingCelebration(){
    if(phase !== "serve") return;
    var myGen = roundGen;
    phase = "eating";
    serveBtn.hidden = true;
    serveAnimT = 0; slicesEaten = 0; liftedSlice = { idx: 0, t: 0 };
    sfxBellDing();
    renderTray();
    var cust = CUSTOMERS[custIdx % CUSTOMERS.length];
    bubble.innerHTML = "😋 <b>NOM NOM NOM!</b> " + cust.emo + " <b>" + cust.name + "</b> is loving your hot wood-fired pizza!";

    /* Individual steaming slices lift off the board with gooey stretching mozzarella strings! */
    [650, 1250, 1850].forEach(function(ms, k){
      setTimeout(function(){
        if(myGen !== roundGen || won || phase !== "eating") return;
        slicesEaten = (k + 1) * 2;
        liftedSlice = (k < 2) ? { idx: slicesEaten, t: 0 } : null;
        custHopT = 1.0;
        sfxMunch();
        var cp = getCustomerPos();
        spawnSparkles(cp.x, cp.y, 16, ["#f472b6", "#fde047", "#4ade80", "#ffffff"], 195);
        spawnFloatText(cp.x, cp.y - cp.h * 0.55, k === 0 ? "😋 NOM!" : k === 1 ? "❤️ YUM!" : "⭐ SO GOOD!", "#fde047");
      }, ms);
    });

    setTimeout(function(){
      if(myGen !== roundGen || won) return;
      phase = "celebrated";
      servedCusts[custIdx % CUSTOMERS.length] = true;
      totalStars += 5; starCountEl.textContent = String(totalStars);
      custFlipT = 1.2; hootBounceT = 1.2;
      updateChefBadges();
      sfxCheer();

      var allFour = CUSTOMERS.every(function(_, i){ return !!servedCusts[i]; });
      var justMaster = allFour && !masterChefUnlocked;
      if(justMaster) masterChefUnlocked = true;

      var cp = getCustomerPos();
      spawnSparkles(cp.x, cp.y, 42, ["#fde047", "#f472b6", "#38bdf8", "#4ade80", "#fb923c", "#ffffff"], 310);
      spawnShockwave(cp.x, cp.y, "#fde047", 230);

      var nextCust = CUSTOMERS[(custIdx + 1) % CUSTOMERS.length];
      var lbl = nextOrderBtn.querySelector("span");
      if(lbl) lbl.textContent = "🍕 Next: " + nextCust.emo + " " + nextCust.name + "!";
      nextOrderBtn.hidden = false;
      renderTray();

      if(justMaster){
        bubble.innerHTML = "👑 <b>MASTER PIZZA CHEF!</b> You served all 4 friends &amp; unlocked the ✨ <b>GOLDEN CHEF CROWN + GOLD CHEESE!</b>";
        setStepVoice("hoot-piz-master-chef", ["hoot-win-star"], true);
      } else {
        bubble.innerHTML = "🎉 <b>DELICIOUS! +5 ⭐!</b> " + cust.emo + " <b>" + cust.name + "</b> loved it! Tap for " + nextCust.emo + " <b>" + nextCust.name + "'s</b> pizza!";
        setStepVoice("hoot-piz-yummy", ["hoot-win-star"], true);
      }
    }, 2250);
  }

  /* =========================================================================
     7. BUTTONS & 3D PERSPECTIVE CANVAS POINTER CONTROLS
     ========================================================================= */
  bakeBtn.addEventListener("pointerdown", function(e){ e.preventDefault(); e.stopPropagation(); startBakingStage(); });
  serveBtn.addEventListener("pointerdown", function(e){ e.preventDefault(); e.stopPropagation(); startServingCelebration(); });
  nextOrderBtn.addEventListener("pointerdown", function(e){
    e.preventDefault(); e.stopPropagation();
    if(phase !== "celebrated") return;
    custIdx = (custIdx + 1) % CUSTOMERS.length;
    startNewOrder(true);
  });
  modeBtn.addEventListener("click", function(){
    freePlay = !freePlay;
    modeBtn.textContent = freePlay ? "🎨 Free Play" : "📋 Orders";
    if(!freePlay) activeSauce = "red";
    sfxPlop(3);
    renderOrderTicket();
    renderTray();
    if(phase === "toppings") bakeBtn.hidden = !freePlay && !checkOrderSatisfied();
  });
  document.getElementById("bellCtrlBtn").addEventListener("pointerdown", function(e){
    e.preventDefault(); e.stopPropagation();
    sfxBellDing(); custHopT = 0.9; hootBounceT = 0.9;
    var cp = getCustomerPos();
    spawnSparkles(cp.x, cp.y, 16, ["#fde047", "#ffffff"], 180);
    spawnFloatText(W * 0.5, H * 0.34, "🔔 DING-DING!", "#fde047");
  });
  document.getElementById("hootBtn").addEventListener("click", function(){
    if(lastStepClips && lastStepClips.length) playVoice(lastStepClips);
  });
  document.querySelectorAll(".cbadge").forEach(function(b){
    b.addEventListener("click", function(){
      custIdx = parseInt(b.getAttribute("data-ci"), 10) || 0;
      sfxPlop(2);
      startNewOrder(true);
    });
  });
  document.getElementById("doneBtn").addEventListener("click", function(){
    roundGen++; won = true; clearIdleHelp(); ovenBanner.classList.remove("show");
    var servedCnt = Object.keys(servedCusts).length;
    document.getElementById("winSummary").textContent = servedCnt >= 4
      ? "You served all 4 hungry friends, unlocked the Golden Master Chef Crown, and earned " + totalStars + " stars!"
      : "Awesome pizza cooking! You served " + servedCnt + " happy " + (servedCnt === 1 ? "friend" : "friends") + " and earned " + totalStars + " stars!";
    winOverlay.hidden = false;
    playVoice(["hoot-win-star"]);
  });
  document.getElementById("againBtn").addEventListener("click", function(){
    won = false; winOverlay.hidden = true;
    startNewOrder(true);
  });

  canvas.addEventListener("pointerdown", function(e){
    e.preventDefault();
    var cx = e.clientX, cy = e.clientY, pg = getPizzaGeom();
    var hit = screenToPizza(cx, cy, pg);

    if(phase === "dough"){
      if(hit.dist < 1.35){
        rollingDragging = true;
        lastRollY = cy;
        triggerDoughRollPass();
        return;
      }
    } else if(phase === "sauce"){
      if(hit.dist < 1.15){ swipingSauce = true; addSauceAt(cx, cy, 0.16); sfxSauceSwirl(); return; }
    } else if(phase === "cheese"){

  /* Composite the complete high-resolution 512x512 photorealistic pizza texture onto pizzaBuf */
  function compositePizzaTexture(){
    var S = PBUF_SZ, half = S * 0.5;
    pCtx.clearRect(0, 0, S, S);

    if(ART.crust && ART.crust.complete && ART.crust.naturalWidth){

    }
    if(bakeProgress > 0.01 && ART.crustBaked && ART.crustBaked.complete && ART.crustBaked.naturalWidth){
      pCtx.save();
      pCtx.globalAlpha = Math.min(1, bakeProgress);
      pCtx.drawImage(ART.crustBaked, 0, 0, S, S);
      pCtx.restore();
    }

    /* 2. Progressive PBR Glossy Chunky Marinara / Pesto / Garlic Sauce */
    if(saucePct > 0){
      var sImg = ART["sauce_" + activeSauce] || ART.sauce_red;
      if(sImg && sImg.complete && sImg.naturalWidth){
        var pad = S * 0.068, sw = S - pad * 2;
        if(saucePct >= 0.99){
          pCtx.drawImage(sImg, pad, pad, sw, sw);
        } else {
          scCtx.clearRect(0, 0, S, S);
          scCtx.globalCompositeOperation = "source-over";
          scCtx.drawImage(sauceMaskBuf, 0, 0);
          scCtx.globalCompositeOperation = "source-in";
          scCtx.drawImage(sImg, pad, pad, sw, sw);
          scCtx.globalCompositeOperation = "source-over";
          pCtx.drawImage(sauceCompBuf, 0, 0);
        }
      }
    }

    /* 3. Snowy-Ivory Shredded Mozzarella -> Melts smoothly into Bubbling Golden-Blistered Mozzarella! */
    if(cheeseShakes > 0){
      var padC = S * 0.075, cw = S - padC * 2;
      if(ART.cheeseRaw && ART.cheeseRaw.complete && ART.cheeseRaw.naturalWidth){
        var rawAlpha = Math.min(1, cheeseShakes === 1 ? 0.45 : (cheeseShakes === 2 ? 0.78 : 1.0));
        var meltFade = Math.max(0, 1 - bakeProgress * 1.15);
        if(rawAlpha * meltFade > 0.01){
          pCtx.save();
          pCtx.globalAlpha = rawAlpha * meltFade;
          pCtx.drawImage(ART.cheeseRaw, padC, padC, cw, cw);
          /* Optional sparkly gold cheese flecks once Master Chef unlocked */
          if(masterChefUnlocked){
            pCtx.globalCompositeOperation = "lighter";
            pCtx.globalAlpha = rawAlpha * meltFade * 0.25;
            pCtx.fillStyle = "#fde047";
            pCtx.beginPath(); pCtx.arc(half, half, S * 0.34, 0, Math.PI * 2); pCtx.fill();
          }
          pCtx.restore();
        }
      }
      if(bakeProgress > 0.04 && ART.cheeseMelted && ART.cheeseMelted.complete && ART.cheeseMelted.naturalWidth){
        pCtx.save();
        pCtx.globalAlpha = Math.min(1, bakeProgress * 1.15);
        pCtx.drawImage(ART.cheeseMelted, padC, padC, cw, cw);
        pCtx.restore();
      }
    }

    /* 4. Real Pixar & PBR 3D Toppings with directional contact shadows & oven sizzle */
    var topSz = S * 0.175;
    placedToppings.forEach(function(pt){
      drawToppingOnCtx(pCtx, pt.key, half + pt.rx * half, half + pt.ry * half, topSz, pt.rot, bakeProgress);
    });

    /* 5. Live Translucent Bubbling Mozzarella Blisters during Brick-Oven Baking */
    if(bakeProgress > 0.25 && ovenBubbles.length){
      pCtx.save();
      ovenBubbles.forEach(function(ob){
        var bx = half + ob.rx * half, by = half + ob.ry * half;
        var br = ob.r * 1.7 * (1.25 - ob.life * 0.45);
        var bg = pCtx.createRadialGradient(bx - br * 0.25, by - br * 0.25, 1, bx, by, br);
        bg.addColorStop(0, "rgba(255,253,240," + (ob.life * 0.82).toFixed(2) + ")");
        bg.addColorStop(0.65, "rgba(245,197,96," + (ob.life * 0.55).toFixed(2) + ")");
        bg.addColorStop(1, "rgba(180,83,9,0)");
        pCtx.fillStyle = bg;
        pCtx.beginPath(); pCtx.arc(bx, by, br, 0, Math.PI * 2); pCtx.fill();
      });
      pCtx.restore();
    }
  }

  /* Draw realistic 3D extruded puffed pizza crust side-wall beneath the flat top pizza surface! */
  function drawCrustSideWall(cx, cy, rx, ry, wallH, bakedAmt, inOven){
    var layers = Math.max(4, Math.round(wallH));
    for(var ly = layers; ly >= 1; ly--){
      var frac = ly / layers; /* 1 = bottom touching stone/peel, 0 = top rim */
      /* Raw dough warm ivory-tan -> golden toasted chestnut crust as bakeProgress increases! */
      var r = Math.round((214 - bakedAmt * 48) * (1 - frac * 0.38));
      var g = Math.round((176 - bakedAmt * 82) * (1 - frac * 0.44));
      var b = Math.round((122 - bakedAmt * 84) * (1 - frac * 0.50));
      ctx.save();
      var wg = ctx.createLinearGradient(cx - rx, cy, cx + rx, cy);
      if(inOven){

        wg.addColorStop(0, "rgb(" + Math.round(r * 0.58) + "," + Math.round(g * 0.50) + "," + Math.round(b * 0.44) + ")");
        wg.addColorStop(0.55, "rgb(" + r + "," + g + "," + b + ")");
        wg.addColorStop(1, "rgb(" + Math.min(255, Math.round(r * 1.28 + 24)) + "," + Math.min(240, Math.round(g * 1.10 + 12)) + "," + Math.round(b * 0.78) + ")");
      } else {
        wg.addColorStop(0, "rgb(" + Math.min(255, Math.round(r * 1.12)) + "," + Math.min(245, Math.round(g * 1.08)) + "," + Math.min(230, Math.round(b * 1.02)) + ")");
        wg.addColorStop(0.7, "rgb(" + r + "," + g + "," + b + ")");
        wg.addColorStop(1, "rgb(" + Math.round(r * 0.72) + "," + Math.round(g * 0.66) + "," + Math.round(b * 0.60) + ")");
      }
      ctx.fillStyle = wg;
      /* Slight outward puff bulge halfway up the cornicione rim! */
      var bulge = 1.0 + Math.sin(frac * Math.PI) * 0.025;
      ctx.beginPath();
      ctx.ellipse(cx, cy + ly, rx * bulge, ry * bulge, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawWoodPeelAndPizza(){
    if(phase === "celebrated") return;
    var pg = getPizzaGeom();
    var px = pg.cx, py = pg.cy, pr = pg.r, tiltY = pg.tiltY;
    var drawScale = 1.0;

    /* 0. BRICK OVEN SLIDE-IN & SCOOP-OUT PEEL PHYSICS (100% flat on the terracotta stone hearth!) */
    var ovenPizzaOffsetY = 0;
    var ovenPeelOffsetY = H * 0.55; /* hidden off bottom by default during mid-bake */
    var showOvenPeel = false;
    if(phase === "baking"){
      if(ovenTimerT < 0.55){
        /* Sliding pizza IN on the wooden oven peel! */
        var uIn = ovenTimerT / 0.55;
        var easeIn = 1 - Math.pow(1 - uIn, 3);
        ovenPizzaOffsetY = (1 - easeIn) * H * 0.28;
        ovenPeelOffsetY = ovenPizzaOffsetY;
        showOvenPeel = true;
      } else if(ovenTimerT < 1.0){
        /* Quick pizzaiolo flick — pizza stays flat on hot brick stone while peel pulls cleanly out! */
        var uOut = (ovenTimerT - 0.55) / 0.45;
        ovenPeelOffsetY = uOut * uOut * H * 0.48;
        showOvenPeel = true;
      } else if(ovenTimerT > 3.45){
        /* DING! Wooden oven peel slides back under golden bubbling pizza to scoop it out! */
        var uScoop = Math.min(1, (ovenTimerT - 3.45) / 0.45);
        var easeS = 1 - Math.pow(1 - uScoop, 3);
        ovenPeelOffsetY = (1 - easeS) * H * 0.45;
        showOvenPeel = true;
      }
      py += ovenPizzaOffsetY;
    }

    /* 1. REAL FLAT-PERSPECTIVE 3D BEVELED HONEY-OAK WOODEN PEEL ON KITCHEN COUNTER */
    if(phase !== "baking"){
      if(ART.peel3d && ART.peel3d.complete && ART.peel3d.naturalWidth){
        /* New flat-perspective sprite_peel_3d.png (1024x600) paddle center at (430, 286), rx = 346, ry/rx = 0.50 */
        var peelSc = (pr * 1.15) / 346.0;
        var peelScaleY = peelSc * (tiltY / 0.50);
        ctx.drawImage(ART.peel3d, px - 430 * peelSc, py - 286 * peelScaleY, 1024 * peelSc, 600 * peelScaleY);
      }
    } else if(showOvenPeel && ART.peelOven && ART.peelOven.complete && ART.peelOven.naturalWidth){
      /* Wooden brick-oven peel sliding right along the stone floor beneath the pizza! */
      var opSc = (pr * 1.16) / 250.0;
      ctx.save();
      ctx.shadowColor = "rgba(18,5,1,0.55)"; ctx.shadowBlur = 18; ctx.shadowOffsetY = 10;
      ctx.drawImage(ART.peelOven, px - 320 * opSc, (pg.cy + ovenPeelOffsetY) - 190 * opSc + 12, 640 * opSc, 480 * opSc);
      ctx.restore();
    }

    /* 2. GROUNDED CONTACT SHADOW (Directional wood-fire cast shadow to the LEFT inside the brick oven!) */
    var tossArc = doughTossT > 0 ? Math.sin(doughTossT * Math.PI) : 0;
    var crustWallH = (phase === "baking")
      ? (11 + bakeProgress * 7) /* Dough genuinely puffs taller in 900°F wood-fired heat! */
      : (phase === "dough" ? (8 - doughRoll * 2) : (8 + bakeProgress * 3));
    var shRad = pr * (phase === "dough" ? Math.max(0.55, doughScale * 1.02) : 1.04) * drawScale * (1 - tossArc * 0.32);
    ctx.save();
    if(phase === "baking"){
      /* Real soft directional shadow thrown smoothly to the LEFT away from the right-side fire (zero outer edge halo!) */
      var shO = ctx.createRadialGradient(px - 18, py + crustWallH + 2, shRad * 0.25, px - 18, py + crustWallH + 2, shRad * 1.18);
      shO.addColorStop(0, "rgba(18,5,1,0.72)");
      shO.addColorStop(0.55, "rgba(20,6,1,0.44)");
      shO.addColorStop(0.82, "rgba(20,6,1,0.12)");
      shO.addColorStop(1, "rgba(20,6,1,0)");
      ctx.fillStyle = shO;
      ctx.beginPath(); ctx.ellipse(px - 18, py + crustWallH + 2, shRad * 1.18, shRad * tiltY * 1.16, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      var shG = ctx.createRadialGradient(px + 4, py + crustWallH + 2, shRad * 0.50, px + 4, py + crustWallH + 4, shRad * 1.12);
      shG.addColorStop(0, "rgba(24,8,2," + (0.48 * (1 - tossArc * 0.65)).toFixed(2) + ")");
      shG.addColorStop(1, "rgba(24,8,2,0)");
      ctx.fillStyle = shG;
      ctx.beginPath(); ctx.ellipse(px + 4, py + crustWallH + 4, shRad * 1.12, shRad * tiltY * 1.12, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    /* 3. STAGE 1: REAL ROLLING PIN ROLLING MOTION (PLUMP DOUGH BALL -> ROLLED FLAT DISC -> 3D AIR TOSS!) */
    var tossLiftY = -tossArc * Math.min(H * 0.36, 250);
    var spinSquashY = doughTossT > 0 ? (0.46 + 0.54 * Math.abs(Math.cos(doughTossT * Math.PI * 3))) : 1.0;
    var bWave = doughBounce > 0 ? Math.sin(doughBounce * Math.PI * 2.5) * doughBounce * 0.08 : 0;

    if(phase === "dough"){
      var curSc = doughScale + (doughTossT > 0 ? (1 - doughScale) * doughTossT + tossArc * 0.16 : 0);
      /* Plump tall round dough mound smoothly flattens down into flat tabletop perspective as you roll it! */
      var doughTilt = doughTossT > 0 ? tiltY : (0.82 - doughRoll * (0.82 - tiltY));
      var doughYOffset = doughTossT > 0 ? tossLiftY : -((1 - doughRoll) * 14); /* Plump ball stands taller above peel! */

      }

      ctx.translate(px, py + doughYOffset);
      ctx.scale(curSc * (1 + bWave), curSc * (1 - bWave * 0.5) * doughTilt * spinSquashY);
      if(doughTossT > 0) ctx.rotate(doughSpinAngle);
      if(doughRoll < 0.08 && doughTossT === 0 && ART.doughBall && ART.doughBall.complete && ART.doughBall.naturalWidth){
        ctx.drawImage(ART.doughBall, -pr, -pr, pr * 2, pr * 2);
      } else {
        var crustMix = doughTossT > 0 ? 1.0 : Math.min(1, doughRoll * 1.18);
        if(crustMix < 1 && ART.doughBall && ART.doughBall.complete && ART.doughBall.naturalWidth){
          ctx.globalAlpha = 1 - crustMix * 0.65;
          ctx.drawImage(ART.doughBall, -pr, -pr, pr * 2, pr * 2);
        }
        if(ART.crust && ART.crust.complete && ART.crust.naturalWidth){
          ctx.globalAlpha = crustMix;
          ctx.drawImage(ART.crust, -pr * 1.04, -pr * 1.04, pr * 2.08, pr * 2.08);
        }
      }
      ctx.restore();

      /* REAL TURNED BEECHWOOD ROLLING PIN rolling physically back-and-forth across the dough! */
      if(doughTossT === 0 && ART.toolRollingPin && ART.toolRollingPin.complete && ART.toolRollingPin.naturalWidth){
        var pinIdle = (!rollingDragging && !rollAutoAnim) ? Math.sin(tAcc * 3.2) * 0.42 : 0;
        var pinPos = (!rollingDragging && !rollAutoAnim) ? pinIdle : rollingPinPos;

        pSh.addColorStop(1, "rgba(38,16,4,0)");
        ctx.fillStyle = pSh;
        ctx.beginPath();
        ctx.ellipse(px, pinY + pinH * 0.24, pinW * 0.34, pinH * 0.22, 0, 0, Math.PI * 2);

        ctx.translate(px, pinY);
        ctx.rotate(Math.sin(pinPos * 1.4) * 0.035);
        ctx.drawImage(ART.toolRollingPin, -pinW * 0.5, -pinH * 0.5, pinW, pinH);
        /* Subtle animated specular band scrolling vertically across barrel so it visibly SPINS as it rolls! */
        var sheenOff = Math.sin(rollingPinSpin + pinPos * 5.0) * (pinH * 0.14);
        ctx.globalCompositeOperation = "lighter";
        var shL = ctx.createLinearGradient(0, sheenOff - 8, 0, sheenOff + 8);
        shL.addColorStop(0, "rgba(255,248,225,0)");
        shL.addColorStop(0.5, "rgba(255,248,225,0.20)");
        shL.addColorStop(1, "rgba(255,248,225,0)");
        ctx.fillStyle = shL;
        ctx.fillRect(-pinW * 0.28, sheenOff - 8, pinW * 0.56, 16);
        ctx.restore();

        /* Subtle glowing back-and-forth rolling chevrons (▲ / ▼) guiding the rolling motion! */
        if(!rollingDragging && !rollAutoAnim){
          var pulseA = 0.45 + 0.35 * Math.sin(tAcc * 4.5);
          ctx.save();
          ctx.strokeStyle = "rgba(255,248,210," + pulseA.toFixed(2) + ")";
          ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.lineJoin = "round";
          var gTop = py - pr * doughTilt * 0.92 - 10, gBot = py + pr * doughTilt * 0.92 + 10;
          ctx.beginPath(); ctx.moveTo(px - 14, gTop + 8); ctx.lineTo(px, gTop); ctx.lineTo(px + 14, gTop + 8); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(px - 14, gBot - 8); ctx.lineTo(px, gBot); ctx.lineTo(px + 14, gBot - 8); ctx.stroke();
          ctx.restore();
        }

    }

    /* 4. COMPOSITE & DRAW FLAT 3D PERSPECTIVE PIZZA WITH REAL EXTRUDED CRUST SIDE-WALL! */
    compositePizzaTexture();

    var hasAnyCut = cutDone[0] || cutDone[1] || cutDone[2];
    /* Draw 3D puffed crust rim thickness beneath the top surface (skipped only if all slices eaten) */
    if(!(phase === "eating" && slicesEaten >= 6)){

    ctx.save();
    ctx.translate(px, py);
    ctx.scale(drawScale * (1 + bWave), drawScale * (1 - bWave * 0.5) * tiltY);

    if(!hasAnyCut){
      ctx.drawImage(pizzaBuf, -pr * 1.04, -pr * 1.04, pr * 2.08, pr * 2.08);
    } else {
      /* Physical 6-Wedge Pizza Slices with 3D crust thickness edge & separation! */
      var sliceCount = 6;
      var stepA = (Math.PI * 2) / sliceCount;
      for(var sk = 0; sk < sliceCount; sk++){
        if(phase === "eating" && sk < slicesEaten) continue;

        var a0 = sk * stepA, a1 = (sk + 1) * stepA, aMid = (a0 + a1) * 0.5;
        var cutL = cutDone[sk % 3], cutR = cutDone[(sk + 1) % 3];
        var sep = (cutL && cutR) ? 5.5 : ((cutL || cutR) ? 3.0 : 0);
        var ox = Math.cos(aMid) * sep, oy = Math.sin(aMid) * sep;

        /* Subtle 3D bottom crust thickness under each individual slice wedge */
        ctx.save();
        ctx.translate(ox, oy + (crustWallH / tiltY) * 0.65);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, pr * 1.01, a0, a1); ctx.closePath();
        ctx.fillStyle = "rgba(116,58,18,0.88)"; ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(ox, oy);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, pr * 1.08, a0, a1); ctx.closePath();
        ctx.clip();
        ctx.drawImage(pizzaBuf, -pr * 1.04, -pr * 1.04, pr * 2.08, pr * 2.08);
        ctx.restore();
      }

      /* Delicate glossy melted mozzarella strings stretching across freshly cut seams (hidden once slices are lifted so exposed peel is 100% clean!) */
      if(phase !== "eating"){
        cutAngles.forEach(function(ang, ci){
          if(!cutDone[ci]) return;
          ctx.save(); ctx.rotate(ang);
          ctx.strokeStyle = "rgba(38,14,4,0.22)"; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.moveTo(-pr * 0.94, 0); ctx.lineTo(pr * 0.94, 0); ctx.stroke();
          ctx.strokeStyle = "rgba(255,244,196,0.82)"; ctx.lineWidth = 1.8; ctx.lineCap = "round";
          for(var st = -3; st <= 3; st++){
            if(st === 0) continue;
            var sx = st * pr * 0.21;
            ctx.beginPath();
            ctx.moveTo(sx - 4, -5.5);
            ctx.quadraticCurveTo(sx + (st % 2 ? 3 : -3), 0, sx + 4, 5.5);
            ctx.stroke();
          }
          ctx.restore();
        });
      }
    }

    /* Warm flickering brick-oven firelight rim hugging the right side of the flat pizza while baking! */
    if(phase === "baking"){
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      var flkB = 0.26 + Math.sin(tAcc * 11) * 0.08;
      var fireRim = ctx.createRadialGradient(pr * 0.78, -pr * 0.14, pr * 0.08, pr * 0.50, -pr * 0.06, pr * 1.14);
      fireRim.addColorStop(0, "rgba(255,204,96," + flkB.toFixed(2) + ")");
      fireRim.addColorStop(0.55, "rgba(234,88,12," + (flkB * 0.44).toFixed(2) + ")");
      fireRim.addColorStop(1, "rgba(234,88,12,0)");
      ctx.fillStyle = fireRim;
      ctx.beginPath(); ctx.arc(0, 0, pr * 1.04, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    /* Soft Luminous Light-Beam Next-Cut Guide during Slice Stage */
    if(phase === "slice"){
      var nextCut = cutDone.indexOf(false);
      if(nextCut >= 0){
        ctx.save(); ctx.rotate(cutAngles[nextCut]);
        var beamG = ctx.createLinearGradient(-pr * 0.94, 0, pr * 0.94, 0);
        beamG.addColorStop(0, "rgba(255,248,200,0)");
        beamG.addColorStop(0.5, "rgba(255,248,180,0.92)");
        beamG.addColorStop(1, "rgba(255,248,200,0)");
        ctx.strokeStyle = beamG; ctx.lineWidth = 7; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(-pr * 0.94, 0); ctx.lineTo(pr * 0.94, 0); ctx.stroke();
        ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 2.5;
        ctx.setLineDash([12, 10]); ctx.lineDashOffset = -tAcc * 48;
        ctx.beginPath(); ctx.moveTo(-pr * 0.90, 0); ctx.lineTo(pr * 0.90, 0); ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
    }

    ctx.restore();

    /* 4B. INDIVIDUAL STEAMING SLICE LIFTING TO CUSTOMER WITH GOOEY STRETCHING MOZZARELLA STRINGS! */
    if(phase === "eating" && liftedSlice){
      var cpE = getCustomerPos();
      var uL = Math.min(1, liftedSlice.t);
      var easeL = 1 - Math.pow(1 - uL, 2.5);
      var sIdx = liftedSlice.idx % 6;
      var sa0 = sIdx * (Math.PI / 3), sa1 = (sIdx + 1) * (Math.PI / 3);
      var sxNow = px + (cpE.x - px) * easeL;
      var syNow = py + (cpE.y + cpE.h * 0.12 - py) * easeL - Math.sin(uL * Math.PI) * 48;
      var scNow = 1.0 - easeL * 0.34;
      /* Gooey stretching mozzarella threads connecting pie to rising hot slice! */
      if(uL < 0.72){
        ctx.save();
        ctx.strokeStyle = "rgba(255,246,204," + ((1 - uL / 0.72) * 0.85).toFixed(2) + ")";
        ctx.lineWidth = 2.6 * (1 - uL * 0.7); ctx.lineCap = "round";
        for(var cs = -1; cs <= 1; cs++){
          ctx.beginPath();
          ctx.moveTo(px + cs * 16, py + cs * 6);
          ctx.quadraticCurveTo((px + sxNow) * 0.5 + cs * 8, (py + syNow) * 0.5 + 18, sxNow + cs * 10, syNow + 6);
          ctx.stroke();
        }
        ctx.restore();
      }
      ctx.save();
      ctx.translate(sxNow, syNow);
      ctx.scale(scNow, scNow * (tiltY + easeL * 0.25));
      ctx.shadowColor = "rgba(22,8,2,0.45)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 12;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, pr * 1.08, sa0, sa1); ctx.closePath(); ctx.clip();
      ctx.drawImage(pizzaBuf, -pr * 1.04, -pr * 1.04, pr * 2.08, pr * 2.08);
      ctx.restore();
    }

    /* 5. REALISTIC 3D CULINARY TOOLS WITH SOFT DROP SHADOWS */
    if(phase === "sauce"){
      var lx, ly;
      if(ladleShowT > 0){
        lx = ladleX; ly = ladleY;
      } else {
        var swA = tAcc * 2.4;
        lx = px + Math.cos(swA) * pr * 0.44;
        ly = py + Math.sin(swA) * pr * tiltY * 0.44;
        drawSurfaceRipple(px, py, pr * 0.56, pr * tiltY * 0.56);
      }
      if(ART.toolLadle && ART.toolLadle.complete && ART.toolLadle.naturalWidth){
        var lSz = pr * 0.72;
        ctx.save();
        ctx.translate(lx, ly);
        ctx.fillStyle = "rgba(32,12,4,0.28)";
        ctx.beginPath(); ctx.ellipse(4, 14, lSz * 0.24, lSz * 0.14, 0, 0, Math.PI * 2); ctx.fill();
        ctx.drawImage(ART.toolLadle, -lSz * 0.367, -lSz * 0.648, lSz, lSz);
        ctx.restore();
      }
    } else if(phase === "cheese"){
      var grateRub = graterTiltT > 0 ? Math.sin(graterTiltT * Math.PI * 6) * 14 : 0;
      var gx = px + pr * 0.48, gy = py - pr * tiltY * 0.92 + Math.sin(tAcc * 4.2) * 4 + grateRub;
      var tilt = graterTiltT > 0 ? Math.sin(graterTiltT * Math.PI * 5) * 0.22 - 0.16 : -0.18 + Math.sin(tAcc * 2.4) * 0.04;
      if(ART.toolGrater && ART.toolGrater.complete && ART.toolGrater.naturalWidth){
        var gSz = pr * 0.72;
        ctx.save();
        ctx.translate(gx, gy);
        ctx.rotate(tilt);
        ctx.shadowColor = "rgba(20,8,2,0.42)"; ctx.shadowBlur = 16; ctx.shadowOffsetY = 10;
        ctx.drawImage(ART.toolGrater, -gSz * 0.5, -gSz * 0.5, gSz, gSz);
        ctx.restore();
      }
      drawSurfaceRipple(px, py, pr * 0.54, pr * tiltY * 0.54);
    } else if(phase === "slice"){
      var nextCutI = cutDone.indexOf(false);
      if(ART.toolCutter && ART.toolCutter.complete && ART.toolCutter.naturalWidth){
        var cAng = cutterAnim ? cutterAnim.ang : (nextCutI >= 0 ? cutAngles[nextCutI] : 0);
        var cProg = cutterAnim ? cutterAnim.t : (0.18 + 0.16 * Math.sin(tAcc * 4.0));
        var dAlong = (-0.95 + cProg * 1.90) * pr;
        var cutX = px + Math.cos(cAng) * dAlong;
        var cutY = py + Math.sin(cAng) * dAlong * tiltY;
        var cSz = pr * 0.74;
        ctx.save();
        ctx.translate(cutX, cutY);
        ctx.shadowColor = "rgba(20,8,2,0.45)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 8;
        ctx.drawImage(ART.toolCutter, -cSz * 0.336, -cSz * 0.648, cSz, cSz);
        ctx.restore();
      }
    }
  }

  function drawKitchenCharacters(){
    if(phase === "baking") return;
    /* 1. Hungry Animal Customer grounded solidly onto the sunlit arched window sill! */
    var cust = CUSTOMERS[custIdx % CUSTOMERS.length];
    var cp = getCustomerPos();
    var cImg = ART[cust.key];
    var hop = (custHopT > 0 ? Math.sin(custHopT * Math.PI) * 28 : Math.abs(Math.sin(tAcc * 3.1)) * 4.5);
    var flipLift = custFlipT > 0 ? Math.sin(custFlipT * Math.PI) * 52 : 0;
    ctx.save();
    /* Grounded sunlit ambient occlusion contact shadow on the wooden window counter! */
    var cShSc = Math.max(0.4, 1 - (hop + flipLift) / 95);
    var cShA = isPortrait() ? 0.22 : 0.44;
    var cSh = ctx.createRadialGradient(cp.x, cp.y + cp.h * 0.44, 4, cp.x, cp.y + cp.h * 0.44, cp.h * 0.34 * cShSc);
    cSh.addColorStop(0, "rgba(42,18,6," + cShA + ")");
    cSh.addColorStop(1, "rgba(42,18,6,0)");
    ctx.fillStyle = cSh;
    ctx.beginPath(); ctx.ellipse(cp.x, cp.y + cp.h * 0.44, cp.h * 0.34 * cShSc, 9 * cShSc, 0, 0, Math.PI * 2); ctx.fill();

    ctx.translate(cp.x, cp.y - hop - flipLift);
    ctx.rotate(custFlipT > 0 ? (1 - custFlipT) * Math.PI * 2 : Math.sin(tAcc * 2.2) * 0.03);
    if(cImg && cImg.complete && cImg.naturalWidth){
      var cw = cp.h * (cImg.naturalWidth / cImg.naturalHeight);
      ctx.drawImage(cImg, -cw / 2, -cp.h / 2, cw, cp.h);
    } else {
      ctx.font = Math.round(cp.h * 0.55) + 'px sans-serif'; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(cust.emo, 0, 0);
    }
    ctx.restore();

    /* 2. Chef Hoot grounded solidly on the left honey-oak counter with double contact shadow */
    var hp = getChefHootPos();
    if(hp.h > 0){
      var hImg = ART.hoot;
      var hHop = (hootBounceT > 0 ? Math.sin(hootBounceT * Math.PI) * 22 : Math.sin(tAcc * 2.6) * 2.5);
      var hShSc = Math.max(0.55, 1 - hHop / 85);
      ctx.save();
      var hSh = ctx.createRadialGradient(hp.x, hp.y + hp.h * 0.46, 6, hp.x, hp.y + hp.h * 0.46, hp.h * 0.40 * hShSc);
      hSh.addColorStop(0, "rgba(28,11,3,0.56)");
      hSh.addColorStop(0.55, "rgba(28,11,3,0.28)");
      hSh.addColorStop(1, "rgba(28,11,3,0)");
      ctx.fillStyle = hSh;
      ctx.beginPath(); ctx.ellipse(hp.x, hp.y + hp.h * 0.46, hp.h * 0.40 * hShSc, 14 * hShSc, 0, 0, Math.PI * 2); ctx.fill();

      ctx.translate(hp.x, hp.y - hHop);
      if(hImg && hImg.complete && hImg.naturalWidth){
        var hw = hp.h * (hImg.naturalWidth / hImg.naturalHeight);
        ctx.drawImage(hImg, -hw / 2, -hp.h / 2, hw, hp.h);
      }
      if(masterChefUnlocked){
        ctx.font = '800 34px "Fredoka", sans-serif'; ctx.textAlign = "center";
        ctx.fillText("👑", 0, -hp.h * 0.52 + Math.sin(tAcc * 5) * 4);
      }
      ctx.restore();
    }
  }

  /* Authentic Wood-Fired Brick Oven Atmosphere: Warm Flickering Glow + Drifting Embers + Wispy Steam (ZERO cartoon dots!) */
  function drawOvenFireOverlay(){
    if(phase === "baking"){
      /* 1. Soft dynamic firelight breathing over the real wood fire on the right of bg_oven_interior.jpg */
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      var breath = 0.24 + Math.sin(tAcc * 9.5) * 0.06 + Math.sin(tAcc * 16.3) * 0.04;
      var glow = ctx.createRadialGradient(W * 0.72, H * 0.48, 20, W * 0.72, H * 0.48, Math.max(W, H) * 0.48);
      glow.addColorStop(0, "rgba(255,210,120," + breath.toFixed(2) + ")");
      glow.addColorStop(0.45, "rgba(234,88,12," + (breath * 0.48).toFixed(2) + ")");
      glow.addColorStop(1, "rgba(180,40,0,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);

      /* 2. Tiny glowing drifting wood-ash embers curving upward along the terracotta dome */
      ovenEmbers.forEach(function(em){
        var a = Math.sin(em.life * Math.PI) * 0.92;
        if(a <= 0.02) return;
        ctx.fillStyle = "rgba(255,232,145," + a.toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(em.x, em.y, em.r, 0, Math.PI * 2); ctx.fill();
      });
      ctx.restore();
    }

    /* 3. Wispy curling translucent hot pizza steam plumes (in oven AND freshly pulled out during slice/serve!) */
    if(steamWisps.length){
      ctx.save();
      steamWisps.forEach(function(sw){
        var a = Math.sin(sw.life * Math.PI) * (phase === "baking" ? 0.22 : 0.16);
        if(a <= 0.005) return;
        var sg = ctx.createRadialGradient(sw.x, sw.y, sw.r * 0.1, sw.x, sw.y, sw.r);
        sg.addColorStop(0, "rgba(255,252,245," + a.toFixed(3) + ")");
        sg.addColorStop(0.6, "rgba(255,248,235," + (a * 0.45).toFixed(3) + ")");
        sg.addColorStop(1, "rgba(255,248,235,0)");
        ctx.fillStyle = sg;
        ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.fill();
      });
      ctx.restore();
    }
  }

  /* =========================================================================
     9. MAIN 60FPS ANIMATION LOOP
     ========================================================================= */
  function render(now){
    requestAnimationFrame(render);
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now; tAcc += dt;

    if(doughBounce > 0) doughBounce = Math.max(0, doughBounce - dt * 2.4);
    if(rollSfxCd > 0) rollSfxCd = Math.max(0, rollSfxCd - dt);
    if(ladleShowT > 0) ladleShowT = Math.max(0, ladleShowT - dt);
    if(graterTiltT > 0) graterTiltT = Math.max(0, graterTiltT - dt * 1.8);
    if(custHopT > 0) custHopT = Math.max(0, custHopT - dt * 2.2);
    if(custFlipT > 0) custFlipT = Math.max(0, custFlipT - dt * 1.3);
    if(hootBounceT > 0) hootBounceT = Math.max(0, hootBounceT - dt * 2.2);
    if(ovenFlameT > 0) ovenFlameT = Math.max(0, ovenFlameT - dt);

    /* Animated smooth back-and-forth wooden rolling pin motion when tapped! */
    if(rollAutoAnim && phase === "dough" && doughTossT === 0){
      rollAutoAnim.t = Math.min(1, rollAutoAnim.t + dt * 1.75);
      var rt = rollAutoAnim.t;
      /* Full physical roll forward then back across the dough! */
      var prevPin = rollingPinPos;
      rollingPinPos = Math.sin(rt * Math.PI * 2.0) * 0.78 * rollAutoAnim.dir;
      rollingPinSpin += (rollingPinPos - prevPin) * 7.5;
      var goalNow = rollAutoAnim.startRoll + (rollAutoAnim.targetRoll - rollAutoAnim.startRoll) * rt;
      if(goalNow > doughRoll) advanceDoughRoll(goalNow - doughRoll);
      if(rt >= 1) rollAutoAnim = null;
    }

    /* Animated continuous circular ladle spiral sweep when sauce button tapped! */
    if(ladleSwipeAnim && phase === "sauce"){
      var pgS = getPizzaGeom();
      ladleSwipeAnim.t = Math.min(1, ladleSwipeAnim.t + dt * 2.4);
      var lt = ladleSwipeAnim.t;
      var lAng = ladleSwipeAnim.a0 + (ladleSwipeAnim.a1 - ladleSwipeAnim.a0) * lt;
      var lRad = ladleSwipeAnim.r0 + (ladleSwipeAnim.r1 - ladleSwipeAnim.r0) * lt;
      addSauceAt(pgS.cx + Math.cos(lAng) * pgS.r * lRad, pgS.cy + Math.sin(lAng) * pgS.r * pgS.tiltY * lRad, dt * 0.62);
      if(lt >= 1) ladleSwipeAnim = null;
    }

    if(doughTossT > 0){
      doughTossT += dt * 1.35;
      doughSpinAngle += dt * 11;
      if(doughTossT >= 1){
        doughTossT = 0; doughScale = 1.0; doughBounce = 1.0;
        var pgD = getPizzaGeom();
        spawnFlourPuff(pgD.cx, pgD.cy, 14);
        sfxPlop(5);
        enterSauceStage();
      }
    }

    for(var fci = fallingCheese.length - 1; fci >= 0; fci--){
      var fc = fallingCheese[fci];
      fc.t += dt * 2.8;
      fc.rot += fc.vrot * dt;
      if(fc.t >= 1) fallingCheese.splice(fci, 1);
    }

    for(var fti = flyingToppings.length - 1; fti >= 0; fti--){
      var ft = flyingToppings[fti];
      ft.t = Math.min(1, ft.t + dt * 2.4);
      if(ft.t >= 1){
        placedToppings.push({ key: ft.key, rx: ft.rx, ry: ft.ry, rot: ft.rot });
        spawnSparkles(ft.x1, ft.y1, 10, ["#fde047", "#ffffff"], 150);
        spawnFloatText(ft.x1, ft.y1 - 24, ft.num + "!", "#fde047");
        flyingToppings.splice(fti, 1);
      }
    }

    var pgCur = getPizzaGeom();
    if(phase === "baking"){
      ovenTimerT += dt;
      bakeProgress = Math.max(0, Math.min(1, (ovenTimerT - 0.55) / 2.95));
      if(bakeProgress > 0.15 && Math.random() < 0.28){
        var a = Math.random() * Math.PI * 2, rad = Math.sqrt(Math.random()) * 0.64;
        ovenBubbles.push({ rx: Math.cos(a) * rad, ry: Math.sin(a) * rad, r: 4.5 + Math.random() * 7.5, life: 1.0 });
      }
      if(ovenTimerT > 0.5 && Math.random() < 0.30){
        steamWisps.push({
          x: pgCur.cx + (Math.random() - 0.5) * pgCur.r * 1.15,
          y: pgCur.cy + (Math.random() - 0.5) * 18,
          vx: (Math.random() - 0.5) * 22,
          r: 22 + Math.random() * 18,
          life: 1.0
        });
      }
      ovenEmbers.forEach(function(em){
        em.life += dt * 0.55;
        em.x += (em.vx + Math.sin(tAcc * 4 + em.phase) * 24) * dt;
        em.y += em.vy * dt;
        if(em.life >= 1){
          em.life = 0;
          em.x = W * (0.54 + Math.random() * 0.38);
          em.y = H * (0.48 + Math.random() * 0.14);
        }
      });
    } else if((phase === "slice" || phase === "serve" || phase === "eating") && Math.random() < 0.14){
      steamWisps.push({
        x: pgCur.cx + (Math.random() - 0.5) * pgCur.r * 1.05,
        y: pgCur.cy + (Math.random() - 0.5) * 16,
        vx: (Math.random() - 0.5) * 16,
        r: 18 + Math.random() * 16,
        life: 1.0
      });
    }

    for(var obi = ovenBubbles.length - 1; obi >= 0; obi--){
      ovenBubbles[obi].life -= dt * 1.3;
      if(ovenBubbles[obi].life <= 0) ovenBubbles.splice(obi, 1);
    }
    for(var swi = steamWisps.length - 1; swi >= 0; swi--){
      var sw = steamWisps[swi];
      sw.x += (sw.vx + Math.sin(tAcc * 2.5 + swi) * 14) * dt;
      sw.y -= dt * 62;
      sw.r += dt * 22;
      sw.life -= dt * 0.72;
      if(sw.life <= 0) steamWisps.splice(swi, 1);
    }
    for(var fmi = flourMists.length - 1; fmi >= 0; fmi--){
      var fm = flourMists[fmi];
      fm.x += fm.vx * dt; fm.y += fm.vy * dt;
      fm.vx *= 0.94; fm.vy *= 0.94;
      fm.r += dt * 26;
      fm.life -= fm.decay * dt;
      if(fm.life <= 0) flourMists.splice(fmi, 1);
    }

    if(cutterAnim){
      cutterAnim.t += dt * 3.4;
      if(cutterAnim.t >= 1) cutterAnim = null;
    }
    if(phase === "eating"){
      serveAnimT = Math.min(1, serveAnimT + dt * 2.2);
      if(liftedSlice) liftedSlice.t = Math.min(1, liftedSlice.t + dt * 1.75);
    }

    for(var shi = shockwaves.length - 1; shi >= 0; shi--){
      var sh = shockwaves[shi];
      sh.life -= dt * 1.8; sh.r += (sh.maxR - sh.r) * Math.min(1, dt * 6);
      if(sh.life <= 0) shockwaves.splice(shi, 1);
    }
    for(var pi = particles.length - 1; pi >= 0; pi--){
      var p = particles[pi];
      p.life -= p.decay * dt;
      if(p.life <= 0){ particles.splice(pi, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 240 * dt;
    }
    for(var fli = floatTexts.length - 1; fli >= 0; fli--){
      var fl = floatTexts[fli];
      fl.life -= dt * 0.95; fl.y -= dt * 50;
      fl.scale += (1 - fl.scale) * Math.min(1, dt * 10);
      if(fl.life <= 0) floatTexts.splice(fli, 1);
    }

    /* ==================== DRAW PHOTOREALISTIC 3D SCENE ==================== */
    ctx.clearRect(0, 0, W, H);
    var bgImg = phase === "baking" ? ART.oven : ART.kitchen;
    var drewBg = drawCover(bgImg, 1, phase === "baking" ? 1.03 + Math.sin(tAcc * 3) * 0.008 : 1.01);
    if(!drewBg){
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, phase === "baking" ? "#7c2d12" : "#fed7aa");
      g.addColorStop(0.55, phase === "baking" ? "#431407" : "#fb923c");
      g.addColorStop(1, "#78350f");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }

    /* Subtle warm wood-oven glow flickering gently inside the pizzeria hearth */
    if(phase !== "baking"){
      ctx.save(); ctx.globalCompositeOperation = "screen";
      var flk = 0.16 + Math.sin(tAcc * 9) * 0.05 + ovenFlameT * 0.25;
      var og = ctx.createRadialGradient(W * 0.34, H * 0.54, 10, W * 0.34, H * 0.54, Math.min(W, H) * 0.24);
      og.addColorStop(0, "rgba(255,212,115," + flk.toFixed(2) + ")");
      og.addColorStop(0.55, "rgba(234,88,12," + (flk * 0.45).toFixed(2) + ")");
      og.addColorStop(1, "rgba(234,88,12,0)");
      ctx.fillStyle = og; ctx.beginPath(); ctx.arc(W * 0.34, H * 0.54, Math.min(W, H) * 0.24, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    drawKitchenCharacters();
    drawWoodPeelAndPizza();
    drawOvenFireOverlay();

    /* Soft misty translucent baker's flour clouds */
    if(flourMists.length){
      ctx.save();
      flourMists.forEach(function(fm){
        var a = Math.max(0, fm.life * 0.36);
        var fg = ctx.createRadialGradient(fm.x, fm.y, 1, fm.x, fm.y, fm.r);
        fg.addColorStop(0, "rgba(255,253,246," + a.toFixed(3) + ")");
        fg.addColorStop(0.6, "rgba(255,250,238," + (a * 0.45).toFixed(3) + ")");
        fg.addColorStop(1, "rgba(255,250,238,0)");
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(fm.x, fm.y, fm.r, 0, Math.PI * 2); ctx.fill();
      });
      ctx.restore();
    }

    /* Falling Freshly Grated Mozzarella Shreds showering from the Stainless Grater */
    if(fallingCheese.length){
      ctx.save();
      fallingCheese.forEach(function(fc){
        var u = fc.t;
        var fx = fc.x0 + (fc.x1 - fc.x0) * u;
        var fy = fc.y0 + (fc.y1 - fc.y0) * (u * u);
        ctx.save();
        ctx.translate(fx, fy);
        ctx.rotate(fc.rot);
        ctx.globalAlpha = Math.min(1, (1 - u) * 3.5);
        ctx.fillStyle = fc.gold ? "#fde047" : "#fffdf0";
        ctx.beginPath(); ctx.roundRect(-fc.len * 0.5, -2.2, fc.len, 4.4, 2.2); ctx.fill();
        ctx.restore();
      });
      ctx.restore();
    }

    /* Flying 3D Toppings Arcing onto the Perspective Pizza */
    flyingToppings.forEach(function(ft){
      var u = ft.t, mu = 1 - u;
      var fx = mu * mu * ft.x0 + 2 * mu * u * ft.cx + u * u * ft.x1;
      var fy = mu * mu * ft.y0 + 2 * mu * u * ft.cy + u * u * ft.y1;
      drawToppingOnCtx(ctx, ft.key, fx, fy, pgCur.r * 0.36, ft.rot + u * 2.2, 0);
    });

    /* Subtle Celebration Sparkles & Shockwaves */
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    shockwaves.forEach(function(sh){
      ctx.globalAlpha = Math.max(0, sh.life);
      ctx.strokeStyle = sh.col; ctx.lineWidth = 5 * sh.life;
      ctx.beginPath(); ctx.arc(sh.x, sh.y, sh.r, 0, Math.PI * 2); ctx.stroke();
    });
    particles.forEach(function(p){
      ctx.globalAlpha = Math.max(0, p.life);
      if(p.star) drawStarShape(p.x, p.y, p.r * 1.35, p.col);
      else { ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
    });
    ctx.restore();

    /* Bouncy Floating Pop-Up Texts */
    floatTexts.forEach(function(fl){
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, fl.life * 1.4));
      ctx.translate(fl.x, fl.y); ctx.scale(fl.scale, fl.scale);
      ctx.font = '800 30px "Fredoka", sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineWidth = 6; ctx.strokeStyle = "#241710";
      ctx.strokeText(fl.txt, 0, 0);
      ctx.fillStyle = fl.col;
      ctx.fillText(fl.txt, 0, 0);
      ctx.restore();
    });
  }

  startNewOrder(true);
  requestAnimationFrame(render);
})();
</script>
