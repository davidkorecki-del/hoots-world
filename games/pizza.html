<style>
  :root{ --ink:#241710; --gold:#ffd43b; --outline:#241710; --warm:#fff9f0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; width:100%; height:100%; overflow:hidden; font-family:"Nunito",system-ui,sans-serif; background:#231108; touch-action:none; }

  #stage{ position:fixed; inset:0; width:100%; height:100dvh; overflow:hidden; background:#231108; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:1; touch-action:none; }

  /* Top HUD — Big Friendly Targets, Zero Clutter */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding:max(10px, env(safe-area-inset-top)) 14px 0 14px;
    pointer-events:none;
  }
  .hud-left{ display:flex; align-items:center; gap:10px; pointer-events:auto; max-width:min(56vw, 500px); }
  #hootBtn{
    width:64px; height:64px; flex:0 0 64px; border-radius:50%;
    border:4px solid #fff;
    background:radial-gradient(circle at 35% 30%, #fff4b8, #ffc93c 65%, #ea580c 100%);
    box-shadow:0 6px 0 var(--outline), 0 0 22px rgba(251,146,60,.58);
    padding:4px; cursor:pointer;
    animation:hootBob 2.2s ease-in-out infinite alternate;
  }
  #hootBtn:active{ transform:scale(.9); }
  @keyframes hootBob{ from{ transform:translateY(0); } to{ transform:translateY(-4px); } }
  #promptBubble{
    background:rgba(255,252,245,.95); color:var(--ink);
    border:4px solid var(--outline); border-radius:22px;
    padding:8px 14px; font-family:"Fredoka",sans-serif; font-weight:700;
    font-size:clamp(14px, 1.85vw, 17px); line-height:1.22;
    box-shadow:0 6px 0 var(--outline), 0 12px 26px rgba(0,0,0,.38);
  }
  #promptBubble b{ color:#dc2626; }

  .hud-right{ display:flex; align-items:center; gap:8px; pointer-events:auto; flex-shrink:0; }

  /* 3-Pizza Crown Cycle Tracker + Total Pizzas Served */
  #servedPill{
    display:flex; align-items:center; gap:6px;
    background:rgba(43,22,12,.90); border:3.5px solid #fde047;
    border-radius:999px; padding:5px 12px;
    box-shadow:0 5px 0 var(--outline);
    color:#fff9f0; font-family:"Fredoka",sans-serif; font-weight:800; font-size:17px;
  }
  .pdot{
    width:28px; height:28px; border-radius:50%;
    background:rgba(255,255,255,.14); border:2.5px solid rgba(255,255,255,.32);
    display:grid; place-items:center; font-size:15px; filter:grayscale(1) opacity(.5);
    transition:transform .35s cubic-bezier(.34,1.8,.5,1), filter .25s;
  }
  .pdot.lit{
    filter:none; border-color:#fff;
    background:radial-gradient(circle at 30% 25%, #fef08a, #f59e0b);
    box-shadow:0 0 12px rgba(253,224,71,.9);
    animation:popDot .5s cubic-bezier(.34,1.8,.5,1);
  }
  @keyframes popDot{ 0%{ transform:scale(.4); } 65%{ transform:scale(1.3); } 100%{ transform:scale(1); } }

  #starPill{
    display:flex; align-items:center; gap:5px;
    background:#fffef8; border:4px solid var(--outline); border-radius:999px;
    padding:6px 13px; font-family:"Fredoka",sans-serif; font-weight:800; font-size:18px; color:var(--ink);
    box-shadow:0 5px 0 var(--outline);
  }
  #doneBtn{
    border:4px solid var(--outline); border-radius:999px;

    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:16px;
    padding:8px 15px; cursor:pointer; white-space:nowrap;
    box-shadow:0 5px 0 var(--outline); text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  #doneBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--outline); }

  /* Visual Picture Order Card (Bonus Star-Burst — Zero Reading, Never Wrong!) */
  #orderCard{
    position:absolute; right:14px; top:82px; z-index:11;
    background:rgba(255,252,245,.96); border:4px solid var(--outline); border-radius:22px;
    padding:8px 11px; box-shadow:0 7px 0 var(--outline), 0 12px 26px rgba(0,0,0,.36);
    display:flex; flex-direction:column; gap:6px; min-width:132px;
    transition:transform .3s cubic-bezier(.34,1.8,.5,1);
  }
  #orderCard.bonus-hit{
    border-color:#16a34a;
    box-shadow:0 7px 0 #14532d, 0 0 30px rgba(74,222,128,.95);
    animation:cardPop .55s cubic-bezier(.34,1.8,.5,1);
  }
  @keyframes cardPop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.12) rotate(-2deg); } 100%{ transform:scale(1); } }
  .oc-head{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:13.5px; color:#9a3412;
    border-bottom:2px dashed #fdba74; padding-bottom:4px;
  }
  .oc-head img{ width:24px; height:24px; object-fit:contain; }
  .oc-list{ display:flex; flex-direction:column; gap:5px; }
  .oc-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:#fff7ed; border:2.5px solid #fed7aa; border-radius:12px; padding:4px 8px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:15px; color:var(--ink);
  }
  .oc-row.done{ background:#dcfce7; border-color:#4ade80; color:#166534; }
  .oc-row img{ width:28px; height:28px; object-fit:contain; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); }

  /* Big Hero Action Buttons (BAKE! / RING BELL! / MAKE ANOTHER PIZZA!) */
  #actionStage{
    position:absolute; left:0; right:0; bottom:94px; z-index:12;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    pointer-events:none; padding:0 12px;
  }
  .hero-action-btn{
    pointer-events:auto;
    min-height:68px;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    border:5px solid #fff; border-radius:999px;
    padding:10px 28px; cursor:pointer;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:clamp(21px, 3.2vw, 28px); color:#fff;
    text-shadow:0 3px 0 rgba(36,23,16,.48);
    animation:heroPulse .58s ease-in-out infinite alternate;
  }
  .hero-action-btn:active{ transform:translateY(5px); }
  #bakeBtn{
    background:radial-gradient(circle at 35% 25%, #fdba74 0%, #ea580c 52%, #b91c1c 100%);

  }
  #serveBtn{
    background:radial-gradient(circle at 35% 25%, #fef08a 0%, #f59e0b 55%, #b45309 100%);

  }
  #nextPizzaBtn{
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    box-shadow:0 9px 0 var(--outline), 0 0 36px rgba(74,222,128,.92);
  }
  @keyframes heroPulse{
    from{ transform:scale(1); box-shadow:0 9px 0 var(--outline), 0 0 0 0 rgba(253,224,71,.7); }
    to{ transform:scale(1.06); box-shadow:0 9px 0 var(--outline), 0 0 0 9px rgba(253,224,71,.95); }
  }
  .tap-finger{ display:inline-block; font-size:26px; line-height:1; animation:fingerHop .5s ease-in-out infinite alternate; }
  @keyframes fingerHop{ from{ transform:translateY(0); } to{ transform:translateY(-7px) scale(1.12); } }

  /* Floating Oven Ready Banner */
  #ovenBanner{
    position:absolute; left:50%; top:22%; transform:translate(-50%, -50%) scale(.4);

    font-size:clamp(56px, 10vw, 100px); color:#fde047;
    text-shadow:0 7px 0 #241710, 0 0 42px rgba(251,146,60,.98);
    transition:transform .22s cubic-bezier(.34,1.8,.5,1), opacity .22s;
    white-space:nowrap;
  }
  #ovenBanner.show{ opacity:1; transform:translate(-50%, -50%) scale(1); }

  /* Bottom 8-Topping Tray & Step Control Bar (Every Target >= 64px!) */
  #kitchenBar{
    position:absolute; left:50%; bottom:max(8px, env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:11;
    width:min(98vw, 940px);
    background:linear-gradient(180deg, rgba(64,33,16,.93) 0%, rgba(34,17,8,.96) 100%);

    box-shadow:0 8px 0 #1b0d06, 0 14px 32px rgba(0,0,0,.52), inset 0 2px 0 rgba(255,255,255,.22);
  }
  #traySlots{
    display:flex; align-items:center; justify-content:center; gap:7px; flex:1 1 auto;
    overflow-x:auto; scrollbar-width:none; padding:2px 2px;
  }
  #traySlots::-webkit-scrollbar{ display:none; }
  .ing-btn{
    position:relative; min-width:66px; height:66px; flex:0 0 auto; border-radius:20px;
    border:4px solid #fff; cursor:pointer; padding:3px 6px;
    background:linear-gradient(180deg, #fffbeb 0%, #fde68a 100%);
    box-shadow:0 5px 0 #1b0d06, inset 0 3px 0 rgba(255,255,255,.72);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:11.5px; color:var(--ink);
    transition:transform .16s cubic-bezier(.34,1.8,.5,1), box-shadow .16s;
    touch-action:none;
  }
  .ing-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #1b0d06; }
  .ing-btn img{ width:38px; height:38px; object-fit:contain; filter:drop-shadow(0 2px 2px rgba(0,0,0,.32)); pointer-events:none; }
  .ing-btn.sel{
    border-color:#fde047;
    background:linear-gradient(180deg, #fef08a 0%, #f59e0b 100%);
    transform:translateY(-4px) scale(1.06);
    box-shadow:0 0 0 3px #fde047, 0 7px 0 #1b0d06, 0 0 20px rgba(253,224,71,.85);
  }
  .ing-btn.wanted{
    border-color:#4ade80;
    box-shadow:0 0 0 3px #4ade80, 0 5px 0 #1b0d06, 0 0 18px rgba(74,222,128,.85);
  }
  .ing-badge{
    position:absolute; top:-7px; right:-5px; min-width:21px; height:21px; border-radius:999px;
    background:#16a34a; color:#fff; border:2px solid #fff; padding:0 5px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:11.5px;
    display:grid; place-items:center; box-shadow:0 2px 4px rgba(0,0,0,.4);
    pointer-events:none;
  }

  /* Win Overlay */
  #winOverlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(28,14,8,.76); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .win-card{
    background:linear-gradient(180deg, #fffef8 0%, #fef3c7 100%);
    border:6px solid var(--outline); border-radius:34px;
    padding:26px 24px; text-align:center; max-width:450px; width:100%;
    box-shadow:0 14px 0 var(--outline), 0 26px 50px rgba(0,0,0,.55);
  }
  .win-card img{ width:120px; height:140px; object-fit:contain; margin-bottom:4px; }
  .win-card h2{ margin:0 0 8px; font-family:"Fredoka",sans-serif; font-size:32px; color:var(--ink); }
  .win-card p{ margin:0 0 18px; font-weight:800; font-size:17px; color:#443329; }
  .big-play{
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:20px;
    padding:12px 26px; cursor:pointer; box-shadow:0 6px 0 var(--outline);
  }

  @media (max-width: 740px){
    #hud{ flex-wrap:wrap; align-items:center; gap:6px; padding:max(8px, env(safe-area-inset-top)) 10px 0; }
    .hud-left{ display:contents; }
    #hootBtn{ width:52px; height:52px; flex:0 0 52px; order:1; border-width:3px; }
    .hud-right{ order:2; margin-left:auto; gap:6px; }
    #servedPill{ padding:4px 8px; font-size:14px; border-width:3px; gap:4px; }
    .pdot{ width:22px; height:22px; font-size:12px; }
    #starPill{ font-size:15.5px; padding:5px 10px; border-width:3px; }
    #doneBtn{ font-size:14px; padding:6px 11px; border-width:3px; }
    #promptBubble{
      order:3; flex:1 0 100%; width:100%;
      padding:7px 12px; border-width:3px; border-radius:16px;
      font-size:13.5px; line-height:1.2; text-align:center;
    }
    #orderCard{
      left:50%; right:auto; top:120px; transform:translateX(-50%);
      flex-direction:row; align-items:center; gap:7px;
      padding:4px 10px; border-width:3px; border-radius:999px; min-width:0;
      box-shadow:0 5px 0 var(--outline), 0 8px 18px rgba(0,0,0,.32);
    }
    .oc-head{ font-size:12px; border-bottom:none; padding-bottom:0; gap:4px; }
    .oc-head span{ display:none; }
    .oc-list{ flex-direction:row; gap:6px; }
    .oc-row{ padding:3px 7px; font-size:13px; border-width:2px; gap:5px; }
    .oc-row img{ width:22px; height:22px; }

    #kitchenBar{
      width:min(97vw, 440px); padding:6px 6px; border-radius:22px; border-width:3px;
    }
    #traySlots{ justify-content:center; gap:5px; }
    #traySlots.is-grid{
      display:grid; grid-template-columns:repeat(4, minmax(64px, 1fr)); gap:6px;
      overflow:visible;
    }
    .ing-btn{ min-width:64px; height:64px; border-radius:16px; border-width:3px; font-size:10.5px; }
    .ing-btn img{ width:34px; height:34px; }
    #actionStage{ bottom:94px; }
    #actionStage.has-grid{ bottom:158px; }
    .hero-action-btn{ min-height:64px; padding:10px 22px; font-size:20px; border-width:4px; }
  }
</style>
</head>

<script>
(function(){
  "use strict";

  /* =========================================================================
     1. ATOMIC SINGLE-CHANNEL HOOT VOICE ENGINE (ALL 12 RECORDED CLIPS, NEVER 2 AT ONCE!)
     ========================================================================= */
  var voiceA = new Audio();
  var voiceGen = 0, lastStepClip = null, idleHelpTimer = null, idleHelpReminded = false;
  var won = false, hootSpeakingUntil = 0;

  function clearIdleHelp(){
    if(idleHelpTimer){ clearTimeout(idleHelpTimer); idleHelpTimer = null; }
  }
  function armIdleHelp(){
    clearIdleHelp();
    if(won || !lastStepClip || idleHelpReminded) return;
    idleHelpTimer = setTimeout(function(){
      if(won || !lastStepClip) return;
      idleHelpReminded = true;
      playClip(lastStepClip);
    }, 12500);
  }
  window.addEventListener("pointerdown", function(){
    idleHelpReminded = false;
    armIdleHelp();
  }, true);

  function stopAllParentVoice(){
    try{
      if(window.parent && window.parent !== window){
        if(window.parent.__hwStopIntro) window.parent.__hwStopIntro();
        if(window.parent.__hootStopClip) window.parent.__hootStopClip();
      }
    }catch(e){}
  }
  function parentPizzaIntroPlaying(){
    try{
      return !!(window.parent && window.parent !== window &&
        window.parent.__hwIntroKey === "pizza" &&
        window.parent.__hwIntroPlaying && window.parent.__hwIntroPlaying());
    }catch(e){ return false; }
  }
  function playClip(id){
    if(!id) return;
    var myGen = ++voiceGen;
    stopAllParentVoice();
    voiceA.onended = null; voiceA.onerror = null;
    try{ voiceA.pause(); voiceA.currentTime = 0; }catch(e){}
    hootSpeakingUntil = performance.now() + 3000;
    voiceA.src = "assets/voice/" + id + ".mp3";
    voiceA.onended = function(){ if(myGen === voiceGen) hootSpeakingUntil = 0; };
    voiceA.onerror = function(){ if(myGen === voiceGen) hootSpeakingUntil = 0; };
    var p = voiceA.play();
    if(p && p.catch) p.catch(function(){});
  }
  function setStepClip(id, speakNow){
    lastStepClip = id;
    idleHelpReminded = false;
    armIdleHelp();
    if(id === "hoot-piz-welcome" && parentPizzaIntroPlaying()){
      hootSpeakingUntil = performance.now() + 2600;
      return;
    }
    if(speakNow !== false) playClip(id);
  }
  window.addEventListener("pagehide", function(){
    try{ voiceA.pause(); }catch(e){}
    clearIdleHelp();
  });

  /* =========================================================================
     2. TACTILE KITCHEN FOLEY AUDIO ENGINE
     ========================================================================= */
  var actx = null;
  function ac(){
    if(!actx){ var A = window.AudioContext || window.webkitAudioContext; if(A) actx = new A(); }
    if(actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  var PENTA = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.5];
  function sfxDoughPat(step){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime, o = c.createOscillator(), g = c.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(160 + step * 25, t);
      o.frequency.exponentialRampToValueAtTime(68, t + 0.14);
      g.gain.setValueAtTime(0.24, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.18);
    }catch(e){}
  }

    var cy = port ? (H * 0.575) : (H * 0.645);
    var squash = port ? 0.66 : 0.60; /* Authentic warm 2.5D counter tilt — flat on the board, easy to decorate! */
    return { cx: cx, cy: cy, r: r, squash: squash };
  }
  function ovenGeom(){
    var port = isPortrait();
    var r = port ? Math.min(W * 0.36, 165) : Math.min(W * 0.22, H * 0.27);
    return { cx: W * 0.50, cy: port ? H * 0.64 : H * 0.72, r: r, squash: 0.44 };
  }

    var port = isPortrait();

        var wantObj = currentOrder.find(function(w){ return w.key === tp.key; });
        var have = countPlacedKey(tp.key), needs = wantObj && have < wantObj.count;
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ing-btn" + (selectedTopKey === tp.key ? " sel" : "") + (needs ? " wanted" : "");

        btn.innerHTML = badge + '<img src="assets/pizza3d/' + tp.file + VER + '" alt="' + tp.label + '"><span>' + tp.label + '</span>';
        btn.addEventListener("pointerdown", function(e){
          e.preventDefault(); e.stopPropagation();
          selectedTopKey = tp.key;
          sfxPlop(1);
          renderTray();
          /* Support direct drag straight off the tray onto the pizza! */
          var r = cv.getBoundingClientRect();
          dragState = {
            kind: "new", key: tp.key, idx: -1,
            x: e.clientX - r.left, y: e.clientY - r.top,
            startX: e.clientX - r.left, startY: e.clientY - r.top,
            moved: false
          };
        });
        traySlots.appendChild(btn);
      });
    } else if(phase === "slice"){
      var bSl = document.createElement("button");
      bSl.type = "button"; bSl.className = "ing-btn wanted"; bSl.style.minWidth = "210px";
      bSl.innerHTML = '<img src="assets/pizza3d/sprite_tool_cutter.png' + VER + '" alt=""><span>Slice Pizza! (' + cutAngles.length + '/3)</span>';
      bSl.addEventListener("pointerdown", function(e){ e.preventDefault(); e.stopPropagation(); performAutoSlice(); });
      traySlots.appendChild(bSl);
    } else {
      var msg = document.createElement("div");
      msg.style.cssText = 'color:#fde68a; font-family:"Fredoka",sans-serif; font-weight:800; font-size:15.5px; padding:12px 10px;';
      msg.textContent = phase === "baking" ? "🔥 Baking golden, melted & steaming in the brick oven…" : (phase === "serve" ? "🔔 Tap the gleaming brass bell to serve Bunny!" : (phase === "eating" ? "❤️ Bunny is loving your hot wood-fired pizza!" : "🎉 Delicious! Tap above to make another pizza!"));
      traySlots.appendChild(msg);
    }
  }

  /* =========================================================================

  /* STEP 2: SAUCE (Real Finger-Painted Strokes + Silent 55% Coverage Tracker!) */
  function enterSauceStep(){
    phase = "sauce";
    var bg = boardGeom();
    ladlePos = { x: bg.cx + bg.r * 0.35, y: bg.cy - bg.r * 0.1 };
    renderTray();
    bubble.innerHTML = "🍅 <b>STEP 2 — SAUCE!</b> Drag your finger across the pizza to paint yummy red sauce!";
    setStepClip("hoot-piz-sauce", true);
  }

  function paintSauceStroke(rx0, ry0, rx1, ry1){
    if(phase !== "sauce") return;
    var steps = Math.max(1, Math.ceil(Math.hypot(rx1 - rx0, ry1 - ry0) * 26));
    var brushR = 0.25;
    for(var s = 0; s <= steps; s++){
      var u = s / steps;
      var rx = rx0 + (rx1 - rx0) * u, ry = ry0 + (ry1 - ry0) * u;
      var d = Math.hypot(rx, ry);
      if(d > 0.76){ rx = (rx / d) * 0.76; ry = (ry / d) * 0.76; }
      var px = (0.5 + rx * 0.5) * SBUF, py = (0.5 + ry * 0.5) * SBUF;
      var pr = brushR * SBUF * 0.5;
      var g = smCtx.createRadialGradient(px, py, pr * 0.25, px, py, pr);
      g.addColorStop(0, "rgba(255,255,255,1)");
      g.addColorStop(0.72, "rgba(255,255,255,0.92)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      smCtx.fillStyle = g;
      smCtx.beginPath(); smCtx.arc(px, py, pr, 0, Math.PI * 2); smCtx.fill();

      /* Silent 20x20 grid coverage tracking inside inner crust */
      for(var gy = 0; gy < COV_N; gy++){
        var cyN = ((gy + 0.5) / COV_N) * 2 - 1;
        for(var gx = 0; gx < COV_N; gx++){
          var ci = gy * COV_N + gx;
          if(covCells[ci]) continue;
          var cxN = ((gx + 0.5) / COV_N) * 2 - 1;
          if(cxN * cxN + cyN * cyN > 0.62) continue;
          if(Math.hypot(cxN - rx, cyN - ry) <= brushR * 0.92){
            covCells[ci] = 1; covFilled++;
          }
        }
      }
    }
    sauceCoverage = covFilled / Math.max(1, covTotalValid);
    if(ladleSfxCd <= 0){ sfxSauceBrush(); ladleSfxCd = 0.14; }

    /* Silently completes around 55% painted coverage! */
    if(sauceCoverage >= 0.55){
      paintingSauce = false; lastSaucePt = null;
      sauceFullBloom = 0.01;
      hootBounceT = 0.85;
      var bg = boardGeom();
      sfxPlop(5);
      spawnSparkles(bg.cx, bg.cy, 16, "#ef4444");
      spawnFloat(bg.cx, bg.cy - bg.r * 0.5, "🍅 YUMMY SAUCE!", "#fde047");
      var myGen = roundGen;
      setTimeout(function(){ if(myGen === roundGen && phase === "sauce" && !won) enterCheeseStep(); }, 580);
    }
  }
  function paintAutoSauceSwirl(){
    if(phase !== "sauce") return;
    var a0 = sauceCoverage * Math.PI * 5, r0 = 0.12 + sauceCoverage * 0.55;
    var x0 = Math.cos(a0) * r0, y0 = Math.sin(a0) * r0;
    var x1 = Math.cos(a0 + 1.3) * Math.min(0.66, r0 + 0.16), y1 = Math.sin(a0 + 1.3) * Math.min(0.66, r0 + 0.16);
    var bg = boardGeom();
    ladlePos = { x: bg.cx + x1 * bg.r, y: bg.cy + y1 * bg.r * bg.squash };
    paintSauceStroke(x0, y0, x1, y1);
    spawnSparkles(ladlePos.x, ladlePos.y, 6, "#ef4444");
  }

  /* STEP 3: CHEESE (Press & Hold Over Pizza -> Rain Cheese Shreds That Stick Where They Land -> ~35 Completes!) */
  function enterCheeseStep(){
    phase = "cheese";
    sauceFullBloom = 1;
    holdingCheese = false; cheeseRainCd = 0; cheeseDone = false;
    var bg = boardGeom();
    cheeseHoldPt = { x: bg.cx, y: bg.cy };
    renderTray();

    setStepClip("hoot-piz-cheese", true);
  }
  function startCheeseHold(px, py){
    if(phase !== "cheese") return;
    holdingCheese = true;
    cheeseHoldPt = { x: px, y: py };
    /* Immediate burst of 5 shreds on press so even a 2-year-old who taps rather than holds succeeds! */
    for(var i = 0; i < 5; i++) spawnFallingShred(px, py);
  }
  function spawnFallingShred(px, py){
    if(phase !== "cheese" || (landedShreds.length + fallingShreds.length) >= CHEESE_GOAL + 10) return;
    var bg = boardGeom();
    var fillFrac = Math.min(1, (landedShreds.length + fallingShreds.length) / CHEESE_GOAL);
    /* Rain richly right under the finger, spreading naturally outward so even a stationary hold blankets the whole pizza! */
    var spread = 0.72 + fillFrac * 0.68;
    var baseCx = px * (1 - fillFrac * 0.45) + bg.cx * (fillFrac * 0.45);
    var baseCy = py * (1 - fillFrac * 0.45) + bg.cy * (fillFrac * 0.45);
    var targetX = baseCx + (Math.random() - 0.5) * bg.r * spread;
    var targetY = baseCy + (Math.random() - 0.5) * bg.r * bg.squash * spread;
    /* Clamp landing cleanly inside inner pizza disc */
    var rx = (targetX - bg.cx) / bg.r, ry = (targetY - bg.cy) / (bg.r * bg.squash);
    var d = Math.hypot(rx, ry);
    if(d > 0.74){ rx = (rx / d) * (0.35 + Math.random() * 0.37); ry = (ry / d) * (0.35 + Math.random() * 0.37); }
    var landX = bg.cx + rx * bg.r, landY = bg.cy + ry * bg.r * bg.squash;
    fallingShreds.push({
      x: landX + (Math.random() - 0.5) * 28,
      y: landY - 95 - Math.random() * 65,
      targetX: landX, targetY: landY, rx: rx, ry: ry,
      vy: 150 + Math.random() * 90,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 9,
      len: 19 + Math.random() * 14, curve: (Math.random() - 0.5) * 9,
      shade: Math.random() < 0.5 ? "#fffdf0" : "#fef3c7"
    });
    if(Math.random() < 0.45) sfxCheeseTick(landedShreds.length);
  }

  /* STEP 4: 8 TOPPINGS (Select+Tap, Drag From Tray, Drag to Move, Drag Off / Double-Tap Remove, Order Card Bonus!) */

  function launchToppingToPizza(key, startX, startY, rx, ry){

    });

  function addCutAngle(ang){
    if(phase !== "slice" || cutAngles.length >= 3) return;

        setStepClip("hoot-piz-yummy", true);
      }
    }, 2550);
  }

  /* =========================================================================
     8. POINTER / TOUCH CONTROLS (DESIGNED FOR A 2-YEAR-OLD ALONE, FIRST TRY!)
     ========================================================================= */
  function clientToPizzaNorm(clientX, clientY){
    var r = cv.getBoundingClientRect();
    var px = clientX - r.left, py = clientY - r.top;
    var bg = boardGeom();
    var rx = (px - bg.cx) / bg.r;
    var ry = (py - bg.cy) / (bg.r * bg.squash);
    return { px: px, py: py, rx: rx, ry: ry, dist: Math.hypot(rx, ry) };
  }

  function hitPlacedTopping(px, py){
    var bg = boardGeom();
    for(var i = placedToppings.length - 1; i >= 0; i--){
      var pt = placedToppings[i];
      var tx = bg.cx + pt.rx * bg.r, ty = bg.cy + pt.ry * bg.r * bg.squash;
      var rad = Math.max(32, bg.r * (TOP_BY_KEY[pt.key] ? TOP_BY_KEY[pt.key].sz : 0.19) * 1.15);
      if(Math.hypot(px - tx, py - ty) <= rad) return i;
    }
    return -1;
  }

  cv.addEventListener("pointerdown", function(e){
    e.preventDefault();
    var pt = clientToPizzaNorm(e.clientX, e.clientY);

    /* Tap Chef Hoot -> bounce + cheer + replay step voice! */
    var ht = hootGeom();
    if(Math.abs(pt.px - ht.x) < ht.w * 0.56 && Math.abs(pt.py - ht.y) < ht.h * 0.56){
      hootBounceT = 1.0; sfxPlop(4);
      spawnSparkles(ht.x, ht.y - ht.h * 0.25, 12);
      if(lastStepClip) playClip(lastStepClip);
      return;
    }
    /* Tap Bunny -> happy hop & hearts! */
    var bn = bunnyGeom();
    if(Math.abs(pt.px - bn.x) < bn.w * 0.54 && Math.abs(pt.py - bn.y) < bn.h * 0.54){
      bunnyHopT = 1.0; sfxPlop(5);
      spawnHearts(bn.x, bn.y - bn.h * 0.25, 6);
      return;
    }
    /* Tap Brass Service Bell on counter! */
    var bl = bellGeom();
    if(Math.hypot(pt.px - bl.x, pt.py - bl.y) < bl.sz * 0.72){
      if(phase === "serve"){ ringBellAndServe(); return; }
      bellRingT = 1.0; sfxBellDing(); bunnyHopT = 0.75;
      spawnSparkles(bl.x, bl.y - 16, 10);
      return;
    }

    if(phase === "dough"){
      if(pt.dist < 1.38) tapDough();
    } else if(phase === "sauce"){
      if(pt.dist < 1.15){
        paintingSauce = true;
        ladlePos = { x: pt.px, y: pt.py };
        lastSaucePt = { rx: pt.rx, ry: pt.ry };
        paintSauceStroke(pt.rx, pt.ry, pt.rx + 0.03, pt.ry + 0.03);
      }
    } else if(phase === "cheese"){
      if(pt.dist < 1.32) startCheeseHold(pt.px, pt.py);
    } else if(phase === "toppings"){
      /* First check if pressing an existing placed topping (drag to move / double-tap or drag-off to remove!) */
      var hitIdx = hitPlacedTopping(pt.px, pt.py);
      if(hitIdx >= 0){
        var nowMs = performance.now();
        if(lastTopTap.idx === hitIdx && (nowMs - lastTopTap.time) < 380){
          lastTopTap = { idx: -1, time: 0 };
          removeToppingAt(hitIdx);
          return;
        }
        lastTopTap = { idx: hitIdx, time: nowMs };
        dragState = {
          kind: "move", key: placedToppings[hitIdx].key, idx: hitIdx,
          x: pt.px, y: pt.py, startX: pt.px, startY: pt.py, moved: false
        };
        return;
      }
      /* Tap anywhere on the pizza -> animate selected topping smoothly from tray onto exact tap spot! */
      if(pt.dist < 0.92){
        var btnEl = traySlots.querySelector('[data-top="' + selectedTopKey + '"]');
        var sx = W * 0.5, sy = H - 56;
        if(btnEl){
          var br = btnEl.getBoundingClientRect(), cr = cv.getBoundingClientRect();
          sx = br.left + br.width * 0.5 - cr.left;
          sy = br.top + br.height * 0.5 - cr.top;
        }
        launchToppingToPizza(selectedTopKey, sx, sy, pt.rx, pt.ry);
      }
    } else if(phase === "slice"){
      if(pt.dist < 1.25){
        draggingSlice = true;
        sliceStartPt = { x: pt.px, y: pt.py };
        sliceCurPt = { x: pt.px, y: pt.py };
      }
    } else if(phase === "serve"){
      if(pt.dist < 1.25) ringBellAndServe();
    }
  });

  window.addEventListener("pointermove", function(e){
    var pt = clientToPizzaNorm(e.clientX, e.clientY);
    if(phase === "sauce" && paintingSauce){
      ladlePos = { x: pt.px, y: pt.py };
      if(pt.dist < 1.12 && lastSaucePt){
        paintSauceStroke(lastSaucePt.rx, lastSaucePt.ry, pt.rx, pt.ry);
        lastSaucePt = { rx: pt.rx, ry: pt.ry };
      }
    } else if(phase === "cheese" && holdingCheese){
      cheeseHoldPt = { x: pt.px, y: pt.py };
    } else if(phase === "toppings" && dragState){
      dragState.x = pt.px; dragState.y = pt.py;
      if(Math.hypot(pt.px - dragState.startX, pt.py - dragState.startY) > 10) dragState.moved = true;
      if(dragState.kind === "move" && dragState.moved && placedToppings[dragState.idx]){
        placedToppings[dragState.idx].rx = pt.rx;
        placedToppings[dragState.idx].ry = pt.ry;
      }
    } else if(phase === "slice" && draggingSlice){
      sliceCurPt = { x: pt.px, y: pt.py };
    }
  });

  function finishPointer(e){
    if(phase === "sauce"){ paintingSauce = false; lastSaucePt = null; }
    if(phase === "cheese"){ holdingCheese = false; }
    if(phase === "toppings" && dragState){
      var pt = clientToPizzaNorm(e.clientX || 0, e.clientY || 0);
      if(dragState.kind === "new" && dragState.moved){
        if(pt.dist < 0.92) placeToppingDirect(dragState.key, pt.rx, pt.ry);
      } else if(dragState.kind === "move" && dragState.moved){
        if(pt.dist > 0.92){
          /* Dragged off the pizza -> gently remove! */
          removeToppingAt(dragState.idx);
        } else if(placedToppings[dragState.idx]){
          var d = Math.hypot(pt.rx, pt.ry);
          if(d > 0.74){ placedToppings[dragState.idx].rx = (pt.rx / d) * 0.74; placedToppings[dragState.idx].ry = (pt.ry / d) * 0.74; }
          placedToppings[dragState.idx].pop = 0.8;
          sfxPlop(2);
        }
      }
      dragState = null;
    }
    if(phase === "slice" && draggingSlice){
      draggingSlice = false;
      if(sliceStartPt && sliceCurPt){
        var dx = sliceCurPt.x - sliceStartPt.x, dy = sliceCurPt.y - sliceStartPt.y;
        if(Math.hypot(dx, dy) > 42){
          var bg = boardGeom();
          addCutAngle(Math.atan2(dy / bg.squash, dx));
        } else {
          /* Simple tap also cuts cleanly! */
          performAutoSlice();
        }
      }
      sliceStartPt = null; sliceCurPt = null;
    }
  }
  window.addEventListener("pointerup", finishPointer);
  window.addEventListener("pointercancel", finishPointer);

  /* Hero & HUD Button Listeners (support both touch pointerdown and click!) */
  function onBakeAct(e){ e.preventDefault(); e.stopPropagation(); startBakingStep(); }
  function onServeAct(e){ e.preventDefault(); e.stopPropagation(); ringBellAndServe(); }
  function onNextAct(e){
    e.preventDefault(); e.stopPropagation();
    if(phase !== "celebrated") return;
    startNewPizza("hoot-piz-next-order");
  }
  bakeBtn.addEventListener("pointerdown", onBakeAct);
  bakeBtn.addEventListener("click", onBakeAct);
  serveBtn.addEventListener("pointerdown", onServeAct);
  serveBtn.addEventListener("click", onServeAct);
  nextPizzaBtn.addEventListener("pointerdown", onNextAct);
  nextPizzaBtn.addEventListener("click", onNextAct);
  document.getElementById("hootBtn").addEventListener("click", function(){
    hootBounceT = 0.8;
    if(lastStepClip) playClip(lastStepClip);
  });
  document.getElementById("doneBtn").addEventListener("click", function(){
    roundGen++; won = true; clearIdleHelp(); ovenBanner.classList.remove("show");
    document.getElementById("winSummary").textContent = "Awesome cooking! You baked " + pizzasServed + " delicious pizza" + (pizzasServed === 1 ? "" : "s") + " for Bunny and earned " + totalStars + " stars!";
    winOverlay.hidden = false;

  /* =========================================================================
     9. RENDER HELPERS (RICH ANIMATED-FILM PIZZA LAYER, FLAT OVEN, SLICES, CHARACTERS)
     ========================================================================= */
  function drawCover(im){
    if(!im || !im.complete || !im.naturalWidth) return;
    var sc = Math.max(W / im.naturalWidth, H / im.naturalHeight);
    var dw = im.naturalWidth * sc, dh = im.naturalHeight * sc;
    ctx.drawImage(im, (W - dw) * 0.5, (H - dh) * 0.5, dw, dh);
  }

  /* Renders the child's EXACT custom pizza (dough -> painted sauce strokes -> stuck cheese shreds -> melted mozzarella -> all placed toppings!) */
  function drawCustomPizza(cx, cy, r, squash, scaleAll, rotSpin, clipSliceIdx){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, squash);
    if(rotSpin) ctx.rotate(rotSpin);

    /* Optional wedge clip for independent lifting 3D pizza slices! */
    if(clipSliceIdx !== undefined && clipSliceIdx !== null){
      var stepA = (Math.PI * 2) / 6;
      var a0 = clipSliceIdx * stepA, a1 = (clipSliceIdx + 1) * stepA;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r * 1.15, a0, a1);
      ctx.closePath();
      ctx.clip();
    }

    var pr = r * (scaleAll || 1);

    /* 3D Crust Side Wall thickness (visible especially when flat on the oven stone or lifted slice!) */
    if(phase !== "dough" || doughTaps >= 3){
      ctx.save();
      ctx.fillStyle = bakeProgress > 0.35 ? "#b46526" : "#d8bc8e";
      ctx.beginPath();
      ctx.arc(0, (12 / squash) * (0.6 + bakeProgress * 0.45), pr * 0.99, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    /* 1. Dough Ball -> Stretched Artisan Crust -> Wood-Fired Leopard-Spot Golden Crust */
    if(phase === "dough" && doughTaps < 4){
      var wSqX = 1 + Math.sin(doughWobble * Math.PI * 3) * 0.14 * doughWobble;
      var wSqY = 1 - Math.sin(doughWobble * Math.PI * 3) * 0.12 * doughWobble;
      ctx.save();
      ctx.scale(wSqX, wSqY);
      if(IMG.doughBall.complete && IMG.doughBall.naturalWidth){
        ctx.drawImage(IMG.doughBall, -pr, -pr, pr * 2, pr * 2);
      }
      if(doughTaps >= 2 && IMG.crust.complete && IMG.crust.naturalWidth){
        ctx.globalAlpha = doughTaps === 2 ? 0.35 : 0.72;
        ctx.drawImage(IMG.crust, -pr, -pr, pr * 2, pr * 2);
      }
      ctx.restore();
    } else {
      if(IMG.crust.complete && IMG.crust.naturalWidth){
        ctx.drawImage(IMG.crust, -pr, -pr, pr * 2, pr * 2);
      }
      if(bakeProgress > 0.01 && IMG.crustBaked.complete && IMG.crustBaked.naturalWidth){
        ctx.save();
        ctx.globalAlpha = Math.min(1, bakeProgress);
        ctx.drawImage(IMG.crustBaked, -pr, -pr, pr * 2, pr * 2);
        ctx.restore();
      }
    }

    /* 2. Real Finger-Painted San Marzano Red Sauce Strokes! */
    if(sauceCoverage > 0 || sauceFullBloom > 0){
      var sr = pr * 0.84;
      if(IMG.sauceRed.complete && IMG.sauceRed.naturalWidth){
        if(sauceFullBloom >= 1){
          ctx.drawImage(IMG.sauceRed, -sr, -sr, sr * 2, sr * 2);
        } else {
          scCtx.clearRect(0, 0, SBUF, SBUF);
          scCtx.globalCompositeOperation = "source-over";
          scCtx.drawImage(sauceMaskCv, 0, 0);
          scCtx.globalCompositeOperation = "source-in";
          scCtx.drawImage(IMG.sauceRed, SBUF * 0.08, SBUF * 0.08, SBUF * 0.84, SBUF * 0.84);
          scCtx.globalCompositeOperation = "source-over";
          ctx.drawImage(sauceCompCv, -pr, -pr, pr * 2, pr * 2);
          if(sauceFullBloom > 0){
            ctx.save(); ctx.globalAlpha = sauceFullBloom;
            ctx.drawImage(IMG.sauceRed, -sr, -sr, sr * 2, sr * 2);
            ctx.restore();
          }
        }
      }
    }

    /* 3. Creamy Shredded Mozzarella Bed + Individual Stuck Shreds -> Melt Smoothly Into Golden Bubbling Cheese! */
    var rawFade = Math.max(0, 1 - bakeProgress * 1.15);
    if(landedShreds.length > 0 && rawFade > 0.02){
      var cheeseFrac = Math.min(1, landedShreds.length / CHEESE_GOAL);
      if(cheeseFrac > 0.18 && IMG.cheeseRaw.complete && IMG.cheeseRaw.naturalWidth){
        var crRaw = pr * 0.78;
        ctx.save();
        ctx.globalAlpha = Math.min(0.86, (cheeseFrac - 0.14) * 1.0) * rawFade;
        ctx.drawImage(IMG.cheeseRaw, -crRaw, -crRaw, crRaw * 2, crRaw * 2);
        ctx.restore();
      }
      ctx.save();
      ctx.globalAlpha = rawFade;
      ctx.lineCap = "round";
      for(var si = 0; si < landedShreds.length; si++){
        var sh = landedShreds[si];
        var sx = sh.rx * pr, sy = sh.ry * pr;
        ctx.save();
        ctx.translate(sx, sy); ctx.rotate(sh.rot);
        ctx.strokeStyle = "rgba(80,30,10,0.24)"; ctx.lineWidth = 7.0;
        ctx.beginPath(); ctx.moveTo(-sh.len * 0.5, 1.8); ctx.quadraticCurveTo(0, sh.curve + 1.8, sh.len * 0.5, 1.8); ctx.stroke();
        ctx.strokeStyle = sh.shade; ctx.lineWidth = 5.4;
        ctx.beginPath(); ctx.moveTo(-sh.len * 0.5, 0); ctx.quadraticCurveTo(0, sh.curve, sh.len * 0.5, 0); ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    }
    if(bakeProgress > 0.06 && IMG.cheeseMelted.complete && IMG.cheeseMelted.naturalWidth){
      var cr = pr * 0.81;
      ctx.save();
      ctx.globalAlpha = Math.min(0.95, bakeProgress * 1.15);
      ctx.drawImage(IMG.cheeseMelted, -cr, -cr, cr * 2, cr * 2);
      ctx.restore();
    }

    /* Animated sizzling melted-cheese bubbles inside the oven */
    for(var bi = 0; bi < ovenBubbles.length; bi++){
      var ob = ovenBubbles[bi];
      var sw = Math.sin(ob.life * Math.PI);
      var br = (4 + sw * 9) * (pr / 160);
      ctx.save();
      ctx.fillStyle = "rgba(255,235,165," + (0.65 * sw).toFixed(2) + ")";
      ctx.strokeStyle = "rgba(180,85,15," + (0.55 * sw).toFixed(2) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ob.rx * pr, ob.ry * pr, br, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    /* 4. All Child-Placed Toppings (with soft contact shadows & gentle bounce!) */
    for(var ti = 0; ti < placedToppings.length; ti++){
      var pt = placedToppings[ti];
      if(dragState && dragState.kind === "move" && dragState.moved && dragState.idx === ti) continue;
      var tDef = TOP_BY_KEY[pt.key];
      var imT = IMG["top_" + pt.key];
      if(!imT || !imT.complete || !imT.naturalWidth) continue;
      var tx = pt.rx * pr, ty = pt.ry * pr;
      var tSz = pr * (tDef ? tDef.sz : 0.19) * 2.0 * (1 + Math.sin(pt.pop * Math.PI) * 0.25);
      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(pt.rot);
      /* Contact shadow nestled into cheese */
      ctx.fillStyle = "rgba(42,14,4,0.32)";
      ctx.beginPath(); ctx.ellipse(2, 4, tSz * 0.44, tSz * 0.40, 0, 0, Math.PI * 2); ctx.fill();
      ctx.drawImage(imT, -tSz * 0.5, -tSz * 0.5, tSz, tSz);
      ctx.restore();
    }

    /* 5. Cut Slice Seams & Stretchy Golden Cheese Lines */
    if(cutAngles.length > 0 && clipSliceIdx === undefined){
      ctx.save();
      cutAngles.forEach(function(ang){
        var ca = Math.cos(ang), sa = Math.sin(ang);
        ctx.strokeStyle = "rgba(62,24,6,0.72)"; ctx.lineWidth = 4.5;
        ctx.beginPath(); ctx.moveTo(-ca * pr * 0.96, -sa * pr * 0.96); ctx.lineTo(ca * pr * 0.96, sa * pr * 0.96); ctx.stroke();
        ctx.strokeStyle = "rgba(255,236,160,0.88)"; ctx.lineWidth = 2.0; ctx.setLineDash([6, 8]);
        ctx.beginPath(); ctx.moveTo(-ca * pr * 0.80, -sa * pr * 0.80); ctx.lineTo(ca * pr * 0.80, sa * pr * 0.80); ctx.stroke();
      });
      ctx.restore();
    }

    ctx.restore();
  }

  function drawHeartShape(x, y, sz, col, rot){
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot || 0);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, sz * 0.35);
    ctx.bezierCurveTo(-sz * 0.65, -sz * 0.1, -sz * 0.55, -sz * 0.72, 0, -sz * 0.26);
    ctx.bezierCurveTo(sz * 0.55, -sz * 0.72, sz * 0.65, -sz * 0.1, 0, sz * 0.35);
    ctx.fill();
    ctx.restore();
  }

  /* =========================================================================
     10. MAIN 60FPS ANIMATION LOOP (NOTHING TELEPORTS; EVERYTHING ANIMATES!)
     ========================================================================= */
  var tAcc = 0, lastT = performance.now();

  function render(now){
    requestAnimationFrame(render);
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now; tAcc += dt;

    if(ladleSfxCd > 0) ladleSfxCd = Math.max(0, ladleSfxCd - dt);
    if(hootBounceT > 0) hootBounceT = Math.max(0, hootBounceT - dt * 2.1);
    if(bunnyHopT > 0) bunnyHopT = Math.max(0, bunnyHopT - dt * 2.1);
    if(bunnyFlipT > 0) bunnyFlipT = Math.max(0, bunnyFlipT - dt * 1.15);
    if(bellRingT > 0) bellRingT = Math.max(0, bellRingT - dt * 2.8);

    /* Update elastic dough stretch & toss */
    doughScale += (doughTargetScale - doughScale) * Math.min(1, dt * 11);
    if(doughWobble > 0) doughWobble = Math.max(0, doughWobble - dt * 2.4);
    if(doughTossT > 0){
      doughTossT += dt * 1.45;
      if(doughTossT >= 1){
        doughTossT = 0;
        var bgT = boardGeom();
        spawnFlourPuffs(bgT.cx, bgT.cy, 12);
        sfxDoughPat(4);
        enterSauceStep();
      }
    }
    if(sauceFullBloom > 0 && sauceFullBloom < 1) sauceFullBloom = Math.min(1, sauceFullBloom + dt * 2.6);

    /* Update continuous press-and-hold cheese rain! */
    if(phase === "cheese" && holdingCheese){
      cheeseRainCd -= dt;
      if(cheeseRainCd <= 0){
        cheeseRainCd = 0.055;
        spawnFallingShred(cheeseHoldPt.x, cheeseHoldPt.y);
        spawnFallingShred(cheeseHoldPt.x, cheeseHoldPt.y);
      }
    }
    for(var fsi = fallingShreds.length - 1; fsi >= 0; fsi--){
      var fs = fallingShreds[fsi];
      fs.vy += 420 * dt;
      fs.y += fs.vy * dt;
      fs.x += (fs.targetX - fs.x) * Math.min(1, dt * 6);
      fs.rot += fs.vr * dt;
      if(fs.y >= fs.targetY){
        landedShreds.push({ rx: fs.rx, ry: fs.ry, rot: fs.rot, len: fs.len, curve: fs.curve, shade: fs.shade });
        fallingShreds.splice(fsi, 1);
        if(phase === "cheese" && !cheeseDone && landedShreds.length >= CHEESE_GOAL){
          cheeseDone = true;
          holdingCheese = false;
          hootBounceT = 0.9;
          var bgC = boardGeom();
          sfxPlop(6);
          spawnSparkles(bgC.cx, bgC.cy, 18, "#fef08a");
          spawnFloat(bgC.cx, bgC.cy - bgC.r * 0.55, "🧀 SO CHEESY!", "#fde047");
          var myGenC = roundGen;
          setTimeout(function(){ if(myGenC === roundGen && phase === "cheese" && !won) enterToppingsStep(); }, 540);
        }
      }
    }

    /* Update animated flying toppings from tray -> pizza */
    var bgNow = boardGeom();
    for(var fti = flyingToppings.length - 1; fti >= 0; fti--){
      var ft = flyingToppings[fti];
      ft.t = Math.min(1, ft.t + dt * 3.1);
      if(ft.t >= 1){
        placedToppings.push({ id: nextTopId++, key: ft.key, rx: ft.rx, ry: ft.ry, rot: ft.rot, pop: 1.0 });
        spawnSparkles(bgNow.cx + ft.rx * bgNow.r, bgNow.cy + ft.ry * bgNow.r * bgNow.squash, 8);
        flyingToppings.splice(fti, 1);
        checkOrderBonus();
      }
    }
    placedToppings.forEach(function(pt){ if(pt.pop > 0) pt.pop = Math.max(0, pt.pop - dt * 3.8); });

    /* Update Baking Timeline */
    if(phase === "baking"){
      ovenT += dt;
      if(inOvenScene){
        ovenFade = Math.min(1, ovenFade + dt * 3.2);
        bakeProgress = Math.max(0, Math.min(1, (ovenT - 0.72) / 3.0));
        var og = ovenGeom();
        if(bakeProgress > 0.20 && Math.random() < 0.25){
          var ba = Math.random() * Math.PI * 2, br = Math.sqrt(Math.random()) * 0.65;
          ovenBubbles.push({ rx: Math.cos(ba) * br, ry: Math.sin(ba) * br, life: 1.0 });
        }
        if(Math.random() < 0.26) spawnEmber(og.cx + og.r * 0.5, og.cy - og.r * 0.25);
        if(Math.random() < 0.22) spawnSteam(og.cx, og.cy - og.r * 0.25, og.r * 1.4);
      }
    } else if((phase === "slice" || phase === "serve" || phase === "eating") && Math.random() < 0.11){
      spawnSteam(bgNow.cx, bgNow.cy - bgNow.r * 0.22, bgNow.r * 1.3);
    }
    for(var obi = ovenBubbles.length - 1; obi >= 0; obi--){
      ovenBubbles[obi].life -= dt * 1.25;
      if(ovenBubbles[obi].life <= 0) ovenBubbles.splice(obi, 1);
    }
    if(cutterAnim){
      cutterAnim.t += dt * 3.1;
      if(cutterAnim.t >= 1) cutterAnim = null;
    }
    if(cutAngles.length >= 3) slicesSplitAmt = Math.min(1, slicesSplitAmt + dt * 3.2);
    if(phase === "eating" && liftedSlice){
      liftedSlice.t = Math.min(1, liftedSlice.t + dt * 1.45);
    }

    /* =====================================================================
       DRAW SCENE: EITHER ROARING BRICK OVEN INTERIOR OR COZY ITALIAN KITCHEN!
       ===================================================================== */
    ctx.clearRect(0, 0, W, H);

    if(inOvenScene){
      /* ROARING WOOD-FIRED BRICK OVEN BAKING SCENE */
      drawCover(IMG.oven);
      var fGlow = 0.24 + Math.sin(tAcc * 11) * 0.07 + Math.sin(tAcc * 19) * 0.04;
      var og = ovenGeom();
      var fg = ctx.createRadialGradient(W * 0.68, H * 0.48, 12, W * 0.68, H * 0.48, Math.max(W, H) * 0.45);
      fg.addColorStop(0, "rgba(255,215,120," + fGlow.toFixed(2) + ")");
      fg.addColorStop(0.5, "rgba(255,110,20," + (fGlow * 0.5).toFixed(2) + ")");
      fg.addColorStop(1, "rgba(255,60,0,0)");
      ctx.save(); ctx.globalCompositeOperation = "screen"; ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H); ctx.restore();

      /* Flat pizza resting solidly on the glowing round stone hearth! */
      ctx.fillStyle = "rgba(24,8,2,0.52)";
      ctx.beginPath(); ctx.ellipse(og.cx, og.cy + 14, og.r * 1.06, og.r * og.squash * 1.08, 0, 0, Math.PI * 2); ctx.fill();

      /* Oven peel retracting & returning to scoop at DING! */
      var insideT = Math.max(0, ovenT - 0.68);
      if(IMG.peelOven.complete && IMG.peelOven.naturalWidth && (insideT < 0.55 || insideT > 2.95)){
        var pSlide = insideT < 0.55 ? (insideT / 0.55) : Math.max(0, 1 - (insideT - 2.95) / 0.50);
        var pyOff = pSlide * pSlide * (H * 0.42);
        var pw = og.r * 2.5, ph = pw * (IMG.peelOven.naturalHeight / IMG.peelOven.naturalWidth);
        ctx.drawImage(IMG.peelOven, og.cx - pw * 0.5, og.cy - og.r * og.squash * 0.95 + pyOff, pw, ph);
      }
      drawCustomPizza(og.cx, og.cy, og.r, og.squash, 1.0, 0, undefined);

    } else {
      /* COZY ITALIAN PIZZERIA KITCHEN MAIN STAGE */
      drawCover(IMG.kitchen);

      /* Live warm firelight pulse radiating out of the terracotta brick oven mouth! */
      var kf = 0.22 + Math.sin(tAcc * 9.5) * 0.06 + Math.sin(tAcc * 17) * 0.03;
      var kfg = ctx.createRadialGradient(W * 0.355, H * 0.505, 10, W * 0.355, H * 0.505, Math.min(W, H) * 0.26);
      kfg.addColorStop(0, "rgba(255,205,105," + kf.toFixed(2) + ")");
      kfg.addColorStop(0.5, "rgba(255,112,24," + (kf * 0.45).toFixed(2) + ")");
      kfg.addColorStop(1, "rgba(255,80,10,0)");
      ctx.save(); ctx.globalCompositeOperation = "screen"; ctx.fillStyle = kfg; ctx.fillRect(0, 0, W, H); ctx.restore();

      /* 1. Bunny Customer Waiting Joyfully at the Sunlit Serving Window! */
      var bn = bunnyGeom();
      if(IMG.bunny.complete && IMG.bunny.naturalWidth){
        var bHop = bunnyHopT > 0 ? Math.sin(bunnyHopT * Math.PI) * 28 : Math.sin(tAcc * 2.3 + 1) * 4;
        var bRot = bunnyFlipT > 0 ? Math.sin(bunnyFlipT * Math.PI * 2) * 0.28 : Math.sin(tAcc * 1.9) * 0.025;
        ctx.fillStyle = "rgba(24,10,4,0.34)";
        ctx.beginPath(); ctx.ellipse(bn.x, bn.y + bn.h * 0.45, bn.w * 0.36, 9, 0, 0, Math.PI * 2); ctx.fill();
        ctx.save(); ctx.translate(bn.x, bn.y - bHop); ctx.rotate(bRot);
        ctx.drawImage(IMG.bunny, -bn.w * 0.5, -bn.h * 0.5, bn.w, bn.h);
        ctx.restore();
      }

      /* 2. BIG, PRESENT CHEF HOOT IN WHITE APRON (OR GLEAMING GOLDEN CROWN ON EVERY 3RD PIZZA!) */
      var ht = hootGeom();
      var hootImg = grandCrownCelebration ? IMG.hootCrown : IMG.hootApron;
      if(hootImg && hootImg.complete && hootImg.naturalWidth){
        var speakHop = (performance.now() < hootSpeakingUntil) ? Math.abs(Math.sin(tAcc * 16)) * 8 : 0;
        var hHop = (hootBounceT > 0 ? Math.sin(hootBounceT * Math.PI) * 26 : Math.sin(tAcc * 2.5) * 4) + speakHop;
        var hTilt = (performance.now() < hootSpeakingUntil) ? Math.sin(tAcc * 14) * 0.045 : (grandCrownCelebration ? Math.sin(tAcc * 5) * 0.07 : 0);
        var hhDraw = grandCrownCelebration ? ht.h * 1.16 : ht.h;
        var hyDraw = grandCrownCelebration ? (ht.y - ht.h * 0.08) : ht.y;
        /* Golden celebration aura behind Crowned Hoot! */
        if(grandCrownCelebration){
          var cg = ctx.createRadialGradient(ht.x, hyDraw, 12, ht.x, hyDraw, ht.h * 0.72);
          cg.addColorStop(0, "rgba(254,240,138,0.72)"); cg.addColorStop(1, "rgba(251,191,36,0)");
          ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(ht.x, hyDraw, ht.h * 0.72, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "rgba(24,10,4,0.40)";
        ctx.beginPath(); ctx.ellipse(ht.x, ht.y + ht.h * 0.45, ht.w * 0.42, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.save(); ctx.translate(ht.x, hyDraw - hHop); ctx.rotate(hTilt);
        ctx.drawImage(hootImg, -ht.w * 0.5, -hhDraw * 0.5, ht.w, hhDraw);
        ctx.restore();
      }

      /* 3. Gleaming Brass Service Bell on the Right Counter! */
      var bl = bellGeom();
      if(IMG.bell.complete && IMG.bell.naturalWidth){
        var bellPulse = phase === "serve" ? (1 + Math.sin(tAcc * 7) * 0.08) : 1;
        var bellJig = bellRingT > 0 ? Math.sin(bellRingT * Math.PI * 8) * 0.22 : 0;
        if(phase === "serve"){
          var bGlow = ctx.createRadialGradient(bl.x, bl.y, 6, bl.x, bl.y, bl.sz * 0.85);
          bGlow.addColorStop(0, "rgba(254,240,138,0.85)"); bGlow.addColorStop(1, "rgba(251,191,36,0)");
          ctx.fillStyle = bGlow; ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.sz * 0.85, 0, Math.PI * 2); ctx.fill();
        }
        ctx.save(); ctx.translate(bl.x, bl.y); ctx.rotate(bellJig); ctx.scale(bellPulse, bellPulse);
        ctx.drawImage(IMG.bell, -bl.sz * 0.5, -bl.sz * 0.44, bl.sz, bl.sz * 0.86);
        ctx.restore();
      }

      /* 4. Big Empty Wooden Pizza Board & Pizza (with smooth animated launch into brick oven!) */
      var bg = boardGeom();
      var pCx = bg.cx, pCy = bg.cy, pR = bg.r, pScale = 1.0, pRot = 0;
      if(phase === "baking" && !inOvenScene){
        /* Smooth peel glide into the glowing brick oven mouth on the left (nothing teleports!) */
        var uGo = Math.min(1, ovenT / 0.68);
        var eGo = uGo * uGo * (3 - 2 * uGo);
        pCx = bg.cx + (W * 0.35 - bg.cx) * eGo;
        pCy = bg.cy + (H * 0.51 - bg.cy) * eGo - Math.sin(uGo * Math.PI) * 35;
        pScale = 1 - 0.54 * eGo;
      } else if(doughTossT > 0){
        /* Joyful spinning air toss on tap 4! */
        var arc = Math.sin(doughTossT * Math.PI);
        pCy = bg.cy - arc * (H * 0.26);
        pRot = doughTossT * Math.PI * 4;
      }

      /* Draw Wooden Pizza Board */
      if(IMG.peel.complete && IMG.peel.naturalWidth){
        var peelW = bg.r * 3.18 * (phase === "baking" ? pScale : 1);
        var peelH = peelW * (IMG.peel.naturalHeight / IMG.peel.naturalWidth);
        var peelX = (phase === "baking" ? pCx : bg.cx) - peelW * 0.42;
        var peelY = (phase === "baking" ? pCy : bg.cy) - peelH * 0.50;
        ctx.drawImage(IMG.peel, peelX, peelY, peelW, peelH);
      }

      /* Draw Whole Pizza OR 6 Independent Sliced Wedges (lifting one-by-one to Bunny!) */
      if(phase === "eating" || phase === "celebrated"){
        if(phase === "eating"){
          for(var sk = 0; sk < 6; sk++){
            if(sk < slicesEaten) continue;
            var stepA = (Math.PI * 2) / 6, aMid = (sk + 0.5) * stepA;
            var offX = Math.cos(aMid) * 8, offY = Math.sin(aMid) * 8 * bg.squash;
            if(liftedSlice && liftedSlice.idx === sk){
              var uL = liftedSlice.t, eL = 1 - Math.pow(1 - uL, 2.2);
              var lx = bg.cx + (bn.x - bg.cx) * eL;
              var ly = bg.cy + (bn.y + 8 - bg.cy) * eL - Math.sin(uL * Math.PI) * 70;
              drawCustomPizza(lx, ly, bg.r * (1 - eL * 0.30), bg.squash, 1.0, eL * 0.25, sk);
            } else {
              drawCustomPizza(bg.cx + offX, bg.cy + offY, bg.r, bg.squash, 1.0, 0, sk);
            }
          }
        }
      } else {
        var curScale = (phase === "dough" && doughTossT === 0) ? doughScale : pScale;
        drawCustomPizza(pCx, pCy, pR, bg.squash, curScale, pRot, undefined);
      }

      /* 5. Step-Specific Animated 3D Culinary Tools & Visual Pre-Reader Guides! */
      if(phase === "dough" && doughTossT === 0){
        /* Pulsing inviting ring around dough ball */
        ctx.save();
        ctx.strokeStyle = "rgba(254,240,138," + (0.45 + 0.35 * Math.sin(tAcc * 5)).toFixed(2) + ")";
        ctx.lineWidth = 4; ctx.setLineDash([10, 8]);
        ctx.beginPath(); ctx.ellipse(bg.cx, bg.cy, bg.r * doughScale * 1.15, bg.r * doughScale * bg.squash * 1.15, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      } else if(phase === "sauce" && IMG.ladle.complete && IMG.ladle.naturalWidth){
        var lx = paintingSauce ? ladlePos.x : (bg.cx + Math.cos(tAcc * 2.4) * bg.r * 0.42);
        var ly = paintingSauce ? ladlePos.y : (bg.cy + Math.sin(tAcc * 2.4) * bg.r * bg.squash * 0.42);
        var lw = isPortrait() ? 84 : 108;
        ctx.drawImage(IMG.ladle, lx - lw * 0.28, ly - lw * 0.72, lw, lw);
      } else if(phase === "cheese"){
        /* Falling mozzarella shreds raining down onto the pizza! */
        ctx.save(); ctx.lineCap = "round";
        for(var fi2 = 0; fi2 < fallingShreds.length; fi2++){
          var fs2 = fallingShreds[fi2];
          ctx.save(); ctx.translate(fs2.x, fs2.y); ctx.rotate(fs2.rot);
          ctx.strokeStyle = fs2.shade; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.moveTo(-fs2.len * 0.5, 0); ctx.quadraticCurveTo(0, fs2.curve, fs2.len * 0.5, 0); ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
        /* Shaking stainless box grater hovering right above finger! */
        if(IMG.grater.complete && IMG.grater.naturalWidth){
          var gx = holdingCheese ? cheeseHoldPt.x : (bg.cx + Math.sin(tAcc * 2.4) * bg.r * 0.38);
          var gy = (holdingCheese ? cheeseHoldPt.y : bg.cy) - bg.r * 0.62;
          var jig = holdingCheese ? Math.sin(tAcc * 34) * 9 : Math.sin(tAcc * 4) * 4;
          var gw = isPortrait() ? 86 : 112;
          ctx.save(); ctx.translate(gx + jig, gy); ctx.rotate(holdingCheese ? Math.sin(tAcc * 28) * 0.14 : -0.12);
          ctx.drawImage(IMG.grater, -gw * 0.5, -gw * 0.5, gw, gw);
          ctx.restore();
        }
      } else if(phase === "toppings"){
        /* Animated flying toppings arcing smoothly from tray -> pizza */
        for(var fti2 = 0; fti2 < flyingToppings.length; fti2++){
          var ft2 = flyingToppings[fti2];
          var u = ft2.t, e = 1 - Math.pow(1 - u, 2.2);
          var tx1 = bg.cx + ft2.rx * bg.r, ty1 = bg.cy + ft2.ry * bg.r * bg.squash;
          var fx = ft2.x0 + (tx1 - ft2.x0) * e;
          var fy = ft2.y0 + (ty1 - ft2.y0) * e - Math.sin(u * Math.PI) * 95;
          var imF = IMG["top_" + ft2.key], tDefF = TOP_BY_KEY[ft2.key];
          var fSz = bg.r * (tDefF ? tDefF.sz : 0.19) * 2.0;
          if(imF && imF.complete && imF.naturalWidth){
            ctx.save(); ctx.translate(fx, fy); ctx.rotate((1 - u) * 3 + ft2.rot);
            ctx.drawImage(imF, -fSz * 0.5, -fSz * 0.5, fSz, fSz * bg.squash * 1.15);
            ctx.restore();
          }
        }
        /* Active dragged topping (from tray OR moving a placed topping!) */
        if(dragState && dragState.moved){
          var imDr = IMG["top_" + dragState.key], tDefDr = TOP_BY_KEY[dragState.key];
          var dSz = bg.r * (tDefDr ? tDefDr.sz : 0.19) * 2.25;
          if(imDr && imDr.complete && imDr.naturalWidth){
            ctx.save();
            ctx.fillStyle = "rgba(24,10,4,0.34)";
            ctx.beginPath(); ctx.ellipse(dragState.x, dragState.y + 18, dSz * 0.42, dSz * 0.28, 0, 0, Math.PI * 2); ctx.fill();
            ctx.drawImage(imDr, dragState.x - dSz * 0.5, dragState.y - dSz * 0.5 - 8, dSz, dSz);
            ctx.restore();
          }
        }
      } else if(phase === "slice"){
        /* Glowing cut guide + live drag line + spinning rotary pizza cutter! */
        var guideAng = [0, Math.PI / 3, (2 * Math.PI) / 3][cutAngles.length % 3];
        if(draggingSlice && sliceStartPt && sliceCurPt){
          ctx.save();
          ctx.strokeStyle = "#fde047"; ctx.lineWidth = 6; ctx.lineCap = "round";
          ctx.shadowColor = "#f59e0b"; ctx.shadowBlur = 14;
          ctx.beginPath(); ctx.moveTo(sliceStartPt.x, sliceStartPt.y); ctx.lineTo(sliceCurPt.x, sliceCurPt.y); ctx.stroke();
          ctx.restore();
        } else {
          ctx.save();
          ctx.strokeStyle = "rgba(254,240,138," + (0.55 + 0.35 * Math.sin(tAcc * 6)).toFixed(2) + ")";
          ctx.lineWidth = 5; ctx.setLineDash([12, 10]);
          ctx.beginPath();
          ctx.moveTo(bg.cx - Math.cos(guideAng) * bg.r * 0.94, bg.cy - Math.sin(guideAng) * bg.r * bg.squash * 0.94);
          ctx.lineTo(bg.cx + Math.cos(guideAng) * bg.r * 0.94, bg.cy + Math.sin(guideAng) * bg.r * bg.squash * 0.94);
          ctx.stroke();
          ctx.restore();
        }
        if(IMG.cutter.complete && IMG.cutter.naturalWidth){
          var cxCut, cyCut, cAng = cutterAnim ? cutterAnim.ang : guideAng;
          if(draggingSlice && sliceCurPt){
            cxCut = sliceCurPt.x; cyCut = sliceCurPt.y;
          } else {
            var prog = cutterAnim ? cutterAnim.t : (0.18 + 0.14 * Math.sin(tAcc * 3.8));
            var dA = (-0.90 + prog * 1.80) * bg.r;
            cxCut = bg.cx + Math.cos(cAng) * dA;
            cyCut = bg.cy + Math.sin(cAng) * dA * bg.squash;
          }
          var cw = isPortrait() ? 86 : 112;
          ctx.save(); ctx.translate(cxCut, cyCut - 14);
          ctx.drawImage(IMG.cutter, -cw * 0.35, -cw * 0.65, cw, cw);
          ctx.restore();
        }
      }
    }

    /* 6. Render All Particles (Flour Puffs, Sparkles, Steam, Embers, Hearts, Confetti!) */
    for(var pi = particles.length - 1; pi >= 0; pi--){
      var p = particles[pi];
      p.life -= dt * p.decay;
      if(p.life <= 0){ particles.splice(pi, 1); continue; }
      if(p.kind === "sparkle") p.vy += 220 * dt;
      else if(p.kind === "confetti") p.rot += p.vr * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;

      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      if(p.kind === "flour"){
        var fg2 = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.r * (1.8 - p.life * 0.8));
        fg2.addColorStop(0, "rgba(255,253,245,0.72)"); fg2.addColorStop(1, "rgba(255,253,245,0)");
        ctx.fillStyle = fg2; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.8 - p.life * 0.8), 0, Math.PI * 2); ctx.fill();
      } else if(p.kind === "steam"){
        var sr2 = p.r * (1.7 - p.life * 0.7);
        var stg = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, sr2);
        stg.addColorStop(0, "rgba(255,252,246,0.34)"); stg.addColorStop(1, "rgba(255,252,246,0)");
        ctx.fillStyle = stg; ctx.beginPath(); ctx.arc(p.x, p.y, sr2, 0, Math.PI * 2); ctx.fill();
      } else if(p.kind === "sparkle" || p.kind === "ember"){
        ctx.fillStyle = p.col; ctx.shadowColor = p.col; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
      } else if(p.kind === "heart"){
        drawHeartShape(p.x, p.y, p.r * (0.7 + p.life * 0.4), p.col, p.rot);
      } else if(p.kind === "confetti"){
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.col;
        ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1);
      }
      ctx.restore();
    }

    /* 7. Pop-Up Floating Cheer Callouts */
    for(var fi3 = floatTexts.length - 1; fi3 >= 0; fi3--){
      var ft3 = floatTexts[fi3];
      ft3.life -= dt * 1.15;
      if(ft3.life <= 0){ floatTexts.splice(fi3, 1); continue; }
      ft3.y -= dt * 46;
      ft3.scale += (1 - ft3.scale) * Math.min(1, dt * 14);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, ft3.life * 1.4));
      ctx.translate(ft3.x, ft3.y); ctx.scale(ft3.scale, ft3.scale);
      ctx.font = '800 28px "Fredoka",sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineWidth = 6; ctx.strokeStyle = "#241710"; ctx.strokeText(ft3.txt, 0, 0);
      ctx.fillStyle = ft3.col; ctx.fillText(ft3.txt, 0, 0);
      ctx.restore();
    }
  }

  /* =========================================================================
     11. START HOOT'S PIZZA SHOP!
     ========================================================================= */
  startNewPizza("hoot-piz-welcome");
  requestAnimationFrame(render);

  /* Clean read-only debug handle for automated playtest verification */
  window.__PIZZA_SHOP_DEBUG__ = function(){
    return {
      phase: phase, doughTaps: doughTaps, sauceCoverage: Number(sauceCoverage.toFixed(2)),
      cheeseLanded: landedShreds.length, cheeseGoal: CHEESE_GOAL,
      toppingsCount: placedToppings.length, toppingsKeys: placedToppings.map(function(t){ return t.key; }),
      orderBonusGiven: orderBonusGiven, bakeProgress: Number(bakeProgress.toFixed(2)),
      cuts: cutAngles.length, pizzasServed: pizzasServed,
      crownActive: grandCrownCelebration, stars: totalStars
    };
  };
})();
</script>
