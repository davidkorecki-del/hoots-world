<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="pizza";window.__HOOT_SELF_COACH__=true;</script>
<script src="js/hoot-game-head.js?v=llprev3e114"></script>
<script src="js/three.min.js?v=llprev3e114"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>3D Pizza Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#2c1810;
    --warm-glass:rgba(255, 250, 242, 0.84);
    --dark-glass:rgba(32, 16, 8, 0.56);
    --hairline:rgba(255, 245, 230, 0.42);
    --gold:#fbbf24;
    --ember:#f97316;
    --emerald:#22c55e;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  [hidden]{ display:none !important; }
  html,body{
    margin:0; width:100%; height:100%; overflow:hidden;
    font-family:"Nunito", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background:#1b0c05; touch-action:none;
  }

  /* =========================================================================
     RAYTRACED PIXAR DIORAMA STAGE + TRANSPARENT CAMERA-MATCHED WEBGL2 CANVAS
     ========================================================================= */
  #stage{ position:fixed; inset:0; width:100%; height:100dvh; overflow:hidden; background:#1b0c05; }

  .diorama-bg{
    position:absolute; inset:0; width:100%; height:100%;
    background-size:cover; background-position:center center; background-repeat:no-repeat;
    transform-origin:center center;
    transition:opacity .55s cubic-bezier(.4,0,.2,1), transform .85s cubic-bezier(.22,1,.36,1), filter .55s ease;
    pointer-events:none;
  }
  #bgKitchen{
    z-index:0;
    background-image:url("assets/pizza3d/bg_kitchen.jpg?v=llprev3e114");
    background-position:center 52%;
    transform:scale(1.0);
  }
  #bgKitchen.zoom-oven{
    transform:scale(1.24) translate(8%, 4%);
    filter:brightness(1.08) saturate(1.12);
  }
  #bgOven{
    z-index:1; opacity:0;
    background-image:url("assets/pizza3d/bg_oven_interior.jpg?v=llprev3e114");
    background-position:center 54%;
    transform:scale(1.06);
  }
  #bgOven.show{ opacity:1; transform:scale(1.0); }

  /* Subtle warm cinematic vignette & live firelight atmosphere */
  #atmoCanvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    z-index:2; pointer-events:none;
  }
  #glCanvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    z-index:3; touch-action:none;
  }
  #fxCanvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    z-index:4; pointer-events:none;
  }
  /* Subtle warm transition flash when entering/exiting brick oven */
  #ovenFlash{
    position:absolute; inset:0; z-index:6; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 46% 58%, rgba(255,195,95,.85), rgba(234,88,12,.55) 55%, rgba(40,12,4,.75) 100%);
    transition:opacity .32s ease;
  }
  #ovenFlash.flash{ opacity:1; }

  /* =========================================================================
     FRAMELESS APPLE ARCADE HUD (Clean Frosted Glass, Zero Chunky Comic Bars)
     ========================================================================= */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding:max(12px, env(safe-area-inset-top)) 16px 0 16px;
    pointer-events:none;
  }
  .hud-left{ display:flex; align-items:center; gap:10px; pointer-events:auto; max-width:min(54vw, 470px); }

  #hootBtn{
    width:58px; height:58px; flex:0 0 58px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,.88);
    background:radial-gradient(circle at 32% 28%, #fff6cc, #fbbf24 62%, #d97706 100%);
    box-shadow:0 8px 24px rgba(24,10,4,.36), inset 0 2px 4px rgba(255,255,255,.65);
    padding:4px; cursor:pointer;
    transition:transform .2s cubic-bezier(.34,1.8,.5,1);
    animation:hootFloat 2.8s ease-in-out infinite alternate;
  }
  #hootBtn:active{ transform:scale(.9); }
  @keyframes hootFloat{ from{ transform:translateY(0); } to{ transform:translateY(-3px); } }

  #promptBubble{
    background:var(--warm-glass);
    backdrop-filter:blur(20px) saturate(1.4);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    color:var(--ink);
    border:1.5px solid rgba(255,255,255,.72);
    border-radius:20px;
    padding:8px 15px;
    font-family:"Fredoka", -apple-system, sans-serif;
    font-weight:600;
    font-size:clamp(13px, 1.55vw, 15.5px);
    line-height:1.25;
    box-shadow:0 10px 28px rgba(20,8,3,.26), inset 0 1px 0 rgba(255,255,255,.8);
    transition:opacity .35s ease, transform .35s ease;
  }
  #promptBubble b{ color:#b91c1c; font-weight:700; }

  .hud-right{ display:flex; align-items:center; gap:8px; pointer-events:auto; flex-shrink:0; }

  #chefBadges{
    display:flex; align-items:center; gap:5px;
    background:var(--dark-glass);
    backdrop-filter:blur(18px) saturate(1.3);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
    border:1.5px solid rgba(255,235,200,.28);
    border-radius:999px; padding:4px 8px;
    box-shadow:0 8px 24px rgba(15,6,2,.32);
  }
  .cbadge{
    position:relative; width:36px; height:36px; border-radius:50%;
    border:2px solid rgba(255,255,255,.24); background:rgba(255,255,255,.10);
    display:grid; place-items:center; cursor:pointer; padding:2px; overflow:hidden;
    filter:grayscale(.9) opacity(.55);
    transition:transform .3s cubic-bezier(.34,1.8,.5,1), filter .3s, border-color .3s;
  }
  .cbadge img{ width:100%; height:100%; object-fit:contain; }
  .cbadge.active-cust{
    border-color:#fbbf24; background:rgba(251,191,36,.24);
    box-shadow:0 0 14px rgba(251,191,36,.55);
    filter:none; transform:scale(1.06);
  }
  .cbadge.served{
    filter:none; border-color:#4ade80;
    background:radial-gradient(circle at 32% 28%, #fef08a, #f59e0b 80%);
    box-shadow:0 0 14px rgba(74,222,128,.65);
    animation:popBadge .5s cubic-bezier(.34,1.8,.5,1);
  }
  .cbadge-check{
    position:absolute; right:-1px; bottom:-1px; font-size:10px; font-weight:900; line-height:1;
    background:#16a34a; color:#fff; border-radius:50%; width:15px; height:15px;
    display:grid; place-items:center; border:1.5px solid #fff;
  }
  @keyframes popBadge{ 0%{ transform:scale(.5); } 65%{ transform:scale(1.22); } 100%{ transform:scale(1); } }

  #starPill{
    display:flex; align-items:center; gap:5px;
    background:var(--warm-glass);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1.5px solid rgba(255,255,255,.72); border-radius:999px;
    padding:6px 13px; font-family:"Fredoka", sans-serif; font-weight:700; font-size:17px; color:var(--ink);
    box-shadow:0 8px 22px rgba(20,8,3,.24);
  }
  #doneBtn{
    border:1.5px solid rgba(255,255,255,.45); border-radius:999px;
    background:linear-gradient(180deg, #34d399 0%, #059669 100%);
    color:#fff; font-family:"Fredoka", sans-serif; font-weight:700; font-size:15px;
    padding:8px 15px; cursor:pointer; white-space:nowrap;
    box-shadow:0 8px 20px rgba(5,150,105,.38), inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .16s ease;
  }
  #doneBtn:active{ transform:scale(.94); }

  /* Tactile Pinned Italian Parchment Order Slip (Clean Pixar Sprites Only — Zero Raw Emojis!) */
  #orderTicket{
    position:absolute; right:16px; top:76px; z-index:11;
    background:linear-gradient(180deg, rgba(255,252,244,.94) 0%, rgba(252,243,225,.92) 100%);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1.5px solid rgba(255,255,255,.85);
    border-radius:18px;
    padding:10px 11px 9px;
    box-shadow:0 14px 32px rgba(24,10,4,.28), inset 0 1px 0 rgba(255,255,255,.95);
    display:flex; flex-direction:column; gap:6px; min-width:136px; max-width:176px;
    transition:opacity .35s ease, transform .35s ease;
  }
  #orderTicket::before{
    content:""; position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:26px; height:10px; border-radius:999px;
    background:linear-gradient(180deg, #fde68a, #b45309);
    box-shadow:0 2px 5px rgba(0,0,0,.32);
  }
  .ticket-head{
    display:flex; align-items:center; gap:6px;
    font-family:"Fredoka", sans-serif; font-weight:700; font-size:13.5px; color:#7c2d12;
    border-bottom:1.5px dashed rgba(180,83,9,.28); padding-bottom:5px;
  }
  .ticket-head img{ width:22px; height:22px; object-fit:contain; }
  .ticket-list{ display:flex; flex-direction:column; gap:5px; }
  .ticket-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:rgba(255,255,255,.68); border:1px solid rgba(180,83,9,.14); border-radius:11px;
    padding:4px 8px; font-family:"Fredoka", sans-serif; font-weight:700; font-size:14px; color:var(--ink);
  }
  .ticket-row.done{
    background:rgba(220,252,231,.88); border-color:rgba(34,197,94,.42); color:#15803d;
  }
  .ticket-row-ic{ display:flex; align-items:center; gap:6px; }
  .ticket-row-ic img{ width:26px; height:26px; object-fit:contain; filter:drop-shadow(0 2px 3px rgba(0,0,0,.22)); }
  .ticket-chk{
    width:20px; height:20px; border-radius:50%;
    background:#16a34a; color:#fff; font-size:12px; font-weight:900;
    display:grid; place-items:center;
  }

  /* Refined Brass & Glass Oven Progress Dial (No Giant Cartoon Emoji Blocking the Oven!) */
  #ovenDial{
    position:absolute; right:20px; top:82px; z-index:15;
    width:86px; height:86px; border-radius:50%;
    background:radial-gradient(circle at 35% 28%, rgba(56,24,10,.78), rgba(24,9,4,.88));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:2.5px solid rgba(253,224,71,.72);
    box-shadow:0 12px 30px rgba(0,0,0,.48), 0 0 28px rgba(249,115,22,.45);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none; opacity:0; transform:scale(.75);
    transition:opacity .35s ease, transform .35s cubic-bezier(.34,1.6,.5,1);
  }
  #ovenDial.show{ opacity:1; transform:scale(1); }
  #ovenDial svg{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  #ovenDialVal{
    position:relative; z-index:2;
    font-family:"Fredoka", sans-serif; font-weight:700; font-size:20px; color:#fef08a;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  #ovenDialSub{
    position:relative; z-index:2;
    font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#fed7aa;
  }

  /* Floating Hero Action Pill (BAKE / SERVE / NEXT ORDER) */
  #actionStage{
    position:absolute; left:0; right:0; bottom:94px; z-index:12;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    pointer-events:none; padding:0 14px;
  }
  .hero-action-btn{
    pointer-events:auto;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    border:2.5px solid rgba(255,255,255,.88); border-radius:999px;
    padding:12px 28px; cursor:pointer;
    font-family:"Fredoka", sans-serif; font-weight:700; font-size:clamp(19px, 2.7vw, 24px); color:#fff;
    text-shadow:0 2px 6px rgba(36,15,6,.45);
    animation:heroPulse .85s ease-in-out infinite alternate;
    transition:transform .16s ease;
  }
  .hero-action-btn:active{ transform:scale(.94); }
  #bakeBtn{
    background:linear-gradient(180deg, #fb923c 0%, #ea580c 52%, #b91c1c 100%);
    box-shadow:0 14px 32px rgba(185,28,28,.5), 0 0 28px rgba(251,146,60,.65), inset 0 2px 2px rgba(255,255,255,.42);
  }
  #serveBtn{
    background:linear-gradient(180deg, #fde047 0%, #f59e0b 55%, #b45309 100%);
    color:#2c1810; text-shadow:0 1px 0 rgba(255,255,255,.45);
    box-shadow:0 14px 32px rgba(180,83,9,.46), 0 0 28px rgba(253,224,71,.62), inset 0 2px 2px rgba(255,255,255,.6);
  }
  #nextOrderBtn{
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    box-shadow:0 14px 32px rgba(22,163,74,.46), 0 0 26px rgba(74,222,128,.55), inset 0 2px 2px rgba(255,255,255,.42);
  }
  @keyframes heroPulse{
    from{ transform:scale(1); }
    to{ transform:scale(1.045); }
  }
  .tap-finger{ display:inline-block; font-size:22px; line-height:1; animation:fingerHop .6s ease-in-out infinite alternate; }
  @keyframes fingerHop{ from{ transform:translateY(0); } to{ transform:translateY(-5px); } }

  /* Sleek Translucent Floating Apple Arcade Bottom Glass Pill (Never Blocks the Oak Counter!) */
  #kitchenBar{
    position:absolute; left:50%; bottom:max(10px, env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:11;
    max-width:min(96vw, 760px);
    background:var(--dark-glass);
    backdrop-filter:blur(24px) saturate(1.45);
    -webkit-backdrop-filter:blur(24px) saturate(1.45);
    border:1.5px solid rgba(255,235,205,.28);
    border-radius:999px;
    padding:7px 11px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    box-shadow:0 16px 38px rgba(14,6,2,.46), inset 0 1px 0 rgba(255,255,255,.22);
    transition:opacity .35s ease, transform .35s ease;
  }
  #kitchenBar.oven-hide{ opacity:0; transform:translate(-50%, 24px); pointer-events:none; }
  #traySlots{ display:flex; align-items:center; justify-content:center; gap:7px; flex:0 1 auto; }
  .ing-btn{
    position:relative; min-width:64px; height:64px; border-radius:20px;
    border:1.5px solid rgba(255,255,255,.72); cursor:pointer; padding:4px 10px;
    background:linear-gradient(180deg, rgba(255,253,248,.94) 0%, rgba(254,240,210,.88) 100%);
    box-shadow:0 6px 16px rgba(18,8,3,.30), inset 0 1px 1px rgba(255,255,255,.88);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-family:"Fredoka", sans-serif; font-weight:700; font-size:11.5px; color:var(--ink);
    transition:transform .18s cubic-bezier(.34,1.8,.5,1), box-shadow .18s;
  }
  .ing-btn:active{ transform:scale(.92); }
  .ing-btn img{ width:36px; height:36px; object-fit:contain; filter:drop-shadow(0 3px 4px rgba(0,0,0,.26)); }
  .ing-btn.sel{
    border-color:#fde047;
    background:linear-gradient(180deg, #fef9c3 0%, #fbbf24 100%);
    transform:translateY(-3px) scale(1.04);
  }
  .ing-btn.wanted{
    border-color:#4ade80;
    box-shadow:0 0 0 2.5px rgba(74,222,128,.9), 0 8px 20px rgba(34,197,94,.42);
    animation:wantGlow .85s ease-in-out infinite alternate;
  }
  @keyframes wantGlow{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-3px) scale(1.04); } }
  .ing-badge{
    position:absolute; top:-6px; right:-5px; min-width:21px; height:21px; border-radius:999px;
    background:#16a34a; color:#fff; border:2px solid #fff; padding:0 5px;
    font-family:"Fredoka", sans-serif; font-weight:700; font-size:11.5px;
    display:grid; place-items:center; box-shadow:0 3px 8px rgba(0,0,0,.32);
  }
  .kitchen-controls{ display:flex; align-items:center; gap:6px; flex-shrink:0; padding-left:4px; border-left:1px solid rgba(255,235,205,.2); }
  .k-pill{
    border:1.5px solid rgba(255,255,255,.35); border-radius:999px;
    background:rgba(255,248,236,.16);
    color:#fff9f0; font-family:"Fredoka", sans-serif; font-weight:600; font-size:13.5px;
    padding:9px 13px; cursor:pointer; white-space:nowrap;
    box-shadow:0 4px 12px rgba(0,0,0,.22);
    transition:background .15s, transform .15s;
  }
  .k-pill:active{ transform:scale(.93); }
  #modeBtn{ background:rgba(56,189,248,.28); border-color:rgba(186,230,253,.48); }
  #bellCtrlBtn{ background:rgba(251,191,36,.28); border-color:rgba(254,240,138,.48); }

  /* Celebratory Apple Arcade Win Overlay */
  #winOverlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(22,10,5,.68); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .win-card{
    background:linear-gradient(180deg, rgba(255,253,247,.97) 0%, rgba(254,243,215,.96) 100%);
    border:2px solid rgba(255,255,255,.85); border-radius:32px;
    padding:28px 26px; text-align:center; max-width:440px; width:100%;
    box-shadow:0 28px 64px rgba(0,0,0,.52), inset 0 2px 0 rgba(255,255,255,.95);
  }
  .win-trophy{ font-size:56px; line-height:1.1; margin-bottom:8px; }
  .win-card h2{ margin:0 0 8px; font-family:"Fredoka", sans-serif; font-size:30px; color:var(--ink); }
  .win-card p{ margin:0 0 20px; font-weight:700; font-size:16px; color:#573b2c; line-height:1.4; }
  .big-play{
    border:2px solid rgba(255,255,255,.6); border-radius:999px;
    background:linear-gradient(180deg, #34d399 0%, #059669 100%);
    color:#fff; font-family:"Fredoka", sans-serif; font-weight:700; font-size:19px;
    padding:12px 28px; cursor:pointer; box-shadow:0 12px 28px rgba(5,150,105,.42);
  }

  @media (max-width: 740px){
    #hud{ flex-wrap:wrap; align-items:center; gap:6px; padding:max(8px, env(safe-area-inset-top)) 10px 0; }
    .hud-left{ display:contents; }
    #hootBtn{ width:48px; height:48px; flex:0 0 48px; order:1; }
    .hud-right{ order:2; margin-left:auto; gap:6px; }
    #chefBadges{ display:none; }
    #starPill{ font-size:15px; padding:5px 10px; }
    #doneBtn{ font-size:14px; padding:6px 12px; }
    #promptBubble{
      order:3; flex:1 0 100%; width:100%;
      padding:6px 12px; border-radius:15px; font-size:13px; text-align:center;
    }
    #orderTicket{
      left:10px; right:auto; top:118px;
      padding:7px 8px; border-radius:14px; min-width:0; max-width:132px; gap:4px;
    }
    .ticket-head{ font-size:12px; padding-bottom:3px; }
    .ticket-row{ padding:3px 6px; font-size:12.5px; }
    .ticket-row-ic img{ width:21px; height:21px; }
    #kitchenBar{
      width:min(96vw, 430px); border-radius:24px; padding:7px 8px;
      flex-direction:column; align-items:stretch; gap:6px;
    }
    #traySlots{ gap:5px; width:100%; }
    .ing-btn{ flex:1 1 0; min-width:0; height:56px; border-radius:15px; padding:3px 2px; font-size:10px; }
    .ing-btn img{ width:30px; height:30px; }
    .kitchen-controls{ border-left:none; padding-left:0; display:grid; grid-template-columns:1fr 1fr; gap:6px; width:100%; }
    .k-pill{ font-size:12.5px; padding:7px 8px; text-align:center; }
    #actionStage{ bottom:132px; }
    .hero-action-btn{ padding:10px 22px; font-size:19px; }
  }
</style>
</head>
<body>
<div id="stage">
  <!-- Raytraced Pixar Diorama Backdrops (100% Unobstructed Ratatouille / Luca World!) -->
  <div id="bgKitchen" class="diorama-bg" aria-hidden="true"></div>
  <div id="bgOven" class="diorama-bg" aria-hidden="true"></div>
  <canvas id="atmoCanvas" aria-hidden="true"></canvas>

  <!-- Camera-Matched Transparent GPU WebGL2 PBR Engine (Shadows, IBL, 3D Pizza, Tools & Bowls) -->
  <canvas id="glCanvas" aria-label="Real-Time 3D Pixar Pizza Shop"></canvas>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>
  <div id="ovenFlash" aria-hidden="true"></div>

  <!-- Frameless Apple Arcade Top HUD -->
  <div id="hud">
    <div class="hud-left">
      <button id="hootBtn" type="button" aria-label="Tap Hoot to hear again">
        <svg viewBox="0 0 200 210" aria-hidden="true"><path d="M82 178 L100 205 L118 178 Z" fill="#8a5a33"/><ellipse cx="34" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(14 34 128)"/><ellipse cx="166" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(-14 166 128)"/><ellipse cx="100" cy="118" rx="66" ry="72" fill="#a06a3b"/><ellipse cx="100" cy="140" rx="44" ry="46" fill="#fdeed3"/><path d="M52 44 Q40 14 62 22 Q74 27 70 48 Z" fill="#8a5a33"/><path d="M148 44 Q160 14 138 22 Q126 27 130 48 Z" fill="#8a5a33"/><circle cx="100" cy="72" r="52" fill="#a06a3b"/><ellipse cx="78" cy="74" rx="24" ry="26" fill="#fdeed3"/><ellipse cx="122" cy="74" rx="24" ry="26" fill="#fdeed3"/><circle cx="78" cy="72" r="11" fill="#17324f"/><circle cx="122" cy="72" r="11" fill="#17324f"/><circle cx="82" cy="68" r="4" fill="#fff"/><circle cx="126" cy="68" r="4" fill="#fff"/><circle cx="56" cy="94" r="8" fill="#ffb59d" opacity=".85"/><circle cx="144" cy="94" r="8" fill="#ffb59d" opacity=".85"/><path d="M90 88 Q100 84 110 88 Q106 102 100 104 Q94 102 90 88 Z" fill="#ff9f1c" stroke="#e07f00" stroke-width="1.5"/></svg>
      </button>

<script>
(function(){

  /* =========================================================================

  var voiceA = new Audio();
  var voiceGen = 0, lastStepClips = null, idleHelpTimer = null, idleHelpReminded = false;
  var won = false, hootSpeakingUntil = 0;

  function hasClip(id){
    try{
      if(window.parent && window.parent.HOOT_HAVE && window.parent.HOOT_HAVE[id]) return true;
      if(window.HOOT_HAVE && window.HOOT_HAVE[id]) return true;
    }catch(e){}
    return false;
  }
  function resolveCmd(preferredId, fallbacks){
    if(preferredId && hasClip(preferredId)) return [preferredId];
    return (fallbacks && fallbacks.length) ? fallbacks.slice() : [];
  }
  function clearIdleHelp(){
    if(idleHelpTimer){ clearTimeout(idleHelpTimer); idleHelpTimer = null; }
  }
  function armIdleHelp(){
    clearIdleHelp();
    if(won || !lastStepClips || !lastStepClips.length || idleHelpReminded) return;
    idleHelpTimer = setTimeout(function(){
      if(won || !lastStepClips || !lastStepClips.length) return;
      idleHelpReminded = true;
      playVoice(lastStepClips);
    }, 11500);
  }
  window.addEventListener("pointerdown", function(){
    idleHelpReminded = false;
    armIdleHelp();
  }, true);

  function playVoice(clips){
    if(!clips || !clips.length) return;
    var myGen = ++voiceGen, i = 0;
    voiceA.onended = null; voiceA.onerror = null;
    try{ voiceA.pause(); }catch(e){}
    hootSpeakingUntil = performance.now() + 2600;
    function step(){
      if(myGen !== voiceGen || i >= clips.length){ hootSpeakingUntil = 0; return; }
      var id = clips[i++];
      if(!id){ step(); return; }
      hootSpeakingUntil = performance.now() + 3400;
      voiceA.src = "assets/voice/" + id + ".mp3";
      voiceA.onended = step; voiceA.onerror = step;
      var p = voiceA.play(); if(p && p.catch) p.catch(function(){});
    }
    step();
  }
  function setStepVoice(preferredId, fallbacks, speakNow){
    var seq = resolveCmd(preferredId, fallbacks);
    lastStepClips = seq;
    idleHelpReminded = false;
    armIdleHelp();
    if(speakNow !== false && seq.length) playVoice(seq);
  }

  /* =========================================================================

     ========================================================================= */

      var t = c.currentTime, f = PENTA[(idx || 0) % PENTA.length];

      o.frequency.exponentialRampToValueAtTime(f * 1.12, t + 0.08);
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);

      var g = c.createGain(); g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.002, t + 0.26);

      var bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1850; bp.Q.value = 0.65;
      var g = c.createGain();
      g.gain.setValueAtTime(0.01, t);
      g.gain.linearRampToValueAtTime(0.11, t + 0.5);
      g.gain.exponentialRampToValueAtTime(0.002, t + d);

  function rebuildPizzaPBRTexture(){
    pizzaTexDirty = false;
    var S = PBUF;
    /* Warm solid dough-to-golden-crust base fill so edge vertices never turn dark */
    var br = Math.round(234 - bakeProgress * 52);
    var bg = Math.round(212 - bakeProgress * 92);
    var bb = Math.round(172 - bakeProgress * 118);
    pcCtx.fillStyle = "rgb(" + br + "," + bg + "," + bb + ")";
    pcCtx.fillRect(0, 0, S, S);
    prCtx.fillStyle = "#ebebeb";
    prCtx.fillRect(0, 0, S, S);

    /* 1. Raw floured dough -> stretched Pixar crust -> golden blistered wood-fired crust */
    if(phase === "dough" && doughRoll < 0.92 && IMG.doughBall.complete && IMG.doughBall.naturalWidth){
      var padD = -S * 0.11;
      pcCtx.drawImage(IMG.doughBall, padD, padD, S - padD * 2, S - padD * 2);
      if(doughRoll > 0.1 && IMG.crust.complete && IMG.crust.naturalWidth){
        pcCtx.save(); pcCtx.globalAlpha = Math.min(1, doughRoll * 1.15);
        pcCtx.drawImage(IMG.crust, -S * 0.02, -S * 0.02, S * 1.04, S * 1.04); pcCtx.restore();
      }
    } else {
      if(IMG.crust.complete && IMG.crust.naturalWidth) pcCtx.drawImage(IMG.crust, -S * 0.02, -S * 0.02, S * 1.04, S * 1.04);
      if(bakeProgress > 0.01 && IMG.crustBaked.complete && IMG.crustBaked.naturalWidth){
        pcCtx.save(); pcCtx.globalAlpha = Math.min(1, bakeProgress);
        pcCtx.drawImage(IMG.crustBaked, -S * 0.02, -S * 0.02, S * 1.04, S * 1.04); pcCtx.restore();
      }
    }

    /* 2. Glossy San Marzano Marinara (or Pesto/Garlic in Free Play) */
    if(saucePct > 0){
      var sImg = IMG["sauce_" + activeSauce] || IMG.sauce_red;
      var pad = S * 0.085, sw = S - pad * 2;
      if(sImg && sImg.complete && sImg.naturalWidth){
        if(saucePct >= 0.99){
          pcCtx.drawImage(sImg, pad, pad, sw, sw);
          prCtx.fillStyle = "#262626";
          prCtx.beginPath(); prCtx.arc(S * 0.5, S * 0.5, S * 0.37, 0, Math.PI * 2); prCtx.fill();
        } else {
          scCtx.clearRect(0, 0, S, S);
          scCtx.globalCompositeOperation = "source-over";
          scCtx.drawImage(sauceMaskCanvas, 0, 0);
          scCtx.globalCompositeOperation = "source-in";
          scCtx.drawImage(sImg, pad, pad, sw, sw);
          scCtx.globalCompositeOperation = "source-over";
          pcCtx.drawImage(sauceCompCanvas, 0, 0);
          prCtx.save(); prCtx.globalCompositeOperation = "darken";
          prCtx.drawImage(sauceMaskCanvas, 0, 0); prCtx.restore();
        }
      }
    }

    /* 3. Snowy Shredded Mozzarella -> Melts into Golden-Blistered Melted Mozzarella with Marinara Peeking Through! */
    if(cheeseShakes > 0){
      var padC = S * 0.095, cw = S - padC * 2;
      if(IMG.cheeseRaw.complete && IMG.cheeseRaw.naturalWidth){
        var rawA = Math.min(1, cheeseShakes === 1 ? 0.45 : (cheeseShakes === 2 ? 0.78 : 0.96));
        var meltFade = Math.max(0, 1 - bakeProgress * 1.25);
        if(rawA * meltFade > 0.01){
          pcCtx.save(); pcCtx.globalAlpha = rawA * meltFade;
          pcCtx.drawImage(IMG.cheeseRaw, padC, padC, cw, cw);
          if(masterChefUnlocked){
            pcCtx.globalCompositeOperation = "lighter"; pcCtx.globalAlpha = rawA * meltFade * 0.24;
            pcCtx.fillStyle = "#fde047"; pcCtx.beginPath(); pcCtx.arc(S * 0.5, S * 0.5, S * 0.34, 0, Math.PI * 2); pcCtx.fill();
          }
          pcCtx.restore();
        }
      }
      if(bakeProgress > 0.05 && IMG.cheeseMelted.complete && IMG.cheeseMelted.naturalWidth){
        pcCtx.save(); pcCtx.globalAlpha = Math.min(0.96, bakeProgress * 1.12);
        pcCtx.drawImage(IMG.cheeseMelted, padC, padC, cw, cw); pcCtx.restore();
        var rVal = Math.round(118 - bakeProgress * 76);
        prCtx.fillStyle = "rgb(" + rVal + "," + rVal + "," + rVal + ")";
        prCtx.beginPath(); prCtx.arc(S * 0.5, S * 0.5, S * 0.34, 0, Math.PI * 2); prCtx.fill();
      }
    }

    /* Switch real Sobel Normal Map + Physical Clearcoat smoothly per cooking stage!
       Keep sheen strictly 0 once sauce/cheese is on so rich ruby marinara NEVER washes out to pink! */
    if(bakeProgress > 0.35){
      pizzaSurfaceMat.normalMap = cheeseShakes > 0 ? normCheese : normCrust;
      pizzaSurfaceMat.normalScale.set(1.2, 1.2);
      pizzaSurfaceMat.clearcoat = 0.24 + bakeProgress * 0.22;
      pizzaSurfaceMat.clearcoatRoughness = 0.22;
      pizzaSurfaceMat.sheen = 0.0;
      pizzaSurfaceMat.envMapIntensity = 0.56;
    } else if(saucePct > 0.05){
      pizzaSurfaceMat.normalMap = cheeseShakes > 0 ? normDough : normSauce;
      pizzaSurfaceMat.normalScale.set(1.15, 1.15);
      pizzaSurfaceMat.clearcoat = cheeseShakes > 0 ? 0.14 : 0.36;
      pizzaSurfaceMat.clearcoatRoughness = 0.22;
      pizzaSurfaceMat.sheen = 0.0;
      pizzaSurfaceMat.envMapIntensity = 0.48;
    } else {
      pizzaSurfaceMat.normalMap = normDough;
      pizzaSurfaceMat.normalScale.set(0.85, 0.85);
      pizzaSurfaceMat.clearcoat = 0.0;
      pizzaSurfaceMat.sheen = 0.28;
      pizzaSurfaceMat.envMapIntensity = 0.55;
    }

    pizzaColTex.needsUpdate = true;
    pizzaRoughTex.needsUpdate = true;
  }

  function updateCameraTargets(snapNow){
    var port = isPortrait();
    hootPlane.visible = !port && !inOvenView;
    hootShadow.visible = !port && !inOvenView;
    custPlane.position.set(port ? 0.56 : 1.12, port ? 0.62 : 0.56, -2.55);
    custShadow.position.set(custPlane.position.x, custPlane.position.y - 0.80, -2.55);

    if(inOvenView){
      /* Exact 19.5° low cinematic camera matching the round flat stone hearth in bg_oven_interior.jpg! */
      camera.fov = port ? 44 : 33;
      camera.updateProjectionMatrix();
      camGoalPos.set(0.0, port ? 1.82 : 1.52, port ? 5.25 : 4.25);
      camGoalLook.set(0.04, 0.42, -0.15);
    } else {
      camera.fov = port ? 48 : 37;
      camera.updateProjectionMatrix();
      if(doughTossT > 0){
        camGoalPos.set(0, port ? 3.55 : 2.65, port ? 7.35 : 5.75);
        camGoalLook.set(0, 1.38, -0.10);
      } else if(phase === "eating" || phase === "celebrated"){
        camGoalPos.set(0.24, port ? 3.55 : 2.66, port ? 7.35 : 5.78);
        camGoalLook.set(0.42, 0.78, -0.82);
      } else {
        /* Calibrated directly to bg_kitchen.jpg's honey-oak countertop horizon! */
        camGoalPos.set(0, port ? 3.72 : 2.76, port ? 7.55 : 5.88);
        camGoalLook.set(0, port ? 0.56 : 0.72, port ? -0.35 : -0.45);
      }
    }
    if(snapNow){
      camera.position.copy(camGoalPos);
      camCurLook.copy(camGoalLook);
      camera.lookAt(camCurLook);
    }
  }

  /* STAGE 1: ROLL & TOSS */
  function advanceDoughRoll(deltaRoll){
    if(phase !== "dough" || doughTossT > 0) return;
    doughRoll = Math.min(1, doughRoll + deltaRoll);
    updateDoughGeometry(doughRoll, 0);
    pizzaTexDirty = true;
    if(rollSfxCd <= 0){
      sfxWoodRoll(); rollSfxCd = 0.28;
      spawn3DFlourMist(0, 0.14, COUNTER_Z + rollingPinZ * 0.65, 3);
    }
    if(doughRoll >= 0.34 && doughMilestones < 1){
      doughMilestones = 1; hootBounceT = 0.65;

      spawnFloatAtWorld(0, 0.85, COUNTER_Z, "Rolling!", "#fef08a");
      renderTray();
    } else if(doughRoll >= 0.68 && doughMilestones < 2){
      doughMilestones = 2; hootBounceT = 0.65;

  function triggerDoughRollPass(){
    if(phase !== "dough" || doughTossT > 0) return;
    var nextGoal = doughRoll < 0.33 ? 0.36 : (doughRoll < 0.67 ? 0.70 : 1.0);
    rollAutoAnim = { t: 0, startRoll: doughRoll, targetRoll: nextGoal, dir: (doughMilestones % 2 === 0 ? 1 : -1) };
    sfxWoodRoll();
  }

  /* STAGE 2: SWIRL MARINARA */
  function enterSauceStage(){
    phase = "sauce";
    activeSauce = "red";
    smCtx.clearRect(0, 0, PBUF, PBUF);

    bubble.innerHTML = freePlay
      ? "<b>Swirl the sauce!</b> Pick Marinara, Pesto, or Garlic."
      : "<b>Swirl the red sauce!</b> Rub or tap to spread glossy <b>marinara</b>.";
    setStepVoice("hoot-piz-sauce", ["hoot-tap-big-btn"], true);
  }
  function stampSauceAtNorm(rx, rz, radNorm){
    var bx = (0.5 + rx * 0.5) * PBUF, by = (0.5 + rz * 0.5) * PBUF;
    var br = (radNorm || 0.36) * PBUF * 0.5;
    var g = smCtx.createRadialGradient(bx, by, br * 0.2, bx, by, br);
    g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.68, "rgba(255,255,255,0.88)"); g.addColorStop(1, "rgba(255,255,255,0)");
    smCtx.fillStyle = g; smCtx.beginPath(); smCtx.arc(bx, by, br, 0, Math.PI * 2); smCtx.fill();
    pizzaTexDirty = true;
  }
  function triggerSauceSwirlPass(){
    if(phase !== "sauce") return;
    var a0 = saucePct * Math.PI * 5.0;
    ladleSwipeAnim = { t: 0, a0: a0, a1: a0 + Math.PI * 1.15, r0: 0.14 + saucePct * 0.40, r1: Math.min(0.66, 0.32 + saucePct * 0.42) };
    sfxSauceSwirl();
  }
  function applySauceAtLocal(rx, rz, pctStep){
    if(phase !== "sauce") return;
    var d = Math.hypot(rx, rz);
    if(d > 0.70){ rx = (rx / d) * 0.70; rz = (rz / d) * 0.70; }
    ladleTarget.set(rx * PIZZA_R, 0.26, COUNTER_Z + rz * PIZZA_R);
    stampSauceAtNorm(rx, rz, 0.44);
    saucePct = Math.min(1, saucePct + (pctStep || 0.15));
    renderOrderTicket();
    if(saucePct >= 0.76){
      saucePct = 1.0; ladleSwipeAnim = null; pizzaTexDirty = true;
      sfxPlop(5);
      spawn3DSparkles(0, 0.42, COUNTER_Z, 12);
      var myGen = roundGen;
      setTimeout(function(){ if(myGen === roundGen && phase === "sauce" && !won) enterCheeseStage(); }, 520);
    }
  }

  function enterToppingsStage(){

  function checkOrderSatisfied(){
    if(freePlay) return placedToppings.length + flyingToppings.length >= 1;
    var cust = CUSTOMERS[custIdx % CUSTOMERS.length];
    return cust.wants.every(function(w){ return countPlaced(w.key) >= w.count; });
  }
  function toss3DTopping(topKey, startWorld, targetRx, targetRz){
    if(phase !== "toppings") return;
    var rx = targetRx, rz = targetRz;
    if(rx === undefined || rz === undefined){
      var idx = placedToppings.length + flyingToppings.length;
      var ang = idx * 2.39996 + (Math.random() - 0.5) * 0.30;
      var rad = Math.min(0.64, 0.19 + Math.sqrt((idx % 12) + 1) * 0.13);
      rx = Math.cos(ang) * rad; rz = Math.sin(ang) * rad;
    }
    var countNow = countPlaced(topKey) + 1;
    totalStars++; starCountEl.textContent = String(totalStars);
    sfxPlop(countNow);
    if(countNow <= 10) playVoice(["name-number-" + countNow]);

    var m = create3DToppingMesh(topKey, true);
    m.position.copy(startWorld);
    scene.add(m);
    var endW = new THREE.Vector3(rx * PIZZA_R, 0.140, COUNTER_Z + rz * PIZZA_R);
    flyingToppings.push({
      key: topKey, mesh: m, p0: startWorld.clone(), p1: endW, rx: rx, rz: rz,
      rotY: Math.random() * Math.PI * 2, t: 0, num: countNow
    });
    renderOrderTicket();
    renderTray();

    if(!freePlay && checkOrderSatisfied()){
      var myGen = roundGen;
      setTimeout(function(){ if(myGen === roundGen && phase === "toppings" && !won) enterBakeReadyStage(); }, 720);
    } else if(freePlay){
      bakeBtn.hidden = false;

  }

  function startBakingStage(){

    bubble.innerHTML = "<b>Hot out of the oven!</b> Swipe or tap to <b>slice the pizza</b>.";
    setStepVoice("hoot-piz-slice", ["hoot-tap-big-btn"], true);

  function convertTo3DSliceWedges(){
    if(slicesSplit) return;
    slicesSplit = true;
    doughMesh.visible = false;
    toppingsGroup.visible = false;
    slicesRoot.visible = true;
    placedToppings.forEach(function(pt){
      var ang = Math.atan2(pt.rz, pt.rx);
      if(ang < 0) ang += Math.PI * 2;
      var sIdx = Math.min(5, Math.floor(ang / (Math.PI / 3)));
      var clone = create3DToppingMesh(pt.key, true);
      clone.position.set(pt.rx * PIZZA_R, 0.048, pt.rz * PIZZA_R);
      clone.rotation.y = pt.rotY;
      sliceMeshes[sIdx].userData.topHolder.add(clone);
    });
  }

  function rebuild3DCheeseStrings(){
    clearGroupChildren(cheeseStringsGroup);
    if(phase === "eating") return;
    var strMat = new THREE.MeshPhysicalMaterial({ color: 0xfbe79d, roughness: 0.22, clearcoat: 0.72 });
    cutAngles.forEach(function(ang, ci){
      if(!cutDone[ci]) return;
      var ca = Math.cos(ang), sa = Math.sin(ang);
      var nx = -sa, nz = ca;
      for(var k = -2; k <= 2; k++){
        if(k === 0) continue;
        var dist = k * 0.42;
        var pA = new THREE.Vector3(ca * dist - nx * 0.055, 0.052, sa * dist - nz * 0.055);
        var pM = new THREE.Vector3(ca * dist, 0.044, sa * dist);
        var pB = new THREE.Vector3(ca * dist + nx * 0.055, 0.052, sa * dist + nz * 0.055);
        var tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(pA, pM, pB), 6, 0.009, 6, false), strMat);
        cheeseStringsGroup.add(tube);
      }
    });
  }

  function performNextSlice(){
    if(phase !== "slice") return;
    var idx = cutDone.indexOf(false);
    if(idx < 0) return;
    cutDone[idx] = true;
    cutterAnim = { ang: cutAngles[idx], t: 0 };
    convertTo3DSliceWedges();
    rebuild3DCheeseStrings();
    sfxSliceCrunch();
    var cutNum = cutDone.filter(Boolean).length;
    playVoice(["name-number-" + cutNum]);
    spawn3DSparkles(0, 0.38, COUNTER_Z, 10);
    var nextIdx = cutDone.indexOf(false);

    else { cutBeam.visible = false; }
    renderTray();

      var myGen = roundGen;
      setTimeout(function(){ if(myGen === roundGen && phase === "slice" && !won) enterServeStage(); }, 580);

  /* STAGE 7: RING BRASS BELL & LIFT STEAMING 3D SLICES TO THE WINDOW CUSTOMER */

  function startServingCelebration(){

      spawn3DSparkles(custPlane.position.x, custPlane.position.y + 0.35, custPlane.position.z + 0.45, 24);

  /* =========================================================================
     14. 3D RAYCASTER INTERACTION
     ========================================================================= */
  var raycaster = new THREE.Raycaster();
  var pointerNDC = new THREE.Vector2();
  var tablePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.10);
  var hitPt = new THREE.Vector3();

  function raycastTable(clientX, clientY){
    pointerNDC.x = (clientX / W) * 2 - 1;
    pointerNDC.y = -(clientY / H) * 2 + 1;
    raycaster.setFromCamera(pointerNDC, camera);
    var ok = raycaster.ray.intersectPlane(tablePlane, hitPt);
    return ok ? hitPt : null;
  }

  bakeBtn.addEventListener("pointerdown", function(e){ e.preventDefault(); e.stopPropagation(); startBakingStage(); });
  serveBtn.addEventListener("pointerdown", function(e){ e.preventDefault(); e.stopPropagation(); startServingCelebration(); });
  nextOrderBtn.addEventListener("pointerdown", function(e){

  modeBtn.addEventListener("click", function(){

  document.getElementById("bellCtrlBtn").addEventListener("pointerdown", function(e){

  glCanvas.addEventListener("pointerdown", function(e){
    e.preventDefault();
    if(inOvenView) return;
    var pt = raycastTable(e.clientX, e.clientY);

    if(phase === "toppings"){
      var bowlHits = raycaster.intersectObjects(counterBowls, true);
      if(bowlHits.length){
        var obj = bowlHits[0].object;
        while(obj && !obj.userData.topKey) obj = obj.parent;
        if(obj && obj.userData.topKey){
          obj.userData.popT = 1.0;
          activeTopKey = obj.userData.topKey;
          toss3DTopping(activeTopKey, obj.position.clone().add(new THREE.Vector3(0, 0.34, 0)));
          return;
        }
      }
    }
    var bellHit = raycaster.intersectObject(bellGroup, true);
    if(bellHit.length){
      if(phase === "serve"){ startServingCelebration(); return; }
      sfxBellDing(); bellRingT = 1.0; custHopT = 0.8;
      spawn3DSparkles(bellGroup.position.x, 0.42, bellGroup.position.z, 10);
      return;
    }

    if(pt){
      var rx = pt.x / PIZZA_R, rz = (pt.z - COUNTER_Z) / PIZZA_R, dist = Math.hypot(rx, rz);
      if(phase === "dough" && dist < 1.38){
        rollingDragging = true; lastRollY = e.clientY; triggerDoughRollPass(); return;
      } else if(phase === "sauce" && dist < 1.20){
        swipingSauce = true; applySauceAtLocal(rx, rz, 0.16); sfxSauceSwirl(); return;
      } else if(phase === "cheese" && dist < 1.32){
        shakeCheese(); return;
      } else if(phase === "toppings" && dist < 0.88){
        toss3DTopping(activeTopKey, new THREE.Vector3(pt.x, 0.95, pt.z), rx, rz); return;
      } else if(phase === "bake" && e.clientX < W * 0.46 && e.clientY < H * 0.65){
        startBakingStage(); return;
      } else if(phase === "slice" && dist < 1.25){
        performNextSlice(); return;
      } else if(phase === "serve" && dist < 1.25){
        startServingCelebration(); return;
      }
    }

    if(raycaster.intersectObject(custPlane).length){
      var cust = CUSTOMERS[custIdx % CUSTOMERS.length];
      custHopT = 1.0; sfxPlop(4); playVoice([cust.clip]);
      spawn3DSparkles(custPlane.position.x, custPlane.position.y + 0.25, custPlane.position.z + 0.3, 10);
      return;
    }
    if(hootPlane.visible && raycaster.intersectObject(hootPlane).length){
      hootBounceT = 1.0; sfxPlop(5);
      spawn3DSparkles(hootPlane.position.x, hootPlane.position.y + 0.2, hootPlane.position.z + 0.3, 10);
      return;
    }
  });

  window.addEventListener("pointermove", function(e){
    if(phase === "dough" && rollingDragging && doughTossT === 0){
      var dy = e.clientY - lastRollY; lastRollY = e.clientY;
      if(Math.abs(dy) > 1.5){
        rollAutoAnim = null;
        rollingPinZ = Math.max(-1.05, Math.min(1.05, rollingPinZ + dy * 0.012));
        pinBarrel.rotation.x += dy * 0.06;
        advanceDoughRoll(Math.min(0.06, Math.abs(dy) / 220));
      }
    } else if(phase === "sauce" && swipingSauce){
      var pt = raycastTable(e.clientX, e.clientY);
      if(pt){
        var rx = pt.x / PIZZA_R, rz = (pt.z - COUNTER_Z) / PIZZA_R;
        if(Math.hypot(rx, rz) < 1.08 && Math.random() < 0.55){
          ladleSwipeAnim = null;
          applySauceAtLocal(rx, rz, 0.08);
        }
      }
    }
  });
  window.addEventListener("pointerup", function(){ rollingDragging = false; swipingSauce = false; });
  window.addEventListener("pointercancel", function(){ rollingDragging = false; swipingSauce = false; });

  /* =========================================================================
     15. MAIN 60FPS PIXAR ATMOSPHERE + WEBGL2 PBR ANIMATION LOOP
     ========================================================================= */
  var tAcc = 0, lastTime = performance.now();
  var bubbleBubbleMat = new THREE.MeshPhysicalMaterial({
    color: 0xe6b55c, roughness: 0.22, clearcoat: 0.62, clearcoatRoughness: 0.16, transparent: true, opacity: 0.48
  });
  var bubbleGeo = new THREE.SphereGeometry(0.044, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.46);

  function renderAtmosphere(dt){
    atmoCtx.clearRect(0, 0, W, H);
    if(!inOvenView){
      /* Live warm firelight pulse radiating naturally out of the REAL brick oven in bg_kitchen.jpg! */
      var fPulse = 0.24 + Math.sin(tAcc * 9.5) * 0.055 + Math.sin(tAcc * 16.3) * 0.03;
      var ox = W * 0.355, oy = H * 0.505, orad = Math.min(W, H) * 0.28;
      var fg = atmoCtx.createRadialGradient(ox, oy, orad * 0.06, ox, oy, orad);
      fg.addColorStop(0, "rgba(255,196,92," + (fPulse * 1.15).toFixed(3) + ")");
      fg.addColorStop(0.45, "rgba(255,112,24," + (fPulse * 0.55).toFixed(3) + ")");
      fg.addColorStop(1, "rgba(255,80,10,0)");
      atmoCtx.save();
      atmoCtx.globalCompositeOperation = "screen";
      atmoCtx.fillStyle = fg;
      atmoCtx.fillRect(ox - orad, oy - orad, orad * 2, orad * 2);

      /* Gentle golden sunbeam motes floating through the Italian archway window */
      for(var i = 0; i < sunMotes.length; i++){
        var m = sunMotes[i];
        m.x += m.vx * dt; m.y += m.vy * dt;
        if(m.x < 0.35) m.x = 0.88;
        if(m.y > 0.68) m.y = 0.12;
        var a = 0.12 + 0.16 * (Math.sin(tAcc * 2.1 + m.ph) * 0.5 + 0.5);
        atmoCtx.fillStyle = "rgba(255,244,205," + a.toFixed(3) + ")";
        atmoCtx.beginPath(); atmoCtx.arc(m.x * W, m.y * H, m.r, 0, Math.PI * 2); atmoCtx.fill();
      }
      atmoCtx.restore();
    } else {
      /* Live roaring firelight glow & heat bloom synced to the real roaring fire in bg_oven_interior.jpg! */
      var oPulse = 0.30 + Math.sin(tAcc * 12.2) * 0.07 + Math.sin(tAcc * 21.7) * 0.04;
      var fx = W * 0.67, fy = H * 0.51, frad = Math.min(W, H) * 0.48;
      var og = atmoCtx.createRadialGradient(fx, fy, frad * 0.05, fx, fy, frad);
      og.addColorStop(0, "rgba(255,220,125," + (oPulse * 1.1).toFixed(3) + ")");
      og.addColorStop(0.42, "rgba(255,118,24," + (oPulse * 0.58).toFixed(3) + ")");
      og.addColorStop(1, "rgba(210,45,0,0)");
      atmoCtx.save();
      atmoCtx.globalCompositeOperation = "screen";
      atmoCtx.fillStyle = og;
      atmoCtx.fillRect(0, 0, W, H);
      atmoCtx.restore();
    }
  }

  function animate(now){
    requestAnimationFrame(animate);
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now; tAcc += dt;

    if(rollSfxCd > 0) rollSfxCd = Math.max(0, rollSfxCd - dt);
    if(graterAnimT > 0) graterAnimT = Math.max(0, graterAnimT - dt * 1.9);
    if(custHopT > 0) custHopT = Math.max(0, custHopT - dt * 2.2);
    if(custFlipT > 0) custFlipT = Math.max(0, custFlipT - dt * 1.3);
    if(hootBounceT > 0) hootBounceT = Math.max(0, hootBounceT - dt * 2.2);
    if(bellRingT > 0) bellRingT = Math.max(0, bellRingT - dt * 2.8);

    renderAtmosphere(dt);

    /* 1. Flickering Wood-Fire PBR PointLight synced to oven flames */
    var fFlicker = 1.0 + Math.sin(tAcc * 11.4) * 0.16 + Math.sin(tAcc * 19.3) * 0.09;
    fireLight.intensity = (inOvenView ? 5.2 : 2.1) * fFlicker;

    /* 2. Ceramic Bowl Wanted Glow & Tactile Squish-Pop */
    var curCust = CUSTOMERS[custIdx % CUSTOMERS.length];
    counterBowls.forEach(function(bg){
      var k = bg.userData.topKey;
      var want = !freePlay && phase === "toppings" && curCust.wants.some(function(w){ return w.key === k && countPlaced(k) < w.count; });
      if(bg.userData.halo){
        bg.userData.halo.material.opacity = want ? (0.48 + 0.34 * Math.sin(tAcc * 5.2)) : 0;
      }
      if(bg.userData.popT > 0){
        bg.userData.popT = Math.max(0, bg.userData.popT - dt * 4.5);
        var sq = Math.sin(bg.userData.popT * Math.PI) * 0.14;
        bg.scale.set(1 + sq, 1 - sq * 0.7, 1 + sq);
      } else {
        bg.scale.set(1, 1, 1);
      }
    });

    /* 3. Real 3D Rolling Pin Motion (Stage 1) */
    if(phase === "dough" && doughTossT === 0){
      if(rollAutoAnim){
        rollAutoAnim.t = Math.min(1, rollAutoAnim.t + dt * 1.75);
        var rt = rollAutoAnim.t, prevZ = rollingPinZ;
        rollingPinZ = Math.sin(rt * Math.PI * 2.0) * 0.92 * rollAutoAnim.dir;
        pinBarrel.rotation.x += (rollingPinZ - prevZ) * 5.2;
        var goalNow = rollAutoAnim.startRoll + (rollAutoAnim.targetRoll - rollAutoAnim.startRoll) * rt;
        if(goalNow > doughRoll) advanceDoughRoll(goalNow - doughRoll);
        if(rt >= 1) rollAutoAnim = null;
      } else if(!rollingDragging){
        var idleZ = Math.sin(tAcc * 2.6) * 0.32;
        pinBarrel.rotation.x += (idleZ - rollingPinZ) * 2.5;
        rollingPinZ = idleZ;
      }
      var doughTopY = 0.084 + (0.52 * (1 - doughRoll) + 0.075 * doughRoll);
      rollingPinGroup.position.set(0, doughTopY + 0.165, COUNTER_Z + rollingPinZ * (0.62 + doughRoll * 0.32));
      rollingPinGroup.rotation.z = Math.sin(rollingPinZ * 1.2) * 0.025;
    }

    /* 4. Real 3D Spinning Dough Air Toss */
    if(doughTossT > 0){
      doughTossT += dt * 1.3;
      doughSpinY += dt * 10.5;
      var arc = Math.sin(doughTossT * Math.PI);
      pizzaRoot.position.y = 0.084 + arc * 2.15;
      pizzaRoot.rotation.y = doughSpinY;
      pizzaRoot.rotation.x = Math.sin(doughTossT * Math.PI * 2) * 0.22;
      if(doughTossT >= 1){
        doughTossT = 0;
        pizzaRoot.position.set(0, 0.084, COUNTER_Z);
        pizzaRoot.rotation.set(0, 0, 0);
        spawn3DFlourMist(0, 0.14, COUNTER_Z, 10);
        sfxPlop(5);
        enterSauceStage();
      }
    }

    /* 5. Real 3D Copper Ladle Spiral Swirl (Stage 2) */
    if(phase === "sauce"){
      if(ladleSwipeAnim){
        ladleSwipeAnim.t = Math.min(1, ladleSwipeAnim.t + dt * 2.4);
        var lt = ladleSwipeAnim.t;
        var lA = ladleSwipeAnim.a0 + (ladleSwipeAnim.a1 - ladleSwipeAnim.a0) * lt;
        var lR = ladleSwipeAnim.r0 + (ladleSwipeAnim.r1 - ladleSwipeAnim.r0) * lt;
        applySauceAtLocal(Math.cos(lA) * lR, Math.sin(lA) * lR, dt * 0.65);
        if(lt >= 1) ladleSwipeAnim = null;
      } else if(!swipingSauce){
        var swA = tAcc * 2.2;
        ladleTarget.set(Math.cos(swA) * 0.62, 0.34 + Math.sin(tAcc * 4) * 0.035, COUNTER_Z + Math.sin(swA) * 0.62);
      }
      ladleGroup.position.lerp(ladleTarget, Math.min(1, dt * 14));
      ladleSauceFill.material.color.set(activeSauce === "pesto" ? 0x2e6f32 : (activeSauce === "white" ? 0xf2e4c4 : 0xe6c8c0));
    }

    /* 6. Real 3D Stainless Box Grater Motion (Stage 3) */
    if(phase === "cheese"){
      var rub = graterAnimT > 0 ? Math.sin(graterAnimT * Math.PI * 6) * 0.20 : 0;
      graterGroup.position.set(0.30 + Math.sin(tAcc * 2.3) * 0.16, 1.24 + Math.sin(tAcc * 4.2) * 0.04, COUNTER_Z - 0.10);
      graterGroup.rotation.z = -0.22 + (graterAnimT > 0 ? Math.sin(graterAnimT * Math.PI * 5) * 0.16 : 0);
      mozzBlock.position.y = -0.02 + rub;
    }

    /* 7. Real 3D Flying Toppings Arcing & Settling onto the Pizza (Stage 4) */
    for(var fti = flyingToppings.length - 1; fti >= 0; fti--){
      var ft = flyingToppings[fti];
      ft.t = Math.min(1, ft.t + dt * 2.5);
      var u = ft.t;
      ft.mesh.position.lerpVectors(ft.p0, ft.p1, u);
      ft.mesh.position.y += Math.sin(u * Math.PI) * 1.05;
      ft.mesh.rotation.y = ft.rotY + (1 - u) * 2.6;
      if(u >= 1){
        scene.remove(ft.mesh);
        ft.mesh.position.set(ft.rx * PIZZA_R, 0.044, ft.rz * PIZZA_R);
        ft.mesh.rotation.set(0, ft.rotY, 0);
        toppingsGroup.add(ft.mesh);
        placedToppings.push({ key: ft.key, rx: ft.rx, rz: ft.rz, rotY: ft.rotY, mesh: ft.mesh });
        spawn3DSparkles(ft.p1.x, ft.p1.y + 0.12, ft.p1.z, 6);
        spawnFloatAtWorld(ft.p1.x, ft.p1.y + 0.40, ft.p1.z, String(ft.num), "#fef08a");
        flyingToppings.splice(fti, 1);
      }
    }

    /* 8. STAGE 5: SEAMLESS PEEL LAUNCH + FLAT HEARTH BAKING INSIDE bg_oven_interior.jpg! */
    if(phase === "baking"){
      ovenTimerT += dt;
      if(!inOvenView){
        /* Smoothly lift & glide the 3D peel + pizza toward the glowing brick oven mouth on the left */
        var uGo = Math.min(1, ovenTimerT / 0.78);
        var eGo = uGo * uGo * (3 - 2 * uGo);
        var sx = -1.75 * eGo, sy = 0.084 + 0.72 * eGo, sz = COUNTER_Z - 2.35 * eGo;
        var sc = 1 - 0.34 * eGo;
        pizzaRoot.position.set(sx, sy, sz);
        pizzaRoot.scale.setScalar(sc);
        peelGroup.position.set(sx, sy - 0.084 * sc, sz);
        peelGroup.rotation.y = -eGo * 1.15;
        peelGroup.scale.setScalar(sc);
      } else {
        /* Inside bg_oven_interior.jpg: pizza sits 100% FLAT right in the center of the round Pixar stone hearth! */
        var insideT = Math.max(0, ovenTimerT - 0.88);
        var hearthP = new THREE.Vector3(0.04, 0.006, 0.08);
        pizzaRoot.position.copy(hearthP);
        pizzaRoot.scale.setScalar(0.86);

        if(insideT < 0.48){
          /* Wooden peel smoothly retracts out toward viewer leaving pizza flat on hot stone hearth */
          var uRet = insideT / 0.48;
          peelGroup.position.set(hearthP.x, 0.0, hearthP.z + uRet * uRet * 3.8);
        } else if(insideT > 3.05){
          /* DING! Wooden peel slides back smoothly under the golden bubbling pizza to scoop it out! */
          var uSc = Math.min(1, (insideT - 3.05) / 0.45);
          var eSc = 1 - Math.pow(1 - uSc, 3);
          peelGroup.position.set(hearthP.x, 0.0, hearthP.z + (1 - eSc) * 3.8);
        } else {
          peelGroup.position.set(hearthP.x, 0.0, hearthP.z + 4.4);
        }

        /* Live yeast crust puff + leopard-spotted browning + bubbling melted mozzarella! */
        var newBake = Math.max(0, Math.min(1, insideT / 3.15));
        if(Math.abs(newBake - bakeProgress) > 0.012){
          bakeProgress = newBake;
          updateDoughGeometry(1.0, bakeProgress);
          pizzaTexDirty = true;
          ovenDialArc.style.strokeDashoffset = (226.2 * (1 - bakeProgress)).toFixed(1);
        }
        /* Subtle low sizzling melted-cheese domes */
        if(bakeProgress > 0.25 && Math.random() < 0.16){
          var ba = Math.random() * Math.PI * 2, br = Math.sqrt(Math.random()) * 0.88;
          var bm = new THREE.Mesh(bubbleGeo, bubbleBubbleMat);
          bm.position.set(Math.cos(ba) * br, 0.042, Math.sin(ba) * br);
          bm.scale.set(0.25, 0.08, 0.25);
          ovenBubbleGroup.add(bm);
          ovenBubbles3D.push({ mesh: bm, life: 1.0 });
        }
        if(Math.random() < 0.26) spawnOvenEmber();
        if(Math.random() < 0.22) spawn3DSteam(hearthP.x, hearthP.y + 0.16, hearthP.z);
      }
    } else if((phase === "slice" || phase === "serve" || phase === "eating") && Math.random() < 0.09){
      spawn3DSteam(0, 0.24, COUNTER_Z);
    }

    for(var bi = ovenBubbles3D.length - 1; bi >= 0; bi--){
      var ob = ovenBubbles3D[bi];
      ob.life -= dt * 1.1;
      if(ob.life <= 0){ ovenBubbleGroup.remove(ob.mesh); ovenBubbles3D.splice(bi, 1); continue; }
      var swell = Math.sin(ob.life * Math.PI);
      ob.mesh.scale.set(0.55 + swell * 0.72, 0.12 + swell * 0.45, 0.55 + swell * 0.72);
    }

    /* 9. Real 3D Spinning Stainless Rotary Cutter + Separating 3D Slice Wedges (Stage 6) */
    if(phase === "slice"){
      var nextCutI = cutDone.indexOf(false);
      var cAng = cutterAnim ? cutterAnim.ang : (nextCutI >= 0 ? cutAngles[nextCutI] : 0);
      var cProg = cutterAnim ? cutterAnim.t : (0.20 + 0.14 * Math.sin(tAcc * 3.6));
      var dAlong = (-0.94 + cProg * 1.88) * PIZZA_R;
      cutterGroup.position.set(Math.cos(cAng) * dAlong, 0.34, COUNTER_Z + Math.sin(cAng) * dAlong);
      cutterGroup.rotation.y = -cAng;
      if(cutterAnim){
        cutterAnim.t += dt * 3.2;
        cutterWheel.rotation.z -= dt * 18;
        if(cutterAnim.t >= 1) cutterAnim = null;
      }
      cutBeam.material.opacity = 0.52 + 0.26 * Math.sin(tAcc * 6.5);
    }
    if(slicesSplit){
      sliceMeshes.forEach(function(sm, sk){
        if(!sm.visible) return;
        if(phase === "eating" && liftedSlice && liftedSlice.idx === sk) return;
        var cutL = cutDone[sk % 3], cutR = cutDone[(sk + 1) % 3];
        var sep = (cutL && cutR) ? 0.042 : ((cutL || cutR) ? 0.020 : 0);
        sm.position.x += (Math.cos(sm.userData.aMid) * sep - sm.position.x) * Math.min(1, dt * 10);
        sm.position.z += (Math.sin(sm.userData.aMid) * sep - sm.position.z) * Math.min(1, dt * 10);
      });
    }

    /* 10. Real 3D Lifting Hot Slice to Happy Window Customer (Stage 7) */
    if(phase === "eating" && liftedSlice){
      liftedSlice.t = Math.min(1, liftedSlice.t + dt * 1.55);
      var uL = liftedSlice.t, easeL = 1 - Math.pow(1 - uL, 2.4);
      var lMesh = sliceMeshes[liftedSlice.idx % 6];
      if(lMesh && lMesh.visible){
        var targetLocal = new THREE.Vector3(custPlane.position.x, custPlane.position.y - 0.18, custPlane.position.z + 0.25).sub(pizzaRoot.position);
        lMesh.position.lerpVectors(new THREE.Vector3(0, 0, 0), targetLocal, easeL);
        lMesh.position.y += Math.sin(uL * Math.PI) * 0.45;
        lMesh.rotation.x = easeL * 0.18;
        lMesh.rotation.z = -easeL * 0.14;
      }
    }

    /* 11. Grounded Living Pixar Characters + Brass Bell Vibration */
    var speakingBounce = (performance.now() < hootSpeakingUntil) ? Math.abs(Math.sin(tAcc * 18)) * 0.055 : 0;
    var hHop = (hootBounceT > 0 ? Math.sin(hootBounceT * Math.PI) * 0.24 : Math.sin(tAcc * 2.4) * 0.018) + speakingBounce;
    hootPlane.position.y = 0.78 + hHop;
    hootPlane.rotation.z = (performance.now() < hootSpeakingUntil) ? Math.sin(tAcc * 14) * 0.035 : 0;
    crownMesh.position.y = 1.66 + hHop;
    crownMesh.rotation.z += dt * 1.6;

    var baseCustY = isPortrait() ? 0.62 : 0.56;
    var cHop = (custHopT > 0 ? Math.sin(custHopT * Math.PI) * 0.24 : Math.sin(tAcc * 2.1 + 1.2) * 0.018);
    custPlane.position.y = baseCustY + cHop;
    custPlane.rotation.z = custFlipT > 0 ? Math.sin(custFlipT * Math.PI * 2) * 0.24 : Math.sin(tAcc * 1.8) * 0.016;

    bellGroup.rotation.z = bellRingT > 0 ? Math.sin(bellRingT * Math.PI * 7) * 0.18 : 0;

    /* 12. Update Soft 3D Particles */
    for(var pi = particles3D.length - 1; pi >= 0; pi--){
      var p = particles3D[pi];
      p.life -= dt * p.decay;
      if(p.life <= 0){ scene.remove(p.mesh); particles3D.splice(pi, 1); continue; }
      p.vy -= p.grav * dt;
      p.mesh.position.x += p.vx * dt;
      p.mesh.position.y += p.vy * dt;
      p.mesh.position.z += p.vz * dt;
      if(p.floorY !== undefined && p.mesh.position.y < p.floorY){
        p.mesh.position.y = p.floorY; p.vy *= -0.18; p.vx *= 0.65; p.vz *= 0.65;
      }
      if(p.rotV){ p.mesh.rotation.x += p.rotV * dt; p.mesh.rotation.y += p.rotV * 0.7 * dt; }
      if(p.grow){
        var sc = Math.max(0.05, p.mesh.scale.x + p.grow * dt * 0.45);
        p.mesh.scale.set(sc, sc, 1);
      }
      if(p.mesh.material && p.mesh.material.transparent){
        p.mesh.material.opacity = Math.max(0, Math.min(0.92, p.life * 0.85));
      }
    }

    /* 13. Smooth Camera Spring + Dynamic PBR Texture Refresh */
    camera.position.lerp(camGoalPos, Math.min(1, dt * 5.2));
    camCurLook.lerp(camGoalLook, Math.min(1, dt * 5.5));
    camera.lookAt(camCurLook);

    if(pizzaTexDirty) rebuildPizzaPBRTexture();
    renderer.render(scene, camera);

    /* 14. Clean Floating Text Callouts */
    fxCtx.clearRect(0, 0, W, H);
    for(var fi2 = floatTexts.length - 1; fi2 >= 0; fi2--){
      var ft2 = floatTexts[fi2];
      ft2.life -= dt * 1.15;
      if(ft2.life <= 0){ floatTexts.splice(fi2, 1); continue; }
      ft2.y -= dt * 44;
      ft2.scale += (1 - ft2.scale) * Math.min(1, dt * 14);
      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, Math.min(1, ft2.life * 1.4));
      fxCtx.translate(ft2.x, ft2.y);
      fxCtx.scale(ft2.scale, ft2.scale);
      fxCtx.font = '700 28px "Fredoka", -apple-system, sans-serif';
      fxCtx.textAlign = "center"; fxCtx.textBaseline = "middle";
      fxCtx.shadowColor = "rgba(28,12,4,0.55)"; fxCtx.shadowBlur = 10; fxCtx.shadowOffsetY = 3;
      fxCtx.fillStyle = ft2.col; fxCtx.fillText(ft2.txt, 0, 0);
      fxCtx.restore();
    }
  }

  /* =========================================================================
     16. START GAME!
     ========================================================================= */
  startNewOrder(true);
  requestAnimationFrame(animate);

  /* Expose clean read-only state hook for visual QA */
  window.__PIZZA_DEBUG__ = function(){
    return {
      phase: phase, inOvenView: inOvenView, doughRoll: doughRoll, saucePct: saucePct,
      cheeseShakes: cheeseShakes, bakeProgress: bakeProgress,
      placedCount: placedToppings.length, cuts: cutDone.slice(),
      cust: CUSTOMERS[custIdx % CUSTOMERS.length].key, stars: totalStars
    };
  };
})();
</script>
