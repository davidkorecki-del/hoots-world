<!doctype html>
<html lang="en">
<head>
<base href="../">

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hoot's Pizza Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --outline:#4A2511;
    --ink:#3B1D0E;
    --cream:#FFFBF2;
    --gold:#FFD43B;
    --orange:#F97316;
    --green:#22C55E;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  [hidden]{ display:none !important; }
  html,body{
    margin:0; width:100%; height:100%; overflow:hidden;
    font-family:"Nunito",system-ui,sans-serif;
    background:#3B1D0E; touch-action:none;
  }

  #stage{ position:fixed; inset:0; width:100%; height:100dvh; overflow:hidden; background:#3B1D0E; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:1; touch-action:none; }

  /* GLOW-ONLY ATTENTION PULSES — NEVER transform pulses on clickable buttons! */
  @keyframes glowGold{
    0%, 100%{ box-shadow:0 7px 0 var(--outline), 0 0 12px 2px rgba(255,212,59,.55), inset 0 3px 0 rgba(255,255,255,.55); }
    50%{ box-shadow:0 7px 0 var(--outline), 0 0 30px 10px rgba(255,212,59,.95), inset 0 3px 0 rgba(255,255,255,.75); }
  }
  @keyframes glowOrange{
    0%, 100%{ box-shadow:0 8px 0 var(--outline), 0 0 14px 3px rgba(251,146,60,.62), inset 0 3px 0 rgba(255,255,255,.45); }
    50%{ box-shadow:0 8px 0 var(--outline), 0 0 34px 12px rgba(253,224,71,.98), inset 0 3px 0 rgba(255,255,255,.72); }
  }
  @keyframes glowGreen{
    0%, 100%{ box-shadow:0 6px 0 var(--outline), 0 0 10px 2px rgba(74,222,128,.55), inset 0 3px 0 rgba(255,255,255,.65); }
    50%{ box-shadow:0 6px 0 var(--outline), 0 0 26px 8px rgba(74,222,128,.96), inset 0 3px 0 rgba(255,255,255,.85); }
  }

  /* Springy physical button press transition (applies to every clickable button!) */
  .spring-btn{
    transition:transform 260ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 180ms ease;
  }
  .spring-btn:active{
    transform:translateY(5px) scale(0.94);
  }

  /* Top HUD — Big Friendly Targets, Zero Clutter */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding:max(10px, env(safe-area-inset-top)) 14px 0 14px;
    pointer-events:none;
  }
  .hud-left{ display:flex; align-items:center; gap:10px; pointer-events:auto; max-width:min(56vw, 520px); }
  #hootBtn{
    width:64px; height:64px; flex:0 0 64px; border-radius:50%;
    border:4px solid var(--outline);
    background:radial-gradient(circle at 35% 30%, #FFF7C2, #FFD43B 65%, #F59E0B 100%);
    box-shadow:0 6px 0 var(--outline), 0 0 18px rgba(255,212,59,.55), inset 0 3px 0 rgba(255,255,255,.7);
    padding:4px; cursor:pointer;
  }
  #promptBubble{
    background:rgba(255,251,242,.97); color:var(--ink);
    border:4px solid var(--outline); border-radius:22px;
    padding:9px 15px; font-family:"Fredoka",sans-serif; font-weight:700;
    font-size:clamp(14.5px, 1.9vw, 17.5px); line-height:1.25;
    box-shadow:0 6px 0 var(--outline), 0 10px 22px rgba(59,29,14,.32);
  }
  #promptBubble b{ color:#C2410C; }

  .hud-right{ display:flex; align-items:center; gap:8px; pointer-events:auto; }
  #servedPill{
    display:flex; align-items:center; gap:6px;
    background:rgba(59,29,14,.92); border:4px solid var(--gold); border-radius:999px;
    padding:6px 12px; color:#FFFBF2; font-family:"Fredoka",sans-serif; font-weight:800; font-size:17px;
    box-shadow:0 5px 0 var(--outline);
  }
  .pdot{
    width:28px; height:28px; border-radius:50%;
    background:rgba(255,255,255,.16); border:2.5px solid rgba(255,255,255,.35);
    display:grid; place-items:center; font-size:15px; opacity:.45;
    transition:transform 300ms cubic-bezier(0.34,1.56,0.64,1), opacity 220ms, background 220ms;
  }
  .pdot.lit{ opacity:1; background:#F59E0B; border-color:#FEF08A; transform:scale(1.1); box-shadow:0 0 12px #FACC15; }
  .pdot.crown.lit{ background:#FACC15; border-color:#FFF; box-shadow:0 0 18px #FDE047; }
  #starPill{
    display:flex; align-items:center; gap:5px;
    background:var(--cream); border:4px solid var(--outline); border-radius:999px;
    padding:7px 14px; font-family:"Fredoka",sans-serif; font-weight:800; font-size:18px; color:var(--ink);
    box-shadow:0 5px 0 var(--outline);
  }
  #doneBtn{
    min-height:48px;
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ADE80 0%, #16A34A 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:16px;
    padding:8px 16px; cursor:pointer; white-space:nowrap;
    box-shadow:0 5px 0 var(--outline), inset 0 3px 0 rgba(255,255,255,.45);
    text-shadow:0 2px 0 rgba(59,29,14,.4);
  }

  /* Visual Picture Order Card (Icons x Counts + Live Checkmarks + Bonus Star-Burst!) */
  #orderCard{
    position:absolute; right:14px; top:82px; z-index:11;
    background:rgba(255,251,242,.97); border:4px solid var(--outline); border-radius:24px;
    padding:8px 12px; box-shadow:0 7px 0 var(--outline), 0 12px 24px rgba(59,29,14,.32);
    display:flex; flex-direction:column; gap:6px; min-width:136px;
    transition:border-color 220ms, box-shadow 220ms;
  }
  #orderCard.bonus-hit{
    border-color:#16A34A;
    box-shadow:0 7px 0 #14532D, 0 0 28px 6px rgba(74,222,128,.9);
  }
  .oc-head{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:14px; color:#9A3412;
    border-bottom:2.5px dashed #FDBA74; padding-bottom:4px;
  }
  .oc-head img{ width:28px; height:28px; object-fit:contain; }
  .oc-list{ display:flex; flex-direction:column; gap:5px; }
  .oc-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:#FFF7ED; border:2.5px solid #FDBA74; border-radius:14px; padding:4px 9px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:15.5px; color:var(--ink);
    transition:background 220ms, border-color 220ms;
  }
  .oc-row.done{ background:#DCFCE7; border-color:#22C55E; color:#166534; }
  .oc-row img{ width:30px; height:30px; object-fit:contain; filter:drop-shadow(0 2px 1px rgba(74,37,17,.28)); }

  /* Big Hero Action Buttons (BAKE! / RING BELL! / MAKE ANOTHER PIZZA!) — Glow-Only Pulse! */
  #actionStage{
    position:absolute; left:0; right:0; bottom:96px; z-index:12;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    pointer-events:none; padding:0 12px;
  }
  .hero-action-btn{
    pointer-events:auto;
    min-height:68px; min-width:236px;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    border:5px solid var(--outline); border-radius:999px;
    padding:10px 28px; cursor:pointer;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:clamp(21px, 3vw, 28px); color:#fff;
    text-shadow:0 3px 0 rgba(74,37,17,.55);
  }
  #bakeBtn{
    background:linear-gradient(180deg, #FDBA74 0%, #F97316 48%, #DC2626 100%);
    animation:glowOrange 1.15s ease-in-out infinite;
  }
  #serveBtn{
    background:linear-gradient(180deg, #FEF08A 0%, #FACC15 55%, #D97706 100%);
    color:var(--ink); text-shadow:0 1px 0 rgba(255,255,255,.65);
    animation:glowGold 1.15s ease-in-out infinite;
  }
  #nextPizzaBtn{
    background:linear-gradient(180deg, #4ADE80 0%, #16A34A 100%);
    animation:glowGreen 1.15s ease-in-out infinite;
  }

  /* Bottom 8-Topping Tray & Step Dock (Every Target >= 64px!) */
  #kitchenBar{
    position:absolute; left:50%; bottom:max(8px, env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:11;
    width:min(98vw, 940px);
    background:linear-gradient(180deg, rgba(92,48,24,.95) 0%, rgba(59,29,14,.98) 100%);
    border:4px solid var(--outline);
    outline:3px solid #FDBA74; outline-offset:-7px;
    border-radius:26px; padding:8px 11px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 8px 0 #261107, 0 14px 28px rgba(0,0,0,.45);
  }
  #traySlots{
    display:flex; align-items:center; justify-content:center; gap:8px; flex:1 1 auto;
    overflow-x:auto; scrollbar-width:none; padding:4px 3px;
  }
  #traySlots::-webkit-scrollbar{ display:none; }
  .ing-btn{
    position:relative; min-width:68px; height:68px; flex:0 0 auto; border-radius:20px;
    border:4px solid var(--outline); cursor:pointer; padding:4px 7px;
    background:linear-gradient(180deg, #FFFDF7 0%, #FDE68A 100%);
    box-shadow:0 5px 0 var(--outline), inset 0 3px 0 rgba(255,255,255,.85);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:11.5px; color:var(--ink);
    touch-action:none;
  }
  .ing-btn img{ width:40px; height:40px; object-fit:contain; filter:drop-shadow(0 2px 1px rgba(74,37,17,.3)); pointer-events:none; }
  .ing-btn.sel{
    background:linear-gradient(180deg, #FEF08A 0%, #F59E0B 100%);
    animation:glowGold 1.1s ease-in-out infinite;
  }
  .ing-btn.wanted{
    background:linear-gradient(180deg, #F0FDF4 0%, #BBF7D0 100%);
    animation:glowGreen 1.2s ease-in-out infinite;
  }
  .ing-btn.sel.wanted{
    background:linear-gradient(180deg, #FEF08A 0%, #4ADE80 100%);
    animation:glowGold 1.1s ease-in-out infinite;
  }
  .ing-badge{
    position:absolute; top:-7px; right:-6px; min-width:22px; height:22px; border-radius:999px;
    background:#16A34A; color:#fff; border:2.5px solid var(--outline); padding:0 5px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:12px;
    display:grid; place-items:center; box-shadow:0 2px 0 var(--outline);
    pointer-events:none;
  }

  /* Win Overlay (Done button) */
  #winOverlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(59,29,14,.78); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .win-card{
    background:linear-gradient(180deg, #FFFDF7 0%, #FEF3C7 100%);
    border:6px solid var(--outline); border-radius:34px;
    padding:24px 24px; text-align:center; max-width:460px; width:100%;
    box-shadow:0 14px 0 var(--outline), 0 24px 48px rgba(0,0,0,.5);
  }
  .win-card img{ width:100%; max-height:190px; object-fit:cover; border-radius:20px; border:4px solid var(--outline); margin-bottom:10px; }
  .win-card h2{ margin:0 0 8px; font-family:"Fredoka",sans-serif; font-size:32px; color:var(--ink); }
  .win-card p{ margin:0 0 18px; font-weight:800; font-size:17px; color:#5C3018; }
  .big-play{
    min-height:64px;
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ADE80 0%, #16A34A 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:21px;
    padding:12px 28px; cursor:pointer; box-shadow:0 6px 0 var(--outline);
  }

  /* Responsive iPhone Portrait Layout — All 8 Toppings Visible in 4x2 Grid, Zero Overlap! */
  @media (max-width: 740px){
    #hud{ flex-wrap:wrap; align-items:center; gap:6px; padding:max(8px, env(safe-area-inset-top)) 10px 0; }
    .hud-left{ display:contents; }
    #hootBtn{ width:56px; height:56px; flex:0 0 56px; order:1; border-width:3px; }
    .hud-right{ order:2; margin-left:auto; gap:6px; }
    #servedPill{ padding:4px 8px; font-size:14px; border-width:3px; gap:4px; }
    .pdot{ width:22px; height:22px; font-size:12px; }
    #starPill{ font-size:15.5px; padding:5px 10px; border-width:3px; }
    #doneBtn{ min-height:44px; font-size:14px; padding:6px 12px; border-width:3px; }
    #promptBubble{
      order:3; flex:1 0 100%; width:100%;
      padding:7px 12px; border-width:3px; border-radius:16px;
      font-size:13.5px; line-height:1.2; text-align:center;
    }
    #orderCard{
      left:50%; right:auto; top:124px; transform:translateX(-50%);
      flex-direction:row; align-items:center; gap:7px;
      padding:4px 10px; border-width:3px; border-radius:999px; min-width:0;
      box-shadow:0 5px 0 var(--outline), 0 8px 18px rgba(59,29,14,.3);
    }
    .oc-head{ font-size:12px; border-bottom:none; padding-bottom:0; gap:4px; }
    .oc-head span{ display:none; }
    .oc-list{ flex-direction:row; gap:6px; }
    .oc-row{ padding:3px 7px; font-size:13px; border-width:2px; gap:5px; }
    .oc-row img{ width:22px; height:22px; }

    #kitchenBar{
      width:min(97vw, 440px); padding:6px 6px; border-radius:22px; border-width:3px;
    }
    #traySlots{ justify-content:center; gap:5px; }
    #traySlots.is-grid{
      display:grid; grid-template-columns:repeat(4, minmax(64px, 1fr)); gap:6px;
      overflow:visible;
    }
    .ing-btn{ min-width:64px; height:64px; border-radius:16px; border-width:3px; font-size:10.5px; }
    .ing-btn img{ width:34px; height:34px; }
    #actionStage{ bottom:94px; }
    #actionStage.has-grid{ bottom:160px; }
    .hero-action-btn{ min-height:64px; padding:10px 22px; font-size:20px; border-width:4px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="Hoot's Pizza Shop"></canvas>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-left">
      <button id="hootBtn" class="spring-btn" type="button" aria-label="Tap Hoot to hear again">
        <svg viewBox="0 0 64 64" width="100%" height="100%" aria-hidden="true">
          <ellipse cx="32" cy="36" rx="22" ry="23" fill="#8D5524" stroke="#4A2511" stroke-width="3.5"/>
          <ellipse cx="32" cy="43" rx="14" ry="13" fill="#FDE6C4"/>
          <path d="M12 18 L18 26 L23 19 Z M52 18 L46 26 L41 19 Z" fill="#6F3E16" stroke="#4A2511" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="23" cy="30" r="8" fill="#FFF" stroke="#4A2511" stroke-width="2.8"/>
          <circle cx="41" cy="30" r="8" fill="#FFF" stroke="#4A2511" stroke-width="2.8"/>
          <circle cx="24" cy="30" r="4.5" fill="#F59E0B"/><circle cx="42" cy="30" r="4.5" fill="#F59E0B"/>
          <circle cx="24" cy="30" r="2.6" fill="#241710"/><circle cx="42" cy="30" r="2.6" fill="#241710"/>
          <circle cx="25.4" cy="28.3" r="1.4" fill="#FFF"/><circle cx="43.4" cy="28.3" r="1.4" fill="#FFF"/>
          <polygon points="32,33 27.5,39 36.5,39" fill="#F59E0B" stroke="#4A2511" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M18 16 Q16 5 26 7 Q32 1 38 7 Q48 5 46 16 Z" fill="#FFF" stroke="#4A2511" stroke-width="2.8" stroke-linejoin="round"/>
        </svg>
      </button>
      <div id="promptBubble">🥖 <b>STEP 1 — DOUGH!</b> Tap the dough ball <b>4 times</b> to stretch it big!</div>
    </div>
    <div class="hud-right">
      <div id="servedPill" aria-label="Pizzas served toward Golden Crown">
        <span class="pdot" id="pdot0">🍕</span>
        <span class="pdot" id="pdot1">🍕</span>
        <span class="pdot crown" id="pdot2">👑</span>
        <span id="servedNum">0</span>
      </div>
      <div id="starPill" aria-label="Stars earned"><span>⭐</span><span id="starCount">0</span></div>
      <button id="doneBtn" class="spring-btn" type="button">🏆 Done</button>

  <!-- Visual Picture Order Card (Icons x Counts + Live Checkmarks!) -->
  <div id="orderCard" aria-label="Bunny's picture pizza order">
    <div class="oc-head"><img src="assets/pizza_cartoon/bunny.png?v=llprev3e118" alt=""><span>Bunny's Order</span></div>
    <div class="oc-list" id="orderList"></div>
  </div>

  <!-- Big Glow-Only Hero Action Buttons (ZERO transform pulse!) -->
  <div id="actionStage">
    <button id="bakeBtn" class="hero-action-btn spring-btn" type="button" hidden>🔥 BAKE PIZZA!</button>
    <button id="serveBtn" class="hero-action-btn spring-btn" type="button" hidden>🔔 RING BELL!</button>

  <div id="kitchenBar" role="group" aria-label="Pizza ingredients and tools">
    <div id="traySlots"></div>
  </div>

  <!-- Win Overlay -->
  <div id="winOverlay" hidden>
    <div class="win-card">
      <img src="assets/pizza_cartoon/scene_celebration.jpg?v=llprev3e118" alt="Chef Hoot in Golden Crown celebrating with Bunny">
      <h2>Master Pizza Chef!</h2>
      <p id="winSummary">You made delicious pizzas for Bunny!</p>
      <button id="againBtn" class="big-play spring-btn" type="button">↻ Make More Pizza!</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================================
     1. ATOMIC SINGLE-CHANNEL HOOT VOICE ENGINE (ALL 12 RECORDED CLIPS, NEVER 2 AT ONCE!)
     ========================================================================= */
  var voiceA = new Audio();
  var voiceGen = 0, lastStepClip = null, idleHelpTimer = null, idleHelpReminded = false;
  var won = false;

  function clearIdleHelp(){
    if(idleHelpTimer){ clearTimeout(idleHelpTimer); idleHelpTimer = null; }
  }
  function armIdleHelp(){
    clearIdleHelp();
    if(won || !lastStepClip || idleHelpReminded) return;
    idleHelpTimer = setTimeout(function(){
      if(won || !lastStepClip) return;
      idleHelpReminded = true;
      playClip(lastStepClip);
    }, 12500);
  }
  window.addEventListener("pointerdown", function(){
    idleHelpReminded = false;
    armIdleHelp();
  }, true);

  function stopAllParentVoice(){
    try{
      if(window.parent && window.parent !== window){
        if(window.parent.__hwStopIntro) window.parent.__hwStopIntro();
        if(window.parent.__hootStopClip) window.parent.__hootStopClip();
      }
    }catch(e){}
  }
  function parentPizzaIntroPlaying(){
    try{
      return !!(window.parent && window.parent !== window &&
        window.parent.__hwIntroKey === "pizza" &&
        window.parent.__hwIntroPlaying && window.parent.__hwIntroPlaying());
    }catch(e){ return false; }
  }
  function playClip(id){
    if(!id) return;
    var myGen = ++voiceGen;
    stopAllParentVoice();
    voiceA.onended = null; voiceA.onerror = null;
    try{ voiceA.pause(); voiceA.currentTime = 0; }catch(e){}
    voiceA.src = "assets/voice/" + id + ".mp3";
    var p = voiceA.play();
    if(p && p.catch) p.catch(function(){});
  }
  function setStepClip(id, speakNow){
    lastStepClip = id;
    idleHelpReminded = false;
    armIdleHelp();
    if(id === "hoot-piz-welcome" && parentPizzaIntroPlaying()) return;
    if(speakNow !== false) playClip(id);
  }
  window.addEventListener("pagehide", function(){
    try{ voiceA.pause(); }catch(e){}
    clearIdleHelp();
  });

  /* =========================================================================
     2. TACTILE KITCHEN FOLEY AUDIO ENGINE (WebAudio)
     ========================================================================= */
  var actx = null;
  function ac(){
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
    }catch(e){}
    return actx;
  }
  var PENTA = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];

  function sfxDoughPat(n){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime, o = c.createOscillator(), g = c.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(160 + n * 28, t);
      o.frequency.exponentialRampToValueAtTime(72, t + 0.14);
      g.gain.setValueAtTime(0.24, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.17);
    }catch(e){}
  }
  function sfxTossWhoosh(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime, o = c.createOscillator(), g = c.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(640, t + 0.28);
      o.frequency.exponentialRampToValueAtTime(360, t + 0.56);
      g.gain.setValueAtTime(0.01, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.18);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.60);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.62);
    }catch(e){}
  }
  function sfxSauceBrush(){
    try{

  /* Cover-fit transform for stage_main.jpg shifted slightly up on landscape so the board & Bake button sit cleanly above the bottom tray */
  function coverRect(im){
    var iw = (im && im.complete && im.naturalWidth) ? im.naturalWidth : 1376;
    var ih = (im && im.complete && im.naturalHeight) ? im.naturalHeight : 768;
    var sc = Math.max(W / iw, H / ih);
    var dw = iw * sc, dh = ih * sc;
    var dx = (W - dw) * 0.5;
    if(isPortrait()){
      var idealDx = W * 0.50 - BOARD_CAL.boardX * dw;
      dx = Math.max(W - dw, Math.min(0, idealDx));
    }
    var dy = isPortrait() ? ((H - dh) * 0.5 - H * 0.04) : ((H - dh) * 0.5 - H * 0.055);
    return { x: dx, y: dy, w: dw, h: dh, sc: sc };
  }

    var cy = H * 0.665;

        btn.type = "button";
        btn.className = "ing-btn spring-btn" + (selectedTopKey === tp.key ? " sel" : "") + (needs ? " wanted" : "");
        btn.setAttribute("data-top", tp.key);
        var badge = wantObj ? ('<span class="ing-badge">' + (have >= wantObj.count ? "✓" : (wantObj.count - have)) + '</span>') : "";
        btn.innerHTML = badge + '<img src="assets/pizza_cartoon/' + tp.file + VER + '" alt="' + tp.label + '"><span>' + tp.label + '</span>';
        btn.addEventListener("pointerdown", function(e){
          e.preventDefault(); e.stopPropagation();
          selectedTopKey = tp.key;
          sfxPlop(1);
          renderTray();
          var r = cv.getBoundingClientRect();
          var sx = e.clientX - r.left, sy = e.clientY - r.top;
          dragState = {
            kind: "new", key: tp.key, idx: -1,
            x: sx, y: sy, prevX: sx, prevY: sy, vx: 0, tilt: 0, lift: 0,
            startX: sx, startY: sy, moved: false
          };
        });
        traySlots.appendChild(btn);
      });
    } else if(phase === "slice"){
      var bSl = document.createElement("button");
      bSl.type = "button"; bSl.className = "ing-btn spring-btn wanted"; bSl.style.minWidth = "220px";
      bSl.innerHTML = '<img src="assets/pizza_cartoon/pizza_slice.png' + VER + '" alt=""><span>Slice Pizza! (' + cutAngles.length + '/3)</span>';
      bSl.addEventListener("pointerdown", function(e){ e.preventDefault(); e.stopPropagation(); performAutoSlice(); });
      traySlots.appendChild(bSl);
    } else {
      var msg = document.createElement("div");
      msg.style.cssText = 'color:#FEF08A; font-family:"Fredoka",sans-serif; font-weight:800; font-size:15.5px; padding:12px 10px; text-align:center;';
      msg.textContent = phase === "baking"
        ? "🔥 Baking golden, melted & steaming in the brick oven…"
        : (phase === "serve"
          ? "🔔 Tap the brass bell or RING BELL! to serve Bunny!"
          : (phase === "serving"
            ? "❤️ Hoot is serving your hot pizza to Bunny!"
            : "👑 Hooray! Tap above to make another pizza!"));
      traySlots.appendChild(msg);
    }
  }

  /* =========================================================================
     7. 7-STEP INTERACTIVE PIZZA ENGINE
     ========================================================================= */
  function startNewPizza(speakClipId){
    roundGen++;
    phase = "dough";
    currentOrder = ORDER_DECK[pizzasServed % ORDER_DECK.length];
    orderBonusGiven = false; bakePromptSpoken = false; minToppingsMet = false;
    grandCrownCelebration = false;

    doughTaps = 0; doughScale = 0.44; doughTargetScale = 0.44;
    doughSquash = 0; doughSquashVel = 0; doughTossT = 0;

    resetSaucePaint();
    sauceCoverage = 0; sauceDone = false; sauceFullBloom = 0; paintingSauce = false; lastSaucePt = null;
    var bg = boardGeom();
    ladlePos = { x: bg.cx + bg.r * 0.35, y: bg.cy - bg.r * 0.1 };

    holdingCheese = false; cheeseRainCd = 0; cheeseDone = false;
    fallingShreds = []; landedShreds = [];

    selectedTopKey = currentOrder[0] ? currentOrder[0].key : "pep";
    placedToppings = []; flyingToppings = []; dragState = null;

    bakeAnimT = 0; bakeProgress = 0; ovenBubbles = [];
    cutAngles = []; draggingSlice = false; sliceStartPt = null; sliceCurPt = null; cutterAnim = null;
    bellRingT = 0; sceneFade = 0; servingTimer = 0; bunnyHopT = 0.8;

    bakeBtn.hidden = true; serveBtn.hidden = true; nextPizzaBtn.hidden = true;

    updateServedHUD();
    renderOrderCard();
    renderTray();

    bubble.innerHTML = "🥖 <b>STEP 1 — DOUGH!</b> Tap the dough ball <b>4 times</b> to stretch it big!";
    setStepClip(speakClipId || "hoot-piz-welcome", true);
  }

  /* STEP 1: DOUGH (4 taps -> elastic spring jelly wobble + flour puffs + air toss!) */
  function tapDough(){
    if(phase !== "dough" || doughTossT > 0) return;
    doughTaps = Math.min(4, doughTaps + 1);
    doughTargetScale = 0.44 + (doughTaps / 4) * 0.56;
    /* Give a strong squash impulse to our damped harmonic jelly spring! */
    doughSquash = 0.28;
    doughSquashVel = -2.4;
    sfxDoughPat(doughTaps);

    var bg = boardGeom();
    spawnFlourPuffs(bg.cx, bg.cy, 14);
    spawnSparkles(bg.cx, bg.cy - 10, 9);
    spawnFloat(bg.cx, bg.cy - bg.r * 0.52, doughTaps < 4 ? (doughTaps + " / 4!") : "TOSS!! ✨", "#FFD43B");
    renderTray();

    if(doughTaps === 2 || doughTaps === 3){
      playClip("hoot-piz-toss");
    } else if(doughTaps >= 4){
      doughTossT = 0.001;
      sfxTossWhoosh();
      spawnFlourPuffs(bg.cx, bg.cy, 20);
      spawnSparkles(bg.cx, bg.cy - 28, 16);
    }
  }

  /* STEP 2: SAUCE (Drag finger -> real chunky cel-shaded marinara strokes -> silent ~55%!) */
  function enterSauceStep(){
    if(phase !== "dough") return;
    phase = "sauce";
    var bg = boardGeom();
    ladlePos = { x: bg.cx + bg.r * 0.35, y: bg.cy - bg.r * 0.1 };
    renderTray();
    bubble.innerHTML = "🍅 <b>STEP 2 — SAUCE!</b> Drag your finger across the pizza to paint yummy red sauce!";
    setStepClip("hoot-piz-sauce", true);
  }

  function paintSauceStroke(rx0, ry0, rx1, ry1){
    if(phase !== "sauce" || sauceDone) return;
    var steps = Math.max(1, Math.ceil(Math.hypot(rx1 - rx0, ry1 - ry0) * 28));
    var brushR = 0.25;
    for(var s = 0; s <= steps; s++){
      var u = s / steps;
      var rx = rx0 + (rx1 - rx0) * u, ry = ry0 + (ry1 - ry0) * u;
      var d = Math.hypot(rx, ry);
      if(d > 0.74){ rx = (rx / d) * 0.74; ry = (ry / d) * 0.74; }
      var px = (0.5 + rx * 0.5) * SBUF, py = (0.5 + ry * 0.5) * SBUF;
      var pr = brushR * SBUF * 0.5;

      /* Rich glossy cartoon marinara dab with subtle darker rim & tomato flecks */
      spCtx.save();
      spCtx.fillStyle = "#B91C1C";
      spCtx.beginPath(); spCtx.arc(px, py, pr, 0, Math.PI * 2); spCtx.fill();
      spCtx.fillStyle = "#DC2626";
      spCtx.beginPath(); spCtx.arc(px, py, pr * 0.88, 0, Math.PI * 2); spCtx.fill();
      spCtx.fillStyle = "rgba(254,202,202,0.28)";
      spCtx.beginPath(); spCtx.arc(px - pr * 0.22, py - pr * 0.22, pr * 0.30, 0, Math.PI * 2); spCtx.fill();
      if((s % 3) === 0){
        spCtx.fillStyle = "#166534";
        spCtx.beginPath(); spCtx.arc(px + (Math.random() - 0.5) * pr, py + (Math.random() - 0.5) * pr, 2.2, 0, Math.PI * 2); spCtx.fill();
      }
      spCtx.restore();

      for(var gy = 0; gy < COV_N; gy++){
        var cyN = ((gy + 0.5) / COV_N) * 2 - 1;
        for(var gx = 0; gx < COV_N; gx++){
          var ci = gy * COV_N + gx;
          if(covCells[ci]) continue;
          var cxN = ((gx + 0.5) / COV_N) * 2 - 1;
          if(cxN * cxN + cyN * cyN > 0.62) continue;
          if(Math.hypot(cxN - rx, cyN - ry) <= brushR * 0.92){
            covCells[ci] = 1; covFilled++;
          }
        }
      }
    }
    sauceCoverage = covFilled / Math.max(1, covTotalValid);
    if(ladleSfxCd <= 0){ sfxSauceBrush(); ladleSfxCd = 0.14; }

    if(sauceCoverage >= 0.55){
      sauceDone = true;
      paintingSauce = false; lastSaucePt = null;
      sauceFullBloom = 0.01;
      var bg = boardGeom();
      sfxPlop(5);
      spawnSparkles(bg.cx, bg.cy, 16, "#EF4444");
      spawnFloat(bg.cx, bg.cy - bg.r * 0.5, "🍅 YUMMY SAUCE!", "#FFD43B");
      var myGen = roundGen;
      setTimeout(function(){ if(myGen === roundGen && phase === "sauce" && !won) enterCheeseStep(); }, 540);
    }
  }
  function paintAutoSauceSwirl(){
    if(phase !== "sauce" || sauceDone) return;
    var a0 = sauceCoverage * Math.PI * 5, r0 = 0.12 + sauceCoverage * 0.54;
    var x0 = Math.cos(a0) * r0, y0 = Math.sin(a0) * r0;
    var x1 = Math.cos(a0 + 1.35) * Math.min(0.65, r0 + 0.16), y1 = Math.sin(a0 + 1.35) * Math.min(0.65, r0 + 0.16);
    var bg = boardGeom();
    ladlePos = { x: bg.cx + x1 * bg.r, y: bg.cy + y1 * bg.r * bg.squash };
    paintSauceStroke(x0, y0, x1, y1);
    spawnSparkles(ladlePos.x, ladlePos.y, 6, "#EF4444");
  }

  /* STEP 3: CHEESE (Press & hold over pizza -> shreds fall from finger & stick where they land!) */
  function enterCheeseStep(){
    if(phase !== "sauce") return;
    phase = "cheese";
    sauceFullBloom = 1;
    holdingCheese = false; cheeseRainCd = 0; cheeseDone = false;
    var bg = boardGeom();
    cheeseHoldPt = { x: bg.cx, y: bg.cy };
    renderTray();
    bubble.innerHTML = "🧀 <b>STEP 3 — CHEESE!</b> Press &amp; hold over the pizza to rain yummy cheese shreds!";
    setStepClip("hoot-piz-cheese", true);
  }
  function startCheeseHold(px, py){
    if(phase !== "cheese" || cheeseDone) return;
    holdingCheese = true;
    cheeseHoldPt = { x: px, y: py };
    for(var i = 0; i < 6; i++) spawnFallingShred(px, py);
  }
  function spawnFallingShred(px, py){
    if(phase !== "cheese" || cheeseDone || (landedShreds.length + fallingShreds.length) >= CHEESE_GOAL + 10) return;
    var bg = boardGeom();
    var fillFrac = Math.min(1, (landedShreds.length + fallingShreds.length) / CHEESE_GOAL);
    var spread = 0.68 + fillFrac * 0.72;
    var baseCx = px * (1 - fillFrac * 0.42) + bg.cx * (fillFrac * 0.42);
    var baseCy = py * (1 - fillFrac * 0.42) + bg.cy * (fillFrac * 0.42);
    var targetX = baseCx + (Math.random() - 0.5) * bg.r * spread;
    var targetY = baseCy + (Math.random() - 0.5) * bg.r * bg.squash * spread;
    var rx = (targetX - bg.cx) / bg.r, ry = (targetY - bg.cy) / (bg.r * bg.squash);
    var d = Math.hypot(rx, ry);
    if(d > 0.72){ rx = (rx / d) * (0.32 + Math.random() * 0.38); ry = (ry / d) * (0.32 + Math.random() * 0.38); }
    var landX = bg.cx + rx * bg.r, landY = bg.cy + ry * bg.r * bg.squash;
    fallingShreds.push({
      x: px + (Math.random() - 0.5) * 34,
      y: Math.min(py, landY) - 65 - Math.random() * 55,
      targetX: landX, targetY: landY, rx: rx, ry: ry,
      vy: 130 + Math.random() * 95,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 8,
      len: 19 + Math.random() * 14, curve: (Math.random() - 0.5) * 9,
      shade: Math.random() < 0.5 ? "#FFFBEB" : "#FEF08A"
    });
    if(Math.random() < 0.45) sfxCheeseTick(landedShreds.length);
  }

  /* STEP 4: 8 TOPPINGS (Select+Tap, Drag From Tray, Drag to Move, Drag Off/Double-Tap Remove, Order Card Bonus!) */
  function enterToppingsStep(){
    if(phase !== "cheese") return;
    phase = "toppings";
    holdingCheese = false;
    renderOrderCard();
    renderTray();
    refreshBakeButtonVisibility();
    bubble.innerHTML = "🍄 <b>STEP 4 — TOPPINGS!</b> Drag or tap toppings onto your pizza!";
    setStepClip("hoot-piz-toppings", true);
  }

  function checkOrderBonus(){
    renderOrderCard();
    renderTray();
    refreshBakeButtonVisibility();
    var allMatched = currentOrder.every(function(w){ return countPlacedKey(w.key) >= w.count; });
    if(allMatched && !orderBonusGiven){
      orderBonusGiven = true;
      totalStars += 3;
      starCountEl.textContent = String(totalStars);
      bunnyHopT = 1.0;
      sfxCheer();
      var bg = boardGeom(), bn = bunnyGeom();
      spawnSparkles(bg.cx, bg.cy - 20, 26, "#FFD43B");
      spawnHearts(bn.x, bn.y - bn.h * 0.25, 8);
      spawnFloat(bg.cx, bg.cy - bg.r * 0.65, "⭐ BONUS MATCH! +3 ⭐", "#FFD43B");
      renderOrderCard();
      bubble.innerHTML = "⭐ <b>BUNNY'S ORDER MATCHED!</b> Add more or tap <b>🔥 BAKE PIZZA!</b>";
      if(!bakePromptSpoken){ bakePromptSpoken = true; playClip("hoot-piz-bake"); }
    } else if(!bakePromptSpoken && placedToppings.length >= 4){
      bakePromptSpoken = true;
      bubble.innerHTML = "🍕 <b>LOOKS YUMMY!</b> Add more toppings or tap <b>🔥 BAKE PIZZA!</b>";
      playClip("hoot-piz-bake");
    }
  }

  function launchToppingTo(key, rx, ry, fromX, fromY){
    var d = Math.hypot(rx, ry);
    if(d > 0.72){ rx = (rx / d) * 0.72; ry = (ry / d) * 0.72; }
    flyingToppings.push({
      key: key, x0: fromX, y0: fromY, rx: rx, ry: ry,
      rot: (Math.random() - 0.5) * 1.4, t: 0
    });
    minToppingsMet = true;
    totalStars += 1;
    starCountEl.textContent = String(totalStars);
    sfxPlop(placedToppings.length + flyingToppings.length);
    renderOrderCard();
    renderTray();
    refreshBakeButtonVisibility();
  }

  function placeToppingDirect(key, rx, ry){
    var d = Math.hypot(rx, ry);
    if(d > 0.72){ rx = (rx / d) * 0.72; ry = (ry / d) * 0.72; }
    placedToppings.push({
      id: nextTopId++, key: key, rx: rx, ry: ry,
      rot: (Math.random() - 0.5) * 1.4,
      sqPhase: 0, sqAmp: 1.0 /* Triggers squash-and-stretch overshoot bounce! */
    });
    minToppingsMet = true;
    totalStars += 1;
    starCountEl.textContent = String(totalStars);
    var bg = boardGeom();
    sfxPlop(placedToppings.length);
    spawnSparkles(bg.cx + rx * bg.r, bg.cy + ry * bg.r * bg.squash, 10);
    checkOrderBonus();
  }

  function removeToppingAt(idx){
    if(idx < 0 || idx >= placedToppings.length) return;
    var rem = placedToppings.splice(idx, 1)[0];
    var bg = boardGeom();
    sfxRemovePop();
    spawnFlourPuffs(bg.cx + rem.rx * bg.r, bg.cy + rem.ry * bg.r * bg.squash, 6);
    renderOrderCard();
    renderTray();
    refreshBakeButtonVisibility();
  }

  /* STEP 5: BAKE (Slides smoothly INTO brick oven -> golden, melted & steaming -> glides BACK OUT!) */
  function startBakingStep(){
    if(phase !== "toppings") return;
    /* Immediately settle any flying toppings so nothing disappears! */
    while(flyingToppings.length > 0){
      var ft = flyingToppings.shift();
      placedToppings.push({ id: nextTopId++, key: ft.key, rx: ft.rx, ry: ft.ry, rot: ft.rot, sqPhase: 0, sqAmp: 0 });
    }
    phase = "baking";
    dragState = null;
    bakeBtn.hidden = true;
    bakeAnimT = 0;
    bakeProgress = 0;
    ovenBubbles = [];
    renderOrderCard();
    renderTray();
    sfxTossWhoosh();
    sfxOvenSizzle(3.6);
    bubble.innerHTML = "🔥 <b>STEP 5 — BAKING!</b> Into the glowing brick oven — watch it turn golden &amp; melted!";
    setStepClip("hoot-piz-baking", true);
  }

  /* STEP 6: SLICE (Drag pizza cutter across to draw cut lines; repeated taps also work!) */
  function enterSliceStep(){
    if(phase !== "baking") return;
    phase = "slice";
    bakeProgress = 1;
    cutAngles = [];
    var bg = boardGeom();
    spawnSparkles(bg.cx, bg.cy - 20, 22, "#FFD43B");
    spawnFloat(bg.cx, bg.cy - bg.r * 0.58, "✨ HOT &amp; GOLDEN!", "#FFD43B");
    renderOrderCard();
    renderTray();
    bubble.innerHTML = "🔪 <b>STEP 6 — SLICE!</b> Drag the cutter across your hot pizza (or tap 3 times)!";
    setStepClip("hoot-piz-slice", true);
  }

  function addCutAngle(ang){
    if(phase !== "slice" || cutAngles.length >= 3) return;
    cutAngles.push(ang);
    cutterAnim = { ang: ang, t: 0 };
    sfxSliceCrunch();
    var bg = boardGeom();
    spawnSparkles(bg.cx, bg.cy, 12);
    spawnSteam(bg.cx, bg.cy - 12, bg.r * 1.1);
    spawnFloat(bg.cx, bg.cy - bg.r * 0.55, "🔪 SLICE " + cutAngles.length + "!", "#FFD43B");
    renderTray();
    if(cutAngles.length >= 3){
      var myGen = roundGen;
      setTimeout(function(){ if(myGen === roundGen && phase === "slice" && !won) enterServeStep(); }, 620);
    }
  }
  function performAutoSlice(){
    var defaults = [0, Math.PI / 3, (2 * Math.PI) / 3];
    addCutAngle(defaults[cutAngles.length % 3]);
  }

  /* STEP 7: SERVE -> ILLUSTRATED SERVING SCENE -> EVERY 3RD PIZZA = CROWN CELEBRATION SCENE! */
  function enterServeStep(){
    if(phase !== "slice") return;
    phase = "serve";
    serveBtn.hidden = false;
    renderTray();
    bubble.innerHTML = "🔔 <b>STEP 7 — SERVE!</b> Ring the shiny brass bell to serve Bunny!";
    setStepClip("hoot-piz-serve", true);
  }

  function ringBellAndServe(){
    if(phase !== "serve") return;
    var myGen = roundGen;
    phase = "serving";
    serveBtn.hidden = true;
    bellRingT = 1.0;
    sceneFade = 0;
    servingTimer = 0;
    pizzasServed++;
    totalStars += 5;
    starCountEl.textContent = String(totalStars);
    grandCrownCelebration = (pizzasServed % 3 === 0);
    updateServedHUD();
    sfxBellDing();
    renderOrderCard();
    renderTray();

    var bl = bellGeom();
    spawnSparkles(bl.x, bl.y - 14, 18);
    spawnHearts(W * 0.62, H * 0.42, 16);
    bubble.innerHTML = "❤️ <b>DINNER IS SERVED!</b> Bunny loves your hot, cheesy pizza!";
    setStepClip("hoot-piz-yummy", true);

    /* After Bunny enjoys the Serving Scene with hearts -> show either Next Pizza OR 3rd-Pizza Golden Crown Celebration Scene! */
    setTimeout(function(){
      if(myGen !== roundGen || won) return;
      if(grandCrownCelebration){
        phase = "celebration";
        sceneFade = 0;
        sfxCheer();
        spawnConfetti(100);
        spawnSparkles(W * 0.5, H * 0.35, 36);
        nextPizzaBtn.hidden = false;
        renderTray();
        bubble.innerHTML = "👑 <b>MASTER PIZZA CHEF! (" + pizzasServed + " PIZZAS SERVED!)</b> Hoot wears the Golden Crown!";
        setStepClip("hoot-piz-master-chef", true);
      } else {
        sfxCheer();
        spawnHearts(W * 0.60, H * 0.38, 12);
        spawnConfetti(36);
        nextPizzaBtn.hidden = false;
        var left = 3 - (pizzasServed % 3);
        bubble.innerHTML = "🎉 <b>YUMMY! +5 ⭐!</b> (" + left + " more pizza" + (left === 1 ? "" : "s") + " for Hoot's Golden Crown!)";
        renderTray();
      }
    }, 2200);
  }

  /* =========================================================================
     8. POINTER / TOUCH CONTROLS (1:1 VELOCITY-TILTED DRAG + OVERSHOOT BOUNCE!)
     ========================================================================= */
  function clientToPizzaNorm(clientX, clientY){
    var r = cv.getBoundingClientRect();
    var px = clientX - r.left, py = clientY - r.top;
    var bg = boardGeom();
    var rx = (px - bg.cx) / bg.r;
    var ry = (py - bg.cy) / (bg.r * bg.squash);
    return { px: px, py: py, rx: rx, ry: ry, dist: Math.hypot(rx, ry) };
  }

  function findHitTopping(rx, ry){
    for(var i = placedToppings.length - 1; i >= 0; i--){
      var t = placedToppings[i];
      if(Math.hypot(t.rx - rx, t.ry - ry) < 0.25) return i;
    }
    return -1;
  }

  cv.addEventListener("pointerdown", function(e){
    if(won) return;
    e.preventDefault();
    var pt = clientToPizzaNorm(e.clientX, e.clientY);

    /* Tap brass bell directly on the counter in Step 7! */
    if(phase === "serve"){
      var bl = bellGeom();
      if(Math.hypot(pt.px - bl.x, pt.py - bl.y) < bl.r * 1.9){
        ringBellAndServe(); return;
      }
    }

    if(phase === "dough"){
      if(pt.dist < 1.25) tapDough();
    } else if(phase === "sauce"){
      if(pt.dist < 1.08){
        paintingSauce = true;
        ladlePos = { x: pt.px, y: pt.py };
        lastSaucePt = { rx: pt.rx, ry: pt.ry };
        paintSauceStroke(pt.rx, pt.ry, pt.rx + 0.03, pt.ry + 0.03);
      }
    } else if(phase === "cheese"){
      if(pt.dist < 1.20) startCheeseHold(pt.px, pt.py);
    } else if(phase === "toppings"){
      var hit = findHitTopping(pt.rx, pt.ry);
      if(hit >= 0){
        var nowMs = performance.now();
        if(lastTopTap.idx === hit && (nowMs - lastTopTap.time) < 420){
          lastTopTap = { idx: -1, time: 0 };
          removeToppingAt(hit);
          return;
        }
        lastTopTap = { idx: hit, time: nowMs };
        dragState = {
          kind: "move", key: placedToppings[hit].key, idx: hit,
          x: pt.px, y: pt.py, prevX: pt.px, prevY: pt.py, vx: 0, tilt: 0, lift: 0,
          startX: pt.px, startY: pt.py, moved: false
        };
      } else if(pt.dist < 0.90){
        var btnEl = traySlots.querySelector('.ing-btn[data-top="' + selectedTopKey + '"]');
        var rCv = cv.getBoundingClientRect();
        var fx = W * 0.5, fy = H - 54;
        if(btnEl){
          var br = btnEl.getBoundingClientRect();
          fx = br.left + br.width * 0.5 - rCv.left;
          fy = br.top + br.height * 0.5 - rCv.top;
        }
        launchToppingTo(selectedTopKey, pt.rx, pt.ry, fx, fy);
      }
    } else if(phase === "slice"){
      if(pt.dist < 1.25){
        draggingSlice = true;
        sliceStartPt = { x: pt.px, y: pt.py };
        sliceCurPt = { x: pt.px, y: pt.py };
      }
    }
  });

  window.addEventListener("pointermove", function(e){
    if(won) return;
    var pt = clientToPizzaNorm(e.clientX, e.clientY);
    if(phase === "sauce" && paintingSauce && lastSaucePt){
      ladlePos = { x: pt.px, y: pt.py };
      paintSauceStroke(lastSaucePt.rx, lastSaucePt.ry, pt.rx, pt.ry);
      lastSaucePt = { rx: pt.rx, ry: pt.ry };
    } else if(phase === "cheese" && holdingCheese){
      cheeseHoldPt = { x: pt.px, y: pt.py };
    } else if(phase === "toppings" && dragState){
      var dxMove = pt.px - dragState.x;
      dragState.prevX = dragState.x; dragState.prevY = dragState.y;
      dragState.x = pt.px; dragState.y = pt.py;
      dragState.vx = dragState.vx * 0.65 + dxMove * 24 * 0.35;
      if(Math.hypot(pt.px - dragState.startX, pt.py - dragState.startY) > 10) dragState.moved = true;
      if(dragState.kind === "move" && dragState.moved && placedToppings[dragState.idx]){
        placedToppings[dragState.idx].rx = pt.rx;
        placedToppings[dragState.idx].ry = pt.ry;
      }
    } else if(phase === "slice" && draggingSlice){
      sliceCurPt = { x: pt.px, y: pt.py };
    }
  });

  function finishPointer(e){
    if(phase === "sauce"){ paintingSauce = false; lastSaucePt = null; }
    if(phase === "cheese"){ holdingCheese = false; }
    if(phase === "toppings" && dragState){
      var pt = clientToPizzaNorm(e.clientX || 0, e.clientY || 0);
      if(dragState.kind === "new" && dragState.moved){
        if(pt.dist < 0.92) placeToppingDirect(dragState.key, pt.rx, pt.ry);
      } else if(dragState.kind === "move" && dragState.moved){
        if(pt.dist > 0.92){
          removeToppingAt(dragState.idx);
        } else if(placedToppings[dragState.idx]){
          var d = Math.hypot(pt.rx, pt.ry);
          if(d > 0.72){ placedToppings[dragState.idx].rx = (pt.rx / d) * 0.72; placedToppings[dragState.idx].ry = (pt.ry / d) * 0.72; }
          placedToppings[dragState.idx].sqPhase = 0;
          placedToppings[dragState.idx].sqAmp = 1.0; /* Overshoot squash-and-stretch settle! */
          sfxPlop(2);
        }
      }
      dragState = null;
    }
    if(phase === "slice" && draggingSlice){
      draggingSlice = false;
      if(sliceStartPt && sliceCurPt){
        var dx = sliceCurPt.x - sliceStartPt.x, dy = sliceCurPt.y - sliceStartPt.y;
        if(Math.hypot(dx, dy) > 40){
          var bg = boardGeom();
          addCutAngle(Math.atan2(dy / bg.squash, dx));
        } else {
          performAutoSlice();
        }
      }
      sliceStartPt = null; sliceCurPt = null;
    }
  }

  /* =========================================================================

  function drawSceneCover(im, panToBoard){
    if(!im || !im.complete || !im.naturalWidth) return;
    var cr = panToBoard ? coverRect(im) : (function(){
      var sc = Math.max(W / im.naturalWidth, H / im.naturalHeight);
      var dw = im.naturalWidth * sc, dh = im.naturalHeight * sc;
      return { x: (W - dw) * 0.5, y: (H - dh) * 0.5, w: dw, h: dh };
    })();
    ctx.drawImage(im, cr.x, cr.y, cr.w, cr.h);
  }

    var hx0 = bg.cx + rx * 0.82, hy0 = bg.cy + ry * 0.10;

    ctx.fillStyle = "#B87324"; ctx.strokeStyle = "#4A2511"; ctx.lineWidth = 5.5;

    ctx.beginPath(); ctx.moveTo(bg.cx - rx, bg.cy + ry * 0.30); ctx.quadraticCurveTo(bg.cx, bg.cy + ry * 0.38, bg.cx + rx, bg.cy + ry * 0.24); ctx.stroke();

  /* Draws the child's EXACT custom pizza SQUASHED FLAT (55–60% ellipse) onto the board! */
  function drawCustomPizza(cx, cy, r, squash, scaleAll, rotSpin){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, squash);
    if(rotSpin) ctx.rotate(rotSpin);

    var pr = r * (scaleAll || 1);
    /* Soft grounding contact shadow under pizza on wooden board */
    ctx.fillStyle = "rgba(74,37,17,0.34)";
    ctx.beginPath(); ctx.ellipse(0, 12 / squash, pr * 1.02, pr * 0.99, 0, 0, Math.PI * 2); ctx.fill();

    /* 1. Dough / Raw Crust / Golden Baked Pizza Base */
    if(phase === "dough" && doughTaps < 4){
      var sxD = 1 + doughSquash;
      var syD = 1 - doughSquash * 0.85;
      ctx.save(); ctx.scale(sxD, syD);
      if(IMG.doughRaw.complete && IMG.doughRaw.naturalWidth){
        ctx.drawImage(IMG.doughRaw, -pr, -pr, pr * 2, pr * 2);
      } else {
        ctx.fillStyle = "#FDE6C4"; ctx.strokeStyle = "#4A2511"; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(0, 0, pr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    } else {
      /* Raw dough disc base */
      if(IMG.doughRaw.complete && IMG.doughRaw.naturalWidth){
        ctx.drawImage(IMG.doughRaw, -pr, -pr, pr * 2, pr * 2);
      }
      /* 2. Real Finger-Painted Chunky Cartoon Red Sauce Strokes */
      if(sauceCoverage > 0 || sauceFullBloom > 0){
        ctx.save();
        var rawSauceAlpha = Math.max(0.18, 1 - bakeProgress * 0.82);
        ctx.globalAlpha = rawSauceAlpha;
        ctx.drawImage(saucePaintCv, -pr, -pr, pr * 2, pr * 2);
        if(sauceFullBloom > 0){
          ctx.globalAlpha = sauceFullBloom * rawSauceAlpha;
          ctx.fillStyle = "#DC2626";
          ctx.beginPath(); ctx.arc(0, 0, pr * 0.77, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#991B1B"; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(0, 0, pr * 0.77, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
      }
      /* 3. Creamy Shredded Mozzarella Bed + Individual Stuck Shreds -> Melt Smoothly into Baked Golden Pizza! */
      var rawFade = Math.max(0, 1 - bakeProgress * 1.15);
      if(landedShreds.length > 0 && rawFade > 0.02){
        var cheeseFrac = Math.min(1, landedShreds.length / CHEESE_GOAL);
        if(cheeseFrac > 0.20){
          ctx.save();
          ctx.globalAlpha = Math.min(0.84, (cheeseFrac - 0.16) * 0.96) * rawFade;
          ctx.beginPath(); ctx.arc(0, 0, pr * 0.71, 0, Math.PI * 2); ctx.clip();
          var cg = ctx.createRadialGradient(0, -pr * 0.1, pr * 0.1, 0, 0, pr * 0.72);
          cg.addColorStop(0, "#FFFBEB"); cg.addColorStop(0.75, "#FEF08A"); cg.addColorStop(1, "#FDE047");
          ctx.fillStyle = cg;
          ctx.fillRect(-pr, -pr, pr * 2, pr * 2);
          if(IMG.cheesePile.complete && IMG.cheesePile.naturalWidth){
            ctx.globalAlpha = Math.min(0.52, cheeseFrac * 0.55) * rawFade;
            ctx.drawImage(IMG.cheesePile, -pr * 0.75, -pr * 0.75, pr * 1.5, pr * 1.5);
          }
          ctx.restore();
        }
        ctx.save();
        ctx.globalAlpha = rawFade;
        ctx.lineCap = "round";
        for(var si = 0; si < landedShreds.length; si++){
          var sh = landedShreds[si];
          var sx = sh.rx * pr, sy = sh.ry * pr;
          ctx.save(); ctx.translate(sx, sy); ctx.rotate(sh.rot);
          ctx.strokeStyle = "#4A2511"; ctx.lineWidth = 8.4;
          ctx.beginPath(); ctx.moveTo(-sh.len * 0.5, 0); ctx.quadraticCurveTo(0, sh.curve, sh.len * 0.5, 0); ctx.stroke();
          ctx.strokeStyle = sh.shade; ctx.lineWidth = 5.2;
          ctx.beginPath(); ctx.moveTo(-sh.len * 0.5, 0); ctx.quadraticCurveTo(0, sh.curve, sh.len * 0.5, 0); ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
      }
      /* Crossfade smoothly into the illustrated top-down baked golden melted cheese pizza! */
      if(bakeProgress > 0.02 && IMG.pizzaBaked.complete && IMG.pizzaBaked.naturalWidth){
        ctx.save();
        ctx.globalAlpha = Math.min(1, bakeProgress);
        ctx.drawImage(IMG.pizzaBaked, -pr * 1.03, -pr * 1.03, pr * 2.06, pr * 2.06);
        ctx.restore();
      }
    }

    /* Animated bubbling cheese pops during baking */
    for(var bi = 0; bi < ovenBubbles.length; bi++){
      var ob = ovenBubbles[bi], sw = Math.sin(ob.life * Math.PI);
      var br = (5 + sw * 9) * (pr / 160);
      ctx.save();
      ctx.fillStyle = "rgba(255,243,176," + (0.78 * sw).toFixed(2) + ")";
      ctx.strokeStyle = "rgba(180,83,9," + (0.72 * sw).toFixed(2) + ")";
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(ob.rx * pr, ob.ry * pr, br, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    /* 4. All Placed Toppings (STAY ON THE PIZZA AFTER BAKING, WITH OVERSHOOT SQUASH-STRETCH BOUNCE!) */
    for(var ti = 0; ti < placedToppings.length; ti++){
      var pt = placedToppings[ti];
      if(dragState && dragState.kind === "move" && dragState.moved && dragState.idx === ti) continue;
      var tDef = TOP_BY_KEY[pt.key];
      var imT = IMG["top_" + pt.key];
      if(!imT || !imT.complete || !imT.naturalWidth) continue;
      var tx = pt.rx * pr, ty = pt.ry * pr;
      var baseSz = pr * (tDef ? tDef.sz : 0.20) * 2.0;

      /* Damped overshoot squash-and-stretch landing bounce! */
      var bounce = pt.sqAmp > 0.01 ? (Math.cos(pt.sqPhase * 15) * pt.sqAmp * 0.30) : 0;
      var scaleX = 1 + bounce;
      var scaleY = 1 - bounce * 0.85;

      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(pt.rot);
      ctx.scale(scaleX, scaleY);
      ctx.fillStyle = "rgba(74,37,17,0.34)";
      ctx.beginPath(); ctx.ellipse(3, 5, baseSz * 0.44, baseSz * 0.38, 0, 0, Math.PI * 2); ctx.fill();
      ctx.drawImage(imT, -baseSz * 0.5, -baseSz * 0.5, baseSz, baseSz);
      ctx.restore();
    }

    /* 5. Crisp Cartoon Cut Lines Across the Pizza */
    if(cutAngles.length > 0){
      ctx.save();
      cutAngles.forEach(function(ang){
        var ca = Math.cos(ang), sa = Math.sin(ang);
        ctx.strokeStyle = "#4A2511"; ctx.lineWidth = 6.5; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(-ca * pr * 0.96, -sa * pr * 0.96); ctx.lineTo(ca * pr * 0.96, sa * pr * 0.96); ctx.stroke();
        ctx.strokeStyle = "#FEF08A"; ctx.lineWidth = 2.4; ctx.setLineDash([7, 7]);
        ctx.beginPath(); ctx.moveTo(-ca * pr * 0.82, -sa * pr * 0.82); ctx.lineTo(ca * pr * 0.82, sa * pr * 0.82); ctx.stroke();
      });
      ctx.restore();
    }

    ctx.restore();
  }

  /* =========================================================================
     10. MAIN 60FPS ANIMATION LOOP (NOTHING TELEPORTS; EVERYTHING ANIMATES!)
     ========================================================================= */
  var tAcc = 0, lastT = performance.now();

  function render(now){
    requestAnimationFrame(render);
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now; tAcc += dt;

    if(ladleSfxCd > 0) ladleSfxCd = Math.max(0, ladleSfxCd - dt);
    if(bunnyHopT > 0) bunnyHopT = Math.max(0, bunnyHopT - dt * 2.0);
    if(bellRingT > 0) bellRingT = Math.max(0, bellRingT - dt * 2.4);

    /* Update Step 1: Elastic Dough Spring & Air Toss */
    doughScale += (doughTargetScale - doughScale) * Math.min(1, dt * 11);
    var kSpring = 180, damping = 11;
    doughSquashVel += (-kSpring * doughSquash - damping * doughSquashVel) * dt;
    doughSquash += doughSquashVel * dt;
    if(doughTossT > 0){
      doughTossT += dt * 1.15;
      if(doughTossT >= 1){ doughTossT = 0; enterSauceStep(); }
    }

    if(sauceFullBloom > 0 && sauceFullBloom < 1) sauceFullBloom = Math.min(1, sauceFullBloom + dt * 2.5);

    /* Update Step 3: Continuous Press-and-Hold Cheese Rain Falling From Finger! */
    if(phase === "cheese" && holdingCheese && !cheeseDone){
      cheeseRainCd -= dt;
      if(cheeseRainCd <= 0){
        cheeseRainCd = 0.055;
        spawnFallingShred(cheeseHoldPt.x, cheeseHoldPt.y);
        spawnFallingShred(cheeseHoldPt.x, cheeseHoldPt.y);
      }
    }
    for(var fsi = fallingShreds.length - 1; fsi >= 0; fsi--){
      var fs = fallingShreds[fsi];
      fs.vy += 430 * dt;
      fs.y += fs.vy * dt;
      fs.x += (fs.targetX - fs.x) * Math.min(1, dt * 6);
      fs.rot += fs.vr * dt;
      if(fs.y >= fs.targetY){
        landedShreds.push({ rx: fs.rx, ry: fs.ry, rot: fs.rot, len: fs.len, curve: fs.curve, shade: fs.shade });
        fallingShreds.splice(fsi, 1);
        if(phase === "cheese" && !cheeseDone && landedShreds.length >= CHEESE_GOAL){
          cheeseDone = true;
          holdingCheese = false;
          var bgC = boardGeom();
          sfxPlop(6);
          spawnSparkles(bgC.cx, bgC.cy, 20, "#FFD43B");
          spawnFloat(bgC.cx, bgC.cy - bgC.r * 0.55, "🧀 SO CHEESY!", "#FFD43B");
          var myGenC = roundGen;
          setTimeout(function(){ if(myGenC === roundGen && phase === "cheese" && !won) enterToppingsStep(); }, 540);
        }
      }
    }

    /* Update Step 4: Animated Flying Toppings & Drag Velocity Tilt + Overshoot Bounce! */
    var bgNow = boardGeom();
    for(var fti = flyingToppings.length - 1; fti >= 0; fti--){
      var ft = flyingToppings[fti];
      ft.t = Math.min(1, ft.t + dt * 3.0);
      if(ft.t >= 1){
        placedToppings.push({ id: nextTopId++, key: ft.key, rx: ft.rx, ry: ft.ry, rot: ft.rot, sqPhase: 0, sqAmp: 1.0 });
        spawnSparkles(bgNow.cx + ft.rx * bgNow.r, bgNow.cy + ft.ry * bgNow.r * bgNow.squash, 9);
        flyingToppings.splice(fti, 1);
        checkOrderBonus();
      }
    }
    for(var pti = 0; pti < placedToppings.length; pti++){
      var pto = placedToppings[pti];
      if(pto.sqAmp > 0.005){
        pto.sqPhase += dt;
        pto.sqAmp *= Math.exp(-dt * 5.8);
      } else { pto.sqAmp = 0; }
    }
    if(dragState){
      dragState.vx *= Math.exp(-dt * 12);
      var targetTilt = Math.max(-0.36, Math.min(0.36, dragState.vx * 0.0014));
      dragState.tilt += (targetTilt - dragState.tilt) * Math.min(1, dt * 16);
      dragState.lift += ((dragState.moved ? 1 : 0) - dragState.lift) * Math.min(1, dt * 16);
    }

    /* Update Step 5: Deterministic Smooth Slide-Into-Oven -> Golden Bake -> Slide-Back-Out! */
    if(phase === "baking"){
      bakeAnimT += dt / 4.2;
      var ovPos = ovenMouthPos();
      if(bakeAnimT >= 0.20 && bakeAnimT <= 0.80){
        bakeProgress = Math.max(0, Math.min(1, (bakeAnimT - 0.22) / 0.56));
        if(Math.random() < 0.28) spawnEmber(ovPos.x, ovPos.y);
        if(Math.random() < 0.22) spawnSteam(ovPos.x, ovPos.y - 20, 90);
        if(bakeProgress > 0.20 && Math.random() < 0.24){
          var ba = Math.random() * Math.PI * 2, br = Math.sqrt(Math.random()) * 0.62;
          ovenBubbles.push({ rx: Math.cos(ba) * br, ry: Math.sin(ba) * br, life: 1.0 });
        }
      }
      if(bakeAnimT >= 1.0){
        bakeAnimT = 1.0; bakeProgress = 1.0;
        enterSliceStep();
      }
    } else if((phase === "slice" || phase === "serve") && Math.random() < 0.13){
      spawnSteam(bgNow.cx, bgNow.cy - bgNow.r * 0.20, bgNow.r * 1.25);
    }
    for(var obi = ovenBubbles.length - 1; obi >= 0; obi--){
      ovenBubbles[obi].life -= dt * 1.3;
      if(ovenBubbles[obi].life <= 0) ovenBubbles.splice(obi, 1);
    }
    if(cutterAnim){
      cutterAnim.t += dt * 3.0;
      if(cutterAnim.t >= 1) cutterAnim = null;
    }

    /* Update Step 7: Serving & Celebration Scene Fades + Ambient Hearts/Confetti */
    if(phase === "serving" || phase === "celebration"){
      sceneFade = Math.min(1, sceneFade + dt * 2.8);
      if(phase === "serving" && Math.random() < 0.08) spawnHearts(W * 0.62, H * 0.42, 1);
      if(phase === "celebration" && Math.random() < 0.24) spawnConfetti(2);
    }

    /* =====================================================================
       DRAW CURRENT SCENE
       ===================================================================== */
    ctx.clearRect(0, 0, W, H);

    if(phase === "serving" || phase === "celebration"){
      /* Full illustrated Serving Scene OR 3rd-Pizza Crown Celebration Scene! */
      drawSceneCover(IMG.stageMain, true);
      ctx.save();
      ctx.globalAlpha = sceneFade;
      drawSceneCover(phase === "celebration" ? IMG.celebration : IMG.serving, false);
      ctx.restore();
    } else {
      /* 1. Main Illustrated Kitchen Stage (Hoot at left, glowing brick oven, warm wood counter!) */
      var crMain = coverRect(IMG.stageMain);
      /* Warm honey-wood countertop fill under any bottom shift */
      var counterGrad = ctx.createLinearGradient(0, H * 0.65, 0, H);
      counterGrad.addColorStop(0, "#C97F36"); counterGrad.addColorStop(1, "#9A5B22");
      ctx.fillStyle = counterGrad;
      ctx.fillRect(0, 0, W, H);
      drawSceneCover(IMG.stageMain, true);

      /* Subtle warm pulsing glow from the brick oven mouth */
      var ov = ovenMouthPos();
      var fireIntensity = phase === "baking" ? (0.48 + 0.16 * Math.sin(tAcc * 14)) : (0.18 + 0.06 * Math.sin(tAcc * 7));
      var ovG = ctx.createRadialGradient(ov.x, ov.y, 10, ov.x, ov.y, Math.max(W, H) * (phase === "baking" ? 0.30 : 0.18));
      ovG.addColorStop(0, "rgba(255,190,60," + fireIntensity.toFixed(2) + ")");
      ovG.addColorStop(0.55, "rgba(249,115,22," + (fireIntensity * 0.45).toFixed(2) + ")");
      ovG.addColorStop(1, "rgba(249,115,22,0)");
      ctx.fillStyle = ovG;
      ctx.fillRect(0, 0, W, H);

      /* 2. Cream Bunny Customer Peeking Cheerfully Behind the Arched Serving Window Sill! */
      var bn = bunnyGeom();
      if(IMG.bunny.complete && IMG.bunny.naturalWidth){
        var hopY = bunnyHopT > 0 ? Math.abs(Math.sin(bunnyHopT * Math.PI * 2.5)) * 22 : Math.sin(tAcc * 2.4) * 3.5;
        ctx.save();
        if(bn.sillY !== null){ ctx.beginPath(); ctx.rect(0, 0, W, bn.sillY); ctx.clip(); }
        ctx.translate(bn.x, bn.y - hopY);
        var bScale = (bn.h / IMG.bunny.naturalHeight);
        var bw = IMG.bunny.naturalWidth * bScale, bh = bn.h;
        ctx.drawImage(IMG.bunny, -bw * 0.5, -bh * 0.5, bw, bh);
        ctx.restore();
      }

      /* 3. Seamless Perspective Warm Honey-Oak Plank Countertop + Flat 56%-Ellipse Board + Brass Bell! */
      var bg = boardGeom();
      var counterYLeft  = isPortrait() ? (bg.cy - bg.r * 0.08) : (crMain.y + 0.775 * crMain.h);
      var counterYRight = isPortrait() ? (bg.cy - bg.r * 0.08) : (crMain.y + 0.708 * crMain.h);
      var counterYMin = Math.min(counterYLeft, counterYRight);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, counterYLeft);
      ctx.lineTo(W, counterYRight);
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      var counterPlank = ctx.createLinearGradient(0, counterYMin, 0, H);
      counterPlank.addColorStop(0, "#D69043");
      counterPlank.addColorStop(0.32, "#C67C32");
      counterPlank.addColorStop(1, "#9E5C21");
      ctx.fillStyle = counterPlank;
      ctx.fill();
      ctx.save();
      ctx.clip();
      ctx.strokeStyle = "rgba(74,37,17,0.20)"; ctx.lineWidth = 2.5;
      for(var pyL = 34; pyL < H - counterYMin + 40; pyL += 42){
        ctx.beginPath();
        ctx.moveTo(0, counterYLeft + pyL);
        ctx.lineTo(W, counterYRight + pyL);
        ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = "#4A2511"; ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.moveTo(0, counterYLeft); ctx.lineTo(W, counterYRight); ctx.stroke();
      ctx.restore();
      drawCartoonBoard(bg);

      var bl = bellGeom();
      drawCartoonBell(bl.x, bl.y, bl.r, phase === "serve" ? 1 : 0, bellRingT);

      /* 4. The Child's Flat Elliptical Pizza (animates smoothly on toss & sliding into/out of oven!) */
      var pCx = bg.cx, pCy = bg.cy, pScale = 1.0, pRot = 0, pAlpha = 1.0;

      if(phase === "dough"){
        pScale = doughScale;
        if(doughTossT > 0){
          var tt = doughTossT;
          pCy = bg.cy - Math.sin(tt * Math.PI) * 140;
          pScale = 1.0 + Math.sin(tt * Math.PI) * 0.14;
          pRot = tt * Math.PI * 2.2;
        }
      } else if(phase === "baking"){
        /* Smooth ease-in-out slide from wooden board -> into glowing oven mouth -> back onto board! */
        var uSlide = 0;
        if(bakeAnimT < 0.24){
          var u1 = bakeAnimT / 0.24;
          uSlide = u1 * u1 * (3 - 2 * u1);
        } else if(bakeAnimT <= 0.76){
          uSlide = 1;
        } else {
          var u2 = (bakeAnimT - 0.76) / 0.24;
          uSlide = 1 - (u2 * u2 * (3 - 2 * u2));
        }
        pCx = bg.cx + (ov.x - bg.cx) * uSlide;
        pCy = bg.cy + (ov.y + 24 - bg.cy) * uSlide - Math.sin(uSlide * Math.PI) * 32;
        pScale = 1.0 - uSlide * 0.44;
        /* Gentle shimmer inside the firelight */
        if(bakeAnimT >= 0.24 && bakeAnimT <= 0.76){
          pScale += Math.sin(tAcc * 9) * 0.014;
        }
      }

      ctx.save();
      ctx.globalAlpha = pAlpha;
      drawCustomPizza(pCx, pCy, bg.r, bg.squash, pScale, pRot);
      ctx.restore();

      /* 5. Step-Specific Animated Visual Guides & Chunky Cartoon Tools */
      if(phase === "dough" && doughTossT === 0){
        ctx.save();
        ctx.strokeStyle = "rgba(255,235,140," + (0.48 + 0.36 * Math.sin(tAcc * 5)).toFixed(2) + ")";
        ctx.lineWidth = 4.5; ctx.setLineDash([12, 9]);
        ctx.beginPath(); ctx.ellipse(bg.cx, bg.cy, bg.r * doughScale * 1.16, bg.r * doughScale * bg.squash * 1.16, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      } else if(phase === "sauce"){
        var lx = paintingSauce ? ladlePos.x : (bg.cx + Math.cos(tAcc * 2.4) * bg.r * 0.42);
        var ly = paintingSauce ? ladlePos.y : (bg.cy + Math.sin(tAcc * 2.4) * bg.r * bg.squash * 0.42);
        drawCartoonLadle(lx, ly - 14);
      } else if(phase === "cheese"){
        /* Individual falling cheese shreds dropping from the finger! */
        ctx.save(); ctx.lineCap = "round";
        for(var fi2 = 0; fi2 < fallingShreds.length; fi2++){
          var fs2 = fallingShreds[fi2];
          ctx.save(); ctx.translate(fs2.x, fs2.y); ctx.rotate(fs2.rot);
          ctx.strokeStyle = "#4A2511"; ctx.lineWidth = 7.5;
          ctx.beginPath(); ctx.moveTo(-fs2.len * 0.5, 0); ctx.quadraticCurveTo(0, fs2.curve, fs2.len * 0.5, 0); ctx.stroke();
          ctx.strokeStyle = fs2.shade; ctx.lineWidth = 4.6;
          ctx.beginPath(); ctx.moveTo(-fs2.len * 0.5, 0); ctx.quadraticCurveTo(0, fs2.curve, fs2.len * 0.5, 0); ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
        /* Floating shredded cheese pile hovering playfully above the hold finger! */
        if(IMG.cheesePile.complete && IMG.cheesePile.naturalWidth){
          var gx = holdingCheese ? cheeseHoldPt.x : (bg.cx + Math.sin(tAcc * 2.4) * bg.r * 0.36);
          var gy = (holdingCheese ? cheeseHoldPt.y : bg.cy) - bg.r * 0.58;
          var jig = holdingCheese ? Math.sin(tAcc * 30) * 8 : Math.sin(tAcc * 4) * 3;
          var gw = isPortrait() ? 78 : 98;
          ctx.save(); ctx.translate(gx + jig, gy); ctx.rotate(holdingCheese ? Math.sin(tAcc * 24) * 0.16 : 0);
          ctx.drawImage(IMG.cheesePile, -gw * 0.5, -gw * 0.5, gw, gw);
          ctx.restore();
        }
      } else if(phase === "toppings"){
        /* Animated arcing toppings from tray -> pizza (never teleports!) */
        for(var fti2 = 0; fti2 < flyingToppings.length; fti2++){
          var ft2 = flyingToppings[fti2];
          var u = ft2.t, e = 1 - Math.pow(1 - u, 2.2);
          var tx1 = bg.cx + ft2.rx * bg.r, ty1 = bg.cy + ft2.ry * bg.r * bg.squash;
          var fx = ft2.x0 + (tx1 - ft2.x0) * e;
          var fy = ft2.y0 + (ty1 - ft2.y0) * e - Math.sin(u * Math.PI) * 95;
          var imF = IMG["top_" + ft2.key], tDefF = TOP_BY_KEY[ft2.key];
          var fSz = bg.r * (tDefF ? tDefF.sz : 0.20) * 2.0;
          if(imF && imF.complete && imF.naturalWidth){
            ctx.save(); ctx.translate(fx, fy); ctx.rotate((1 - u) * 2.4 + ft2.rot);
            ctx.drawImage(imF, -fSz * 0.5, -fSz * 0.5, fSz, fSz * (0.75 + 0.25 * (1 - u)));
            ctx.restore();
          }
        }
        /* Active 1:1 dragged topping — grows slightly with soft offset shadow & tilts toward movement! */
        if(dragState && dragState.moved){
          var imDr = IMG["top_" + dragState.key], tDefDr = TOP_BY_KEY[dragState.key];
          var grow = 1 + dragState.lift * 0.22;
          var dSz = bg.r * (tDefDr ? tDefDr.sz : 0.20) * 2.05 * grow;
          if(imDr && imDr.complete && imDr.naturalWidth){
            ctx.save();
            /* Soft lifted drop shadow */
            ctx.fillStyle = "rgba(59,29,14,0.34)";
            ctx.beginPath(); ctx.ellipse(dragState.x + 8, dragState.y + 24, dSz * 0.44, dSz * 0.26, 0, 0, Math.PI * 2); ctx.fill();
            /* Velocity-tilted held topping */
            ctx.translate(dragState.x, dragState.y - 10 * dragState.lift);
            ctx.rotate(dragState.tilt);
            ctx.drawImage(imDr, -dSz * 0.5, -dSz * 0.5, dSz, dSz);
            ctx.restore();
          }
        }
      } else if(phase === "slice"){
        var guideAng = [0, Math.PI / 3, (2 * Math.PI) / 3][cutAngles.length % 3];
        if(draggingSlice && sliceStartPt && sliceCurPt){
          ctx.save();
          ctx.strokeStyle = "#FFD43B"; ctx.lineWidth = 6; ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(sliceStartPt.x, sliceStartPt.y); ctx.lineTo(sliceCurPt.x, sliceCurPt.y); ctx.stroke();
          ctx.restore();
        } else {
          ctx.save();
          ctx.strokeStyle = "rgba(255,235,140," + (0.55 + 0.35 * Math.sin(tAcc * 6)).toFixed(2) + ")";
          ctx.lineWidth = 5; ctx.setLineDash([12, 10]);
          ctx.beginPath();
          ctx.moveTo(bg.cx - Math.cos(guideAng) * bg.r * 0.94, bg.cy - Math.sin(guideAng) * bg.r * bg.squash * 0.94);
          ctx.lineTo(bg.cx + Math.cos(guideAng) * bg.r * 0.94, bg.cy + Math.sin(guideAng) * bg.r * bg.squash * 0.94);
          ctx.stroke();
          ctx.restore();
        }
        var cxCut, cyCut, cAng = cutterAnim ? cutterAnim.ang : guideAng;
        if(draggingSlice && sliceCurPt){
          cxCut = sliceCurPt.x; cyCut = sliceCurPt.y;
        } else {
          var prog = cutterAnim ? cutterAnim.t : (0.18 + 0.14 * Math.sin(tAcc * 3.8));
          var dA = (-0.88 + prog * 1.76) * bg.r;
          cxCut = bg.cx + Math.cos(cAng) * dA;
          cyCut = bg.cy + Math.sin(cAng) * dA * bg.squash;
        }
        drawCartoonCutter(cxCut, cyCut - 10, tAcc * 8);
      }
    }

    /* 6. Render All Particles (Flour, Sparkles, Steam, Embers, Hearts, Confetti!) */
    for(var pi = particles.length - 1; pi >= 0; pi--){
      var p = particles[pi];
      p.life -= dt * p.decay;
      if(p.life <= 0){ particles.splice(pi, 1); continue; }
      if(p.kind === "sparkle") p.vy += 220 * dt;
      else if(p.kind === "confetti") p.rot += p.vr * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;

      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      if(p.kind === "flour"){
        var fr = p.r * (1.7 - p.life * 0.7);
        var fg2 = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, fr);
        fg2.addColorStop(0, "rgba(255,252,244,0.82)"); fg2.addColorStop(1, "rgba(255,252,244,0)");
        ctx.fillStyle = fg2; ctx.beginPath(); ctx.arc(p.x, p.y, fr, 0, Math.PI * 2); ctx.fill();
      } else if(p.kind === "steam"){
        var sr2 = p.r * (1.7 - p.life * 0.7);
        var stg = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, sr2);
        stg.addColorStop(0, "rgba(255,252,246,0.42)"); stg.addColorStop(1, "rgba(255,252,246,0)");
        ctx.fillStyle = stg; ctx.beginPath(); ctx.arc(p.x, p.y, sr2, 0, Math.PI * 2); ctx.fill();
      } else if(p.kind === "sparkle" || p.kind === "ember"){
        ctx.fillStyle = p.col; ctx.strokeStyle = "#4A2511"; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
        if(p.kind === "sparkle") ctx.stroke();
      } else if(p.kind === "heart"){
        drawHeartShape(p.x, p.y, p.r * (0.7 + p.life * 0.4), p.col, p.rot);
      } else if(p.kind === "confetti"){
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.col;
        ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1);
      }
      ctx.restore();
    }

    /* 7. Pop-Up Floating Cheer Callouts */
    for(var fi3 = floatTexts.length - 1; fi3 >= 0; fi3--){
      var ft3 = floatTexts[fi3];
      ft3.life -= dt * 1.15;
      if(ft3.life <= 0){ floatTexts.splice(fi3, 1); continue; }
      ft3.y -= dt * 48;
      ft3.scale += (1 - ft3.scale) * Math.min(1, dt * 14);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, ft3.life * 1.4));
      ctx.translate(ft3.x, ft3.y); ctx.scale(ft3.scale, ft3.scale);
      ctx.font = '800 28px "Fredoka",sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineWidth = 6.5; ctx.strokeStyle = "#4A2511"; ctx.strokeText(ft3.txt, 0, 0);
      ctx.fillStyle = ft3.col; ctx.fillText(ft3.txt, 0, 0);
      ctx.restore();
    }
  }

  /* =========================================================================
     11. START HOOT'S PIZZA SHOP!
     ========================================================================= */
  startNewPizza("hoot-piz-welcome");
  requestAnimationFrame(render);

  window.__PIZZA_SHOP_DEBUG__ = function(){
    var bg = boardGeom();
    return {
      phase: phase, doughTaps: doughTaps, sauceCoverage: Number(sauceCoverage.toFixed(2)),
      cheeseLanded: landedShreds.length, cheeseGoal: CHEESE_GOAL,
      toppingsCount: placedToppings.length, toppingsKeys: placedToppings.map(function(t){ return t.key; }),
      orderBonusGiven: orderBonusGiven, minToppingsMet: minToppingsMet,
      bakeHidden: bakeBtn.hidden, bakeProgress: Number(bakeProgress.toFixed(2)),
      cuts: cutAngles.length, pizzasServed: pizzasServed,
      crownActive: grandCrownCelebration, stars: totalStars,
      board: { cx: Math.round(bg.cx), cy: Math.round(bg.cy), r: Math.round(bg.r), squash: bg.squash }
    };
  };
})();
</script>
