<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>Safari Jeep Photo Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#3a220c;
    --outline:#452408;
    --gold:#ffd43b;
    --amber:#f59e0b;
    --cream:#fffdf6;
    --khaki:#d4a359;
    --leaf:#22c55e;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  [hidden]{ display:none !important; }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    background:#e89b44;
    touch-action:none;
  }

  #stage{
    position:fixed; inset:0; width:100%; height:100dvh;
    overflow:hidden; background:#e89b44;
  }
  #gameCanvas{
    position:absolute; inset:0; width:100%; height:100%;
    display:block; z-index:1; touch-action:none; cursor:pointer;
  }

  /* ================= TOP HUD ================= */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:12;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    pointer-events:none;
  }
  .hud-left, .hud-right{
    display:flex; align-items:center; gap:10px; pointer-events:auto;
  }

  #hootBtn{
    width:68px; height:68px; min-width:64px; min-height:64px;
    flex:0 0 68px; border-radius:50%;
    border:4px solid #fffdf5;
    background:radial-gradient(circle at 34% 26%, #fff8c9 0%, #ffd23f 62%, #ea8c00 100%);
    box-shadow:0 6px 0 var(--outline), 0 0 24px rgba(255,212,59,.72);
    padding:3px; cursor:pointer; outline:none;
    animation:hootBob 2.4s ease-in-out infinite alternate;
    transition:transform .14s cubic-bezier(.34,1.7,.5,1);
  }
  #hootBtn:active{ transform:scale(.92); }
  #hootBtn.cheer{ animation:hootCheer .55s cubic-bezier(.34,1.85,.5,1) 2 !important; }
  @keyframes hootBob{ from{ transform:translateY(0); } to{ transform:translateY(-4px); } }
  @keyframes hootCheer{
    0%,100%{ transform:scale(1) rotate(0deg); }
    40%{ transform:scale(1.16) rotate(-7deg); }
    72%{ transform:scale(1.06) rotate(6deg); }
  }

  #starPill{
    min-height:64px; min-width:86px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:linear-gradient(180deg, #fffef8 0%, #fef0c0 100%);
    border:4px solid #fffdf5; border-radius:999px;
    padding:0 16px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:24px; color:var(--ink);
    box-shadow:0 6px 0 var(--outline), 0 8px 18px rgba(69,36,8,.28);
  }
  #starPill.pop{ animation:pillPop .46s cubic-bezier(.34,1.85,.5,1); }
  @keyframes pillPop{ 0%{ transform:scale(1); } 50%{ transform:scale(1.22) rotate(-4deg); } 100%{ transform:scale(1); } }

  #soundBtn{
    width:66px; height:66px; min-width:64px; min-height:64px;
    border-radius:50%;
    border:4px solid #fffdf5;
    background:linear-gradient(180deg, #ffaa44 0%, #e06d14 100%);
    box-shadow:0 6px 0 var(--outline), 0 8px 18px rgba(69,36,8,.28);
    color:#fff; font-size:28px; line-height:1;
    display:grid; place-items:center;
    cursor:pointer; outline:none;
    transition:transform .14s cubic-bezier(.34,1.6,.5,1);
  }
  #soundBtn:active{ transform:translateY(3px) scale(.93); }

  /* ================= BOTTOM HUD (HORN + PHOTO ALBUM + GIANT CAMERA SHUTTER) ================= */
  #bottomHud{
    position:absolute; left:0; right:0;
    bottom:max(12px, env(safe-area-inset-bottom));
    z-index:12;
    display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
    padding:0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
    pointer-events:none;
  }

  /* Beep-Beep Safari Horn Button */
  #hornBtn{
    pointer-events:auto;
    width:74px; height:74px; min-width:66px; min-height:66px;
    flex:0 0 auto;
    border-radius:50%;
    border:4.5px solid #fffdf5;
    background:radial-gradient(circle at 34% 26%, #fff3a1 0%, #fbbf24 58%, #d97706 100%);
    box-shadow:0 7px 0 var(--outline), 0 10px 22px rgba(69,36,8,.38), inset 0 4px 6px rgba(255,255,255,.55);
    display:grid; place-items:center;
    font-size:34px; line-height:1;
    cursor:pointer; outline:none;
    transition:transform .12s cubic-bezier(.34,1.8,.5,1), box-shadow .12s;
  }
  #hornBtn:active, #hornBtn.honked{
    transform:translateY(3px) scale(.91);
    box-shadow:0 3px 0 var(--outline), 0 0 26px rgba(253,224,71,.95);
  }

  /* Bottom Safari Photo Album Strip */
  #albumBar{
    pointer-events:auto;
    flex:0 1 auto;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(180deg, rgba(96,56,22,.88) 0%, rgba(62,33,10,.92) 100%);
    backdrop-filter:blur(8px);
    border:4px solid #f5d08a;
    border-radius:26px;
    padding:8px 12px;
    box-shadow:0 7px 0 var(--outline), 0 12px 26px rgba(40,20,4,.42), inset 0 2px 4px rgba(255,244,206,.35);
    max-width:calc(100vw - 196px);
  }
  .album-slot{
    position:relative;
    width:52px; height:58px;
    flex:0 0 auto;
    border-radius:10px;
    border:2.5px dashed rgba(254,240,192,.58);
    background:rgba(255,248,225,.12);
    padding:4px 4px 10px 4px;
    display:flex; align-items:center; justify-content:center;
    cursor:default;
    transition:transform .34s cubic-bezier(.34,1.85,.5,1), background .25s, border-color .25s, box-shadow .25s;
  }
  .album-slot .slot-dot{
    width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(254,240,192,.5);
    opacity:.65;
  }
  .album-slot.filled{
    border:2.5px solid #fff;
    background:#fffef9;
    box-shadow:0 4px 10px rgba(0,0,0,.38), 0 0 0 1px rgba(69,36,8,.18);
    cursor:pointer;
    transform:rotate(var(--tilt, -3deg));
  }
  .album-slot.filled:active{
    transform:scale(.92) rotate(0deg);
  }
  .album-slot.filled.just-landed{
    animation:polaroidLand .58s cubic-bezier(.34,1.9,.5,1);
  }
  @keyframes polaroidLand{
    0%{ transform:scale(1.48) rotate(-10deg); }
    65%{ transform:scale(.94) rotate(4deg); }
    100%{ transform:scale(1) rotate(var(--tilt, -3deg)); }
  }
  .album-slot .polaroid-pic{
    width:100%; height:100%;
    border-radius:6px;
    overflow:hidden;
    display:grid; place-items:center;
    background:linear-gradient(180deg, #bae6fd 0%, #fde68a 68%, #86efac 100%);
    border:1.5px solid rgba(69,36,8,.18);
  }
  .album-slot .polaroid-pic svg{
    width:100%; height:100%; display:block;
  }

  /* Giant Glowing Camera Shutter Button (>= 82px!) */
  #shutterBtn{
    pointer-events:auto;
    position:relative;
    width:86px; height:86px; min-width:80px; min-height:80px;
    flex:0 0 auto;
    border-radius:50%;
    border:5px solid #fffdf5;
    background:radial-gradient(circle at 34% 26%, #a7f3d0 0%, #22c55e 52%, #15803d 100%);
    box-shadow:0 8px 0 var(--outline), 0 12px 26px rgba(40,20,4,.42), inset 0 5px 8px rgba(255,255,255,.55);
    display:grid; place-items:center;
    font-size:38px; line-height:1;
    cursor:pointer; outline:none;
    transition:transform .14s cubic-bezier(.34,1.85,.5,1), box-shadow .18s, filter .18s;
  }
  #shutterBtn::before{
    content:""; position:absolute; inset:-10px; border-radius:50%;
    border:4px solid rgba(255,212,59,0);
    pointer-events:none;
    transition:opacity .25s;
  }
  #shutterBtn.ready{
    background:radial-gradient(circle at 34% 26%, #fef08a 0%, #f59e0b 52%, #d97706 100%);
    box-shadow:0 8px 0 var(--outline), 0 0 34px rgba(253,224,71,.95), inset 0 5px 8px rgba(255,255,255,.65);
    animation:shutterReady 1.25s ease-in-out infinite;
  }
  #shutterBtn.ready::before{
    border-color:rgba(255,232,102,.9);
    animation:shutterHalo 1.5s ease-out infinite;
  }
  @keyframes shutterReady{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.09); }
  }
  @keyframes shutterHalo{
    0%{ transform:scale(.9); opacity:.95; }
    100%{ transform:scale(1.42); opacity:0; }
  }
  #shutterBtn:active, #shutterBtn.snapped{
    transform:translateY(4px) scale(.9) !important;
    box-shadow:0 4px 0 var(--outline), 0 0 42px #ffffff !important;
  }

  /* ================= SAFARI PHOTO ALBUM FINALE OVERLAY ================= */
  #winOverlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(46,24,6,.72);
    backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center;
    padding:16px;
  }
  .album-card{
    background:linear-gradient(180deg, #fffdf4 0%, #fef1d0 100%);
    border:6px solid var(--outline);
    border-radius:34px;
    padding:20px 20px 22px;
    text-align:center;
    max-width:520px; width:100%;
    max-height:92dvh;
    overflow-y:auto;
    box-shadow:0 14px 0 var(--outline), 0 26px 52px rgba(0,0,0,.52);
  }
  .album-header{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:14px;
  }
  .album-stars{
    font-size:38px; line-height:1;
    filter:drop-shadow(0 3px 0 rgba(69,36,8,.22));
  }
  .album-grid{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:12px;
    margin:0 auto 18px;
    max-width:440px;
  }
  .album-grid.four-grid{
    grid-template-columns:repeat(2, minmax(0, 1fr));
    max-width:310px;
  }
  .win-polaroid{
    position:relative;
    background:#ffffff;
    border:3px solid var(--outline);
    border-radius:16px;
    padding:8px 8px 14px 8px;
    box-shadow:0 6px 0 rgba(69,36,8,.26), 0 10px 18px rgba(0,0,0,.18);
    cursor:pointer;
    transform:rotate(var(--tilt, -2deg));
    transition:transform .18s cubic-bezier(.34,1.85,.5,1), box-shadow .18s;
    outline:none;
  }
  .win-polaroid:hover, .win-polaroid:focus-visible{
    transform:scale(1.06) rotate(0deg);
    box-shadow:0 8px 0 rgba(69,36,8,.3), 0 0 22px rgba(253,224,71,.85);
  }
  .win-polaroid:active, .win-polaroid.bounce{
    transform:scale(1.12) rotate(0deg);
  }
  .win-polaroid .pic-box{
    width:100%; aspect-ratio:1 / 1;
    border-radius:10px;
    overflow:hidden;
    background:linear-gradient(180deg, #bae6fd 0%, #fde68a 64%, #86efac 100%);
    border:2px solid rgba(69,36,8,.16);
    display:grid; place-items:center;
  }
  .win-polaroid .pic-box svg{
    width:100%; height:100%; display:block;
  }
  .win-polaroid .spk-badge{
    position:absolute; right:10px; bottom:8px;
    width:26px; height:26px; border-radius:50%;
    background:#ffd43b; border:2px solid var(--outline);
    display:grid; place-items:center; font-size:13px; line-height:1;
    box-shadow:0 2px 4px rgba(0,0,0,.22);
  }
  .win-btns{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px;
  }
  .big-play{
    min-height:68px; min-width:190px;
    border:4.5px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:24px;
    padding:12px 30px; cursor:pointer;
    box-shadow:0 7px 0 var(--outline), 0 10px 20px rgba(0,0,0,.25);
    text-shadow:0 2px 0 rgba(0,0,0,.25);
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
  }
  .big-play:active{ transform:translateY(3px) scale(.96); box-shadow:0 3px 0 var(--outline); }

  /* ================= RESPONSIVE PORTRAIT (iPhone 390x844) ================= */
  @media (max-width: 720px){
    #hud{ padding:max(8px, env(safe-area-inset-top)) 10px 0 10px; }
    #hootBtn{ width:64px; height:64px; flex:0 0 64px; }
    #starPill{ min-height:64px; min-width:74px; padding:0 12px; font-size:21px; }
    #soundBtn{ width:64px; height:64px; font-size:25px; }

    #bottomHud{ padding:0 10px; gap:6px; bottom:max(10px, env(safe-area-inset-bottom)); }
    #hornBtn{ width:68px; height:68px; font-size:30px; }
    #shutterBtn{ width:80px; height:80px; min-width:80px; min-height:80px; font-size:35px; }
    #albumBar{
      padding:6px 7px; gap:5px; border-radius:20px; border-width:3px;
      max-width:calc(100vw - 174px);
    }
    .album-slot{ width:38px; height:44px; padding:3px 3px 7px 3px; border-radius:8px; }
    #albumBar.six-slots{ gap:3px; padding:5px 6px; }
    #albumBar.six-slots .album-slot{ width:28px; height:36px; padding:2px 2px 5px 2px; border-radius:6px; }
    #albumBar.six-slots .album-slot .slot-dot{ width:10px; height:10px; }
  }
</style>
</head>

  /* =========================================================================
     2. VERIFIED HOOT VOICE ENGINE (HOOT_HAVE-Gated Studio Hoot MP3s, Zero TTS)
     ========================================================================= */
  var VBASE = "assets/voice/";
  var voiceEl = new Audio();
  voiceEl.preload = "auto";
  var voiceQueue = [];
  var voicePlaying = false;
  var audioUnlocked = false;
  var pendingBootClip = null;
  var soundOn = true;
  var dead = false;

  function hasHootClip(id){
    if(!id) return false;
    try{
      if(window.HOOT_HAVE && window.HOOT_HAVE[id]) return true;
      if(window.parent && window.parent.HOOT_HAVE && window.parent.HOOT_HAVE[id]) return true;
    }catch(e){}
    return false;
  }

  function resolveSafariClip(customId, fallbackId){
    var chosen = (customId && hasHootClip(customId)) ? customId : fallbackId;
    if(!chosen) return null;
    return chosen.indexOf(".mp3") >= 0 ? chosen : (chosen + ".mp3");
  }

  function clearVoice(stopCurrent){
    voiceQueue.length = 0;
    if(stopCurrent){
      voicePlaying = false;
      try{ voiceEl.pause(); voiceEl.currentTime = 0; }catch(e){}
    }
  }

  function pumpVoice(){
    if(dead || !soundOn || voicePlaying || !voiceQueue.length) return;
    var clip = voiceQueue.shift();
    voicePlaying = true;
    voiceEl.muted = false;
    voiceEl.src = VBASE + clip;
    var p = voiceEl.play();
    if(p && p.catch){
      p.catch(function(){
        voicePlaying = false;
        if(!audioUnlocked && !pendingBootClip) pendingBootClip = clip;
        pumpVoice();
      });
    }
  }
  voiceEl.addEventListener("ended", function(){
    voicePlaying = false;
    pumpVoice();
  });
  voiceEl.addEventListener("error", function(){
    voicePlaying = false;
    pumpVoice();
  });

  function enqueueVoice(clip, interrupt){
    if(dead || !soundOn || !clip) return;
    if(clip.indexOf(".mp3") < 0) clip = clip + ".mp3";
    if(interrupt) clearVoice(true);
    voiceQueue.push(clip);
    pumpVoice();
  }

  function speakSafariGuide(customId, fallbackId, isBoot){
    var clip = resolveSafariClip(customId, fallbackId);
    if(!clip || dead || !soundOn) return;
    if(isBoot){
      try{
        if(window.parent && window.parent !== window && typeof window.parent.__hwPlayAfterIntro === "function"){
          if(window.parent.__hwPlayAfterIntro(VBASE + clip)){
            pendingBootClip = null;
            return;
          }
        }
      }catch(e){}
    }
    enqueueVoice(clip, true);
  }

     ========================================================================= */
  var actx = null;
  function getAC(){
    if(!soundOn) return null;
    try{
      if(!actx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(AC) actx = new AC();
      }
      if(actx && actx.state === "suspended") actx.resume();
    }catch(e){}
    return actx;
  }

  function unlockAudioOnce(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    getAC();
    try{
      if(!voicePlaying){
        voiceEl.muted = true;
        voiceEl.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
        var p = voiceEl.play();
        if(p && p.then){
          p.then(function(){
            try{ voiceEl.pause(); voiceEl.currentTime = 0; }catch(e){}
            voiceEl.muted = false;
            if(pendingBootClip){
              var c = pendingBootClip;
              pendingBootClip = null;
              enqueueVoice(c, true);
            }
          }).catch(function(){ voiceEl.muted = false; });
        } else {
          voiceEl.muted = false;
        }
      }
    }catch(e){ voiceEl.muted = false; }
  }

  function sfxCameraShutter(){
    var c = getAC(); if(!c) return;
    var t = c.currentTime;
    try{
      /* Crisp two-click mechanical shutter burst */
      [0, 0.065].forEach(function(off, idx){
        var len = Math.floor(c.sampleRate * 0.045);
        var buf = c.createBuffer(1, len, c.sampleRate);
        var data = buf.getChannelData(0);
        for(var i = 0; i < len; i++){
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.24));
        }
        var src = c.createBufferSource();
        src.buffer = buf;
        var filt = c.createBiquadFilter();
        filt.type = "bandpass";
        filt.frequency.value = idx === 0 ? 2200 : 1550;
        filt.Q.value = 1.6;
        var g = c.createGain();
        g.gain.setValueAtTime(idx === 0 ? 0.34 : 0.24, t + off);
        g.gain.exponentialRampToValueAtTime(0.001, t + off + 0.045);
        src.connect(filt); filt.connect(g); g.connect(c.destination);
        src.start(t + off);
      });
      /* Joyful golden camera sparkle chime */
      [783.99, 1046.5, 1318.51].forEach(function(freq, i){
        var o = c.createOscillator();
        var g = c.createGain();
        o.type = "triangle";
        o.frequency.setValueAtTime(freq, t + 0.09 + i * 0.045);
        g.gain.setValueAtTime(0.11, t + 0.09 + i * 0.045);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.36 + i * 0.045);
        o.connect(g); g.connect(c.destination);
        o.start(t + 0.09 + i * 0.045); o.stop(t + 0.40 + i * 0.045);
      });
    }catch(e){}
  }

  function sfxBeepHorn(){
    var c = getAC(); if(!c) return;
    var t = c.currentTime;
    try{
      [0, 0.19].forEach(function(off, idx){
        var base = idx === 0 ? 392 : 466.16;
        [base, base * 1.25].forEach(function(f){
          var o = c.createOscillator();
          var g = c.createGain();
          var filt = c.createBiquadFilter();
          o.type = "sawtooth";
          o.frequency.setValueAtTime(f, t + off);
          filt.type = "lowpass";
          filt.frequency.value = 1350;
          g.gain.setValueAtTime(0.001, t + off);
          g.gain.linearRampToValueAtTime(0.11, t + off + 0.015);
          g.gain.setValueAtTime(0.10, t + off + 0.10);
          g.gain.exponentialRampToValueAtTime(0.001, t + off + 0.145);
          o.connect(filt); filt.connect(g); g.connect(c.destination);
          o.start(t + off); o.stop(t + off + 0.16);
        });
      });
    }catch(e){}
  }

  function sfxAnimal(id){
    var c = getAC(); if(!c) return;
    var t = c.currentTime;
    try{
      if(id === "lion"){
        /* Friendly warm cartoon lion roar */
        var o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
        o.type = "sawtooth";
        o.frequency.setValueAtTime(165, t);
        o.frequency.linearRampToValueAtTime(220, t + 0.12);
        o.frequency.exponentialRampToValueAtTime(98, t + 0.56);
        f.type = "lowpass"; f.frequency.setValueAtTime(750, t); f.frequency.exponentialRampToValueAtTime(280, t + 0.56);
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.16, t + 0.07);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.58);
        o.connect(f); f.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + 0.6);
      } else if(id === "elephant"){
        /* Playful rising elephant trumpet! */
        var o2 = c.createOscillator(), g2 = c.createGain(), f2 = c.createBiquadFilter();
        o2.type = "sawtooth";
        o2.frequency.setValueAtTime(340, t);
        o2.frequency.exponentialRampToValueAtTime(740, t + 0.18);
        o2.frequency.linearRampToValueAtTime(640, t + 0.44);
        f2.type = "bandpass"; f2.frequency.value = 1100; f2.Q.value = 2.2;
        g2.gain.setValueAtTime(0.001, t);
        g2.gain.linearRampToValueAtTime(0.18, t + 0.05);
        g2.gain.exponentialRampToValueAtTime(0.001, t + 0.48);
        o2.connect(f2); f2.connect(g2); g2.connect(c.destination);
        o2.start(t); o2.stop(t + 0.5);
      } else if(id === "giraffe"){
        /* Tall cheerful ascending wooden marimba notes */
        [392, 493.88, 587.33, 783.99].forEach(function(freq, i){
          var o3 = c.createOscillator(), g3 = c.createGain();
          o3.type = "sine";
          o3.frequency.setValueAtTime(freq, t + i * 0.065);
          g3.gain.setValueAtTime(0.14, t + i * 0.065);
          g3.gain.exponentialRampToValueAtTime(0.001, t + i * 0.065 + 0.22);
          o3.connect(g3); g3.connect(c.destination);
          o3.start(t + i * 0.065); o3.stop(t + i * 0.065 + 0.25);
        });
      } else if(id === "zebra"){

        [0, 0.1, 0.2, 0.3].forEach(function(off, i){
          var o4 = c.createOscillator(), g4 = c.createGain();
          o4.type = "triangle";
          o4.frequency.setValueAtTime(620 - i * 85, t + off);
          o4.frequency.exponentialRampToValueAtTime(480 - i * 70, t + off + 0.08);
          g4.gain.setValueAtTime(0.13, t + off);
          g4.gain.exponentialRampToValueAtTime(0.001, t + off + 0.09);
          o4.connect(g4); g4.connect(c.destination);
          o4.start(t + off); o4.stop(t + off + 0.1);
        });
      } else if(id === "monkey"){
        /* Cheeky monkey ooh-ooh-ah-ah bounce! */
        [0, 0.14, 0.28].forEach(function(off, i){
          var o5 = c.createOscillator(), g5 = c.createGain();
          o5.type = "sine";
          o5.frequency.setValueAtTime(420 + i * 70, t + off);
          o5.frequency.exponentialRampToValueAtTime(760 + i * 90, t + off + 0.07);
          o5.frequency.exponentialRampToValueAtTime(460, t + off + 0.12);
          g5.gain.setValueAtTime(0.14, t + off);
          g5.gain.exponentialRampToValueAtTime(0.001, t + off + 0.13);
          o5.connect(g5); g5.connect(c.destination);
          o5.start(t + off); o5.stop(t + off + 0.14);
        });
      } else if(id === "hippo"){

        [0, 0.09, 0.19].forEach(function(off, i){
          var o6 = c.createOscillator(), g6 = c.createGain();

  function getLayout(){
    var portrait = W < 720;
    var scale = portrait
      ? Math.max(0.68, Math.min(0.92, W / 440))
      : Math.max(0.84, Math.min(1.18, Math.min(W / 980, H / 640)));
    var roadY = H - (portrait ? 132 : 144);
    var jeepX = portrait ? Math.max(82, W * 0.25) : Math.max(150, W * 0.24);
    var jeepY = roadY - 12 * scale;
    var spotX = portrait ? Math.min(W - 86, W * 0.72) : Math.min(W - 150, W * 0.69);
    var spotY = portrait ? Math.max(195, roadY - 135 * scale) : Math.max(210, roadY - 68 * scale);
    return {
      portrait: portrait,
      scale: scale,
      roadY: roadY,
      jeepX: jeepX,
      jeepY: jeepY,
      spotX: spotX,
      spotY: spotY
    };
  }

  function spawnSparkles(x, y, count, col){
    var palette = [col || "#fde047", "#ffffff", "#fb923c", "#4ade80", "#38bdf8"];
    for(var i = 0; i < count; i++){
      var a = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      var spd = 95 + Math.random() * 220;
      sparkles.push({
        x: x, y: y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd - 45,
        r: 7 + Math.random() * 10,
        rot: Math.random() * 6.28,
        life: 1,
        decay: 0.9 + Math.random() * 0.65,
        col: palette[i % palette.length]
      });
    }
  }

  function spawnConfettiBurst(){
    var cols = ["#f59e0b", "#22c55e", "#38bdf8", "#f43f5e", "#a855f7", "#fde047"];
    for(var i = 0; i < 72; i++){
      confetti.push({
        x: Math.random() * W,
        y: -20 - Math.random() * H * 0.45,
        vx: (Math.random() - 0.5) * 120,
        vy: 120 + Math.random() * 190,
        w: 8 + Math.random() * 8,
        h: 5 + Math.random() * 6,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 9,
        col: cols[i % cols.length],
        life: 1
      });
    }
  }

  function spawnNextAnimal(){
    if(state.won) return;
    if(!state.queue.length){
      openAlbumFinale();
      return;
    }
    var nextMeta = state.queue.shift();
    var L = getLayout();
    activeAnimal = {
      id: nextMeta.id,
      meta: nextMeta,
      x: W + 160,
      y: L.spotY,
      stage: "entering", /* "entering" | "spotlight" | "celebrating" | "exiting" */
      enterT: 0,
      celebrateT: 0,
      hopT: 0,
      blinkT: 1.8 + Math.random() * 2.2,
      spotlightSpoken: false
    };
    state.phase = "driving";
    state.targetSpeed = L.portrait ? 155 : 210;
    syncHud();
  }

  function snapCurrentAnimal(isTest){
    if(state.won) return false;
    if(!activeAnimal){
      if(isTest){
        spawnNextAnimal();
      } else {
        return false;
      }
    }
    if(activeAnimal.stage === "celebrating" || activeAnimal.stage === "exiting") return false;

    /* If animal is still rolling in, snap it smoothly right to the spotlight! */
    var L = getLayout();
    if(activeAnimal.stage === "entering"){
      activeAnimal.x = L.spotX;
      activeAnimal.stage = "spotlight";
    }

    resetIdle();
    state.phase = "snapping";
    activeAnimal.stage = "celebrating";
    activeAnimal.celebrateT = 1.95;
    activeAnimal.hopT = 1.0;

    state.flashAlpha = 0.94;
    state.stars++;
    jeep.cheerT = 1.5;
    jeep.bounceT = 1.0;

    shutterBtn.classList.remove("snapped");
    void shutterBtn.offsetWidth;
    shutterBtn.classList.add("snapped");
    setTimeout(function(){ shutterBtn.classList.remove("snapped"); }, 220);

    starPill.classList.remove("pop");
    void starPill.offsetWidth;
    starPill.classList.add("pop");
    pulseHootBtn();

    sfxCameraShutter();
    var animalMeta = activeAnimal.meta;
    setTimeout(function(){ if(!dead) sfxAnimal(animalMeta.id); }, 130);
    speakSafariGuide(animalMeta.clip, animalMeta.fallback, false);

    spawnSparkles(activeAnimal.x, activeAnimal.y - 10, 26, animalMeta.accent);

    /* Record photo & launch flying Polaroid animation into the Bottom Safari Photo Album! */
    var slotIdx = state.photos.length;
    state.photos.push(animalMeta);

    var targetSlot = albumBar.querySelector('.album-slot[data-slot="' + slotIdx + '"]');
    var tx = W * 0.5, ty = H - 48;
    if(targetSlot){
      var sr = targetSlot.getBoundingClientRect();
      if(sr.width > 0){
        tx = sr.left + sr.width * 0.5;
        ty = sr.top + sr.height * 0.5;
      }
    }

    if(isTest){
      fillAlbumSlot(slotIdx, animalMeta);
      flyingPolaroid = null;
      if(state.photos.length >= TARGET_PHOTOS){
        openAlbumFinale();
      } else {
        activeAnimal.celebrateT = 0.25;
      }
    } else {
      flyingPolaroid = {
        animal: animalMeta,
        slotIdx: slotIdx,
        x0: activeAnimal.x,
        y0: activeAnimal.y - 16,
        x1: tx,
        y1: ty,
        t: 0,
        landed: false
      };
    }

    syncHud();
    return true;
  }

  function openAlbumFinale(){

  /* =========================================================================
     6. INPUT HANDLERS (FORGIVING TODDLER TAP-ANYWHERE + SHUTTER + HORN + KEYS)
     ========================================================================= */
  stageEl.addEventListener("pointerdown", unlockAudioOnce, { passive: true, capture: true });

  canvas.addEventListener("pointerdown", function(e){
    e.preventDefault();
    unlockAudioOnce();
    resetIdle();
    if(state.won) return;

    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;
    var L = getLayout();

    /* 1. Super-forgiving animal tap hitbox (>= 135px radius!) -> Snap Photo! */
    if(activeAnimal && (activeAnimal.stage === "spotlight" || (activeAnimal.stage === "entering" && activeAnimal.x < W - 30))){
      var hitR = Math.max(135, 155 * L.scale);
      if(Math.hypot(px - activeAnimal.x, py - activeAnimal.y) <= hitR){
        snapCurrentAnimal(false);
        return;
      }
    }

    /* 2. Tapping Safari Hoot's Jeep -> Honk Beep-Beep! */
    if(Math.hypot(px - L.jeepX, py - (L.jeepY - 24 * L.scale)) <= 115 * L.scale){
      triggerHorn();
      return;
    }

    /* 3. Riley age-2 generosity: tapping anywhere on the right half while animal is in spotlight snaps! */
    if(activeAnimal && activeAnimal.stage === "spotlight" && px > W * 0.44){
      snapCurrentAnimal(false);
      return;
    }

    /* Otherwise friendly sparkle tap feedback */
    spawnSparkles(px, py, 8, "#fde047");
  });

  shutterBtn.addEventListener("click", function(){
    unlockAudioOnce();
    resetIdle();
    if(state.won) return;
    if(activeAnimal && (activeAnimal.stage === "spotlight" || activeAnimal.stage === "entering")){
      snapCurrentAnimal(false);
    } else {
      /* Even while driving between animals, shutter gives playful flash & speeds up arrival! */

  /* =========================================================================
     7. PIXAR SAVANNA RENDERING ENGINE
     ========================================================================= */
  function drawMirroredScrollingBg(img, bgScrollX){
    if(!img || !img.complete || !img.naturalWidth) return false;
    var iw = img.naturalWidth, ih = img.naturalHeight;
    var scale = Math.max(H / ih, W / (iw * 1.3));
    var tileW = Math.ceil(iw * scale);
    var dh = Math.ceil(ih * scale);
    var dy = (H - dh) * 0.5;
    var startTile = Math.floor(bgScrollX / tileW);

    for(var k = 0; ; k++){
      var tileIdx = startTile + k;
      var drawX = Math.floor(tileIdx * tileW - bgScrollX);
      if(drawX > W + 4) break;
      var isMirrored = (((tileIdx % 2) + 2) % 2) === 1;
      if(isMirrored){
        ctx.save();
        ctx.translate(drawX + tileW + 1, dy);
        ctx.scale(-1, 1);
        ctx.drawImage(img, 0, 0, tileW + 2, dh);
        ctx.restore();
      } else {
        ctx.drawImage(img, drawX, dy, tileW + 2, dh);
      }
    }
    return true;
  }

  function drawFallbackSavanna(bgScrollX){
    /* Lush Golden-Hour Pixar Savanna Painted Backdrop Fallback */
    var sky = ctx.createLinearGradient(0, 0, 0, H * 0.65);
    sky.addColorStop(0, "#38a3e8");
    sky.addColorStop(0.42, "#8fd3f4");
    sky.addColorStop(0.76, "#fde68a");
    sky.addColorStop(1, "#f59e0b");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    /* Warm Glowing Savanna Sun */
    var sunX = W * 0.78, sunY = H * 0.19;
    var sunG = ctx.createRadialGradient(sunX, sunY, 12, sunX, sunY, Math.min(W, H) * 0.34);
    sunG.addColorStop(0, "rgba(255,254,230,0.98)");
    sunG.addColorStop(0.28, "rgba(254,240,138,0.68)");
    sunG.addColorStop(1, "rgba(251,191,36,0)");
    ctx.fillStyle = sunG;
    ctx.beginPath(); ctx.arc(sunX, sunY, Math.min(W, H) * 0.34, 0, Math.PI * 2); ctx.fill();

    /* Soft Scrolling Distant Savanna Hills (0.18x) */
    var hScroll = bgScrollX * 0.45;
    ctx.fillStyle = "#d98a4e";
    ctx.beginPath();
    ctx.moveTo(0, H * 0.68);
    for(var hx = -40; hx <= W + 60; hx += 40){
      var wx = hx + hScroll;
      var hy = H * 0.54 + Math.sin(wx * 0.0045) * 28 + Math.cos(wx * 0.009) * 14;
      ctx.lineTo(hx, hy);
    }
    ctx.lineTo(W + 60, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

    /* Iconic Distant Umbrella Acacia Trees */
    var treeSpan = 420;
    var treeOff = (bgScrollX * 0.72) % treeSpan;
    for(var ti = -1; ti <= Math.ceil(W / treeSpan) + 1; ti++){
      var tx = ti * treeSpan - treeOff + 110;
      var ty = H * 0.58;
      ctx.fillStyle = "#8a5228";
      ctx.fillRect(tx - 5, ty - 42, 10, 48);
      ctx.fillStyle = "#5c7a29";
      ctx.beginPath(); ctx.ellipse(tx, ty - 46, 52, 16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(tx - 24, ty - 38, 30, 11, -0.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(tx + 26, ty - 38, 28, 10, 0.1, 0, Math.PI * 2); ctx.fill();
    }

    /* Rolling Golden Savanna Plains */
    var plain = ctx.createLinearGradient(0, H * 0.56, 0, H);
    plain.addColorStop(0, "#d8a848");
    plain.addColorStop(0.5, "#b88a32");
    plain.addColorStop(1, "#7c581c");
    ctx.fillStyle = plain;
    ctx.fillRect(0, H * 0.57, W, H * 0.43);
  }

  function drawSunbeamsAndMotes(){
    /* Warm diagonal sunbeams */
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var raySpan = Math.max(W + 340, 1280);
    var rayOff = (state.scrollX * 0.25) % raySpan;
    for(var rb = 0; rb < 3; rb++){
      var bx = raySpan - ((rayOff + rb * (raySpan / 3)) % raySpan) - 120;
      var rw = Math.max(85, W * 0.10);
      ctx.save();
      ctx.translate(bx, -24);
      ctx.rotate(0.28);
      var rg = ctx.createLinearGradient(-rw, 0, rw, 0);
      rg.addColorStop(0, "rgba(255,248,200,0)");
      rg.addColorStop(0.5, "rgba(255,245,190,0.08)");
      rg.addColorStop(1, "rgba(255,248,200,0)");
      ctx.fillStyle = rg;
      ctx.fillRect(-rw, 0, rw * 2, H * 0.8);
      ctx.restore();
    }

    /* Warm Sunlit Dust Motes */
    dustMotes.forEach(function(dm){
      var mx = W - (((state.scrollX * dm.drift * 0.0008 + dm.x) % 1.12) + 1.12) % 1.12 * W;
      var my = ((dm.y + Math.sin(tAcc * 1.4 + dm.ph) * 0.025 + 1) % 1) * H;
      var alpha = 0.28 + Math.sin(tAcc * 2.2 + dm.ph) * 0.22;
      ctx.fillStyle = "rgba(255, 244, 185, " + Math.max(0.08, alpha).toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(mx, my, dm.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  function drawSavannaTrail(L, hasPhotoBg){
    if(!hasPhotoBg){
      /* Sunlit Warm Ochre Dirt Trail (for fallback canvas backdrop) */
      var roadTop = L.roadY - 22 * L.scale;
      var roadBot = H + 20;
      var roadG = ctx.createLinearGradient(0, roadTop, 0, roadBot);
      roadG.addColorStop(0, "rgba(218, 165, 86, 0.84)");
      roadG.addColorStop(0.32, "rgba(196, 134, 62, 0.94)");
      roadG.addColorStop(1, "rgba(132, 78, 28, 0.98)");
      ctx.fillStyle = roadG;
      ctx.beginPath();
      ctx.moveTo(0, roadTop);
      ctx.quadraticCurveTo(W * 0.5, roadTop - 10, W, roadTop);
      ctx.lineTo(W, roadBot);
      ctx.lineTo(0, roadBot);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(116, 146, 44, 0.72)";
      ctx.fillRect(0, roadTop - 6, W, 10);
    }

    /* Subtle scrolling tire-track pebbles along the sunlit safari trail */
    var seg = 160;
    var off = state.scrollX % seg;
    ctx.fillStyle = hasPhotoBg ? "rgba(120, 68, 22, 0.14)" : "rgba(120, 68, 22, 0.26)";
    for(var x = -off; x < W + seg; x += seg){
      ctx.beginPath(); ctx.ellipse(x + 30, L.roadY + 18, 22, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 108, L.roadY + 30, 12, 3, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  function rrect(c, x, y, w, h, r){
    var rad = Math.min(r, w * 0.5, h * 0.5);
    c.beginPath();
    c.moveTo(x + rad, y);
    c.lineTo(x + w - rad, y);
    c.quadraticCurveTo(x + w, y, x + w, y + rad);
    c.lineTo(x + w, y + h - rad);
    c.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
    c.lineTo(x + rad, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - rad);
    c.lineTo(x, y + rad);
    c.quadraticCurveTo(x, y, x + rad, y);
    c.closePath();
  }

  function drawStar5(x, y, r, col){
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    for(var i = 0; i < 10; i++){
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var rad = i % 2 === 0 ? r : r * 0.45;
      if(i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    ctx.restore();
  }

  /* =========================================================================
     8. ADORABLE ANIMATED SAVANNA ANIMALS + GOLDEN VIEWFINDER BRACKET
     ========================================================================= */
  function drawAnimalHabitat(a, L){
    var s = L.scale;
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.scale(s, s);
    var hab = a.meta.habitat;
    if(hab === "water"){
      /* Sparkling Savanna Watering Hole for Hippo */
      var wg = ctx.createRadialGradient(0, 56, 12, 0, 58, 125);
      wg.addColorStop(0, "#7dd3fc");
      wg.addColorStop(0.65, "#0ea5e9");
      wg.addColorStop(1, "#0369a1");
      ctx.fillStyle = wg;
      ctx.strokeStyle = "#d4a359";
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.ellipse(0, 58, 118, 34, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      /* Ripples & Lily Pad */
      ctx.strokeStyle = "rgba(255,255,255,0.65)";
      ctx.lineWidth = 2.5;
      var rip = 34 + Math.sin(tAcc * 3.2) * 8;
      ctx.beginPath(); ctx.ellipse(0, 58, rip + 42, 14, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#22c55e";
      ctx.beginPath(); ctx.ellipse(-78, 56, 18, 8, -0.1, 0.3, Math.PI * 1.9); ctx.lineTo(-78, 56); ctx.fill();
      ctx.fillStyle = "#f472b6";
      ctx.beginPath(); ctx.arc(-78, 52, 5, 0, Math.PI * 2); ctx.fill();
    } else if(hab === "acacia" || hab === "vine"){
      /* Warm Sunlit Acacia Branch overhead for Giraffe & Monkey */
      ctx.strokeStyle = "#7c4a1d";
      ctx.lineWidth = 14;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(150, -125);
      ctx.quadraticCurveTo(45, -108, -72, -120);
      ctx.stroke();
      /* Lush Acacia Leaf Clusters */
      ctx.fillStyle = "#4d7c0f";

  function drawGoldenViewfinder(a, L){
    if(!a || a.stage !== "spotlight") return;
    var s = L.scale;
    var pulse = 1 + Math.sin(tAcc * 4.5) * 0.045 + (state.nudgePulse > 0 ? Math.sin(tAcc * 14) * 0.05 : 0);
    var hw = 96 * s * pulse;
    var hh = 92 * s * pulse;
    var corner = 26 * s;

    ctx.save();
    ctx.translate(a.x, a.y - 6 * s);

    /* Soft Golden Glow Behind Brackets */
    ctx.shadowColor = "rgba(255, 212, 59, 0.92)";
    ctx.shadowBlur = 18;
    ctx.strokeStyle = "#fff8cc";
    ctx.lineWidth = 6.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    /* Four Rounded Golden Camera Viewfinder Brackets */
    ctx.beginPath();
    /* Top-left */
    ctx.moveTo(-hw, -hh + corner); ctx.lineTo(-hw, -hh); ctx.lineTo(-hw + corner, -hh);
    /* Top-right */
    ctx.moveTo(hw - corner, -hh); ctx.lineTo(hw, -hh); ctx.lineTo(hw, -hh + corner);
    /* Bottom-right */
    ctx.moveTo(hw, hh - corner); ctx.lineTo(hw, hh); ctx.lineTo(hw - corner, hh);
    /* Bottom-left */
    ctx.moveTo(-hw + corner, hh); ctx.lineTo(-hw, hh); ctx.lineTo(-hw, hh - corner);
    ctx.stroke();

    ctx.strokeStyle = "#f59e0b";
    ctx.lineWidth = 3.2;
    ctx.stroke();

    /* Subtle Center Focus Crosshair Ring */
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255, 248, 200, 0.62)";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([7, 7]);
    ctx.beginPath(); ctx.arc(0, 0, 26 * s, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawSafariJeep(L){
    var s = L.scale * 1.04;
    var driveBob = state.speed > 10 ? Math.sin(tAcc * 14) * 3.2 : Math.sin(tAcc * 2.6) * 1.2;
    var actionHop = jeep.bounceT > 0 ? Math.abs(Math.sin(jeep.bounceT * Math.PI * 2)) * 16 : 0;

    ctx.save();
    ctx.translate(L.jeepX, L.jeepY - actionHop);
    ctx.scale(s, s);

    /* Ground Shadow */
    ctx.fillStyle = "rgba(58, 30, 8, 0.34)";
    ctx.beginPath(); ctx.ellipse(0, 26 + actionHop * 0.5, 92, 16, 0, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.translate(0, driveBob);

    /* Spare Tire Mounted on Back */
    ctx.fillStyle = "#1f2937"; ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(-86, -24, 12, 24, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    /* Open-Top Roll Bar Frame */
    ctx.strokeStyle = "#3f6212"; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(-64, -36); ctx.lineTo(-54, -84); ctx.lineTo(16, -84); ctx.lineTo(32, -38);
    ctx.stroke();

    /* Smiling Safari-Hat Hoot Driving Inside Open-Top Jeep! */
    ctx.save();
    ctx.translate(-12, -46);
    /* Owl Torso */
    ctx.fillStyle = "#a06a3b"; ctx.strokeStyle = "#452408"; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.ellipse(0, 14, 21, 20, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fdeed3";
    ctx.beginPath(); ctx.ellipse(2, 16, 12, 12, 0, 0, Math.PI * 2); ctx.fill();
    /* Waving Wing when Cheering */
    var wingAng = jeep.cheerT > 0 ? -0.9 + Math.sin(tAcc * 18) * 0.5 : -0.15;
    ctx.save(); ctx.translate(-18, 6); ctx.rotate(wingAng);
    ctx.fillStyle = "#8a5a33"; ctx.beginPath(); ctx.ellipse(-7, 0, 11, 5.5, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    /* Owl Head */
    ctx.fillStyle = "#a8703f"; ctx.strokeStyle = "#452408"; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(0, -12, 20, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fdeed3";
    ctx.beginPath(); ctx.ellipse(-7, -12, 8.5, 9, 0, 0, Math.PI * 2); ctx.ellipse(8, -12, 8.5, 9, 0, 0, Math.PI * 2); ctx.fill();
    if(jeep.blinkT < 0.13){
      ctx.strokeStyle = "#17324f"; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(-7, -12, 4, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.beginPath(); ctx.arc(8, -12, 4, 0.2, Math.PI - 0.2); ctx.stroke();
    } else {
      ctx.fillStyle = "#17324f";
      ctx.beginPath(); ctx.arc(-6, -12, 4.4, 0, Math.PI * 2); ctx.arc(9, -12, 4.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(-4.6, -13.5, 1.8, 0, Math.PI * 2); ctx.arc(10.4, -13.5, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#ff9f1c"; ctx.strokeStyle = "#b45309"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-2, -6); ctx.quadraticCurveTo(2, -9, 6, -6); ctx.lineTo(2, 1); ctx.closePath(); ctx.fill(); ctx.stroke();
    /* Safari Explorer Hat on Hoot */
    ctx.fillStyle = "#d9b26f"; ctx.strokeStyle = "#6c4616"; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(1, -28, 25, 6, -0.04, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#e8c888";
    ctx.beginPath(); ctx.moveTo(-16, -29); ctx.quadraticCurveTo(1, -46, 18, -29); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#2f855a";
    ctx.fillRect(-15, -31, 32, 4.5);
    ctx.restore();

    /* Steering Wheel */
    ctx.strokeStyle = "#452408"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(16, -34); ctx.lineTo(28, -46); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(15, -45, 5, 12, -0.4, 0, Math.PI * 2); ctx.stroke();

    /* Windshield Frame */
    ctx.strokeStyle = "#5c3b16"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(28, -36); ctx.lineTo(38, -74); ctx.stroke();
    ctx.strokeStyle = "rgba(186,230,253,0.75)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(31, -40); ctx.lineTo(39, -70); ctx.stroke();

    /* Khaki Safari Jeep Body */
    var bodyG = ctx.createLinearGradient(0, -40, 0, 14);
    bodyG.addColorStop(0, "#e9c47c");
    bodyG.addColorStop(0.55, "#d4a359");
    bodyG.addColorStop(1, "#a6752f");
    ctx.fillStyle = bodyG; ctx.strokeStyle = "#452408"; ctx.lineWidth = 3.8;
    ctx.beginPath();
    ctx.moveTo(-80, -34);
    ctx.lineTo(-42, -34);
    ctx.lineTo(-34, -22);
    ctx.lineTo(18, -22);
    ctx.lineTo(26, -38);
    ctx.lineTo(74, -36);
    ctx.quadraticCurveTo(86, -34, 86, -20);
    ctx.lineTo(86, 8);
    ctx.quadraticCurveTo(86, 16, 74, 16);
    ctx.lineTo(-74, 16);
    ctx.quadraticCurveTo(-82, 16, -82, 6);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    /* Forest-Green Safari Stripe & Star Emblem */
    ctx.fillStyle = "#2f855a";
    ctx.fillRect(-78, -8, 160, 10);
    drawStar5(-10, -3, 9, "#fef08a");

    /* Glowing Round Headlight (flashes bright on Horn!) */
    ctx.fillStyle = jeep.hornT > 0 ? "#ffffff" : "#fef08a";
    ctx.strokeStyle = "#452408"; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.ellipse(84, -18, 8, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if(jeep.hornT > 0){
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      var hg = ctx.createRadialGradient(90, -18, 4, 102, -18, 56);
      hg.addColorStop(0, "rgba(255,250,190,0.85)");
      hg.addColorStop(1, "rgba(255,220,100,0)");
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(102, -18, 56, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    /* Front Bumper */
    ctx.fillStyle = "#475569"; ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 2.5;
    rrect(ctx, 78, 4, 16, 12, 4); ctx.fill(); ctx.stroke();
    ctx.restore();

    /* Two Chunky Spinning Safari Tires */
    [-46, 48].forEach(function(wx){
      ctx.save();
      ctx.translate(wx, 14);
      ctx.rotate(jeep.wheelAngle);
      ctx.fillStyle = "#1f2937"; ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      /* Chunky tire treads */
      ctx.strokeStyle = "#374151"; ctx.lineWidth = 4;
      for(var tr = 0; tr < 6; tr++){
        var ta = (tr / 6) * Math.PI * 2;
        ctx.beginPath(); ctx.moveTo(Math.cos(ta) * 14, Math.sin(ta) * 14); ctx.lineTo(Math.cos(ta) * 21, Math.sin(ta) * 21); ctx.stroke();
      }
      ctx.fillStyle = "#e8c888"; ctx.strokeStyle = "#452408"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#452408";
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    ctx.restore();
  }

  function drawForegroundParallax(){
    var px = state.scrollX * 1.38;
    var span = 16 * 185;
    fgGrass.forEach(function(fg){
      var sx = (((fg.worldX - px) % span) + span) % span - 140;
      if(sx > W + 120) return;
      ctx.save();
      ctx.translate(sx, H + 4);
      for(var b = 0; b < fg.blades; b++){
        var sway = Math.sin(tAcc * 2.1 + fg.ph + b) * 9;
        var bh = fg.h * (0.72 + (b % 3) * 0.16);
        var bx = (b - fg.blades * 0.5) * 12;
        ctx.fillStyle = b % 2 === 0 ? "rgba(74, 98, 22, 0.72)" : "rgba(116, 144, 34, 0.65)";
        ctx.beginPath();
        ctx.moveTo(bx - 5, 0);
        ctx.quadraticCurveTo(bx + sway * 0.5, -bh * 0.55, bx + sway, -bh);
        ctx.quadraticCurveTo(bx + 7 + sway * 0.4, -bh * 0.5, bx + 5, 0);
        ctx.closePath();
        ctx.fill();
      }
      if(fg.flower){
        ctx.fillStyle = "#fde047";
        ctx.beginPath(); ctx.arc(6, -fg.h * 0.72, 5.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#f97316";
        ctx.beginPath(); ctx.arc(6, -fg.h * 0.72, 2.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    });
  }

  function drawFlyingPolaroid(){
    if(!flyingPolaroid) return;
    var fp = flyingPolaroid;
    var u = Math.min(1, fp.t);
    /* Pause briefly big & tilted so toddler admires the snapshot, then arc into album! */
    var moveU = u < 0.34 ? 0 : (u - 0.34) / 0.66;
    var ease = moveU * moveU * (3 - 2 * moveU);
    var cx = (fp.x0 + fp.x1) * 0.5;
    var cy = Math.min(fp.y0, fp.y1) - 110;
    var mu = 1 - ease;
    var px = mu * mu * fp.x0 + 2 * mu * ease * cx + ease * ease * fp.x1;
    var py = mu * mu * fp.y0 + 2 * mu * ease * cy + ease * ease * fp.y1;
    var sc = u < 0.34 ? (0.85 + (u / 0.34) * 0.25) : (1.1 - ease * 0.72);
    var rot = -0.14 + ease * 0.1;

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(rot);
    ctx.scale(sc, sc);
    ctx.shadowColor = "rgba(0,0,0,0.35)";
    ctx.shadowBlur = 18;
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#452408";
    ctx.lineWidth = 4;
    rrect(ctx, -54, -62, 108, 126, 12); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    var picG = ctx.createLinearGradient(0, -52, 0, 42);
    picG.addColorStop(0, fp.animal.bgA);
    picG.addColorStop(1, fp.animal.bgB);
    ctx.fillStyle = picG;
    rrect(ctx, -44, -52, 88, 88, 6); ctx.fill();

    /* Crisp mini star shimmer badge inside flying polaroid */
    drawStar5(0, -8, 24, "#ffffff");
    drawStar5(0, -8, 15, fp.animal.accent);
    ctx.restore();
  }

  /* =========================================================================
     10. MAIN 60FPS UPDATE & RENDER LOOP
     ========================================================================= */
  var lastTime = performance.now();

  function update(dt){
    tAcc += dt;
    var L = getLayout();

    /* Smooth speed transitions (cruising -> gentle stop at animal -> cruising) */
    state.speed += (state.targetSpeed - state.speed) * Math.min(1, dt * 4.2);
    state.scrollX += state.speed * dt;

    /* Jeep wheel rotation, suspension, blink & rear dust puffs */
    jeep.wheelAngle += (state.speed * dt) / 22;
    if(jeep.bounceT > 0) jeep.bounceT = Math.max(0, jeep.bounceT - dt * 1.8);
    if(jeep.cheerT > 0) jeep.cheerT = Math.max(0, jeep.cheerT - dt);
    if(jeep.hornT > 0) jeep.hornT = Math.max(0, jeep.hornT - dt);
    jeep.blinkT -= dt;
    if(jeep.blinkT <= 0) jeep.blinkT = 2.4 + Math.random() * 2.8;

    if(state.speed > 26){
      jeep.dustAcc += dt * (state.speed * 0.055);
      while(jeep.dustAcc >= 1){
        jeep.dustAcc -= 1;
        tireDust.push({
          x: L.jeepX - 66 * L.scale + (Math.random() - 0.5) * 12,
          y: L.jeepY + 22 * L.scale,
          vx: -state.speed * 0.48 - 18 - Math.random() * 24,
          vy: -14 - Math.random() * 26,
          r: 7 + Math.random() * 11,
          life: 1
        });
      }
    }

    if(state.flashAlpha > 0) state.flashAlpha = Math.max(0, state.flashAlpha - dt * 2.5);
    if(state.nudgePulse > 0) state.nudgePulse = Math.max(0, state.nudgePulse - dt);

    /* Spawn next animal after brief scenic cruise */
    if(!state.won && !activeAnimal){
      state.targetSpeed = L.portrait ? 155 : 210;
      state.driveCooldown -= dt;
      if(state.driveCooldown <= 0){
        spawnNextAnimal();
      }
    }

    /* Update Active Savanna Animal */
    if(activeAnimal){
      activeAnimal.y = L.spotY;
      activeAnimal.blinkT -= dt;
      if(activeAnimal.blinkT <= 0) activeAnimal.blinkT = 2.0 + Math.random() * 2.6;
      if(activeAnimal.hopT > 0) activeAnimal.hopT = Math.max(0, activeAnimal.hopT - dt * 1.4);

      if(activeAnimal.stage === "entering"){
        var dx = activeAnimal.x - L.spotX;
        var move = Math.max(state.speed, 130) * dt * 1.25;
        if(dx <= move + 2){
          activeAnimal.x = L.spotX;
          activeAnimal.stage = "spotlight";
          state.phase = "spotlight";
          state.targetSpeed = 0; /* Gently pause jeep so Riley age 2 never misses a shot! */
          state.idleTimer = 0;
          syncHud();
          if(!activeAnimal.spotlightSpoken){
            activeAnimal.spotlightSpoken = true;
            if(state.photos.length === 0){
              /* First encounter: gently prompt after welcome or right away if welcome already done */
              setTimeout(function(){
                if(!dead && activeAnimal && activeAnimal.stage === "spotlight" && !voicePlaying && state.photos.length === 0){
                  speakSafariGuide("hoot-saf-look", "hoot-tap-big-btn", false);
                }
              }, 900);
            } else {
              sfxAnimal(activeAnimal.id);
            }
          }
        } else {
          activeAnimal.x -= move;
          /* Smoothly slow down as jeep approaches animal */
          if(dx < 210){
            state.targetSpeed = Math.max(38, (dx / 210) * 170);
          }
        }
      }
      else if(activeAnimal.stage === "spotlight"){
        activeAnimal.x += (L.spotX - activeAnimal.x) * Math.min(1, dt * 8);
        state.targetSpeed = 0;

        /* Gentle Idle Reminder so a toddler is never stuck */
        state.idleTimer += dt;
        var threshold = state.idleSpokenCount === 0 ? 8.5 : 14.0;
        if(state.idleTimer >= threshold){
          state.idleTimer = 0;
          state.idleSpokenCount++;
          state.nudgePulse = 1.6;
          pulseHootBtn();
          speakSafariGuide("hoot-saf-idle", "hoot-tap-big-btn", false);
        }
      }
      else if(activeAnimal.stage === "celebrating"){
        state.targetSpeed = 0;
        activeAnimal.celebrateT -= dt;
        if(activeAnimal.celebrateT <= 0){
          if(state.photos.length >= TARGET_PHOTOS){
            openAlbumFinale();
          } else {
            activeAnimal.stage = "exiting";
            state.phase = "driving";
            state.targetSpeed = L.portrait ? 165 : 220;
            syncHud();
          }
        }
      }
      else if(activeAnimal.stage === "exiting"){
        activeAnimal.x -= Math.max(state.speed, 160) * 1.15 * dt;
        if(activeAnimal.x < -170){
          activeAnimal = null;
          state.driveCooldown = 0.65;
        }
      }
    }

    /* Update Flying Polaroid Photo */
    if(flyingPolaroid){
      flyingPolaroid.t += dt * 1.18;
      if(flyingPolaroid.t >= 1){
        fillAlbumSlot(flyingPolaroid.slotIdx, flyingPolaroid.animal);
        flyingPolaroid = null;
      }
    }

    /* Update Particles */
    for(var di = tireDust.length - 1; di >= 0; di--){
      var td = tireDust[di];
      td.x += td.vx * dt;
      td.y += td.vy * dt;
      td.r += dt * 16;
      td.life -= dt * 1.35;
      if(td.life <= 0) tireDust.splice(di, 1);
    }
    for(var si = sparkles.length - 1; si >= 0; si--){
      var sp = sparkles[si];
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      sp.vy += 120 * dt;
      sp.vx *= 0.96;
      sp.rot += dt * 5;
      sp.life -= sp.decay * dt;
      if(sp.life <= 0) sparkles.splice(si, 1);
    }
    for(var ni = musicNotes.length - 1; ni >= 0; ni--){
      var mn = musicNotes[ni];
      mn.x += mn.vx * dt;
      mn.y += mn.vy * dt;
      mn.life -= dt * 1.25;
      if(mn.life <= 0) musicNotes.splice(ni, 1);
    }
    for(var ci = confetti.length - 1; ci >= 0; ci--){
      var cf = confetti[ci];
      cf.x += cf.vx * dt + Math.sin(tAcc * 4 + ci) * 24 * dt;
      cf.y += cf.vy * dt;
      cf.rot += cf.vr * dt;
      if(cf.y > H + 30){
        if(state.won){
          cf.y = -20;
          cf.x = Math.random() * W;
        } else {
          confetti.splice(ci, 1);
        }
      }
    }
  }

  function render(now){
    if(dead) return;
    var dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
    lastTime = now;
    update(dt);

    var L = getLayout();
    var bgScrollX = state.scrollX * 0.42;

    /* 1. Seamless Mirrored Scrolling Pixar Savanna Backdrop (with lush painted fallback) */
    var hasPhotoBg = drawMirroredScrollingBg(bgImg, bgScrollX);
    if(!hasPhotoBg){
      drawFallbackSavanna(bgScrollX);
    }

    /* 2. Warm Sunbeams & Floating Golden Dust Motes */
    drawSunbeamsAndMotes();

    /* 3. Sunlit Savanna Dirt Trail */
    drawSavannaTrail(L, hasPhotoBg);

    /* 4. Active Savanna Animal Habitat + Cute Animated Animal + Golden Viewfinder */
    if(activeAnimal){
      drawAnimalHabitat(activeAnimal, L);
      drawCuteAnimal(activeAnimal, L);
      drawGoldenViewfinder(activeAnimal, L);
    }

    /* 5. Rear Jeep Dust Puffs */
    tireDust.forEach(function(td){
      ctx.save();
      ctx.globalAlpha = Math.max(0, td.life * 0.52);
      ctx.fillStyle = "#f5deb3";
      ctx.beginPath(); ctx.arc(td.x, td.y, td.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    /* 6. Safari Hoot's Open-Top Jeep */
    drawSafariJeep(L);

    /* 7. Foreground Parallax Savanna Grass */
    drawForegroundParallax();

    /* 8. Musical Horn Notes & Golden Sparkles */
    musicNotes.forEach(function(mn){
      ctx.save();
      ctx.globalAlpha = Math.max(0, mn.life);
      ctx.font = "800 32px 'Fredoka', sans-serif";
      ctx.lineWidth = 4; ctx.strokeStyle = "#452408";
      ctx.strokeText(mn.glyph, mn.x, mn.y);
      ctx.fillStyle = mn.col;
      ctx.fillText(mn.glyph, mn.x, mn.y);
      ctx.restore();
    });

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    sparkles.forEach(function(sp){
      ctx.save();
      ctx.globalAlpha = Math.max(0, sp.life);
      ctx.translate(sp.x, sp.y);
      ctx.rotate(sp.rot);
      drawStar5(0, 0, sp.r, sp.col);
      ctx.restore();
    });
    ctx.restore();

    /* 9. Flying Polaroid Photo Into Album */
    drawFlyingPolaroid();

    /* 10. Festive Confetti Shower */
    confetti.forEach(function(cf){
      ctx.save();
      ctx.translate(cf.x, cf.y);
      ctx.rotate(cf.rot);
      ctx.fillStyle = cf.col;
      ctx.fillRect(-cf.w * 0.5, -cf.h * 0.5, cf.w, cf.h);
      ctx.restore();
    });

    /* 11. Joyful White Camera Flash Overlay */
    if(state.flashAlpha > 0.01){
      ctx.save();
      ctx.fillStyle = "rgba(255, 255, 250, " + state.flashAlpha.toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    requestAnimationFrame(render);
  }

  /* Clean Teardown */
  function teardown(){
    dead = true;
    clearVoice(true);
  }
  window.addEventListener("pagehide", teardown);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) clearVoice(false);
  });

  /* =========================================================================
     11. PUBLIC TEST HOOK (window.__safariGame) & BOOT
     ========================================================================= */
  function snapshot(){
    return {
      mode: isKidB ? "kidb" : "kida",
      targetPhotos: TARGET_PHOTOS,
      photosTaken: state.photos.length,
      collectedIds: state.photos.map(function(p){ return p.id; }),
      currentAnimal: activeAnimal ? activeAnimal.id : null,
      animalReady: !!(activeAnimal && activeAnimal.stage === "spotlight"),
      phase: state.phase,
      scrollX: Math.round(state.scrollX * 10) / 10,
      stars: state.stars,
      honks: state.honks,
      won: state.won
    };
  }

  window.__safariGame = {
    snapshot: snapshot,
    snapCurrentForTest: function(){
      if(state.won) return snapshot();
      if(!activeAnimal || activeAnimal.stage === "celebrating" || activeAnimal.stage === "exiting"){
        activeAnimal = null;
        spawnNextAnimal();
      }
      if(activeAnimal){
        snapCurrentAnimal(true);
      }
      return snapshot();
    }
  };

  startNewSafari(true);
  requestAnimationFrame(render);
})();
</script>
