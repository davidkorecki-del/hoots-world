<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="dress"; window.__HOOT_SELF_COACH__=true;</script>
<script src="js/hoot-game-head.js?v=llprev3e157"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Dress Up Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#2b2342;
    --cream:#fffdf7;
    --wall-a:#fff5e6;
    --wall-b:#ffe7df;
    --curtain-1:#d94a6a;
    --curtain-2:#eb6b88;
    --curtain-3:#b73353;
    --gold-1:#fff3b0;
    --gold-2:#f7c548;
    --gold-3:#d48c19;
    --gold-4:#9c5d08;
    --coral:#ff665c;
    --coral-dark:#d84038;
    --teal:#18bfb6;
    --teal-dark:#0d8b85;
    --leaf:#4cc75c;
    --leaf-dark:#2f943d;
    --plum:#8b6fd8;
    --plum-dark:#6345b0;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; width:100%; margin:0; padding:0; overflow:hidden; }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#ffe9e2;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ================= SUNNY STORYBOOK DRESSING ROOM ================= */
  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    background:
      radial-gradient(ellipse 75% 58% at 50% 6%, rgba(255,250,214,.92) 0%, rgba(255,244,210,0) 68%),
      repeating-linear-gradient(90deg, rgba(255,190,178,.22) 0 38px, rgba(255,246,228,.22) 38px 76px),
      linear-gradient(180deg, #fff6e6 0%, #ffe9e1 56%, #f9d9d5 100%);
    transition:background .45s ease;
  }

  /* Pixar Storybook Dressing Room Backdrop (with warm gradient fallback) */
  #worldBg{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:
      url("assets/worlds3d/bg_dress.jpg"),
      radial-gradient(ellipse 75% 58% at 50% 6%, rgba(255,250,214,.92) 0%, rgba(255,244,210,0) 68%),
      linear-gradient(180deg, #fff6e6 0%, #ffe9e1 56%, #f9d9d5 100%);
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    transition:filter .45s ease;
  }
  #worldBg::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(255,250,242,.12) 25%, rgba(74,34,48,.22) 100%);
  }
  #stage.parade #worldBg{ filter:brightness(.55) saturate(1.15); }

  /* Sunbeam glow from top of dressing room */
  #sunbeams{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
    background:
      conic-gradient(from 156deg at 50% -10%, transparent 0deg, rgba(255,245,195,.28) 14deg, transparent 28deg, rgba(255,235,175,.22) 42deg, transparent 58deg);
    transition:opacity .45s ease;
  }

  /* Velvet curtains framing the dressing room */
  .room-curtain{
    position:absolute;
    top:0;
    bottom:0;
    width:clamp(22px, 3.6vw, 54px);
    z-index:1;
    pointer-events:none;
    background:
      repeating-linear-gradient(90deg, var(--curtain-3) 0 6px, var(--curtain-1) 6px 16px, var(--curtain-2) 16px 24px);
    box-shadow:0 0 22px rgba(130,30,58,.24);
    transition:filter .45s ease;
  }
  .room-curtain.left{
    left:0;
    border-right:4px solid var(--gold-2);
    border-bottom-right-radius:36px 220px;
  }
  .room-curtain.right{
    right:0;
    border-left:4px solid var(--gold-2);
    border-bottom-left-radius:36px 220px;
  }
  .curtain-tie{
    position:absolute;
    top:52%;
    width:100%;
    height:12px;
    background:linear-gradient(180deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
    border-radius:999px;
    box-shadow:0 3px 6px rgba(80,35,10,.25);
  }
  .room-valance{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:22px;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(circle at 18px 0, var(--curtain-1) 16px, transparent 17px) 0 0 / 36px 22px repeat-x;
    filter:drop-shadow(0 3px 0 var(--gold-2)) drop-shadow(0 6px 8px rgba(120,35,58,.18));
    opacity:.92;
  }

  /* Ambient floating room sparkles */
  #ambientSparkles{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }
  .amb-sp{
    position:absolute;
    color:#f6ba2d;
    opacity:.62;
    font-size:16px;
    animation:ambFloat 4.2s ease-in-out infinite alternate;
    text-shadow:0 0 8px rgba(255,222,110,.8);
  }
  @keyframes ambFloat{
    0%{ transform:translateY(0) scale(.75) rotate(0deg); opacity:.3; }
    100%{ transform:translateY(-14px) scale(1.18) rotate(24deg); opacity:.9; }
  }

  /* Spotlight Parade twilight dim & disco beams */
  #paradeVeil{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    overflow:hidden;
    opacity:0;
    background:radial-gradient(circle at 50% 44%, rgba(54,32,102,.32) 0%, rgba(22,13,48,.82) 72%);
    transition:opacity .4s ease;
  }
  .disco-beam{
    position:absolute;
    top:-16%;
    width:46%;
    height:132%;
    pointer-events:none;
    opacity:0;
    transform-origin:50% 0%;
    mix-blend-mode:screen;
    transition:opacity .35s ease;
  }
  #beamL{
    left:10%;
    background:linear-gradient(180deg, rgba(255,233,122,.78) 0%, rgba(255,143,190,.28) 58%, transparent 100%);
    clip-path:polygon(44% 0%, 56% 0%, 96% 100%, 4% 100%);
  }
  #beamR{
    right:10%;
    background:linear-gradient(180deg, rgba(126,238,255,.76) 0%, rgba(196,154,255,.28) 58%, transparent 100%);
    clip-path:polygon(44% 0%, 56% 0%, 96% 100%, 4% 100%);
  }
  #stage.parade #paradeVeil{ opacity:1; }
  #stage.parade #sunbeams{ opacity:.12; }
  #stage.parade .room-curtain{ filter:brightness(.62) saturate(1.15); }
  #stage.parade #beamL{ opacity:.92; animation:sweepL 1.15s ease-in-out infinite alternate; }
  #stage.parade #beamR{ opacity:.92; animation:sweepR 1.15s ease-in-out infinite alternate; }
  @keyframes sweepL{ from{ transform:rotate(-20deg); } to{ transform:rotate(18deg); } }
  @keyframes sweepR{ from{ transform:rotate(20deg); } to{ transform:rotate(-18deg); } }

  /* ================= TOP HEADER (HUD + CHARACTER PILLS) ================= */
  #topHeader{
    position:relative;
    z-index:10;
    flex:0 0 auto;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:8px;
  }
  .hud-left{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .round-btn{
    width:64px;
    height:64px;
    min-width:64px;
    min-height:64px;
    border-radius:50%;
    border:4px solid #fff;
    background:linear-gradient(180deg, #fffef9 0%, #fff1d8 100%);
    color:var(--ink);
    display:grid;
    place-items:center;
    cursor:pointer;
    padding:0;
    box-shadow:0 5px 0 rgba(120,66,46,.22), 0 8px 16px rgba(120,66,46,.14);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1);
  }
  .round-btn:active{ transform:translateY(3px) scale(.93); }
  .round-btn svg{ width:30px; height:30px; display:block; }
  #hootGuideBtn{
    background:linear-gradient(180deg, #fff8d6 0%, #ffe08a 100%);
    box-shadow:0 5px 0 rgba(168,108,16,.28), 0 8px 16px rgba(120,66,46,.18);
  }
  #hootGuideBtn svg{ width:46px; height:46px; }
  #hootGuideBtn.talking{ animation:hootBtnBob .24s ease-in-out infinite alternate; }
  #hootGuideBtn.cheer{ animation:hootBtnCheer .52s cubic-bezier(.34,1.8,.5,1); }
  @keyframes hootBtnBob{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-4px) scale(1.06); } }
  @keyframes hootBtnCheer{ 0%,100%{ transform:scale(1); } 45%{ transform:scale(1.16) rotate(-7deg); } }

  #starBank{
    height:64px;
    min-width:96px;
    padding:0 16px 0 12px;
    border-radius:999px;
    border:4px solid #fff;
    background:linear-gradient(180deg, #fffdf4 0%, #ffefc2 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-weight:700;
    font-size:26px;
    color:#8f5300;
    box-shadow:0 5px 0 rgba(156,93,8,.25), 0 8px 16px rgba(156,93,8,.14);
  }
  #starBank .star-ic{ width:30px; height:30px; flex:0 0 auto; filter:drop-shadow(0 2px 0 rgba(180,110,0,.35)); }
  #starBank.bump{ animation:starBump .5s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.2) rotate(-4deg); }
    100%{ transform:scale(1); }
  }

  /* Character Face Pills */
  #charRow{
    display:grid;
    grid-template-columns:repeat(6, minmax(64px, 1fr));
    gap:8px;
    max-width:660px;
    width:100%;
    justify-self:center;
  }
  .char-chip{
    min-width:64px;
    min-height:64px;
    height:64px;
    border-radius:20px;
    border:4px solid #fff;
    background:linear-gradient(180deg, #ffffff 0%, #fff4e8 100%);
    padding:3px;
    cursor:pointer;
    display:grid;
    place-items:center;
    position:relative;
    box-shadow:0 5px 0 rgba(120,66,46,.18), 0 8px 14px rgba(120,66,46,.1);
    transition:transform .16s cubic-bezier(.34,1.7,.5,1), background .15s, border-color .15s, box-shadow .15s;
  }
  .char-chip svg{
    width:50px;
    height:50px;
    display:block;
    overflow:visible;
    filter:drop-shadow(0 2px 2px rgba(43,35,66,.12));
  }
  .char-chip:active{ transform:translateY(3px) scale(.93); }
  .char-chip.sel{
    background:linear-gradient(180deg, #fff4a8 0%, #ffd24d 100%);
    border-color:#ff665c;
    transform:translateY(-2px) scale(1.04);
    box-shadow:0 6px 0 #c93b33, 0 0 0 3px #fff, 0 10px 20px rgba(255,102,92,.32);
  }
  .char-chip.sel::after{
    content:"\2605";
    position:absolute;
    top:-7px;
    right:-5px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#ff665c;
    color:#fff;
    font-size:13px;
    line-height:22px;
    text-align:center;
    border:2px solid #fff;
    box-shadow:0 2px 4px rgba(0,0,0,.18);
  }

  /* ================= MAIN STUDIO SPLIT ================= */
  #studioMain{
    position:relative;
    z-index:6;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:row;
    align-items:stretch;
    justify-content:center;
    gap:14px;
    padding:2px clamp(8px, 2.2vw, 28px) 2px;
  }

  /* LEFT/CENTER: GOLD-FRAMED ARCHED MIRROR + TOY BAR */
  #mirrorCol{
    flex:1.15 1 0;
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  #mirrorStage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:560px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-top:16px;
  }

  /* Ornate Crown Crest atop the Gold Mirror */
  #mirrorCrest{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:136px;
    height:42px;
    z-index:9;
    pointer-events:none;
    filter:drop-shadow(0 4px 5px rgba(118,65,5,.32));
  }

  /* The Arched Gold Frame */
  #mirrorFrame{
    position:relative;
    width:min(100%, 460px);
    height:100%;
    border-radius:230px 230px 36px 36px;
    padding:14px;
    background:
      linear-gradient(135deg, #fff6bd 0%, #f5be3b 24%, #c67c11 50%, #fbe07a 74%, #c78014 100%);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,.85),
      inset 0 -3px 6px rgba(120,66,4,.45),
      0 10px 0 #a3620b,
      0 18px 34px rgba(74,38,48,.24);
    display:flex;
    transition:box-shadow .4s ease;
  }
  #stage.parade #mirrorFrame{
    box-shadow:
      inset 0 2px 6px rgba(255,255,255,.95),
      0 10px 0 #a3620b,
      0 0 38px rgba(255,222,95,.85),
      0 18px 40px rgba(25,10,55,.5);
  }

  /* Vanity Fairy Bulbs along the arch */
  #mirrorBulbs{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:8;
  }
  .bulb{
    position:absolute;
    width:13px;
    height:13px;
    border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #ffffff 0%, #fff3a6 55%, #f5b935 100%);
    border:1.5px solid rgba(176,108,8,.55);
    box-shadow:0 0 10px rgba(255,232,128,.95), 0 0 3px #fff;
    transform:translate(-50%, -50%);
    transition:transform .25s ease;
  }
  #stage.parade .bulb{
    animation:bulbDisco .55s ease-in-out infinite alternate;
  }
  #stage.parade .bulb:nth-child(3n+1){ background:radial-gradient(circle, #fff 10%, #ff79b0 70%); box-shadow:0 0 14px #ff79b0; animation-delay:0s; }
  #stage.parade .bulb:nth-child(3n+2){ background:radial-gradient(circle, #fff 10%, #5ce8ff 70%); box-shadow:0 0 14px #5ce8ff; animation-delay:.18s; }
  #stage.parade .bulb:nth-child(3n+3){ background:radial-gradient(circle, #fff 10%, #ffe359 70%); box-shadow:0 0 14px #ffe359; animation-delay:.36s; }
  @keyframes bulbDisco{
    from{ transform:translate(-50%,-50%) scale(.9); opacity:.78; }
    to{ transform:translate(-50%,-50%) scale(1.28); opacity:1; }
  }

  /* Inner Mirror Glass */
  #mirrorGlass{
    position:relative;
    flex:1 1 auto;
    width:100%;
    height:100%;
    border-radius:216px 216px 24px 24px;
    border:4px solid #fff7d6;
    overflow:hidden;
    background:
      radial-gradient(ellipse 80% 55% at 50% 24%, #ffffff 0%, #fff7ea 45%, #f9e6f4 80%, #f1d9ee 100%);
    box-shadow:inset 0 6px 20px rgba(145,105,155,.16);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    transition:background .4s ease;
  }
  #mirrorGlass.truck-bg{
    background:
      radial-gradient(ellipse 85% 58% at 50% 22%, #ffffff 0%, #e7f8ff 46%, #d4f0ff 78%, #f8e9c8 100%);
  }
  #stage.parade #mirrorGlass{
    background:
      radial-gradient(circle at 50% 34%, #6a4bc2 0%, #3a2378 58%, #20124a 100%);
  }

  /* Subtle diagonal glass reflection streaks */
  #mirrorGlass::before{
    content:"";
    position:absolute;
    inset:-15%;
    pointer-events:none;
    z-index:2;
    background:
      linear-gradient(124deg, transparent 20%, rgba(255,255,255,.42) 25%, rgba(255,255,255,.06) 31%, transparent 34%,
      transparent 52%, rgba(255,255,255,.26) 55%, transparent 59%);
  }

  /* Mirror inner floor & Plush Star Rug */
  #mirrorFloor{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:26%;
    z-index:1;
    background:linear-gradient(180deg, #f8e0c2 0%, #ecc599 100%);
    border-top:3px solid rgba(255,255,255,.72);
    transition:background .4s ease;
  }
  #mirrorGlass.truck-bg #mirrorFloor{
    background:linear-gradient(180deg, #d7e2ec 0%, #b7c8d8 100%);
  }
  #stage.parade #mirrorFloor{
    background:linear-gradient(180deg, #4b318e 0%, #2a1859 100%);
    border-top-color:rgba(255,230,130,.5);
  }

  #starRug{
    position:absolute;
    left:50%;
    bottom:4%;
    transform:translateX(-50%);
    width:82%;
    max-width:340px;
    height:22%;
    min-height:42px;
    z-index:2;
    pointer-events:none;
  }

  /* Interactive Character Button standing on the rug */
  #figureBtn{
    position:relative;
    z-index:4;
    width:min(88%, 356px);
    height:90%;
    max-height:445px;
    margin-bottom:3.5%;
    border:none;
    background:transparent;
    padding:0;
    cursor:pointer;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    outline:none;
  }
  #figureBtn svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
    filter:drop-shadow(0 8px 12px rgba(45,28,62,.16));
    transform-origin:50% 90%;
    animation:idleBreath 3.2s ease-in-out infinite;
  }
  @keyframes idleBreath{
    0%,100%{ transform:scale(1, 1) translateY(0); }
    50%{ transform:scale(1.018, 0.988) translateY(-2px); }
  }
  #figureBtn.equip-pop svg{
    animation:equipPop .42s cubic-bezier(.34,1.8,.5,1);
  }
  @keyframes equipPop{
    0%{ transform:scale(.92, 1.07) translateY(3px); }
    45%{ transform:scale(1.08, .94) translateY(-10px); }
    100%{ transform:scale(1, 1) translateY(0); }
  }
  #figureBtn.giggle-hop svg{
    animation:giggleHop .65s cubic-bezier(.34,1.7,.5,1);
  }
  @keyframes giggleHop{
    0%{ transform:rotate(0deg) scale(1); }
    20%{ transform:rotate(-7deg) scale(1.07, .93) translateY(-8px); }
    45%{ transform:rotate(7deg) scale(.95, 1.06) translateY(-14px); }
    70%{ transform:rotate(-4deg) scale(1.04, .97) translateY(-5px); }
    100%{ transform:rotate(0deg) scale(1); }
  }
  #figureBtn.parade-dance svg{
    animation:paradeDance .56s ease-in-out infinite alternate;
  }
  @keyframes paradeDance{
    0%{ transform:translateY(0) rotate(-6deg) scale(1.02, .96); }
    50%{ transform:translateY(-18px) rotate(0deg) scale(1.06, 1.05); }
    100%{ transform:translateY(-2px) rotate(6deg) scale(1.02, .96); }
  }
  #figureBtn.truck-honk svg{
    animation:truckHonk .46s cubic-bezier(.34,1.8,.5,1);
  }
  @keyframes truckHonk{
    0%{ transform:scale(1,1) translateY(0); }
    30%{ transform:scale(1.08,.9) translateY(4px); }
    65%{ transform:scale(.96,1.08) translateY(-12px) rotate(-2deg); }
    100%{ transform:scale(1,1) translateY(0); }
  }

  /* Effects Layer inside Mirror */
  #fxLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:7;
    overflow:hidden;
  }
  .burst-sp{
    position:absolute;
    font-size:24px;
    pointer-events:none;
    animation:burstOut .78s cubic-bezier(.2,.8,.3,1) forwards;
    text-shadow:0 2px 6px rgba(255,255,255,.8);
  }
  @keyframes burstOut{
    0%{ transform:translate(-50%,-50%) scale(.4) rotate(0deg); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(var(--rot)); opacity:0; }
  }
  .confetti-p{
    position:absolute;
    top:-16px;
    border-radius:4px;
    pointer-events:none;
    animation:confFall var(--dur) linear forwards;
  }
  @keyframes confFall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    85%{ opacity:1; }
    100%{ transform:translate(var(--drift), 115vh) rotate(var(--spin)); opacity:0; }
  }

  /* ================= 3 TACTILE TOY BUTTONS ================= */
  #toyBar{
    flex:0 0 auto;
    width:min(100%, 460px);
    display:grid;
    grid-template-columns:1fr 1.35fr 1fr;
    gap:10px;
  }
  .act-btn{
    min-width:64px;
    min-height:66px;
    height:66px;
    border-radius:22px;
    border:4px solid #fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 10px;
    position:relative;
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), filter .15s;
  }
  .act-btn:active{ transform:translateY(4px) scale(.94); }
  .toy-ic{
    font-size:34px;
    line-height:1;
    display:block;
    filter:drop-shadow(0 2px 2px rgba(43,35,66,.2));
  }
  #shuffleBtn{
    background:linear-gradient(180deg, #3ee0d6 0%, #14b3aa 100%);
    box-shadow:0 6px 0 var(--teal-dark), 0 10px 18px rgba(13,139,133,.25);
  }
  #paradeBtn{
    background:linear-gradient(180deg, #ff8f6b 0%, #ff5850 55%, #ea3f3b 100%);
    box-shadow:0 6px 0 #a8201b, 0 0 0 3px rgba(255,216,77,.65), 0 10px 22px rgba(234,63,59,.32);
  }
  #paradeBtn .toy-ic{ font-size:38px; }
  #paradeBtn.active{

    content:"";

    top:0;
    left:8%;
    right:8%;
    height:34%;

    position:relative;

  .tile.on::after{
    content:"\2714";

    top:8px;
    right:8px;
    z-index:2;

    height:28px;

var AC = null;
function audio(){
  if(!AC){
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; }
  }
  if(AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol, delay){
  if(!soundOn) return;
  var ac = audio();
  if(!ac) return;
  var t = ac.currentTime + (delay || 0);
  var o = ac.createOscillator();
  var g = ac.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(f0, t);
  if(f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(ac.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}

/* ================= REAL STUDIO HOOT VOICE (HOOT_HAVE-GATED, ZERO TTS) ================= */
var VBASE = "assets/voice/";
var PRAISE_CLIPS = ["hoot-great-job.mp3", "hoot-super.mp3", "hoot-yay-2.mp3", "hoot-amazing.mp3"];
var voiceEl = new Audio();
voiceEl.preload = "auto";
var voiceQueue = [];
var voicePlaying = false;
var audioUnlocked = false;
var pendingBootClip = null;

function hubQuiet(){
  try{
    var d = window.parent && window.parent.document;
    if(!d || d === document) return false;
    var b = d.querySelector('.voice-btn[data-voice="off"]');
    return !!(b && (b.classList.contains("sel") || b.classList.contains("active") || b.getAttribute("aria-pressed") === "true"));
  }catch(e){ return false; }
}
/* Strict gate for NEW custom hoot-drs-* clips: ONLY true when listed in parent HOOT_HAVE */
function hasHootClip(id){
  var base = String(id || "").replace(/\.mp3$/i, "");
  try{
    if(window.parent && window.parent.HOOT_HAVE && window.parent.HOOT_HAVE[base]) return true;
  }catch(e){}
  return false;
}
/* Verified shipped clips (word-*, name-*, hoot-welcome, etc.) */
function hasExistingClip(file){
  var base = String(file || "").replace(/\.mp3$/i, "");
  try{
    var H = window.parent && window.parent.HOOT_HAVE;
    if(H && Object.keys(H).length && !/^(hoot-welcome|hoot-giggle|hoot-great-job|hoot-amazing|hoot-super|hoot-yay-2|hoot-nice-2|hoot-tap-big-btn|hoot-win-yay|name-color-|name-shape-)/.test(base)){
      return !!H[base];
    }
  }catch(e){}
  return true;
}
function resolveDressClip(customId, fallbackId){
  var chosen = (customId && hasHootClip(customId)) ? customId : fallbackId;
  if(!chosen) return null;
  return /\.mp3$/i.test(chosen) ? chosen : (chosen + ".mp3");
}

function unlockAudioOnce(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  audio();
  try{
    if(!voicePlaying){
      voiceEl.muted = true;
      var p = voiceEl.play();
      if(p && p.then){
        p.then(function(){
          voiceEl.pause();
          voiceEl.currentTime = 0;
          voiceEl.muted = false;
          if(pendingBootClip){
            var c = pendingBootClip;
            pendingBootClip = null;
            enqueueVoice(c, { interrupt:true });
          }
        }).catch(function(){ voiceEl.muted = false; });
      } else {
        voiceEl.muted = false;
      }
    }
  }catch(e){ voiceEl.muted = false; }
}
stageEl.addEventListener("pointerdown", unlockAudioOnce, { passive:true, capture:true });

function stopVoice(){
  voiceQueue.length = 0;
  voicePlaying = false;
  if(hootGuideBtn) hootGuideBtn.classList.remove("talking");
  if(voiceEl){
    voiceEl.__hwT = 0;
    voiceEl.__hwRetry = 1;
    voiceEl.__govNext = null;
    voiceEl.__govWait = false;
    try{ voiceEl.pause(); voiceEl.currentTime = 0; }catch(e){}
  }
  try{ if(window.__govStopAll) window.__govStopAll(); }catch(e){}
}
function vNext(){
  if(!voicePlaying){ pumpVoice(); return; }
  voicePlaying = false;
  if(hootGuideBtn) hootGuideBtn.classList.remove("talking");
  pumpVoice();
}
voiceEl.addEventListener("ended", function(){
  if(voiceEl.__hwT && Date.now() - voiceEl.__hwT < 350){
    if(!voiceEl.paused && !voiceEl.ended) return;
    if(!voiceEl.__hwRetry){
      voiceEl.__hwRetry = 1;
      try{ voiceEl.currentTime = 0; }catch(x){}
      var p = voiceEl.play();
      if(p && p.catch) p.catch(vNext);
      return;
    }
  }
  vNext();
});
voiceEl.addEventListener("error", vNext);

function pumpVoice(){
  if(dead || voicePlaying || !voiceQueue.length) return;
  if(!soundOn || hubQuiet()){ voiceQueue.length = 0; return; }
  var item = voiceQueue.shift();
  if(!item || !item.file){ pumpVoice(); return; }
  voicePlaying = true;
  if(hootGuideBtn) hootGuideBtn.classList.add("talking");
  voiceEl.muted = false;
  voiceEl.__hwT = Date.now();
  voiceEl.__hwRetry = 0;
  voiceEl.src = VBASE + item.file;
  var p;
  if(item.giggle) window.__bellyArmed = true;
  try{ p = voiceEl.play(); }
  finally{ if(item.giggle) setTimeout(function(){ window.__bellyArmed = false; }, 140); }
  if(p && p.catch){
    p.catch(function(){
      voicePlaying = false;
      if(hootGuideBtn) hootGuideBtn.classList.remove("talking");
      if(!audioUnlocked && !pendingBootClip && item.boot) pendingBootClip = item.file;
      pumpVoice();
    });
  }
}
function enqueueVoice(file, opts){
  if(dead || !file || !soundOn || hubQuiet()) return;
  if(!/\.mp3$/i.test(file)) file = file + ".mp3";
  if(opts && opts.interrupt) stopVoice();
  voiceQueue.push({ file:file, giggle:!!(opts && opts.giggle), boot:!!(opts && opts.boot) });
  pumpVoice();
}
function playDressGuide(customId, fallbackId, isBoot){
  var clip = resolveDressClip(customId, fallbackId);
  if(!clip || dead || !soundOn || hubQuiet()) return;
  if(isBoot){
    try{
      if(window.parent && window.parent !== window && typeof window.parent.__hwPlayAfterIntro === "function"){
        if(window.parent.__hwPlayAfterIntro(VBASE + clip)) return;
      }
    }catch(e){}
  }
  enqueueVoice(clip, { interrupt:true, boot:!!isBoot });
}
function dressedCount(){
  if(isTruck()) return 3;
  var n = 0;
  Object.keys(equipped).forEach(function(k){ if(equipped[k]) n++; });
  return n;
}
function speakCurrentGuide(isBoot){
  if(!isBoot && dressedCount() >= (IS_RILEY ? 2 : 3)){
    playDressGuide("hoot-drs-parade", "hoot-amazing", false);
  } else {
    playDressGuide("hoot-drs-welcome", "hoot-welcome", !!isBoot);
  }
}
function hootBtnCheer(){

  hootGuideBtn.classList.remove("cheer");
  void hootGuideBtn.offsetWidth;
  hootGuideBtn.classList.add("cheer");
}

function clearIdleHints(){

function armIdle(isBoot){
  clearIdleHints();
  if(dead || paradeActive) return;
  var vDelay = isBoot ? (IS_RILEY ? 2200 : 3400) : (IS_RILEY ? 2800 : 4500);
  idleVisualTimer = setTimeout(function(){
    if(dead || paradeActive) return;
    var firstOff = tilesEl.querySelector(".tile:not(.on)") || tilesEl.querySelector(".tile");
    if(firstOff) firstOff.classList.add("hint-glow");
  }, vDelay);
  if(!idleVoiceReminded){
    idleVoiceTimer = setTimeout(function(){
      if(dead || paradeActive) return;
      idleVoiceReminded = true;
      playDressGuide("hoot-drs-idle", "hoot-tap-big-btn", false);
    }, 9500);
  }
}
function noteInteraction(){

}

  var hasHat = !!equipped.hat;
  if(character === "hoot")      inner = hootFigure();
  else if(character === "milo") inner = boyFigure("#ffdfc4", "#6b3a14", "#57cc62", "#3b5bdb");
  else if(character === "lily") inner = girlFigure();
  else if(character === "rose") inner = princessFigure("#ffe3c2", "#f2c230", "#ff8fab", "#e56b8c", "#ffc93c", "#e8a90c", hasHat);
  else                          inner = princessFigure("#8a5a33", "#2b2118", "#8b6fd8", "#6c4bd8", "#dbe7f2", "#9fb2c8", hasHat);

  var slots = { hat:"", outfit:"", face:"", shoes:"", treasure:"" };
  Object.keys(equipped).forEach(function(k){
    var it = itemById(equipped[k]);
    if(it) slots[it.slot] = it.svg;
  });
  inner = inner
    .replace('<g data-slot="shoes"></g>', slots.shoes)
    .replace('<g data-slot="outfit"></g>', slots.outfit)
    .replace('<g data-slot="face"></g>', slots.face)
    .replace('<g data-slot="treasure"></g>', slots.treasure)
    .replace('<g data-slot="hat"></g>', slots.hat);
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" aria-hidden="true">'+inner+'</svg>';
}

/* ================= VISUAL EFFECTS ================= */
function pulseFigure(cls, ms){
  figureBtn.classList.remove("equip-pop", "giggle-hop", "truck-honk");
  void figureBtn.offsetWidth;
  figureBtn.classList.add(cls);
  setTimeout(function(){ figureBtn.classList.remove(cls); }, ms || 460);
}

function sparkleBurst(count, colors){
  var n = count || 10;
  var palette = colors || ["#ffc93c", "#ff6b93", "#38d2c6", "#fff176", "#a78bfa"];
  var glyphs = ["\u2726", "\u2605", "\u2728"];
  for(var i = 0; i < n; i++){
    var s = document.createElement("span");
    s.className = "burst-sp";
    s.textContent = glyphs[i % glyphs.length];
    s.style.color = palette[i % palette.length];
    s.style.left = (28 + Math.random() * 44) + "%";
    s.style.top  = (22 + Math.random() * 48) + "%";
    s.style.setProperty("--dx", ((Math.random() * 160) - 80) + "px");
    s.style.setProperty("--dy", (-30 - Math.random() * 90) + "px");
    s.style.setProperty("--rot", ((Math.random() * 140) - 70) + "deg");
    fxLayer.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); }, 820); })(s);
  }
}

function launchConfetti(count){
  var colors = ["#ff665c", "#ffc93c", "#4cc75c", "#38b6ff", "#ff8fab", "#a78bfa"];
  var n = count || 34;
  for(var i = 0; i < n; i++){
    var p = document.createElement("span");
    p.className = "confetti-p";
    var w = 8 + Math.random() * 8;
    var h = 10 + Math.random() * 10;
    p.style.width = w + "px";
    p.style.height = h + "px";
    p.style.left = (4 + Math.random() * 92) + "vw";
    p.style.background = colors[i % colors.length];
    p.style.setProperty("--drift", ((Math.random() * 140) - 70) + "px");
    p.style.setProperty("--spin", ((Math.random() * 720) - 360) + "deg");
    p.style.setProperty("--dur", (1.6 + Math.random() * 1.4) + "s");
    p.style.animationDelay = (Math.random() * 0.45) + "s";
    confettiEl.appendChild(p);
    (function(el){ setTimeout(function(){ el.remove(); }, 3400); })(p);
  }
}

function addStar(){
  stars++;
  starCountEl.textContent = String(stars);
  starBank.classList.remove("bump");
  void starBank.offsetWidth;
  starBank.classList.add("bump");
  starSound();
}

/* ================= RENDERING ================= */
function renderFigure(){
  figureBtn.innerHTML = figureSVG();
  mirrorGlass.classList.toggle("truck-bg", isTruck());
}

function renderChars(){
  charRow.innerHTML = "";
  CHARACTERS.forEach(function(c){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "char-chip" + (c.id === character ? " sel" : "");
    b.setAttribute("aria-label", c.name);
    b.setAttribute("aria-pressed", c.id === character ? "true" : "false");
    b.innerHTML = '<svg viewBox="0 0 60 60" aria-hidden="true">' + charFaceSVG(c.id) + '</svg>';
    b.addEventListener("click", function(){
      unlockAudioOnce();
      audio();
      if(paradeActive) endParade();
      character = c.id;
      var list = activeCats();
      var valid = list.some(function(x){ return x.id === category; });
      if(!valid) category = list[0].id;
      if(isTruck()) honkSound();
      else popSound();
      renderAll();
      pulseFigure(isTruck() ? "truck-honk" : "equip-pop", 420);
      sparkleBurst(7);
      noteInteraction();
    });
    charRow.appendChild(b);
  });
}

function renderCats(){
  catRow.innerHTML = "";
  activeCats().forEach(function(c){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "cat-btn" + (c.id === category ? " sel" : "") + (!isTruck() && catHasEquipped(c) ? " has-item" : "");
    b.setAttribute("aria-label", c.label);
    b.setAttribute("aria-pressed", c.id === category ? "true" : "false");
    b.innerHTML = '<span class="cat-ic" aria-hidden="true">' + c.icon + '</span>';
    b.addEventListener("click", function(){
      unlockAudioOnce();
      audio();
      category = c.id;
      popSound();
      renderCats();
      renderTiles();
      if(c.clip && hasExistingClip(c.clip)) enqueueVoice(c.clip, { interrupt:true });
      noteInteraction();
    });
    catRow.appendChild(b);
  });
}

function renderTiles(){
  tilesEl.innerHTML = "";
  var list = activePool().filter(function(it){ return it.cat === category; });
  list.forEach(function(it){
    var on = isEquipped(it);
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tile" + (on ? " on" : "");
    b.setAttribute("aria-label", it.name);
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.innerHTML = '<svg viewBox="0 0 60 48" aria-hidden="true">' + it.tile + '</svg>';

    /* Support BOTH instant single-tap AND toddler drag-and-drop onto the mirror! */
    b.addEventListener("pointerdown", function(e){
      if(dead) return;
      unlockAudioOnce();
      audio();
      dragState = {
        item: it,
        el: b,
        pid: e.pointerId,
        sx: e.clientX,
        sy: e.clientY,
        moved: false
      };
      try{ b.setPointerCapture(e.pointerId); }catch(err){}
    });
    b.addEventListener("pointermove", function(e){
      if(!dragState || dragState.el !== b) return;
      var dist = Math.hypot(e.clientX - dragState.sx, e.clientY - dragState.sy);
      if(!dragState.moved && dist > 14){
        dragState.moved = true;
        dragGhost.innerHTML = '<svg viewBox="0 0 60 48" aria-hidden="true">' + it.tile + '</svg>';
        dragGhost.hidden = false;
        popSound();
      }
      if(dragState.moved){
        dragGhost.style.left = e.clientX + "px";
        dragGhost.style.top = e.clientY + "px";
        var mr = mirrorFrame.getBoundingClientRect();
        var over = e.clientX >= mr.left - 24 && e.clientX <= mr.right + 24 && e.clientY >= mr.top - 24 && e.clientY <= mr.bottom + 24;
        mirrorFrame.classList.toggle("drop-hot", over);
      }
    });
    function finishDrag(e){
      if(!dragState || dragState.el !== b) return;
      var ds = dragState;
      dragState = null;
      dragGhost.hidden = true;
      mirrorFrame.classList.remove("drop-hot");
      try{ b.releasePointerCapture(ds.pid); }catch(err){}
      if(ds.moved){
        suppressNextClick = Date.now();
        var mr = mirrorFrame.getBoundingClientRect();
        var over = e.clientX >= mr.left - 36 && e.clientX <= mr.right + 36 && e.clientY >= mr.top - 36 && e.clientY <= mr.bottom + 36;
        if(over) onItemTap(ds.item, true);
      }
    }
    b.addEventListener("pointerup", finishDrag);
    b.addEventListener("pointercancel", function(){
      if(!dragState || dragState.el !== b) return;
      dragState = null;
      dragGhost.hidden = true;
      mirrorFrame.classList.remove("drop-hot");
    });
    b.addEventListener("click", function(){
      if(Date.now() - suppressNextClick < 320) return;
      onItemTap(it, false);
    });
    tilesEl.appendChild(b);
  });
}

function renderAll(){
  renderChars();
  renderCats();
  renderTiles();
  renderFigure();
  updateParadeReadyCue();
}

/* ================= INTERACTIONS ================= */
function onItemTap(it, forceEquip){
  unlockAudioOnce();
  audio();
  if(isTruck()){
    if(it.paint){ truckState.paint = it.paint; truckState.paintId = it.id; }
    if(it.tire){  truckState.tire  = it.tire;  truckState.tireId  = it.id; }
    if(it.sign){  truckState.sign  = it.sign;  truckState.signId  = it.id; }
    honkSound();
    renderFigure();
    renderTiles();
    pulseFigure("truck-honk", 440);
    sparkleBurst(10);
    if(it.clip && hasExistingClip(it.clip)) enqueueVoice(it.clip, { interrupt:true });
    noteInteraction();
    return;
  }

  /* Non-truck friends: tap to equip, tap again to toggle off (drag onto mirror always equips!) */
  if(!forceEquip && equipped[it.slot] === it.id){
    equipped[it.slot] = null;
    unequipSound();
    renderFigure();
    renderCats();
    renderTiles();
    updateParadeReadyCue();
    pulseFigure("equip-pop", 340);
    noteInteraction();
    return;
  }

  equipped[it.slot] = it.id;
  equipCount++;
  equipSound();
  renderFigure();
  renderCats();
  renderTiles();
  updateParadeReadyCue();
  pulseFigure("equip-pop", 420);
  sparkleBurst(11);
  if(it.clip && hasExistingClip(it.clip)){
    enqueueVoice(it.clip, { interrupt:true });
    if(equipCount % 2 === 0){
      var pr = PRAISE_CLIPS[(praiseIdx++) % PRAISE_CLIPS.length];
      enqueueVoice(pr, { interrupt:false });
    }
  }
  noteInteraction();
}

/* Tap character directly on stage (giggle ONLY for Hoot with transient __bellyArmed) */
figureBtn.addEventListener("click", function(){
  unlockAudioOnce();
  audio();
  noteInteraction();
  if(isTruck()){
    honkSound();
    pulseFigure("truck-honk", 460);
    sparkleBurst(8, ["#ffc93c", "#ff5a4e", "#3aa7e0"]);
    return;
  }
  if(character === "hoot"){
    var now = Date.now();
    pulseFigure("giggle-hop", 650);
    sparkleBurst(10, ["#ffc93c", "#ff8fab", "#fff176"]);
    if(now - lastGiggleAt > 1200){
      lastGiggleAt = now;
      enqueueVoice("hoot-giggle.mp3", { interrupt:true, giggle:true });
      if(dressedCount() === 0){
        enqueueVoice(resolveDressClip("hoot-drs-idle", "hoot-tap-big-btn"), { interrupt:false });
      }
    } else {
      equipSound();
    }
    return;
  }
  equipSound();
  pulseFigure("giggle-hop", 550);
  sparkleBurst(9);
});

/* Tap Hoot Guide button in HUD -> repeats spoken Hoot guidance anytime! */
hootGuideBtn.addEventListener("click", function(){
  unlockAudioOnce();
  audio();
  hootBtnCheer();
  popSound();
  noteInteraction();
  speakCurrentGuide(false);
});

/* 1. Surprise Shuffle */
shuffleBtn.addEventListener("click", function(){
  unlockAudioOnce();
  audio();
  if(paradeActive) endParade();
  if(isTruck()){
    var paints = TRUCK_ITEMS.filter(function(i){ return !!i.paint; });
    var tires  = TRUCK_ITEMS.filter(function(i){ return !!i.tire; });
    var signs  = TRUCK_ITEMS.filter(function(i){ return !!i.sign; });
    var p = paints[Math.floor(Math.random() * paints.length)];
    var t = tires[Math.floor(Math.random() * tires.length)];
    var s = signs[Math.floor(Math.random() * signs.length)];
    if(p.id === truckState.paintId) p = paints[(paints.indexOf(p) + 1) % paints.length];
    truckState.paint = p.paint; truckState.paintId = p.id;
    truckState.tire  = t.tire;  truckState.tireId  = t.id;
    truckState.sign  = s.sign;  truckState.signId  = s.id;
    honkSound();
  } else {
    var slots = ["hat", "outfit", "face", "shoes", "treasure"];
    slots.forEach(function(slot){
      var pool = ITEMS.filter(function(i){ return i.slot === slot; });
      equipped[slot] = pool[Math.floor(Math.random() * pool.length)].id;
    });
    shuffleSound();
  }
  renderFigure();
  renderCats();
  renderTiles();
  updateParadeReadyCue();
  pulseFigure(isTruck() ? "truck-honk" : "equip-pop", 460);
  sparkleBurst(16);
  launchConfetti(22);
  playDressGuide("hoot-drs-shuffle", "hoot-yay-2", false);
  noteInteraction();
});

/* 2. Spotlight Parade */
function endParade(){
  if(paradeTimer){ clearTimeout(paradeTimer); paradeTimer = null; }
  paradeActive = false;
  stageEl.classList.remove("parade");
  paradeBtn.classList.remove("active");
  figureBtn.classList.remove("parade-dance");
  updateParadeReadyCue();
  armIdle(false);
}

paradeBtn.addEventListener("click", function(){
  if(paradeActive) return;
  unlockAudioOnce();
  audio();
  clearIdleHints();
  idleVoiceReminded = false;
  paradeActive = true;
  stageEl.classList.add("parade");
  paradeBtn.classList.add("active");
  paradeBtn.classList.remove("hint-ready");
  figureBtn.classList.remove("equip-pop", "giggle-hop", "truck-honk");
  figureBtn.classList.add("parade-dance");

  fanfareSound();
  if(isTruck()) setTimeout(honkSound, 260);

  playDressGuide("hoot-drs-parade", "hoot-amazing", false);

  sparkleBurst(20);
  launchConfetti(42);
  addStar();

  paradeTimer = setTimeout(function(){
    sparkleBurst(14);
    endParade();
  }, 3000);
});

/* 3. Reset */
resetBtn.addEventListener("click", function(){
  unlockAudioOnce();
  audio();
  if(paradeActive) endParade();
  if(isTruck()){
    truckState = { paint:"#ff5a4e", tire:"classic", sign:"star", paintId:"paint-red", tireId:"tire-classic", signId:"sign-star" };
  } else {
    equipped = { hat:null, outfit:null, face:null, shoes:null, treasure:null };
  }
  sweepSound();
  stopVoice();
  renderFigure();
  renderCats();
  renderTiles();
  updateParadeReadyCue();
  pulseFigure("equip-pop", 360);
  noteInteraction();
});

/* Sound Toggle */
soundBtn.addEventListener("click", function(){
  soundOn = !soundOn;
  soundOnIc.style.display  = soundOn ? "" : "none";
  soundOffIc.style.display = soundOn ? "none" : "";
  soundBtn.setAttribute("aria-label", soundOn ? "Sound on" : "Sound off");
  if(!soundOn){
    stopVoice();
  } else {
    unlockAudioOnce();
    audio();
    popSound();
    speakCurrentGuide(false);
  }
});

/* Teardown cleanly */
function teardown(){
  dead = true;
  clearIdleHints();
  if(paradeTimer){ clearTimeout(paradeTimer); paradeTimer = null; }
  stopVoice();
}
window.addEventListener("pagehide", teardown);
document.addEventListener("visibilitychange", function(){
  if(document.hidden) stopVoice();
});

/* Initial instant live render (zero start screen) + spoken Hoot boot guide */
renderAll();
speakCurrentGuide(true);
armIdle(true);

/* Verification handle */
window.__dressGame = {
  snapshot: function(){
    return {
      character: character,
      category: category,
      equipped: isTruck()
        ? { paint: truckState.paintId, tire: truckState.tireId, sign: truckState.signId }
        : Object.assign({}, equipped),
      stars: stars,
      paradeActive: paradeActive
    };
  }
};
})();
</script>
