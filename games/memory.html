<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>
window.__HOOT_GAME_KEY__="memory";
window.__HOOT_SELF_COACH__=true;
</script>
<script src="js/hoot-game-head.js?v=llprev3e139"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Memory Match Meadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1b3526;
    --cream:#fffdf6;
    --sun:#ffc93c;
    --coral:#ff6b5e;
    --leaf:#4bc85b;
    --clover:#2b994a;
    --wood:#b57234;
    --wood-dark:#764316;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; width:100%; margin:0; padding:0; overflow:hidden; }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#84db73;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ================= SUNLIT CLOVER MEADOW STAGE ================= */
  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(circle at 82% 8%, rgba(255,244,178,.85) 0%, rgba(255,244,178,0) 34%),
      linear-gradient(180deg, #87dbff 0%, #c8f1ff 16%, #99e57c 18%, #6fd15c 52%, #4cb848 100%);
  }

  /* Soft decorative meadow hills & clover tufts */
  #meadowBg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:1;
  }

  /* Fluttering butterflies & blooming daisies */
  .meadow-prop{
    position:absolute;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    z-index:3;
  }
  .bfly{
    width:46px; height:38px;
    animation:bflyDrift 7.5s ease-in-out infinite alternate;
  }
  .bfly svg{ width:100%; height:100%; display:block; overflow:visible; }
  .bfly .bw{ transform-box:fill-box; animation:wingBeat .22s ease-in-out infinite alternate; }
  .bfly .bw-l{ transform-origin:100% 50%; }
  .bfly .bw-r{ transform-origin:0% 50%; }
  @keyframes wingBeat{ from{transform:rotate(14deg)} to{transform:rotate(-20deg)} }
  @keyframes bflyDrift{
    0%{ transform:translate(0,0) rotate(-4deg); }
    50%{ transform:translate(24px,-18px) rotate(6deg); }
    100%{ transform:translate(-16px,-6px) rotate(-3deg); }
  }
  .bfly.spin{ animation:bflySpin .65s ease-in-out 1; }
  @keyframes bflySpin{ from{transform:rotate(0) scale(1)} 50%{transform:rotate(180deg) scale(1.28)} to{transform:rotate(360deg) scale(1)} }

  .daisy{
    width:46px; height:58px;
    bottom:6px;
    transform-origin:50% 100%;
    animation:sway 3.6s ease-in-out infinite alternate;
  }
  .daisy svg{ width:100%; height:100%; display:block; overflow:visible; }
  @keyframes sway{ from{transform:rotate(-4deg)} to{transform:rotate(4deg)} }
  .daisy.bloom svg{ animation:bloomPop .5s cubic-bezier(.34,1.8,.5,1); }
  @keyframes bloomPop{ 0%{transform:scale(1)} 45%{transform:scale(1.42) rotate(-8deg)} 100%{transform:scale(1)} }

  /* ================= TOP HUD (>=64px PICTURE CONTROLS) ================= */
  #hud{
    position:relative;
    z-index:12;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left));
    flex:0 0 auto;
  }
  .hud-group{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .hud-pill{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 15px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,246,.96);
    color:var(--ink);
    font-family:"Fredoka",sans-serif;
    font-weight:700;
    font-size:24px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(25,74,39,.22), 0 10px 18px rgba(25,74,39,.14);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .15s;
  }
  .hud-pill:active{ transform:translateY(3px) scale(.94); }
  .hud-pill.round{ width:64px; padding:0; border-radius:50%; font-size:27px; }
  .hud-pill.size-btn.active{
    background:linear-gradient(180deg,#ffe473,#ffc93c);
    box-shadow:0 5px 0 #c98600, 0 0 0 3.5px var(--ink);
  }
  #hintBtn{
    background:linear-gradient(180deg,#fff3a6,#ffd140);
    box-shadow:0 5px 0 #c98600;
  }
  #starBank{
    min-height:64px;
    padding:0 16px 0 12px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,246,.96);
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:25px;
    font-weight:700;
    box-shadow:0 5px 0 rgba(25,74,39,.22);
  }
  #starBank svg{ width:28px; height:28px; display:block; }
  #starBank.bump{ animation:starBump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{ 0%{transform:scale(1)} 45%{transform:scale(1.2) rotate(-4deg)} 100%{transform:scale(1)} }

  /* ================= MAIN MEADOW WORKSPACE ================= */
  #meadowMain{
    position:relative;
    z-index:6;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:4px 12px max(10px, env(safe-area-inset-bottom));
    gap:10px;
  }

  /* Compact Progress Flower Strip */
  #pairTray{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,253,246,.94);
    border:4px solid #fff;
    border-radius:999px;
    padding:6px 14px;
    box-shadow:0 5px 0 rgba(25,74,39,.18);
    flex:0 0 auto;
  }
  .pair-bud{
    width:28px;
    height:28px;
    border-radius:50%;
    background:#dcefd8;
    border:2.5px solid #fff;
    display:grid;
    place-items:center;
    font-size:18px;
    color:transparent;
    transition:transform .3s cubic-bezier(.34,1.7,.5,1), background .25s;
  }
  .pair-bud.lit{
    background:linear-gradient(180deg,#ffe578,#ffb703);
    color:var(--ink);
    transform:scale(1.18);
    box-shadow:0 3px 0 #c98600;
  }

  /* Wooden Garden Quilt Card Board */
  #boardWrap{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #boardFrame{
    position:relative;
    padding:12px;
    border-radius:30px;
    background:linear-gradient(145deg, rgba(255,253,246,.34), rgba(255,253,246,.16));
    border:4px solid rgba(255,255,255,.55);
    box-shadow:0 12px 28px rgba(18,74,35,.22), inset 0 2px 6px rgba(255,255,255,.4);
    width:min(94vw, 720px);
    height:min(100%, 560px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #grid{
    display:grid;
    gap:12px;
    width:100%;
    height:100%;
  }
  #grid.g-4{ grid-template-columns:repeat(2, 1fr); grid-template-rows:repeat(2, 1fr); max-width:440px; max-height:440px; }
  #grid.g-6{ grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(2, 1fr); max-width:600px; max-height:430px; }
  #grid.g-12{ grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(3, 1fr); max-width:680px; max-height:520px; }

  /* 3D Glossy Clover-Leaf Flip Cards */
  .card{
    position:relative;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    perspective:800px;
    width:100%;
    height:100%;
    min-width:68px;
    min-height:68px;
  }
  .card .inner{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    transition:transform .44s cubic-bezier(.34,1.35,.5,1);
    display:block;
  }
  .card.up .inner{ transform:rotateY(180deg); }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  /* Embossed Clover-Leaf Back */
  .face.back{
    background:
      radial-gradient(circle at 28% 22%, rgba(255,255,255,.32) 0%, rgba(255,255,255,0) 48%),
      linear-gradient(155deg, #52cf67 0%, #2a9b4c 68%, #1e7c3c 100%);
    border:5px solid #fff;
    box-shadow:0 7px 0 #186430, 0 12px 20px rgba(15,62,30,.28), inset 0 0 0 3px rgba(255,255,255,.22);
  }
  .face.back svg{
    width:58%;
    height:58%;
    max-width:86px;
    max-height:86px;
    filter:drop-shadow(0 4px 5px rgba(14,66,30,.28));
  }
  .card:not(.up):active .face.back{ transform:translateY(3px) scale(.96); }

  /* Sunlit Storybook Animal Front */
  .face.front{
    transform:rotateY(180deg);
    background:radial-gradient(circle at 50% 35%, #ffffff 0%, #fff9e6 100%);
    border:5px solid #ffd166;
    box-shadow:0 7px 0 #d4961a, 0 12px 22px rgba(20,54,30,.2);
  }
  .face.front .medallion{
    width:82%;
    height:82%;
    border-radius:50%;
    display:grid;
    place-items:center;
    box-shadow:inset 0 -5px 10px rgba(0,0,0,.07);
  }
  .face.front .an-emo{
    font-size:clamp(42px, 8.5vw, 76px);
    line-height:1;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.14));
  }
  #grid.g-12 .face.front .an-emo{ font-size:clamp(34px, 6.2vw, 58px); }

  .card.matched{ cursor:default; }
  .card.matched .face.front{
    border-color:#ffbe0b;
    background:linear-gradient(180deg,#fffbe3,#fff0ad);
    box-shadow:0 0 0 4px rgba(255,201,60,.65), 0 7px 0 #c98600, 0 0 26px rgba(255,201,60,.65);
  }
  .card.matched .an-emo{ animation:matchBounce .55s cubic-bezier(.34,1.7,.5,1) 2; }
  @keyframes matchBounce{ 0%,100%{transform:scale(1)} 45%{transform:scale(1.24) rotate(-6deg)} }

  .card.wiggle .inner{ animation:wrongWiggle .44s ease-in-out 2; }
  @keyframes wrongWiggle{ 0%,100%{transform:rotateY(180deg) rotate(0)} 30%{transform:rotateY(180deg) rotate(-5deg)} 70%{transform:rotateY(180deg) rotate(5deg)} }

  .card.hint-glow .face.back{
    animation:hintGlow .55s ease-in-out 3;
  }
  @keyframes hintGlow{
    0%,100%{ box-shadow:0 7px 0 #186430, 0 0 0 0 rgba(255,224,102,0); }
    50%{ box-shadow:0 7px 0 #c98600, 0 0 0 7px rgba(255,224,102,.95), 0 0 28px rgba(255,224,102,.95); }
  }

  /* Golden Firefly Sparkle Arc on Match */
  #arcSvg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:10;
    pointer-events:none;
    overflow:visible;
  }
  #arcSvg path{
    fill:none;
    stroke:#ffe066;
    stroke-width:6;
    stroke-linecap:round;
    stroke-dasharray:3 14;
    filter:drop-shadow(0 0 8px rgba(255,201,60,1));
    animation:arcFlow .45s linear infinite;
  }
  @keyframes arcFlow{ to{ stroke-dashoffset:-17; } }

  /* Flower-Crown Hoot Meadow Buddy */
  #hootMeadow{
    position:absolute;
    left:clamp(8px, 2vw, 24px);
    bottom:max(6px, env(safe-area-inset-bottom));
    z-index:9;
    width:clamp(84px, 12vw, 134px);
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    filter:drop-shadow(0 10px 12px rgba(15,62,30,.28));
    animation:hootSway 3.4s ease-in-out infinite;
    transform-origin:50% 90%;
  }
  @keyframes hootSway{ 0%,100%{transform:translateY(0) rotate(-1.5deg)} 50%{transform:translateY(-6px) rotate(1.5deg)} }
  #hootMeadow.celebrate{ animation:hootHop .5s cubic-bezier(.34,1.65,.5,1) 3; }
  @keyframes hootHop{ 0%,100%{transform:translateY(0)} 45%{transform:translateY(-22px) rotate(-5deg)} }
  #hootMeadow.talking{ animation:hootTalk .2s ease-in-out infinite alternate; }
  @keyframes hootTalk{ from{transform:translateY(0)} to{transform:translateY(-4px)} }
  #hootMeadow svg{ width:100%; height:auto; display:block; overflow:visible; }

  /* ================= WIN CELEBRATION OVERLAY ================= */
  #winOverlay{
    position:absolute;
    inset:0;
    z-index:25;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(18,54,32,.44);
    padding:16px;
  }
  #winOverlay[hidden]{ display:none; }
  #winCard{
    background:var(--cream);
    border:6px solid #fff;
    border-radius:36px;
    box-shadow:0 14px 0 rgba(18,74,35,.25), 0 28px 54px rgba(12,48,24,.4);
    padding:22px 26px 20px;
    text-align:center;
    width:min(90vw, 400px);
    animation:winPop .45s cubic-bezier(.34,1.6,.5,1);
  }
  @keyframes winPop{ from{transform:scale(.6) translateY(28px); opacity:0} to{transform:scale(1) translateY(0); opacity:1} }
  #winStars{ font-size:40px; letter-spacing:6px; color:#d2ebd0; }
  #winStars .lit{ color:var(--sun); text-shadow:0 3px 0 #d99400; }
  #winRow{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:14px 0 20px;
  }
  .win-chip{
    width:54px;
    height:54px;
    border-radius:50%;
    background:#fff6d1;
    border:3.5px solid #ffc93c;
    display:grid;
    place-items:center;
    font-size:32px;
    box-shadow:0 4px 0 #d99400;
  }
  .win-btns{
    display:flex;
    justify-content:center;
    gap:12px;
  }
  .win-act{
    min-width:118px;
    min-height:72px;
    padding:0 24px;
    border-radius:999px;
    border:4px solid #fff;
    font-family:"Fredoka",sans-serif;
    font-size:30px;
    font-weight:700;
    cursor:pointer;
    color:#fff;
  }
  #againBtn{ background:linear-gradient(180deg,#6ce078,#3db84d); box-shadow:0 7px 0 #238030; }
  #levelUpBtn{ background:linear-gradient(180deg,#ffd447,#f59e0b); color:var(--ink); box-shadow:0 7px 0 #b45309; }
  .win-act:active{ transform:translateY(3px) scale(.95); }

  .confetti{ position:absolute; z-index:28; width:12px; height:16px; border-radius:3px; pointer-events:none; }

  /* ================= RESPONSIVE PORTRAIT & LANDSCAPE ================= */
  @media (orientation:landscape) and (min-width:740px){
    #meadowMain{
      flex-direction:row;
      align-items:center;
      justify-content:center;
      padding:6px 24px 16px clamp(136px, 16vw, 180px);
    }
    #pairTray{
      flex-direction:column;
      padding:12px 8px;
    }
    #boardWrap{
      height:100%;
    }
    #boardFrame{
      width:min(72vw, 720px);
      height:min(76vh, 560px);
    }
  }

  @media (max-width:560px){
    .hud-pill{ min-width:54px; min-height:54px; height:54px; padding:0 10px; font-size:19px; }
    .hud-pill.round{ width:54px; font-size:22px; }
    #starBank{ min-height:54px; padding:0 12px 0 9px; font-size:20px; }
    #boardFrame{ padding:8px; border-radius:22px; width:100%; height:min(100%, 440px); }
    #grid{ gap:8px; }
    #grid.g-6{ grid-template-columns:repeat(2, 1fr); grid-template-rows:repeat(3, 1fr); max-width:320px; }
    #grid.g-12{ grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(4, 1fr); max-width:360px; }
    .face{ border-radius:18px; border-width:4px !important; }
    #hootMeadow{ width:76px; left:6px; bottom:4px; }
    #meadowMain{ padding-bottom:68px; }
  }
</style>
</head>
<body>
<div id="stage">
  <!-- Rolling Clover Meadow SVG -->
  <svg id="meadowBg" viewBox="0 0 1200 760" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 148 Q260 92 580 142 T1200 132 L1200 220 L0 220 Z" fill="#8be068"/>
    <path d="M0 164 Q360 124 720 158 T1200 148 L1200 760 L0 760 Z" fill="#68ce58" opacity=".45"/>
    <ellipse cx="180" cy="480" rx="160" ry="60" fill="#82de6c" opacity=".35"/>
    <ellipse cx="980" cy="540" rx="180" ry="70" fill="#82de6c" opacity=".35"/>
  </svg>

  <!-- Living Meadow Butterflies & Daisies -->
  <button class="meadow-prop bfly" type="button" style="left:8%;top:18%" aria-label="Pink Butterfly">
    <svg viewBox="0 0 46 38" aria-hidden="true"><g class="bw bw-l"><ellipse cx="12" cy="13" rx="10" ry="8" fill="#ff85a8" stroke="#8a2046" stroke-width="2"/><ellipse cx="13" cy="26" rx="8" ry="6" fill="#ffb3c8" stroke="#8a2046" stroke-width="2"/></g><g class="bw bw-r"><ellipse cx="34" cy="13" rx="10" ry="8" fill="#ff85a8" stroke="#8a2046" stroke-width="2"/><ellipse cx="33" cy="26" rx="8" ry="6" fill="#ffb3c8" stroke="#8a2046" stroke-width="2"/></g><ellipse cx="23" cy="20" rx="3" ry="9" fill="#1b3526"/></svg>
  </button>
  <button class="meadow-prop bfly" type="button" style="right:7%;top:22%;animation-delay:-3.2s" aria-label="Blue Butterfly">
    <svg viewBox="0 0 46 38" aria-hidden="true"><g class="bw bw-l"><ellipse cx="12" cy="13" rx="10" ry="8" fill="#6ccdff" stroke="#185d87" stroke-width="2"/><ellipse cx="13" cy="26" rx="8" ry="6" fill="#aee7ff" stroke="#185d87" stroke-width="2"/></g><g class="bw bw-r"><ellipse cx="34" cy="13" rx="10" ry="8" fill="#6ccdff" stroke="#185d87" stroke-width="2"/><ellipse cx="33" cy="26" rx="8" ry="6" fill="#aee7ff" stroke="#185d87" stroke-width="2"/></g><ellipse cx="23" cy="20" rx="3" ry="9" fill="#1b3526"/></svg>
  </button>
  <button class="meadow-prop daisy" type="button" style="right:3%" aria-label="Meadow Daisy">
    <svg viewBox="0 0 48 62" aria-hidden="true"><path d="M24 62 Q22 44 24 28" stroke="#258038" stroke-width="4.5" fill="none" stroke-linecap="round"/><g fill="#fffdf6" stroke="#d8e3d5" stroke-width="1.5"><circle cx="24" cy="11" r="7.5"/><circle cx="13" cy="18" r="7.5"/><circle cx="35" cy="18" r="7.5"/><circle cx="17" cy="28" r="7.5"/><circle cx="31" cy="28" r="7.5"/></g><circle cx="24" cy="20" r="6.5" fill="#ffc93c"/></svg>
  </button>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-group">
      <button class="hud-pill size-btn" type="button" data-pairs="2" aria-label="Easy 4 Cards">🍀 4</button>
      <button class="hud-pill size-btn active" type="button" data-pairs="3" aria-label="Medium 6 Cards">🌼 6</button>
      <button class="hud-pill size-btn" type="button" data-pairs="6" aria-label="Big 12 Cards">🌻 12</button>
      <button class="hud-pill round" id="hintBtn" type="button" aria-label="Firefly Peek Hint">✨</button>
      <button class="hud-pill round" id="soundBtn" type="button" aria-label="Toggle Sound">🔊</button>
    </div>
    <div id="starBank" aria-label="Stars collected">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4l3 6 6.6.9-4.8 4.6 1.1 6.6L12 17.4l-5.9 3.1 1.1-6.6-4.8-4.6 6.6-.9z" fill="#ffc93c" stroke="#d99400" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span id="starCount">0</span>
    </div>
  </div>

  <!-- Meadow Workspace -->
  <div id="meadowMain">
    <div id="pairTray" aria-label="Matched pairs progress"></div>
    <div id="boardWrap">
      <div id="boardFrame">
        <div id="grid" class="g-6"></div>
        <svg id="arcSvg" aria-hidden="true"></svg>
      </div>
    </div>
  </div>

  <!-- Flower-Crown Hoot Meadow Buddy -->
  <button id="hootMeadow" type="button" aria-label="Hoot with a daisy flower crown — tap for a hint or giggle">
    <svg viewBox="0 0 200 205" aria-hidden="true">
      <ellipse cx="100" cy="126" rx="60" ry="60" fill="#a26636" stroke="#4a2810" stroke-width="5"/>
      <ellipse cx="100" cy="142" rx="40" ry="40" fill="#fdecd2"/>
      <path d="M84 134 q8 7 16 0 M100 134 q8 7 16 0 M92 150 q8 7 16 0" stroke="#d9b485" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="42" cy="130" rx="18" ry="34" fill="#8b5226" stroke="#4a2810" stroke-width="4" transform="rotate(14 42 130)"/>
      <ellipse cx="158" cy="130" rx="18" ry="34" fill="#8b5226" stroke="#4a2810" stroke-width="4" transform="rotate(-14 158 130)"/>
      <circle cx="100" cy="76" r="49" fill="#a26636" stroke="#4a2810" stroke-width="5"/>
      <path d="M56 50 Q44 20 68 30 Z" fill="#8b5226" stroke="#4a2810" stroke-width="3.5"/>
      <path d="M144 50 Q156 20 132 30 Z" fill="#8b5226" stroke="#4a2810" stroke-width="3.5"/>
      <ellipse cx="79" cy="78" rx="22" ry="24" fill="#fdecd2"/>
      <ellipse cx="121" cy="78" rx="22" ry="24" fill="#fdecd2"/>
      <circle cx="79" cy="76" r="11" fill="#1b3526"/><circle cx="121" cy="76" r="11" fill="#1b3526"/>
      <circle cx="83" cy="72" r="4" fill="#fff"/><circle cx="125" cy="72" r="4" fill="#fff"/>
      <circle cx="57" cy="95" r="8" fill="#ff9e8a" opacity=".82"/><circle cx="143" cy="95" r="8" fill="#ff9e8a" opacity=".82"/>
      <path d="M90 90 Q100 84 110 90 Q106 104 100 106 Q94 104 90 90 Z" fill="#ffab1f" stroke="#b56200" stroke-width="2.5"/>
      <!-- Daisy Flower Crown -->
      <path d="M58 40 Q100 22 142 40" stroke="#3aa848" stroke-width="7" fill="none" stroke-linecap="round"/>
      <g>
        <circle cx="72" cy="34" r="10" fill="#fffdf6" stroke="#d4e0d0" stroke-width="2"/><circle cx="72" cy="34" r="4.5" fill="#ffc93c"/>
        <circle cx="100" cy="27" r="11.5" fill="#ff9ebb" stroke="#d45582" stroke-width="2"/><circle cx="100" cy="27" r="5" fill="#ffe066"/>
        <circle cx="128" cy="34" r="10" fill="#fffdf6" stroke="#d4e0d0" stroke-width="2"/><circle cx="128" cy="34" r="4.5" fill="#ffc93c"/>
      </g>
      <path d="M78 188 q-8 8 -14 6 M78 188 q-2 10 -8 12 M122 188 q8 8 14 6 M122 188 q2 10 8 12" stroke="#ffab1f" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Win Celebration Overlay -->
  <div id="winOverlay" hidden>
    <div id="winCard" role="dialog" aria-modal="true" aria-label="You matched every friend!">
      <div id="winStars" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
      <div id="winRow"></div>
      <div class="win-btns">
        <button class="win-act" id="againBtn" type="button" aria-label="Play Again">↻ ▶</button>
        <button class="win-act" id="levelUpBtn" type="button" aria-label="Bigger Meadow">🌻+</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var ANIMALS=[
    {id:"cat",emo:"🐱",bg:"#ffe5d9",word:"word-cat",snd:"sound-meow"},
    {id:"dog",emo:"🐶",bg:"#fff0cc",word:"word-dog",snd:"sound-woof"},
    {id:"frog",emo:"🐸",bg:"#dcf7dc",word:"word-frog",snd:"sound-ribbit"},
    {id:"duck",emo:"🦆",bg:"#fff6c7",word:"word-duck",snd:"sound-quack"},
    {id:"cow",emo:"🐮",bg:"#e8eef7",word:"word-cow",snd:"sound-moo"},
    {id:"pig",emo:"🐷",bg:"#ffe0ee",word:"word-pig",snd:"sound-oink"},
    {id:"sheep",emo:"🐑",bg:"#eef5ff",word:"word-sheep",snd:"sound-baa"},
    {id:"lion",emo:"🦁",bg:"#ffebd1",word:"word-lion",snd:null},
    {id:"bear",emo:"🐻",bg:"#f3e3d3",word:"word-bear",snd:null},
    {id:"bunny",emo:"🐰",bg:"#ffeaf4",word:"word-bunny",snd:null},
    {id:"fox",emo:"🦊",bg:"#ffe4d4",word:"word-fox",snd:null},
    {id:"butterfly",emo:"🦋",bg:"#e3f4ff",word:"word-butterfly",snd:null}
  ];

  var PRAISE=["hoot-great-job.mp3","hoot-amazing.mp3","hoot-star.mp3","hoot-super.mp3","hoot-yay-2.mp3"];
  var CLOVER_SVG='<svg viewBox="0 0 80 80" aria-hidden="true">'
    +'<circle cx="40" cy="24" r="15" fill="#92f29b"/><circle cx="24" cy="40" r="15" fill="#92f29b"/>'
    +'<circle cx="56" cy="40" r="15" fill="#92f29b"/><circle cx="40" cy="56" r="15" fill="#92f29b"/>'
    +'<circle cx="40" cy="40" r="11" fill="#ffe066" stroke="#fff" stroke-width="3"/></svg>';

  var pairGoal=3; /* default 6 cards (3 pairs) — ideal for Zane (3) & Riley (2) */
  var state="play"; /* play | checking | won */
  var cards=[], firstCard=null, matchedCount=0, stars=0, praiseIdx=0;
  var soundOn=true, dead=false, idleTimer=null;

  function $(id){ return document.getElementById(id); }
  var stage=$("stage"), grid=$("grid"), boardFrame=$("boardFrame"),
      arcSvg=$("arcSvg"), pairTray=$("pairTray"),
      starCount=$("starCount"), starBank=$("starBank"),
      hootMeadow=$("hootMeadow"), winOverlay=$("winOverlay"),
      winStars=$("winStars"), winRow=$("winRow"),
      hintBtn=$("hintBtn"), soundBtn=$("soundBtn"),
      levelUpBtn=$("levelUpBtn");

  /* ================= SOUND FX ================= */
  var AC=null;
  function audio(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
    if(AC&&AC.state==="suspended") AC.resume();
    return AC;
  }
  function tone(f0,f1,dur,type,vol,delay){
    if(!soundOn) return;
    var ac=audio(); if(!ac) return;
    var t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
  }
  function flipSfx(){ tone(460,720,0.08,"sine",0.1); }
  function matchSfx(){ tone(660,660,0.09,"triangle",0.12); tone(880,880,0.1,"triangle",0.12,0.07); tone(1320,1320,0.16,"triangle",0.11,0.15); }
  function missSfx(){ tone(340,260,0.14,"sine",0.09); }
  function hintSfx(){ tone(980,1480,0.12,"sine",0.09); }
  function starSfx(){ tone(880,880,0.08,"triangle",0.1); tone(1175,1175,0.08,"triangle",0.1,0.06); tone(1568,1568,0.14,"triangle",0.1,0.12); }

  /* ================= STUDIO HOOT VOICE ================= */
  var VBASE="assets/voice/";
  var voiceEl=null, vQueue=[], vPlaying=false;
  function hasClip(id){
    try{ var H=window.parent&&window.parent.HOOT_HAVE; if(H) return !!H[id]; }catch(e){}
    return true;
  }
  function getVoice(){
    if(!voiceEl){
      voiceEl=new Audio(); voiceEl.preload="auto";
      voiceEl.addEventListener("ended",function(){
        var e=voiceEl;
        if(e.__hwT && Date.now()-e.__hwT<350){
          if(!e.paused && !e.ended) return;
          if(!e.__hwRetry){ e.__hwRetry=1; try{e.currentTime=0;}catch(x){} var p=e.play(); if(p&&p.catch) p.catch(vNext); return; }
        }
        vNext();
      });
      voiceEl.addEventListener("error",vNext);
    }
    return voiceEl;
  }
  function hubQuiet(){
    try{
      var d=window.parent&&window.parent.document;
      if(!d||d===document) return false;
      var b=d.querySelector('.voice-btn[data-voice="off"]');
      return !!(b&&(b.classList.contains("sel")||b.classList.contains("active")||b.getAttribute("aria-pressed")==="true"));
    }catch(e){ return false; }
  }
  function vNext(){ if(!vPlaying){ pumpVoice(); return; } vPlaying=false; hootMeadow.classList.remove("talking"); pumpVoice(); }
  function pumpVoice(){
    if(vPlaying||dead) return;
    var item=vQueue.shift(); if(!item) return;
    if(!soundOn||hubQuiet()){ pumpVoice(); return; }
    var el=getVoice();
    vPlaying=true; hootMeadow.classList.add("talking");
    if(item.giggle) window.__bellyArmed=true;
    el.__hwT=Date.now(); el.__hwRetry=0;
    el.src=VBASE+item.file;
    var p=el.play();
    if(item.giggle) setTimeout(function(){ window.__bellyArmed=false; }, 120);
    if(p&&p.catch) p.catch(vNext);
  }
  function clearVoice(stop){
    vQueue.length=0;
    if(stop && voiceEl){
      voiceEl.__hwT=0; voiceEl.__hwRetry=1;
      try{ voiceEl.pause(); }catch(e){}
      vPlaying=false; hootMeadow.classList.remove("talking");
    }
  }
  function enqueue(file,opts){
    if(!file) return;
    vQueue.push({file:file, giggle:!!(opts&&opts.giggle)});
    pumpVoice();
  }
  function speakAnimal(an){
    if(!an || !an.word || !hasClip(an.word)) return;
    clearVoice(true);
    enqueue(an.word+".mp3");
  }
  function speakMatch(an){
    clearVoice(true);
    if(an && an.snd && hasClip(an.snd)) enqueue(an.snd+".mp3");
    else if(an && an.word && hasClip(an.word)) enqueue(an.word+".mp3");
    var pr=PRAISE[praiseIdx%PRAISE.length]; praiseIdx++;
    if(!hasClip(pr.replace(".mp3",""))) pr="hoot-great-job.mp3";
    enqueue(pr);
  }

  /* ================= HELPERS ================= */
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function showSparkleArc(elA, elB){
    var br=boardFrame.getBoundingClientRect();
    var a=elA.getBoundingClientRect(), b=elB.getBoundingClientRect();
    var x1=a.left-br.left+a.width/2, y1=a.top-br.top+a.height/2;
    var x2=b.left-br.left+b.width/2, y2=b.top-br.top+b.height/2;
    var mx=(x1+x2)/2, my=Math.min(y1,y2)-42;
    arcSvg.innerHTML='<path d="M'+x1+' '+y1+' Q '+mx+' '+my+' '+x2+' '+y2+'"/><circle cx="'+x1+'" cy="'+y1+'" r="9" fill="#ffe066"/><circle cx="'+x2+'" cy="'+y2+'" r="9" fill="#ffe066"/>';
    setTimeout(function(){ arcSvg.innerHTML=""; }, 900);
  }

  function spawnConfetti(n){
    var sr=stage.getBoundingClientRect();
    var cols=["#ff6b5e","#ffc93c","#4bc85b","#38bdf8","#c084fc","#ff85a8"];
    for(var i=0;i<(n||36);i++){
      var c=document.createElement("div");
      c.className="confetti";
      c.style.background=cols[i%cols.length];
      c.style.left=(sr.width*0.5)+"px"; c.style.top=(sr.height*0.32)+"px";
      stage.appendChild(c);
      var dx=(Math.random()-0.5)*sr.width*0.86, dy=130+Math.random()*sr.height*0.46, rot=(Math.random()*2-1)*380;
      if(c.animate){
        c.animate([
          {transform:"translate(0,0) rotate(0deg)", opacity:1},
          {transform:"translate("+dx+"px,"+dy+"px) rotate("+rot+"deg)", opacity:0}
        ],{duration:1100+Math.random()*650, easing:"cubic-bezier(.2,.7,.3,1)"});
      }
      (function(el){ setTimeout(function(){ el.remove(); }, 1850); })(c);
    }
  }

  /* ================= IDLE FIREFLY HINT ================= */
  function clearIdle(){ if(idleTimer){ clearTimeout(idleTimer); idleTimer=null; } }
  function armIdle(){
    clearIdle();
    if(dead || state!=="play") return;
    idleTimer=setTimeout(function(){
      if(dead || state!=="play") return;
      pulsePairHint();
    }, 11000);
  }
  function pulsePairHint(){
    var targetId=firstCard ? firstCard.dataset.id : null;
    var unmatched=cards.filter(function(c){ return !c.classList.contains("matched"); });
    if(!unmatched.length) return;
    if(!targetId) targetId=unmatched[0].dataset.id;
    var pair=unmatched.filter(function(c){ return c.dataset.id===targetId && !c.classList.contains("up"); });
    pair.forEach(function(c){
      c.classList.remove("hint-glow"); void c.offsetWidth; c.classList.add("hint-glow");
      setTimeout(function(){ c.classList.remove("hint-glow"); }, 1650);
    });
    hintSfx();
  }

  /* ================= BOARD BUILD & PLAY ================= */
  var roundAnimals=[];
  function renderPairTray(){
    pairTray.innerHTML="";
    for(var i=0;i<pairGoal;i++){
      var b=document.createElement("span");
      b.className="pair-bud"+(i<matchedCount?" lit":"");
      b.textContent=i<matchedCount?"🌼":"";
      pairTray.appendChild(b);
    }
  }

  function startRound(){
    clearIdle();
    clearVoice(true);
    state="play";
    firstCard=null;
    matchedCount=0;
    winOverlay.hidden=true;
    arcSvg.innerHTML="";

    roundAnimals=shuffle(ANIMALS.slice()).slice(0, pairGoal);
    var deck=shuffle(roundAnimals.concat(roundAnimals));
    grid.className="g-"+(pairGoal*2);
    grid.innerHTML="";
    cards=[];

    deck.forEach(function(an){
      var btn=document.createElement("button");
      btn.type="button";
      btn.className="card";
      btn.dataset.id=an.id;
      btn.setAttribute("aria-label","Memory card");
      btn.innerHTML='<span class="inner">'
        +'<span class="face back">'+CLOVER_SVG+'</span>'
        +'<span class="face front"><span class="medallion" style="background:'+an.bg+'"><span class="an-emo" aria-hidden="true">'+an.emo+'</span></span></span>'
        +'</span>';
      btn.addEventListener("pointerdown",function(e){
        e.preventDefault();
        onCardTap(btn, an);
      });
      grid.appendChild(btn);
      cards.push(btn);
    });

    renderPairTray();
    armIdle();
  }

  function onCardTap(btn, an){
    audio();
    if(dead || state!=="play") return;
    if(btn.classList.contains("up") || btn.classList.contains("matched")) return;
    clearIdle();
    btn.classList.add("up");
    flipSfx();

    if(!firstCard){
      firstCard=btn;
      speakAnimal(an);
      armIdle();
      return;
    }

    state="checking";
    var prev=firstCard;
    firstCard=null;

    if(prev.dataset.id === btn.dataset.id){
      /* MATCH! */
      matchedCount++;
      stars++;
      starCount.textContent=stars;
      starBank.classList.remove("bump"); void starBank.offsetWidth; starBank.classList.add("bump");
      prev.classList.add("matched");
      btn.classList.add("matched");
      matchSfx();
      showSparkleArc(prev, btn);
      hootMeadow.classList.remove("celebrate"); void hootMeadow.offsetWidth; hootMeadow.classList.add("celebrate");
      renderPairTray();
      speakMatch(an);

      setTimeout(function(){
        if(dead) return;
        if(matchedCount>=pairGoal){
          showWin();
        } else {
          state="play";
          armIdle();
        }
      }, 650);
    } else {
      /* NOT A MATCH — kind generous peek window for toddlers! */
      speakAnimal(an);
      setTimeout(function(){
        if(dead) return;
        missSfx();
        prev.classList.add("wiggle");
        btn.classList.add("wiggle");
      }, 360);
      setTimeout(function(){
        if(dead) return;
        prev.classList.remove("up","wiggle");
        btn.classList.remove("up","wiggle");
        state="play";
        armIdle();
      }, 1150);
    }
  }

  function showWin(){
    state="won";
    clearIdle();
    winRow.innerHTML="";
    roundAnimals.forEach(function(an){
      var s=document.createElement("span");
      s.className="win-chip";
      s.textContent=an.emo;
      winRow.appendChild(s);
    });
    var st=winStars.children;
    for(var i=0;i<st.length;i++){
      st[i].classList.remove("lit");
      (function(el,ms){ setTimeout(function(){ el.classList.add("lit"); }, ms); })(st[i], 180+i*180);
    }
    levelUpBtn.style.display=(pairGoal<6)?"inline-flex":"none";
    levelUpBtn.textContent=(pairGoal===2)?"🌼 6":"🌻 12";
    winOverlay.hidden=false;
    spawnConfetti(42);
    starSfx();
    enqueue(hasClip("hoot-win-yay")?"hoot-win-yay.mp3":"hoot-amazing.mp3");
  }

  /* ================= CONTROLS ================= */
  document.querySelectorAll(".size-btn").forEach(function(b){
    b.addEventListener("click",function(){
      audio(); flipSfx();
      pairGoal=Number(b.getAttribute("data-pairs"))||3;
      document.querySelectorAll(".size-btn").forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      startRound();
    });
  });
  hintBtn.addEventListener("click",function(){
    audio();
    if(state==="play") pulsePairHint();
  });
  soundBtn.addEventListener("click",function(){
    soundOn=!soundOn;
    soundBtn.textContent=soundOn?"🔊":"🔇";
    if(!soundOn) clearVoice(true); else{ audio(); flipSfx(); }
  });
  $("againBtn").addEventListener("click",function(){
    audio(); starSfx();
    startRound();
  });
  levelUpBtn.addEventListener("click",function(){
    audio(); starSfx();
    pairGoal=(pairGoal===2)?3:6;
    document.querySelectorAll(".size-btn").forEach(function(x){
      x.classList.toggle("active", Number(x.getAttribute("data-pairs"))===pairGoal);
    });
    startRound();
  });

  var lastHootTap=0;
  hootMeadow.addEventListener("click",function(){
    audio();
    hootMeadow.classList.remove("celebrate"); void hootMeadow.offsetWidth; hootMeadow.classList.add("celebrate");
    if(state==="play") pulsePairHint();
    var now=Date.now();
    if(now-lastHootTap>8000){
      lastHootTap=now;
      clearVoice(true);
      enqueue("hoot-giggle.mp3",{giggle:true});
    }
  });

  document.querySelectorAll(".bfly").forEach(function(bf){
    bf.addEventListener("click",function(){
      audio(); hintSfx();
      bf.classList.remove("spin"); void bf.offsetWidth; bf.classList.add("spin");
      setTimeout(function(){ bf.classList.remove("spin"); }, 700);
    });
  });
  document.querySelectorAll(".daisy").forEach(function(d){
    d.addEventListener("click",function(){
      audio(); flipSfx();
      d.classList.remove("bloom"); void d.offsetWidth; d.classList.add("bloom");
      setTimeout(function(){ d.classList.remove("bloom"); }, 520);
    });
  });

  window.addEventListener("pagehide",function(){ dead=true; clearIdle(); clearVoice(true); });
  document.addEventListener("visibilitychange",function(){ if(document.hidden) clearVoice(false); });

  /* ================= INIT ================= */
  startRound();
  enqueue("hoot-game-hello.mp3");

  window.__memoryGame={
    snapshot:function(){
      return {
        state:state, pairGoal:pairGoal, matched:matchedCount, stars:stars,
        cardCount:cards.length, winShown:!winOverlay.hidden
      };
    }
  };
})();
</script>
