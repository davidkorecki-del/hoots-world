<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="memory";</script>
<script src="js/hoot-game-head.js?v=llprev3e79"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />

<title>Memory Match Meadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#17324f; --ink-soft:#3d5a78; --paper:#fffdf6;
    --sun:#ffc93c; --coral:#ff6b5e; --teal:#17bebb; --leaf:#57cc62;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ margin:0; font-family:"Nunito",system-ui,sans-serif; color:var(--ink); overflow:hidden; background:#aee7ff; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  #stage{ position:fixed; inset:0; height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#6ec9f7 0%,#a5e3ff 26%,#cdeffd 44%,#b9e39a 72%,#8edd7e 100%); }

  .decor{ position:absolute; border:none; background:none; padding:0; cursor:pointer; font-family:inherit; }
  #sun{ top:64px; right:8px; width:74px; height:74px; z-index:1; }
  #sun svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 10px rgba(232,169,12,.35)); }
  #sun .rays{ transform-box:fill-box; transform-origin:center; animation:sunSpin 46s linear infinite; }
  @keyframes sunSpin{ to{ transform:rotate(360deg); } }
  #sun.zing .rays{ animation:sunSpin 1.1s cubic-bezier(.34,1.4,.5,1) 1; }
  #sun:active{ transform:scale(.93); }
  .cloud{ z-index:1; width:104px; height:46px; opacity:.95; animation:drift linear infinite; }
  .cloud svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 5px 8px rgba(23,50,79,.12)); transition:transform .25s cubic-bezier(.34,1.8,.5,1); }
  .cloud.puff svg{ transform:scale(1.22,1.35); }
  @keyframes drift{ from{ transform:translateX(-140px); } to{ transform:translateX(112vw); } }
  .bfly{ z-index:2; width:40px; height:32px; animation:flutter 7s ease-in-out infinite alternate; }
  .bfly svg{ width:100%; height:100%; display:block; overflow:visible; }
  .bfly .bw{ transform-box:fill-box; animation:bflap .22s ease-in-out infinite alternate; }
  .bfly .bw-l{ transform-origin:100% 50%; } .bfly .bw-r{ transform-origin:0% 50%; }
  @keyframes bflap{ from{ transform:rotate(14deg);} to{ transform:rotate(-18deg);} }
  @keyframes flutter{ 0%{ transform:translate(0,0) rotate(-4deg);} 50%{ transform:translate(26px,-18px) rotate(5deg);} 100%{ transform:translate(-14px,-8px) rotate(-3deg);} }
  .flower{ z-index:1; width:36px; height:48px; bottom:5px; transform-origin:50% 100%; animation:sway 3.4s ease-in-out infinite alternate; }
  .flower svg{ width:100%; height:100%; display:block; overflow:visible; }
  .flower.bloom svg{ animation:bloomPop .55s cubic-bezier(.34,1.8,.5,1); }
  @keyframes sway{ from{ transform:rotate(-4deg);} to{ transform:rotate(4deg);} }
  @keyframes bloomPop{ 0%{ transform:scale(1);} 45%{ transform:scale(1.45) rotate(-7deg);} 100%{ transform:scale(1);} }
  #grass{ position:absolute; left:0; right:0; bottom:0; height:64px; z-index:1; pointer-events:none; }
  .grassBlade{ transform-box:fill-box; transform-origin:50% 100%; animation:sway 3s ease-in-out infinite alternate; }

  #hud{ position:relative; z-index:6; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:max(8px,env(safe-area-inset-top)) 10px 0; }
  .hud-btns{ display:flex; gap:8px; }
  .round-btn{ width:50px; height:50px; border-radius:50%; border:3px solid #fff; background:rgba(255,253,246,.96); color:var(--ink); display:grid; place-items:center; box-shadow:0 4px 0 rgba(23,50,79,.18),0 8px 16px rgba(23,50,79,.12); cursor:pointer; transition:transform .12s ease; }
  .round-btn:active{ transform:scale(.9); }
  .round-btn svg{ width:25px; height:25px; }
  #starBank{ display:flex; align-items:center; gap:7px; background:rgba(255,253,246,.96); border:3px solid #fff; border-radius:999px; padding:6px 16px 6px 10px; box-shadow:0 4px 0 rgba(23,50,79,.14),0 8px 16px rgba(23,50,79,.1); font-family:"Fredoka",sans-serif; font-weight:700; font-size:22px; }
  #starBank .star-ic{ width:25px; height:25px; display:block; }
  #starBank.bump{ animation:bump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes bump{ 0%{transform:scale(1)} 40%{transform:scale(1.18) rotate(-3deg)} 100%{transform:scale(1)} }

  #meterCard{ position:relative; z-index:6; margin:8px auto 0; width:fit-content; max-width:calc(100vw - 20px); display:flex; align-items:center; gap:11px; background:rgba(255,253,246,.97); border:3px solid #fff; border-radius:20px; padding:7px 16px 7px 12px; box-shadow:0 5px 0 rgba(23,50,79,.15),0 12px 24px rgba(23,50,79,.14); }
  .mc-label{ font-family:"Fredoka",sans-serif; font-weight:600; font-size:14.5px; letter-spacing:.03em; color:var(--ink-soft); text-transform:uppercase; line-height:1.15; }
  #pairDots{ display:flex; gap:5px; margin-top:4px; }
  #pairDots i{ width:12px; height:12px; border-radius:50%; background:#dbe7f2; display:block; transition:background .2s,transform .2s; }
  #pairDots i.on{ background:var(--leaf); transform:scale(1.25); }
  #pairText{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:24px; color:#2c7a3b; }

  #playArea{ position:relative; z-index:3; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 10px; }
  #grid{ display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(3,1fr); gap:9px; width:100%; max-width:520px; height:100%; max-height:520px; }
  .card{ position:relative; border:none; background:none; padding:0; cursor:pointer; perspective:600px; min-height:0; height:100%; width:100%; }
  .card .inner{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.34,1.3,.5,1); display:block; }
  .card.up .inner{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; overflow:hidden; }
  .face.back{ background:linear-gradient(150deg,#57cc62,#2e9e5b); border:3px solid #fff; box-shadow:inset 0 0 0 3px rgba(255,255,255,.25), 0 5px 12px rgba(23,80,40,.3); }
  .face.back svg{ width:52%; height:52%; opacity:.95; }
  .face.back .q{ font-family:"Fredoka",sans-serif; font-weight:700; color:#fff; font-size:20px; text-shadow:0 2px 0 rgba(0,0,0,.2); line-height:1; }
  .face.front{ background:#fffdf6; border:3px solid #ffd166; transform:rotateY(180deg); box-shadow:0 5px 12px rgba(23,50,79,.18); }
  .face.front .animal{ font-size:clamp(30px,9vw,52px); line-height:1.05; }
  .face.front .aname{ font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(11px,3.2vw,15px); color:var(--ink); }
  .card.matched{ cursor:default; }
  .card.matched .face.front{ border-color:var(--sun); background:#fff6d8; box-shadow:0 0 0 3px rgba(255,201,60,.55), 0 0 22px 4px rgba(255,201,60,.55); }
  .card.wiggle .inner{ animation:cardWiggle .5s ease-in-out 2; }
  @keyframes cardWiggle{ 0%,100%{ transform:rotateY(180deg) rotate(0);} 25%{ transform:rotateY(180deg) rotate(-5deg) scale(1.04);} 75%{ transform:rotateY(180deg) rotate(5deg) scale(1.04);} }
  .card.hintpulse .face.back{ animation:hintPulse .5s ease-in-out 3; }
  @keyframes hintPulse{ 0%,100%{ box-shadow:inset 0 0 0 3px rgba(255,255,255,.25), 0 5px 12px rgba(23,80,40,.3);} 50%{ box-shadow:0 0 0 5px rgba(255,201,60,.9), 0 0 26px 8px rgba(255,201,60,.75);} }
  #echoSvg{ position:absolute; inset:0; z-index:5; pointer-events:none; overflow:visible; }
  #echoSvg path{ fill:none; stroke:#ffc93c; stroke-width:5; stroke-linecap:round; stroke-dasharray:2 14; filter:drop-shadow(0 0 6px rgba(255,201,60,.95)); animation:echoFlow .5s linear infinite; }
  @keyframes echoFlow{ to{ stroke-dashoffset:-16; } }
  #echoSvg circle{ fill:#ffe27a; filter:drop-shadow(0 0 7px rgba(255,201,60,1)); }

  #groundRow{ position:relative; z-index:4; display:flex; align-items:flex-end; justify-content:flex-start; gap:6px; padding:0 8px max(6px,env(safe-area-inset-bottom)); }
  #hootZone{ display:flex; align-items:flex-end; gap:7px; min-width:0; }
  #hootFig{ position:relative; border:none; background:none; padding:0; cursor:pointer; width:clamp(104px,27vw,168px); flex:0 0 auto; filter:drop-shadow(0 8px 10px rgba(23,50,79,.25)); animation:hootBob 3.2s ease-in-out infinite; transform-origin:50% 92%; }
  #hootFig svg{ width:100%; display:block; overflow:visible; }
  @keyframes hootBob{ 0%,100%{ transform:translateY(0) rotate(-1.1deg);} 50%{ transform:translateY(-6px) rotate(1.1deg);} }
  #hootFig.celebrate{ animation:hootJump .55s cubic-bezier(.34,1.6,.5,1) 3; }
  @keyframes hootJump{ 0%{transform:translateY(0) scale(1,1)} 35%{transform:translateY(-26px) scale(.96,1.05) rotate(-4deg)} 70%{transform:translateY(0) scale(1.06,.92)} 100%{transform:translateY(0) scale(1,1)} }
  #hootFig.shake{ animation:hootShake .5s ease-in-out 2; }
  @keyframes hootShake{ 0%,100%{ transform:rotate(0);} 25%{ transform:rotate(-5deg);} 75%{ transform:rotate(5deg);} }
  #hootFig.talking{ animation:hootTalk .22s ease-in-out infinite alternate; }
  @keyframes hootTalk{ 0%{ transform:translateY(0) scale(1,1);} 100%{ transform:translateY(-4px) scale(1.03,.97);} }
  #hootFig.wave .wing-r{ animation:wingWave .45s ease-in-out 6 alternate; }
  #hootFig .wing-r{ transform-box:fill-box; transform-origin:15% 12%; }
  @keyframes wingWave{ from{ transform:rotate(0);} to{ transform:rotate(-38deg);} }
  #hootFig.celebrate .wing-l{ animation:wingFlapL .28s ease-in-out infinite alternate; }
  #hootFig.celebrate .wing-r{ animation:wingFlapR .28s ease-in-out infinite alternate; }
  #hootFig .wing-l{ transform-box:fill-box; transform-origin:85% 12%; }
  @keyframes wingFlapL{ from{ transform:rotate(0);} to{ transform:rotate(30deg);} }
  @keyframes wingFlapR{ from{ transform:rotate(0);} to{ transform:rotate(-30deg);} }
  #hootFig .eyes{ transform-box:fill-box; transform-origin:center; animation:blink 4.6s infinite; }
  @keyframes blink{ 0%,91%,100%{ transform:scaleY(1);} 94%,96%{ transform:scaleY(.08);} }
  #bubbleCol{ display:flex; flex-direction:column; align-items:flex-start; gap:5px; margin-bottom:26px; min-width:0; }
  #bubble{ position:relative; background:var(--paper); border:3px solid #fff; border-radius:18px; box-shadow:0 5px 0 rgba(23,50,79,.13),0 12px 24px rgba(23,50,79,.16); padding:9px 13px; font-weight:800; font-size:clamp(14.5px,4vw,18.5px); line-height:1.3; max-width:min(54vw,300px); }
  #bubble:after{ content:""; position:absolute; left:-8px; bottom:16px; width:15px; height:15px; background:var(--paper); transform:rotate(45deg); }
  #bubble .b-an{ color:#2c7a3b; font-family:"Fredoka",sans-serif; }
  #hootName{ background:var(--coral); color:#fff; font-family:"Fredoka",sans-serif; font-weight:700; font-size:11.5px; letter-spacing:.06em; padding:3px 11px; border-radius:999px; border:2px solid #fff; box-shadow:0 3px 8px rgba(23,50,79,.2); }

  #startPanel{ position:absolute; z-index:8; left:50%; top:44%; transform:translate(-50%,-50%); width:min(92vw,430px); background:rgba(255,253,246,.97); border:3px solid #fff; border-radius:26px; box-shadow:0 10px 0 rgba(23,50,79,.12),0 24px 48px rgba(23,50,79,.25); padding:18px 20px 16px; text-align:center; }
  #startPanel[hidden]{ display:none; }
  #startPanel h1{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(25px,6.8vw,36px); margin:0; color:var(--ink); }
  #startPanel h1 .t-mem{ color:#2c7a3b; } #startPanel h1 .t-mead{ color:#e2703a; }
  #startPanel p{ font-weight:800; color:var(--ink-soft); font-size:15.5px; line-height:1.4; margin:8px 0 0; }
  #playBtn{ margin-top:16px; border:3px solid #fff; background:var(--coral); color:#fff; font-family:"Fredoka",sans-serif; font-weight:700; font-size:24px; padding:14px 44px; border-radius:999px; cursor:pointer; box-shadow:0 7px 0 #d84a3f,0 16px 30px rgba(255,107,94,.4); transition:transform .12s; animation:playPulse 1.6s ease-in-out infinite; }
  #playBtn:active{ transform:translateY(4px); box-shadow:0 3px 0 #d84a3f; }
  @keyframes playPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }

  #winOverlay{ position:absolute; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; background:rgba(23,50,79,.38); padding:14px; }
  #winOverlay[hidden]{ display:none; }
  #winCard{ background:var(--paper); border:3px solid #fff; border-radius:26px; box-shadow:0 14px 40px rgba(23,50,79,.35); padding:18px 20px 16px; text-align:center; width:min(92vw,440px); max-height:100%; overflow:hidden; animation:winIn .5s cubic-bezier(.34,1.6,.5,1); }
  @keyframes winIn{ from{ transform:scale(.7) translateY(30px); opacity:0;} to{ transform:scale(1) translateY(0); opacity:1;} }
  #winStars{ font-size:27px; letter-spacing:4px; color:#dbe7f2; }
  #winStars .lit{ color:var(--sun); text-shadow:0 2px 0 #e8a90c; }
  #winCard h2{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(25px,6.6vw,34px); margin:6px 0 0; }
  #winRecap{ font-weight:800; color:var(--ink-soft); font-size:16px; line-height:1.45; margin:8px 0 0; }
  #winChips{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:11px; }
  .chip{ width:42px; height:42px; display:grid; place-items:center; background:#fff6d8; border:2px solid #ffd166; border-radius:50%; font-size:22px; box-shadow:0 2px 6px rgba(23,50,79,.2); }
  .win-btns{ display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .win-btn{ border:3px solid #fff; font-family:"Fredoka",sans-serif; font-weight:700; font-size:19px; padding:12px 26px; border-radius:999px; cursor:pointer; transition:transform .12s; }
  .win-btn:active{ transform:translateY(3px); }
  #againBtn{ background:var(--leaf); color:#fff; box-shadow:0 6px 0 #3da347,0 12px 24px rgba(87,204,98,.35); }
  #winHomeBtn{ background:#fff; color:var(--ink); border-color:#dbe7f2; box-shadow:0 5px 0 rgba(23,50,79,.14); }
  .confetti{ position:absolute; z-index:10; width:11px; height:15px; border-radius:3px; pointer-events:none; }

  @media (max-width:430px){
    #bubble{ font-size:13.5px; padding:8px 10px; }
    #grid{ gap:7px; }
  }
  @media (max-height:560px){
    #hootFig{ width:clamp(76px,23vh,100px); }
    #hud{ padding-top:6px; } .round-btn{ width:42px; height:42px; }
    #starBank{ font-size:18px; padding:4px 12px 4px 8px; }
    #meterCard{ margin-top:4px; padding:4px 12px 4px 9px; }
    #pairText{ font-size:19px; }
    #bubble{ font-size:12.5px; max-width:40vw; padding:7px 10px; }
    #bubbleCol{ margin-bottom:6px; }
    #sun{ width:54px; height:54px; top:46px; }
    #grass{ height:38px; }
    .face.front .animal{ font-size:26px; }
    .face.front .aname{ font-size:10.5px; }
    #startPanel{ top:50%; padding:12px 16px 10px; }
    #playBtn{ font-size:20px; padding:10px 34px; margin-top:10px; }
  }
  @media (prefers-reduced-motion:reduce){
    .cloud,.bfly,#hootFig,.flower,#sun .rays{ animation:none !important; }
    .card .inner{ transition:none; }
  }
  /* Wave 5A: iPad landscape side-rail + full-width memory card grid */
  @media (orientation:landscape) and (min-width:768px) and (min-height:541px){
    #stage{
      display:grid !important;
      grid-template-columns:276px minmax(0,1fr);
      grid-template-rows:auto minmax(0,1fr);
      align-items:stretch;
    }
    #meterCard{ grid-column:1; grid-row:1; margin:12px 10px 0 !important; width:auto !important; max-width:none !important; justify-content:center; }
    #groundRow{ grid-column:1; grid-row:2; align-items:flex-end; padding:8px 10px max(12px,env(safe-area-inset-bottom)) !important; }
    #hootZone{ flex-direction:column; align-items:flex-start; gap:8px; width:100%; }
    #hootFig{ width:116px !important; }
    #bubble{ max-width:248px !important; }
    #hud{ grid-column:2; grid-row:1; padding:8px 14px 4px !important; }
    #playArea{ grid-column:2; grid-row:2; padding:8px 20px max(14px,env(safe-area-inset-bottom)) !important; }
    #grid{ max-width:min(860px,100%) !important; max-height:min(640px,100%) !important; gap:16px !important; }
    /* Wave 5C-1 (Big & Physical): glossy 3D tactile memory cards with saturated backs & huge art */
    .card .face{
      border:5px solid #fff !important; border-radius:26px !important;
      box-shadow:0 8px 0 rgba(23,50,79,.18), 0 14px 24px rgba(23,50,79,.12) !important;
    }
    .card .face.front svg{ width:76% !important; height:76% !important; max-width:136px !important; max-height:136px !important; filter:drop-shadow(0 5px 6px rgba(23,50,79,.16)); }
    .card .face.front .cname{ font-size:18px !important; font-weight:700 !important; }
    .card.matched .face.front{ box-shadow:0 0 0 5px #ffd93b, 0 8px 0 #c98a00, 0 0 26px rgba(255,217,59,.6) !important; }
  }
</style>
</head>
<body>
<div id="stage">
  <button class="decor" id="sun" type="button" aria-label="Sun — tap for a sparkle">
    <svg viewBox="0 0 100 100" aria-hidden="true"><g class="rays" stroke="#ffb703" stroke-width="6" stroke-linecap="round"><path d="M50 2v12M50 86v12M2 50h12M86 50h12M16 16l8 8M76 76l8 8M84 16l-8 8M24 76l-8 8"/></g><circle cx="50" cy="50" r="27" fill="#ffc93c" stroke="#f0a500" stroke-width="3"/><circle cx="41" cy="46" r="3.6" fill="#17324f"/><circle cx="59" cy="46" r="3.6" fill="#17324f"/><path d="M40 58 Q50 66 60 58" stroke="#17324f" stroke-width="3.4" fill="none" stroke-linecap="round"/><circle cx="35" cy="55" r="4.4" fill="#ffb59d" opacity=".85"/><circle cx="65" cy="55" r="4.4" fill="#ffb59d" opacity=".85"/></svg>
  </button>
  <button class="decor cloud" type="button" style="top:10%;animation-duration:80s;animation-delay:-34s" aria-label="Cloud — tap for a puff"><svg viewBox="0 0 120 54" aria-hidden="true"><ellipse cx="38" cy="38" rx="30" ry="14" fill="#fff"/><ellipse cx="66" cy="28" rx="26" ry="19" fill="#fff"/><ellipse cx="90" cy="39" rx="24" ry="13" fill="#fff"/></svg></button>
  <button class="decor cloud" type="button" style="top:4%;animation-duration:112s;animation-delay:-84s;width:140px" aria-label="Cloud — tap for a puff"><svg viewBox="0 0 120 54" aria-hidden="true"><ellipse cx="38" cy="38" rx="30" ry="14" fill="#fff"/><ellipse cx="66" cy="28" rx="26" ry="19" fill="#fff"/><ellipse cx="90" cy="39" rx="24" ry="13" fill="#fff"/></svg></button>
  <button class="decor bfly" type="button" style="left:10%;top:34%" aria-label="Butterfly — tap for a twirl"><svg viewBox="0 0 40 32" aria-hidden="true"><g class="bw bw-l"><ellipse cx="10" cy="11" rx="9" ry="7" fill="#ff8fab"/><ellipse cx="11" cy="23" rx="7" ry="5.5" fill="#ffb3c8"/></g><g class="bw bw-r"><ellipse cx="30" cy="11" rx="9" ry="7" fill="#ff8fab"/><ellipse cx="29" cy="23" rx="7" ry="5.5" fill="#ffb3c8"/></g><ellipse cx="20" cy="17" rx="2.6" ry="8" fill="#17324f"/></svg></button>
  <button class="decor bfly" type="button" style="right:9%;top:30%;animation-delay:-3.5s" aria-label="Butterfly — tap for a twirl"><svg viewBox="0 0 40 32" aria-hidden="true"><g class="bw bw-l"><ellipse cx="10" cy="11" rx="9" ry="7" fill="#7fd4ff"/><ellipse cx="11" cy="23" rx="7" ry="5.5" fill="#aee7ff"/></g><g class="bw bw-r"><ellipse cx="30" cy="11" rx="9" ry="7" fill="#7fd4ff"/><ellipse cx="29" cy="23" rx="7" ry="5.5" fill="#aee7ff"/></g><ellipse cx="20" cy="17" rx="2.6" ry="8" fill="#17324f"/></svg></button>
  <svg id="grass" viewBox="0 0 400 64" preserveAspectRatio="none" aria-hidden="true">
    <g stroke="#3da347" stroke-width="4" fill="none" stroke-linecap="round">
      <path class="grassBlade" d="M14 64 Q10 30 18 8"/><path class="grassBlade" style="animation-delay:-.7s" d="M44 64 Q48 34 40 14"/>
      <path class="grassBlade" style="animation-delay:-1.3s" d="M96 64 Q92 28 102 6"/><path class="grassBlade" style="animation-delay:-.4s" d="M150 64 Q156 36 146 16"/>
      <path class="grassBlade" style="animation-delay:-2s" d="M210 64 Q206 30 216 10"/><path class="grassBlade" style="animation-delay:-1s" d="M268 64 Q274 34 262 14"/>
      <path class="grassBlade" style="animation-delay:-1.7s" d="M322 64 Q318 28 330 8"/><path class="grassBlade" style="animation-delay:-.2s" d="M372 64 Q378 36 366 16"/>
    </g>
  </svg>

<script>
(function(){
  "use strict";
  var ANIMALS=[
    {id:"fox", face:"🦊", name:"Fox", plural:"foxes", fact:"Foxes say yip at night!"},
    {id:"bunny", face:"🐰", name:"Bunny", plural:"bunnies", fact:"Bunnies hop with super-strong back legs!"},
    {id:"lion", face:"🦁", name:"Lion", plural:"lions", fact:"A lion&rsquo;s roar can be heard far, far away!"},
    {id:"frog", face:"🐸", name:"Frog", plural:"frogs", fact:"Frogs catch flies with long, sticky tongues!"},
    {id:"butterfly", face:"🦋", name:"Butterfly", plural:"butterflies", fact:"Butterflies taste their food with their feet!"},
    {id:"turtle", face:"🐢", name:"Turtle", plural:"turtles", fact:"A turtle&rsquo;s shell is its cosy home!"}
  ];
  var GOAL=6;
  var CARD_BACK="<svg viewBox='0 0 60 60' aria-hidden='true'><g fill='#fff'><circle cx='30' cy='16' r='8'/><circle cx='17' cy='26' r='8'/><circle cx='43' cy='26' r='8'/><circle cx='22' cy='37' r='8'/><circle cx='38' cy='37' r='8'/></g><circle cx='30' cy='27' r='7' fill='#ffc93c'/></svg>";

  var state="start";
  var pairs=0, stars=0, first=null, lock=false, dead=false;
  var soundOn=true, praiseIdx=0;
  var seenPos={};
  var flipSeq=0;

  function $(id){ return document.getElementById(id); }
  var stage=$("stage"), grid=$("grid"), bubble=$("bubble"), hootFig=$("hootFig"),
      starCount=$("starCount"), starBank=$("starBank"), pairText=$("pairText"),
      pairDots=$("pairDots").children, echoSvg=$("echoSvg"), playArea=$("playArea"),
      startPanel=$("startPanel"), winOverlay=$("winOverlay"), winRecap=$("winRecap"),
      winChips=$("winChips"), winStars=$("winStars");

  var AC=null;
  function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC&&AC.state==="suspended") AC.resume(); return AC; }
  function tone(f0,f1,dur,type,vol,delay){
    if(!soundOn) return; var ac=audio(); if(!ac) return;
    var t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.14,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
  }
  function flipSound(){ tone(520,760,0.09,"triangle",0.16); }
  function matchSound(){ tone(523,523,0.16,"triangle",0.15); tone(659,659,0.16,"triangle",0.15,0.12); tone(784,784,0.3,"triangle",0.15,0.24); }
  function missSound(){ tone(300,180,0.22,"sine",0.12); }
  function sparkleSound(){ tone(1180,1180,0.09,"sine",0.1); tone(1560,1560,0.12,"sine",0.1,0.07); }
  function poofSound(){ tone(220,120,0.16,"triangle",0.1); }

  /* HOOT'S VOICE — one line at a time, chained on 'ended' (see Bubble Number
     Pop for the full note). Only clips already recorded in assets/voice. */
  var VBASE="assets/voice/";
  var voiceEl=null, vQueue=[], vPlaying=false, vCurrent=null;
  function getVoice(){
    if(!voiceEl){
      voiceEl=new Audio(); voiceEl.preload="auto";
      voiceEl.addEventListener("ended",function(){var e=voiceEl;if(e.__hwT&&Date.now()-e.__hwT<400){if(!e.paused&&!e.ended)return;if(!e.__hwRetry){e.__hwRetry=1;try{e.currentTime=0;}catch(x){}var p=e.play();if(p&&p.catch)p.catch(function(){vNext();});return;}}vNext();});
      voiceEl.addEventListener("error",vNext);
    }
    return voiceEl;
  }
  function hubQuiet(){
    try{
      var d=window.parent&&window.parent.document;
      if(!d||d===document) return false;
      var b=d.querySelector('.voice-btn[data-voice="off"]');
      return !!(b&&(b.classList.contains("sel")||b.classList.contains("active")||b.getAttribute("aria-pressed")==="true"));
    }catch(e){ return false; }
  }
  function silenced(){ return !soundOn||hubQuiet(); }
  function hootTalking(on){ hootFig.classList.toggle("talking",!!on); }
  function vNext(){
    if(!vPlaying){ pumpVoice(); return; }
    vPlaying=false; vCurrent=null; hootTalking(false); pumpVoice();
  }
  function pumpVoice(){
    if(vPlaying||dead) return;
    var item=vQueue.shift(); if(!item) return;
    if(item.onStart){ try{ item.onStart(); }catch(e){} }
    if(silenced()){ pumpVoice(); return; }
    var el=getVoice(); vPlaying=true; vCurrent=item; hootTalking(true);
    el.__hwT=Date.now();el.__hwRetry=0;el.src=VBASE+item.file;
    var p=el.play();
    if(p&&p.catch) p.catch(function(){ vNext(); });
  }
  function enqueue(file,kind,onStart){if(window.__hwNameFix){file=window.__hwNameFix(file,kind);}if(!file){return;}
    vQueue.push({file:file,kind:kind||"",onStart:onStart||null});
    pumpVoice();
  }
  function clearPending(){ vQueue.length=0; }

  function say(html){ bubble.innerHTML=html; }
  function hootReact(cls,ms){
    hootFig.classList.remove("celebrate","shake");
    void hootFig.offsetWidth;
    hootFig.classList.add(cls);
    setTimeout(function(){ hootFig.classList.remove(cls); },ms||1200);
  }

  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function animalById(id){ for(var i=0;i<ANIMALS.length;i++) if(ANIMALS[i].id===id) return ANIMALS[i]; return null; }
  function confetti(){
    var sr=stage.getBoundingClientRect();
    var cols=["#ff6b5e","#ffc93c","#57cc62","#4fb6e8","#c39bff","#ff8fab"];
    for(var i=0;i<26;i++){
      var c=document.createElement("div"); c.className="confetti";
      c.style.background=cols[i%cols.length];
      c.style.left=(sr.width/2-6)+"px"; c.style.top=(sr.height*0.32)+"px";
      stage.appendChild(c);
      var dx=(Math.random()-0.5)*sr.width*0.8, dy=120+Math.random()*sr.height*0.4, rot=(Math.random()*2-1)*340;
      if(c.animate){
        c.animate([
          {transform:"translate(0,0) rotate(0deg)",opacity:1},
          {transform:"translate("+dx+"px,"+dy+"px) rotate("+rot+"deg)",opacity:0}
        ],{duration:1100+Math.random()*700,easing:"cubic-bezier(.2,.7,.3,1)"});
      }
      (function(el){ setTimeout(function(){ el.remove(); },1900); })(c);
    }
  }

  function updateHUD(){
    starCount.textContent=stars;
    pairText.textContent=pairs+" / "+GOAL;
    for(var i=0;i<pairDots.length;i++) pairDots[i].classList.toggle("on", i<pairs);
  }
  function bumpStars(){ starBank.classList.remove("bump"); void starBank.offsetWidth; starBank.classList.add("bump"); }

  /* Hoot's Memory Echo: a glowing trail from the second card back to its twin. */
  function memoryEcho(fromCard,toCard){
    var pr=playArea.getBoundingClientRect();
    var a=fromCard.getBoundingClientRect(), b=toCard.getBoundingClientRect();
    var x1=a.left-pr.left+a.width/2, y1=a.top-pr.top+a.height/2;
    var x2=b.left-pr.left+b.width/2, y2=b.top-pr.top+b.height/2;
    echoSvg.setAttribute("viewBox","0 0 "+pr.width+" "+pr.height);
    echoSvg.style.width=pr.width+"px"; echoSvg.style.height=pr.height+"px";
    var mx=(x1+x2)/2, my=Math.min(y1,y2)-Math.max(36,Math.abs(x2-x1)*0.22);
    echoSvg.innerHTML="<path d='M"+x1+" "+y1+" Q"+mx+" "+my+" "+x2+" "+y2+"'/><circle r='6'><animateMotion dur='0.85s' repeatCount='2' path='M"+x1+" "+y1+" Q"+mx+" "+my+" "+x2+" "+y2+"'/></circle>";
    clearTimeout(memoryEcho._t);
    memoryEcho._t=setTimeout(function(){ echoSvg.innerHTML=""; },1900);
  }

  function buildDeck(){
    grid.innerHTML=""; seenPos={}; first=null; lock=false;
    var deck=shuffle(ANIMALS.concat(ANIMALS));
    deck.forEach(function(a){
      var card=document.createElement("button");
      card.type="button"; card.className="card";
      card.dataset.animal=a.id;
      card.setAttribute("aria-label","Hidden meadow card");
      card.innerHTML="<span class='inner'><span class='face back'>"+CARD_BACK+"<span class='q'>?</span></span>"+
        "<span class='face front'><span class='animal' aria-hidden='true'>"+a.face+"</span><span class='aname'>"+a.name+"</span></span></span>";
      card.addEventListener("click",function(){ onCardTap(card); });
      grid.appendChild(card);
    });
  }
  function startGame(){
    clearPending(); flipSeq++;
    pairs=0; stars=0; praiseIdx=0;
    winOverlay.hidden=true; startPanel.hidden=true;
    state="playing";
    buildDeck(); updateHUD();
    say("Flip two cards! If they match, the animals stay out to play. Find all <span class='b-an'>6 pairs</span>!");
    enqueue("hoot-game-hello.mp3","hello",null);
  }
  function winGame(){
    state="won";
    clearPending();
    enqueue("hoot-you-learned.mp3","recap",function(){
      say("You found every pair — foxes, bunnies, lions, frogs, butterflies and turtles! What a super memory!");
    });
    winRecap.innerHTML="You found all <b>6 pairs</b>! The whole meadow is out playing — foxes, bunnies, lions, frogs, butterflies and turtles!";
    winChips.innerHTML="";
    ANIMALS.forEach(function(a){ var chip=document.createElement("span"); chip.className="chip"; chip.textContent=a.face; winChips.appendChild(chip); });
    var starEls=winStars.children;
    for(var i=0;i<starEls.length;i++){
      starEls[i].classList.remove("lit");
      (function(el,d){ setTimeout(function(){ el.classList.add("lit"); },d); })(starEls[i],200+i*150);
    }
    (window.__hwFastWin||setTimeout)(function(){ if(state==="won"&&!dead){ winOverlay.hidden=false; confetti(); sparkleSound(); } },300);
  }
  function resetToStart(){
    clearPending(); flipSeq++;
    state="start"; pairs=0; stars=0; first=null; lock=false;
    winOverlay.hidden=true; startPanel.hidden=false;
    grid.innerHTML=""; echoSvg.innerHTML="";
    updateHUD();
    say("Hi! I&rsquo;m Hoot! Tap <span class='b-an'>Play</span> and let&rsquo;s find the animal pairs hiding in my meadow!");
    hootFig.classList.add("wave");
    setTimeout(function(){ hootFig.classList.remove("wave"); },2900);
  }

  var PRAISE=["hoot-great-job.mp3","hoot-amazing.mp3","hoot-star.mp3","hoot-great-thinking.mp3"];
  function remember(card){
    var id=card.dataset.animal;
    if(!seenPos[id]) seenPos[id]=[];
    if(seenPos[id].indexOf(card)<0) seenPos[id].push(card);
  }
  function onCardTap(card){
    if(state!=="playing"||lock||dead) return;
    if(card.classList.contains("up")||card.classList.contains("matched")) return;
    audio();
    flipSound();
    card.classList.add("up");
    card.setAttribute("aria-label",animalById(card.dataset.animal).name+" card");
    remember(card);
    if(!first){
      first=card;
      var a1=animalById(card.dataset.animal);
      say("A <span class='b-an'>"+a1.name+"</span>! "+a1.face+" Can you find the other "+a1.name+"?");
      return;
    }
    var firstCard=first; first=null;
    if(firstCard.dataset.animal===card.dataset.animal){ onMatch(firstCard,card); }
    else { onMiss(firstCard,card); }
  }
  function onMatch(c1,c2){
    lock=true;
    var a=animalById(c2.dataset.animal);
    matchSound();
    (function(){var h=(function(){var P={};try{P=window.parent||{};}catch(e){}return P.HOOT_HAVE||{};})(),w="word-"+a.id;if(h[w]) enqueue(w+".mp3","name","",null);})(); /* 3e44: Hoot names the pair */
    memoryEcho(c2,c1);
    var seq=flipSeq;
    setTimeout(function(){
      if(dead||state!=="playing"||seq!==flipSeq) return;
      c1.classList.add("matched"); c2.classList.add("matched");
      delete seenPos[a.id];
      pairs++; stars++; bumpStars(); updateHUD();
      hootReact("celebrate",1500);
      say("Two <span class='b-an'>"+a.plural+"</span>! "+a.fact+" "+(pairs>=GOAL?"That&rsquo;s every pair!":"<span class='b-an'>"+(GOAL-pairs)+"</span> pair"+(GOAL-pairs===1?"":"s")+" still hiding!"));
      clearPending();
      praiseIdx++;
      enqueue(PRAISE[praiseIdx%PRAISE.length],"praise",null);
      lock=false;
      if(pairs>=GOAL){ lock=true; (window.__hwFastWin||setTimeout)(function(){ if(!dead&&state==="playing") winGame(); },300); }
    },560);
  }
  function onMiss(c1,c2){
    lock=true;
    missSound();
    var seq=++flipSeq;
    var a1=animalById(c1.dataset.animal), a2=animalById(c2.dataset.animal);
    var hintCard=null, hintAnimal=null;
    [a1,a2].forEach(function(a){
      if(hintCard) return;
      var list=seenPos[a.id]||[];
      for(var i=0;i<list.length;i++){
        if(list[i]!==c1&&list[i]!==c2&&!list[i].classList.contains("matched")){ hintCard=list[i]; hintAnimal=a; break; }
      }
    });
    c1.classList.add("wiggle"); c2.classList.add("wiggle");
    hootReact("shake",1100);
    if(hintCard){
      say("Not a pair — a <span class='b-an'>"+a1.name+"</span> and a <span class='b-an'>"+a2.name+"</span>. Remember — the <span class='b-an'>"+hintAnimal.name.toLowerCase()+"</span> was over here!");
      clearPending();
      enqueue("hoot-look-closely.mp3","hint",function(){ if(hintCard) hintCard.classList.add("hintpulse"); });
      setTimeout(function(){ if(hintCard) hintCard.classList.remove("hintpulse"); },1700);
    } else {
      say("Not a pair — a <span class='b-an'>"+a1.name+"</span> and a <span class='b-an'>"+a2.name+"</span>. Remember where they&rsquo;re hiding!");
      var hintPlaying=vCurrent&&vCurrent.kind==="hint";
      var hintPending=vQueue.some(function(q){ return q.kind==="hint"; });
      if(!hintPlaying&&!hintPending) enqueue("hoot-try-again.mp3","hint",null);
    }
    setTimeout(function(){
      if(dead||seq!==flipSeq) return;
      c1.classList.remove("up","wiggle"); c2.classList.remove("up","wiggle");
      c1.setAttribute("aria-label","Hidden meadow card"); c2.setAttribute("aria-label","Hidden meadow card");
      lock=false;
    },1250);
  }

  hootFig.addEventListener("click",function(){
    audio();
    if(state==="playing"){
      say("Tap two cards, superstar! If the animals match, they stay out to play. You have found <span class='b-an'>"+pairs+"</span> of 6 pairs!");
      if(!vPlaying) enqueue("hoot-ask-hoot.mp3","explain",null);
    } else {
      if(!vPlaying) if(window.__hootSpeak) window.__hootSpeak("idle");
      hootReact("celebrate",1100);
    }
  });

  $("sun").addEventListener("click",function(){
    audio(); var s=$("sun"); s.classList.remove("zing"); void s.offsetWidth; s.classList.add("zing");
    sparkleSound();
    if(state==="start") say("That&rsquo;s Mr. Sun, watching over the meadow!");
  });
  document.querySelectorAll(".cloud").forEach(function(c){
    c.addEventListener("click",function(){ audio(); c.classList.add("puff"); poofSound(); setTimeout(function(){ c.classList.remove("puff"); },300); });
  });
  document.querySelectorAll(".bfly").forEach(function(bf){
    bf.addEventListener("click",function(){
      audio(); sparkleSound();
      if(bf.animate) bf.animate([{transform:"rotate(0deg) scale(1)"},{transform:"rotate(360deg) scale(1.25)"}],{duration:560,easing:"ease-in-out"});
      if(state==="playing") say("That butterfly is one of our meadow pairs — but the card butterflies are hiding under the cards!");
    });
  });
  document.querySelectorAll(".flower").forEach(function(f,i){
    f.addEventListener("click",function(){
      audio(); f.classList.add("bloom"); tone(620+i*90,880+i*90,0.16,"sine",0.11);
      setTimeout(function(){ f.classList.remove("bloom"); },580);
    });
  });

  $("soundBtn").addEventListener("click",function(){
    soundOn=!soundOn;
    $("soundOnIc").style.display=soundOn?"block":"none";
    $("soundOffIc").style.display=soundOn?"none":"block";
    $("soundBtn").setAttribute("aria-label",soundOn?"Turn sound off":"Turn sound on");
    if(!soundOn){ clearPending(); }
    else { audio(); tone(660,660,0.1,"triangle",0.12); }
  });
  $("homeBtn").addEventListener("click",function(){ audio(); tone(520,520,0.09,"triangle",0.1); resetToStart(); });
  $("playBtn").addEventListener("click",function(){ audio(); tone(740,740,0.1,"triangle",0.12); startGame(); });
  $("againBtn").addEventListener("click",function(){ audio(); tone(740,740,0.1,"triangle",0.12); startGame(); });
  $("winHomeBtn").addEventListener("click",function(){ audio(); resetToStart(); });

  function teardown(){ dead=true; flipSeq++; clearPending(); hootTalking(false); }
  window.addEventListener("pagehide",teardown);
  document.addEventListener("visibilitychange",function(){ if(document.hidden) clearPending(); });

  updateHUD();
  hootFig.classList.add("wave");
  setTimeout(function(){ hootFig.classList.remove("wave"); },2900);

  /* Probe/debug handle: read-only snapshot of the round state. */
  window.__memoryGame={
    snapshot:function(){
      return { state:state, pairs:pairs, stars:stars, lock:lock,
        upCards:grid.querySelectorAll(".card.up").length,
        matchedCards:grid.querySelectorAll(".card.matched").length,
        totalCards:grid.querySelectorAll(".card").length,
        winShown:!winOverlay.hidden, voicePlaying:vPlaying,
        voiceQueue:vQueue.map(function(q){ return q.file; }) };
    }
  };
})();
</script>
