<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="real";</script>
<script src="js/hoot-game-head.js?v=llprev3e95"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Town Rescue Patrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#141e30; --gold:#ffd43b; --outline:#141e30; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; width:100%; height:100%; overflow:hidden; font-family:"Nunito",system-ui,sans-serif; background:#0284c7; touch-action:none; }

  #stage{
    position:fixed; inset:0; width:100%; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
  }

  /* Full-Screen Illustrated Cartoon Town SVG Backdrop */
  #townSvg{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:1; pointer-events:none;
  }

  /* 60fps Interactive Physics Canvas (Roaring Flames, Pressurized Water Hose Stream, Steam, Foam, Stethoscope, Searchlight) */
  #fxCanvas{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:6; cursor:crosshair; touch-action:none;
  }

  /* Interactive Hotspots Layer (Positioned directly over Building Windows, Roof, Clinic Table, Crosswalk, School Bus) */
  #rescueLayer{
    position:absolute; inset:0; z-index:7; pointer-events:none;
  }
  .fire-zone{
    position:absolute; transform:translate(-50%, -50%);
    width:118px; height:118px; border-radius:50%;
    border:none; background:transparent; cursor:pointer;
    pointer-events:auto; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding:0;
  }
  .zone-meter{
    margin-bottom:-14px;
    width:86px; height:16px; border-radius:999px;
    background:#141e30; border:3px solid #fff;
    overflow:hidden; box-shadow:0 4px 0 rgba(0,0,0,.35);
  }
  .zone-fill{
    height:100%; width:100%;
    background:linear-gradient(90deg, #22c55e 0%, #facc15 50%, #ef4444 100%);
    transition:width .08s linear;
  }
  .zone-badge{
    margin-top:16px;
    background:#fff; color:#141e30;
    border:3px solid #141e30; border-radius:999px;
    padding:2px 10px; font-family:"Fredoka",sans-serif; font-weight:800; font-size:12.5px;
    box-shadow:0 3px 0 #141e30; white-space:nowrap;
  }

  /* Animated Hero Rescue Vehicle on the Town Road */
  #vehicleStage{
    position:absolute; left:7%; bottom:23.5%; z-index:4;
    width:clamp(230px, 34vw, 355px); height:clamp(145px, 22vw, 220px);
    pointer-events:auto; cursor:pointer;
    filter:drop-shadow(0 12px 0 rgba(20,30,48,.35));
    animation:truckIdle .7s ease-in-out infinite alternate;
  }
  #vehicleStage.drive-in{
    animation:driveBounce .55s cubic-bezier(.34,1.6,.5,1);
  }
  #vehicleStage svg{ width:100%; height:100%; overflow:visible; display:block; }
  @keyframes truckIdle{
    from{ transform:translateY(0); }
    to{ transform:translateY(-3px); }
  }
  @keyframes driveBounce{
    0%{ transform:translateX(-240px) scale(.85); }
    65%{ transform:translateX(18px) scale(1.05); }
    100%{ transform:translateX(0) scale(1); }
  }

  /* Helper Friend in Town (Kitten in Window / Teddy Bear at Clinic / Puppy at Crosswalk / Bunny at School) */
  #friendStage{
    position:absolute; right:10%; bottom:26.5%; z-index:4;
    width:clamp(115px, 17vw, 165px); height:clamp(125px, 18vw, 175px);
    pointer-events:auto; cursor:pointer;
    filter:drop-shadow(0 9px 0 rgba(20,30,48,.3));
    animation:friendWave 1.3s ease-in-out infinite alternate;
    transition:left .6s cubic-bezier(.34,1.5,.5,1), right .6s, bottom .6s, transform .4s;
  }
  #friendStage svg{ width:100%; height:100%; overflow:visible; display:block; }
  #friendBadge{
    position:absolute; left:50%; bottom:-10px; transform:translateX(-50%);
    background:#fde047; color:#141e30; border:3.5px solid #141e30; border-radius:999px;
    padding:2px 12px; font-family:"Fredoka",sans-serif; font-weight:800; font-size:14px;
    box-shadow:0 4px 0 #141e30; white-space:nowrap;
  }
  @keyframes friendWave{
    from{ transform:translateY(0) rotate(-3deg); }
    to{ transform:translateY(-8px) rotate(3deg); }
  }

  /* Top HUD */
  #hud{
    position:relative; z-index:10;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:max(10px, env(safe-area-inset-top)) 14px 0 64px;
    pointer-events:none;
  }
  .hud-left{
    display:flex; align-items:center; gap:10px; pointer-events:auto;
    max-width:min(70vw, 660px);
  }
  #hootBtn{
    width:70px; height:70px; flex:0 0 70px;
    border-radius:50%; border:4px solid var(--outline);
    background:radial-gradient(circle at 35% 30%, #fff4b8, #ffc93c 65%, #f09800 100%);
    box-shadow:0 6px 0 var(--outline), 0 10px 20px rgba(0,0,0,.3);
    padding:4px; cursor:pointer;
    animation:hootFloat 2.4s ease-in-out infinite alternate;
  }
  #hootBtn:active{ transform:scale(.92); }
  @keyframes hootFloat{ from{ transform:translateY(0); } to{ transform:translateY(-5px); } }
  #bubble{
    background:#fffef8; color:var(--ink);
    border:4px solid var(--outline); border-radius:22px;
    padding:10px 16px; font-family:"Fredoka",sans-serif; font-weight:700;
    font-size:clamp(14px, 2.2vw, 18.5px); line-height:1.22;
    box-shadow:0 6px 0 var(--outline), 0 10px 20px rgba(0,0,0,.22);
  }
  #bubble b{ color:#e11d48; }

  .hud-right{ display:flex; align-items:center; gap:8px; pointer-events:auto; }
  #starBar{
    display:flex; align-items:center; gap:5px;
    background:#fffef8; border:4px solid var(--outline);
    border-radius:999px; padding:6px 14px;
    box-shadow:0 6px 0 var(--outline);
  }
  .wstar{ font-size:24px; filter:grayscale(1) opacity(.28); transition:transform .3s cubic-bezier(.34,1.8,.5,1), filter .3s; }
  .wstar.on{ filter:none; transform:scale(1.22); }
  #doneBtn{
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:17px;
    padding:8px 16px; cursor:pointer; white-space:nowrap;
    box-shadow:0 6px 0 var(--outline); text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  #doneBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--outline); }

  /* Bottom 3D Rescue Garage Console */
  #rescueDeck{
    position:relative; z-index:10;
    margin:0 auto max(10px, env(safe-area-inset-bottom));
    width:min(96vw, 920px);
    background:linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
    border:5px solid var(--outline); border-radius:30px;
    padding:9px 14px 13px;
    box-shadow:0 10px 0 var(--outline), 0 18px 34px rgba(0,0,0,.45), inset 0 4px 0 rgba(255,255,255,.45);
  }
  .deck-header{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:8px; padding:0 4px;
  }
  .siren-pill{
    background:#141e30; color:#fde047;
    border:3px solid #fde047; border-radius:999px;
    padding:4px 14px; font-family:"Fredoka",sans-serif; font-weight:800;
    font-size:clamp(11.5px, 1.8vw, 14.5px); letter-spacing:.03em;
  }
  .deck-actions{ display:flex; gap:8px; }
  .action-pill-btn{
    border:3.5px solid #141e30; border-radius:999px;
    background:linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:14.5px;
    padding:5px 14px; cursor:pointer; box-shadow:0 4px 0 #141e30; white-space:nowrap;
  }
  #sirenBtn{
    background:linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
    color:#141e30;
  }
  .action-pill-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #141e30; }

  #garageRow{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:10px;
  }
  .bay-btn{
    position:relative; min-height:104px;
    border:4px solid var(--outline); border-radius:22px;
    background:var(--bay-bg);
    box-shadow:0 7px 0 var(--outline), inset 0 4px 0 rgba(255,255,255,.7);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    padding:6px; cursor:pointer;
    transition:transform .16s cubic-bezier(.34,1.8,.5,1), box-shadow .16s;
  }
  .bay-btn:active{ transform:translateY(5px); box-shadow:0 2px 0 var(--outline); }
  .bay-btn.active{
    border-color:#fde047;
    box-shadow:0 0 0 4px #fde047, 0 7px 0 var(--outline), 0 0 22px rgba(253,224,71,.85);
    transform:translateY(-4px);
  }
  .bay-btn[data-role="firefighter"]{ --bay-bg:linear-gradient(180deg, #fee2e2 0%, #fca5a5 100%); }
  .bay-btn[data-role="doctor"]{ --bay-bg:linear-gradient(180deg, #e0f2fe 0%, #7dd3fc 100%); }
  .bay-btn[data-role="police"]{ --bay-bg:linear-gradient(180deg, #e0e7ff 0%, #818cf8 100%); }
  .bay-btn[data-role="teacher"]{ --bay-bg:linear-gradient(180deg, #fef9c3 0%, #fde047 100%); }

  .bay-svg{ width:62px; height:48px; display:block; overflow:visible; filter:drop-shadow(0 3px 0 rgba(20,30,48,.22)); }
  .bay-title{
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:clamp(12.5px, 1.9vw, 16px);
    color:#141e30; background:#fff; border:3px solid #141e30; border-radius:999px;
    padding:2px 10px; box-shadow:0 3px 0 #141e30; white-space:nowrap;
  }

  /* Win Overlay */
  #winOverlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(15,23,42,.72); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .win-card{
    background:linear-gradient(180deg, #fffef8 0%, #fef3c7 100%);
    border:6px solid var(--outline); border-radius:34px;
    padding:26px 24px; text-align:center; max-width:440px; width:100%;
    box-shadow:0 14px 0 var(--outline), 0 26px 50px rgba(0,0,0,.5);
  }
  .win-trophy{ font-size:74px; line-height:1; margin-bottom:8px; }
  .win-card h2{ margin:0 0 8px; font-family:"Fredoka",sans-serif; font-size:34px; color:#141e30; }
  .win-card p{ margin:0 0 18px; font-weight:800; font-size:18px; color:#334155; }
  .big-play{
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:22px;
    padding:12px 32px; cursor:pointer; box-shadow:0 7px 0 var(--outline);
  }

  @media (max-width: 620px){
    #vehicleStage{ left:3%; bottom:24.5%; width:195px; height:125px; }
    #friendStage{ right:4%; bottom:26%; width:102px; height:112px; }
    .bay-btn{ min-height:92px; }
    .bay-svg{ width:50px; height:40px; }
    .fire-zone{ width:96px; height:96px; }
  }
</style>
</head>
<body>
<div id="stage">
  <!-- Full-Screen Cartoon Rescue Town SVG -->
  <svg id="townSvg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop id="skyTop" offset="0%" stop-color="#0284c7"/>
        <stop id="skyBot" offset="100%" stop-color="#bae6fd"/>
      </linearGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#skyG)"/>

    <!-- Smiling Sun & Fluffy Clouds -->
    <g transform="translate(210,125)">
      <circle cx="0" cy="0" r="68" fill="#fde047" opacity=".35"/>
      <circle cx="0" cy="0" r="46" fill="#facc15" stroke="#141e30" stroke-width="6"/>
      <circle cx="-14" cy="-6" r="6.5" fill="#141e30"/><circle cx="14" cy="-6" r="6.5" fill="#141e30"/>
      <path d="M-13 11 Q0 22 13 11" fill="none" stroke="#141e30" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g fill="#ffffff" stroke="#141e30" stroke-width="5.5">
      <path d="M1010 140 A32 32 0 0 1 1040 92 A44 44 0 0 1 1125 88 A34 34 0 0 1 1165 140 Z"/>
      <path d="M430 115 A26 26 0 0 1 455 78 A36 36 0 0 1 525 75 A28 28 0 0 1 555 115 Z"/>
    </g>

    <!-- Green Town Hills -->
    <path d="M0 510 Q380 430 760 495 T1440 480 L1440 900 L0 900 Z" fill="#4ade80" stroke="#141e30" stroke-width="6"/>

    <!-- Main 2-Story Town Building (Windows & Roof catch fire in Firefighter mode, transforms for Clinic / Police / School!) -->
    <g id="townBuilding" transform="translate(720,235)">
      <!-- Building Body -->
      <rect x="-185" y="35" width="370" height="275" rx="16" id="bldgWall" fill="#fef3c7" stroke="#141e30" stroke-width="7"/>
      <!-- Pitched Roof -->
      <polygon points="-210,42 0,-75 210,42" id="bldgRoof" fill="#ef4444" stroke="#141e30" stroke-width="7" stroke-linejoin="round"/>
      <!-- Signboard -->
      <rect x="-125" y="-15" width="250" height="44" rx="12" fill="#ffffff" stroke="#141e30" stroke-width="5.5"/>
      <text id="bldgSign" x="0" y="15" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="800" font-size="23" fill="#141e30">TOWN BAKERY</text>
      <!-- Left Upstairs Window -->
      <rect id="winLeft" x="-140" y="65" width="84" height="78" rx="10" fill="#bae6fd" stroke="#141e30" stroke-width="6"/>
      <line x1="-98" y1="65" x2="-98" y2="143" stroke="#141e30" stroke-width="5"/>
      <line x1="-140" y1="104" x2="-56" y2="104" stroke="#141e30" stroke-width="5"/>
      <!-- Right Upstairs Window -->
      <rect id="winRight" x="56" y="65" width="84" height="78" rx="10" fill="#bae6fd" stroke="#141e30" stroke-width="6"/>
      <line x1="98" y1="65" x2="98" y2="143" stroke="#141e30" stroke-width="5"/>
      <line x1="56" y1="104" x2="140" y2="104" stroke="#141e30" stroke-width="5"/>
      <!-- Center Attic Window -->
      <circle id="winTop" cx="0" cy="-35" r="24" fill="#fde047" stroke="#141e30" stroke-width="5.5"/>
      <!-- Front Double Doors -->
      <path d="M-45 310 L-45 190 A45 45 0 0 1 45 190 L45 310 Z" fill="#fb923c" stroke="#141e30" stroke-width="6.5"/>
      <line x1="0" y1="145" x2="0" y2="310" stroke="#141e30" stroke-width="5"/>
      <!-- Red Fire Hydrant beside Building -->
      <g transform="translate(-245,245)" stroke="#141e30" stroke-width="5" stroke-linejoin="round">
        <rect x="-16" y="20" width="32" height="42" rx="6" fill="#ef4444"/>
        <path d="M-20 20 A20 20 0 0 1 20 20 Z" fill="#dc2626"/>
        <rect x="-24" y="30" width="48" height="12" rx="4" fill="#fde047"/>
        <rect x="-22" y="56" width="44" height="10" rx="4" fill="#b91c1c"/>
      </g>
    </g>

    <!-- Town Road & Crosswalk -->
    <rect x="0" y="545" width="1440" height="175" fill="#334155" stroke="#141e30" stroke-width="6"/>
    <g fill="#facc15">
      <rect x="80" y="626" width="90" height="14" rx="7"/>
      <rect x="260" y="626" width="90" height="14" rx="7"/>
      <rect x="440" y="626" width="90" height="14" rx="7"/>
      <rect x="620" y="626" width="90" height="14" rx="7"/>
      <rect x="800" y="626" width="90" height="14" rx="7"/>
    </g>
    <!-- Zebra Crosswalk on Right -->
    <g fill="#ffffff" stroke="#141e30" stroke-width="3">
      <rect x="1020" y="560" width="140" height="22" rx="6"/>
      <rect x="1020" y="594" width="140" height="22" rx="6"/>
      <rect x="1020" y="628" width="140" height="22" rx="6"/>
      <rect x="1020" y="662" width="140" height="22" rx="6"/>
    </g>
  </svg>

  <!-- Active Rescue Vehicle on the Road -->
  <div id="vehicleStage" role="button" tabindex="0" aria-label="Rescue vehicle"></div>

  <!-- Town Animal Friend Being Helped -->
  <div id="friendStage" role="button" tabindex="0" aria-label="Animal friend">
    <div id="friendSvgWrap"></div>
    <div id="friendBadge">Kitten!</div>
  </div>

  <!-- 60fps Interactive Roaring Fire + Pressurized Water Hose Stream + Steam + Foam Canvas -->
  <canvas id="fxCanvas"></canvas>

  <!-- Interactive Fire / Rescue Zones with Live Progress Bars -->
  <div id="rescueLayer"></div>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-left">
      <button id="hootBtn" type="button" aria-label="Hoot the Owl">
        <svg viewBox="0 0 200 210" aria-hidden="true"><path d="M82 178 L100 205 L118 178 Z" fill="#8a5a33"/><ellipse cx="34" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(14 34 128)"/><ellipse cx="166" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(-14 166 128)"/><ellipse cx="100" cy="118" rx="66" ry="72" fill="#a06a3b"/><ellipse cx="100" cy="140" rx="44" ry="46" fill="#fdeed3"/><path d="M52 44 Q40 14 62 22 Q74 27 70 48 Z" fill="#8a5a33"/><path d="M148 44 Q160 14 138 22 Q126 27 130 48 Z" fill="#8a5a33"/><circle cx="100" cy="72" r="52" fill="#a06a3b"/><ellipse cx="78" cy="74" rx="24" ry="26" fill="#fdeed3"/><ellipse cx="122" cy="74" rx="24" ry="26" fill="#fdeed3"/><circle cx="78" cy="72" r="11" fill="#17324f"/><circle cx="122" cy="72" r="11" fill="#17324f"/><circle cx="82" cy="68" r="4" fill="#fff"/><circle cx="126" cy="68" r="4" fill="#fff"/><circle cx="56" cy="94" r="8" fill="#ffb59d" opacity=".85"/><circle cx="144" cy="94" r="8" fill="#ffb59d" opacity=".85"/><path d="M90 88 Q100 84 110 88 Q106 102 100 104 Q94 102 90 88 Z" fill="#ff9f1c" stroke="#e07f00" stroke-width="1.5"/></svg>
      </button>
      <div id="bubble" aria-live="polite">🚒 <b>FIREFIGHTER!</b> Hold or drag your finger across the <b>burning windows &amp; roof</b> to spray the <b>Fire Hose</b> and put out the fire!</div>
    </div>
    <div class="hud-right">
      <div id="starBar" aria-label="Rescue stars">
        <span class="wstar">⭐</span><span class="wstar">⭐</span><span class="wstar">⭐</span><span class="wstar">⭐</span><span class="wstar">⭐</span>
      </div>
      <button id="doneBtn" type="button">🏆 Done</button>
    </div>
  </div>

  <!-- Bottom 4-Vehicle Rescue Patrol Console -->
  <div id="rescueDeck" role="group" aria-label="Town Rescue Patrol Vehicles">
    <div class="deck-header">
      <span class="siren-pill" id="missionPill">💦 HOLD &amp; AIM THE WATER HOSE ON THE FLAMES TO PUT THEM OUT!</span>
      <div class="deck-actions">
        <button id="hoseBtn" class="action-pill-btn" type="button">💦 Blast Hose!</button>
        <button id="sirenBtn" class="action-pill-btn" type="button">🚨 Siren!</button>
      </div>
    </div>
    <div id="garageRow">
      <button class="bay-btn active choice-btn" type="button" data-role="firefighter" aria-label="Firefighter and Fire Truck">
        <svg class="bay-svg" viewBox="0 0 120 90"><rect x="12" y="28" width="72" height="42" rx="8" fill="#ef4444" stroke="#141e30" stroke-width="5"/><rect x="74" y="38" width="32" height="32" rx="7" fill="#dc2626" stroke="#141e30" stroke-width="5"/><rect x="80" y="43" width="18" height="14" rx="3" fill="#bae6fd" stroke="#141e30" stroke-width="4"/><rect x="18" y="18" width="54" height="8" rx="4" fill="#fde047" stroke="#141e30" stroke-width="4"/><circle cx="78" cy="22" r="7" fill="#38bdf8" stroke="#141e30" stroke-width="4"/><circle cx="34" cy="72" r="13" fill="#1e293b" stroke="#141e30" stroke-width="5"/><circle cx="34" cy="72" r="5" fill="#fde047"/><circle cx="86" cy="72" r="13" fill="#1e293b" stroke="#141e30" stroke-width="5"/><circle cx="86" cy="72" r="5" fill="#fde047"/></svg>
        <span class="bay-title">🚒 Fire Truck</span>
      </button>

      <button class="bay-btn choice-btn" type="button" data-role="doctor" aria-label="Doctor and Ambulance">
        <svg class="bay-svg" viewBox="0 0 120 90"><rect x="14" y="24" width="70" height="46" rx="10" fill="#ffffff" stroke="#141e30" stroke-width="5"/><rect x="76" y="36" width="28" height="34" rx="7" fill="#f8fafc" stroke="#141e30" stroke-width="5"/><rect x="80" y="42" width="16" height="13" rx="3" fill="#bae6fd" stroke="#141e30" stroke-width="4"/><rect x="42" y="34" width="12" height="26" rx="3" fill="#ef4444"/><rect x="35" y="41" width="26" height="12" rx="3" fill="#ef4444"/><circle cx="50" cy="18" r="7" fill="#ef4444" stroke="#141e30" stroke-width="4"/><circle cx="34" cy="72" r="13" fill="#1e293b" stroke="#141e30" stroke-width="5"/><circle cx="86" cy="72" r="13" fill="#1e293b" stroke="#141e30" stroke-width="5"/></svg>
        <span class="bay-title">🚑 Ambulance</span>
      </button>

      <button class="bay-btn choice-btn" type="button" data-role="police" aria-label="Police Officer and Police Car">

      var t = c.currentTime, o = c.createOscillator(), g = c.createGain();

      o.frequency.setValueAtTime(520, t);

      o.frequency.linearRampToValueAtTime(520, t + 0.44);
      o.frequency.linearRampToValueAtTime(860, t + 0.66);
      g.gain.setValueAtTime(0.11, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.72);

      var t = c.currentTime;
      var len = Math.floor(c.sampleRate * 0.14);
      var buf = c.createBuffer(1, len, c.sampleRate);
      var d = buf.getChannelData(0);
      for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.35;
      var src = c.createBufferSource(); src.buffer = buf;
      var flt = c.createBiquadFilter(); flt.type = "bandpass"; flt.frequency.value = 1150; flt.Q.value = 1.2;
      var g = c.createGain();
      g.gain.setValueAtTime(0.1, t);

      src.connect(flt); flt.connect(g); g.connect(c.destination);
      src.start(t);

  }

    try{

      var t = c.currentTime;

      });

    var r = z.el.getBoundingClientRect();

    z.hp = Math.max(0, z.hp - amount);
    z.fillEl.style.width = Math.round(z.hp) + "%";
    spawnSteam(zx, zy, 5);
    sfxWaterSpray();

    if(z.hp <= 0){
      z.el.style.pointerEvents = "none";
      z.badgeEl.textContent = currentRole === "firefighter" ? "✨ Fire Out!" : "✅ All Done!";
      z.badgeEl.style.background = "#4ade80";

      sfxChime();
      setTimeout(function(){ z.el.style.opacity = "0"; }, 350);

    bldgWall.setAttribute("fill", cfg.wall);
    bldgRoof.setAttribute("fill", cfg.roof);
    bldgSign.textContent = cfg.sign;
    hoseBtn.textContent = cfg.btnText;

    vehicleStage.innerHTML = VEHICLE_SVGS[currentRole];
    vehicleStage.classList.remove("drive-in");
    void vehicleStage.offsetWidth;
    vehicleStage.classList.add("drive-in");

    friendSvgWrap.innerHTML = FRIEND_SVGS[cfg.friend];
    friendBadge.textContent = cfg.friendName;

    missionPill.textContent = cfg.pill;
    bubble.innerHTML = cfg.prompt;
    sfxSiren();
    setupZones();
    if(speakIntro !== false){
      playVoice([cfg.nameClip, cfg.teachClip]);
    }
  }

  function getNozzleOrigin(){
    var vr = vehicleStage.getBoundingClientRect();
    return {
      x: vr.left + vr.width * 0.68,
      y: vr.top + vr.height * 0.24
    };
  }

  function emitHoseStream(tx, ty){
    var orig = getNozzleOrigin();
    var dx = tx - orig.x, dy = ty - orig.y;
    var cols = currentRole === "firefighter"
      ? ["#38bdf8", "#7dd3fc", "#e0f2fe", "#ffffff"]
      : currentRole === "doctor"
        ? ["#f472b6", "#7dd3fc", "#ffffff", "#4ade80"]
        : currentRole === "police"
          ? ["#fde047", "#38bdf8", "#ffffff"]
          : ["#fde047", "#4ade80", "#ff4d8d", "#38bdf8"];

    for(var i = 0; i < 5; i++){
      var u = Math.random();
      hoseDrops.push({
        x: orig.x + dx * (u * 0.12),
        y: orig.y + dy * (u * 0.12),
        vx: dx * 0.068 + (Math.random() - 0.5) * 4.2,
        vy: dy * 0.068 - 4.2 + (Math.random() - 0.5) * 4.2,
        r: 6 + Math.random() * 6,
        c: cols[i % cols.length],
        life: 1.0
      });
    }
    sfxWaterSpray();
  }

  /* Continuous Pointer Dragging & Spraying across the Screen */
  canvas.addEventListener("pointerdown", function(e){
    e.preventDefault();
    spraying = true;
    aimX = e.clientX; aimY = e.clientY;
  });
  window.addEventListener("pointermove", function(e){
    if(!spraying) return;
    aimX = e.clientX; aimY = e.clientY;
  });
  window.addEventListener("pointerup", function(){
    spraying = false;
  });

  /* "💦 Blast Hose!" button sprays automatically at the next active fire/zone for easy 1-tap play too! */
  hoseBtn.addEventListener("click", function(){
    var target = activeZones.find(function(z){ return z.hp > 0; });
    if(!target) return;
    var r = target.el.getBoundingClientRect();
    aimX = r.left + r.width / 2;
    aimY = r.top + r.height / 2;
    spraying = true;
    applyHoseToZone(target, 55);
    if(autoSprayTimer) clearTimeout(autoSprayTimer);
    autoSprayTimer = setTimeout(function(){ spraying = false; }, 550);
  });

  bayBtns.forEach(function(b){
    var r = b.getAttribute("data-role");
    var pick = function(e){
      if(e){ e.preventDefault(); e.stopPropagation(); }
      selectRole(r, true);
    };
    b.addEventListener("pointerdown", pick);
    b.addEventListener("click", function(e){ if(e.detail === 0) pick(e); });
  });

  document.getElementById("sirenBtn").addEventListener("click", function(){
    sfxSiren();
    var cfg = ROLES[currentRole];
    playVoice([cfg.nameClip]);
  });
  vehicleStage.addEventListener("click", function(){
    sfxSiren();
    hoseBtn.click();
  });
  friendStage.addEventListener("click", function(){
    var cfg = ROLES[currentRole];
    sfxChime();
    playVoice([cfg.friendClip]);
  });
  document.getElementById("hootBtn").addEventListener("click", function(){
    var cfg = ROLES[currentRole];
    playVoice([cfg.nameClip, cfg.teachClip]);
  });
  document.getElementById("doneBtn").addEventListener("click", function(){
    won = true;
    winOverlay.hidden = false;
    playVoice(["hoot-win-star"]);
  });
  document.getElementById("againBtn").addEventListener("click", function(){
    won = false; stars = 0; winOverlay.hidden = true;
    starEls.forEach(function(el){ el.classList.remove("on"); });
    selectRole("firefighter", true);
  });

  /* ---------- 60fps Roaring Fire + Pressurized Water Hose + Extension Ladder Loop ---------- */
  function drawRoaringFire(zx, zy, scale, index){
    /* Rising Dark Smoke when Fire is Hot */
    if(tick % 4 === 0){
      smokePuffs.push({
        x: zx + (Math.random() - 0.5) * 32 * scale,
        y: zy - 26 * scale,
        vx: (Math.random() - 0.5) * 1.2,
        vy: -1.4 - Math.random() * 1.6,
        r: (14 + Math.random() * 14) * scale,
        white: false,
        life: 0.85
      });
    }
    /* Flying Fire Embers */
    if(tick % 3 === 0){
      flameSparks.push({
        x: zx + (Math.random() - 0.5) * 40 * scale,
        y: zy,
        vx: (Math.random() - 0.5) * 2.2,
        vy: -2.2 - Math.random() * 2.8,
        r: 3.5 + Math.random() * 3.5,
        c: Math.random() < 0.5 ? "#fde047" : "#fb923c",
        life: 1.0
      });
    }

    /* Multi-Tongue Animated Cartoon Roaring Flames */
    ctx.save();
    ctx.translate(zx, zy + 10);
    ctx.scale(scale, scale);
    var sway1 = Math.sin(tick * 0.16 + index) * 9;
    var sway2 = Math.cos(tick * 0.21 + index * 2) * 7;

    /* Outer Red-Orange Flame */
    ctx.fillStyle = "#ef4444";
    ctx.strokeStyle = "#141e30";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-42, 18);
    ctx.quadraticCurveTo(-48, -22, -22 + sway2, -48);
    ctx.quadraticCurveTo(-12, -26, 0 + sway1, -68);
    ctx.quadraticCurveTo(14, -26, 26 - sway2, -46);
    ctx.quadraticCurveTo(48, -18, 42, 18);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    /* Middle Orange Flame */
    ctx.fillStyle = "#fb923c";
    ctx.beginPath();
    ctx.moveTo(-28, 16);
    ctx.quadraticCurveTo(-30, -14, -12 + sway1 * 0.6, -34);
    ctx.quadraticCurveTo(0, -54, 14 + sway2 * 0.6, -32);
    ctx.quadraticCurveTo(30, -12, 28, 16);
    ctx.closePath();
    ctx.fill();

    /* Inner Bright Yellow Core */
    ctx.fillStyle = "#fde047";
    ctx.beginPath();
    ctx.moveTo(-16, 15);
    ctx.quadraticCurveTo(0 + sway1 * 0.4, -32, 16, 15);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawRoleTargetGraphic(z, zx, zy, idx){
    var scale = Math.max(0.28, z.hp / 100);
    if(currentRole === "firefighter"){
      drawRoaringFire(zx, zy, scale, idx);
    } else if(currentRole === "doctor"){
      /* Pulsing Band-Aid & Heart Checkup Spot */
      var pulse = 1 + Math.sin(tick * 0.12 + idx) * 0.08;
      ctx.save();
      ctx.translate(zx, zy);
      ctx.scale(scale * pulse, scale * pulse);
      ctx.rotate(-0.3);
      ctx.fillStyle = "#fda4af";
      ctx.strokeStyle = "#141e30";
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.roundRect(-38, -18, 76, 36, 16); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff1f2";
      ctx.beginPath(); ctx.roundRect(-14, -16, 28, 32, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#e11d48";
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if(currentRole === "police"){
      /* Glowing Safety Beacon */
      var p2 = 1 + Math.sin(tick * 0.14 + idx) * 0.1;
      ctx.save();
      ctx.translate(zx, zy);
      ctx.scale(scale * p2, scale * p2);
      ctx.fillStyle = "#fde047";
      ctx.strokeStyle = "#141e30";
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#22c55e";
      ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    } else {
      /* Golden School Bell */
      var swing = Math.sin(tick * 0.15 + idx) * 0.22;
      ctx.save();
      ctx.translate(zx, zy);
      ctx.scale(scale, scale);
      ctx.rotate(swing);
      ctx.fillStyle = "#facc15";
      ctx.strokeStyle = "#141e30";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, -6, 26, Math.PI, 0);
      ctx.lineTo(32, 22);
      ctx.lineTo(-32, 22);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fb923c";
      ctx.beginPath(); ctx.arc(0, 24, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  function render(){
    tick++;
    ctx.clearRect(0, 0, W, H);

    /* 1. Render Smoke & White Steam Puffs */
    for(var s = smokePuffs.length - 1; s >= 0; s--){
      var sm = smokePuffs[s];
      sm.x += sm.vx; sm.y += sm.vy;
      sm.r += 0.35;
      sm.life -= 0.022;
      if(sm.life <= 0){ smokePuffs.splice(s, 1); continue; }
      ctx.globalAlpha = Math.max(0, sm.life * 0.7);
      ctx.fillStyle = sm.white ? "#ffffff" : "#475569";
      ctx.beginPath(); ctx.arc(sm.x, sm.y, sm.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    /* 2. Render Roaring Flames / Active Rescue Targets */
    activeZones.forEach(function(z, idx){
      if(z.hp <= 0) return;
      var r = z.el.getBoundingClientRect();
      var zx = r.left + r.width / 2, zy = r.top + r.height / 2;
      drawRoleTargetGraphic(z, zx, zy, idx);

      /* If player is spraying near this zone, extinguish/heal it continuously! */
      if(spraying && Math.hypot(aimX - zx, aimY - zy) < 98){
        applyHoseToZone(z, 0.95);
      }
    });

    /* 3. Render Fire Embers */
    for(var f = flameSparks.length - 1; f >= 0; f--){
      var fs = flameSparks[f];
      fs.x += fs.vx; fs.y += fs.vy;
      fs.life -= 0.035;
      if(fs.life <= 0){ flameSparks.splice(f, 1); continue; }
      ctx.globalAlpha = Math.max(0, fs.life);
      ctx.fillStyle = fs.c;
      ctx.beginPath(); ctx.arc(fs.x, fs.y, fs.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    /* 4. Render Continuous Pressurized Water Hose Arc + Droplets when Spraying! */
    if(spraying){
      emitHoseStream(aimX, aimY);
      var orig = getNozzleOrigin();
      ctx.save();
      ctx.strokeStyle = currentRole === "firefighter" ? "rgba(56, 189, 248, 0.75)" : "rgba(253, 224, 71, 0.75)";
      ctx.lineWidth = 18;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(orig.x, orig.y);
      ctx.quadraticCurveTo((orig.x + aimX) * 0.5, Math.min(orig.y, aimY) - 65, aimX, aimY);
      ctx.stroke();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(orig.x, orig.y);
      ctx.quadraticCurveTo((orig.x + aimX) * 0.5, Math.min(orig.y, aimY) - 65, aimX, aimY);
      ctx.stroke();
      ctx.restore();
    }

    for(var w = hoseDrops.length - 1; w >= 0; w--){
      var d = hoseDrops[w];
      d.x += d.vx; d.y += d.vy;
      d.vy += 0.22;
      d.life -= 0.032;
      if(d.life <= 0){ hoseDrops.splice(w, 1); continue; }

      /* Also check if flying water droplets hit any active fire zone! */
      for(var zi = 0; zi < activeZones.length; zi++){
        var az = activeZones[zi];
        if(az.hp > 0){
          var zr = az.el.getBoundingClientRect();
          var azx = zr.left + zr.width / 2, azy = zr.top + zr.height / 2;
          if(Math.hypot(d.x - azx, d.y - azy) < 56){
            applyHoseToZone(az, 0.14);
          }
        }
      }

      ctx.globalAlpha = Math.max(0, d.life);
      ctx.fillStyle = d.c;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    /* 5. Extension Ladder Rescues Kitten when All Fires Are Out! */
    if(waveDone && currentRole === "firefighter"){
      ladderProgress = Math.min(1, ladderProgress + 0.04);
      var origL = getNozzleOrigin();
      var tx = W * 0.5, ty = H * 0.28;
      var ex = origL.x + (tx - origL.x) * ladderProgress;
      var ey = origL.y + (ty - origL.y) * ladderProgress;
      ctx.save();
      ctx.strokeStyle = "#141e30";
      ctx.lineWidth = 16;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(origL.x, origL.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = "#fde047";
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(origL.x, origL.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.restore();
    }

    /* 6. Celebration Pop Sparkles */
    for(var i = popSparks.length - 1; i >= 0; i--){
      var p = popSparks[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.16;
      p.life -= 0.026;
      if(p.life <= 0){ popSparks.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#141e30";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(render);
  }

  selectRole("firefighter", true);
  requestAnimationFrame(render);
})();
</script>
