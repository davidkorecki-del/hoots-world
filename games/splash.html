<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="splash";</script>
<script src="js/hoot-game-head.js?v=llprev3e86"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Thunder Weather Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#141e30}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  [hidden]{display:none !important}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Fredoka","Nunito",system-ui,sans-serif;background:#0f172a;touch-action:none}
  #stage{
    position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
    transition:background .45s ease;
  }
  #stage[data-mode="storm"]{background:linear-gradient(180deg,#0f102e 0%,#1e1b4b 45%,#4c1d95 100%)}
  #stage[data-mode="snow"]{background:linear-gradient(180deg,#1d4ed8 0%,#60a5fa 52%,#e0f2fe 100%)}
  #stage[data-mode="wind"]{background:linear-gradient(180deg,#0284c7 0%,#38bdf8 52%,#fef08a 100%)}
  #stage[data-mode="sun"]{background:linear-gradient(180deg,#0284c7 0%,#7dd3fc 48%,#fef9c3 100%)}

  /* Crisp Pinkfong-Style Vector SVG Town Panorama */
  #townSvg{
    position:absolute;inset:0;width:100%;height:100%;
    z-index:1;pointer-events:none;display:block;
  }
  #windmillSails{
    transform-box:fill-box;transform-origin:center;
    animation:spinMill 7s linear infinite;
  }
  #stage[data-mode="wind"] #windmillSails{animation-duration:1.6s}
  #stage[data-mode="storm"] #windmillSails{animation-duration:3s}
  @keyframes spinMill{to{transform:rotate(360deg)}}

  #svgRainbow{opacity:0;transition:opacity .45s ease}
  #stage[data-mode="sun"] #svgRainbow{opacity:.92}
  .snow-cap{opacity:0;transition:opacity .45s ease}
  #stage[data-mode="snow"] .snow-cap{opacity:1}
  #pondFill{transition:fill .45s ease}
  #stage[data-mode="snow"] #pondFill{fill:#bae6fd}

  /* 60fps Particle & Lightning FX Canvas */
  #weatherCanvas{
    position:absolute;inset:0;width:100%;height:100%;
    z-index:2;display:block;cursor:pointer;touch-action:none;
  }
  #flashOverlay{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(circle,#fff 0%,#fef08a 65%,transparent 100%);
    opacity:0;transition:opacity .08s ease;
  }

  /* Interactive Pinkfong Kawaii SVG Characters & Sky Targets */
  #interactiveLayer{
    position:absolute;left:0;right:0;top:76px;bottom:168px;
    z-index:5;pointer-events:none;overflow:visible;
  }
  .town-actor{
    position:absolute;pointer-events:auto;
    transform:translate(-50%,-50%);
    width:clamp(102px,15vw,146px);height:clamp(102px,15vw,146px);
    border:0;background:none;padding:0;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    filter:drop-shadow(0 8px 14px rgba(10,15,40,.35));
    animation:actorEntrance .42s cubic-bezier(.2,1.55,.4,1) both,actorBob 2.4s ease-in-out infinite;
    transition:transform .16s cubic-bezier(.2,1.6,.4,1);
  }
  .town-actor:active,.town-actor.bouncing{transform:translate(-50%,-62%) scale(1.24) !important}
  .town-actor svg{width:86%;height:86%;display:block;overflow:visible;pointer-events:none}
  .actor-tag{
    margin-top:-4px;background:linear-gradient(180deg,#ffffff 0%,#fff9db 100%);
    border:3px solid var(--ink);border-radius:999px;
    padding:2px 12px;font-size:clamp(.82rem,1.5vw,1.02rem);font-weight:900;
    color:var(--ink);white-space:nowrap;box-shadow:0 4px 0 var(--ink);
    pointer-events:none;
  }

  /* Giant Sky Boss Character (Top-Right) */
  #skyBossBtn{
    position:absolute;right:4%;top:82px;z-index:5;pointer-events:auto;
    width:clamp(112px,16vw,156px);height:clamp(112px,16vw,156px);
    border:0;background:none;padding:0;cursor:pointer;
    filter:drop-shadow(0 10px 20px rgba(10,15,45,.38));
    animation:bossFloat 3s ease-in-out infinite;
    transition:transform .16s ease;
  }
  #skyBossBtn:active{transform:scale(1.18)}
  #skyBossBtn svg{width:100%;height:100%;display:block;overflow:visible}

  /* Top HUD */
  #hud{
    position:relative;z-index:6;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:max(6px,env(safe-area-inset-top)) clamp(10px,2.2vw,22px) 0;
    pointer-events:none;
  }
  .hud-left{display:flex;align-items:center;gap:10px;pointer-events:auto;min-width:0;flex:1}
  #hootBtn{
    flex:none;width:clamp(58px,8.5vw,76px);height:clamp(58px,8.5vw,76px);
    border-radius:50%;border:3.5px solid var(--ink);
    background:radial-gradient(circle at 35% 30%,#fffdf0 0%,#ffe066 65%,#f59f00 100%);
    box-shadow:0 6px 0 var(--ink),0 0 18px rgba(255,212,59,.65);
    padding:5px;cursor:pointer;display:grid;place-items:center;
    animation:bossFloat 2.6s ease-in-out infinite;
  }
  #hootBtn svg{width:100%;height:100%;display:block}
  #bubble{
    background:linear-gradient(180deg,#ffffff 0%,#fff9db 100%);
    border:3.5px solid var(--ink);border-radius:22px;
    padding:8px 16px;font-size:clamp(.95rem,2vw,1.26rem);font-weight:800;
    color:var(--ink);line-height:1.22;
    box-shadow:0 6px 0 var(--ink),0 12px 24px rgba(10,20,50,.32);
    max-width:580px;
  }
  #bubble b{color:#e8590c}
  #starBar{
    flex:none;pointer-events:auto;
    display:flex;align-items:center;gap:5px;
    background:rgba(255,255,255,.94);border:3.5px solid var(--ink);
    border-radius:999px;padding:5px 14px;
    box-shadow:0 6px 0 var(--ink);font-weight:900;
  }
  .wstar{font-size:1.35rem;filter:grayscale(1) opacity(.3);transition:transform .3s cubic-bezier(.2,1.6,.4,1),filter .3s}
  .wstar.on{filter:none;transform:scale(1.22)}

  /* Bottom 3D Pinkfong Toy Weather Contraption Console */
  #machineDeck{
    position:relative;z-index:6;
    margin:0 auto max(8px,env(safe-area-inset-bottom));
    width:min(96vw,920px);
    background:linear-gradient(180deg,#38bdf8 0%,#2563eb 52%,#1e3a8a 100%);
    border:4.5px solid var(--ink);border-radius:34px;
    padding:10px clamp(10px,2vw,20px) 14px;
    box-shadow:
      inset 0 6px 0 rgba(255,255,255,.65),
      inset 0 -6px 0 rgba(0,0,0,.35),
      0 10px 0 #0f172a,
      0 20px 40px rgba(0,0,0,.55);
  }
  .deck-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 6px}
  .gauge-pill{
    display:flex;align-items:center;gap:8px;
    background:#0f172a;border:3px solid var(--ink);border-radius:999px;
    padding:3px 16px;color:#ffd43b;font-weight:900;font-size:clamp(.82rem,1.5vw,1rem);
  }
  .led-row{display:flex;gap:7px}
  .led{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:#ffd43b;box-shadow:0 0 10px #ffd43b;animation:ledPulse .9s ease-in-out infinite alternate}
  .led:nth-child(2){background:#ff4d6d;box-shadow:0 0 10px #ff4d6d;animation-delay:.25s}
  .led:nth-child(3){background:#4ade80;box-shadow:0 0 10px #4ade80;animation-delay:.5s}
  .led:nth-child(4){background:#c084fc;box-shadow:0 0 10px #c084fc;animation-delay:.75s}

  #consoleRow{display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;gap:clamp(6px,1.5vw,14px);align-items:stretch}
  .lever-bay{
    position:relative;
    min-height:clamp(104px,16.5vh,142px);
    border:4px solid var(--ink);border-radius:24px;
    background:linear-gradient(180deg,#ffffff 0%,var(--c1) 48%,var(--c2) 100%);
    box-shadow:inset 0 5px 0 rgba(255,255,255,.95),0 8px 0 var(--ped),0 12px 0 var(--ink);
    padding:6px 4px 8px;cursor:pointer;font-family:inherit;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    touch-action:none;transition:translate .14s ease,box-shadow .14s ease;
  }
  .lever-bay[data-w="storm"]{--c1:#e0e7ff;--c2:#818cf8;--ped:#4338ca}
  .lever-bay[data-w="snow"]{--c1:#e0f2fe;--c2:#38bdf8;--ped:#0369a1}
  .lever-bay[data-w="wind"]{--c1:#dcfce7;--c2:#4ade80;--ped:#15803d}
  .lever-bay[data-w="sun"]{--c1:#fef9c3;--c2:#facc15;--ped:#ca8a04}

  .lever-head{display:flex;align-items:center;gap:4px;font-weight:900;font-size:clamp(.82rem,1.6vw,1.05rem)}
  .lever-head span{font-size:clamp(1.35rem,2.6vw,1.8rem);line-height:1}
  .slot-rail{
    position:relative;width:24px;height:clamp(50px,8.5vh,72px);
    border-radius:999px;background:#0f172a;border:3.5px solid var(--ink);
    box-shadow:inset 0 4px 8px rgba(0,0,0,.85);margin:2px 0;
  }
  .slot-fill{
    position:absolute;left:0;right:0;top:0;height:20%;border-radius:999px;
    background:linear-gradient(180deg,#4ade80,#16a34a);transition:height .18s ease;
  }
  .tbar-handle{
    position:absolute;left:50%;top:0%;transform:translate(-50%,-20%);
    width:clamp(54px,8.5vw,76px);height:26px;border-radius:999px;
    background:linear-gradient(180deg,#ff758f 0%,#ff4d6d 50%,#c9184a 100%);
    border:3.5px solid var(--ink);
    box-shadow:inset 0 4px 0 rgba(255,255,255,.75),0 5px 0 var(--ink),0 8px 14px rgba(0,0,0,.4);
    transition:top .18s cubic-bezier(.2,1.55,.4,1),background .2s;
    display:flex;align-items:center;justify-content:center;
  }
  .tbar-handle::after{content:"";width:55%;height:5px;border-radius:99px;background:rgba(255,255,255,.75)}
  .lever-bay.pulled{
    translate:0 5px;
    box-shadow:inset 0 5px 0 #fff,0 3px 0 var(--ped),0 6px 0 var(--ink),0 0 0 5px #ffd43b,0 0 22px rgba(255,212,59,.85);
  }
  .lever-bay.pulled .tbar-handle{top:76%;background:linear-gradient(180deg,#86efac 0%,#22c55e 52%,#15803d 100%)}
  .lever-bay.pulled .slot-fill{height:85%}
  .lever-hint{font-size:.74rem;font-weight:900;opacity:.82}

  #turboBtn{
    min-height:clamp(104px,16.5vh,142px);
    border:4.5px solid var(--ink);border-radius:30px;
    background:radial-gradient(circle at 38% 28%,#fff0f3 0%,#ff4d6d 38%,#c9184a 78%,#800f2f 100%);
    box-shadow:inset 0 7px 0 rgba(255,255,255,.7),0 10px 0 #590d22,0 14px 0 var(--ink),0 0 26px rgba(255,77,109,.75);
    color:#fff;font-family:inherit;font-weight:900;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:8px 6px;text-shadow:0 2px 0 var(--ink);
    animation:turboPulse 1.4s ease-in-out infinite;touch-action:manipulation;
  }
  #turboBtn:active{translate:0 8px;box-shadow:0 2px 0 #590d22,0 5px 0 var(--ink)}
  #turboBtn .tb-ico{font-size:clamp(2.1rem,4.5vw,2.9rem);line-height:1}
  #turboBtn .tb-txt{font-size:clamp(.85rem,1.7vw,1.1rem);line-height:1.1;text-align:center}

  #winOverlay{
    position:fixed;inset:0;z-index:20;
    background:rgba(15,23,42,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .win-card{
    width:min(92vw,480px);background:linear-gradient(180deg,#ffffff 0%,#fff9db 100%);
    border:5px solid var(--ink);border-radius:36px;padding:24px 20px;text-align:center;
    box-shadow:0 12px 0 var(--ink),0 24px 48px rgba(0,0,0,.45);
  }
  .win-trophy{font-size:5rem;line-height:1;margin:0 0 8px}
  .win-card h2{margin:0 0 6px;font-size:2rem;color:var(--ink)}
  .win-card p{margin:0 0 16px;font-size:1.12rem;font-weight:800;color:#334155}
  .big-play{
    min-height:66px;min-width:200px;padding:12px 28px;border-radius:999px;
    border:4px solid var(--ink);background:linear-gradient(180deg,#ffe066 0%,#fab005 100%);
    color:var(--ink);font-family:inherit;font-size:1.32rem;font-weight:900;
    box-shadow:0 7px 0 var(--ink);cursor:pointer;
  }

  @keyframes bossFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes actorBob{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-8px)}}
  @keyframes actorEntrance{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes ledPulse{from{opacity:.4;transform:scale(.9)}to{opacity:1;transform:scale(1.12)}}
  @keyframes turboPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
</style>

<body>
<div id="stage" data-mode="storm">
  <!-- Crisp Pinkfong-Style Vector Illustrated Town Scene -->
  <svg id="townSvg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <!-- 7-Band Glowing Rainbow Bridge (Sunshine Mode) -->
    <g id="svgRainbow" transform="translate(720,580)" fill="none" stroke-linecap="round">
      <path d="M-560,0 A560,520 0 0,1 560,0" stroke="#ff4d6d" stroke-width="24"/>
      <path d="M-536,0 A536,496 0 0,1 536,0" stroke="#fb923c" stroke-width="24"/>
      <path d="M-512,0 A512,472 0 0,1 512,0" stroke="#facc15" stroke-width="24"/>
      <path d="M-488,0 A488,448 0 0,1 488,0" stroke="#4ade80" stroke-width="24"/>
      <path d="M-464,0 A464,424 0 0,1 464,0" stroke="#38bdf8" stroke-width="24"/>
      <path d="M-440,0 A440,400 0 0,1 440,0" stroke="#818cf8" stroke-width="24"/>
      <path d="M-416,0 A416,376 0 0,1 416,0" stroke="#e879f9" stroke-width="24"/>
    </g>

    <!-- Rolling Hills -->
    <path d="M0 555 Q340 465 720 535 T1440 520 L1440 900 L0 900 Z" fill="#4ade80" stroke="#141e30" stroke-width="6"/>
    <path class="snow-cap" d="M0 555 Q340 465 720 535 T1440 520 L1440 900 L0 900 Z" fill="#e2e8f0" stroke="#141e30" stroke-width="6"/>
    <path d="M0 600 Q520 535 1440 585 L1440 900 L0 900 Z" fill="#22c55e" stroke="#141e30" stroke-width="6"/>
    <path class="snow-cap" d="M0 600 Q520 535 1440 585 L1440 900 L0 900 Z" fill="#f8fafc" stroke="#141e30" stroke-width="6"/>

    <!-- Town Pond / Frozen Ice Rink (Right) -->
    <ellipse id="pondFill" cx="1080" cy="615" rx="210" ry="44" fill="#0284c7" stroke="#141e30" stroke-width="6"/>
    <path d="M950 606 Q1040 598 1160 608" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".65"/>

    <!-- Illustrated Red Barn & Silo (Left) -->
    <g transform="translate(150,415)">
      <rect x="-46" y="30" width="44" height="125" rx="6" fill="#e2e8f0" stroke="#141e30" stroke-width="6"/>
      <path d="M-48 34 A24 24 0 0 1 -2 34 Z" fill="#ef4444" stroke="#141e30" stroke-width="6"/>
      <rect x="0" y="45" width="136" height="110" rx="8" fill="#ef4444" stroke="#141e30" stroke-width="6"/>
      <polygon points="-16,48 22,2 68,-18 114,2 152,48" fill="#b91c1c" stroke="#141e30" stroke-width="6" stroke-linejoin="round"/>
      <polygon class="snow-cap" points="-16,48 22,2 68,-18 114,2 152,48" fill="#ffffff" stroke="#141e30" stroke-width="6" stroke-linejoin="round"/>
      <rect x="48" y="12" width="40" height="28" rx="6" fill="#fde047" stroke="#141e30" stroke-width="5"/>
      <rect x="36" y="82" width="64" height="73" rx="6" fill="#7f1d1d" stroke="#141e30" stroke-width="5"/>
      <line x1="36" y1="82" x2="100" y2="155" stroke="#fff" stroke-width="5"/>
      <line x1="100" y1="82" x2="36" y2="155" stroke="#fff" stroke-width="5"/>
    </g>

    <!-- Cozy Storybook Bakery Cottage (Center-Left) -->
    <g transform="translate(510,435)">
      <rect x="108" y="-36" width="26" height="58" rx="4" fill="#ea580c" stroke="#141e30" stroke-width="6"/>
      <rect x="0" y="25" width="144" height="110" rx="10" fill="#fef3c7" stroke="#141e30" stroke-width="6"/>
      <polygon points="-18,28 72,-34 162,28" fill="#8b5cf6" stroke="#141e30" stroke-width="6" stroke-linejoin="round"/>
      <polygon class="snow-cap" points="-18,28 72,-34 162,28" fill="#ffffff" stroke="#141e30" stroke-width="6" stroke-linejoin="round"/>
      <rect x="18" y="48" width="32" height="32" rx="6" fill="#fde047" stroke="#141e30" stroke-width="5"/>
      <rect x="94" y="48" width="32" height="32" rx="6" fill="#fde047" stroke="#141e30" stroke-width="5"/>
      <path d="M56 135 L56 86 A16 16 0 0 1 88 86 L88 135 Z" fill="#f43f5e" stroke="#141e30" stroke-width="5"/>
    </g>

    <!-- 3D Lattice Windmill (Center-Right) -->
    <g transform="translate(830,410)">
      <polygon points="-42,165 -22,25 22,25 42,165" fill="#f43f5e" stroke="#141e30" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-26 28 A26 26 0 0 1 26 28 Z" fill="#fde047" stroke="#141e30" stroke-width="6"/>
      <g transform="translate(0,36)">
        <g id="windmillSails">
          <rect x="-10" y="-92" width="20" height="82" rx="6" fill="#fef08a" stroke="#141e30" stroke-width="5"/>
          <rect x="-10" y="10" width="20" height="82" rx="6" fill="#fef08a" stroke="#141e30" stroke-width="5"/>
          <rect x="-92" y="-10" width="82" height="20" rx="6" fill="#fef08a" stroke="#141e30" stroke-width="5"/>
          <rect x="10" y="-10" width="82" height="20" rx="6" fill="#fef08a" stroke="#141e30" stroke-width="5"/>
          <circle cx="0" cy="0" r="15" fill="#fb923c" stroke="#141e30" stroke-width="5"/>
        </g>
      </g>
    </g>
  </svg>

  <canvas id="weatherCanvas"></canvas>
  <div id="flashOverlay"></div>
  <button id="skyBossBtn" type="button" aria-label="Tap Sky Weather Boss"></button>
  <div id="interactiveLayer"></div>

  <div id="hud">
    <div class="hud-left">
      <button id="hootBtn" type="button" aria-label="Hoot the Owl">
        <svg viewBox="0 0 200 210" aria-hidden="true"><path d="M82 178 L100 205 L118 178 Z" fill="#8a5a33"/><ellipse cx="34" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(14 34 128)"/><ellipse cx="166" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(-14 166 128)"/><ellipse cx="100" cy="118" rx="66" ry="72" fill="#a06a3b"/><ellipse cx="100" cy="140" rx="44" ry="46" fill="#fdeed3"/><path d="M52 44 Q40 14 62 22 Q74 27 70 48 Z" fill="#8a5a33"/><path d="M148 44 Q160 14 138 22 Q126 27 130 48 Z" fill="#8a5a33"/><circle cx="100" cy="72" r="52" fill="#a06a3b"/><ellipse cx="78" cy="74" rx="24" ry="26" fill="#fdeed3"/><ellipse cx="122" cy="74" rx="24" ry="26" fill="#fdeed3"/><circle cx="78" cy="72" r="11" fill="#17324f"/><circle cx="122" cy="72" r="11" fill="#17324f"/><circle cx="82" cy="68" r="4" fill="#fff"/><circle cx="126" cy="68" r="4" fill="#fff"/><circle cx="56" cy="94" r="8" fill="#ffb59d" opacity=".85"/><circle cx="144" cy="94" r="8" fill="#ffb59d" opacity=".85"/><path d="M90 88 Q100 84 110 88 Q106 102 100 104 Q94 102 90 88 Z" fill="#ff9f1c" stroke="#e07f00" stroke-width="1.5"/></svg>
      </button>
      <div id="bubble" aria-live="polite">Pull a lever down — then <b>tap the characters & sky</b>!</div>
    </div>
    <div id="starBar" aria-label="Weather stars">
      <span class="wstar">⭐</span><span class="wstar">⭐</span><span class="wstar">⭐</span><span class="wstar">⭐</span><span class="wstar">⭐</span>
    </div>
  </div>

  <button id="playBtn" type="button" hidden>▶ Play</button>

  <div id="machineDeck" role="group" aria-label="Thunder Weather Machine">
    <div class="deck-top">
      <div class="led-row"><i class="led"></i><i class="led"></i><i class="led"></i><i class="led"></i></div>
      <div class="gauge-pill"><span id="gaugeTxt">⛈️ THUNDER STORM</span></div>
      <div class="led-row"><i class="led"></i><i class="led"></i><i class="led"></i><i class="led"></i></div>
    </div>
    <div id="consoleRow">
      <button type="button" class="lever-bay lever-btn" data-w="storm" aria-label="Thunder Storm lever">
        <div class="lever-head"><span aria-hidden="true">⛈️</span>Storm</div>
        <div class="slot-rail"><div class="slot-fill"></div><div class="tbar-handle"></div></div>
        <div class="lever-hint">PULL DOWN</div>
      </button>
      <button type="button" class="lever-bay lever-btn" data-w="snow" aria-label="Snow blizzard lever">
        <div class="lever-head"><span aria-hidden="true">❄️</span>Snow</div>

  /* ---------- Voice & Sound Engine ---------- */
  var voiceA = new Audio();
  function playVoice(clips){
    if(!clips || !clips.length) return;
    var i = 0;
    function step(){
      if(i >= clips.length) return;
      voiceA.src = "assets/voice/" + clips[i++] + ".mp3";
      voiceA.onended = step; voiceA.onerror = step;
      var p = voiceA.play(); if(p && p.catch) p.catch(function(){});
    }
    step();
  }
  var actx = null;
  function ac(){
    if(!actx){ var A = window.AudioContext || window.webkitAudioContext; if(A) actx = new A(); }
    if(actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function sfxClunk(){
    try{
      var c = ac(); if(!c) return; var t = c.currentTime;
      var o = c.createOscillator(), g = ac.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(520, t + 0.18);
      g.gain.setValueAtTime(0.24, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.23);
    }catch(e){}
  }
  function sfxThunder(){
    try{
      var c = ac(); if(!c) return; var t = c.currentTime;
      var b = c.createBuffer(1, c.sampleRate * 0.95, c.sampleRate), d = b.getChannelData(0);
      for(var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (c.sampleRate * 0.34));
      var s = c.createBufferSource(); s.buffer = b;
      var f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 180;
      var g = ac.createGain(); g.gain.setValueAtTime(0.65, t); g.gain.exponentialRampToValueAtTime(0.008, t + 0.92);
      s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
    }catch(e){}
  }
  function sfxNotes(arr){
    try{
      var c = ac(); if(!c) return;
      (arr || [523, 659, 784, 1046]).forEach(function(fr, i){
        var t = c.currentTime + i * 0.07;
        var o = c.createOscillator(), g = ac.createGain();
        o.type = "triangle"; o.frequency.value = fr;
        g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.28);
      });
    }catch(e){}
  }

  var WEATHERS = {
    storm: {

  var curW = "storm", stars = 0, won = false, tick = 0;
  var bolts = [], weatherParts = [], popSparks = [], screenSplats = [];

  function resetParticles(mode){
    weatherParts = [];
    var n = mode === "storm" ? 150 : mode === "snow" ? 130 : mode === "wind" ? 65 : 40;
    for(var i = 0; i < n; i++){
      weatherParts.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: mode === "wind" ? (7 + Math.random() * 7) : mode === "storm" ? -3.5 : (Math.random() - 0.5) * 1.8,

        r: mode === "snow" ? (3.5 + Math.random() * 5.5) : (2.5 + Math.random() * 3.5),
        p: Math.random() * 6.28,
        c: ["#ffd43b", "#ff4d6d", "#38bdf8", "#4ade80", "#e879f9"][i % 5]
      });
    }
  }

  function strikeLightning(tx, ty){
    var sx = W * 0.5 + (Math.random() - 0.5) * W * 0.4;
    var sy = H * 0.12;
    var ex = tx != null ? tx : W * (0.2 + Math.random() * 0.6);
    var ey = ty != null ? Math.min(ty, H * 0.64) : H * 0.58;
    var pts = [{ x: sx, y: sy }];
    for(var i = 1; i < 8; i++){
      var u = i / 8;
      pts.push({ x: sx + (ex - sx) * u + (Math.random() - 0.5) * 65, y: sy + (ey - sy) * u });
    }
    pts.push({ x: ex, y: ey });
    bolts.push({ pts: pts, life: 1.0 });
    spawnSparks(ex, ey, "#fde047", 28);
    flashEl.style.opacity = "0.75";
    setTimeout(function(){ flashEl.style.opacity = "0"; }, 95);
    sfxThunder();
  }

  function spawnSparks(x, y, col, count){
    for(var i = 0; i < (count || 24); i++){
      var a = (Math.PI * 2 * i) / (count || 24) + Math.random() * 0.3;
      var sp = 3 + Math.random() * 7;
      popSparks.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.5,
        r: 4 + Math.random() * 4.5,
        c: col || ["#ffd43b", "#ff4d6d", "#38bdf8", "#4ade80", "#f472b6"][i % 5],
        life: 1.0
      });
    }
  }

  function awardStar(){
    if(won) return;
    stars = Math.min(5, stars + 1);
    starEls.forEach(function(el, i){ el.classList.toggle("on", i < stars); });
    if(stars >= 5){
      won = true;
      setTimeout(function(){
        winOverlay.hidden = false;
        sfxNotes([523, 659, 784, 1046, 1318]);
        playVoice(["hoot-win-yay"]);
      }, 1200);
    }
  }

  function renderInteractiveActors(key){
    var cfg = WEATHERS[key];
    skyBossBtn.innerHTML = SPRITES[cfg.boss] || SPRITES.boss_sun;
    interactiveLayer.innerHTML = "";
    (cfg.actors || []).forEach(function(a, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "town-actor";
      b.style.left = a.x;
      b.style.top = a.y;
      b.style.animationDelay = "0s, " + (-i * 0.7) + "s";
      b.innerHTML = (SPRITES[a.sp] || SPRITES.flower) + '<span class="actor-tag">' + a.label + "</span>";
      var hit = function(e){
        if(e){ e.preventDefault(); e.stopPropagation(); }
        var r = b.getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        b.classList.add("bouncing");
        setTimeout(function(){ b.classList.remove("bouncing"); }, 260);
        spawnSparks(cx, cy, null, 28);
        if(a.lightning || curW === "storm") strikeLightning(cx, cy);
        else if(a.snowSplat){
          screenSplats.push({ x: cx, y: cy - 40, r: 36, life: 1.0 });
          sfxNotes([659, 880, 1174]);
        } else {
          sfxNotes([523, 659, 784, 1046]);
        }
        playVoice([a.clip]);
        awardStar();
      };
      b.addEventListener("pointerdown", hit);
      b.addEventListener("click", function(e){ if(e.detail === 0) hit(e); });
      interactiveLayer.appendChild(b);
    });
  }

  function activateWeather(key, countStar){
    curW = key;
    stage.setAttribute("data-mode", key);
    sfxClunk();
    leverBtns.forEach(function(b){ b.classList.toggle("pulled", b.getAttribute("data-w") === key); });
    var cfg = WEATHERS[key];
    gaugeTxt.textContent = cfg.gauge;
    bubble.innerHTML = cfg.msg;
    resetParticles(key);
    renderInteractiveActors(key);

    if(key === "storm") strikeLightning(W * 0.48, H * 0.54);
    else if(key === "snow") sfxNotes([659, 784, 1046, 1318]);
    else if(key === "wind") sfxNotes([587, 740, 880, 1174]);
    else sfxNotes([523, 659, 784, 1046, 1318]);

    if(countStar){
      playVoice(cfg.clips);
      awardStar();
    }
  }

      if(e) e.preventDefault();
      activateWeather(key, true);
    };
    b.addEventListener("pointerdown", pull);
    b.addEventListener("click", function(e){ if(e.detail === 0) pull(e); });

    if(e) e.preventDefault();

      setTimeout(function(){ strikeLightning(W * 0.72, H * 0.54); }, 150);

        screenSplats.push({ x: W * (0.25 + s * 0.25), y: H * (0.28 + (s % 2) * 0.14), r: 38, life: 1.0 });
      }
    } else {
      spawnSparks(W * 0.5, H * 0.35, null, 42);
    }
  };
  turboBtn.addEventListener("pointerdown", fireTurbo);
  turboBtn.addEventListener("click", function(e){ if(e.detail === 0) fireTurbo(e); });

  skyBossBtn.addEventListener("pointerdown", function(e){
    e.preventDefault(); e.stopPropagation();
    var r = skyBossBtn.getBoundingClientRect();
    spawnSparks(r.left + r.width / 2, r.top + r.height / 2, "#fde047", 30);
    if(curW === "storm") strikeLightning(W * 0.5, H * 0.55);
    else sfxNotes([659, 784, 1046, 1318]);
    playVoice(["owl-excited"]);
    awardStar();
  });

  canvas.addEventListener("pointerdown", function(e){
    var x = e.clientX, y = e.clientY;
    spawnSparks(x, y, null, 24);
    if(curW === "storm") strikeLightning(x, y);
    else if(curW === "snow"){
      screenSplats.push({ x: x, y: y, r: 34, life: 1.0 });
      sfxNotes([784, 1046]);
    } else {
      var scale = [523, 587, 659, 698, 784, 880, 987, 1046];
      sfxNotes([scale[Math.floor((x / Math.max(1, W)) * scale.length) % scale.length]]);
    }
  });

  function startGame(){
    won = false; stars = 0; winOverlay.hidden = true;
    starEls.forEach(function(el){ el.classList.remove("on"); });
    activateWeather("storm", false);
    playVoice(["hoot-game-hello"]);
  }
  document.getElementById("againBtn").addEventListener("click", startGame);
  document.getElementById("playBtn").addEventListener("click", startGame);
  document.getElementById("hootBtn").addEventListener("click", function(){ playVoice(["hoot-giggle"]); });

  /* ---------- 60fps Particle, Lightning & Snowball Splat Canvas Loop ---------- */
  function render(){
    tick++;
    ctx.clearRect(0, 0, W, H);

    /* Weather Particles */
    weatherParts.forEach(function(p){
      p.x += p.vx; p.y += p.vy;
      if(p.y > H) p.y = -10;
      if(p.x > W) p.x = -10;
      if(p.x < -10) p.x = W + 10;

      if(curW === "storm"){
        ctx.strokeStyle = "rgba(186, 230, 253, 0.88)"; ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 6, p.y + 22); ctx.stroke();
      } else if(curW === "snow"){
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(p.x + Math.sin(tick * 0.04 + p.p) * 1.8, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      } else if(curW === "wind"){
        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)"; ctx.lineWidth = 3.2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.quadraticCurveTo(p.x + 28, p.y - 10, p.x + 56, p.y); ctx.stroke();
      } else {
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
    });

    /* Forked Neon Lightning Bolts */
    for(var i = bolts.length - 1; i >= 0; i--){
      var bl = bolts[i];
      ctx.save();
      ctx.strokeStyle = "rgba(254, 240, 138, " + bl.life + ")";
      ctx.lineWidth = 9;
      ctx.shadowColor = "#facc15"; ctx.shadowBlur = 26;
      ctx.beginPath();
      bl.pts.forEach(function(pt, j){ if(j === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
      ctx.stroke();
      ctx.restore();
      bl.life -= 0.065;
      if(bl.life <= 0) bolts.splice(i, 1);
    }

    /* Screen Snowball Splats */
    for(var s = screenSplats.length - 1; s >= 0; s--){
      var sp = screenSplats[s];
      sp.life -= 0.016;
      if(sp.life <= 0){ screenSplats.splice(s, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.min(1, sp.life * 1.4);
      ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#bae6fd"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      for(var d = 0; d < 7; d++){
        var da = (d / 7) * Math.PI * 2;
        ctx.beginPath(); ctx.arc(sp.x + Math.cos(da) * sp.r * 0.92, sp.y + Math.sin(da) * sp.r * 0.92, sp.r * 0.35, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    /* Pop Sparks */
    for(var k = popSparks.length - 1; k >= 0; k--){
      var pk = popSparks[k];
      pk.x += pk.vx; pk.y += pk.vy; pk.vy += 0.22; pk.life -= 0.035;
      if(pk.life <= 0){ popSparks.splice(k, 1); continue; }
      ctx.fillStyle = pk.c; ctx.globalAlpha = pk.life;
      ctx.beginPath(); ctx.arc(pk.x, pk.y, pk.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(render);
  }

  startGame();
  requestAnimationFrame(render);
})();
</script>
