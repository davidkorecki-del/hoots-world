<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="splash";</script>
<script src="js/hoot-game-head.js?v=llprev3e100"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Thunder Weather Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#141e30}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  [hidden]{display:none !important}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Fredoka","Nunito",system-ui,sans-serif;background:#0f172a;touch-action:none}
  #stage{
    position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
  }

  /* Crisp Pinkfong-Style Vector SVG Town Panorama */
  #townSvg{
    position:absolute;inset:0;width:100%;height:100%;
    z-index:1;pointer-events:none;display:block;
  }

  /* 60fps Particle & Lightning FX Canvas */
  #weatherCanvas{
    position:absolute;inset:0;width:100%;height:100%;
    z-index:2;display:block;cursor:pointer;touch-action:none;
  }
  #flashOverlay{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(circle,#fff 0%,#fef08a 65%,transparent 100%);
    opacity:0;transition:opacity .08s ease;
  }

  /* Interactive Pinkfong Kawaii SVG Characters in the Town & Sky */
  #interactiveLayer{
    position:absolute;left:0;right:0;top:72px;bottom:215px;
    z-index:5;pointer-events:none;overflow:visible;
  }
  .town-actor{
    position:absolute;pointer-events:auto;
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    width:clamp(98px,14vw,138px);height:clamp(98px,14vw,138px);
    border:0;background:none;padding:0;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    filter:drop-shadow(0 8px 14px rgba(10,15,40,.35));
    transition:transform .28s cubic-bezier(.2,1.5,.4,1),opacity .25s ease;
  }
  .town-actor.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    animation:actorBob 2.4s ease-in-out infinite;
  }
  .town-actor:active,.town-actor.bouncing{
    transform:translate(-50%,-64%) scale(1.24) !important;
  }
  .town-actor svg{width:86%;height:86%;display:block;overflow:visible;pointer-events:none}
  .actor-tag{
    margin-top:-4px;background:linear-gradient(180deg,#ffffff 0%,#fff9db 100%);
    border:3px solid var(--ink);border-radius:999px;
    padding:2px 11px;font-size:clamp(.78rem,1.4vw,.96rem);font-weight:900;
    color:var(--ink);white-space:nowrap;box-shadow:0 4px 0 var(--ink);
    pointer-events:none;
  }

  /* Top HUD */
  #hud{
    position:relative;z-index:6;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:max(6px,env(safe-area-inset-top)) clamp(10px,2.2vw,22px) 0;
    pointer-events:none;
  }
  .hud-left{display:flex;align-items:center;gap:10px;pointer-events:auto;min-width:0;flex:1}
  #hootBtn{
    flex:none;width:clamp(56px,8vw,72px);height:clamp(56px,8vw,72px);
    border-radius:50%;border:3.5px solid var(--ink);
    background:radial-gradient(circle at 35% 30%,#fffdf0 0%,#ffe066 65%,#f59f00 100%);
    box-shadow:0 6px 0 var(--ink),0 0 18px rgba(255,212,59,.65);
    padding:5px;cursor:pointer;display:grid;place-items:center;
    animation:bossFloat 2.6s ease-in-out infinite;
  }
  #hootBtn svg{width:100%;height:100%;display:block}
  #bubble{
    background:linear-gradient(180deg,#ffffff 0%,#fff9db 100%);
    border:3.5px solid var(--ink);border-radius:22px;
    padding:8px 16px;font-size:clamp(.92rem,1.9vw,1.2rem);font-weight:800;
    color:var(--ink);line-height:1.22;
    box-shadow:0 6px 0 var(--ink),0 12px 24px rgba(10,20,50,.32);
    max-width:580px;
  }
  #bubble b{color:#e8590c}
  .hud-right{display:flex;align-items:center;gap:8px;pointer-events:auto;flex:none}
  #starBar{
    display:flex;align-items:center;gap:4px;
    background:rgba(255,255,255,.94);border:3.5px solid var(--ink);
    border-radius:999px;padding:5px 12px;
    box-shadow:0 6px 0 var(--ink);font-weight:900;
  }
  .wstar{font-size:1.25rem;filter:grayscale(1) opacity(.3);transition:transform .3s cubic-bezier(.2,1.6,.4,1),filter .3s}
  .wstar.on{filter:none;transform:scale(1.2)}
  #doneBtn{
    min-height:46px;padding:6px 16px;border-radius:999px;
    border:3.5px solid var(--ink);
    background:linear-gradient(180deg,#86efac 0%,#22c55e 100%);
    color:var(--ink);font-family:inherit;font-weight:900;font-size:1rem;
    box-shadow:0 6px 0 var(--ink);cursor:pointer;
  }
  #doneBtn:active{translate:0 4px;box-shadow:0 2px 0 var(--ink)}

  /* Bottom 3D Analog Sliding Lever Console */
  #machineDeck{
    position:relative;z-index:6;
    margin:0 auto max(6px,env(safe-area-inset-bottom));
    width:min(96vw,920px);
    background:linear-gradient(180deg,#38bdf8 0%,#2563eb 52%,#1e3a8a 100%);
    border:4.5px solid var(--ink);border-radius:32px;
    padding:8px clamp(10px,2vw,20px) 12px;
    box-shadow:
      inset 0 6px 0 rgba(255,255,255,.65),
      inset 0 -6px 0 rgba(0,0,0,.35),
      0 10px 0 #0f172a,
      0 20px 40px rgba(0,0,0,.55);
  }
  .deck-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 6px}
  .gauge-pill{
    display:flex;align-items:center;gap:8px;
    background:#0f172a;border:3px solid var(--ink);border-radius:999px;
    padding:3px 16px;color:#ffd43b;font-weight:900;font-size:clamp(.8rem,1.45vw,.98rem);
  }
  .led-row{display:flex;gap:7px}
  .led{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#ffd43b;box-shadow:0 0 10px #ffd43b;animation:ledPulse .9s ease-in-out infinite alternate}
  .led:nth-child(2){background:#ff4d6d;box-shadow:0 0 10px #ff4d6d;animation-delay:.25s}
  .led:nth-child(3){background:#4ade80;box-shadow:0 0 10px #4ade80;animation-delay:.5s}
  .led:nth-child(4){background:#c084fc;box-shadow:0 0 10px #c084fc;animation-delay:.75s}

  #consoleRow{
    display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.8vw,18px);align-items:stretch;
  }
  /* Tall Smooth Continuous Analog Lever Channel */
  .lever-bay{
    position:relative;
    height:clamp(148px,22vh,188px);
    border:4px solid var(--ink);border-radius:26px;
    background:linear-gradient(180deg,#ffffff 0%,var(--c1) 50%,var(--c2) 100%);
    box-shadow:inset 0 5px 0 rgba(255,255,255,.95),0 8px 0 var(--ped),0 12px 0 var(--ink);
    padding:6px 8px 8px;cursor:ns-resize;font-family:inherit;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    touch-action:none;
  }
  .lever-bay[data-w="storm"]{--c1:#e0e7ff;--c2:#818cf8;--ped:#4338ca;--fill:#6366f1}
  .lever-bay[data-w="snow"]{--c1:#e0f2fe;--c2:#38bdf8;--ped:#0369a1;--fill:#0ea5e9}
  .lever-bay[data-w="wind"]{--c1:#dcfce7;--c2:#4ade80;--ped:#15803d;--fill:#22c55e}
  .lever-bay[data-w="sun"]{--c1:#fef9c3;--c2:#facc15;--ped:#ca8a04;--fill:#eab308}
  .lever-bay.active-bay{
    box-shadow:inset 0 5px 0 #fff,0 8px 0 var(--ped),0 12px 0 var(--ink),0 0 0 4px #fde047;
  }

  .lever-head{
    display:flex;align-items:center;justify-content:space-between;width:100%;
    font-weight:900;font-size:clamp(.84rem,1.6vw,1.04rem);padding:0 2px;pointer-events:none;
  }
  .lever-title{display:flex;align-items:center;gap:4px}
  .lever-title span{font-size:clamp(1.25rem,2.4vw,1.65rem);line-height:1}
  .lever-pct{
    background:#0f172a;color:#fde047;border-radius:999px;
    padding:1px 8px;font-size:clamp(.72rem,1.3vw,.86rem);font-weight:900;min-width:44px;text-align:center;
  }

  /* Vertical Track with Tick Marks & Smooth T-Bar Handle */
  .slot-wrap{
    position:relative;flex:1;width:100%;margin:4px 0 2px;
    display:flex;align-items:center;justify-content:center;
  }
  .slot-ticks{
    position:absolute;left:6px;top:6px;bottom:6px;
    display:flex;flex-direction:column;justify-content:space-between;
    font-size:.64rem;font-weight:900;color:rgba(20,30,48,.65);pointer-events:none;
  }
  .slot-rail{
    position:relative;width:28px;height:100%;
    border-radius:999px;background:#0f172a;border:3.5px solid var(--ink);
    box-shadow:inset 0 4px 8px rgba(0,0,0,.85);overflow:hidden;
  }
  /* Fill grows from bottom (0%) to top (100%) */
  .slot-fill{
    position:absolute;left:0;right:0;bottom:0;height:0%;
    border-radius:999px;
    background:linear-gradient(0deg,var(--fill) 0%,#fde047 100%);
    box-shadow:0 0 12px var(--fill);
  }
  /* T-Bar handle positioned by bottom: calc(var(--val) * 100%) */
  .tbar-handle{
    position:absolute;left:50%;bottom:0%;
    transform:translate(-50%,50%);
    width:clamp(64px,11vw,94px);height:32px;border-radius:999px;
    background:linear-gradient(180deg,#ff758f 0%,#ff4d6d 50%,#c9184a 100%);
    border:3.5px solid var(--ink);
    box-shadow:inset 0 4px 0 rgba(255,255,255,.8),0 5px 0 var(--ink),0 8px 14px rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;gap:4px;
    cursor:grab;pointer-events:none;
  }
  .lever-bay.active-bay .tbar-handle{
    background:linear-gradient(180deg,#86efac 0%,#22c55e 52%,#15803d 100%);
  }
  .tbar-grip{
    width:52%;height:6px;border-top:2px solid rgba(255,255,255,.85);border-bottom:2px solid rgba(20,30,48,.45);
  }

  #winOverlay{
    position:fixed;inset:0;z-index:20;
    background:rgba(15,23,42,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .win-card{
    width:min(92vw,480px);background:linear-gradient(180deg,#ffffff 0%,#fff9db 100%);
    border:5px solid var(--ink);border-radius:36px;padding:24px 20px;text-align:center;
    box-shadow:0 12px 0 var(--ink),0 24px 48px rgba(0,0,0,.45);
  }
  .win-trophy{font-size:5rem;line-height:1;margin:0 0 8px}
  .win-card h2{margin:0 0 6px;font-size:2rem;color:var(--ink)}
  .win-card p{margin:0 0 16px;font-size:1.12rem;font-weight:800;color:#334155}
  .big-play{
    min-height:66px;min-width:200px;padding:12px 28px;border-radius:999px;
    border:4px solid var(--ink);background:linear-gradient(180deg,#ffe066 0%,#fab005 100%);
    color:var(--ink);font-family:inherit;font-size:1.32rem;font-weight:900;
    box-shadow:0 7px 0 var(--ink);cursor:pointer;
  }

  @keyframes bossFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes actorBob{0%,100%{transform:translate(-50%,-50%) scale(1) translateY(0)}50%{transform:translate(-50%,-50%) scale(1) translateY(-8px)}}
  @keyframes ledPulse{from{opacity:.4;transform:scale(.9)}to{opacity:1;transform:scale(1.12)}}
</style>

<body>
<div id="stage">
  <!-- Crisp Pinkfong-Style Vector Illustrated Town Scene -->
  <svg id="townSvg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <!-- Dynamic Sky Background Rect -->
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="skyStop1" offset="0%" stop-color="#0284c7"/>
        <stop id="skyStop2" offset="52%" stop-color="#7dd3fc"/>
        <stop id="skyStop3" offset="100%" stop-color="#fef9c3"/>
      </linearGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#skyGrad)"/>

    <!-- Night Stars & Crescent Moon (Appear when Sun lever is pulled DOWN to dark!) -->
    <g id="svgRainbow" opacity="0">
      <circle cx="240" cy="110" r="4" fill="#fef08a"/><circle cx="380" cy="80" r="3" fill="#fff"/>
      <circle cx="540" cy="125" r="4.5" fill="#fef08a"/><circle cx="640" cy="70" r="3.5" fill="#fff"/>
      <circle cx="810" cy="95" r="4" fill="#fef08a"/><circle cx="920" cy="68" r="3" fill="#fff"/>
      <circle cx="1060" cy="115" r="4.5" fill="#fef08a"/><circle cx="1220" cy="85" r="3.5" fill="#fff"/>
      <path d="M590 110 A34 34 0 1 0 628 158 A26 26 0 1 1 590 110 Z" fill="#fef08a" stroke="#141e30" stroke-width="4"/>
    </g>

    <!-- Giant Smiling Kawaii Sun in the Center Sky (Rises & lights up the whole screen from dark to bright!) -->
    <g id="svgSun" transform="translate(720,165)">
      <!-- Huge Warm Golden Sunshine Halo -->
      <circle cx="0" cy="0" r="240" fill="#fde047" opacity="0.16"/>
      <circle cx="0" cy="0" r="165" fill="#fde047" opacity="0.26"/>
      <circle cx="0" cy="0" r="115" fill="#facc15" opacity="0.36"/>
      <g id="sunRays" stroke="#141e30" stroke-width="5.5" fill="#fb923c">
        <polygon points="0,-106 18,-68 -18,-68"/><polygon points="0,106 18,68 -18,68"/>
        <polygon points="-106,0 -68,18 -68,-18"/><polygon points="106,0 68,18 68,-18"/>
        <polygon points="-76,-76 -44,-60 -60,-44"/><polygon points="76,-76 44,-60 60,-44"/>
        <polygon points="-76,76 -44,60 -60,44"/><polygon points="76,76 44,60 60,44"/>
      </g>
      <circle cx="0" cy="0" r="64" fill="#facc15" stroke="#141e30" stroke-width="6.5"/>
      <circle cx="-22" cy="-10" r="10" fill="#141e30"/><circle cx="22" cy="-10" r="10" fill="#141e30"/>
      <circle cx="-25" cy="-14" r="4" fill="#fff"/><circle cx="19" cy="-14" r="4" fill="#fff"/>
      <ellipse cx="-38" cy="8" rx="10" ry="6" fill="#f43f5e" opacity=".8"/>
      <ellipse cx="38" cy="8" rx="10" ry="6" fill="#f43f5e" opacity=".8"/>
      <path d="M-20 16 Q0 34 20 16" fill="none" stroke="#141e30" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Rolling Storm Clouds Layer (opacity controlled by Storm lever!) -->
    <g id="svgStormClouds" opacity="0">
      <g transform="translate(260,155)">
        <path d="M-90 40 A36 36 0 0 1 -85 -22 A48 48 0 0 1 10 -35 A42 42 0 0 1 85 5 A32 32 0 0 1 70 40 Z" fill="#312e81" stroke="#141e30" stroke-width="6"/>
        <circle cx="-22" cy="5" r="8" fill="#fde047"/><circle cx="22" cy="5" r="8" fill="#fde047"/>
      </g>
      <g transform="translate(740,145)">
        <path d="M-110 44 A40 40 0 0 1 -100 -26 A56 56 0 0 1 15 -42 A48 48 0 0 1 105 6 A34 34 0 0 1 85 44 Z" fill="#1e1b4b" stroke="#141e30" stroke-width="6"/>
        <circle cx="-24" cy="4" r="9" fill="#fde047"/><circle cx="24" cy="4" r="9" fill="#fde047"/>
        <path d="M-16 22 Q0 32 16 22" fill="none" stroke="#fde047" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g transform="translate(1160,165)">
        <path d="M-90 40 A36 36 0 0 1 -85 -22 A48 48 0 0 1 10 -35 A42 42 0 0 1 85 5 A32 32 0 0 1 70 40 Z" fill="#312e81" stroke="#141e30" stroke-width="6"/>
      </g>
    </g>

    <!-- Rolling Hills -->
    <path d="M0 535 Q340 445 720 515 T1440 500 L1440 900 L0 900 Z" fill="#4ade80" stroke="#141e30" stroke-width="6"/>
    <path class="snow-cap" d="M0 535 Q340 445 720 515 T1440 500 L1440 900 L0 900 Z" fill="#e2e8f0" stroke="#141e30" stroke-width="6" opacity="0"/>
    <path d="M0 580 Q520 515 1440 565 L1440 900 L0 900 Z" fill="#22c55e" stroke="#141e30" stroke-width="6"/>
    <path class="snow-cap" d="M0 580 Q520 515 1440 565 L1440 900 L0 900 Z" fill="#f8fafc" stroke="#141e30" stroke-width="6" opacity="0"/>

    <!-- Town Pond / Frozen Ice Rink (Right) -->
    <ellipse id="pondFill" cx="1090" cy="595" rx="205" ry="42" fill="#0284c7" stroke="#141e30" stroke-width="6"/>
    <path d="M960 586 Q1050 578 1170 588" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".65"/>

    <!-- Illustrated Red Barn & Silo (Left) -->
    <g transform="translate(140,395)">
      <rect x="-46" y="30" width="44" height="125" rx="6" fill="#e2e8f0" stroke="#141e30" stroke-width="6"/>
      <path d="M-48 34 A24 24 0 0 1 -2 34 Z" fill="#ef4444" stroke="#141e30" stroke-width="6"/>
      <rect x="0" y="45" width="136" height="110" rx="8" fill="#ef4444" stroke="#141e30" stroke-width="6"/>
      <polygon points="-16,48 22,2 68,-18 114,2 152,48" fill="#b91c1c" stroke="#141e30" stroke-width="6" stroke-linejoin="round"/>
      <polygon class="snow-cap" points="-16,48 22,2 68,-18 114,2 152,48" fill="#ffffff" stroke="#141e30" stroke-width="6" stroke-linejoin="round" opacity="0"/>
      <rect x="48" y="12" width="40" height="28" rx="6" fill="#fde047" stroke="#141e30" stroke-width="5"/>
      <rect x="36" y="82" width="64" height="73" rx="6" fill="#7f1d1d" stroke="#141e30" stroke-width="5"/>
      <line x1="36" y1="82" x2="100" y2="155" stroke="#fff" stroke-width="5"/>
      <line x1="100" y1="82" x2="36" y2="155" stroke="#fff" stroke-width="5"/>
    </g>

    <!-- Cozy Storybook Bakery Cottage (Center-Left) -->
    <g transform="translate(500,415)">
      <rect x="108" y="-36" width="26" height="58" rx="4" fill="#ea580c" stroke="#141e30" stroke-width="6"/>
      <rect x="0" y="25" width="144" height="110" rx="10" fill="#fef3c7" stroke="#141e30" stroke-width="6"/>
      <polygon points="-18,28 72,-34 162,28" fill="#8b5cf6" stroke="#141e30" stroke-width="6" stroke-linejoin="round"/>
      <polygon class="snow-cap" points="-18,28 72,-34 162,28" fill="#ffffff" stroke="#141e30" stroke-width="6" stroke-linejoin="round" opacity="0"/>
      <rect x="18" y="48" width="32" height="32" rx="6" fill="#fde047" stroke="#141e30" stroke-width="5"/>
      <rect x="94" y="48" width="32" height="32" rx="6" fill="#fde047" stroke="#141e30" stroke-width="5"/>
      <path d="M56 135 L56 86 A16 16 0 0 1 88 86 L88 135 Z" fill="#f43f5e" stroke="#141e30" stroke-width="5"/>
    </g>

    <!-- 3D Lattice Windmill (Center-Right) -->
    <g transform="translate(820,390)">
      <polygon points="-42,165 -22,25 22,25 42,165" fill="#f43f5e" stroke="#141e30" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-26 28 A26 26 0 0 1 26 28 Z" fill="#fde047" stroke="#141e30" stroke-width="6"/>
      <g transform="translate(0,36)">
        <g id="windmillSails">
          <rect x="-10" y="-92" width="20" height="82" rx="6" fill="#fef08a" stroke="#141e30" stroke-width="5"/>
          <rect x="-10" y="10" width="20" height="82" rx="6" fill="#fef08a" stroke="#141e30" stroke-width="5"/>
          <rect x="-92" y="-10" width="82" height="20" rx="6" fill="#fef08a" stroke="#141e30" stroke-width="5"/>
          <rect x="10" y="-10" width="82" height="20" rx="6" fill="#fef08a" stroke="#141e30" stroke-width="5"/>
          <circle cx="0" cy="0" r="15" fill="#fb923c" stroke="#141e30" stroke-width="5"/>
        </g>
      </g>
    </g>
    <!-- Full-Town Dark-to-Light Night Shade (Controlled by Sun lever!) -->
    <rect id="nightShade" width="1440" height="900" fill="#050818" opacity="0" pointer-events="none"/>
  </svg>

  <canvas id="weatherCanvas"></canvas>
  <div id="flashOverlay"></div>
  <div id="interactiveLayer"></div>

  <div id="hud">
    <div class="hud-left">
      <button id="hootBtn" type="button" aria-label="Hoot the Owl">

<script>
(function(){
  "use strict";

    penguin: '<svg viewBox="0 0 130 130"><ellipse cx="65" cy="72" rx="34" ry="42" fill="#1e293b" stroke="#141e30" stroke-width="6"/><ellipse cx="65" cy="78" rx="22" ry="30" fill="#ffffff"/><circle cx="53" cy="52" r="6.5" fill="#fff"/><circle cx="77" cy="52" r="6.5" fill="#fff"/><circle cx="53" cy="52" r="3.5" fill="#141e30"/><circle cx="77" cy="52" r="3.5" fill="#141e30"/><polygon points="57,60 73,60 65,70" fill="#facc15" stroke="#141e30" stroke-width="3.5"/><ellipse cx="48" cy="112" rx="12" ry="6" fill="#fb923c" stroke="#141e30" stroke-width="4"/><ellipse cx="82" cy="112" rx="12" ry="6" fill="#fb923c" stroke="#141e30" stroke-width="4"/></svg>',
    kite1: '<svg viewBox="0 0 130 140"><path d="M65 110 Q45 126 70 138" fill="none" stroke="#141e30" stroke-width="5" stroke-linecap="round"/><polygon points="65,8 112,56 65,112 18,56" fill="#ff4d6d" stroke="#141e30" stroke-width="6" stroke-linejoin="round"/><polygon points="65,8 112,56 65,56" fill="#fde047"/><circle cx="50" cy="52" r="7" fill="#141e30"/><circle cx="80" cy="52" r="7" fill="#141e30"/><circle cx="48" cy="50" r="2.5" fill="#fff"/><circle cx="78" cy="50" r="2.5" fill="#fff"/><path d="M53 68 Q65 78 77 68" fill="none" stroke="#141e30" stroke-width="5" stroke-linecap="round"/></svg>',
    kite2: '<svg viewBox="0 0 130 140"><path d="M65 110 Q85 126 60 138" fill="none" stroke="#141e30" stroke-width="5" stroke-linecap="round"/><polygon points="65,8 112,56 65,112 18,56" fill="#38bdf8" stroke="#141e30" stroke-width="6" stroke-linejoin="round"/><polygon points="65,8 112,56 65,56" fill="#4ade80"/><circle cx="50" cy="52" r="7" fill="#141e30"/><circle cx="80" cy="52" r="7" fill="#141e30"/><circle cx="48" cy="50" r="2.5" fill="#fff"/><circle cx="78" cy="50" r="2.5" fill="#fff"/><path d="M53 68 Q65 78 77 68" fill="none" stroke="#141e30" stroke-width="5" stroke-linecap="round"/></svg>',
    butterfly: '<svg viewBox="0 0 120 120"><ellipse cx="34" cy="44" rx="28" ry="24" transform="rotate(-20 34 44)" fill="#e879f9" stroke="#141e30" stroke-width="6"/><ellipse cx="86" cy="44" rx="28" ry="24" transform="rotate(20 86 44)" fill="#e879f9" stroke="#141e30" stroke-width="6"/><ellipse cx="38" cy="82" rx="22" ry="18" transform="rotate(16 38 82)" fill="#38bdf8" stroke="#141e30" stroke-width="6"/><ellipse cx="82" cy="82" rx="22" ry="18" transform="rotate(-16 82 82)" fill="#38bdf8" stroke="#141e30" stroke-width="6"/><rect x="53" y="34" width="14" height="60" rx="7" fill="#fde047" stroke="#141e30" stroke-width="5"/><circle cx="60" cy="30" r="12" fill="#facc15" stroke="#141e30" stroke-width="5"/></svg>',
    flower: '<svg viewBox="0 0 130 130"><g fill="#ff4d8d" stroke="#141e30" stroke-width="5"><circle cx="65" cy="22" r="18"/><circle cx="96" cy="34" r="18"/><circle cx="108" cy="65" r="18"/><circle cx="96" cy="96" r="18"/><circle cx="65" cy="108" r="18"/><circle cx="34" cy="96" r="18"/><circle cx="22" cy="65" r="18"/><circle cx="34" cy="34" r="18"/></g><circle cx="65" cy="65" r="28" fill="#fde047" stroke="#141e30" stroke-width="6"/><circle cx="54" cy="60" r="6" fill="#141e30"/><circle cx="76" cy="60" r="6" fill="#141e30"/><path d="M54 74 Q65 84 76 74" fill="none" stroke="#141e30" stroke-width="4.5" stroke-linecap="round"/></svg>'
  };

  /* ---------- Voice & Sound Engine (Strictly gated through HOOT_HAVE so only real Hoot voice clips play) ---------- */
  var voiceA = new Audio();
  function hasClip(c){
    try{
      var H = window.parent && window.parent.HOOT_HAVE;
      if(H) return !!H[c];
    }catch(e){}
    return c !== "word-snowman" && c !== "word-thunder" && c !== "word-snow" && c !== "word-wind" && c !== "word-sunshine";
  }
  function playVoice(clips){
    if(!clips || !clips.length) return;
    var valid = clips.map(function(c){
      if(hasClip(c)) return c;
      if(c === "word-snowman") return "hoot-super";
      if(c === "word-thunder") return "word-frog";
      if(c === "word-snow") return "word-penguin";
      if(c === "word-wind") return "word-kite";
      if(c === "word-sunshine") return "word-flower";
      return null;
    }).filter(Boolean);
    if(!valid.length) return;
    var i = 0;
    function step(){
      if(i >= valid.length) return;
      voiceA.src = "assets/voice/" + valid[i++] + ".mp3";
      voiceA.onended = step; voiceA.onerror = step;
      var p = voiceA.play(); if(p && p.catch) p.catch(function(){});
    }
    step();
  }
  var actx = null;
  function ac(){
    if(!actx){ var A = window.AudioContext || window.webkitAudioContext; if(A) actx = new A(); }
    if(actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function sfxSlideTick(val){
    try{
      var c = ac(); if(!c) return; var t = c.currentTime;
      var o = c.createOscillator(), g = c.createGain();
      o.type = "triangle"; o.frequency.value = 240 + val * 620;
      g.gain.setValueAtTime(0.09, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.065);
    }catch(e){}
  }
  function sfxThunder(){
    try{
      var c = ac(); if(!c) return; var t = c.currentTime;
      var b = c.createBuffer(1, c.sampleRate * 0.9, c.sampleRate), d = b.getChannelData(0);
      for(var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (c.sampleRate * 0.32));
      var s = c.createBufferSource(); s.buffer = b;
      var f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 185;
      var g = c.createGain(); g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.008, t + 0.88);
      s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
    }catch(e){}
  }
  function sfxNotes(arr){
    try{
      var c = ac(); if(!c) return;
      (arr || [523, 659, 784, 1046]).forEach(function(fr, i){
        var t = c.currentTime + i * 0.07;
        var o = c.createOscillator(), g = c.createGain();
        o.type = "triangle"; o.frequency.value = fr;
        g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.27);
      });
    }catch(e){}
  }

  /* ---------- Continuous Analog Lever State (0.00 to 1.00) ---------- */
  var levels = { storm: 0, snow: 0, wind: 0, sun: 0.85 };
  var stars = 0, tick = 0, millAngle = 0, lastAutoBolt = 0;
  var bolts = [], rainPool = [], snowPool = [], windPool = [], popSparks = [], screenSplats = [];

  for(var i = 0; i < 180; i++){
    rainPool.push({ x: Math.random() * 1400, y: Math.random() * 900, sp: 13 + Math.random() * 9 });
    snowPool.push({ x: Math.random() * 1400, y: Math.random() * 900, r: 3.5 + Math.random() * 5, sp: 1.8 + Math.random() * 2.5, p: Math.random() * 6.28 });
  }
  for(var w = 0; w < 65; w++){
    windPool.push({ x: Math.random() * 1400, y: Math.random() * 600, sp: 6 + Math.random() * 8, len: 36 + Math.random() * 44 });
  }

  /* Build persistent Town Actors whose visibility & position react to the 4 lever levels! */
  var ACTORS_DEF = [
    { id: "snowman", sp: "snowman", label: "Snowman!", x: "17%", y: "72%", clip: "word-snowman", need: function(){ return levels.snow >= 0.22; }, snow: true },
    { id: "frog", sp: "frog", label: "Puddle Frog!", x: "31%", y: "74%", clip: "word-frog", need: function(){ return levels.storm >= 0.22; } },
    { id: "flower1", sp: "flower", label: "Singing Flower!", x: "45%", y: "74%", clip: "word-flower", need: function(){ return levels.sun >= 0.25; } },
    { id: "duck", sp: "duck", label: "Rain Duck!", x: "66%", y: "76%", clip: "word-duck", need: function(){ return levels.storm >= 0.55; } },
    { id: "penguin", sp: "penguin", label: "Ice Penguin!", x: "81%", y: "75%", clip: "word-penguin", need: function(){ return levels.snow >= 0.55; }, snow: true },
    { id: "kite1", sp: "kite1", label: "Red Kite!", x: "26%", y: "32%", clip: "word-kite", need: function(){ return levels.wind >= 0.22; } },
    { id: "kite2", sp: "kite2", label: "Blue Kite!", x: "56%", y: "24%", clip: "word-kite", need: function(){ return levels.wind >= 0.55; } },
    { id: "butterfly", sp: "butterfly", label: "Butterfly!", x: "42%", y: "36%", clip: "word-butterfly", need: function(){ return levels.sun >= 0.55 || levels.wind >= 0.75; } }
  ];
  var actorEls = {};
  ACTORS_DEF.forEach(function(a, i){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "town-actor";
    b.style.left = a.x;
    b.style.top = a.y;
    b.style.animationDelay = (-i * 0.5) + "s";
    b.innerHTML = SPRITES[a.sp] + '<span class="actor-tag">' + a.label + "</span>";
    var hit = function(e){
      if(e){ e.preventDefault(); e.stopPropagation(); }
      var r = b.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      b.classList.add("bouncing");
      setTimeout(function(){ b.classList.remove("bouncing"); }, 260);
      spawnSparks(cx, cy, null, 28);
      if(levels.storm >= 0.3) strikeLightning(cx, cy);
      else if(a.snow){
        screenSplats.push({ x: cx, y: cy - 30, r: 36, life: 1.0 });
        sfxNotes([659, 880, 1174]);
      } else {
        sfxNotes([523, 659, 784, 1046]);
      }
      playVoice([a.clip]);
      awardStar();
    };
    b.addEventListener("pointerdown", hit);
    b.addEventListener("click", function(e){ if(e.detail === 0) hit(e); });
    interactiveLayer.appendChild(b);
    actorEls[a.id] = { el: b, def: a };
  });

  function awardStar(){
    stars = Math.min(5, stars + 1);
    starEls.forEach(function(el, i){ el.classList.toggle("on", i < stars); });
  }

  function strikeLightning(tx, ty){
    var sx = W * (0.2 + Math.random() * 0.6);
    var sy = H * 0.12;
    var ex = tx != null ? tx : W * (0.2 + Math.random() * 0.6);
    var ey = ty != null ? Math.min(ty, H * 0.62) : H * 0.56;
    var pts = [{ x: sx, y: sy }];
    for(var i = 1; i < 8; i++){
      var u = i / 8;
      pts.push({ x: sx + (ex - sx) * u + (Math.random() - 0.5) * 65, y: sy + (ey - sy) * u });
    }
    pts.push({ x: ex, y: ey });
    bolts.push({ pts: pts, life: 1.0 });
    spawnSparks(ex, ey, "#fde047", 26);
    flashEl.style.opacity = "0.72";
    setTimeout(function(){ flashEl.style.opacity = "0"; }, 90);
    sfxThunder();
  }

  function spawnSparks(x, y, col, count){
    for(var i = 0; i < (count || 22); i++){
      var a = (Math.PI * 2 * i) / (count || 22) + Math.random() * 0.3;
      var sp = 3 + Math.random() * 7;
      popSparks.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.2,
        r: 4 + Math.random() * 4,
        c: col || ["#ffd43b", "#ff4d6d", "#38bdf8", "#4ade80", "#f472b6"][i % 5],
        life: 1.0
      });
    }
  }

  function lerpHex(c1, c2, t){
    var a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
    var r1 = (a >> 16) & 255, g1 = (a >> 8) & 255, b1 = a & 255;
    var r2 = (b >> 16) & 255, g2 = (b >> 8) & 255, b2 = b & 255;
    var r = Math.round(r1 + (r2 - r1) * t), g = Math.round(g1 + (g2 - g1) * t), bl = Math.round(b1 + (b2 - b1) * t);
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
  }

  function updateWorldFromLevers(changedKey){
    /* 1. Sync Lever UI (Handle bottom %, fill height %, label) */
    leverBays.forEach(function(bay){
      var k = bay.getAttribute("data-w");
      var v = levels[k] || 0;
      var pct = Math.round(v * 100);
      bay.setAttribute("aria-valuenow", String(pct));
      bay.classList.toggle("active-bay", v >= 0.18);
      var fill = bay.querySelector(".slot-fill");
      var handle = bay.querySelector(".tbar-handle");
      var lbl = bay.querySelector(".lever-pct");
      /* Clamp visual handle travel between 12% and 88% of slot-wrap so handle stays cleanly inside */
      var pos = 12 + v * 76;
      if(fill) fill.style.height = pct + "%";
      if(handle) handle.style.bottom = pos + "%";
      if(lbl) lbl.textContent = v < 0.08 ? "OFF" : v > 0.88 ? "MAX!" : pct + "%";
    });

    /* 2. Blend Sky Colors (Dark Night at 0% Sun -> Bright Golden Daylight at 100% Sun), Sun Elevation, Storm Clouds, Snow Blanket & Pond Ice */
    var st = levels.storm, sn = levels.snow, wi = levels.wind, su = levels.sun;
    var light = Math.max(0, Math.min(1, su * (1 - st * 0.55)));
    skyStop1.setAttribute("stop-color", lerpHex("#050816", "#0284c7", light));
    skyStop2.setAttribute("stop-color", lerpHex("#0f172a", "#38bdf8", light));
    skyStop3.setAttribute("stop-color", lerpHex("#1e1b4b", "#fde047", light));

    /* Night stars & crescent moon appear when Sun lever is low (dark night!) */
    svgRainbow.setAttribute("opacity", String(Math.max(0, (1 - su * 1.45) * (1 - st * 0.6))));
    var nightShade = document.getElementById("nightShade");
    if(nightShade) nightShade.setAttribute("opacity", String(Math.max(0, (1 - light) * 0.62)));

    /* Giant Sun rises from behind the hills (sunY=530 at 0% -> sunY=160 at 100%) */
    var sunY = 530 - su * 370;
    svgSun.setAttribute("transform", "translate(720," + Math.round(sunY) + ") scale(" + (0.45 + su * 0.78) + ")");
    svgSun.setAttribute("opacity", String(Math.min(1, su * 1.45)));
    svgStormClouds.setAttribute("opacity", String(Math.min(1, st * 1.25)));

    snowCaps.forEach(function(sc){ sc.setAttribute("opacity", String(Math.min(1, sn * 1.25))); });
    pondFill.setAttribute("fill", sn >= 0.4 ? "#bae6fd" : "#0284c7");

    /* 3. Show/Hide Interactive Town Characters based on current lever heights */
    Object.keys(actorEls).forEach(function(id){
      var item = actorEls[id];
      item.el.classList.toggle("show", item.def.need());
    });

    /* 4. Live Status Gauge & Hoot Description */
    var active = [];
    if(st >= 0.2) active.push(st >= 0.75 ? "⛈️ THUNDER MAX" : "🌧️ RAIN " + Math.round(st * 100) + "%");
    if(sn >= 0.2) active.push(sn >= 0.75 ? "❄️ BLIZZARD MAX" : "🌨️ SNOW " + Math.round(sn * 100) + "%");
    if(wi >= 0.2) active.push(wi >= 0.75 ? "🪁 SUPER GALE" : "💨 WIND " + Math.round(wi * 100) + "%");
    active.push(su < 0.15 ? "🌙 DARK NIGHT" : su >= 0.75 ? "☀️ BRIGHT SUN MAX" : "☀️ SUN " + Math.round(su * 100) + "%");
    gaugeTxt.textContent = active.join(" + ");

    if(changedKey){
      var v = levels[changedKey];
      if(changedKey === "storm" && v >= 0.25){
        bubble.innerHTML = v >= 0.75
          ? "⚡ <b>MAX THUNDER STORM!</b> Lightning is flashing! Tap the <b>Frog</b> or <b>Duck</b>!"
          : "🌧️ <b>Rainy town (" + Math.round(v * 100) + "%)!</b> Slide higher for thunder & lightning!";
      } else if(changedKey === "snow" && v >= 0.25){
        bubble.innerHTML = v >= 0.75
          ? "⛄ <b>MAX BLIZZARD!</b> The <b>Snowman</b> & <b>Ice Penguin</b> are out! Tap them!"
          : "❄️ <b>Snowing (" + Math.round(v * 100) + "%)!</b> Slide higher to freeze the pond for the Penguin!";
      } else if(changedKey === "wind" && v >= 0.25){
        bubble.innerHTML = v >= 0.75
          ? "🪁 <b>SUPER WINDY!</b> Look at the windmill spin and the <b>Kites</b> fly high!"
          : "💨 <b>Breezy wind (" + Math.round(v * 100) + "%)!</b> Slide higher to launch more kites!";
      } else if(changedKey === "sun"){
        bubble.innerHTML = v < 0.2
          ? "🌙 <b>Dark night time!</b> Slide the <b>Sun lever UP</b> to make the Sun rise and light up the town!"
          : v >= 0.75
            ? "☀️ <b>BRIGHT SUNSHINE!</b> The giant Sun lit up the whole town! Tap the <b>Flower</b> & <b>Butterfly</b>!"
            : "🌤️ <b>Sunrise (" + Math.round(v * 100) + "%)!</b> Keep sliding the Sun lever UP for full bright daylight!";
      }
    }
  }

  /* ---------- Smooth Analog Dragging & Tapping on all 4 Levers ---------- */
  leverBays.forEach(function(bay){
    var key = bay.getAttribute("data-w");
    var wrap = bay.querySelector(".slot-wrap");
    var dragging = false, lastBucket = -1, startVal = 0;

    function setFromClientY(clientY, announce){
      var val = levels[key];
      if(typeof clientY === "number" && !isNaN(clientY)){
        var r = wrap.getBoundingClientRect();
        var pad = 10;
        var rel = 1 - ((clientY - (r.top + pad)) / Math.max(20, r.height - pad * 2));
        val = Math.max(0, Math.min(1, rel));
        levels[key] = val;
      }
      var bucket = Math.floor(val * 10);
      if(bucket !== lastBucket){
        lastBucket = bucket;
        sfxSlideTick(val);
      }
      updateWorldFromLevers(key);
      if(announce && Math.abs(val - startVal) >= 0.12){
        awardStar();
        if(val >= 0.25){
          if(key === "storm") playVoice([hasClip("word-thunder") && val >= 0.7 ? "word-thunder" : (val >= 0.55 ? "word-duck" : "word-frog")]);
          else if(key === "snow") playVoice([val >= 0.55 ? "word-penguin" : (hasClip("word-snowman") ? "word-snowman" : "word-snow")]);
          else if(key === "wind") playVoice([hasClip("word-wind") && val >= 0.7 ? "word-wind" : "word-kite"]);
          else playVoice([hasClip("word-sunshine") && val >= 0.75 ? "word-sunshine" : (val >= 0.55 ? "word-butterfly" : "word-flower")]);
        }
      }
      if(announce && key === "storm" && val >= 0.65){
        strikeLightning();
      }
    }

    bay.addEventListener("pointerdown", function(e){
      e.preventDefault();
      dragging = true;
      startVal = levels[key];
      try{ bay.setPointerCapture(e.pointerId); }catch(_){}
      /* If automated test or synthetic tap dispatches pointerdown at (0,0), toggle/step the lever up smoothly */
      if(e.clientY === 0 && e.clientX === 0){
        levels[key] = levels[key] < 0.85 ? 0.92 : 0.0;
        sfxSlideTick(levels[key]);
        updateWorldFromLevers(key);
        if(levels[key] >= 0.5){
          awardStar();
          if(key === "storm") strikeLightning();
        }
        dragging = false;
        return;
      }
      setFromClientY(e.clientY, false);
    });
    var onMove = function(e){
      if(!dragging) return;
      setFromClientY(e.clientY, false);
    };
    var endDrag = function(e){
      if(!dragging) return;
      dragging = false;
      setFromClientY(e && e.clientY ? e.clientY : undefined, true);
    };
    bay.addEventListener("pointermove", onMove);
    window.addEventListener("pointermove", onMove);
    bay.addEventListener("pointerup", endDrag);
    window.addEventListener("pointerup", endDrag);
    bay.addEventListener("pointercancel", endDrag);
  });

  canvas.addEventListener("pointerdown", function(e){
    var x = e.clientX, y = e.clientY;
    spawnSparks(x, y, null, 24);
    if(levels.storm >= 0.3) strikeLightning(x, y);
    else if(levels.snow >= 0.3){
      screenSplats.push({ x: x, y: y, r: 34, life: 1.0 });
      sfxNotes([784, 1046]);
    } else {
      var scale = [523, 587, 659, 698, 784, 880, 987, 1046];
      sfxNotes([scale[Math.floor((x / Math.max(1, W)) * scale.length) % scale.length]]);
    }
  });

  document.getElementById("doneBtn").addEventListener("click", function(){
    winOverlay.hidden = false;
    sfxNotes([523, 659, 784, 1046, 1318]);
    playVoice(["hoot-win-yay"]);
  });
  document.getElementById("againBtn").addEventListener("click", function(){
    winOverlay.hidden = true;
  });
  document.getElementById("playBtn").addEventListener("click", function(){
    winOverlay.hidden = true;
  });
  document.getElementById("hootBtn").addEventListener("click", function(){
    playVoice(["hoot-giggle"]);
  });

  /* ---------- 60fps Continuous Analog Weather Renderer ---------- */
  function render(){
    tick++;
    ctx.clearRect(0, 0, W, H);

    var st = levels.storm, sn = levels.snow, wi = levels.wind, su = levels.sun;
    var windVX = (wi * 11) - (st * 2.5);

    /* Rotate Windmill & Sun Rays proportional to Wind & Sun levers */
    millAngle += (0.4 + wi * 6.5 + st * 1.8);
    windmillSails.setAttribute("transform", "rotate(" + (millAngle % 360).toFixed(1) + ")");
    if(su > 0.1) sunRays.setAttribute("transform", "rotate(" + ((tick * 0.4) % 360).toFixed(1) + ")");

    /* 1. Rain Streaks (count proportional to Storm lever!) */
    var rainCount = Math.floor(st * rainPool.length);
    if(rainCount > 0){
      ctx.strokeStyle = "rgba(186, 230, 253, 0.86)";
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      for(var i = 0; i < rainCount; i++){
        var rp = rainPool[i];
        rp.y += rp.sp * (0.7 + st * 0.5);
        rp.x += windVX * 0.6;
        if(rp.y > H) rp.y = -20;
        if(rp.x > W) rp.x = 0;
        if(rp.x < 0) rp.x = W;
        ctx.moveTo(rp.x, rp.y);
        ctx.lineTo(rp.x + windVX * 0.9, rp.y + 22);
      }
      ctx.stroke();
    }

    /* Automatic Lightning when Storm lever is stopped high (>= 75%) */
    if(st >= 0.75 && tick - lastAutoBolt > 95){
      lastAutoBolt = tick;
      strikeLightning();
    }

    /* 2. Snowflakes (count proportional to Snow lever!) */
    var snowCount = Math.floor(sn * snowPool.length);
    if(snowCount > 0){
      ctx.fillStyle = "#ffffff";
      for(var j = 0; j < snowCount; j++){
        var sp = snowPool[j];
        sp.y += sp.sp * (0.65 + sn * 0.6);
        sp.x += Math.sin(tick * 0.04 + sp.p) * 1.8 + windVX * 0.45;
        if(sp.y > H) sp.y = -10;
        if(sp.x > W) sp.x = 0;
        if(sp.x < 0) sp.x = W;
        ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); ctx.fill();
      }
    }

    /* 3. Wind Ribbons (count proportional to Wind lever!) */
    var windCount = Math.floor(wi * windPool.length);
    if(windCount > 0){
      ctx.strokeStyle = "rgba(255, 255, 255, 0.78)";
      ctx.lineWidth = 3.2;
      for(var w = 0; w < windCount; w++){
        var wp = windPool[w];
        wp.x += wp.sp * (0.6 + wi * 0.9);
        if(wp.x > W + 60) wp.x = -60;
        ctx.beginPath();
        ctx.moveTo(wp.x, wp.y);
        ctx.quadraticCurveTo(wp.x + wp.len * 0.5, wp.y - 12, wp.x + wp.len, wp.y);
        ctx.stroke();
      }
    }

    /* 4. Forked Neon Lightning Bolts */
    for(var b = bolts.length - 1; b >= 0; b--){
      var bl = bolts[b];
      ctx.save();
      ctx.strokeStyle = "rgba(254, 240, 138, " + bl.life + ")";
      ctx.lineWidth = 9;
      ctx.shadowColor = "#facc15"; ctx.shadowBlur = 26;
      ctx.beginPath();
      bl.pts.forEach(function(pt, idx){ if(idx === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
      ctx.stroke();
      ctx.restore();
      bl.life -= 0.065;
      if(bl.life <= 0) bolts.splice(b, 1);
    }

    /* 5. Screen Snowball Splats */
    for(var s = screenSplats.length - 1; s >= 0; s--){
      var sk = screenSplats[s];
      sk.life -= 0.016;
      if(sk.life <= 0){ screenSplats.splice(s, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.min(1, sk.life * 1.4);
      ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#bae6fd"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sk.x, sk.y, sk.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      for(var d = 0; d < 7; d++){
        var da = (d / 7) * Math.PI * 2;
        ctx.beginPath(); ctx.arc(sk.x + Math.cos(da) * sk.r * 0.92, sk.y + Math.sin(da) * sk.r * 0.92, sk.r * 0.35, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    /* 6. Pop Sparks */
    for(var k = popSparks.length - 1; k >= 0; k--){
      var pk = popSparks[k];
      pk.x += pk.vx; pk.y += pk.vy; pk.vy += 0.22; pk.life -= 0.035;
      if(pk.life <= 0){ popSparks.splice(k, 1); continue; }
      ctx.fillStyle = pk.c; ctx.globalAlpha = pk.life;
      ctx.beginPath(); ctx.arc(pk.x, pk.y, pk.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(render);
  }

  updateWorldFromLevers(null);
  playVoice(["hoot-game-hello"]);
  requestAnimationFrame(render);
})();
</script>
