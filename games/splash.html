<title>Thunder Weather Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#17263b;
    --gold:#ffd43b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  [hidden]{display:none !important}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Fredoka","Nunito",system-ui,sans-serif;background:#1e293b;touch-action:manipulation}
  #stage{
    position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  #weatherCanvas{
    position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block;
    cursor:pointer;
  }
  #flashOverlay{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:#fff;opacity:0;transition:opacity .12s ease;
  }

  /* Top HUD: Hoot Medallion + Speech Banner + 5 Weather Stars */
  #hud{
    position:relative;z-index:5;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:max(8px,env(safe-area-inset-top)) clamp(10px,2.5vw,24px) 0;
    pointer-events:none;
  }
  .hud-host{
    display:flex;align-items:center;gap:10px;flex:1;min-width:0;pointer-events:auto;
  }
  #hootBtn{
    flex:none;width:clamp(64px,10vw,82px);height:clamp(64px,10vw,82px);
    border-radius:50%;border:4px solid var(--ink);
    background:radial-gradient(circle at 35% 30%,#fffdf0 0%,#ffe066 65%,#ffb703 100%);
    box-shadow:0 6px 0 var(--ink),0 0 0 5px rgba(255,255,255,.45),0 12px 22px rgba(10,20,50,.35);
    padding:6px;cursor:pointer;display:grid;place-items:center;
    animation:hootFloat 2.8s ease-in-out infinite;
  }
  #hootBtn svg{width:100%;height:100%;display:block}
  #bubble{
    background:linear-gradient(180deg,#ffffff 0%,#fff9db 100%);
    border:4px solid var(--ink);border-radius:24px;
    padding:10px 16px;font-size:clamp(1rem,2.2vw,1.38rem);font-weight:800;
    color:var(--ink);line-height:1.25;
    box-shadow:0 7px 0 var(--ink),0 14px 26px rgba(10,20,50,.28);
    max-width:640px;
  }
  #bubble b{color:#d9480f}
  #starBar{
    flex:none;pointer-events:auto;
    display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.92);border:3.5px solid var(--ink);
    border-radius:999px;padding:6px 14px;
    box-shadow:0 6px 0 var(--ink);font-weight:900;font-size:1.15rem;color:var(--ink);
  }
  .wstar{font-size:1.45rem;filter:grayscale(1) opacity(.35);transition:transform .3s cubic-bezier(.2,1.6,.4,1),filter .3s}
  .wstar.on{filter:none;transform:scale(1.18)}

  /* Interactive Town Actor Hotspots */
  #townActors{
    position:relative;z-index:4;flex:1;width:100%;pointer-events:none;
  }
  .actor-chip{
    position:absolute;pointer-events:auto;
    border:3.5px solid var(--ink);border-radius:999px;
    background:linear-gradient(180deg,#ffffff 0%,#fff3bf 100%);
    box-shadow:0 6px 0 var(--ink),0 12px 24px rgba(10,20,50,.32);
    padding:6px 14px;font-family:inherit;font-weight:900;font-size:clamp(.95rem,1.9vw,1.2rem);
    color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;
    animation:actorPop .45s cubic-bezier(.2,1.6,.4,1) both,hootFloat 2.4s ease-in-out infinite;
  }
  .actor-chip span{font-size:clamp(1.6rem,3.4vw,2.2rem);line-height:1}
  .actor-chip:active{translate:0 4px;box-shadow:0 2px 0 var(--ink)}

  /* Bottom Pinkfong-Style 3D Weather Machine Lever Console */
  #machineConsole{
    position:relative;z-index:6;
    margin:0 auto max(10px,env(safe-area-inset-bottom));
    width:min(96vw,960px);
    background:linear-gradient(180deg,#4cc9f0 0%,#4361ee 55%,#3a0ca3 100%);
    border:4.5px solid var(--ink);border-radius:34px;
    padding:12px clamp(10px,2.2vw,22px) 16px;
    box-shadow:
      inset 0 6px 0 rgba(255,255,255,.55),
      0 10px 0 #1d1145,
      0 18px 36px rgba(5,10,35,.48);
  }
  .console-lights{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;padding:0 10px;color:#fff;font-weight:900;font-size:clamp(.88rem,1.7vw,1.08rem);
    letter-spacing:.04em;text-shadow:0 2px 0 var(--ink);
  }
  .bulb-row{display:flex;gap:8px}
  .bulb{
    width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);
    background:#ffd43b;box-shadow:0 0 10px #ffd43b;
    animation:bulbBlink 1.2s ease-in-out infinite alternate;
  }
  .bulb:nth-child(2){background:#ff6b6b;box-shadow:0 0 10px #ff6b6b;animation-delay:.3s}
  .bulb:nth-child(3){background:#51cf66;box-shadow:0 0 10px #51cf66;animation-delay:.6s}
  .bulb:nth-child(4){background:#f06595;box-shadow:0 0 10px #f06595;animation-delay:.9s}

  #leverGrid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.8vw,18px);
  }
  .lever-btn{
    position:relative;
    min-height:clamp(108px,18vh,148px);
    border:4px solid var(--ink);border-radius:26px;
    background:linear-gradient(180deg,#ffffff 0%,var(--c1) 52%,var(--c2) 100%);
    box-shadow:
      inset 0 5px 0 rgba(255,255,255,.92),
      0 9px 0 var(--ped),
      0 13px 0 var(--ink),
      0 18px 26px rgba(10,15,45,.32);
    padding:10px 6px 12px;cursor:pointer;font-family:inherit;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    transition:translate .14s cubic-bezier(.2,1.5,.4,1),box-shadow .14s ease;
    touch-action:manipulation;
  }
  .lever-btn[data-w="sun"]{--c1:#fff3bf;--c2:#fcc419;--ped:#e67700}
  .lever-btn[data-w="wind"]{--c1:#d0ebff;--c2:#4dabf7;--ped:#1864ab}
  .lever-btn[data-w="snow"]{--c1:#e5dbff;--c2:#9775fa;--ped:#5f3dc4}
  .lever-btn[data-w="storm"]{--c1:#ffe3e3;--c2:#ff6b6b;--ped:#c92a2a}

  /* Physical Lever Slot + Sliding Ball Handle */
  .lever-track{
    position:relative;width:18px;height:42px;border-radius:999px;
    background:#1e293b;border:3px solid var(--ink);
    box-shadow:inset 0 3px 6px rgba(0,0,0,.6);
    margin:2px 0;
  }
  .lever-knob{
    position:absolute;left:50%;top:-6px;transform:translateX(-50%);
    width:32px;height:24px;border-radius:999px;
    background:radial-gradient(circle at 35% 30%,#fff,#ff4d6d 55%,#a4133c);
    border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
    transition:top .22s cubic-bezier(.2,1.6,.4,1),background .2s;
  }
  .lever-btn.pulled{
    translate:0 6px;
    box-shadow:
      inset 0 5px 0 #fff,
      0 3px 0 var(--ped),
      0 6px 0 var(--ink),
      0 0 0 6px #ffd43b,
      0 0 28px 8px rgba(255,212,59,.75);
  }
  .lever-btn.pulled .lever-knob{
    top:16px;
    background:radial-gradient(circle at 35% 30%,#fff,#51cf66 55%,#2b8a3e);
  }
  .lever-btn.target-glow:not(.pulled){
    box-shadow:
      inset 0 5px 0 #fff,
      0 9px 0 var(--ped),
      0 13px 0 var(--ink),
      0 0 0 6px rgba(255,224,51,.9),
      0 0 26px 8px rgba(255,224,51,.65);
    animation:targetPulse 1.3s ease-in-out infinite;
  }
  .lever-emo{
    font-size:clamp(2.2rem,5.2vw,3.1rem);line-height:1;
    filter:drop-shadow(0 4px 6px rgba(15,25,60,.22));
  }
  .lever-lbl{
    font-size:clamp(.92rem,2vw,1.2rem);font-weight:900;
    background:rgba(255,255,255,.88);padding:2px 12px;border-radius:999px;
    border:2.5px solid var(--ink);line-height:1.15;
  }

  /* Win Celebration Overlay */
  #winOverlay{
    position:fixed;inset:0;z-index:20;
    background:rgba(15,23,42,.58);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .win-card{
    width:min(92vw,480px);background:linear-gradient(180deg,#ffffff 0%,#fff9db 100%);
    border:5px solid var(--ink);border-radius:36px;padding:24px 20px;text-align:center;
    box-shadow:0 12px 0 var(--ink),0 24px 48px rgba(0,0,0,.45);
    animation:actorPop .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  .win-trophy{font-size:5.2rem;line-height:1;margin:0 0 8px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
  .win-card h2{margin:0 0 6px;font-size:2rem;color:var(--ink)}
  .win-card p{margin:0 0 16px;font-size:1.15rem;font-weight:800;color:#334155}
  .win-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .big-play{
    min-height:68px;min-width:200px;padding:12px 28px;border-radius:999px;
    border:4px solid var(--ink);background:linear-gradient(180deg,#ffe066 0%,#fab005 100%);
    color:var(--ink);font-family:inherit;font-size:1.35rem;font-weight:900;
    box-shadow:0 7px 0 var(--ink);cursor:pointer;
  }
  .big-play:active{translate:0 5px;box-shadow:0 2px 0 var(--ink)}

  @keyframes hootFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes actorPop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes bulbBlink{from{opacity:.45;transform:scale(.9)}to{opacity:1;transform:scale(1.1)}}
  @keyframes targetPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
</style>

<body>
<div id="stage">
  <canvas id="weatherCanvas"></canvas>
  <div id="flashOverlay"></div>

  <div id="hud">
    <div class="hud-host">
      <button id="hootBtn" type="button" aria-label="Hoot the Owl">
        <svg viewBox="0 0 200 210" aria-hidden="true"><path d="M82 178 L100 205 L118 178 Z" fill="#8a5a33"/><ellipse cx="34" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(14 34 128)"/><ellipse cx="166" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(-14 166 128)"/><ellipse cx="100" cy="118" rx="66" ry="72" fill="#a06a3b"/><ellipse cx="100" cy="140" rx="44" ry="46" fill="#fdeed3"/><path d="M52 44 Q40 14 62 22 Q74 27 70 48 Z" fill="#8a5a33"/><path d="M148 44 Q160 14 138 22 Q126 27 130 48 Z" fill="#8a5a33"/><circle cx="100" cy="72" r="52" fill="#a06a3b"/><ellipse cx="78" cy="74" rx="24" ry="26" fill="#fdeed3"/><ellipse cx="122" cy="74" rx="24" ry="26" fill="#fdeed3"/><circle cx="78" cy="72" r="11" fill="#17324f"/><circle cx="122" cy="72" r="11" fill="#17324f"/><circle cx="82" cy="68" r="4" fill="#fff"/><circle cx="126" cy="68" r="4" fill="#fff"/><circle cx="56" cy="94" r="8" fill="#ffb59d" opacity=".85"/><circle cx="144" cy="94" r="8" fill="#ffb59d" opacity=".85"/><path d="M90 88 Q100 84 110 88 Q106 102 100 104 Q94 102 90 88 Z" fill="#ff9f1c" stroke="#e07f00" stroke-width="1.5"/></svg>

  <div id="townActors"></div>

  <!-- Hidden start button kept for automated test harness compatibility; game starts immediately -->
  <button id="playBtn" type="button" hidden>▶ Play</button>

  <div id="machineConsole" role="group" aria-label="Weather Machine Levers">
    <div class="console-lights">
      <div class="bulb-row"><i class="bulb"></i><i class="bulb"></i></div>

      <button type="button" class="lever-btn" data-w="storm" aria-label="Thunder Storm lever">

      </button>
      <button type="button" class="lever-btn" data-w="wind" aria-label="Windy Kites lever">
        <span class="lever-emo" aria-hidden="true">🪁</span>

      <button type="button" class="lever-btn" data-w="sun" aria-label="Sunshine Rainbow lever">

  <div id="winOverlay" hidden>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById("weatherCanvas");
  var ctx = canvas.getContext("2d");
  var bubble = document.getElementById("bubble");
  var actorsBox = document.getElementById("townActors");
  var flashEl = document.getElementById("flashOverlay");
  var winOverlay = document.getElementById("winOverlay");
  var starEls = Array.prototype.slice.call(document.querySelectorAll(".wstar"));
  var leverBtns = Array.prototype.slice.call(document.querySelectorAll(".lever-btn"));

  var W = window.innerWidth, H = window.innerHeight, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* ---------- Recorded Voice Clips + WebAudio Weather Synth ---------- */
  var voiceA = new Audio();
  function playVoice(clips){
    if(!clips || !clips.length) return;
    var idx = 0;
    function step(){
      if(idx >= clips.length) return;
      var c = clips[idx++];
      voiceA.src = "assets/voice/" + c + ".mp3";
      voiceA.onended = step;
      voiceA.onerror = step;
      var p = voiceA.play();
      if(p && p.catch) p.catch(function(){});
    }
    step();
  }

  var actx = null;
  function ensureAudio(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) actx = new AC();
    }
    if(actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function sfxLever(){
    try{
      var ac = ensureAudio(); if(!ac) return;
      var t = ac.currentTime;
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(660, t + 0.16);
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.23);
    }catch(e){}
  }
  function sfxThunder(){
    try{
      var ac = ensureAudio(); if(!ac) return;
      var t = ac.currentTime;
      var buf = ac.createBuffer(1, ac.sampleRate * 0.9, ac.sampleRate);
      var d = buf.getChannelData(0);
      for(var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.32));
      var src = ac.createBufferSource(); src.buffer = buf;
      var flt = ac.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = 190;
      var g = ac.createGain(); g.gain.setValueAtTime(0.55, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.88);
      src.connect(flt); flt.connect(g); g.connect(ac.destination);
      src.start(t);
    }catch(e){}
  }
  function sfxChime(notes){
    try{
      var ac = ensureAudio(); if(!ac) return;
      (notes || [523, 659, 784, 1046]).forEach(function(freq, i){
        var t = ac.currentTime + i * 0.08;
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.value = freq;
        g.gain.setValueAtTime(0.16, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + 0.3);
      });
    }catch(e){}
  }
  function sfxWind(){
    try{
      var ac = ensureAudio(); if(!ac) return;
      var t = ac.currentTime;
      var buf = ac.createBuffer(1, ac.sampleRate * 0.7, ac.sampleRate);
      var d = buf.getChannelData(0);
      for(var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / d.length) * Math.PI);
      var src = ac.createBufferSource(); src.buffer = buf;
      var flt = ac.createBiquadFilter(); flt.type = "bandpass";
      flt.frequency.setValueAtTime(420, t); flt.frequency.linearRampToValueAtTime(780, t + 0.5);
      var g = ac.createGain(); g.gain.setValueAtTime(0.24, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.68);
      src.connect(flt); flt.connect(g); g.connect(ac.destination);
      src.start(t);
    }catch(e){}
  }

  /* ---------- Weather Configurations ---------- */
  var WEATHERS = {
    storm: {
      title: "THUNDER STORM",
      sky: ["#1a1b4b", "#312e81", "#4c1d95"],
      hill1: "#1e3a2f", hill2: "#14532d",
      msg: "⚡ <b>CRASH! BOOM!</b> Lightning lights up the town! Tap the sky for more lightning!",
      ask: "Pull the <b>⛈️ Storm</b> lever to make lightning and rain!",
      clips: ["word-frog", "hoot-amazing"],
      actors: [
        { emo: "🐸", label: "Puddle Frog!", left: "18%", top: "48%", clip: "word-frog" },
        { emo: "⚡", label: "Zap Lightning!", left: "58%", top: "24%", clip: "owl-excited" }
      ]
    },
    snow: {
      title: "SNOWY WINTER",
      sky: ["#3b82f6", "#93c5fd", "#e0f2fe"],
      hill1: "#f8fafc", hill2: "#e2e8f0",
      msg: "⛄ <b>BRRR!</b> Look — a Snowman and a Penguin popped up in the snow! Tap them!",
      ask: "Pull the <b>❄️ Snow</b> lever to build a snowman!",
      clips: ["word-penguin", "hoot-super"],
      actors: [
        { emo: "⛄", label: "Bouncy Snowman!", left: "22%", top: "46%", clip: "hoot-giggle" },
        { emo: "🐧", label: "Snow Penguin!", left: "62%", top: "48%", clip: "word-penguin" }
      ]
    },
    wind: {
      title: "WINDY KITES",
      sky: ["#0284c7", "#38bdf8", "#bae6fd"],
      hill1: "#4ade80", hill2: "#22c55e",
      msg: "🪁 <b>WHOOSH!</b> The kites are flying high over the roofs! Tap a kite to loop-de-loop!",
      ask: "Pull the <b>🪁 Wind</b> lever to fly the kites!",
      clips: ["word-kite", "hoot-yay-2"],
      actors: [
        { emo: "🪁", label: "Red Kite!", left: "20%", top: "22%", clip: "word-kite" },
        { emo: "🪁", label: "Rainbow Kite!", left: "60%", top: "18%", clip: "word-kite" }
      ]
    },
    sun: {
      title: "SUNSHINE & RAINBOW",
      sky: ["#2563eb", "#60a5fa", "#fef08a"],
      hill1: "#84cc16", hill2: "#4d7c0f",
      msg: "🌈 <b>HOORAY!</b> Giant rainbow sunshine! Butterflies and flowers are dancing!",
      ask: "Pull the <b>☀️ Sunshine</b> lever to bring out the rainbow!",
      clips: ["word-butterfly", "hoot-great-job"],
      actors: [
        { emo: "🦋", label: "Sunny Butterfly!", left: "24%", top: "30%", clip: "word-butterfly" },
        { emo: "🌻", label: "Dancing Flowers!", left: "60%", top: "50%", clip: "word-flower" }
      ]
    }
  };

  var ORDER = ["storm", "snow", "wind", "sun", "storm"];
  var curWeather = "sun";
  var stars = 0;
  var roundIdx = 0;
  var won = false;
  var bolts = [];
  var particles = [];
  var bursts = [];
  var windmillAngle = 0;
  var snowCover = 0;
  var tick = 0;

  function spawnParticles(mode){
    particles = [];
    var count = mode === "storm" ? 130 : mode === "snow" ? 110 : mode === "wind" ? 55 : 35;
    for(var i = 0; i < count; i++){
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: mode === "wind" ? (5 + Math.random() * 6) : mode === "storm" ? -2.5 : (Math.random() - 0.5) * 1.5,
        vy: mode === "storm" ? (12 + Math.random() * 8) : mode === "snow" ? (1.8 + Math.random() * 2.4) : (Math.random() - 0.5) * 1.2,
        r: mode === "snow" ? (3 + Math.random() * 4.5) : (2 + Math.random() * 3),
        a: Math.random() * Math.PI * 2,
        c: ["#ffd43b", "#ff6b6b", "#4dabf7", "#69db7c", "#f783ac"][i % 5]
      });
    }
  }

  function triggerLightning(tx, ty){
    var x0 = tx || (W * (0.2 + Math.random() * 0.6));
    var pts = [{ x: x0, y: 0 }];
    var cx = x0, cy = 0, limit = ty || (H * 0.58);
    while(cy < limit){
      cy += 24 + Math.random() * 28;
      cx += (Math.random() - 0.5) * 64;
      pts.push({ x: cx, y: cy });
    }
    bolts.push({ pts: pts, life: 1.0 });
    flashEl.style.opacity = "0.65";
    setTimeout(function(){ flashEl.style.opacity = "0"; }, 110);
    sfxThunder();
  }

  function spawnPopBurst(x, y){
    for(var i = 0; i < 22; i++){
      var ang = (Math.PI * 2 * i) / 22;
      var sp = 2.5 + Math.random() * 5.5;
      bursts.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 2,
        r: 4 + Math.random() * 4,
        c: ["#ffd43b", "#ff6b6b", "#51cf66", "#4dabf7", "#f783ac"][i % 5],
        life: 1
      });
    }
  }

  function updateStars(){
    starEls.forEach(function(el, i){
      el.classList.toggle("on", i < stars);
    });
  }

  function highlightNextLever(){
    var targetKey = ORDER[roundIdx % ORDER.length];
    leverBtns.forEach(function(b){
      b.classList.toggle("target-glow", b.getAttribute("data-w") === targetKey && !won);
    });
  }

  function renderActors(key){
    var cfg = WEATHERS[key];
    actorsBox.innerHTML = "";
    (cfg.actors || []).forEach(function(a){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "actor-chip";
      btn.style.left = a.left;
      btn.style.top = a.top;
      btn.innerHTML = '<span aria-hidden="true">' + a.emo + "</span>" + a.label;
      btn.addEventListener("pointerdown", function(e){
        e.preventDefault(); e.stopPropagation();
        var r = btn.getBoundingClientRect();
        spawnPopBurst(r.left + r.width / 2, r.top + r.height / 2);
        if(curWeather === "storm") triggerLightning(r.left + r.width / 2, r.top);
        else sfxChime([587, 784, 987, 1174]);
        playVoice([a.clip]);
        btn.style.transform = "scale(1.22)";
        setTimeout(function(){ btn.style.transform = ""; }, 240);
      });
      actorsBox.appendChild(btn);
    });
  }

  function pullLever(key){
    if(won) return;
    curWeather = key;
    sfxLever();
    leverBtns.forEach(function(b){
      b.classList.toggle("pulled", b.getAttribute("data-w") === key);
    });
    spawnParticles(key);
    renderActors(key);
    if(key === "storm") setTimeout(function(){ triggerLightning(); }, 120);
    else if(key === "wind") sfxWind();
    else if(key === "snow") sfxChime([659, 784, 1046, 1318]);
    else sfxChime([523, 659, 784, 1046]);

    var cfg = WEATHERS[key];
    bubble.innerHTML = cfg.msg;
    playVoice(cfg.clips);

    stars = Math.min(5, stars + 1);
    roundIdx++;
    updateStars();
    highlightNextLever();

    if(stars >= 5){
      won = true;
      setTimeout(function(){
        winOverlay.hidden = false;
        sfxChime([523, 659, 784, 1046, 1318]);
        playVoice(["hoot-win-yay"]);
      }, 1100);
    }
  }

  leverBtns.forEach(function(b){
    var key = b.getAttribute("data-w");
    var fire = function(e){
      if(e) e.preventDefault();
      pullLever(key);
    };
    b.addEventListener("pointerdown", fire);
    b.addEventListener("click", function(e){
      if(e.detail === 0) fire(e);
    });
  });

  canvas.addEventListener("pointerdown", function(e){
    var x = e.clientX, y = e.clientY;
    spawnPopBurst(x, y);
    if(curWeather === "storm") triggerLightning(x, y);
    else if(curWeather === "wind") sfxWind();
    else sfxChime([659, 880, 1046]);
  });

  function startGame(){
    won = false;
    stars = 0;
    roundIdx = 0;
    winOverlay.hidden = true;
    updateStars();
    curWeather = "sun";
    spawnParticles("sun");
    renderActors("sun");
    leverBtns.forEach(function(b){ b.classList.remove("pulled"); });
    highlightNextLever();
    bubble.innerHTML = WEATHERS[ORDER[0]].ask;
    playVoice(["hoot-game-hello"]);
  }

  document.getElementById("againBtn").addEventListener("click", startGame);
  document.getElementById("playBtn").addEventListener("click", startGame);
  document.getElementById("hootBtn").addEventListener("click", function(){
    playVoice(["hoot-giggle"]);
  });

  /* ---------- 60fps Living Town & Weather Canvas Renderer ---------- */
  function drawTown(){
    tick++;
    var cfg = WEATHERS[curWeather];
    snowCover += ((curWeather === "snow" ? 1 : 0) - snowCover) * 0.05;

    /* 1. Sky Gradient */
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, cfg.sky[0]);
    g.addColorStop(0.55, cfg.sky[1]);
    g.addColorStop(1, cfg.sky[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var groundY = H * 0.64;

    /* 2. Sun & Rainbow (Sunshine mode) */
    if(curWeather === "sun"){
      var rg = ctx.createRadialGradient(W * 0.5, groundY, W * 0.18, W * 0.5, groundY, W * 0.48);
      rg.addColorStop(0, "rgba(255,255,255,0)");
      rg.addColorStop(0.62, "rgba(255,77,77,0.42)");
      rg.addColorStop(0.68, "rgba(255,169,77,0.42)");
      rg.addColorStop(0.74, "rgba(255,224,102,0.42)");
      rg.addColorStop(0.80, "rgba(105,219,124,0.42)");
      rg.addColorStop(0.86, "rgba(77,171,247,0.42)");
      rg.addColorStop(0.92, "rgba(151,117,250,0.42)");
      rg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(W * 0.5, groundY, W * 0.48, Math.PI, 0); ctx.fill();

      var sx = W * 0.84, sy = H * 0.2;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(tick * 0.01);
      ctx.fillStyle = "rgba(255, 224, 51, 0.35)";
      for(var r = 0; r < 12; r++){
        ctx.rotate(Math.PI / 6);
        ctx.beginPath(); ctx.moveTo(0, -52); ctx.lineTo(14, -84); ctx.lineTo(-14, -84); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = "#ffd43b";
      ctx.beginPath(); ctx.arc(0, 0, 52, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    /* 3. Storm Clouds */
    if(curWeather === "storm" || curWeather === "snow"){
      ctx.fillStyle = curWeather === "storm" ? "rgba(30, 27, 75, 0.86)" : "rgba(255, 255, 255, 0.78)";
      for(var c = 0; c < 6; c++){
        var cx = ((c * 240 + tick * (curWeather === "storm" ? 1.1 : 0.5)) % (W + 260)) - 130;
        var cy = H * 0.14 + (c % 2) * 26;
        ctx.beginPath();
        ctx.arc(cx, cy, 48, 0, Math.PI * 2);
        ctx.arc(cx + 38, cy - 12, 56, 0, Math.PI * 2);
        ctx.arc(cx + 80, cy, 46, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* 4. Flying Kites in Wind Mode */
    if(curWeather === "wind"){
      var kites = [
        { x: W * 0.28, y: H * 0.26, col: "#ff4d6d", tail: "#ffd43b" },
        { x: W * 0.68, y: H * 0.22, col: "#4dabf7", tail: "#69db7c" },
        { x: W * 0.48, y: H * 0.31, col: "#ffd43b", tail: "#f783ac" }
      ];
      kites.forEach(function(kt, i){
        var kx = kt.x + Math.sin(tick * 0.05 + i) * 26;
        var ky = kt.y + Math.cos(tick * 0.06 + i) * 18;
        ctx.strokeStyle = "rgba(255,255,255,0.7)";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(kx, ky + 28); ctx.quadraticCurveTo(kx - 40, ky + 110, kx - 90, groundY); ctx.stroke();
        ctx.save();
        ctx.translate(kx, ky);
        ctx.rotate(Math.sin(tick * 0.05 + i) * 0.22);
        ctx.fillStyle = kt.col;
        ctx.strokeStyle = "#17263b"; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(26, 0); ctx.lineTo(0, 36); ctx.lineTo(-26, 0); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();
      });
    }

    /* 5. Rolling Hills & Cozy Town Houses */
    ctx.fillStyle = cfg.hill1;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.quadraticCurveTo(W * 0.28, groundY - 65, W * 0.56, groundY - 15);
    ctx.quadraticCurveTo(W * 0.8, groundY + 25, W, groundY - 35);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

    ctx.fillStyle = cfg.hill2;
    ctx.beginPath();
    ctx.moveTo(0, groundY + 28);
    ctx.quadraticCurveTo(W * 0.45, groundY - 25, W, groundY + 22);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

    /* Houses */
    var houses = [
      { x: W * 0.14, w: 74, h: 62, body: "#fff3bf", roof: "#f03e3e" },
      { x: W * 0.36, w: 86, h: 72, body: "#d0ebff", roof: "#7048e8" },
      { x: W * 0.72, w: 78, h: 66, body: "#ffe3e3", roof: "#e67700" }
    ];
    houses.forEach(function(hs){
      var hy = groundY - hs.h + 14;
      ctx.fillStyle = hs.body;
      ctx.strokeStyle = "#17263b"; ctx.lineWidth = 3.5;
      ctx.fillRect(hs.x, hy, hs.w, hs.h);
      ctx.strokeRect(hs.x, hy, hs.w, hs.h);
      ctx.fillStyle = snowCover > 0.4 ? "#f8fafc" : hs.roof;
      ctx.beginPath();
      ctx.moveTo(hs.x - 10, hy);
      ctx.lineTo(hs.x + hs.w / 2, hy - 38);
      ctx.lineTo(hs.x + hs.w + 10, hy);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      /* Glowing windows */
      ctx.fillStyle = (curWeather === "storm" || curWeather === "snow") ? "#ffd43b" : "#74c0fc";
      ctx.fillRect(hs.x + 14, hy + 16, 18, 18);
      ctx.strokeRect(hs.x + 14, hy + 16, 18, 18);
      ctx.fillRect(hs.x + hs.w - 32, hy + 16, 18, 18);
      ctx.strokeRect(hs.x + hs.w - 32, hy + 16, 18, 18);
    });

    /* Spinning Town Windmill */
    var wx = W * 0.55, wy = groundY + 8;
    ctx.fillStyle = "#f06595"; ctx.strokeStyle = "#17263b"; ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(wx - 24, wy); ctx.lineTo(wx - 14, wy - 82); ctx.lineTo(wx + 14, wy - 82); ctx.lineTo(wx + 24, wy);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    windmillAngle += curWeather === "wind" ? 0.14 : curWeather === "storm" ? 0.08 : 0.025;
    ctx.save();
    ctx.translate(wx, wy - 72);
    ctx.rotate(windmillAngle);
    ctx.fillStyle = "#fff9db";
    for(var b = 0; b < 4; b++){
      ctx.rotate(Math.PI / 2);
      ctx.fillRect(-5, -52, 10, 46);
      ctx.strokeRect(-5, -52, 10, 46);
    }
    ctx.restore();

    /* Snowman on the hill when Snowing */
    if(snowCover > 0.25){
      var smx = W * 0.28, smy = groundY + 14;
      ctx.save();
      ctx.translate(smx, smy - Math.abs(Math.sin(tick * 0.07)) * 8);
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#17263b"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -30, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ff922b";
      ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(14, -27); ctx.lineTo(0, -24); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    /* 6. Weather Particles (Rain / Snow / Wind Ribbons / Sun Sparkles) */
    particles.forEach(function(p){
      p.x += p.vx; p.y += p.vy;
      if(p.y > H) p.y = -10;
      if(p.x > W) p.x = -10;
      if(p.x < -10) p.x = W + 10;

      if(curWeather === "storm"){
        ctx.strokeStyle = "rgba(186, 230, 253, 0.82)";
        ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 5, p.y + 18); ctx.stroke();
      } else if(curWeather === "snow"){
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(p.x + Math.sin(tick * 0.04 + p.a) * 1.4, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      } else if(curWeather === "wind"){
        ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.quadraticCurveTo(p.x + 24, p.y - 8, p.x + 48, p.y); ctx.stroke();
      } else {
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
    });

    /* 7. Lightning Bolts */
    for(var i = bolts.length - 1; i >= 0; i--){
      var bl = bolts[i];
      ctx.strokeStyle = "rgba(255, 249, 196, " + bl.life + ")";
      ctx.lineWidth = 6;
      ctx.shadowColor = "#ffd43b"; ctx.shadowBlur = 18;
      ctx.beginPath();
      bl.pts.forEach(function(pt, j){ if(j === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
      ctx.stroke();
      ctx.shadowBlur = 0;
      bl.life -= 0.07;
      if(bl.life <= 0) bolts.splice(i, 1);
    }

    /* 8. Tap Pop Bursts */
    for(var k = bursts.length - 1; k >= 0; k--){
      var b0 = bursts[k];
      b0.x += b0.vx; b0.y += b0.vy; b0.vy += 0.18; b0.life -= 0.035;
      if(b0.life <= 0){ bursts.splice(k, 1); continue; }
      ctx.fillStyle = b0.c;
      ctx.globalAlpha = b0.life;
      ctx.beginPath(); ctx.arc(b0.x, b0.y, b0.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(drawTown);
  }

  startGame();
  requestAnimationFrame(drawTown);
})();
</script>
