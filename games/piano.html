<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>
window.__HOOT_GAME_KEY__="piano";
window.__HOOT_SELF_COACH__=true;

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Rainbow Piano</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1b2c47;
    --cream:#fffdf7;
    --sun:#ffc93c;
    --wood:#a8642c;
    --wood-dark:#6b3b13;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; width:100%; margin:0; padding:0; overflow:hidden; }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#7ad4fb;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ================= SUNLIT RAINBOW PAVILION STAGE ================= */
  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:linear-gradient(180deg,
      #5ac6fa 0%,
      #9be1ff 42%,
      #dff7ff 66%,
      #8ee06e 67%,
      #5ac24c 100%);
  }

  /* ================= TOP HUD (>=64px) ================= */
  #hud{
    position:relative;
    z-index:20;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 4px max(10px, env(safe-area-inset-left));
    flex:0 0 auto;
  }
  .hud-group{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .hud-pill{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 14px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,247,.96);
    color:var(--ink);
    font-size:28px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(20,66,105,.22), 0 10px 18px rgba(20,66,105,.14);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .15s;
    flex:0 0 auto;
  }
  .hud-pill:active{ transform:translateY(3px) scale(.94); }
  .hud-pill.round{ width:64px; padding:0; border-radius:50%; }
  .hud-pill.active{
    background:linear-gradient(180deg,#ffe473,#ffc93c);
    box-shadow:0 5px 0 #c98600, 0 0 0 3.5px var(--ink);
  }
  .hud-pill.inst-btn.active{
    background:linear-gradient(180deg,#7dd3fc,#38bdf8);
    box-shadow:0 5px 0 #0284c7, 0 0 0 3.5px var(--ink);
  }
  #starBank{
    min-height:64px;
    padding:0 16px 0 11px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,247,.96);
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:25px;
    font-weight:700;
    box-shadow:0 5px 0 rgba(20,66,105,.22);
    flex:0 0 auto;
  }
  #starBank svg{ width:28px; height:28px; display:block; }
  #starBank.bump{ animation:starBump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{ 0%{transform:scale(1)} 45%{transform:scale(1.2) rotate(-4deg)} 100%{transform:scale(1)} }

  /* ================= SKY ARCH + HOOT + SONG BAR ================= */
  #skyScene{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding-bottom:6px;
  }
  #rainbowSvg{
    position:absolute;
    left:50%;
    bottom:-10px;
    transform:translateX(-50%);
    width:min(94vw, 760px);
    height:min(100%, 310px);
    pointer-events:none;
    z-index:2;
    overflow:visible;
  }
  .rb-arc{
    fill:none;
    stroke-width:22;
    stroke-linecap:round;
    opacity:.26;
    transition:opacity .25s ease, filter .25s ease;
  }
  .rb-arc.lit{
    opacity:1;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.85));
  }

  /* Song Picker & Note Progress Strip (shown in Song mode) */
  #songBar{
    position:relative;
    z-index:8;
    display:none;
    align-items:center;
    gap:10px;
    background:rgba(255,253,247,.96);
    border:4px solid #fff;
    border-radius:999px;
    padding:6px 14px;
    box-shadow:0 6px 0 rgba(20,66,105,.18);
    margin-bottom:8px;
  }
  #songBar.show{ display:flex; }
  .song-tab{
    width:52px; height:52px;
    border-radius:50%;
    border:3px solid #dbe7f2;
    background:#fff;
    font-size:26px;
    display:grid;
    place-items:center;
    cursor:pointer;
    transition:transform .14s;
  }
  .song-tab:active{ transform:scale(.9); }
  .song-tab.on{
    background:var(--sun);
    border-color:var(--ink);
    transform:scale(1.08);
  }
  #songDots{
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 6px;
  }
  .s-dot{
    width:18px;
    height:18px;
    border-radius:50%;
    border:3px solid #fff;
    box-shadow:0 2px 4px rgba(0,0,0,.22);
    opacity:.4;
    transition:transform .22s, opacity .22s;
  }
  .s-dot.done{ opacity:1; transform:scale(1.18); }
  .s-dot.cur{ opacity:1; transform:scale(1.38); outline:3px solid var(--ink); }

  /* Conductor Hoot sitting happily on left meadow */
  #hootMusic{
    position:absolute;
    left:clamp(10px, 3vw, 44px);
    bottom:4px;
    z-index:7;
    width:clamp(88px, 13vw, 142px);
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    filter:drop-shadow(0 8px 12px rgba(20,66,105,.24));
    animation:hootGroove 2.8s ease-in-out infinite;
    transform-origin:50% 90%;
  }
  @keyframes hootGroove{ 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-6px) rotate(2deg)} }
  #hootMusic.hop{ animation:hootHop .42s cubic-bezier(.34,1.7,.5,1) 2; }
  @keyframes hootHop{ 0%,100%{transform:translateY(0)} 45%{transform:translateY(-20px) rotate(-5deg)} }
  #hootMusic svg{ width:100%; height:auto; display:block; overflow:visible; }

  /* Dancing meadow flowers */
  .flower-toy{
    position:absolute;
    bottom:4px;
    width:46px; height:58px;
    border:none; background:none; padding:0; cursor:pointer;
    z-index:5;
    transform-origin:50% 100%;
    animation:flSway 3.2s ease-in-out infinite alternate;
  }
  @keyframes flSway{ from{transform:rotate(-5deg)} to{transform:rotate(5deg)} }
  .flower-toy.dance{ animation:flDance .4s cubic-bezier(.34,1.7,.5,1) 2; }
  @keyframes flDance{ 0%,100%{transform:scale(1)} 45%{transform:scale(1.34) rotate(-8deg)} }

  /* ================= GIANT WOODEN TOY RAINBOW PIANO DECK ================= */
  #pianoDeck{
    position:relative;
    z-index:10;
    flex:0 0 auto;
    padding:12px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    background:linear-gradient(180deg, #d89652 0%, #b47032 60%, #8a4f1d 100%);
    border-top:6px solid #f0bc7d;
    box-shadow:0 -8px 24px rgba(34,48,74,.22), inset 0 4px 8px rgba(255,240,210,.45);
  }
  #keysRow{
    display:grid;
    grid-template-columns:repeat(8, minmax(0, 1fr));
    gap:clamp(6px, 1.2vw, 14px);
    max-width:1100px;
    margin:0 auto;
    height:clamp(190px, 38vh, 300px);
    align-items:end;
  }
  .pkey{
    position:relative;
    border:4px solid #fff;
    border-radius:20px 20px 26px 26px;
    cursor:pointer;
    padding:0 0 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    color:#fff;
    font-family:"Fredoka",sans-serif;
    font-weight:700;
    touch-action:none;
    transition:transform .08s ease, filter .08s ease;
    box-shadow:0 10px 0 var(--kdeep), 0 14px 20px rgba(20,30,50,.28), inset 0 6px 12px rgba(255,255,255,.38);
    background:linear-gradient(180deg, var(--khi) 0%, var(--kcol) 55%, var(--kdeep) 100%);
  }
  /* Glossy toy xylophone/piano screw dot at top */
  .pkey::before{
    content:"";
    width:14px;
    height:14px;
    border-radius:50%;
    background:rgba(255,255,255,.72);
    border:2.5px solid rgba(0,0,0,.18);
    margin-top:12px;
    display:block;
  }
  .pkey .k-note{
    font-size:clamp(22px, 3.6vw, 36px);
    text-shadow:0 2px 0 rgba(0,0,0,.24);
    line-height:1;
  }
  .pkey .k-emo{
    font-size:clamp(18px, 2.8vw, 28px);
    line-height:1;
  }
  .pkey.pressed{
    transform:translateY(8px) scale(.98);
    box-shadow:0 2px 0 var(--kdeep), 0 4px 8px rgba(20,30,50,.22), inset 0 4px 10px rgba(255,255,255,.55);
    filter:brightness(1.14);
  }
  .pkey.cue{
    box-shadow:0 10px 0 var(--kdeep), 0 0 0 6px #ffe066, 0 0 28px rgba(255,224,102,.95);
    animation:keyPulse .75s ease-in-out infinite alternate;
  }
  @keyframes keyPulse{
    from{ transform:translateY(0); }
    to{ transform:translateY(-8px); }
  }
  .key-hand{
    position:absolute;
    top:-40px;
    left:50%;
    transform:translateX(-50%);
    font-size:34px;
    pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.28));
    animation:handTap .6s ease-in-out infinite alternate;
  }
  @keyframes handTap{ from{transform:translate(-50%,0)} to{transform:translate(-50%,-10px)} }

  /* Floating musical notes & confetti */
  .note-pop{
    position:absolute;
    z-index:25;
    font-size:38px;
    font-weight:700;
    pointer-events:none;
    text-shadow:0 3px 0 rgba(255,255,255,.9), 0 6px 10px rgba(0,0,0,.18);
  }
  .confetti{ position:absolute; z-index:28; width:12px; height:16px; border-radius:3px; pointer-events:none; }

  /* ================= PORTRAIT PHONE RESPONSIVE ================= */
  @media (max-width:600px){
    #hud{ gap:6px; padding-left:8px; padding-right:8px; }
    .hud-group{ gap:5px; }
    .hud-pill{ min-width:46px; min-height:46px; height:46px; padding:0 9px; font-size:20px; border-width:3px; }
    .hud-pill.round{ width:46px; }
    #starBank{ min-height:46px; padding:0 10px 0 8px; font-size:18px; border-width:3px; }
    #hootMusic{ width:76px; left:6px; }
    #pianoDeck{ padding:8px 6px max(10px, env(safe-area-inset-bottom)); }
    #keysRow{ gap:4px; height:min(44vh, 270px); }
    .pkey{ border-width:3px; border-radius:14px 14px 18px 18px; padding-bottom:10px; }
    .pkey::before{ width:10px; height:10px; margin-top:8px; }
    .pkey .k-note{ font-size:19px; }
    .pkey .k-emo{ font-size:15px; }
    #songBar{ gap:5px; padding:4px 10px; }
    .song-tab{ width:42px; height:42px; font-size:21px; }
    .s-dot{ width:13px; height:13px; }
  }
</style>
</head>
<body>
<div id="stage">
  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-group">
      <button class="hud-pill active" id="modeFreeBtn" type="button" aria-label="Free Jam" aria-pressed="true">🌈</button>
      <button class="hud-pill" id="modeSongBtn" type="button" aria-label="Follow-the-Glow Songs" aria-pressed="false">🎵</button>
      <button class="hud-pill round inst-btn active" type="button" data-inst="piano" aria-label="Piano sound">🎹</button>
      <button class="hud-pill round inst-btn" type="button" data-inst="bells" aria-label="Bells sound">🔔</button>
      <button class="hud-pill round inst-btn" type="button" data-inst="harp" aria-label="Harp sound">✨</button>
      <button class="hud-pill round inst-btn" type="button" data-inst="meow" aria-label="Silly Synth sound">🐱</button>
    </div>
    <div class="hud-group">
      <button class="hud-pill round" id="soundBtn" type="button" aria-label="Toggle Sound">🔊</button>
      <div id="starBank" aria-label="Stars collected">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4l3 6 6.6.9-4.8 4.6 1.1 6.6L12 17.4l-5.9 3.1 1.1-6.6-4.8-4.6 6.6-.9z" fill="#ffc93c" stroke="#d99400" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span id="starCount">0</span>
      </div>
    </div>
  </div>

  <!-- Living Rainbow Sky Arch + Conductor Hoot -->
  <div id="skyScene">
    <svg id="rainbowSvg" viewBox="0 0 700 320" aria-hidden="true">
      <path class="rb-arc" id="arc0" d="M40 310 A310 310 0 0 1 660 310" stroke="#ff595e"/>
      <path class="rb-arc" id="arc1" d="M68 310 A282 282 0 0 1 632 310" stroke="#ff924c"/>
      <path class="rb-arc" id="arc2" d="M96 310 A254 254 0 0 1 604 310" stroke="#ffca3a"/>
      <path class="rb-arc" id="arc3" d="M124 310 A226 226 0 0 1 576 310" stroke="#57cc62"/>
      <path class="rb-arc" id="arc4" d="M152 310 A198 198 0 0 1 548 310" stroke="#1ec8c8"/>
      <path class="rb-arc" id="arc5" d="M180 310 A170 170 0 0 1 520 310" stroke="#3a86ff"/>
      <path class="rb-arc" id="arc6" d="M208 310 A142 142 0 0 1 492 310" stroke="#9b5de5"/>
      <path class="rb-arc" id="arc7" d="M236 310 A114 114 0 0 1 464 310" stroke="#f472b6"/>
    </svg>

    <button id="hootMusic" type="button" aria-label="Conductor Hoot — tap to bounce">
      <svg viewBox="0 0 200 205" aria-hidden="true">
        <ellipse cx="100" cy="126" rx="60" ry="60" fill="#a26636" stroke="#4a2810" stroke-width="5"/>
        <ellipse cx="100" cy="142" rx="40" ry="40" fill="#fdecd2"/>
        <ellipse cx="42" cy="130" rx="18" ry="34" fill="#8b5226" stroke="#4a2810" stroke-width="4" transform="rotate(14 42 130)"/>
        <ellipse cx="158" cy="126" rx="18" ry="34" fill="#8b5226" stroke="#4a2810" stroke-width="4" transform="rotate(-24 158 126)"/>
        <circle cx="100" cy="76" r="49" fill="#a26636" stroke="#4a2810" stroke-width="5"/>
        <path d="M56 50 Q44 20 68 30 Z" fill="#8b5226" stroke="#4a2810" stroke-width="3.5"/>
        <path d="M144 50 Q156 20 132 30 Z" fill="#8b5226" stroke="#4a2810" stroke-width="3.5"/>
        <ellipse cx="79" cy="78" rx="22" ry="24" fill="#fdecd2"/>
        <ellipse cx="121" cy="78" rx="22" ry="24" fill="#fdecd2"/>
        <circle cx="79" cy="76" r="11" fill="#1b2c47"/><circle cx="121" cy="76" r="11" fill="#1b2c47"/>
        <circle cx="83" cy="72" r="4" fill="#fff"/><circle cx="125" cy="72" r="4" fill="#fff"/>
        <circle cx="57" cy="95" r="8" fill="#ff9e8a" opacity=".82"/><circle cx="143" cy="95" r="8" fill="#ff9e8a" opacity=".82"/>
        <path d="M90 90 Q100 84 110 90 Q106 104 100 106 Q94 104 90 90 Z" fill="#ffab1f" stroke="#b56200" stroke-width="2.5"/>
        <!-- Cute Red Musical Bow Tie -->
        <path d="M84 114 L100 122 L84 130 Z M116 114 L100 122 L116 130 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="100" cy="122" r="5" fill="#ffd447" stroke="#7f1d1d" stroke-width="2"/>
        <path d="M78 188 q-8 8 -14 6 M122 188 q8 8 14 6" stroke="#ffab1f" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      </svg>
    </button>

    <button class="flower-toy" type="button" style="right:6%" aria-label="Dancing Flower">
      <svg viewBox="0 0 48 62" aria-hidden="true"><path d="M24 62 Q22 44 24 28" stroke="#258038" stroke-width="4.5" fill="none" stroke-linecap="round"/><g fill="#ff8fab"><circle cx="24" cy="11" r="7.5"/><circle cx="13" cy="18" r="7.5"/><circle cx="35" cy="18" r="7.5"/><circle cx="17" cy="28" r="7.5"/><circle cx="31" cy="28" r="7.5"/></g><circle cx="24" cy="20" r="6.5" fill="#ffc93c"/></svg>
    </button>

    <!-- Song Picker + Note Dots -->
    <div id="songBar" role="group" aria-label="Choose a song">
      <button class="song-tab on" type="button" data-song="0" aria-label="Twinkle Star">⭐</button>
      <button class="song-tab" type="button" data-song="1" aria-label="Mary's Little Lamb">🐑</button>
      <button class="song-tab" type="button" data-song="2" aria-label="Rainbow Scale">🌈</button>
      <button class="song-tab" type="button" data-song="3" aria-label="Jingle Bells">🔔</button>
      <div id="songDots"></div>
    </div>
  </div>

  <!-- Giant Wooden Toy Rainbow Piano Keys -->
  <div id="pianoDeck">
    <div id="keysRow" role="group" aria-label="Rainbow piano keys"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* 8 Diatonic C-Major Rainbow Keys (graduated toy-xylophone heights!) */
  var KEYS=[
    {n:"C", freq:261.63, col:"#ff595e", hi:"#ff9195", deep:"#c8232c", emo:"🍎", h:"100%"},
    {n:"D", freq:293.66, col:"#ff924c", hi:"#ffc096", deep:"#cc5a14", emo:"🍊", h:"96%"},
    {n:"E", freq:329.63, col:"#ffca3a", hi:"#ffe699", deep:"#c98e00", emo:"⭐", h:"92%"},
    {n:"F", freq:349.23, col:"#57cc62", hi:"#9cf0a4", deep:"#289134", emo:"🐸", h:"88%"},
    {n:"G", freq:392.00, col:"#1ec8c8", hi:"#87f0f0", deep:"#0d8a8a", emo:"🐳", h:"84%"},
    {n:"A", freq:440.00, col:"#3a86ff", hi:"#94beff", deep:"#1853b8", emo:"🦋", h:"80%"},
    {n:"B", freq:493.88, col:"#9b5de5", hi:"#d0b0ff", deep:"#682cb3", emo:"🍇", h:"76%"},
    {n:"C", freq:523.25, col:"#f472b6", hi:"#fbc2df", deep:"#be2d78", emo:"🌸", h:"72%"}
  ];

  var SONGS=[
    {id:"twinkle", emo:"⭐", notes:[0,0,4,4,5,5,4]},
    {id:"mary",    emo:"🐑", notes:[2,1,0,1,2,2,2]},
    {id:"scale",   emo:"🌈", notes:[0,1,2,3,4,5,6,7]},
    {id:"jingle",  emo:"🔔", notes:[2,2,2,2,2,2,2,4,0,1,2]}
  ];

  var PRAISE=["hoot-great-job.mp3","hoot-amazing.mp3","hoot-star.mp3","hoot-super.mp3"];

  /* ================= STATE ================= */
  var mode="free"; /* free | song */
  var inst="piano"; /* piano | bells | harp | meow */
  var songIdx=0, noteIdx=0, stars=0, praiseIdx=0;
  var soundOn=true, dead=false, busyReplay=false;
  var keyEls=[], activePointerKey=new Map();

  function $(id){ return document.getElementById(id); }
  var stage=$("stage"), keysRow=$("keysRow"), songBar=$("songBar"), songDots=$("songDots"),
      hootMusic=$("hootMusic"), starCount=$("starCount"), starBank=$("starBank"),
      modeFreeBtn=$("modeFreeBtn"), modeSongBtn=$("modeSongBtn"), soundBtn=$("soundBtn");

  /* ================= MUSICAL SYNTH ENGINE ================= */
  var AC=null;
  function audio(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
    if(AC&&AC.state==="suspended") AC.resume();
    return AC;
  }
  function playNote(idx){
    if(!soundOn) return;
    var ac=audio(); if(!ac) return;
    var f=KEYS[idx].freq, t=ac.currentTime;

    if(inst==="piano"){
      /* Warm toy grand piano: fundamental + 2nd harmonic */
      var o1=ac.createOscillator(), o2=ac.createOscillator(), g=ac.createGain();
      o1.type="triangle"; o2.type="sine";
      o1.frequency.setValueAtTime(f,t); o2.frequency.setValueAtTime(f*2,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.24,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.68);
      o1.connect(g); o2.connect(g); g.connect(ac.destination);
      o1.start(t); o2.start(t); o1.stop(t+0.7); o2.stop(t+0.7);
    } else if(inst==="bells"){
      /* Shimmering chime bells */
      [1,2.01,3.02].forEach(function(m,k){
        var o=ac.createOscillator(), g=ac.createGain();
        o.type="sine"; o.frequency.setValueAtTime(f*m,t);
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.16/(k+1),t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.95/(k+0.7));
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1.0);
      });
    } else if(inst==="harp"){
      /* Plucked harp shimmer */
      [1, 1.5].forEach(function(m,k){
        var o=ac.createOscillator(), g=ac.createGain();
        o.type="triangle"; o.frequency.setValueAtTime(f*m,t+k*0.045);
        g.gain.setValueAtTime(0.0001,t+k*0.045);
        g.gain.exponentialRampToValueAtTime(0.16,t+k*0.045+0.012);
        g.gain.exponentialRampToValueAtTime(0.0001,t+k*0.045+0.55);
        o.connect(g); g.connect(ac.destination); o.start(t+k*0.045); o.stop(t+k*0.045+0.6);
      });
    } else {
      /* Playful silly meow/boing synth */
      var o=ac.createOscillator(), g=ac.createGain();
      o.type="sawtooth";
      var flt=ac.createBiquadFilter(); flt.type="lowpass"; flt.frequency.setValueAtTime(f*4,t);
      o.frequency.setValueAtTime(f*0.86,t);
      o.frequency.exponentialRampToValueAtTime(f*1.12,t+0.12);
      o.frequency.exponentialRampToValueAtTime(f*0.95,t+0.34);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.14,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.38);
      o.connect(flt); flt.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t+0.42);
    }
  }

  /* ================= STUDIO HOOT VOICE ================= */
  var VBASE="assets/voice/";
  var voiceEl=null;
  function hasClip(id){
    try{ var H=window.parent&&window.parent.HOOT_HAVE; if(H) return !!H[id]; }catch(e){}
    return true;
  }
  function hubQuiet(){
    try{
      var d=window.parent&&window.parent.document;
      if(!d||d===document) return false;
      var b=d.querySelector('.voice-btn[data-voice="off"]');
      return !!(b&&(b.classList.contains("sel")||b.classList.contains("active")||b.getAttribute("aria-pressed")==="true"));
    }catch(e){ return false; }
  }
  function speakClip(file, giggle){
    if(!soundOn||hubQuiet()||dead) return;
    if(!voiceEl){ voiceEl=new Audio(); voiceEl.preload="auto"; }
    if(giggle) window.__bellyArmed=true;
    voiceEl.src=VBASE+file;
    var p=voiceEl.play();
    if(giggle) setTimeout(function(){ window.__bellyArmed=false; }, 120);
    if(p&&p.catch) p.catch(function(){});
  }

  /* ================= FX ================= */
  function spawnNote(keyEl, col){
    var sr=stage.getBoundingClientRect(), r=keyEl.getBoundingClientRect();
    var el=document.createElement("span");
    el.className="note-pop";
    el.textContent=Math.random()<0.5?"♪":"♫";
    el.style.color=col;
    el.style.left=(r.left-sr.left+r.width/2-14)+"px";
    el.style.top=(r.top-sr.top-12)+"px";
    stage.appendChild(el);
    if(el.animate){
      var dx=(Math.random()-0.5)*56;
      el.animate([
        {transform:"translate(0,0) scale(.6)", opacity:1},
        {transform:"translate("+dx+"px,-110px) scale(1.25) rotate("+(dx*0.3)+"deg)", opacity:0}
      ],{duration:820, easing:"cubic-bezier(.2,.7,.3,1)"});
    }
    setTimeout(function(){ el.remove(); }, 860);
  }

  function spawnConfetti(n){
    var sr=stage.getBoundingClientRect();
    var cols=["#ff595e","#ffca3a","#57cc62","#1ec8c8","#3a86ff","#9b5de5","#f472b6"];
    for(var i=0;i<(n||34);i++){
      var c=document.createElement("div"); c.className="confetti";
      c.style.background=cols[i%cols.length];
      c.style.left=(sr.width*0.5)+"px"; c.style.top=(sr.height*0.28)+"px";
      stage.appendChild(c);
      var dx=(Math.random()-0.5)*sr.width*0.86, dy=130+Math.random()*sr.height*0.46, rot=(Math.random()*2-1)*380;
      if(c.animate){
        c.animate([
          {transform:"translate(0,0) rotate(0deg)", opacity:1},
          {transform:"translate("+dx+"px,"+dy+"px) rotate("+rot+"deg)", opacity:0}
        ],{duration:1100+Math.random()*650, easing:"cubic-bezier(.2,.7,.3,1)"});
      }
      (function(el){ setTimeout(function(){ el.remove(); }, 1850); })(c);
    }
  }

  /* ================= BUILD PIANO KEYS (WITH GLISSANDO SUPPORT!) ================= */
  KEYS.forEach(function(k, i){
    var b=document.createElement("button");
    b.type="button";
    b.className="pkey";
    b.dataset.idx=i;
    b.style.height=k.h;
    b.style.setProperty("--kcol", k.col);
    b.style.setProperty("--khi", k.hi);
    b.style.setProperty("--kdeep", k.deep);
    b.setAttribute("aria-label","Piano key "+k.n);
    b.innerHTML='<span class="k-emo" aria-hidden="true">'+k.emo+'</span><span class="k-note">'+k.n+'</span>';
    keysRow.appendChild(b);
    keyEls.push(b);
  });

  function lightKey(idx){
    var el=keyEls[idx];
    if(!el) return;
    el.classList.add("pressed");
    setTimeout(function(){ el.classList.remove("pressed"); }, 180);
    var arc=$("arc"+idx);
    if(arc){
      arc.classList.add("lit");
      if(mode==="free"){
        clearTimeout(arc._t);
        arc._t=setTimeout(function(){ arc.classList.remove("lit"); }, 950);
      }
    }
    spawnNote(el, KEYS[idx].col);
    hootMusic.classList.remove("hop"); void hootMusic.offsetWidth; hootMusic.classList.add("hop");
    var fl=document.querySelector(".flower-toy");
    if(fl){ fl.classList.remove("dance"); void fl.offsetWidth; fl.classList.add("dance"); }
  }

  function triggerKey(idx){
    if(dead || busyReplay) return;
    audio();
    playNote(idx);
    lightKey(idx);

    if(mode==="song"){
      var song=SONGS[songIdx];
      var expected=song.notes[noteIdx];
      if(idx===expected){
        noteIdx++;
        renderSongCue();
        if(noteIdx>=song.notes.length){
          /* SONG COMPLETE! */
          stars++;
          starCount.textContent=stars;
          starBank.classList.remove("bump"); void starBank.offsetWidth; starBank.classList.add("bump");
          for(var a=0;a<8;a++) $("arc"+a).classList.add("lit");
          spawnConfetti(38);
          var pr=PRAISE[praiseIdx%PRAISE.length]; praiseIdx++;
          if(!hasClip(pr.replace(".mp3",""))) pr="hoot-great-job.mp3";
          speakClip(pr, false);
          /* Auto-replay the melody joyfully, then cue the next song! */
          busyReplay=true;
          clearSongCues();
          song.notes.forEach(function(ni, k){
            setTimeout(function(){
              if(dead) return;
              playNote(ni); lightKey(ni);
            }, 650 + k*270);
          });
          setTimeout(function(){
            if(dead) return;
            busyReplay=false;
            songIdx=(songIdx+1)%SONGS.length;
            selectSong(songIdx);
          }, 950 + song.notes.length*270);
        }
      }
    }
  }

  /* Smooth multi-touch + finger-slide glissando across keys! */
  keysRow.addEventListener("pointerdown",function(e){
    var k=e.target.closest(".pkey");
    if(!k) return;
    e.preventDefault();
    var idx=Number(k.dataset.idx);
    activePointerKey.set(e.pointerId, idx);
    triggerKey(idx);
    try{ keysRow.setPointerCapture(e.pointerId); }catch(err){}
  });
  keysRow.addEventListener("pointermove",function(e){
    if(!activePointerKey.has(e.pointerId)) return;
    var hit=document.elementFromPoint(e.clientX, e.clientY);
    var k=hit && hit.closest ? hit.closest(".pkey") : null;
    if(!k) return;
    var idx=Number(k.dataset.idx);
    if(activePointerKey.get(e.pointerId)!==idx){
      activePointerKey.set(e.pointerId, idx);
      triggerKey(idx);
    }
  });
  function releasePtr(e){ activePointerKey.delete(e.pointerId); }
  keysRow.addEventListener("pointerup",releasePtr);
  keysRow.addEventListener("pointercancel",releasePtr);

  /* ================= FOLLOW-THE-GLOW SONG MODE ================= */
  function clearSongCues(){
    keyEls.forEach(function(el){
      el.classList.remove("cue");
      var h=el.querySelector(".key-hand"); if(h) h.remove();
    });
  }
  function renderSongCue(){
    clearSongCues();
    songDots.innerHTML="";
    if(mode!=="song") return;
    var song=SONGS[songIdx];
    song.notes.forEach(function(ni, i){
      var d=document.createElement("span");
      d.className="s-dot"+(i<noteIdx?" done":(i===noteIdx?" cur":""));
      d.style.background=KEYS[ni].col;
      songDots.appendChild(d);
    });
    if(noteIdx<song.notes.length){
      var targetEl=keyEls[song.notes[noteIdx]];
      targetEl.classList.add("cue");
      var hand=document.createElement("span");
      hand.className="key-hand";
      hand.setAttribute("aria-hidden","true");
      hand.textContent="👆";
      targetEl.appendChild(hand);
    }
  }
  function selectSong(idx){
    songIdx=idx;
    noteIdx=0;
    for(var a=0;a<8;a++) $("arc"+a).classList.remove("lit");
    document.querySelectorAll(".song-tab").forEach(function(b){
      b.classList.toggle("on", Number(b.dataset.song)===songIdx);
    });
    renderSongCue();
  }

  /* ================= CONTROLS ================= */
  modeFreeBtn.addEventListener("click",function(){
    audio();
    mode="free"; busyReplay=false;
    modeFreeBtn.classList.add("active"); modeFreeBtn.setAttribute("aria-pressed","true");
    modeSongBtn.classList.remove("active"); modeSongBtn.setAttribute("aria-pressed","false");
    songBar.classList.remove("show");
    clearSongCues();
  });
  modeSongBtn.addEventListener("click",function(){
    audio();
    mode="song"; busyReplay=false;
    modeSongBtn.classList.add("active"); modeSongBtn.setAttribute("aria-pressed","true");
    modeFreeBtn.classList.remove("active"); modeFreeBtn.setAttribute("aria-pressed","false");
    songBar.classList.add("show");
    selectSong(songIdx);
  });
  document.querySelectorAll(".song-tab").forEach(function(b){
    b.addEventListener("click",function(){
      audio(); busyReplay=false;
      selectSong(Number(b.dataset.song)||0);
    });
  });
  document.querySelectorAll(".inst-btn").forEach(function(b){
    b.addEventListener("click",function(){
      audio();
      inst=b.dataset.inst;
      document.querySelectorAll(".inst-btn").forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      playNote(4);
    });
  });
  soundBtn.addEventListener("click",function(){
    soundOn=!soundOn;
    soundBtn.textContent=soundOn?"🔊":"🔇";
  });

  var lastHootTap=0;
  hootMusic.addEventListener("click",function(){
    audio();
    hootMusic.classList.remove("hop"); void hootMusic.offsetWidth; hootMusic.classList.add("hop");
    var now=Date.now();
    if(now-lastHootTap>7000){
      lastHootTap=now;
      speakClip("hoot-giggle.mp3", true);
    } else playNote(0);
  });
  document.querySelector(".flower-toy").addEventListener("click",function(){
    audio(); playNote(7);
    this.classList.remove("dance"); void this.offsetWidth; this.classList.add("dance");
  });

  window.addEventListener("pagehide",function(){ dead=true; if(voiceEl) try{voiceEl.pause();}catch(e){} });

  if(/(^|[?&])kid=kida(&|$)/.test(location.search)){
    modeSongBtn.click();
  }

  window.__pianoGame={
    snapshot:function(){
      return { mode:mode, inst:inst, songIdx:songIdx, noteIdx:noteIdx, stars:stars, keyCount:keyEls.length };
    }
  };
})();
</script>
