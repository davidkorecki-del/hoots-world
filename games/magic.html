<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>
window.__HOOT_GAME_KEY__="magic";
window.__HOOT_SELF_COACH__=true;
</script>
<script src="js/hoot-game-head.js?v=llprev3e141"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Magic Hat Surprises</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --midnight:#140931;
    --royal:#2a1461;
    --violet:#482496;
    --crimson:#a4133c;
    --crimson-deep:#630824;
    --crimson-hi:#d62454;
    --gold:#ffd84d;
    --gold-deep:#d99100;
    --gold-soft:#fff3b8;
    --cream:#fffdf7;
    --ink:#221242;
    --leaf:#47c75d;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; width:100%; margin:0; padding:0; overflow:hidden; }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--cream);
    background:var(--midnight);
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ================= GRAND ROYAL VELVET MAGICIAN THEATER ================= */
  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 68% 58% at 50% 44%, rgba(114,66,214,.62) 0%, rgba(52,23,115,.35) 52%, transparent 78%),
      radial-gradient(circle at 22% 24%, rgba(255,216,77,.14) 0%, transparent 45%),
      radial-gradient(circle at 78% 24%, rgba(255,152,216,.14) 0%, transparent 45%),
      linear-gradient(180deg, #100729 0%, #231152 46%, #31196b 74%, #1d0d42 100%);
  }

  /* Soft volumetric stage spotlights streaming onto the hat */
  #spotlights{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }
  .beam{
    position:absolute;
    top:-12%;
    width:42vw;
    height:108%;
    opacity:.22;
    filter:blur(10px);
    transform-origin:50% 0%;
  }
  .beam-l{
    left:4%;
    background:linear-gradient(180deg, rgba(255,232,140,.72) 0%, rgba(255,220,110,.16) 58%, transparent 100%);
    clip-path:polygon(38% 0%, 56% 0%, 100% 100%, 4% 100%);
    animation:beamSwayL 7s ease-in-out infinite alternate;
  }
  .beam-r{
    right:4%;
    background:linear-gradient(180deg, rgba(235,196,255,.68) 0%, rgba(190,136,255,.16) 58%, transparent 100%);
    clip-path:polygon(44% 0%, 62% 0%, 96% 100%, 0% 100%);
    animation:beamSwayR 8s ease-in-out infinite alternate;
  }
  @keyframes beamSwayL{ from{ transform:rotate(-3deg); } to{ transform:rotate(3deg); } }
  @keyframes beamSwayR{ from{ transform:rotate(3deg); } to{ transform:rotate(-3deg); } }

  /* Starry royal sky */
  #starSky{
    position:absolute;
    inset:0 0 28% 0;
    z-index:2;
    pointer-events:none;
  }
  .sky-star{
    position:absolute;
    border:none;
    background:none;
    padding:4px;
    color:var(--gold);
    line-height:1;
    cursor:pointer;
    pointer-events:auto;
    filter:drop-shadow(0 0 8px rgba(255,216,77,.85));
    animation:starTwinkle 2.6s ease-in-out infinite alternate;
  }
  .sky-star.zing{ animation:starZing .55s cubic-bezier(.34,1.8,.5,1) 1 !important; }
  @keyframes starTwinkle{
    from{ opacity:.42; transform:scale(.78) rotate(-8deg); }
    to{ opacity:1; transform:scale(1.18) rotate(10deg); }
  }
  @keyframes starZing{
    0%{ transform:scale(1) rotate(0deg); }
    45%{ transform:scale(1.75) rotate(35deg); filter:drop-shadow(0 0 18px #fff); }
    100%{ transform:scale(1) rotate(0deg); }
  }

  /* Parted Crimson Velvet Theater Curtains + Golden Valance */
  #valance{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:clamp(46px, 7.2vh, 72px);
    z-index:4;
    pointer-events:none;
  }
  #valance svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 12px rgba(10,2,26,.55)); }

  .curtain-btn{
    position:absolute;
    top:0;
    bottom:0;
    width:clamp(46px, 8.8vw, 128px);
    z-index:5;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    transition:transform .38s cubic-bezier(.34,1.6,.5,1);
    overflow:visible;
  }
  .curtain-btn svg{ width:100%; height:100%; display:block; }
  #curtainLeft{ left:0; transform-origin:0% 0%; }
  #curtainRight{ right:0; transform-origin:100% 0%; }
  #curtainLeft.swish{ transform:skewX(-4deg) scaleX(1.06); }
  #curtainRight.swish{ transform:skewX(4deg) scaleX(1.06); }

  /* Polished Theater Stage Floor & Glowing Golden Footlights */
  #stageFloor{
    position:absolute;
    left:0;
    right:0;
    bottom:78px;
    height:clamp(108px, 21vh, 178px);
    z-index:3;
    pointer-events:none;
    background:
      radial-gradient(ellipse 46% 52% at 50% 42%, rgba(255,216,77,.24) 0%, rgba(164,90,255,.14) 55%, transparent 78%),
      radial-gradient(ellipse 30% 40% at 21% 48%, rgba(255,222,120,.16) 0%, transparent 72%),
      linear-gradient(180deg, #4b1d52 0%, #371242 28%, #260b34 100%);
    border-top:4px solid rgba(255,216,77,.58);
    box-shadow:inset 0 12px 28px rgba(255,216,77,.16), 0 -10px 30px rgba(12,4,30,.55);
    border-radius:50% 50% 0 0 / 26px 26px 0 0;
  }
  #stageFloor::after{
    content:"";
    position:absolute;
    inset:6px 0 0 0;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, transparent 2px 54px);
    opacity:.65;
  }

  #footlights{
    position:absolute;
    left:clamp(46px, 8vw, 128px);
    right:clamp(46px, 8vw, 128px);
    bottom:80px;
    height:28px;
    z-index:6;
    display:flex;
    align-items:flex-end;
    justify-content:space-evenly;
    pointer-events:none;
  }
  .footlight{
    position:relative;
    width:26px;
    height:20px;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    pointer-events:auto;
  }
  .footlight::before{
    content:"";
    position:absolute;
    left:50%;
    bottom:4px;
    width:46px;
    height:34px;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,232,122,.78) 0%, rgba(255,192,56,.26) 45%, transparent 75%);
    pointer-events:none;
    animation:bulbGlow 2.4s ease-in-out infinite alternate;
  }
  .footlight::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:1px;
    transform:translateX(-50%);
    width:20px;
    height:13px;
    border-radius:12px 12px 4px 4px;
    background:linear-gradient(180deg, #fff8cc 0%, #ffd84d 45%, #c77b00 100%);
    border:2px solid #fff3b0;
    box-shadow:0 0 12px rgba(255,216,77,.9);
  }
  .footlight.flash::before{
    transform:translateX(-50%) scale(1.65);
    opacity:1;
  }
  @keyframes bulbGlow{
    from{ opacity:.62; transform:translateX(-50%) scale(.92); }
    to{ opacity:1; transform:translateX(-50%) scale(1.12); }
  }

  /* ================= TOP HUD (ALL >=64PX, PICTURE-ONLY) ================= */
  #hud{
    position:relative;
    z-index:20;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 4px max(12px, env(safe-area-inset-left));
    pointer-events:none;
  }
  .hud-group{
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:auto;
  }
  .hud-pill{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 16px;
    border-radius:999px;
    border:4px solid #fff6d6;
    background:rgba(66,34,140,.95);
    color:#fff;
    font-size:29px;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(14,5,36,.65), 0 10px 22px rgba(10,2,28,.35);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .16s, box-shadow .16s;
  }
  .hud-pill:active{ transform:translateY(3px) scale(.94); }
  .hud-pill.round{ width:64px; padding:0; border-radius:50%; }
  .hud-pill.mode-btn.active{
    background:linear-gradient(180deg, #ffe87c 0%, #ffbe26 100%);
    color:var(--ink);
    border-color:#fff;
    box-shadow:0 5px 0 #b87300, 0 0 22px rgba(255,216,77,.75);
    transform:translateY(-2px);
  }
  .mode-q-glyph{
    font-family:"Fredoka",sans-serif;
    font-weight:700;
    font-size:34px;
    line-height:1;
    color:#ffd84d;
    text-shadow:0 2px 0 rgba(20,6,48,.55);
  }
  .hud-pill.mode-btn.active .mode-q-glyph{
    color:#7a1034;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  #starPill{
    min-height:64px;
    height:64px;
    padding:0 16px 0 12px;
    border-radius:999px;
    border:4px solid #fff6d6;
    background:rgba(44,22,98,.92);
    box-shadow:0 5px 0 rgba(14,5,36,.65);
    display:inline-flex;
    align-items:center;
    gap:8px;
    pointer-events:auto;
  }
  #starPill.bump{ animation:starBump .46s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.18) rotate(-3deg); }
    100%{ transform:scale(1); }
  }
  #starPips{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .star-pip{
    font-size:24px;
    line-height:1;
    color:rgba(255,255,255,.24);
    transition:transform .28s cubic-bezier(.34,1.8,.5,1), color .2s;
  }
  .star-pip.on{
    color:var(--gold);
    text-shadow:0 0 12px rgba(255,216,77,.95);
    transform:scale(1.16);
  }
  #starNum{
    font-family:"Fredoka",sans-serif;
    font-weight:700;
    font-size:24px;
    color:#fff6c7;
    min-width:18px;
    text-align:center;
  }

  /* ================= MAIN THEATER ARENA ================= */
  #arena{
    position:relative;
    z-index:10;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding:0 clamp(46px, 8.5vw, 130px) 10px;
  }

  #stageRow{
    position:relative;
    width:100%;
    max-width:980px;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:clamp(12px, 3.2vw, 44px);
    padding-bottom:clamp(10px, 2.4vh, 24px);
  }

  /* MAGICIAN HOOT (Left side of stage) */
  #hootAnchor{
    position:relative;
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    z-index:12;
  }
  #magicianHoot{
    position:relative;
    width:clamp(138px, 16.5vw, 212px);
    height:clamp(152px, 18.5vw, 232px);
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    transform-origin:50% 90%;
    filter:drop-shadow(0 12px 16px rgba(10,3,26,.52));
    animation:hootIdle 3.4s ease-in-out infinite;
    outline:none;
  }
  #magicianHoot svg{ width:100%; height:100%; display:block; overflow:visible; }
  #magicianHoot:active{ transform:scale(.94); }
  @keyframes hootIdle{
    0%,100%{ transform:translateY(0) rotate(-1.2deg); }
    50%{ transform:translateY(-6px) rotate(1.4deg); }
  }
  #magicianHoot.talking{ animation:hootTalk .22s ease-in-out infinite alternate; }
  @keyframes hootTalk{
    from{ transform:translateY(0) scale(1); }
    to{ transform:translateY(-5px) scale(1.03); }
  }
  #magicianHoot.cheer{ animation:hootCheer .52s cubic-bezier(.34,1.8,.5,1) 2; }
  @keyframes hootCheer{
    0%,100%{ transform:translateY(0) rotate(0); }
    45%{ transform:translateY(-22px) rotate(-5deg) scale(1.06); }
  }
  #magicianHoot .hoot-wing-r{
    transform-box:fill-box;
    transform-origin:15% 40%;
    transition:transform .28s cubic-bezier(.34,1.7,.5,1);
  }
  #magicianHoot.cheer .hoot-wing-r,
  #magicianHoot.cast .hoot-wing-r{
    transform:rotate(-32deg) translateY(-6px);
  }

  /* CENTER VELVET TOP HAT + MAGIC TABLE + POP-OUT SURPRISE */
  #centerEnsemble{
    position:relative;
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    z-index:13;
  }

  /* Pop-Out Surprise & Sneaky Peek Stage directly above the Top Hat rim */
  #popStage{
    position:relative;
    width:clamp(196px, 24vw, 276px);
    height:clamp(142px, 22vh, 198px);
    margin-bottom:clamp(-32px, -3.5vh, -20px);
    z-index:14;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    pointer-events:none;
  }

  /* Sneaky Peek silhouette in Guess Mode */
  #peekWrap{
    position:absolute;
    left:50%;
    bottom:-26px;
    transform:translateX(-50%);
    width:clamp(118px, 14.5vw, 158px);
    height:clamp(118px, 14.5vw, 158px);
    overflow:hidden;
    pointer-events:none;
    z-index:13;
    clip-path:inset(0 0 24% 0);
  }
  #peekArt{
    width:100%;
    height:100%;
    transform:translateY(44%) scale(.88);
    filter:brightness(.14) saturate(1.6) drop-shadow(0 0 12px rgba(255,216,77,.92));
    animation:sneakyBob 2.4s ease-in-out infinite;
  }
  #peekWrap.higher #peekArt{
    animation:sneakyBobHigh 2s ease-in-out infinite;
  }
  #peekArt svg{ width:100%; height:100%; display:block; }
  @keyframes sneakyBob{
    0%,100%{ transform:translateY(56%) scale(.86) rotate(-3deg); }
    42%,58%{ transform:translateY(16%) scale(.96) rotate(3deg); }
  }
  @keyframes sneakyBobHigh{
    0%,100%{ transform:translateY(42%) scale(.9) rotate(-4deg); }
    42%,58%{ transform:translateY(4%) scale(1.02) rotate(4deg); }
  }
  #peekQ{
    position:absolute;
    left:50%;
    top:4px;
    transform:translateX(-50%);
    font-family:"Fredoka",sans-serif;
    font-weight:700;
    font-size:clamp(30px, 4vw, 42px);
    color:var(--gold);
    text-shadow:0 4px 0 #4d229e, 0 0 18px rgba(255,216,77,.95);
    animation:qFloat 1.5s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes qFloat{
    from{ transform:translateX(-50%) translateY(0) scale(.94); }
    to{ transform:translateX(-50%) translateY(-8px) scale(1.12); }
  }

  /* Huge Smiling Pop-Out Surprise + Giant Starting Letter Badge */
  #popRevealBtn{
    position:relative;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    pointer-events:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    width:clamp(144px, 18vw, 190px);
    height:clamp(144px, 18vw, 190px);
    margin-bottom:6px;
    z-index:16;
    outline:none;
  }
  #popRevealBtn.pop-in{
    animation:surpriseSpring .68s cubic-bezier(.22,1.62,.42,1) forwards;
  }
  #popRevealBtn.hop{
    animation:surpriseHop .42s cubic-bezier(.34,1.8,.5,1);
  }
  @keyframes surpriseSpring{
    0%{ transform:translateY(84px) scale(.22) rotate(-10deg); opacity:0; }
    52%{ transform:translateY(-16px) scale(1.16) rotate(4deg); opacity:1; }
    78%{ transform:translateY(4px) scale(.95) rotate(-2deg); opacity:1; }
    100%{ transform:translateY(0) scale(1) rotate(0deg); opacity:1; }
  }
  @keyframes surpriseHop{
    0%,100%{ transform:translateY(0) scale(1); }
    45%{ transform:translateY(-18px) scale(1.12) rotate(-4deg); }
  }
  #popArt{
    width:100%;
    height:100%;
    filter:drop-shadow(0 12px 18px rgba(14,4,38,.55)) drop-shadow(0 0 22px rgba(255,235,140,.45));
  }
  #popArt svg{ width:100%; height:100%; display:block; overflow:visible; }

  #letterBadge{
    position:absolute;
    right:-18px;
    top:-4px;
    width:clamp(60px, 7.2vw, 78px);
    height:clamp(60px, 7.2vw, 78px);
    border-radius:22px;
    background:linear-gradient(180deg, #fff29a 0%, #ffc82e 100%);
    border:4.5px solid #fff;
    color:var(--ink);
    font-family:"Fredoka",sans-serif;
    font-weight:700;
    font-size:clamp(36px, 4.4vw, 48px);
    line-height:1;
    display:grid;
    place-items:center;
    box-shadow:0 6px 0 #c77b00, 0 12px 24px rgba(10,2,28,.45);
    transform:rotate(7deg);
    animation:badgePop .55s cubic-bezier(.34,1.8,.5,1) .12s backwards;
  }
  @keyframes badgePop{
    0%{ transform:scale(0) rotate(-18deg); }
    100%{ transform:scale(1) rotate(7deg); }
  }

  /* Purple Magic Poof Cloud */
  #poofLayer{
    position:absolute;
    left:50%;
    bottom:-10px;
    transform:translateX(-50%);
    width:260px;
    height:120px;
    pointer-events:none;
    z-index:18;
  }
  .poof-puff{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #fff8ff 0%, #e1b8ff 46%, rgba(164,92,255,.78) 78%, transparent 100%);
    opacity:0;
    pointer-events:none;
  }

  /* Giant Shimmering Velvet Top Hat Button */
  #hatWrap{
    position:relative;
    z-index:15;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:-14px;
  }
  #hatAura{
    position:absolute;
    left:50%;
    top:48%;
    width:136%;
    height:136%;
    transform:translate(-50%,-50%) scale(.75);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,226,105,.72) 0%, rgba(196,120,255,.42) 44%, transparent 72%);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s, transform .35s cubic-bezier(.34,1.6,.5,1);
  }
  #hatWrap.charged #hatAura{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.08);
    animation:auraPulse 1.15s ease-in-out infinite alternate;
  }
  @keyframes auraPulse{
    from{ transform:translate(-50%,-50%) scale(1.02); opacity:.78; }
    to{ transform:translate(-50%,-50%) scale(1.18); opacity:1; }
  }

  #magicHatBtn{
    position:relative;
    width:clamp(192px, 23.5vw, 266px);
    height:clamp(134px, 16.5vw, 186px);
    min-width:64px;
    min-height:64px;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    outline:none;
    filter:drop-shadow(0 12px 16px rgba(10,3,28,.62));
    transition:transform .16s cubic-bezier(.34,1.6,.5,1), filter .25s;
  }
  #magicHatBtn svg{ width:100%; height:100%; display:block; overflow:visible; }
  #magicHatBtn:active{ transform:scale(.95, 1.04); }
  #hatWrap.charged #magicHatBtn{
    filter:drop-shadow(0 0 18px rgba(255,222,95,.95)) drop-shadow(0 10px 18px rgba(10,3,28,.55));
    animation:hatExcited 1.05s ease-in-out infinite;
  }
  @keyframes hatExcited{
    0%,100%{ transform:translateY(0) rotate(0deg) scale(1); }
    25%{ transform:translateY(-6px) rotate(-4deg) scale(1.04, .97); }
    50%{ transform:translateY(-2px) rotate(0deg) scale(.98, 1.04); }
    75%{ transform:translateY(-6px) rotate(4deg) scale(1.04, .97); }
  }
  #magicHatBtn.wiggle{ animation:hatWiggle .46s ease-in-out 1 !important; }
  @keyframes hatWiggle{
    0%,100%{ transform:rotate(0) scale(1); }
    25%{ transform:rotate(-8deg) scale(1.06, .94); }
    60%{ transform:rotate(7deg) scale(.96, 1.05); }
  }
  #magicHatBtn.poof-kick{ animation:hatKick .42s cubic-bezier(.34,1.8,.5,1) 1 !important; }
  @keyframes hatKick{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.16, .82) translateY(8px); }
    68%{ transform:scale(.94, 1.08) translateY(-5px); }
    100%{ transform:scale(1); }
  }

  /* Draped Golden Magician Table */
  #magicTable{
    position:relative;
    z-index:12;
    width:clamp(218px, 26.5vw, 304px);
    height:clamp(82px, 11.5vh, 114px);
    pointer-events:none;
    filter:drop-shadow(0 12px 18px rgba(8,2,24,.65));
  }
  #magicTable svg{ width:100%; height:100%; display:block; overflow:visible; }

  /* STAR MAGIC WAND (Right of Hat on Landscape, Centered Control Row on Portrait) */
  #wandAnchor{
    position:relative;
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding-bottom:clamp(26px, 5vh, 52px);
    z-index:16;
  }
  #magicWandBtn{
    position:relative;
    width:clamp(94px, 11.2vw, 122px);
    height:clamp(94px, 11.2vw, 122px);
    min-width:64px;
    min-height:64px;
    border-radius:50%;
    border:5px solid #fff8d6;
    background:radial-gradient(circle at 34% 28%, #8f63ff 0%, #5c2fd1 58%, #35158c 100%);
    box-shadow:
      0 8px 0 #260d6b,
      0 14px 28px rgba(10,2,28,.55),
      inset 0 4px 10px rgba(255,255,255,.42);
    cursor:pointer;
    padding:10px;
    display:grid;
    place-items:center;
    touch-action:none;
    outline:none;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1), box-shadow .22s;
  }
  #magicWandBtn svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
    filter:drop-shadow(0 4px 6px rgba(18,5,48,.45));
  }
  #magicWandBtn:active{ transform:scale(.92) rotate(-10deg); }
  #magicWandBtn.cue-ready{
    box-shadow:
      0 8px 0 #260d6b,
      0 0 0 6px rgba(255,216,77,.82),
      0 0 32px rgba(255,216,77,.92);
    animation:wandReady 1.25s ease-in-out infinite;
  }
  @keyframes wandReady{
    0%,100%{ transform:scale(1) rotate(0deg); }
    50%{ transform:scale(1.07) rotate(-4deg); }
  }
  #magicWandBtn.wave{
    animation:wandWave .48s cubic-bezier(.34,1.7,.5,1) 1 !important;
  }
  @keyframes wandWave{
    0%{ transform:rotate(0) scale(1); }
    35%{ transform:rotate(-26deg) scale(1.12); }
    72%{ transform:rotate(14deg) scale(1.05); }
    100%{ transform:rotate(0) scale(1); }
  }
  #magicWandBtn.dimmed{
    opacity:.74;
    transform:scale(.92);
  }

  /* Unmistakable Bouncing 👆 Hand Cue */
  .magic-hand{
    position:absolute;
    z-index:22;
    font-size:clamp(36px, 4.4vw, 48px);
    line-height:1;
    pointer-events:none;
    filter:drop-shadow(0 4px 0 rgba(25,8,58,.65)) drop-shadow(0 0 12px rgba(255,232,120,.9));
    animation:handBounce .68s ease-in-out infinite alternate;
  }
  #wandHand{
    right:-16px;
    bottom:-18px;
  }
  #hatHand{
    right:14px;
    bottom:4px;
  }
  @keyframes handBounce{
    from{ transform:translateY(0) scale(1) rotate(-10deg); }
    to{ transform:translateY(-12px) scale(1.12) rotate(4deg); }
  }

  /* ================= GUESS WHO'S INSIDE: 3 BIG PICTURE CHOICE BUBBLES ================= */
  #guessRow{
    position:relative;
    z-index:17;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(12px, 3vw, 28px);
    padding:0 8px 22px;
  }
  .guess-bubble{
    position:relative;
    width:clamp(84px, 11vw, 108px);
    height:clamp(84px, 11vw, 108px);
    min-width:64px;
    min-height:64px;
    border-radius:50%;
    border:5px solid #fff8d6;
    background:radial-gradient(circle at 32% 28%, #ffffff 0%, #fff4db 68%, #ffe1a3 100%);
    box-shadow:
      0 7px 0 #b87300,
      0 12px 24px rgba(10,2,28,.48),
      inset 0 4px 8px rgba(255,255,255,.9);
    padding:10px;
    cursor:pointer;
    display:grid;
    place-items:center;
    outline:none;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1), opacity .22s, filter .22s;
    animation:bubblePopIn .4s cubic-bezier(.34,1.7,.5,1) backwards;
  }
  .guess-bubble:nth-child(2){ animation-delay:.07s; }
  .guess-bubble:nth-child(3){ animation-delay:.14s; }
  @keyframes bubblePopIn{
    0%{ transform:scale(.4) translateY(24px); opacity:0; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  .guess-bubble:active{ transform:translateY(4px) scale(.93); }
  .guess-bubble svg{ width:100%; height:100%; display:block; overflow:visible; }
  .guess-bubble.wrong{
    opacity:.36;
    pointer-events:none;
    animation:bubbleWobble .42s ease-in-out;
  }
  @keyframes bubbleWobble{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-9px) rotate(-6deg); }
    75%{ transform:translateX(9px) rotate(6deg); }
  }
  .guess-bubble.correct{
    border-color:#7bf58e;
    box-shadow:0 7px 0 #2b8a3e, 0 0 28px rgba(104,245,126,.95);
    transform:scale(1.12);
  }

  /* ================= BOTTOM GOLDEN THEATER SHELF ================= */
  #shelfBar{
    position:relative;
    z-index:18;
    flex:0 0 auto;
    height:calc(78px + env(safe-area-inset-bottom));
    padding:7px max(12px, env(safe-area-inset-right)) max(7px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    background:linear-gradient(180deg, #5e2469 0%, #3a1147 30%, #240830 100%);
    border-top:5px solid #ffd84d;
    box-shadow:inset 0 3px 0 rgba(255,248,200,.72), 0 -6px 22px rgba(8,2,22,.55);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #shelfTrack{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    max-width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    scrollbar-width:none;
    padding:0 6px;
  }
  #shelfTrack::-webkit-scrollbar{ display:none; }
  #shelfTrack.scrollable{ justify-content:flex-start; }

  .shelf-slot{
    flex:0 0 auto;
    width:64px;
    height:64px;
    border-radius:50%;
    border:3px dashed rgba(255,216,77,.42);
    background:rgba(255,255,255,.06);
    display:grid;
    place-items:center;
    color:rgba(255,216,77,.35);
    font-size:22px;
  }
  .shelf-token{
    flex:0 0 auto;
    width:64px;
    height:64px;
    min-width:64px;
    min-height:64px;
    border-radius:50%;
    border:3.5px solid #ffd84d;
    background:radial-gradient(circle at 35% 30%, #fffdf8 0%, #ffefc2 100%);
    box-shadow:0 4px 0 #b87300, 0 6px 14px rgba(10,2,28,.45);
    padding:6px;
    cursor:pointer;
    display:grid;
    place-items:center;
    position:relative;
    outline:none;
    animation:tokenLand .48s cubic-bezier(.34,1.8,.5,1);
    transition:transform .14s;
  }
  .shelf-token:active{ transform:scale(.9); }
  .shelf-token.sing{ animation:tokenSing .52s cubic-bezier(.34,1.8,.5,1); }
  .shelf-token svg{ width:100%; height:100%; display:block; }
  .shelf-token .tok-let{
    position:absolute;
    right:-4px;
    bottom:-4px;
    width:24px;
    height:24px;
    border-radius:50%;
    background:#5c2fd1;
    border:2px solid #fff;
    color:#ffd84d;
    font-family:"Fredoka",sans-serif;
    font-weight:700;
    font-size:13px;
    display:grid;
    place-items:center;
    line-height:1;
  }
  @keyframes tokenLand{
    0%{ transform:scale(.2) translateY(-28px); opacity:0; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  @keyframes tokenSing{
    0%,100%{ transform:scale(1); }
    45%{ transform:scale(1.22) translateY(-6px); }
  }

  /* ================= FX LAYER ================= */
  #fxLayer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:26;
    overflow:hidden;
  }
  .fx-star{
    position:absolute;
    font-size:24px;
    line-height:1;
    pointer-events:none;
    filter:drop-shadow(0 0 8px rgba(255,220,90,.95));
  }
  .fx-conf{
    position:absolute;
    width:13px;
    height:13px;
    border-radius:4px;
    pointer-events:none;
  }

  /* ================= GRAND GOLDEN CURTAIN CONFETTI FINALE OVERLAY ================= */
  #winOverlay{
    position:fixed;
    inset:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:radial-gradient(circle at 50% 42%, rgba(74,26,142,.72) 0%, rgba(16,6,38,.86) 100%);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }
  #winCard{
    width:min(92vw, 440px);
    background:linear-gradient(180deg, #fffdf5 0%, #fff2cb 100%);
    border:6px solid #ffd84d;
    border-radius:34px;
    padding:22px 20px 20px;
    text-align:center;
    color:var(--ink);
    box-shadow:0 12px 0 #b87300, 0 26px 56px rgba(8,2,24,.65), 0 0 42px rgba(255,216,77,.42);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    animation:winCardPop .5s cubic-bezier(.34,1.65,.5,1);
  }
  @keyframes winCardPop{
    0%{ transform:scale(.55) translateY(30px); opacity:0; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  #winStars{
    display:flex;
    gap:8px;
    font-size:40px;
    line-height:1;
  }
  #winStars span{
    color:#e4cfa0;
    transform:scale(.75);
    transition:transform .36s cubic-bezier(.34,1.9,.5,1), color .2s;
  }
  #winStars span.lit{
    color:#ffb703;
    transform:scale(1.16);
    text-shadow:0 3px 0 #c97a00, 0 0 18px rgba(255,212,60,.85);
  }
  #winTrophy{
    font-size:52px;
    line-height:1.1;
    filter:drop-shadow(0 6px 10px rgba(42,20,97,.22));
  }
  #winTrophies{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .win-tok{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#fff;
    border:3px solid #ffd84d;
    box-shadow:0 4px 0 #d99100;
    padding:5px;
    display:grid;
    place-items:center;
  }
  .win-tok svg{ width:100%; height:100%; display:block; }
  .win-btns{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:4px;
  }
  #againBtn{
    min-width:176px;
    min-height:68px;
    padding:0 28px;
    border-radius:999px;
    border:4px solid #fff;
    background:linear-gradient(180deg, #5ce071 0%, #2eb848 100%);
    color:#fff;
    font-family:"Fredoka",sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:2px;
    cursor:pointer;
    box-shadow:0 7px 0 #1f8233, 0 12px 24px rgba(31,130,51,.35);
    transition:transform .14s;
  }
  #againBtn:active{ transform:translateY(4px) scale(.96); }
  .win-btn{
    min-height:64px;
    padding:0 22px;
    border-radius:999px;
    border:4px solid #fff;
    font-family:"Fredoka",sans-serif;
    font-weight:700;
    font-size:20px;
    cursor:pointer;
  }

  /* ================= RESPONSIVE: iPHONE PORTRAIT (390x844) ================= */
  @media (max-width:640px) and (orientation:portrait){
    .curtain-btn{ width:26px; }
    #footlights{ left:22px; right:22px; bottom:78px; }
    #hud{ padding:max(8px, env(safe-area-inset-top)) 8px 2px; gap:6px; }
    .hud-group{ gap:6px; }
    .hud-pill{ min-width:64px; height:64px; padding:0 12px; font-size:26px; }
    #starPill{ padding:0 10px; gap:4px; }
    .star-pip{ font-size:17px; }
    #starPips{ gap:2px; }
    #starNum{ font-size:20px; }

    #arena{
      padding:0 18px 8px;
      justify-content:space-between;
    }
    #stageRow{
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      padding-bottom:6px;
    }
    #hootAnchor{
      position:absolute;
      left:8px;
      top:24px;
      z-index:11;
    }
    #magicianHoot{
      width:110px;
      height:122px;
    }
    #centerEnsemble{
      margin-top:auto;
    }
    #popStage{
      width:210px;
      height:152px;
      margin-bottom:-22px;
    }
    #popRevealBtn{
      width:138px;
      height:138px;
    }
    #letterBadge{
      width:58px;
      height:58px;
      font-size:34px;
      right:-14px;
      top:-2px;
    }
    #magicHatBtn{
      width:186px;
      height:130px;
    }
    #magicTable{
      width:216px;
      height:78px;
    }
    #wandAnchor{
      padding-bottom:6px;
      margin-top:6px;
    }
    #magicWandBtn{
      width:92px;
      height:92px;
    }
    #guessRow{
      gap:12px;
      padding:4px 4px 8px;
    }
    .guess-bubble{
      width:90px;
      height:90px;
      padding:8px;
    }
    #stageFloor{
      bottom:76px;
      height:210px;
    }
  }

  /* Compact desktop / iPad height tune */
  @media (min-width:641px) and (max-height:790px){
    #popStage{ height:clamp(132px, 21vh, 172px); margin-bottom:-24px; }
    #popRevealBtn{ width:clamp(134px, 16vw, 166px); height:clamp(134px, 16vw, 166px); }
    #magicHatBtn{ width:clamp(186px, 22vw, 236px); height:clamp(130px, 15.5vw, 164px); }
    #magicTable{ width:clamp(214px, 25vw, 272px); height:clamp(76px, 10.5vh, 96px); }
    #magicianHoot{ width:clamp(134px, 15.5vw, 184px); height:clamp(146px, 17vw, 202px); }
    .guess-bubble{ width:88px; height:88px; }
  }

  /* Guess mode hides wand smoothly so choices shine front-and-center */
  #stage.mode-guess #wandAnchor{ display:none; }
  #stage.mode-pop #guessRow{ display:none; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01s !important; }
  }
</style>
</head>
<body>
<div id="stage" class="mode-pop">
  <!-- Volumetric Stage Spotlights -->
  <div id="spotlights" aria-hidden="true">

  <!-- Top Scalloped Crimson Velvet Valance with Gold Fringe -->
  <div id="valance" aria-hidden="true">

  </div>

  <!-- Parted Crimson Velvet Side Curtains -->
  <button id="curtainLeft" class="curtain-btn" type="button" aria-label="Left Velvet Curtain">
    <svg viewBox="0 0 140 800" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="curtL" x1="0" y1="0" x2="1" y2="0">

      <circle cx="66" cy="445" r="10" fill="#ffd84d" stroke="#b87300" stroke-width="2.5"/>
      <path d="M66,455 L58,492 L74,492 Z" fill="#ffd84d" stroke="#b87300" stroke-width="2"/>

  </button>
  <button id="curtainRight" class="curtain-btn" type="button" aria-label="Right Velvet Curtain">
    <svg viewBox="0 0 140 800" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="curtR" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0%" stop-color="#5a0720"/>
          <stop offset="28%" stop-color="#a6133d"/>
          <stop offset="54%" stop-color="#760a2a"/>
          <stop offset="80%" stop-color="#c91f4d"/>

      <path d="M4,0 C20,170 32,330 78,445 C42,555 28,670 24,800" fill="none" stroke="#ffd84d" stroke-width="7"/>
      <path d="M140,432 Q102,448 76,445" fill="none" stroke="#ffd84d" stroke-width="11" stroke-linecap="round"/>
      <circle cx="74" cy="445" r="10" fill="#ffd84d" stroke="#b87300" stroke-width="2.5"/>
      <path d="M74,455 L66,492 L82,492 Z" fill="#ffd84d" stroke="#b87300" stroke-width="2"/>
    </svg>
  </button>

  <!-- Stage Floor & Glowing Golden Footlights -->
  <div id="stageFloor" aria-hidden="true"></div>
  <div id="footlights">
    <button class="footlight" type="button" aria-label="Stage light"></button>
    <button class="footlight" type="button" aria-label="Stage light"></button>
    <button class="footlight" type="button" aria-label="Stage light"></button>
    <button class="footlight" type="button" aria-label="Stage light"></button>
    <button class="footlight" type="button" aria-label="Stage light"></button>
    <button class="footlight" type="button" aria-label="Stage light"></button>
    <button class="footlight" type="button" aria-label="Stage light"></button>
  </div>

  <!-- Top HUD: Picture-Only Modes + 5-Star Tracker + Sound Toggle -->
  <header id="hud">
    <div class="hud-group">
      <button id="modePopBtn" class="hud-pill mode-btn active" type="button" aria-label="Magic Pop" aria-pressed="true">🪄</button>

      <div id="starPill" aria-label="Stars collected">
        <div id="starPips" aria-hidden="true">
          <span class="star-pip">★</span><span class="star-pip">★</span><span class="star-pip">★</span><span class="star-pip">★</span><span class="star-pip">★</span>

  <!-- Main Theater Stage Arena -->
  <main id="arena">
    <div id="stageRow">
      <!-- Magician Hoot on the Left -->
      <div id="hootAnchor">
        <button id="magicianHoot" type="button" aria-label="Magician Hoot">
          <svg viewBox="0 0 220 240" aria-hidden="true">
            <defs>
              <linearGradient id="capeGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#5d2ad1"/>
                <stop offset="100%" stop-color="#2c106e"/>

            <!-- Tiny Gold Stars on Cape -->
            <g fill="#ffd84d">
              <path d="M42,176 l2.4,5 5.4.8 -3.9,3.8 .9,5.4 -4.8-2.6 -4.8,2.6 .9-5.4 -3.9-3.8 5.4-.8z"/>
              <path d="M178,176 l2.4,5 5.4.8 -3.9,3.8 .9,5.4 -4.8-2.6 -4.8,2.6 .9-5.4 -3.9-3.8 5.4-.8z"/>
              <circle cx="52" cy="198" r="3"/>
              <circle cx="168" cy="198" r="3"/>
            </g>
            <!-- Owl Feet -->
            <path d="M84,214 L74,225 M88,215 L86,227 M93,214 L98,225" stroke="#ff9f1c" stroke-width="5.5" stroke-linecap="round"/>

  var AC = null;
  function audio(){
    if(!AC){
      try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; }
    }
    if(AC && AC.state === "suspended") AC.resume();
    return AC;
  }
  function tone(f0, f1, dur, type, vol, delay){
    if(!soundOn) return;
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(f0, t);
    if(f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.04);
  }
  function noisePuff(dur, freq, vol){
    if(!soundOn) return;
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime;
    var len = Math.max(1, (dur * ac.sampleRate) | 0);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.8);
    var src = ac.createBufferSource(); src.buffer = buf;
    var flt = ac.createBiquadFilter(); flt.type = "bandpass"; flt.frequency.value = freq || 750; flt.Q.value = 0.8;
    var g = ac.createGain();
    g.gain.setValueAtTime(vol || 0.24, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(ac.destination);
    src.start(t);
  }

  var VBASE = "assets/voice/";

  function hasClip(id){
    try{
      var H = window.parent && window.parent.HOOT_HAVE;
      if(H) return !!H[id];
    }catch(e){}
    return true;
  }
  function hubQuiet(){
    try{
      var d = window.parent && window.parent.document;
      if(!d || d === document) return false;
      var b = d.querySelector('.voice-btn[data-voice="off"]');
      return !!(b && (b.classList.contains("sel") || b.classList.contains("active") || b.getAttribute("aria-pressed") === "true"));
    }catch(e){ return false; }
  }
  function getVoice(){
    if(!voiceEl){
      voiceEl = new Audio();
      voiceEl.preload = "auto";
      voiceEl.addEventListener("ended", function(){
        var e = voiceEl;
        if(e.__hwT && Date.now() - e.__hwT < 350){
          if(!e.paused && !e.ended) return;
          if(!e.__hwRetry){
            e.__hwRetry = 1;
            try{ e.currentTime = 0; }catch(x){}
            var p = e.play();
            if(p && p.catch) p.catch(vNext);
            return;
          }
        }
        vNext();
      });
      voiceEl.addEventListener("error", vNext);
    }
    return voiceEl;
  }
  function vNext(){
    if(!vPlaying){ pumpVoice(); return; }
    vPlaying = false;
    magicianHoot.classList.remove("talking");
    pumpVoice();
  }
  function pumpVoice(){
    if(vPlaying || dead) return;
    var item = vQueue.shift();
    if(!item) return;
    if(!soundOn || hubQuiet()){ pumpVoice(); return; }
    var el = getVoice();
    vPlaying = true;
    magicianHoot.classList.add("talking");
    el.__hwT = Date.now();
    el.__hwRetry = 0;
    el.src = VBASE + item.file;
    var p = el.play();
    if(p && p.catch) p.catch(vNext);
  }
  function clearVoice(stop){
    vQueue.length = 0;
    if(stop && voiceEl){
      voiceEl.__hwT = 0;
      voiceEl.__hwRetry = 1;

      vPlaying = false;

      var ang = (-Math.PI * 0.92) + Math.random() * (Math.PI * 0.84);
      var dist = (big ? 110 : 75) + Math.random() * (big ? 160 : 115);
      var dx = Math.cos(ang) * dist;
      var dy = Math.sin(ang) * dist - 20;
      var rot = (Math.random() - 0.5) * 420;
      if(el.animate){
        el.animate([
          { transform:"translate(-50%,-50%) scale(.4) rotate(0deg)", opacity:1 },
          { transform:"translate(" + (dx * 0.72).toFixed(1) + "px," + (dy * 0.85).toFixed(1) + "px) scale(1.15) rotate(" + (rot * 0.5).toFixed(0) + "deg)", opacity:1, offset:0.55 },
          { transform:"translate(" + dx.toFixed(1) + "px," + (dy + 95).toFixed(1) + "px) scale(.45) rotate(" + rot.toFixed(0) + "deg)", opacity:0 }
        ], { duration:760 + Math.random() * 340, easing:"cubic-bezier(.18,.78,.28,1)" });
      }
      (function(n){ setTimeout(function(){ n.remove(); }, 1180); })(el);
    }
  }

  function showerFinaleConfetti(){
    var w = window.innerWidth;
    var cols = ["#ffd84d", "#fff3b0", "#ff6ea9", "#c084fc", "#5ce071", "#38bdf8"];
    for(var i = 0; i < 42; i++){
      var isStar = i % 2 === 0;
      var c = document.createElement(isStar ? "span" : "div");
      c.className = isStar ? "fx-star" : "fx-conf";
      if(isStar){
        c.textContent = "★";
        c.style.color = cols[i % cols.length];
        c.style.fontSize = (18 + Math.random() * 16) + "px";
      } else {
        c.style.background = cols[i % cols.length];
      }
      c.style.left = (w * 0.08 + Math.random() * w * 0.84) + "px";
      c.style.top = "-16px";
      fxLayer.appendChild(c);
      var dx = (Math.random() - 0.5) * 220;
      var dy = window.innerHeight + 60;
      var rot = (Math.random() - 0.5) * 620;
      if(c.animate){
        c.animate([
          { transform:"translate(0,0) rotate(0deg)", opacity:1 },
          { transform:"translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) rotate(" + rot.toFixed(0) + "deg)", opacity:0.85 }
        ], { duration:1500 + Math.random() * 900, delay:Math.random() * 420, easing:"cubic-bezier(.22,.65,.35,1)" });
      }
      (function(el){ setTimeout(function(){ el.remove(); }, 2900); })(c);
    }
  }

  /* ================= BUILD TWINKLING STAR SKY ================= */
  (function initSky(){
    var spots = [
      { l:12, t:14, s:20 }, { l:24, t:9, s:15 }, { l:36, t:18, s:22 },
      { l:64, t:16, s:22 }, { l:76, t:10, s:16 }, { l:87, t:15, s:20 },
      { l:18, t:34, s:16 }, { l:82, t:33, s:18 }, { l:46, t:10, s:14 },
      { l:55, t:22, s:15 }, { l:28, t:46, s:14 }, { l:72, t:45, s:14 }
    ];
    var glyphs = ["✦", "★", "✶"];
    spots.forEach(function(sp, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "sky-star";
      b.setAttribute("aria-label", "Twinkling stage star");
      b.textContent = glyphs[i % glyphs.length];
      b.style.left = sp.l + "%";
      b.style.top = sp.t + "%";
      b.style.fontSize = sp.s + "px";
      b.style.animationDelay = (-Math.random() * 2.5).toFixed(2) + "s";
      b.addEventListener("click", function(){
        audio();
        twinkleBellSfx(980 + (i % 5) * 140);
        b.classList.remove("zing"); void b.offsetWidth; b.classList.add("zing");
      });
      starSky.appendChild(b);
    });
  })();

  /* ================= HUD & SHELF RENDERING ================= */
  function renderStars(){
    starNum.textContent = String(stars);
    for(var i = 0; i < starPips.length; i++){
      starPips[i].classList.toggle("on", i < stars);
    }
  }

  function renderShelf(){
    shelfTrack.innerHTML = "";
    var totalSlots = Math.max(GOAL, collected.length);
    shelfTrack.classList.toggle("scrollable", collected.length > 5);
    for(var i = 0; i < totalSlots; i++){
      var item = collected[i];
      if(item){
        (function(it){
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "shelf-token";
          btn.setAttribute("aria-label", it.id + " " + it.letter);
          btn.innerHTML = surpriseSVG(it.id) + '<span class="tok-let" aria-hidden="true">' + it.letter + '</span>';
          btn.addEventListener("click", function(){
            audio();
            twinkleBellSfx(1046);
            btn.classList.remove("sing"); void btn.offsetWidth; btn.classList.add("sing");
            hootCheer();
            speakSurprise(it, false);
          });
          shelfTrack.appendChild(btn);
        })(item);
      } else {
        var slot = document.createElement("div");
        slot.className = "shelf-slot";
        slot.setAttribute("aria-hidden", "true");
        slot.textContent = "★";
        shelfTrack.appendChild(slot);
      }
    }
    if(collected.length > 5){
      shelfTrack.scrollLeft = shelfTrack.scrollWidth;
    }
  }

  function addCollected(item){
    if(!item || collectedMap[item.id]) return;
    collectedMap[item.id] = true;
    collected.push(item);
    renderShelf();
  }

  function hootCheer(){
    magicianHoot.classList.remove("cheer");
    void magicianHoot.offsetWidth;
    magicianHoot.classList.add("cheer");
  }

  /* ================= VISUAL HAND CUES & IDLE NUDGE ================= */
  function updateCues(){
    if(state !== "play"){
      wandHand.hidden = true;
      hatHand.hidden = true;
      hatWrap.classList.remove("charged");
      magicWandBtn.classList.remove("cue-ready", "dimmed");
      return;
    }
    if(mode === "pop"){
      hatWrap.classList.toggle("charged", charged);
      if(charged && !revealed){
        wandHand.hidden = true;
        hatHand.hidden = false;
        magicWandBtn.classList.remove("cue-ready");
        magicWandBtn.classList.add("dimmed");
      } else {
        hatHand.hidden = true;
        wandHand.hidden = false;
        magicWandBtn.classList.add("cue-ready");
        magicWandBtn.classList.remove("dimmed");
      }
    } else {
      wandHand.hidden = true;
      hatHand.hidden = true;
      hatWrap.classList.toggle("charged", charged || revealed);
    }
  }

  function armIdle(){
    if(idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      if(dead || state !== "play") return;
      if(mode === "pop"){
        if(!charged){
          magicWandBtn.classList.remove("wave"); void magicWandBtn.offsetWidth; magicWandBtn.classList.add("wave");
        } else {
          magicHatBtn.classList.remove("wiggle"); void magicHatBtn.offsetWidth; magicHatBtn.classList.add("wiggle");
        }
      } else if(mode === "guess" && !revealed){
        peekWrap.classList.add("higher");
        magicHatBtn.classList.remove("wiggle"); void magicHatBtn.offsetWidth; magicHatBtn.classList.add("wiggle");
        playPromptClip("ask-whos-in-hat.mp3", false);
      }
      armIdle();
    }, 9500);
  }

  /* ================= DECK & ROUND SETUP ================= */
  function nextItem(){
    if(!deck.length){
      deck = shuffle(ITEMS);
      if(current && deck.length > 1 && deck[0].id === current.id){
        var tmp = deck.shift();
        deck.push(tmp);
      }
    }
    current = deck.shift();
    return current;
  }

  function hideRevealed(){
    popRevealBtn.hidden = true;
    popRevealBtn.classList.remove("pop-in", "hop");
    popArt.innerHTML = "";
  }

  function preparePopTrick(){
    clearTimers();
    charged = false;
    revealed = false;
    guessLocked = false;
    nextItem();
    hideRevealed();
    peekWrap.hidden = true;
    peekQ.hidden = true;
    guessRow.innerHTML = "";
    updateCues();
    armIdle();
  }

  function prepareGuessTrick(preferAfterIntro){
    clearTimers();
    charged = false;
    revealed = false;
    guessLocked = false;
    nextItem();
    hideRevealed();

    /* Show sneaky peeking silhouette inside the hat rim */
    peekArt.innerHTML = surpriseSVG(current.id);
    peekWrap.classList.remove("higher");
    peekWrap.hidden = false;
    peekQ.hidden = false;

    /* Build 3 big picture-only choice bubbles */
    guessRow.innerHTML = "";
    var distractors = shuffle(ITEMS.filter(function(it){ return it.id !== current.id; })).slice(0, 2);
    var opts = shuffle([current].concat(distractors));
    opts.forEach(function(it){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "guess-bubble";
      b.dataset.id = it.id;
      b.setAttribute("aria-label", it.id);
      b.innerHTML = surpriseSVG(it.id);
      b.addEventListener("click", function(){ onGuessTap(it, b); });
      guessRow.appendChild(b);
    });

    updateCues();
    playPromptClip("ask-whos-in-hat.mp3", !!preferAfterIntro);
    armIdle();
  }

  /* ================= STEP 1: WAND TAP OR WAVE ================= */
  function triggerWand(clientX, clientY){
    if(dead || state !== "play" || mode !== "pop" || winPending) return;
    audio();
    armIdle();

    /* If a previous surprise was still showing, tuck it away and pick a brand-new surprise! */
    if(revealed){
      clearTimers();
      revealed = false;
      hideRevealed();
      nextItem();
    }

    charged = true;
    harpArpeggioSfx();

    var wr = magicWandBtn.getBoundingClientRect();
    var sx = (typeof clientX === "number" && clientX > 0) ? clientX : (wr.left + wr.width * 0.5);
    var sy = (typeof clientY === "number" && clientY > 0) ? clientY : (wr.top + wr.height * 0.5);
    shootWandSparkles(sx, sy);

    magicWandBtn.classList.remove("wave"); void magicWandBtn.offsetWidth; magicWandBtn.classList.add("wave");
    magicHatBtn.classList.remove("wiggle"); void magicHatBtn.offsetWidth; magicHatBtn.classList.add("wiggle");
    magicianHoot.classList.add("cast");
    setTimeout(function(){ magicianHoot.classList.remove("cast"); }, 460);

    updateCues();
  }

  magicWandBtn.addEventListener("pointerdown", function(e){
    wandDown = true;
    lastWandTapAt = Date.now();
    lastSparkAt = lastWandTapAt;
    triggerWand(e.clientX, e.clientY);
  });
  magicWandBtn.addEventListener("pointermove", function(e){
    if(!wandDown) return;
    var now = Date.now();
    if(now - lastSparkAt < 180) return;
    lastSparkAt = now;
    if(state === "play" && mode === "pop"){
      audio();
      twinkleBellSfx(1318);
      shootWandSparkles(e.clientX, e.clientY);
      if(!charged) triggerWand(e.clientX, e.clientY);
    }
  });
  window.addEventListener("pointerup", function(){ wandDown = false; });
  window.addEventListener("pointercancel", function(){ wandDown = false; });
  magicWandBtn.addEventListener("click", function(e){
    if(Date.now() - lastWandTapAt < 300) return;
    lastWandTapAt = Date.now();
    triggerWand(e.clientX, e.clientY);
  });

  /* ================= STEP 2: POP THE VELVET TOP HAT ================= */
  function popHatSurprise(){
    if(dead || state !== "play" || !current || winPending) return;

    revealed = true;
    charged = false;

    /* Hide sneaky peek if coming from Guess mode */
    peekWrap.hidden = true;
    peekQ.hidden = true;

    /* POOF! Purple cloud + golden star confetti + bouncy hat kick */
    magicPoofSfx();
    burstMagicPoof();
    burstHatConfetti(stars + 1 >= GOAL);

    magicHatBtn.classList.remove("poof-kick", "wiggle");
    void magicHatBtn.offsetWidth;
    magicHatBtn.classList.add("poof-kick");

    /* Huge smiling surprise springs straight out above the rim with giant starting letter badge */
    popArt.innerHTML = surpriseSVG(current.id);
    letterBadge.textContent = current.letter;
    popRevealBtn.setAttribute("aria-label", current.id + " starts with " + current.letter);
    popRevealBtn.hidden = false;
    popRevealBtn.classList.remove("pop-in", "hop");
    void popRevealBtn.offsetWidth;
    popRevealBtn.classList.add("pop-in");

    /* Celebrate with Hoot + Star + Golden Shelf + Studio Voice Chain */
    hootCheer();
    stars++;
    renderStars();
    starPill.classList.remove("bump"); void starPill.offsetWidth; starPill.classList.add("bump");
    starChimeSfx();
    addCollected(current);
    speakSurprise(current, true);

    updateCues();

    /* Check for 5-Star Grand Golden Curtain Finale */
    if(stars >= GOAL){
      winPending = true;
      var scheduleWin = window.__hwFastWin || later;
      scheduleWin(function(){
        if(!dead && state === "play") showWin();
      }, 1350);
    } else if(mode === "guess"){
      /* Auto-advance cleanly to the next sneaky peek after celebrating */
      later(function(){
        if(state === "play" && mode === "guess") prepareGuessTrick(false);
      }, 2500);
    } else {
      armIdle();
    }
  }

  magicHatBtn.addEventListener("click", function(){
    if(dead || state !== "play") return;
    audio();
    armIdle();

    if(mode === "guess"){
      if(revealed) return;
      /* Tap hat in Guess mode -> peeks higher & replays "Who's in the hat?" */
      peekWrap.classList.add("higher");
      magicHatBtn.classList.remove("wiggle"); void magicHatBtn.offsetWidth; magicHatBtn.classList.add("wiggle");
      twinkleBellSfx(880);
      playPromptClip("ask-whos-in-hat.mp3", false);
      return;
    }

    /* Magic Pop Mode */
    if(!charged){
      /* Playful bounce & extra spotlight on the Star Magic Wand */
      magicHatBtn.classList.remove("wiggle"); void magicHatBtn.offsetWidth; magicHatBtn.classList.add("wiggle");
      magicWandBtn.classList.remove("wave"); void magicWandBtn.offsetWidth; magicWandBtn.classList.add("wave");
      twinkleBellSfx(740);
      return;
    }

    popHatSurprise();
  });

  /* Tap the popped surprise itself to hear its word + starting letter again! */
  popRevealBtn.addEventListener("click", function(){
    if(dead || !current || !revealed) return;
    audio();
    twinkleBellSfx(1175);
    popRevealBtn.classList.remove("hop", "pop-in");
    void popRevealBtn.offsetWidth;
    popRevealBtn.classList.add("hop");
    hootCheer();
    speakSurprise(current, false);
  });

  /* ================= GUESS WHO'S INSIDE CHOICE HANDLER ================= */
  function onGuessTap(item, btn){
    if(dead || state !== "play" || mode !== "guess" || guessLocked || revealed) return;
    audio();
    armIdle();

    if(item.id === current.id){
      guessLocked = true;
      btn.classList.add("correct");
      var br = btn.getBoundingClientRect();
      shootWandSparkles(br.left + br.width * 0.5, br.top + br.height * 0.5);
      harpArpeggioSfx();
      charged = true;
      updateCues();
      /* Auto-pop the hat with confetti right away! */
      popHatSurprise();
    } else {
      btn.classList.add("wrong");
      boingSfx();
      peekWrap.classList.add("higher");
      magicHatBtn.classList.remove("wiggle"); void magicHatBtn.offsetWidth; magicHatBtn.classList.add("wiggle");
      speakWrong();
    }
  }

  /* ================= GRAND GOLDEN CURTAIN FINALE ================= */
  function showWin(){
    if(state === "won") return;
    state = "won";
    clearTimers();
    if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    updateCues();

    winTrophies.innerHTML = "";
    collected.slice(-5).forEach(function(it){
      var t = document.createElement("div");
      t.className = "win-tok";
      t.innerHTML = surpriseSVG(it.id);
      winTrophies.appendChild(t);
    });

    var st = winStars.children;
    for(var i = 0; i < st.length; i++){
      st[i].classList.remove("lit");
      (function(el, ms){ setTimeout(function(){ el.classList.add("lit"); }, ms); })(st[i], 140 + i * 130);
    }

    winOverlay.hidden = false;
    finaleFanfareSfx();
    showerFinaleConfetti();

    clearVoice(true);
    var wc = WIN_CLIPS[winIdx % WIN_CLIPS.length];
    winIdx++;
    if(!hasClip(wc.replace(".mp3", ""))) wc = "hoot-amazing.mp3";
    enqueue(wc);
  }

  function startShow(isBoot){
    clearTimers();
    clearVoice(true);
    state = "play";
    winPending = false;
    stars = 0;
    collected = [];
    collectedMap = {};
    winOverlay.hidden = true;
    renderStars();
    renderShelf();

    if(mode === "guess"){
      prepareGuessTrick(!!isBoot);
    } else {
      preparePopTrick();
    }
  }

  /* ================= CONTROLS & PLAYFUL THEATER PROPS ================= */
  function setMode(nextMode){
    if(mode === nextMode && state === "play") return;
    audio();
    twinkleBellSfx(988);
    mode = nextMode;
    stage.classList.toggle("mode-pop", mode === "pop");
    stage.classList.toggle("mode-guess", mode === "guess");
    modePopBtn.classList.toggle("active", mode === "pop");
    modePopBtn.setAttribute("aria-pressed", mode === "pop" ? "true" : "false");
    modeGuessBtn.classList.toggle("active", mode === "guess");
    modeGuessBtn.setAttribute("aria-pressed", mode === "guess" ? "true" : "false");

    if(state === "won" || winPending){
      startShow(false);
      return;
    }
    clearVoice(true);
    if(mode === "guess") prepareGuessTrick(false);
    else preparePopTrick();
  }

  modePopBtn.addEventListener("click", function(){ setMode("pop"); });
  modeGuessBtn.addEventListener("click", function(){ setMode("guess"); });

  soundBtn.addEventListener("click", function(){
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    soundBtn.setAttribute("aria-label", soundOn ? "Turn Sound Off" : "Turn Sound On");
    if(!soundOn){
      clearVoice(true);
    } else {
      audio();
      twinkleBellSfx(1046);
    }
  });

  againBtn.addEventListener("click", function(){
    audio();
    starChimeSfx();
    startShow(false);
  });

  /* Direct tap of Magician Hoot -> happy jump + transient __bellyArmed giggle! */
  magicianHoot.addEventListener("click", function(){
    audio();
    hootCheer();
    twinkleBellSfx(1318);
    window.__bellyArmed = true;
    setTimeout(function(){ window.__bellyArmed = false; }, 500);
    clearVoice(true);
    enqueue("hoot-giggle.mp3");
  });

  /* Smooth eye-tracking on Magician Hoot */
  function trackEyes(x, y){
    var r = magicianHoot.getBoundingClientRect();
    if(!r.width) return;
    var dx = Math.max(-4.5, Math.min(4.5, (x - (r.left + r.width * 0.5)) / 42));
    var dy = Math.max(-3.5, Math.min(4.5, (y - (r.top + r.height * 0.4)) / 42));
    hootPupils.setAttribute("transform", "translate(" + dx.toFixed(1) + "," + dy.toFixed(1) + ")");
  }
  stage.addEventListener("pointermove", function(e){ trackEyes(e.clientX, e.clientY); });
  stage.addEventListener("pointerdown", function(e){ trackEyes(e.clientX, e.clientY); });

  /* Playful Crimson Velvet Curtains & Glowing Footlights Easter Eggs */
  ["curtainLeft", "curtainRight"].forEach(function(id){
    var el = $(id);
    el.addEventListener("click", function(){
      audio();
      curtainSwishSfx();
      el.classList.add("swish");
      setTimeout(function(){ el.classList.remove("swish"); }, 420);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".footlight"), function(fl, idx){
    var notes = [523, 587, 659, 784, 880, 1046, 1175];
    fl.addEventListener("click", function(){
      audio();
      twinkleBellSfx(notes[idx % notes.length]);
      fl.classList.add("flash");
      setTimeout(function(){ fl.classList.remove("flash"); }, 320);
    });
  });

  /* Clean Teardown */
  function teardown(){
    dead = true;
    clearTimers();
    if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    clearVoice(true);
  }
  window.addEventListener("pagehide", teardown);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) clearVoice(false);
  });

  /* ================= BOOT ================= */
  startShow(true);

  /* ================= VERIFICATION SNAPSHOT ================= */
  window.__magicGame = {
    snapshot: function(){
      return {
        state: state,
        mode: mode,
        charged: charged,
        revealed: revealed,
        currentId: current ? current.id : null,
        stars: stars,
        collectedCount: collected.length,
        winShown: !winOverlay.hidden
      };
    }
  };
})();
</script>
