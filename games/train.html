  function drawStarShape(cx, cy, outerR, innerR, pts, fill, stroke, lw){
    ctx.beginPath();
    for(var i = 0; i < pts * 2; i++){
      var r = i % 2 === 0 ? outerR : innerR;
      var a = (i * Math.PI) / pts - Math.PI / 2;
      var x = cx + Math.cos(a) * r;
      var y = cy + Math.sin(a) * r;
      if(i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if(stroke){
      ctx.strokeStyle = stroke;
      ctx.lineWidth = lw || 2;
      ctx.stroke();
    }
  }

  function drawTrainPass(units, zPass, t){
    // Draw couplers first
    for(var i = 0; i < units.length - 1; i++){
      var a = units[i], b = units[i + 1];
      if(state.layout === "figure8" && Math.max(a.z, b.z) !== zPass) continue;
      if(state.layout !== "figure8" && zPass !== 0) continue;
      drawCoupler(a, b);
    }
    // Draw cars from back to front so engine sits cleanly on top
    for(var i = units.length - 1; i >= 0; i--){
      var u = units[i];
      if(u.inTunnel) continue;
      if(state.layout === "figure8" && u.z !== zPass) continue;
      if(state.layout !== "figure8" && zPass !== 0) continue;
      if(u.index === 0) drawEngine(u, t);
      else drawTrainCar(u, t);
    }
  }

  function drawSteamAndParticles(){
    // Puffy white cartoon steam clouds
    steamPuffs.forEach(function(p){
      var f = p.life / p.maxLife;
      var alpha = Math.max(0, (1 - f) * 0.92);
      var rad = p.r * (0.75 + f * 1.15);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "rgba(180, 200, 215, 0.65)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      ctx.arc(p.x + rad * 0.45, p.y - rad * 0.25, rad * 0.65, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    });

    // Sparkles, stars, water droplets & music notes
    particles.forEach(function(p){
      var f = p.life / p.maxLife;
      var alpha = Math.max(0, 1 - f * f);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if(p.kind === "drop"){
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(0, 0, p.size * (1 - f * 0.4), 0, Math.PI * 2);
        ctx.fill();
      } else if(p.kind === "note"){
        ctx.fillStyle = p.color;
        ctx.strokeStyle = "#2c1d11";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.ellipse(-3, 5, 5, 3.8, -0.3, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(1.5, 4);
        ctx.lineTo(1.5, -10);
        ctx.lineTo(9, -7);
        ctx.stroke();
      } else {
        drawStarShape(0, 0, p.size, p.size * 0.45, 5, p.color, "#5c3412", 1.5);
      }
      ctx.restore();
    });
  }

  /* ==================== FIRST-PERSON DRIVER CAB VIEW (PSEUDO-3D) ==================== */
  var cabBgImg = new Image();
  var cabBgReady = false;
  cabBgImg.onload = function(){ cabBgReady = true; };
  cabBgImg.src = "assets/train3d/cab_bg.jpg";

  var CAB_LOOP = 48;
  var CAB_SPEED = { slow: 2.9, cruise: 5.9, turbo: 10.6 };

  var cab = {
    dist: 2.0,
    bgPan: 0,
    curve: 0,
    bobPhase: 0,
    bellAngle: 0,
    bellVel: 0,
    tunnelAmt: 0,
    steamAcc: 0,
    steamPuffs: [],
    cowHop: 0,
    barnHop: 0,
    lastGateRing: -1,
    hitZones: { bell: null, boiler: null, props: [] }
  };

  // Choreographed scenic world loop around 48 world units (primary tunnel at [36..43], mountain extra at [14..20])
  var CAB_PROPS = [
    // Opening sunny meadow & crossing
    { z: 3.2,  lat: -2.4, kind: "pine", sz: 1.05 },
    { z: 4.1,  lat:  2.7, kind: "pine", sz: 0.92 },
    { z: 5.4,  lat: -1.65, kind: "flower", col: "#ff6b6b" },
    { z: 6.4,  lat: -2.35, kind: "cow", sz: 1.0 },
    { z: 7.4,  lat:  2.2, kind: "pine", sz: 1.15 },
    { z: 8.8,  lat: -3.3, kind: "barn", sz: 1.08 },
    { z: 9.6,  lat:  1.75, kind: "flower", col: "#ffd43b" },
    { z: 10.8, lat:  2.35, kind: "cow", sz: 0.96 },
    { z: 11.8, lat: -2.6, kind: "pine", sz: 1.1 },
    { z: 12.6, lat:  2.9, kind: "pine", sz: 0.88 },
    // Mid stretch (skips props if mountain extra tunnel [14..20] is active)
    { z: 15.2, lat: -2.5, kind: "pine", sz: 1.0, skipMtn: true },
    { z: 16.5, lat:  2.6, kind: "pine", sz: 1.12, skipMtn: true },
    { z: 17.8, lat: -1.7, kind: "flower", col: "#74c0fc", skipMtn: true },
    { z: 19.0, lat:  2.3, kind: "cow", sz: 1.0, skipMtn: true },
    // Railroad crossing zone
    { z: 22.4, lat:  0,   kind: "crossing", id: 1 },
    { z: 23.6, lat: -2.8, kind: "pine", sz: 1.18 },
    { z: 24.4, lat:  1.75, kind: "flower", col: "#f783ac" },
    { z: 25.8, lat:  2.25, kind: "cow", sz: 1.04 },
    { z: 27.6, lat:  3.35, kind: "barn", sz: 1.05 },
    { z: 28.4, lat: -2.5, kind: "pine", sz: 0.96 },
    { z: 30.2, lat: -2.25, kind: "cow", sz: 0.95 },
    { z: 31.4, lat:  2.55, kind: "pine", sz: 1.14 },
    { z: 32.8, lat: -2.9, kind: "pine", sz: 1.08 },
    { z: 33.8, lat:  1.72, kind: "flower", col: "#ffd43b" },
    // Exit stretch after main tunnel [36..43]
    { z: 44.8, lat: -2.5, kind: "pine", sz: 1.06 },
    { z: 45.4, lat:  2.5, kind: "pine", sz: 0.98 },
    { z: 46.2, lat:  0,   kind: "crossing", id: 2 },
    { z: 47.2, lat: -1.7, kind: "flower", col: "#b197fc" }
  ];

  function getCabTunnels(){
    if(state.layout === "mountain"){
      return [{ start: 14, end: 21 }, { start: 35, end: 44 }];
    }
    return [{ start: 35, end: 44 }];
  }

  function wrapLoopDist(target, cur){
    var d = ((target - cur) % CAB_LOOP + CAB_LOOP) % CAB_LOOP;
    if(d > CAB_LOOP * 0.5) d -= CAB_LOOP;
    return d;
  }

  function getCabTunnelStatus(){
    var pos = ((cab.dist % CAB_LOOP) + CAB_LOOP) % CAB_LOOP;
    var tunnels = getCabTunnels();
    for(var i = 0; i < tunnels.length; i++){
      var tn = tunnels[i];
      if(pos >= tn.start && pos <= tn.end){
        var frac = state.dir === 1
          ? (pos - tn.start) / (tn.end - tn.start)
          : (tn.end - pos) / (tn.end - tn.start);
        return { inside: true, frac: Math.max(0, Math.min(1, frac)), distToExit: Math.max(0.1, (1 - frac) * (tn.end - tn.start)) };
      }
    }
    return { inside: false, frac: 0, distToExit: 0 };
  }

  function spawnCabSteam(big){
    var boiler = cab.hitZones.boiler;
    var sx = boiler ? boiler.stackX : W * 0.5;
    var sy = boiler ? boiler.stackY : H * 0.62;
    var count = big ? 9 : 1;
    for(var i = 0; i < count; i++){
      var sc = Math.min(W, H) / 760;
      cab.steamPuffs.push({
        x: sx + (Math.random() - 0.5) * (big ? 28 : 10),
        y: sy - (big ? Math.random() * 14 : 4),
        vx: (Math.random() - 0.5) * (big ? 80 : 28) - cab.curve * 65,
        vy: -(big ? 95 + Math.random() * 85 : 55 + Math.random() * 35),
        r: (big ? 20 + Math.random() * 18 : 12 + Math.random() * 9) * Math.max(0.75, sc),
        life: 0,
        maxLife: big ? 1.35 + Math.random() * 0.5 : 0.95 + Math.random() * 0.35
      });
    }
  }

  function ringCabBell(impulse){
    cab.bellVel += (cab.bellAngle >= 0 ? -1 : 1) * (impulse || 7.5);
  }

  function updateCabPhysics(dt, engineSample){
    // Compute curvature smoothly from the real underlying wooden track spline + scenic alpine wave
    var lookAhead = sampleTrack(trainS + state.dir * 86 * play.scale);
    var da = lookAhead.angle - engineSample.angle;
    while(da > Math.PI) da -= Math.PI * 2;
    while(da < -Math.PI) da += Math.PI * 2;
    var splineCurve = Math.max(-1.15, Math.min(1.15, da * 1.45 * state.dir));
    var waveCurve = Math.sin(cab.dist * 0.19) * 0.36;
    var targetCurve = state.layout === "figure8"
      ? splineCurve * 1.05
      : splineCurve * 0.72 + waveCurve;
    cab.curve += (targetCurve - cab.curve) * Math.min(1, dt * 3.4);

    if(state.running){
      var vCab = CAB_SPEED[state.speed] * state.dir;
      cab.dist += vCab * dt;
      cab.bgPan += cab.curve * Math.abs(vCab) * 26 * dt;
      cab.bobPhase += dt * (state.speed === "turbo" ? 19 : (state.speed === "slow" ? 7.5 : 12.5));

      // Gentle rhythmic bell sway when moving
      cab.bellVel += Math.sin(cab.bobPhase * 0.5) * 2.2 * dt;

      // Foreground smokestack steam puffs
      cab.steamAcc += dt * (state.speed === "turbo" ? 7.5 : (state.speed === "slow" ? 2.6 : 4.5));
      if(cab.steamAcc >= 1){
        cab.steamAcc -= 1;
        if(state.cabView) spawnCabSteam(false);
      }
    }

    // Spring-damper physics for the golden brass bell
    cab.bellVel += -26 * cab.bellAngle * dt;
    cab.bellVel *= Math.pow(0.18, dt);
    cab.bellAngle += cab.bellVel * dt;
    cab.bellAngle = Math.max(-0.62, Math.min(0.62, cab.bellAngle));

    // Smooth tunnel immersion amount
    var tunStat = getCabTunnelStatus();
    var targetTun = tunStat.inside ? 1 : 0;
    cab.tunnelAmt += (targetTun - cab.tunnelAmt) * Math.min(1, dt * (targetTun ? 6.5 : 5.2));

    // Auto crossing bell when zooming close to a cab crossing gate
    if(state.cabView && state.running){
      for(var ci = 0; ci < CAB_PROPS.length; ci++){
        var cp = CAB_PROPS[ci];
        if(cp.kind !== "crossing") continue;
        var rel = wrapLoopDist(cp.z, cab.dist) * state.dir;
        if(rel > 0.8 && rel < 4.2){
          var ringKey = Math.floor(cab.dist / CAB_LOOP) * 10 + cp.id;
          if(cab.lastGateRing !== ringKey){
            cab.lastGateRing = ringKey;
            if(audioUnlocked) playCrossingBell(2);
          }
        }
      }
    }

    if(cab.cowHop > 0) cab.cowHop = Math.max(0, cab.cowHop - dt * 2.5);
    if(cab.barnHop > 0) cab.barnHop = Math.max(0, cab.barnHop - dt * 2.5);

    // Update foreground cab steam puffs
    for(var i = cab.steamPuffs.length - 1; i >= 0; i--){
      var sp = cab.steamPuffs[i];
      sp.life += dt;
      sp.x += (sp.vx - cab.curve * 48) * dt;
      sp.y += sp.vy * dt;
      sp.vx *= 0.965;
      sp.vy *= 0.985;
      if(sp.life >= sp.maxLife) cab.steamPuffs.splice(i, 1);
    }
  }

  function drawCabView(t, engineSample){
    var portrait = H > W * 1.05;
    var bobY = state.running ? Math.sin(cab.bobPhase) * (state.speed === "turbo" ? 3.8 : 2.2) : 0;
    var bobX = state.running ? Math.cos(cab.bobPhase * 0.5) * 2.2 : 0;
    var horizonY = Math.round(H * (portrait ? 0.415 : 0.435) + bobY * 0.4);
    var groundH = Math.max(120, H - horizonY);
    var zNear = 0.55;
    var zFar = 26.5;
    var baseTrackHalfW = Math.min(W * 0.34, groundH * 0.52);
    var curveAmp = W * (portrait ? 0.36 : 0.31);

    function proj(z, lat){
      var s = zNear / Math.max(0.22, z);
      var u = Math.max(0, 1 - s);
      var cx = W * 0.5 + cab.curve * u * u * curveAmp;
      return {
        x: cx + (lat || 0) * baseTrackHalfW * s,
        cx: cx,
        y: horizonY + groundH * s,
        s: s,
        scale: baseTrackHalfW * s
      };
    }

    // 1. FULL-BLEED PAINTED PIXAR ALPINE VISTA (seamless mirrored panoramic panning!)
    if(cabBgReady && cabBgImg.naturalWidth > 0){
      var imgAspect = cabBgImg.naturalWidth / cabBgImg.naturalHeight;
      var bgH = Math.ceil((horizonY + 28) / 0.64);
      var bgW = Math.ceil(bgH * imgAspect);
      if(bgW < W * 1.12){
        bgW = Math.ceil(W * 1.12);
        bgH = Math.ceil(bgW / imgAspect);
      }
      var bgY = Math.round((horizonY + 26) - bgH * 0.64);
      var period = bgW * 2;
      var pan = ((cab.bgPan % period) + period) % period;
      var startX = -pan;
      while(startX > 0) startX -= period;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, horizonY + 28);
      ctx.clip();
      for(var tx = startX; tx < W + bgW; tx += bgW){
        var tileIdx = Math.round((tx - startX) / bgW);
        if(tileIdx % 2 === 0){
          ctx.drawImage(cabBgImg, tx, bgY, bgW + 1, bgH);
        } else {
          ctx.save();
          ctx.translate(tx + bgW, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(cabBgImg, 0, bgY, bgW + 1, bgH);
          ctx.restore();
        }
      }
      ctx.restore();
    } else {
      var skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY + 12);
      skyGrad.addColorStop(0, "#2aa2f0");
      skyGrad.addColorStop(0.65, "#87d8ff");
      skyGrad.addColorStop(1, "#e7f7c9");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, horizonY + 12);
    }

    // 2. SUNLIT ROLLING 3D PERSPECTIVE MEADOW GROUND WITH SPEED BANDS
    var meadowGrad = ctx.createLinearGradient(0, horizonY, 0, H);
    meadowGrad.addColorStop(0, "#9be066");
    meadowGrad.addColorStop(0.28, "#7ac94f");
    meadowGrad.addColorStop(0.75, "#59a837");
    meadowGrad.addColorStop(1, "#418627");
    ctx.fillStyle = meadowGrad;
    ctx.fillRect(0, horizonY, W, groundH);

    // Alternating subtle perspective grass stripes rushing toward viewer
    var bandStep = 1.6;
    var bandOff = ((cab.dist % (bandStep * 2)) + bandStep * 2) % (bandStep * 2);
    for(var bz = zFar; bz >= zNear; bz -= bandStep){
      var z1 = bz - bandOff * 0.5;
      var z0 = z1 - bandStep * 0.5;
      if(z1 < zNear || z0 > zFar) continue;
      var p1 = proj(Math.max(zNear, z1), 0);
      var p0 = proj(Math.max(zNear, z0), 0);
      if(p0.y <= p1.y) continue;
      ctx.fillStyle = "rgba(255, 250, 190, 0.085)";
      ctx.fillRect(0, p1.y, W, p0.y - p1.y);
    }

    // Soft organic rolling green hillside seam + atmospheric golden mist across horizon
    ctx.save();
    ctx.fillStyle = "#8fd45e";
    ctx.beginPath();
    ctx.moveTo(0, horizonY + 12);
    for(var hx = 0; hx <= W + 40; hx += 40){
      var wave = Math.sin((hx + cab.bgPan * 0.35) * 0.008) * 7 + Math.cos((hx - cab.bgPan * 0.2) * 0.015) * 4;
      ctx.lineTo(hx, horizonY - 2 + wave);
    }
    ctx.lineTo(W, horizonY + 18);
    ctx.closePath();
    ctx.fill();

    var hazeGrad = ctx.createLinearGradient(0, horizonY - 24, 0, horizonY + 30);
    hazeGrad.addColorStop(0, "rgba(255, 252, 224, 0)");
    hazeGrad.addColorStop(0.45, "rgba(210, 240, 155, 0.45)");
    hazeGrad.addColorStop(1, "rgba(122, 201, 79, 0)");
    ctx.fillStyle = hazeGrad;
    ctx.fillRect(0, horizonY - 24, W, 54);
    ctx.restore();

    // 3. PERSPECTIVE WOODEN RAILWAY BALLAST, CROSSTIES & GLEAMING RAILS
    var railSamples = 36;
    var leftBed = [], rightBed = [], leftRail = [], rightRail = [], leftBridge = [], rightBridge = [];
    for(var i = 0; i <= railSamples; i++){
      var frac = i / railSamples;
      // Exponential sampling for crisp curvature near horizon AND near foreground
      var z = zFar * Math.pow(zNear / zFar, frac);
      var cP = proj(z, 0);
      leftBed.push({ x: cP.cx - cP.scale * 1.18, y: cP.y });
      rightBed.push({ x: cP.cx + cP.scale * 1.18, y: cP.y });
      leftRail.push({ x: cP.cx - cP.scale * 0.62, y: cP.y, s: cP.s });
      rightRail.push({ x: cP.cx + cP.scale * 0.62, y: cP.y, s: cP.s });
      leftBridge.push({ x: cP.cx - cP.scale * 1.24, y: cP.y, s: cP.s });
      rightBridge.push({ x: cP.cx + cP.scale * 1.24, y: cP.y, s: cP.s });
    }

    // Warm sandy-wooden track bed polygon
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(leftBed[0].x, leftBed[0].y);
    for(var i = 1; i < leftBed.length; i++) ctx.lineTo(leftBed[i].x, leftBed[i].y);
    for(var i = rightBed.length - 1; i >= 0; i--) ctx.lineTo(rightBed[i].x, rightBed[i].y);
    ctx.closePath();
    var bedGrad = ctx.createLinearGradient(0, horizonY, 0, H);
    bedGrad.addColorStop(0, "#d4b47c");
    bedGrad.addColorStop(0.5, "#c59858");
    bedGrad.addColorStop(1, "#9b6d37");
    ctx.fillStyle = bedGrad;
    ctx.fill();

    // Inner warm beechwood track channel highlight
    ctx.beginPath();
    ctx.moveTo(leftRail[0].x, leftRail[0].y);
    for(var i = 1; i < leftRail.length; i++) ctx.lineTo(leftRail[i].x, leftRail[i].y);
    for(var i = rightRail.length - 1; i >= 0; i--) ctx.lineTo(rightRail[i].x, rightRail[i].y);
    ctx.closePath();
    ctx.fillStyle = "rgba(246, 214, 162, 0.45)";
    ctx.fill();
    ctx.restore();

    // Wooden Railway Ties (Sleepers) rushing smoothly toward the viewer!
    var tieSpacing = 0.62;
    var firstTieIdx = Math.ceil((cab.dist + zNear * 0.7) / tieSpacing);
    var maxTies = Math.ceil(zFar / tieSpacing);
    for(var ti = maxTies; ti >= 0; ti--){
      var worldZ = (firstTieIdx + ti) * tieSpacing;
      var relZ = worldZ - cab.dist;
      if(relZ < zNear * 0.85 || relZ > zFar) continue;
      var tp = proj(relZ, 0);
      var tieW = tp.scale * 1.96;
      var tieH = Math.max(1.5, tp.scale * 0.145);
      // Soft shadow beneath tie
      ctx.fillStyle = "rgba(52, 28, 10, 0.34)";
      ctx.fillRect(tp.cx - tieW * 0.5, tp.y + tieH * 0.35, tieW, tieH * 0.6);
      // Beechwood tie plank
      ctx.fillStyle = ti % 2 === 0 ? "#8d5627" : "#7e4b20";
      ctx.fillRect(tp.cx - tieW * 0.5, tp.y - tieH * 0.5, tieW, tieH);
      // Warm sunlit top edge bevel
      if(tieH > 3){
        ctx.fillStyle = "#c98c4a";
        ctx.fillRect(tp.cx - tieW * 0.5, tp.y - tieH * 0.5, tieW, Math.max(1.2, tieH * 0.28));
      }
    }

    // Twin Perspective Rails (silky-smooth continuous tapered polygons: iron base + gleaming steel top!)
    [leftRail, rightRail].forEach(function(pts){
      // 1. Dark wooden/iron rail outer base
      ctx.beginPath();
      for(var i = 0; i < pts.length; i++){
        var hw = Math.max(1.1, pts[i].s * 9.5);
        if(i === 0) ctx.moveTo(pts[i].x - hw, pts[i].y);
        else ctx.lineTo(pts[i].x - hw, pts[i].y);
      }
      for(var i = pts.length - 1; i >= 0; i--){
        var hw = Math.max(1.1, pts[i].s * 9.5);
        ctx.lineTo(pts[i].x + hw, pts[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = "#4d311a";
      ctx.fill();

      // 2. Gleaming silver-steel rail crown
      ctx.beginPath();
      for(var i = 0; i < pts.length; i++){
        var hw = Math.max(0.7, pts[i].s * 5.6);
        if(i === 0) ctx.moveTo(pts[i].x - hw, pts[i].y);
        else ctx.lineTo(pts[i].x - hw, pts[i].y);
      }
      for(var i = pts.length - 1; i >= 0; i--){
        var hw = Math.max(0.7, pts[i].s * 5.6);
        ctx.lineTo(pts[i].x + hw, pts[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = "#dce6f0";
      ctx.fill();

      // 3. Crisp continuous sunlit highlight streak
      ctx.beginPath();
      for(var i = 0; i < pts.length; i++){
        var off = pts[i].s * 1.4;
        if(i === 0) ctx.moveTo(pts[i].x - off, pts[i].y);
        else ctx.lineTo(pts[i].x - off, pts[i].y);
      }
      ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
      ctx.lineWidth = 1.6;
      ctx.stroke();
    });

    // Optional Figure-8 wooden bridge side safety rails when on upper overpass!
    if(state.layout === "figure8" && engineSample.z === 1){
      [leftBridge, rightBridge].forEach(function(pts){
        ctx.save();
        ctx.strokeStyle = "#8a501c";
        ctx.lineWidth = 7;
        ctx.beginPath();
        for(var i = 0; i < pts.length; i++){
          var ry = pts[i].y - pts[i].s * 54;
          if(i === 0) ctx.moveTo(pts[i].x, ry);
          else ctx.lineTo(pts[i].x, ry);
        }
        ctx.stroke();
        ctx.strokeStyle = "#e6aa60";
        ctx.lineWidth = 3.2;
        ctx.stroke();
        ctx.restore();
      });
    }

    // 4. ROADSIDE SCENERY + APPROACHING TUNNEL PORTALS (DEPTH-SORTED FAR TO NEAR)
    var drawList = [];
    var tunnels = getCabTunnels();
    var mtnMode = state.layout === "mountain";

    CAB_PROPS.forEach(function(pr){
      if(mtnMode && pr.skipMtn) return;
      var dz = wrapLoopDist(pr.z, cab.dist) * state.dir;
      // Show props ahead (positive dz when dir=1, or behind/ahead smoothly in reverse)
      if(dz > 0.45 && dz < zFar){
        drawList.push({ z: dz, prop: pr });
      }
    });

    // Approaching 3D Mountain Tunnel Portals!
    tunnels.forEach(function(tn){
      var entryWorld = state.dir === 1 ? tn.start : tn.end;
      var dz = wrapLoopDist(entryWorld, cab.dist) * state.dir;
      if(dz > 0.35 && dz < zFar){
        drawList.push({ z: dz, prop: { kind: "tunnelPortal", lat: 0 } });
      }
    });

    // Sort far -> near for flawless painter's algorithm overlap
    drawList.sort(function(a, b){ return b.z - a.z; });
    cab.hitZones.props = [];

    drawList.forEach(function(item){
      var pr = item.prop;
      var z = item.z;
      var p = proj(z, pr.lat);
      var sc = p.scale;
      if(sc < 2) return;

      if(pr.kind === "pine"){
        drawCabPine(p.x, p.y, sc * (pr.sz || 1));
      } else if(pr.kind === "cow"){
        var hop = Math.sin(cab.cowHop * Math.PI) * sc * 0.38;
        drawCabCow(p.x, p.y - hop, sc * (pr.sz || 1), pr.lat < 0 ? 1 : -1);
        if(z < 12){
          cab.hitZones.props.push({ kind: "cow", x: p.x, y: p.y - sc * 0.45, r: Math.max(28, sc * 0.72) });
        }
      } else if(pr.kind === "barn"){
        var bHop = 1 + Math.sin(cab.barnHop * Math.PI) * 0.08;
        drawCabBarn(p.x, p.y, sc * (pr.sz || 1) * bHop, pr.lat < 0 ? 1 : -1);
        if(z < 16){
          cab.hitZones.props.push({ kind: "barn", x: p.x, y: p.y - sc * 0.9, r: Math.max(36, sc * 1.15) });
        }
      } else if(pr.kind === "crossing"){
        drawCabCrossingGate(p.cx, p.y, sc, z, t);
        if(z < 13){
          cab.hitZones.props.push({ kind: "crossing", x: p.cx, y: p.y - sc * 0.7, r: Math.max(40, sc * 1.3) });
        }
      } else if(pr.kind === "flower"){
        drawCabFlowerPatch(p.x, p.y, sc, pr.col);
      } else if(pr.kind === "tunnelPortal"){
        drawCabTunnelPortal(p.cx, p.y, sc);
      }
    });

    // 5. COZY DARK-WOOD MOUNTAIN TUNNEL PASS-THROUGH + GLOWING HEADLIGHT BEAM
    if(cab.tunnelAmt > 0.015){
      drawCabTunnelInterior(horizonY, groundH, proj, t);
    }

    // 6. FOREGROUND CARTOON STEAM CLOUDS (behind cab pillars, rising above boiler!)
    drawCabSteamPuffs();

    // 7. FOREGROUND RED STEAM ENGINE BOILER NOSE + GOLDEN BRASS BELL + SMOKESTACK + WOODEN CAB PILLARS
    drawCabForegroundEngineAndFrame(t, bobX, bobY, horizonY);

    // 8. SHARED SPARKLES & MUSIC NOTES (work identically in Cab View!)
    drawSteamAndParticles();
  }

  function drawCabPine(x, y, sc){
    ctx.save();
    ctx.translate(x, y);
    // Ground shadow
    ctx.fillStyle = "rgba(32, 68, 22, 0.28)";
    ctx.beginPath();
    ctx.ellipse(0, 0, sc * 0.62, sc * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    // Wooden trunk
    ctx.fillStyle = "#7a471f";
    ctx.strokeStyle = "#3a1e09";
    ctx.lineWidth = Math.max(1, sc * 0.055);
    ctx.fillRect(-sc * 0.14, -sc * 0.48, sc * 0.28, sc * 0.5);
    // 3 sculpted Pixar pine tiers
    var tiers = [
      { base: -0.34, top: -1.35, halfW: 0.72, col: "#257a37", hi: "#38a34d" },
      { base: -0.92, top: -1.96, halfW: 0.56, col: "#2f9644", hi: "#51c466" },
      { base: -1.50, top: -2.52, halfW: 0.39, col: "#40b856", hi: "#78e088" }
    ];
    tiers.forEach(function(tr){
      ctx.fillStyle = tr.col;
      ctx.beginPath();
      ctx.moveTo(0, sc * tr.top);
      ctx.lineTo(sc * tr.halfW, sc * tr.base);
      ctx.lineTo(-sc * tr.halfW, sc * tr.base);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Sunlit right edge highlight matching golden sun!
      ctx.fillStyle = tr.hi;
      ctx.beginPath();
      ctx.moveTo(0, sc * tr.top);
      ctx.lineTo(sc * tr.halfW * 0.92, sc * tr.base);
      ctx.lineTo(sc * tr.halfW * 0.12, sc * tr.base);
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();
  }

  function drawCabCow(x, y, sc, faceDir){
    ctx.save();
    ctx.translate(x, y);
    // Cute wooden pasture fence posts behind cow
    ctx.fillStyle = "#fff8eb";
    ctx.strokeStyle = "#7c532d";
    ctx.lineWidth = Math.max(1, sc * 0.04);
    ctx.fillRect(-sc * 0.85, -sc * 0.52, sc * 1.7, sc * 0.10);
    ctx.fillRect(-sc * 0.85, -sc * 0.28, sc * 1.7, sc * 0.10);
    [-0.75, 0, 0.75].forEach(function(fx){
      ctx.fillRect(sc * (fx - 0.06), -sc * 0.65, sc * 0.12, sc * 0.66);
    });

    ctx.scale(faceDir, 1);
    // Shadow
    ctx.fillStyle = "rgba(32, 68, 22, 0.28)";
    ctx.beginPath();
    ctx.ellipse(0, 0, sc * 0.54, sc * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    // Legs
    ctx.fillStyle = "#3d2b1f";
    [-0.32, -0.14, 0.14, 0.32].forEach(function(lx){
      ctx.fillRect(sc * (lx - 0.055), -sc * 0.36, sc * 0.11, sc * 0.36);
    });
    // Body
    ctx.fillStyle = "#fffdf8";
    ctx.strokeStyle = "#2c1d11";
    ctx.lineWidth = Math.max(1, sc * 0.055);
    ctx.beginPath();
    ctx.roundRect(-sc * 0.46, -sc * 0.78, sc * 0.92, sc * 0.52, sc * 0.22);
    ctx.fill();
    ctx.stroke();
    // Spots
    ctx.fillStyle = "#3d2b1f";
    ctx.beginPath();
    ctx.ellipse(-sc * 0.14, -sc * 0.54, sc * 0.16, sc * 0.12, 0.25, 0, Math.PI * 2);
    ctx.ellipse(sc * 0.18, -sc * 0.46, sc * 0.13, sc * 0.10, -0.2, 0, Math.PI * 2);
    ctx.fill();
    // Head
    ctx.fillStyle = "#fffdf8";
    ctx.beginPath();
    ctx.arc(sc * 0.44, -sc * 0.68, sc * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Pink snout
    ctx.fillStyle = "#ffafcc";
    ctx.beginPath();
    ctx.ellipse(sc * 0.54, -sc * 0.56, sc * 0.18, sc * 0.13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Cute eyes
    ctx.fillStyle = "#2c1d11";
    ctx.beginPath();
    ctx.arc(sc * 0.39, -sc * 0.74, sc * 0.04, 0, Math.PI * 2);
    ctx.arc(sc * 0.53, -sc * 0.74, sc * 0.04, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawCabBarn(x, y, sc, side){
    ctx.save();
    ctx.translate(x, y);
    // Ground shadow
    ctx.fillStyle = "rgba(32, 68, 22, 0.28)";
    ctx.beginPath();
    ctx.ellipse(0, 0, sc * 1.45, sc * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();

    // Silo on outer side
    var siloX = side < 0 ? -sc * 1.12 : sc * 1.12;
    ctx.fillStyle = "#e8d5b7";
    ctx.strokeStyle = "#4d1b15";
    ctx.lineWidth = Math.max(1.2, sc * 0.055);
    ctx.beginPath();
    ctx.roundRect(siloX - sc * 0.34, -sc * 2.1, sc * 0.68, sc * 2.1, sc * 0.12);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#c92a2a";
    ctx.beginPath();
    ctx.arc(siloX, -sc * 2.1, sc * 0.35, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Classic Red Gambrel Barn Body
    ctx.fillStyle = "#df3c34";
    ctx.beginPath();
    ctx.moveTo(-sc * 1.05, 0);
    ctx.lineTo(-sc * 1.05, -sc * 1.1);
    ctx.lineTo(-sc * 0.68, -sc * 1.82);
    ctx.lineTo(0, -sc * 2.18);
    ctx.lineTo(sc * 0.68, -sc * 1.82);
    ctx.lineTo(sc * 1.05, -sc * 1.1);
    ctx.lineTo(sc * 1.05, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Crisp White Roof Trim
    ctx.strokeStyle = "#fff9ec";
    ctx.lineWidth = Math.max(1.6, sc * 0.10);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(-sc * 1.14, -sc * 1.08);
    ctx.lineTo(-sc * 0.70, -sc * 1.84);
    ctx.lineTo(0, -sc * 2.22);
    ctx.lineTo(sc * 0.70, -sc * 1.84);
    ctx.lineTo(sc * 1.14, -sc * 1.08);
    ctx.stroke();

    // Double X Barn Doors
    ctx.fillStyle = "#b5251e";
    ctx.strokeStyle = "#fff9ec";
    ctx.lineWidth = Math.max(1.2, sc * 0.065);
    ctx.beginPath();
    ctx.roundRect(-sc * 0.48, -sc * 0.88, sc * 0.96, sc * 0.88, sc * 0.06);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-sc * 0.48, -sc * 0.88); ctx.lineTo(sc * 0.48, 0);
    ctx.moveTo(sc * 0.48, -sc * 0.88); ctx.lineTo(-sc * 0.48, 0);
    ctx.stroke();

    // Warm Golden Hayloft Window
    ctx.fillStyle = "#ffd43b";
    ctx.beginPath();
    ctx.roundRect(-sc * 0.24, -sc * 1.62, sc * 0.48, sc * 0.40, sc * 0.06);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawCabCrossingGate(cx, y, sc, z, t){
    ctx.save();
    ctx.translate(cx, y);

    // Dirt footpath crossing underneath track
    ctx.fillStyle = "rgba(232, 207, 155, 0.82)";
    ctx.fillRect(-sc * 3.8, -sc * 0.16, sc * 7.6, sc * 0.34);

    // Lower barrier arms smoothly when approaching!
    var lowerAmt = Math.max(0, Math.min(1, (14 - z) / 8));
    var flashOn = Math.sin(t * 12) > 0;

    [-1, 1].forEach(function(side){
      var px = side * sc * 1.48;
      // Wooden post
      ctx.fillStyle = "#5c3412";
      ctx.strokeStyle = "#2c1d11";
      ctx.lineWidth = Math.max(1, sc * 0.05);
      ctx.beginPath();
      ctx.roundRect(px - sc * 0.11, -sc * 1.95, sc * 0.22, sc * 1.98, sc * 0.06);
      ctx.fill();
      ctx.stroke();

      // White X Crossbuck sign near top
      ctx.save();
      ctx.translate(px, -sc * 1.65);
      ctx.strokeStyle = "#fffdf8";
      ctx.lineWidth = Math.max(1.8, sc * 0.13);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-sc * 0.32, -sc * 0.22); ctx.lineTo(sc * 0.32, sc * 0.22);
      ctx.moveTo(sc * 0.32, -sc * 0.22); ctx.lineTo(-sc * 0.32, sc * 0.22);
      ctx.stroke();
      ctx.restore();

      // Twin flashing red warning lamps
      ctx.fillStyle = "#2c1d11";
      ctx.beginPath();
      ctx.roundRect(px - sc * 0.36, -sc * 1.32, sc * 0.72, sc * 0.26, sc * 0.11);
      ctx.fill();
      [[-0.19, flashOn], [0.19, !flashOn]].forEach(function(lp){
        if(lp[1] && lowerAmt > 0.1){
          ctx.fillStyle = "rgba(255, 59, 48, 0.45)";
          ctx.beginPath();
          ctx.arc(px + sc * lp[0], -sc * 1.19, sc * 0.24, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = (lp[1] && lowerAmt > 0.1) ? "#ff3b30" : "#6b2320";
        ctx.beginPath();
        ctx.arc(px + sc * lp[0], -sc * 1.19, sc * 0.10, 0, Math.PI * 2);
        ctx.fill();
      });

      // Red-and-white striped barrier arm pivoting down toward track edge (never blocking train!)
      ctx.save();
      ctx.translate(px, -sc * 0.72);
      var rot = side === -1 ? -(1 - lowerAmt) * 1.15 : Math.PI + (1 - lowerAmt) * 1.15;
      ctx.rotate(rot);
      var armLen = sc * 1.15;
      ctx.fillStyle = "#fffdf8";
      ctx.strokeStyle = "#2c1d11";
      ctx.lineWidth = Math.max(1, sc * 0.045);
      ctx.beginPath();
      ctx.roundRect(0, -sc * 0.09, armLen, sc * 0.18, sc * 0.06);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#e8483c";
      for(var sx = 0.18; sx < 1.0; sx += 0.32){
        ctx.fillRect(sc * sx, -sc * 0.075, sc * 0.15, sc * 0.15);
      }
      ctx.restore();
    });
    ctx.restore();
  }

  function drawCabFlowerPatch(x, y, sc, col){
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#2b8a3e";
    ctx.beginPath();
    ctx.ellipse(0, 0, sc * 0.34, sc * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    [[-0.18, -0.06], [0.02, -0.11], [0.19, -0.04]].forEach(function(fp){
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(sc * fp[0], sc * fp[1], Math.max(1.6, sc * 0.095), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffd43b";
      ctx.beginPath();
      ctx.arc(sc * fp[0], sc * fp[1], Math.max(0.8, sc * 0.04), 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawCabTunnelPortal(cx, y, sc){
    ctx.save();
    ctx.translate(cx, y);

    // Big lush storybook green mountain hill arching over the rails
    var hillW = sc * 4.9;
    var hillH = sc * 3.8;
    var mg = ctx.createLinearGradient(0, -hillH, 0, sc * 0.2);
    mg.addColorStop(0, "#68bd64");
    mg.addColorStop(0.55, "#428f49");
    mg.addColorStop(1, "#2a6333");
    ctx.fillStyle = mg;
    ctx.strokeStyle = "#1d4724";
    ctx.lineWidth = Math.max(1.5, sc * 0.07);
    ctx.beginPath();
    ctx.moveTo(-hillW, sc * 0.1);
    ctx.bezierCurveTo(-hillW * 0.72, -hillH * 0.72, -hillW * 0.28, -hillH, 0, -hillH);
    ctx.bezierCurveTo(hillW * 0.28, -hillH, hillW * 0.72, -hillH * 0.72, hillW, sc * 0.1);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Snowy peak cap
    ctx.save();
    ctx.clip();
    ctx.fillStyle = "#fffdf8";
    ctx.beginPath();
    ctx.moveTo(-hillW * 0.28, -hillH * 0.72);
    ctx.lineTo(-hillW * 0.12, -hillH * 0.80);
    ctx.lineTo(0, -hillH * 0.68);
    ctx.lineTo(hillW * 0.12, -hillH * 0.80);
    ctx.lineTo(hillW * 0.28, -hillH * 0.72);
    ctx.lineTo(hillW * 0.34, -hillH * 1.1);
    ctx.lineTo(-hillW * 0.34, -hillH * 1.1);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Timber-and-Stone Arched Tunnel Mouth right over the tracks
    var archW = sc * 1.48;
    var archH = sc * 1.85;
    // Outer stone/wood arch collar
    ctx.fillStyle = "#8a5a2e";
    ctx.strokeStyle = "#3d220d";
    ctx.lineWidth = Math.max(1.5, sc * 0.07);
    ctx.beginPath();
    ctx.moveTo(-archW * 1.24, sc * 0.06);
    ctx.lineTo(-archW * 1.24, -archH * 0.56);
    ctx.arc(0, -archH * 0.56, archW * 1.24, Math.PI, 0);
    ctx.lineTo(archW * 1.24, sc * 0.06);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Cozy dark tunnel cavity
    ctx.fillStyle = "#1d120b";
    ctx.beginPath();
    ctx.moveTo(-archW, sc * 0.06);
    ctx.lineTo(-archW, -archH * 0.56);
    ctx.arc(0, -archH * 0.56, archW, Math.PI, 0);
    ctx.lineTo(archW, sc * 0.06);
    ctx.closePath();
    ctx.fill();

    // Warm golden inner lantern glow inside portal mouth
    var gl = ctx.createRadialGradient(0, -archH * 0.3, sc * 0.1, 0, -archH * 0.3, archW * 0.9);
    gl.addColorStop(0, "rgba(255, 224, 120, 0.22)");
    gl.addColorStop(1, "rgba(255, 224, 120, 0)");
    ctx.fillStyle = gl;
    ctx.fill();
    ctx.restore();
  }

  function drawCabTunnelInterior(horizonY, groundH, proj, t){
    var alpha = cab.tunnelAmt;
    var tunStat = getCabTunnelStatus();
    var vp = proj(18, 0);

    ctx.save();
    // 1. Cozy deep dark-wood mountain tunnel envelope
    ctx.globalAlpha = Math.min(0.95, alpha * 0.96);
    var bgG = ctx.createRadialGradient(vp.cx, horizonY - 12, Math.min(W, H) * 0.08, vp.cx, horizonY, Math.max(W, H) * 0.85);
    bgG.addColorStop(0, "#3b2414");
    bgG.addColorStop(0.45, "#23140b");
    bgG.addColorStop(1, "#120905");
    ctx.fillStyle = bgG;
    ctx.fillRect(0, 0, W, H);

    // 2. Re-draw glowing illuminated wooden tracks inside the tunnel so tracks stay vivid!
    var zNear = 0.55, zFar = 22;
    var tieSpacing = 0.62;
    var firstTieIdx = Math.ceil((cab.dist + zNear * 0.7) / tieSpacing);
    for(var ti = 28; ti >= 0; ti--){
      var relZ = (firstTieIdx + ti) * tieSpacing - cab.dist;
      if(relZ < zNear || relZ > zFar) continue;
      var tp = proj(relZ, 0);
      var glow = Math.max(0.18, 1 - relZ / 15);
      ctx.fillStyle = "rgba(195, 134, 68, " + (glow * 0.85) + ")";
      ctx.fillRect(tp.cx - tp.scale * 0.95, tp.y - tp.scale * 0.07, tp.scale * 1.9, Math.max(1.5, tp.scale * 0.14));
    }
    // Gleaming rails inside tunnel
    [-0.62, 0.62].forEach(function(lat){
      ctx.beginPath();
      for(var i = 0; i <= 22; i++){
        var z = zFar * Math.pow(zNear / zFar, i / 22);
        var rp = proj(z, lat);
        if(i === 0) ctx.moveTo(rp.x, rp.y);
        else ctx.lineTo(rp.x, rp.y);
      }
      ctx.strokeStyle = "rgba(255, 240, 175, 0.75)";
      ctx.lineWidth = 4;
      ctx.stroke();
    });

    // 3. Receding Cozy Dark-Wood Timber Arch Ribs rushing past!
    var ribSpacing = 1.65;
    var firstRib = Math.ceil((cab.dist + 0.5) / ribSpacing);
    for(var ri = 14; ri >= 0; ri--){
      var rz = (firstRib + ri) * ribSpacing - cab.dist;
      if(rz < 0.45 || rz > 20) continue;
      var rp = proj(rz, 0);
      var archR = rp.scale * 1.95;
      var baseH = rp.scale * 1.35;
      var lum = Math.max(0.25, 1 - rz / 18);
      ctx.strokeStyle = "rgba(" + Math.round(145 * lum) + "," + Math.round(86 * lum) + "," + Math.round(38 * lum) + "," + (0.94 * alpha) + ")";
      ctx.lineWidth = Math.max(3, rp.scale * 0.24);
      ctx.beginPath();
      ctx.moveTo(rp.cx - archR, rp.y + rp.scale * 0.2);
      ctx.lineTo(rp.cx - archR, rp.y - baseH);
      ctx.arc(rp.cx, rp.y - baseH, archR, Math.PI, 0);
      ctx.lineTo(rp.cx + archR, rp.y + rp.scale * 0.2);
      ctx.stroke();

      // Subtle warm golden headlight rim highlight on inner edge of timber rib
      ctx.strokeStyle = "rgba(255, 218, 128, " + (lum * 0.42 * alpha) + ")";
      ctx.lineWidth = Math.max(1.2, rp.scale * 0.06);
      ctx.stroke();
    }

    // 4. Cheerful Sunny Exit Arch glowing ahead (grows bigger as you approach exit!)
    var exitGrow = 0.28 + tunStat.frac * 0.92;
    var exitR = Math.min(W, H) * 0.13 * exitGrow;
    var exitY = horizonY - exitR * 0.22;
    var exitG = ctx.createRadialGradient(vp.cx, exitY, exitR * 0.15, vp.cx, exitY, exitR * 1.65);
    exitG.addColorStop(0, "#ffffff");
    exitG.addColorStop(0.45, "#a6e6ff");
    exitG.addColorStop(0.78, "rgba(135, 224, 120, 0.55)");
    exitG.addColorStop(1, "rgba(135, 224, 120, 0)");
    ctx.fillStyle = exitG;
    ctx.beginPath();
    ctx.arc(vp.cx, exitY, exitR * 1.6, 0, Math.PI * 2);
    ctx.fill();

    // 5. Soft Volumetric Glowing Golden Train Headlight Cone (feathered smoothly, zero hard edges!)
    ctx.globalCompositeOperation = "screen";
    var beamOriginY = H * 0.64;
    var beamRadius = Math.max(W, H) * 0.56;
    var beamG = ctx.createRadialGradient(W * 0.5, beamOriginY - 12, 10, vp.cx, horizonY + groundH * 0.14, beamRadius);
    beamG.addColorStop(0, "rgba(255, 248, 180, " + (0.72 * alpha) + ")");
    beamG.addColorStop(0.32, "rgba(255, 228, 125, " + (0.36 * alpha) + ")");
    beamG.addColorStop(0.72, "rgba(255, 205, 85, " + (0.10 * alpha) + ")");
    beamG.addColorStop(1, "rgba(255, 195, 70, 0)");
    ctx.fillStyle = beamG;
    ctx.beginPath();
    ctx.moveTo(W * 0.5 - 24, beamOriginY);
    ctx.quadraticCurveTo(vp.cx - W * 0.34, horizonY + groundH * 0.08, vp.cx - W * 0.24, horizonY - H * 0.18);
    ctx.quadraticCurveTo(vp.cx, horizonY - H * 0.28, vp.cx + W * 0.24, horizonY - H * 0.18);
    ctx.quadraticCurveTo(vp.cx + W * 0.34, horizonY + groundH * 0.08, W * 0.5 + 24, beamOriginY);
    ctx.closePath();
    ctx.fill();

    // Twinkling golden dust motes dancing inside headlight beam
    ctx.fillStyle = "rgba(255, 250, 200, " + (0.65 * alpha) + ")";
    for(var m = 0; m < 10; m++){
      var mx = W * 0.5 + Math.sin(t * 1.7 + m * 2.1) * W * 0.18;
      var my = horizonY + ((t * 55 + m * 41) % (groundH * 0.45));
      ctx.beginPath();
      ctx.arc(mx, my, 2.2 + (m % 3), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawCabSteamPuffs(){
    cab.steamPuffs.forEach(function(p){
      var f = p.life / p.maxLife;
      var alpha = Math.max(0, (1 - f * f) * 0.88);
      var rad = p.r * (0.68 + f * 1.55);
      ctx.save();
      ctx.globalAlpha = alpha;
      // Soft sky-tinted cloud shadow underneath
      ctx.fillStyle = "rgba(205, 224, 240, 0.72)";
      ctx.beginPath();
      ctx.arc(p.x, p.y + rad * 0.18, rad * 0.96, 0, Math.PI * 2);
      ctx.arc(p.x - rad * 0.56, p.y + rad * 0.26, rad * 0.66, 0, Math.PI * 2);
      ctx.arc(p.x + rad * 0.58, p.y + rad * 0.24, rad * 0.70, 0, Math.PI * 2);
      ctx.fill();
      // Fluffy cartoon pure-white Pixar steam puff (no harsh overlapping inner rings!)
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      ctx.arc(p.x - rad * 0.56, p.y + rad * 0.14, rad * 0.68, 0, Math.PI * 2);
      ctx.arc(p.x + rad * 0.58, p.y + rad * 0.11, rad * 0.72, 0, Math.PI * 2);
      ctx.arc(p.x + rad * 0.12, p.y - rad * 0.32, rad * 0.62, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawCabForegroundEngineAndFrame(t, bobX, bobY, horizonY){
    var conRect = consoleEl.getBoundingClientRect();
    var sillY = Math.min(H - 76, Math.max(H * 0.68, conRect.top + 8));
    var portrait = H > W * 1.05;
    var u = Math.min(W, H) / 760;
    var bounceY = -Math.sin(trainBounce * Math.PI) * 14 * u;
    var cx = W * 0.5 + bobX;
    var engBaseY = sillY + 12 + bobY + bounceY;

    // 1. GLOSSY RED STEAM ENGINE BOILER NOSE (sleek perspective barrel leaving generous track vista ahead!)
    var backW = Math.min(W * (portrait ? 0.33 : 0.185), 215);
    var frontW = backW * 0.48;
    var noseY = Math.max(horizonY + (sillY - horizonY) * (portrait ? 0.36 : 0.42), sillY - (portrait ? 142 : 132) * Math.max(0.72, u));
    var frontCenterY = noseY + frontW * 0.44;

    ctx.save();
    // Soft shadow cast onto rails below boiler
    ctx.fillStyle = "rgba(25, 38, 18, 0.34)";
    ctx.beginPath();
    ctx.ellipse(cx, engBaseY + 4, backW * 1.15, 24 * u, 0, 0, Math.PI * 2);
    ctx.fill();

    // Red Boiler Cylinder Body
    var boilGrad = ctx.createLinearGradient(cx - backW, 0, cx + backW, 0);
    boilGrad.addColorStop(0, "#8f1812");
    boilGrad.addColorStop(0.24, "#e8483c");
    boilGrad.addColorStop(0.46, "#ff7163");
    boilGrad.addColorStop(0.76, "#d63026");
    boilGrad.addColorStop(1, "#7c140e");
    ctx.fillStyle = boilGrad;
    ctx.strokeStyle = "#4d120c";
    ctx.lineWidth = Math.max(2.6, 3.6 * u);
    ctx.beginPath();
    ctx.moveTo(cx - backW, engBaseY + 18);
    ctx.lineTo(cx - frontW, frontCenterY);
    ctx.arc(cx, frontCenterY, frontW, Math.PI, 0, false);
    ctx.lineTo(cx + backW, engBaseY + 18);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Glossy Pixar Specular Highlight along top-left curve of boiler
    ctx.fillStyle = "rgba(255, 255, 255, 0.24)";
    ctx.beginPath();
    ctx.moveTo(cx - backW * 0.44, engBaseY);
    ctx.lineTo(cx - frontW * 0.44, frontCenterY - frontW * 0.48);
    ctx.lineTo(cx - frontW * 0.08, frontCenterY - frontW * 0.54);
    ctx.lineTo(cx - backW * 0.05, engBaseY);
    ctx.closePath();
    ctx.fill();

    // Gleaming Golden Brass Boiler Bands wrapping across the red cylinder
    [0.26, 0.62].forEach(function(bf){
      var by = frontCenterY + (engBaseY - frontCenterY) * bf;
      var bw = frontW + (backW - frontW) * bf;
      ctx.strokeStyle = "#f5b727";
      ctx.lineWidth = Math.max(4, 7 * u);
      ctx.beginPath();
      ctx.ellipse(cx, by, bw, bw * 0.22, 0, Math.PI * 1.06, Math.PI * 1.94);
      ctx.stroke();
      ctx.strokeStyle = "#fff3a6";
      ctx.lineWidth = Math.max(1.5, 2.4 * u);
      ctx.beginPath();
      ctx.ellipse(cx, by - 1.5, bw * 0.98, bw * 0.20, 0, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    });

    // Front Cast-Iron Smokebox Rim + Glowing Golden Headlamp Housing
    ctx.fillStyle = "#343a40";
    ctx.strokeStyle = "#1c1f23";
    ctx.lineWidth = Math.max(2, 2.8 * u);
    ctx.beginPath();
    ctx.ellipse(cx, frontCenterY - frontW * 0.34, frontW * 0.78, frontW * 0.34, 0, Math.PI, 0);
    ctx.fill();
    ctx.stroke();

    // Brass Headlamp Dome on nose tip
    var lampY = frontCenterY - frontW * 0.68;
    var lampR = Math.max(9, frontW * 0.22);
    if(cab.tunnelAmt > 0.05){
      var halo = ctx.createRadialGradient(cx, lampY, lampR * 0.2, cx, lampY, lampR * 3.4);
      halo.addColorStop(0, "rgba(255, 248, 175, " + (0.85 * cab.tunnelAmt) + ")");
      halo.addColorStop(1, "rgba(255, 230, 120, 0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cx, lampY, lampR * 3.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#f5b727";
    ctx.strokeStyle = "#5c3605";
    ctx.lineWidth = Math.max(2, 2.6 * u);
    ctx.beginPath();
    ctx.arc(cx, lampY, lampR, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = cab.tunnelAmt > 0.2 ? "#fffbe0" : "#ffe680";
    ctx.beginPath();
    ctx.arc(cx, lampY, lampR * 0.56, 0, Math.PI * 2);
    ctx.fill();

    // 2. TALL CAST-IRON SMOKESTACK (puffing white cartoon steam!)
    var stackBaseY = frontCenterY - frontW * 0.42;
    var stackH = Math.max(46, frontW * 1.05);
    var stackTopY = stackBaseY - stackH;
    var stackW = Math.max(15, frontW * 0.28);

    var stGrad = ctx.createLinearGradient(cx - stackW, 0, cx + stackW, 0);
    stGrad.addColorStop(0, "#1f2428");
    stGrad.addColorStop(0.38, "#4b535c");
    stGrad.addColorStop(0.75, "#2b3036");
    stGrad.addColorStop(1, "#14171a");
    ctx.fillStyle = stGrad;
    ctx.strokeStyle = "#111315";
    ctx.lineWidth = Math.max(2, 2.8 * u);
    ctx.beginPath();
    ctx.moveTo(cx - stackW * 0.85, stackBaseY);
    ctx.lineTo(cx - stackW * 0.65, stackTopY + stackH * 0.24);
    ctx.lineTo(cx - stackW * 1.22, stackTopY);
    ctx.lineTo(cx + stackW * 1.22, stackTopY);
    ctx.lineTo(cx + stackW * 0.65, stackTopY + stackH * 0.24);
    ctx.lineTo(cx + stackW * 0.85, stackBaseY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Brass chimney crown rim
    ctx.fillStyle = "#f5b727";
    ctx.strokeStyle = "#5c3605";
    ctx.beginPath();
    ctx.ellipse(cx, stackTopY, stackW * 1.22, stackW * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#1a1d20";
    ctx.beginPath();
    ctx.ellipse(cx, stackTopY, stackW * 0.78, stackW * 0.19, 0, 0, Math.PI * 2);
    ctx.fill();

    // Record smokestack & boiler hit zone for steam spawn + tap-to-whistle!
    cab.hitZones.boiler = {
      x: cx,
      y: (engBaseY + frontCenterY) * 0.5,
      rx: backW * 0.85,
      ry: (engBaseY - stackTopY) * 0.55,
      stackX: cx,
      stackY: stackTopY - 4
    };

    // 3. POLISHED GOLDEN BRASS BELL (swings & rings!)
    var bellBaseY = frontCenterY + (engBaseY - frontCenterY) * 0.34;
    var bellR = Math.max(16, frontW * 0.34);
    // Curved brass yoke posts
    ctx.strokeStyle = "#8a5308";
    ctx.lineWidth = Math.max(3, 5 * u);
    ctx.beginPath();
    ctx.moveTo(cx - bellR * 1.15, bellBaseY + 4);
    ctx.quadraticCurveTo(cx - bellR * 1.15, bellBaseY - bellR * 1.35, cx, bellBaseY - bellR * 1.35);
    ctx.quadraticCurveTo(cx + bellR * 1.15, bellBaseY - bellR * 1.35, cx + bellR * 1.15, bellBaseY + 4);
    ctx.stroke();
    ctx.strokeStyle = "#ffe066";
    ctx.lineWidth = Math.max(1.5, 2.4 * u);
    ctx.stroke();

    // Swinging bell body
    ctx.save();
    ctx.translate(cx, bellBaseY - bellR * 1.25);
    ctx.rotate(cab.bellAngle);
    var bellGrad = ctx.createLinearGradient(-bellR, 0, bellR, 0);
    bellGrad.addColorStop(0, "#b8760b");
    bellGrad.addColorStop(0.35, "#fff4a3");
    bellGrad.addColorStop(0.68, "#f5b727");
    bellGrad.addColorStop(1, "#9a5d05");
    ctx.fillStyle = bellGrad;
    ctx.strokeStyle = "#5c3404";
    ctx.lineWidth = Math.max(2, 2.6 * u);
    ctx.beginPath();
    ctx.moveTo(-bellR * 0.34, 0);
    ctx.bezierCurveTo(-bellR * 0.45, bellR * 0.7, -bellR * 0.92, bellR * 0.95, -bellR * 0.98, bellR * 1.15);
    ctx.quadraticCurveTo(0, bellR * 1.36, bellR * 0.98, bellR * 1.15);
    ctx.bezierCurveTo(bellR * 0.92, bellR * 0.95, bellR * 0.45, bellR * 0.7, bellR * 0.34, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Little clapper peeking underneath
    ctx.fillStyle = "#5c3404";
    ctx.beginPath();
    ctx.arc(0, bellR * 1.24, bellR * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    cab.hitZones.bell = { x: cx, y: bellBaseY - bellR * 0.55, r: Math.max(34, bellR * 1.55) };
    ctx.restore();

    // 4. WARM WOODEN CAB WINDOW PILLARS, OVERHEAD ARCH BEAM & LOWER DASHBOARD SILL
    var pillarW = Math.round(Math.max(16, Math.min(48, W * (portrait ? 0.048 : 0.038))));
    var topBeamH = Math.round(Math.max(24, Math.min(42, H * 0.042)));
    var woodDark = "#5e3312";

    ctx.save();
    // Left & Right warm beechwood window pillars
    [0, W - pillarW].forEach(function(px, idx){
      var pg = ctx.createLinearGradient(px, 0, px + pillarW, 0);
      if(idx === 0){
        pg.addColorStop(0, "#7c4519");
        pg.addColorStop(0.65, "#c68440");
        pg.addColorStop(1, "#e8b572");
      } else {
        pg.addColorStop(0, "#e8b572");
        pg.addColorStop(0.35, "#c68440");
        pg.addColorStop(1, "#7c4519");
      }
      ctx.fillStyle = pg;
      ctx.fillRect(px, 0, pillarW, H);
      ctx.strokeStyle = woodDark;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      var edgeX = idx === 0 ? pillarW : W - pillarW;
      ctx.moveTo(edgeX, 0);
      ctx.lineTo(edgeX, H);
      ctx.stroke();

      // Decorative brass rivets along pillars
      ctx.fillStyle = "#ffd43b";
      ctx.strokeStyle = "#613904";
      ctx.lineWidth = 1.6;
      for(var ry = H * 0.24; ry < sillY - 30; ry += H * 0.22){
        ctx.beginPath();
        ctx.arc(px + pillarW * 0.5, ry, Math.max(3, pillarW * 0.14), 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    });

    // Subtle arched wooden overhead cab roof valence (frames top corners cleanly behind HUD)
    var archG = ctx.createLinearGradient(0, 0, 0, topBeamH + 22);
    archG.addColorStop(0, "#6e3c14");
    archG.addColorStop(0.7, "#b67534");
    archG.addColorStop(1, "#d99d56");
    ctx.fillStyle = archG;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(W, 0);
    ctx.lineTo(W, topBeamH + 26);
    ctx.quadraticCurveTo(W * 0.5, topBeamH - 18, 0, topBeamH + 26);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = woodDark;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(0, topBeamH + 26);
    ctx.quadraticCurveTo(W * 0.5, topBeamH - 18, W, topBeamH + 26);
    ctx.stroke();

    // Warm Wooden Lower Cab Sill spanning cleanly behind the bottom driving console
    var sillG = ctx.createLinearGradient(0, sillY, 0, H);
    sillG.addColorStop(0, "#e7b16a");
    sillG.addColorStop(0.22, "#c27f3b");
    sillG.addColorStop(1, "#7b451a");
    ctx.fillStyle = sillG;
    ctx.beginPath();
    ctx.moveTo(0, sillY + 6);
    ctx.quadraticCurveTo(W * 0.5, sillY - 12, W, sillY + 6);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = woodDark;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, sillY + 6);
    ctx.quadraticCurveTo(W * 0.5, sillY - 12, W, sillY + 6);
    ctx.stroke();

    // Cute Brass Pressure / Speed Dial tucked on the left wooden sill (visible on desktop/iPad!)
    if(!portrait && W >= 780){
      var gx = pillarW + 56;
      var gy = sillY - 12;
      var gr = 24;
      ctx.fillStyle = "#fffaf0";
      ctx.strokeStyle = "#8a501c";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(gx, gy, gr, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "#ffd43b";
      ctx.lineWidth = 2;
      ctx.stroke();
      // Animated speed needle
      var needleAng = !state.running ? -Math.PI * 0.78
        : (state.speed === "slow" ? -Math.PI * 0.45 : (state.speed === "cruise" ? -Math.PI * 0.1 : Math.PI * 0.25));
      needleAng += Math.sin(t * 9) * (state.running ? 0.04 : 0);
      ctx.strokeStyle = "#e8483c";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.lineTo(gx + Math.cos(needleAng) * (gr - 6), gy + Math.sin(needleAng) * (gr - 6));
      ctx.stroke();
      ctx.fillStyle = "#2c1d11";
      ctx.beginPath();
      ctx.arc(gx, gy, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  /* ==================== INTERACTIONS & CONTROLS ==================== */
  function syncHudUi(){
    // Track layout pills
    trackPills.forEach(function(btn){
      var on = btn.getAttribute("data-layout") === state.layout;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });

    // Cab View / Track View toggle button
    btnCabView.classList.toggle("active", state.cabView);
    btnCabView.setAttribute("aria-pressed", state.cabView ? "true" : "false");
    btnCabView.setAttribute("aria-label", state.cabView ? "Switch to Top-Down Track View" : "Switch to First-Person Cab View");
    btnCabView.innerHTML = state.cabView
      ? '<span class="cab-ico" aria-hidden="true">🗺️</span><span class="cab-txt">Track View</span>'
      : '<span class="cab-ico" aria-hidden="true">👀</span><span class="cab-txt">Cab View</span>';

    // Go / Stop button
    goStopBtn.classList.toggle("paused", !state.running);
    goStopBtn.setAttribute("aria-pressed", state.running ? "true" : "false");
    goStopBtn.setAttribute("aria-label", state.running ? "Pause Train" : "Go Train");
    pauseSvg.style.display = state.running ? "block" : "none";
    goSvg.style.display = state.running ? "none" : "block";

    // Reverse button
    reverseBtn.classList.toggle("reversed", state.dir === -1);
    reverseBtn.setAttribute("aria-pressed", state.dir === -1 ? "true" : "false");

    // Speed buttons
    speedBtns.forEach(function(btn){
      var on = btn.getAttribute("data-speed") === state.speed;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });

    // Car count indicator dots
    var dots = carDotsEl.querySelectorAll(".car-dot");
    for(var i = 0; i < dots.length; i++){
      dots[i].classList.toggle("on", i < state.carCount);
    }

    // Mute button
    muteBtn.classList.toggle("muted", state.muted);
    muteBtn.setAttribute("aria-pressed", state.muted ? "true" : "false");
    soundOnIcon.style.display = state.muted ? "none" : "block";
    soundOffIcon.style.display = state.muted ? "block" : "none";

    // Star counter
    starCountEl.textContent = String(state.stars);
  }

  function earnStar(x, y){
    state.stars++;
    starCountEl.textContent = String(state.stars);
    starPillEl.classList.remove("pop");
    void starPillEl.offsetWidth;
    starPillEl.classList.add("pop");
    setTimeout(function(){ starPillEl.classList.remove("pop"); }, 260);
    spawnSparkles(x, y, ["#ffd43b", "#fff3bf", "#ff922b", "#ff6b6b"], 14, "star");
  }

  function triggerWhistle(){
    state.whistles++;
    hootWaveTimer = 1.65;
    trainBounce = 1.0;
    whistleBtn.classList.add("tooting");
    setTimeout(function(){ whistleBtn.classList.remove("tooting"); }, 480);

    playWhistleSfx();

    if(state.cabView){
      ringCabBell(9.5);
      spawnCabSteam(true);
      var b = cab.hitZones.boiler;
      spawnMusicNotes(b ? b.stackX : W * 0.5, b ? b.stackY - 12 : H * 0.5);
    } else {
      var units = getTrainUnits();
      var eng = units[0];
      if(eng){
        var sx = eng.x + Math.cos(eng.angle) * 17 * play.scale;
        var sy = eng.y + Math.sin(eng.angle) * 17 * play.scale;
        spawnSteam(sx, sy, true);
        spawnMusicNotes(eng.x, eng.y - 16 * play.scale);
      }
    }
  }

  function switchLayout(nextLayout){
    if(state.layout === nextLayout){
      playMarimbaNote(659.25, 0, 0.11);
      return;
    }
    state.layout = nextLayout;
    plantedItems.length = 0;
    layoutFade = 1.0;
    buildTrack();
    trainS = track.totalLen * 0.15;
    if(state.cabView && nextLayout === "mountain"){
      cab.dist = 30.0;
    }
    syncHudUi();
    playMarimbaNote(523.25, 0, 0.13);
    playMarimbaNote(659.25, 0.06, 0.13);
    playMarimbaNote(783.99, 0.12, 0.13);
    spawnSparkles(play.cx, play.cy, ["#ffd43b", "#69db7c", "#74c0fc", "#ff8787"], 16, "star");
    if(nextLayout === "figure8" || nextLayout === "mountain"){
      playVoice("amazing");
    }
  }

  function toggleCabView(){
    state.cabView = !state.cabView;
    syncHudUi();
    if(state.cabView){
      ringCabBell(6.0);
      spawnCabSteam(true);
      playMarimbaNote(523.25, 0, 0.13);
      playMarimbaNote(659.25, 0.055, 0.13);
      playMarimbaNote(783.99, 0.11, 0.14);
      spawnSparkles(W * 0.5, H * 0.45, ["#ffd43b", "#7ee8ff", "#ffffff", "#69db7c"], 16, "star");
    } else {
      playMarimbaNote(783.99, 0, 0.12);
      playMarimbaNote(587.33, 0.06, 0.12);
      spawnSparkles(play.cx, play.cy, ["#ffd43b", "#69db7c", "#74c0fc"], 12, "star");
    }
  }

  /* Bind HUD & Console Events */
  trackPills.forEach(function(btn){
    btn.addEventListener("click", function(){
      ensureAudio();
      switchLayout(btn.getAttribute("data-layout"));
    });
  });

  btnCabView.addEventListener("click", function(){
    ensureAudio();
    toggleCabView();
  });

  goStopBtn.addEventListener("click", function(){
    ensureAudio();
    state.running = !state.running;
    trainBounce = 0.7;
    syncHudUi();
    playMarimbaNote(state.running ? 659.25 : 392.0, 0, 0.14);
  });

  reverseBtn.addEventListener("click", function(){
    ensureAudio();
    state.dir = state.dir === 1 ? -1 : 1;
    trainBounce = 0.8;
    syncHudUi();
    playMarimbaNote(587.33, 0, 0.12);
    playMarimbaNote(440.0, 0.07, 0.12);
  });

  speedBtns.forEach(function(btn){
    btn.addEventListener("click", function(){
      ensureAudio();
      var sp = btn.getAttribute("data-speed");
      state.speed = sp;
      if(!state.running) state.running = true;
      trainBounce = 0.8;
      syncHudUi();
      var freq = sp === "slow" ? 440 : (sp === "cruise" ? 587.33 : 880);
      playMarimbaNote(freq, 0, 0.14);
      if(sp === "turbo"){
        if(state.cabView){
          spawnCabSteam(true);
          ringCabBell(5.5);
        } else {
          var u0 = getTrainUnits()[0];
          if(u0) spawnSteam(u0.x, u0.y, true);
        }
      }
    });
  });

  addCarBtn.addEventListener("click", function(){
    ensureAudio();
    if(state.carCount < 4){
      state.carCount++;
    } else {
      state.carTheme = (state.carTheme + 1) % CAR_THEMES.length;
    }
    syncHudUi();
    playMagnetClack();
    if(state.cabView){
      trainBounce = 0.7;
      ringCabBell(4.5);
      spawnSparkles(W * 0.5, H * 0.66, ["#ffd43b", "#ff6b6b", "#38a3f1", "#51cf66"], 14, "star");
    } else {
      var units = getTrainUnits();
      var last = units[units.length - 1];
      if(last){
        spawnSparkles(last.x, last.y, ["#ffd43b", "#ff6b6b", "#38a3f1", "#51cf66"], 14, "star");
      }
    }
    if(state.carCount === 4){
      playVoice("super");
    } else if(state.carCount === 2){
      playVoice("great");
    }
  });

  whistleBtn.addEventListener("click", function(){
    ensureAudio();
    triggerWhistle();
  });

  muteBtn.addEventListener("click", function(){
    state.muted = !state.muted;
    if(state.muted && voiceEl){
      try{ voiceEl.pause(); }catch(e){}
    } else {
      ensureAudio();
      playMarimbaNote(659.25, 0, 0.11);
    }
    syncHudUi();
  });

  /* ==================== DIRECT CANVAS TAP-TO-INTERACT ==================== */
  canvas.addEventListener("pointerdown", function(e){
    ensureAudio();
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    var S = play.scale;

    // First-Person Cab View direct canvas interactions!
    if(state.cabView){
      // 1. Tap Golden Brass Bell -> ring & swing!
      var bell = cab.hitZones.bell;
      if(bell && Math.hypot(x - bell.x, y - bell.y) <= bell.r){
        ringCabBell(11);
        playCrossingBell(2);
        spawnSparkles(bell.x, bell.y, ["#ffd43b", "#fff3bf", "#ffffff"], 12, "star");
        return;
      }
      // 2. Tap Red Steam Boiler or Smokestack -> blow train whistle!
      var bl = cab.hitZones.boiler;
      if(bl){
        var bdx = (x - bl.x) / Math.max(40, bl.rx);
        var bdy = (y - bl.y) / Math.max(40, bl.ry);
        if(bdx * bdx + bdy * bdy <= 1.0){
          triggerWhistle();
          return;
        }
      }
      // 3. Tap passing roadside Cow, Red Barn, or Crossing Gate!
      for(var pi = cab.hitZones.props.length - 1; pi >= 0; pi--){
        var hp = cab.hitZones.props[pi];
        if(Math.hypot(x - hp.x, y - hp.y) <= hp.r){
          if(hp.kind === "cow"){
            cab.cowHop = 1.0;
            spawnSparkles(hp.x, hp.y, ["#fff", "#ffafcc", "#ffd43b"], 12, "star");
            spawnMusicNotes(hp.x, hp.y - 12);
            playVoice("moo");
          } else if(hp.kind === "barn"){
            cab.barnHop = 1.0;
            cab.cowHop = 0.85;
            spawnSparkles(hp.x, hp.y, ["#ffd43b", "#ff6b6b", "#fff"], 12, "star");
            playVoice("moo");
          } else if(hp.kind === "crossing"){
            playCrossingBell(2);
            spawnSparkles(hp.x, hp.y, ["#ff6b6b", "#ffd43b", "#fff"], 12, "star");
          }
          return;
        }
      }
      // 4. Tap anywhere in alpine sky or meadow -> joyful star sparkle & marimba note!
      if(y < H * 0.44){
        earnStar(x, y);
        playStationCheerSfx();
      } else {
        spawnSparkles(x, y, ["#ffd43b", "#7ee8ff", "#69db7c", "#fff"], 10, "star");
        playMarimbaNote(PENTA[(pentaIdx++) % PENTA.length], 0, 0.13);
      }
      return;
    }

    // 1. Check Train Engine & Cars tap
    var units = getTrainUnits();
    for(var i = 0; i < units.length; i++){
      var u = units[i];
      if(u.inTunnel) continue;
      if(Math.hypot(x - u.x, y - u.y) < 34 * S){
        if(u.index === 0){
          // Tap Engineer Hoot!
          hootWaveTimer = 1.5;
          trainBounce = 1.0;
          spawnSteam(u.x, u.y, true);
          spawnSparkles(u.x, u.y, ["#ffd43b", "#fff"], 10, "star");
          if(typeof window.__hootTickleBelly === "function" && !state.muted){
            if(!window.__hootTickleBelly()) playWhistleSfx();
          } else {
            playWhistleSfx();
          }
        } else if(u.index === 2){
          // Animal Caboose!
          trainBounce = 0.8;
          spawnSparkles(u.x, u.y, ["#ffd43b", "#74c0fc", "#fff"], 10, "star");
          playVoice(Math.random() < 0.5 ? "moo" : "quack");
        } else {
          trainBounce = 0.7;
          spawnSparkles(u.x, u.y, ["#ffd43b", "#ff6b6b", "#51cf66"], 10, "star");
          playMagnetClack();
        }
        return;
      }
    }

    // 2. Tap Cow!
    if(Math.hypot(x - track.cowPt.x, y - track.cowPt.y) < 42 * S){
      cowBounce = 1.0;
      spawnSparkles(track.cowPt.x, track.cowPt.y - 12 * S, ["#fff", "#ffafcc", "#ffd43b"], 10, "star");
      spawnMusicNotes(track.cowPt.x, track.cowPt.y - 14 * S);
      playVoice("moo");
      return;
    }

    // 3. Tap Barn (also bounces Cow + moo!)
    if(Math.hypot(x - track.barnPt.x, y - track.barnPt.y) < 44 * S){
      barnBounce = 1.0;
      cowBounce = 0.9;
      spawnSparkles(track.barnPt.x, track.barnPt.y - 10 * S, ["#ffd43b", "#ff6b6b", "#fff"], 10, "star");
      playVoice("moo");
      return;
    }

    // 4. Tap Duck Pond!
    var pdx = (x - track.pondPt.x) / (track.pondPt.rx + 18 * S);
    var pdy = (y - track.pondPt.y) / (track.pondPt.ry + 18 * S);
    if(pdx * pdx + pdy * pdy <= 1.0){
      duckSplash = 1.0;
      spawnWaterSplash(x, y);
      playSplashSfx();
      playVoice("quack");
      return;
    }

    // 5. Tap Train Station -> cheering passengers + earns a star!
    if(Math.hypot(x - track.stationPt.x, y - track.stationPt.y) < 56 * S){
      stationCheer = 1.0;
      earnStar(track.stationPt.x, track.stationPt.y - 18 * S);
      playStationCheerSfx();
      playVoice(state.stars % 2 === 1 ? "star" : "yay");
      return;
    }

    // 6. Tap Crossing Gate -> ding-ding bell!
    if(Math.hypot(x - track.crossingPt.x, y - track.crossingPt.y) < 52 * S){
      gateManualTimer = 2.6;
      playCrossingBell(2);
      spawnSparkles(track.crossingPt.x, track.crossingPt.y - 18 * S, ["#ff6b6b", "#ffd43b", "#fff"], 10, "star");
      return;
    }

    // 7. Tap Pine Trees -> playful wiggle!
    for(var ti = 0; ti < track.trees.length; ti++){
      var tr = track.trees[ti];
      if(Math.hypot(x - tr.x, y - tr.y) < 34 * S){
        tr.wiggle = 1.0;
        spawnSparkles(tr.x, tr.y - 12 * S, ["#69db7c", "#ffd43b", "#b2f2bb"], 8, "star");
        playMarimbaNote(PENTA[(pentaIdx++) % PENTA.length], 0, 0.13);
        return;
      }
    }

    // 8. Tap anywhere on the meadow -> plant blooming flower or baby pine tree!
    var flowerCols = ["#ff6b6b", "#ffd43b", "#f783ac", "#74c0fc", "#b197fc", "#ffffff"];
    var isPine = Math.random() < 0.28;
    plantedItems.push({
      x: x,
      y: y,
      kind: isPine ? "pine" : "flower",
      color: flowerCols[Math.floor(Math.random() * flowerCols.length)],
      rot: Math.random() * Math.PI * 2,
      age: 0
    });
    if(plantedItems.length > 38) plantedItems.shift();
    spawnSparkles(x, y, isPine ? ["#69db7c", "#b2f2bb"] : ["#ffd43b", "#fff", "#ffafcc"], 6, "star");
    playMarimbaNote(PENTA[(pentaIdx++) % PENTA.length], 0, 0.12);
  });

  /* ==================== MAIN 60FPS PHYSICS & RENDER LOOP ==================== */
  var lastTime = performance.now();
  var steamAcc = 0;

  function step(now){
    var dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
    lastTime = now;
    var t = now / 1000;

    // 1. Move Train along uniform arc-length spline
    var engineSample = sampleTrack(trainS);
    if(state.running){
      var v = SPEED_PX[state.speed] * play.scale;
      trainS = ((trainS + state.dir * v * dt) % track.totalLen + track.totalLen) % track.totalLen;
      wheelPhase += dt * v * 0.12;

      // Rhythmic chugga-chugga Web Audio
      chugAcc += dt * CHUG_HZ[state.speed];
      if(chugAcc >= 1){
        chugAcc -= 1;
        chugBeat = (chugBeat + 1) % 4;
        var inMuffledTunnel = state.cabView ? (cab.tunnelAmt > 0.35) : engineSample.inTunnel;
        playChugStep(chugBeat === 0, inMuffledTunnel);
      }

      // Gentle rhythmic smokestack steam puffs (top-down view)
      steamAcc += dt * (state.speed === "turbo" ? 6.5 : (state.speed === "slow" ? 2.2 : 3.8));
      if(steamAcc >= 1 && !engineSample.inTunnel && !state.cabView){
        steamAcc -= 1;
        var ang = state.dir === 1 ? engineSample.angle : engineSample.angle + Math.PI;
        spawnSteam(
          engineSample.x + Math.cos(ang) * 17 * play.scale,
          engineSample.y + Math.sin(ang) * 17 * play.scale,
          false
        );
      }
    }

    // Update First-Person Cab View world physics continuously so toggle is instant & seamless!
    updateCabPhysics(dt, engineSample);

    // 2. Automatic Crossing Gate proximity detection
    var nearCrossing = false;
    var units = getTrainUnits();
    var proxDist = 118 * play.scale;
    for(var i = 0; i < units.length; i++){
      var uS = trainS - state.dir * (i * 54 * play.scale);
      if(arcDist(uS, track.crossingS) < proxDist){
        nearCrossing = true;
        break;
      }
    }
    if(gateManualTimer > 0) gateManualTimer = Math.max(0, gateManualTimer - dt);
    var wantGateClosed = nearCrossing || gateManualTimer > 0;
    if(wantGateClosed && !gateWasClosed && audioUnlocked){
      playCrossingBell(1);
    }
    gateWasClosed = wantGateClosed;
    var targetGate = wantGateClosed ? 1 : 0;
    gateAngle += (targetGate - gateAngle) * Math.min(1, dt * 7.5);
    if(gateAngle > 0.15) gateFlashPhase += dt * 11;

    // 3. Auto-wave station passengers when train glides past
    if(arcDist(trainS, track.stationPt.s) < 95 * play.scale && state.running){
      stationAutoWave = Math.min(1, stationAutoWave + dt * 4);
    } else {
      stationAutoWave = Math.max(0, stationAutoWave - dt * 2.5);
    }

    // 4. Decay toy animations
    duckAngle += dt * (duckSplash > 0 ? 2.8 : 0.72);
    if(hootWaveTimer > 0) hootWaveTimer = Math.max(0, hootWaveTimer - dt);
    if(trainBounce > 0) trainBounce = Math.max(0, trainBounce - dt * 3.2);
    if(cowBounce > 0) cowBounce = Math.max(0, cowBounce - dt * 2.6);
    if(barnBounce > 0) barnBounce = Math.max(0, barnBounce - dt * 2.8);
    if(duckSplash > 0) duckSplash = Math.max(0, duckSplash - dt * 1.9);
    if(stationCheer > 0) stationCheer = Math.max(0, stationCheer - dt * 1.1);
    if(layoutFade > 0) layoutFade = Math.max(0, layoutFade - dt * 3.2);

    track.trees.forEach(function(tr){
      if(tr.wiggle > 0) tr.wiggle = Math.max(0, tr.wiggle - dt * 1.8);
    });
    plantedItems.forEach(function(it){
      if(it.age < 1) it.age += dt;
    });

    // Update steam puffs
    for(var i = steamPuffs.length - 1; i >= 0; i--){
      var sp = steamPuffs[i];
      sp.life += dt;
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      sp.vx *= 0.96;
      if(sp.life >= sp.maxLife) steamPuffs.splice(i, 1);
    }
    // Update particles
    for(var i = particles.length - 1; i >= 0; i--){
      var pt = particles[i];
      pt.life += dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      if(pt.kind === "drop") pt.vy += 260 * dt;
      else if(pt.kind === "star") pt.vy += 90 * dt;
      pt.rot += pt.vrot * dt;
      if(pt.life >= pt.maxLife) particles.splice(i, 1);
    }

    // ==================== RENDER FRAME ====================
    ctx.save();
    ctx.scale(DPR, DPR);

    if(state.cabView){
      drawCabView(t, engineSample);
    } else {
      drawMeadowBg(t);
      drawPlantedItems();
      drawDuckPond(t);
      drawCrossingRoad();

      // Lower track pass (all of meadow/mountain, lower underpass of figure-8)
      drawTrackPass(0);

      // Lower-layer train units
      drawTrainPass(units, 0, t);

      // Upper bridge track + upper train units (Figure-8 overpass!)
      if(state.layout === "figure8"){
        drawTrackPass(1);
        drawTrainPass(units, 1, t);
      }

      // Mountain Tunnel Hill drawn OVER the tunnel section of track
      if(state.layout === "mountain"){
        drawMountainTunnelHill();
      }

      // Foreground Scenery Toys
      drawBarnAndCow();
      drawTrainStation(t);
      drawCrossingGate(t);
      track.trees.forEach(function(tr){
        drawPineTree(tr.x, tr.y, tr.sz, tr.wiggle);
      });

      drawSteamAndParticles();
    }
    ctx.restore();

    requestAnimationFrame(step);
  }

  /* ==================== INIT & PUBLIC SNAPSHOT API ==================== */
  function handleResize(){
    measurePlayfield();
    buildTrack();
  }

  window.addEventListener("resize", handleResize);
  window.addEventListener("orientationchange", function(){ setTimeout(handleResize, 80); });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden && voiceEl){ try{ voiceEl.pause(); }catch(e){} }
  });

  // Expose exact QA snapshot API
  window.__trainGame = {
    snapshot: function(){
      return {
        layout: state.layout,
        running: state.running,
        speed: state.speed,
        dir: state.dir,
        carCount: state.carCount,
        stars: state.stars,
        whistles: state.whistles,
        cabView: state.cabView
      };
    }
  };

  syncHudUi();
  handleResize();
  requestAnimationFrame(function(){
    handleResize();
    requestAnimationFrame(step);
  });
})();
</script>
