  /* ==================== POINTER DRAG-TO-BUILD & TAP-TO-PLAY ==================== */
  var draggingBuild = false;
  var lastPaintedCell = null;

  function stepOrthogonalPaint(fromC, toC){
    var cur = fromC;
    var guard = 12;
    while(cur && (cur.col !== toC.col || cur.row !== toC.row) && guard-- > 0){
      var dc = toC.col - cur.col;
      var dr = toC.row - cur.row;
      var nextCol = cur.col;
      var nextRow = cur.row;
      if(Math.abs(dc) >= Math.abs(dr) && dc !== 0){
        nextCol += dc > 0 ? 1 : -1;
      } else if(dr !== 0){
        nextRow += dr > 0 ? 1 : -1;
      }
      var nextCell = getCell(nextCol, nextRow);
      if(!nextCell) break;
      applyToolAtCell(nextCell.col, nextCell.row, state.tool, cur);
      cur = nextCell;
    }
    return cur;
  }

  canvas.addEventListener("pointerdown", function(e){
    ensureAudio();
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    var S = play.scale;

    // BUILD MODE: Tap or Drag to build auto-connecting wooden tracks & place features/props!
    if(state.appMode === "build"){
      var hit = hitTestGrid(x, y);
      if(!hit) return;
      hoverCell = hit;
      var cell = getCell(hit.col, hit.row);
      applyToolAtCell(hit.col, hit.row, state.tool, null);
      if(state.tool === "track" || state.tool === "erase"){
        draggingBuild = true;
        lastPaintedCell = cell;
        try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      }
      return;
    }

    // DRIVE MODE — FIRST-PERSON CAB VIEW INTERACTIONS
    if(state.cabView){
      var bell = cab.hitZones.bell;
      if(bell && Math.hypot(x - bell.x, y - bell.y) <= bell.r){
        ringCabBell(11);
        playCrossingBell(2);
        spawnSparkles(bell.x, bell.y, ["#ffd43b", "#fff3bf", "#ffffff"], 12, "star");
        return;
      }
      var bl = cab.hitZones.boiler;
      if(bl){
        var bdx = (x - bl.x) / Math.max(40, bl.rx);
        var bdy = (y - bl.y) / Math.max(40, bl.ry);
        if(bdx * bdx + bdy * bdy <= 1.0){
          triggerWhistle(false);
          return;
        }
      }
      for(var pi = cab.hitZones.props.length - 1; pi >= 0; pi--){
        var hp = cab.hitZones.props[pi];
        if(Math.hypot(x - hp.x, y - hp.y) <= hp.r){
          if(hp.kind === "cow" || hp.kind === "barn"){
            cab.cowHop = 1.0; cab.barnHop = 1.0;
            spawnSparkles(hp.x, hp.y, ["#fff", "#ffafcc", "#ffd43b"], 12, "star");
            playVoice("moo");
          } else if(hp.kind === "pond"){
            spawnWaterSplash(hp.x, hp.y);
            playSplashSfx(); playVoice("quack");
          } else if(hp.kind === "station"){
            earnStar(hp.x, hp.y);
            playStationCheerSfx(); playVoice("star");
          } else if(hp.kind === "crossing"){
            playCrossingBell(2);
            spawnSparkles(hp.x, hp.y, ["#ff6b6b", "#ffd43b", "#fff"], 12, "star");
          }
          return;
        }
      }
      if(y < H * 0.44){
        earnStar(x, y);
        playStationCheerSfx();
      } else {
        spawnSparkles(x, y, ["#ffd43b", "#7ee8ff", "#69db7c", "#fff"], 10, "star");
        playMarimbaNote(PENTA[(pentaIdx++) % PENTA.length], 0, 0.13);
      }
      return;
    }

    // DRIVE MODE — TOP-DOWN CUSTOM TRACK INTERACTIONS
    var units = getTrainUnits();
    for(var i = 0; i < units.length; i++){
      var u = units[i];
      if(u.inTunnel) continue;
      if(Math.hypot(x - u.x, y - u.y) < 34 * S){
        if(u.index === 0){
          hootWaveTimer = 1.5; trainBounce = 1.0;
          spawnSteam(u.x, u.y, true);
          spawnSparkles(u.x, u.y, ["#ffd43b", "#fff"], 10, "star");
          if(typeof window.__hootTickleBelly === "function" && !state.muted){
            if(!window.__hootTickleBelly()) playWhistleSfx(false);
          } else {
            playWhistleSfx(false);
          }
        } else if(u.index === 2){
          trainBounce = 0.8;
          spawnSparkles(u.x, u.y, ["#ffd43b", "#74c0fc", "#fff"], 10, "star");
          playVoice(Math.random() < 0.5 ? "moo" : "quack");
        } else {
          trainBounce = 0.7;
          spawnSparkles(u.x, u.y, ["#ffd43b", "#ff6b6b", "#51cf66"], 10, "star");
          playMagnetClack();
        }
        return;
      }
    }

    // Check tapped grid cell props & crossing gates!
    var hitCell = hitTestGrid(x, y);
    if(hitCell){
      var gc = getCell(hitCell.col, hitCell.row);
      var ctr = cellCenter(hitCell.col, hitCell.row);
      if(gc && gc.hasTrack && gc.feature === "crossing"){
        gc.gateManual = 2.6;
        playCrossingBell(2);
        spawnSparkles(ctr.x, ctr.y - 16 * S, ["#ff6b6b", "#ffd43b", "#fff"], 10, "star");
        return;
      }
      if(gc && gc.prop){
        gc.bounce = 1.0;
        if(gc.prop === "cow"){
          spawnSparkles(ctr.x, ctr.y - 10 * S, ["#fff", "#ffafcc", "#ffd43b"], 10, "star");
          spawnMusicNotes(ctr.x, ctr.y - 14 * S);
          playVoice("moo");
        } else if(gc.prop === "pond"){
          spawnWaterSplash(ctr.x, ctr.y);
          playSplashSfx();
          playVoice("quack");
        } else if(gc.prop === "station"){
          earnStar(ctr.x, ctr.y - 16 * S);
          playStationCheerSfx();
          playVoice(state.stars % 2 === 1 ? "star" : "yay");
        } else if(gc.prop === "pine"){
          spawnSparkles(ctr.x, ctr.y - 12 * S, ["#69db7c", "#ffd43b", "#b2f2bb"], 8, "star");
          playMarimbaNote(PENTA[(pentaIdx++) % PENTA.length], 0, 0.13);
        }
        return;
      }
    }

    // Tap open grass in Drive Mode -> plant blooming meadow flower or baby pine!
    var flowerCols = ["#ff6b6b", "#ffd43b", "#f783ac", "#74c0fc", "#b197fc", "#ffffff"];
    var isPine = Math.random() < 0.28;
    plantedItems.push({
      x: x, y: y,
      kind: isPine ? "pine" : "flower",
      color: flowerCols[Math.floor(Math.random() * flowerCols.length)],
      rot: Math.random() * Math.PI * 2,
      age: 0
    });
    if(plantedItems.length > 36) plantedItems.shift();
    spawnSparkles(x, y, isPine ? ["#69db7c", "#b2f2bb"] : ["#ffd43b", "#fff", "#ffafcc"], 6, "star");
    playMarimbaNote(PENTA[(pentaIdx++) % PENTA.length], 0, 0.12);
  });

  canvas.addEventListener("pointermove", function(e){
    if(state.appMode !== "build") return;
    var rect = canvas.getBoundingClientRect();
    var hit = hitTestGrid(e.clientX - rect.left, e.clientY - rect.top);
    hoverCell = hit;
    if(!draggingBuild || !hit) return;
    var target = getCell(hit.col, hit.row);
    if(!target || target === lastPaintedCell) return;
    if(state.tool === "track" && lastPaintedCell){
      lastPaintedCell = stepOrthogonalPaint(lastPaintedCell, target);
    } else {
      applyToolAtCell(target.col, target.row, state.tool, lastPaintedCell);
      lastPaintedCell = target;
    }
  });

  function stopBuildDrag(){
    draggingBuild = false;
    lastPaintedCell = null;
  }
  canvas.addEventListener("pointerup", stopBuildDrag);
  canvas.addEventListener("pointercancel", stopBuildDrag);
  canvas.addEventListener("pointerleave", function(){ hoverCell = null; stopBuildDrag(); });

  /* ==================== MAIN 60FPS PHYSICS & RENDER LOOP ==================== */
  var lastTime = performance.now();
  var steamAcc = 0;

  function step(now){
    var dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
    lastTime = now;
    var t = now / 1000;

    var hasDriveTrack = track.pts.length >= 2;
    var engineSample = sampleTrack(trainS);

    // 1. Move Train along custom spline (works on BOTH closed loops AND open bumper tracks!)
    if(state.appMode === "drive" && state.running && hasDriveTrack){
      var v = SPEED_PX[state.speed] * play.scale;
      var nextS = trainS + state.dir * v * dt;

      if(track.isLoop){
        trainS = ((nextS % track.totalLen) + track.totalLen) % track.totalLen;
      } else {
        var endMargin = Math.min(24 * play.scale, track.totalLen * 0.12);
        var trainLen = getTrainLengthPx();
        var minEngineS = Math.min(track.totalLen * 0.45, endMargin + trainLen);
        var maxEngineS = Math.max(minEngineS + 10, track.totalLen - endMargin);
        if(nextS >= maxEngineS && state.dir === 1){
          trainS = maxEngineS;
          state.dir = -1;
          syncHudUi();
          triggerWhistle(true);
        } else if(nextS <= minEngineS && state.dir === -1){
          trainS = minEngineS;
          state.dir = 1;
          syncHudUi();
          triggerWhistle(true);
        } else {
          trainS = nextS;
        }
      }

      wheelPhase += dt * v * 0.12;
      engineSample = sampleTrack(trainS);

      // Rhythmic chugga-chugga Web Audio
      chugAcc += dt * CHUG_HZ[state.speed];
      if(chugAcc >= 1){
        chugAcc -= 1;
        chugBeat = (chugBeat + 1) % 4;
        var inMuffledTunnel = state.cabView ? (cab.tunnelAmt > 0.35) : engineSample.inTunnel;
        playChugStep(chugBeat === 0, inMuffledTunnel, engineSample.onBridge);
      }

      // Smokestack steam puffs
      steamAcc += dt * (state.speed === "turbo" ? 6.5 : (state.speed === "slow" ? 2.2 : 3.8));
      if(steamAcc >= 1 && !engineSample.inTunnel && !state.cabView){
        steamAcc -= 1;
        spawnSteam(
          engineSample.x + Math.cos(engineSample.angle) * 17 * play.scale,
          engineSample.y + Math.sin(engineSample.angle) * 17 * play.scale,
          false
        );
      }
    } else if(state.appMode === "build" && hasDriveTrack){
      // Gentle idle steam puff in Build Mode so Hoot's parked locomotive looks alive!
      steamAcc += dt * 0.85;
      if(steamAcc >= 1 && !engineSample.inTunnel){
        steamAcc -= 1;
        spawnSteam(
          engineSample.x + Math.cos(engineSample.angle) * 17 * play.scale,
          engineSample.y + Math.sin(engineSample.angle) * 17 * play.scale,
          false
        );
      }
    }

    updateCabPhysics(dt, engineSample);

    // 2. Per-cell Crossing Gate proximity & Station auto-cheer & Spring Pop animations
    var units = getTrainUnits();
    var proxDist = grid.cellSize * 1.1;
    for(var r = 0; r < grid.rows; r++){
      for(var c = 0; c < grid.cols; c++){
        var cell = grid.cells[r][c];
        if(cell.anim < 1) cell.anim = Math.min(1, cell.anim + dt * 4.5);
        if(cell.bounce > 0) cell.bounce = Math.max(0, cell.bounce - dt * 2.4);
        if(cell.gateManual > 0) cell.gateManual = Math.max(0, cell.gateManual - dt);

        if(cell.hasTrack && cell.feature === "crossing"){
          var ctr = cellCenter(c, r);
          var near = false;
          if(state.appMode === "drive"){
            for(var ui = 0; ui < units.length; ui++){
              if(Math.hypot(units[ui].x - ctr.x, units[ui].y - ctr.y) < proxDist){
                near = true; break;
              }
            }
          }
          var wantClosed = near || cell.gateManual > 0;
          if(wantClosed && !cell.gateWasClosed && audioUnlocked && state.appMode === "drive"){
            playCrossingBell(1);
          }
          cell.gateWasClosed = wantClosed;
          var targetG = wantClosed ? 1 : 0;
          cell.gateAngle += (targetG - cell.gateAngle) * Math.min(1, dt * 7.5);
        }

        if(cell.prop === "station"){
          var sCtr = cellCenter(c, r);
          var eng = units[0];
          var close = state.appMode === "drive" && state.running && eng && Math.hypot(eng.x - sCtr.x, eng.y - sCtr.y) < grid.cellSize * 1.35;
          cell.cheer = close ? Math.min(1, cell.cheer + dt * 4) : Math.max(0, cell.cheer - dt * 2.5);
        }
      }
    }

    // 3. Decay actor animations & particles
    duckAngle += dt * 0.82;
    if(hootWaveTimer > 0) hootWaveTimer = Math.max(0, hootWaveTimer - dt);
    if(trainBounce > 0) trainBounce = Math.max(0, trainBounce - dt * 3.2);
    plantedItems.forEach(function(it){ if(it.age < 1) it.age += dt; });

    for(var i = steamPuffs.length - 1; i >= 0; i--){
      var sp = steamPuffs[i];
      sp.life += dt;
      sp.x += sp.vx * dt; sp.y += sp.vy * dt;
      sp.vx *= 0.96;
      if(sp.life >= sp.maxLife) steamPuffs.splice(i, 1);
    }
    for(var i = particles.length - 1; i >= 0; i--){
      var pt = particles[i];
      pt.life += dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      if(pt.kind === "drop") pt.vy += 260 * dt;
      else if(pt.kind === "star") pt.vy += 90 * dt;
      pt.rot += pt.vrot * dt;
      if(pt.life >= pt.maxLife) particles.splice(i, 1);
    }

    // ==================== RENDER FRAME ====================
    ctx.save();
    ctx.scale(DPR, DPR);

    if(state.appMode === "drive" && state.cabView){
      drawCabView(t, engineSample);
    } else {
      drawMeadowBg(t);
      if(state.appMode === "build"){
        drawBuilderGridGuides(t);
      }
      drawPlantedItems();
      drawAllWoodenTracks(t);

      // Draw Train Consist on kid's custom track!
      if(units.length > 0){
        drawTrainUnits(units, t);
      }

      // Draw Over-Track Features (Mountain Tunnels + Crossing Gates) & Grid Props
      for(var r = 0; r < grid.rows; r++){
        for(var c = 0; c < grid.cols; c++){
          var cell = grid.cells[r][c];
          if(cell.hasTrack && cell.feature === "tunnel") drawTunnelOverCell(cell);
          if(cell.hasTrack && cell.feature === "crossing") drawCrossingGateOverCell(cell, t);
          if(!cell.hasTrack && cell.prop) drawGridProp(cell, t);
        }
      }

      drawSteamAndParticles();
    }

    ctx.restore();
    requestAnimationFrame(step);
  }

  /* ==================== INIT & PUBLIC QA SNAPSHOT API ==================== */
  var booted = false;

  function handleResize(){
    measurePlayfield();
    if(!booted){
      booted = true;
      loadBootStarterTrack();
    } else {
      rebuildTrackSpline(false);
    }
  }

  window.addEventListener("resize", handleResize);
  window.addEventListener("orientationchange", function(){ setTimeout(handleResize, 80); });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden && voiceEl){ try{ voiceEl.pause(); }catch(e){} }
  });

  function getSnapshot(){
    return {
      appMode: state.appMode,
      tool: state.tool,
      tileCount: countTrackTiles(),
      isLoop: track.isLoop,
      cabView: state.cabView,
      running: state.running,
      speed: state.speed,
      dir: state.dir,
      carCount: state.carCount,
      stars: state.stars,
      whistles: state.whistles,
      gridCols: grid.cols,
      gridRows: grid.rows,
      cellSize: grid.cellSize,
      trackLen: Math.round(track.totalLen),
      trainS: Math.round(trainS),
      engineX: Math.round(lastEnginePos.x),
      engineY: Math.round(lastEnginePos.y)
    };
  }

  window.__trainGame = {
    snapshot: getSnapshot,
    paintCellForTest: function(col, row, optionalTool){
      applyToolAtCell(col, row, optionalTool || state.tool, null);
      return getSnapshot();
    }
  };

  syncHudUi();
  handleResize();
  requestAnimationFrame(function(){
    measurePlayfield();
    rebuildTrackSpline(false);
    requestAnimationFrame(step);
  });
})();
</script>
