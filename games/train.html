<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="train";window.__HOOT_SELF_COACH__=true;</script>
<script src="js/hoot-game-head.js?v=llprev3e150"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Hoot's Wooden Train Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#2c1d11;
    --wood-light:#f6d6a2;
    --wood-mid:#dfa663;
    --wood-deep:#a96c34;
    --wood-dark:#6b3e18;
    --cream:#fffaf0;
    --red:#e8483c;
    --red-dark:#b3281e;
    --green:#42b859;
    --green-dark:#26843a;
    --sky:#36a6f0;
    --sky-dark:#1a72b5;
    --brass-top:#fff09a;
    --brass-mid:#f5b727;
    --brass-deep:#b8760b;
    --sun:#ffd43b;
  }
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
  }
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    background:#84cf5c;
    color:var(--ink);
    touch-action:manipulation;
  }

  #stage{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:linear-gradient(180deg,#9de070 0%,#7ec954 55%,#6ab745 100%);
  }

  #worldCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:1;
    cursor:pointer;
    touch-action:none;
  }

  /* ==================== TOP WOODEN HUD BAR ==================== */
  #hud{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));
    pointer-events:none;
  }

  .hud-group{
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:auto;
    min-width:0;
  }

  /* Primary Mode Toggle Buttons: Build Track vs Drive Train */
  .mode-btn{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 16px;
    border-radius:22px;
    border:4px solid var(--wood-dark);
    background:linear-gradient(180deg,#fff7e4 0%,#f0d29c 100%);
    color:var(--ink);
    font-family:inherit;
    font-weight:700;
    font-size:18px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    box-shadow:0 5px 0 var(--wood-dark), 0 8px 16px rgba(44,29,17,.22), inset 0 2px 0 rgba(255,255,255,.72);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .18s, box-shadow .14s;
    flex:0 0 auto;
    white-space:nowrap;
  }
  .mode-btn:active{
    transform:translateY(3px) scale(.95);
    box-shadow:0 2px 0 var(--wood-dark);
  }
  .mode-btn.active{
    background:linear-gradient(180deg,#ffe670 0%,#f5ae1e 100%);
    border-color:#5a2e08;
    box-shadow:0 0 0 3.5px #fff, 0 5px 0 #5a2e08, 0 10px 20px rgba(44,29,17,.28);
    transform:translateY(-2px);
  }
  #btnModeDrive.active{
    background:linear-gradient(180deg,#7ae582 0%,#35b84d 100%);
    border-color:#1c5e2a;
    color:#ffffff;
    text-shadow:0 2px 0 rgba(20,76,32,.55);
    box-shadow:0 0 0 3.5px #fff, 0 5px 0 #1c5e2a, 0 10px 20px rgba(24,88,38,.32);
  }
  .mode-ico{
    font-size:23px;
    line-height:1;
  }
  .mode-txt{
    line-height:1;
  }

  /* Build Mode Starter Preset Pills */
  #presetBar{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .preset-pill{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 13px;
    border-radius:20px;
    border:3.5px solid var(--wood-dark);
    background:linear-gradient(180deg,#fffaf0 0%,#f2d8a8 100%);
    color:var(--ink);
    font-family:inherit;
    font-weight:700;
    font-size:16px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    box-shadow:0 4px 0 var(--wood-dark), 0 6px 12px rgba(44,29,17,.18), inset 0 2px 0 rgba(255,255,255,.75);
    transition:transform .13s cubic-bezier(.34,1.6,.5,1), background .15s;
    flex:0 0 auto;
    white-space:nowrap;
  }
  .preset-pill:active{
    transform:translateY(3px) scale(.95);
    box-shadow:0 1px 0 var(--wood-dark);
  }
  .preset-pill .p-ico{
    font-size:20px;
    line-height:1;
  }

  #starPill{
    min-height:64px;
    height:64px;
    padding:0 14px;
    border-radius:22px;
    border:4px solid var(--wood-dark);
    background:linear-gradient(180deg,#fffdf5 0%,#fae4b0 100%);
    box-shadow:0 5px 0 var(--wood-dark), 0 8px 14px rgba(44,29,17,.2);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    flex:0 0 auto;
    transition:transform .22s cubic-bezier(.34,1.8,.5,1);
  }
  #starPill.pop{
    transform:scale(1.18);
  }
  #starPill svg{
    width:28px;
    height:28px;
    display:block;
    filter:drop-shadow(0 2px 2px rgba(184,118,11,.35));
  }

  .hud-icon-btn{
    width:64px;
    height:64px;
    min-width:64px;
    min-height:64px;
    padding:0;
    border-radius:22px;
    border:4px solid var(--wood-dark);
    background:linear-gradient(180deg,#fff7e4 0%,#f0d29c 100%);
    color:var(--ink);
    display:grid;
    place-items:center;
    cursor:pointer;
    box-shadow:0 5px 0 var(--wood-dark), 0 8px 16px rgba(44,29,17,.22), inset 0 2px 0 rgba(255,255,255,.7);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1);
    flex:0 0 auto;
  }
  .hud-icon-btn:active{
    transform:translateY(3px) scale(.94);
    box-shadow:0 2px 0 var(--wood-dark);
  }
  .hud-icon-btn.muted{
    background:linear-gradient(180deg,#fde2e2 0%,#f5b2b2 100%);
  }
  .hud-icon-btn svg{
    width:34px;
    height:34px;
    display:block;
  }

  /* ==================== FIRST-PERSON CAB VIEW TOGGLE ==================== */
  #btnCabView{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 18px;
    border-radius:22px;
    border:4px solid #164e63;
    background:linear-gradient(180deg,#7ee8ff 0%,#22b8f0 56%,#0d8fd6 100%);
    color:#ffffff;
    text-shadow:0 2px 0 rgba(14,56,82,.55);
    font-family:inherit;
    font-weight:700;
    font-size:19px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    box-shadow:0 5px 0 #164e63, 0 8px 18px rgba(14,78,99,.32), inset 0 2.5px 0 rgba(255,255,255,.65);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .18s, box-shadow .14s;
    flex:0 0 auto;
    white-space:nowrap;
  }
  #btnCabView:active{
    transform:translateY(3px) scale(.95);
    box-shadow:0 2px 0 #164e63, 0 4px 8px rgba(14,78,99,.22);
  }
  #btnCabView.active{
    border-color:#5a2e08;
    background:linear-gradient(180deg,#ffe878 0%,#f5b222 58%,#de8a0c 100%);
    color:#2c1d11;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
    box-shadow:0 0 0 3.5px #fff, 0 5px 0 #5a2e08, 0 10px 22px rgba(44,29,17,.32);
    transform:translateY(-2px);
  }
  #btnCabView .cab-ico{
    font-size:24px;
    line-height:1;
    display:inline-flex;
    align-items:center;
  }
  #btnCabView .cab-txt{
    line-height:1;
    white-space:nowrap;
  }

  /* ==================== BOTTOM TACTILE WOODEN CONSOLES ==================== */
  #consoleWrap{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:10;
    display:flex;
    justify-content:center;
    padding:0 max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
    pointer-events:none;
  }

  .wood-console{
    pointer-events:auto;
    max-width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:nowrap;
    gap:8px;
    padding:10px 14px;
    border-radius:30px;
    border:4px solid var(--wood-dark);
    background:
      repeating-linear-gradient(90deg, rgba(169,108,52,.11) 0 38px, rgba(255,255,255,.04) 38px 76px),
      linear-gradient(180deg,#f0c583 0%,#d89d56 58%,#c5853d 100%);
    box-shadow:
      0 7px 0 var(--wood-dark),
      0 14px 28px rgba(34,20,8,.34),
      inset 0 3px 0 rgba(255,244,218,.7);
  }

  .console-row, .build-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
  }

  .wood-divider{
    width:4px;
    height:48px;
    border-radius:4px;
    background:rgba(107,62,24,.32);
    box-shadow:1px 0 0 rgba(255,245,220,.45);
    flex:none;
  }

  /* Builder Palette Tool Buttons (>=64px) */
  .tool-btn{
    min-width:72px;
    min-height:66px;
    height:66px;
    padding:4px 8px;
    border-radius:20px;
    border:3.5px solid var(--wood-dark);
    background:linear-gradient(180deg,#fffaf0 0%,#f2dab0 100%);
    color:var(--ink);
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    cursor:pointer;
    box-shadow:0 4px 0 var(--wood-dark), inset 0 2px 0 rgba(255,255,255,.78);
    transition:transform .13s cubic-bezier(.34,1.6,.5,1), background .15s, box-shadow .13s;
    flex:0 0 auto;
    line-height:1;
  }
  .tool-btn:active{
    transform:translateY(3px) scale(.94);
    box-shadow:0 1px 0 var(--wood-dark);
  }
  .tool-btn.active{
    background:linear-gradient(180deg,#ffe66b 0%,#f5ad1d 100%);
    border-color:#5a2e08;
    box-shadow:0 0 0 3.5px #fff, 0 4px 0 #5a2e08, 0 8px 16px rgba(44,29,17,.26);
    transform:translateY(-2px);
  }
  .tool-btn .t-ico{
    font-size:26px;
    line-height:1;
  }
  .tool-btn .t-lbl{
    font-size:12.5px;
    white-space:nowrap;
  }
  #btnFinishLoop{
    background:linear-gradient(180deg,#e9d5ff 0%,#c084fc 100%);
    border-color:#581c87;
    color:#2e1065;
    box-shadow:0 4px 0 #581c87, inset 0 2px 0 rgba(255,255,255,.7);
  }
  #btnFinishLoop:active{
    box-shadow:0 1px 0 #581c87;
  }

  /* Giant Glowing Green DRIVE MY TRACK! CTA */
  @keyframes drivePulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(122,229,130,.75), 0 6px 0 #1b5e28, 0 10px 22px rgba(27,94,40,.38), inset 0 3px 0 rgba(255,255,255,.6); }
    50%{ box-shadow:0 0 0 8px rgba(122,229,130,0), 0 6px 0 #1b5e28, 0 12px 26px rgba(42,168,68,.55), inset 0 3px 0 rgba(255,255,255,.7); }
  }
  #btnDriveNow{
    min-width:196px;
    min-height:68px;
    height:68px;
    padding:0 18px;
    border-radius:22px;
    border:4px solid #1b5e28;
    background:linear-gradient(180deg,#80ed88 0%,#39c252 55%,#269e3d 100%);
    color:#ffffff;
    text-shadow:0 2px 0 rgba(18,74,28,.6);
    font-family:inherit;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.2px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    animation:drivePulse 1.9s infinite ease-in-out;
    transition:transform .13s cubic-bezier(.34,1.6,.5,1), opacity .2s, filter .2s;
    flex:0 0 auto;
    white-space:nowrap;
  }
  #btnDriveNow:active{
    transform:translateY(3px) scale(.96);
  }
  #btnDriveNow.needs-track{
    animation:none;
    opacity:.68;
    filter:saturate(.55);
  }
  #btnDriveNow .d-short{ display:none; }

  /* Drive Console Controls */
  .ctrl-btn{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 12px;
    border-radius:20px;
    border:3.5px solid var(--wood-dark);
    background:linear-gradient(180deg,#fffaf0 0%,#f3dcb1 100%);
    color:var(--ink);
    font-family:inherit;
    font-weight:700;
    font-size:20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    position:relative;
    box-shadow:0 5px 0 var(--wood-dark), inset 0 2px 0 rgba(255,255,255,.75);
    transition:transform .13s cubic-bezier(.34,1.6,.5,1), box-shadow .13s, background .15s;
    flex:0 0 auto;
  }
  .ctrl-btn:active{
    transform:translateY(3px) scale(.94);
    box-shadow:0 2px 0 var(--wood-dark);
  }
  .ctrl-btn svg{
    width:34px;
    height:34px;
    display:block;
    flex:none;
  }

  #goStopBtn{
    min-width:72px;
    background:linear-gradient(180deg,#7ae582 0%,#35b84d 100%);
    border-color:#1c5e2a;
    box-shadow:0 5px 0 #1c5e2a, inset 0 2px 0 rgba(255,255,255,.55);
  }
  #goStopBtn.paused{
    background:linear-gradient(180deg,#ff8c7a 0%,#e5463a 100%);
    border-color:#7d1c15;
    box-shadow:0 5px 0 #7d1c15, inset 0 2px 0 rgba(255,255,255,.45);
  }

  #reverseBtn{
    background:linear-gradient(180deg,#8fd3ff 0%,#379be8 100%);
    border-color:#154c7a;
    box-shadow:0 5px 0 #154c7a, inset 0 2px 0 rgba(255,255,255,.5);
  }
  #reverseBtn.reversed{
    background:linear-gradient(180deg,#c79eff 0%,#844ee0 100%);
    border-color:#452182;
    box-shadow:0 0 0 3px #fff, 0 5px 0 #452182;
  }

  #speedGroup{
    display:flex;
    align-items:center;
    gap:6px;
    padding:4px;
    border-radius:24px;
    background:rgba(107,62,24,.2);
    box-shadow:inset 0 2px 5px rgba(55,30,10,.25);
  }
  .speed-btn{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 10px;
    border-radius:18px;
    border:3.5px solid var(--wood-dark);
    background:linear-gradient(180deg,#fffaf0 0%,#edd19e 100%);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 0 var(--wood-dark), inset 0 2px 0 rgba(255,255,255,.7);
    transition:transform .13s cubic-bezier(.34,1.6,.5,1), background .15s;
    flex:0 0 auto;
  }
  .speed-btn:active{
    transform:translateY(3px) scale(.94);
    box-shadow:0 1px 0 var(--wood-dark);
  }
  .speed-btn svg{
    width:36px;
    height:36px;
    display:block;
  }
  .speed-btn.active{
    background:linear-gradient(180deg,#ffe46b 0%,#f5ad1d 100%);
    border-color:#5a2e08;
    box-shadow:0 0 0 3px #fff, 0 4px 0 #5a2e08;
    transform:translateY(-2px);
  }
  .speed-btn[data-speed="turbo"].active{
    background:linear-gradient(180deg,#ffae52 0%,#f05a24 100%);
    border-color:#7d2105;
    box-shadow:0 0 0 3px #fff, 0 4px 0 #7d2105;
  }

  #addCarBtn{
    min-width:78px;
    padding:0 12px;
    flex-direction:column;
    gap:3px;
    background:linear-gradient(180deg,#fff2c2 0%,#f7cb5c 100%);
    border-color:#6b4108;
    box-shadow:0 5px 0 #6b4108, inset 0 2px 0 rgba(255,255,255,.7);
  }
  .add-car-top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    line-height:1;
  }
  .add-car-top svg{ width:30px; height:30px; }
  .car-dots{ display:flex; align-items:center; gap:4px; }
  .car-dot{
    width:9px; height:9px; border-radius:50%;
    border:2px solid #6b4108;
    background:rgba(255,255,255,.55);
    transition:transform .2s cubic-bezier(.34,1.8,.5,1), background .2s;
  }
  .car-dot.on{ background:#e8483c; transform:scale(1.18); }
  .car-dot:nth-child(2).on{ background:#36a6f0; }
  .car-dot:nth-child(3).on{ background:#42b859; }
  .car-dot:nth-child(4).on{ background:#a855f7; }

  #whistleBtn{
    min-width:96px;
    min-height:68px;
    height:68px;
    padding:0 18px;
    border-radius:24px;
    border:4px solid #613904;
    background:radial-gradient(circle at 30% 24%, #fffbe0 0%, #ffe066 36%, #eb9f13 78%, #c97d06 100%);
    box-shadow:0 6px 0 #613904, 0 10px 22px rgba(97,57,4,.36), inset 0 3px 2px rgba(255,255,255,.8);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:transform .12s cubic-bezier(.34,1.8,.5,1), box-shadow .12s;
    flex:0 0 auto;
  }
  #whistleBtn:active, #whistleBtn.tooting{
    transform:translateY(3px) scale(1.06);
    box-shadow:0 0 0 4px #fff, 0 3px 0 #613904, 0 0 24px rgba(255,220,70,.85);
  }
  #whistleBtn svg{
    width:44px; height:44px; display:block;
    filter:drop-shadow(0 2px 1px rgba(97,57,4,.35));
  }

  .hidden{ display:none !important; }

  /* ==================== RESPONSIVE BREAKPOINTS ==================== */
  /* iPad Landscape (1024x768) */
  @media (max-width:1100px){
    .mode-btn{ padding:0 12px; font-size:16px; gap:6px; }
    .preset-pill{ padding:0 10px; font-size:15px; gap:5px; }
    #btnCabView{ padding:0 14px; font-size:17px; gap:6px; }
    .wood-console{ gap:6px; padding:8px 10px; }
    .tool-btn{ min-width:66px; padding:4px 6px; }
    #btnDriveNow{ min-width:172px; padding:0 14px; font-size:17px; }
  }
  @media (max-width:900px){
    .mode-btn{ padding:0 10px; font-size:15px; }
    .preset-pill{ padding:0 8px; font-size:14px; }
    .tool-btn{ min-width:64px; padding:4px 4px; }
    #btnDriveNow{ min-width:150px; padding:0 12px; font-size:16px; }
  }

  /* Compact Phone Portrait (iPhone 390x844 etc.) — ZERO overflow, ALL buttons >=64px */
  @media (max-width:740px){
    #hud{
      flex-wrap:wrap;
      padding:max(6px,env(safe-area-inset-top)) 8px 4px 8px;
      gap:6px;
    }
    .hud-group{ gap:6px; }
    #modeSwitch{ order:1; flex:1 1 auto; }
    #hudRight{ order:2; }
    #hudCenter{
      order:3;
      width:100%;
      justify-content:center;
    }
    .mode-btn{
      flex:1 1 64px;
      min-width:64px;
      min-height:64px;
      height:64px;
      padding:0 8px;
      font-size:15px;
      gap:5px;
      border-radius:18px;
      border-width:3.5px;
    }
    .mode-btn .mode-long{ display:none; }
    .mode-ico{ font-size:20px; }

    #presetBar{
      width:100%;
      max-width:374px;
      justify-content:space-between;
      gap:6px;
    }
    .preset-pill{
      flex:1 1 64px;
      min-width:64px;
      min-height:64px;
      height:64px;
      padding:0 6px;
      font-size:14px;
      gap:4px;
      border-radius:18px;
      border-width:3.5px;
    }
    .preset-pill .p-ico{ font-size:18px; }

    #btnCabView{
      min-height:64px;
      height:64px;
      padding:0 22px;
      font-size:18px;
      border-radius:20px;
      border-width:3.5px;
    }
    #starPill{
      padding:0 10px;
      font-size:18px;
      gap:4px;
      border-radius:18px;
      border-width:3.5px;
    }
    #starPill svg{ width:22px; height:22px; }
    .hud-icon-btn{
      border-radius:18px;
      border-width:3.5px;
    }

    #consoleWrap{
      padding:0 6px max(6px,env(safe-area-inset-bottom)) 6px;
    }
    .wood-console{
      width:100%;
      max-width:378px;
      flex-direction:column;
      gap:6px;
      padding:7px;
      border-radius:24px;
      border-width:3.5px;

<script>
(function(){
  "use strict";

  /* ==================== STATE ==================== */
  var state = {
    appMode: "build",     // "build" | "drive"
    tool: "track",        // "track" | "bridge" | "tunnel" | "crossing" | "prop" | "erase"
    running: true,
    speed: "cruise",      // "slow" | "cruise" | "turbo"
    dir: 1,               // 1 forward | -1 reverse
    carCount: 1,          // 0..4 attached wooden cars
    carTheme: 0,
    stars: 0,
    whistles: 0,
    cabView: false,
    muted: false,
    propCursor: 0
  };

  var PROP_KINDS = ["cow", "pond", "station", "pine"];
  var SPEED_PX = { slow: 88, cruise: 168, turbo: 288 };
  var CHUG_HZ  = { slow: 2.3, cruise: 4.3, turbo: 7.4 };

  // Orthogonal direction bitmasks & helpers
  var DIR_N = 1, DIR_E = 2, DIR_S = 4, DIR_W = 8;
  var DIRS = [
    { bit: DIR_N, opp: DIR_S, dc: 0, dr: -1 },
    { bit: DIR_E, opp: DIR_W, dc: 1, dr: 0 },
    { bit: DIR_S, opp: DIR_N, dc: 0, dr: 1 },
    { bit: DIR_W, opp: DIR_E, dc: -1, dr: 0 }
  ];

  /* ==================== DOM REFS ==================== */
  var canvas = document.getElementById("worldCanvas");
  var ctx = canvas.getContext("2d");
  var hudEl = document.getElementById("hud");
  var buildConsoleEl = document.getElementById("buildConsole");
  var driveConsoleEl = document.getElementById("console");
  var btnModeBuild = document.getElementById("btnModeBuild");
  var btnModeDrive = document.getElementById("btnModeDrive");
  var presetBarEl = document.getElementById("presetBar");
  var presetBtns = document.querySelectorAll(".preset-pill");
  var btnCabView = document.getElementById("btnCabView");
  var toolBtns = document.querySelectorAll(".tool-btn[data-tool]");
  var btnFinishLoop = document.getElementById("btnFinishLoop");
  var btnDriveNow = document.getElementById("btnDriveNow");

  var starPillEl = document.getElementById("starPill");
  var starCountEl = document.getElementById("starCount");
  var muteBtn = document.getElementById("muteBtn");
  var soundOnIcon = document.getElementById("soundOnIcon");
  var soundOffIcon = document.getElementById("soundOffIcon");
  var goStopBtn = document.getElementById("goStopBtn");
  var pauseSvg = document.getElementById("pauseSvg");
  var goSvg = document.getElementById("goSvg");
  var reverseBtn = document.getElementById("reverseBtn");
  var addCarBtn = document.getElementById("addCarBtn");
  var carDotsEl = document.getElementById("carDots");
  var whistleBtn = document.getElementById("whistleBtn");
  var speedBtns = document.querySelectorAll(".speed-btn");

  /* ==================== VERIFIED AUDIO ENGINE ==================== */
  // Every single MP3 below was verified in `git ls-tree -r origin/main --name-only assets/voice/`
  var VERIFIED_VOICE = {
    moo: "assets/voice/sound-moo.mp3",
    quack: "assets/voice/sound-quack.mp3",
    star: "assets/voice/hoot-star.mp3",
    great: "assets/voice/hoot-great-job.mp3",
    yay: "assets/voice/hoot-yay-2.mp3",
    super: "assets/voice/hoot-super.mp3",
    amazing: "assets/voice/hoot-amazing.mp3"
  };

  var actx = null;
  var noiseBuf = null;
  var voiceEl = null;
  var audioUnlocked = false;
  var woodClickStep = 0;

  function ensureAudio(){
    if(state.muted) return null;
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      try{ actx = new AC(); }catch(e){ return null; }
    }
    if(actx.state === "suspended"){
      try{ actx.resume(); }catch(e){}
    }
    if(!noiseBuf && actx){
      var len = Math.floor(actx.sampleRate * 0.6);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      var data = noiseBuf.getChannelData(0);
      var last = 0;
      for(var i = 0; i < len; i++){
        var w = Math.random() * 2 - 1;
        last = (last + 0.06 * w) / 1.06;
        data[i] = last * 3.1;
      }
    }
    audioUnlocked = true;
    return actx;
  }

  function playVoice(key){
    if(state.muted) return;
    var src = VERIFIED_VOICE[key];
    if(!src) return;
    try{
      if(!voiceEl) voiceEl = new Audio();
      voiceEl.pause();
      voiceEl.currentTime = 0;
      voiceEl.src = src;
      var p = voiceEl.play();
      if(p && p.catch) p.catch(function(){});
    }catch(e){}
  }

  var PENTA = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
  var pentaIdx = 0;

  function playMarimbaNote(freq, delay, vol){
    var ac = ensureAudio();
    if(!ac) return;
    var t0 = ac.currentTime + (delay || 0);
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol || 0.13, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + 0.26);
  }

  /* Tactile BRIO Beechwood Track Click-Clack Snap SFX */
  function playWoodSnapSfx(isFeature){
    var ac = ensureAudio();
    if(!ac) return;
    var now = ac.currentTime;
    // Hollow wooden peg knock
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = "triangle";
    var base = isFeature ? 420 : 290 + (woodClickStep % 6) * 28;
    o.frequency.setValueAtTime(base, now);
    o.frequency.exponentialRampToValueAtTime(base * 0.48, now + 0.055);
    g.gain.setValueAtTime(0.24, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.075);
    o.connect(g); g.connect(ac.destination);
    o.start(now); o.stop(now + 0.085);

    // Bright beechwood secondary click
    var note = PENTA[(woodClickStep++) % PENTA.length];
    playMarimbaNote(isFeature ? note * 1.25 : note, 0.025, 0.11);
  }

  function playWoodEraseSfx(){
    var ac = ensureAudio();
    if(!ac) return;
    var now = ac.currentTime;
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(360, now);
    o.frequency.exponentialRampToValueAtTime(160, now + 0.09);
    g.gain.setValueAtTime(0.16, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
    o.connect(g); g.connect(ac.destination);
    o.start(now); o.stop(now + 0.12);
  }

  function playWhistleSfx(shortToot){
    var ac = ensureAudio();
    if(!ac) return;
    var now = ac.currentTime;
    var freqs = [370, 440, 554.37, 659.25];
    var bursts = shortToot
      ? [{ start: 0.00, dur: 0.22, gain: 0.11 }]
      : [{ start: 0.00, dur: 0.34, gain: 0.13 }, { start: 0.42, dur: 0.24, gain: 0.12 }];
    bursts.forEach(function(b){
      var t0 = now + b.start;
      var t1 = t0 + b.dur;
      var master = ac.createGain();
      master.gain.setValueAtTime(0.0001, t0);
      master.gain.exponentialRampToValueAtTime(b.gain, t0 + 0.045);
      master.gain.setValueAtTime(b.gain * 0.92, t1 - 0.05);
      master.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.08);
      master.connect(ac.destination);

      freqs.forEach(function(f, idx){
        var osc = ac.createOscillator();
        osc.type = idx % 2 === 0 ? "triangle" : "sine";
        osc.frequency.setValueAtTime(f * 0.96, t0);
        osc.frequency.exponentialRampToValueAtTime(f, t0 + 0.055);
        osc.frequency.setValueAtTime(f * 0.995, t1);
        var og = ac.createGain();
        og.gain.value = idx === 0 ? 0.34 : (idx === 1 ? 0.28 : 0.22);
        osc.connect(og); og.connect(master);
        osc.start(t0); osc.stop(t1 + 0.1);
      });

      if(noiseBuf){
        var ns = ac.createBufferSource();
        ns.buffer = noiseBuf;
        var bp = ac.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = 1150;
        bp.Q.value = 2.4;
        var ng = ac.createGain();
        ng.gain.setValueAtTime(0.0001, t0);
        ng.gain.linearRampToValueAtTime(0.10, t0 + 0.04);
        ng.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.05);
        ns.connect(bp); bp.connect(ng); ng.connect(ac.destination);
        ns.start(t0); ns.stop(t1 + 0.08);
      }
    });
  }

  function playChugStep(accent, muffled, onBridge){
    if(state.muted || !audioUnlocked || !actx || actx.state !== "running" || !noiseBuf) return;
    var now = actx.currentTime;
    var src = actx.createBufferSource();
    src.buffer = noiseBuf;
    var filter = actx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = muffled ? (accent ? 250 : 200) : (onBridge ? (accent ? 680 : 520) : (accent ? 540 : 410));
    filter.Q.value = muffled ? 1.8 : 1.3;
    var gain = actx.createGain();
    var peak = (accent ? 0.082 : 0.045) * (muffled ? 0.62 : 1);
    var dur = state.speed === "turbo" ? 0.075 : (state.speed === "slow" ? 0.14 : 0.105);

  /* ==================== VIEWPORT, PLAYFIELD & BUILDER GRID ==================== */
  var W = window.innerWidth;
  var H = window.innerHeight;
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var play = { x: 0, y: 80, w: W, h: H - 180, cx: W / 2, cy: H / 2, scale: 1, portrait: false };

  var grid = {
    cols: 7,
    rows: 4,
    cellSize: 120,
    x0: 0,
    y0: 0,
    cells: [] // [row][col] -> { col, row, hasTrack, conns, feature, prop, anim, bounce, gateAngle, gateWasClosed, gateManual, cheer }
  };

  function makeCell(c, r){
    return {
      col: c,
      row: r,
      hasTrack: false,
      conns: 0,
      feature: null, // null | "bridge" | "tunnel" | "crossing"
      prop: null,    // null | "cow" | "pond" | "station" | "pine"
      anim: 1,
      bounce: 0,
      gateAngle: 0,
      gateWasClosed: false,
      gateManual: 0,
      cheer: 0
    };
  }

  function createEmptyGrid(cols, rows){
    var arr = [];
    for(var r = 0; r < rows; r++){
      var row = [];
      for(var c = 0; c < cols; c++){
        row.push(makeCell(c, r));
      }
      arr.push(row);
    }
    return arr;
  }

  function getCell(c, r){
    if(r < 0 || r >= grid.rows || c < 0 || c >= grid.cols) return null;
    return grid.cells[r][c];
  }

  function cellCenter(c, r){
    return {
      x: grid.x0 + (c + 0.5) * grid.cellSize,
      y: grid.y0 + (r + 0.5) * grid.cellSize
    };
  }

  function hitTestGrid(px, py){
    var c = Math.floor((px - grid.x0) / grid.cellSize);
    var r = Math.floor((py - grid.y0) / grid.cellSize);
    if(c < 0 || c >= grid.cols || r < 0 || r >= grid.rows) return null;
    return { col: c, row: r };
  }

  function bitCount(mask){
    var n = 0;
    if(mask & DIR_N) n++;
    if(mask & DIR_E) n++;
    if(mask & DIR_S) n++;
    if(mask & DIR_W) n++;
    return n;
  }

  function countTrackTiles(){
    var n = 0;
    for(var r = 0; r < grid.rows; r++){
      for(var c = 0; c < grid.cols; c++){
        if(grid.cells[r][c].hasTrack) n++;
      }
    }
    return n;
  }

  function measurePlayfield(){
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    var hudRect = hudEl.getBoundingClientRect();
    var activeConsole = state.appMode === "build" ? buildConsoleEl : driveConsoleEl;
    var conRect = activeConsole.getBoundingClientRect();
    var topSafe = Math.max(78, hudRect.bottom + 8);
    var botSafe = Math.max(94, H - conRect.top + 8);
    var padX = Math.max(10, Math.min(26, W * 0.025));
    var availH = Math.max(240, H - topSafe - botSafe);
    var availW = Math.max(260, W - padX * 2);

    play.x = padX;
    play.y = topSafe;
    play.w = availW;
    play.h = availH;
    play.cx = padX + availW * 0.5;
    play.cy = topSafe + availH * 0.5;
    play.portrait = H > W * 1.06;

    var wantCols = play.portrait ? 4 : 7;
    var wantRows = play.portrait ? 6 : 4;

    if(grid.cells.length === 0){
      grid.cols = wantCols;
      grid.rows = wantRows;
      grid.cells = createEmptyGrid(wantCols, wantRows);
    } else if(grid.cols !== wantCols || grid.rows !== wantRows){
      // Transpose cleanly if device rotates between portrait and landscape
      var oldCells = grid.cells;
      var oldCols = grid.cols;
      var oldRows = grid.rows;
      grid.cols = wantCols;
      grid.rows = wantRows;
      grid.cells = createEmptyGrid(wantCols, wantRows);
      for(var r = 0; r < oldRows; r++){
        for(var c = 0; c < oldCols; c++){
          var oc = oldCells[r][c];
          var nc = Math.min(wantCols - 1, r);
          var nr = Math.min(wantRows - 1, c);
          var dest = grid.cells[nr][nc];
          if(oc.hasTrack && !dest.hasTrack){
            dest.hasTrack = true;
            dest.feature = oc.feature;
            dest.anim = 1;
          } else if(oc.prop && !dest.hasTrack && !dest.prop){
            dest.prop = oc.prop;
          }
        }
      }
      rebuildAllConnections();
    }

    var cs = Math.floor(Math.min(availW / grid.cols, availH / grid.rows));
    grid.cellSize = Math.max(76, cs);
    var gw = grid.cellSize * grid.cols;
    var gh = grid.cellSize * grid.rows;
    grid.x0 = Math.round(play.x + (availW - gw) * 0.5);
    grid.y0 = Math.round(play.y + (availH - gh) * 0.5);
    play.scale = Math.max(0.68, Math.min(1.18, grid.cellSize / 118));
  }

  /* ==================== AUTO-CONNECTING TRACK GRAPH ==================== */
  function connectPair(a, b){
    var dc = b.col - a.col;
    var dr = b.row - a.row;
    for(var i = 0; i < DIRS.length; i++){
      var d = DIRS[i];
      if(d.dc === dc && d.dr === dr){
        a.conns |= d.bit;
        b.conns |= d.opp;
        return true;
      }
    }
    return false;
  }

  function disconnectCell(cell){
    for(var i = 0; i < DIRS.length; i++){
      var d = DIRS[i];
      var nb = getCell(cell.col + d.dc, cell.row + d.dr);
      if(nb) nb.conns &= ~d.opp;
    }
    cell.conns = 0;
  }

  function autoConnectCell(cell, fromCell){
    if(!cell || !cell.hasTrack) return;
    // 1. Prioritize connecting from drag predecessor if orthogonally adjacent
    if(fromCell && fromCell !== cell && fromCell.hasTrack){
      var dist = Math.abs(fromCell.col - cell.col) + Math.abs(fromCell.row - cell.row);
      if(dist === 1){
        if(bitCount(fromCell.conns) < 2 || bitCount(cell.conns) === 0){
          connectPair(fromCell, cell);
        }
      }
    }

    // 2. Collect orthogonal track neighbors not already connected
    var deg = bitCount(cell.conns);
    if(deg < 2){
      var candidates = [];
      for(var i = 0; i < DIRS.length; i++){
        var d = DIRS[i];
        if(cell.conns & d.bit) continue;
        var nb = getCell(cell.col + d.dc, cell.row + d.dr);
        if(nb && nb.hasTrack){
          candidates.push({ nb: nb, deg: bitCount(nb.conns) });
        }
      }
      // Prefer open endpoints (deg 1 or deg 0) so paths extend and loops snap shut naturally!
      candidates.sort(function(a, b){
        var scoreA = a.deg === 1 ? 0 : (a.deg === 0 ? 1 : 2 + a.deg);
        var scoreB = b.deg === 1 ? 0 : (b.deg === 0 ? 1 : 2 + b.deg);
        return scoreA - scoreB;
      });
      for(var k = 0; k < candidates.length && bitCount(cell.conns) < 2; k++){
        var cand = candidates[k];
        if(cand.deg < 2){
          connectPair(cell, cand.nb);
        }
      }
      // If still isolated (placed next to middle of an existing track), attach as a wooden switch branch!
      if(bitCount(cell.conns) === 0 && candidates.length > 0){
        connectPair(cell, candidates[0].nb);
      }
    }
  }

  function rebuildAllConnections(){
    for(var r = 0; r < grid.rows; r++){
      for(var c = 0; c < grid.cols; c++){
        grid.cells[r][c].conns = 0;
      }
    }
    for(var r = 0; r < grid.rows; r++){
      for(var c = 0; c < grid.cols; c++){
        var cell = grid.cells[r][c];
        if(cell.hasTrack) autoConnectCell(cell, null);
      }
    }
  }

  /* ==================== PRESETS & BOOT STARTER TRACK ==================== */
  function clearGrid(){
    for(var r = 0; r < grid.rows; r++){
      for(var c = 0; c < grid.cols; c++){
        grid.cells[r][c] = makeCell(c, r);
      }
    }
    plantedItems.length = 0;
  }

  function layOrderedPath(coords, closeLoop, features, props){
    clearGrid();
    var prev = null;
    for(var i = 0; i < coords.length; i++){
      var c = coords[i][0], r = coords[i][1];
      var cell = getCell(c, r);
      if(!cell) continue;
      cell.hasTrack = true;
      cell.anim = 1;
      if(prev) connectPair(prev, cell);
      prev = cell;
    }
    if(closeLoop && coords.length >= 4){
      var first = getCell(coords[0][0], coords[0][1]);
      var last = getCell(coords[coords.length - 1][0], coords[coords.length - 1][1]);
      if(first && last) connectPair(last, first);
    }
    if(features){
      features.forEach(function(ft){
        var cell = getCell(ft[0], ft[1]);
        if(cell && cell.hasTrack) cell.feature = ft[2];
      });
    }
    if(props){
      props.forEach(function(pr){
        var cell = getCell(pr[0], pr[1]);
        if(cell && !cell.hasTrack) cell.prop = pr[2];
      });
    }
    rebuildTrackSpline(true);
  }

  /* ==================== CUSTOM GRAPH WALKER -> SMOOTH SPLINE ==================== */
  var track = {
    pts: [],          // { x, y, tx, ty, angle, s, col, row, feature, inTunnel, onBridge, isCrossing }
    totalLen: 0,
    isLoop: false,
    orderedCells: [],
    hintCells: [],    // Suggested next empty cells to pulse in Build Mode
    propMarkers: [],  // Projected roadside props for Cab View!
    featureEvents: [] // Tunnel entries, bridges, crossings along s for Cab View!
  };

  function getNeighborsConnected(cell){
    var out = [];
    for(var i = 0; i < DIRS.length; i++){
      var d = DIRS[i];
      if(cell.conns & d.bit){
        var nb = getCell(cell.col + d.dc, cell.row + d.dr);
        if(nb && nb.hasTrack) out.push(nb);
      }
    }
    return out;
  }

  function cellKey(c){ return c.col + "," + c.row; }

  function findLargestComponent(){
    var visited = {};
    var best = [];
    for(var r = 0; r < grid.rows; r++){
      for(var c = 0; c < grid.cols; c++){
        var cell = grid.cells[r][c];
        if(!cell.hasTrack || visited[cellKey(cell)]) continue;
        var comp = [];
        var q = [cell];
        visited[cellKey(cell)] = true;
        while(q.length){
          var cur = q.shift();
          comp.push(cur);
          var nbs = getNeighborsConnected(cur);
          for(var i = 0; i < nbs.length; i++){
            var nb = nbs[i];
            if(!visited[cellKey(nb)]){
              visited[cellKey(nb)] = true;
              q.push(nb);
            }
          }
        }
        if(comp.length > best.length) best = comp;
      }
    }
    return best;
  }

  function extractDriveOrder(comp){
    if(comp.length < 2) return { cells: comp.slice(), isLoop: false };

    // Case 1: Pure 2-regular cycle
    var allDeg2 = true;
    var deg1 = [];
    for(var i = 0; i < comp.length; i++){
      var d = getNeighborsConnected(comp[i]).length;
      if(d !== 2) allDeg2 = false;
      if(d === 1) deg1.push(comp[i]);
    }
    if(allDeg2){
      var order = [];
      var start = comp[0];
      // Start at top-most, left-most tile and walk clockwise-preferring East
      comp.forEach(function(c){
        if(c.row < start.row || (c.row === start.row && c.col < start.col)) start = c;
      });
      var prev = null;
      var cur = start;
      var nbs0 = getNeighborsConnected(start);
      // Prefer East neighbor first for pleasant clockwise direction
      nbs0.sort(function(a, b){ return (b.col - a.col) || (a.row - b.row); });
      var next = nbs0[0];
      order.push(start);
      prev = start;
      cur = next;
      var guard = comp.length + 2;
      while(cur && cur !== start && guard-- > 0){
        order.push(cur);
        var nbs = getNeighborsConnected(cur);
        var nxt = nbs[0] === prev ? nbs[1] : nbs[0];
        prev = cur;
        cur = nxt;
      }
      if(order.length >= 4) return { cells: order, isLoop: true };
    }

    // Case 2: Pure open chain (exact 2 endpoints, all others deg 2)
    if(deg1.length === 2){
      var isPureChain = true;
      for(var i = 0; i < comp.length; i++){
        var dg = getNeighborsConnected(comp[i]).length;
        if(dg > 2) isPureChain = false;
      }
      if(isPureChain){
        var s0 = deg1[0];
        var s1 = deg1[1];
        if(s1.col < s0.col || (s1.col === s0.col && s1.row < s0.row)){
          var tmp = s0; s0 = s1; s1 = tmp;
        }
        var chain = [s0];
        var p = null, u = s0;
        var g = comp.length + 2;
        while(g-- > 0){
          var nbs = getNeighborsConnected(u);
          var nx = null;
          for(var k = 0; k < nbs.length; k++){
            if(nbs[k] !== p){ nx = nbs[k]; break; }
          }
          if(!nx) break;
          chain.push(nx);
          p = u; u = nx;
        }
        return { cells: chain, isLoop: false };
      }
    }

    // Case 3: Component has branches/switches -> find longest simple cycle first, else longest simple path!
    var bestCycle = [];
    var seenStart = {};
    for(var sIdx = 0; sIdx < comp.length; sIdx++){
      var root = comp[sIdx];
      seenStart[cellKey(root)] = true;
      var path = [root];
      var inPath = {};
      inPath[cellKey(root)] = true;
      (function dfsCycle(u, depth){
        if(depth > 28) return;
        var nbs = getNeighborsConnected(u);
        for(var j = 0; j < nbs.length; j++){
          var v = nbs[j];
          if(v === root && path.length >= 4){
            if(path.length > bestCycle.length) bestCycle = path.slice();
          } else if(!inPath[cellKey(v)] && !seenStart[cellKey(v)]){
            inPath[cellKey(v)] = true;
            path.push(v);
            dfsCycle(v, depth + 1);
            path.pop();
            delete inPath[cellKey(v)];
          }
        }
      })(root, 0);
    }
    if(bestCycle.length >= 4){
      return { cells: bestCycle, isLoop: true };
    }

    // Otherwise find longest simple path (diameter of tree/branching track)
    var bestPath = [];
    var starts = deg1.length ? deg1 : comp;
    starts.forEach(function(st){
      var pArr = [st];
      var used = {};
      used[cellKey(st)] = true;
      (function dfsPath(u){
        if(pArr.length > bestPath.length) bestPath = pArr.slice();
        var nbs = getNeighborsConnected(u);
        for(var j = 0; j < nbs.length; j++){
          var v = nbs[j];
          if(!used[cellKey(v)]){
            used[cellKey(v)] = true;
            pArr.push(v);
            dfsPath(v);
            pArr.pop();
            delete used[cellKey(v)];
          }
        }
      })(st);
    });
    return { cells: bestPath, isLoop: false };
  }

  function dirBetween(fromCell, toCell){
    var dc = toCell.col - fromCell.col;
    var dr = toCell.row - fromCell.row;
    if(dc === 1 && dr === 0) return DIR_E;
    if(dc === -1 && dr === 0) return DIR_W;
    if(dc === 0 && dr === 1) return DIR_S;
    if(dc === 0 && dr === -1) return DIR_N;
    return 0;
  }

  function edgeMidpoint(cx, cy, half, dir){
    if(dir === DIR_N) return { x: cx, y: cy - half };
    if(dir === DIR_E) return { x: cx + half, y: cy };
    if(dir === DIR_S) return { x: cx, y: cy + half };
    return { x: cx - half, y: cy };
  }

  // Sample smooth points across a single cell from inDir edge to outDir edge (exact quarter-circle for 90° turns!)
  function sampleTileSegment(cell, inDir, outDir, steps){
    var ctr = cellCenter(cell.col, cell.row);
    var half = grid.cellSize * 0.5;
    var out = [];

    // Open start or open end (only one direction)
    if(!inDir || !outDir){
      var d = outDir || inDir;
      var pEdge = edgeMidpoint(ctr.x, ctr.y, half, d);
      var dx = ctr.x - pEdge.x;
      var dy = ctr.y - pEdge.y;
      var pStop = { x: ctr.x + dx * 0.24, y: ctr.y + dy * 0.24 };
      var a = inDir ? pEdge : pStop;
      var b = inDir ? pStop : pEdge;
      for(var i = 0; i <= steps; i++){
        var f = i / steps;
        out.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
      }
      return out;
    }

    // Straight through (N<->S or E<->W)
    var pIn = edgeMidpoint(ctr.x, ctr.y, half, inDir);
    var pOut = edgeMidpoint(ctr.x, ctr.y, half, outDir);
    if((inDir === DIR_N && outDir === DIR_S) || (inDir === DIR_S && outDir === DIR_N) ||
       (inDir === DIR_E && outDir === DIR_W) || (inDir === DIR_W && outDir === DIR_E)){
      for(var i = 0; i <= steps; i++){
        var f = i / steps;
        out.push({ x: pIn.x + (pOut.x - pIn.x) * f, y: pIn.y + (pOut.y - pIn.y) * f });
      }
      return out;
    }

    // 90° smooth circular arc of radius = half centered at the shared cell corner!
    var cornerX = ctr.x + ((inDir === DIR_E || outDir === DIR_E) ? half : -half);
    var cornerY = ctr.y + ((inDir === DIR_S || outDir === DIR_S) ? half : -half);
    var a0 = Math.atan2(pIn.y - cornerY, pIn.x - cornerX);
    var a1 = Math.atan2(pOut.y - cornerY, pOut.x - cornerX);
    var da = a1 - a0;
    while(da > Math.PI) da -= Math.PI * 2;
    while(da < -Math.PI) da += Math.PI * 2;
    for(var i = 0; i <= steps; i++){
      var ang = a0 + da * (i / steps);
      out.push({ x: cornerX + Math.cos(ang) * half, y: cornerY + Math.sin(ang) * half });
    }
    return out;
  }

  function computeHintCells(){
    var hints = [];
    if(track.isLoop){ track.hintCells = hints; return; }
    var total = countTrackTiles();
    if(total === 0){
      // Suggest center cell on blank meadow
      hints.push({ col: Math.floor(grid.cols / 2), row: Math.floor(grid.rows / 2) });
      track.hintCells = hints;
      return;
    }
    if(track.orderedCells.length >= 2){
      var a = track.orderedCells[0];
      var b = track.orderedCells[track.orderedCells.length - 1];
      var path = findShortestClosingPath(a, b);
      if(path && path.length > 0){
        hints.push({ col: path[0].col, row: path[0].row });
        if(path.length > 1) hints.push({ col: path[path.length - 1].col, row: path[path.length - 1].row });
        track.hintCells = hints;
        return;
      }
    }
    // Otherwise suggest an empty neighbor of any endpoint
    var seed = track.orderedCells.length ? track.orderedCells[track.orderedCells.length - 1] : null;
    if(!seed){
      for(var r = 0; r < grid.rows && !seed; r++){
        for(var c = 0; c < grid.cols && !seed; c++){
          if(grid.cells[r][c].hasTrack) seed = grid.cells[r][c];
        }
      }
    }
    if(seed){
      for(var i = 0; i < DIRS.length; i++){
        var nb = getCell(seed.col + DIRS[i].dc, seed.row + DIRS[i].dr);
        if(nb && !nb.hasTrack){
          hints.push({ col: nb.col, row: nb.row });
          break;
        }
      }
    }
    track.hintCells = hints;
  }

  function rebuildTrackSpline(resetTrainPos){
    var comp = findLargestComponent();
    var res = extractDriveOrder(comp);
    track.orderedCells = res.cells;
    track.isLoop = res.isLoop;

    if(res.cells.length < 2){
      track.pts = [];
      track.totalLen = 0;
      track.propMarkers = [];
      track.featureEvents = [];
      computeHintCells();
      syncDriveButtonState();
      return;
    }

    var raw = [];
    var K = res.cells.length;
    for(var i = 0; i < K; i++){
      var cell = res.cells[i];
      var prevCell = res.isLoop ? res.cells[(i - 1 + K) % K] : (i > 0 ? res.cells[i - 1] : null);
      var nextCell = res.isLoop ? res.cells[(i + 1) % K] : (i < K - 1 ? res.cells[i + 1] : null);
      var inDir = prevCell ? dirBetween(cell, prevCell) : 0;
      var outDir = nextCell ? dirBetween(cell, nextCell) : 0;
      var segPts = sampleTileSegment(cell, inDir, outDir, 14);
      var startJ = i === 0 ? 0 : 1;
      for(var j = startJ; j < segPts.length; j++){
        raw.push({
          x: segPts[j].x,
          y: segPts[j].y,
          col: cell.col,
          row: cell.row,
          feature: cell.feature,
          inTunnel: cell.feature === "tunnel",
          onBridge: cell.feature === "bridge",
          isCrossing: cell.feature === "crossing"
        });
      }
    }

    // Arc-length accumulation
    var cum = [0];
    var total = 0;
    for(var i = 1; i < raw.length; i++){
      total += Math.hypot(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y);
      cum.push(total);
    }
    if(total < 10){
      track.pts = [];
      track.totalLen = 0;
      computeHintCells();
      syncDriveButtonState();
      return;
    }

    // Uniform arc-length resampling (~1 point per 5px)
    var M = Math.max(80, Math.min(420, Math.round(total / 5)));
    var pts = [];
    var seg = 0;
    var denom = res.isLoop ? M : (M - 1);
    for(var k = 0; k < M; k++){
      var targetS = (k / denom) * total;
      while(seg < raw.length - 2 && cum[seg + 1] < targetS) seg++;
      var s0 = cum[seg];
      var s1 = cum[seg + 1];
      var frac = s1 > s0 ? (targetS - s0) / (s1 - s0) : 0;
      var p0 = raw[seg];
      var p1 = raw[seg + 1];
      var src = frac < 0.5 ? p0 : p1;
      pts.push({
        x: p0.x + (p1.x - p0.x) * frac,
        y: p0.y + (p1.y - p0.y) * frac,
        s: targetS,
        col: src.col,
        row: src.row,
        feature: src.feature,
        inTunnel: src.inTunnel,
        onBridge: src.onBridge,
        isCrossing: src.isCrossing
      });
    }

    // Smooth tangents & headings
    for(var k = 0; k < M; k++){
      var pr = res.isLoop ? pts[(k - 1 + M) % M] : pts[Math.max(0, k - 1)];
      var nx = res.isLoop ? pts[(k + 1) % M] : pts[Math.min(M - 1, k + 1)];
      var dx = nx.x - pr.x;
      var dy = nx.y - pr.y;
      var len = Math.hypot(dx, dy) || 1;
      pts[k].tx = dx / len;
      pts[k].ty = dy / len;
      pts[k].angle = Math.atan2(dy, dx);
    }

    track.pts = pts;
    track.totalLen = total;

    // Project custom meadow props & track features onto arc-length s for First-Person Cab View!
    track.propMarkers = [];
    for(var r = 0; r < grid.rows; r++){
      for(var c = 0; c < grid.cols; c++){
        var cell = grid.cells[r][c];
        if(!cell.prop) continue;
        var ctr = cellCenter(c, r);
        var bestIdx = 0, bestD = 1e9;
        for(var k = 0; k < M; k += 2){
          var d = Math.hypot(pts[k].x - ctr.x, pts[k].y - ctr.y);
          if(d < bestD){ bestD = d; bestIdx = k; }
        }
        if(bestD < grid.cellSize * 1.9){
          var p = pts[bestIdx];
          var cross = p.tx * (ctr.y - p.y) - p.ty * (ctr.x - p.x);
          var lat = (cross >= 0 ? 1 : -1) * Math.max(2.0, Math.min(3.5, (bestD / grid.cellSize) * 2.4));
          track.propMarkers.push({
            s: p.s,
            lat: lat,
            kind: cell.prop,
            col: c,
            row: r
          });
        }
      }
    }

    // Collect feature events (tunnel portals, crossings, bridge spans) along s
    track.featureEvents = [];
    for(var k = 0; k < M; k++){
      var p = pts[k];
      var prev = res.isLoop ? pts[(k - 1 + M) % M] : (k > 0 ? pts[k - 1] : null);
      var next = res.isLoop ? pts[(k + 1) % M] : (k < M - 1 ? pts[k + 1] : null);
      if(p.inTunnel && (!prev || !prev.inTunnel)){
        track.featureEvents.push({ kind: "tunnelStart", s: p.s, dirHint: 1 });
      }
      if(p.inTunnel && (!next || !next.inTunnel)){
        track.featureEvents.push({ kind: "tunnelEnd", s: p.s, dirHint: -1 });
      }
    }
    // Midpoint s of every crossing tile
    var crossingSeen = {};
    for(var k = 0; k < M; k++){
      var p = pts[k];
      if(!p.isCrossing) continue;
      var key = p.col + "," + p.row;
      if(!crossingSeen[key]) crossingSeen[key] = { sum: 0, cnt: 0, col: p.col, row: p.row };
      crossingSeen[key].sum += p.s;
      crossingSeen[key].cnt++;
    }
    Object.keys(crossingSeen).forEach(function(key){
      var o = crossingSeen[key];
      track.featureEvents.push({ kind: "crossing", s: o.sum / o.cnt, id: key, col: o.col, row: o.row });
    });

    if(resetTrainPos || trainS > total || trainS < 0){
      var margin = Math.min(total * 0.25, getTrainLengthPx() + 26 * play.scale);
      trainS = res.isLoop ? total * 0.12 : Math.min(total * 0.65, Math.max(margin, total * 0.35));
      state.dir = 1;
    }

    computeHintCells();
    syncDriveButtonState();
  }

  function getCarSpacing(){
    var base = 52 * play.scale;
    if(!track.totalLen) return base;
    if(track.isLoop){
      return Math.min(base, track.totalLen / (state.carCount + 1.5));
    }
    return Math.min(base, Math.max(24 * play.scale, (track.totalLen * 0.56) / Math.max(1, state.carCount)));
  }

  function getTrainLengthPx(){
    return state.carCount * getCarSpacing();
  }

  function sampleTrack(s){
    var pts = track.pts;
    var M = pts.length;
    if(!M) return { x: play.cx, y: play.cy, tx: 1, ty: 0, angle: 0, s: 0, inTunnel: false, onBridge: false, isCrossing: false };
    var tot = track.totalLen;
    var cl;
    if(track.isLoop){
      cl = ((s % tot) + tot) % tot;
      var exact = (cl / tot) * M;
      var i0 = Math.floor(exact) % M;
      var i1 = (i0 + 1) % M;
      var f = exact - Math.floor(exact);
      var p0 = pts[i0], p1 = pts[i1];
      var da = p1.angle - p0.angle;
      while(da > Math.PI) da -= Math.PI * 2;
      while(da < -Math.PI) da += Math.PI * 2;
      return {
        x: p0.x + (p1.x - p0.x) * f,
        y: p0.y + (p1.y - p0.y) * f,
        tx: p0.tx + (p1.tx - p0.tx) * f,
        ty: p0.ty + (p1.ty - p0.ty) * f,
        angle: p0.angle + da * f,
        s: cl,
        inTunnel: p0.inTunnel,
        onBridge: p0.onBridge,
        isCrossing: p0.isCrossing
      };
    } else {
      cl = Math.max(0, Math.min(tot, s));
      var exact = (cl / tot) * (M - 1);
      var i0 = Math.min(M - 2, Math.max(0, Math.floor(exact)));
      var i1 = i0 + 1;
      var f = exact - i0;
      var p0 = pts[i0], p1 = pts[i1];
      var da = p1.angle - p0.angle;
      while(da > Math.PI) da -= Math.PI * 2;
      while(da < -Math.PI) da += Math.PI * 2;
      return {
        x: p0.x + (p1.x - p0.x) * f,
        y: p0.y + (p1.y - p0.y) * f,
        tx: p0.tx + (p1.tx - p0.tx) * f,
        ty: p0.ty + (p1.ty - p0.ty) * f,
        angle: p0.angle + da * f,
        s: cl,
        inTunnel: p0.inTunnel,
        onBridge: p0.onBridge,
        isCrossing: p0.isCrossing
      };
    }
  }

  function forwardDistAlongTrack(targetS, curS, dir){
    var tot = track.totalLen;
    if(!tot) return 99999;
    if(track.isLoop){
      var d = (((targetS - curS) * dir) % tot + tot) % tot;
      return d;
    }
    return (targetS - curS) * dir;
  }

  /* ==================== MAGIC FINISH LOOP BFS ==================== */
  function findShortestClosingPath(startCell, endCell){
    if(!startCell || !endCell || startCell === endCell) return null;
    // Direct neighbor? Zero intermediate cells needed!
    if(Math.abs(startCell.col - endCell.col) + Math.abs(startCell.row - endCell.row) === 1){
      return [];
    }
    var q = [{ cell: startCell, path: [] }];
    var visited = {};
    visited[cellKey(startCell)] = true;
    while(q.length){
      var item = q.shift();
      var u = item.cell;
      // Sort neighbors to prefer spacious outer cells slightly
      var nexts = [];
      for(var i = 0; i < DIRS.length; i++){
        var nb = getCell(u.col + DIRS[i].dc, u.row + DIRS[i].dr);
        if(!nb) continue;
        if(nb === endCell && item.path.length >= 1){
          return item.path;
        }
        if(!nb.hasTrack && !visited[cellKey(nb)]){
          var adjTracks = 0;
          for(var j = 0; j < DIRS.length; j++){
            var n2 = getCell(nb.col + DIRS[j].dc, nb.row + DIRS[j].dr);
            if(n2 && n2.hasTrack) adjTracks++;
          }
          nexts.push({ nb: nb, score: adjTracks });
        }
      }
      nexts.sort(function(a, b){ return a.score - b.score; });
      for(var k = 0; k < nexts.length; k++){
        var cand = nexts[k].nb;
        visited[cellKey(cand)] = true;
        q.push({ cell: cand, path: item.path.concat([cand]) });
      }
    }
    return null;
  }

  function magicFinishLoop(){
    var total = countTrackTiles();
    if(total < 2){
      loadPreset("oval");
      playVoice("amazing");
      return;
    }
    if(track.isLoop){
      // Already a closed loop! Reward with sparkles & add a fun bridge/tunnel if missing
      var hasSpecial = false;
      for(var i = 0; i < track.orderedCells.length; i++){
        if(track.orderedCells[i].feature) hasSpecial = true;
      }
      if(!hasSpecial && track.orderedCells.length >= 4){
        var mid = track.orderedCells[Math.floor(track.orderedCells.length / 2)];
        mid.feature = "bridge";
        mid.anim = 0;
        rebuildTrackSpline(false);
      }
      playStationCheerSfx();
      spawnSparkles(play.cx, play.cy, ["#ffd43b", "#69db7c", "#c084fc", "#74c0fc"], 20, "star");
      playVoice("super");
      return;
    }

    var cells = track.orderedCells;
    var a = cells[0];
    var b = cells[cells.length - 1];
    var closing = findShortestClosingPath(b, a);
    if(closing !== null){
      var prev = b;
      for(var i = 0; i < closing.length; i++){
        var stepCell = closing[i];
        stepCell.prop = null;
        stepCell.hasTrack = true;
        stepCell.anim = 0;
        connectPair(prev, stepCell);
        var ctr = cellCenter(stepCell.col, stepCell.row);
        spawnSparkles(ctr.x, ctr.y, ["#ffd43b", "#c084fc", "#ffffff"], 8, "star");
        prev = stepCell;
      }
      connectPair(prev, a);
      rebuildTrackSpline(false);
      playStationCheerSfx();
      playVoice("amazing");
    } else {
      // Fallback: clean starter oval if current shape was completely boxed in
      loadPreset("oval");
      playVoice("amazing");
    }
  }

  /* ==================== BUILDER PAINTING ACTIONS ==================== */
  function applyToolAtCell(col, row, toolOverride, fromCell){
    var cell = getCell(col, row);
    if(!cell) return false;
    var tool = toolOverride || state.tool;
    var ctr = cellCenter(col, row);

    if(tool === "erase"){
      if(!cell.hasTrack && !cell.prop) return false;
      disconnectCell(cell);
      cell.hasTrack = false;
      cell.feature = null;
      cell.prop = null;
      rebuildTrackSpline(false);
      playWoodEraseSfx();
      spawnSparkles(ctr.x, ctr.y, ["#ffffff", "#f6d6a2"], 7, "star");
      return true;
    }

    if(tool === "prop"){
      if(cell.hasTrack){
        // Gently clear track if user explicitly drops a prop? Keep tracks safe unless tapped directly
        return false;
      }
      if(!cell.prop){
        cell.prop = PROP_KINDS[state.propCursor % PROP_KINDS.length];
        state.propCursor++;
      } else {
        var idx = PROP_KINDS.indexOf(cell.prop);
        cell.prop = PROP_KINDS[(idx + 1) % PROP_KINDS.length];
      }
      cell.anim = 0;
      cell.bounce = 1;
      rebuildTrackSpline(false);
      playWoodSnapSfx(true);
      spawnSparkles(ctr.x, ctr.y, ["#ffd43b", "#69db7c", "#ffafcc", "#74c0fc"], 10, "star");
      if(cell.prop === "cow") playVoice("moo");
      else if(cell.prop === "pond") playVoice("quack");
      return true;
    }

    if(tool === "bridge" || tool === "tunnel" || tool === "crossing"){
      var wasNew = !cell.hasTrack;
      cell.prop = null;
      cell.hasTrack = true;
      if(wasNew){
        cell.anim = 0;
        autoConnectCell(cell, fromCell);
      }
      // Toggle feature if clicking same feature again, else apply it
      cell.feature = (cell.feature === tool && !wasNew) ? null : tool;
      cell.anim = 0;
      rebuildTrackSpline(false);
      playWoodSnapSfx(true);
      if(tool === "crossing") playCrossingBell(1);
      spawnSparkles(ctr.x, ctr.y, tool === "bridge" ? ["#74c0fc", "#ffd43b", "#fff"] : (tool === "tunnel" ? ["#69db7c", "#ffd43b", "#fff"] : ["#ff6b6b", "#ffd43b", "#fff"]), 12, "star");
      return true;
    }

    // Default tool: "track"
    var newlyPlaced = !cell.hasTrack;
    cell.prop = null;
    cell.hasTrack = true;
    if(newlyPlaced) cell.anim = 0;
    autoConnectCell(cell, fromCell);
    rebuildTrackSpline(false);
    if(newlyPlaced){
      playWoodSnapSfx(false);
      spawnSparkles(ctr.x, ctr.y, ["#ffd43b", "#f6d6a2", "#ffffff"], 8, "star");
      if(track.isLoop){
        playStationCheerSfx();
      }
    } else if(fromCell && fromCell !== cell){
      // Dragged back onto an existing tile (e.g. closing a loop onto the starting tile!)
      var before = cell.conns;
      autoConnectCell(cell, fromCell);
      if(cell.conns !== before){
        rebuildTrackSpline(false);
        playWoodSnapSfx(true);
        spawnSparkles(ctr.x, ctr.y, ["#ffd43b", "#69db7c", "#ffffff"], 14, "star");
        if(track.isLoop){
          playStationCheerSfx();
          playVoice("great");
        }
      }
    }
    return true;
  }
