  /* ==================== DRAWING: MEADOW, GRID GUIDES & WOODEN TRACKS ==================== */
  function drawMeadowBg(t){
    var bg = ctx.createRadialGradient(play.cx, play.cy * 0.75, 40, play.cx, play.cy, Math.max(W, H) * 0.85);
    bg.addColorStop(0, "#b0ea7a");
    bg.addColorStop(0.55, "#83cf56");
    bg.addColorStop(1, "#66b241");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.fillStyle = "rgba(255, 250, 200, 0.14)";
    ctx.beginPath();
    ctx.ellipse(W * 0.22, H * 0.30, W * 0.26, H * 0.16, -0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(W * 0.78, H * 0.68, W * 0.28, H * 0.18, 0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(63, 128, 38, 0.28)";
    ctx.lineWidth = 2.2 * play.scale;
    ctx.lineCap = "round";
    for(var i = 0; i < 16; i++){
      var gx = ((i * 197 + 63) % 94 + 3) / 100 * W;
      var gy = ((i * 131 + 41) % 72 + 14) / 100 * H;
      ctx.beginPath();
      ctx.moveTo(gx, gy); ctx.lineTo(gx - 4, gy - 7);
      ctx.moveTo(gx + 4, gy); ctx.lineTo(gx + 5, gy - 8);
      ctx.moveTo(gx + 8, gy + 1); ctx.lineTo(gx + 12, gy - 5);
      ctx.stroke();
    }

    clouds.forEach(function(cl){
      var cx = ((cl.x + t * cl.spd) % 1.24 - 0.12) * W;
      var cy = cl.y * H;
      var s = cl.s * play.scale * 0.82;
      ctx.fillStyle = "rgba(255, 255, 255, 0.32)";
      ctx.beginPath();
      ctx.arc(cx, cy, 24 * s, 0, Math.PI * 2);
      ctx.arc(cx + 22 * s, cy - 6 * s, 20 * s, 0, Math.PI * 2);
      ctx.arc(cx + 42 * s, cy + 2 * s, 17 * s, 0, Math.PI * 2);
      ctx.arc(cx - 20 * s, cy + 4 * s, 16 * s, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  var hoverCell = null;

  function drawBuilderGridGuides(t){
    var cs = grid.cellSize;
    var gw = cs * grid.cols;
    var gh = cs * grid.rows;

    ctx.save();
    // Cozy subtle wooden playboard boundary frame
    ctx.strokeStyle = "rgba(107, 62, 24, 0.30)";
    ctx.fillStyle = "rgba(255, 252, 232, 0.09)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(grid.x0 - 8, grid.y0 - 8, gw + 16, gh + 16, 22);
    ctx.fill();
    ctx.stroke();

    // Individual chunky snap cells with soft dotted outlines & wood-peg centers
    var pulse = 0.5 + 0.5 * Math.sin(t * 4.4);
    for(var r = 0; r < grid.rows; r++){
      for(var c = 0; c < grid.cols; c++){
        var cell = grid.cells[r][c];
        var x = grid.x0 + c * cs;
        var y = grid.y0 + r * cs;
        var cx = x + cs * 0.5;
        var cy = y + cs * 0.5;
        var isHover = hoverCell && hoverCell.col === c && hoverCell.row === r;

        var isHint = false;
        if(state.tool === "track" && !cell.hasTrack){
          for(var hi = 0; hi < track.hintCells.length; hi++){
            if(track.hintCells[hi].col === c && track.hintCells[hi].row === r){
              isHint = true; break;
            }
          }
        }

        // Soft dotted snap tile border
        ctx.save();
        if(isHint){
          ctx.fillStyle = "rgba(255, 236, 128, " + (0.20 + pulse * 0.18) + ")";
          ctx.strokeStyle = "rgba(255, 224, 72, " + (0.72 + pulse * 0.28) + ")";
          ctx.lineWidth = 3.5;
          ctx.setLineDash([8, 6]);
          ctx.beginPath();
          ctx.roundRect(x + 5, y + 5, cs - 10, cs - 10, 16);
          ctx.fill();
          ctx.stroke();
          ctx.setLineDash([]);

          // Pulsing friendly golden wood-peg + "+" cue
          var pr = (12 + pulse * 5) * play.scale;
          ctx.fillStyle = "rgba(255, 240, 145, 0.92)";
          ctx.strokeStyle = "#8a501c";
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.arc(cx, cy, pr, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = "#8a501c";
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(cx - pr * 0.45, cy); ctx.lineTo(cx + pr * 0.45, cy);
          ctx.moveTo(cx, cy - pr * 0.45); ctx.lineTo(cx, cy + pr * 0.45);
          ctx.stroke();
        } else {
          ctx.strokeStyle = isHover ? "rgba(255, 250, 200, 0.85)" : "rgba(255, 252, 235, 0.34)";
          ctx.fillStyle = isHover ? "rgba(255, 252, 220, 0.20)" : "rgba(255, 255, 255, 0.04)";
          ctx.lineWidth = isHover ? 3 : 2;
          ctx.setLineDash([6, 7]);
          ctx.beginPath();
          ctx.roundRect(x + 4, y + 4, cs - 8, cs - 8, 14);
          ctx.fill();
          ctx.stroke();
          ctx.setLineDash([]);

          if(!cell.hasTrack && !cell.prop){
            // Subtle wooden peg guide dot
            ctx.fillStyle = isHover ? "rgba(255, 234, 150, 0.9)" : "rgba(138, 82, 33, 0.26)";
            ctx.beginPath();
            ctx.arc(cx, cy, isHover ? 7 : 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(255, 248, 225, 0.55)";
            ctx.beginPath();
            ctx.arc(cx - 1.2, cy - 1.2, 2.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }
    }
    ctx.restore();
  }

  /* Collect individual geometric stroke segments for a track cell (straights, 90° arcs, endpoints, switches) */
  function getCellRenderArcs(cell){
    var ctr = cellCenter(cell.col, cell.row);
    var half = grid.cellSize * 0.5;
    var mask = cell.conns;
    var dirs = [];
    if(mask & DIR_N) dirs.push(DIR_N);
    if(mask & DIR_E) dirs.push(DIR_E);
    if(mask & DIR_S) dirs.push(DIR_S);
    if(mask & DIR_W) dirs.push(DIR_W);

    if(dirs.length === 0){
      // Standalone starter wooden track plank
      return [{
        kind: "line",
        x0: ctr.x - half * 0.58, y0: ctr.y,
        x1: ctr.x + half * 0.58, y1: ctr.y,
        standalone: true
      }];
    }
    if(dirs.length === 1){
      var d = dirs[0];
      var pe = edgeMidpoint(ctr.x, ctr.y, half, d);
      var dx = ctr.x - pe.x, dy = ctr.y - pe.y;
      return [{
        kind: "line",
        x0: pe.x, y0: pe.y,
        x1: ctr.x + dx * 0.24, y1: ctr.y + dy * 0.24,
        bumperAtEnd: true,
        bumperAngle: Math.atan2(dy, dx)
      }];
    }

    function pairToGeom(d1, d2){
      var p1 = edgeMidpoint(ctr.x, ctr.y, half, d1);
      var p2 = edgeMidpoint(ctr.x, ctr.y, half, d2);
      if((d1 === DIR_N && d2 === DIR_S) || (d1 === DIR_S && d2 === DIR_N) ||
         (d1 === DIR_E && d2 === DIR_W) || (d1 === DIR_W && d2 === DIR_E)){
        return { kind: "line", x0: p1.x, y0: p1.y, x1: p2.x, y1: p2.y };
      }
      var cornerX = ctr.x + ((d1 === DIR_E || d2 === DIR_E) ? half : -half);
      var cornerY = ctr.y + ((d1 === DIR_S || d2 === DIR_S) ? half : -half);
      var a0 = Math.atan2(p1.y - cornerY, p1.x - cornerX);
      var a1 = Math.atan2(p2.y - cornerY, p2.x - cornerX);
      var da = a1 - a0;
      while(da > Math.PI) da -= Math.PI * 2;
      while(da < -Math.PI) da += Math.PI * 2;
      return { kind: "arc", cx: cornerX, cy: cornerY, r: half, a0: a0, a1: a0 + da, anticlockwise: da < 0 };
    }

    if(dirs.length === 2){
      return [pairToGeom(dirs[0], dirs[1])];
    }

    // Degree 3 or 4 wooden switch: draw straight-through plus curves cleanly
    var geoms = [];
    for(var i = 0; i < dirs.length; i++){
      for(var j = i + 1; j < dirs.length; j++){
        geoms.push(pairToGeom(dirs[i], dirs[j]));
      }
    }
    return geoms;
  }

  function traceGeomPath(g, offset){
    var off = offset || 0;
    if(g.kind === "line"){
      var dx = g.x1 - g.x0, dy = g.y1 - g.y0;
      var len = Math.hypot(dx, dy) || 1;
      var nx = -dy / len, ny = dx / len;
      ctx.beginPath();
      ctx.moveTo(g.x0 + nx * off, g.y0 + ny * off);
      ctx.lineTo(g.x1 + nx * off, g.y1 + ny * off);
    } else {
      var r = Math.max(4, g.r + (g.anticlockwise ? -off : off));
      ctx.beginPath();
      ctx.arc(g.cx, g.cy, r, g.a0, g.a1, g.anticlockwise);
    }
  }

  function getCellMainAngle(cell){
    var m = cell.conns;
    if((m & DIR_N) && (m & DIR_S)) return Math.PI * 0.5;
    if((m & DIR_E) && (m & DIR_W)) return 0;
    if((m & DIR_N) || (m & DIR_S)){
      if((m & DIR_E) || (m & DIR_W)){
        if((m & DIR_N) && (m & DIR_E)) return -Math.PI * 0.25;
        if((m & DIR_E) && (m & DIR_S)) return Math.PI * 0.25;
        if((m & DIR_S) && (m & DIR_W)) return -Math.PI * 0.25;
        return Math.PI * 0.25;
      }
      return Math.PI * 0.5;
    }
    return 0;
  }

  function drawBridgeBrookUnderCell(cell, t){
    var ctr = cellCenter(cell.col, cell.row);
    var cs = grid.cellSize;
    var ang = getCellMainAngle(cell) + Math.PI * 0.5;
    ctx.save();
    ctx.translate(ctr.x, ctr.y);
    ctx.rotate(ang);

    // Sandy pebble creek bank
    ctx.fillStyle = "#e5cf99";
    ctx.beginPath();
    ctx.roundRect(-cs * 0.54, -cs * 0.27, cs * 1.08, cs * 0.54, cs * 0.22);
    ctx.fill();

    // Sparkling blue brook water
    var wg = ctx.createLinearGradient(0, -cs * 0.22, 0, cs * 0.22);
    wg.addColorStop(0, "#4cc9f0");
    wg.addColorStop(0.5, "#229be8");
    wg.addColorStop(1, "#187cc2");
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.roundRect(-cs * 0.52, -cs * 0.21, cs * 1.04, cs * 0.42, cs * 0.18);
    ctx.fill();

    // Animated glistening water ripples
    ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
    ctx.lineWidth = Math.max(2, cs * 0.024);
    ctx.lineCap = "round";
    for(var w = 0; w < 3; w++){
      var shift = ((t * 32 + w * 28) % (cs * 0.78)) - cs * 0.39;
      var wy = (w - 1) * cs * 0.11;
      ctx.beginPath();
      ctx.moveTo(shift - 8, wy);
      ctx.lineTo(shift + 8, wy);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCrossingRoadUnderCell(cell){
    var ctr = cellCenter(cell.col, cell.row);
    var cs = grid.cellSize;
    var ang = getCellMainAngle(cell) + Math.PI * 0.5;
    ctx.save();
    ctx.translate(ctr.x, ctr.y);
    ctx.rotate(ang);
    ctx.fillStyle = "#e8cf9b";
    ctx.strokeStyle = "#caa96e";
    ctx.lineWidth = 2.5 * play.scale;
    ctx.beginPath();
    ctx.roundRect(-cs * 0.48, -cs * 0.16, cs * 0.96, cs * 0.32, cs * 0.1);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = "#fff8e1";
    ctx.lineWidth = 2.4 * play.scale;
    ctx.setLineDash([7 * play.scale, 6 * play.scale]);
    ctx.beginPath();
    ctx.moveTo(-cs * 0.38, 0);
    ctx.lineTo(cs * 0.38, 0);
    ctx.stroke();
    ctx.restore();
  }

  function drawBumperStop(x, y, angle){
    var S = play.scale;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    // Wooden bumper tie block
    ctx.fillStyle = "#7a4416";
    ctx.strokeStyle = "#2c1d11";
    ctx.lineWidth = 2.2 * S;
    ctx.beginPath();
    ctx.roundRect(-4 * S, -17 * S, 9 * S, 34 * S, 3.5 * S);
    ctx.fill();
    ctx.stroke();
    // Bright cherry-red wooden safety bar
    ctx.fillStyle = "#e8483c";
    ctx.beginPath();
    ctx.roundRect(1 * S, -15 * S, 9 * S, 30 * S, 4 * S);
    ctx.fill();
    ctx.stroke();
    // Crisp white stripe
    ctx.fillStyle = "#fffdf8";
    ctx.fillRect(3.5 * S, -10 * S, 3.5 * S, 20 * S);
    ctx.restore();
  }

  function drawAllWoodenTracks(t){
    var S = play.scale;
    var bedW = Math.max(24, Math.min(40, grid.cellSize * 0.31));
    var railOff = bedW * 0.25;

    // 1. Under-track brook (bridges) & footpath road (crossings)
    for(var r = 0; r < grid.rows; r++){
      for(var c = 0; c < grid.cols; c++){
        var cell = grid.cells[r][c];
        if(!cell.hasTrack) continue;
        if(cell.feature === "bridge") drawBridgeBrookUnderCell(cell, t);
        if(cell.feature === "crossing") drawCrossingRoadUnderCell(cell);
      }
    }

    // Collect all cell geometries once
    var items = [];
    for(var r = 0; r < grid.rows; r++){
      for(var c = 0; c < grid.cols; c++){
        var cell = grid.cells[r][c];
        if(!cell.hasTrack) continue;
        items.push({ cell: cell, geoms: getCellRenderArcs(cell) });
      }
    }
    if(items.length === 0) return;

    ctx.save();
    ctx.lineCap = "butt";
    ctx.lineJoin = "round";

    // Pass A: Soft meadow drop shadow
    ctx.save();
    ctx.translate(0, 5 * S);
    ctx.strokeStyle = "rgba(38, 76, 26, 0.26)";
    ctx.lineWidth = bedW + 4.5 * S;
    items.forEach(function(it){
      it.geoms.forEach(function(g){
        ctx.lineCap = (g.standalone || g.bumperAtEnd) ? "round" : "butt";
        traceGeomPath(g, 0);
        ctx.stroke();
      });
    });
    ctx.restore();

    // Pass B: Dark walnut outer track bevel
    ctx.strokeStyle = "#8a5221";
    ctx.lineWidth = bedW + 4.5 * S;
    items.forEach(function(it){
      it.geoms.forEach(function(g){
        ctx.lineCap = (g.standalone || g.bumperAtEnd) ? "round" : "butt";
        traceGeomPath(g, 0);
        ctx.stroke();
      });
    });

    // Pass C: Warm beechwood track plank body
    items.forEach(function(it){
      var isBridge = it.cell.feature === "bridge";
      ctx.strokeStyle = isBridge ? "#f5d393" : "#e9c17f";
      ctx.lineWidth = bedW;
      it.geoms.forEach(function(g){
        ctx.lineCap = (g.standalone || g.bumperAtEnd) ? "round" : "butt";
        traceGeomPath(g, 0);
        ctx.stroke();
      });
    });

    // Pass D: Wooden crossties & BRIO join lines
    items.forEach(function(it){
      it.geoms.forEach(function(g){
        var steps = g.standalone ? 4 : 6;
        for(var i = 1; i < steps; i++){
          var f = i / steps;
          var px, py, tx, ty;
          if(g.kind === "line"){
            px = g.x0 + (g.x1 - g.x0) * f;
            py = g.y0 + (g.y1 - g.y0) * f;
            var len = Math.hypot(g.x1 - g.x0, g.y1 - g.y0) || 1;
            tx = (g.x1 - g.x0) / len;
            ty = (g.y1 - g.y0) / len;
          } else {
            var a = g.a0 + (g.a1 - g.a0) * f;
            px = g.cx + Math.cos(a) * g.r;
            py = g.cy + Math.sin(a) * g.r;
            var dirSign = g.anticlockwise ? -1 : 1;
            tx = -Math.sin(a) * dirSign;
            ty = Math.cos(a) * dirSign;
          }
          var nx = -ty, ny = tx;
          ctx.strokeStyle = "rgba(142, 86, 34, 0.30)";
          ctx.lineWidth = 2.0 * S;
          ctx.beginPath();
          ctx.moveTo(px - nx * bedW * 0.43, py - ny * bedW * 0.43);
          ctx.lineTo(px + nx * bedW * 0.43, py + ny * bedW * 0.43);
          ctx.stroke();
        }
      });
    });

    // Pass E: Twin carved BRIO wooden wheel grooves
    [-railOff, railOff].forEach(function(off){
      items.forEach(function(it){
        it.geoms.forEach(function(g){
          ctx.lineCap = "butt";
          traceGeomPath(g, off);
          ctx.strokeStyle = "#8f5724";
          ctx.lineWidth = Math.max(3.5, bedW * 0.14);
          ctx.stroke();
          ctx.strokeStyle = "#f7dca8";
          ctx.lineWidth = Math.max(1.2, bedW * 0.045);
          ctx.stroke();
        });
      });
    });

    // Pass F: Bridge wooden handrails & open-end red bumper stops & standalone pegs
    items.forEach(function(it){
      if(it.cell.feature === "bridge"){
        [-bedW * 0.56, bedW * 0.56].forEach(function(off){
          it.geoms.forEach(function(g){
            ctx.lineCap = "round";
            traceGeomPath(g, off);
            ctx.strokeStyle = "#6b3b12";
            ctx.lineWidth = 6.5 * S;
            ctx.stroke();
            ctx.strokeStyle = "#e39f50";
            ctx.lineWidth = 3.2 * S;
            ctx.stroke();
          });
        });
      }
      it.geoms.forEach(function(g){
        if(g.bumperAtEnd){
          drawBumperStop(g.x1, g.y1, g.bumperAngle);
        } else if(g.standalone){
          // Cute BRIO wooden connector knob on right end
          ctx.fillStyle = "#e9c17f";
          ctx.strokeStyle = "#8a5221";
          ctx.lineWidth = 2.2 * S;
          ctx.beginPath();
          ctx.arc(g.x1 + 5 * S, g.y1, 6.2 * S, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
      });
    });

    ctx.restore();
  }

  /* ==================== OVER-TRACK FEATURES: MOUNTAIN TUNNELS & CROSSING GATES ==================== */
  function drawTunnelOverCell(cell){
    var ctr = cellCenter(cell.col, cell.row);
    var cs = grid.cellSize;
    var S = play.scale;
    var rx = cs * 0.49;
    var ry = cs * 0.44;
    var baseY = ctr.y + cs * 0.18;
    var peakY = ctr.y - cs * 0.44;

    ctx.save();
    // Ground shadow
    ctx.fillStyle = "rgba(32, 66, 22, 0.25)";
    ctx.beginPath();
    ctx.ellipse(ctr.x, baseY + 5 * S, rx * 0.96, 12 * S, 0, 0, Math.PI * 2);
    ctx.fill();

    // Sculpted storybook green mountain hill
    var mg = ctx.createLinearGradient(ctr.x, peakY, ctr.x, baseY + 6 * S);
    mg.addColorStop(0, "#68bd64");
    mg.addColorStop(0.55, "#45944c");
    mg.addColorStop(1, "#2d6b36");
    ctx.fillStyle = mg;
    ctx.strokeStyle = "#1f4a24";
    ctx.lineWidth = 2.8 * S;
    ctx.beginPath();
    ctx.moveTo(ctr.x - rx, baseY);
    ctx.bezierCurveTo(ctr.x - rx * 0.84, ctr.y - ry * 0.65, ctr.x - rx * 0.32, peakY, ctr.x, peakY);
    ctx.bezierCurveTo(ctr.x + rx * 0.32, peakY, ctr.x + rx * 0.84, ctr.y - ry * 0.65, ctr.x + rx, baseY);
    ctx.quadraticCurveTo(ctr.x, baseY + 12 * S, ctr.x - rx, baseY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Snowy peak cap clipped cleanly
    ctx.save();
    ctx.clip();
    ctx.fillStyle = "#fffdf8";
    ctx.beginPath();
    ctx.moveTo(ctr.x - rx * 0.34, peakY + ry * 0.44);
    ctx.lineTo(ctr.x - rx * 0.14, peakY + ry * 0.32);
    ctx.lineTo(ctr.x, peakY + ry * 0.48);
    ctx.lineTo(ctr.x + rx * 0.14, peakY + ry * 0.32);
    ctx.lineTo(ctr.x + rx * 0.34, peakY + ry * 0.44);
    ctx.lineTo(ctr.x + rx * 0.4, peakY - 10);
    ctx.lineTo(ctr.x - rx * 0.4, peakY - 10);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Rustic dark stone-arched tunnel portals on connected edges
    var half = cs * 0.42;
    for(var i = 0; i < DIRS.length; i++){
      var d = DIRS[i];
      if(!(cell.conns & d.bit)) continue;
      var px = ctr.x + d.dc * half;
      var py = ctr.y + d.dr * half;
      ctx.save();
      ctx.translate(px, py);
      ctx.fillStyle = "#24170f";
      ctx.strokeStyle = "#b58d5c";
      ctx.lineWidth = 4 * S;
      ctx.beginPath();
      ctx.arc(0, 0, 12.5 * S, Math.PI, 0);
      ctx.lineTo(12.5 * S, 9 * S);
      ctx.lineTo(-12.5 * S, 9 * S);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    drawPineTree(ctr.x - rx * 0.36, ctr.y - ry * 0.1, 0.56, 0);
    drawPineTree(ctr.x + rx * 0.36, ctr.y - ry * 0.06, 0.52, 0);
    ctx.restore();
  }

  function drawCrossingGateOverCell(cell, t){
    var ctr = cellCenter(cell.col, cell.row);
    var S = play.scale;
    var ang = getCellMainAngle(cell);
    var nx = -Math.sin(ang);
    var ny = Math.cos(ang);
    var postX = ctr.x + nx * 28 * S;
    var postY = ctr.y + ny * 28 * S;

    ctx.save();
    ctx.translate(postX, postY);

    ctx.fillStyle = "rgba(38, 76, 26, 0.25)";
    ctx.beginPath();
    ctx.ellipse(0, 8 * S, 13 * S, 5.5 * S, 0, 0, Math.PI * 2);
    ctx.fill();

    // Animated red/white striped barrier arm
    ctx.save();
    ctx.translate(0, -6 * S);
    var acrossAngle = Math.atan2(ctr.y - postY, ctr.x - postX);
    var armRot = acrossAngle - (1 - cell.gateAngle) * 1.18;
    ctx.rotate(armRot);
    var armLen = 50 * S;
    ctx.fillStyle = "#fffdf8";
    ctx.strokeStyle = "#2c1d11";
    ctx.lineWidth = 2.2 * S;
    ctx.beginPath();
    ctx.roundRect(0, -4.2 * S, armLen, 8.4 * S, 4 * S);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#e8483c";
    for(var sx = 7; sx < 44; sx += 13){
      ctx.fillRect(sx * S, -3.2 * S, 6.5 * S, 6.4 * S);
    }
    ctx.restore();

    // Wooden post
    ctx.fillStyle = "#5c3412";
    ctx.strokeStyle = "#2c1d11";
    ctx.lineWidth = 2.2 * S;
    ctx.beginPath();
    ctx.roundRect(-4.2 * S, -26 * S, 8.4 * S, 33 * S, 4 * S);
    ctx.fill();
    ctx.stroke();

    // Twin flashing red warning lamps
    var active = cell.gateAngle > 0.18 || state.appMode === "build";
    var phase = t * 11;
    var leftLit = active && Math.sin(phase) > 0;
    var rightLit = active && Math.sin(phase) <= 0;

    ctx.fillStyle = "#2c1d11";
    ctx.beginPath();
    ctx.roundRect(-13 * S, -28 * S, 26 * S, 10.5 * S, 5 * S);
    ctx.fill();

    [[-7 * S, leftLit], [7 * S, rightLit]].forEach(function(lamp){
      if(lamp[1]){
        ctx.fillStyle = "rgba(255, 59, 48, 0.42)";
        ctx.beginPath();
        ctx.arc(lamp[0], -22.8 * S, 10 * S, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = lamp[1] ? "#ff3b30" : "#6b2320";
      ctx.beginPath();
      ctx.arc(lamp[0], -22.8 * S, 4 * S, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();
  }

  /* ==================== INTERACTIVE GRID PROPS ==================== */
  function drawGridProp(cell, t){
    var ctr = cellCenter(cell.col, cell.row);
    var S = play.scale * Math.min(1.06, grid.cellSize / 108);
    var pop = cell.anim < 1 ? (1 + Math.sin(cell.anim * Math.PI) * 0.25) * cell.anim : 1;

    ctx.save();
    ctx.translate(ctr.x, ctr.y);
    ctx.scale(pop, pop);

    if(cell.prop === "pond"){
      var rx = 38 * S, ry = 25 * S;
      ctx.fillStyle = "#ebd49e";
      ctx.strokeStyle = "#bfa062";
      ctx.lineWidth = 2.2 * S;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx + 5 * S, ry + 5 * S, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      var wg = ctx.createRadialGradient(-rx * 0.25, -ry * 0.25, 3, 0, 0, rx);
      wg.addColorStop(0, "#74d4ff");
      wg.addColorStop(0.65, "#36a6f0");
      wg.addColorStop(1, "#1e82cc");
      ctx.fillStyle = wg;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();

      var rPulse = (t * 0.7) % 1;
      ctx.strokeStyle = "rgba(255,255,255," + (0.45 * (1 - rPulse)) + ")";
      ctx.lineWidth = 1.8 * S;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx * (0.35 + rPulse * 0.55), ry * (0.35 + rPulse * 0.55), 0, 0, Math.PI * 2);
      ctx.stroke();

      for(var d = 0; d < 2; d++){
        var da = duckAngle + d * Math.PI;
        var dx = Math.cos(da) * rx * 0.38;
        var dy = Math.sin(da) * ry * 0.34 - Math.sin(cell.bounce * Math.PI) * 14 * S;
        var facing = -Math.sin(da) >= 0 ? 1 : -1;
        var ds = (d === 0 ? 0.92 : 0.68) * S;
        ctx.save();
        ctx.translate(dx, dy);
        ctx.scale(facing, 1);
        ctx.fillStyle = "#ffd43b";
        ctx.strokeStyle = "#5c3a04";
        ctx.lineWidth = 2 * ds;
        ctx.beginPath();
        ctx.ellipse(0, 2 * ds, 10 * ds, 6.8 * ds, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.arc(6.8 * ds, -5 * ds, 5.6 * ds, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#ff7b24";
        ctx.beginPath();
        ctx.ellipse(12 * ds, -4 * ds, 3.4 * ds, 2 * ds, 0.1, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#2c1d11";
        ctx.beginPath();
        ctx.arc(8.2 * ds, -6.4 * ds, 1.3 * ds, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    } else if(cell.prop === "cow"){
      // Mini Red Wooden Barn + Friendly Spotted Cow!
      ctx.save();
      ctx.translate(10 * S, -6 * S);
      var bSc = 1 + Math.sin(cell.bounce * Math.PI) * 0.1;
      ctx.scale(bSc, 2 - bSc);
      ctx.fillStyle = "rgba(38, 76, 26, 0.22)";
      ctx.beginPath();
      ctx.ellipse(0, 18 * S, 28 * S, 8 * S, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#e03e36";
      ctx.strokeStyle = "#4d1b15";
      ctx.lineWidth = 2.2 * S;
      ctx.beginPath();
      ctx.moveTo(-22 * S, 16 * S); ctx.lineTo(-22 * S, -3 * S);
      ctx.lineTo(-13 * S, -18 * S); ctx.lineTo(0, -24 * S);
      ctx.lineTo(13 * S, -18 * S); ctx.lineTo(22 * S, -3 * S);
      ctx.lineTo(22 * S, 16 * S); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#fff9ec";
      ctx.lineWidth = 3 * S;
      ctx.beginPath();
      ctx.moveTo(-24 * S, -2 * S); ctx.lineTo(-14 * S, -18 * S);
      ctx.lineTo(0, -25 * S); ctx.lineTo(14 * S, -18 * S); ctx.lineTo(24 * S, -2 * S);
      ctx.stroke();
      ctx.fillStyle = "#b82820";
      ctx.lineWidth = 2 * S;
      ctx.beginPath();
      ctx.roundRect(-10 * S, 0, 20 * S, 16 * S, 2 * S);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-10 * S, 0); ctx.lineTo(10 * S, 16 * S);
      ctx.moveTo(10 * S, 0); ctx.lineTo(-10 * S, 16 * S);
      ctx.stroke();
      ctx.restore();

      // Spotted Cow
      ctx.save();
      var hop = Math.sin(cell.bounce * Math.PI) * 16 * S;
      ctx.translate(-14 * S, 14 * S - hop);
      ctx.fillStyle = "#fffdf8";
      ctx.strokeStyle = "#2c1d11";
      ctx.lineWidth = 2.1 * S;
      ctx.beginPath();
      ctx.roundRect(-13 * S, -8 * S, 24 * S, 15 * S, 7 * S);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#3d2b1f";
      ctx.beginPath();
      ctx.ellipse(-4 * S, -2 * S, 4.5 * S, 3.4 * S, 0.3, 0, Math.PI * 2);
      ctx.ellipse(4 * S, 1 * S, 3.4 * S, 2.8 * S, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fffdf8";
      ctx.beginPath();
      ctx.arc(11 * S, -6 * S, 7.6 * S, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ffafcc";
      ctx.beginPath();
      ctx.ellipse(13.5 * S, -2.5 * S, 5.2 * S, 3.6 * S, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#2c1d11";
      ctx.beginPath();
      ctx.arc(9.5 * S, -8 * S, 1.3 * S, 0, Math.PI * 2);
      ctx.arc(14 * S, -8 * S, 1.3 * S, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if(cell.prop === "station"){
      var cheer = Math.max(cell.bounce, cell.cheer * 0.55);
      ctx.fillStyle = "rgba(38, 76, 26, 0.22)";
      ctx.beginPath();
      ctx.ellipse(0, 18 * S, 40 * S, 10 * S, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#d9a05b";
      ctx.strokeStyle = "#5c3412";
      ctx.lineWidth = 2.1 * S;
      ctx.beginPath();
      ctx.roundRect(-36 * S, 6 * S, 72 * S, 11 * S, 5 * S);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff2d6";
      ctx.beginPath();
      ctx.roundRect(-26 * S, -14 * S, 52 * S, 21 * S, 4 * S);
      ctx.fill(); ctx.stroke();

      var paxCols = ["#ff922b", "#74c0fc", "#f783ac"];
      for(var p = 0; p < 3; p++){
        var px = (-16 + p * 16) * S;
        var py = 5 * S - Math.abs(Math.sin(t * 9 + p * 1.4)) * cheer * 10 * S;
        ctx.fillStyle = paxCols[p];
        ctx.beginPath();
        ctx.arc(px, py - 4 * S, 5 * S, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }

      ctx.beginPath();
      ctx.moveTo(-32 * S, -12 * S); ctx.lineTo(-24 * S, -24 * S);
      ctx.lineTo(24 * S, -24 * S); ctx.lineTo(32 * S, -12 * S);
      ctx.closePath();
      ctx.fillStyle = "#e8483c";
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff9ec";
      [-16, -4, 8, 20].forEach(function(sx){
        ctx.fillRect(sx * S - 2.6 * S, -23 * S, 5.2 * S, 10 * S);
      });
      ctx.stroke();

      ctx.fillStyle = "#fffdf8";
      ctx.strokeStyle = "#8a501c";
      ctx.lineWidth = 2 * S;
      ctx.beginPath();
      ctx.arc(0, -20 * S, 7.6 * S, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#2c1d11";
      ctx.lineWidth = 1.8 * S;
      ctx.beginPath();
      ctx.moveTo(0, -20 * S); ctx.lineTo(0, -25 * S);
      ctx.moveTo(0, -20 * S); ctx.lineTo(3.6 * S, -20 * S);
      ctx.stroke();
    } else if(cell.prop === "pine"){
      drawPineTree(-14 * S, 6 * S, 0.85, cell.bounce);
      drawPineTree(14 * S, 8 * S, 0.78, cell.bounce);
      drawPineTree(0, -8 * S, 0.96, cell.bounce);
    }

    ctx.restore();
  }

  function drawPineTree(x, y, sz, wiggle){
    var S = play.scale * (sz || 1);
    ctx.save();
    ctx.translate(x, y);
    if(wiggle > 0) ctx.rotate(Math.sin(wiggle * Math.PI * 4) * 0.18 * wiggle);
    ctx.fillStyle = "rgba(38, 76, 26, 0.22)";
    ctx.beginPath();
    ctx.ellipse(0, 14 * S, 15 * S, 5.5 * S, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#8c5628";
    ctx.strokeStyle = "#3f220d";
    ctx.lineWidth = 2 * S;
    ctx.beginPath();
    ctx.roundRect(-4.2 * S, 2 * S, 8.4 * S, 12 * S, 2 * S);
    ctx.fill(); ctx.stroke();
    var tiers = [
      { y: -2, w: 18, h: 16, col: "#2f9e44" },
      { y: -12, w: 14, h: 15, col: "#40c057" },
      { y: -21, w: 10, h: 13, col: "#69db7c" }
    ];
    tiers.forEach(function(tr){
      ctx.fillStyle = tr.col;
      ctx.beginPath();
      ctx.moveTo(0, (tr.y - tr.h) * S);
      ctx.lineTo(tr.w * S, (tr.y + 4) * S);
      ctx.lineTo(-tr.w * S, (tr.y + 4) * S);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    });
    ctx.restore();
  }

  function drawPlantedItems(){
    var S = play.scale;
    plantedItems.forEach(function(item){
      var pop = Math.min(1, item.age / 0.28);
      var scale = pop < 1 ? (1 + Math.sin(pop * Math.PI) * 0.28) * pop : 1;
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.scale(scale, scale);
      if(item.kind === "pine"){
        drawPineTree(0, 0, 0.68, 0);
      } else {
        ctx.strokeStyle = "#2b8a3e";
        ctx.lineWidth = 2.6 * S;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, 6 * S); ctx.lineTo(0, -6 * S);
        ctx.stroke();
        ctx.fillStyle = item.color;
        ctx.strokeStyle = "#4d2c14";
        ctx.lineWidth = 1.4 * S;
        for(var p = 0; p < 5; p++){
          var a = (Math.PI * 2 * p) / 5 + item.rot;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * 6.5 * S, -7 * S + Math.sin(a) * 6.5 * S, 4.6 * S, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        }
        ctx.fillStyle = "#ffd43b";
        ctx.beginPath();
        ctx.arc(0, -7 * S, 4 * S, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    });
  }

  /* ==================== TRAIN ENGINE & 4 WOODEN CARS ==================== */
  function getTrainUnits(){
    if(track.pts.length < 2) return [];
    var spacing = getCarSpacing();
    var units = [];
    // Keep cars consistently trailed behind engine (-i * spacing) so reversing NEVER teleports cars!
    for(var i = 0; i <= state.carCount; i++){
      var sPos = trainS - i * spacing;
      var sample = sampleTrack(sPos);
      units.push({
        index: i,
        x: sample.x,
        y: sample.y,
        angle: sample.angle,
        inTunnel: sample.inTunnel,
        onBridge: sample.onBridge
      });
    }
    if(units[0]){
      lastEnginePos.x = units[0].x;
      lastEnginePos.y = units[0].y;
    }
    return units;
  }

  function drawCoupler(u1, u2){
    if(u1.inTunnel || u2.inTunnel) return;
    var S = play.scale;
    ctx.save();
    ctx.strokeStyle = "#495057";
    ctx.lineWidth = 4 * S;
    ctx.beginPath();
    ctx.moveTo(u1.x, u1.y); ctx.lineTo(u2.x, u2.y);
    ctx.stroke();
    var mx = (u1.x + u2.x) * 0.5, my = (u1.y + u2.y) * 0.5;
    ctx.fillStyle = "#dee2e6";
    ctx.strokeStyle = "#2c1d11";
    ctx.lineWidth = 1.8 * S;
    ctx.beginPath();
    ctx.arc(mx, my, 4.4 * S, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawEngine(u, t){
    var S = play.scale;
    var bounce = 1 + Math.sin(trainBounce * Math.PI) * 0.14;
    if(state.appMode === "build"){
      bounce *= 1 + Math.sin(t * 4.5) * 0.025;
    }
    ctx.save();
    ctx.translate(u.x, u.y);
    ctx.rotate(u.angle);
    ctx.scale(bounce, bounce);

    ctx.fillStyle = "rgba(30, 45, 20, 0.30)";
    ctx.beginPath();
    ctx.roundRect(-27 * S, -14 * S + 5 * S, 56 * S, 30 * S, 10 * S);
    ctx.fill();

    // Warm headlight beam
    var beam = ctx.createRadialGradient(28 * S, 0, 2, 46 * S, 0, 34 * S);
    beam.addColorStop(0, "rgba(255, 245, 165, 0.72)");
    beam.addColorStop(1, "rgba(255, 245, 165, 0)");
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(26 * S, -8 * S); ctx.lineTo(64 * S, -22 * S);
    ctx.lineTo(64 * S, 22 * S); ctx.lineTo(26 * S, 8 * S);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffd43b";
    ctx.strokeStyle = "#2c1d11";
    ctx.lineWidth = 2 * S;
    [[-16, -15], [12, -15], [-16, 15], [12, 15]].forEach(function(w){
      ctx.beginPath();
      ctx.roundRect((w[0] - 6) * S, (w[1] - 3) * S, 12 * S, 6 * S, 2.5 * S);
      ctx.fill(); ctx.stroke();
    });

    ctx.fillStyle = "#f5b727";
    ctx.beginPath();
    ctx.moveTo(24 * S, -11 * S); ctx.lineTo(32 * S, 0); ctx.lineTo(24 * S, 11 * S);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#5c3412";
    ctx.beginPath();
    ctx.roundRect(-26 * S, -14 * S, 51 * S, 28 * S, 7 * S);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#e8483c";
    ctx.beginPath();
    ctx.roundRect(-2 * S, -11.5 * S, 27 * S, 23 * S, 8 * S);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.32)";
    ctx.beginPath();
    ctx.roundRect(1 * S, -8.5 * S, 21 * S, 4.5 * S, 3 * S);
    ctx.fill();

    ctx.fillStyle = "#ffd43b";
    ctx.beginPath();
    ctx.arc(6 * S, 0, 5.5 * S, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#343a40";
    ctx.beginPath();
    ctx.arc(17 * S, 0, 5.8 * S, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#1a1d20";
    ctx.beginPath();
    ctx.arc(17 * S, 0, 3 * S, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#c92a2a";
    ctx.beginPath();
    ctx.roundRect(-25 * S, -13 * S, 24 * S, 26 * S, 6 * S);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#fff3bf";
    ctx.beginPath();
    ctx.roundRect(-21 * S, -9.5 * S, 16 * S, 19 * S, 4 * S);
    ctx.fill();

    // Engineer Hoot!
    ctx.save();
    ctx.translate(-13 * S, 0);
    if(hootWaveTimer > 0) ctx.rotate(Math.sin(t * 22) * 0.25);
    ctx.fillStyle = "#a46a3c";
    ctx.strokeStyle = "#3d220e";
    ctx.lineWidth = 1.8 * S;
    ctx.beginPath();
    ctx.arc(0, 0, 7.6 * S, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    if(hootWaveTimer > 0){
      ctx.fillStyle = "#8a5328";
      ctx.beginPath();
      ctx.ellipse(-1 * S, -10.5 * S, 5 * S, 3 * S, Math.sin(t * 24) * 0.6, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(3.2 * S, -3 * S, 2.7 * S, 0, Math.PI * 2);
    ctx.arc(3.2 * S, 3 * S, 2.7 * S, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#2c1d11";
    ctx.beginPath();
    ctx.arc(4 * S, -3 * S, 1.3 * S, 0, Math.PI * 2);
    ctx.arc(4 * S, 3 * S, 1.3 * S, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ff922b";
    ctx.beginPath();
    ctx.moveTo(6 * S, -1.6 * S); ctx.lineTo(9 * S, 0); ctx.lineTo(6 * S, 1.6 * S);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#228be6";
    ctx.beginPath();
    ctx.arc(-2.5 * S, 0, 5.5 * S, Math.PI * 0.5, Math.PI * 1.5);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function drawTrainCar(u, t){
    var S = play.scale;
    var theme = CAR_THEMES[state.carTheme % CAR_THEMES.length];
    ctx.save();
    ctx.translate(u.x, u.y);
    ctx.rotate(u.angle);

    ctx.fillStyle = "rgba(30, 45, 20, 0.27)";
    ctx.beginPath();
    ctx.roundRect(-21 * S, -13 * S + 5 * S, 42 * S, 26 * S, 8 * S);
    ctx.fill();

    ctx.fillStyle = "#ffd43b";
    ctx.strokeStyle = "#2c1d11";
    ctx.lineWidth = 2 * S;
    [[-11, -13.5], [11, -13.5], [-11, 13.5], [11, 13.5]].forEach(function(w){
      ctx.beginPath();
      ctx.roundRect((w[0] - 5) * S, (w[1] - 2.6) * S, 10 * S, 5.2 * S, 2 * S);
      ctx.fill(); ctx.stroke();
    });

    if(u.index === 1){
      ctx.fillStyle = theme.tender;
      ctx.beginPath();
      ctx.roundRect(-20 * S, -12.5 * S, 40 * S, 25 * S, 6 * S);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#2f3542";
      [[-9, -4], [0, -5], [9, -3], [-6, 4], [4, 4], [0, 0]].forEach(function(cn){
        ctx.beginPath();
        ctx.arc(cn[0] * S, cn[1] * S, 5.2 * S, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      });
    } else if(u.index === 2){
      ctx.fillStyle = theme.caboose;
      ctx.beginPath();
      ctx.roundRect(-21 * S, -13 * S, 42 * S, 26 * S, 7 * S);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff9e6";
      ctx.beginPath();
      ctx.roundRect(-15 * S, -9 * S, 30 * S, 18 * S, 5 * S);
      ctx.fill(); ctx.stroke();
      var bob = Math.sin(t * 7) * 1.4 * S;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(-6.5 * S, bob, 6.2 * S, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ffafcc";
      ctx.beginPath();
      ctx.ellipse(-3 * S, bob, 3.2 * S, 4.2 * S, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffd43b";
      ctx.beginPath();
      ctx.arc(7.5 * S, -bob, 5.8 * S, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ff7b24";
      ctx.beginPath();
      ctx.ellipse(13 * S, -bob, 2.8 * S, 2 * S, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if(u.index === 3){
      ctx.fillStyle = theme.logs;
      ctx.beginPath();
      ctx.roundRect(-21 * S, -13 * S, 42 * S, 26 * S, 5 * S);

      var logCols = ["#ff6b6b", "#ffd43b", "#51cf66", "#38a3f1", "#b197fc"];
      for(var l = 0; l < 5; l++){
        var ly = (-8.5 + l * 4.2) * S;
        ctx.fillStyle = logCols[l];
        ctx.beginPath();
        ctx.roundRect(-17 * S, ly - 2 * S, 34 * S, 4.2 * S, 2 * S);
        ctx.fill(); ctx.stroke();
      }

      ctx.fillStyle = theme.gift;
      ctx.beginPath();
      ctx.roundRect(-21 * S, -13 * S, 42 * S, 26 * S, 7 * S);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ffd43b";
      ctx.fillRect(-3.5 * S, -12 * S, 7 * S, 24 * S);
      ctx.fillRect(-20 * S, -3.5 * S, 40 * S, 7 * S);
      drawStarShape(0, 0, 8.8 * S, 4.2 * S, 5, "#fff3bf", "#8a501c", 2 * S);
    }
    ctx.restore();
  }

  function drawStarShape(cx, cy, outerR, innerR, pts, fill, stroke, lw){
    ctx.beginPath();
    for(var i = 0; i < pts * 2; i++){
      var r = i % 2 === 0 ? outerR : innerR;
      var a = (i * Math.PI) / pts - Math.PI / 2;
      var x = cx + Math.cos(a) * r;
      var y = cy + Math.sin(a) * r;
      if(i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if(stroke){
      ctx.strokeStyle = stroke;
      ctx.lineWidth = lw || 2;
      ctx.stroke();
    }
  }

  function drawTrainUnits(units, t){
    for(var i = 0; i < units.length - 1; i++){
      drawCoupler(units[i], units[i + 1]);
    }
    for(var i = units.length - 1; i >= 0; i--){
      var u = units[i];
      if(u.inTunnel) continue;
      if(u.index === 0) drawEngine(u, t);
      else drawTrainCar(u, t);
    }
  }

  function drawSteamAndParticles(){
    steamPuffs.forEach(function(p){
      var f = p.life / p.maxLife;
      var alpha = Math.max(0, (1 - f) * 0.92);
      var rad = p.r * (0.75 + f * 1.15);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "rgba(180, 200, 215, 0.65)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      ctx.arc(p.x + rad * 0.45, p.y - rad * 0.25, rad * 0.65, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    });

    particles.forEach(function(p){
      var f = p.life / p.maxLife;
      var alpha = Math.max(0, 1 - f * f);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if(p.kind === "drop"){
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(0, 0, p.size * (1 - f * 0.4), 0, Math.PI * 2);
        ctx.fill();
      } else if(p.kind === "note"){
        ctx.fillStyle = p.color;
        ctx.strokeStyle = "#2c1d11";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.ellipse(-3, 5, 5, 3.8, -0.3, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(1.5, 4); ctx.lineTo(1.5, -10); ctx.lineTo(9, -7);
        ctx.stroke();
      } else {
        drawStarShape(0, 0, p.size, p.size * 0.45, 5, p.color, "#5c3412", 1.5);
      }
      ctx.restore();
    });
  }

  /* ==================== FIRST-PERSON DRIVER CAB VIEW (RIDES YOUR CUSTOM TRACK!) ==================== */
  var cabBgImg = new Image();
  var cabBgReady = false;
  cabBgImg.onload = function(){ cabBgReady = true; };
  cabBgImg.src = "assets/train3d/cab_bg.jpg";

  var cab = {
    dist: 2.0,
    bgPan: 0,
    curve: 0,
    bobPhase: 0,
    bellAngle: 0,
    bellVel: 0,
    tunnelAmt: 0,
    bridgeAmt: 0,
    steamAcc: 0,
    steamPuffs: [],
    cowHop: 0,
    barnHop: 0,
    lastGateRing: "",
    hitZones: { bell: null, boiler: null, props: [] }
  };

  function pxPerCabUnit(){
    return Math.max(24, 34 * play.scale);
  }

  function spawnCabSteam(big){
    var boiler = cab.hitZones.boiler;
    var sx = boiler ? boiler.stackX : W * 0.5;
    var sy = boiler ? boiler.stackY : H * 0.62;
    var count = big ? 9 : 1;
    for(var i = 0; i < count; i++){
      var sc = Math.min(W, H) / 760;
      cab.steamPuffs.push({
        x: sx + (Math.random() - 0.5) * (big ? 28 : 10),
        y: sy - (big ? Math.random() * 14 : 4),
        vx: (Math.random() - 0.5) * (big ? 80 : 28) - cab.curve * 65,
        vy: -(big ? 95 + Math.random() * 85 : 55 + Math.random() * 35),
        r: (big ? 20 + Math.random() * 18 : 12 + Math.random() * 9) * Math.max(0.75, sc),
        life: 0,
        maxLife: big ? 1.35 + Math.random() * 0.5 : 0.95 + Math.random() * 0.35
      });
    }
  }

  function ringCabBell(impulse){
    cab.bellVel += (cab.bellAngle >= 0 ? -1 : 1) * (impulse || 7.5);
  }

  function updateCabPhysics(dt, engineSample){
    // Real curvature sampled directly ahead along the kid's custom wooden track!
    var lookPx = Math.max(48, grid.cellSize * 0.72);
    var lookAhead = sampleTrack(trainS + state.dir * lookPx);
    var da = lookAhead.angle - engineSample.angle;
    while(da > Math.PI) da -= Math.PI * 2;
    while(da < -Math.PI) da += Math.PI * 2;
    var targetCurve = Math.max(-1.25, Math.min(1.25, da * 1.15 * state.dir));
    cab.curve += (targetCurve - cab.curve) * Math.min(1, dt * 4.5);

    if(state.appMode === "drive" && state.running && track.pts.length >= 2){
      var vPx = SPEED_PX[state.speed] * play.scale;
      var vCab = (vPx / pxPerCabUnit()) * state.dir;
      cab.dist += vCab * dt;
      cab.bgPan += cab.curve * Math.abs(vCab) * 32 * dt;
      cab.bobPhase += dt * (state.speed === "turbo" ? 19 : (state.speed === "slow" ? 7.5 : 12.5));
      cab.bellVel += Math.sin(cab.bobPhase * 0.5) * 2.2 * dt;

      cab.steamAcc += dt * (state.speed === "turbo" ? 7.5 : (state.speed === "slow" ? 2.6 : 4.5));
      if(cab.steamAcc >= 1){
        cab.steamAcc -= 1;
        if(state.cabView) spawnCabSteam(false);
      }
    }

    cab.bellVel += -26 * cab.bellAngle * dt;
    cab.bellVel *= Math.pow(0.18, dt);
    cab.bellAngle += cab.bellVel * dt;
    cab.bellAngle = Math.max(-0.62, Math.min(0.62, cab.bellAngle));

    // Smooth Tunnel & Bridge immersion driven directly by kid's placed Tunnel & Bridge tiles!
    var targetTun = engineSample.inTunnel ? 1 : 0;
    cab.tunnelAmt += (targetTun - cab.tunnelAmt) * Math.min(1, dt * (targetTun ? 7.0 : 5.5));

    var targetBr = engineSample.onBridge ? 1 : 0;
    cab.bridgeAmt += (targetBr - cab.bridgeAmt) * Math.min(1, dt * 6.5);

    if(cab.cowHop > 0) cab.cowHop = Math.max(0, cab.cowHop - dt * 2.5);
    if(cab.barnHop > 0) cab.barnHop = Math.max(0, cab.barnHop - dt * 2.5);

    for(var i = cab.steamPuffs.length - 1; i >= 0; i--){
      var sp = cab.steamPuffs[i];
      sp.life += dt;
      sp.x += (sp.vx - cab.curve * 48) * dt;
      sp.y += sp.vy * dt;
      sp.vx *= 0.965;
      sp.vy *= 0.985;
      if(sp.life >= sp.maxLife) cab.steamPuffs.splice(i, 1);
    }
  }

  function drawCabView(t, engineSample){
    var portrait = H > W * 1.05;
    var bobY = state.running ? Math.sin(cab.bobPhase) * (state.speed === "turbo" ? 3.8 : 2.2) : 0;
    var bobX = state.running ? Math.cos(cab.bobPhase * 0.5) * 2.2 : 0;
    var horizonY = Math.round(H * (portrait ? 0.415 : 0.435) + bobY * 0.4);
    var groundH = Math.max(120, H - horizonY);
    var zNear = 0.55;
    var zFar = 22.0;
    var baseTrackHalfW = Math.min(W * 0.34, groundH * 0.52);
    var curveAmp = W * (portrait ? 0.36 : 0.31);

    function proj(z, lat){
      var s = zNear / Math.max(0.22, z);
      var u = Math.max(0, 1 - s);
      var cx = W * 0.5 + cab.curve * u * u * curveAmp;
      return {
        x: cx + (lat || 0) * baseTrackHalfW * s,
        cx: cx,
        y: horizonY + groundH * s,
        s: s,
        scale: baseTrackHalfW * s
      };
    }

    // 1. FULL-BLEED PAINTED PIXAR ALPINE VISTA
    if(cabBgReady && cabBgImg.naturalWidth > 0){
      var imgAspect = cabBgImg.naturalWidth / cabBgImg.naturalHeight;
      var bgH = Math.ceil((horizonY + 28) / 0.64);
      var bgW = Math.ceil(bgH * imgAspect);
      if(bgW < W * 1.12){
        bgW = Math.ceil(W * 1.12);
        bgH = Math.ceil(bgW / imgAspect);
      }
      var bgY = Math.round((horizonY + 26) - bgH * 0.64);
      var period = bgW * 2;
      var pan = ((cab.bgPan % period) + period) % period;
      var startX = -pan;
      while(startX > 0) startX -= period;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, horizonY + 28);
      ctx.clip();
      for(var tx = startX; tx < W + bgW; tx += bgW){
        var tileIdx = Math.round((tx - startX) / bgW);
        if(tileIdx % 2 === 0){
          ctx.drawImage(cabBgImg, tx, bgY, bgW + 1, bgH);
        } else {
          ctx.save();
          ctx.translate(tx + bgW, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(cabBgImg, 0, bgY, bgW + 1, bgH);
          ctx.restore();
        }
      }
      ctx.restore();
    } else {
      var skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY + 12);
      skyGrad.addColorStop(0, "#2aa2f0");
      skyGrad.addColorStop(0.65, "#87d8ff");
      skyGrad.addColorStop(1, "#e7f7c9");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, horizonY + 12);
    }

    // 2. SUNLIT MEADOW GROUND (blends smoothly to sparkling blue river water when crossing a Bridge tile!)
    var meadowGrad = ctx.createLinearGradient(0, horizonY, 0, H);
    meadowGrad.addColorStop(0, "#9be066");
    meadowGrad.addColorStop(0.28, "#7ac94f");
    meadowGrad.addColorStop(0.75, "#59a837");
    meadowGrad.addColorStop(1, "#418627");
    ctx.fillStyle = meadowGrad;
    ctx.fillRect(0, horizonY, W, groundH);

    // Sparkling blue brook rushing underneath when passing a kid-placed Bridge tile!
    if(cab.bridgeAmt > 0.03){
      ctx.save();
      ctx.globalAlpha = cab.bridgeAmt * 0.92;
      var riverG = ctx.createLinearGradient(0, horizonY, 0, H);
      riverG.addColorStop(0, "#74d4ff");
      riverG.addColorStop(0.45, "#269ee8");
      riverG.addColorStop(1, "#156cb5");
      ctx.fillStyle = riverG;
      ctx.fillRect(0, horizonY + groundH * 0.08, W, groundH * 0.92);
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 3;
      for(var w = 0; w < 8; w++){
        var wy = horizonY + groundH * (0.18 + w * 0.10);
        var wx = ((t * 90 + w * 130) % (W + 120)) - 60;
        ctx.beginPath();
        ctx.moveTo(wx, wy); ctx.lineTo(wx + 52, wy);
        ctx.stroke();
      }
      ctx.restore();
    } else {
      var bandStep = 1.6;
      var bandOff = ((cab.dist % (bandStep * 2)) + bandStep * 2) % (bandStep * 2);
      for(var bz = zFar; bz >= zNear; bz -= bandStep){
        var z1 = bz - bandOff * 0.5;
        var z0 = z1 - bandStep * 0.5;
        if(z1 < zNear || z0 > zFar) continue;
        var p1 = proj(Math.max(zNear, z1), 0);
        var p0 = proj(Math.max(zNear, z0), 0);
        if(p0.y <= p1.y) continue;
        ctx.fillStyle = "rgba(255, 250, 190, 0.085)";
        ctx.fillRect(0, p1.y, W, p0.y - p1.y);
      }
    }

    // Horizon hillside seam
    ctx.save();
    ctx.fillStyle = "#8fd45e";
    ctx.beginPath();
    ctx.moveTo(0, horizonY + 12);
    for(var hx = 0; hx <= W + 40; hx += 40){
      var wave = Math.sin((hx + cab.bgPan * 0.35) * 0.008) * 7 + Math.cos((hx - cab.bgPan * 0.2) * 0.015) * 4;
      ctx.lineTo(hx, horizonY - 2 + wave);
    }
    ctx.lineTo(W, horizonY + 18);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 3. PERSPECTIVE WOODEN TRACK BED, CROSSTIES & RAILS
    var railSamples = 36;
    var leftBed = [], rightBed = [], leftRail = [], rightRail = [], leftBridge = [], rightBridge = [];
    for(var i = 0; i <= railSamples; i++){
      var frac = i / railSamples;
      var z = zFar * Math.pow(zNear / zFar, frac);
      var cP = proj(z, 0);
      leftBed.push({ x: cP.cx - cP.scale * 1.18, y: cP.y });
      rightBed.push({ x: cP.cx + cP.scale * 1.18, y: cP.y });
      leftRail.push({ x: cP.cx - cP.scale * 0.62, y: cP.y, s: cP.s });
      rightRail.push({ x: cP.cx + cP.scale * 0.62, y: cP.y, s: cP.s });
      leftBridge.push({ x: cP.cx - cP.scale * 1.24, y: cP.y, s: cP.s });
      rightBridge.push({ x: cP.cx + cP.scale * 1.24, y: cP.y, s: cP.s });
    }

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(leftBed[0].x, leftBed[0].y);
    for(var i = 1; i < leftBed.length; i++) ctx.lineTo(leftBed[i].x, leftBed[i].y);
    for(var i = rightBed.length - 1; i >= 0; i--) ctx.lineTo(rightBed[i].x, rightBed[i].y);
    ctx.closePath();
    var bedGrad = ctx.createLinearGradient(0, horizonY, 0, H);
    bedGrad.addColorStop(0, "#d4b47c");
    bedGrad.addColorStop(0.5, "#c59858");
    bedGrad.addColorStop(1, "#9b6d37");
    ctx.fillStyle = bedGrad;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(leftRail[0].x, leftRail[0].y);
    for(var i = 1; i < leftRail.length; i++) ctx.lineTo(leftRail[i].x, leftRail[i].y);
    for(var i = rightRail.length - 1; i >= 0; i--) ctx.lineTo(rightRail[i].x, rightRail[i].y);
    ctx.closePath();
    ctx.fillStyle = "rgba(246, 214, 162, 0.45)";
    ctx.fill();
    ctx.restore();

    var tieSpacing = 0.62;
    var firstTieIdx = Math.ceil((cab.dist + zNear * 0.7) / tieSpacing);
    var maxTies = Math.ceil(zFar / tieSpacing);
    for(var ti = maxTies; ti >= 0; ti--){
      var worldZ = (firstTieIdx + ti) * tieSpacing;
      var relZ = worldZ - cab.dist;
      if(relZ < zNear * 0.85 || relZ > zFar) continue;
      var tp = proj(relZ, 0);
      var tieW = tp.scale * 1.96;
      var tieH = Math.max(1.5, tp.scale * 0.145);
      ctx.fillStyle = "rgba(52, 28, 10, 0.34)";
      ctx.fillRect(tp.cx - tieW * 0.5, tp.y + tieH * 0.35, tieW, tieH * 0.6);
      ctx.fillStyle = ti % 2 === 0 ? "#8d5627" : "#7e4b20";
      ctx.fillRect(tp.cx - tieW * 0.5, tp.y - tieH * 0.5, tieW, tieH);
      if(tieH > 3){
        ctx.fillStyle = "#c98c4a";
        ctx.fillRect(tp.cx - tieW * 0.5, tp.y - tieH * 0.5, tieW, Math.max(1.2, tieH * 0.28));
      }
    }

    [leftRail, rightRail].forEach(function(pts){
      ctx.beginPath();
      for(var i = 0; i < pts.length; i++){
        var hw = Math.max(1.1, pts[i].s * 9.5);
        if(i === 0) ctx.moveTo(pts[i].x - hw, pts[i].y);
        else ctx.lineTo(pts[i].x - hw, pts[i].y);
      }
      for(var i = pts.length - 1; i >= 0; i--){
        var hw = Math.max(1.1, pts[i].s * 9.5);
        ctx.lineTo(pts[i].x + hw, pts[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = "#4d311a";
      ctx.fill();

      ctx.beginPath();
      for(var i = 0; i < pts.length; i++){
        var hw = Math.max(0.7, pts[i].s * 5.6);
        if(i === 0) ctx.moveTo(pts[i].x - hw, pts[i].y);
        else ctx.lineTo(pts[i].x - hw, pts[i].y);
      }
      for(var i = pts.length - 1; i >= 0; i--){
        var hw = Math.max(0.7, pts[i].s * 5.6);
        ctx.lineTo(pts[i].x + hw, pts[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = "#dce6f0";
      ctx.fill();
    });

    // Wooden Bridge Handrails whenever riding across a kid-placed Bridge tile!
    if(cab.bridgeAmt > 0.08){
      ctx.save();
      ctx.globalAlpha = Math.min(1, cab.bridgeAmt * 1.1);
      [leftBridge, rightBridge].forEach(function(pts){
        ctx.strokeStyle = "#7a4416";
        ctx.lineWidth = 8;
        ctx.beginPath();
        for(var i = 0; i < pts.length; i++){
          var ry = pts[i].y - pts[i].s * 56;
          if(i === 0) ctx.moveTo(pts[i].x, ry);
          else ctx.lineTo(pts[i].x, ry);
        }
        ctx.stroke();
        ctx.strokeStyle = "#eab268";
        ctx.lineWidth = 3.6;
        ctx.stroke();
      });
      ctx.restore();
    }

    // 4. ROADSIDE SCENERY FROM KID'S ACTUAL CUSTOM TRACK & MEADOW!
    var drawList = [];
    var ppu = pxPerCabUnit();

    // Custom placed meadow props projected onto track!
    track.propMarkers.forEach(function(pm){
      var dPx = forwardDistAlongTrack(pm.s, trainS, state.dir);
      var dz = dPx / ppu;
      if(dz > 0.5 && dz < zFar){
        drawList.push({ z: dz, prop: { kind: pm.kind === "cow" ? "barnAndCow" : pm.kind, lat: pm.lat } });
      }
    });

    // Kid-placed Tunnel portals & Crossing gates ahead!
    track.featureEvents.forEach(function(fe){
      var dPx = forwardDistAlongTrack(fe.s, trainS, state.dir);
      var dz = dPx / ppu;
      if(dz <= 0.35 || dz >= zFar) return;
      if(fe.kind === "crossing"){
        drawList.push({ z: dz, prop: { kind: "crossing", lat: 0 } });
      } else if((fe.kind === "tunnelStart" && state.dir === 1) || (fe.kind === "tunnelEnd" && state.dir === -1)){
        drawList.push({ z: dz, prop: { kind: "tunnelPortal", lat: 0 } });
      }
    });

    // Subtle ambient distant meadow pines so even a blank track has warm speed cues
    var treeSpacing = 5.5;
    var baseIdx = Math.floor(cab.dist / treeSpacing);
    for(var k = 0; k < 5; k++){
      var idx = baseIdx + k * state.dir;
      var dz = ((idx + 0.5 * state.dir) * treeSpacing - cab.dist) * state.dir;
      if(dz > 1.2 && dz < zFar){
        var side = ((Math.abs(idx) % 2) === 0 ? -1 : 1);
        drawList.push({ z: dz, prop: { kind: "pine", lat: side * 3.1, sz: 0.92 } });
      }
    }

    drawList.sort(function(a, b){ return b.z - a.z; });
    cab.hitZones.props = [];

    drawList.forEach(function(item){
      var pr = item.prop;
      var z = item.z;
      var p = proj(z, pr.lat);
      var sc = p.scale;
      if(sc < 2) return;

      if(pr.kind === "pine"){
        drawCabPine(p.x, p.y, sc * (pr.sz || 1));
      } else if(pr.kind === "barnAndCow"){
        var bHop = 1 + Math.sin(cab.barnHop * Math.PI) * 0.08;
        drawCabBarn(p.x, p.y, sc * 0.96 * bHop, pr.lat < 0 ? -1 : 1);
        var hop = Math.sin(cab.cowHop * Math.PI) * sc * 0.38;
        var cowX = p.x + (pr.lat < 0 ? sc * 1.05 : -sc * 1.05);
        drawCabCow(cowX, p.y - hop, sc * 0.92, pr.lat < 0 ? 1 : -1);
        if(z < 14){
          cab.hitZones.props.push({ kind: "cow", x: cowX, y: p.y - sc * 0.45, r: Math.max(30, sc * 0.85) });
          cab.hitZones.props.push({ kind: "barn", x: p.x, y: p.y - sc * 0.9, r: Math.max(36, sc * 1.1) });
        }
      } else if(pr.kind === "pond"){
        drawCabDuckPond(p.x, p.y, sc, t);
        if(z < 14){
          cab.hitZones.props.push({ kind: "pond", x: p.x, y: p.y - sc * 0.25, r: Math.max(32, sc * 0.95) });
        }
      } else if(pr.kind === "station"){
        drawCabStation(p.x, p.y, sc);
        if(z < 15){
          cab.hitZones.props.push({ kind: "station", x: p.x, y: p.y - sc * 0.7, r: Math.max(36, sc * 1.15) });
        }
      } else if(pr.kind === "crossing"){
        drawCabCrossingGate(p.cx, p.y, sc, z, t);
        if(z < 13){
          cab.hitZones.props.push({ kind: "crossing", x: p.cx, y: p.y - sc * 0.7, r: Math.max(40, sc * 1.3) });
        }
      } else if(pr.kind === "tunnelPortal"){
        drawCabTunnelPortal(p.cx, p.y, sc);
      }
    });

    // 5. COZY DARK-WOOD TUNNEL PASS-THROUGH WHEN RIDING THROUGH KID'S TUNNEL TILE!
    if(cab.tunnelAmt > 0.015){
      drawCabTunnelInterior(horizonY, groundH, proj, t);
    }

    // 6. FOREGROUND STEAM CLOUDS + RED STEAM ENGINE BOILER NOSE + GOLDEN BRASS BELL + CAB FRAME
    drawCabSteamPuffs();
    drawCabForegroundEngineAndFrame(t, bobX, bobY, horizonY);
    drawSteamAndParticles();
  }

  function drawCabDuckPond(x, y, sc, t){
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#e8cf99";
    ctx.beginPath();
    ctx.ellipse(0, 0, sc * 1.25, sc * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#2ba4eb";
    ctx.beginPath();
    ctx.ellipse(0, 0, sc * 1.08, sc * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();
    // Cute swimming yellow duck
    var dx = Math.sin(t * 1.6) * sc * 0.38;
    ctx.fillStyle = "#ffd43b";
    ctx.strokeStyle = "#5c3a04";
    ctx.lineWidth = Math.max(1, sc * 0.05);
    ctx.beginPath();
    ctx.ellipse(dx, -sc * 0.14, sc * 0.28, sc * 0.18, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.arc(dx + sc * 0.2, -sc * 0.32, sc * 0.16, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawCabStation(x, y, sc){
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#fff2d6";
    ctx.strokeStyle = "#5c3412";
    ctx.lineWidth = Math.max(1.2, sc * 0.06);
    ctx.beginPath();
    ctx.roundRect(-sc * 1.05, -sc * 1.15, sc * 2.1, sc * 1.15, sc * 0.12);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#e8483c";
    ctx.beginPath();
    ctx.moveTo(-sc * 1.25, -sc * 1.1);
    ctx.lineTo(-sc * 0.88, -sc * 1.75);
    ctx.lineTo(sc * 0.88, -sc * 1.75);
    ctx.lineTo(sc * 1.25, -sc * 1.1);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fffdf8";
    ctx.beginPath();
    ctx.arc(0, -sc * 1.48, sc * 0.28, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawCabPine(x, y, sc){
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "rgba(32, 68, 22, 0.28)";
    ctx.beginPath();
    ctx.ellipse(0, 0, sc * 0.62, sc * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#7a471f";
    ctx.strokeStyle = "#3a1e09";
    ctx.lineWidth = Math.max(1, sc * 0.055);
    ctx.fillRect(-sc * 0.14, -sc * 0.48, sc * 0.28, sc * 0.5);

  function drawCabCrossingGate(cx, y, sc, z, t){
    ctx.save();
    ctx.translate(cx, y);
    ctx.fillStyle = "rgba(232, 207, 155, 0.82)";
    ctx.fillRect(-sc * 3.8, -sc * 0.16, sc * 7.6, sc * 0.34);
    var lowerAmt = Math.max(0, Math.min(1, (14 - z) / 8));
    var flashOn = Math.sin(t * 12) > 0;
    [-1, 1].forEach(function(side){
      var px = side * sc * 1.48;
      ctx.fillStyle = "#5c3412";
      ctx.strokeStyle = "#2c1d11";
      ctx.lineWidth = Math.max(1, sc * 0.05);
      ctx.beginPath();
      ctx.roundRect(px - sc * 0.11, -sc * 1.95, sc * 0.22, sc * 1.98, sc * 0.06);
      ctx.fill(); ctx.stroke();

      ctx.save();
      ctx.translate(px, -sc * 1.65);
      ctx.strokeStyle = "#fffdf8";
      ctx.lineWidth = Math.max(1.8, sc * 0.13);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-sc * 0.32, -sc * 0.22); ctx.lineTo(sc * 0.32, sc * 0.22);
      ctx.moveTo(sc * 0.32, -sc * 0.22); ctx.lineTo(-sc * 0.32, sc * 0.22);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "#2c1d11";
      ctx.beginPath();
      ctx.roundRect(px - sc * 0.36, -sc * 1.32, sc * 0.72, sc * 0.26, sc * 0.11);
      ctx.fill();
      [[-0.19, flashOn], [0.19, !flashOn]].forEach(function(lp){
        if(lp[1] && lowerAmt > 0.1){
          ctx.fillStyle = "rgba(255, 59, 48, 0.45)";
          ctx.beginPath();
          ctx.arc(px + sc * lp[0], -sc * 1.19, sc * 0.24, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = (lp[1] && lowerAmt > 0.1) ? "#ff3b30" : "#6b2320";
        ctx.beginPath();
        ctx.arc(px + sc * lp[0], -sc * 1.19, sc * 0.10, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.save();
      ctx.translate(px, -sc * 0.72);
      var rot = side === -1 ? -(1 - lowerAmt) * 1.15 : Math.PI + (1 - lowerAmt) * 1.15;
      ctx.rotate(rot);
      var armLen = sc * 1.15;
      ctx.fillStyle = "#fffdf8";
      ctx.strokeStyle = "#2c1d11";
      ctx.lineWidth = Math.max(1, sc * 0.045);
      ctx.beginPath();
      ctx.roundRect(0, -sc * 0.09, armLen, sc * 0.18, sc * 0.06);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#e8483c";
      for(var sx = 0.18; sx < 1.0; sx += 0.32){
        ctx.fillRect(sc * sx, -sc * 0.075, sc * 0.15, sc * 0.15);
      }
      ctx.restore();
    });
    ctx.restore();
  }

  function drawCabTunnelInterior(horizonY, groundH, proj, t){
    var alpha = cab.tunnelAmt;
    var vp = proj(18, 0);
    ctx.save();
    ctx.globalAlpha = Math.min(0.95, alpha * 0.96);
    var bgG = ctx.createRadialGradient(vp.cx, horizonY - 12, Math.min(W, H) * 0.08, vp.cx, horizonY, Math.max(W, H) * 0.85);
    bgG.addColorStop(0, "#3b2414");
    bgG.addColorStop(0.45, "#23140b");
    bgG.addColorStop(1, "#120905");
    ctx.fillStyle = bgG;
    ctx.fillRect(0, 0, W, H);

    var zNear = 0.55, zFar = 20;
    var tieSpacing = 0.62;
    var firstTieIdx = Math.ceil((cab.dist + zNear * 0.7) / tieSpacing);
    for(var ti = 26; ti >= 0; ti--){
      var relZ = (firstTieIdx + ti) * tieSpacing - cab.dist;
      if(relZ < zNear || relZ > zFar) continue;
      var tp = proj(relZ, 0);
      var glow = Math.max(0.18, 1 - relZ / 15);
      ctx.fillStyle = "rgba(195, 134, 68, " + (glow * 0.85) + ")";
      ctx.fillRect(tp.cx - tp.scale * 0.95, tp.y - tp.scale * 0.07, tp.scale * 1.9, Math.max(1.5, tp.scale * 0.14));
    }
    [-0.62, 0.62].forEach(function(lat){
      ctx.beginPath();
      for(var i = 0; i <= 20; i++){
        var z = zFar * Math.pow(zNear / zFar, i / 20);
        var rp = proj(z, lat);
        if(i === 0) ctx.moveTo(rp.x, rp.y);
        else ctx.lineTo(rp.x, rp.y);
      }
      ctx.strokeStyle = "rgba(255, 240, 175, 0.75)";
      ctx.lineWidth = 4;
      ctx.stroke();
    });

    var ribSpacing = 1.65;
    var firstRib = Math.ceil((cab.dist + 0.5) / ribSpacing);
    for(var ri = 14; ri >= 0; ri--){
      var rz = (firstRib + ri) * ribSpacing - cab.dist;
      if(rz < 0.45 || rz > 18) continue;
      var rp = proj(rz, 0);
      var archR = rp.scale * 1.95;
      var baseH = rp.scale * 1.35;
      var lum = Math.max(0.25, 1 - rz / 17);
      ctx.strokeStyle = "rgba(" + Math.round(145 * lum) + "," + Math.round(86 * lum) + "," + Math.round(38 * lum) + "," + (0.94 * alpha) + ")";
      ctx.lineWidth = Math.max(3, rp.scale * 0.24);
      ctx.beginPath();
      ctx.moveTo(rp.cx - archR, rp.y + rp.scale * 0.2);
      ctx.lineTo(rp.cx - archR, rp.y - baseH);
      ctx.arc(rp.cx, rp.y - baseH, archR, Math.PI, 0);
      ctx.lineTo(rp.cx + archR, rp.y + rp.scale * 0.2);
      ctx.stroke();
    }

    var exitR = Math.min(W, H) * 0.11;
    var exitY = horizonY - exitR * 0.22;
    var exitG = ctx.createRadialGradient(vp.cx, exitY, exitR * 0.15, vp.cx, exitY, exitR * 1.65);
    exitG.addColorStop(0, "#ffffff");
    exitG.addColorStop(0.45, "#a6e6ff");
    exitG.addColorStop(0.78, "rgba(135, 224, 120, 0.55)");
    exitG.addColorStop(1, "rgba(135, 224, 120, 0)");
    ctx.fillStyle = exitG;
    ctx.beginPath();
    ctx.arc(vp.cx, exitY, exitR * 1.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalCompositeOperation = "screen";
    var beamOriginY = H * 0.64;
    var beamG = ctx.createRadialGradient(W * 0.5, beamOriginY - 12, 10, vp.cx, horizonY + groundH * 0.14, Math.max(W, H) * 0.56);
    beamG.addColorStop(0, "rgba(255, 248, 180, " + (0.72 * alpha) + ")");
    beamG.addColorStop(0.32, "rgba(255, 228, 125, " + (0.36 * alpha) + ")");
    beamG.addColorStop(0.72, "rgba(255, 205, 85, " + (0.10 * alpha) + ")");
    beamG.addColorStop(1, "rgba(255, 195, 70, 0)");
    ctx.fillStyle = beamG;
    ctx.beginPath();
    ctx.moveTo(W * 0.5 - 24, beamOriginY);
    ctx.quadraticCurveTo(vp.cx - W * 0.34, horizonY + groundH * 0.08, vp.cx - W * 0.24, horizonY - H * 0.18);
    ctx.quadraticCurveTo(vp.cx, horizonY - H * 0.28, vp.cx + W * 0.24, horizonY - H * 0.18);
    ctx.quadraticCurveTo(vp.cx + W * 0.34, horizonY + groundH * 0.08, W * 0.5 + 24, beamOriginY);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawCabSteamPuffs(){
    cab.steamPuffs.forEach(function(p){
      var f = p.life / p.maxLife;
      var alpha = Math.max(0, (1 - f * f) * 0.88);
      var rad = p.r * (0.68 + f * 1.55);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "rgba(205, 224, 240, 0.72)";
      ctx.beginPath();
      ctx.arc(p.x, p.y + rad * 0.18, rad * 0.96, 0, Math.PI * 2);
      ctx.arc(p.x - rad * 0.56, p.y + rad * 0.26, rad * 0.66, 0, Math.PI * 2);
      ctx.arc(p.x + rad * 0.58, p.y + rad * 0.24, rad * 0.70, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      ctx.arc(p.x - rad * 0.56, p.y + rad * 0.14, rad * 0.68, 0, Math.PI * 2);
      ctx.arc(p.x + rad * 0.58, p.y + rad * 0.11, rad * 0.72, 0, Math.PI * 2);
      ctx.arc(p.x + rad * 0.12, p.y - rad * 0.32, rad * 0.62, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawCabForegroundEngineAndFrame(t, bobX, bobY, horizonY){
    var conRect = driveConsoleEl.getBoundingClientRect();
    var sillY = Math.min(H - 76, Math.max(H * 0.68, conRect.top + 8));
    var portrait = H > W * 1.05;
    var u = Math.min(W, H) / 760;
    var bounceY = -Math.sin(trainBounce * Math.PI) * 14 * u;
    var cx = W * 0.5 + bobX;
    var engBaseY = sillY + 12 + bobY + bounceY;

    var backW = Math.min(W * (portrait ? 0.33 : 0.185), 215);
    var frontW = backW * 0.48;
    var noseY = Math.max(horizonY + (sillY - horizonY) * (portrait ? 0.36 : 0.42), sillY - (portrait ? 142 : 132) * Math.max(0.72, u));
    var frontCenterY = noseY + frontW * 0.44;

    ctx.save();
    ctx.fillStyle = "rgba(25, 38, 18, 0.34)";
    ctx.beginPath();
    ctx.ellipse(cx, engBaseY + 4, backW * 1.15, 24 * u, 0, 0, Math.PI * 2);
    ctx.fill();

    var boilGrad = ctx.createLinearGradient(cx - backW, 0, cx + backW, 0);
    boilGrad.addColorStop(0, "#8f1812");
    boilGrad.addColorStop(0.24, "#e8483c");
    boilGrad.addColorStop(0.46, "#ff7163");
    boilGrad.addColorStop(0.76, "#d63026");
    boilGrad.addColorStop(1, "#7c140e");
    ctx.fillStyle = boilGrad;
    ctx.strokeStyle = "#4d120c";
    ctx.lineWidth = Math.max(2.6, 3.6 * u);
    ctx.beginPath();
    ctx.moveTo(cx - backW, engBaseY + 18);
    ctx.lineTo(cx - frontW, frontCenterY);
    ctx.arc(cx, frontCenterY, frontW, Math.PI, 0, false);
    ctx.lineTo(cx + backW, engBaseY + 18);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "rgba(255, 255, 255, 0.24)";
    ctx.beginPath();
    ctx.moveTo(cx - backW * 0.44, engBaseY);
    ctx.lineTo(cx - frontW * 0.44, frontCenterY - frontW * 0.48);
    ctx.lineTo(cx - frontW * 0.08, frontCenterY - frontW * 0.54);
    ctx.lineTo(cx - backW * 0.05, engBaseY);
    ctx.closePath();
    ctx.fill();

    [0.26, 0.62].forEach(function(bf){
      var by = frontCenterY + (engBaseY - frontCenterY) * bf;
      var bw = frontW + (backW - frontW) * bf;
      ctx.strokeStyle = "#f5b727";
      ctx.lineWidth = Math.max(4, 7 * u);
      ctx.beginPath();
      ctx.ellipse(cx, by, bw, bw * 0.22, 0, Math.PI * 1.06, Math.PI * 1.94);
      ctx.stroke();
      ctx.strokeStyle = "#fff3a6";
      ctx.lineWidth = Math.max(1.5, 2.4 * u);
      ctx.beginPath();
      ctx.ellipse(cx, by - 1.5, bw * 0.98, bw * 0.20, 0, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    });

    ctx.fillStyle = "#343a40";
    ctx.strokeStyle = "#1c1f23";
    ctx.lineWidth = Math.max(2, 2.8 * u);
    ctx.beginPath();
    ctx.ellipse(cx, frontCenterY - frontW * 0.34, frontW * 0.78, frontW * 0.34, 0, Math.PI, 0);
    ctx.fill(); ctx.stroke();

    var lampY = frontCenterY - frontW * 0.68;
    var lampR = Math.max(9, frontW * 0.22);
    if(cab.tunnelAmt > 0.05){
      var halo = ctx.createRadialGradient(cx, lampY, lampR * 0.2, cx, lampY, lampR * 3.4);
      halo.addColorStop(0, "rgba(255, 248, 175, " + (0.85 * cab.tunnelAmt) + ")");
      halo.addColorStop(1, "rgba(255, 230, 120, 0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cx, lampY, lampR * 3.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#f5b727";
    ctx.strokeStyle = "#5c3605";
    ctx.lineWidth = Math.max(2, 2.6 * u);
    ctx.beginPath();
    ctx.arc(cx, lampY, lampR, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = cab.tunnelAmt > 0.2 ? "#fffbe0" : "#ffe680";
    ctx.beginPath();
    ctx.arc(cx, lampY, lampR * 0.56, 0, Math.PI * 2);
    ctx.fill();

    // Tall Cast-Iron Smokestack
    var stackBaseY = frontCenterY - frontW * 0.42;
    var stackH = Math.max(46, frontW * 1.05);
    var stackTopY = stackBaseY - stackH;
    var stackW = Math.max(15, frontW * 0.28);

    var stGrad = ctx.createLinearGradient(cx - stackW, 0, cx + stackW, 0);
    stGrad.addColorStop(0, "#1f2428");
    stGrad.addColorStop(0.38, "#4b535c");
    stGrad.addColorStop(0.75, "#2b3036");
    stGrad.addColorStop(1, "#14171a");
    ctx.fillStyle = stGrad;
    ctx.strokeStyle = "#111315";
    ctx.lineWidth = Math.max(2, 2.8 * u);
    ctx.beginPath();
    ctx.moveTo(cx - stackW * 0.85, stackBaseY);
    ctx.lineTo(cx - stackW * 0.65, stackTopY + stackH * 0.24);
    ctx.lineTo(cx - stackW * 1.22, stackTopY);
    ctx.lineTo(cx + stackW * 1.22, stackTopY);
    ctx.lineTo(cx + stackW * 0.65, stackTopY + stackH * 0.24);
    ctx.lineTo(cx + stackW * 0.85, stackBaseY);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#f5b727";
    ctx.strokeStyle = "#5c3605";
    ctx.beginPath();
    ctx.ellipse(cx, stackTopY, stackW * 1.22, stackW * 0.34, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#1a1d20";
    ctx.beginPath();
    ctx.ellipse(cx, stackTopY, stackW * 0.78, stackW * 0.19, 0, 0, Math.PI * 2);
    ctx.fill();

    cab.hitZones.boiler = {
      x: cx,
      y: (engBaseY + frontCenterY) * 0.5,
      rx: backW * 0.85,
      ry: (engBaseY - stackTopY) * 0.55,
      stackX: cx,
      stackY: stackTopY - 4
    };

    // Golden Brass Bell
    var bellBaseY = frontCenterY + (engBaseY - frontCenterY) * 0.34;
    var bellR = Math.max(16, frontW * 0.34);
    ctx.strokeStyle = "#8a5308";
    ctx.lineWidth = Math.max(3, 5 * u);
    ctx.beginPath();
    ctx.moveTo(cx - bellR * 1.15, bellBaseY + 4);
    ctx.quadraticCurveTo(cx - bellR * 1.15, bellBaseY - bellR * 1.35, cx, bellBaseY - bellR * 1.35);
    ctx.quadraticCurveTo(cx + bellR * 1.15, bellBaseY - bellR * 1.35, cx + bellR * 1.15, bellBaseY + 4);
    ctx.stroke();
    ctx.strokeStyle = "#ffe066";
    ctx.lineWidth = Math.max(1.5, 2.4 * u);
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, bellBaseY - bellR * 1.25);
    ctx.rotate(cab.bellAngle);
    var bellGrad = ctx.createLinearGradient(-bellR, 0, bellR, 0);
    bellGrad.addColorStop(0, "#b8760b");
    bellGrad.addColorStop(0.35, "#fff4a3");
    bellGrad.addColorStop(0.68, "#f5b727");
    bellGrad.addColorStop(1, "#9a5d05");
    ctx.fillStyle = bellGrad;
    ctx.strokeStyle = "#5c3404";
    ctx.lineWidth = Math.max(2, 2.6 * u);
    ctx.beginPath();
    ctx.moveTo(-bellR * 0.34, 0);
    ctx.bezierCurveTo(-bellR * 0.45, bellR * 0.7, -bellR * 0.92, bellR * 0.95, -bellR * 0.98, bellR * 1.15);
    ctx.quadraticCurveTo(0, bellR * 1.36, bellR * 0.98, bellR * 1.15);
    ctx.bezierCurveTo(bellR * 0.92, bellR * 0.95, bellR * 0.45, bellR * 0.7, bellR * 0.34, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#5c3404";
    ctx.beginPath();
    ctx.arc(0, bellR * 1.24, bellR * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    cab.hitZones.bell = { x: cx, y: bellBaseY - bellR * 0.55, r: Math.max(34, bellR * 1.55) };
    ctx.restore();

    // Warm Wooden Cab Window Frame Pillars & Lower Sill
    var pillarW = Math.round(Math.max(16, Math.min(48, W * (portrait ? 0.048 : 0.038))));
    var topBeamH = Math.round(Math.max(24, Math.min(42, H * 0.042)));
    var woodDark = "#5e3312";

    ctx.save();
    [0, W - pillarW].forEach(function(px, idx){
      var pg = ctx.createLinearGradient(px, 0, px + pillarW, 0);
      if(idx === 0){
        pg.addColorStop(0, "#7c4519"); pg.addColorStop(0.65, "#c68440"); pg.addColorStop(1, "#e8b572");
      } else {
        pg.addColorStop(0, "#e8b572"); pg.addColorStop(0.35, "#c68440"); pg.addColorStop(1, "#7c4519");
      }
      ctx.fillStyle = pg;
      ctx.fillRect(px, 0, pillarW, H);
      ctx.strokeStyle = woodDark;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      var edgeX = idx === 0 ? pillarW : W - pillarW;
      ctx.moveTo(edgeX, 0); ctx.lineTo(edgeX, H);
      ctx.stroke();

      ctx.fillStyle = "#ffd43b";
      ctx.strokeStyle = "#613904";
      ctx.lineWidth = 1.6;
      for(var ry = H * 0.24; ry < sillY - 30; ry += H * 0.22){
        ctx.beginPath();
        ctx.arc(px + pillarW * 0.5, ry, Math.max(3, pillarW * 0.14), 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }
    });

    var archG = ctx.createLinearGradient(0, 0, 0, topBeamH + 22);
    archG.addColorStop(0, "#6e3c14"); archG.addColorStop(0.7, "#b67534"); archG.addColorStop(1, "#d99d56");
    ctx.fillStyle = archG;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, topBeamH + 26);
    ctx.quadraticCurveTo(W * 0.5, topBeamH - 18, 0, topBeamH + 26);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = woodDark; ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(0, topBeamH + 26); ctx.quadraticCurveTo(W * 0.5, topBeamH - 18, W, topBeamH + 26);
    ctx.stroke();

    var sillG = ctx.createLinearGradient(0, sillY, 0, H);
    sillG.addColorStop(0, "#e7b16a"); sillG.addColorStop(0.22, "#c27f3b"); sillG.addColorStop(1, "#7b451a");
    ctx.fillStyle = sillG;
    ctx.beginPath();
    ctx.moveTo(0, sillY + 6);
    ctx.quadraticCurveTo(W * 0.5, sillY - 12, W, sillY + 6);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = woodDark; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, sillY + 6); ctx.quadraticCurveTo(W * 0.5, sillY - 12, W, sillY + 6);
    ctx.stroke();

    if(!portrait && W >= 780){
      var gx = pillarW + 56, gy = sillY - 12, gr = 24;
      ctx.fillStyle = "#fffaf0"; ctx.strokeStyle = "#8a501c"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#ffd43b"; ctx.lineWidth = 2; ctx.stroke();
      var needleAng = !state.running ? -Math.PI * 0.78
        : (state.speed === "slow" ? -Math.PI * 0.45 : (state.speed === "cruise" ? -Math.PI * 0.1 : Math.PI * 0.25));
      needleAng += Math.sin(t * 9) * (state.running ? 0.04 : 0);
      ctx.strokeStyle = "#e8483c"; ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(gx, gy);
      ctx.lineTo(gx + Math.cos(needleAng) * (gr - 6), gy + Math.sin(needleAng) * (gr - 6));
      ctx.stroke();
      ctx.fillStyle = "#2c1d11"; ctx.beginPath(); ctx.arc(gx, gy, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
