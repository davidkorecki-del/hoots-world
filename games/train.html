<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="train";window.__HOOT_SELF_COACH__=true;</script>
<script src="js/hoot-game-head.js?v=llprev3e149"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Hoot's Wooden Train Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#2c1d11;
    --wood-light:#f6d6a2;
    --wood-mid:#dfa663;
    --wood-deep:#a96c34;
    --wood-dark:#6b3e18;
    --cream:#fffaf0;
    --red:#e8483c;
    --red-dark:#b3281e;
    --green:#42b859;
    --green-dark:#26843a;
    --sky:#36a6f0;
    --sky-dark:#1a72b5;
    --brass-top:#fff09a;
    --brass-mid:#f5b727;
    --brass-deep:#b8760b;
    --sun:#ffd43b;
  }
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
  }
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    background:#84cf5c;
    color:var(--ink);
    touch-action:manipulation;
  }

  #stage{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:linear-gradient(180deg,#9de070 0%,#7ec954 55%,#6ab745 100%);
  }

  #worldCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:1;
    cursor:pointer;
    touch-action:none;
  }

  /* ==================== TOP WOODEN HUD BAR ==================== */
  #hud{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));
    pointer-events:none;
  }

  .hud-group{
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:auto;
    min-width:0;
  }

  .track-pill{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 16px;
    border-radius:22px;
    border:4px solid var(--wood-dark);
    background:linear-gradient(180deg,#fff7e4 0%,#f0d29c 100%);
    color:var(--ink);
    font-family:inherit;
    font-weight:700;
    font-size:18px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    box-shadow:0 5px 0 var(--wood-dark), 0 8px 16px rgba(44,29,17,.22), inset 0 2px 0 rgba(255,255,255,.7);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .18s, box-shadow .14s;
    flex:0 0 auto;
  }
  .track-pill:active{
    transform:translateY(3px) scale(.95);
    box-shadow:0 2px 0 var(--wood-dark), 0 4px 8px rgba(44,29,17,.18);
  }
  .track-pill.active{
    background:linear-gradient(180deg,#ffe46b 0%,#f5ad1d 100%);
    border-color:#5a2e08;
    box-shadow:0 0 0 3.5px #fff, 0 5px 0 #5a2e08, 0 10px 20px rgba(44,29,17,.28);
    transform:translateY(-2px);
  }
  .track-pill .pill-ico{
    width:32px;
    height:32px;
    display:grid;
    place-items:center;
    flex:none;
  }
  .track-pill .pill-ico svg{
    width:100%;
    height:100%;
    display:block;
  }
  .track-pill .pill-txt{
    white-space:nowrap;
    line-height:1;
  }

  #starPill{
    min-height:64px;
    height:64px;
    padding:0 14px;
    border-radius:22px;
    border:4px solid var(--wood-dark);
    background:linear-gradient(180deg,#fffdf5 0%,#fae4b0 100%);
    box-shadow:0 5px 0 var(--wood-dark), 0 8px 14px rgba(44,29,17,.2);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    flex:0 0 auto;
    transition:transform .22s cubic-bezier(.34,1.8,.5,1);
  }
  #starPill.pop{
    transform:scale(1.18);
  }
  #starPill svg{
    width:30px;
    height:30px;
    display:block;
    filter:drop-shadow(0 2px 2px rgba(184,118,11,.35));
  }

  .hud-icon-btn{
    width:64px;
    height:64px;
    min-width:64px;
    min-height:64px;
    padding:0;
    border-radius:22px;
    border:4px solid var(--wood-dark);
    background:linear-gradient(180deg,#fff7e4 0%,#f0d29c 100%);
    color:var(--ink);
    display:grid;
    place-items:center;
    cursor:pointer;
    box-shadow:0 5px 0 var(--wood-dark), 0 8px 16px rgba(44,29,17,.22), inset 0 2px 0 rgba(255,255,255,.7);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1);
    flex:0 0 auto;
  }
  .hud-icon-btn:active{
    transform:translateY(3px) scale(.94);
    box-shadow:0 2px 0 var(--wood-dark);
  }
  .hud-icon-btn.muted{
    background:linear-gradient(180deg,#fde2e2 0%,#f5b2b2 100%);
  }
  .hud-icon-btn svg{
    width:34px;
    height:34px;
    display:block;
  }

  /* ==================== FIRST-PERSON CAB VIEW TOGGLE ==================== */
  #btnCabView{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 18px;
    border-radius:22px;
    border:4px solid #164e63;
    background:linear-gradient(180deg,#7ee8ff 0%,#22b8f0 56%,#0d8fd6 100%);
    color:#ffffff;
    text-shadow:0 2px 0 rgba(14,56,82,.55);
    font-family:inherit;
    font-weight:700;
    font-size:19px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    box-shadow:0 5px 0 #164e63, 0 8px 18px rgba(14,78,99,.32), inset 0 2.5px 0 rgba(255,255,255,.65);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .18s, box-shadow .14s;
    flex:0 0 auto;
    white-space:nowrap;
  }
  #btnCabView:active{
    transform:translateY(3px) scale(.95);
    box-shadow:0 2px 0 #164e63, 0 4px 8px rgba(14,78,99,.22);
  }
  #btnCabView.active{
    border-color:#5a2e08;
    background:linear-gradient(180deg,#ffe878 0%,#f5b222 58%,#de8a0c 100%);
    color:#2c1d11;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
    box-shadow:0 0 0 3.5px #fff, 0 5px 0 #5a2e08, 0 10px 22px rgba(44,29,17,.32);
    transform:translateY(-2px);
  }
  #btnCabView .cab-ico{
    font-size:24px;
    line-height:1;
    display:inline-flex;
    align-items:center;
  }
  #btnCabView .cab-txt{
    line-height:1;
    white-space:nowrap;
  }

  /* ==================== BOTTOM TACTILE WOODEN CONSOLE ==================== */
  #consoleWrap{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:10;
    display:flex;
    justify-content:center;
    padding:0 max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
    pointer-events:none;
  }

  #console{
    pointer-events:auto;
    max-width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:nowrap;
    gap:10px;
    padding:10px 14px;
    border-radius:30px;
    border:4px solid var(--wood-dark);
    background:
      repeating-linear-gradient(90deg, rgba(169,108,52,.11) 0 38px, rgba(255,255,255,.04) 38px 76px),
      linear-gradient(180deg,#f0c583 0%,#d89d56 58%,#c5853d 100%);
    box-shadow:
      0 7px 0 var(--wood-dark),
      0 14px 28px rgba(34,20,8,.34),
      inset 0 3px 0 rgba(255,244,218,.7);
  }

  .console-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .wood-divider{
    width:4px;
    height:48px;
    border-radius:4px;
    background:rgba(107,62,24,.32);
    box-shadow:1px 0 0 rgba(255,245,220,.45);
    flex:none;
  }

  .ctrl-btn{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 12px;
    border-radius:20px;
    border:3.5px solid var(--wood-dark);
    background:linear-gradient(180deg,#fffaf0 0%,#f3dcb1 100%);
    color:var(--ink);
    font-family:inherit;
    font-weight:700;
    font-size:20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    position:relative;
    box-shadow:0 5px 0 var(--wood-dark), inset 0 2px 0 rgba(255,255,255,.75);
    transition:transform .13s cubic-bezier(.34,1.6,.5,1), box-shadow .13s, background .15s;
    flex:0 0 auto;
  }
  .ctrl-btn:active{
    transform:translateY(3px) scale(.94);
    box-shadow:0 2px 0 var(--wood-dark);
  }
  .ctrl-btn svg{
    width:34px;
    height:34px;
    display:block;
    flex:none;
  }

  /* Go / Stop Button */
  #goStopBtn{
    min-width:72px;
    background:linear-gradient(180deg,#7ae582 0%,#35b84d 100%);
    border-color:#1c5e2a;
    box-shadow:0 5px 0 #1c5e2a, inset 0 2px 0 rgba(255,255,255,.55);
  }
  #goStopBtn.paused{
    background:linear-gradient(180deg,#ff8c7a 0%,#e5463a 100%);
    border-color:#7d1c15;
    box-shadow:0 5px 0 #7d1c15, inset 0 2px 0 rgba(255,255,255,.45);
  }

  /* Reverse Button */
  #reverseBtn{
    background:linear-gradient(180deg,#8fd3ff 0%,#379be8 100%);
    border-color:#154c7a;
    box-shadow:0 5px 0 #154c7a, inset 0 2px 0 rgba(255,255,255,.5);
  }
  #reverseBtn.reversed{
    background:linear-gradient(180deg,#c79eff 0%,#844ee0 100%);
    border-color:#452182;
    box-shadow:0 0 0 3px #fff, 0 5px 0 #452182;
  }

  /* Speed Group */
  #speedGroup{
    display:flex;
    align-items:center;
    gap:6px;
    padding:4px;
    border-radius:24px;
    background:rgba(107,62,24,.2);
    box-shadow:inset 0 2px 5px rgba(55,30,10,.25);
  }
  .speed-btn{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 10px;
    border-radius:18px;
    border:3.5px solid var(--wood-dark);
    background:linear-gradient(180deg,#fffaf0 0%,#edd19e 100%);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 0 var(--wood-dark), inset 0 2px 0 rgba(255,255,255,.7);
    transition:transform .13s cubic-bezier(.34,1.6,.5,1), background .15s;
    flex:0 0 auto;
  }
  .speed-btn:active{
    transform:translateY(3px) scale(.94);
    box-shadow:0 1px 0 var(--wood-dark);
  }
  .speed-btn svg{
    width:36px;
    height:36px;
    display:block;
  }
  .speed-btn.active{
    background:linear-gradient(180deg,#ffe46b 0%,#f5ad1d 100%);
    border-color:#5a2e08;
    box-shadow:0 0 0 3px #fff, 0 4px 0 #5a2e08;
    transform:translateY(-2px);
  }
  .speed-btn[data-speed="turbo"].active{
    background:linear-gradient(180deg,#ffae52 0%,#f05a24 100%);
    border-color:#7d2105;
    box-shadow:0 0 0 3px #fff, 0 4px 0 #7d2105;
  }

  /* Add Car Button */
  #addCarBtn{
    min-width:78px;
    padding:0 12px;
    flex-direction:column;
    gap:3px;
    background:linear-gradient(180deg,#fff2c2 0%,#f7cb5c 100%);
    border-color:#6b4108;
    box-shadow:0 5px 0 #6b4108, inset 0 2px 0 rgba(255,255,255,.7);
  }
  .add-car-top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    line-height:1;
  }
  .add-car-top svg{
    width:30px;
    height:30px;
  }
  .car-dots{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .car-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    border:2px solid #6b4108;
    background:rgba(255,255,255,.55);
    transition:transform .2s cubic-bezier(.34,1.8,.5,1), background .2s;
  }
  .car-dot.on{
    background:#e8483c;
    transform:scale(1.18);
  }
  .car-dot:nth-child(2).on{ background:#36a6f0; }
  .car-dot:nth-child(3).on{ background:#42b859; }
  .car-dot:nth-child(4).on{ background:#a855f7; }

  /* Giant Brass Train Whistle Button */
  #whistleBtn{
    min-width:96px;
    min-height:68px;
    height:68px;
    padding:0 18px;
    border-radius:24px;
    border:4px solid #613904;
    background:
      radial-gradient(circle at 30% 24%, #fffbe0 0%, #ffe066 36%, #eb9f13 78%, #c97d06 100%);
    box-shadow:
      0 6px 0 #613904,
      0 10px 22px rgba(97,57,4,.36),
      inset 0 3px 2px rgba(255,255,255,.8);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:transform .12s cubic-bezier(.34,1.8,.5,1), box-shadow .12s;
    flex:0 0 auto;
  }
  #whistleBtn:active,
  #whistleBtn.tooting{
    transform:translateY(3px) scale(1.06);
    box-shadow:0 0 0 4px #fff, 0 3px 0 #613904, 0 0 24px rgba(255,220,70,.85);
  }
  #whistleBtn svg{
    width:44px;
    height:44px;
    display:block;
    filter:drop-shadow(0 2px 1px rgba(97,57,4,.35));
  }

  /* ==================== RESPONSIVE BREAKPOINTS ==================== */
  /* iPad / Medium Landscape */
  @media (max-width:1060px){
    .track-pill{ padding:0 12px; font-size:16px; gap:6px; }
    #btnCabView{ padding:0 14px; font-size:17px; gap:6px; }
    #console{ gap:8px; padding:8px 12px; }
  }
  @media (max-width:860px){
    .track-pill{ padding:0 10px; font-size:15px; gap:5px; }
    #btnCabView{ padding:0 12px; font-size:16px; }
  }

  /* Compact Phone Portrait (iPhone 390x844 etc.) — ZERO overflow, ALL buttons >=64px */
  @media (max-width:740px){
    #hud{
      flex-wrap:wrap;
      padding:max(6px,env(safe-area-inset-top)) 8px 4px 8px;
      gap:6px;
    }
    .hud-group{ gap:6px; }
    #trackPills{ order:1; }
    #hudRight{ order:2; }
    #cabViewGroup{
      order:3;
      width:100%;
      justify-content:center;
    }
    #btnCabView{
      min-height:64px;
      height:64px;
      padding:0 20px;
      font-size:18px;
      border-radius:20px;
      border-width:3.5px;
    }
    .track-pill{
      width:64px;
      min-width:64px;
      padding:0;
      border-radius:18px;
      border-width:3.5px;
    }
    .track-pill .pill-txt{ display:none; }
    #starPill{
      padding:0 10px;
      font-size:18px;
      gap:4px;
      border-radius:18px;
      border-width:3.5px;
    }
    #starPill svg{ width:24px; height:24px; }
    .hud-icon-btn{
      border-radius:18px;
      border-width:3.5px;
    }

    #consoleWrap{
      padding:0 6px max(6px,env(safe-area-inset-bottom)) 6px;
    }
    #console{
      width:100%;
      max-width:378px;
      flex-direction:column;
      gap:7px;
      padding:8px;
      border-radius:24px;
      border-width:3.5px;
    }
    .wood-divider{ display:none; }
    .console-row{
      width:100%;
      gap:7px;
      justify-content:space-between;
    }
    .ctrl-btn{
      flex:1 1 64px;
      min-width:64px;
      min-height:64px;
      height:64px;
      padding:0 6px;
      border-radius:18px;
    }
    #goStopBtn{ min-width:64px; }
    #addCarBtn{ min-width:72px; }
    #whistleBtn{
      flex:1.45 1 92px;
      min-width:92px;
      min-height:64px;
      height:64px;
      padding:0 10px;
      border-radius:18px;
    }
    #speedGroup{
      width:100%;
      justify-content:space-between;
      padding:4px;
      gap:6px;
      border-radius:20px;
    }
    .speed-btn{
      flex:1 1 64px;
      min-width:64px;
      min-height:64px;
      height:64px;
      border-radius:16px;
    }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="worldCanvas" aria-label="Wooden Train Railway Meadow"></canvas>

  <!-- Top Tactile Wooden HUD -->
  <div id="hud">
    <div class="hud-group" id="trackPills" role="group" aria-label="Track Layouts">
      <button class="track-pill active" type="button" data-layout="meadow" aria-label="Meadow Loop Track" aria-pressed="true">
        <span class="pill-ico" aria-hidden="true">
          <svg viewBox="0 0 36 36">
            <rect x="4" y="8" width="28" height="20" rx="10" fill="none" stroke="#8a501c" stroke-width="6.5"/>
            <rect x="4" y="8" width="28" height="20" rx="10" fill="none" stroke="#f5cb86" stroke-width="3.2"/>
            <rect x="4" y="8" width="28" height="20" rx="10" fill="none" stroke="#a96c34" stroke-width="1.2" stroke-dasharray="2 3"/>
          </svg>
        </span>
        <span class="pill-txt">Meadow</span>
      </button>
      <button class="track-pill" type="button" data-layout="figure8" aria-label="Figure-8 Bridge Track" aria-pressed="false">
        <span class="pill-ico" aria-hidden="true">
          <svg viewBox="0 0 36 36">
            <path d="M18 18 C11 8, 3 10, 3 18 C3 26, 11 28, 18 18 C25 8, 33 10, 33 18 C33 26, 25 28, 18 18 Z" fill="none" stroke="#8a501c" stroke-width="6.2" stroke-linejoin="round"/>
            <path d="M18 18 C11 8, 3 10, 3 18 C3 26, 11 28, 18 18 C25 8, 33 10, 33 18 C33 26, 25 28, 18 18 Z" fill="none" stroke="#f5cb86" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="18" cy="18" r="3.4" fill="#d97706" stroke="#6b3e18" stroke-width="1.4"/>
          </svg>
        </span>
        <span class="pill-txt">Figure-8</span>
      </button>
      <button class="track-pill" type="button" data-layout="mountain" aria-label="Mountain Tunnel Track" aria-pressed="false">
        <span class="pill-ico" aria-hidden="true">
          <svg viewBox="0 0 36 36">
            <path d="M3 29 L14 8 L21 19 L25 13 L33 29 Z" fill="#4f9d53" stroke="#2c1d11" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M11 14 L14 8 L17.5 14 L15.5 13 L14 14.8 L12.5 13 Z" fill="#fffdf8"/>
            <path d="M12.5 29 C12.5 21, 23.5 21, 23.5 29 Z" fill="#2c1d11" stroke="#b5834a" stroke-width="2.2"/>
          </svg>
        </span>
        <span class="pill-txt">Tunnel</span>
      </button>
    </div>

    <div class="hud-group" id="cabViewGroup">
      <button id="btnCabView" type="button" aria-label="Switch to First-Person Cab View" aria-pressed="false">
        <span class="cab-ico" aria-hidden="true">👀</span>
        <span class="cab-txt">Cab View</span>
      </button>
    </div>

    <div class="hud-group" id="hudRight">
      <div id="starPill" aria-label="Stars earned">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2.5 L20.1 10.8 L29.2 12.1 L22.6 18.5 L24.2 27.6 L16 23.3 L7.8 27.6 L9.4 18.5 L2.8 12.1 L11.9 10.8 Z" fill="#ffd43b" stroke="#8a501c" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="13.5" cy="13" r="2" fill="#fff9db"/>
        </svg>
        <span id="starCount">0</span>
      </div>
      <button class="hud-icon-btn" id="muteBtn" type="button" aria-label="Toggle Sound" aria-pressed="false">
        <svg id="soundOnIcon" viewBox="0 0 36 36" aria-hidden="true">
          <path d="M6 14 H12 L20 7 V29 L12 22 H6 Z" fill="#5a3413" stroke="#2c1d11" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M24 12 C27 14.5, 27 21.5, 24 24" fill="none" stroke="#2c1d11" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M28 8.5 C32.5 13, 32.5 23, 28 27.5" fill="none" stroke="#2c1d11" stroke-width="2.8" stroke-linecap="round"/>
        </svg>
        <svg id="soundOffIcon" viewBox="0 0 36 36" aria-hidden="true" style="display:none">
          <path d="M6 14 H12 L20 7 V29 L12 22 H6 Z" fill="#9c4242" stroke="#2c1d11" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M24 13 L32 23 M32 13 L24 23" fill="none" stroke="#b3281e" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
      </button>

<script>
(function(){
  "use strict";

  /* ==================== STATE ==================== */
  var state = {
    layout: "meadow",     // "meadow" | "figure8" | "mountain"
    running: true,        // starts ALREADY running for instant joy!
    speed: "cruise",      // "slow" | "cruise" | "turbo"
    dir: 1,               // 1 forward | -1 reverse
    carCount: 1,          // 0..4 attached wooden cars (starts with Coal Tender)
    carTheme: 0,          // cycles custom car paint palettes when tapping + at 4 cars
    stars: 0,
    whistles: 0,
    cabView: false,       // false = top-down Track View | true = First-Person Cab View
    muted: false
  };

  var SPEED_PX = { slow: 82, cruise: 162, turbo: 285 };
  var CHUG_HZ  = { slow: 2.3, cruise: 4.3, turbo: 7.4 };

  /* ==================== DOM REFS ==================== */
  var canvas = document.getElementById("worldCanvas");
  var ctx = canvas.getContext("2d");
  var hudEl = document.getElementById("hud");
  var consoleEl = document.getElementById("console");
  var starPillEl = document.getElementById("starPill");
  var starCountEl = document.getElementById("starCount");
  var muteBtn = document.getElementById("muteBtn");
  var soundOnIcon = document.getElementById("soundOnIcon");
  var soundOffIcon = document.getElementById("soundOffIcon");
  var goStopBtn = document.getElementById("goStopBtn");
  var pauseSvg = document.getElementById("pauseSvg");
  var goSvg = document.getElementById("goSvg");
  var reverseBtn = document.getElementById("reverseBtn");
  var addCarBtn = document.getElementById("addCarBtn");
  var carDotsEl = document.getElementById("carDots");
  var whistleBtn = document.getElementById("whistleBtn");
  var btnCabView = document.getElementById("btnCabView");
  var trackPills = document.querySelectorAll(".track-pill");
  var speedBtns = document.querySelectorAll(".speed-btn");

  /* ==================== VERIFIED AUDIO ENGINE ==================== */
  // Every single MP3 below was verified in `git ls-tree -r origin/main --name-only assets/voice/`
  var VERIFIED_VOICE = {
    moo: "assets/voice/sound-moo.mp3",
    quack: "assets/voice/sound-quack.mp3",
    star: "assets/voice/hoot-star.mp3",
    great: "assets/voice/hoot-great-job.mp3",
    yay: "assets/voice/hoot-yay-2.mp3",
    super: "assets/voice/hoot-super.mp3",
    amazing: "assets/voice/hoot-amazing.mp3"
  };

  var actx = null;
  var noiseBuf = null;
  var voiceEl = null;
  var audioUnlocked = false;

  function ensureAudio(){
    if(state.muted) return null;
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      try{
        actx = new AC();
      }catch(e){ return null; }
    }
    if(actx.state === "suspended"){
      try{ actx.resume(); }catch(e){}
    }
    if(!noiseBuf && actx){
      var len = Math.floor(actx.sampleRate * 0.6);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      var data = noiseBuf.getChannelData(0);
      var last = 0;
      for(var i = 0; i < len; i++){
        var w = Math.random() * 2 - 1;
        last = (last + 0.06 * w) / 1.06;
        data[i] = last * 3.1;
      }
    }
    audioUnlocked = true;
    return actx;
  }

  function playVoice(key){
    if(state.muted) return;
    var src = VERIFIED_VOICE[key];
    if(!src) return;
    try{
      if(!voiceEl) voiceEl = new Audio();
      voiceEl.pause();
      voiceEl.currentTime = 0;
      voiceEl.src = src;
      var p = voiceEl.play();
      if(p && p.catch) p.catch(function(){});
    }catch(e){}
  }

  /* Authentic multi-oscillator wooden steam train whistle ("Toot-toot!") */
  function playWhistleSfx(){
    var ac = ensureAudio();
    if(!ac) return;
    var now = ac.currentTime;
    // Classic 4-chime wooden train whistle chord (F#4, A4, C#5, E5)
    var freqs = [370, 440, 554.37, 659.25];
    var bursts = [
      { start: 0.00, dur: 0.34, gain: 0.13 },
      { start: 0.42, dur: 0.24, gain: 0.12 }
    ];
    bursts.forEach(function(b){
      var t0 = now + b.start;
      var t1 = t0 + b.dur;
      var master = ac.createGain();
      master.gain.setValueAtTime(0.0001, t0);
      master.gain.exponentialRampToValueAtTime(b.gain, t0 + 0.045);
      master.gain.setValueAtTime(b.gain * 0.92, t1 - 0.06);
      master.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.08);
      master.connect(ac.destination);

      freqs.forEach(function(f, idx){
        var osc = ac.createOscillator();
        osc.type = idx % 2 === 0 ? "triangle" : "sine";
        osc.frequency.setValueAtTime(f * 0.96, t0);
        osc.frequency.exponentialRampToValueAtTime(f, t0 + 0.055);
        osc.frequency.setValueAtTime(f * 0.995, t1);
        var og = ac.createGain();
        og.gain.value = idx === 0 ? 0.34 : (idx === 1 ? 0.28 : 0.22);
        osc.connect(og);
        og.connect(master);
        osc.start(t0);
        osc.stop(t1 + 0.1);
      });

      // Soft airy steam breath layer
      if(noiseBuf){
        var ns = ac.createBufferSource();
        ns.buffer = noiseBuf;
        var bp = ac.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = 1150;
        bp.Q.value = 2.4;
        var ng = ac.createGain();
        ng.gain.setValueAtTime(0.0001, t0);
        ng.gain.linearRampToValueAtTime(0.11, t0 + 0.04);
        ng.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.05);
        ns.connect(bp);
        bp.connect(ng);
        ng.connect(ac.destination);
        ns.start(t0);
        ns.stop(t1 + 0.08);
      }
    });
  }

  /* Rhythmic chugga-chugga steam sound scaled to speed + tunnel echo */
  function playChugStep(accent, muffled){
    if(state.muted || !audioUnlocked || !actx || actx.state !== "running" || !noiseBuf) return;
    var now = actx.currentTime;
    var src = actx.createBufferSource();
    src.buffer = noiseBuf;
    var filter = actx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = muffled ? (accent ? 260 : 210) : (accent ? 540 : 410);
    filter.Q.value = muffled ? 1.8 : 1.3;
    var gain = actx.createGain();
    var peak = (accent ? 0.085 : 0.046) * (muffled ? 0.62 : 1);
    var dur = state.speed === "turbo" ? 0.075 : (state.speed === "slow" ? 0.14 : 0.105);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(peak, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(actx.destination);
    src.start(now, Math.random() * 0.25, dur + 0.02);
  }

  /* Magnetic wooden snap clack when coupling a car */
  function playMagnetClack(){
    var ac = ensureAudio();
    if(!ac) return;
    var now = ac.currentTime;
    // Wooden knock
    var o1 = ac.createOscillator();
    var g1 = ac.createGain();
    o1.type = "triangle";
    o1.frequency.setValueAtTime(340, now);
    o1.frequency.exponentialRampToValueAtTime(140, now + 0.05);
    g1.gain.setValueAtTime(0.24, now);
    g1.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
    o1.connect(g1); g1.connect(ac.destination);
    o1.start(now); o1.stop(now + 0.07);

    // Metallic magnetic click + joyful chime
    var o2 = ac.createOscillator();
    var g2 = ac.createGain();
    o2.type = "sine";
    o2.frequency.setValueAtTime(1480, now + 0.03);
    o2.frequency.exponentialRampToValueAtTime(980, now + 0.07);
    g2.gain.setValueAtTime(0.16, now + 0.03);
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
    o2.connect(g2); g2.connect(ac.destination);
    o2.start(now + 0.03); o2.stop(now + 0.1);

    // Happy marimba pop
    playMarimbaNote(523.25 + state.carCount * 88, 0.06, 0.14);
  }

  /* Crossing gate metallic bell (ding-ding!) */
  function playCrossingBell(count){
    var ac = ensureAudio();
    if(!ac) return;
    var n = count || 2;
    var now = ac.currentTime;
    for(var i = 0; i < n; i++){
      var t0 = now + i * 0.22;
      [1175, 2940].forEach(function(freq, k){
        var o = ac.createOscillator();
        var g = ac.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        g.gain.setValueAtTime(k === 0 ? 0.13 : 0.055, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.36);
        o.connect(g); g.connect(ac.destination);
        o.start(t0); o.stop(t0 + 0.38);
      });
    }
  }

  /* Water splash SFX for Duck Pond */
  function playSplashSfx(){
    var ac = ensureAudio();
    if(!ac || !noiseBuf) return;
    var now = ac.currentTime;
    var src = ac.createBufferSource();
    src.buffer = noiseBuf;
    var bp = ac.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.setValueAtTime(1100, now);
    bp.frequency.exponentialRampToValueAtTime(380, now + 0.22);
    bp.Q.value = 1.4;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.16, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start(now); src.stop(now + 0.26);
    playMarimbaNote(659.25, 0.02, 0.11);
  }

  /* Warm wooden marimba plink for planting flowers/trees & UI taps */
  var PENTA = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
  var pentaIdx = 0;
  function playMarimbaNote(freq, delay, vol){
    var ac = ensureAudio();
    if(!ac) return;
    var t0 = ac.currentTime + (delay || 0);
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol || 0.13, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + 0.26);
  }

  function playStationCheerSfx(){
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f, idx){
      playMarimbaNote(f, idx * 0.065, 0.12);
    });
  }

  /* ==================== VIEWPORT & PLAYFIELD METRICS ==================== */
  var W = window.innerWidth;
  var H = window.innerHeight;
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var play = { x: 0, y: 80, w: W, h: H - 180, cx: W / 2, cy: H / 2, scale: 1, portrait: false };

  function measurePlayfield(){
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    var hudRect = hudEl.getBoundingClientRect();
    var conRect = consoleEl.getBoundingClientRect();
    var topSafe = Math.max(76, hudRect.bottom + 8);
    var botSafe = Math.max(96, H - conRect.top + 8);
    var padX = Math.max(18, W * 0.035);
    var availH = Math.max(220, H - topSafe - botSafe);
    var availW = Math.max(240, W - padX * 2);

    play.x = padX;
    play.y = topSafe;
    play.w = availW;
    play.h = availH;
    play.cx = padX + availW * 0.5;
    play.cy = topSafe + availH * 0.5;
    play.portrait = availH > availW * 1.08;
    play.scale = Math.max(0.66, Math.min(1.18, Math.min(availW, availH) / 480));
  }

  /* ==================== TRACK GEOMETRY & SPLINE SAMPLER ==================== */
  var track = {
    pts: [],         // { x, y, tx, ty, angle, s, z, inTunnel }
    totalLen: 1000,
    crossingS: 0,
    crossingPt: { x: 0, y: 0, angle: 0 },
    stationPt: { x: 0, y: 0, angle: 0, s: 0 },
    pondPt: { x: 0, y: 0, rx: 56, ry: 38 },
    barnPt: { x: 0, y: 0 },
    cowPt: { x: 0, y: 0 },
    tunnelHill: null, // { cx, cy, rx, ry, enterPt, exitPt }
    bridgeInfo: null, // { cx, cy, angle }
    trees: []
  };

  function superCos(t, p){ var c = Math.cos(t); return (c < 0 ? -1 : 1) * Math.pow(Math.abs(c), p); }
  function superSin(t, p){ var s = Math.sin(t); return (s < 0 ? -1 : 1) * Math.pow(Math.abs(s), p); }

  function evalRawCurve(layout, t){
    var rx = play.w * (play.portrait ? 0.37 : 0.39);
    var ry = play.h * (play.portrait ? 0.36 : 0.35);
    var cx = play.cx;
    var cy = play.cy + (layout === "mountain" ? play.h * 0.05 : 0);

    if(layout === "meadow"){
      // Classic rounded BRIO stadium oval
      return {
        x: cx + rx * superCos(t, 0.84),
        y: cy + ry * superSin(t, 0.84),
        z: 0,
        inTunnel: false
      };
    }

    if(layout === "figure8"){
      // Smooth lemniscate Figure-8 with center wooden overpass bridge
      var s = Math.sin(t);
      var c = Math.cos(t);
      var overBridge = Math.abs(s) < 0.36 && c > 0;
      if(!play.portrait){
        return {
          x: cx + (play.w * 0.41) * s,
          y: cy + (play.h * 0.40) * (s * c * 1.92),
          z: overBridge ? 1 : 0,
          inTunnel: false
        };
      } else {
        return {
          x: cx + (play.w * 0.41) * (s * c * 1.92),
          y: cy + (play.h * 0.40) * s,
          z: overBridge ? 1 : 0,
          inTunnel: false
        };
      }
    }

    // Mountain Tunnel Loop
    var mrx = play.w * (play.portrait ? 0.37 : 0.39);
    var mry = play.h * (play.portrait ? 0.33 : 0.33);
    var x = cx + mrx * superCos(t, 0.88);
    var y = cy + mry * superSin(t, 0.88) + mry * 0.08 * Math.sin(2 * t);
    // Top arc (sin(t) < 0 -> t in [1.26*PI .. 1.74*PI]) runs inside Mountain Tunnel!
    var inTun = (t > Math.PI * 1.26 && t < Math.PI * 1.74);
    return { x: x, y: y, z: 0, inTunnel: inTun };
  }

  function buildTrack(){
    var N = 360;
    var raw = [];
    var cumLen = [0];
    var total = 0;

    for(var i = 0; i < N; i++){
      var t = (i / N) * Math.PI * 2;
      raw.push(evalRawCurve(state.layout, t));
    }
    for(var i = 1; i <= N; i++){
      var a = raw[i - 1];
      var b = raw[i % N];
      total += Math.hypot(b.x - a.x, b.y - a.y);
      cumLen.push(total);
    }

    // Resample at M evenly-spaced arc-length steps
    var M = 260;
    var pts = [];
    var seg = 0;
    for(var k = 0; k < M; k++){
      var targetS = (k / M) * total;
      while(seg < N - 1 && cumLen[seg + 1] < targetS) seg++;
      var s0 = cumLen[seg];
      var s1 = cumLen[seg + 1];
      var frac = s1 > s0 ? (targetS - s0) / (s1 - s0) : 0;
      var p0 = raw[seg];
      var p1 = raw[(seg + 1) % N];
      pts.push({
        x: p0.x + (p1.x - p0.x) * frac,
        y: p0.y + (p1.y - p0.y) * frac,
        s: targetS,
        z: p0.z,
        inTunnel: p0.inTunnel
      });
    }

    // Compute smooth tangents & angles
    for(var k = 0; k < M; k++){
      var prev = pts[(k - 1 + M) % M];
      var next = pts[(k + 1) % M];
      var dx = next.x - prev.x;
      var dy = next.y - prev.y;
      var len = Math.hypot(dx, dy) || 1;
      pts[k].tx = dx / len;
      pts[k].ty = dy / len;
      pts[k].angle = Math.atan2(dy, dx);
    }

    track.pts = pts;
    track.totalLen = total;

    // Place scenery toys cleanly per layout
    var S = play.scale;
    var cx = play.cx;
    var cy = play.cy;
    var pw = play.w;
    var ph = play.h;

    if(state.layout === "meadow"){
      track.pondPt = {
        x: cx - pw * (play.portrait ? 0.04 : 0.11),
        y: cy + ph * (play.portrait ? 0.11 : 0.04),
        rx: 56 * S,
        ry: 36 * S
      };
      track.barnPt = {
        x: cx + pw * (play.portrait ? 0.06 : 0.13),
        y: cy - ph * (play.portrait ? 0.12 : 0.06)
      };
      track.cowPt = {
        x: track.barnPt.x - 42 * S,
        y: track.barnPt.y + 34 * S
      };
      // Train station along bottom straightaway
      var stSample = sampleTrack(total * 0.25);
      track.stationPt = {
        x: stSample.x,
        y: Math.min(play.y + play.h - 28 * S, stSample.y + 38 * S),
        angle: 0,
        s: total * 0.25
      };
      // Crossing gate on upper-right curve
      var crS = total * 0.89;
      var crSample = sampleTrack(crS);
      track.crossingS = crS;
      track.crossingPt = { x: crSample.x, y: crSample.y, angle: crSample.angle };
      track.tunnelHill = null;
      track.bridgeInfo = null;
    } else if(state.layout === "figure8"){
      if(!play.portrait){
        track.pondPt = { x: cx - pw * 0.22, y: cy + ph * 0.02, rx: 48 * S, ry: 32 * S };
        track.barnPt = { x: cx + pw * 0.22, y: cy - ph * 0.05 };
        track.cowPt  = { x: cx + pw * 0.21, y: cy + ph * 0.10 };
        var stSample8 = sampleTrack(total * 0.14);
        track.stationPt = { x: cx, y: play.y + 34 * S, angle: 0, s: stSample8.s };
        var crS8 = total * 0.68;
        var cr8 = sampleTrack(crS8);
        track.crossingS = crS8;
        track.crossingPt = { x: cr8.x, y: cr8.y, angle: cr8.angle };
      } else {
        track.pondPt = { x: cx, y: cy + ph * 0.21, rx: 48 * S, ry: 30 * S };
        track.barnPt = { x: cx - pw * 0.08, y: cy - ph * 0.24 };
        track.cowPt  = { x: cx + pw * 0.12, y: cy - ph * 0.16 };
        track.stationPt = { x: cx + pw * 0.28, y: cy + ph * 0.01, angle: 0, s: total * 0.02 };
        var crS8p = total * 0.65;
        var cr8p = sampleTrack(crS8p);
        track.crossingS = crS8p;
        track.crossingPt = { x: cr8p.x, y: cr8p.y, angle: cr8p.angle };
      }
      var brSample = sampleTrack(0);
      track.bridgeInfo = { cx: brSample.x, cy: brSample.y, angle: brSample.angle };
      track.tunnelHill = null;
    } else {
      // Mountain Tunnel layout
      var enterS = null, exitS = null;
      for(var i = 0; i < pts.length; i++){
        var p = pts[i];
        var prev = pts[(i - 1 + pts.length) % pts.length];
        if(p.inTunnel && !prev.inTunnel) enterS = p;
        if(!p.inTunnel && prev.inTunnel) exitS = prev;
      }
      var topMid = sampleTrack(total * 0.75);
      var ep1 = enterS || topMid;
      var ep2 = exitS || topMid;
      var leftP = ep1.x <= ep2.x ? ep1 : ep2;
      var rightP = ep1.x <= ep2.x ? ep2 : ep1;
      var portalSpan = Math.max(90 * S, (rightP.x - leftP.x) * 0.5 + 24 * S);
      var portalBaseY = Math.max(leftP.y, rightP.y) + 14 * S;
      track.tunnelHill = {
        cx: (leftP.x + rightP.x) * 0.5,
        cy: portalBaseY,
        rx: portalSpan,
        ry: Math.min(ph * 0.27, Math.max(76 * S, portalSpan * 0.56)),
        enterPt: leftP,
        exitPt: rightP
      };
      track.pondPt = {
        x: cx - pw * (play.portrait ? 0.12 : 0.14),
        y: cy + ph * 0.12,
        rx: 50 * S,
        ry: 32 * S
      };
      track.barnPt = {
        x: cx + pw * (play.portrait ? 0.14 : 0.15),
        y: cy + ph * 0.06
      };
      track.cowPt = {
        x: track.barnPt.x - 36 * S,
        y: track.barnPt.y + 34 * S
      };
      var stSampleM = sampleTrack(total * 0.25);
      track.stationPt = {
        x: stSampleM.x,
        y: Math.min(play.y + play.h - 26 * S, stSampleM.y + 36 * S),
        angle: 0,
        s: total * 0.25
      };
      var crSM = total * 0.08;
      var crM = sampleTrack(crSM);
      track.crossingS = crSM;
      track.crossingPt = { x: crM.x, y: crM.y, angle: crM.angle };
      track.bridgeInfo = null;
    }

    // Perimeter storybook pine trees
    track.trees = [
      { x: play.x + 28 * S, y: play.y + 38 * S, sz: 1.05, wiggle: 0 },
      { x: play.x + 62 * S, y: play.y + 24 * S, sz: 0.78, wiggle: 0 },
      { x: play.x + pw - 32 * S, y: play.y + 42 * S, sz: 1.0, wiggle: 0 },
      { x: play.x + 30 * S, y: play.y + ph - 36 * S, sz: 0.96, wiggle: 0 },
      { x: play.x + pw - 34 * S, y: play.y + ph - 38 * S, sz: 1.08, wiggle: 0 },
      { x: play.x + pw - 68 * S, y: play.y + ph - 24 * S, sz: 0.74, wiggle: 0 }
    ];
  }

  function sampleTrack(s){
    var pts = track.pts;
    var M = pts.length;
    if(!M) return { x: play.cx, y: play.cy, tx: 1, ty: 0, angle: 0, s: 0, z: 0, inTunnel: false };
    var tot = track.totalLen;
    var wrapped = ((s % tot) + tot) % tot;
    var exact = (wrapped / tot) * M;
    var i0 = Math.floor(exact) % M;
    var i1 = (i0 + 1) % M;
    var f = exact - Math.floor(exact);
    var p0 = pts[i0];
    var p1 = pts[i1];
    // Interpolate angle along shortest arc
    var da = p1.angle - p0.angle;
    while(da > Math.PI) da -= Math.PI * 2;
    while(da < -Math.PI) da += Math.PI * 2;
    return {
      x: p0.x + (p1.x - p0.x) * f,
      y: p0.y + (p1.y - p0.y) * f,
      tx: p0.tx + (p1.tx - p0.tx) * f,
      ty: p0.ty + (p1.ty - p0.ty) * f,
      angle: p0.angle + da * f,
      s: wrapped,
      z: p0.z,
      inTunnel: p0.inTunnel
    };
  }

  function arcDist(s1, s2){
    var tot = track.totalLen;
    var d = Math.abs(((s1 - s2) % tot + tot) % tot);
    return Math.min(d, tot - d);
  }

  /* BRIO-style wooden grooved tracks (layered by zPass: 0 lower, 1 upper bridge) */
  function drawTrackPass(zPass){
    var pts = track.pts;
    var M = pts.length;
    if(!M) return;
    var S = play.scale;
    var bedW = 34 * S;
    var railOff = 8.2 * S;

    function strokeSegments(filterFn, drawFn){
      var inRun = false;
      ctx.beginPath();
      for(var i = 0; i <= M; i++){
        var p = pts[i % M];
        var ok = filterFn(p);
        if(ok){
          if(!inRun){
            ctx.moveTo(p.x, p.y);
            inRun = true;
          } else {
            ctx.lineTo(p.x, p.y);
          }
        } else if(inRun){
          inRun = false;
        }
      }
      drawFn();
    }

    var matchFn = function(p){
      if(state.layout === "figure8") return p.z === zPass;
      return zPass === 0;
    };

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 1. Soft grass / bridge drop shadow
    ctx.save();
    ctx.translate(0, (zPass === 1 ? 11 : 5) * S);
    strokeSegments(matchFn, function(){
      ctx.strokeStyle = zPass === 1 ? "rgba(32, 54, 20, 0.34)" : "rgba(38, 76, 26, 0.25)";
      ctx.lineWidth = bedW + 4 * S;
      ctx.stroke();
    });
    ctx.restore();

    // 2. If upper bridge (zPass === 1), draw wooden arch support pillars
    if(zPass === 1 && track.bridgeInfo){
      var bi = track.bridgeInfo;
      ctx.save();
      ctx.translate(bi.cx, bi.cy);
      ctx.rotate(bi.angle);
      [-44 * S, 44 * S].forEach(function(ox){
        ctx.fillStyle = "#b07237";
        ctx.strokeStyle = "#5c3412";
        ctx.lineWidth = 2.6 * S;
        ctx.beginPath();
        ctx.roundRect(ox - 10 * S, -bedW * 0.68, 20 * S, bedW * 1.36, 5 * S);
        ctx.fill();
        ctx.stroke();
      });
      ctx.restore();
    }

    // 3. Wooden track outer dark edge (bevel)
    strokeSegments(matchFn, function(){
      ctx.strokeStyle = "#8a5221";
      ctx.lineWidth = bedW + 4.5 * S;
      ctx.stroke();
    });

    // 4. Warm beechwood track body
    strokeSegments(matchFn, function(){
      ctx.strokeStyle = zPass === 1 ? "#f2cb8a" : "#e7be7c";
      ctx.lineWidth = bedW;
      ctx.stroke();
    });

    // 5. Wooden crossties + subtle BRIO plank join grooves
    for(var i = 0; i < M; i += 4){
      var p = pts[i];
      if(!matchFn(p)) continue;
      var nx = -p.ty;
      var ny = p.tx;
      ctx.strokeStyle = (i % 16 === 0) ? "rgba(115, 66, 24, 0.42)" : "rgba(154, 96, 40, 0.25)";
      ctx.lineWidth = (i % 16 === 0 ? 2.4 : 1.7) * S;
      ctx.beginPath();
      ctx.moveTo(p.x - nx * (bedW * 0.44), p.y - ny * (bedW * 0.44));
      ctx.lineTo(p.x + nx * (bedW * 0.44), p.y + ny * (bedW * 0.44));
      ctx.stroke();
    }

    // 6. Twin carved BRIO wheel grooves (offset left & right)
    [-railOff, railOff].forEach(function(off){
      // Groove recessed dark channel
      ctx.beginPath();
      var run = false;
      for(var i = 0; i <= M; i++){
        var p = pts[i % M];
        if(matchFn(p)){
          var rx = p.x - p.ty * off;
          var ry = p.y + p.tx * off;
          if(!run){ ctx.moveTo(rx, ry); run = true; }
          else ctx.lineTo(rx, ry);
        } else {
          run = false;
        }
      }
      ctx.strokeStyle = "#915a28";
      ctx.lineWidth = 4.6 * S;
      ctx.stroke();

      // Sunlit bottom lip inside groove
      ctx.strokeStyle = "#f5d7a3";
      ctx.lineWidth = 1.4 * S;
      ctx.stroke();
    });

    // 7. Wooden bridge side safety rails on zPass === 1
    if(zPass === 1){
      [-bedW * 0.56, bedW * 0.56].forEach(function(off){
        ctx.beginPath();
        var run = false;
        for(var i = 0; i <= M; i++){
          var p = pts[i % M];
          if(matchFn(p)){
            var rx = p.x - p.ty * off;
            var ry = p.y + p.tx * off;
            if(!run){ ctx.moveTo(rx, ry); run = true; }
            else ctx.lineTo(rx, ry);
          } else {
            run = false;
          }
        }
        ctx.strokeStyle = "#7a4416";
        ctx.lineWidth = 6 * S;
        ctx.stroke();
        ctx.strokeStyle = "#d9944a";
        ctx.lineWidth = 3 * S;
        ctx.stroke();
      });
    }

    ctx.restore();
  }

  /* ==================== SCENERY TOYS ==================== */
  function drawDuckPond(t){
    var p = track.pondPt;
    var S = play.scale;
    ctx.save();
    ctx.translate(p.x, p.y);

    // Sandy pebble bank
    ctx.fillStyle = "#ebd49e";
    ctx.strokeStyle = "#bfa062";
    ctx.lineWidth = 2.5 * S;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.rx + 7 * S, p.ry + 6 * S, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Shimmering blue pond water
    var wg = ctx.createRadialGradient(-p.rx * 0.25, -p.ry * 0.25, 4, 0, 0, p.rx);
    wg.addColorStop(0, "#74d4ff");
    wg.addColorStop(0.65, "#36a6f0");
    wg.addColorStop(1, "#1e82cc");
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.rx, p.ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // Gentle animated ripple rings
    var rPulse = (t * 0.7) % 1;
    ctx.strokeStyle = "rgba(255,255,255," + (0.45 * (1 - rPulse)) + ")";
    ctx.lineWidth = 2 * S;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.rx * (0.35 + rPulse * 0.55), p.ry * (0.35 + rPulse * 0.55), 0, 0, Math.PI * 2);
    ctx.stroke();

    if(duckSplash > 0){
      var sp = 1 - duckSplash;
      ctx.strokeStyle = "rgba(255,255,255," + (duckSplash * 0.9) + ")";
      ctx.lineWidth = 3.5 * S;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.rx * (0.2 + sp * 0.8), p.ry * (0.2 + sp * 0.8), 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Lily pads
    [[-0.45, 0.22], [0.46, -0.25]].forEach(function(lp){
      ctx.save();
      ctx.translate(p.rx * lp[0], p.ry * lp[1]);
      ctx.fillStyle = "#51cf66";
      ctx.strokeStyle = "#2b8a3e";
      ctx.lineWidth = 1.6 * S;
      ctx.beginPath();
      ctx.arc(0, 0, 8.5 * S, 0.25, Math.PI * 2 - 0.25);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    });

    // Two adorable swimming yellow ducks
    for(var d = 0; d < 2; d++){
      var da = duckAngle + d * Math.PI;
      var dx = Math.cos(da) * p.rx * 0.40;
      var dy = Math.sin(da) * p.ry * 0.36 - Math.sin(duckSplash * Math.PI) * 16 * S;
      var facing = -Math.sin(da) >= 0 ? 1 : -1;
      var ds = (d === 0 ? 1.0 : 0.74) * S;
      ctx.save();
      ctx.translate(dx, dy);
      ctx.scale(facing, 1);
      // Body
      ctx.fillStyle = "#ffd43b";
      ctx.strokeStyle = "#5c3a04";
      ctx.lineWidth = 2 * ds;
      ctx.beginPath();
      ctx.ellipse(0, 2 * ds, 11 * ds, 7.5 * ds, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // Head
      ctx.beginPath();
      ctx.arc(7.5 * ds, -5.5 * ds, 6.2 * ds, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // Orange beak
      ctx.fillStyle = "#ff7b24";
      ctx.beginPath();
      ctx.ellipse(13.5 * ds, -4.5 * ds, 3.8 * ds, 2.2 * ds, 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // Eye
      ctx.fillStyle = "#2c1d11";
      ctx.beginPath();
      ctx.arc(9 * ds, -7 * ds, 1.4 * ds, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  function drawBarnAndCow(){
    var b = track.barnPt;
    var c = track.cowPt;
    var S = play.scale;

    // 1. Red Wooden Barn
    ctx.save();
    ctx.translate(b.x, b.y);
    var bScale = 1 + Math.sin(barnBounce * Math.PI) * 0.12;
    ctx.scale(bScale, 2 - bScale);
    // Ground shadow
    ctx.fillStyle = "rgba(38, 76, 26, 0.24)";
    ctx.beginPath();
    ctx.ellipse(0, 22 * S, 36 * S, 10 * S, 0, 0, Math.PI * 2);

  function drawCrossingGate(t){
    var cp = track.crossingPt;
    if(!cp) return;
    var S = play.scale;
    var nx = -Math.sin(cp.angle);
    var ny = Math.cos(cp.angle);
    var postX = cp.x + nx * 30 * S;
    var postY = cp.y + ny * 30 * S;

    ctx.save();
    ctx.translate(postX, postY);

    // Base shadow
    ctx.fillStyle = "rgba(38, 76, 26, 0.25)";
    ctx.beginPath();
    ctx.ellipse(0, 8 * S, 14 * S, 6 * S, 0, 0, Math.PI * 2);
    ctx.fill();

    // Striped crossing barrier arm (rotates smoothly up/down)
    ctx.save();
    ctx.translate(0, -6 * S);
    // Point arm across the track when lowered (gateAngle=1), raised up when open (gateAngle=0)
    var acrossAngle = Math.atan2(cp.y - postY, cp.x - postX);
    var armRot = acrossAngle - (1 - gateAngle) * 1.18;
    ctx.rotate(armRot);
    var armLen = 54 * S;
    ctx.fillStyle = "#fffdf8";
    ctx.strokeStyle = "#2c1d11";
    ctx.lineWidth = 2.2 * S;
    ctx.beginPath();
    ctx.roundRect(0, -4.5 * S, armLen, 9 * S, 4 * S);
    ctx.fill();
    ctx.stroke();
    // Red warning stripes
    ctx.fillStyle = "#e8483c";
    for(var s = 8; s < 46; s += 14){
      ctx.fillRect(s * S, -3.5 * S, 7 * S, 7 * S);
    }
    ctx.restore();

    // Wooden crossing post
    ctx.fillStyle = "#5c3412";
    ctx.strokeStyle = "#2c1d11";
    ctx.lineWidth = 2.2 * S;
    ctx.beginPath();
    ctx.roundRect(-4.5 * S, -28 * S, 9 * S, 35 * S, 4 * S);
    ctx.fill();
    ctx.stroke();

    // Twin flashing red warning lamps
    var active = gateAngle > 0.2;
    var leftLit = active && Math.sin(gateFlashPhase) > 0;
    var rightLit = active && Math.sin(gateFlashPhase) <= 0;

    ctx.fillStyle = "#2c1d11";
    ctx.beginPath();
    ctx.roundRect(-14 * S, -30 * S, 28 * S, 11 * S, 5 * S);
    ctx.fill();

    [[-7.5 * S, leftLit], [7.5 * S, rightLit]].forEach(function(lamp){
      if(lamp[1]){
        ctx.fillStyle = "rgba(255, 59, 48, 0.42)";
        ctx.beginPath();
        ctx.arc(lamp[0], -24.5 * S, 11 * S, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = lamp[1] ? "#ff3b30" : "#6b2320";
      ctx.beginPath();
      ctx.arc(lamp[0], -24.5 * S, 4.2 * S, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();
  }

  function drawMountainTunnelHill(){
    var mh = track.tunnelHill;
    if(!mh) return;
    var S = play.scale;
    ctx.save();

    var baseY = mh.cy;
    var peakY = baseY - mh.ry * 1.18;

    // Ground shadow
    ctx.fillStyle = "rgba(32, 66, 22, 0.24)";
    ctx.beginPath();
    ctx.ellipse(mh.cx, baseY + 6 * S, mh.rx * 1.04, 18 * S, 0, 0, Math.PI * 2);
    ctx.fill();

    // Lush sculpted storybook mountain hill spanning seamlessly over both tunnel portals
    var mg = ctx.createLinearGradient(mh.cx, peakY, mh.cx, baseY + 8 * S);
    mg.addColorStop(0, "#66b863");
    mg.addColorStop(0.52, "#46944d");
    mg.addColorStop(1, "#2f6e38");
    ctx.fillStyle = mg;
    ctx.strokeStyle = "#204c26";
    ctx.lineWidth = 3 * S;
    ctx.beginPath();
    ctx.moveTo(mh.cx - mh.rx, baseY);
    ctx.bezierCurveTo(
      mh.cx - mh.rx * 0.85, baseY - mh.ry * 0.92,
      mh.cx - mh.rx * 0.34, peakY,
      mh.cx, peakY
    );
    ctx.bezierCurveTo(
      mh.cx + mh.rx * 0.34, peakY,
      mh.cx + mh.rx * 0.85, baseY - mh.ry * 0.92,
      mh.cx + mh.rx, baseY
    );
    ctx.quadraticCurveTo(mh.cx, baseY + 18 * S, mh.cx - mh.rx, baseY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Cute snowy mountain peak cap clipped cleanly to peak silhouette
    ctx.save();
    ctx.clip();
    ctx.fillStyle = "#fffdf8";
    ctx.beginPath();
    ctx.moveTo(mh.cx - mh.rx * 0.30, peakY + mh.ry * 0.32);
    ctx.lineTo(mh.cx - mh.rx * 0.14, peakY + mh.ry * 0.24);
    ctx.lineTo(mh.cx, peakY + mh.ry * 0.35);
    ctx.lineTo(mh.cx + mh.rx * 0.14, peakY + mh.ry * 0.24);
    ctx.lineTo(mh.cx + mh.rx * 0.30, peakY + mh.ry * 0.32);
    ctx.lineTo(mh.cx + mh.rx * 0.34, peakY - 12 * S);
    ctx.lineTo(mh.cx - mh.rx * 0.34, peakY - 12 * S);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Re-stroke mountain peak outline cleanly over snow cap
    ctx.strokeStyle = "#204c26";
    ctx.lineWidth = 3 * S;
    ctx.beginPath();
    ctx.moveTo(mh.cx - mh.rx, baseY);
    ctx.bezierCurveTo(
      mh.cx - mh.rx * 0.85, baseY - mh.ry * 0.92,
      mh.cx - mh.rx * 0.34, peakY,
      mh.cx, peakY
    );
    ctx.bezierCurveTo(
      mh.cx + mh.rx * 0.34, peakY,
      mh.cx + mh.rx * 0.85, baseY - mh.ry * 0.92,
      mh.cx + mh.rx, baseY
    );
    ctx.stroke();

    // Two rustic stone-arched tunnel portals nestled cleanly into left & right slopes
    [mh.enterPt, mh.exitPt].forEach(function(pt){
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.fillStyle = "#2b1e16";
      ctx.strokeStyle = "#b58d5c";
      ctx.lineWidth = 5 * S;
      ctx.beginPath();
      ctx.arc(0, -1 * S, 18 * S, Math.PI, 0);
      ctx.lineTo(18 * S, 13 * S);
      ctx.lineTo(-18 * S, 13 * S);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "#5c3c1e";
      ctx.lineWidth = 2 * S;
      ctx.stroke();
      ctx.restore();
    });

    // Mini pine trees perched on the mountain slopes
    drawPineTree(mh.cx - mh.rx * 0.36, baseY - mh.ry * 0.36, 0.72, 0);
    drawPineTree(mh.cx + mh.rx * 0.36, baseY - mh.ry * 0.34, 0.76, 0);
    drawPineTree(mh.cx, baseY - mh.ry * 0.16, 0.64, 0);

    ctx.restore();
  }

  function drawPineTree(x, y, sz, wiggle){
    var S = play.scale * (sz || 1);
    ctx.save();
    ctx.translate(x, y);
    if(wiggle > 0){
      ctx.rotate(Math.sin(wiggle * Math.PI * 4) * 0.18 * wiggle);
    }
    // Shadow
    ctx.fillStyle = "rgba(38, 76, 26, 0.22)";
    ctx.beginPath();
    ctx.ellipse(0, 14 * S, 15 * S, 5.5 * S, 0, 0, Math.PI * 2);
    ctx.fill();
    // Wooden trunk
    ctx.fillStyle = "#8c5628";
    ctx.strokeStyle = "#3f220d";
    ctx.lineWidth = 2 * S;
    ctx.beginPath();
    ctx.roundRect(-4.2 * S, 2 * S, 8.4 * S, 12 * S, 2 * S);
    ctx.fill();
    ctx.stroke();
    // Layered wooden cone pine tiers
    var tiers = [
      { y: -2, w: 18, h: 16, col: "#2f9e44" },
      { y: -12, w: 14, h: 15, col: "#40c057" },
      { y: -21, w: 10, h: 13, col: "#69db7c" }
    ];
    tiers.forEach(function(tr){
      ctx.fillStyle = tr.col;
      ctx.beginPath();
      ctx.moveTo(0, (tr.y - tr.h) * S);
      ctx.lineTo(tr.w * S, (tr.y + 4) * S);
      ctx.lineTo(-tr.w * S, (tr.y + 4) * S);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    });
    ctx.restore();
  }

  function drawPlantedItems(){
    var S = play.scale;
    plantedItems.forEach(function(item){
      var pop = Math.min(1, item.age / 0.28);
      // Elastic spring overshoot
      var scale = pop < 1 ? (1 + Math.sin(pop * Math.PI) * 0.28) * pop : 1;
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.scale(scale, scale);

      if(item.kind === "pine"){
        drawPineTree(0, 0, 0.68, 0);
      } else {
        // Storybook blooming flower
        ctx.strokeStyle = "#2b8a3e";
        ctx.lineWidth = 2.6 * S;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, 6 * S);
        ctx.lineTo(0, -6 * S);
        ctx.stroke();
        // Petals
        ctx.fillStyle = item.color;
        ctx.strokeStyle = "#4d2c14";
        ctx.lineWidth = 1.4 * S;
        for(var p = 0; p < 5; p++){
          var a = (Math.PI * 2 * p) / 5 + item.rot;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * 6.5 * S, -7 * S + Math.sin(a) * 6.5 * S, 4.6 * S, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        // Golden center
        ctx.fillStyle = "#ffd43b";
        ctx.beginPath();
        ctx.arc(0, -7 * S, 4 * S, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    });
  }

  /* ==================== TRAIN ENGINE & 4 WOODEN CARS ==================== */
  function getTrainUnits(){
    var S = play.scale;
    var spacing = 54 * S;
    var units = [];
    // Index 0 = Engine, 1..carCount = attached cars trailing behind based on dir
    for(var i = 0; i <= state.carCount; i++){
      var sPos = trainS - state.dir * (i * spacing);
      var sample = sampleTrack(sPos);
      var heading = state.dir === 1 ? sample.angle : sample.angle + Math.PI;
      units.push({
        index: i,
        x: sample.x,
        y: sample.y,
        angle: heading,
        z: sample.z,
        inTunnel: sample.inTunnel
      });
    }
    return units;
  }

    ctx.beginPath();
    ctx.arc(mx, my, 4.4 * S, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.fill();

    // Blue-and-white striped Engineer Cap
    ctx.fillStyle = "#228be6";
    ctx.beginPath();
    ctx.arc(-2.5 * S, 0, 5.5 * S, Math.PI * 0.5, Math.PI * 1.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function drawTrainCar(u, t){
    var S = play.scale;
    var theme = CAR_THEMES[state.carTheme % CAR_THEMES.length];
    ctx.save();
    ctx.translate(u.x, u.y);

    // Shadow
    ctx.fillStyle = "rgba(30, 45, 20, 0.27)";

    ctx.roundRect(-21 * S, -13 * S + 5 * S, 42 * S, 26 * S, 8 * S);
    ctx.fill();

    // Wooden wheels
    ctx.fillStyle = "#ffd43b";
    ctx.strokeStyle = "#2c1d11";
    ctx.lineWidth = 2 * S;
    [[-11, -13.5], [11, -13.5], [-11, 13.5], [11, 13.5]].forEach(function(w){
      ctx.beginPath();
      ctx.roundRect((w[0] - 5) * S, (w[1] - 2.6) * S, 10 * S, 5.2 * S, 2 * S);
      ctx.fill();

    if(u.index === 1){

      ctx.stroke();
      // Heaped shiny wooden coal nuggets
      ctx.fillStyle = "#2f3542";
      [[-9, -4], [0, -5], [9, -3], [-6, 4], [4, 4], [0, 0]].forEach(function(cn){
        ctx.beginPath();
        ctx.arc(cn[0] * S, cn[1] * S, 5.2 * S, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

    } else if(u.index === 2){
      // CAR 2: Animal Caboose with peeking Cow & Duck!
      ctx.fillStyle = theme.caboose;

      ctx.fill();
      ctx.stroke();
      // Cozy cream open roof bay
      ctx.fillStyle = "#fff9e6";
      ctx.beginPath();
      ctx.roundRect(-15 * S, -9 * S, 30 * S, 18 * S, 5 * S);

      ctx.stroke();
      var bob = Math.sin(t * 7) * 1.4 * S;
      // Peeking Cow head (back half)
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(-6.5 * S, bob, 6.2 * S, 0, Math.PI * 2);

      ctx.stroke();
      ctx.fillStyle = "#ffafcc";
      ctx.beginPath();
      ctx.ellipse(-3 * S, bob, 3.2 * S, 4.2 * S, 0, 0, Math.PI * 2);

      ctx.fillStyle = theme.logs;
      ctx.beginPath();
      ctx.roundRect(-21 * S, -13 * S, 42 * S, 26 * S, 5 * S);
      ctx.fill();
      ctx.stroke();
      var logCols = ["#ff6b6b", "#ffd43b", "#51cf66", "#38a3f1", "#b197fc"];
      for(var l = 0; l < 5; l++){
        var ly = (-8.5 + l * 4.2) * S;
        ctx.fillStyle = logCols[l];
        ctx.beginPath();
        ctx.roundRect(-17 * S, ly - 2 * S, 34 * S, 4.2 * S, 2 * S);
        ctx.fill();
        ctx.stroke();
      }
    } else {

      ctx.fillStyle = theme.gift;

      // Ribbon bow stripes
      ctx.fillStyle = "#ffd43b";

      drawStarShape(0, 0, 8.8 * S, 4.2 * S, 5, "#fff3bf", "#8a501c", 2 * S);
