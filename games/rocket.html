<html lang="en">

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>3D Rocket Count-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#131d36; --gold:#ffd43b; --outline:#131d36; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; width:100%; height:100%; overflow:hidden; font-family:"Nunito",system-ui,sans-serif; background:#090d24; touch-action:none; }

  #stage{ position:fixed; inset:0; width:100%; height:100dvh; overflow:hidden; background:#090d24; }
  #gameCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:1; touch-action:none; }

  /* Top HUD */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding:max(10px, env(safe-area-inset-top)) 14px 0 64px;
    pointer-events:none;
  }
  .hud-left{ display:flex; align-items:center; gap:10px; pointer-events:auto; max-width:min(68vw, 600px); }
  #hootBtn{
    width:68px; height:68px; flex:0 0 68px; border-radius:50%;
    border:4px solid #fff;
    background:radial-gradient(circle at 35% 30%, #fff4b8, #ffc93c 65%, #f09800 100%);
    box-shadow:0 6px 0 var(--outline), 0 0 24px rgba(255,212,59,.65);
    padding:4px; cursor:pointer;
    animation:hootBob 2.2s ease-in-out infinite alternate;
  }
  #hootBtn:active{ transform:scale(.9); }
  @keyframes hootBob{ from{ transform:translateY(0); } to{ transform:translateY(-5px); } }
  #promptBubble{
    background:rgba(255,254,248,.96); color:var(--ink);
    border:4px solid var(--outline); border-radius:22px;
    padding:10px 16px; font-family:"Fredoka",sans-serif; font-weight:700;
    font-size:clamp(14px, 2.2vw, 18.5px); line-height:1.22;
    box-shadow:0 6px 0 var(--outline), 0 12px 26px rgba(0,0,0,.42);
  }
  #promptBubble b{ color:#e11d48; }

  .hud-right{ display:flex; align-items:center; gap:8px; pointer-events:auto; }
  #passportBar{
    display:flex; align-items:center; gap:6px;
    background:rgba(15,23,42,.86); border:3.5px solid #fde047;
    border-radius:999px; padding:4px 10px; box-shadow:0 5px 0 var(--outline);
  }
  .pbadge{
    width:38px; height:38px; border-radius:50%;
    border:3px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12);
    display:grid; place-items:center; font-size:20px; cursor:pointer; padding:0;
    filter:grayscale(1) opacity(.4); transition:transform .35s cubic-bezier(.34,1.8,.5,1), filter .3s;
  }
  .pbadge.earned{
    filter:none; border-color:#131d36;
    background:radial-gradient(circle at 32% 28%, #fef08a, #facc15 65%, #d97706 100%);
    box-shadow:0 0 16px rgba(250,204,21,.95);
    animation:popBadge .55s cubic-bezier(.34,1.8,.5,1);
  }
  @keyframes popBadge{ 0%{ transform:scale(.4) rotate(-20deg); } 65%{ transform:scale(1.3) rotate(8deg); } 100%{ transform:scale(1) rotate(0); } }

  #starPill{
    display:flex; align-items:center; gap:6px;
    background:#fffef8; border:4px solid var(--outline); border-radius:999px;
    padding:6px 14px; font-family:"Fredoka",sans-serif; font-weight:800; font-size:20px; color:var(--ink);
    box-shadow:0 5px 0 var(--outline);
  }
  #doneBtn{
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:17px;
    padding:8px 16px; cursor:pointer; white-space:nowrap;
    box-shadow:0 5px 0 var(--outline); text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  #doneBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--outline); }

  /* Giant Center Countdown Banner */
  #countdownBanner{
    position:absolute; left:50%; top:34%; transform:translate(-50%, -50%) scale(.4);
    z-index:15; pointer-events:none; opacity:0;
    font-family:"Fredoka",sans-serif; font-weight:800;
    font-size:clamp(76px, 16vw, 140px); color:#fde047;
    text-shadow:0 8px 0 #131d36, 0 0 46px rgba(251,146,60,.98);
    transition:transform .22s cubic-bezier(.34,1.8,.5,1), opacity .22s;
    white-space:nowrap;
  }
  #countdownBanner.show{ opacity:1; transform:translate(-50%, -50%) scale(1); }

  /* Flight Steer Hint Pill */
  #flightBanner{
    position:absolute; left:50%; bottom:108px; transform:translateX(-50%);
    z-index:14; pointer-events:none;
    background:rgba(15,23,42,.86); border:3.5px solid #38bdf8; border-radius:999px;
    padding:8px 22px; color:#fff; font-family:"Fredoka",sans-serif; font-weight:800;
    font-size:clamp(15px, 2.3vw, 20px); box-shadow:0 6px 22px rgba(0,0,0,.5);
    white-space:nowrap;
  }

  /* Center Action Stage (Number Pods / BLAST OFF / Next Planet) */
  #actionStage{
    position:absolute; left:0; right:0; bottom:94px; z-index:12;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    pointer-events:none; padding:0 12px;
  }
  #podRow{
    display:flex; align-items:center; justify-content:center; gap:clamp(14px, 3vw, 26px);
    pointer-events:auto;
  }
  .num-pod{
    position:relative; min-width:clamp(104px, 20vw, 144px); min-height:clamp(106px, 18vh, 134px);
    border-radius:28px; border:5px solid #fff;
    background:linear-gradient(180deg, #38bdf8 0%, #2563eb 100%);
    box-shadow:0 10px 0 #131d36, 0 18px 34px rgba(0,0,0,.5), inset 0 6px 0 rgba(255,255,255,.48);
    color:#fff; cursor:pointer; padding:8px 12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    transition:transform .16s cubic-bezier(.34,1.8,.5,1), box-shadow .16s;
  }
  .num-pod:nth-child(2){ background:linear-gradient(180deg, #f472b6 0%, #db2777 100%); }
  .num-pod:nth-child(3){ background:linear-gradient(180deg, #fbbf24 0%, #ea580c 100%); }
  .num-pod:active{ transform:translateY(6px); box-shadow:0 4px 0 #131d36; }
  .num-pod.hint-glow{
    border-color:#fde047;
    box-shadow:0 0 0 7px #fde047, 0 10px 0 #131d36, 0 0 38px rgba(253,224,71,1);
    animation:podPulse .55s ease-in-out infinite alternate;
  }
  @keyframes podPulse{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-8px) scale(1.08); } }
  .num-pod.shake{ animation:podShake .4s ease-in-out; }
  @keyframes podShake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-11px); } 75%{ transform:translateX(11px); } }
  .pod-num{
    font-family:"Fredoka",sans-serif; font-weight:800;
    font-size:clamp(42px, 7vw, 58px); line-height:1;
    text-shadow:0 4px 0 rgba(19,29,54,.45);
  }
  .pod-dots{
    font-size:clamp(14px, 2.2vw, 18px); line-height:1.08; letter-spacing:1px;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,.35)); max-width:118px;
  }

  #launchBtn, #nextPlanetBtn{
    pointer-events:auto;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    border:6px solid #fff; border-radius:999px;
    padding:14px 36px; cursor:pointer;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:clamp(24px, 4.4vw, 34px); color:#fff;
    text-shadow:0 3px 0 rgba(19,29,54,.45);
    animation:blastPulse .55s ease-in-out infinite alternate;
  }
  #launchBtn{
    background:radial-gradient(circle at 35% 25%, #fca5a5 0%, #ef4444 45%, #b91c1c 100%);
    box-shadow:0 10px 0 #131d36, 0 0 42px rgba(239,68,68,.95);
  }
  #nextPlanetBtn{
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    box-shadow:0 10px 0 #131d36, 0 0 38px rgba(74,222,128,.9);
  }
  #launchBtn:active, #nextPlanetBtn:active{ transform:translateY(6px); }
  @keyframes blastPulse{
    from{ transform:scale(1); box-shadow:0 10px 0 #131d36, 0 0 0 0 rgba(253,224,71,.7); }
    to{ transform:scale(1.07); box-shadow:0 10px 0 #131d36, 0 0 0 10px rgba(253,224,71,.95); }
  }
  .tap-finger{
    display:inline-block; font-size:34px; line-height:1;
    animation:fingerHop .5s ease-in-out infinite alternate;
  }
  @keyframes fingerHop{ from{ transform:translateY(0); } to{ transform:translateY(-8px) scale(1.15); } }

  /* Bottom Space Command Console */
  #commandBar{
    position:absolute; left:50%; bottom:max(10px, env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:11;
    width:min(96vw, 760px);
    background:linear-gradient(180deg, rgba(24,35,76,.92) 0%, rgba(12,18,44,.95) 100%);
    backdrop-filter:blur(10px);
    border:4px solid #38bdf8; border-radius:26px;
    padding:8px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 8px 0 #090d24, 0 14px 32px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.28);
  }
  .paint-row{ display:flex; align-items:center; gap:8px; }
  .paint-lbl{ font-family:"Fredoka",sans-serif; font-weight:800; font-size:14px; color:#bae6fd; white-space:nowrap; }
  .paint-dot{
    width:44px; height:44px; border-radius:50%;
    border:4px solid #fff; cursor:pointer; padding:0;
    box-shadow:0 4px 0 #090d24, inset 0 4px 6px rgba(255,255,255,.48);
    transition:transform .16s cubic-bezier(.34,1.8,.5,1);
  }
  .paint-dot:active{ transform:scale(.88); }
  .paint-dot.on{ transform:scale(1.16); border-color:#fde047; box-shadow:0 0 0 3px #fde047, 0 4px 0 #090d24; }
  .console-right{ display:flex; align-items:center; gap:8px; }
  .ctrl-pill{
    border:3.5px solid #131d36; border-radius:999px;
    background:linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
    color:#131d36; font-family:"Fredoka",sans-serif; font-weight:800; font-size:15px;
    padding:8px 14px; cursor:pointer; white-space:nowrap;
    box-shadow:0 4px 0 #131d36;
  }
  .ctrl-pill:active{ transform:translateY(3px); box-shadow:0 1px 0 #131d36; }
  #rangeBtn{ background:linear-gradient(180deg, #e0f2fe 0%, #7dd3fc 100%); }

  /* Win Overlay */
  #winOverlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(9,13,36,.74); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .win-card{
    background:linear-gradient(180deg, #fffef8 0%, #fef3c7 100%);
    border:6px solid var(--outline); border-radius:34px;
    padding:26px 24px; text-align:center; max-width:440px; width:100%;
    box-shadow:0 14px 0 var(--outline), 0 26px 50px rgba(0,0,0,.55);
  }
  .win-trophy{ font-size:74px; line-height:1; margin-bottom:8px; }
  .win-card h2{ margin:0 0 8px; font-family:"Fredoka",sans-serif; font-size:34px; color:#131d36; }
  .win-card p{ margin:0 0 18px; font-weight:800; font-size:18px; color:#334155; }
  .big-play{
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:22px;
    padding:12px 32px; cursor:pointer; box-shadow:0 7px 0 var(--outline);
  }

  @media (max-width: 680px){
    #passportBar{ display:none; }
    .paint-lbl{ display:none; }
    .paint-dot{ width:38px; height:38px; }
    #actionStage{ bottom:86px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gameCanvas" aria-label="Pixar 3D Rocket Space Adventure"></canvas>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-left">
      <button id="hootBtn" type="button" aria-label="Tap Hoot to hear again">
        <svg viewBox="0 0 200 210" aria-hidden="true"><path d="M82 178 L100 205 L118 178 Z" fill="#8a5a33"/><ellipse cx="34" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(14 34 128)"/><ellipse cx="166" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(-14 166 128)"/><ellipse cx="100" cy="118" rx="66" ry="72" fill="#a06a3b"/><ellipse cx="100" cy="140" rx="44" ry="46" fill="#fdeed3"/><path d="M52 44 Q40 14 62 22 Q74 27 70 48 Z" fill="#8a5a33"/><path d="M148 44 Q160 14 138 22 Q126 27 130 48 Z" fill="#8a5a33"/><circle cx="100" cy="72" r="52" fill="#a06a3b"/><ellipse cx="78" cy="74" rx="24" ry="26" fill="#fdeed3"/><ellipse cx="122" cy="74" rx="24" ry="26" fill="#fdeed3"/><circle cx="78" cy="72" r="11" fill="#17324f"/><circle cx="122" cy="72" r="11" fill="#17324f"/><circle cx="82" cy="68" r="4" fill="#fff"/><circle cx="126" cy="68" r="4" fill="#fff"/><circle cx="56" cy="94" r="8" fill="#ffb59d" opacity=".85"/><circle cx="144" cy="94" r="8" fill="#ffb59d" opacity=".85"/><path d="M90 88 Q100 84 110 88 Q106 102 100 104 Q94 102 90 88 Z" fill="#ff9f1c" stroke="#e07f00" stroke-width="1.5"/></svg>
      </button>
      <div id="promptBubble" aria-live="polite">🚀 <b>3D ROCKET!</b> Tap the glowing <b>Golden Stars</b> to fuel Hoot's rocket ship!</div>
    </div>
    <div class="hud-right">
      <div id="passportBar" aria-label="Visited planets">
        <button type="button" class="pbadge" data-pl="0" title="Cheese Moon">🌕</button>
        <button type="button" class="pbadge" data-pl="1" title="Rainbow Saturn">🪐</button>
        <button type="button" class="pbadge" data-pl="2" title="Candy Star">🍬</button>
      </div>
      <div id="starPill">⭐ <span id="starCount">0</span></div>
      <button id="doneBtn" type="button">🏆 Done</button>
    </div>
  </div>

  <!-- Big 3-2-1 Countdown Banner -->
  <div id="countdownBanner" aria-live="assertive">3</div>

  <!-- Interactive Space Flight Banner -->
  <div id="flightBanner" hidden>✨ Slide your finger left or right through the Rainbow Hoops! ✨</div>

  <!-- Phase Action Controls (Number Pods / BLAST OFF / Next Planet) -->
  <div id="actionStage">
    <div id="podRow" hidden></div>
    <button id="launchBtn" type="button" hidden><span>🚀 BLAST OFF!</span><span class="tap-finger" aria-hidden="true">👆</span></button>
    <button id="nextPlanetBtn" type="button" hidden><span>🚀 Next Planet!</span><span class="tap-finger" aria-hidden="true">👆</span></button>
  </div>

  <!-- Bottom Space Command Console -->
  <div id="commandBar" role="group" aria-label="Rocket paint and controls">
    <div class="paint-row">
      <span class="paint-lbl">🎨 Paint:</span>
      <button type="button" class="paint-dot on" data-col="red" style="background:linear-gradient(180deg,#ff6b6b,#dc2626)" aria-label="Red rocket"></button>
      <button type="button" class="paint-dot" data-col="blue" style="background:linear-gradient(180deg,#60a5fa,#2563eb)" aria-label="Blue rocket"></button>
      <button type="button" class="paint-dot" data-col="yellow" style="background:linear-gradient(180deg,#fde047,#eab308)" aria-label="Yellow rocket"></button>
      <button type="button" class="paint-dot" data-col="pink" style="background:linear-gradient(180deg,#f472b6,#db2777)" aria-label="Pink rocket"></button>
      <button type="button" class="paint-dot" data-col="green" style="background:linear-gradient(180deg,#4ade80,#16a34a)" aria-label="Green rocket"></button>
    </div>
    <div class="console-right">
      <button type="button" id="rangeBtn" class="ctrl-pill">⭐ 1–5</button>
      <button type="button" id="boostBtn" class="ctrl-pill">🔥 Boost!</button>
    </div>
  </div>

  <!-- Win Overlay -->
  <div id="winOverlay" hidden>
    <div class="win-card">
      <div class="win-trophy" aria-hidden="true">🚀🪐🌕🍬</div>
      <h2>Space Captain!</h2>
      <p>You fueled Hoot's rocket, flew through the Rainbow Space Hoops, and danced with our Space Friends!</p>
      <button id="againBtn" class="big-play" type="button">↻ Keep Flying</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================================
     1. VOICE ENGINE (100% Real Studio Hoot Clips, Atomic Generation Guard)
     ========================================================================= */
  var voiceA = new Audio();
  var voiceGen = 0, lastStepClips = null, idleHelpTimer = null, idleHelpReminded = false;
  var won = false;

  function hasClip(id){
    try{
      if(window.parent && window.parent.HOOT_HAVE && window.parent.HOOT_HAVE[id]) return true;
      if(window.HOOT_HAVE && window.HOOT_HAVE[id]) return true;
    }catch(e){}
    return false;
  }
  function resolveCmd(preferredId, fallbacks){
    if(preferredId && hasClip(preferredId)) return [preferredId];
    return (fallbacks && fallbacks.length) ? fallbacks.slice() : [];
  }
  function clearIdleHelp(){
    if(idleHelpTimer){ clearTimeout(idleHelpTimer); idleHelpTimer = null; }
  }
  function armIdleHelp(){
    clearIdleHelp();
    if(won || !lastStepClips || !lastStepClips.length || idleHelpReminded) return;
    idleHelpTimer = setTimeout(function(){
      if(won || !lastStepClips || !lastStepClips.length) return;
      idleHelpReminded = true;
      playVoice(lastStepClips);
    }, 11000);
  }
  window.addEventListener("pointerdown", function(){
    idleHelpReminded = false;
    armIdleHelp();
  }, true);

  function playVoice(clips){
    if(!clips || !clips.length) return;
    var myGen = ++voiceGen, i = 0;
    voiceA.onended = null; voiceA.onerror = null;
    try{ voiceA.pause(); }catch(e){}
    function step(){
      if(myGen !== voiceGen || i >= clips.length) return;
      var id = clips[i++];
      if(!id){ step(); return; }
      voiceA.src = "assets/voice/" + id + ".mp3";
      voiceA.onended = step; voiceA.onerror = step;
      var p = voiceA.play(); if(p && p.catch) p.catch(function(){});
    }
    step();
  }
  function setStepVoice(preferredId, fallbacks, speakNow){
    var seq = resolveCmd(preferredId, fallbacks);
    lastStepClips = seq;
    idleHelpReminded = false;
    armIdleHelp();
    if(speakNow !== false && seq.length) playVoice(seq);
  }

  /* =========================================================================
     2. CINEMATIC WEBAUDIO SYNTHESIZER
     ========================================================================= */
  var actx = null;
  function ac(){
    if(!actx){ var A = window.AudioContext || window.webkitAudioContext; if(A) actx = new A(); }
    if(actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  var PENTA = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.5, 1567.98];
  function sfxStarCollect(idx){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime, f = PENTA[(idx || 0) % PENTA.length];
      [f, f * 1.5].forEach(function(freq, k){
        var o = c.createOscillator(), g = c.createGain();
        o.type = k === 0 ? "triangle" : "sine";
        o.frequency.setValueAtTime(freq, t + k * 0.05);
        g.gain.setValueAtTime(0.14, t + k * 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.36 + k * 0.05);
        o.connect(g); g.connect(c.destination);
        o.start(t + k * 0.05); o.stop(t + 0.4 + k * 0.05);
      });
    }catch(e){}
  }
  function sfxCountdownBeep(finalBeep){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime, o = c.createOscillator(), g = c.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(finalBeep ? 1046.5 : 587.33, t);
      if(finalBeep) o.frequency.exponentialRampToValueAtTime(1567.98, t + 0.25);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + (finalBeep ? 0.52 : 0.24));
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.54);
    }catch(e){}
  }
  function sfxRocketRoar(duration){
    try{
      var c = ac(); if(!c) return;
      var dur = duration || 2.2, t = c.currentTime;
      var len = Math.floor(c.sampleRate * dur);
      var buf = c.createBuffer(1, len, c.sampleRate);
      var d = buf.getChannelData(0);
      for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1);
      var src = c.createBufferSource(); src.buffer = buf;
      var flt = c.createBiquadFilter(); flt.type = "lowpass";
      flt.frequency.setValueAtTime(220, t);
      flt.frequency.linearRampToValueAtTime(720, t + dur * 0.38);
      flt.frequency.exponentialRampToValueAtTime(140, t + dur);
      var g = c.createGain();
      g.gain.setValueAtTime(0.01, t);
      g.gain.linearRampToValueAtTime(0.22, t + 0.24);
      g.gain.exponentialRampToValueAtTime(0.002, t + dur);
      src.connect(flt); flt.connect(g); g.connect(c.destination);
      src.start(t);
    }catch(e){}
  }
  function sfxBoing(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime, o = c.createOscillator(), g = c.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(260, t);
      o.frequency.exponentialRampToValueAtTime(720, t + 0.14);
      o.frequency.exponentialRampToValueAtTime(440, t + 0.26);

  function getPaintedRocket(colKey){
    var baseImg = ART.rocket;
    if(!baseImg || !baseImg.complete || !baseImg.naturalWidth) return null;
    if(colKey === "red" || !ROCKET_PAINTS[colKey] || !ROCKET_PAINTS[colKey].nose) return baseImg;
    if(paintedRocketCache[colKey]) return paintedRocketCache[colKey];
    try{
      var cfg = ROCKET_PAINTS[colKey];
      var cv = document.createElement("canvas");
      cv.width = baseImg.naturalWidth; cv.height = baseImg.naturalHeight;
      var g = cv.getContext("2d");
      g.drawImage(baseImg, 0, 0);
      var id = g.getImageData(0, 0, cv.width, cv.height);
      var d = id.data, w = cv.width, h = cv.height;
      for(var y = 0; y < h; y++){
        for(var x = 0; x < w; x++){
          var i = (y * w + x) * 4;
          if(d[i + 3] < 20) continue;
          var r = d[i], gr = d[i + 1], b = d[i + 2];
          /* Upper nose cone glossy crimson band (y < 0.34*h) — completely outside Hoot's porthole! */
          if(y < h * 0.33 && r > 90 && (r - Math.max(gr, b)) > 36){
            var lum = Math.min(1.45, (r * 0.65 + gr * 0.25 + b * 0.1) / 145);
            var spec = Math.max(0, Math.min(gr, b) - 22) * 0.85;
            d[i]     = Math.min(255, Math.round(cfg.nose[0] * lum + spec));
            d[i + 1] = Math.min(255, Math.round(cfg.nose[1] * lum + spec));
            d[i + 2] = Math.min(255, Math.round(cfg.nose[2] * lum + spec));
          }
          /* Lower side swept cobalt-blue fins (y > 0.56*h) */
          else if(y > h * 0.56 && b > 95 && (b - Math.max(r, gr)) > 32){
            var lumF = Math.min(1.45, (b * 0.65 + gr * 0.25 + r * 0.1) / 155);
            var specF = Math.max(0, Math.min(r, gr) - 18) * 0.7;
            d[i]     = Math.min(255, Math.round(cfg.fin[0] * lumF + specF));
            d[i + 1] = Math.min(255, Math.round(cfg.fin[1] * lumF + specF));
            d[i + 2] = Math.min(255, Math.round(cfg.fin[2] * lumF + specF));
          }
        }
      }
      g.putImageData(id, 0, 0);
      paintedRocketCache[colKey] = cv;
      return cv;

  function drawCover(img, alpha, offsetY, zoom){
    if(!img || !img.complete || !img.naturalWidth) return;
    ctx.save();
    if(alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
    var z = zoom || 1.0;
    var sc = Math.max(W / img.naturalWidth, H / img.naturalHeight) * z;
    var dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
    var dx = (W - dw) * 0.5;
    var dy = (H - dh) * 0.5 + (offsetY || 0);
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();
  }

      if(best){ collectStar(best); return; }
    }

    /* 2. Tap Dancing Space Friends on Landed Planet to do a 360° Backflip! */
    if(phase === "landed"){
      var bh = Math.min(H * 0.25, 190);
      for(var bi = 0; bi < buddies.length; bi++){
        var b = buddies[bi];
        var bx = b.xPct * W, by = b.yPct * H;
        if(Math.hypot(cx - bx, cy - by) < bh * 0.58){
          b.flipT = 1.0;
          sfxBoing();
          spawnSparkles(bx, by - 20, 22, ["#fde047", "#f472b6", "#38bdf8", "#4ade80"], 240);
          return;
        }
      }
    }

    /* 3. Tap the Rocket anytime for a playful bounce + booster puff! */
    var rm = getRocketMetrics();
    if(Math.abs(cx - rm.x) < rm.w * 0.6 && Math.abs(cy - rm.y) < rm.h * 0.55){
      rocket.bounce = 1.05;
      boostFlashT = 0.42;
      sfxBoing();
      spawnSparkles(rm.x, rm.y, 18, ["#fde047", "#38bdf8", "#ffffff"], 210);
      return;
    }

    /* 4. Tap anywhere in the sky for magical twinkling stardust! */
    spawnSparkles(cx, cy, 10, ["#fde047", "#7dd3fc", "#f9a8d4"], 140);
  }

  canvas.addEventListener("pointerdown", function(e){
    e.preventDefault();
    if(phase === "flight"){
      draggingFlight = true;
      rocket.targetX = Math.max(0.14, Math.min(0.86, e.clientX / W));
      return;
    }
    handleTapAt(e.clientX, e.clientY);
  });
  window.addEventListener("pointermove", function(e){
    if(phase === "flight" && draggingFlight){
      rocket.targetX = Math.max(0.14, Math.min(0.86, e.clientX / W));
    }
  });
  window.addEventListener("pointerup", function(){ draggingFlight = false; });

  /* =========================================================================
     7. 60FPS PIXAR RENDERING ENGINE
     ========================================================================= */
  var lastTime = performance.now(), tAcc = 0;

  function drawStarShape(x, y, r, col){
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = col;
    ctx.beginPath();
    for(var i = 0; i < 10; i++){
      var a = (i / 10) * Math.PI * 2 - Math.PI / 2;
      var rad = i % 2 === 0 ? r : r * 0.44;
      if(i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawVolumetricFlame(x, y, scale, intensity){
    if(intensity <= 0.02) return;
    var flk = 0.88 + Math.sin(tAcc * 52) * 0.16;
    var h = 95 * scale * intensity * flk;
    var w = 42 * scale * (0.85 + intensity * 0.25);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    /* Soft volumetric fire bloom halo */
    var bloom = ctx.createRadialGradient(x, y + h * 0.3, 6, x, y + h * 0.35, h * 1.15);
    bloom.addColorStop(0, "rgba(255,220,110,0.85)");
    bloom.addColorStop(0.45, "rgba(249,115,22,0.48)");
    bloom.addColorStop(1, "rgba(249,115,22,0)");
    ctx.fillStyle = bloom;
    ctx.beginPath(); ctx.arc(x, y + h * 0.35, h * 1.15, 0, Math.PI * 2); ctx.fill();

    /* Outer fiery tongue */
    var og = ctx.createLinearGradient(x, y, x, y + h);
    og.addColorStop(0, "#ffffff");
    og.addColorStop(0.28, "#fde047");
    og.addColorStop(0.68, "#f97316");
    og.addColorStop(1, "rgba(239,68,68,0)");
    ctx.fillStyle = og;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.55, y);
    ctx.quadraticCurveTo(x - w * 0.72, y + h * 0.52, x, y + h);
    ctx.quadraticCurveTo(x + w * 0.72, y + h * 0.52, x + w * 0.55, y);
    ctx.closePath();
    ctx.fill();

    /* Inner white-hot plasma core */
    ctx.fillStyle = "#fffef0";
    ctx.beginPath();
    ctx.moveTo(x - w * 0.28, y);
    ctx.quadraticCurveTo(x - w * 0.32, y + h * 0.35, x, y + h * 0.62);
    ctx.quadraticCurveTo(x + w * 0.32, y + h * 0.35, x + w * 0.28, y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawGlassFuelTube(){
    if(phase !== "collect" && phase !== "match" && phase !== "ready" && phase !== "countdown") return;
    var r = getFuelTubeRect();
    var targetPct = targetCount > 0 ? Math.min(1, collectedCount / targetCount) : 0;
    fuelDisplay += (targetPct - fuelDisplay) * 0.1;

    ctx.save();
    /* Ground shadow */
    ctx.fillStyle = "rgba(9,13,36,0.42)";
    ctx.beginPath(); ctx.ellipse(r.cx, r.y + r.h + 10, r.w * 0.78, 12, 0, 0, Math.PI * 2); ctx.fill();

    /* Tube back dark glass */
    ctx.fillStyle = "rgba(15,23,54,0.68)";
    ctx.strokeStyle = "#7dd3fc";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, r.w * 0.45);
    ctx.fill(); ctx.stroke();

    /* Glowing rising liquid star-fuel plasma */
    var fh = Math.max(0, (r.h - 14) * fuelDisplay);
    if(fh > 4){
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(r.x + 6, r.y + 7, r.w - 12, r.h - 14, r.w * 0.35);
      ctx.clip();
      var lg = ctx.createLinearGradient(0, r.y + r.h, 0, r.y);
      lg.addColorStop(0, "#0ea5e9");
      lg.addColorStop(0.5, "#4ade80");
      lg.addColorStop(1, "#fde047");
      ctx.fillStyle = lg;
      ctx.fillRect(r.x + 6, r.y + r.h - 7 - fh, r.w - 12, fh + 4);
      /* Rising energy bubbles inside fuel */
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      for(var b = 0; b < 4; b++){
        var by = r.y + r.h - 12 - ((tAcc * 55 + b * 48) % Math.max(18, fh));
        var bx = r.cx + Math.sin(tAcc * 3 + b * 2) * (r.w * 0.18);
        ctx.beginPath(); ctx.arc(bx, by, 4 + (b % 2) * 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    /* Crisp vertical glass specular highlight */
    ctx.fillStyle = "rgba(255,255,255,0.34)";
    ctx.beginPath();
    ctx.roundRect(r.x + 10, r.y + 14, 9, r.h - 28, 5);
    ctx.fill();

    /* Metallic top & bottom caps + star counter badge */
    var capG = ctx.createLinearGradient(r.x, 0, r.x + r.w, 0);
    capG.addColorStop(0, "#475569"); capG.addColorStop(0.5, "#e2e8f0"); capG.addColorStop(1, "#334155");
    ctx.fillStyle = capG; ctx.strokeStyle = "#131d36"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(r.x - 5, r.y - 6, r.w + 10, 18, 9); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(r.x - 6, r.y + r.h - 10, r.w + 12, 20, 9); ctx.fill(); ctx.stroke();

    /* Counter pill underneath */
    ctx.fillStyle = fuelDisplay > 0.96 ? "#4ade80" : "#fde047";
    ctx.strokeStyle = "#131d36"; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.roundRect(r.cx - 34, r.y + r.h + 14, 68, 30, 15); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#131d36";
    ctx.font = '800 17px "Fredoka", sans-serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(collectedCount + " / " + targetCount, r.cx, r.y + r.h + 29);
    ctx.restore();
  }

  function render(now){
    requestAnimationFrame(render);
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now; tAcc += dt;

    /* Update Phase Physics */
    if(sceneFade.t < 1) sceneFade.t = Math.min(1, sceneFade.t + dt * 2.2);
    if(boostFlashT > 0) boostFlashT = Math.max(0, boostFlashT - dt);
    if(plasmaBeamT > 0) plasmaBeamT = Math.max(0, plasmaBeamT - dt * 1.4);
    if(screenShake > 0) screenShake = Math.max(0, screenShake - dt * 1.6);
    if(rocket.bounce > 0) rocket.bounce = Math.max(0, rocket.bounce - dt * 2.4);

    if(phase === "countdown"){
      phaseT += dt;
      var rmC = getRocketMetrics();
      if(Math.random() < 0.85) spawnSmoke(rmC.x, rmC.y + rmC.h * 0.45, 2, 74, 55);
    } else if(phase === "liftoff"){
      phaseT += dt;
      rocket.y -= dt * (0.25 + phaseT * 1.15);
      var rmL = getRocketMetrics();
      spawnSmoke(rmL.x, rmL.y + rmL.h * 0.46, 3, 62, 130);
      if(rocket.y < -0.22 || phaseT > 1.35) startSpaceFlight();
    } else if(phase === "flight"){
      phaseT += dt;
      spaceScroll += dt * 210;
      /* Gentle toddler auto-assist if not actively dragging */
      if(!draggingFlight){
        var nextH = hoops.find(function(h){ return !h.hit && h.y < rocket.y * H + 40; });
        if(nextH) rocket.targetX += (nextH.xPct - rocket.targetX) * Math.min(1, dt * 2.1);
      }
      var prevX = rocket.x;
      rocket.x += (rocket.targetX - rocket.x) * Math.min(1, dt * 8.5);
      rocket.tilt = Math.max(-0.32, Math.min(0.32, (rocket.x - prevX) * 28));

      var rmF = getRocketMetrics();
      if(Math.random() < 0.85) spawnSmoke(rmF.x, rmF.y + rmF.h * 0.48, 1, 22, 240);

      hoops.forEach(function(h){
        h.y += dt * 310;
        if(!h.hit && Math.abs(h.y - rmF.y) < 62 && Math.abs(h.xPct * W - rmF.x) < 135){
          h.hit = true;
          totalStarsEarned++;
          starCountEl.textContent = String(totalStarsEarned);
          rocket.bounce = 0.85;
          sfxRingBoost(h.idx);
          spawnSparkles(h.xPct * W, h.y, 28, [h.col, "#fde047", "#ffffff", "#38bdf8"], 320);
        }
      });
      if(phaseT > 5.8 || hoops.every(function(h){ return h.y > H + 120; })){
        startPlanetLanding();
      }
    } else if(phase === "landing"){
      phaseT += dt;
      rocket.y += (0.56 - rocket.y) * Math.min(1, dt * 3.1);
      var rmD = getRocketMetrics();
      if(Math.random() < 0.7) spawnSmoke(rmD.x, rmD.y + rmD.h * 0.48, 1, 34, 90);
      if(Math.abs(rocket.y - 0.56) < 0.015){
        enterLandedParty();
      }
    } else if(phase === "landed"){
      phaseT += dt;
      buddies.forEach(function(b){ if(b.flipT > 0) b.flipT = Math.max(0, b.flipT - dt * 1.45); });
      fireworkT += dt;
      if(fireworkT > 1.25){
        fireworkT = 0;
        spawnSparkles(W * (0.18 + Math.random() * 0.64), H * (0.16 + Math.random() * 0.24), 26, ["#fde047", "#f472b6", "#38bdf8", "#4ade80", "#fb923c"], 270);
      }
    }

    /* Update flying stars & particles */
    for(var fsi = flyingStars.length - 1; fsi >= 0; fsi--){
      var fs = flyingStars[fsi];
      fs.t = Math.min(1, fs.t + dt * 1.9);
      if(fs.t >= 1){
        spawnSparkles(fs.x1, fs.y1, 16, ["#38bdf8", "#fde047", "#ffffff"], 180);
        flyingStars.splice(fsi, 1);
      }
    }
    for(var si = smoke.length - 1; si >= 0; si--){
      var sm = smoke[si];
      sm.life -= sm.decay * dt;
      if(sm.life <= 0){ smoke.splice(si, 1); continue; }
      sm.x += sm.vx * dt; sm.y += sm.vy * dt; sm.r += sm.grow * dt;
    }
    for(var pi = particles.length - 1; pi >= 0; pi--){
      var p = particles[pi];
      p.life -= p.decay * dt;
      if(p.life <= 0){ particles.splice(pi, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
    }

    /* ==================== DRAW FRAME ==================== */
    ctx.save();
    if(screenShake > 0 || rocket.rumble > 0.5){
      var shk = (screenShake * 7 + (rocket.rumble > 0.5 ? 2.5 : 0));
      ctx.translate((Math.random() - 0.5) * shk, (Math.random() - 0.5) * shk);
    }

    /* 1. Lush Pixar 3D Backdrop with Smooth Crossfade & Seamless Mirrored Flight Scrolling */
    if(phase === "flight"){
      var spImg = ART.space;
      if(spImg && spImg.complete && spImg.naturalWidth){
        /* Crop to pure starry cosmic nebula (top 72%) and mirror-tile vertically so there is ZERO horizontal seam! */
        var srcH = Math.floor(spImg.naturalHeight * 0.72);
        var sc = Math.max(W / spImg.naturalWidth, H / srcH) * 1.04;
        var dw = spImg.naturalWidth * sc, dh = srcH * sc;
        var dx = (W - dw) * 0.5;
        var cycle = dh * 2;
        var off = spaceScroll % cycle;
        for(var k = -1; k <= 2; k++){
          var ty = off + k * dh - dh;
          if(ty > H + 10 || ty + dh < -10) continue;
          var flip = ((k % 2) + 2) % 2 === 1;
          ctx.save();
          if(flip){
            ctx.translate(0, ty + dh);
            ctx.scale(1, -1);
            ctx.drawImage(spImg, 0, 0, spImg.naturalWidth, srcH, dx, 0, dw, dh);
          } else {
            ctx.drawImage(spImg, 0, 0, spImg.naturalWidth, srcH, dx, ty, dw, dh);
          }
          ctx.restore();
        }
      }
      /* Warp-speed cosmic streaks */
      ctx.save();
      ctx.lineCap = "round";
      warpStars.forEach(function(ws){
        ws.y += ws.sp * dt;
        if(ws.y > H + 60){ ws.y = -60; ws.x = Math.random() * W; }
        ctx.strokeStyle = ws.col;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.moveTo(ws.x, ws.y); ctx.lineTo(ws.x, ws.y + ws.len); ctx.stroke();
      });
      ctx.restore();
    } else {
      var breathe = 1.015 + Math.sin(tAcc * 0.45) * 0.012;
      if(sceneFade.t < 1 && ART[sceneFade.from]) drawCover(ART[sceneFade.from], 1, 0, breathe);
      drawCover(ART[sceneFade.to], sceneFade.t, 0, breathe);
    }

    /* Ambient Twinkling Stardust */
    ctx.save();
    ambientDust.forEach(function(ad){
      var al = 0.25 + 0.65 * Math.abs(Math.sin(tAcc * ad.sp + ad.ph));
      ctx.globalAlpha = al;
      ctx.fillStyle = "#fffef0";
      ctx.beginPath(); ctx.arc(ad.x * W, ad.y * H, ad.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    /* Glowing Launchpad Energy Ring on Pad */
    if(phase === "collect" || phase === "match" || phase === "ready" || phase === "countdown"){
      var rmPad = getRocketMetrics();
      var padY = rmPad.y + rmPad.h * 0.47;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      var ringCol = (phase === "ready" || phase === "countdown") ? "rgba(74,222,128," : "rgba(56,189,248,";
      var pR = 0.55 + Math.sin(tAcc * 4) * 0.25;
      ctx.strokeStyle = ringCol + pR.toFixed(2) + ")";
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.ellipse(W * 0.5, padY, rmPad.w * 0.88, rmPad.w * 0.24, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    /* 2. Glowing 3D Perspective Rainbow Boost Hoops in Space Flight */
    if(phase === "flight"){
      hoops.forEach(function(h){
        if(h.y < -160 || h.y > H + 160) return;
        var hx = h.xPct * W, hy = h.y;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = h.col;
        ctx.shadowColor = h.col;
        ctx.shadowBlur = 24;
        ctx.lineWidth = h.hit ? 4 : 15;
        ctx.globalAlpha = h.hit ? 0.25 : 0.92;
        ctx.beginPath(); ctx.ellipse(hx, hy, 96, 36, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(hx, hy, 96, 36, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
        if(!h.hit && ART.star && ART.star.complete){
          var stSz = 68 + Math.sin(tAcc * 6 + h.idx) * 6;
          ctx.drawImage(ART.star, hx - stSz / 2, hy - stSz / 2, stSz, stSz);
        }
      });
    }

    /* 3. Transparent Glass Fuel Reactor Tube */
    drawGlassFuelTube();

    /* Electric Plasma Charge Beam when matching the number pod! */
    if(plasmaBeamT > 0){
      var tr = getFuelTubeRect(), rmB = getRocketMetrics();
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "rgba(56,189,248," + plasmaBeamT.toFixed(2) + ")";
      ctx.lineWidth = 20 * plasmaBeamT; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(tr.cx, tr.y + tr.h * 0.4); ctx.lineTo(rmB.x, rmB.y); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255," + plasmaBeamT.toFixed(2) + ")";
      ctx.lineWidth = 7 * plasmaBeamT;
      ctx.beginPath(); ctx.moveTo(tr.cx, tr.y + tr.h * 0.4); ctx.lineTo(rmB.x, rmB.y); ctx.stroke();
      ctx.restore();
    }

    /* 4. Billowing Smoke Clouds behind/below Rocket */
    smoke.forEach(function(sm){
      ctx.save();
      ctx.globalAlpha = Math.max(0, sm.life * 0.72);
      var sg = ctx.createRadialGradient(sm.x, sm.y, 2, sm.x, sm.y, sm.r);
      sg.addColorStop(0, sm.col);
      sg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(sm.x, sm.y, sm.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    /* 5. Hero Pixar 3D Rocket with Ground Shadow, Volumetric Flame & Squash-and-Stretch! */
    var rm = getRocketMetrics();
    if(phase !== "flight" && phase !== "liftoff"){
      ctx.save();
      ctx.fillStyle = "rgba(9,13,36,0.44)";
      var shScale = phase === "landing" ? Math.max(0.25, 1 - Math.abs(0.56 - rocket.y) * 1.4) : 1;
      ctx.beginPath(); ctx.ellipse(rm.x, (phase === "landed" ? 0.56 * H : 0.52 * H) + rm.h * 0.47, rm.w * 0.54 * shScale, 16 * shScale, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    var activeFlame = Math.max(rocket.flame, boostFlashT > 0 ? 1.15 : 0);
    var sWave = rocket.bounce > 0 ? Math.sin(rocket.bounce * Math.PI * 2.5) * rocket.bounce * 0.14 : 0;
    var breatheY = (phase === "collect" || phase === "match" || phase === "ready") ? Math.sin(tAcc * 2.6) * 4 : 0;
    var rX = rm.x + (rocket.rumble > 0 ? (Math.random() - 0.5) * 7 * rocket.rumble : 0);
    var rY = rm.y + breatheY;

    ctx.save();
    ctx.translate(rX, rY);
    ctx.rotate(rocket.tilt);
    ctx.scale(1 - sWave * 0.65, 1 + sWave);
    if(activeFlame > 0){
      drawVolumetricFlame(0, rm.h * 0.44, rm.h / 260, activeFlame);
    }
    var rImg = getPaintedRocket(currentPaint);
    if(rImg){
      ctx.drawImage(rImg, -rm.w / 2, -rm.h / 2, rm.w, rm.h);
    }
    ctx.restore();

    /* 6. Floating Smiling Pixar Golden Star Gems (ALWAYS Front-Facing & Effortless to Tap!) */
    if(phase === "collect" && ART.star && ART.star.complete){
      var starSz = Math.max(88, Math.min(124, W * 0.105));
      stars.forEach(function(st){
        if(st.collected) return;
        st.popIn = Math.min(1, st.popIn + dt * 3.8);
        var sx = st.xPct * W;
        var sy = st.yPct * H + Math.sin(tAcc * 3.0 + st.phase) * 10;
        var scPop = st.popIn < 1 ? (st.popIn * (1 + Math.sin(st.popIn * Math.PI) * 0.22)) : (1 + Math.sin(tAcc * 4 + st.phase) * 0.05);
        var sz = starSz * scPop;

        /* Warm golden halo ring behind smiling star */
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        var hg = ctx.createRadialGradient(sx, sy, sz * 0.15, sx, sy, sz * 0.78);
        hg.addColorStop(0, "rgba(253,224,71,0.72)");
        hg.addColorStop(0.6, "rgba(56,189,248,0.28)");
        hg.addColorStop(1, "rgba(253,224,71,0)");
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.arc(sx, sy, sz * 0.78, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(Math.sin(tAcc * 2.2 + st.phase) * 0.12);
        ctx.drawImage(ART.star, -sz / 2, -sz / 2, sz, sz);
        ctx.restore();
      });
    }

    /* 7. Flying Stars Arcing into the Fuel Tube */
    if(ART.star && ART.star.complete){
      flyingStars.forEach(function(fs){
        var u = fs.t, mu = 1 - u;
        var fx = mu * mu * fs.x0 + 2 * mu * u * fs.cx + u * u * fs.x1;
        var fy = mu * mu * fs.y0 + 2 * mu * u * fs.cy + u * u * fs.y1;
        var fsz = 82 * (1 - u * 0.55);
        ctx.save();
        ctx.translate(fx, fy);
        ctx.rotate(u * Math.PI * 2);
        ctx.drawImage(ART.star, -fsz / 2, -fsz / 2, fsz, fsz);
        ctx.restore();
      });
    }

    /* 8. Dancing Pixar 3D Space Friends on Landed Planet! */
    if(phase === "landed"){
      var bh = Math.min(H * 0.27, W * 0.22, 205);
      buddies.forEach(function(b){
        var img = ART[b.key];
        if(!img || !img.complete || !img.naturalWidth) return;
        var bw = bh * (img.naturalWidth / img.naturalHeight);
        var bx = b.xPct * W;
        var baseY = b.yPct * H;
        var hop = Math.abs(Math.sin(tAcc * 5.2 + b.phase)) * b.hopAmp;
        var flipLift = b.flipT > 0 ? Math.sin(b.flipT * Math.PI) * 95 : 0;
        var by = baseY - hop - flipLift;
        var rot = b.flipT > 0 ? (1 - b.flipT) * Math.PI * 2 : Math.sin(tAcc * 5.2 + b.phase) * 0.08;
        var sq = hop < 4 ? 0.08 : -0.04;

        /* Ground shadow */
        ctx.save();
        ctx.fillStyle = "rgba(9,13,36,0.4)";
        var sh = Math.max(0.4, 1 - (hop + flipLift) / 160);
        ctx.beginPath(); ctx.ellipse(bx, baseY + bh * 0.44, bw * 0.42 * sh, 11 * sh, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(rot);
        ctx.scale(1 + sq, 1 - sq);
        ctx.drawImage(img, -bw / 2, -bh / 2, bw, bh);
        ctx.restore();
      });
    }

    /* 9. Additive HDR Sparkles & Fireworks */
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    particles.forEach(function(p){
      ctx.globalAlpha = Math.max(0, p.life);
      if(p.star){
        drawStarShape(p.x, p.y, p.r * 1.45, p.col);
      } else {
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
    });
    ctx.restore();

    ctx.restore();
  }

  startRound(true);
  requestAnimationFrame(render);
})();
</script>
