<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="rocket";window.__HOOT_SELF_COACH__=true;</script>
<script src="js/hoot-game-head.js?v=llprev3e109"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>3D Rocket Count-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#131d36; --gold:#ffd43b; --outline:#131d36; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; width:100%; height:100%; overflow:hidden; font-family:"Nunito",system-ui,sans-serif; background:#090d24; touch-action:none; }

  #stage{ position:fixed; inset:0; width:100%; height:100dvh; overflow:hidden; background:#090d24; }
  #gameCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:1; touch-action:none; }

  /* Top HUD */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding:max(10px, env(safe-area-inset-top)) 14px 0 14px;
    pointer-events:none;
  }
  .hud-left{ display:flex; align-items:center; gap:10px; pointer-events:auto; max-width:min(60vw, 550px); }
  #hootBtn{
    width:66px; height:66px; flex:0 0 66px; border-radius:50%;
    border:4px solid #fff;
    background:radial-gradient(circle at 35% 30%, #fff4b8, #ffc93c 65%, #f09800 100%);
    box-shadow:0 6px 0 var(--outline), 0 0 24px rgba(255,212,59,.65);
    padding:4px; cursor:pointer;
    animation:hootBob 2.2s ease-in-out infinite alternate;
  }
  #hootBtn:active{ transform:scale(.9); }
  @keyframes hootBob{ from{ transform:translateY(0); } to{ transform:translateY(-5px); } }
  #promptBubble{
    background:rgba(255,254,248,.96); color:var(--ink);
    border:4px solid var(--outline); border-radius:22px;
    padding:9px 15px; font-family:"Fredoka",sans-serif; font-weight:700;
    font-size:clamp(14px, 2vw, 17.5px); line-height:1.22;
    box-shadow:0 6px 0 var(--outline), 0 12px 26px rgba(0,0,0,.42);
  }
  #promptBubble b{ color:#e11d48; }

  .hud-right{ display:flex; align-items:center; gap:8px; pointer-events:auto; flex-shrink:0; }
  #passportBar{
    display:flex; align-items:center; gap:5px;
    background:rgba(15,23,42,.88); border:3.5px solid #fde047;
    border-radius:999px; padding:4px 9px; box-shadow:0 5px 0 var(--outline);
  }
  .pbadge{
    position:relative; width:38px; height:38px; border-radius:50%;
    border:3px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12);
    display:grid; place-items:center; font-size:19px; cursor:pointer; padding:0;
    filter:grayscale(1) opacity(.45); transition:transform .35s cubic-bezier(.34,1.8,.5,1), filter .3s;
  }
  .pbadge.active-dest{ border-color:#38bdf8; box-shadow:0 0 12px rgba(56,189,248,.95); filter:grayscale(.35) opacity(.88); }
  .pbadge.earned{
    filter:none; border-color:#131d36;
    background:radial-gradient(circle at 32% 28%, #fef08a, #facc15 65%, #d97706 100%);
    box-shadow:0 0 16px rgba(250,204,21,.95);
    animation:popBadge .55s cubic-bezier(.34,1.8,.5,1);
  }
  .pbadge-crew{
    position:absolute; right:-4px; bottom:-5px; font-size:13px; line-height:1;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.8));
  }
  @keyframes popBadge{ 0%{ transform:scale(.4) rotate(-20deg); } 65%{ transform:scale(1.3) rotate(8deg); } 100%{ transform:scale(1) rotate(0); } }

  #starPill{
    display:flex; align-items:center; gap:6px;
    background:#fffef8; border:4px solid var(--outline); border-radius:999px;
    padding:6px 13px; font-family:"Fredoka",sans-serif; font-weight:800; font-size:19px; color:var(--ink);
    box-shadow:0 5px 0 var(--outline);
  }
  #doneBtn{
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:16.5px;
    padding:8px 15px; cursor:pointer; white-space:nowrap;
    box-shadow:0 5px 0 var(--outline); text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  #doneBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--outline); }

  /* Giant Center Countdown Banner */
  #countdownBanner{
    position:absolute; left:50%; top:33%; transform:translate(-50%, -50%) scale(.4);
    z-index:15; pointer-events:none; opacity:0;
    font-family:"Fredoka",sans-serif; font-weight:800;
    font-size:clamp(74px, 15vw, 136px); color:#fde047;
    text-shadow:0 8px 0 #131d36, 0 0 46px rgba(251,146,60,.98);
    transition:transform .22s cubic-bezier(.34,1.8,.5,1), opacity .22s;
    white-space:nowrap;
  }
  #countdownBanner.show{ opacity:1; transform:translate(-50%, -50%) scale(1); }

  /* Flight Steer Hint Pill */
  #flightBanner{
    position:absolute; left:50%; bottom:92px; transform:translateX(-50%);
    z-index:14; pointer-events:none;
    max-width:92vw; text-align:center;
    background:rgba(15,23,42,.88); border:3.5px solid #38bdf8; border-radius:999px;
    padding:7px 20px; color:#fff; font-family:"Fredoka",sans-serif; font-weight:800;
    font-size:clamp(13px, 2.1vw, 18px); line-height:1.2; box-shadow:0 6px 22px rgba(0,0,0,.5);
  }

  /* Center Action Stage (Visible Star Count Tray + Number Pods / BLAST OFF / Next Planet) */
  #actionStage{
    position:absolute; left:0; right:0; bottom:94px; z-index:12;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
    pointer-events:none; padding:0 12px;
  }
  #starCountTray{
    pointer-events:auto;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px;
    background:rgba(15,23,42,.9); border:3.5px solid #fde047; border-radius:999px;
    padding:6px 14px; box-shadow:0 6px 0 #131d36, 0 0 22px rgba(253,224,71,.42);
    max-width:min(94vw, 480px);
  }
  .tray-star{
    width:34px; height:34px; padding:0; border:0; background:transparent; cursor:pointer;
    transition:transform .16s cubic-bezier(.34,1.8,.5,1);
  }
  .tray-star img{ width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .tray-star.pop{ transform:scale(1.38) rotate(12deg); }

  #podRow{
    display:flex; align-items:stretch; justify-content:center; gap:clamp(8px, 2.6vw, 24px);
    width:min(94vw, 480px);
    pointer-events:auto;
  }
  .num-pod{
    position:relative; flex:1 1 0; min-width:0; max-width:146px; min-height:clamp(100px, 16.5vh, 130px);
    border-radius:26px; border:5px solid #fff; overflow:hidden;
    background:linear-gradient(180deg, #38bdf8 0%, #2563eb 100%);
    box-shadow:0 10px 0 #131d36, 0 18px 34px rgba(0,0,0,.5), inset 0 6px 0 rgba(255,255,255,.48);
    color:#fff; cursor:pointer; padding:8px 6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    transition:transform .16s cubic-bezier(.34,1.8,.5,1), box-shadow .16s;
  }
  .num-pod:nth-child(2){ background:linear-gradient(180deg, #f472b6 0%, #db2777 100%); }
  .num-pod:nth-child(3){ background:linear-gradient(180deg, #fbbf24 0%, #ea580c 100%); }
  .num-pod:active{ transform:translateY(6px); box-shadow:0 4px 0 #131d36; }
  .num-pod.hint-glow{
    border-color:#fde047;
    box-shadow:0 0 0 7px #fde047, 0 10px 0 #131d36, 0 0 38px rgba(253,224,71,1);
    animation:podPulse .55s ease-in-out infinite alternate;
  }
  @keyframes podPulse{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-8px) scale(1.08); } }
  .num-pod.shake{ animation:podShake .4s ease-in-out; }
  @keyframes podShake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-11px); } 75%{ transform:translateX(11px); } }
  .pod-num{
    font-family:"Fredoka",sans-serif; font-weight:800;
    font-size:clamp(38px, 6.8vw, 54px); line-height:1;
    text-shadow:0 4px 0 rgba(19,29,54,.45);
  }
  .pod-dots{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:1px;
    font-size:clamp(13px, 2.1vw, 17px); line-height:1.05;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,.35)); max-width:96px;
  }

  #launchBtn, #nextPlanetBtn{
    pointer-events:auto;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    border:6px solid #fff; border-radius:999px;
    padding:14px 34px; cursor:pointer;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:clamp(22px, 4.2vw, 32px); color:#fff;
    text-shadow:0 3px 0 rgba(19,29,54,.45);
    animation:blastPulse .55s ease-in-out infinite alternate;
  }
  #launchBtn{
    background:radial-gradient(circle at 35% 25%, #fca5a5 0%, #ef4444 45%, #b91c1c 100%);
    box-shadow:0 10px 0 #131d36, 0 0 42px rgba(239,68,68,.95);
  }
  #nextPlanetBtn{
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    box-shadow:0 10px 0 #131d36, 0 0 38px rgba(74,222,128,.9);
  }
  #launchBtn:active, #nextPlanetBtn:active{ transform:translateY(6px); }
  @keyframes blastPulse{
    from{ transform:scale(1); box-shadow:0 10px 0 #131d36, 0 0 0 0 rgba(253,224,71,.7); }
    to{ transform:scale(1.07); box-shadow:0 10px 0 #131d36, 0 0 0 10px rgba(253,224,71,.95); }
  }
  .tap-finger{
    display:inline-block; font-size:32px; line-height:1;
    animation:fingerHop .5s ease-in-out infinite alternate;
  }
  @keyframes fingerHop{ from{ transform:translateY(0); } to{ transform:translateY(-8px) scale(1.15); } }

  /* Bottom Space Upgrade Lab & Command Console */
  #commandBar{
    position:absolute; left:50%; bottom:max(10px, env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:11;
    width:min(97vw, 880px);
    background:linear-gradient(180deg, rgba(24,35,76,.93) 0%, rgba(12,18,44,.96) 100%);
    backdrop-filter:blur(10px);
    border:4px solid #38bdf8; border-radius:26px;
    padding:8px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    box-shadow:0 8px 0 #090d24, 0 14px 32px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.28);
  }
  .paint-row{ display:flex; align-items:center; gap:7px; }
  .paint-lbl{ font-family:"Fredoka",sans-serif; font-weight:800; font-size:13.5px; color:#bae6fd; white-space:nowrap; }
  .paint-dot{
    width:38px; height:38px; border-radius:50%;
    border:3.5px solid #fff; cursor:pointer; padding:0;
    box-shadow:0 4px 0 #090d24, inset 0 4px 6px rgba(255,255,255,.48);
    transition:transform .16s cubic-bezier(.34,1.8,.5,1);
    display:grid; place-items:center; font-size:16px;
  }
  .paint-dot:active{ transform:scale(.88); }
  .paint-dot.on{ transform:scale(1.16); border-color:#fde047; box-shadow:0 0 0 3px #fde047, 0 4px 0 #090d24; }
  .paint-dot.gold-unlock{
    background:radial-gradient(circle at 30% 25%, #fffbeb, #fde047 50%, #d97706 100%) !important;
    box-shadow:0 0 16px rgba(253,224,71,.95), 0 4px 0 #090d24;
  }
  .console-right{ display:flex; align-items:center; gap:7px; flex-wrap:nowrap; }
  .ctrl-pill{
    border:3.5px solid #131d36; border-radius:999px;
    background:linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
    color:#131d36; font-family:"Fredoka",sans-serif; font-weight:800; font-size:14px;
    padding:7px 12px; cursor:pointer; white-space:nowrap;
    box-shadow:0 4px 0 #131d36;
  }
  .ctrl-pill:active{ transform:translateY(3px); box-shadow:0 1px 0 #131d36; }
  #trailBtn{ background:linear-gradient(180deg, #f9a8d4 0%, #ec4899 100%); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.3); }
  #hatBtn{ background:linear-gradient(180deg, #c4b5fd 0%, #8b5cf6 100%); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.3); }
  #rangeBtn{ background:linear-gradient(180deg, #e0f2fe 0%, #7dd3fc 100%); }

  /* Win Overlay */
  #winOverlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(9,13,36,.74); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .win-card{
    background:linear-gradient(180deg, #fffef8 0%, #fef3c7 100%);
    border:6px solid var(--outline); border-radius:34px;
    padding:26px 24px; text-align:center; max-width:450px; width:100%;
    box-shadow:0 14px 0 var(--outline), 0 26px 50px rgba(0,0,0,.55);
  }
  .win-trophy{ font-size:66px; line-height:1.1; margin-bottom:8px; }
  .win-card h2{ margin:0 0 8px; font-family:"Fredoka",sans-serif; font-size:32px; color:#131d36; }
  .win-card p{ margin:0 0 18px; font-weight:800; font-size:17px; color:#334155; }
  .win-btns{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; }
  .big-play, .win-btn{
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:20px;
    padding:12px 26px; cursor:pointer; box-shadow:0 6px 0 var(--outline);
  }

  @media (max-width: 740px){
    #hud{
      flex-wrap:wrap; align-items:center; gap:6px;
      padding:max(8px, env(safe-area-inset-top)) 10px 0 10px;
    }
    .hud-left{ display:contents; }
    #hootBtn{ width:52px; height:52px; flex:0 0 52px; order:1; border-width:3px; }
    .hud-right{ order:2; margin-left:auto; gap:6px; }
    #passportBar{ display:none; }
    #starPill{ font-size:17px; padding:5px 11px; border-width:3px; }
    #doneBtn{ font-size:15px; padding:6px 12px; border-width:3px; }
    #promptBubble{
      order:3; flex:1 0 100%; width:100%;
      padding:7px 12px; border-width:3px; border-radius:16px;
      font-size:13.5px; line-height:1.2; text-align:center;
    }
    #commandBar{
      width:min(96vw, 440px); padding:7px 10px; border-radius:22px; border-width:3.5px;
      flex-direction:column; align-items:stretch; gap:6px;
    }
    .paint-row{ justify-content:center; gap:8px; }
    .paint-lbl{ display:none; }
    .paint-dot{ width:33px; height:33px; border-width:3px; font-size:14px; }
    .console-right{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:5px; width:100%; }
    .ctrl-pill{
      font-size:12px; padding:7px 3px; border-width:3px;
      text-align:center; overflow:hidden; text-overflow:ellipsis;
    }
    #actionStage{ bottom:114px; gap:6px; }
    #starCountTray{ padding:4px 10px; gap:4px; }
    .tray-star{ width:26px; height:26px; }
    #flightBanner{ bottom:114px; font-size:13px; padding:6px 14px; }
    #launchBtn, #nextPlanetBtn{ padding:11px 24px; font-size:21px; border-width:5px; }
    .pod-dots{ max-width:80px; font-size:13px; }
    .num-pod{ border-radius:22px; border-width:4px; min-height:94px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gameCanvas" aria-label="Pixar 3D Rocket Space Adventure"></canvas>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-left">
      <button id="hootBtn" type="button" aria-label="Tap Hoot to hear again">
        <svg viewBox="0 0 200 210" aria-hidden="true"><path d="M82 178 L100 205 L118 178 Z" fill="#8a5a33"/><ellipse cx="34" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(14 34 128)"/><ellipse cx="166" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(-14 166 128)"/><ellipse cx="100" cy="118" rx="66" ry="72" fill="#a06a3b"/><ellipse cx="100" cy="140" rx="44" ry="46" fill="#fdeed3"/><path d="M52 44 Q40 14 62 22 Q74 27 70 48 Z" fill="#8a5a33"/><path d="M148 44 Q160 14 138 22 Q126 27 130 48 Z" fill="#8a5a33"/><circle cx="100" cy="72" r="52" fill="#a06a3b"/><ellipse cx="78" cy="74" rx="24" ry="26" fill="#fdeed3"/><ellipse cx="122" cy="74" rx="24" ry="26" fill="#fdeed3"/><circle cx="78" cy="72" r="11" fill="#17324f"/><circle cx="122" cy="72" r="11" fill="#17324f"/><circle cx="82" cy="68" r="4" fill="#fff"/><circle cx="126" cy="68" r="4" fill="#fff"/><circle cx="56" cy="94" r="8" fill="#ffb59d" opacity=".85"/><circle cx="144" cy="94" r="8" fill="#ffb59d" opacity=".85"/><path d="M90 88 Q100 84 110 88 Q106 102 100 104 Q94 102 90 88 Z" fill="#ff9f1c" stroke="#e07f00" stroke-width="1.5"/></svg>
      </button>
      <div id="promptBubble" aria-live="polite">🔧 <b>BUILD HOOT'S ROCKET!</b> Tap each glowing part to snap it on!</div>
    </div>
    <div class="hud-right">
      <div id="passportBar" aria-label="Visited planets and space crew">
        <button type="button" class="pbadge active-dest" data-pl="0" title="Cheese Moon — Rescue Bunny">🌕<span class="pbadge-crew" hidden>🐰</span></button>
        <button type="button" class="pbadge" data-pl="1" title="Rainbow Saturn — Light Rings for Puppy">🪐<span class="pbadge-crew" hidden>🐶</span></button>
        <button type="button" class="pbadge" data-pl="2" title="Candy Star — Feed Alien">🍬<span class="pbadge-crew" hidden>👽</span></button>
        <button type="button" class="pbadge" data-pl="3" title="Volcano World — Hatch Space Dino">🌋<span class="pbadge-crew" hidden>🦖</span></button>
      </div>
      <div id="starPill">⭐ <span id="starCount">0</span></div>
      <button id="doneBtn" type="button">🏆 Done</button>
    </div>
  </div>

  <!-- Big 3-2-1 Countdown Banner -->
  <div id="countdownBanner" aria-live="assertive">3</div>

  <!-- Interactive Space Flight Banner -->
  <div id="flightBanner" hidden>✨ Steer through Rainbow Hoops! ✨</div>

  <!-- Phase Action Controls (Visible Star Count Tray + Number Pods / BLAST OFF / Next Planet) -->
  <div id="actionStage">
    <div id="starCountTray" hidden aria-label="Stars you counted"></div>
    <div id="podRow" hidden></div>
    <button id="launchBtn" type="button" hidden><span>🚀 BLAST OFF!</span><span class="tap-finger" aria-hidden="true">👆</span></button>
    <button id="nextPlanetBtn" type="button" hidden><span>🚀 Fly to 🪐 Saturn!</span><span class="tap-finger" aria-hidden="true">👆</span></button>
  </div>

  <!-- Bottom Space Upgrade Lab & Command Console -->
  <div id="commandBar" role="group" aria-label="Rocket customizer and controls">
    <div class="paint-row">
      <span class="paint-lbl">🎨 Paint:</span>
      <button type="button" class="paint-dot on" data-col="red" style="background:linear-gradient(180deg,#ff6b6b,#dc2626)" aria-label="Red rocket"></button>
      <button type="button" class="paint-dot" data-col="blue" style="background:linear-gradient(180deg,#60a5fa,#2563eb)" aria-label="Blue rocket"></button>
      <button type="button" class="paint-dot" data-col="yellow" style="background:linear-gradient(180deg,#fde047,#eab308)" aria-label="Yellow rocket"></button>
      <button type="button" class="paint-dot" data-col="pink" style="background:linear-gradient(180deg,#f472b6,#db2777)" aria-label="Pink rocket"></button>
      <button type="button" class="paint-dot" data-col="green" style="background:linear-gradient(180deg,#4ade80,#16a34a)" aria-label="Green rocket"></button>
      <button type="button" id="goldPaintDot" class="paint-dot gold-unlock" data-col="gold" hidden aria-label="Golden Super Rocket">✨</button>
    </div>
    <div class="console-right">
      <button type="button" id="trailBtn" class="ctrl-pill">🌈 Rainbow</button>
      <button type="button" id="hatBtn" class="ctrl-pill">👑 Crown</button>
      <button type="button" id="rangeBtn" class="ctrl-pill">⭐ 1–5</button>
      <button type="button" id="boostBtn" class="ctrl-pill">🔥 Boost!</button>
    </div>
  </div>

  <!-- Win Overlay -->
  <div id="winOverlay" hidden>
    <div class="win-card">
      <div class="win-trophy" id="winTrophy" aria-hidden="true">🚀🐰🐶👽🦖</div>
      <h2 id="winHeading">Super Space Captain!</h2>
      <p id="winSummary">You built Hoot's rocket, rescued Bunny on Cheese Moon, lit Saturn's rings for Puppy, fed Alien on Candy Star, and hatched Baby Space Dino!</p>
      <div class="win-btns">
        <button id="againBtn" class="big-play" type="button">↻ Keep Flying</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================================
     1. VOICE ENGINE (100% Real Studio Hoot Clips, Atomic Generation Guard)
     ========================================================================= */
  var voiceA = new Audio();
  var voiceGen = 0, lastStepClips = null, idleHelpTimer = null, idleHelpReminded = false;
  var won = false;

  function hasClip(id){
    try{
      if(window.parent && window.parent.HOOT_HAVE && window.parent.HOOT_HAVE[id]) return true;
      if(window.HOOT_HAVE && window.HOOT_HAVE[id]) return true;
    }catch(e){}
    return false;

  function getPaintedRocket(colKey){
    var baseImg = ART.rocket;
    if(!baseImg || !baseImg.complete || !baseImg.naturalWidth) return null;
    if(colKey === "red" || !ROCKET_PAINTS[colKey] || !ROCKET_PAINTS[colKey].nose) return baseImg;

      var cv = document.createElement("canvas");
      cv.width = baseImg.naturalWidth; cv.height = baseImg.naturalHeight;
      var g = cv.getContext("2d");
      g.drawImage(baseImg, 0, 0);
      var id = g.getImageData(0, 0, cv.width, cv.height);
      var d = id.data, w = cv.width, h = cv.height;
      var cx = w * 0.5, cy = h * 0.49, portR = w * 0.255;
      for(var y = 0; y < h; y++){
        for(var x = 0; x < w; x++){
          var i = (y * w + x) * 4;
          if(d[i + 3] < 20) continue;
          var r = d[i], gr = d[i + 1], b = d[i + 2];
          if(y < h * 0.33 && r > 90 && (r - Math.max(gr, b)) > 36){
            var lum = Math.min(1.45, (r * 0.65 + gr * 0.25 + b * 0.1) / 145);
            var spec = Math.max(0, Math.min(gr, b) - 22) * 0.85;
            d[i]     = Math.min(255, Math.round(cfg.nose[0] * lum + spec));
            d[i + 1] = Math.min(255, Math.round(cfg.nose[1] * lum + spec));
            d[i + 2] = Math.min(255, Math.round(cfg.nose[2] * lum + spec));
          } else if(y > h * 0.56 && b > 95 && (b - Math.max(r, gr)) > 32){
            var lumF = Math.min(1.45, (b * 0.65 + gr * 0.25 + r * 0.1) / 155);
            var specF = Math.max(0, Math.min(r, gr) - 18) * 0.7;
            d[i]     = Math.min(255, Math.round(cfg.fin[0] * lumF + specF));
            d[i + 1] = Math.min(255, Math.round(cfg.fin[1] * lumF + specF));
            d[i + 2] = Math.min(255, Math.round(cfg.fin[2] * lumF + specF));
          } else if(cfg.hullTint && Math.hypot(x - cx, y - cy) > portR && r > 155 && gr > 150 && b > 140 && Math.max(r, gr, b) - Math.min(r, gr, b) < 42){

    if(!img || !img.complete || !img.naturalWidth) return;
    ctx.save();
    if(alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
    var z = zoom || 1.0;
    var sc = Math.max(W / img.naturalWidth, H / img.naturalHeight) * z;
    var dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
    var dx = (W - dw) * 0.5;
    var dy = (H - dh) * 0.5 + (offsetY || 0);
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();
  }

  function getFuelTubeRect(){
    if(isPortrait()){
      var pw = 42, ph = phase === "match" ? Math.max(112, Math.min(144, H * 0.185)) : Math.max(122, Math.min(162, H * 0.205));
      var px = W - pw - 14, py = phase === "match" ? H * 0.27 : H * 0.35;
      return { x: px, y: py, w: pw, h: ph, cx: px + pw / 2, topY: py + 10 };
    }
    var w = Math.max(46, Math.min(60, W * 0.052));
    var h = Math.max(145, Math.min(198, H * 0.25));
    var x = Math.min(W - w - 24, W * 0.72);
    var y = phase === "match" ? H * 0.27 : H * 0.32;
    return { x: x, y: y, w: w, h: h, cx: x + w / 2, topY: y + 10 };
  }
  function getRocketMetrics(){
    var mult = phase === "mission" ? 0.66 : (phase === "match" && isPortrait() ? 0.86 : 1.0);
    var rh = (isPortrait() ? Math.min(H * 0.29, W * 0.48, 220) : Math.min(H * 0.38, W * 0.35, 302)) * mult;
    var rw = rh * (363 / 560);
    return { x: rocket.x * W, y: rocket.y * H, w: rw, h: rh };
  }
  function getChestPos(){
    return isPortrait() ? { x: 0.68 * W, y: 0.64 * H } : { x: 0.64 * W, y: 0.67 * H };
  }
  function getActiveCrewList(){
    return CREW_DEFS.filter(function(c){ return !!rescuedCrew[c.key]; });
  }
  function getCrewSlotPositions(list){
    var slotsL = [[0.14, 0.63], [0.28, 0.66], [0.77, 0.64], [0.91, 0.64]];
    var slotsP = [[0.14, 0.63], [0.34, 0.65], [0.87, 0.63], [0.50, 0.65]];
    var arr = isPortrait() ? slotsP : slotsL;
    return list.map(function(c, i){
      var s = arr[i % arr.length];
      return { def: c, x: s[0] * W, y: s[1] * H };
    });
  }
  function getBuddyHeight(){
    return isPortrait() ? Math.min(H * 0.175, W * 0.24, 128) : Math.min(H * 0.25, W * 0.20, 192);
  }

  function spawnSparkles(x, y, count, cols, speed){
    var pal = cols || ["#fde047", "#38bdf8", "#f472b6", "#4ade80", "#ffffff"];
    for(var i = 0; i < count; i++){
      var a = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.45;
      var spd = (speed || 230) * (0.4 + Math.random() * 0.85);
      particles.push({
        x: x, y: y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 65,
        r: 4 + Math.random() * 6.5, col: pal[i % pal.length],
        life: 1.0, decay: 0.88 + Math.random() * 0.6, star: i % 2 === 0
      });
    }
  }
  function spawnSmoke(x, y, count, spreadX, upVy){
    var trKey = TRAILS[trailIdx].key;
    if(trKey === "bubbles"){
      for(var b = 0; b < count; b++){
        bubblesFX.push({
          x: x + (Math.random() - 0.5) * (spreadX || 48), y: y,
          vx: (Math.random() - 0.5) * 90, vy: (upVy || 60) * 0.75 + Math.random() * 50,
          r: 10 + Math.random() * 18, hue: Math.random() * 360, life: 1.0, decay: 0.75 + Math.random() * 0.4
        });
      }
      return;
    }
    var cols = trKey === "rainbow" ? ["#ef4444","#fb923c","#fde047","#4ade80","#38bdf8","#c084fc"]
             : trKey === "stars"   ? ["#fde047","#7dd3fc","#f9a8d4","#ffffff"]
             : ["#fde68a","#ffffff","#fb923c"];
    for(var i = 0; i < count; i++){
      smoke.push({
        x: x + (Math.random() - 0.5) * (spreadX || 44), y: y + (Math.random() - 0.5) * 18,
        vx: (Math.random() - 0.5) * 170, vy: (upVy !== undefined ? upVy : 45) + Math.random() * 60,
        r: 18 + Math.random() * 26, grow: 40 + Math.random() * 28,
        col: cols[i % cols.length], life: 1.0, decay: 0.85 + Math.random() * 0.5
      });
    }
    if(trKey === "stars") spawnSparkles(x, y, Math.min(4, count + 1), ["#fde047","#38bdf8","#ffffff"], 150);
  }
  function spawnShockwave(x, y, col, maxR){

  function collectStar(st, fromX, fromY){
    if(st.collected || phase !== "collect") return;
    st.collected = true;
    st.dragX = null; st.dragY = null;
    if(draggedStar === st) draggedStar = null;
    collectedCount++;
    totalStarsEarned++;
    starCountEl.textContent = String(totalStarsEarned);

    var sx = fromX !== undefined ? fromX : st.xPct * W;
    var sy = fromY !== undefined ? fromY : st.yPct * H;
    var tube = getFuelTubeRect();
    sfxStarCollect(collectedCount - 1);
    playVoice(["name-number-" + collectedCount]);
    spawnSparkles(sx, sy, 22, ["#fde047", "#38bdf8", "#ffffff", "#f472b6"], 240);
    rocket.bounce = 0.9;

    flyingStars.push({
      x0: sx, y0: sy, cx: (sx + tube.cx) * 0.5, cy: Math.min(sy, tube.topY) - 110,
      x1: tube.cx, y1: tube.topY + 12, t: 0, num: collectedCount
    });

    bubble.innerHTML = "⭐ <b>" + collectedCount + "!</b> " + (collectedCount < targetCount ? "Tap or drag the next smiling <b>Golden Star</b>!" : "All stars loaded!");

      var myGen = roundGen;
      setTimeout(function(){ if(myGen === roundGen && phase === "collect" && !won) enterNumberMatchPhase(); }, 820);
    }

  function enterNumberMatchPhase(){
    phase = "match";
    syncRocketPhasePose();

    /* Build interactive Visible Star Count Tray right above the Number Pods so kids can see & recount! */
    starCountTray.innerHTML = "";
    for(var s = 1; s <= targetCount; s++){
      (function(idx){
        var sb = document.createElement("button");
        sb.type = "button"; sb.className = "tray-star";
        sb.setAttribute("aria-label", "Star " + idx);
        sb.innerHTML = '<img src="assets/rocket3d/sprite_star.png' + VER + '" alt="Star">';
        sb.addEventListener("pointerdown", function(e){
          e.preventDefault(); e.stopPropagation();
          sb.classList.remove("pop"); void sb.offsetWidth; sb.classList.add("pop");
          setTimeout(function(){ sb.classList.remove("pop"); }, 260);
          sfxStarCollect(idx - 1);
          playVoice(["name-number-" + idx]);
        });
        starCountTray.appendChild(sb);
      })(s);
    }
    starCountTray.hidden = false;

    podRow.innerHTML = "";
    var choices = [targetCount];
    while(choices.length < 3){
      var cand = 1 + Math.floor(Math.random() * Math.max(5, maxCount));
      if(choices.indexOf(cand) < 0) choices.push(cand);
    }
    choices.sort(function(){ return Math.random() - 0.5; });

    choices.forEach(function(n){
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "num-pod choice-btn";
      btn.setAttribute("data-num", String(n));
      var dots = "";
      for(var k = 0; k < n; k++) dots += "<span>⭐</span>";
      btn.innerHTML = '<span class="pod-num">' + n + '</span><span class="pod-dots">' + dots + '</span>';
      btn.addEventListener("pointerdown", function(e){
        e.preventDefault(); e.stopPropagation();
        if(phase !== "match") return;
        if(n === targetCount){
          sfxStarCollect(6);
          plasmaBeamT = 1.0;
          rocket.bounce = 1.2;
          var rm = getRocketMetrics();
          spawnSparkles(rm.x, rm.y, 32, ["#38bdf8", "#fde047", "#4ade80", "#ffffff"], 300);
          spawnShockwave(rm.x, rm.y, "#4ade80", 220);
          spawnFloatText(rm.x, rm.y - rm.h * 0.55, "⚡ FULL POWER!", "#4ade80");
          starCountTray.hidden = true;
          podRow.hidden = true;
          enterReadyLaunchPhase();
        } else {
          btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
          sfxBoing();
          playVoice(["name-number-" + n, "name-number-" + targetCount]);
          var rightBtn = podRow.querySelector('[data-num="' + targetCount + '"]');
          if(rightBtn) rightBtn.classList.add("hint-glow");
        }
      });
      podRow.appendChild(btn);
    });
    podRow.hidden = false;
    bubble.innerHTML = "🔢 <b>HOW MANY STARS DID YOU COUNT?</b> Tap number <b>" + targetCount + "</b> to power up!";
    setStepVoice("hoot-r3d-how-many-counted", ["ask-how-many-altogether", "name-number-" + targetCount], true);

  function handleMissionPointerDown(cx, cy){
    var pl = PLANETS[planetIdx % PLANETS.length];

      for(var i = 0; i < moonMission.bubbles.length; i++){

          mb.popped = true;
          moonMission.popped++;
          totalStarsEarned++; starCountEl.textContent = String(totalStarsEarned);

          spawnSparkles(bx, by, 28, ["#7dd3fc", "#f9a8d4", "#fde047", "#ffffff"], 280);
          spawnShockwave(bx, by, "#7dd3fc", 130);
          spawnFloatText(bx, by - 22, "🫧 POP " + moonMission.popped + "!", "#7dd3fc");
          moonMission.bunnyFlipT = 0.7;
          if(moonMission.popped >= moonMission.bubbles.length){
            moonMission.bunnyFlipT = 1.3;
            completePlanetMission();

          return true;
        }

      /* Tap Bunny directly to giggle & bounce */
      var bunX = (isPortrait() ? 0.54 : 0.52) * W, bunY = moonMission.bunnyY * H;

    } else if(pl.key === "saturn"){

      for(var ci = 0; ci < saturnMission.crystals.length; ci++){
        var cr = saturnMission.crystals[ci];
        var crx = (isPortrait() ? cr.px : cr.lx) * W;
        var cry = (isPortrait() ? cr.py : cr.ly) * H;
        if(Math.hypot(cx - crx, cy - cry) < 62){
          cr.pulseT = 1.0;
          sfxCrystalChord(cr.idx);
          spawnSparkles(crx, cry - 24, 24, [cr.col, cr.glow, "#ffffff"], 250);
          spawnShockwave(crx, cry - 10, cr.col, 130);

            saturnMission.beams.push({ x0: crx, y0: cry - 30, col: cr.col, life: 1.0 });

            saturnMission.puppyFlipT = 0.75;
            if(saturnMission.lit >= saturnMission.crystals.length){
              saturnMission.puppyFlipT = 1.3;
              completePlanetMission();
            }
          }
          return true;
        }
      }
    } else if(pl.key === "candy"){
      /* Tap any bouncing Candy Treat to toss it to Alien! */
      var ax = (isPortrait() ? 0.79 : 0.80) * W, ay = (isPortrait() ? 0.56 : 0.58) * H;
      for(var ti = 0; ti < candyMission.treats.length; ti++){
        var tr = candyMission.treats[ti];
        if(tr.fed) continue;
        var tx = (isPortrait() ? tr.px : tr.lx) * W;
        var ty = (isPortrait() ? tr.py : tr.ly) * H + Math.sin(tAcc * 3.8 + tr.ph) * 12;
        if(Math.hypot(cx - tx, cy - ty) < 58){
          tr.fed = true;
          candyMission.fed++;
          candyMission.machinePulseT = 0.8;
          totalStarsEarned++; starCountEl.textContent = String(totalStarsEarned);
          sfxStarCollect(candyMission.fed);
          playVoice(["name-number-" + candyMission.fed]);
          spawnSparkles(tx, ty, 20, [tr.col, "#fde047", "#ffffff"], 230);
          candyMission.flyingTreats.push({
            x0: tx, y0: ty, cx: (tx + ax) * 0.5, cy: Math.min(ty, ay) - 110,
            x1: ax, y1: ay - 14, t: 0, type: tr.type, col: tr.col, num: candyMission.fed,
            isLast: candyMission.fed >= candyMission.treats.length
          });
          return true;
        }
      }
      if(Math.hypot(cx - ax, cy - ay) < 88){
        candyMission.alienBounceT = 1.0; sfxBoing(); playVoice(["word-star"]);
        spawnFloatText(ax, ay - 64, "👽 Yum!", "#7dd3fc");

      /* Tap Giant Wiggling Space Egg OR pop bonus Rainbow Lava Bubbles */
      var ex = (isPortrait() ? 0.53 : 0.54) * W, ey = (isPortrait() ? 0.54 : 0.58) * H;

        spawnSparkles(ex, ey - 20, fin ? 52 : 24, ["#fde047", "#4ade80", "#f472b6", "#38bdf8", "#ffffff"], fin ? 340 : 230);
        spawnShockwave(ex, ey, fin ? "#4ade80" : "#fde047", fin ? 230 : 120);
        if(!fin){
          spawnFloatText(ex, ey - 85, "🥚 CRACK " + volcanoMission.eggTaps + "!", "#fde047");
        } else {
          volcanoMission.hatched = true;
          volcanoMission.dinoFlipT = 1.3;
          completePlanetMission();
        }
        return true;
      }
      for(var li = 0; li < volcanoMission.lavaBubbles.length; li++){
        var lb = volcanoMission.lavaBubbles[li];
        if(lb.popped) continue;
        var lx = (isPortrait() ? lb.px : lb.lx) * W;

          setTimeout(function(bRef){ bRef.popped = false; }, 3200, lb);
          return true;
        }
      }
    }
    return false;
  }

  function handlePointerDown(cx, cy){
    /* 0. Build-Your-Rocket Stage: tap any glowing unsnapped part! */
    if(phase === "build"){
      for(var bpi = 0; bpi < buildParts.length; bpi++){
        var bp = buildParts[bpi];
        if(bp.snapped) continue;
        var px = (isPortrait() ? bp.px : bp.lx) * W, py = (isPortrait() ? bp.py : bp.ly) * H;
        if(Math.hypot(cx - px, cy - py) < 76){
          snapBuildPart(bp); return;
        }
      }
      /* Also allow tapping the glowing blueprint silhouette to auto-snap next part for age-2 ease! */
      var rmBld = getRocketMetrics();
      if(Math.abs(cx - rmBld.x) < rmBld.w * 0.65 && Math.abs(cy - rmBld.y) < rmBld.h * 0.6){
        var nxt = buildParts.find(function(p){ return !p.snapped; });
        if(nxt){ snapBuildPart(nxt); return; }
      }
      spawnSparkles(cx, cy, 12, ["#38bdf8", "#fde047"], 150);
      return;
    }

    /* 1. Flight Mode: tap crystal meteors, candy comets, UFO OR slide to steer! */
    if(phase === "flight"){
      for(var mi = 0; mi < meteors.length; mi++){
        var m = meteors[mi];
        if(!m.hit && Math.hypot(cx - m.xPct * W, cy - m.y) < m.r + 52){
          shatterMeteor(m); return;
        }
      }
      for(var ci = 0; ci < flightCandies.length; ci++){
        var fc = flightCandies[ci];
        if(!fc.hit && Math.hypot(cx - fc.xPct * W, cy - fc.y) < 62){
          catchFlightCandy(fc); return;
        }
      }
      if(ufo.active && Math.hypot(cx - ufo.x, cy - ufo.y * H) < 78){
        ufo.spinT = 1.2; ufo.beamT = 1.2;
        totalStarsEarned += 2; starCountEl.textContent = String(totalStarsEarned);
        sfxUfoChirp();
        spawnSparkles(ufo.x, ufo.y * H, 26, ["#38bdf8", "#f472b6", "#fde047", "#4ade80"], 280);
        spawnFloatText(ufo.x, ufo.y * H - 40, "🛸 +2 ⭐!", "#7dd3fc");
        return;
      }
      draggingFlight = true;
      rocket.targetX = Math.max(0.14, Math.min(0.86, cx / W));
      return;
    }

    /* 2. Unique Planet Mission Playground! */
    if(phase === "mission"){
      if(handleMissionPointerDown(cx, cy)) return;
      spawnSparkles(cx, cy, 14, ["#fde047", "#f472b6", "#38bdf8"], 170);
      return;
    }

    /* 3. Collect Mode: grab or tap any smiling Golden Star! */
    if(phase === "collect"){
      var best = null, bestD = 96;
      stars.forEach(function(st){
        if(st.collected) return;
        var sx = st.xPct * W, sy = st.yPct * H + Math.sin(tAcc * 3 + st.phase) * 10;
        var d = Math.hypot(cx - sx, cy - sy);
        if(d < bestD){ bestD = d; best = st; }
      });
      if(best){
        draggedStar = best;
        best.dragX = cx; best.dragY = cy;
        best.downX = cx; best.downY = cy; best.downT = performance.now();
        return;
      }
    }

    /* 4. Cruising Disco UFO */
    if((phase === "collect" || phase === "match" || phase === "ready") && ufo.active && Math.hypot(cx - ufo.x, cy - ufo.y * H) < 72){
      ufo.spinT = 1.3; ufo.beamT = 1.3; sfxUfoChirp();
      spawnSparkles(ufo.x, ufo.y * H, 24, ["#38bdf8", "#f472b6", "#fde047", "#4ade80"], 240);
      spawnFloatText(ufo.x, ufo.y * H - 42, "🛸 Hi Alien!", "#7dd3fc");
      return;
    }

    /* 5. Landed Post-Mission Party: Bonus Treasure Chest + Rescued Crew + Sky Fireworks! */
    if(phase === "landed"){
      var cpHit = getChestPos();
      if(Math.hypot(cx - cpHit.x, cy - cpHit.y) < 74){
        tapTreasureChest(); return;
      }
      var bh = getBuddyHeight();
      var slots = getCrewSlotPositions(getActiveCrewList());
      for(var bi = 0; bi < slots.length; bi++){
        var sl = slots[bi];
        if(Math.hypot(cx - sl.x, cy - sl.y) < bh * 0.58){
          sl.def.flipT = 1.0; sfxBoing();

        spawnFloatText(W * 0.84, H * 0.17, "🪐 Ring Spin!", "#fb923c");

  function drawStarShape(x, y, r, col){
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = col;
    ctx.beginPath();
    for(var i = 0; i < 10; i++){
      var a = (i / 10) * Math.PI * 2 - Math.PI / 2;
      var rad = i % 2 === 0 ? r : r * 0.44;
      if(i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

    var bloom = ctx.createRadialGradient(x, y + h * 0.3, 6, x, y + h * 0.35, h * 1.18);
    bloom.addColorStop(0, trKey === "rainbow" ? "rgba(244,114,182,0.85)" : trKey === "stars" ? "rgba(56,189,248,0.85)" : "rgba(255,220,110,0.85)");
    bloom.addColorStop(0.45, trKey === "rainbow" ? "rgba(56,189,248,0.45)" : "rgba(249,115,22,0.48)");
    bloom.addColorStop(1, "rgba(249,115,22,0)");
    ctx.fillStyle = bloom;
    ctx.beginPath(); ctx.arc(x, y + h * 0.35, h * 1.18, 0, Math.PI * 2); ctx.fill();

    var og = ctx.createLinearGradient(x, y, x, y + h);
    if(trKey === "rainbow"){
      og.addColorStop(0, "#ffffff"); og.addColorStop(0.25, "#fde047"); og.addColorStop(0.55, "#f472b6"); og.addColorStop(0.8, "#38bdf8"); og.addColorStop(1, "rgba(192,132,252,0)");

    }
    ctx.fillStyle = og;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.55, y);
    ctx.quadraticCurveTo(x - w * 0.72, y + h * 0.52, x, y + h);
    ctx.quadraticCurveTo(x + w * 0.72, y + h * 0.52, x + w * 0.55, y);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#fffef0";

  function drawGlassFuelTube(){
    if(phase !== "collect" && phase !== "match" && phase !== "ready" && phase !== "countdown") return;
    var r = getFuelTubeRect(), rm = getRocketMetrics();
    var targetPct = targetCount > 0 ? Math.min(1, collectedCount / targetCount) : 0;
    fuelDisplay += (targetPct - fuelDisplay) * 0.1;

    ctx.save();
    /* Animated Glowing Energy Conduit Pipe connecting Fuel Tube -> Rocket Base */
    var p0x = r.x + 2, p0y = r.y + r.h - 22;
    var p1x = rm.x + rm.w * 0.25, p1y = rm.y + rm.h * 0.36;
    ctx.strokeStyle = "#131d36"; ctx.lineWidth = 14; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(p0x, p0y); ctx.quadraticCurveTo((p0x + p1x) / 2, p0y + 24, p1x, p1y); ctx.stroke();
    ctx.strokeStyle = fuelDisplay > 0.96 ? "#4ade80" : "#38bdf8"; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(p0x, p0y); ctx.quadraticCurveTo((p0x + p1x) / 2, p0y + 24, p1x, p1y); ctx.stroke();
    if(fuelDisplay > 0.05){
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4; ctx.setLineDash([10, 14]); ctx.lineDashOffset = tAcc * 65;
      ctx.beginPath(); ctx.moveTo(p0x, p0y); ctx.quadraticCurveTo((p0x + p1x) / 2, p0y + 24, p1x, p1y); ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.fillStyle = "rgba(9,13,36,0.42)";
    ctx.beginPath(); ctx.ellipse(r.cx, r.y + r.h + 10, r.w * 0.78, 12, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "rgba(15,23,54,0.72)"; ctx.strokeStyle = "#7dd3fc"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, r.w * 0.45); ctx.fill(); ctx.stroke();

    var fh = Math.max(0, (r.h - 14) * fuelDisplay);
    if(fh > 4){

  /* =========================================================================
     11. MAIN 60FPS PIXAR RENDER LOOP
     ========================================================================= */
  var lastTime = performance.now(), tAcc = 0;

  function render(now){
    requestAnimationFrame(render);
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now; tAcc += dt;

    if(sceneFade.t < 1) sceneFade.t = Math.min(1, sceneFade.t + dt * 2.2);
    if(boostFlashT > 0) boostFlashT = Math.max(0, boostFlashT - dt);
    if(plasmaBeamT > 0) plasmaBeamT = Math.max(0, plasmaBeamT - dt * 1.4);
    if(screenShake > 0) screenShake = Math.max(0, screenShake - dt * 1.6);
    if(hyperWarpT > 0) hyperWarpT = Math.max(0, hyperWarpT - dt * 0.85);
    if(rocket.bounce > 0) rocket.bounce = Math.max(0, rocket.bounce - dt * 2.4);
    if(chest.shakeT > 0) chest.shakeT = Math.max(0, chest.shakeT - dt * 2.2);
    if(chest.bounceT > 0) chest.bounceT = Math.max(0, chest.bounceT - dt * 2.4);

    if(moonMission.bunnyFlipT > 0) moonMission.bunnyFlipT = Math.max(0, moonMission.bunnyFlipT - dt * 1.4);
    if(saturnMission.puppyFlipT > 0) saturnMission.puppyFlipT = Math.max(0, saturnMission.puppyFlipT - dt * 1.4);
    saturnMission.crystals.forEach(function(cr){ if(cr.pulseT > 0) cr.pulseT = Math.max(0, cr.pulseT - dt * 2.5); });
    for(var sbi = saturnMission.beams.length - 1; sbi >= 0; sbi--){
      saturnMission.beams[sbi].life -= dt * 1.8;
      if(saturnMission.beams[sbi].life <= 0) saturnMission.beams.splice(sbi, 1);
    }
    if(candyMission.alienBounceT > 0) candyMission.alienBounceT = Math.max(0, candyMission.alienBounceT - dt * 2.2);
    if(candyMission.alienFlipT > 0) candyMission.alienFlipT = Math.max(0, candyMission.alienFlipT - dt * 1.3);
    for(var fti = candyMission.flyingTreats.length - 1; fti >= 0; fti--){
      var ftr = candyMission.flyingTreats[fti];
      ftr.t = Math.min(1, ftr.t + dt * 2.1);
      if(ftr.t >= 1){
        candyMission.alienBounceT = 1.0;
        sfxBoing();
        spawnSparkles(ftr.x1, ftr.y1, 24, [ftr.col, "#fde047", "#ffffff"], 240);
        spawnFloatText(ftr.x1, ftr.y1 - 48, "😋 YUM " + ftr.num + "!", "#fde047");
        var wasLast = ftr.isLast;
        candyMission.flyingTreats.splice(fti, 1);
        if(wasLast){
          candyMission.alienFlipT = 1.3;
          completePlanetMission();
        }
      }
    }
    if(volcanoMission.eggShakeT > 0) volcanoMission.eggShakeT = Math.max(0, volcanoMission.eggShakeT - dt * 2.2);
    if(volcanoMission.dinoFlipT > 0) volcanoMission.dinoFlipT = Math.max(0, volcanoMission.dinoFlipT - dt * 1.3);

    /* Cruising Disco UFO movement */
    if(ufo.active && (phase === "collect" || phase === "match" || phase === "ready" || phase === "flight")){
      ufo.x += ufo.dir * (phase === "flight" ? 190 : 95) * dt;
      if(ufo.spinT > 0) ufo.spinT = Math.max(0, ufo.spinT - dt);
      if(ufo.beamT > 0) ufo.beamT = Math.max(0, ufo.beamT - dt);
      if(ufo.x > W + 160){ ufo.dir = -1; ufo.y = 0.2 + Math.random() * 0.14; }
      if(ufo.x < -160){ ufo.dir = 1; ufo.y = 0.2 + Math.random() * 0.14; }
    }

    if(phase === "countdown"){
      phaseT += dt;
      var rmC = getRocketMetrics();
      if(Math.random() < 0.85) spawnSmoke(rmC.x, rmC.y + rmC.h * 0.45, 2, 74, 55);
    } else if(phase === "liftoff"){
      phaseT += dt;
      rocket.y -= dt * (0.25 + phaseT * 1.15);
      var rmL = getRocketMetrics();
      spawnSmoke(rmL.x, rmL.y + rmL.h * 0.46, 3, 62, 130);
      if(rocket.y < -0.22 || phaseT > 1.35) startSpaceFlight();
    } else if(phase === "flight"){
      phaseT += dt;
      var speedMult = 1 + hyperWarpT * 1.15;
      spaceScroll += dt * 220 * speedMult;
      if(!draggingFlight){
        var autoTarget = hoops.find(function(h){ return !h.hit && h.y < rocket.y * H + 40; })
                      || flightCandies.find(function(fc){ return !fc.hit && fc.y < rocket.y * H + 40; })
                      || meteors.find(function(m){ return !m.hit && m.y < rocket.y * H + 40; });
        if(autoTarget) rocket.targetX += (autoTarget.xPct - rocket.targetX) * Math.min(1, dt * 2.2);
      }
      var prevX = rocket.x;
      rocket.x += (rocket.targetX - rocket.x) * Math.min(1, dt * 8.5);
      rocket.tilt = Math.max(-0.32, Math.min(0.32, (rocket.x - prevX) * 28));

      var rmF = getRocketMetrics();
      if(Math.random() < 0.85) spawnSmoke(rmF.x, rmF.y + rmF.h * 0.48, 1, 24, 260);
      rainbowTrailPts.push({ x: rmF.x, y: rmF.y + rmF.h * 0.44 });
      if(rainbowTrailPts.length > 26) rainbowTrailPts.shift();
      rainbowTrailPts.forEach(function(pt){ pt.y += dt * 360 * speedMult; });

      hoops.forEach(function(h){
        h.y += dt * 310 * speedMult;
        if(!h.hit && Math.abs(h.y - rmF.y) < 65 && Math.abs(h.xPct * W - rmF.x) < 138){
          h.hit = true; flightCombo++;
          totalStarsEarned++; starCountEl.textContent = String(totalStarsEarned);
          rocket.bounce = 0.9; hyperWarpT = 1.0;
          sfxRingBoost(h.idx);
          spawnSparkles(h.xPct * W, h.y, 30, [h.col, "#fde047", "#ffffff", "#38bdf8"], 340);
          spawnShockwave(h.xPct * W, h.y, h.col, 190);
          spawnFloatText(h.xPct * W, h.y - 30, flightCombo > 2 ? "🔥 COMBO x" + flightCombo + "!" : "⚡ TURBO +1 ⭐!", "#fde047");
        }
      });
      meteors.forEach(function(m){
        m.y += dt * 250 * speedMult;
        m.rot += dt * 1.8;
        if(!m.hit && Math.hypot(m.xPct * W - rmF.x, m.y - rmF.y) < m.r + 74){
          shatterMeteor(m);
        }
      });
      flightCandies.forEach(function(fc){
        fc.y += dt * 265 * speedMult;
        fc.rot += dt * 2.2;
        if(!fc.hit && Math.hypot(fc.xPct * W - rmF.x, fc.y - rmF.y) < 88){
          catchFlightCandy(fc);
        }
      });
      if(phaseT > 5.8){
        startPlanetLanding();
      }
    } else if(phase === "landing"){
      phaseT += dt;
      var landY = isPortrait() ? 0.44 : 0.51;
      rocket.y += (landY - rocket.y) * Math.min(1, dt * 3.2);
      var rmD = getRocketMetrics();
      if(Math.random() < 0.7) spawnSmoke(rmD.x, rmD.y + rmD.h * 0.48, 1, 34, 90);
      if(Math.abs(rocket.y - landY) < 0.015) startPlanetMission();
    } else if(phase === "landed"){
      phaseT += dt;
      CREW_DEFS.forEach(function(c){ if(c.flipT > 0) c.flipT = Math.max(0, c.flipT - dt * 1.45); });
      fireworkT += dt;
      if(fireworkT > 1.35){
        fireworkT = 0;
        spawnSparkles(W * (0.18 + Math.random() * 0.64), H * (0.16 + Math.random() * 0.24), 26, ["#fde047", "#f472b6", "#38bdf8", "#4ade80", "#fb923c"], 270);
      }
    }

    for(var fsi = flyingStars.length - 1; fsi >= 0; fsi--){
      var fs = flyingStars[fsi];
      fs.t = Math.min(1, fs.t + dt * 1.9);
      if(fs.t >= 1){
        spawnSparkles(fs.x1, fs.y1, 18, ["#38bdf8", "#fde047", "#ffffff"], 190);
        spawnFloatText(fs.x1, fs.y1 - 24, fs.num + "!", "#fde047");
        flyingStars.splice(fsi, 1);
      }
    }
    for(var swi = shockwaves.length - 1; swi >= 0; swi--){
      var sw = shockwaves[swi];
      sw.life -= dt * 1.8; sw.r += (sw.maxR - sw.r) * Math.min(1, dt * 6);
      if(sw.life <= 0) shockwaves.splice(swi, 1);
    }
    for(var ssi = shootingStars.length - 1; ssi >= 0; ssi--){
      var ss = shootingStars[ssi];
      ss.x += ss.vx * dt; ss.y += ss.vy * dt; ss.life -= dt * 1.25;
      if(ss.life <= 0) shootingStars.splice(ssi, 1);
    }
    for(var bi2 = bubblesFX.length - 1; bi2 >= 0; bi2--){
      var bb = bubblesFX[bi2];
      bb.x += bb.vx * dt; bb.y += bb.vy * dt; bb.life -= bb.decay * dt;
      if(bb.life <= 0) bubblesFX.splice(bi2, 1);
    }
    for(var si = smoke.length - 1; si >= 0; si--){
      var sm = smoke[si];
      sm.life -= sm.decay * dt;
      if(sm.life <= 0){ smoke.splice(si, 1); continue; }
      sm.x += sm.vx * dt; sm.y += sm.vy * dt; sm.r += sm.grow * dt;
    }
    for(var pi = particles.length - 1; pi >= 0; pi--){
      var p = particles[pi];
      p.life -= p.decay * dt;
      if(p.life <= 0){ particles.splice(pi, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
    }
    for(var fi = floatTexts.length - 1; fi >= 0; fi--){
      var ft = floatTexts[fi];
      ft.life -= dt * 0.95; ft.y -= dt * 52;
      ft.scale += (1 - ft.scale) * Math.min(1, dt * 10);
      if(ft.life <= 0) floatTexts.splice(fi, 1);
    }

    /* ==================== DRAW FRAME ==================== */
    ctx.save();
    if(screenShake > 0 || rocket.rumble > 0.5){
      var shk = (screenShake * 7 + (rocket.rumble > 0.5 ? 2.5 : 0));
      ctx.translate((Math.random() - 0.5) * shk, (Math.random() - 0.5) * shk);
    }

    /* 1. Lush Pixar 3D Backdrop */
    if(phase === "flight"){
      var spImg = ART.space;
      if(spImg && spImg.complete && spImg.naturalWidth){
        var srcH = Math.floor(spImg.naturalHeight * 0.72);
        var sc = Math.max(W / spImg.naturalWidth, H / srcH) * (1.04 + hyperWarpT * 0.05);
        var dw = spImg.naturalWidth * sc, dh = srcH * sc;
        var dx = (W - dw) * 0.5, cycle = dh * 2, off = spaceScroll % cycle;
        for(var k = -1; k <= 2; k++){
          var ty = off + k * dh - dh;
          if(ty > H + 10 || ty + dh < -10) continue;
          var flip = ((k % 2) + 2) % 2 === 1;
          ctx.save();
          if(flip){ ctx.translate(0, ty + dh); ctx.scale(1, -1); ctx.drawImage(spImg, 0, 0, spImg.naturalWidth, srcH, dx, 0, dw, dh); }
          else { ctx.drawImage(spImg, 0, 0, spImg.naturalWidth, srcH, dx, ty, dw, dh); }
          ctx.restore();
        }
      }
      ctx.save(); ctx.lineCap = "round";
      var wMult = 1 + hyperWarpT * 2.2;
      warpStars.forEach(function(ws){
        ws.y += ws.sp * wMult * dt;
        if(ws.y > H + 80){ ws.y = -80; ws.x = Math.random() * W; }
        ctx.strokeStyle = hyperWarpT > 0.25 ? (ws.col === "#ffffff" ? "#7dd3fc" : ws.col) : ws.col;
        ctx.globalAlpha = 0.55 + hyperWarpT * 0.35;
        ctx.lineWidth = 2.6 + hyperWarpT * 2;
        ctx.beginPath(); ctx.moveTo(ws.x, ws.y); ctx.lineTo(ws.x, ws.y + ws.len * wMult); ctx.stroke();
      });
      ctx.restore();
    } else {
      var breathe = 1.015 + Math.sin(tAcc * 0.45) * 0.012;
      if(sceneFade.t < 1 && ART[sceneFade.from]) drawCover(ART[sceneFade.from], 1, 0, breathe);
      drawCover(ART[sceneFade.to], sceneFade.t, 0, breathe);
    }

    /* Twinkling Stardust & Shooting Stars */
    ctx.save();
    ambientDust.forEach(function(ad){
      ctx.globalAlpha = 0.25 + 0.65 * Math.abs(Math.sin(tAcc * ad.sp + ad.ph));
      ctx.fillStyle = "#fffef0";
      ctx.beginPath(); ctx.arc(ad.x * W, ad.y * H, ad.r, 0, Math.PI * 2); ctx.fill();
    });
    shootingStars.forEach(function(ss){
      ctx.globalAlpha = Math.max(0, ss.life);
      ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 4; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(ss.x, ss.y); ctx.lineTo(ss.x - ss.vx * 0.14, ss.y - ss.vy * 0.14); ctx.stroke();
      drawStarShape(ss.x, ss.y, 8, "#ffffff");
    });
    ctx.restore();

    drawDiscoUFO();

    ctx.save(); ctx.globalCompositeOperation = "lighter";
    shockwaves.forEach(function(sw){
      ctx.globalAlpha = Math.max(0, sw.life);
      ctx.strokeStyle = sw.col; ctx.lineWidth = 6 * sw.life;
      ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
    });
    ctx.restore();

    /* Launchpad / Refuel Energy Ring */
    if(phase === "build" || phase === "collect" || phase === "match" || phase === "ready" || phase === "countdown"){
      var rmPad = getRocketMetrics();
      var padY = rmPad.y + rmPad.h * 0.47;
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      var ringCol = (phase === "ready" || phase === "countdown") ? "rgba(74,222,128," : "rgba(56,189,248,";
      ctx.strokeStyle = ringCol + (0.55 + Math.sin(tAcc * 4) * 0.25).toFixed(2) + ")";
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.ellipse(W * 0.5, padY, rmPad.w * 0.88, rmPad.w * 0.24, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    /* Flight Props (Rainbow Hoops, Crystal Meteors, Candy Comets, Rainbow Ribbon) */
    if(phase === "flight"){
      hoops.forEach(function(h){
        if(h.y < -160 || h.y > H + 160) return;
        var hx = h.xPct * W, hy = h.y;
        ctx.save(); ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = h.col; ctx.shadowColor = h.col; ctx.shadowBlur = 24;
        ctx.lineWidth = h.hit ? 4 : 15; ctx.globalAlpha = h.hit ? 0.25 : 0.94;
        ctx.beginPath(); ctx.ellipse(hx, hy, 96, 36, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(hx, hy, 96, 36, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
        if(!h.hit && ART.star && ART.star.complete){
          var stSz = 68 + Math.sin(tAcc * 6 + h.idx) * 6;
          ctx.drawImage(ART.star, hx - stSz / 2, hy - stSz / 2, stSz, stSz);
        }
      });
      meteors.forEach(function(m){
        if(m.hit || m.y < -100 || m.y > H + 100) return;
        var mx = m.xPct * W, my = m.y;
        ctx.save(); ctx.translate(mx, my); ctx.rotate(m.rot);
        var mg = ctx.createRadialGradient(-8, -8, 4, 0, 0, m.r);
        mg.addColorStop(0, "#ffffff"); mg.addColorStop(0.45, m.col); mg.addColorStop(1, "#312e81");
        ctx.fillStyle = mg; ctx.strokeStyle = "#fde047"; ctx.lineWidth = 3.5;
        ctx.beginPath();
        for(var v = 0; v < 7; v++){
          var a = (v / 7) * Math.PI * 2;
          var rr = m.r * (v % 2 === 0 ? 1.05 : 0.78);
          if(v === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
          else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        drawStarShape(0, 0, 12, "#fde047");
        ctx.restore();
      });
      flightCandies.forEach(function(fc){
        if(fc.hit || fc.y < -90 || fc.y > H + 90) return;
        drawCandyProp(fc.xPct * W, fc.y, fc.type, fc.col, 1.12);
      });
      if(TRAILS[trailIdx].key === "rainbow" && rainbowTrailPts.length > 2){
        var rbCols = ["#ef4444","#fb923c","#fde047","#4ade80","#38bdf8","#c084fc"];
        ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
        rbCols.forEach(function(rc, idx){
          ctx.strokeStyle = rc; ctx.lineWidth = 8; ctx.globalAlpha = 0.65;
          var offX = (idx - 2.5) * 8;
          ctx.beginPath();
          rainbowTrailPts.forEach(function(pt, j){
            if(j === 0) ctx.moveTo(pt.x + offX, pt.y);
            else ctx.lineTo(pt.x + offX, pt.y);
          });
          ctx.stroke();
        });
        ctx.restore();
      }
    }

    drawGlassFuelTube();
    drawBuildHangarParts();

    if(plasmaBeamT > 0){
      var tr = getFuelTubeRect(), rmB = getRocketMetrics();
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "rgba(56,189,248," + plasmaBeamT.toFixed(2) + ")"; ctx.lineWidth = 22 * plasmaBeamT; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(tr.cx, tr.y + tr.h * 0.4); ctx.lineTo(rmB.x, rmB.y); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255," + plasmaBeamT.toFixed(2) + ")"; ctx.lineWidth = 8 * plasmaBeamT;
      ctx.beginPath(); ctx.moveTo(tr.cx, tr.y + tr.h * 0.4); ctx.lineTo(rmB.x, rmB.y); ctx.stroke();
      ctx.restore();
    }

    smoke.forEach(function(sm){
      ctx.save(); ctx.globalAlpha = Math.max(0, sm.life * 0.72);
      var sg = ctx.createRadialGradient(sm.x, sm.y, 2, sm.x, sm.y, sm.r);
      sg.addColorStop(0, sm.col); sg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sm.x, sm.y, sm.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    });
    bubblesFX.forEach(function(bb){
      ctx.save(); ctx.globalAlpha = Math.max(0, bb.life * 0.85);
      ctx.strokeStyle = "hsl(" + bb.hue + ",95%,75%)"; ctx.lineWidth = 3;
      ctx.fillStyle = "hsla(" + bb.hue + ",95%,85%,0.22)";
      ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(bb.x - bb.r * 0.3, bb.y - bb.r * 0.3, bb.r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    /* Hero Pixar 3D Rocket (progressively assembled during Build Stage!) */
    var rm = getRocketMetrics();
    if(phase !== "flight" && phase !== "liftoff" && (phase !== "build" || buildSnapped > 0)){
      ctx.save(); ctx.fillStyle = "rgba(9,13,36,0.44)";
      var groundY = (phase === "landed" || phase === "landing") ? (isPortrait() ? 0.44 : 0.51) : rocket.y;
      var shScale = phase === "landing" ? Math.max(0.25, 1 - Math.abs(groundY - rocket.y) * 1.4) : 1;
      ctx.beginPath(); ctx.ellipse(rm.x, groundY * H + rm.h * 0.47, rm.w * 0.54 * shScale, 15 * shScale, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    var activeFlame = Math.max(rocket.flame, boostFlashT > 0 ? 1.2 : 0);
    var sWave = rocket.bounce > 0 ? Math.sin(rocket.bounce * Math.PI * 2.5) * rocket.bounce * 0.14 : 0;
    var breatheY = (phase === "collect" || phase === "match" || phase === "ready") ? Math.sin(tAcc * 2.6) * 4 : 0;
    var rX = rm.x + (rocket.rumble > 0 ? (Math.random() - 0.5) * 7 * rocket.rumble : 0);
    var rY = rm.y + breatheY;

    ctx.save();
    ctx.translate(rX, rY);
    ctx.rotate(rocket.tilt);
    ctx.scale(1 - sWave * 0.65, 1 + sWave);
    if(currentPaint === "gold" && phase !== "build"){
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      var ggR = ctx.createRadialGradient(0, 0, rm.w * 0.2, 0, 0, rm.h * 0.65);
      ggR.addColorStop(0, "rgba(253,224,71,0.45)"); ggR.addColorStop(1, "rgba(253,224,71,0)");
      ctx.fillStyle = ggR; ctx.beginPath(); ctx.arc(0, 0, rm.h * 0.65, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    if(activeFlame > 0 && phase !== "build") drawVolumetricFlame(0, rm.h * 0.44, rm.h / 260, activeFlame);
    var rImg = getPaintedRocket(currentPaint);
    if(rImg){
      if(phase === "build"){
        var iw = rImg.naturalWidth || rImg.width, ih = rImg.naturalHeight || rImg.height;
        buildParts.forEach(function(bp){
          if(!bp.snapped) return;
          ctx.drawImage(rImg, 0, Math.floor(ih * bp.sy), iw, Math.floor(ih * bp.sh), -rm.w / 2, -rm.h / 2 + rm.h * bp.sy, rm.w, rm.h * bp.sh);
        });
        if(buildParts[2] && buildParts[2].snapped) drawRocketHat(-rm.h * 0.46, rm.w);
      } else {
        ctx.drawImage(rImg, -rm.w / 2, -rm.h / 2, rm.w, rm.h);
        drawRocketHat(-rm.h * 0.46, rm.w);
      }
    }
    ctx.restore();

    /* Smiling Pixar Golden Star Gems (Drag OR Tap!) */
    if(phase === "collect" && ART.star && ART.star.complete){
      var starSz = isPortrait() ? Math.max(66, Math.min(82, W * 0.19)) : Math.max(88, Math.min(120, W * 0.102));
      stars.forEach(function(st){
        if(st.collected) return;
        st.popIn = Math.min(1, st.popIn + dt * 3.8);
        var sx = st.dragX !== null ? st.dragX : st.xPct * W;
        var sy = st.dragY !== null ? st.dragY : (st.yPct * H + Math.sin(tAcc * 3.0 + st.phase) * 10);
        var scPop = st.dragX !== null ? 1.18 : (st.popIn < 1 ? (st.popIn * (1 + Math.sin(st.popIn * Math.PI) * 0.22)) : (1 + Math.sin(tAcc * 4 + st.phase) * 0.05));
        var sz = starSz * scPop;

        ctx.save(); ctx.globalCompositeOperation = "lighter";
        var hg = ctx.createRadialGradient(sx, sy, sz * 0.15, sx, sy, sz * 0.78);
        hg.addColorStop(0, "rgba(253,224,71,0.72)"); hg.addColorStop(0.6, "rgba(56,189,248,0.28)"); hg.addColorStop(1, "rgba(253,224,71,0)");
        ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(sx, sy, sz * 0.78, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        ctx.save(); ctx.translate(sx, sy); ctx.rotate(Math.sin(tAcc * 2.2 + st.phase) * 0.12);
        ctx.drawImage(ART.star, -sz / 2, -sz / 2, sz, sz); ctx.restore();
      });
    }

    if(ART.star && ART.star.complete){
      flyingStars.forEach(function(fs){
        var u = fs.t, mu = 1 - u;
        var fx = mu * mu * fs.x0 + 2 * mu * u * fs.cx + u * u * fs.x1;
        var fy = mu * mu * fs.y0 + 2 * mu * u * fs.cy + u * u * fs.y1;
        var fsz = 84 * (1 - u * 0.52);
        ctx.save(); ctx.translate(fx, fy); ctx.rotate(u * Math.PI * 2);
        ctx.drawImage(ART.star, -fsz / 2, -fsz / 2, fsz, fsz); ctx.restore();
      });
    }

    /* Unique Playable Planet Mission Scene! */
    drawPlanetMissionScene();

    /* Post-Mission Landed Party: Rescued Space Crew Roster + Bonus Treasure Chest */
    if(phase === "landed"){
      var bh = getBuddyHeight();
      var slots = getCrewSlotPositions(getActiveCrewList());
      slots.forEach(function(sl){
        var b = sl.def;
        var hop = Math.abs(Math.sin(tAcc * 5.2 + b.phase)) * b.hopAmp;
        var flipLift = b.flipT > 0 ? Math.sin(b.flipT * Math.PI) * 90 : 0;
        var by = sl.y - hop - flipLift;
        var rot = b.flipT > 0 ? (1 - b.flipT) * Math.PI * 2 : Math.sin(tAcc * 5.2 + b.phase) * 0.08;
        var sq = hop < 4 ? 0.08 : -0.04;

        ctx.save(); ctx.fillStyle = "rgba(9,13,36,0.4)";
        var sh = Math.max(0.4, 1 - (hop + flipLift) / 160);
        ctx.beginPath(); ctx.ellipse(sl.x, sl.y + bh * 0.44, bh * 0.34 * sh, 10 * sh, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

        if(b.key === "dino"){
          drawBabySpaceDino(sl.x, by, bh, rot, sq);
        } else {
          var img = ART[b.key]; if(!img || !img.complete || !img.naturalWidth) return;
          var bw = bh * (img.naturalWidth / img.naturalHeight);
          ctx.save(); ctx.translate(sl.x, by); ctx.rotate(rot); ctx.scale(1 + sq, 1 - sq);
          ctx.drawImage(img, -bw / 2, -bh / 2, bw, bh); ctx.restore();
        }
      });
      drawTreasureChest();
    }

    drawFlightProgressTracker();

    ctx.save(); ctx.globalCompositeOperation = "lighter";
    particles.forEach(function(p){
      ctx.globalAlpha = Math.max(0, p.life);
      if(p.star) drawStarShape(p.x, p.y, p.r * 1.45, p.col);
      else { ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
    });
    ctx.restore();

    floatTexts.forEach(function(ft){
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, ft.life * 1.4));
      ctx.translate(ft.x, ft.y);
      ctx.scale(ft.scale, ft.scale);
      ctx.font = '800 32px "Fredoka", sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineWidth = 7; ctx.strokeStyle = "#131d36";
      ctx.strokeText(ft.txt, 0, 0);
      ctx.fillStyle = ft.col;
      ctx.fillText(ft.txt, 0, 0);
      ctx.restore();
    });

    ctx.restore();
  }

  startBuildStage(true);
