<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>
window.__HOOT_GAME_KEY__="balloon";
window.__HOOT_SELF_COACH__=true;
</script>
<script src="js/hoot-game-head.js?v=llprev3e139"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Balloon ABC Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#17324f;
    --cream:#fffdf7;
    --sun:#ffc93c;
    --coral:#ff5c52;
    --leaf:#4bc85b;
    --sky:#4cc4f7;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; width:100%; margin:0; padding:0; overflow:hidden; }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#65cbf7;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ================= SUNLIT SKY FESTIVAL STAGE ================= */
  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    background:linear-gradient(180deg,
      #3db6f5 0%,
      #73d2fb 36%,
      #b7ebff 72%,
      #e6f9ff 100%);
  }

  /* Soft bottom cloud banks */
  #cloudBanks{
    position:absolute;
    left:0; right:0; bottom:-6px;
    width:100%;
    height:clamp(84px, 14vh, 140px);
    pointer-events:none;
    z-index:2;
  }

  /* Living sky decor */
  .sky-prop{
    position:absolute;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    z-index:3;
  }
  #sunBtn{
    top:max(8px, env(safe-area-inset-top));
    right:clamp(108px, 16vw, 174px);
    width:clamp(68px, 9.5vw, 94px);
    height:clamp(68px, 9.5vw, 94px);
  }
  #sunBtn svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 14px rgba(245,176,0,.42)); }
  #sunBtn .rays{ transform-box:fill-box; transform-origin:center; animation:sunSpin 44s linear infinite; }
  @keyframes sunSpin{ to{ transform:rotate(360deg); } }
  #sunBtn.zing .rays{ animation:sunSpin 1s cubic-bezier(.34,1.5,.5,1) 1; }
  #sunBtn:active{ transform:scale(.92); }

  .cloud-btn{
    width:clamp(92px, 14vw, 138px);
    height:clamp(44px, 6.5vw, 64px);
    opacity:.94;
    animation:cloudGlide linear infinite;
  }
  .cloud-btn svg{ width:100%; height:100%; display:block; transition:transform .24s cubic-bezier(.34,1.8,.5,1); }
  .cloud-btn.puff svg{ transform:scale(1.24,1.35); }
  @keyframes cloudGlide{ from{transform:translateX(-150px)} to{transform:translateX(112vw)} }

  .bird-btn{
    width:58px; height:40px;
    animation:birdFly linear infinite;
  }
  .bird-btn svg{ width:100%; height:100%; display:block; overflow:visible; }
  .bird-btn .wing{ transform-box:fill-box; transform-origin:80% 90%; animation:birdFlap .32s ease-in-out infinite alternate; }
  @keyframes birdFlap{ from{transform:rotate(0)} to{transform:rotate(-34deg)} }
  @keyframes birdFly{ from{transform:translate(-75px,0)} to{transform:translate(112vw,-28px)} }

  /* ================= TOP HUD (>=64px) ================= */
  #hud{
    position:absolute;
    top:max(8px, env(safe-area-inset-top));
    left:max(10px, env(safe-area-inset-left));
    right:max(10px, env(safe-area-inset-right));
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    pointer-events:none;
  }
  .hud-group{
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:auto;
  }
  .hud-pill{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 16px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,247,.95);
    color:var(--ink);
    font-size:28px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(20,76,120,.22), 0 10px 20px rgba(20,76,120,.14);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .15s;
  }
  .hud-pill:active{ transform:translateY(3px) scale(.94); }
  .hud-pill.round{ width:64px; padding:0; border-radius:50%; }
  .hud-pill.mode-btn.active{
    background:linear-gradient(180deg,#ffe473,#ffc93c);
    box-shadow:0 5px 0 #c98600, 0 0 0 3.5px var(--ink);
  }
  #starBank{
    min-height:64px;
    padding:0 18px 0 12px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,247,.96);
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:26px;
    box-shadow:0 5px 0 rgba(20,76,120,.22);
    pointer-events:auto;
  }
  #starBank svg{ width:30px; height:30px; display:block; }
  #starBank.bump{ animation:starBump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{ 0%{transform:scale(1)} 45%{transform:scale(1.2) rotate(-4deg)} 100%{transform:scale(1)} }

  /* ================= HOOT'S HOT-AIR BALLOON ON LEFT ================= */
  #hotAirWrap{
    position:absolute;
    left:clamp(8px, 2.5vw, 34px);
    bottom:clamp(14px, 4vh, 42px);
    z-index:12;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    pointer-events:none;
  }
  #hotAirBtn{
    position:relative;
    width:clamp(146px, 20vw, 224px);
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    pointer-events:auto;
    filter:drop-shadow(0 14px 18px rgba(18,74,120,.26));
    animation:balloonFloat 3.8s ease-in-out infinite;
    transform-origin:50% 60%;
  }
  @keyframes balloonFloat{
    0%,100%{ transform:translateY(0) rotate(-1.8deg); }
    50%{ transform:translateY(-14px) rotate(1.8deg); }
  }
  #hotAirBtn.boost{ animation:balloonBoost .65s cubic-bezier(.34,1.6,.5,1); }
  @keyframes balloonBoost{
    0%{transform:translateY(0) scale(1)}
    45%{transform:translateY(-28px) scale(1.06)}
    100%{transform:translateY(0) scale(1)}
  }
  #hotAirBtn svg{ width:100%; height:auto; display:block; overflow:visible; }
  #hotAirBtn .flame{ opacity:.45; transition:opacity .15s; }
  #hotAirBtn.boost .flame, #hotAirBtn.talking .flame{ opacity:1; }
  #hotAirBtn.talking .hoot-head{ animation:talkBob .2s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:50% 80%; }
  @keyframes talkBob{ from{transform:translateY(0)} to{transform:translateY(-4px)} }

  /* Collected Letter Chips on Hot-Air Basket */
  #basketChips{
    position:absolute;
    left:50%;
    bottom:8px;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
    justify-content:center;
    pointer-events:auto;
    cursor:pointer;
  }
  .sky-chip{
    width:28px;
    height:28px;
    border-radius:50%;
    background:linear-gradient(180deg,#ffe578,#ffb703);
    border:2.5px solid #fff;
    box-shadow:0 3px 0 #c98600;
    display:grid;
    place-items:center;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    transition:transform .18s;
  }
  .sky-chip.reading{ transform:scale(1.38) translateY(-5px); outline:3px solid var(--coral); background:#fff; }

  /* Compact Wanted-Letter Sky Banner */
  #wantedBanner{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px 8px 10px;
    border-radius:26px;
    border:4px solid #fff;
    background:rgba(255,253,247,.97);
    box-shadow:0 6px 0 rgba(20,76,120,.22), 0 12px 24px rgba(20,76,120,.2);
    cursor:pointer;
    pointer-events:auto;
    min-height:74px;
    transition:transform .15s;
  }
  #wantedBanner:active{ transform:scale(.94); }
  #wantedBanner.pop{ animation:bannerPop .48s cubic-bezier(.34,1.7,.5,1); }
  @keyframes bannerPop{ 0%{transform:scale(.62) rotate(-8deg)} 100%{transform:scale(1) rotate(0)} }

  #targetLetter{
    width:56px;
    height:56px;
    border-radius:18px;
    background:linear-gradient(180deg,#fff2cc,#ffe08a);
    border:3.5px dashed #f59e0b;
    display:grid;
    place-items:center;
    font-size:40px;
    font-weight:700;
    line-height:1;
    color:#d9382e;
  }
  #targetCue{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  #targetEmoji{ font-size:30px; line-height:1; }
  #progressDots{ display:flex; gap:5px; }
  #progressDots i{
    width:11px; height:11px;
    border-radius:50%;
    background:#cde6f5;
    border:2px solid #fff;
    display:block;
    transition:transform .25s, background .25s;
  }
  #progressDots i.on{ background:var(--sun); transform:scale(1.25); }
  #bannerSpeak{
    width:44px; height:44px;
    border-radius:50%;
    background:#ffe473;
    border:3px solid #fff;
    box-shadow:0 3px 0 #d99400;
    display:grid;
    place-items:center;
    font-size:21px;
  }

  /* ================= FLOATING PARTY BALLOONS SKY LAYER ================= */
  #skyField{
    position:absolute;
    inset:0;
    z-index:8;
    overflow:hidden;
    pointer-events:none;
  }
  .p-balloon{
    position:absolute;
    left:0; top:0;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    pointer-events:auto;
    width:clamp(108px, 14vw, 152px);
    height:clamp(144px, 19vw, 204px);
    will-change:transform;
    transform-origin:50% 45%;
    touch-action:manipulation;
  }
  .p-balloon svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
    filter:drop-shadow(0 12px 14px rgba(18,74,120,.22));
  }
  .p-balloon:active svg{ filter:brightness(1.1) drop-shadow(0 12px 14px rgba(18,74,120,.22)); }

  .p-balloon.hint-glow svg{
    filter:drop-shadow(0 0 18px rgba(255,224,102,1)) drop-shadow(0 0 32px rgba(255,201,60,.85));
  }
  .p-balloon.rainbow svg{
    filter:drop-shadow(0 0 14px rgba(255,224,102,.95)) drop-shadow(0 10px 14px rgba(18,74,120,.22));
  }
  .p-balloon.boing{
    pointer-events:none;
    transition:transform .42s ease-in, opacity .42s ease-in;
  }

  /* Pop Surprise Emoji + Confetti Particles */
  .pop-surprise{
    position:absolute;
    z-index:22;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    font-weight:700;
    filter:drop-shadow(0 6px 10px rgba(18,62,104,.28));
  }
  .pop-surprise .ps-emo{ font-size:58px; line-height:1; }
  .pop-surprise .ps-let{
    font-size:32px;
    color:#fff;
    background:#ef4444;
    border:3.5px solid #fff;
    border-radius:999px;
    padding:2px 14px;
    margin-top:-6px;
    box-shadow:0 4px 0 #a31c16;
  }
  .pop-ring{
    position:absolute;
    z-index:16;
    width:120px;
    height:120px;
    border-radius:50%;
    border:7px solid #fff;
    pointer-events:none;
    transform:translate(-50%,-50%) scale(.2);
    animation:popRing .42s ease-out forwards;
  }
  @keyframes popRing{
    to{ transform:translate(-50%,-50%) scale(1.6); opacity:0; }
  }
  .confetti{
    position:absolute;
    z-index:24;
    width:12px;
    height:16px;
    border-radius:3px;
    pointer-events:none;
  }

  /* ================= WIN OVERLAY ================= */
  #winOverlay{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(16,66,108,.42);
    padding:16px;
  }
  #winOverlay[hidden]{ display:none; }
  #winCard{
    background:var(--cream);
    border:6px solid #fff;
    border-radius:36px;
    box-shadow:0 14px 0 rgba(16,66,108,.24), 0 28px 54px rgba(10,44,78,.4);
    padding:24px 26px 22px;
    text-align:center;
    width:min(90vw, 410px);
    animation:cardPop .46s cubic-bezier(.34,1.6,.5,1);
  }
  @keyframes cardPop{ from{transform:scale(.58) translateY(28px); opacity:0} to{transform:scale(1) translateY(0); opacity:1} }
  #winStars{ font-size:40px; letter-spacing:6px; color:#d0e6f4; }
  #winStars .lit{ color:var(--sun); text-shadow:0 3px 0 #d99400; }
  #winTrophy{ font-size:56px; margin:6px 0; }
  #winChips{ display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:12px 0 20px; }
  #winChips .sky-chip{ width:52px; height:52px; font-size:28px; }
  #againBtn{
    min-width:168px;
    min-height:74px;
    border-radius:999px;
    border:4px solid #fff;
    background:linear-gradient(180deg,#6ce078,#3db84d);
    color:#fff;
    font-family:"Fredoka",sans-serif;
    font-size:32px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 7px 0 #238030;
  }
  #againBtn:active{ transform:translateY(3px) scale(.96); }

  /* ================= PORTRAIT PHONE RESPONSIVE ================= */
  @media (max-width:600px){
    #sunBtn{ right:86px; width:62px; height:62px; }
    .hud-pill{ min-width:56px; min-height:56px; height:56px; padding:0 12px; font-size:24px; }
    .hud-pill.round{ width:56px; }
    #starBank{ min-height:56px; padding:0 14px 0 10px; font-size:22px; }
    #hotAirWrap{
      left:8px;
      bottom:max(6px, env(safe-area-inset-bottom));
      flex-direction:row;
      align-items:flex-end;
      gap:8px;
    }
    #hotAirBtn{ width:112px; }
    #wantedBanner{ min-height:64px; padding:6px 10px 6px 8px; gap:6px; margin-bottom:8px; }
    #targetLetter{ width:48px; height:48px; font-size:32px; }
    #targetEmoji{ font-size:24px; }
    #bannerSpeak{ width:40px; height:40px; font-size:18px; }
    .p-balloon{ width:clamp(94px, 27vw, 120px); height:clamp(126px, 36vw, 160px); }
    .sky-chip{ width:22px; height:22px; font-size:12px; }
  }
</style>
</head>
<body>
<div id="stage">
  <!-- Living Sky Props -->
  <button class="sky-prop" id="sunBtn" type="button" aria-label="Smiling Sun">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g class="rays" stroke="#ffbe0b" stroke-width="6.5" stroke-linecap="round">
        <path d="M50 3v13M50 84v13M3 50h13M84 50h13M16 16l9 9M75 75l9 9M84 16l-9 9M25 75l-9 9"/>
      </g>
      <circle cx="50" cy="50" r="27" fill="#ffd447" stroke="#f0a202" stroke-width="3.5"/>
      <circle cx="41" cy="46" r="3.6" fill="#17324f"/><circle cx="59" cy="46" r="3.6" fill="#17324f"/>
      <path d="M40 58 Q50 66 60 58" stroke="#17324f" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <circle cx="34" cy="55" r="4.5" fill="#ff9e8a" opacity=".82"/><circle cx="66" cy="55" r="4.5" fill="#ff9e8a" opacity=".82"/>
    </svg>
  </button>

  <button class="sky-prop cloud-btn" type="button" style="top:11%;animation-duration:72s;animation-delay:-24s" aria-label="Fluffy Cloud">
    <svg viewBox="0 0 120 56" aria-hidden="true"><ellipse cx="38" cy="39" rx="30" ry="14" fill="#fff"/><ellipse cx="66" cy="28" rx="28" ry="20" fill="#fff"/><ellipse cx="92" cy="40" rx="23" ry="13" fill="#fff"/></svg>
  </button>
  <button class="sky-prop cloud-btn" type="button" style="top:26%;animation-duration:98s;animation-delay:-68s;width:96px" aria-label="Fluffy Cloud">
    <svg viewBox="0 0 120 56" aria-hidden="true"><ellipse cx="38" cy="39" rx="30" ry="14" fill="#fff"/><ellipse cx="66" cy="28" rx="28" ry="20" fill="#fff"/><ellipse cx="92" cy="40" rx="23" ry="13" fill="#fff"/></svg>
  </button>
  <button class="sky-prop bird-btn" type="button" style="top:17%;animation-duration:26s;animation-delay:-10s" aria-label="Sky Bird">
    <svg viewBox="0 0 58 40" aria-hidden="true">
      <path d="M16 24 Q9 30 3 28 Q11 21 15 16 Z" fill="#2563eb"/>
      <ellipse cx="30" cy="22" rx="14" ry="9" fill="#60a5fa" stroke="#17324f" stroke-width="2.2"/>
      <circle cx="43" cy="16" r="7" fill="#60a5fa" stroke="#17324f" stroke-width="2.2"/>
      <path class="wing" d="M25 16 Q14 2 4 7 Q12 15 21 20 Z" fill="#2563eb" stroke="#17324f" stroke-width="2"/>
      <path d="M50 16 L57 19 L50 22 Z" fill="#ff9f1c"/>
      <circle cx="45" cy="14.5" r="2" fill="#17324f"/>
    </svg>
  </button>

  <!-- Fluffy Foreground Cloud Banks -->
  <svg id="cloudBanks" viewBox="0 0 1200 130" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 78 Q90 24 200 66 Q320 12 460 58 Q610 18 760 62 Q910 14 1060 58 Q1140 34 1200 62 L1200 130 L0 130 Z" fill="#ffffff" opacity=".72"/>
    <path d="M0 96 Q130 46 270 86 Q410 38 560 82 Q720 42 880 86 Q1040 44 1200 84 L1200 130 L0 130 Z" fill="#ffffff"/>
  </svg>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-group">
      <button class="hud-pill mode-btn active" id="modeQuestBtn" type="button" aria-label="ABC Quest" aria-pressed="true">🎈</button>
      <button class="hud-pill mode-btn" id="modeFreeBtn" type="button" aria-label="Free Pop Party" aria-pressed="false">🎉</button>
      <button class="hud-pill round" id="soundBtn" type="button" aria-label="Toggle Sound">🔊</button>
    </div>
    <div id="starBank" aria-label="Stars collected">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4l3 6 6.6.9-4.8 4.6 1.1 6.6L12 17.4l-5.9 3.1 1.1-6.6-4.8-4.6 6.6-.9z" fill="#ffc93c" stroke="#d99400" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span id="starCount">0</span>
    </div>
  </div>

  <!-- Floating Party Balloons Layer -->
  <div id="skyField"></div>

  <!-- Hoot in Striped Hot-Air Balloon + Wanted Sky Banner -->
  <div id="hotAirWrap">
    <button id="hotAirBtn" type="button" aria-label="Hoot in his Hot-Air Balloon — tap to hear the letter again">
      <svg viewBox="0 0 220 336" aria-hidden="true">
        <!-- Colorful Striped Hot-Air Balloon Envelope -->
        <path d="M110 12 C48 12 20 60 24 114 C28 152 60 176 78 192 H142 C160 176 192 152 196 114 C200 60 172 12 110 12 Z" fill="#ff5c52" stroke="#17324f" stroke-width="5" stroke-linejoin="round"/>
        <!-- Stripes -->
        <path d="M110 12 C74 12 52 58 55 114 C58 150 76 175 88 192 H132 C144 175 162 150 165 114 C168 58 146 12 110 12 Z" fill="#ffd447" stroke="#17324f" stroke-width="4"/>
        <path d="M110 12 C90 12 78 58 80 114 C82 150 92 175 98 192 H122 C128 175 138 150 140 114 C142 58 130 12 110 12 Z" fill="#14b8a6" stroke="#17324f" stroke-width="4"/>
        <!-- Glossy balloon highlight -->
        <ellipse cx="64" cy="64" rx="14" ry="26" fill="#fff" opacity=".32" transform="rotate(20 64 64)"/>
        <!-- Collar & Burner Flame -->
        <rect x="76" y="188" width="68" height="14" rx="6" fill="#0d9488" stroke="#17324f" stroke-width="4"/>
        <path class="flame" d="M110 202 C100 214 102 224 110 226 C118 224 120 214 110 202 Z" fill="#ffbe0b" stroke="#ea580c" stroke-width="2.5"/>
        <!-- Ropes -->
        <line x1="84" y1="202" x2="70" y2="270" stroke="#6b3e18" stroke-width="4"/>
        <line x1="136" y1="202" x2="150" y2="270" stroke="#6b3e18" stroke-width="4"/>

        <!-- Hoot with Aviator Goggles waving inside basket -->
        <g class="hoot-head" transform="translate(56,204)">
          <!-- Waving wing -->
          <ellipse cx="96" cy="54" rx="13" ry="24" fill="#8b5226" stroke="#4a2810" stroke-width="3.5" transform="rotate(-38 96 54)"/>
          <ellipse cx="54" cy="62" rx="34" ry="30" fill="#a26636" stroke="#4a2810" stroke-width="4"/>
          <circle cx="54" cy="36" r="32" fill="#a26636" stroke="#4a2810" stroke-width="4"/>
          <path d="M26 22 Q18 4 35 12 Z" fill="#8b5226" stroke="#4a2810" stroke-width="3"/>
          <path d="M82 22 Q90 4 73 12 Z" fill="#8b5226" stroke="#4a2810" stroke-width="3"/>
          <ellipse cx="41" cy="38" rx="15" ry="16" fill="#fdecd2"/>
          <ellipse cx="67" cy="38" rx="15" ry="16" fill="#fdecd2"/>
          <circle cx="41" cy="37" r="7.5" fill="#17324f"/><circle cx="67" cy="37" r="7.5" fill="#17324f"/>
          <circle cx="43.5" cy="34.5" r="2.8" fill="#fff"/><circle cx="69.5" cy="34.5" r="2.8" fill="#fff"/>
          <circle cx="28" cy="48" r="5.5" fill="#ff9e8a" opacity=".82"/><circle cx="80" cy="48" r="5.5" fill="#ff9e8a" opacity=".82"/>
          <path d="M47 45 Q54 41 61 45 Q58 55 54 56 Q50 55 47 45 Z" fill="#ffab1f" stroke="#b56200" stroke-width="2"/>
          <!-- Cute Aviator Goggles on forehead -->
          <rect x="22" y="14" width="64" height="7" rx="3.5" fill="#7c4a21"/>
          <circle cx="40" cy="17" r="11" fill="#aee8ff" stroke="#7c4a21" stroke-width="4"/>
          <circle cx="68" cy="17" r="11" fill="#aee8ff" stroke="#7c4a21" stroke-width="4"/>
          <circle cx="37" cy="14" r="3" fill="#fff" opacity=".8"/>
          <circle cx="65" cy="14" r="3" fill="#fff" opacity=".8"/>
        </g>

        <!-- Woven Wicker Basket -->
        <path d="M62 270 H158 L148 320 A10 10 0 0 1 138 328 H82 A10 10 0 0 1 72 320 Z" fill="#c88542" stroke="#4a2810" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M66 290 H154 M70 308 H150" stroke="#7c4a21" stroke-width="3.5" opacity=".7"/>
        <path d="M88 272 V326 M110 272 V326 M132 272 V326" stroke="#7c4a21" stroke-width="3.5" opacity=".55"/>
        <rect x="57" y="262" width="106" height="14" rx="7" fill="#e4a45e" stroke="#4a2810" stroke-width="4"/>
      </svg>
      <div id="basketChips" title="Popped letters"></div>
    </button>

    <button id="wantedBanner" type="button" aria-label="Hear Hoot call the letter">
      <div id="targetLetter">A</div>
      <div id="targetCue">
        <span id="targetEmoji" aria-hidden="true">🍎</span>
        <div id="progressDots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <span id="bannerSpeak" aria-hidden="true">🔊</span>
    </button>
  </div>

  <!-- Win Celebration Overlay -->
  <div id="winOverlay" hidden>
    <div id="winCard" role="dialog" aria-modal="true" aria-label="You popped all 5 letter balloons!">
      <div id="winStars" aria-hidden="true"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
      <div id="winTrophy" aria-hidden="true">🎈🌟🎉</div>
      <div id="winChips"></div>
      <button id="againBtn" type="button" aria-label="Play Again">↻ ▶</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var DATA={
    A:{emo:"🍎"},B:{emo:"🎈"},C:{emo:"🐱"},D:{emo:"🐶"},E:{emo:"🥚"},F:{emo:"🐟"},
    G:{emo:"🐐"},H:{emo:"🎩"},I:{emo:"🧊"},J:{emo:"🧃"},K:{emo:"🪁"},L:{emo:"🦁"},
    M:{emo:"🐵"},N:{emo:"🪺"},O:{emo:"🐙"},P:{emo:"🐧"},Q:{emo:"👑"},R:{emo:"🌈"},
    S:{emo:"☀️"},T:{emo:"🐢"},U:{emo:"☂️"},V:{emo:"🎻"},W:{emo:"🐳"},X:{emo:"🦊"},
    Y:{emo:"🪀"},Z:{emo:"🦓"}
  };

  var PALETTE=[
    {fill:"#ff5c52",deep:"#c92a22",hi:"#ff9d96"},
    {fill:"#ffb703",deep:"#cc7a00",hi:"#ffe380"},
    {fill:"#2ec4b6",deep:"#118278",hi:"#8ef0e7"},
    {fill:"#3b82f6",deep:"#1d4ed8",hi:"#93c5fd"},
    {fill:"#a855f7",deep:"#7e22ce",hi:"#d8b4fe"},
    {fill:"#ec4899",deep:"#be185d",hi:"#f9a8d4"},
    {fill:"#4bc85b",deep:"#258c31",hi:"#9bf0a6"}
  ];

  var PRAISE=["hoot-great-job.mp3","hoot-amazing.mp3","hoot-star.mp3","hoot-super.mp3","hoot-yay-2.mp3"];
  var WRONG=["hoot-try-again.mp3","hoot-look-closely.mp3","hoot-almost.mp3"];
  var GOAL=5;

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function pickLetterSet(){
    var all=Object.keys(DATA);
    try{
      var P=window.parent;
      var W=String(P&&P.__llLetterOfWeek?P.__llLetterOfWeek():"").toUpperCase();
      var ln=shuffle((P&&P.__llLettersLearned?P.__llLettersLearned():[])
        .map(function(x){return String(x).toUpperCase();})
        .filter(function(x){return x!==W && all.indexOf(x)>-1;})).slice(0,2);
      var rest=shuffle(all.filter(function(x){return x!==W && ln.indexOf(x)<0;}));
      var out=(all.indexOf(W)>-1?[W]:[]).concat(ln);
      while(out.length<GOAL) out.push(rest.shift());
      return out;
    }catch(e){
      return shuffle(all.slice()).slice(0,GOAL);
    }
  }

  /* ================= STATE ================= */
  var state="play"; /* play | won */
  var mode="quest"; /* quest | free */
  var lettersSet=[], targets=[], tIdx=0, targetLetter="A";
  var popped=[], stars=0, praiseIdx=0, wrongIdx=0;
  var soundOn=true, dead=false, idleTimer=null;
  var balloons=[], animId=null, lastFrame=0;

  function $(id){ return document.getElementById(id); }
  var stage=$("stage"), skyField=$("skyField"),
      hotAirBtn=$("hotAirBtn"), basketChips=$("basketChips"),
      wantedBanner=$("wantedBanner"), targetLetterEl=$("targetLetter"),
      targetEmoji=$("targetEmoji"), dots=$("progressDots").children,
      starCount=$("starCount"), starBank=$("starBank"),
      winOverlay=$("winOverlay"), winStars=$("winStars"), winChips=$("winChips"),
      modeQuestBtn=$("modeQuestBtn"), modeFreeBtn=$("modeFreeBtn"),
      soundBtn=$("soundBtn");

  /* ================= SOUND FX ================= */
  var AC=null;
  function audio(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
    if(AC&&AC.state==="suspended") AC.resume();
    return AC;
  }
  function tone(f0,f1,dur,type,vol,delay){
    if(!soundOn) return;
    var ac=audio(); if(!ac) return;
    var t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.13,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
  }
  function noise(dur,freq,vol){
    if(!soundOn) return;
    var ac=audio(); if(!ac) return;
    var t=ac.currentTime, len=Math.max(1,(dur*ac.sampleRate)|0);
    var buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    var src=ac.createBufferSource(); src.buffer=buf;
    var f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq||900; f.Q.value=0.7;
    var g=ac.createGain(); g.gain.setValueAtTime(vol||0.24,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t);
  }
  function popSfx(){ noise(0.11,1100,0.28); tone(540,140,0.09,"sine",0.18); tone(880,1320,0.12,"triangle",0.1,0.05); }
  function rainbowPopSfx(){ popSfx(); tone(1046,1568,0.16,"triangle",0.12,0.09); tone(1568,2093,0.18,"sine",0.11,0.17); }
  function boingSfx(){ tone(290,95,0.26,"sine",0.14); }
  function burnerSfx(){ noise(0.28,360,0.14); tone(180,320,0.22,"sine",0.08); }
  function chirpSfx(){ tone(1400,2100,0.08,"sine",0.08); tone(1600,2400,0.09,"sine",0.08,0.1); }
  function starSfx(){ tone(880,880,0.08,"triangle",0.1); tone(1175,1175,0.08,"triangle",0.1,0.06); tone(1568,1568,0.14,"triangle",0.1,0.12); }

  /* ================= STUDIO HOOT VOICE ================= */
  var VBASE="assets/voice/";
  var voiceEl=null, vQueue=[], vPlaying=false;
  function hasClip(id){
    try{ var H=window.parent&&window.parent.HOOT_HAVE; if(H) return !!H[id]; }catch(e){}
    return true;
  }
  function getVoice(){
    if(!voiceEl){
      voiceEl=new Audio(); voiceEl.preload="auto";
      voiceEl.addEventListener("ended",function(){
        var e=voiceEl;
        if(e.__hwT && Date.now()-e.__hwT<350){
          if(!e.paused && !e.ended) return;
          if(!e.__hwRetry){ e.__hwRetry=1; try{e.currentTime=0;}catch(x){} var p=e.play(); if(p&&p.catch) p.catch(vNext); return; }
        }
        vNext();
      });
      voiceEl.addEventListener("error",vNext);
    }
    return voiceEl;
  }
  function hubQuiet(){
    try{
      var d=window.parent&&window.parent.document;
      if(!d||d===document) return false;
      var b=d.querySelector('.voice-btn[data-voice="off"]');
      return !!(b&&(b.classList.contains("sel")||b.classList.contains("active")||b.getAttribute("aria-pressed")==="true"));
    }catch(e){ return false; }
  }
  function vNext(){ if(!vPlaying){ pumpVoice(); return; } vPlaying=false; hotAirBtn.classList.remove("talking"); pumpVoice(); }
  function pumpVoice(){
    if(vPlaying||dead) return;
    var item=vQueue.shift(); if(!item) return;
    if(!soundOn||hubQuiet()){ pumpVoice(); return; }
    var el=getVoice();
    vPlaying=true; hotAirBtn.classList.add("talking");
    el.__hwT=Date.now(); el.__hwRetry=0;
    el.src=VBASE+item.file;
    var p=el.play();
    if(p&&p.catch) p.catch(vNext);
  }
  function clearVoice(stop){
    vQueue.length=0;
    if(stop && voiceEl){
      voiceEl.__hwT=0; voiceEl.__hwRetry=1;
      try{ voiceEl.pause(); }catch(e){}
      vPlaying=false; hotAirBtn.classList.remove("talking");
    }
  }
  function enqueue(file){
    if(!file) return;
    vQueue.push({file:file});
    pumpVoice();
  }
  function callTarget(L){
    var low=L.toLowerCase();
    var clip=hasClip("call-letter-"+low)?("call-letter-"+low+".mp3"):("name-letter-"+low+".mp3");
    clearVoice(true);
    enqueue(clip);
    wantedBanner.classList.remove("pop"); void wantedBanner.offsetWidth; wantedBanner.classList.add("pop");
  }
  function speakPopSuccess(L, nextL){
    var low=L.toLowerCase();
    clearVoice(true);
    if(hasClip("name-letter-"+low)) enqueue("name-letter-"+low+".mp3");
    var pr=PRAISE[praiseIdx%PRAISE.length]; praiseIdx++;
    if(!hasClip(pr.replace(".mp3",""))) pr="hoot-great-job.mp3";
    enqueue(pr);
    if(nextL){
      var nlow=nextL.toLowerCase();
      enqueue(hasClip("call-letter-"+nlow)?("call-letter-"+nlow+".mp3"):("name-letter-"+nlow+".mp3"));
    }
  }
  function speakWrong(T){
    var w=WRONG[wrongIdx%WRONG.length]; wrongIdx++;
    if(!hasClip(w.replace(".mp3",""))) w="hoot-try-again.mp3";
    var low=T.toLowerCase();
    clearVoice(true);
    enqueue(w);
    enqueue(hasClip("call-letter-"+low)?("call-letter-"+low+".mp3"):("name-letter-"+low+".mp3"));
  }

  /* ================= IDLE NUDGE ================= */
  function clearIdle(){
    if(idleTimer){ clearTimeout(idleTimer); idleTimer=null; }
    balloons.forEach(function(b){ b.el.classList.remove("hint-glow"); });
  }
  function armIdle(){
    clearIdle();
    if(dead || state!=="play" || mode!=="quest") return;
    idleTimer=setTimeout(function(){
      if(dead || state!=="play" || mode!=="quest") return;
      balloons.forEach(function(b){
        if(b.letter===targetLetter) b.el.classList.add("hint-glow");
      });
      if(!vPlaying && !vQueue.length) callTarget(targetLetter);
    }, 9500);
  }

  /* ================= GLOSSY 3D PARTY BALLOON SVG ================= */
  var gradCounter=0;
  function balloonSVG(L, pal, rainbow){
    var gid="bg"+(++gradCounter);
    var fillDef=rainbow
      ? '<linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff5c52"/><stop offset="28%" stop-color="#ffd447"/><stop offset="56%" stop-color="#4bc85b"/><stop offset="80%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient>'
      : '<radialGradient id="'+gid+'" cx="32%" cy="26%" r="72%"><stop offset="0%" stop-color="'+pal.hi+'"/><stop offset="46%" stop-color="'+pal.fill+'"/><stop offset="100%" stop-color="'+pal.deep+'"/></radialGradient>';
    var strokeCol=rainbow?"#17324f":pal.deep;
    return '<svg viewBox="0 0 120 162" aria-hidden="true">'
      +'<defs>'+fillDef+'</defs>'
      /* Curling ribbon string */
      +'<path d="M60 116 Q50 130 62 140 T56 160" stroke="#fffdf7" stroke-width="3.6" fill="none" stroke-linecap="round"/>'
      /* Balloon knot */
      +'<path d="M53 114 L67 114 L63 122 L57 122 Z" fill="'+strokeCol+'"/>'
      /* Plump glossy balloon body */
      +'<path d="M60 8 C24 8 10 38 14 70 C18 96 42 114 60 116 C78 114 102 96 106 70 C110 38 96 8 60 8 Z" fill="url(#'+gid+')" stroke="#17324f" stroke-width="4.2"/>'
      /* Specular gloss shine */
      +'<ellipse cx="38" cy="38" rx="11" ry="20" fill="#fff" opacity=".42" transform="rotate(24 38 38)"/>'
      +'<circle cx="31" cy="60" r="4.5" fill="#fff" opacity=".45"/>'
      /* Giant crisp bold capital letter */
      +'<text x="60" y="76" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="52" fill="#ffffff" stroke="#17324f" stroke-width="2.5" paint-order="stroke">'+L+'</text>'
      +'</svg>';
  }

  /* ================= BALLOON PHYSICS & SPAWNING ================= */
  function skyBounds(){
    var w=window.innerWidth, h=window.innerHeight;
    var portrait=w<600;
    return {
      minX: portrait ? 18 : Math.min(w*0.32, 275),
      maxX: w - (portrait ? 112 : 155),
      minY: 74,
      maxY: portrait ? (h - 270) : (h - 170),
      h: h
    };
  }

  function clearBalloons(){
    balloons.forEach(function(b){ b.el.remove(); });
    balloons=[];
  }

  function spawnBalloon(L, slotIdx, totalSlots, rainbow, startNearBottom){
    var bnd=skyBounds();
    var pal=PALETTE[(L.charCodeAt(0)+slotIdx)%PALETTE.length];
    var el=document.createElement("button");
    el.type="button";
    el.className="p-balloon"+(rainbow?" rainbow":"");
    el.dataset.letter=L;
    el.setAttribute("aria-label","Balloon "+L);
    el.innerHTML=balloonSVG(L, pal, rainbow);

    var span=Math.max(40, bnd.maxX - bnd.minX);
    var baseX=bnd.minX + (totalSlots>1 ? (span * (slotIdx/(totalSlots-1))) : span*0.5);
    var startY=startNearBottom
      ? (bnd.h - 20 + Math.random()*70)
      : (bnd.minY + 30 + (slotIdx%2)*80 + Math.random()*Math.max(40, bnd.maxY - bnd.minY - 120));

    var obj={
      el:el, letter:L, rainbow:!!rainbow, pal:pal,
      baseX:baseX, x:baseX, y:startY,
      vy: 26 + Math.random()*18, /* gentle soothing float speed px/sec */
      phase: Math.random()*Math.PI*2,
      swayAmp: 12 + Math.random()*12,
      swaySpd: 1.2 + Math.random()*0.6,
      dead:false
    };
    el.style.transform="translate3d("+obj.x+"px,"+obj.y+"px,0)";
    el.addEventListener("pointerdown",function(e){
      e.preventDefault();
      onBalloonTap(obj);
    });
    skyField.appendChild(el);
    balloons.push(obj);
    return obj;
  }

  function tick(ts){
    if(dead) return;
    if(!lastFrame) lastFrame=ts;
    var dt=Math.min(0.05, (ts-lastFrame)/1000);
    lastFrame=ts;
    var bnd=skyBounds();
    for(var i=0;i<balloons.length;i++){
      var b=balloons[i];
      if(b.dead) continue;
      b.phase += b.swaySpd * dt;
      b.y -= b.vy * dt;
      if(b.y < -150){
        /* Loop smoothly back up from bottom clouds */
        b.y = bnd.h - 10;
      }
      b.x = Math.max(bnd.minX-12, Math.min(bnd.maxX+12, b.baseX + Math.sin(b.phase)*b.swayAmp));
      var rot = Math.cos(b.phase)*4.5;
      b.el.style.transform="translate3d("+b.x.toFixed(1)+"px,"+b.y.toFixed(1)+"px,0) rotate("+rot.toFixed(1)+"deg)";
    }
    animId=requestAnimationFrame(tick);
  }

  /* ================= POP FX & CONFETTI ================= */
  function burstPopFX(cx, cy, L, pal, rainbow){
    var ring=document.createElement("div");
    ring.className="pop-ring";
    ring.style.left=cx+"px"; ring.style.top=cy+"px";
    ring.style.borderColor=rainbow?"#ffe066":pal.hi;
    stage.appendChild(ring);
    setTimeout(function(){ ring.remove(); }, 460);

    var cols=rainbow?["#ff5c52","#ffd447","#4bc85b","#38bdf8","#c084fc","#f472b6"]:[pal.fill, pal.hi, "#ffe066", "#ffffff"];
    var cnt=rainbow?28:16;
    for(var i=0;i<cnt;i++){
      var c=document.createElement("div");
      c.className="confetti";
      c.style.background=cols[i%cols.length];
      c.style.left=cx+"px"; c.style.top=cy+"px";
      stage.appendChild(c);
      var a=(Math.PI*2*(i/cnt))+(Math.random()*0.3);
      var dist=55+Math.random()*95;
      var dx=Math.cos(a)*dist, dy=Math.sin(a)*dist+30, rot=(Math.random()*2-1)*340;
      if(c.animate){
        c.animate([
          {transform:"translate(-50%,-50%) scale(1.1) rotate(0deg)", opacity:1},
          {transform:"translate("+dx+"px,"+dy+"px) scale(.5) rotate("+rot+"deg)", opacity:0}
        ],{duration:680+Math.random()*260, easing:"cubic-bezier(.2,.75,.3,1)"});
      }
      (function(el){ setTimeout(function(){ el.remove(); }, 980); })(c);
    }

    /* Picture surprise emoji + bold letter pops out & arcs gently! */
    var pop=document.createElement("div");
    pop.className="pop-surprise";
    pop.style.left=(cx-34)+"px"; pop.style.top=(cy-44)+"px";
    pop.innerHTML='<span class="ps-emo">'+DATA[L].emo+'</span><span class="ps-let">'+L+'</span>';
    stage.appendChild(pop);
    if(pop.animate){
      pop.animate([
        {transform:"scale(.35) translateY(10px)", opacity:0},
        {transform:"scale(1.16) translateY(-28px)", opacity:1, offset:0.3},
        {transform:"scale(1) translateY(-48px)", opacity:1, offset:0.75},
        {transform:"scale(.75) translateY(-76px)", opacity:0}
      ],{duration:1150, easing:"cubic-bezier(.25,.8,.3,1)"});
    }
    setTimeout(function(){ pop.remove(); }, 1200);
  }

  /* ================= GAME FLOW ================= */
  function updateHUD(){
    starCount.textContent=stars;
    for(var i=0;i<dots.length;i++) dots[i].classList.toggle("on", i<popped.length);
  }
  function addBasketChip(L){
    if(basketChips.children.length>=5 && mode==="free") basketChips.removeChild(basketChips.firstChild);
    var c=document.createElement("span");
    c.className="sky-chip";
    c.textContent=L;
    c.dataset.letter=L;
    basketChips.appendChild(c);
  }

  function presentQuestWave(speakNow){
    targetLetter=targets[tIdx];
    targetLetterEl.textContent=targetLetter;
    targetEmoji.textContent=DATA[targetLetter].emo;
    wantedBanner.style.display="flex";

    clearBalloons();
    var pool=shuffle(Object.keys(DATA).filter(function(x){ return x!==targetLetter && popped.indexOf(x)<0; }));
    var wave=shuffle([targetLetter].concat(pool.slice(0,3)));
    var rainbowIdx=(Math.random()<0.35) ? wave.indexOf(targetLetter) : -1;
    wave.forEach(function(L,i){
      spawnBalloon(L, i, wave.length, i===rainbowIdx, false);
    });
    updateHUD();
    if(speakNow) callTarget(targetLetter);
    armIdle();
  }

  function presentFreeSky(){
    wantedBanner.style.display="none";
    clearBalloons();
    var wave=shuffle(Object.keys(DATA)).slice(0,5);
    wave.forEach(function(L,i){
      spawnBalloon(L, i, wave.length, i===0, false);
    });
    updateHUD();
  }

  function startRound(){
    clearIdle();
    clearVoice(true);
    state="play";
    popped=[];
    basketChips.innerHTML="";
    stars=0;
    winOverlay.hidden=true;
    lettersSet=pickLetterSet();
    targets=shuffle(lettersSet.slice());
    tIdx=0;
    if(mode==="quest"){
      presentQuestWave(true);
    } else {
      presentFreeSky();
      enqueue("hoot-game-hello.mp3");
    }
  }

  function onBalloonTap(b){
    audio();
    if(dead || state!=="play" || b.dead) return;
    var r=b.el.getBoundingClientRect();
    var cx=r.left+r.width/2, cy=r.top+r.height*0.42;

    if(mode==="quest" && b.letter!==targetLetter){
      /* Gentle playful rubbery boing away */
      b.dead=true;
      boingSfx();
      b.el.classList.add("boing");
      b.el.style.transform="translate3d("+b.x+"px,"+(b.y-180)+"px,0) scale(1.15,.85)";
      b.el.style.opacity="0";
      speakWrong(targetLetter);
      balloons.forEach(function(x){ if(!x.dead && x.letter===targetLetter) x.el.classList.add("hint-glow"); });
      setTimeout(function(){
        b.el.remove();
        balloons=balloons.filter(function(x){ return x!==b; });
      }, 450);
      armIdle();
      return;
    }

    /* POP!! */
    clearIdle();
    b.dead=true;
    b.el.remove();
    balloons=balloons.filter(function(x){ return x!==b; });

    if(b.rainbow){ rainbowPopSfx(); stars+=2; } else { popSfx(); stars++; }
    burstPopFX(cx, cy, b.letter, b.pal, b.rainbow);
    hotAirBtn.classList.remove("boost"); void hotAirBtn.offsetWidth; hotAirBtn.classList.add("boost");
    starBank.classList.remove("bump"); void starBank.offsetWidth; starBank.classList.add("bump");
    popped.push(b.letter);
    addBasketChip(b.letter);
    updateHUD();

    if(mode==="free"){
      var low=b.letter.toLowerCase();
      clearVoice(true);
      if(hasClip("name-letter-"+low)) enqueue("name-letter-"+low+".mp3");
      /* Spawn a fresh balloon from bottom clouds so the sky party never stops! */
      var all=Object.keys(DATA);
      var used=balloons.map(function(x){ return x.letter; });
      var nextPool=all.filter(function(x){ return used.indexOf(x)<0; });
      var nextL=nextPool[Math.floor(Math.random()*nextPool.length)] || all[0];
      spawnBalloon(nextL, Math.floor(Math.random()*5), 5, Math.random()<0.22, true);
      return;
    }

    /* Quest progression */
    if(tIdx >= GOAL-1){
      speakPopSuccess(b.letter, null);
      setTimeout(function(){ if(!dead) showWin(); }, 650);
    } else {
      tIdx++;
      var nextTarget=targets[tIdx];
      speakPopSuccess(b.letter, nextTarget);
      presentQuestWave(false);
    }
  }

  function showWin(){
    if(state==="won") return;
    state="won";
    clearIdle();
    clearBalloons();
    winChips.innerHTML="";
    popped.forEach(function(L){
      var s=document.createElement("span");
      s.className="sky-chip";
      s.textContent=L;
      winChips.appendChild(s);
    });
    var st=winStars.children;
    for(var i=0;i<st.length;i++){
      st[i].classList.remove("lit");
      (function(el,ms){ setTimeout(function(){ el.classList.add("lit"); }, ms); })(st[i], 180+i*150);
    }
    winOverlay.hidden=false;
    starSfx();
    enqueue(hasClip("hoot-win-yay")?"hoot-win-yay.mp3":"hoot-amazing.mp3");
    /* Big sky confetti shower! */
    var sr=stage.getBoundingClientRect();
    burstPopFX(sr.width*0.35, sr.height*0.32, popped[0]||"A", PALETTE[0], true);
    burstPopFX(sr.width*0.65, sr.height*0.32, popped[popped.length-1]||"B", PALETTE[3], true);
  }

  /* ================= CONTROLS & SKY TOYS ================= */
  function repeatCall(){
    audio(); burnerSfx();
    hotAirBtn.classList.remove("boost"); void hotAirBtn.offsetWidth; hotAirBtn.classList.add("boost");
    if(state==="play" && mode==="quest"){ callTarget(targetLetter); armIdle(); }
  }
  hotAirBtn.addEventListener("click",repeatCall);
  wantedBanner.addEventListener("click",repeatCall);

  basketChips.addEventListener("click",function(e){
    e.stopPropagation();
    audio();
    var chips=basketChips.children;
    if(!chips.length) return;
    clearVoice(true);
    Array.prototype.forEach.call(chips,function(ch,i){
      var low=ch.dataset.letter.toLowerCase();
      if(hasClip("name-letter-"+low)) enqueue("name-letter-"+low+".mp3");
      setTimeout(function(){
        for(var j=0;j<chips.length;j++) chips[j].classList.toggle("reading", j===i);
        if(i===chips.length-1) setTimeout(function(){
          for(var k=0;k<chips.length;k++) chips[k].classList.remove("reading");
        }, 700);
      }, i*550);
    });
  });

  modeQuestBtn.addEventListener("click",function(){
    audio(); popSfx();
    mode="quest";
    modeQuestBtn.classList.add("active"); modeQuestBtn.setAttribute("aria-pressed","true");
    modeFreeBtn.classList.remove("active"); modeFreeBtn.setAttribute("aria-pressed","false");
    startRound();
  });
  modeFreeBtn.addEventListener("click",function(){
    audio(); popSfx();
    mode="free";
    modeFreeBtn.classList.add("active"); modeFreeBtn.setAttribute("aria-pressed","true");
    modeQuestBtn.classList.remove("active"); modeQuestBtn.setAttribute("aria-pressed","false");
    startRound();
  });
  soundBtn.addEventListener("click",function(){
    soundOn=!soundOn;
    soundBtn.textContent=soundOn?"🔊":"🔇";
    if(!soundOn) clearVoice(true); else{ audio(); if(state==="play"&&mode==="quest") callTarget(targetLetter); }
  });
  $("againBtn").addEventListener("click",function(){ audio(); starSfx(); startRound(); });

  $("sunBtn").addEventListener("click",function(){
    audio(); starSfx();
    var s=$("sunBtn"); s.classList.remove("zing"); void s.offsetWidth; s.classList.add("zing");
  });
  document.querySelectorAll(".cloud-btn").forEach(function(c){
    c.addEventListener("click",function(){ audio(); noise(0.14,750,0.08); c.classList.add("puff"); setTimeout(function(){ c.classList.remove("puff"); }, 320); });
  });
  document.querySelectorAll(".bird-btn").forEach(function(b){
    b.addEventListener("click",function(){ audio(); chirpSfx(); });
  });

  window.addEventListener("pagehide",function(){ dead=true; if(animId) cancelAnimationFrame(animId); clearIdle(); clearVoice(true); });
  document.addEventListener("visibilitychange",function(){ if(document.hidden) clearVoice(false); });

  /* ================= BOOT ================= */
  startRound();
  animId=requestAnimationFrame(tick);

  window.__balloonGame={
    snapshot:function(){
      return {
        state:state, mode:mode, target:targetLetter, stars:stars,
        popped:popped.slice(), balloonCount:balloons.length,
        presented:balloons.map(function(b){ return b.letter; }),
        winShown:!winOverlay.hidden
      };
    }
  };
})();
</script>
