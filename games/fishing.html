<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>
window.__HOOT_GAME_KEY__="fishing";
window.__HOOT_SELF_COACH__=true;
</script>
<script src="js/hoot-game-head.js?v=llprev3e136"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Letter Fishing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#17324f;
    --cream:#fffdf7;
    --sun:#ffc93c;
    --coral:#ff6b5e;
    --teal:#14b8a6;
    --leaf:#4cc85a;
    --wood:#9a5f2c;
    --wood-dark:#6b3e18;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; width:100%; margin:0; padding:0; overflow:hidden; }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#6dd5f7;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ================= FULL-SCREEN SUNLIT POND STAGE ================= */
  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    background:linear-gradient(180deg,
      #78d3fa 0%,
      #aee8ff 19%,
      #d8f6ff 27%,
      #4ac8de 28%,
      #27a7cc 52%,
      #1a83b5 78%,
      #146699 100%);
  }

  /* Scenic storybook hills, trees & shoreline */
  #backdropSvg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:1;
  }

  /* Animated sunlit water sparkles & ripples */
  .water-shimmer{
    position:absolute;
    inset:27% 0 0 0;
    pointer-events:none;
    z-index:2;
    overflow:hidden;
  }
  .wave-line{
    position:absolute;
    left:-6%;
    width:112%;
    height:24px;
    opacity:.32;
    animation:waveDrift 6s ease-in-out infinite alternate;
  }
  @keyframes waveDrift{
    from{ transform:translateX(-14px); }
    to{ transform:translateX(16px); }
  }
  .caustic{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 70%);
    pointer-events:none;
    animation:causticPulse 3.6s ease-in-out infinite alternate;
  }
  @keyframes causticPulse{
    from{ opacity:.22; transform:scale(.85); }
    to{ opacity:.6; transform:scale(1.18); }
  }

  /* Living sky props */
  .decor{
    position:absolute;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    z-index:3;
  }
  #sunBtn{
    top:max(6px, env(safe-area-inset-top));
    right:clamp(108px, 16vw, 170px);
    width:clamp(66px, 9vw, 88px);
    height:clamp(66px, 9vw, 88px);
  }
  #sunBtn svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 12px rgba(245,176,0,.4)); }
  #sunBtn .rays{ transform-box:fill-box; transform-origin:center; animation:sunSpin 44s linear infinite; }
  @keyframes sunSpin{ to{ transform:rotate(360deg); } }
  #sunBtn.zing .rays{ animation:sunSpin 1s cubic-bezier(.34,1.5,.5,1) 1; }
  #sunBtn:active{ transform:scale(.92); }

  .cloud-btn{
    width:clamp(84px, 13vw, 128px);
    height:clamp(42px, 6vw, 60px);
    opacity:.94;
    animation:cloudFloat linear infinite;
  }
  .cloud-btn svg{ width:100%; height:100%; display:block; transition:transform .24s cubic-bezier(.34,1.8,.5,1); }
  .cloud-btn.puff svg{ transform:scale(1.24,1.34); }
  @keyframes cloudFloat{
    from{ transform:translateX(-140px); }
    to{ transform:translateX(112vw); }
  }

  /* ================= TOP HUD (ZERO TEXT CLUTTER, >=64px) ================= */
  #hud{
    position:absolute;
    top:max(8px, env(safe-area-inset-top));
    left:max(10px, env(safe-area-inset-left));
    right:max(10px, env(safe-area-inset-right));
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    pointer-events:none;
  }
  .hud-group{
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:auto;
  }
  .hud-pill{
    min-width:64px;
    min-height:64px;
    padding:0 16px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,247,.95);
    color:var(--ink);
    font-size:28px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(20,66,105,.22), 0 10px 20px rgba(20,66,105,.16);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .15s;
  }
  .hud-pill:active{ transform:translateY(3px) scale(.94); }
  .hud-pill.mode-btn.active{
    background:linear-gradient(180deg,#ffe473,#ffc93c);
    border-color:#fff;
    box-shadow:0 5px 0 #c98600, 0 0 0 3px #17324f;
  }
  .hud-round{
    width:64px;
    height:64px;
    min-width:64px;
    min-height:64px;
    padding:0;
    border-radius:50%;
  }
  #starBank{
    min-height:64px;
    padding:0 18px 0 12px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,247,.96);
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:26px;
    color:var(--ink);
    box-shadow:0 5px 0 rgba(20,66,105,.22), 0 10px 20px rgba(20,66,105,.16);
    pointer-events:auto;
  }
  #starBank svg{ width:30px; height:30px; display:block; }
  #starBank.bump{ animation:starBump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{ 0%{transform:scale(1)} 45%{transform:scale(1.2) rotate(-4deg)} 100%{transform:scale(1)} }

  /* ================= INTERACTIVE POND LAYER ================= */
  #pond{
    position:absolute;
    inset:0;
    z-index:5;
    overflow:hidden;
  }

  /* Shoreline cattails & pond critters */
  .reed-btn{
    position:absolute;
    bottom:0;
    width:64px;
    height:126px;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    z-index:8;
    transform-origin:50% 100%;
    animation:reedSway 3.8s ease-in-out infinite alternate;
  }
  @keyframes reedSway{ from{ transform:rotate(-3deg); } to{ transform:rotate(3.5deg); } }
  .reed-btn.swish{ animation:reedSwish .45s ease-in-out 2; }
  @keyframes reedSwish{ 0%,100%{transform:rotate(0)} 35%{transform:rotate(-10deg)} 70%{transform:rotate(9deg)} }

  .pond-critter{
    position:absolute;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    z-index:7;
  }
  #frogBtn{
    right:clamp(14px, 4vw, 48px);
    top:29%;
    width:clamp(80px, 11vw, 108px);
    height:clamp(68px, 9vw, 90px);
  }
  #frogBtn.jump{ animation:frogLeap .55s cubic-bezier(.34,1.6,.5,1); }
  @keyframes frogLeap{ 0%{transform:translateY(0)} 45%{transform:translateY(-36px) rotate(-8deg)} 100%{transform:translateY(0)} }

  #duckBtn{
    left:clamp(14px, 5vw, 56px);
    top:28%;
    width:clamp(84px, 11vw, 112px);
    height:clamp(64px, 8.5vw, 84px);
    animation:duckCruise 14s ease-in-out infinite alternate;
  }
  @keyframes duckCruise{ from{ transform:translateX(0); } to{ transform:translateX(44px); } }
  #duckBtn.splashy{ animation:duckSplash .42s ease-in-out 2; }
  @keyframes duckSplash{ 0%,100%{transform:rotate(0)} 35%{transform:rotate(-11deg) translateY(-6px)} 70%{transform:rotate(9deg)} }

  .dfly-btn{
    width:64px;
    height:64px;
    z-index:9;
    animation:dflyHover 6.4s ease-in-out infinite alternate;
  }
  @keyframes dflyHover{
    0%{ transform:translate(0,0) rotate(-4deg); }
    50%{ transform:translate(22px,-16px) rotate(6deg); }
    100%{ transform:translate(-14px,-6px) rotate(-3deg); }
  }
  .dfly-btn.loop{ animation:dflyLoop .7s ease-in-out 1; }
  @keyframes dflyLoop{ from{transform:rotate(0)} to{transform:rotate(360deg) translateY(-16px)} }

  /* ================= SWIMMING LETTER FISH ================= */
  #fishLayer{
    position:absolute;
    inset:0;
    z-index:9;
    pointer-events:none;
  }
  .fish-btn{
    position:absolute;
    border:none;
    background:none;
    padding:4px;
    cursor:pointer;
    pointer-events:auto;
    width:clamp(124px, 19vw, 194px);
    min-width:116px;
    min-height:84px;
    transform:translate(-50%,-50%);
    transition:left .42s cubic-bezier(.3,1.25,.5,1), top .42s cubic-bezier(.3,1.25,.5,1);
    will-change:transform, left, top;
  }
  .fish-btn .swim-body{
    display:block;
    width:100%;
    animation:fishBob 2.3s ease-in-out infinite alternate;
  }
  @keyframes fishBob{
    from{ transform:translate(-10px,-5px) rotate(-3deg); }
    to{ transform:translate(10px,6px) rotate(3deg); }
  }
  .fish-btn svg{
    width:100%;
    height:auto;
    display:block;
    filter:drop-shadow(0 10px 12px rgba(7,48,79,.34));
  }
  .fish-btn .tail-fin{
    transform-box:fill-box;
    transform-origin:15% 50%;
    animation:tailWag .55s ease-in-out infinite alternate;
  }
  @keyframes tailWag{
    from{ transform:scaleX(1) rotate(-7deg); }
    to{ transform:scaleX(.86) rotate(8deg); }
  }
  .fish-btn.flip-r .swim-body svg{ transform:scaleX(-1); }
  .fish-btn.flip-r .letter-g{ transform:scaleX(-1); transform-box:fill-box; transform-origin:center; }

  .fish-btn.golden svg{
    filter:drop-shadow(0 0 16px rgba(255,214,66,.95)) drop-shadow(0 8px 12px rgba(7,48,79,.32));
  }
  .fish-btn.golden .swim-body{ animation-duration:1.5s; }
  .fish-sparkles{
    position:absolute;
    inset:-10px;
    pointer-events:none;
    display:flex;
    justify-content:space-between;
    font-size:20px;
    animation:sparklePop .85s ease-in-out infinite alternate;
  }
  @keyframes sparklePop{ from{opacity:.45;transform:scale(.9)} to{opacity:1;transform:scale(1.15)} }

  .fish-btn.hint-glow::before{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:5px solid #ffe066;
    box-shadow:0 0 22px rgba(255,224,102,.95), inset 0 0 14px rgba(255,224,102,.65);
    animation:hintRing 1.1s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes hintRing{
    0%,100%{ transform:scale(.92); opacity:.7; }
    50%{ transform:scale(1.08); opacity:1; }
  }

  .fish-btn.hooked{
    z-index:13;
  }
  .fish-btn.hooked .swim-body{
    animation:hookedWiggle .24s ease-in-out infinite alternate;
  }
  @keyframes hookedWiggle{
    from{ transform:rotate(-10deg) translateY(-4px); }
    to{ transform:rotate(10deg) translateY(5px); }
  }

  .fish-btn.boing-away{
    pointer-events:none;
    animation:fishDive .52s ease-in forwards;
  }
  @keyframes fishDive{
    0%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    30%{ transform:translate(-50%,-50%) scale(1.16,.84); opacity:1; }
    100%{ transform:translate(-50%,-50%) translateY(140px) scale(.65) rotate(14deg); opacity:0; }
  }

  /* ================= HOOT'S WOODEN ROWBOAT + BUCKET + WANTED BUOY ================= */
  #boatStage{
    position:absolute;
    left:clamp(6px, 2.2vw, 34px);
    bottom:max(4px, env(safe-area-inset-bottom));
    z-index:12;
    display:flex;
    align-items:flex-end;
    gap:10px;
    pointer-events:none;
  }
  #boatWrap{
    position:relative;
    width:clamp(210px, 31vw, 326px);
    pointer-events:auto;
    animation:boatRock 3.6s ease-in-out infinite;
    transform-origin:50% 85%;
  }
  @keyframes boatRock{
    0%,100%{ transform:translateY(0) rotate(-1.6deg); }
    50%{ transform:translateY(-6px) rotate(1.6deg); }
  }
  #boatWrap.celebrate{ animation:boatHop .52s cubic-bezier(.34,1.6,.5,1) 3; }
  @keyframes boatHop{
    0%,100%{ transform:translateY(0) rotate(0); }
    45%{ transform:translateY(-18px) rotate(-3deg); }
  }
  #hootBoatBtn{
    position:relative;
    display:block;
    width:100%;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    filter:drop-shadow(0 12px 16px rgba(9,45,78,.36));
  }
  #hootBoatBtn svg{ width:100%; height:auto; display:block; overflow:visible; }
  #hootBoatBtn .hoot-eyes{ transform-box:fill-box; transform-origin:center; animation:eyeBlink 4.8s infinite; }
  @keyframes eyeBlink{ 0%,92%,100%{transform:scaleY(1)} 95%,97%{transform:scaleY(.08)} }
  #hootBoatBtn.talking .hoot-head{ animation:talkBob .22s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:50% 80%; }
  @keyframes talkBob{ from{transform:translateY(0) rotate(-1.5deg)} to{transform:translateY(-4px) rotate(1.8deg)} }
  #hootBoatBtn.talking .hoot-beak{ animation:beakTalk .18s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:50% 20%; }
  @keyframes beakTalk{ from{transform:scaleY(1)} to{transform:scaleY(1.24)} }
  #hootBoatBtn.shake .hoot-head{ animation:headShake .4s ease-in-out 2; transform-box:fill-box; transform-origin:50% 80%; }
  @keyframes headShake{ 0%,100%{transform:rotate(0)} 30%{transform:rotate(-7deg)} 70%{transform:rotate(7deg)} }

  /* Wooden Bucket button right beside/in front of boat bow */
  #bucketBtn{
    position:relative;
    width:clamp(88px, 13vw, 126px);
    min-width:78px;
    min-height:78px;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    pointer-events:auto;
    margin-bottom:8px;
    margin-left:-24px;
    filter:drop-shadow(0 8px 12px rgba(9,45,78,.3));
    transition:transform .16s cubic-bezier(.34,1.6,.5,1);
  }
  #bucketBtn:active{ transform:scale(.92); }
  #bucketBtn.bounce{ animation:bucketBounce .5s cubic-bezier(.34,1.8,.5,1); }
  @keyframes bucketBounce{ 0%{transform:scale(1)} 40%{transform:scale(1.16,.88)} 100%{transform:scale(1)} }
  #bucketBtn svg{ width:100%; height:auto; display:block; overflow:visible; }
  #bucketChips{
    position:absolute;
    left:50%;
    top:-16px;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
    justify-content:center;
    flex-wrap:wrap;
    width:136px;
    pointer-events:none;
  }
  .b-chip{
    width:30px;
    height:30px;
    border-radius:50%;
    background:linear-gradient(180deg,#ffe578,#ffb703);
    border:3px solid #fff;
    box-shadow:0 3px 0 #c98600, 0 4px 8px rgba(0,0,0,.22);
    display:grid;
    place-items:center;
    font-weight:700;
    font-size:16px;
    color:var(--ink);
    transition:transform .18s;
  }
  .b-chip.reading{
    transform:scale(1.38) translateY(-6px);
    outline:3px solid var(--coral);
    background:#fff;
  }

  /* Wanted-Letter Floating Buoy Bubble right above Hoot's boat */
  #wantedBuoy{
    position:absolute;
    left:10px;
    top:-86px;
    z-index:15;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px 8px 10px;
    border-radius:26px;
    border:4px solid #fff;
    background:rgba(255,253,247,.97);
    box-shadow:0 6px 0 rgba(20,66,105,.22), 0 12px 24px rgba(20,66,105,.22);
    cursor:pointer;
    pointer-events:auto;
    min-height:74px;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1);
  }
  #wantedBuoy::after{
    content:"";
    position:absolute;
    left:34px;
    bottom:-13px;
    width:20px;
    height:20px;
    background:rgba(255,253,247,.97);
    border-right:4px solid #fff;
    border-bottom:4px solid #fff;
    transform:rotate(45deg);
    border-radius:3px;
  }
  #wantedBuoy:active{ transform:scale(.94); }
  #wantedBuoy.pop{ animation:buoyPop .52s cubic-bezier(.34,1.7,.5,1); }
  @keyframes buoyPop{ 0%{transform:scale(.6) rotate(-8deg)} 100%{transform:scale(1) rotate(0)} }

  #targetLetter{
    width:58px;
    height:58px;
    border-radius:18px;
    background:linear-gradient(180deg,#e0f7ff,#bcebff);
    border:3.5px dashed #1b98c6;
    display:grid;
    place-items:center;
    font-size:40px;
    font-weight:700;
    line-height:1;
    color:#0e5e8a;
  }
  #targetCue{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  #targetEmoji{
    font-size:32px;
    line-height:1;
  }
  #progressDots{
    display:flex;
    gap:5px;
  }
  #progressDots i{
    width:11px;
    height:11px;
    border-radius:50%;
    background:#cbe6f5;
    border:2px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
    display:block;
    transition:transform .25s, background .25s;
  }
  #progressDots i.on{
    background:var(--sun);
    transform:scale(1.25);
  }
  #buoySpeak{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#ffe473;
    border:3px solid #fff;
    box-shadow:0 3px 0 #d99400;
    display:grid;
    place-items:center;
    font-size:22px;
  }

  /* ================= FISHING ROD, LINE & BOBBER SVG ================= */
  #rodSvg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:13;
    pointer-events:none;
    overflow:visible;
  }

  /* ================= CHUNKY GOLDEN REEL CRANK (HOOKED PHASE) ================= */
  #reelPad{
    position:absolute;
    right:max(18px, env(safe-area-inset-right));
    bottom:max(18px, env(safe-area-inset-bottom));
    z-index:18;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  #reelPad.show{
    display:flex;
    animation:reelIn .35s cubic-bezier(.34,1.6,.5,1);
  }
  @keyframes reelIn{ from{transform:scale(.4) translateY(30px); opacity:0} to{transform:scale(1) translateY(0); opacity:1} }

  #reelWheel{
    position:relative;
    width:clamp(108px, 16vw, 134px);
    height:clamp(108px, 16vw, 134px);
    border-radius:50%;
    border:6px solid #fff;
    background:radial-gradient(circle at 32% 30%, #fff3a6 0%, #ffd140 52%, #e09600 100%);
    box-shadow:0 8px 0 #9b6100, 0 0 0 5px #17324f, 0 18px 34px rgba(8,40,70,.38);
    cursor:pointer;
    touch-action:none;
    animation:reelGlow .75s ease-in-out infinite alternate;
  }
  @keyframes reelGlow{
    from{ box-shadow:0 8px 0 #9b6100, 0 0 0 5px #17324f, 0 0 0 10px rgba(255,224,102,.18); }
    to{ box-shadow:0 8px 0 #9b6100, 0 0 0 5px #17324f, 0 0 0 22px rgba(255,224,102,.52); }
  }
  #reelWheel:active{ transform:scale(.95); }
  #reelCrank{
    position:absolute;
    inset:0;
    transition:transform .34s cubic-bezier(.25,1.45,.45,1);
  }
  #reelCrank .hub{
    position:absolute;
    left:50%;
    top:50%;
    width:26px;
    height:26px;
    margin:-13px 0 0 -13px;
    border-radius:50%;
    background:#7a4b1b;
    border:3px solid #fff;
  }
  #reelCrank .arm{
    position:absolute;
    left:50%;
    top:50%;
    width:46%;
    height:10px;
    margin-top:-5px;
    border-radius:6px;
    background:#7a4b1b;
    transform-origin:0 50%;
  }
  #reelCrank .knob{
    position:absolute;
    right:-6px;
    top:50%;
    width:30px;
    height:30px;
    margin-top:-15px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff8578, #e6392f 65%, #b21f18);
    border:3.5px solid #fff;
    box-shadow:0 4px 8px rgba(0,0,0,.3);
  }
  #reelSteps{
    display:flex;
    gap:7px;
    background:rgba(255,253,247,.95);
    border:3px solid #fff;
    border-radius:999px;
    padding:5px 12px;
    box-shadow:0 4px 0 rgba(20,66,105,.2);
  }
  #reelSteps i{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#cde6f5;
    display:block;
    transition:background .2s, transform .25s;
  }
  #reelSteps i.on{
    background:var(--leaf);
    transform:scale(1.22);
  }
  #reelHand{
    position:absolute;
    right:-8px;
    top:-26px;
    font-size:34px;
    pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.28));
    animation:handBounce .65s ease-in-out infinite alternate;
  }
  @keyframes handBounce{ from{transform:translateY(0) rotate(-12deg)} to{transform:translateY(-10px) rotate(6deg)} }

  /* ================= PICTURE-ONLY CATCH CELEBRATION BUBBLE ================= */
  #catchModal{
    position:absolute;
    inset:0;
    z-index:25;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(14,58,92,.28);
    padding:16px;
  }
  #catchModal[hidden]{ display:none; }
  #catchCard{
    background:var(--cream);
    border:6px solid #fff;
    border-radius:34px;
    box-shadow:0 12px 0 rgba(16,64,104,.24), 0 24px 48px rgba(8,40,70,.35);
    padding:20px 26px 18px;
    text-align:center;
    width:min(88vw, 350px);
    animation:cardPop .42s cubic-bezier(.34,1.65,.5,1);
  }
  @keyframes cardPop{ from{transform:scale(.55) translateY(28px); opacity:0} to{transform:scale(1) translateY(0); opacity:1} }
  #catchVisual{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-bottom:14px;
  }
  #catchFishBox{
    width:138px;
    animation:catchWiggle 1s ease-in-out infinite alternate;
  }
  #catchFishBox svg{ width:100%; height:auto; display:block; filter:drop-shadow(0 8px 10px rgba(8,45,80,.26)); }
  @keyframes catchWiggle{ from{transform:rotate(-5deg) scale(1)} to{transform:rotate(5deg) scale(1.06)} }
  #catchBadge{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  #catchLetterBig{
    font-size:64px;
    font-weight:700;
    line-height:.95;
    color:#0e6a9c;
    text-shadow:0 3px 0 #bfe8ff;
  }
  #catchEmojiBig{
    font-size:52px;
    line-height:1;
  }
  #catchBtns{
    display:flex;
    justify-content:center;
    gap:14px;
  }
  .catch-act{
    min-width:74px;
    min-height:74px;
    border-radius:999px;
    border:4px solid #fff;
    cursor:pointer;
    font-size:32px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0 24px;
    transition:transform .12s;
  }
  .catch-act:active{ transform:translateY(3px) scale(.94); }
  #catchHearBtn{
    background:linear-gradient(180deg,#ffe473,#ffb703);
    box-shadow:0 6px 0 #c98600;
  }
  #catchNextBtn{
    background:linear-gradient(180deg,#6ce078,#40b84f);
    color:#fff;
    box-shadow:0 6px 0 #268432;
    min-width:118px;
  }

  /* ================= WIN OVERLAY (PICTURE-FIRST CELEBRATION) ================= */
  #winOverlay{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(14,58,92,.44);
    padding:16px;
  }
  #winOverlay[hidden]{ display:none; }
  #winCard{
    background:var(--cream);
    border:6px solid #fff;
    border-radius:36px;
    box-shadow:0 14px 0 rgba(16,64,104,.24), 0 28px 54px rgba(8,40,70,.42);
    padding:24px 26px 22px;
    text-align:center;
    width:min(90vw, 410px);
    animation:cardPop .48s cubic-bezier(.34,1.6,.5,1);
  }
  #winStars{
    font-size:40px;
    letter-spacing:6px;
    color:#d0e6f4;
  }
  #winStars .lit{
    color:var(--sun);
    text-shadow:0 3px 0 #d99400;
  }
  #winTrophy{
    font-size:58px;
    margin:6px 0;
    animation:trophyHop 1.1s ease-in-out infinite alternate;
  }
  @keyframes trophyHop{ from{transform:scale(1) rotate(-4deg)} to{transform:scale(1.1) rotate(4deg)} }
  #winChips{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:14px 0 20px;
  }
  #winChips .b-chip{
    width:52px;
    height:52px;
    font-size:28px;
  }
  #againBtn{
    min-width:168px;
    min-height:74px;
    border-radius:999px;
    border:4px solid #fff;
    background:linear-gradient(180deg,#6ce078,#40b84f);
    color:#fff;
    font-family:"Fredoka",sans-serif;
    font-size:32px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 7px 0 #268432, 0 14px 28px rgba(38,132,50,.35);
    transition:transform .12s;
  }
  #againBtn:active{ transform:translateY(4px) scale(.96); }

  /* ================= PARTICLES, RIPPLES, FLYING FISH ================= */
  .ripple{
    position:absolute;
    z-index:8;
    border:4px solid rgba(255,255,255,.8);
    border-radius:50%;
    pointer-events:none;
    animation:rippleOut .85s ease-out forwards;
  }
  @keyframes rippleOut{
    from{ transform:translate(-50%,-50%) scale(.22); opacity:.95; }
    to{ transform:translate(-50%,-50%) scale(1.8); opacity:0; }
  }
  .droplet{
    position:absolute;
    z-index:15;
    width:10px;
    height:14px;
    border-radius:50% 50% 60% 60%;
    background:#dff6ff;
    border:1.5px solid #fff;
    pointer-events:none;
  }
  .fly-fish{
    position:absolute;
    z-index:26;
    width:96px;
    pointer-events:none;
  }
  .fly-fish svg{ width:100%; height:auto; display:block; }
  .confetti{
    position:absolute;
    z-index:32;
    width:12px;
    height:16px;
    border-radius:3px;
    pointer-events:none;
  }

  /* ================= PORTRAIT PHONE RESPONSIVE (390x844 etc.) ================= */
  @media (max-width:600px){
    #sunBtn{ right:86px; width:62px; height:62px; }
    .hud-pill{ min-width:58px; min-height:58px; padding:0 12px; font-size:24px; }
    .hud-round{ width:58px; height:58px; min-width:58px; min-height:58px; }
    #starBank{ min-height:58px; padding:0 14px 0 10px; font-size:22px; }
    #boatStage{ left:6px; bottom:max(6px, env(safe-area-inset-bottom)); }
    #boatWrap{ width:min(52vw, 212px); }
    #wantedBuoy{ top:-94px; left:6px; padding:6px 10px 6px 8px; min-height:64px; gap:6px; }
    #targetLetter{ width:48px; height:48px; font-size:32px; }
    #targetEmoji{ font-size:24px; }
    #buoySpeak{ width:40px; height:40px; font-size:18px; }
    #bucketBtn{ width:80px; margin-left:-16px; }
    #bucketChips{ width:112px; top:-14px; }
    .b-chip{ width:26px; height:26px; font-size:14px; }
    .fish-btn{ width:clamp(116px, 34vw, 146px); }
    #frogBtn{ right:8px; top:25%; width:72px; height:60px; }
    #duckBtn{ left:8px; top:24%; width:78px; height:58px; }
    #reelPad{ right:12px; bottom:max(14px, env(safe-area-inset-bottom)); }
    #reelWheel{ width:104px; height:104px; }
  }
  @media (max-height:520px){
    #boatWrap{ width:clamp(176px, 34vh, 220px); }
    #wantedBuoy{ top:-70px; min-height:60px; padding:5px 10px 5px 7px; }
    #targetLetter{ width:46px; height:46px; font-size:32px; }
    .fish-btn{ width:clamp(108px, 26vh, 142px); }
    #reelWheel{ width:94px; height:94px; }
  }
  @media (prefers-reduced-motion:reduce){
    .cloud-btn, #boatWrap, .fish-btn .swim-body, .fish-btn .tail-fin, .reed-btn, #duckBtn, .dfly-btn{ animation:none !important; }
  }
</style>
</head>
<body>
<div id="stage">
  <!-- Scenic storybook hills, trees & shoreline -->
  <svg id="backdropSvg" viewBox="0 0 1200 760" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8be068"/>
        <stop offset="100%" stop-color="#53b349"/>
      </linearGradient>
      <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#69cf58"/>
        <stop offset="100%" stop-color="#3f9a44"/>
      </linearGradient>
    </defs>
    <!-- Soft distant meadow hills along horizon (y ~ 210) -->
    <path d="M0 218 Q180 142 390 198 T820 184 T1200 205 L1200 245 L0 245 Z" fill="url(#hillBack)"/>
    <path d="M0 226 Q250 176 520 212 T1020 196 L1200 214 L1200 248 L0 248 Z" fill="url(#hillFront)"/>
    <!-- Soft sandy/grassy waterline edge -->
    <path d="M0 214 Q300 206 600 214 T1200 212 L1200 224 Q900 230 600 222 T0 224 Z" fill="#9ae8f5" opacity=".75"/>
  </svg>

  <!-- Crisp unstretched foreground lily pad -->
  <svg style="position:absolute;right:12%;bottom:14%;width:92px;height:44px;z-index:3;pointer-events:none;opacity:.92" viewBox="0 0 110 52" aria-hidden="true">
    <ellipse cx="55" cy="30" rx="48" ry="18" fill="#35a644"/>
    <path d="M55 30 L10 22 L12 38 Z" fill="#1877aa"/>
    <circle cx="68" cy="21" r="10.5" fill="#ff8fb6"/>
    <circle cx="68" cy="21" r="4.2" fill="#ffd94a"/>
  </svg>

  <!-- Living sky props -->
  <button class="decor" id="sunBtn" type="button" aria-label="Smiling Sun">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g class="rays" stroke="#ffbe0b" stroke-width="6.5" stroke-linecap="round">
        <path d="M50 3v13M50 84v13M3 50h13M84 50h13M16 16l9 9M75 75l9 9M84 16l-9 9M25 75l-9 9"/>
      </g>
      <circle cx="50" cy="50" r="27" fill="#ffd447" stroke="#f0a202" stroke-width="3.5"/>
      <circle cx="41" cy="46" r="3.6" fill="#17324f"/>
      <circle cx="59" cy="46" r="3.6" fill="#17324f"/>
      <path d="M40 58 Q50 66 60 58" stroke="#17324f" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <circle cx="34" cy="55" r="4.5" fill="#ff9e8a" opacity=".8"/>
      <circle cx="66" cy="55" r="4.5" fill="#ff9e8a" opacity=".8"/>
    </svg>
  </button>
  <button class="decor cloud-btn" type="button" style="top:6%;animation-duration:72s;animation-delay:-22s" aria-label="Fluffy Cloud">
    <svg viewBox="0 0 120 56" aria-hidden="true"><ellipse cx="38" cy="39" rx="30" ry="14" fill="#fff"/><ellipse cx="66" cy="28" rx="28" ry="20" fill="#fff"/><ellipse cx="92" cy="40" rx="23" ry="13" fill="#fff"/></svg>
  </button>
  <button class="decor cloud-btn" type="button" style="top:13%;animation-duration:96s;animation-delay:-64s;width:90px" aria-label="Fluffy Cloud">
    <svg viewBox="0 0 120 56" aria-hidden="true"><ellipse cx="38" cy="39" rx="30" ry="14" fill="#fff"/><ellipse cx="66" cy="28" rx="28" ry="20" fill="#fff"/><ellipse cx="92" cy="40" rx="23" ry="13" fill="#fff"/></svg>
  </button>

  <!-- Shimmering water layer -->
  <div class="water-shimmer" aria-hidden="true">
    <svg class="wave-line" style="top:5%" viewBox="0 0 400 24" preserveAspectRatio="none"><path d="M0 12 Q25 3 50 12 T100 12 T150 12 T200 12 T250 12 T300 12 T350 12 T400 12" stroke="#fff" stroke-width="3.2" fill="none"/></svg>
    <svg class="wave-line" style="top:34%;animation-delay:-2.2s" viewBox="0 0 400 24" preserveAspectRatio="none"><path d="M0 12 Q25 3 50 12 T100 12 T150 12 T200 12 T250 12 T300 12 T350 12 T400 12" stroke="#fff" stroke-width="2.8" fill="none"/></svg>
    <svg class="wave-line" style="top:66%;animation-delay:-4.1s" viewBox="0 0 400 24" preserveAspectRatio="none"><path d="M0 12 Q25 3 50 12 T100 12 T150 12 T200 12 T250 12 T300 12 T350 12 T400 12" stroke="#fff" stroke-width="2.6" fill="none"/></svg>
    <div class="caustic" style="left:22%;top:22%;width:120px;height:44px"></div>
    <div class="caustic" style="left:64%;top:18%;width:140px;height:48px;animation-delay:-1.4s"></div>
    <div class="caustic" style="left:48%;top:54%;width:160px;height:52px;animation-delay:-2.5s"></div>
  </div>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-group">
      <button class="hud-pill mode-btn active" id="modeQuestBtn" type="button" aria-label="Letter Quest Mode" aria-pressed="true">🎣</button>
      <button class="hud-pill mode-btn" id="modeFreeBtn" type="button" aria-label="Free Fishing Mode" aria-pressed="false">🐠</button>
      <button class="hud-pill hud-round" id="soundBtn" type="button" aria-label="Toggle Sound">🔊</button>
    </div>
    <div id="starBank" aria-label="Stars collected">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4l3 6 6.6.9-4.8 4.6 1.1 6.6L12 17.4l-5.9 3.1 1.1-6.6-4.8-4.6 6.6-.9z" fill="#ffc93c" stroke="#d99400" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span id="starCount">0</span>
    </div>
  </div>

  <!-- Interactive Pond -->
  <div id="pond">
    <!-- Pond friends -->
    <button class="pond-critter" id="frogBtn" type="button" aria-label="Freddy the Frog">
      <svg viewBox="0 0 92 74" aria-hidden="true">
        <ellipse cx="46" cy="58" rx="40" ry="14" fill="#35a644"/>
        <ellipse cx="46" cy="46" rx="28" ry="17" fill="#5fd15f" stroke="#226b2a" stroke-width="3"/>
        <circle cx="30" cy="24" r="11" fill="#5fd15f" stroke="#226b2a" stroke-width="3"/>
        <circle cx="62" cy="24" r="11" fill="#5fd15f" stroke="#226b2a" stroke-width="3"/>
        <circle cx="30" cy="24" r="6.5" fill="#fff"/><circle cx="62" cy="24" r="6.5" fill="#fff"/>
        <circle cx="31" cy="24" r="3.6" fill="#17324f"/><circle cx="63" cy="24" r="3.6" fill="#17324f"/>
        <path d="M31 48 Q46 57 61 48" stroke="#1e6126" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        <circle cx="22" cy="43" r="4.5" fill="#ff9e8a" opacity=".85"/>
        <circle cx="70" cy="43" r="4.5" fill="#ff9e8a" opacity=".85"/>
      </svg>
    </button>

    <button class="pond-critter" id="duckBtn" type="button" aria-label="Daisy the Duck">
      <svg viewBox="0 0 100 68" aria-hidden="true">
        <path d="M8 58 Q28 51 48 58 T88 58" stroke="#c8f2ff" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="44" cy="40" rx="31" ry="18" fill="#fffdf7" stroke="#264b6e" stroke-width="3"/>
        <path d="M16 34 Q4 22 12 15 Q22 21 26 32 Z" fill="#f3f5f7" stroke="#264b6e" stroke-width="2.5"/>
        <circle cx="72" cy="23" r="13.5" fill="#fffdf7" stroke="#264b6e" stroke-width="3"/>
        <path d="M84 21 L97 25 L84 30 Z" fill="#ff9f1c" stroke="#c46a00" stroke-width="2"/>
        <circle cx="75" cy="20" r="2.8" fill="#17324f"/>
        <path d="M31 36 Q46 28 59 36 Q46 43 31 36 Z" fill="#ffe066" stroke="#d99400" stroke-width="2"/>
      </svg>
    </button>

    <button class="pond-critter dfly-btn" id="dfly1" type="button" style="left:42%;top:22%" aria-label="Blue Dragonfly">
      <svg viewBox="0 0 64 48" aria-hidden="true">
        <ellipse cx="18" cy="14" rx="14" ry="5.5" fill="#d3f4ff" stroke="#14919b" stroke-width="1.8" transform="rotate(-22 18 14)"/>
        <ellipse cx="46" cy="14" rx="14" ry="5.5" fill="#d3f4ff" stroke="#14919b" stroke-width="1.8" transform="rotate(22 46 14)"/>
        <ellipse cx="32" cy="28" rx="3.8" ry="15" fill="#14b8a6" stroke="#0d6e66" stroke-width="1.8"/>
        <circle cx="32" cy="11" r="5.5" fill="#0e9594" stroke="#0d6e66" stroke-width="1.8"/>
        <circle cx="29.5" cy="10" r="1.8" fill="#fff"/><circle cx="34.5" cy="10" r="1.8" fill="#fff"/>
      </svg>
    </button>

    <button class="pond-critter dfly-btn" id="dfly2" type="button" style="right:28%;top:25%;animation-delay:-3s" aria-label="Pink Dragonfly">
      <svg viewBox="0 0 64 48" aria-hidden="true">
        <ellipse cx="18" cy="14" rx="14" ry="5.5" fill="#ffe4f2" stroke="#d64579" stroke-width="1.8" transform="rotate(-22 18 14)"/>
        <ellipse cx="46" cy="14" rx="14" ry="5.5" fill="#ffe4f2" stroke="#d64579" stroke-width="1.8" transform="rotate(22 46 14)"/>
        <ellipse cx="32" cy="28" rx="3.8" ry="15" fill="#ff75a0" stroke="#b83260" stroke-width="1.8"/>
        <circle cx="32" cy="11" r="5.5" fill="#e85284" stroke="#b83260" stroke-width="1.8"/>
        <circle cx="29.5" cy="10" r="1.8" fill="#fff"/><circle cx="34.5" cy="10" r="1.8" fill="#fff"/>
      </svg>
    </button>

    <!-- Shoreline reeds -->
    <button class="reed-btn" type="button" style="left:-6px" aria-label="Cattails">
      <svg viewBox="0 0 64 126" aria-hidden="true">
        <path d="M18 126 Q14 70 12 28 M32 126 Q32 58 35 14 M46 126 Q50 74 53 36" stroke="#2f9e44" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect x="6" y="10" width="11" height="28" rx="5.5" fill="#7c4a21" stroke="#4a290f" stroke-width="2"/>
        <rect x="29" y="2" width="11" height="30" rx="5.5" fill="#9a5f2c" stroke="#4a290f" stroke-width="2"/>
      </svg>
    </button>
    <button class="reed-btn" type="button" style="right:-6px;animation-delay:-1.9s" aria-label="Cattails">
      <svg viewBox="0 0 64 126" aria-hidden="true">
        <path d="M18 126 Q14 70 12 34 M32 126 Q32 58 30 14 M48 126 Q50 74 52 28" stroke="#2f9e44" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect x="24" y="2" width="11" height="30" rx="5.5" fill="#7c4a21" stroke="#4a290f" stroke-width="2"/>
        <rect x="46" y="10" width="11" height="28" rx="5.5" fill="#9a5f2c" stroke="#4a290f" stroke-width="2"/>
      </svg>
    </button>

    <!-- Swimming Letter Fish -->
    <div id="fishLayer"></div>

    <!-- Dynamic Bamboo Rod, Fishing Line & Red/White Bobber -->
    <svg id="rodSvg" aria-hidden="true">
      <path id="rodShadow" d="" stroke="rgba(10,44,74,.28)" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path id="rodPath" d="" stroke="#8f5422" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path id="rodHi" d="" stroke="#cf8a48" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path id="linePath" d="" stroke="#fffdf7" stroke-width="2.8" fill="none" stroke-linecap="round" opacity="0"/>
      <g id="bobberG" opacity="0">
        <ellipse cx="0" cy="8" rx="14" ry="5" fill="rgba(255,255,255,.55)"/>
        <circle cx="0" cy="0" r="10.5" fill="#ffffff" stroke="#17324f" stroke-width="2.5"/>
        <path d="M-10.5 0 A10.5 10.5 0 0 1 10.5 0 Z" fill="#ef4444" stroke="#17324f" stroke-width="2.5"/>
        <line x1="0" y1="-10.5" x2="0" y2="-16" stroke="#17324f" stroke-width="2.6" stroke-linecap="round"/>
      </g>
    </svg>

    <!-- Hoot in Wooden Rowboat + Wanted Buoy + Catch Bucket -->

      <div id="boatWrap">
        <!-- Wanted Letter Buoy -->
        <button id="wantedBuoy" type="button" aria-label="Hear Hoot call the letter">
          <div id="targetLetter">B</div>
          <div id="targetCue">
            <span id="targetEmoji" aria-hidden="true">🎈</span>
            <div id="progressDots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <span id="buoySpeak" aria-hidden="true">🔊</span>

        <!-- Hoot wearing Straw Sun Hat in Wooden Rowboat -->

            <!-- Little glowing lantern at boat stern -->

              <path d="M12 10 Q18 2 24 10" stroke="#364152" stroke-width="3" fill="none"/>
              <rect x="8" y="10" width="20" height="24" rx="5" fill="#ffe680" stroke="#364152" stroke-width="3"/>
              <ellipse cx="18" cy="23" rx="5" ry="7" fill="#fff8cc"/>
              <rect x="5" y="32" width="26" height="6" rx="3" fill="#475569" stroke="#1e293b" stroke-width="2.5"/>
            </g>

            <!-- Hoot sitting inside the boat -->

              <!-- Body -->

              <ellipse cx="76" cy="126" rx="34" ry="34" fill="#fdecd2"/>
              <path d="M62 118 q7 6 14 0 M78 118 q7 6 14 0 M70 132 q7 6 14 0" stroke="#d9b485" stroke-width="3" fill="none" stroke-linecap="round"/>
              <!-- Wings -->
              <ellipse cx="30" cy="118" rx="16" ry="30" fill="#8b5226" stroke="#4a2810" stroke-width="3.5" transform="rotate(14 30 118)"/>
              <ellipse cx="122" cy="116" rx="16" ry="30" fill="#8b5226" stroke="#4a2810" stroke-width="3.5" transform="rotate(-18 122 116)"/>
              <!-- Head group -->
              <g class="hoot-head">
                <circle cx="76" cy="70" r="44" fill="#a26636" stroke="#4a2810" stroke-width="4"/>
                <!-- Ear tufts peeking below hat -->
                <path d="M36 48 Q24 28 45 35 Z" fill="#8b5226" stroke="#4a2810" stroke-width="3"/>
                <path d="M116 48 Q128 28 107 35 Z" fill="#8b5226" stroke="#4a2810" stroke-width="3"/>
                <!-- Heart face mask -->
                <ellipse cx="58" cy="72" rx="20" ry="22" fill="#fdecd2"/>
                <ellipse cx="94" cy="72" rx="20" ry="22" fill="#fdecd2"/>
                <!-- Big expressive eyes -->
                <g class="hoot-eyes">
                  <circle cx="58" cy="71" r="10.5" fill="#2b190d"/>
                  <circle cx="94" cy="71" r="10.5" fill="#2b190d"/>

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t;
    }

    var all=Object.keys(DATA);

      var ln=shuffle((P&&P.__llLettersLearned?P.__llLettersLearned():[])
        .map(function(x){return String(x).toUpperCase();})
        .filter(function(x){return x!==W && all.indexOf(x)>-1;})).slice(0,2);
      var rest=shuffle(all.filter(function(x){return x!==W && ln.indexOf(x)<0;}));
      var out=(all.indexOf(W)>-1?[W]:[]).concat(ln);
      while(out.length<5) out.push(rest.shift());
      return out;
    }catch(e){
      return shuffle(all.slice()).slice(0,5);
    }

  /* ================= SOUND FX (WebAudio) ================= */
  var AC=null;
  function audio(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
    if(AC&&AC.state==="suspended") AC.resume();
    return AC;
  }
  function tone(f0,f1,dur,type,vol,delay){
    if(!soundOn) return;
    var ac=audio(); if(!ac) return;
    var t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.13,t+0.014);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
  }
  function noise(dur,freq,vol,delay){
    if(!soundOn) return;
    var ac=audio(); if(!ac) return;
    var t=ac.currentTime+(delay||0), len=Math.max(1,(dur*ac.sampleRate)|0);
    var buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    var src=ac.createBufferSource(); src.buffer=buf;
    var f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq||1100; f.Q.value=0.9;
    var g=ac.createGain(); g.gain.setValueAtTime(vol||0.14,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t);
  }
  function splashSfx(){ noise(0.3,880,0.18); tone(320,95,0.22,"sine",0.12); }
  function castSfx(){ tone(420,860,0.12,"sine",0.09); noise(0.14,1800,0.08); }
  function crankSfx(){ tone(260,340,0.05,"square",0.07); tone(340,210,0.06,"square",0.06,0.05); noise(0.06,2400,0.06); }

  /* ================= STUDIO HOOT VOICE ENGINE ================= */
  var VBASE="assets/voice/";
  var voiceEl=null, vQueue=[], vPlaying=false, vCurrent=null;

  function hasClip(id){
    try{
      var H=window.parent&&window.parent.HOOT_HAVE;
      if(H) return !!H[id];
    }catch(e){}
    return true;
  }
  function pickClip(primaryId, fallbackFile){
    return hasClip(primaryId) ? (primaryId+".mp3") : fallbackFile;
  }
  function getVoice(){
    if(!voiceEl){
      voiceEl=new Audio(); voiceEl.preload="auto";
      voiceEl.addEventListener("ended",function(){
        var e=voiceEl;
        if(e.__hwT && Date.now()-e.__hwT<350){
          if(!e.paused && !e.ended) return;
          if(!e.__hwRetry){
            e.__hwRetry=1;
            try{ e.currentTime=0; }catch(x){}
            var p=e.play();
            if(p&&p.catch) p.catch(function(){ vNext(); });
            return;
          }
        }
        vNext();
      });
      voiceEl.addEventListener("error",vNext);
    }
    return voiceEl;
  }
  function hubQuiet(){
    try{
      var d=window.parent&&window.parent.document;
      if(!d||d===document) return false;
      var b=d.querySelector('.voice-btn[data-voice="off"]');
      return !!(b&&(b.classList.contains("sel")||b.classList.contains("active")||b.getAttribute("aria-pressed")==="true"));
    }catch(e){ return false; }
  }
  function silenced(){ return !soundOn || hubQuiet(); }
  function hootTalking(on){ hootBoatBtn.classList.toggle("talking",!!on); }
  function vNext(){
    if(!vPlaying){ pumpVoice(); return; }
    vPlaying=false; vCurrent=null; hootTalking(false); pumpVoice();
  }
  function pumpVoice(){
    if(vPlaying||dead) return;
    var item=vQueue.shift(); if(!item) return;
    if(item.onStart){ try{ item.onStart(); }catch(e){} }
    if(silenced()){ pumpVoice(); return; }
    var el=getVoice();
    vPlaying=true; vCurrent=item; hootTalking(true);
    el.__hwT=Date.now(); el.__hwRetry=0;
    el.src=VBASE+item.file;
    var p=el.play();
    if(p&&p.catch) p.catch(function(){ vNext(); });
  }
  function clearVoice(stopCurrent){
    vQueue.length=0;
    if(stopCurrent && voiceEl){
      voiceEl.__hwT=0; voiceEl.__hwRetry=1;
      try{ voiceEl.pause(); }catch(e){}
      vPlaying=false; vCurrent=null; hootTalking(false);
    }
  }
  function enqueue(file,kind,target,onStart){
    if(window.__hwNameFix){ file=window.__hwNameFix(file,kind); }
    if(!file){ if(onStart) try{onStart();}catch(e){} return; }
    vQueue.push({file:file,kind:kind||"",target:target||"",onStart:onStart||null});
    pumpVoice();
  }
  function speakFindLetter(L, isBoot){
    var low=L.toLowerCase();
    var file=pickClip("hoot-fish-find-"+low, "call-letter-"+low+".mp3");
    wantedBuoy.classList.remove("pop"); void wantedBuoy.offsetWidth; wantedBuoy.classList.add("pop");
    if(isBoot){
      try{
        if(window.parent && window.parent!==window && window.parent.__hwPlayAfterIntro && window.parent.__hwPlayAfterIntro(VBASE+file)){
          return;
        }
      }catch(e){}
    }
    clearVoice(true);
    enqueue(file,"callout",L,null);
  }
  function speakCatchPhonics(L,golden){
    var low=L.toLowerCase();
    var teachFile=pickClip("hoot-fish-says-"+low, ("ABCDE".indexOf(L)>-1?"fish-teach-"+low+".mp3":"call-letter-"+low+".mp3"));
    var praiseFile=golden?"hoot-amazing.mp3":PRAISE_CLIPS[praiseIdx%PRAISE_CLIPS.length];
    praiseIdx++;
    if(!hasClip(praiseFile.replace(".mp3",""))) praiseFile="hoot-great-job.mp3";
    clearVoice(true);
    enqueue(teachFile,"teach",L,null);
    enqueue(praiseFile,"praise",L,null);
  }
  function speakWrongAndRemind(T){
    var wFile=WRONG_CLIPS[wrongIdx%WRONG_CLIPS.length];

    enqueue(wFile,"wrong",T,null);
    enqueue(findFile,"callout",T,null);
  }

    if(idleTimer) clearTimeout(idleTimer);

      if(dead || state!=="aim" || mode!=="quest") return;
      if(!vPlaying && !vQueue.length) speakFindLetter(targetLetter);

  function getRodAnchor(){
    var pr=pond.getBoundingClientRect();
    var br=hootBoatBtn.getBoundingClientRect();
    var bx=br.left-pr.left+br.width*0.66;
    var by=br.top-pr.top+br.height*0.56;
    var narrow=pr.width<600;
    var tx=bx+(narrow?Math.min(pr.width*0.38, 152):Math.min(pr.width*0.24, 178));
    var ty=by-(narrow?92:Math.min(pr.height*0.24, 152));
    return { bx:bx, by:by, tx:tx, ty:ty };
  }

  function drawRod(bend){
    var g=getRodAnchor();
    var b=bend||0;
    var tx=g.tx + b*0.35;
    var ty=g.ty + b*0.65;
    var cx=g.bx + (tx-g.bx)*0.56;
    var cy=g.by - 58 + b*0.2;
    var d="M"+g.bx+" "+g.by+" Q "+cx+" "+cy+" "+tx+" "+ty;
    rodPath.setAttribute("d",d);
    rodHi.setAttribute("d",d);
    rodShadow.setAttribute("d","M"+g.bx+" "+(g.by+4)+" Q "+cx+" "+(cy+4)+" "+tx+" "+(ty+4));
    return { tx:tx, ty:ty, bx:g.bx, by:g.by };
  }

  function drawLineTo(x,y,sag,bend){
    var tip=drawRod(bend||0);
    var mx=(tip.tx+x)/2;
    var my=Math.max(tip.ty,y)+(sag==null?26:sag);
    linePath.setAttribute("d","M"+tip.tx+" "+tip.ty+" Q "+mx+" "+my+" "+x+" "+y);
    linePath.setAttribute("opacity","1");
    bobberG.setAttribute("transform","translate("+x+","+y+")");
    bobberG.setAttribute("opacity","1");
  }

  function drawRestingLine(){
    var tip=drawRod(0);
    var pr=pond.getBoundingClientRect();
    var restX=Math.min(pr.width*0.58, tip.tx+54);
    var restY=Math.min(pr.height*0.76, tip.ty+130)+Math.sin(bobberPhase)*4;
    drawLineTo(restX, restY, 16, 0);
  }

  /* Gentle resting bobber loop */
  setInterval(function(){
    if(dead) return;
    bobberPhase+=0.25;
    if(state==="aim") drawRestingLine();
  }, 90);

  /* ================= RIPPLES, DROPLETS & CONFETTI ================= */
  function spawnRipple(x,y,big){
    var r=document.createElement("div");
    r.className="ripple";
    var w=big?96:54;
    r.style.width=w+"px";
    r.style.height=(w*0.42)+"px";
    r.style.left=x+"px";
    r.style.top=y+"px";
    pond.appendChild(r);
    setTimeout(function(){ r.remove(); },880);
  }

  function spawnDroplets(x,y,count){
    for(var i=0;i<(count||10);i++){
      var d=document.createElement("div");
      d.className="droplet";
      d.style.left=x+"px";
      d.style.top=y+"px";
      pond.appendChild(d);
      var dx=(Math.random()-0.5)*110;
      var up=-(36+Math.random()*58);
      if(d.animate){
        d.animate([
          {transform:"translate(0,0) scale(1)", opacity:1},
          {transform:"translate("+(dx*0.55)+"px,"+up+"px) scale(1.1)", opacity:1, offset:0.45},
          {transform:"translate("+dx+"px,34px) scale(.6)", opacity:0}
        ],{duration:640+Math.random()*220, easing:"cubic-bezier(.2,.7,.3,1)"});
      }
      (function(el){ setTimeout(function(){ el.remove(); },900); })(d);
    }
  }

  function spawnConfetti(n){
    var sr=stage.getBoundingClientRect();
    var cols=["#ff6b5e","#ffc93c","#4ec961","#3da5e8","#b48aff","#ff75a0"];
    for(var i=0;i<(n||32);i++){
      var c=document.createElement("div");
      c.className="confetti";
      c.style.background=cols[i%cols.length];
      c.style.left=(sr.width*0.5)+"px";
      c.style.top=(sr.height*0.32)+"px";
      stage.appendChild(c);
      var dx=(Math.random()-0.5)*sr.width*0.86;
      var dy=140+Math.random()*sr.height*0.45;
      var rot=(Math.random()*2-1)*380;
      if(c.animate){
        c.animate([
          {transform:"translate(0,0) rotate(0deg)", opacity:1},
          {transform:"translate("+dx+"px,"+dy+"px) rotate("+rot+"deg)", opacity:0}
        ],{duration:1100+Math.random()*700, easing:"cubic-bezier(.2,.7,.3,1)"});
      }
      (function(el){ setTimeout(function(){ el.remove(); },1900); })(c);
    }
  }

  function flyFishToBucket(L,golden,fromRect,done){
    var d=DATA[L];
    var fly=document.createElement("div");
    fly.className="fly-fish";
    fly.innerHTML=fishSVG({L:L,golden:golden,color:d.color,deep:d.deep,fin:d.fin});
    var sr=stage.getBoundingClientRect();
    var br=bucketBtn.getBoundingClientRect();
    var x0=fromRect.left+fromRect.width/2-sr.left-48;
    var y0=fromRect.top+fromRect.height/2-sr.top-32;
    var x1=br.left+br.width/2-sr.left-48;
    var y1=br.top+br.height*0.28-sr.top-32;
    fly.style.left=x0+"px";
    fly.style.top=y0+"px";
    stage.appendChild(fly);
    var finished=false;
    function finish(){
      if(finished) return;
      finished=true;
      fly.remove();
      bucketBtn.classList.remove("bounce"); void bucketBtn.offsetWidth; bucketBtn.classList.add("bounce");
      starSfx();
      done();
    }
    if(fly.animate){
      var anim=fly.animate([
        {transform:"translate(0,0) scale(1) rotate(0deg)", opacity:1},
        {transform:"translate("+((x1-x0)*0.5)+"px,"+((y1-y0)*0.35-100)+"px) scale(1.16) rotate(-14deg)", opacity:1, offset:0.52},
        {transform:"translate("+(x1-x0)+"px,"+(y1-y0)+"px) scale(.42) rotate(10deg)", opacity:.95}
      ],{duration:720, easing:"cubic-bezier(.3,.65,.4,1)"});
      anim.onfinish=finish;
      setTimeout(finish,880);
    } else setTimeout(finish,120);
  }

  /* ================= HUD & BUCKET ================= */
  function updateHUD(){
    starCount.textContent=stars;
    for(var i=0;i<dots.length;i++) dots[i].classList.toggle("on", i<caught.length);
  }
  function bumpStars(){
    starBank.classList.remove("bump"); void starBank.offsetWidth; starBank.classList.add("bump");
  }
  function addBucketChip(L){
    if(bucketChips.children.length>=5 && mode==="free"){
      bucketChips.removeChild(bucketChips.firstChild);
    }
    var chip=document.createElement("span");
    chip.className="b-chip";
    chip.textContent=L;
    chip.dataset.letter=L;
    bucketChips.appendChild(chip);
  }

  /* ================= GAME FLOW ================= */
  function presentQuestTarget(speakNow, isBoot){
    targetLetter=targets[tIdx];
    targetLetterEl.textContent=targetLetter;
    targetEmoji.textContent=DATA[targetLetter].emoji;
    wantedBuoy.style.display="flex";
    wantedBuoy.classList.remove("pop"); void wantedBuoy.offsetWidth; wantedBuoy.classList.add("pop");

    var pool=lettersSet.filter(function(x){ return x!==targetLetter && caught.indexOf(x)<0; });
    if(pool.length<2){
      var extra=shuffle(Object.keys(DATA).filter(function(x){ return x!==targetLetter && pool.indexOf(x)<0; }));
      pool=pool.concat(extra);
    }
    shuffle(pool);
    var wave=shuffle([targetLetter].concat(pool.slice(0,2)));
    var goldenLetter=(Math.random()<0.34) ? targetLetter : null;
    renderFishWave(wave, goldenLetter);
    updateHUD();
    drawRestingLine();
    if(speakNow) speakFindLetter(targetLetter, !!isBoot);
    armIdle();
  }

  function presentFreeWave(){
    targetLetterEl.textContent="🐠";
    targetEmoji.textContent="✨";
    wantedBuoy.style.display="none";
    var pool=shuffle(Object.keys(DATA));
    var wave=pool.slice(0,4);
    var goldenLetter=Math.random()<0.35 ? wave[0] : null;
    renderFishWave(wave, goldenLetter);
    updateHUD();
    drawRestingLine();
  }

  function startNewRound(silent, isBoot){
    clearIdle();
    clearVoice(true);
    teachGen++;
    caught=[];
    bucketChips.innerHTML="";
    stars=0; bonusStars=0; wonRound=false; inputLock=false;
    hookedEl=null; hookedData=null; reelStep=0;
    reelPad.classList.remove("show");
    catchModal.hidden=true;
    winOverlay.hidden=true;
    state="aim";
    lettersSet=pickLetterSet();
    try{ window.__hwFishSet=lettersSet.slice(); }catch(e){}
    targets=shuffle(lettersSet.slice());
    tIdx=0;
    if(mode==="quest"){
      presentQuestTarget(!silent, !!isBoot);
    } else {
      presentFreeWave();
      if(!silent) enqueue("hoot-game-hello.mp3","hello","",null);
    }
  }

  /* ================= CAST & HOOK & REEL ================= */
  function pondCenterOf(el){
    var pr=pond.getBoundingClientRect();
    var er=el.getBoundingClientRect();
    return { x:er.left-pr.left+er.width/2, y:er.top-pr.top+er.height/2 };
  }

  function onFishTap(btn){
    audio();
    if(dead) return;
    /* Allow tapping the hooked fish itself as an intuitive crank alternative for toddlers! */
    if(state==="hooked" && btn===hookedEl){
      doCrank();
      return;
    }
    if(state!=="aim" || inputLock || btn.dataset.done) return;
    clearIdle();
    var L=btn.dataset.letter;
    var golden=btn.dataset.golden==="1";

    if(mode==="quest" && L!==targetLetter){
      /* Gentle playful splash-dive for wrong fish */
      btn.dataset.done="1";
      btn.classList.add("boing-away");
      boingSfx();
      var c=pondCenterOf(btn);
      spawnRipple(c.x, c.y, false);
      hootBoatBtn.classList.remove("shake"); void hootBoatBtn.offsetWidth; hootBoatBtn.classList.add("shake");
      speakWrongAndRemind(targetLetter);
      /* Gently spotlight the right fish after a wrong tap */
      var rightBtn=fishLayer.querySelector('.fish-btn[data-letter="'+targetLetter+'"]');
      if(rightBtn) rightBtn.classList.add("hint-glow");
      presentLetters=presentLetters.filter(function(x){ return x!==L; });
      setTimeout(function(){
        if(dead || state!=="aim" || mode!=="quest") return;
        btn.remove();
        var used=presentLetters.concat([targetLetter]).concat(caught);
        var pool=Object.keys(DATA).filter(function(x){ return used.indexOf(x)<0; });
        if(!pool.length) return;
        var nextL=pool[Math.floor(Math.random()*pool.length)];
        presentLetters.push(nextL);
        var slots=getSwimSlots();
        var pick=slots[Math.floor(Math.random()*slots.length)];
        fishLayer.appendChild(createFishBtn(nextL,false,pick));
      }, 540);
      armIdle();
      return;
    }

    /* HOOK THE FISH! */
    hookFish(btn, L, golden);
  }

  function hookFish(btn,L,golden){
    inputLock=true;
    state="casting";
    clearIdle();
    btn.dataset.done="1";
    btn.classList.remove("hint-glow");
    hookedEl=btn;
    hookedData={L:L, golden:golden};

    var pr=pond.getBoundingClientRect();
    var c=pondCenterOf(btn);
    btn.classList.add("hooked");
    btn.style.left=c.x+"px";
    btn.style.top=c.y+"px";

    var boatR=hootBoatBtn.getBoundingClientRect();
    fishStart={ x:c.x, y:c.y };
    fishDock={
      x:Math.min(pr.width*0.44, boatR.right-pr.left+16),
      y:Math.max(pr.height*0.48, boatR.top-pr.top+boatR.height*0.35)
    };

    castSfx();
    drawLineTo(c.x, c.y, 18, 26);
    setTimeout(function(){
      if(dead || state!=="casting") return;
      splashSfx();
      spawnRipple(c.x, c.y, true);
      spawnDroplets(c.x, c.y, 12);
      if(golden) goldenSfx();
      state="hooked";
      reelStep=0;
      for(var i=0;i<reelDots.length;i++) reelDots[i].classList.remove("on");
      reelPad.classList.add("show");
      inputLock=false;
    }, 360);
  }

  function doCrank(){
    if(state!=="hooked" || dead || !hookedEl) return;
    audio();
    reelStep++;
    crankDeg+=180;
    reelCrank.style.transform="rotate("+crankDeg+"deg)";
    crankSfx();
    plipSfx();
    for(var i=0;i<reelDots.length;i++) reelDots[i].classList.toggle("on", i<reelStep);

    var frac=Math.min(1, reelStep/REEL_CLICKS);
    var nx=fishStart.x + (fishDock.x-fishStart.x)*frac;
    var ny=fishStart.y + (fishDock.y-fishStart.y)*frac;
    hookedEl.style.left=nx+"px";
    hookedEl.style.top=ny+"px";
    drawLineTo(nx, ny, 10, 34-frac*12);
    spawnRipple(nx, ny+14, false);
    spawnDroplets(nx, ny, 6);

    if(reelStep>=REEL_CLICKS){
      state="teach";
      reelPad.classList.remove("show");
      finishCatch();
    }
  }

  /* Support both tap AND circular touch/mouse spin on the golden reel! */
  var wheelSpinning=false, lastWheelAng=0, wheelAccum=0;
  function wheelAngle(e){
    var r=reelWheel.getBoundingClientRect();
    return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2));
  }
  reelWheel.addEventListener("pointerdown",function(e){
    e.preventDefault();
    wheelSpinning=true;
    wheelAccum=0;
    lastWheelAng=wheelAngle(e);
    doCrank();
    try{ reelWheel.setPointerCapture(e.pointerId); }catch(err){}
  });
  reelWheel.addEventListener("pointermove",function(e){
    if(!wheelSpinning || state!=="hooked") return;
    var a=wheelAngle(e);
    var d=a-lastWheelAng;
    if(d>Math.PI) d-=Math.PI*2;
    if(d<-Math.PI) d+=Math.PI*2;
    lastWheelAng=a;
    wheelAccum+=Math.abs(d);
    if(wheelAccum>1.4){
      wheelAccum=0;
      doCrank();
    }
  });
  function stopWheel(){ wheelSpinning=false; }
  reelWheel.addEventListener("pointerup",stopWheel);
  reelWheel.addEventListener("pointercancel",stopWheel);

  function finishCatch(){
    var f=hookedData, L=f.L, golden=f.golden;
    var fr=hookedEl.getBoundingClientRect();
    var old=hookedEl; hookedEl=null;
    if(old) old.remove();
    drawRestingLine();

    boatWrap.classList.remove("celebrate"); void boatWrap.offsetWidth; boatWrap.classList.add("celebrate");
    if(golden){ bonusStars++; stars++; goldenSfx(); spawnConfetti(20); }
    stars++;
    caught.push(L);
    bumpStars();
    updateHUD();

    flyFishToBucket(L, golden, fr, function(){
      if(dead) return;
      addBucketChip(L);
      var d=DATA[L];
      catchFishBox.innerHTML=fishSVG({L:L,golden:golden,color:d.color,deep:d.deep,fin:d.fin});
      catchLetterBig.textContent=L;
      catchEmojiBig.textContent=d.emoji;
      catchModal.hidden=false;
      teachLetter=L;
      speakCatchPhonics(L, golden);
      armAutoNext();
    });
  }

  function armAutoNext(){
    var g=++teachGen;
    var t0=Date.now(), quietAt=0;
    function poll(){
      if(dead || g!==teachGen || state!=="teach" || catchModal.hidden) return;
      var now=Date.now();
      if((vPlaying || vQueue.length) && now-t0<12000){
        quietAt=0;
        setTimeout(poll,220);
        return;
      }
      if(!quietAt) quietAt=now;
      if(now-quietAt>=750 || now-t0>=12000){
        advanceAfterCatch();
        return;
      }
      setTimeout(poll,220);
    }
    setTimeout(poll,450);
  }

  function advanceAfterCatch(){
    if(state!=="teach" || dead) return;
    teachGen++;
    catchModal.hidden=true;
    if(mode==="free"){
      state="aim";
      presentFreeWave();
      return;
    }
    if(tIdx>=GOAL-1){
      showWin();
      return;
    }
    tIdx++;
    state="aim";
    presentQuestTarget(true);
  }

  $("catchNextBtn").addEventListener("click",function(e){
    e.stopPropagation();
    audio(); plipSfx();
    advanceAfterCatch();
  });
  $("catchHearBtn").addEventListener("click",function(e){
    e.stopPropagation();
    audio();
    if(state!=="teach" || !teachLetter) return;
    var low=teachLetter.toLowerCase();
    var file=pickClip("hoot-fish-says-"+low, "call-letter-"+low+".mp3");
    clearVoice(true);
    enqueue(file,"teach",teachLetter,null);
    armAutoNext();
  });
  catchModal.addEventListener("click",function(e){
    if(e.target===catchModal) advanceAfterCatch();
  });

  function showWin(){
    if(wonRound) return;
    wonRound=true;
    state="won";
    clearIdle();
    updateHUD();
    winChips.innerHTML="";
    caught.forEach(function(L){
      var c=document.createElement("span");
      c.className="b-chip";
      c.textContent=L;
      winChips.appendChild(c);
    });
    var st=winStars.children;
    for(var i=0;i<st.length;i++){
      st[i].classList.remove("lit");
      (function(el,ms){ setTimeout(function(){ el.classList.add("lit"); },ms); })(st[i], 180+i*150);
    }
    clearVoice(false);
    enqueue(hasClip("hoot-win-yay")?"hoot-win-yay.mp3":"hoot-amazing.mp3","win","",null);
    winOverlay.hidden=false;
    spawnConfetti(42);
    goldenSfx();
  }

  /* ================= INTERACTIONS ================= */
  function repeatPrompt(){
    audio();
    if(state==="aim" && mode==="quest"){
      speakFindLetter(targetLetter);
      armIdle();
    } else if(state==="hooked"){
      crankSfx();
    } else {
      plipSfx();
    }
  }
  wantedBuoy.addEventListener("click",repeatPrompt);
  hootBoatBtn.addEventListener("click",repeatPrompt);

  bucketBtn.addEventListener("click",function(){
    audio();
    bucketBtn.classList.remove("bounce"); void bucketBtn.offsetWidth; bucketBtn.classList.add("bounce");
    if(!caught.length){
      plipSfx();
      if(state==="aim" && mode==="quest") speakFindLetter(targetLetter);
      return;
    }
    clearVoice(true);
    var chips=bucketChips.children;
    var list=Array.prototype.map.call(chips,function(c){ return c.dataset.letter; });
    list.forEach(function(L,i){
      var low=L.toLowerCase();
      var clip=pickClip("name-letter-"+low, "call-letter-"+low+".mp3");
      enqueue(clip,"readback",L,function(){
        for(var j=0;j<chips.length;j++) chips[j].classList.toggle("reading", j===i);
        if(i===list.length-1){
          setTimeout(function(){
            for(var k=0;k<chips.length;k++) chips[k].classList.remove("reading");
          }, 850);
        }
      });
    });
  });

  modeQuestBtn.addEventListener("click",function(){
    audio(); plipSfx();
    mode="quest";
    modeQuestBtn.classList.add("active"); modeQuestBtn.setAttribute("aria-pressed","true");
    modeFreeBtn.classList.remove("active"); modeFreeBtn.setAttribute("aria-pressed","false");
    startNewRound(false);
  });
  modeFreeBtn.addEventListener("click",function(){
    audio(); plipSfx();
    mode="free";
    modeFreeBtn.classList.add("active"); modeFreeBtn.setAttribute("aria-pressed","true");
    modeQuestBtn.classList.remove("active"); modeQuestBtn.setAttribute("aria-pressed","false");
    startNewRound(false);
  });
  soundBtn.addEventListener("click",function(){
    soundOn=!soundOn;
    soundBtn.textContent=soundOn?"🔊":"🔇";
    if(!soundOn) clearVoice(true);
    else{
      audio(); plipSfx();
      if(state==="aim" && mode==="quest") speakFindLetter(targetLetter);
    }
  });
  $("againBtn").addEventListener("click",function(){
    audio(); starSfx();
    startNewRound(false);
  });

  /* Living pond critters */
  $("sunBtn").addEventListener("click",function(){
    audio(); goldenSfx();
    var s=$("sunBtn"); s.classList.remove("zing"); void s.offsetWidth; s.classList.add("zing");
  });
  document.querySelectorAll(".cloud-btn").forEach(function(c){
    c.addEventListener("click",function(){
      audio(); noise(0.15,750,0.08);
      c.classList.add("puff");
      setTimeout(function(){ c.classList.remove("puff"); }, 320);
    });
  });
  $("frogBtn").addEventListener("click",function(){
    audio(); croakSfx();
    var f=$("frogBtn"); f.classList.remove("jump"); void f.offsetWidth; f.classList.add("jump");
    var c=pondCenterOf(f); spawnRipple(c.x, c.y+22, false);
  });
  $("duckBtn").addEventListener("click",function(){
    audio(); quackSfx();
    var d=$("duckBtn"); d.classList.remove("splashy"); void d.offsetWidth; d.classList.add("splashy");
    var c=pondCenterOf(d); spawnDroplets(c.x, c.y+14, 7); spawnRipple(c.x, c.y+18, false);
  });
  document.querySelectorAll(".dfly-btn").forEach(function(df){
    df.addEventListener("click",function(){
      audio(); zingSfx();
      df.classList.remove("loop"); void df.offsetWidth; df.classList.add("loop");
      setTimeout(function(){ df.classList.remove("loop"); }, 720);
    });
  });
  document.querySelectorAll(".reed-btn").forEach(function(rd){
    rd.addEventListener("click",function(){
      audio(); noise(0.2,1600,0.07);
      rd.classList.remove("swish"); void rd.offsetWidth; rd.classList.add("swish");
      setTimeout(function(){ rd.classList.remove("swish"); }, 920);
    });
  });

  window.addEventListener("resize",function(){
    if(state==="aim") drawRestingLine();
  });
  window.addEventListener("pagehide",function(){ dead=true; clearIdle(); clearVoice(true); });
  document.addEventListener("visibilitychange",function(){ if(document.hidden) clearVoice(false); });

  /* ================= BOOT RIGHT INTO THE POND ================= */
  startNewRound(false, true);

  /* Snapshot API for automated verification */
  window.__fishingGame={
    snapshot:function(){
      return {
        state:state, mode:mode, target:targetLetter, stars:stars, bonus:bonusStars,
        caught:caught.slice(), presented:presentLetters.slice(), reelStep:reelStep,
        winShown:!winOverlay.hidden, catchShown:!catchModal.hidden,
        voicePlaying:vPlaying, voiceQueue:vQueue.map(function(q){ return q.file; })
      };
    }
  };
})();
</script>
