<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="find";window.__HOOT_SELF_COACH__=true;</script>
<script src="js/hoot-game-head.js?v=llprev3e157"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Find It!</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1b354b;
    --cream:#fffdf5;
    --sun:#ffd43b;
    --coral:#ff6b5e;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    font-family:"Fredoka",system-ui,sans-serif;
    color:var(--ink);
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    background:#6ec9f7;
  }

  #stage{
    position:fixed;
    inset:0;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:linear-gradient(180deg,
      #59c3f8 0%,
      #a5e3ff 28%,
      #d8f6d2 34%,
      #8de26f 48%,
      #59c44c 78%,
      #3ca339 100%);
  }

  /* ================= PIXAR 3D ENCHANTED GARDEN BACKDROP ================= */
  .pixar-backdrop{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    background-image:url("assets/worlds3d/bg_find.jpg"), linear-gradient(180deg,
      #59c3f8 0%,
      #a5e3ff 28%,
      #d8f6d2 34%,
      #8de26f 48%,
      #59c44c 78%,
      #3ca339 100%);
  }
  .pixar-backdrop::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 48%, rgba(255,253,245,.05) 30%, rgba(18,46,28,.22) 100%);
  }

  /* ================= SUBTLE GARDEN AMBIENCE ================= */
  #gardenBg{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  #sunOrb{
    position:absolute;
    top:52px;
    right:28px;
    width:72px;
    height:72px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,251,235,.9) 18%, rgba(253,224,71,.78) 68%, rgba(245,158,11,.55));
    box-shadow:0 0 42px 14px rgba(253,224,71,.48);
  }

  /* ================= TOP HUD (ALL >=64PX) ================= */
  #hud{
    position:relative;
    z-index:22;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 4px max(12px, env(safe-area-inset-left));
    flex:0 0 auto;
  }
  .hud-group{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .hud-pill{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 14px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,245,.97);
    color:var(--ink);
    font-size:28px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(27,53,75,.24), 0 10px 18px rgba(27,53,75,.18);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1);
    flex:0 0 auto;
  }
  .hud-pill.round{ width:64px; padding:0; border-radius:50%; }
  .hud-pill:active{ transform:translateY(3px) scale(.94); }
  .hud-pill.active{
    background:linear-gradient(180deg,#ffe473,#ffc93c);
    box-shadow:0 5px 0 #c98600, 0 0 0 3.5px var(--ink);
  }

  /* Visual Target Pill right in HUD center */
  #targetPill{
    min-height:64px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:rgba(255,253,245,.98);
    border:4px solid #fff;
    border-radius:999px;
    padding:4px 16px 4px 6px;
    box-shadow:0 6px 0 rgba(27,53,75,.24), 0 12px 24px rgba(27,53,75,.18);
    cursor:pointer;
  }
  #targetPill:active{ transform:scale(.95); }
  #targetIcon{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#fff3bf;
    border:3px dashed #f59f00;
    display:grid;
    place-items:center;
    font-size:32px;
    flex:0 0 auto;
  }
  #targetDots{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .t-dot{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#dbe7f2;
    border:2.5px solid #94a3b8;
    transition:transform .25s, background .25s;
  }
  .t-dot.found{
    background:#ffd43b;
    border-color:#d97706;
    transform:scale(1.18);
  }

  #starBank{
    min-height:64px;
    height:64px;
    padding:0 16px 0 12px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,245,.97);
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:25px;
    font-weight:700;
    box-shadow:0 5px 0 rgba(27,53,75,.24), 0 10px 18px rgba(27,53,75,.18);
  }
  #starBank svg{ width:28px; height:28px; display:block; }
  #starBank.bump{ animation:starBump .45s cubic-bezier(.34,1.7,.5,1); }
  @keyframes starBump{ 0%{transform:scale(1)} 45%{transform:scale(1.2) rotate(-4deg)} 100%{transform:scale(1)} }

  /* ================= HIDDEN TREASURE GARDEN ================= */
  #garden{
    position:relative;
    z-index:10;
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
  }
  .item-btn{
    position:absolute;
    min-width:74px;
    min-height:74px;
    width:clamp(74px, 12vw, 102px);
    height:clamp(74px, 12vw, 102px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:4.5px solid #fff;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.98), rgba(255,248,225,.92));
    display:grid;
    place-items:center;
    font-size:clamp(42px, 6.8vw, 58px);
    cursor:pointer;
    box-shadow:0 6px 0 rgba(27,53,75,.26), 0 12px 22px rgba(27,53,75,.32);
    transition:transform .18s cubic-bezier(.34,1.6,.5,1), opacity .32s, box-shadow .2s;
    animation:bobItem 3.2s ease-in-out infinite alternate;
  }
  @keyframes bobItem{ from{margin-top:0} to{margin-top:-6px} }
  .item-btn:active{ transform:translate(-50%,-50%) scale(.9); }
  .item-btn.magnified{
    transform:translate(-50%,-50%) scale(1.36);
    z-index:16;
    box-shadow:0 0 0 6px #fff, 0 0 28px 10px #ffe066;
  }
  .item-btn.hint{
    z-index:15;
    box-shadow:0 0 0 7px #fff, 0 0 32px 12px #ffd43b;
    animation:hintBounce .8s ease-in-out infinite alternate;
  }
  @keyframes hintBounce{ from{transform:translate(-50%,-50%) scale(1)} to{transform:translate(-50%,-50%) scale(1.18)} }
  .item-btn.wiggle{ animation:itemShake .4s ease-in-out 2; }
  @keyframes itemShake{ 0%,100%{transform:translate(-50%,-50%) rotate(0)} 25%{transform:translate(-50%,-50%) rotate(-10deg)} 75%{transform:translate(-50%,-50%) rotate(10deg)} }
  .item-btn.found{
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,-50%) scale(.2);
  }
  .item-btn .hand-cue{
    position:absolute;
    top:-28px;
    left:50%;
    transform:translateX(-50%);
    font-size:36px;
    pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));
    animation:handBob .6s ease-in-out infinite alternate;
  }
  @keyframes handBob{ from{transform:translate(-50%,0)} to{transform:translate(-50%,-8px)} }

  /* Draggable Interactive Magnifying Glass */
  #magGlass{
    position:absolute;
    z-index:18;
    width:92px;
    height:92px;
    right:14px;
    bottom:14px;
    cursor:grab;
    touch-action:none;
    filter:drop-shadow(0 10px 14px rgba(27,53,75,.38));
  }
  #magGlass:active{ cursor:grabbing; }
  #magGlass svg{ width:100%; height:100%; display:block; overflow:visible; pointer-events:none; }

  /* Bottom Bar: Detective Hoot + Woven Treasure Basket */
  #bottomDock{
    position:relative;
    z-index:14;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    padding:0 max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    pointer-events:none;
    flex:0 0 auto;
  }
  #hootDetective{
    pointer-events:auto;
    min-width:64px;
    min-height:64px;
    width:clamp(84px, 12vh, 122px);
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    filter:drop-shadow(0 10px 14px rgba(27,53,75,.36));
    animation:hootBob 3s ease-in-out infinite;
  }
  #hootDetective svg{ width:100%; height:auto; display:block; overflow:visible; }
  @keyframes hootBob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  #hootDetective.cheer{ animation:hootHop .4s cubic-bezier(.34,1.6,.5,1) 2; }
  @keyframes hootHop{ 0%,100%{transform:translateY(0) scale(1)} 45%{transform:translateY(-18px) scale(1.08)} }
  #hootDetective.talking{ animation:hootTalk .22s ease-in-out infinite alternate; }
  @keyframes hootTalk{ from{transform:translateY(0) scale(1)} to{transform:translateY(-3px) scale(1.03)} }

  #basket{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:8px;
    min-width:136px;
    min-height:64px;
    padding:8px 16px;
    border-radius:26px 26px 34px 34px;
    background:linear-gradient(180deg,#e09f3e,#b45309);
    border:4px solid #fff3bf;
    box-shadow:0 6px 0 #78350f, 0 12px 22px rgba(27,53,75,.32);
    margin-right:104px;
  }
  .basket-slot{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(255,253,245,.32);
    border:2.5px dashed rgba(255,243,191,.88);
    display:grid;
    place-items:center;
    font-size:28px;
    transition:transform .3s cubic-bezier(.34,1.8,.5,1);
  }
  .basket-slot.filled{
    background:#fffdf5;
    border-style:solid;
    border-color:#fde047;
    transform:scale(1.08);
  }

  .sparkle-fx{ position:absolute; z-index:30; font-size:32px; pointer-events:none; }
  .confetti{ position:absolute; z-index:35; width:12px; height:16px; border-radius:3px; pointer-events:none; }

  /* Celebration Overlay */
  #winOverlay{
    position:absolute;
    inset:0;
    z-index:40;
    background:rgba(24,62,48,.52);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  #winCard{
    background:var(--cream);
    border:5px solid #fff;
    border-radius:36px;
    padding:24px 24px;
    text-align:center;
    max-width:440px;
    width:100%;
    box-shadow:0 12px 0 rgba(27,53,75,.24), 0 26px 50px rgba(0,0,0,.3);
  }
  .win-icons{ font-size:48px; letter-spacing:8px; margin-bottom:8px; }
  .win-stars{ font-size:42px; margin-bottom:14px; }
  .win-btns{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; }
  #againBtn, .win-btn{
    min-width:140px;
    min-height:72px;
    padding:10px 28px;
    border-radius:999px;
    border:4px solid #fff;
    background:linear-gradient(180deg,#ffd43b,#f59e0b);
    color:#fff;
    font-family:inherit;
    font-size:28px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 0 #b45309;
    text-shadow:0 2px 0 rgba(0,0,0,.22);
  }
  #againBtn:active, .win-btn:active{ transform:translateY(3px) scale(.95); }

  /* Portrait Phone (390x844): ALL buttons >= 64px, clean 2-row HUD with zero overlap! */
  @media (max-width:600px){
    #hud{ gap:6px; padding-left:8px; padding-right:8px; }
    .hud-group{ gap:6px; }
    .hud-pill{ min-width:64px; min-height:64px; height:64px; padding:0 12px; font-size:24px; }
    .hud-pill.round{ width:64px; }
    #starBank{ min-height:64px; height:64px; font-size:22px; padding:0 12px 0 10px; }
    #targetPill{ order:3; margin:0 auto; min-height:64px; padding:4px 16px 4px 6px; gap:10px; }
    #targetIcon{ width:50px; height:50px; font-size:30px; }
    .t-dot{ width:16px; height:16px; }
    #hootDetective{ width:78px; }
    #basket{ margin-right:88px; min-width:118px; min-height:64px; padding:6px 12px; gap:6px; }
    .basket-slot{ width:40px; height:40px; font-size:24px; }
    #magGlass{ width:80px; height:80px; right:8px; bottom:8px; }
  }
</style>
</head>
<body>
<div id="stage">
  <!-- Pixar 3D Enchanted Garden Backdrop (with gradient fallback underneath) -->
  <div id="pixarBg" class="pixar-backdrop" aria-hidden="true"></div>

  <div id="gardenBg" aria-hidden="true">
    <div id="sunOrb"></div>
  </div>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-group">
      <button class="hud-pill active" id="modeTreasureBtn" type="button" aria-label="Hidden Treasures" aria-pressed="true">🦋</button>
      <button class="hud-pill" id="modeEasyBtn" type="button" aria-label="Big Easy Hunt" aria-pressed="false">⭐</button>
      <button class="hud-pill round" id="soundBtn" type="button" aria-label="Toggle Sound">🔊</button>
    </div>

    <button id="targetPill" type="button" aria-label="Hear what to find">
      <span id="targetIcon">🦋</span>
      <span id="targetDots"></span>
    </button>

    <div id="starBank" aria-label="Stars collected">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4l3 6 6.6.9-4.8 4.6 1.1 6.6L12 17.4l-5.9 3.1 1.1-6.6-4.8-4.6 6.6-.9z" fill="#ffc93c" stroke="#d99400" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span id="starCount">0</span>
    </div>
  </div>

  <!-- Busy Enchanted Garden -->
  <div id="garden">
    <div id="magGlass" aria-hidden="true">
      <svg viewBox="0 0 110 110">
        <line x1="72" y1="72" x2="102" y2="102" stroke="#92400e" stroke-width="14" stroke-linecap="round"/>
        <line x1="72" y1="72" x2="102" y2="102" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
        <circle cx="44" cy="44" r="35" fill="rgba(186,230,253,.42)" stroke="#1d4ed8" stroke-width="8"/>
        <circle cx="44" cy="44" r="31" fill="none" stroke="#93c5fd" stroke-width="3"/>
        <path d="M24 32 A22 22 0 0 1 48 20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"/>
      </svg>
    </div>
  </div>

  <!-- Detective Hoot + Woven Treasure Basket -->
  <div id="bottomDock">
    <button id="hootDetective" type="button" aria-label="Detective Hoot — tap to hear clue">
      <svg viewBox="0 0 220 220" aria-hidden="true">
        <ellipse cx="110" cy="144" rx="58" ry="54" fill="#a26636" stroke="#4a2810" stroke-width="5"/>
        <ellipse cx="110" cy="156" rx="38" ry="36" fill="#fdecd2"/>
        <ellipse cx="52" cy="144" rx="18" ry="30" fill="#8b5226" stroke="#4a2810" stroke-width="4.5" transform="rotate(14 52 144)"/>
        <ellipse cx="168" cy="144" rx="18" ry="30" fill="#8b5226" stroke="#4a2810" stroke-width="4.5" transform="rotate(-14 168 144)"/>
        <ellipse cx="88" cy="196" rx="13" ry="8" fill="#f59e0b" stroke="#4a2810" stroke-width="3.5"/>
        <ellipse cx="132" cy="196" rx="13" ry="8" fill="#f59e0b" stroke="#4a2810" stroke-width="3.5"/>
        <circle cx="110" cy="96" r="48" fill="#a26636" stroke="#4a2810" stroke-width="5"/>
        <ellipse cx="90" cy="94" rx="21" ry="21" fill="#fff" stroke="#4a2810" stroke-width="3.5"/>
        <ellipse cx="130" cy="94" rx="21" ry="21" fill="#fff" stroke="#4a2810" stroke-width="3.5"/>
        <circle cx="92" cy="95" r="10.5" fill="#231815"/><circle cx="128" cy="95" r="10.5" fill="#231815"/>
        <circle cx="88" cy="90" r="4" fill="#fff"/><circle cx="124" cy="90" r="4" fill="#fff"/>
        <polygon points="110,103 102,116 118,116" fill="#fbbf24" stroke="#4a2810" stroke-width="3.5" stroke-linejoin="round"/>
        <ellipse cx="110" cy="54" rx="58" ry="13" fill="#22c55e" stroke="#14532d" stroke-width="4.5"/>
        <path d="M74 52 C78 24,142 24,146 52 Z" fill="#16a34a" stroke="#14532d" stroke-width="4.5"/>
        <circle cx="110" cy="40" r="8" fill="#fde047" stroke="#14532d" stroke-width="3"/>
      </svg>
    </button>
    <div id="basket" aria-label="Treasure Basket"></div>
  </div>

  <!-- Round Complete Overlay -->
  <div id="winOverlay" hidden>
    <div id="winCard" role="dialog" aria-modal="true" aria-label="Treasures found">
      <div class="win-icons" id="winIcons">🦋 🦋 🦋</div>
      <div class="win-stars">⭐ ⭐ ⭐</div>
      <div class="win-btns">
        <button id="againBtn" class="win-btn" type="button" aria-label="Next Treasure Hunt">▶ ✨</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var TARGETS = [
    { id:"butterfly", emo:"🦋", word:"word-butterflies.mp3", single:"word-butterfly.mp3" },
    { id:"flower",    emo:"🌸", word:"word-flower.mp3",      single:"word-flower.mp3" },
    { id:"star",      emo:"⭐", word:"word-stars.mp3",       single:"word-star.mp3" },
    { id:"duck",      emo:"🦆", word:"word-duck.mp3",        single:"word-duck.mp3" },
    { id:"kite",      emo:"🪁", word:"word-kite.mp3",        single:"word-kite.mp3" },
    { id:"present",   emo:"🎁", word:"word-present.mp3",     single:"word-present.mp3" },
    { id:"crown",     emo:"👑", word:"word-crown.mp3",       single:"word-crown.mp3" },
    { id:"bee",       emo:"🐝", word:"word-bee.mp3",         single:"word-bee.mp3" },
    { id:"frog",      emo:"🐸", word:"word-frog.mp3",        single:"word-frog.mp3" },
    { id:"turtle",    emo:"🐢", word:"word-turtle.mp3",      single:"word-turtle.mp3" }
  ];
  var NUM_CLIPS = ["", "name-number-1.mp3", "name-number-2.mp3", "name-number-3.mp3", "name-number-4.mp3"];
  var PRAISE = ["hoot-great-job.mp3","hoot-amazing.mp3","hoot-super.mp3","hoot-yay-2.mp3"];

  /* Age-adaptive: Riley (kidb, age 2) starts in Big Easy Hunt with 2 matches + 3 distractors! */
  var IS_RILEY = false;
  try{ IS_RILEY = new URLSearchParams(window.location.search || "").get("kid") === "kidb"; }catch(e){}

  var stage = document.getElementById("stage");
  var garden = document.getElementById("garden");
  var magGlass = document.getElementById("magGlass");
  var targetPill = document.getElementById("targetPill");
  var targetIcon = document.getElementById("targetIcon");
  var targetDots = document.getElementById("targetDots");
  var basket = document.getElementById("basket");
  var starCountEl = document.getElementById("starCount");
  var starBank = document.getElementById("starBank");
  var hootDetective = document.getElementById("hootDetective");
  var modeTreasureBtn = document.getElementById("modeTreasureBtn");
  var modeEasyBtn = document.getElementById("modeEasyBtn");
  var soundBtn = document.getElementById("soundBtn");
  var winOverlay = document.getElementById("winOverlay");
  var winIcons = document.getElementById("winIcons");
  var againBtn = document.getElementById("againBtn");

  var difficulty = IS_RILEY ? "easy" : "normal";
  var roundIdx = 0;
  var curTarget = TARGETS[0];
  var goalCount = 3;
  var foundCount = 0;
  var stars = 0;
  var muted = false;
  var idleVisualTimer = null;
  var idleVoiceTimer = null;
  var idleVoiceReminded = false;
  var audioCtx = null;
  var dead = false;
  var roundTok = 0;

  /* ================= PERSISTENT VOICE QUEUE + iOS SAFARI UNLOCK ================= */
  var VBASE = "assets/voice/";
  var voiceEl = new Audio();
  voiceEl.preload = "auto";
  var vQueue = [], vPlaying = false, vDrainCbs = [];
  var audioUnlocked = false, pendingBootClip = null;

  function hasHootClip(id){
    try{ return !!(window.parent && window.parent.HOOT_HAVE && window.parent.HOOT_HAVE[id]); }catch(e){ return false; }
  }
  function resolveClip(customId, fallbackId){
    var chosen = (customId && hasHootClip(customId)) ? customId : fallbackId;
    return chosen ? (chosen.indexOf(".mp3") > -1 ? chosen : chosen + ".mp3") : null;
  }
  function hubMuted(){
    try{
      var d = window.parent && window.parent.document;
      if(!d || d === document) return false;
      var b = d.querySelector('.voice-btn[data-voice="off"]');
      return !!(b && (b.classList.contains("sel") || b.classList.contains("active") || b.getAttribute("aria-pressed") === "true"));
    }catch(e){ return false; }
  }
  function fireDrain(){
    if(vPlaying || vQueue.length) return;
    var list = vDrainCbs.splice(0, vDrainCbs.length);
    for(var i = 0; i < list.length; i++){ try{ list[i](); }catch(e){} }
  }
  function clearVoice(){
    vQueue.length = 0;
    vDrainCbs.length = 0;
    try{ voiceEl.pause(); voiceEl.currentTime = 0; }catch(e){}
    vPlaying = false;
    hootDetective.classList.remove("talking");
  }
  function vNext(){
    vPlaying = false;
    hootDetective.classList.remove("talking");
    if(vQueue.length) pumpVoice();
    else fireDrain();
  }
  voiceEl.addEventListener("ended", vNext);
  voiceEl.addEventListener("error", vNext);

  function ensureCtx(){
    if(muted) return null;
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) try{ audioCtx = new AC(); }catch(e){}
    }
    if(audioCtx && audioCtx.state === "suspended") try{ audioCtx.resume(); }catch(e){}
    return audioCtx;
  }

  function unlockAudioOnce(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    ensureCtx();
    try{
      if(!vPlaying){
        voiceEl.muted = true;
        var p = voiceEl.play();
        if(p && p.then){
          p.then(function(){
            voiceEl.pause();
            voiceEl.currentTime = 0;
            voiceEl.muted = false;
            if(pendingBootClip){
              var c = pendingBootClip;
              pendingBootClip = null;
              sayClips(c, true);
            }
          }).catch(function(){ voiceEl.muted = false; });
        } else {
          voiceEl.muted = false;
        }
      }
    }catch(e){ voiceEl.muted = false; }
  }
  stage.addEventListener("pointerdown", unlockAudioOnce, { passive: true, capture: true });

  function pumpVoice(){
    if(vPlaying || dead) return;
    var file = vQueue.shift();
    if(!file){ fireDrain(); return; }
    if(muted || hubMuted()){ vQueue.length = 0; fireDrain(); return; }
    vPlaying = true;
    hootDetective.classList.add("talking");
    voiceEl.muted = false;
    voiceEl.setAttribute("src", VBASE + file);
    voiceEl.src = VBASE + file;
    var p = voiceEl.play();
    if(p && p.catch){
      p.catch(function(){
        vPlaying = false;
        hootDetective.classList.remove("talking");
        if(!audioUnlocked && !pendingBootClip){
          pendingBootClip = [file].concat(vQueue.slice());
          vQueue.length = 0;
        }
        fireDrain();
      });
    }
  }
  function sayClips(list, replace){
    if(replace) clearVoice();
    (list || []).forEach(function(f){ if(f) vQueue.push(f.indexOf(".mp3") > -1 ? f : f + ".mp3"); });
    pumpVoice();
  }
  function afterVoice(fn, minMs, maxMs){
    var done = false, minDone = false, voiceDone = (!vPlaying && !vQueue.length);
    function check(){
      if(done || dead) return;
      if(minDone && voiceDone){ done = true; fn(); }
    }
    setTimeout(function(){ minDone = true; check(); }, minMs || 950);
    setTimeout(function(){ if(!done && !dead){ done = true; fn(); } }, maxMs || 3400);
    if(!voiceDone){
      vDrainCbs.push(function(){ voiceDone = true; check(); });
    }
  }

  function speakPrompt(isFirst){
    if(dead || muted || hubMuted()) return;
    if(isFirst){
      try{
        if(window.parent && window.parent !== window && typeof window.parent.__hwPlayAfterIntro === "function"){
          if(window.parent.__hwPlayAfterIntro(VBASE + curTarget.word)) return;
        }
      }catch(e){}
      var intro = resolveClip("hoot-fnd-intro", null);
      if(intro){
        sayClips([intro, curTarget.word], true);
        return;
      }
    }
    sayClips(["ask-can-you-find.mp3", curTarget.word], true);
  }

  function playTone(freq, dur){
    if(muted) return;
    var ctx = ensureCtx();
    if(!ctx) return;
    try{
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(freq, ctx.currentTime);
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (dur || 0.2));
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + (dur || 0.2) + 0.02);
    }catch(e){}
  }

  function playSparkleChime(){
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){
      setTimeout(function(){ playTone(f, 0.2); }, i * 80);
    });
  }

  function addStar(n){
    stars += (n || 1);
    starCountEl.textContent = stars;
    starBank.classList.remove("bump"); void starBank.offsetWidth; starBank.classList.add("bump");
    try{ if(window.parent && window.parent.hwAddStar) window.parent.hwAddStar(n || 1); }catch(e){}
  }

  function cheerHoot(){
    hootDetective.classList.remove("cheer"); void hootDetective.offsetWidth; hootDetective.classList.add("cheer");
  }

  function sparkleAt(el){
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    var cx = r.left - sr.left + r.width / 2, cy = r.top - sr.top + r.height / 2;
    for(var i = 0; i < 6; i++){
      var sp = document.createElement("span");
      sp.className = "sparkle-fx";
      sp.textContent = i % 2 === 0 ? "✨" : "⭐";
      sp.style.left = cx + "px"; sp.style.top = cy + "px";
      stage.appendChild(sp);
      var a = (Math.PI * 2 * i / 6) + Math.random() * 0.4;
      var d = 42 + Math.random() * 42;
      if(sp.animate){
        sp.animate([
          { transform:"translate(-50%,-50%) scale(.5)", opacity:1 },
          { transform:"translate(calc(-50% + " + Math.round(Math.cos(a)*d) + "px),calc(-50% + " + Math.round(Math.sin(a)*d - 22) + "px)) scale(1.2)", opacity:0 }
        ], { duration:650, easing:"ease-out" }).onfinish = function(){ this.effect && this.effect.target && this.effect.target.remove(); };
      } else {
        (function(node){ setTimeout(function(){ node.remove(); }, 650); })(sp);
      }
    }
  }

  function showerConfetti(){
    var cols = ["#ff595e","#ffca3a","#8ac926","#1982c4","#ff8fab","#b197fc"];
    for(var i = 0; i < 28; i++){
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.background = cols[i % cols.length];
      c.style.left = (10 + Math.random() * 80) + "%";
      c.style.top = "-18px";
      stage.appendChild(c);
      if(c.animate){
        c.animate([
          { transform:"translateY(0) rotate(0deg)", opacity:1 },
          { transform:"translateY(" + (window.innerHeight + 40) + "px) rotate(" + (240 + Math.random()*360) + "deg)", opacity:.9 }
        ], { duration:1200 + Math.random()*700, delay:Math.random()*250, easing:"ease-in" }).onfinish = function(){ this.effect && this.effect.target && this.effect.target.remove(); };
      } else {
        (function(node){ setTimeout(function(){ node.remove(); }, 1800); })(c);
      }
    }
  }

  function clearIdle(){
    if(idleVisualTimer){ clearTimeout(idleVisualTimer); idleVisualTimer = null; }
    if(idleVoiceTimer){ clearTimeout(idleVoiceTimer); idleVoiceTimer = null; }
    garden.querySelectorAll(".item-btn.hint").forEach(function(b){
      b.classList.remove("hint");
      var h = b.querySelector(".hand-cue"); if(h) h.remove();
    });
  }

  function armIdle(){
    clearIdle();
    if(dead || foundCount >= goalCount) return;
    var visualMs = IS_RILEY ? 4200 : 5600;
    idleVisualTimer = setTimeout(function(){
      if(dead || foundCount >= goalCount) return;
      var next = garden.querySelector('.item-btn[data-match="1"]:not(.found)');
      if(next){
        next.classList.add("hint");
        if(!next.querySelector(".hand-cue")){
          var h = document.createElement("span");
          h.className = "hand-cue";
          h.textContent = "👆";
          next.appendChild(h);
        }
      }
    }, visualMs);
    if(!idleVoiceReminded){
      idleVoiceTimer = setTimeout(function(){
        if(dead || foundCount >= goalCount) return;
        idleVoiceReminded = true;
        if(!vPlaying){
          if(hasHootClip("hoot-fnd-idle")){
            sayClips(["hoot-fnd-idle.mp3", curTarget.single], true);
          } else {
            sayClips(["ask-can-you-find.mp3", curTarget.word], true);
          }
        }
      }, 9000);
    }
  }

  function renderHudProgress(){
    targetIcon.textContent = curTarget.emo;
    targetDots.innerHTML = "";
    basket.innerHTML = "";
    for(var i = 0; i < goalCount; i++){
      var d = document.createElement("span");
      d.className = "t-dot" + (i < foundCount ? " found" : "");
      targetDots.appendChild(d);

      var s = document.createElement("span");
      s.className = "basket-slot" + (i < foundCount ? " filled" : "");
      s.textContent = i < foundCount ? curTarget.emo : "";
      basket.appendChild(s);
    }
  }

  function buildPositions(total){
    /* Clean non-overlapping grid-jitter slots across the garden */
    var narrow = window.innerWidth < 620;
    var cols = narrow ? (total <= 6 ? 2 : 3) : (total <= 6 ? 3 : 5);
    var rows = Math.ceil(total / cols);
    var slots = [];
    for(var r = 0; r < rows; r++){
      for(var c = 0; c < cols; c++){
        var x = 16 + (c + 0.5) * (68 / cols) + (Math.random() - 0.5) * (narrow ? 3 : 5);
        var y = 16 + (r + 0.5) * (66 / rows) + (Math.random() - 0.5) * (narrow ? 3 : 6);
        slots.push({ x: Math.max(15, Math.min(85, x)), y: Math.max(15, Math.min(80, y)) });
      }
    }
    return slots.sort(function(){ return Math.random() - 0.5; }).slice(0, total);
  }

  function startRound(isFirst){
    roundTok++;
    clearIdle();
    idleVoiceReminded = false;
    winOverlay.hidden = true;
    curTarget = TARGETS[roundIdx % TARGETS.length];
    goalCount = (IS_RILEY && difficulty === "easy") ? 2 : 3;
    foundCount = 0;

    garden.querySelectorAll(".item-btn").forEach(function(el){ el.remove(); });

    var distractorCount = difficulty === "easy" ? 3 : 7;
    var others = TARGETS.filter(function(t){ return t.id !== curTarget.id; })
                        .sort(function(){ return Math.random() - 0.5; });
    var items = [];
    for(var i = 0; i < goalCount; i++) items.push({ t:curTarget, match:true });
    for(var j = 0; j < distractorCount; j++) items.push({ t:others[j % others.length], match:false });
    items.sort(function(){ return Math.random() - 0.5; });

    var coords = buildPositions(items.length);
    items.forEach(function(it, idx){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "item-btn";
      b.dataset.match = it.match ? "1" : "0";
      b.dataset.id = it.t.id;
      b.style.left = coords[idx].x + "%";
      b.style.top = coords[idx].y + "%";
      b.style.animationDelay = (-idx * 0.45) + "s";
      b.setAttribute("aria-label", it.t.id);
      b.textContent = it.t.emo;
      b.addEventListener("pointerdown", function(e){
        e.preventDefault();
        unlockAudioOnce();
        onItemTap(b, it);
      });
      garden.appendChild(b);
    });

    renderHudProgress();
    speakPrompt(isFirst);
    armIdle();
  }

  function onItemTap(btn, it){
    if(btn.classList.contains("found")) return;
    clearIdle();
    idleVoiceReminded = false;
    if(it.match){
      btn.classList.add("found");
      sparkleAt(btn);
      foundCount++;
      renderHudProgress();
      cheerHoot();
      playTone(440 + foundCount * 110, 0.22);
      addStar(1);
      var numClip = NUM_CLIPS[foundCount];
      if(foundCount >= goalCount){
        playSparkleChime();
        showerConfetti();
        var icons = [];
        for(var k = 0; k < goalCount; k++) icons.push(curTarget.emo);
        winIcons.textContent = icons.join(" ");
        var winClip = resolveClip("hoot-fnd-win", PRAISE[roundIdx % PRAISE.length]);
        sayClips([numClip, winClip], true);
        var tok = ++roundTok;
        afterVoice(function(){
          if(!dead && tok === roundTok) winOverlay.hidden = false;
        }, 900, 3200);
      } else {
        sayClips([numClip, PRAISE[(roundIdx + foundCount) % PRAISE.length]], true);
        armIdle();
      }
    } else {
      btn.classList.remove("wiggle"); void btn.offsetWidth; btn.classList.add("wiggle");
      playTone(175, 0.16);
      sayClips(["hoot-look-closely.mp3"], true);
      armIdle();
    }
  }

  /* Interactive draggable magnifying glass */
  var dragging = false, dragOffX = 0, dragOffY = 0;
  function updateMagnify(clientX, clientY){
    garden.querySelectorAll(".item-btn:not(.found)").forEach(function(b){
      var r = b.getBoundingClientRect();
      var dx = (r.left + r.width / 2) - clientX;
      var dy = (r.top + r.height / 2) - clientY;
      b.classList.toggle("magnified", Math.hypot(dx, dy) < 78);
    });
  }
  magGlass.addEventListener("pointerdown", function(e){
    e.preventDefault();
    unlockAudioOnce();
    dragging = true;
    try{ magGlass.setPointerCapture(e.pointerId); }catch(err){}
    var mr = magGlass.getBoundingClientRect();
    dragOffX = e.clientX - mr.left;
    dragOffY = e.clientY - mr.top;
    magGlass.style.right = "auto";
    magGlass.style.bottom = "auto";
    var gr = garden.getBoundingClientRect();
    magGlass.style.left = (mr.left - gr.left) + "px";
    magGlass.style.top = (mr.top - gr.top) + "px";
  });
  magGlass.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var gr = garden.getBoundingClientRect();
    var nx = Math.max(0, Math.min(gr.width - magGlass.offsetWidth, e.clientX - gr.left - dragOffX));
    var ny = Math.max(0, Math.min(gr.height - magGlass.offsetHeight, e.clientY - gr.top - dragOffY));
    magGlass.style.left = nx + "px";
    magGlass.style.top = ny + "px";
    updateMagnify(gr.left + nx + magGlass.offsetWidth * 0.42, gr.top + ny + magGlass.offsetHeight * 0.42);
  });
  function stopDrag(){
    if(!dragging) return;
    dragging = false;
    /* If dropped right on a matching magnified treasure, collect it automatically! (Drag-or-tap support!) */
    var hotMatch = garden.querySelector('.item-btn.magnified[data-match="1"]:not(.found)');
    garden.querySelectorAll(".item-btn.magnified").forEach(function(b){ b.classList.remove("magnified"); });
    if(hotMatch){
      onItemTap(hotMatch, { t: curTarget, match: true });
    }
  }
  magGlass.addEventListener("pointerup", stopDrag);
  magGlass.addEventListener("pointercancel", stopDrag);

  function syncModeButtons(){
    var isEasy = difficulty === "easy";
    modeEasyBtn.classList.toggle("active", isEasy);
    modeEasyBtn.setAttribute("aria-pressed", String(isEasy));
    modeTreasureBtn.classList.toggle("active", !isEasy);
    modeTreasureBtn.setAttribute("aria-pressed", String(!isEasy));
  }

  modeTreasureBtn.addEventListener("click", function(){
    unlockAudioOnce();
    difficulty = "normal";
    syncModeButtons();
    startRound(false);
  });
  modeEasyBtn.addEventListener("click", function(){
    unlockAudioOnce();
    difficulty = "easy";
    syncModeButtons();
    startRound(false);
  });
  soundBtn.addEventListener("click", function(){
    muted = !muted;
    soundBtn.textContent = muted ? "🔇" : "🔊";
    if(muted) clearVoice();
    else { unlockAudioOnce(); speakPrompt(false); }
  });
  targetPill.addEventListener("click", function(){ unlockAudioOnce(); cheerHoot(); speakPrompt(false); });
  hootDetective.addEventListener("click", function(){
    unlockAudioOnce();
    cheerHoot();
    speakPrompt(false);
  });
  againBtn.addEventListener("click", function(){
    unlockAudioOnce();
    roundIdx++;
    startRound(false);
  });

  window.addEventListener("pagehide", function(){
    dead = true;
    clearIdle();
    clearVoice();
  });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) clearVoice();
  });

  syncModeButtons();
  startRound(true);

  window.__findGame = {
    snapshot: function(){
      return {
        difficulty: difficulty,
        isRiley: IS_RILEY,
        targetId: curTarget.id,
        goalCount: goalCount,
        foundCount: foundCount,
        stars: stars,
        itemCount: garden.querySelectorAll(".item-btn").length,
        winShown: !winOverlay.hidden
      };
    }
  };
})();
</script>
