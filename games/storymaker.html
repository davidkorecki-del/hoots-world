<!doctype html>
<html lang="en" class="hw-storymaker">
<head>
<base href="../">
<script>
window.__HOOT_GAME_KEY__="storymaker";
window.__HOOT_SELF_COACH__=true;
</script>
<script src="js/hoot-game-head.js?v=llprev3e146"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Make Your Own Family Storybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

<style>
  :root{
    --ink:#21314d;
    --cream:#fffdf7;
    --parchment:#fff7e3;
    --wood:#c58446;
    --wood-dark:#7e471a;
    --gold:#ffc837;
    --gold-dark:#c78400;
    --coral:#ff5851;
    --coral-dark:#b8201a;
    --emerald:#2ec47b;
    --emerald-dark:#14814c;
    --sky:#38b6ff;
    --sky-dark:#1275b8;
    --violet:#8a63f8;
    --violet-dark:#5430b8;
    --shadow-soft:0 12px 28px rgba(72,42,14,.18);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
  }
  body{
    font-family:"Fredoka","Nunito",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:#f7e2b9;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ==================== STAGE BACKDROP ==================== */
  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(circle at 18% 8%, rgba(255,248,215,.92) 0%, rgba(255,248,215,0) 45%),
      radial-gradient(circle at 86% 12%, rgba(255,226,162,.65) 0%, rgba(255,226,162,0) 44%),
      repeating-linear-gradient(90deg, rgba(164,104,46,.055) 0 48px, rgba(164,104,46,.018) 48px 96px),
      linear-gradient(180deg, #fff5dc 0%, #f5dcad 62%, #eac284 100%);
    transition:background .45s ease;
  }
  #stage.read-mode{
    background:
      radial-gradient(circle at 50% 34%, rgba(255,226,140,.22) 0%, rgba(255,226,140,0) 56%),
      radial-gradient(circle at 15% 15%, rgba(138,99,248,.28) 0%, rgba(138,99,248,0) 42%),
      radial-gradient(circle at 85% 20%, rgba(56,182,255,.22) 0%, rgba(56,182,255,0) 40%),
      linear-gradient(180deg, #1b1742 0%, #2a2060 55%, #191338 100%);
  }

  /* Twinkling theater stars in Read Mode */
  #theaterStars{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity .45s ease;
    z-index:0;
  }
  #stage.read-mode #theaterStars{ opacity:1; }
  .t-star{
    position:absolute;
    width:10px; height:10px;
    border-radius:50%;
    background:#ffe985;
    box-shadow:0 0 10px #ffe985;
    animation:twinkle 2.8s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.3; transform:scale(.75); }
    50%{ opacity:1; transform:scale(1.25); }
  }

  /* ==================== TOP HUD BAR ==================== */
  #topbar{
    position:relative;
    z-index:15;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:max(6px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left));
    min-height:76px;
  }
  .hud-group{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }

  /* Tactile Chunky Buttons (>=64px floor) */
  .sb-btn{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 14px;
    border-radius:20px;
    border:3.5px solid #fff;
    background:var(--cream);
    color:var(--ink);
    font-family:"Fredoka","Nunito",sans-serif;
    font-size:22px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(88,52,18,.26), 0 8px 16px rgba(88,52,18,.14);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), box-shadow .14s, background .18s;
    flex:0 0 auto;
    line-height:1;
  }
  .sb-btn:active{ transform:translateY(3px) scale(.95); }
  .sb-btn:disabled{ opacity:.42; pointer-events:none; }
  .sb-btn.round{ width:64px; padding:0; border-radius:50%; }
  .sb-btn .ico{ font-size:28px; line-height:1; display:inline-flex; align-items:center; justify-content:center; }
  .sb-btn .lbl{ font-size:18px; letter-spacing:.01em; white-space:nowrap; }

  .sb-btn.mode-create.active{
    background:linear-gradient(180deg, #ffe77a, #ffc837);
    color:#3a2400;
    box-shadow:0 5px 0 var(--gold-dark), 0 0 0 3.5px #fff, 0 0 16px rgba(255,200,55,.45);
  }
  .sb-btn.mode-read{
    background:linear-gradient(180deg, #5be39d, #25b86e);
    color:#fff;
    text-shadow:0 1.5px 0 rgba(12,78,44,.4);
    box-shadow:0 5px 0 var(--emerald-dark), 0 8px 18px rgba(37,184,110,.3);
  }
  .sb-btn.mode-read.active{
    background:linear-gradient(180deg, #a78bfa, #7c4dff);
    box-shadow:0 5px 0 var(--violet-dark), 0 0 0 3.5px #ffe985, 0 0 22px rgba(167,139,250,.55);
  }

  /* Page Dots Pill */
  #pageNavPill{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,253,247,.9);
    border:3.5px solid #fff;
    border-radius:999px;
    padding:4px 8px;
    box-shadow:0 4px 0 rgba(88,52,18,.18);
  }
  #stage.read-mode #pageNavPill{
    background:rgba(255,255,255,.16);
    border-color:rgba(255,255,255,.42);
    box-shadow:0 4px 14px rgba(0,0,0,.28);
  }
  .page-dot{
    position:relative;
    width:46px;
    height:46px;
    min-width:46px;
    min-height:46px;
    border-radius:50%;
    border:3px solid rgba(33,49,77,.15);
    background:#fff3d6;
    color:var(--ink);
    font-family:"Fredoka",sans-serif;
    font-size:20px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1), background .18s;
  }
  .page-dot:active{ transform:scale(.92); }
  .page-dot.active{
    background:linear-gradient(180deg, #5cc6ff, #2395e8);
    color:#fff;
    border-color:#fff;
    transform:scale(1.1);
    box-shadow:0 3px 0 #0e63a3, 0 0 0 2.5px #ffe46b;
  }
  .page-dot.has-audio::after{
    content:"🎙️";
    position:absolute;
    top:-6px; right:-6px;
    font-size:13px;
    line-height:1;
    background:#ff5851;
    border:2px solid #fff;
    border-radius:50%;
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 4px rgba(0,0,0,.2);
  }

  /* Star Bank */
  #starBank{
    height:56px;
    padding:0 14px;
    border-radius:999px;
    background:linear-gradient(180deg, #fff6cf, #ffe07c);
    border:3.5px solid #fff;
    box-shadow:0 4px 0 #c98600, 0 6px 14px rgba(199,132,0,.22);
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:22px;
    font-weight:700;
    color:#6b4100;
    flex:0 0 auto;
  }
  #starBank.pop{ animation:starPop .48s cubic-bezier(.34,1.7,.5,1); }
  @keyframes starPop{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.24) rotate(-5deg); }
    100%{ transform:scale(1); }
  }

  /* ==================== MAIN WORKSPACE ==================== */
  #workspace{
    position:relative;
    z-index:5;
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:108px minmax(0, 1fr) 172px;
    gap:10px;
    padding:2px max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    align-items:stretch;
  }
  #stage.read-mode #workspace{
    grid-template-columns:minmax(0, 1fr);
    padding:4px max(20px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  #stage.read-mode #sceneRail,
  #stage.read-mode #stickerRail{
    display:none;
  }

  /* ==================== LEFT SCENE RAIL ==================== */
  #sceneRail{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:rgba(255,253,247,.76);
    border:3.5px solid rgba(255,255,255,.92);
    border-radius:26px;
    padding:8px 6px;
    box-shadow:0 8px 20px rgba(112,68,24,.14);
    min-height:0;
    overflow:hidden;
  }
  .scene-btn{
    position:relative;
    width:78px;
    height:68px;
    min-width:64px;
    min-height:64px;
    border-radius:20px;
    border:3.5px solid #fff;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1px;
    padding:2px;
    font-family:"Fredoka",sans-serif;
    box-shadow:0 4px 0 rgba(33,49,77,.2);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), box-shadow .16s;
    flex:0 0 auto;
    overflow:hidden;
  }
  .scene-btn:active{ transform:translateY(2px) scale(.94); }
  .scene-btn.active{
    transform:scale(1.06);
    box-shadow:0 4px 0 var(--ink), 0 0 0 3.5px var(--gold), 0 8px 18px rgba(33,49,77,.25);
  }
  .scene-btn .s-ico{ font-size:32px; line-height:1; filter:drop-shadow(0 2px 2px rgba(0,0,0,.18)); }
  .scene-btn[data-bg="forest"]{ background:linear-gradient(180deg, #9be7ff 0%, #7ee288 65%, #37b24d 100%); }
  .scene-btn[data-bg="space"]{ background:linear-gradient(180deg, #1a1f5c 0%, #4b2d96 100%); }
  .scene-btn[data-bg="beach"]{ background:linear-gradient(180deg, #65d6ff 0%, #5de0d9 58%, #ffd875 100%); }
  .scene-btn[data-bg="bedroom"]{ background:linear-gradient(180deg, #e5c6ff 0%, #ffb7d5 60%, #ffe6a8 100%); }
  .scene-btn[data-bg="dino"]{ background:linear-gradient(180deg, #ffd485 0%, #8cd96c 65%, #4fa347 100%); }
  .scene-btn.paint-import{
    background:linear-gradient(135deg, #ff7eb3 0%, #ffcf56 50%, #56ccf2 100%);
  }
  .paint-badge{
    position:absolute;
    top:2px; right:3px;
    min-width:20px; height:20px;
    padding:0 5px;
    border-radius:999px;
    background:#21314d;
    color:#fff;
    font-size:11px;
    font-weight:800;
    display:none;
    align-items:center;
    justify-content:center;
    border:2px solid #fff;
  }
  .paint-badge.show{ display:flex; }

  /* ==================== CENTER BOOK STAGE ==================== */
  #centerCol{
    position:relative;
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
    gap:8px;
    align-items:center;
    justify-content:center;
  }

  #bookFrameWrap{
    position:relative;
    flex:1 1 auto;
    width:100%;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #stage.read-mode #bookFrameWrap{
    max-width:980px;
  }

  /* Hardcover Storybook Shell */
  #bookCover{
    position:relative;
    width:100%;
    height:100%;
    max-width:860px;
    max-height:600px;
    background:linear-gradient(180deg, #f3a64b, #cf7424);
    border-radius:28px;
    padding:10px 10px 12px 14px;
    box-shadow:
      0 14px 32px rgba(68,36,10,.26),
      0 6px 0 #9c5012,
      inset 0 2px 0 rgba(255,255,255,.45);
    display:flex;
    transition:transform .35s cubic-bezier(.34,1.3,.5,1);
  }
  #stage.read-mode #bookCover{
    max-width:940px;
    max-height:610px;
    background:linear-gradient(180deg, #ffd166, #d9821e);
    box-shadow:
      0 22px 54px rgba(0,0,0,.52),
      0 8px 0 #945109,
      0 0 42px rgba(255,212,102,.25);
  }

  /* Decorative Book Spine on Left Edge */
  #bookSpine{
    position:absolute;
    left:4px; top:14px; bottom:14px;
    width:12px;
    border-radius:8px;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.32) 0 12px, rgba(126,71,26,.22) 12px 24px);
    pointer-events:none;
    z-index:4;
  }

  /* Actual Illustrated Page */
  #bookPage{
    position:relative;
    flex:1 1 auto;
    width:100%;
    height:100%;
    border-radius:20px;
    background:#fffdf6;
    border:4px solid #fffdf6;
    overflow:hidden;
    box-shadow:inset 8px 0 18px rgba(102,60,18,.12), inset 0 0 0 2px rgba(255,255,255,.6);
    transform-origin:left center;
    touch-action:none;
  }
  #bookPage.turn-next{ animation:pageTurnNext .46s cubic-bezier(.25,.9,.35,1); }
  #bookPage.turn-prev{ animation:pageTurnPrev .46s cubic-bezier(.25,.9,.35,1); }
  @keyframes pageTurnNext{
    0%{ transform:perspective(1100px) rotateY(0deg) scale(1); }
    42%{ transform:perspective(1100px) rotateY(-24deg) scale(.97); opacity:.78; }
    100%{ transform:perspective(1100px) rotateY(0deg) scale(1); opacity:1; }
  }
  @keyframes pageTurnPrev{
    0%{ transform:perspective(1100px) rotateY(0deg) scale(1); }
    42%{ transform:perspective(1100px) rotateY(22deg) scale(.97); opacity:.78; }
    100%{ transform:perspective(1100px) rotateY(0deg) scale(1); opacity:1; }
  }

  #sceneLayer{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  #sceneLayer svg{
    width:100%;
    height:100%;
    display:block;
  }
  #scenePaintImg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }
  #scenePaintImg.show{ display:block; }

  /* Subtle page number corner badge */
  #pageCornerBadge{
    position:absolute;
    bottom:10px;
    right:12px;
    z-index:6;
    min-width:40px;
    height:34px;
    padding:0 11px;
    border-radius:999px;
    background:rgba(255,253,247,.88);
    border:2.5px solid #fff;
    color:var(--ink);
    font-size:16px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    box-shadow:0 3px 8px rgba(33,49,77,.18);
    pointer-events:none;
  }

  /* Stickers Layer */
  #stickerLayer{
    position:absolute;
    inset:0;
    z-index:4;
    overflow:hidden;
  }

  /* Placed Sticker Cutout */
  .placed-sticker{
    position:absolute;
    width:clamp(74px, 12vw, 114px);
    height:clamp(74px, 12vw, 114px);
    transform:translate(-50%, -50%);
    cursor:grab;
    touch-action:none;
    display:flex;
    align-items:center;
    justify-content:center;
    filter:drop-shadow(0 6px 8px rgba(24,38,66,.26));
    transition:filter .15s;
    z-index:5;
  }
  .placed-sticker svg{
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
    animation:gentleBob 3.6s ease-in-out infinite;
  }
  .placed-sticker.dragging{
    cursor:grabbing;
    z-index:25;
    filter:drop-shadow(0 14px 18px rgba(24,38,66,.35));
  }
  .placed-sticker.dragging svg{
    animation:none;
    transform:scale(1.14) rotate(-3deg);
  }
  .placed-sticker.pop-in{
    animation:stickerPopIn .42s cubic-bezier(.34,1.7,.5,1);
  }
  .placed-sticker.boing svg{
    animation:stickerBoing .48s cubic-bezier(.34,1.7,.5,1);
  }
  @keyframes gentleBob{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-4px) rotate(1.5deg); }
  }
  @keyframes stickerPopIn{
    0%{ transform:translate(-50%,-50%) scale(.2) rotate(-14deg); opacity:0; }
    70%{ transform:translate(-50%,-50%) scale(1.16) rotate(4deg); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(1) rotate(0deg); opacity:1; }
  }
  @keyframes stickerBoing{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.24, .86) translateY(-10px); }
    60%{ transform:scale(.92, 1.14) translateY(-16px) rotate(-6deg); }
    100%{ transform:scale(1) translateY(0) rotate(0deg); }
  }

  /* FX Layer (sparkles + confetti) */
  #fxLayer{
    position:absolute;
    inset:0;
    z-index:12;
    pointer-events:none;
    overflow:hidden;
  }
  .sparkle-dot{
    position:absolute;
    width:14px; height:14px;
    border-radius:50%;
    pointer-events:none;
    animation:sparkFly .72s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes sparkFly{
    0%{ transform:translate(-50%,-50%) scale(.5); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0); opacity:0; }
  }
  .confetti-piece{
    position:absolute;
    top:-16px;
    width:12px; height:18px;
    border-radius:4px;
    pointer-events:none;
    animation:confettiFall var(--dur, 2.2s) linear forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    85%{ opacity:1; }
    100%{ transform:translateY(115vh) rotate(var(--rot, 540deg)); opacity:0; }
  }

  /* Recording Live Overlay Pill inside Page */
  #recLivePill{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    background:rgba(220,38,38,.94);
    color:#fff;
    border:3px solid #fff;
    border-radius:999px;
    padding:6px 16px;
    display:none;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:700;
    box-shadow:0 8px 22px rgba(184,32,26,.42);
  }
  #recLivePill.show{ display:flex; }
  .rec-dot{
    width:14px; height:14px;
    border-radius:50%;
    background:#fff;
    animation:recPulse .8s ease-in-out infinite;
  }
  @keyframes recPulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.35); opacity:.45; }
  }

  /* Friendly Floating Toast (mic fallback / saved / etc.) */
  #toastPill{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%) translateY(-10px);
    z-index:20;
    background:rgba(33,49,77,.92);
    color:#fff;
    border:3px solid #ffe07c;
    border-radius:999px;
    padding:8px 18px;
    font-size:17px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
    opacity:0;
    pointer-events:none;
    transition:opacity .24s, transform .24s;
    white-space:nowrap;
    max-width:92%;
  }
  #toastPill.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* Theater Finale Ribbon (Page 4 celebration — NOT #winOverlay so family never gets auto-exited!) */
  #theaterFinale{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%) scale(.9);
    z-index:16;
    background:linear-gradient(180deg, #fffdf4, #ffefc2);
    border:4px solid #ffc837;
    border-radius:26px;
    padding:10px 18px;
    box-shadow:0 14px 32px rgba(0,0,0,.38);
    display:none;
    align-items:center;
    gap:12px;
    max-width:92%;
  }
  #theaterFinale.show{
    display:flex;
    animation:finalePop .48s cubic-bezier(.34,1.6,.5,1) forwards;
  }
  @keyframes finalePop{
    0%{ opacity:0; transform:translateX(-50%) translateY(20px) scale(.75); }
    100%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  }
  .finale-title{
    font-size:22px;
    font-weight:700;
    color:#7c4700;
    white-space:nowrap;
  }

  /* ==================== BOTTOM ACTION / VOICE BAR ==================== */
  #actionBar{
    flex:0 0 auto;
    width:100%;
    max-width:860px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:2px 4px;
  }
  #stage.read-mode #actionBar{
    max-width:940px;
  }

  /* Record Button */
  #recBtn{
    background:linear-gradient(180deg, #ff7068, #e6352e);
    color:#fff;
    box-shadow:0 5px 0 var(--coral-dark), 0 8px 18px rgba(230,53,46,.32);
    min-width:74px;
  }
  #recBtn.recording{
    background:linear-gradient(180deg, #ff3b30, #b81510);
    box-shadow:0 5px 0 #700805, 0 0 0 4px #ffe46b, 0 0 24px rgba(255,59,48,.75);
    animation:recBtnGlow 1s ease-in-out infinite;
  }
  @keyframes recBtnGlow{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }

  /* Play Recorded Voice Button */
  #voicePlayBtn{
    background:linear-gradient(180deg, #52df95, #1fb267);
    color:#fff;
    box-shadow:0 5px 0 var(--emerald-dark), 0 8px 18px rgba(31,178,103,.28);
  }
  #voicePlayBtn.empty{
    background:linear-gradient(180deg, #e7edf5, #cfd8e5);
    color:#718099;
    box-shadow:0 4px 0 #a3b0c4;
  }
  #voicePlayBtn.playing{
    background:linear-gradient(180deg, #62ccff, #1f8ee6);
    box-shadow:0 5px 0 #0c5d9c, 0 0 0 4px #ffe46b;
  }

  /* Glowing Audio Visualizer Pill */
  #vizPill{
    height:64px;
    min-width:128px;
    padding:0 16px;
    border-radius:20px;
    background:rgba(255,253,247,.9);
    border:3.5px solid #fff;
    box-shadow:0 4px 0 rgba(88,52,18,.18);
    display:none;
    align-items:center;
    justify-content:center;
    gap:5px;
  }
  #stage.read-mode #vizPill{
    display:flex;
    background:rgba(255,255,255,.15);
    border-color:rgba(255,255,255,.45);
    box-shadow:0 6px 18px rgba(0,0,0,.28);
  }
  #vizPill.live{
    display:flex;
    border-color:#ffe46b;
    box-shadow:0 0 18px rgba(255,228,107,.5);
  }
  .v-bar{
    width:7px;
    height:12px;
    border-radius:999px;
    background:linear-gradient(180deg, #ffe066, #ff6b6b);
    transition:height .09s ease;
  }
  #vizPill.playing .v-bar{
    background:linear-gradient(180deg, #69f0ae, #38b6ff);
  }
  #vizPill.idle .v-bar{
    opacity:.45;
    height:10px;
  }

  /* Action Bar helper buttons */
  #undoBtn{
    background:linear-gradient(180deg, #fff8dc, #ffdf80);
    box-shadow:0 5px 0 #c78b00;
  }
  #clearBtn{
    background:linear-gradient(180deg, #ffd1c7, #ff9685);
    box-shadow:0 5px 0 #c44a38;
  }
  #starterBtn{
    background:linear-gradient(180deg, #d7c7ff, #a78bfa);
    color:#fff;
    box-shadow:0 5px 0 var(--violet-dark);
  }
  .nav-arrow-btn{
    background:linear-gradient(180deg, #63ccff, #2697ea);
    color:#fff;
    box-shadow:0 5px 0 var(--sky-dark), 0 8px 16px rgba(38,151,234,.28);
  }

  /* Show/hide Create vs Read action buttons */
  #stage.read-mode .create-only{ display:none !important; }
  #stage:not(.read-mode) .read-only{ display:none !important; }

  /* ==================== RIGHT STICKER TRAY ==================== */
  #stickerRail{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    grid-auto-rows:minmax(64px, 1fr);
    gap:7px;
    background:rgba(255,253,247,.78);
    border:3.5px solid rgba(255,255,255,.94);
    border-radius:26px;
    padding:8px;
    box-shadow:0 8px 20px rgba(112,68,24,.14);
    min-height:0;
    overflow:hidden;
  }
  .sticker-btn{
    width:100%;
    height:100%;
    min-width:64px;
    min-height:64px;
    border-radius:18px;
    border:3px solid #fff;
    background:linear-gradient(180deg, #ffffff, #fff5dc);
    box-shadow:0 4px 0 rgba(132,84,32,.2);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
    cursor:pointer;
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .15s;
  }
  .sticker-btn:hover{ background:linear-gradient(180deg, #ffffff, #ffebaf); }
  .sticker-btn:active{ transform:translateY(2px) scale(.92); }
  .sticker-btn svg{
    width:52px;
    height:52px;
    display:block;
    pointer-events:none;
  }

  /* ==================== MY PAINTINGS MODAL ==================== */
  #paintModal{
    position:fixed;
    inset:0;
    z-index:60;
    background:rgba(22,28,48,.62);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  #paintModal[hidden]{ display:none; }
  .modal-card{
    width:min(640px, 94vw);
    max-height:84dvh;
    background:var(--cream);
    border:5px solid #fff;
    border-radius:30px;
    box-shadow:0 22px 54px rgba(16,24,48,.38);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background:linear-gradient(180deg, #ffe799, #ffd059);
    border-bottom:3px solid #fff;
  }
  .modal-title{
    font-size:24px;
    font-weight:700;
    color:#523000;
    display:flex;
    align-items:center;
    gap:8px;
  }
  #paintGrid{
    padding:14px;
    overflow-y:auto;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:12px;
  }
  .paint-thumb-btn{
    position:relative;
    aspect-ratio:4 / 3;
    min-height:96px;
    border-radius:18px;
    border:4px solid #fff;
    padding:0;
    overflow:hidden;
    background:#fff7e6;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(33,49,77,.18), 0 8px 16px rgba(33,49,77,.14);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1);
  }
  .paint-thumb-btn:active{ transform:scale(.95); }
  .paint-thumb-btn img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .paint-empty{
    grid-column:1 / -1;
    text-align:center;
    padding:28px 16px;
    font-size:20px;
    font-weight:700;
    color:#526480;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .paint-empty .big-ico{ font-size:56px; line-height:1; }

  /* ==================== IPAD LANDSCAPE TUNING (1024x768) ==================== */
  @media (max-width:1100px) and (min-width:701px){
    #workspace{
      grid-template-columns:96px minmax(0, 1fr) 156px;
      gap:8px;
    }
    .scene-btn{ width:74px; height:64px; }
    .sticker-btn svg{ width:46px; height:46px; }

  /* ==================== MOBILE PORTRAIT (iPhone 390x844) ==================== */
  @media (max-width:700px){
    #topbar{
      padding:max(6px, env(safe-area-inset-top)) 8px 4px 8px;
      gap:6px;
      min-height:72px;
    }
    .hud-group{ gap:6px; }
    .sb-btn .lbl{ display:none; }
    .sb-btn{ padding:0 10px; }
    .sb-btn.mode-create, .sb-btn.mode-read{ width:64px; padding:0; }

    #pageNavPill{ padding:3px 5px; gap:4px; }
    .page-dot{ width:36px; height:36px; min-width:36px; min-height:36px; font-size:17px; }
    .page-dot.has-audio::after{ width:18px; height:18px; font-size:10px; top:-5px; right:-5px; }

    #starBank{ height:48px; padding:0 10px; font-size:18px; }

    #workspace{
      grid-template-columns:minmax(0, 1fr);
      grid-template-rows:74px minmax(0, 1fr) 146px;
      gap:6px;
      padding:2px 8px max(8px, env(safe-area-inset-bottom)) 8px;
    }
    #stage.read-mode #workspace{
      grid-template-rows:minmax(0, 1fr);
      padding:4px 10px max(10px, env(safe-area-inset-bottom)) 10px;
    }

    /* Scene Strip becomes horizontal scrollable bar with >=64px tiles */
    #sceneRail{
      flex-direction:row;
      justify-content:flex-start;
      padding:4px 6px;
      border-radius:22px;
      gap:6px;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-width:none;
    }
    #sceneRail::-webkit-scrollbar{ display:none; }
    .scene-btn{
      width:64px;
      height:64px;
      min-width:64px;
      min-height:64px;
      border-radius:18px;
    }

    #bookCover{
      padding:7px 7px 9px 10px;
      border-radius:22px;
      max-height:none;
    }
    #bookPage{ border-radius:15px; }
    .placed-sticker{
      width:74px;
      height:74px;
    }

    #actionBar{
      gap:6px;
      padding:0;
      justify-content:space-between;
    }
    #actionBar .sb-btn{
      min-width:64px;
      width:64px;
      height:64px;
      padding:0;
      border-radius:18px;
    }
    #recBtn{ min-width:64px; width:64px; }
    #clearBtn{
      position:absolute;
      top:12px;
      right:12px;
      z-index:12;
      opacity:.94;
    }
    #starterBtn{ display:none; }
    #vizPill{ min-width:92px; padding:0 10px; height:64px; }
    #vizPill:not(.live){ display:none; }
    #stage.read-mode #vizPill{ display:flex; }

    /* Sticker Tray becomes clean 2-row horizontal scrollable dock with >=64px buttons */
    #stickerRail{
      display:grid;
      grid-template-rows:repeat(2, 64px);
      grid-auto-flow:column;
      grid-auto-columns:64px;
      grid-template-columns:none;
      gap:6px;
      padding:6px;
      border-radius:22px;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-width:none;
      align-content:center;
    }
    #stickerRail::-webkit-scrollbar{ display:none; }
    .sticker-btn{
      width:64px;
      height:64px;
      min-width:64px;
      min-height:64px;
      border-radius:16px;
      padding:4px;
    }
    .sticker-btn svg{ width:48px; height:48px; }

    #theaterFinale{
      padding:8px 12px;
      gap:8px;
      bottom:10px;
    }
    .finale-title{ font-size:18px; }
  }

  /* Subtle scene animations */
  @keyframes cloudDrift{
    0%,100%{ transform:translateX(0); }
    50%{ transform:translateX(18px); }
  }
  @keyframes puffRise{
    0%{ transform:translateY(0) scale(.9); opacity:.85; }
    100%{ transform:translateY(-28px) scale(1.25); opacity:0; }
  }
  @keyframes starGlow{
    0%,100%{ opacity:.45; }
    50%{ opacity:1; }
  }
  .anim-cloud{ animation:cloudDrift 7s ease-in-out infinite; }
  .anim-puff{ animation:puffRise 3.2s ease-out infinite; }
  .anim-twinkle{ animation:starGlow 2.4s ease-in-out infinite; }
</style>
</head>
<body>
<div id="stage">
  <div id="theaterStars" aria-hidden="true"></div>

  <!-- TOP HUD -->
  <header id="topbar">
    <div class="hud-group">
      <button id="modeCreateBtn" class="sb-btn mode-create active" type="button" aria-label="Create Book">

    <aside id="sceneRail" aria-label="Page Backgrounds">
      <button class="scene-btn active" type="button" data-bg="forest" aria-label="Enchanted Forest">
        <span class="s-ico">🌲</span>
      </button>
      <button class="scene-btn" type="button" data-bg="space" aria-label="Outer Space">
        <span class="s-ico">🚀</span>
      </button>
      <button class="scene-btn" type="button" data-bg="beach" aria-label="Sunny Beach">
        <span class="s-ico">🏖️</span>
      </button>
      <button class="scene-btn" type="button" data-bg="bedroom" aria-label="Cozy Bedroom">
        <span class="s-ico">🛏️</span>
      </button>
      <button class="scene-btn" type="button" data-bg="dino" aria-label="Dino Valley">
        <span class="s-ico">🌋</span>
      </button>

    <!-- CENTER: OPEN STORYBOOK PAGE + VOICE & PAGE CONTROLS -->

      <!-- ACTION & VOICE BAR -->
      <div id="actionBar">
        <button id="prevPageBtn" class="sb-btn round nav-arrow-btn" type="button" aria-label="Previous Page">
          <span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 4.2c.9-.6 2 .1 2 1.2v13.2c0 1.1-1.1 1.8-2 1.2L6.8 13.2a1.4 1.4 0 0 1 0-2.4l9.7-6.6z"/></svg></span>

        <button id="recBtn" class="sb-btn create-only" type="button" aria-label="Record Family Voice">

        <button id="voicePlayBtn" class="sb-btn round empty" type="button" aria-label="Play Page Voice">

        <div id="vizPill" class="idle" aria-hidden="true">

          <span class="v-bar"></span>
          <span class="v-bar"></span>
          <span class="v-bar"></span>
          <span class="v-bar"></span>
          <span class="v-bar"></span>
          <span class="v-bar"></span>

        <button id="undoBtn" class="sb-btn round create-only" type="button" aria-label="Undo Sticker">

        <button id="nextPageBtn" class="sb-btn round nav-arrow-btn" type="button" aria-label="Next Page">

    <!-- RIGHT: 14 CAST & STICKER STAMPERS -->

<!-- MY PAINTINGS IMPORT MODAL -->
<div id="paintModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="My Paintings">

<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage");
  var bookPage = $("bookPage");
  var sceneSvgHost = $("sceneSvgHost");
  var scenePaintImg = $("scenePaintImg");
  var stickerLayer = $("stickerLayer");
  var fxLayer = $("fxLayer");
  var stickerRail = $("stickerRail");
  var pageCornerNum = $("pageCornerNum");
  var starBank = $("starBank");
  var starCountEl = $("starCount");
  var recBtn = $("recBtn");
  var recIco = $("recIco");
  var recLivePill = $("recLivePill");
  var recTimerText = $("recTimerText");
  var voicePlayBtn = $("voicePlayBtn");
  var voicePlayIco = $("voicePlayIco");
  var vizPill = $("vizPill");
  var vizBars = vizPill.querySelectorAll(".v-bar");
  var toastPill = $("toastPill");
  var theaterFinale = $("theaterFinale");
  var paintModal = $("paintModal");
  var paintGrid = $("paintGrid");
  var paintBadge = $("paintBadge");
  var prevPageBtn = $("prevPageBtn");
  var nextPageBtn = $("nextPageBtn");
  var undoBtn = $("undoBtn");
  var clearBtn = $("clearBtn");
  var starterBtn = $("starterBtn");
  var modeCreateBtn = $("modeCreateBtn");
  var modeReadBtn = $("modeReadBtn");

  /* ==================== PROFILE & STORAGE KEYS ==================== */
  function activeKidId(){
    try{
      if(window.parent && window.parent.__llActiveProfileId) return String(window.parent.__llActiveProfileId);
    }catch(e){}
    try{
      var p = localStorage.getItem("hootworld.activeProfile.v1");
      if(p) return String(p);
    }catch(e){}
    return "kida";
  }
  function bookStorageKey(){ return "hw.familybooks.v1." + activeKidId(); }
  function paintGalleryKey(){ return "hw.paint.gallery.v1." + activeKidId(); }

  /* ==================== WEBAUDIO SFX & VERIFIED VOICES ==================== */
  var actx = null;
  function ensureAudioCtx(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){
        try{ actx = new AC(); }catch(e){}
      }
    }
    if(actx && actx.state === "suspended"){
      try{ actx.resume(); }catch(e){}
    }
    return actx;
  }

  function playTone(freq, dur, type, vol, delay){
    var ctx = ensureAudioCtx();
    if(!ctx) return;
    var t = ctx.currentTime + (delay || 0);
    try{
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.14, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }catch(e){}
  }

  function sfxPop(){
    playTone(420, 0.09, "triangle", 0.16, 0);
    playTone(680, 0.11, "sine", 0.14, 0.04);
  }
  function sfxBoing(){
    var ctx = ensureAudioCtx();
    if(!ctx) return;
    var t = ctx.currentTime;
    try{
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(280, t);
      osc.frequency.exponentialRampToValueAtTime(620, t + 0.14);
      osc.frequency.exponentialRampToValueAtTime(440, t + 0.24);
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.28);
    }catch(e){}
  }
  function sfxPageTurn(){
    playTone(340, 0.08, "triangle", 0.1, 0);
    playTone(460, 0.1, "sine", 0.1, 0.05);
  }
  function sfxSparkle(){
    var notes = [523.25, 659.25, 783.99, 1046.5];
    for(var i = 0; i < notes.length; i++){
      playTone(notes[i], 0.16, "triangle", 0.12, i * 0.06);
    }
  }
  function sfxRecStart(){
    playTone(587.33, 0.09, "sine", 0.14, 0);
    playTone(880, 0.12, "sine", 0.14, 0.08);
  }
  function sfxRecStop(){
    playTone(660, 0.1, "triangle", 0.13, 0);
    playTone(880, 0.14, "triangle", 0.14, 0.07);
    playTone(1046.5, 0.2, "sine", 0.14, 0.14);
  }
  function sfxGentle(){
    playTone(392, 0.14, "sine", 0.1, 0);
    playTone(330, 0.18, "sine", 0.09, 0.11);
  }
  function sfxCelebrate(){
    var seq = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
    for(var i = 0; i < seq.length; i++){
      playTone(seq[i], 0.18, "triangle", 0.14, i * 0.085);
    }
  }

  /* Verified voice clips (all validated in origin/main assets/voice/) */
  var VERIFIED_VOICES = {
    great: "assets/voice/hoot-great-job.mp3",
    amazing: "assets/voice/hoot-amazing.mp3",
    star: "assets/voice/hoot-star.mp3",
    win: "assets/voice/hoot-win-yay.mp3",

  var STICKER_MAP = {};
  for(var si = 0; si < STICKERS.length; si++){
    STICKER_MAP[STICKERS[si].id] = STICKERS[si];
  }

  /* ==================== BOOK STATE & PERSISTENCE ==================== */
  var mode = "create"; /* "create" | "read" */
  var pageIdx = 0;
  var stars = 0;
  var pages = [];
  var savedPaintings = [];
  var nextUid = 1;
  var stickersAddedCount = 0;

  function makeStarterPages(){
    return [
      {
        bgId: "forest",
        bgDataUrl: null,
        items: [
          { uid: nextUid++, kind: "hoot", x: 34, y: 58 },
          { uid: nextUid++, kind: "rainbow", x: 66, y: 34 }
        ],
        audio: null,
        audioDur: 0
      },
      { bgId: "space", bgDataUrl: null, items: [], audio: null, audioDur: 0 },
      { bgId: "beach", bgDataUrl: null, items: [], audio: null, audioDur: 0 },
      { bgId: "bedroom", bgDataUrl: null, items: [], audio: null, audioDur: 0 }
    ];
  }

  function loadPaintings(){
    try{
      var raw = localStorage.getItem(paintGalleryKey());
      var arr = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(arr)) arr = [];
      savedPaintings = arr.map(function(item, i){
        var url = (typeof item === "string") ? item : (item && item.url ? item.url : "");
        return { idx: i, url: url };
      }).filter(function(x){ return !!x.url; });
    }catch(e){
      savedPaintings = [];
    }
    paintBadge.textContent = String(savedPaintings.length);
    paintBadge.classList.toggle("show", savedPaintings.length > 0);
    return savedPaintings;
  }

  function loadBook(){
    try{
      var raw = localStorage.getItem(bookStorageKey());
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.pages) && parsed.pages.length === 4){
          pages = parsed.pages.map(function(p, idx){
            var fallbackBgs = ["forest", "space", "beach", "bedroom"];
            var cleanItems = Array.isArray(p.items) ? p.items.map(function(it){
              return {
                uid: nextUid++,
                kind: STICKER_MAP[it.kind] ? it.kind : "hoot",
                x: clamp(Number(it.x) || 50, 8, 92),
                y: clamp(Number(it.y) || 55, 10, 90)
              };
            }) : [];
            return {
              bgId: String(p.bgId || fallbackBgs[idx]),
              bgDataUrl: p.bgDataUrl || null,
              items: cleanItems,
              audio: p.audio || null,
              audioDur: Number(p.audioDur) || 0
            };
          });
          stars = Math.max(0, Number(parsed.stars) || 0);
          return;
        }
      }
    }catch(e){}
    pages = makeStarterPages();
    stars = 0;
  }

  function persistBook(){
    var payload = {
      v: 1,
      stars: stars,
      updatedAt: Date.now(),
      pages: pages
    };
    try{
      localStorage.setItem(bookStorageKey(), JSON.stringify(payload));
      return true;
    }catch(e){
      /* Quota guard: preserve current page's audio first, trim oldest other page audio if needed */
      try{
        var slimPages = pages.map(function(p, idx){
          return {
            bgId: p.bgId,
            bgDataUrl: p.bgDataUrl,
            items: p.items,
            audio: idx === pageIdx ? p.audio : null,
            audioDur: idx === pageIdx ? p.audioDur : 0
          };
        });
        localStorage.setItem(bookStorageKey(), JSON.stringify({ v: 1, stars: stars, updatedAt: Date.now(), pages: slimPages }));
        return true;
      }catch(e2){
        try{
          var noAudioPages = pages.map(function(p){
            return { bgId: p.bgId, bgDataUrl: null, items: p.items, audio: null, audioDur: 0 };
          });
          localStorage.setItem(bookStorageKey(), JSON.stringify({ v: 1, stars: stars, updatedAt: Date.now(), pages: noAudioPages }));
        }catch(e3){}
        return false;
      }
    }
  }

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function awardStar(n){
    stars += (n || 1);
    starCountEl.textContent = String(stars);
    starBank.classList.remove("pop");
    void starBank.offsetWidth;
    starBank.classList.add("pop");
    persistBook();
  }

  /* ==================== TOAST & FX ==================== */
  var toastT = null;
  function showToast(msg, ms){
    toastPill.textContent = msg;
    toastPill.classList.add("show");
    if(toastT) clearTimeout(toastT);
    toastT = setTimeout(function(){
      toastPill.classList.remove("show");
    }, ms || 2800);
  }

  function burstSparkles(xPct, yPct, count){
    var colors = ["#ffd43b", "#ff6b6b", "#5ce1e6", "#a78bfa", "#52d669", "#ff9f68"];
    var n = count || 12;
    for(var i = 0; i < n; i++){
      var d = document.createElement("span");
      d.className = "sparkle-dot";
      var ang = (Math.PI * 2 * i / n) + (Math.random() * 0.45);
      var dist = 34 + Math.random() * 52;
      d.style.left = xPct + "%";
      d.style.top = yPct + "%";
      d.style.background = colors[i % colors.length];
      d.style.setProperty("--dx", Math.round(Math.cos(ang) * dist) + "px");
      d.style.setProperty("--dy", Math.round(Math.sin(ang) * dist) + "px");
      fxLayer.appendChild(d);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 760); })(d);
    }
  }

  function launchConfetti(){
    var colors = ["#ffd43b", "#ff595e", "#38b6ff", "#52d669", "#a78bfa", "#ff85a1", "#ff9f1c"];
    for(var i = 0; i < 42; i++){
      var c = document.createElement("span");
      c.className = "confetti-piece";
      c.style.left = (4 + Math.random() * 92) + "%";
      c.style.background = colors[i % colors.length];
      c.style.animationDelay = (Math.random() * 0.65) + "s";
      c.style.setProperty("--dur", (1.8 + Math.random() * 1.1) + "s");
      c.style.setProperty("--rot", Math.round((Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 360)) + "deg");
      fxLayer.appendChild(c);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 3200); })(c);
    }
  }

  /* ==================== RENDERING ==================== */
  function currentPage(){ return pages[pageIdx]; }

  function renderTheaterStars(){
    var host = $("theaterStars");
    var coords = [
      [8,14],[16,28],[24,10],[35,18],[48,8],[62,15],[74,9],[86,20],[92,35],
      [12,56],[88,62],[18,82],[82,84],[6,40],[94,50]
    ];
    var html = "";
    for(var i = 0; i < coords.length; i++){
      html += '<span class="t-star" style="left:'+coords[i][0]+'%;top:'+coords[i][1]+'%;animation-delay:'+(-i*0.35)+'s"></span>';
    }
    host.innerHTML = html;
  }

  function buildStickerTray(){
    stickerRail.innerHTML = "";
    STICKERS.forEach(function(st){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "sticker-btn";
      b.dataset.sticker = st.id;
      b.setAttribute("aria-label", "Add " + st.label);
      b.innerHTML = st.svg();
      b.addEventListener("click", function(){
        addStickerToPage(st.id);
      });
      stickerRail.appendChild(b);
    });
  }

  function renderScene(){
    var pg = currentPage();
    if(pg.bgDataUrl && pg.bgId.indexOf("paint-") === 0){
      sceneSvgHost.innerHTML = "";
      scenePaintImg.src = pg.bgDataUrl;
      scenePaintImg.classList.add("show");
    } else {
      scenePaintImg.classList.remove("show");
      scenePaintImg.removeAttribute("src");
      var fn = SCENES[pg.bgId] || SCENES.forest;
      sceneSvgHost.innerHTML = fn();
    }

    var btns = document.querySelectorAll("#sceneRail .scene-btn");
    for(var i = 0; i < btns.length; i++){
      var b = btns[i];
      if(b.id === "paintImportBtn"){
        b.classList.toggle("active", pg.bgId.indexOf("paint-") === 0);
      } else {
        b.classList.toggle("active", b.dataset.bg === pg.bgId);
      }
    }
  }

  function makePlacedStickerEl(item, animatePop){
    var def = STICKER_MAP[item.kind] || STICKER_MAP.hoot;
    var el = document.createElement("div");
    el.className = "placed-sticker" + (animatePop ? " pop-in" : "");
    el.dataset.uid = String(item.uid);
    el.style.left = item.x + "%";
    el.style.top = item.y + "%";
    el.innerHTML = def.svg();
    attachStickerInteractions(el, item);
    return el;
  }

  function renderStickers(){
    stickerLayer.innerHTML = "";
    var pg = currentPage();
    for(var i = 0; i < pg.items.length; i++){
      stickerLayer.appendChild(makePlacedStickerEl(pg.items[i], false));
    }
  }

  function renderHud(){
    starCountEl.textContent = String(stars);
    pageCornerNum.textContent = (pageIdx + 1) + " / " + pages.length;

    var dots = document.querySelectorAll("#pageNavPill .page-dot");
    for(var i = 0; i < dots.length; i++){
      dots[i].classList.toggle("active", i === pageIdx);
      dots[i].classList.toggle("has-audio", !!(pages[i] && pages[i].audio));
    }

    prevPageBtn.disabled = (pageIdx === 0);
    nextPageBtn.disabled = (mode === "create" && pageIdx === pages.length - 1);
    var PLAY_SVG = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.2c-.9-.6-2 .1-2 1.2v13.2c0 1.1 1.1 1.8 2 1.2l9.7-6.6a1.4 1.4 0 0 0 0-2.4L7.5 4.2z"/></svg>';
    var STOP_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="4"/></svg>';
    if(mode === "read" && pageIdx === pages.length - 1){
      nextPageBtn.querySelector(".ico").textContent = "🎉";
      nextPageBtn.setAttribute("aria-label", "Celebrate Book");
      nextPageBtn.disabled = false;
    } else {
      nextPageBtn.querySelector(".ico").innerHTML = PLAY_SVG;
      nextPageBtn.setAttribute("aria-label", "Next Page");
    }

    var pg = currentPage();
    undoBtn.disabled = (pg.items.length === 0);
    clearBtn.disabled = (pg.items.length === 0 && !pg.audio);

    var hasAudio = !!pg.audio;
    voicePlayBtn.classList.toggle("empty", !hasAudio);
    voicePlayBtn.classList.toggle("playing", isPlayingUserAudio);
    voicePlayIco.innerHTML = isPlayingUserAudio ? STOP_SVG : PLAY_SVG;

    modeCreateBtn.classList.toggle("active", mode === "create");
    modeReadBtn.classList.toggle("active", mode === "read");
    stage.classList.toggle("read-mode", mode === "read");
  }

  function renderAll(){
    renderScene();
    renderStickers();
    renderHud();
  }

  /* ==================== STICKER ADD & DRAG ==================== */
  function addStickerToPage(kind){
    if(mode !== "create") return;
    var pg = currentPage();
    if(pg.items.length >= 24){
      showToast("✨ Lots of friends on this page!", 2000);
      sfxGentle();
      return;
    }
    /* Smart non-overlapping placement spread */
    var slots = [
      [50,55],[30,52],[70,52],[42,36],[60,36],[24,68],[76,68],[50,74],[35,28],[65,28]
    ];
    var s = slots[pg.items.length % slots.length];
    var x = clamp(s[0] + Math.round((Math.random() - 0.5) * 14), 14, 86);
    var y = clamp(s[1] + Math.round((Math.random() - 0.5) * 12), 18, 82);
    var item = { uid: nextUid++, kind: kind, x: x, y: y };
    pg.items.push(item);

    var el = makePlacedStickerEl(item, true);
    stickerLayer.appendChild(el);
    sfxPop();
    burstSparkles(x, y, 10);

    stickersAddedCount++;
    if(stickersAddedCount === 1 || stickersAddedCount % 5 === 0){
      awardStar(1);
    } else {
      persistBook();
    }
    renderHud();
  }

  function attachStickerInteractions(el, item){
    var startX = 0, startY = 0, moved = false, dragging = false;

    el.addEventListener("pointerdown", function(e){
      if(e.button && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      startX = e.clientX;
      startY = e.clientY;
      moved = false;
      dragging = (mode === "create");
      if(dragging){
        el.classList.add("dragging");
        try{ el.setPointerCapture(e.pointerId); }catch(err){}
      }
    });

    el.addEventListener("pointermove", function(e){
      if(!dragging) return;
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      if(Math.abs(dx) + Math.abs(dy) > 5) moved = true;
      if(!moved) return;
      var rect = bookPage.getBoundingClientRect();
      if(rect.width <= 0 || rect.height <= 0) return;
      var nx = clamp(((e.clientX - rect.left) / rect.width) * 100, 7, 93);
      var ny = clamp(((e.clientY - rect.top) / rect.height) * 100, 9, 91);
      item.x = Math.round(nx * 10) / 10;
      item.y = Math.round(ny * 10) / 10;
      el.style.left = item.x + "%";
      el.style.top = item.y + "%";
    });

    function finishDrag(e){
      if(dragging){
        el.classList.remove("dragging");
        try{ el.releasePointerCapture(e.pointerId); }catch(err){}
        dragging = false;
        if(moved){
          sfxPop();
          persistBook();
          return;
        }
      }
      /* Tap bounce! */
      el.classList.remove("boing");
      void el.offsetWidth;
      el.classList.add("boing");
      burstSparkles(item.x, item.y, 8);
      if(item.kind === "hoot"){
        sfxBoing();
        playHootClip("giggle");
      } else {
        sfxBoing();
      }
    }

    el.addEventListener("pointerup", finishDrag);
    el.addEventListener("pointercancel", function(){
      if(dragging){
        el.classList.remove("dragging");
        dragging = false;
      }
    });
  }

  /* ==================== REAL FAMILY VOICE RECORDING & PLAYBACK ==================== */
  var MAX_REC_SEC = 20;
  var isRecording = false;
  var isPlayingUserAudio = false;
  var mediaStream = null;
  var mediaRecorder = null;
  var recChunks = [];
  var recStartedAt = 0;
  var recTimerIv = null;
  var userAudioEl = null;
  var vizRaf = null;
  var recAnalyser = null;
  var recSourceNode = null;

  function stopVisualizer(){
    if(vizRaf){ cancelAnimationFrame(vizRaf); vizRaf = null; }
    vizPill.classList.remove("live", "playing");
    vizPill.classList.add("idle");
    for(var i = 0; i < vizBars.length; i++){
      vizBars[i].style.height = "10px";
    }
  }

  function startVisualizer(playingMode){
    stopVisualizer();
    vizPill.classList.remove("idle");
    vizPill.classList.add("live");
    if(playingMode) vizPill.classList.add("playing");

    var dataArr = recAnalyser ? new Uint8Array(recAnalyser.frequencyBinCount) : null;
    function step(ts){
      if(!isRecording && !isPlayingUserAudio){
        stopVisualizer();
        return;
      }
      if(isRecording && recAnalyser && dataArr){
        recAnalyser.getByteFrequencyData(dataArr);
        for(var i = 0; i < vizBars.length; i++){
          var bin = Math.min(dataArr.length - 1, 2 + i * 3);
          var val = dataArr[bin] / 255;
          var h = Math.round(10 + val * 34);
          vizBars[i].style.height = h + "px";
        }
      } else {
        for(var j = 0; j < vizBars.length; j++){
          var wave = 0.5 + 0.5 * Math.sin((ts * 0.009) + j * 0.85);
          var wave2 = 0.5 + 0.5 * Math.cos((ts * 0.014) - j * 0.5);
          var px = Math.round(10 + (wave * 0.65 + wave2 * 0.35) * 32);
          vizBars[j].style.height = px + "px";
        }
      }
      vizRaf = requestAnimationFrame(step);
    }
    vizRaf = requestAnimationFrame(step);
  }

  function stopUserPlayback(){
    if(userAudioEl){
      try{ userAudioEl.pause(); userAudioEl.currentTime = 0; }catch(e){}
      userAudioEl = null;
    }
    isPlayingUserAudio = false;
    stopVisualizer();
    renderHud();
  }

  function cleanupRecorderStream(){
    if(recTimerIv){ clearInterval(recTimerIv); recTimerIv = null; }
    if(recSourceNode){
      try{ recSourceNode.disconnect(); }catch(e){}
      recSourceNode = null;
    }
    recAnalyser = null;
    if(mediaStream){
      try{
        mediaStream.getTracks().forEach(function(t){ t.stop(); });
      }catch(e){}
      mediaStream = null;
    }
    mediaRecorder = null;
    isRecording = false;
    recBtn.classList.remove("recording");
    recIco.textContent = "🎙️";
    recLivePill.classList.remove("show");
    stopVisualizer();
  }

  function formatSec(sec){
    var s = Math.max(0, Math.min(MAX_REC_SEC, Math.floor(sec)));
    return "0:" + (s < 10 ? "0" + s : String(s));
  }

  function stopRecording(){
    if(!isRecording) return;
    if(mediaRecorder && mediaRecorder.state !== "inactive"){
      try{ mediaRecorder.stop(); }catch(e){ cleanupRecorderStream(); }
    } else {
      cleanupRecorderStream();
    }
  }

  function startRecording(){
    if(isRecording){
      stopRecording();
      return;
    }
    stopUserPlayback();
    stopHootVoice();

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined"){
      sfxGentle();
      showToast("🎙️ Mic unavailable on this device", 3200);
      return;
    }

    var targetPageIdx = pageIdx;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
      mediaStream = stream;
      recChunks = [];

      var mimeTypes = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
      var chosenMime = "";
      for(var i = 0; i < mimeTypes.length; i++){
        try{
          if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(mimeTypes[i])){
            chosenMime = mimeTypes[i];
            break;
          }
        }catch(e){}
      }

      try{
        mediaRecorder = chosenMime ? new MediaRecorder(stream, { mimeType: chosenMime }) : new MediaRecorder(stream);
      }catch(e){
        mediaRecorder = new MediaRecorder(stream);
      }

      /* Connect live analyser for dancing voice bars */
      try{
        var ctx = ensureAudioCtx();
        if(ctx){
          recSourceNode = ctx.createMediaStreamSource(stream);
          recAnalyser = ctx.createAnalyser();
          recAnalyser.fftSize = 64;
          recSourceNode.connect(recAnalyser);
        }
      }catch(e){}

      mediaRecorder.ondataavailable = function(ev){
        if(ev.data && ev.data.size > 0) recChunks.push(ev.data);
      };

      mediaRecorder.onstop = function(){
        var elapsed = Math.max(1, Math.round((Date.now() - recStartedAt) / 1000));
        var blobType = (mediaRecorder && mediaRecorder.mimeType) || chosenMime || "audio/webm";
        var chunksCopy = recChunks.slice();
        cleanupRecorderStream();

        if(!chunksCopy.length){
          sfxGentle();
          renderHud();
          return;
        }

        var blob = new Blob(chunksCopy, { type: blobType });
        var reader = new FileReader();
        reader.onloadend = function(){
          if(typeof reader.result === "string" && reader.result.indexOf("data:") === 0){
            pages[targetPageIdx].audio = reader.result;
            pages[targetPageIdx].audioDur = elapsed;
            var saved = persistBook();
            sfxRecStop();
            burstSparkles(50, 50, 18);
            awardStar(1);
            showToast(saved ? "🎙️ Story voice saved! ⭐" : "🎙️ Voice ready for this session!", 2400);
            setTimeout(function(){ playHootClip("great"); }, 350);
          }
          renderHud();
        };
        reader.onerror = function(){
          sfxGentle();
          renderHud();
        };
        reader.readAsDataURL(blob);
      };

      isRecording = true;
      recStartedAt = Date.now();
      recBtn.classList.add("recording");
      recIco.textContent = "⏹️";
      recTimerText.textContent = "0:00 / 0:20";
      recLivePill.classList.add("show");
      sfxRecStart();
      startVisualizer(false);

      try{
        mediaRecorder.start(250);
      }catch(e){
        cleanupRecorderStream();
        sfxGentle();
        showToast("🎙️ Could not start recording", 2800);
        return;
      }

      recTimerIv = setInterval(function(){
        var sec = (Date.now() - recStartedAt) / 1000;
        recTimerText.textContent = formatSec(sec) + " / 0:20";
        if(sec >= MAX_REC_SEC){
          stopRecording();
        }
      }, 150);
    }).catch(function(){
      cleanupRecorderStream();
      sfxGentle();
      showToast("🎙️ Turn on microphone to record!", 3200);
    });
  }

  function playPageVoice(onFinish){
    stopUserPlayback();
    var pg = currentPage();
    if(!pg.audio){
      if(mode === "create"){
        sfxGentle();
        showToast("🎙️ Tap red mic to record this page!", 2200);
      } else if(typeof onFinish === "function"){
        onFinish(false);
      }
      return;
    }
    stopHootVoice();
    try{
      var a = new Audio(pg.audio);
      userAudioEl = a;
      isPlayingUserAudio = true;
      startVisualizer(true);
      renderHud();

      a.addEventListener("ended", function(){
        if(userAudioEl === a){
          isPlayingUserAudio = false;
          userAudioEl = null;
          stopVisualizer();
          renderHud();
          if(typeof onFinish === "function") onFinish(true);
        }
      });
      a.addEventListener("error", function(){
        if(userAudioEl === a){
          isPlayingUserAudio = false;
          userAudioEl = null;
          stopVisualizer();
          renderHud();
          if(typeof onFinish === "function") onFinish(false);
        }
      });
      var pr = a.play();
      if(pr && pr.catch){
        pr.catch(function(){
          if(userAudioEl === a){
            isPlayingUserAudio = false;
            userAudioEl = null;
            stopVisualizer();
            renderHud();
            if(typeof onFinish === "function") onFinish(false);
          }
        });
      }
    }catch(e){
      isPlayingUserAudio = false;
      stopVisualizer();
      renderHud();
      if(typeof onFinish === "function") onFinish(false);
    }
  }

  /* ==================== NAVIGATION & MODES ==================== */
  var finaleShownOnRun = false;

  function triggerTheaterFinale(){
    if(mode !== "read") return;
    theaterFinale.classList.add("show");
    launchConfetti();
    sfxCelebrate();
    if(!finaleShownOnRun){
      finaleShownOnRun = true;
      awardStar(1);
      playHootClip("win");
    } else {
      playHootClip("amazing");
    }
  }

  function goToPage(newIdx, direction){
    if(newIdx < 0 || newIdx >= pages.length) return;
    if(isRecording) stopRecording();
    stopUserPlayback();
    theaterFinale.classList.remove("show");

    pageIdx = newIdx;
    bookPage.classList.remove("turn-next", "turn-prev");
    void bookPage.offsetWidth;
    if(direction === "next") bookPage.classList.add("turn-next");
    else if(direction === "prev") bookPage.classList.add("turn-prev");

    sfxPageTurn();
    renderAll();

    if(mode === "read"){
      var pg = currentPage();
      if(pg.audio){
        setTimeout(function(){
          if(mode !== "read" || pageIdx !== newIdx) return;
          playPageVoice(function(){
            if(mode === "read" && pageIdx === pages.length - 1){
              triggerTheaterFinale();
            }
          });
        }, 320);
      } else {
        if(pageIdx === pages.length - 1){
          setTimeout(function(){
            if(mode === "read" && pageIdx === pages.length - 1){
              triggerTheaterFinale();
            }
          }, 420);
        } else {
          playHootClip("turn");
        }
      }
    }
  }

  function setMode(nextMode){
    if(nextMode !== "create" && nextMode !== "read") return;
    if(isRecording) stopRecording();
    stopUserPlayback();
    theaterFinale.classList.remove("show");
    mode = nextMode;

    if(mode === "read"){
      finaleShownOnRun = false;
      pageIdx = 0;
      sfxSparkle();
      renderAll();
      var pg = currentPage();
      if(pg.audio){
        setTimeout(function(){
          if(mode === "read" && pageIdx === 0) playPageVoice();
        }, 350);
      } else {
        playHootClip("turn");
      }
    } else {
      sfxPop();
      renderAll();
    }
  }

  /* ==================== MY PAINTINGS MODAL ==================== */
  function openPaintModal(){
    loadPaintings();
    paintGrid.innerHTML = "";
    if(!savedPaintings.length){
      paintGrid.innerHTML = '<div class="paint-empty">'
        + '<div class="big-ico">🎨</div>'
        + '<div>No saved paintings yet!</div>'
        + '<div style="font-size:15px;opacity:.8;">Save a picture in Finger Paint Studio to use it here.</div>'
        + '</div>';
    } else {
      savedPaintings.forEach(function(item, i){
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "paint-thumb-btn";
        btn.setAttribute("aria-label", "Use Painting " + (i + 1));
        var img = document.createElement("img");
        img.src = item.url;
        img.alt = "Painting " + (i + 1);
        btn.appendChild(img);
        btn.addEventListener("click", function(){
          var pg = currentPage();
          pg.bgId = "paint-" + i;
          pg.bgDataUrl = item.url;
          persistBook();
          paintModal.hidden = true;
          sfxSparkle();
          burstSparkles(50, 50, 14);
          renderAll();
        });
        paintGrid.appendChild(btn);
      });
    }
    paintModal.hidden = false;
  }

  /* ==================== EVENT WIRING ==================== */
  modeCreateBtn.addEventListener("click", function(){ setMode("create"); });
  modeReadBtn.addEventListener("click", function(){ setMode("read"); });

  var pageDots = document.querySelectorAll("#pageNavPill .page-dot");
  for(var d = 0; d < pageDots.length; d++){
    (function(idx){
      pageDots[idx].addEventListener("click", function(){
        if(idx === pageIdx) return;
        goToPage(idx, idx > pageIdx ? "next" : "prev");
      });
    })(d);
  }

  prevPageBtn.addEventListener("click", function(){
    if(pageIdx > 0) goToPage(pageIdx - 1, "prev");
  });

  nextPageBtn.addEventListener("click", function(){
    if(pageIdx < pages.length - 1){
      goToPage(pageIdx + 1, "next");
    } else if(mode === "read"){
      triggerTheaterFinale();
    }
  });

  $("readAgainBtn").addEventListener("click", function(){
    finaleShownOnRun = false;
    goToPage(0, "prev");
  });

  /* Scene picker buttons */
  var sceneBtns = document.querySelectorAll("#sceneRail .scene-btn[data-bg]");
  for(var s = 0; s < sceneBtns.length; s++){
    (function(btn){
      btn.addEventListener("click", function(){
        var pg = currentPage();
        pg.bgId = btn.dataset.bg;
        pg.bgDataUrl = null;
        persistBook();
        sfxPop();
        burstSparkles(50, 35, 10);
        renderAll();
      });
    })(sceneBtns[s]);
  }

  $("paintImportBtn").addEventListener("click", function(){
    sfxPop();
    openPaintModal();
  });
  $("closePaintModalBtn").addEventListener("click", function(){
    sfxPop();
    paintModal.hidden = true;
  });
  paintModal.addEventListener("click", function(e){
    if(e.target === paintModal){
      sfxPop();
      paintModal.hidden = true;
    }
  });

  recBtn.addEventListener("click", function(){
    startRecording();
  });

  voicePlayBtn.addEventListener("click", function(){
    if(isPlayingUserAudio){
      stopUserPlayback();
    } else {
      playPageVoice();
    }
  });

  undoBtn.addEventListener("click", function(){
    var pg = currentPage();
    if(!pg.items.length) return;
    pg.items.pop();
    sfxGentle();
    persistBook();
    renderAll();
  });

  clearBtn.addEventListener("click", function(){
    var pg = currentPage();
    if(!pg.items.length && !pg.audio) return;
    stopUserPlayback();
    pg.items = [];
    pg.audio = null;
    pg.audioDur = 0;
    sfxGentle();
    playHootClip("clean");
    persistBook();
    renderAll();
  });

  starterBtn.addEventListener("click", function(){
    var pg = currentPage();
    var presets = [
      { bg: "forest", items: [{ kind:"hoot", x:34, y:58 }, { kind:"rainbow", x:66, y:34 }] },
      { bg: "space",  items: [{ kind:"rocket", x:36, y:48 }, { kind:"star", x:68, y:34 }, { kind:"zane", x:52, y:72 }] },
      { bg: "beach",  items: [{ kind:"riley", x:38, y:64 }, { kind:"puppy", x:64, y:68 }, { kind:"balloon", x:72, y:34 }] },
      { bg: "bedroom",items: [{ kind:"hoot", x:48, y:56 }, { kind:"unicorn", x:68, y:62 }, { kind:"crown", x:48, y:30 }] }
    ];
    var pre = presets[pageIdx % presets.length];
    pg.bgId = pre.bg;
    pg.bgDataUrl = null;
    pg.items = pre.items.map(function(it){
      return { uid: nextUid++, kind: it.kind, x: it.x, y: it.y };
    });
    sfxSparkle();
    burstSparkles(50, 50, 16);
    playHootClip("star");
    persistBook();
    renderAll();
  });

  /* ==================== SNAPSHOT API ==================== */
  window.__storyMaker = {
    snapshot: function(){
      loadPaintings();
      var pg = currentPage();
      return {
        mode: mode,
        pageIdx: pageIdx,
        pageCount: pages.length,
        bgId: pg ? pg.bgId : "forest",
        itemCount: pg ? pg.items.length : 0,
        hasAudioOnPage: !!(pg && pg.audio),
        savedPaintingsCount: savedPaintings.length,
        stars: stars
      };
    }
  };

  /* ==================== INIT ==================== */
  renderTheaterStars();
  buildStickerTray();
  loadPaintings();
  loadBook();
  renderAll();
})();
</script>
