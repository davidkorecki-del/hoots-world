<style>
  :root{
    --ink:#0f172a;
    --gold:#ffd43b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  [hidden]{display:none !important}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Fredoka","Nunito",system-ui,sans-serif;background:#070b1e;touch-action:none}
  #stage{
    position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  #fwCanvas{
    position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block;
    cursor:crosshair;touch-action:none;
  }

  /* Top HUD: Hoot Medallion + Speech Banner + 6 Firework Stars */
  #hud{
    position:relative;z-index:5;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:max(8px,env(safe-area-inset-top)) clamp(10px,2.5vw,24px) 0;
    pointer-events:none;
  }
  .hud-host{
    display:flex;align-items:center;gap:10px;flex:1;min-width:0;pointer-events:auto;
  }
  #hootBtn{
    flex:none;width:clamp(64px,10vw,82px);height:clamp(64px,10vw,82px);
    border-radius:50%;border:4px solid var(--ink);
    background:radial-gradient(circle at 35% 30%,#fffdf0 0%,#ffe066 65%,#ffb703 100%);
    box-shadow:0 6px 0 var(--ink),0 0 20px rgba(255,212,59,.65);
    padding:6px;cursor:pointer;display:grid;place-items:center;
    animation:hootFloat 2.8s ease-in-out infinite;
  }
  #hootBtn svg{width:100%;height:100%;display:block}
  #bubble{
    background:linear-gradient(180deg,#ffffff 0%,#fff9db 100%);
    border:4px solid var(--ink);border-radius:24px;
    padding:10px 16px;font-size:clamp(.98rem,2.1vw,1.34rem);font-weight:800;
    color:var(--ink);line-height:1.25;
    box-shadow:0 7px 0 var(--ink),0 0 24px rgba(124,58,237,.45);
    max-width:640px;
  }
  #bubble b{color:#7c3aed}
  #starBar{
    flex:none;pointer-events:auto;
    display:flex;align-items:center;gap:5px;
    background:rgba(15,23,42,.88);border:3.5px solid #ffd43b;
    border-radius:999px;padding:6px 14px;
    box-shadow:0 0 18px rgba(255,212,59,.45);font-weight:900;font-size:1.1rem;color:#fff;
  }
  .fstar{font-size:1.35rem;filter:grayscale(1) opacity(.35);transition:transform .3s cubic-bezier(.2,1.6,.4,1),filter .3s}
  .fstar.on{filter:none;transform:scale(1.2)}

  /* Bottom Animal Rocket Launch Pad Dock */
  #launchDock{
    position:relative;z-index:6;
    margin:0 auto max(10px,env(safe-area-inset-bottom));
    width:min(96vw,960px);
    background:linear-gradient(180deg,rgba(30,27,75,.92) 0%,rgba(15,23,42,.96) 100%);
    border:4px solid #ffd43b;border-radius:32px;
    padding:10px clamp(8px,2vw,18px) 14px;
    box-shadow:0 10px 0 #020617,0 0 32px rgba(139,92,246,.55);
  }
  #padGrid{
    display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(6px,1.4vw,14px);
  }
  .pad-btn{
    min-height:clamp(84px,13.5vh,118px);
    border:3.5px solid var(--ink);border-radius:24px;
    background:linear-gradient(180deg,#ffffff 0%,var(--c1) 48%,var(--c2) 100%);
    box-shadow:
      inset 0 4px 0 rgba(255,255,255,.9),
      0 7px 0 var(--ped),
      0 10px 0 var(--ink),
      0 14px 22px rgba(0,0,0,.45);
    padding:8px 4px;cursor:pointer;font-family:inherit;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    transition:translate .12s ease,box-shadow .12s ease;
    touch-action:manipulation;
  }
  .pad-btn:active{translate:0 6px;box-shadow:0 2px 0 var(--ped),0 4px 0 var(--ink)}
  .pad-btn[data-a="cat"]{--c1:#ffe3f1;--c2:#ff7eb6;--ped:#be185d}
  .pad-btn[data-a="dog"]{--c1:#fff3bf;--c2:#ffd43b;--ped:#d97706}
  .pad-btn[data-a="bunny"]{--c1:#e0f4ff;--c2:#74c0fc;--ped:#0284c7}
  .pad-btn[data-a="butterfly"]{--c1:#f3d9fa;--c2:#da77f2;--ped:#862e9c}
  .pad-btn[data-a="lion"]{--c1:#ffe8cc;--c2:#ffa94d;--ped:#d9480f}
  .pad-btn[data-a="finale"]{
    --c1:#fff9db;--c2:#fcc419;--ped:#b45309;
    background:linear-gradient(135deg,#ff4d6d 0%,#ff9e00 35%,#ffe066 68%,#7209b7 100%);
    color:#fff;text-shadow:0 2px 0 var(--ink);
    box-shadow:inset 0 4px 0 rgba(255,255,255,.65),0 7px 0 #7209b7,0 10px 0 var(--ink),0 0 22px rgba(255,212,59,.75);
    animation:finalePulse 1.5s ease-in-out infinite;
  }
  .pad-emo{font-size:clamp(1.85rem,4.2vw,2.6rem);line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.22))}
  .pad-lbl{font-size:clamp(.78rem,1.5vw,1rem);font-weight:900;line-height:1.1}

  /* Win Celebration Overlay */
  #winOverlay{
    position:fixed;inset:0;z-index:20;
    background:rgba(7,11,30,.68);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .win-card{
    width:min(92vw,480px);background:linear-gradient(180deg,#ffffff 0%,#fff9db 100%);
    border:5px solid var(--ink);border-radius:36px;padding:24px 20px;text-align:center;
    box-shadow:0 12px 0 var(--ink),0 0 48px rgba(255,212,59,.55);
    animation:actorPop .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  .win-trophy{font-size:5.2rem;line-height:1;margin:0 0 8px}
  .win-card h2{margin:0 0 6px;font-size:2rem;color:var(--ink)}
  .win-card p{margin:0 0 16px;font-size:1.15rem;font-weight:800;color:#334155}
  .win-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .big-play{
    min-height:68px;min-width:200px;padding:12px 28px;border-radius:999px;
    border:4px solid var(--ink);background:linear-gradient(180deg,#ffe066 0%,#fab005 100%);
    color:var(--ink);font-family:inherit;font-size:1.35rem;font-weight:900;
    box-shadow:0 7px 0 var(--ink);cursor:pointer;
  }
  .big-play:active{translate:0 5px;box-shadow:0 2px 0 var(--ink)}

  @media (max-width:540px){
    #padGrid{grid-template-columns:repeat(3,1fr)}
    .pad-btn{min-height:74px}
  }

  @keyframes hootFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes actorPop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes finalePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
</style>

<body>
<div id="stage">
  <canvas id="fwCanvas"></canvas>

  <div id="hud">
    <div class="hud-host">
      <button id="hootBtn" type="button" aria-label="Hoot the Owl">
        <svg viewBox="0 0 200 210" aria-hidden="true"><path d="M82 178 L100 205 L118 178 Z" fill="#8a5a33"/><ellipse cx="34" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(14 34 128)"/><ellipse cx="166" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(-14 166 128)"/><ellipse cx="100" cy="118" rx="66" ry="72" fill="#a06a3b"/><ellipse cx="100" cy="140" rx="44" ry="46" fill="#fdeed3"/><path d="M52 44 Q40 14 62 22 Q74 27 70 48 Z" fill="#8a5a33"/><path d="M148 44 Q160 14 138 22 Q126 27 130 48 Z" fill="#8a5a33"/><circle cx="100" cy="72" r="52" fill="#a06a3b"/><ellipse cx="78" cy="74" rx="24" ry="26" fill="#fdeed3"/><ellipse cx="122" cy="74" rx="24" ry="26" fill="#fdeed3"/><circle cx="78" cy="72" r="11" fill="#17324f"/><circle cx="122" cy="72" r="11" fill="#17324f"/><circle cx="82" cy="68" r="4" fill="#fff"/><circle cx="126" cy="68" r="4" fill="#fff"/><circle cx="56" cy="94" r="8" fill="#ffb59d" opacity=".85"/><circle cx="144" cy="94" r="8" fill="#ffb59d" opacity=".85"/><path d="M90 88 Q100 84 110 88 Q106 102 100 104 Q94 102 90 88 Z" fill="#ff9f1c" stroke="#e07f00" stroke-width="1.5"/></svg>

      <span class="fstar">⭐</span><span class="fstar">⭐</span><span class="fstar">⭐</span><span class="fstar">⭐</span><span class="fstar">⭐</span><span class="fstar">⭐</span>
    </div>
  </div>

  <!-- Hidden start button kept for automated test harness compatibility -->
  <button id="playBtn" type="button" hidden>▶ Play</button>

  <div id="launchDock" role="group" aria-label="Animal Firework Launchers">
    <div id="padGrid">
      <button type="button" class="pad-btn" data-a="cat" aria-label="Launch Cat Firework">
        <span class="pad-emo" aria-hidden="true">🐱</span>
        <span class="pad-lbl">Kitten</span>
      </button>
      <button type="button" class="pad-btn" data-a="dog" aria-label="Launch Dog Firework">
        <span class="pad-emo" aria-hidden="true">🐶</span>
        <span class="pad-lbl">Puppy</span>
      </button>
      <button type="button" class="pad-btn" data-a="bunny" aria-label="Launch Bunny Firework">
        <span class="pad-emo" aria-hidden="true">🐰</span>
        <span class="pad-lbl">Bunny</span>
      </button>
      <button type="button" class="pad-btn" data-a="butterfly" aria-label="Launch Butterfly Firework">
        <span class="pad-emo" aria-hidden="true">🦋</span>
        <span class="pad-lbl">Butterfly</span>
      </button>
      <button type="button" class="pad-btn" data-a="lion" aria-label="Launch Lion Firework">
        <span class="pad-emo" aria-hidden="true">🦁</span>
        <span class="pad-lbl">Lion</span>
      </button>
      <button type="button" class="pad-btn" data-a="finale" aria-label="Launch Big Finale">
        <span class="pad-emo" aria-hidden="true">🎆</span>

      </button>

  </div>

  <div id="winOverlay" hidden>
    <div class="win-card">
      <div class="win-trophy" aria-hidden="true">🎆🦁🦋✨</div>
      <h2>Fireworks Superstar!</h2>
      <p id="winRecap">You lit up the whole night sky with glowing animal fireworks and a grand finale!</p>
      <div class="win-btns">
        <button id="againBtn" class="big-play" type="button">↻ More Fireworks!</button>
      </div>
    </div>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById("fwCanvas");
  var ctx = canvas.getContext("2d");
  var bubble = document.getElementById("bubble");
  var winOverlay = document.getElementById("winOverlay");
  var starEls = Array.prototype.slice.call(document.querySelectorAll(".fstar"));
  var padBtns = Array.prototype.slice.call(document.querySelectorAll(".pad-btn"));

  var W = window.innerWidth, H = window.innerHeight, DPR = Math.min(window.devicePixelRatio || 1, 2);
  var bgStars = [];
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgStars = [];
    for(var i = 0; i < 65; i++){
      bgStars.push({ x: Math.random() * W, y: Math.random() * H * 0.65, r: 1 + Math.random() * 2.2, p: Math.random() * 6.28 });
    }
  }
  window.addEventListener("resize", resize);
  resize();

  /* ---------- Recorded Voice + WebAudio Firework Synth ---------- */
  var voiceA = new Audio();
  function playVoice(clips){
    if(!clips || !clips.length) return;
    var idx = 0;
    function step(){
      if(idx >= clips.length) return;
      var c = clips[idx++];
      voiceA.src = "assets/voice/" + c + ".mp3";
      voiceA.onended = step;
      voiceA.onerror = step;
      var p = voiceA.play();
      if(p && p.catch) p.catch(function(){});
    }
    step();
  }

  var actx = null;
  function ensureAudio(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) actx = new AC();
    }
    if(actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function sfxWhistle(){
    try{
      var ac = ensureAudio(); if(!ac) return;
      var t = ac.currentTime;
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(360, t);
      o.frequency.exponentialRampToValueAtTime(1180, t + 0.34);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.37);
    }catch(e){}
  }
  function sfxBoom(big){
    try{
      var ac = ensureAudio(); if(!ac) return;
      var t = ac.currentTime;
      var dur = big ? 0.95 : 0.6;
      var buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
      var d = buf.getChannelData(0);
      for(var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * (big ? 0.28 : 0.18)));
      var src = ac.createBufferSource(); src.buffer = buf;
      var flt = ac.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = big ? 380 : 520;
      var g = ac.createGain(); g.gain.setValueAtTime(big ? 0.55 : 0.38, t); g.gain.exponentialRampToValueAtTime(0.008, t + dur);
      src.connect(flt); flt.connect(g); g.connect(ac.destination);
      src.start(t);

      /* Sparkle chime overtone */
      [880, 1174, 1567].forEach(function(freq, idx){
        var o = ac.createOscillator(), cg = ac.createGain();
        o.type = "triangle"; o.frequency.value = freq;
        cg.gain.setValueAtTime(0.08, t + idx * 0.05);
        cg.gain.exponentialRampToValueAtTime(0.001, t + 0.35 + idx * 0.05);
        o.connect(cg); cg.connect(ac.destination);
        o.start(t + idx * 0.05); o.stop(t + 0.38 + idx * 0.05);
      });
    }catch(e){}
  }

  /* ---------- Animal Constellation Shape Generators ---------- */
  var ANIMALS = {
    cat: { name: "KITTEN", emo: "🐱", clip: "word-kitten", colors: ["#ff7eb6", "#ffd43b", "#ff4d6d", "#ffffff"] },
    dog: { name: "PUPPY", emo: "🐶", clip: "word-dog", colors: ["#ffd43b", "#ffa94d", "#74c0fc", "#ffffff"] },
    bunny: { name: "BUNNY", emo: "🐰", clip: "word-bunny", colors: ["#74c0fc", "#f783ac", "#a5f3fc", "#ffffff"] },
    butterfly: { name: "BUTTERFLY", emo: "🦋", clip: "word-butterfly", colors: ["#da77f2", "#4dabf7", "#ffd43b", "#ff7eb6"] },
    lion: { name: "LION", emo: "🦁", clip: "word-lion", colors: ["#ffa94d", "#ffd43b", "#ff6b6b", "#fff3bf"] },
    frog: { name: "FROG", emo: "🐸", clip: "word-frog", colors: ["#69db7c", "#ffe066", "#38d9a9", "#ffffff"] },
    duck: { name: "DUCK", emo: "🦆", clip: "word-duck", colors: ["#ffe066", "#ffa94d", "#74c0fc", "#ffffff"] },
    star: { name: "STAR", emo: "⭐", clip: "word-star", colors: ["#ffd43b", "#fff9db", "#ff922b", "#ffffff"] }
  };
  var ANIMAL_KEYS = Object.keys(ANIMALS);

  /* Returns normalized (dx, dy) points outlining each animal shape! */
  function shapePoints(kind, count){
    var pts = [];
    for(var i = 0; i < count; i++){
      var t = (i / count) * Math.PI * 2;
      var x = 0, y = 0;
      if(kind === "butterfly"){
        var r = Math.exp(Math.cos(t)) - 2 * Math.cos(4 * t) + Math.pow(Math.sin(t / 12), 5);
        x = Math.sin(t) * r * 0.34;
        y = -Math.cos(t) * r * 0.34;
      } else if(kind === "bunny"){
        if(i < count * 0.55){
          var a = (i / (count * 0.55)) * Math.PI * 2;
          x = Math.cos(a) * 0.65; y = Math.sin(a) * 0.58 + 0.25;
        } else if(i < count * 0.77){
          var e1 = ((i - count * 0.55) / (count * 0.22)) * Math.PI * 2;
          x = -0.28 + Math.cos(e1) * 0.17; y = -0.58 + Math.sin(e1) * 0.48;
        } else {
          var e2 = ((i - count * 0.77) / (count * 0.23)) * Math.PI * 2;
          x = 0.28 + Math.cos(e2) * 0.17; y = -0.58 + Math.sin(e2) * 0.48;
        }
      } else if(kind === "cat"){
        if(i < count * 0.65){
          var ca = (i / (count * 0.65)) * Math.PI * 2;
          x = Math.cos(ca) * 0.72; y = Math.sin(ca) * 0.65 + 0.12;
        } else {
          var ear = (i - count * 0.65) / (count * 0.35);
          var side = ear < 0.5 ? -1 : 1;
          var u = (ear % 0.5) * 2;
          x = side * (0.25 + u * 0.38);
          y = -0.35 - (1 - Math.abs(u - 0.5) * 2) * 0.55;
        }
      } else if(kind === "lion"){
        var wave = 0.85 + 0.22 * Math.sin(t * 12);
        x = Math.cos(t) * wave;
        y = Math.sin(t) * wave;
      } else if(kind === "star"){
        var sr = (i % 2 === 0) ? 1.0 : 0.46;
        var sa = (i / count) * Math.PI * 2 - Math.PI / 2;
        var starR = 0.72 + 0.32 * Math.cos(sa * 5);
        x = Math.cos(sa) * starR;
        y = Math.sin(sa) * starR;
      } else {
        /* puppy / frog / duck rounded head + ears/crest */
        var rad = 0.75 + 0.22 * Math.sin(t * 3);
        x = Math.cos(t) * rad;
        y = Math.sin(t) * rad;
      }
      pts.push({ dx: x, dy: y });
    }
    return pts;
  }

  var rockets = [];
  var sparks = [];
  var badges = [];
  var rings = [];
  var stars = 0;
  var won = false;
  var tick = 0;
  var skyFlash = 0;

  /* Hold-to-charge Finale state */
  var holding = false;
  var holdX = 0, holdY = 0, holdStart = 0, holdPower = 0;

  function updateStars(){
    starEls.forEach(function(el, i){
      el.classList.toggle("on", i < stars);
    });
  }

  function recordLaunch(){
    if(won) return;
    stars = Math.min(6, stars + 1);
    updateStars();
    if(stars >= 6){
      won = true;
      setTimeout(function(){
        winOverlay.hidden = false;
        playVoice(["hoot-win-star"]);
      }, 1400);
    }
  }

  function explode(x, y, kind, scale){
    var cfg = ANIMALS[kind] || ANIMALS.star;
    var sc = scale || 1;
    var n = Math.round(115 * sc);
    var outline = shapePoints(kind, n);
    sfxBoom(sc > 1.25);
    skyFlash = Math.min(0.45, 0.18 * sc);

    /* Outer shaped constellation particles */
    outline.forEach(function(pt, i){
      var speed = (3.4 + Math.random() * 0.9) * sc;
      sparks.push({
        x: x, y: y,
        vx: pt.dx * speed + (Math.random() - 0.5) * 0.4,
        vy: pt.dy * speed + (Math.random() - 0.5) * 0.4,
        c: cfg.colors[i % cfg.colors.length],
        r: (2.8 + Math.random() * 2.2) * Math.min(1.4, sc),
        life: 1.0,
        decay: 0.011 + Math.random() * 0.006,
        gravity: 0.025
      });
    });

    /* Inner gold glitter core */
    for(var k = 0; k < Math.round(45 * sc); k++){
      var a = Math.random() * Math.PI * 2;
      var sp = Math.random() * 2.6 * sc;
      sparks.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        c: cfg.colors[k % cfg.colors.length],
        r: 2 + Math.random() * 2,
        life: 1.0,
        decay: 0.016 + Math.random() * 0.01,
        gravity: 0.04
      });
    }

    rings.push({ x: x, y: y, r: 8, maxR: 120 * sc, c: cfg.colors[0], life: 1.0 });
    badges.push({ x: x, y: y, emo: cfg.emo, name: cfg.name, c: cfg.colors[0], life: 1.0, scale: sc });
  }

  function launchRocket(tx, ty, kind, scale, silentVoice){
    var k = kind || ANIMAL_KEYS[Math.floor(Math.random() * ANIMAL_KEYS.length)];
    var cfg = ANIMALS[k];
    sfxWhistle();
    rockets.push({
      x: W * (0.25 + Math.random() * 0.5),
      y: H * 0.78,
      tx: tx,
      ty: Math.max(H * 0.16, Math.min(H * 0.56, ty)),
      p: 0,
      kind: k,
      scale: scale || 1,
      c: cfg.colors[0]
    });
    if(!silentVoice){
      bubble.innerHTML = "🎆 <b>" + cfg.emo + " " + cfg.name + " FIREWORK!</b> Tap or hold the sky for more!";
      playVoice([cfg.clip]);
    }
  }

  function launchGrandFinale(cx, cy, count){
    var n = count || 5;
    bubble.innerHTML = "🎇 <b>MEGA ANIMAL FINALE!</b> Look at all the animals in the sky!";
    playVoice(["owl-excited"]);
    for(var i = 0; i < n; i++){
      (function(idx){
        setTimeout(function(){
          var k = ANIMAL_KEYS[idx % ANIMAL_KEYS.length];
          var fx = W * (0.16 + (idx / Math.max(1, n - 1)) * 0.68) + (Math.random() - 0.5) * 40;
          var fy = H * (0.20 + (idx % 2) * 0.14) + (Math.random() - 0.5) * 30;
          launchRocket(fx, fy, k, 1.35, true);
        }, idx * 140);
      })(i);
    }
    recordLaunch();
  }

  /* Pointer Hold-to-Charge & Tap-to-Launch on Sky Canvas */
  canvas.addEventListener("pointerdown", function(e){
    e.preventDefault();
    holding = true;
    holdX = e.clientX;
    holdY = Math.min(e.clientY, H * 0.6);
    holdStart = Date.now();
    holdPower = 0;
  });
  window.addEventListener("pointermove", function(e){
    if(!holding) return;
    holdX = e.clientX;
    holdY = Math.min(e.clientY, H * 0.6);
  });
  window.addEventListener("pointerup", function(){
    if(!holding) return;
    var heldMs = Date.now() - holdStart;
    holding = false;
    if(heldMs >= 480){
      var count = Math.min(6, 3 + Math.floor(heldMs / 400));
      launchGrandFinale(holdX, holdY, count);
    } else {
      var k = ANIMAL_KEYS[Math.floor(Math.random() * ANIMAL_KEYS.length)];
      launchRocket(holdX, holdY, k, 1.1, false);
      recordLaunch();
    }
  });

  /* Bottom Animal Launch Pad Buttons */
  padBtns.forEach(function(b){
    var a = b.getAttribute("data-a");
    var fire = function(e){
      if(e){ e.preventDefault(); e.stopPropagation(); }
      if(a === "finale"){
        launchGrandFinale(W * 0.5, H * 0.3, 5);
      } else {
        var tx = W * (0.22 + Math.random() * 0.56);
        var ty = H * (0.22 + Math.random() * 0.24);
        launchRocket(tx, ty, a, 1.2, false);
        recordLaunch();
      }
    };
    b.addEventListener("pointerdown", fire);
    b.addEventListener("click", function(e){ if(e.detail === 0) fire(e); });
  });

  function startGame(){
    won = false;
    stars = 0;
    winOverlay.hidden = true;
    updateStars();
    bubble.innerHTML = "Tap the night sky for <b>Animal Fireworks</b> — or <b>HOLD</b> your finger down for a <b>BIG FINALE</b>!";
    playVoice(["hoot-game-hello"]);
    /* Launch a welcome firework right away so the sky is alive on open! */
    setTimeout(function(){
      launchRocket(W * 0.5, H * 0.3, "cat", 1.15, true);
    }, 220);
  }

  document.getElementById("againBtn").addEventListener("click", startGame);
  document.getElementById("playBtn").addEventListener("click", startGame);
  document.getElementById("hootBtn").addEventListener("click", function(){
    playVoice(["hoot-giggle"]);
  });

  /* ---------- 60fps Night Sky, Harbor Reflections & Firework Particle Loop ---------- */
  function render(){
    tick++;
    var waterY = H * 0.68;

    /* Velvet night sky with motion trail fade */
    ctx.fillStyle = "rgba(7, 11, 30, 0.26)";
    ctx.fillRect(0, 0, W, H);

    if(skyFlash > 0.01){
      ctx.fillStyle = "rgba(255, 240, 200, " + skyFlash + ")";
      ctx.fillRect(0, 0, W, H);
      skyFlash *= 0.86;
    }

    /* Twinkling background stars & Crescent Moon */
    bgStars.forEach(function(s){
      var a = 0.35 + 0.65 * Math.abs(Math.sin(tick * 0.03 + s.p));
      ctx.fillStyle = "rgba(255, 249, 219, " + a + ")";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = "#fff9db";
    ctx.beginPath(); ctx.arc(W * 0.88, H * 0.16, 28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#070b1e";
    ctx.beginPath(); ctx.arc(W * 0.88 - 10, H * 0.16 - 6, 24, 0, Math.PI * 2); ctx.fill();

    /* Hold-to-charge Rainbow Finale Ring */
    if(holding){
      var held = Date.now() - holdStart;
      holdPower = Math.min(1, held / 1200);
      var rad = 28 + holdPower * 75;
      ctx.save();
      ctx.strokeStyle = ["#ffd43b", "#ff4d6d", "#4dabf7", "#da77f2"][Math.floor(tick / 4) % 4];
      ctx.lineWidth = 6;
      ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(holdX, holdY, rad, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = "900 18px Fredoka, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(held >= 480 ? "🎆 RELEASE FOR FINALE!" : "⚡ CHARGING…", holdX, holdY - rad - 12);
      ctx.restore();
    }

    /* Ascending Rockets */
    for(var r = rockets.length - 1; r >= 0; r--){
      var rk = rockets[r];
      rk.p += 0.065;
      var cx = rk.x + (rk.tx - rk.x) * rk.p;
      var cy = rk.y + (rk.ty - rk.y) * (1 - Math.pow(1 - rk.p, 2));
      ctx.fillStyle = "#ffd43b";
      ctx.shadowColor = "#ffd43b"; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      /* Gold tail sparks */
      sparks.push({
        x: cx, y: cy,
        vx: (Math.random() - 0.5) * 0.8,
        vy: 1.2 + Math.random() * 1.2,
        c: "#ffd43b", r: 2.2, life: 0.55, decay: 0.05, gravity: 0.02
      });
      if(rk.p >= 1){
        explode(rk.tx, rk.ty, rk.kind, rk.scale);
        rockets.splice(r, 1);
      }
    }

    /* Expanding Shockwave Rings */
    for(var g = rings.length - 1; g >= 0; g--){
      var rg = rings[g];
      rg.r += (rg.maxR - rg.r) * 0.12;
      rg.life -= 0.035;
      if(rg.life <= 0){ rings.splice(g, 1); continue; }
      ctx.strokeStyle = rg.c;
      ctx.globalAlpha = rg.life * 0.55;
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* Glowing Animal Firework Particles + Water Reflections */
    for(var i = sparks.length - 1; i >= 0; i--){
      var sp = sparks[i];
      sp.x += sp.vx;
      sp.y += sp.vy;
      sp.vy += sp.gravity;
      sp.vx *= 0.985;
      sp.vy *= 0.985;
      sp.life -= sp.decay;
      if(sp.life <= 0){ sparks.splice(i, 1); continue; }

      ctx.globalAlpha = Math.max(0, sp.life);
      ctx.fillStyle = sp.c;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); ctx.fill();

      /* Harbor water shimmer reflection */
      if(sp.y < waterY && i % 3 === 0){
        var ry = waterY + (waterY - sp.y) * 0.35;
        if(ry < H){
          ctx.globalAlpha = Math.max(0, sp.life * 0.25);
          ctx.fillRect(sp.x - sp.r * 1.6, ry, sp.r * 3.2, 2.2);
        }
      }
      ctx.globalAlpha = 1;
    }

    /* Glowing Animal Constellation Emblem at Center of Burst */
    for(var b = badges.length - 1; b >= 0; b--){
      var bd = badges[b];
      bd.life -= 0.015;
      if(bd.life <= 0){ badges.splice(b, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.min(1, bd.life * 1.3);
      var s = (1 + (1 - bd.life) * 0.35) * bd.scale;
      ctx.translate(bd.x, bd.y);
      ctx.scale(s, s);
      ctx.font = "54px system-ui, Apple Color Emoji, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = bd.c; ctx.shadowBlur = 22;
      ctx.fillText(bd.emo, 0, 0);
      ctx.restore();
    }

    /* Cozy Harbor Town Silhouette & Water Horizon */
    ctx.fillStyle = "#0b132b";
    ctx.fillRect(0, waterY - 12, W, 14);
    for(var h = 0; h < 14; h++){
      var hx = (h / 14) * W;
      var hw = W / 14 + 4;
      var hh = 22 + (h * 17) % 34;
      ctx.fillStyle = "#111a3a";
      ctx.fillRect(hx, waterY - hh, hw, hh);
      ctx.fillStyle = "#ffd43b";
      if(h % 2 === 0) ctx.fillRect(hx + 8, waterY - hh + 8, 6, 8);
    }

    requestAnimationFrame(render);
  }

  startGame();
  requestAnimationFrame(render);
})();
</script>
