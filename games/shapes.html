<style>
  :root{--ink:#0f172a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  [hidden]{display:none !important}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Fredoka","Nunito",system-ui,sans-serif;background:#05081c;touch-action:none}
  #stage{
    position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
    background:
      radial-gradient(circle at 82% 16%,rgba(253,224,71,.22) 0%,transparent 28%),
      radial-gradient(circle at 20% 28%,rgba(192,132,252,.18) 0%,transparent 40%),
      linear-gradient(180deg,#04071a 0%,#0d153f 42%,#1e1b4b 72%,#311042 100%);
  }

  /* Crisp Pinkfong-Style SVG Carnival Skyline & Ferris Wheel Backdrop */
  #carnivalSvg{
    position:absolute;left:0;right:0;bottom:0;width:100%;height:42%;
    z-index:1;pointer-events:none;display:block;
  }
  #ferrisWheel{
    transform-box:fill-box;transform-origin:center;
    animation:spinWheel 28s linear infinite;
  }
  @keyframes spinWheel{to{transform:rotate(360deg)}}

  /* Additive HDR Neon Particle Canvas */
  #fwCanvas{
    position:absolute;inset:0;width:100%;height:100%;
    z-index:2;display:block;cursor:crosshair;touch-action:none;
  }

  /* Interactive Floating Sky Bubble Targets (Pinkfong Arcade Gameplay) */
  #skyTargets{
    position:absolute;left:0;right:0;top:92px;bottom:170px;
    z-index:4;pointer-events:none;overflow:hidden;
  }
  .sky-target{
    position:absolute;pointer-events:auto;
    width:clamp(84px,12.5vw,112px);height:clamp(84px,12.5vw,112px);
    border-radius:50%;border:3.5px solid #fff;
    background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95) 0 14%,rgba(255,255,255,.25) 15% 58%,var(--glow) 100%);
    box-shadow:0 0 24px var(--glow),inset 0 0 18px rgba(255,255,255,.75);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;padding:0;font-family:inherit;
    animation:targetFloat 3.2s ease-in-out infinite;
    transition:transform .15s ease;
  }
  .sky-target:active{transform:scale(1.25)}
  .sky-target svg{width:72%;height:72%;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));pointer-events:none}
  .sky-target .t-ring{
    position:absolute;inset:-7px;border-radius:50%;
    border:2.5px dashed rgba(255,240,138,.85);
    animation:spinWheel 9s linear infinite;pointer-events:none;
  }

  /* Popping Vector Animal Firework Medallions in the Sky */
  #burstLayer{
    position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;
  }
  .animal-burst-svg{
    position:absolute;transform:translate(-50%,-50%);
    width:clamp(130px,22vw,190px);height:clamp(130px,22vw,190px);
    filter:drop-shadow(0 0 22px var(--ac)) drop-shadow(0 0 44px var(--ac));
    animation:burstZoom 1.45s cubic-bezier(.16,1.35,.3,1) forwards;
  }
  @keyframes burstZoom{
    0%{transform:translate(-50%,-50%) scale(.15) rotate(-18deg);opacity:0}
    28%{transform:translate(-50%,-50%) scale(1.18) rotate(4deg);opacity:1}
    70%{transform:translate(-50%,-50%) scale(1.05) rotate(0deg);opacity:1}
    100%{transform:translate(-50%,-42%) scale(1.25);opacity:0}
  }

  /* Top HUD */
  #hud{
    position:relative;z-index:6;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:max(6px,env(safe-area-inset-top)) clamp(10px,2.2vw,22px) 0;
    pointer-events:none;
  }
  .hud-left{display:flex;align-items:center;gap:10px;pointer-events:auto;min-width:0;flex:1}
  #hootBtn{
    flex:none;width:clamp(58px,8.5vw,76px);height:clamp(58px,8.5vw,76px);
    border-radius:50%;border:3.5px solid var(--ink);
    background:radial-gradient(circle at 35% 30%,#fffdf0 0%,#ffe066 65%,#f59f00 100%);
    box-shadow:0 6px 0 var(--ink),0 0 22px rgba(255,212,59,.75);
    padding:5px;cursor:pointer;display:grid;place-items:center;
    animation:targetFloat 2.6s ease-in-out infinite;
  }
  #hootBtn svg{width:100%;height:100%;display:block}
  #bubble{
    background:linear-gradient(180deg,#ffffff 0%,#fff9db 100%);
    border:3.5px solid var(--ink);border-radius:22px;
    padding:8px 16px;font-size:clamp(.95rem,2vw,1.26rem);font-weight:800;
    color:var(--ink);line-height:1.22;
    box-shadow:0 6px 0 var(--ink),0 0 24px rgba(236,72,153,.45);
    max-width:600px;
  }
  #bubble b{color:#d946ef}
  #starBar{
    flex:none;pointer-events:auto;
    display:flex;align-items:center;gap:5px;
    background:rgba(15,23,42,.92);border:3.5px solid #fde047;
    border-radius:999px;padding:5px 14px;
    box-shadow:0 0 20px rgba(253,224,71,.5);font-weight:900;
  }
  .fstar{font-size:1.35rem;filter:grayscale(1) opacity(.3);transition:transform .3s cubic-bezier(.2,1.6,.4,1),filter .3s}
  .fstar.on{filter:none;transform:scale(1.22)}

  /* Bottom 3D Pinkfong Rocket Cannon Battery */
  #cannonDock{
    position:relative;z-index:6;
    margin:0 auto max(8px,env(safe-area-inset-bottom));
    width:min(96vw,940px);
    background:linear-gradient(180deg,rgba(49,16,66,.92) 0%,rgba(15,23,42,.96) 100%);
    border:4px solid #fde047;border-radius:34px;
    padding:10px clamp(8px,1.8vw,18px) 14px;
    box-shadow:
      inset 0 5px 0 rgba(255,255,255,.35),
      0 10px 0 #020617,
      0 0 36px rgba(217,70,239,.55);
  }
  #padGrid{
    display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(6px,1.4vw,14px);align-items:stretch;
  }
  .cannon-btn{
    position:relative;
    min-height:clamp(92px,14.5vh,126px);
    border:4px solid var(--ink);border-radius:26px;
    background:linear-gradient(180deg,#ffffff 0%,var(--c1) 45%,var(--c2) 100%);
    box-shadow:
      inset 0 5px 0 rgba(255,255,255,.95),
      0 8px 0 var(--ped),
      0 12px 0 var(--ink),
      0 16px 24px rgba(0,0,0,.5);
    padding:6px 4px 8px;cursor:pointer;font-family:inherit;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    transition:translate .12s ease,box-shadow .12s ease;
    touch-action:manipulation;
  }
  .cannon-btn:active{translate:0 7px;box-shadow:0 2px 0 var(--ped),0 4px 0 var(--ink)}
  .cannon-btn svg{width:clamp(48px,7.8vh,68px);height:clamp(48px,7.8vh,68px);display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.22));pointer-events:none}
  .cannon-btn[data-a="cat"]{--c1:#fce7f3;--c2:#f472b6;--ped:#be185d}
  .cannon-btn[data-a="dog"]{--c1:#fef9c3;--c2:#facc15;--ped:#ca8a04}
  .cannon-btn[data-a="bunny"]{--c1:#e0f2fe;--c2:#38bdf8;--ped:#0284c7}
  .cannon-btn[data-a="butterfly"]{--c1:#f3e8ff;--c2:#c084fc;--ped:#7e22ce}
  .cannon-btn[data-a="lion"]{--c1:#ffedd5;--c2:#fb923c;--ped:#c2410c}
  .cannon-btn[data-a="finale"]{
    --c1:#fef08a;--c2:#f43f5e;--ped:#881337;
    background:radial-gradient(circle at 35% 25%,#fff 0%,#fde047 28%,#f43f5e 68%,#7e22ce 100%);
    color:#fff;text-shadow:0 2px 0 var(--ink);
    box-shadow:inset 0 5px 0 rgba(255,255,255,.75),0 8px 0 #581c87,0 12px 0 var(--ink),0 0 26px rgba(253,224,71,.85);
    animation:finaleBeat 1.3s ease-in-out infinite;
  }
  .pad-lbl{
    font-size:clamp(.78rem,1.5vw,1.02rem);font-weight:900;
    background:rgba(255,255,255,.9);color:var(--ink);text-shadow:none;
    padding:2px 10px;border-radius:999px;border:2px solid var(--ink);line-height:1.1;
  }

  /* Win Celebration Overlay */
  #winOverlay{
    position:fixed;inset:0;z-index:20;
    background:rgba(5,8,28,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .win-card{
    width:min(92vw,480px);background:linear-gradient(180deg,#ffffff 0%,#fff9db 100%);
    border:5px solid var(--ink);border-radius:36px;padding:24px 20px;text-align:center;
    box-shadow:0 12px 0 var(--ink),0 0 48px rgba(253,224,71,.65);
  }
  .win-trophy{font-size:5rem;line-height:1;margin:0 0 8px}
  .win-card h2{margin:0 0 6px;font-size:2rem;color:var(--ink)}
  .win-card p{margin:0 0 16px;font-size:1.12rem;font-weight:800;color:#334155}
  .big-play{
    min-height:66px;min-width:200px;padding:12px 28px;border-radius:999px;
    border:4px solid var(--ink);background:linear-gradient(180deg,#ffe066 0%,#fab005 100%);
    color:var(--ink);font-family:inherit;font-size:1.32rem;font-weight:900;
    box-shadow:0 7px 0 var(--ink);cursor:pointer;
  }

  @media (max-width:540px){
    #padGrid{grid-template-columns:repeat(3,1fr)}
    .cannon-btn{min-height:80px}
  }
  @keyframes targetFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes finaleBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
</style>

  /* ---------- Recorded Voice + WebAudio Firework Synth ---------- */
  var voiceA = new Audio();
  function playVoice(clips){
    if(!clips || !clips.length) return;
    var i = 0;
    function step(){
      if(i >= clips.length) return;
      voiceA.src = "assets/voice/" + clips[i++] + ".mp3";
      voiceA.onended = step; voiceA.onerror = step;
      var p = voiceA.play(); if(p && p.catch) p.catch(function(){});
    }
    step();
  }
  var actx = null;
  function ensureAudio(){
    if(!actx){ var A = window.AudioContext || window.webkitAudioContext; if(A) actx = new A(); }
    if(actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function sfxWhistle(){
    try{
      var ac = ensureAudio(); if(!ac) return; var t = ac.currentTime;
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(380, t); o.frequency.exponentialRampToValueAtTime(1280, t + 0.32);
      g.gain.setValueAtTime(0.11, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.35);
    }catch(e){}
  }
  function sfxBoom(big){
    try{
      var ac = ensureAudio(); if(!ac) return; var t = ac.currentTime;
      var dur = big ? 0.95 : 0.62;
      var buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = buf.getChannelData(0);
      for(var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * (big ? 0.28 : 0.18)));
      var src = ac.createBufferSource(); src.buffer = buf;
      var flt = ac.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = big ? 420 : 540;
      var g = ac.createGain(); g.gain.setValueAtTime(big ? 0.58 : 0.4, t); g.gain.exponentialRampToValueAtTime(0.008, t + dur);
      src.connect(flt); flt.connect(g); g.connect(ac.destination); src.start(t);

      [880, 1174, 1567, 2093].forEach(function(freq, idx){
        var o = ac.createOscillator(), cg = ac.createGain();
        o.type = "triangle"; o.frequency.value = freq;
        cg.gain.setValueAtTime(0.07, t + idx * 0.045);
        cg.gain.exponentialRampToValueAtTime(0.001, t + 0.32 + idx * 0.045);
        o.connect(cg); cg.connect(ac.destination);
        o.start(t + idx * 0.045); o.stop(t + 0.34 + idx * 0.045);
      });
    }catch(e){}
  }

  function shapePoints(kind, count){
    var pts = [];
    for(var i = 0; i < count; i++){
      var t = (i / count) * Math.PI * 2, x = 0, y = 0;
      if(kind === "butterfly"){
        var r = Math.exp(Math.cos(t)) - 2 * Math.cos(4 * t) + Math.pow(Math.sin(t / 12), 5);
        x = Math.sin(t) * r * 0.35; y = -Math.cos(t) * r * 0.35;
      } else if(kind === "bunny"){
        if(i < count * 0.55){
          var a = (i / (count * 0.55)) * Math.PI * 2;
          x = Math.cos(a) * 0.65; y = Math.sin(a) * 0.58 + 0.25;
        } else if(i < count * 0.77){
          var e1 = ((i - count * 0.55) / (count * 0.22)) * Math.PI * 2;
          x = -0.28 + Math.cos(e1) * 0.17; y = -0.58 + Math.sin(e1) * 0.48;
        } else {
          var e2 = ((i - count * 0.77) / (count * 0.23)) * Math.PI * 2;
          x = 0.28 + Math.cos(e2) * 0.17; y = -0.58 + Math.sin(e2) * 0.48;
        }
      } else if(kind === "cat"){
        if(i < count * 0.65){
          var ca = (i / (count * 0.65)) * Math.PI * 2;
          x = Math.cos(ca) * 0.72; y = Math.sin(ca) * 0.65 + 0.12;
        } else {
          var ear = (i - count * 0.65) / (count * 0.35);
          var side = ear < 0.5 ? -1 : 1, u = (ear % 0.5) * 2;
          x = side * (0.25 + u * 0.38);
          y = -0.35 - (1 - Math.abs(u - 0.5) * 2) * 0.55;
        }
      } else if(kind === "lion"){
        var wave = 0.85 + 0.22 * Math.sin(t * 12);
        x = Math.cos(t) * wave; y = Math.sin(t) * wave;
      } else {
        var starR = 0.75 + 0.28 * Math.cos(t * 5);
        x = Math.cos(t) * starR; y = Math.sin(t) * starR;
      }
      pts.push({ dx: x, dy: y });
    }
    return pts;
  }

  /* ---------- 60fps Additive HDR Neon Particle Loop (Never Muddy Gray!) ---------- */
  function render(){
    tick++;
    var waterY = H * 0.72;
    ctx.clearRect(0, 0, W, H);

    /* Twinkling Night Stars */
    bgStars.forEach(function(s){
      var a = 0.35 + 0.65 * Math.abs(Math.sin(tick * 0.035 + s.p));
      ctx.fillStyle = "rgba(254, 249, 195, " + a + ")";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    });

    /* Switch to ADDITIVE ('lighter') blending so overlapping sparks glow white-hot neon! */
    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    /* Hold-to-charge Rainbow Power Ring */
    if(holding){
      var held = Date.now() - holdStart;
      var pwr = Math.min(1, held / 1100);
      var rad = 32 + pwr * 78;
      ctx.strokeStyle = ["#fde047", "#ff4d8d", "#38bdf8", "#e879f9"][Math.floor(tick / 3) % 4];
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(holdX, holdY, rad, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = "900 19px Fredoka, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(held >= 460 ? "🎆 RELEASE FOR MEGA FINALE!" : "⚡ CHARGING FINALE…", holdX, holdY - rad - 14);
    }

    /* Ascending Rockets */
    for(var r = rockets.length - 1; r >= 0; r--){
      var rk = rockets[r];
      rk.p += 0.068;
      var cx = rk.x + (rk.tx - rk.x) * rk.p;
      var cy = rk.y + (rk.ty - rk.y) * (1 - Math.pow(1 - rk.p, 2));
      ctx.fillStyle = "#fde047";
      ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
      sparks.push({
        x: cx, y: cy, px: cx, py: cy,
        vx: (Math.random() - 0.5) * 1.1, vy: 1.4 + Math.random() * 1.5,
        c: "#fde047", r: 2.6, life: 0.6, decay: 0.055, gravity: 0.02
      });
      if(rk.p >= 1){
        explode(rk.tx, rk.ty, rk.kind, rk.scale);
        rockets.splice(r, 1);
      }
    }

    /* Shockwave Rings */
    for(var g = rings.length - 1; g >= 0; g--){
      var rg = rings[g];
      rg.r += (rg.maxR - rg.r) * 0.13;
      rg.life -= 0.036;
      if(rg.life <= 0){ rings.splice(g, 1); continue; }
      ctx.strokeStyle = rg.c;
      ctx.globalAlpha = rg.life * 0.7;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* Dual-Pass HDR Neon Particles + Streak Trails + Harbor Water Shimmer */
    for(var i = sparks.length - 1; i >= 0; i--){
      var sp = sparks[i];
      sp.px = sp.x; sp.py = sp.y;
      sp.x += sp.vx; sp.y += sp.vy;
      sp.vy += sp.gravity;
      sp.vx *= 0.984; sp.vy *= 0.984;
      sp.life -= sp.decay;
      if(sp.life <= 0){ sparks.splice(i, 1); continue; }

      var alpha = Math.max(0, sp.life);
      /* Outer soft neon halo */
      ctx.globalAlpha = alpha * 0.38;
      ctx.fillStyle = sp.c;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r * 2.4, 0, Math.PI * 2); ctx.fill();

      /* Crisp streak & bright core */
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = sp.c;
      ctx.lineWidth = sp.r * 1.5;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(sp.px, sp.py); ctx.lineTo(sp.x, sp.y); ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r * 0.55, 0, Math.PI * 2); ctx.fill();

      /* Harbor water reflection shimmer */
      if(sp.y < waterY && i % 3 === 0){
        var ry = waterY + (waterY - sp.y) * 0.32;
        if(ry < H){
          ctx.globalAlpha = alpha * 0.32;
          ctx.fillStyle = sp.c;
          ctx.fillRect(sp.x - sp.r * 2.2, ry, sp.r * 4.4, 2.5);
        }
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();
    requestAnimationFrame(render);
  }

  startGame();
  requestAnimationFrame(render);
})();
</script>
