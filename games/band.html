<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="band";</script>
<script src="js/hoot-game-head.js?v=llprev3e78"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />

<title>Copy the Beat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#17324f; --ink-soft:#3d5a78; --paper:#fffdf6;
    --sun:#ffc93c; --coral:#ff6b5e; --coral-dark:#d84a3d; --teal:#17bebb; --leaf:#57cc62; --leaf-dark:#3da147;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{ margin:0; font-family:"Nunito",system-ui,sans-serif; color:var(--ink); overflow:hidden; background:#aee7ff; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  #stage{ position:fixed; inset:0; height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#7cc7f0 0%,#a5e3ff 26%,#cdeffd 46%,#dff9e2 100%); }

  /* ---------- grove decor ---------- */
  .decor{ position:absolute; border:none; background:none; padding:0; cursor:pointer; font-family:inherit; }
  #sun{ top:6px; right:6px; width:70px; height:70px; z-index:1; }
  #sun svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 10px rgba(232,169,12,.35)); }
  #sun .rays{ transform-box:fill-box; transform-origin:center; animation:sunSpin 46s linear infinite; }
  @keyframes sunSpin{ to{ transform:rotate(360deg); } }
  #sun.zing .rays{ animation:sunSpin 1.1s cubic-bezier(.34,1.4,.5,1) 1; }
  #sun:active{ transform:scale(.93); }
  .leaf-tree{ position:absolute; z-index:0; top:0; width:120px; pointer-events:none; }
  .note-decor{ position:absolute; z-index:1; color:#2f83c4; opacity:.5; pointer-events:none; animation:noteFloat 5s ease-in-out infinite alternate; font-family:"Fredoka",sans-serif; }
  @keyframes noteFloat{ from{ transform:translateY(0) rotate(-6deg);} to{ transform:translateY(-14px) rotate(8deg);} }

  /* ---------- HUD ---------- */
  #hud{ position:relative; z-index:6; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:max(8px,env(safe-area-inset-top)) 10px 0; }
  .hud-btns{ display:flex; gap:8px; }
  .round-btn{ width:50px; height:50px; border-radius:50%; border:3px solid #fff; background:rgba(255,253,246,.96); color:var(--ink); display:grid; place-items:center; box-shadow:0 4px 0 rgba(23,50,79,.18),0 8px 16px rgba(23,50,79,.12); cursor:pointer; transition:transform .12s ease; }
  .round-btn:active{ transform:scale(.9); }
  .round-btn svg{ width:25px; height:25px; }
  #starBank{ display:flex; align-items:center; gap:7px; background:rgba(255,253,246,.96); border:3px solid #fff; border-radius:999px; padding:6px 16px 6px 10px; box-shadow:0 4px 0 rgba(23,50,79,.14),0 8px 16px rgba(23,50,79,.1); font-family:"Fredoka",sans-serif; font-weight:700; font-size:22px; }
  #starBank .star-ic{ width:25px; height:25px; }
  #starBank.bump{ animation:bankBump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes bankBump{ 0%{ transform:scale(1);} 40%{ transform:scale(1.16) rotate(-3deg);} 100%{ transform:scale(1);} }

  /* ---------- round card ---------- */
  #targetCard{ position:relative; z-index:6; margin:8px auto 0; display:flex; align-items:center; gap:12px; background:rgba(255,253,246,.97); border:3px solid #fff; border-radius:20px; box-shadow:0 5px 0 rgba(23,50,79,.12),0 12px 22px rgba(23,50,79,.12); padding:7px 10px 7px 16px; max-width:min(94vw,480px); }
  #targetCard.new-target{ animation:tcIn .45s cubic-bezier(.34,1.7,.5,1); }
  @keyframes tcIn{ 0%{ transform:scale(.8); opacity:0;} 100%{ transform:scale(1); opacity:1;} }
  #targetMain{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(21px,5.8vw,29px); line-height:1.05; color:#b3541e; white-space:nowrap; }
  .tc-label{ font-weight:900; font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); }
  #progressDots{ display:flex; gap:5px; margin-top:4px; }
  #progressDots i{ width:11px; height:11px; border-radius:50%; background:#dcebf5; border:2px solid #bcd6ea; display:block; }
  #progressDots i.on{ background:var(--sun); border-color:#e8a90c; }
  #hearBtn{ width:44px; height:44px; flex:0 0 auto; border-radius:50%; border:3px solid #ffe1a8; background:#fff6dd; display:grid; place-items:center; cursor:pointer; box-shadow:0 3px 0 rgba(232,169,12,.35); }
  #hearBtn:active{ transform:scale(.9); }
  #hearBtn svg{ width:23px; height:23px; }

  /* ---------- stage scene ---------- */
  #scene{ position:relative; flex:1 1 auto; min-height:0; z-index:1; display:flex; flex-direction:column; align-items:center; }
  #hootStage{ position:relative; z-index:3; display:flex; flex-direction:column; align-items:center; margin-top:2px; }
  #hootFig{ position:relative; border:none; background:none; padding:0; cursor:pointer; width:clamp(104px,27vw,142px); filter:drop-shadow(0 8px 10px rgba(23,50,79,.25)); animation:hootBob 3.2s ease-in-out infinite; transform-origin:50% 92%; }
  #hootFig svg{ width:100%; display:block; overflow:visible; }
  @keyframes hootBob{ 0%,100%{ transform:translateY(0) rotate(0);} 50%{ transform:translateY(-4px) rotate(-1deg);} }
  #hootFig.celebrate{ animation:hootJump .55s cubic-bezier(.34,1.6,.5,1) 3; }
  @keyframes hootJump{ 0%{ transform:translateY(0);} 35%{ transform:translateY(-22px) rotate(-3deg);} 70%{ transform:translateY(2px);} 100%{ transform:translateY(0);} }
  #hootFig.dance{ animation:hootDance .36s ease-in-out 6 alternate; }
  @keyframes hootDance{ from{ transform:rotate(-5deg) translateY(0);} to{ transform:rotate(5deg) translateY(-8px);} }
  #hootFig.shake{ animation:hootShake .5s ease-in-out 2; }
  @keyframes hootShake{ 0%,100%{ transform:rotate(0);} 25%{ transform:rotate(-5deg);} 75%{ transform:rotate(5deg);} }
  #hootFig.talking{ animation:hootTalk .22s ease-in-out infinite alternate; }
  @keyframes hootTalk{ from{ transform:translateY(0) scale(1);} to{ transform:translateY(-2px) scale(1.018);} }
  #hootFig.wave .wing-r{ animation:wingWave .45s ease-in-out 6 alternate; }
  #hootFig .wing-r{ transform-box:fill-box; transform-origin:15% 12%; }
  #hootFig .wing-l{ transform-box:fill-box; transform-origin:85% 12%; }
  @keyframes wingWave{ from{ transform:rotate(0);} to{ transform:rotate(-38deg);} }
  #hootFig.celebrate .wing-l{ animation:wingFlapL .28s ease-in-out infinite alternate; }
  #hootFig.celebrate .wing-r{ animation:wingFlapR .28s ease-in-out infinite alternate; }
  @keyframes wingFlapL{ from{ transform:rotate(0);} to{ transform:rotate(30deg);} }
  @keyframes wingFlapR{ from{ transform:rotate(0);} to{ transform:rotate(-30deg);} }
  #hootFig .eyes{ transform-box:fill-box; transform-origin:center; animation:blink 4.6s infinite; }
  @keyframes blink{ 0%,92%,100%{ transform:scaleY(1);} 95%{ transform:scaleY(.08);} }
  #hootFig .baton{ transform-box:fill-box; transform-origin:0% 100%; }
  #hootFig.conducting .baton{ animation:batonWave .31s ease-in-out infinite alternate; }
  @keyframes batonWave{ from{ transform:rotate(0);} to{ transform:rotate(-24deg);} }
  #podium{ width:clamp(120px,32vw,170px); height:20px; margin-top:-8px; background:linear-gradient(180deg,#c98d4e,#a9713d); border-radius:10px 10px 14px 14px; box-shadow:0 5px 0 rgba(90,55,20,.45); }
  /* pattern rows */
  .row-label{ font-family:"Fredoka",sans-serif; font-weight:600; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-top:8px; }
  .beat-row{ display:flex; gap:7px; justify-content:center; min-height:40px; align-items:center; }
  .beat-slot{ width:38px; height:38px; border-radius:12px; border:3px dashed #bcd6ea; background:rgba(255,255,255,.5); display:grid; place-items:center; font-size:19px; color:#fff; transition:transform .15s ease; }
  .beat-slot.filled{ border-style:solid; border-color:#fff; box-shadow:0 3px 0 rgba(23,50,79,.2); animation:slotPop .35s cubic-bezier(.34,1.8,.5,1); }
  @keyframes slotPop{ 0%{ transform:scale(.5);} 100%{ transform:scale(1);} }
  .beat-row.win .beat-slot{ box-shadow:0 0 12px rgba(255,201,60,.9); }
  .beat-row.shake{ animation:rowShake .4s ease-in-out; }
  @keyframes rowShake{ 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-7px);} 75%{ transform:translateX(7px);} }
  /* stage platform + pads */
  #stageFloor{ position:relative; z-index:2; width:min(97vw,600px); margin-top:6px; background:linear-gradient(180deg,#c98d4e,#a9713d); border:3px solid #8a5a2b; border-radius:20px; box-shadow:0 8px 0 rgba(90,55,20,.4),0 18px 30px rgba(23,50,79,.2); padding:12px 8px 10px; }
  #padRow{ display:flex; justify-content:center; gap:8px; }
  .pad{ flex:1 1 0; max-width:128px; border:3px solid rgba(255,255,255,.85); border-radius:18px; padding:7px 4px 5px; cursor:pointer; font-family:inherit; box-shadow:0 5px 0 rgba(23,50,79,.25); transition:transform .1s ease; position:relative; }
  .pad svg{ width:100%; max-height:74px; display:block; }
  .pad .pad-name{ display:block; font-family:"Fredoka",sans-serif; font-weight:600; font-size:14.5px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.35); margin-top:2px; }
  .pad:active{ transform:scale(.93); }
  .pad.lit{ transform:scale(1.07); box-shadow:0 0 0 4px #fff,0 0 22px rgba(255,255,255,.95); z-index:2; }
  /* action button */
  #actionRow{ margin-top:10px; display:flex; gap:9px; justify-content:center; align-items:center; flex-wrap:wrap; }
  #playTuneBtn{ border:none; cursor:pointer; background:#b3541e; color:#fff; font-family:"Fredoka",sans-serif; font-weight:700; font-size:19px; padding:11px 26px; border-radius:999px; box-shadow:0 5px 0 #7a3410,0 12px 20px rgba(122,52,16,.3); transition:transform .12s ease; }
  #playTuneBtn:active{ transform:scale(.95); }
  #playTuneBtn:disabled{ opacity:.45; box-shadow:none; }
  #playTuneBtn.pulse{ animation:btnPulse .6s ease-in-out 4 alternate; }
  @keyframes btnPulse{ from{ transform:scale(1);} to{ transform:scale(1.08);} }
  #listenBtn{ border:3px solid #ffe1a8; cursor:pointer; background:#fff6dd; color:var(--ink); font-family:"Fredoka",sans-serif; font-weight:600; font-size:16px; padding:8px 18px; border-radius:999px; box-shadow:0 4px 0 rgba(232,169,12,.4); }
  #listenBtn:active{ transform:scale(.95); }
  #listenBtn:disabled{ opacity:.45; box-shadow:none; }
  #listenBtn.pulse{ animation:btnPulse .6s ease-in-out 4 alternate; }

  /* bubble row */
  #bubbleRow{ position:relative; z-index:6; padding:6px 10px max(8px,env(safe-area-inset-bottom)); }
  #bubble{ position:relative; background:var(--paper); border:3px solid #fff; border-radius:20px; box-shadow:0 5px 0 rgba(23,50,79,.14),0 12px 24px rgba(23,50,79,.14); padding:10px 14px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(15px,4.1vw,19px); line-height:1.3; color:var(--ink); max-width:640px; margin:0 auto; }
  #bubble .b-big{ color:#b3541e; font-size:1.22em; font-weight:700; }
  #hootName{ display:inline-block; margin-top:5px; margin-left:8px; background:#17324f; color:#ffe9a8; font-family:"Fredoka",sans-serif; font-weight:700; font-size:11px; letter-spacing:.22em; padding:2px 10px 2px 12px; border-radius:99px; }

  .note-fly{ position:absolute; z-index:9; font-size:20px; pointer-events:none; animation:noteUp 0.9s ease-out forwards; }
  @keyframes noteUp{ 0%{ transform:translateY(0) scale(.7); opacity:0;} 20%{ opacity:1;} 100%{ transform:translateY(-46px) scale(1.15) rotate(12deg); opacity:0;} }
  .confetti{ position:absolute; z-index:9; width:11px; height:11px; border-radius:3px; pointer-events:none; }

  /* ---------- start panel / win ---------- */
  #startPanel{ position:absolute; z-index:8; left:50%; top:45%; transform:translate(-50%,-50%); width:min(94vw,452px); background:rgba(255,253,246,.98); border:3px solid #fff; border-radius:26px; box-shadow:0 10px 0 rgba(23,50,79,.12),0 24px 48px rgba(23,50,79,.25); padding:16px 18px 14px; text-align:center; max-height:92dvh; overflow:auto; }
  #startPanel[hidden]{ display:none; }
  #startPanel h1{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(26px,7vw,36px); margin:0; color:var(--ink); }
  #startPanel h1 .t-a{ color:#b3541e; } #startPanel h1 .t-b{ color:#2f83c4; }
  #startPanel p{ font-weight:800; color:var(--ink-soft); font-size:15px; line-height:1.4; margin:7px 0 0; }
  .mode-row{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:13px 0 4px; }
  .mode-chip{ flex:1 1 46%; border:3px solid #dcebf5; background:#f2f9ff; border-radius:16px; padding:8px 6px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:15.5px; color:var(--ink); cursor:pointer; line-height:1.15; }
  .mode-chip small{ display:block; font-family:"Nunito",sans-serif; font-weight:800; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .mode-chip.selected{ border-color:var(--sun); background:#fff6dd; box-shadow:0 4px 0 rgba(232,169,12,.4); }
  #playBtn{ margin-top:12px; border:none; cursor:pointer; background:#b3541e; color:#fff; font-family:"Fredoka",sans-serif; font-weight:700; font-size:23px; padding:12px 44px; border-radius:999px; box-shadow:0 6px 0 #7a3410,0 14px 24px rgba(122,52,16,.35); transition:transform .12s ease; }
  #playBtn:active{ transform:scale(.95); }
  #winOverlay{ position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(23,50,79,.38); padding:14px; }
  #winOverlay[hidden]{ display:none; }
  #winCard{ background:var(--paper); border:3px solid #fff; border-radius:26px; box-shadow:0 12px 0 rgba(23,50,79,.15),0 30px 60px rgba(23,50,79,.3); padding:20px 22px 18px; text-align:center; width:min(94vw,470px); max-height:92dvh; overflow:auto; }
  #winStars{ font-size:30px; letter-spacing:6px; color:#e3edf5; line-height:1; }
  #winStars span{ display:inline-block; }
  #winStars span.lit{ color:var(--sun); text-shadow:0 0 14px rgba(255,201,60,.8); animation:starLit .4s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starLit{ 0%{ transform:scale(.3) rotate(-30deg);} 100%{ transform:scale(1) rotate(0);} }
  #winCard h2{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(25px,6.6vw,34px); margin:8px 0 0; }
  #winRecap{ font-weight:800; color:var(--ink-soft); font-size:15.5px; line-height:1.45; margin:8px 0 0; }
  #winChips{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
  .chip{ background:#fdf3e7; border:2px solid #f0d3ae; color:var(--ink); font-family:"Fredoka",sans-serif; font-weight:600; font-size:14px; padding:4px 12px; border-radius:999px; }
  .win-btns{ display:flex; gap:9px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .win-btn{ border:none; cursor:pointer; font-family:"Fredoka",sans-serif; font-weight:700; font-size:18px; padding:11px 24px; border-radius:999px; }
  #againBtn{ background:#b3541e; color:#fff; box-shadow:0 5px 0 #7a3410; }
  #winHomeBtn{ background:#eef5fb; color:var(--ink); box-shadow:0 5px 0 #cfdfec; }
  .win-btn:active{ transform:scale(.95); }

  @media (max-height:500px) and (min-width:560px){
    #hootFig{ width:clamp(76px,22vh,100px); }
    .pad svg{ max-height:48px; }
    #targetCard{ margin-top:4px; padding:4px 8px 4px 12px; }
    #startPanel{ top:50%; padding:10px 16px; }
    .beat-slot{ width:30px; height:30px; }
  }
  @media (prefers-reduced-motion:reduce){
    .note-decor{ animation:none !important; }
  }
  /* Wave 5A + 5C-4 (Big & Physical): giant 3D tactile instrument pads & wide stage floor */
  @media (orientation:landscape) and (min-width:768px) and (min-height:541px){
    #stageFloor{
      max-width:min(92vw,940px) !important; gap:18px !important; padding:14px 18px !important;
      border-width:4px !important; border-radius:26px !important;
    }
    .pad{
      max-width:210px !important; min-height:132px !important; padding:12px 8px 8px !important;
      border:4px solid rgba(255,255,255,.92) !important; border-radius:24px !important;
      box-shadow:0 8px 0 rgba(23,38,59,.28), 0 14px 22px rgba(0,0,0,.18), inset 0 6px 12px rgba(255,255,255,.28) !important;
    }
    .pad svg{ max-height:90px !important; filter:drop-shadow(0 5px 6px rgba(0,0,0,.22)); }
    .pad .pad-name{ font-size:18px !important; font-weight:700 !important; margin-top:4px !important; }
    #actionRow{ max-width:760px !important; gap:16px !important; }
    #targetCard{ margin-top:4px !important; border:4px solid #fff !important; box-shadow:0 7px 0 rgba(23,50,79,.16) !important; }
  }
</style>
</head>
<body>
<div id="stage">
  <button class="decor" id="sun" type="button" aria-label="Sun — tap for a sparkle">
    <svg viewBox="0 0 100 100" aria-hidden="true"><g class="rays" stroke="#ffb703" stroke-width="6" stroke-linecap="round"><path d="M50 2v12M50 86v12M2 50h12M86 50h12M16 16l8 8M76 76l8 8M84 16l-8 8M24 76l-8 8"/></g><circle cx="50" cy="50" r="27" fill="#ffc93c" stroke="#f0a500" stroke-width="3"/><circle cx="41" cy="46" r="3.4" fill="#17324f"/><circle cx="59" cy="46" r="3.4" fill="#17324f"/><path d="M40 58 Q50 66 60 58" stroke="#17324f" stroke-width="3.4" fill="none" stroke-linecap="round"/></svg>
  </button>
  <svg class="leaf-tree" style="left:-30px" viewBox="0 0 120 160" aria-hidden="true"><path d="M56 160 L60 84 L64 160 Z" fill="#8a5a2b"/><circle cx="34" cy="52" r="30" fill="#57cc62"/><circle cx="66" cy="34" r="34" fill="#3da147"/><circle cx="88" cy="58" r="26" fill="#57cc62"/></svg>
  <svg class="leaf-tree" style="right:-30px" viewBox="0 0 120 160" aria-hidden="true"><path d="M56 160 L60 84 L64 160 Z" fill="#8a5a2b"/><circle cx="34" cy="52" r="30" fill="#3da147"/><circle cx="66" cy="34" r="34" fill="#57cc62"/><circle cx="88" cy="58" r="26" fill="#3da147"/></svg>
  <span class="note-decor" style="left:16%;top:20%;font-size:26px">♪</span>
  <span class="note-decor" style="right:15%;top:26%;font-size:20px;animation-delay:-2s">♫</span>
  <span class="note-decor" style="left:24%;top:44%;font-size:18px;animation-delay:-3.5s">♩</span>

  <div id="hud">
    <div class="hud-btns">
      <button class="round-btn" id="soundBtn" type="button" aria-label="Turn sound off">
        <svg id="soundOnIc" viewBox="0 0 24 24" fill="none" stroke="#17324f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="#ffc93c" stroke="#17324f"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.2 6a9 9 0 0 1 0 12"/></svg>
        <svg id="soundOffIc" viewBox="0 0 24 24" fill="none" stroke="#17324f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z" fill="#dbe7f2" stroke="#17324f"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
      </button>
      <button class="round-btn" id="homeBtn" type="button" aria-label="Back to the start screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="#17324f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M6 10v9h12v-9" fill="#aee7ff"/></svg>
      </button>
    </div>
    <div id="starBank" aria-label="Stars collected">
      <svg class="star-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z" fill="#ffc93c" stroke="#e8a90c" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <span id="starCount">0</span>
    </div>
  </div>

  <div id="targetCard" style="display:none">
    <div>
      <div id="targetMain">Round 1</div>
      <div class="tc-label" id="tcLabel">Hoot&rsquo;s tune has 3 beats</div>
      <div id="progressDots"></div>
    </div>
    <button id="hearBtn" type="button" aria-label="Hear Hoot again">
      <svg viewBox="0 0 24 24" fill="none" stroke="#17324f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="#ffc93c" stroke="#17324f"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.2 6a9 9 0 0 1 0 12"/></svg>
    </button>
  </div>

  <div id="scene">
    <div id="hootStage">
      <button id="hootFig" type="button" aria-label="Band leader Hoot — tap to hear him again">
        <svg viewBox="0 0 200 210" aria-hidden="true">
          <path d="M82 178 L100 205 L118 178 Z" fill="#8a5a33"/>
          <ellipse class="wing-l" cx="34" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(14 34 128)"/>

  /* ================= HOOT'S VOICE — one line at a time, chained on 'ended' =================

    stars=0; tuneIdx=0; step=0; wonFlag=false; phase="idle";
    hootFig.classList.remove("conducting");
    winOverlay.hidden=true; startPanel.hidden=true;
    state="playing"; updateHUD();
    var jam=(mode==="jam");
    hootRow.style.display=jam?"none":"flex"; echoRow.style.display=jam?"none":"flex";
    hootRowLabel.style.display=jam?"none":"block"; echoLabel.style.display=jam?"none":"block";
    $("actionRow").style.display=jam?"none":"flex";
    targetCard.style.display="flex";
    if(jam){
      targetMain.textContent="Free Jam";
      tcLabel.textContent="Tap the instruments — Hoot dances along!";
      buildRows(0);
      say("Free jam! Tap the drum, xylophone, bells and shaker any way you like — I&rsquo;ll dance to YOUR music!");
      enqueue("hoot-game-hello.mp3","hello","",null);
      return;
    }
    enqueue("hoot-game-hello.mp3","hello","",function(){ say("Welcome to the music grove! Watch my tune, then copy it!"); });
    newTune();
  }
  function winRound(){
    if(wonFlag) return; wonFlag=true; state="won";
    targetCard.style.display="none";
    vQueue=vQueue.filter(function(q){ return q.kind==="praise"; });
    enqueue("hoot-you-learned.mp3","recap","",function(){
      say("You copied all three of my tunes! What amazing ears you have!");
    });
    winChips.innerHTML="";
    TUNE_LENGTHS.forEach(function(len,i){
      var c=document.createElement("span"); c.className="chip"; c.textContent="Tune "+(i+1)+" · "+len+" beats ✓"; winChips.appendChild(c);
    });
    winRecap.innerHTML="You copied all three of Hoot&rsquo;s tunes — <b>3 beats, then 4, then the long one with 5 beats</b> — every echo exactly right. Hoot&rsquo;s band wants YOU as its star player!";
    var starEls=winStars.children;
    for(var i=0;i<starEls.length;i++){
      starEls[i].classList.remove("lit");
      (function(el,d){ setTimeout(function(){ el.classList.add("lit"); },d); })(starEls[i],200+i*180);
    }
    (window.__hwFastWin||setTimeout)(function(){ if(state==="won"&&!dead){ winOverlay.hidden=false; confetti(); sparkleSound(); } },400);
  }
  function resetToStart(){
    clearPending(); roundToken++;
    clearDemoTimers();
    state="start"; phase="idle"; wonFlag=false;
    hootFig.classList.remove("conducting");
    winOverlay.hidden=true; startPanel.hidden=false;
    targetCard.style.display="none";
    say("Welcome to the music grove! I&rsquo;m band leader Hoot — tap <span class='b-big'>Play</span>, watch my tune, then copy it!");
    hootFig.classList.add("wave");
    setTimeout(function(){ hootFig.classList.remove("wave"); },2900);
  }

  /* ================= CONTROLS ================= */
  playTuneBtn.addEventListener("click",function(){
    audio();
    if(phase==="idle") playTune(false);
  });
  listenBtn.addEventListener("click",function(){
    audio();
    if(phase!=="copy"||relisten<=0) return;
    relisten--;
    listenBtn.textContent="👂 Hear It Again ("+relisten+" free)";
    listenBtn.disabled=true;
    playTune(true);
  });
  function hearAgain(){
    audio();
    if(state==="playing"&&mode==="copy"){
      if(phase==="copy"&&pattern.length){
        say("My tune starts with the <span class='b-big'>"+pattern[0].name+"</span> — and it has "+pattern.length+" beats. You can do it!");
        if(!vPlaying) enqueue("hoot-look-closely.mp3","look","",null);
      } else if(phase==="idle"){
        say("Tap <span class='b-big'>Play Hoot&rsquo;s Tune</span> and watch my pattern light up!");
      } else if(!vPlaying) if(window.__hootSpeak) window.__hootSpeak("idle");
    } else if(!vPlaying){ if(window.__hootSpeak) window.__hootSpeak("idle"); hootReact("celebrate",1000); }
  }
  hootFig.addEventListener("click",hearAgain);
  $("hearBtn").addEventListener("click",hearAgain);
  $("soundBtn").addEventListener("click",function(){
    soundOn=!soundOn;
    $("soundOnIc").style.display=soundOn?"block":"none";
    $("soundOffIc").style.display=soundOn?"none":"block";
    $("soundBtn").setAttribute("aria-label",soundOn?"Turn sound off":"Turn sound on");
    if(!soundOn){ clearPending(); }
    else { audio(); tone(660,660,0.1,"triangle",0.12); }
  });
  $("homeBtn").addEventListener("click",function(){ audio(); tone(520,520,0.09,"triangle",0.1); resetToStart(); });
  document.querySelectorAll(".mode-chip").forEach(function(ch){
    ch.addEventListener("click",function(){
      mode=ch.getAttribute("data-mode");
      document.querySelectorAll(".mode-chip").forEach(function(c){ c.classList.toggle("selected",c===ch); });
      tone(660,660,0.1,"triangle",0.1);
    });
  });
  $("playBtn").addEventListener("click",function(){ audio(); tone(740,740,0.1,"triangle",0.12); startRound(); });
  $("againBtn").addEventListener("click",function(){ audio(); tone(740,740,0.1,"triangle",0.12); startRound(); });
  $("winHomeBtn").addEventListener("click",function(){ audio(); resetToStart(); });

  /* ================= LIVING SCENE TAPS ================= */
  $("sun").addEventListener("click",function(){
    audio(); var s=$("sun"); s.classList.remove("zing"); void s.offsetWidth; s.classList.add("zing");
    sparkleSound();
    if(state==="start") say("Mr. Sun keeps our music grove warm and bright!");
  });

  /* ================= LEAVING THE GAME ================= */
  function teardown(){
    dead=true; clearPending(); hootTalking(false); clearDemoTimers();
    hootFig.classList.remove("conducting");
  }
  window.addEventListener("pagehide",teardown);
  document.addEventListener("visibilitychange",function(){ if(document.hidden) clearPending(); });

  /* ================= INIT ================= */
  buildPads();
  updateHUD();
  hootFig.classList.add("wave");
  setTimeout(function(){ hootFig.classList.remove("wave"); },2900);

  /* Probe/debug handle: read-only snapshot of the round state. */
  window.__bandGame={
    snapshot:function(){
      return { state:state, mode:mode, phase:phase, stars:stars, tuneIdx:tuneIdx,
        pattern:pattern.map(function(p){ return p.id; }), step:step, relisten:relisten,
        winShown:!winOverlay.hidden, voicePlaying:vPlaying,
        voiceQueue:vQueue.map(function(q){ return q.file; }) };
    }
  };
})();
</script>
