<title>Copy the Beat</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root{
    --ink:#1b2640;
    --cream:#fffdf7;
    --sun:#ffc93c;
    --wood:#9a5825;
    --wood-dark:#5c3110;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; width:100%; margin:0; padding:0; overflow:hidden; }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#2a1b47;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ================= SUNSET TREEHOUSE BANDSTAND STAGE ================= */
  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:linear-gradient(180deg,
      #34205c 0%,
      #59327c 26%,
      #a84b7a 52%,
      #f08d58 70%,
      #8b5224 71%,
      #633715 100%);
  }

  /* Warm glowing string fairy lights across stage top */
  #lightsSvg{
    position:absolute;
    top:0; left:0;
    width:100%; height:90px;
    pointer-events:none;
    z-index:2;
  }
  .bulb{ animation:bulbTwinkle 2.2s ease-in-out infinite alternate; }
  @keyframes bulbTwinkle{ from{opacity:.65} to{opacity:1} }

  /* ================= TOP HUD (>=64px) ================= */
  #hud{
    position:relative;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 4px max(10px, env(safe-area-inset-left));
    flex:0 0 auto;
  }
  .hud-group{ display:flex; align-items:center; gap:8px; }
  .hud-pill{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 16px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,247,.96);
    color:var(--ink);
    font-size:28px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(25,15,45,.32), 0 10px 18px rgba(0,0,0,.22);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .15s;
  }
  .hud-pill:active{ transform:translateY(3px) scale(.94); }
  .hud-pill.round{ width:64px; padding:0; border-radius:50%; }
  .hud-pill.active{
    background:linear-gradient(180deg,#ffe473,#ffc93c);
    box-shadow:0 5px 0 #c98600, 0 0 0 3.5px var(--ink);
  }
  #grooveBtn.active{
    background:linear-gradient(180deg,#ff85a8,#ec4899);
    color:#fff;
    box-shadow:0 5px 0 #9d174d, 0 0 0 3.5px #ffe066;
  }
  #starBank{
    min-height:64px;
    padding:0 16px 0 11px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,247,.96);
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:25px;
    font-weight:700;
    box-shadow:0 5px 0 rgba(25,15,45,.32);
  }
  #starBank svg{ width:28px; height:28px; display:block; }
  #starBank.bump{ animation:starBump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{ 0%{transform:scale(1)} 45%{transform:scale(1.2) rotate(-4deg)} 100%{transform:scale(1)} }

  /* ================= BANDLEADER HOOT + RHYTHM ORBS ================= */
  #leaderArea{
    position:relative;
    z-index:8;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:4px 12px;
  }
  #hootRow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
  }
  #hootLeader{
    width:clamp(108px, 16vw, 158px);
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    filter:drop-shadow(0 12px 16px rgba(20,10,40,.42));
    animation:leaderBounce 2.6s ease-in-out infinite;
    transform-origin:50% 90%;
  }
  @keyframes leaderBounce{ 0%,100%{transform:translateY(0) rotate(-1.5deg)} 50%{transform:translateY(-6px) rotate(1.5deg)} }
  #hootLeader.beat{ animation:leaderHit .28s cubic-bezier(.34,1.7,.5,1); }
  @keyframes leaderHit{ 0%{transform:scale(1)} 45%{transform:scale(1.12) translateY(-10px)} 100%{transform:scale(1)} }
  #hootLeader svg{ width:100%; height:auto; display:block; overflow:visible; }
  #hootLeader .baton{ transform-box:fill-box; transform-origin:10% 90%; transition:transform .14s; }
  #hootLeader.beat .baton{ transform:rotate(-34deg); }

  /* Replay Beat Pill beside Bandleader Hoot */
  #replayBtn{
    min-width:74px;
    min-height:74px;
    border-radius:50%;
    border:5px solid #fff;
    background:linear-gradient(180deg,#ffe473,#ffb703);
    color:var(--ink);
    font-size:32px;
    display:grid;
    place-items:center;
    cursor:pointer;
    box-shadow:0 7px 0 #b87400, 0 12px 24px rgba(0,0,0,.3);
    transition:transform .14s;
  }
  #replayBtn:active{ transform:translateY(3px) scale(.92); }
  #replayBtn.pulse{ animation:replayPulse .8s ease-in-out infinite alternate; }
  @keyframes replayPulse{ from{box-shadow:0 7px 0 #b87400, 0 0 0 0 rgba(255,224,102,0)} to{box-shadow:0 7px 0 #b87400, 0 0 0 14px rgba(255,224,102,.5)} }

  /* Glowing Beat Rhythm Orbs */
  #beatTrack{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:rgba(25,15,48,.62);
    border:3.5px solid rgba(255,224,102,.65);
    border-radius:999px;
    padding:8px 18px;
    min-height:62px;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
  }
  .beat-orb{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    border:3px solid rgba(255,255,255,.45);
    display:grid;
    place-items:center;
    font-size:24px;
    transition:transform .2s cubic-bezier(.34,1.7,.5,1), background .2s, box-shadow .2s;
  }
  .beat-orb.lit{
    transform:scale(1.22);
    border-color:#fff;
    box-shadow:0 0 18px rgba(255,224,102,.95);
  }
  .beat-orb.done{
    border-color:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.6);
  }

  /* ================= WOODEN BANDSTAND 4 GIANT INSTRUMENT PADS ================= */
  #bandstand{
    position:relative;
    z-index:12;
    flex:0 0 auto;
    padding:14px max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background:linear-gradient(180deg, #b87032 0%, #8a4e1d 55%, #5c3110 100%);
    border-top:6px solid #e6a866;
    box-shadow:0 -10px 26px rgba(15,8,30,.45), inset 0 4px 10px rgba(255,235,195,.35);
  }
  #padGrid{
    display:grid;
    grid-template-columns:repeat(4, minmax(0, 1fr));
    gap:clamp(10px, 2vw, 22px);
    max-width:960px;
    margin:0 auto;
  }
  .inst-pad{
    position:relative;
    height:clamp(132px, 26vh, 210px);
    border-radius:28px;
    border:5px solid #fff;
    background:radial-gradient(circle at 32% 24%, var(--phi) 0%, var(--pcol) 60%, var(--pdeep) 100%);
    box-shadow:0 10px 0 var(--pdeep), 0 16px 26px rgba(15,8,30,.4);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8px;
    transition:transform .09s cubic-bezier(.34,1.6,.5,1), filter .1s;
    touch-action:manipulation;
  }
  .inst-pad svg{
    width:82%;
    height:82%;
    max-width:136px;
    max-height:136px;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.28));
    pointer-events:none;
  }
  .inst-pad.hit{
    transform:translateY(8px) scale(.95);
    box-shadow:0 2px 0 var(--pdeep), 0 0 0 6px #ffe066, 0 0 34px rgba(255,224,102,.95);
    filter:brightness(1.18);
  }
  .inst-pad.cue{
    box-shadow:0 10px 0 var(--pdeep), 0 0 0 6px #ffe066, 0 0 28px rgba(255,224,102,.95);
    animation:padBounce .65s ease-in-out infinite alternate;
  }
  @keyframes padBounce{ from{transform:translateY(0)} to{transform:translateY(-8px)} }

  .glyph-pop{
    position:absolute;
    z-index:25;
    font-size:42px;
    font-weight:700;
    color:#ffe066;
    pointer-events:none;
    text-shadow:0 3px 0 #1b2640;
  }

  /* ================= WIN OVERLAY ================= */
  #winOverlay{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(20,10,42,.55);
    padding:16px;
  }
  #winOverlay[hidden]{ display:none; }
  #winCard{
    background:var(--cream);
    border:6px solid #fff;
    border-radius:36px;
    box-shadow:0 16px 46px rgba(0,0,0,.45);
    padding:24px 28px;
    text-align:center;
    width:min(90vw, 390px);
    animation:cardPop .45s cubic-bezier(.34,1.6,.5,1);
  }
  @keyframes cardPop{ from{transform:scale(.6) translateY(28px); opacity:0} to{transform:scale(1) translateY(0); opacity:1} }
  #winStars{ font-size:44px; letter-spacing:8px; color:#d9e2ec; }
  #winStars .lit{ color:var(--sun); text-shadow:0 3px 0 #d99400; }
  #winTrophy{ font-size:58px; margin:8px 0 18px; }
  #againBtn{
    min-width:168px;
    min-height:74px;
    border-radius:999px;
    border:4px solid #fff;
    background:linear-gradient(180deg,#6ce078,#3db84d);
    color:#fff;
    font-family:"Fredoka",sans-serif;
    font-size:32px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 7px 0 #238030;
  }
  .confetti{ position:absolute; z-index:32; width:12px; height:16px; border-radius:3px; pointer-events:none; }

  /* ================= PORTRAIT PHONE RESPONSIVE ================= */
  @media (max-width:600px){
    .hud-pill{ min-width:56px; min-height:56px; height:56px; padding:0 12px; font-size:24px; }
    .hud-pill.round{ width:56px; }
    #starBank{ min-height:56px; font-size:22px; padding:0 12px 0 9px; }
    #hootLeader{ width:104px; }
    #replayBtn{ min-width:62px; min-height:62px; font-size:26px; }
    #padGrid{ grid-template-columns:repeat(2, 1fr); gap:10px; }
    .inst-pad{ height:clamp(108px, 19vh, 146px); border-radius:22px; }
    .beat-orb{ width:36px; height:36px; font-size:20px; }
  }
</style>
</head>
<body>
<div id="stage">
  <!-- Glowing Festival String Lights -->
  <svg id="lightsSvg" viewBox="0 0 1000 90" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    <path d="M0 16 Q250 66 500 22 T1000 16" stroke="#2c194a" stroke-width="4" fill="none"/>
    <circle class="bulb" cx="90" cy="34" r="9" fill="#ffe066"/>
    <circle class="bulb" cx="200" cy="46" r="9" fill="#ff75a0" style="animation-delay:-.5s"/>

    <circle class="bulb" cx="440" cy="28" r="9" fill="#72ef7a" style="animation-delay:-1.5s"/>
    <circle class="bulb" cx="560" cy="28" r="9" fill="#ffe066" style="animation-delay:-.3s"/>
    <circle class="bulb" cx="680" cy="44" r="9" fill="#ff75a0" style="animation-delay:-.8s"/>
    <circle class="bulb" cx="800" cy="46" r="9" fill="#6ccdff" style="animation-delay:-1.3s"/>
    <circle class="bulb" cx="910" cy="34" r="9" fill="#72ef7a" style="animation-delay:-1.8s"/>
  </svg>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-group">
      <button class="hud-pill active" id="modeCopyBtn" type="button" aria-label="Copy the Beat" aria-pressed="true">🥁</button>
      <button class="hud-pill" id="modeJamBtn" type="button" aria-label="Free Band Jam" aria-pressed="false">🎶</button>
      <button class="hud-pill round" id="grooveBtn" type="button" aria-label="Toggle Backing Groove" aria-pressed="false" style="display:none">💃</button>
      <button class="hud-pill round" id="soundBtn" type="button" aria-label="Toggle Sound">🔊</button>
    </div>
    <div id="starBank" aria-label="Stars collected">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4l3 6 6.6.9-4.8 4.6 1.1 6.6L12 17.4l-5.9 3.1 1.1-6.6-4.8-4.6 6.6-.9z" fill="#ffc93c" stroke="#d99400" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span id="starCount">0</span>
    </div>
  </div>

  <!-- Bandleader Hoot + Rhythm Orbs -->
  <div id="leaderArea">
    <div id="hootRow">
      <button id="hootLeader" type="button" aria-label="Bandleader Hoot — tap to replay beat">
        <svg viewBox="0 0 220 215" aria-hidden="true">
          <ellipse cx="100" cy="130" rx="60" ry="60" fill="#a26636" stroke="#4a2810" stroke-width="5"/>
          <ellipse cx="100" cy="146" rx="40" ry="40" fill="#fdecd2"/>
          <ellipse cx="42" cy="134" rx="18" ry="34" fill="#8b5226" stroke="#4a2810" stroke-width="4" transform="rotate(14 42 134)"/>
          <ellipse cx="158" cy="130" rx="18" ry="34" fill="#8b5226" stroke="#4a2810" stroke-width="4" transform="rotate(-18 158 130)"/>
          <!-- Conductor Baton -->
          <g class="baton">
            <line x1="166" y1="122" x2="206" y2="76" stroke="#fffdf7" stroke-width="6.5" stroke-linecap="round"/>
            <circle cx="207" cy="75" r="8" fill="#ffe066" stroke="#c98600" stroke-width="2.5"/>
          </g>
          <circle cx="100" cy="80" r="49" fill="#a26636" stroke="#4a2810" stroke-width="5"/>
          <ellipse cx="79" cy="82" rx="22" ry="24" fill="#fdecd2"/>
          <ellipse cx="121" cy="82" rx="22" ry="24" fill="#fdecd2"/>
          <circle cx="79" cy="80" r="11" fill="#1b2640"/><circle cx="121" cy="80" r="11" fill="#1b2640"/>
          <circle cx="83" cy="76" r="4" fill="#fff"/><circle cx="125" cy="76" r="4" fill="#fff"/>
          <circle cx="57" cy="99" r="8" fill="#ff9e8a" opacity=".82"/><circle cx="143" cy="99" r="8" fill="#ff9e8a" opacity=".82"/>
          <path d="M90 94 Q100 88 110 94 Q106 108 100 110 Q94 108 90 94 Z" fill="#ffab1f" stroke="#b56200" stroke-width="2.5"/>
          <!-- Marching Band Hat -->
          <rect x="64" y="14" width="72" height="30" rx="10" fill="#e63946" stroke="#4a2810" stroke-width="4"/>
          <rect x="64" y="34" width="72" height="10" fill="#ffd447" stroke="#4a2810" stroke-width="2.5"/>
          <ellipse cx="100" cy="46" rx="44" ry="8" fill="#1b2640"/>
          <path d="M100 2 L104 14 L96 14 Z" fill="#ffe066"/>
          <!-- Red Bow Tie -->
          <path d="M84 118 L100 126 L84 134 Z M116 118 L100 126 L116 134 Z" fill="#e63946" stroke="#7f1d1d" stroke-width="2.5"/>
          <circle cx="100" cy="126" r="5" fill="#ffd447"/>
          <path d="M78 192 q-8 8 -14 6 M122 192 q8 8 14 6" stroke="#ffab1f" stroke-width="5.5" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="replayBtn" type="button" aria-label="Watch Hoot play the beat again">🔊</button>
    </div>

    <div id="beatTrack" aria-label="Rhythm beat progress"></div>
  </div>

  <!-- Wooden Bandstand with 4 Giant Tactile Instrument Pads -->
  <div id="bandstand">
    <div id="padGrid" role="group" aria-label="Band instruments"></div>
  </div>

  <!-- Win Celebration Overlay -->
  <div id="winOverlay" hidden>
    <div id="winCard" role="dialog" aria-modal="true" aria-label="Concert Star!">
      <div id="winStars" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
      <div id="winTrophy" aria-hidden="true">🥁🌟🎶</div>
      <button id="againBtn" type="button" aria-label="Play Again">↻ ▶</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var PADS=[
    {id:"drum", emo:"🥁", word:"word-drum", col:"#ef4444", hi:"#ff9494", deep:"#a81d1d", glyph:"♩",
      svg:'<svg viewBox="0 0 110 92" aria-hidden="true"><path d="M22 30 L42 8 M88 30 L68 8" stroke="#fde2b8" stroke-width="6" stroke-linecap="round"/><circle cx="42" cy="8" r="6" fill="#ffe066"/><circle cx="68" cy="8" r="6" fill="#ffe066"/><ellipse cx="55" cy="34" rx="38" ry="12" fill="#fffdf7" stroke="#4a2810" stroke-width="3.5"/><path d="M17 34 L22 76 Q55 86 88 76 L93 34 Q55 46 17 34 Z" fill="#ffd447" stroke="#4a2810" stroke-width="3.5"/><path d="M19 48 L36 68 L55 46 L74 68 L91 48" stroke="#ef4444" stroke-width="5" fill="none" stroke-linejoin="round"/></svg>'},
    {id:"xylo", emo:"🎹", word:"word-xylophone", col:"#3b82f6", hi:"#93c5fd", deep:"#1d4ed8", glyph:"♪",
      svg:'<svg viewBox="0 0 110 92" aria-hidden="true"><rect x="10" y="14" width="15" height="62" rx="6" fill="#ff595e" stroke="#1b2640" stroke-width="3"/><rect x="29" y="18" width="15" height="54" rx="6" fill="#ffca3a" stroke="#1b2640" stroke-width="3"/><rect x="48" y="22" width="15" height="46" rx="6" fill="#57cc62" stroke="#1b2640" stroke-width="3"/><rect x="67" y="26" width="15" height="38" rx="6" fill="#38bdf8" stroke="#1b2640" stroke-width="3"/><rect x="86" y="30" width="15" height="30" rx="6" fill="#c084fc" stroke="#1b2640" stroke-width="3"/><circle cx="17.5" cy="24" r="2.8" fill="#fff"/><circle cx="36.5" cy="28" r="2.8" fill="#fff"/><circle cx="55.5" cy="32" r="2.8" fill="#fff"/><circle cx="74.5" cy="36" r="2.8" fill="#fff"/><circle cx="93.5" cy="40" r="2.8" fill="#fff"/></svg>'},
    {id:"bells", emo:"🔔", word:"word-bells", col:"#f59e0b", hi:"#fde68a", deep:"#b45309", glyph:"♫",
      svg:'<svg viewBox="0 0 110 92" aria-hidden="true"><path d="M55 10 a8 8 0 0 1 8 8" fill="none" stroke="#4a2810" stroke-width="4.5"/><path d="M28 68 Q28 24 55 20 Q82 24 82 68 L90 76 H20 Z" fill="#ffe066" stroke="#4a2810" stroke-width="4" stroke-linejoin="round"/><circle cx="55" cy="82" r="7.5" fill="#d97706" stroke="#4a2810" stroke-width="3"/><path d="M38 38 Q36 52 38 62" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".75"/></svg>'},
    {id:"shaker", emo:"🪇", word:"word-shaker", col:"#22c55e", hi:"#86efac", deep:"#15803d", glyph:"♬",
      svg:'<svg viewBox="0 0 110 92" aria-hidden="true"><path d="M48 56 L42 84 Q55 90 68 84 L62 56 Z" fill="#c88542" stroke="#4a2810" stroke-width="3.5"/><ellipse cx="55" cy="36" rx="26" ry="30" fill="#ec4899" stroke="#4a2810" stroke-width="4"/><path d="M30 34 Q55 44 80 34" stroke="#ffe066" stroke-width="7" fill="none"/><circle cx="44" cy="22" r="4" fill="#ffe066"/><circle cx="66" cy="24" r="4" fill="#86efac"/><circle cx="55" cy="49" r="4" fill="#93c5fd"/></svg>'}
  ];

  var TUNE_LENS=[2, 3, 4]; /* Toddler-friendly progressive beat lengths: 2 -> 3 -> 4! */
  var PRAISE=["hoot-great-job.mp3","hoot-amazing.mp3","hoot-star.mp3","hoot-super.mp3"];

  /* ================= STATE ================= */
  var mode="copy"; /* copy | jam */
  var phase="demo"; /* demo | copy | done | won */
  var tuneIdx=0, pattern=[], step=0, stars=0, praiseIdx=0;
  var soundOn=true, dead=false, grooveOn=false, grooveTimer=null, grooveStep=0;
  var padEls={}, timers=[];

  function $(id){ return document.getElementById(id); }
  var stage=$("stage"), padGrid=$("padGrid"), beatTrack=$("beatTrack"),
      hootLeader=$("hootLeader"), replayBtn=$("replayBtn"),
      starCount=$("starCount"), starBank=$("starBank"),
      modeCopyBtn=$("modeCopyBtn"), modeJamBtn=$("modeJamBtn"),
      grooveBtn=$("grooveBtn"), soundBtn=$("soundBtn"),
      winOverlay=$("winOverlay"), winStars=$("winStars");

  function later(fn,ms){ var id=setTimeout(fn,ms); timers.push(id); return id; }
  function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

  /* ================= INSTRUMENT SYNTH ================= */
  var AC=null;
  function audio(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
    if(AC&&AC.state==="suspended") AC.resume();
    return AC;
  }
  function tone(f0,f1,dur,type,vol,delay){
    if(!soundOn) return;
    var ac=audio(); if(!ac) return;
    var t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.16,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
  }
  function noiseBurst(dur,vol){
    if(!soundOn) return;
    var ac=audio(); if(!ac) return;
    var t=ac.currentTime, len=Math.max(1,(ac.sampleRate*dur)|0);
    var buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    var src=ac.createBufferSource(); src.buffer=buf;
    var f=ac.createBiquadFilter(); f.type="highpass"; f.frequency.value=2600;
    var g=ac.createGain(); g.gain.setValueAtTime(vol||0.18,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t);
  }
  function playPadAudio(id){
    if(id==="drum"){ tone(165,52,0.24,"sine",0.3); tone(120,45,0.18,"triangle",0.18); }
    else if(id==="xylo"){ tone(784,784,0.26,"triangle",0.2); tone(1175,1175,0.2,"sine",0.1); }
    else if(id==="bells"){ tone(1318,1318,0.45,"sine",0.15); tone(1975,1975,0.36,"sine",0.08); }
    else if(id==="shaker"){ noiseBurst(0.11,0.2); setTimeout(function(){ noiseBurst(0.09,0.14); }, 65); }
  }

  /* ================= STUDIO HOOT VOICE ================= */
  var VBASE="assets/voice/";
  var voiceEl=null;
  function hasClip(id){
    try{ var H=window.parent&&window.parent.HOOT_HAVE; if(H) return !!H[id]; }catch(e){}
    return true;
  }
  function hubQuiet(){
    try{
      var d=window.parent&&window.parent.document;
      if(!d||d===document) return false;
      var b=d.querySelector('.voice-btn[data-voice="off"]');
      return !!(b&&(b.classList.contains("sel")||b.classList.contains("active")||b.getAttribute("aria-pressed")==="true"));
    }catch(e){ return false; }
  }
  function speakClip(file, giggle){
    if(!soundOn||hubQuiet()||dead) return;
    if(!voiceEl){ voiceEl=new Audio(); voiceEl.preload="auto"; }
    if(giggle) window.__bellyArmed=true;
    voiceEl.src=VBASE+file;
    var p=voiceEl.play();
    if(giggle) setTimeout(function(){ window.__bellyArmed=false; }, 120);
    if(p&&p.catch) p.catch(function(){});
  }

  /* ================= FX ================= */
  function popGlyph(pad, el){
    var sr=stage.getBoundingClientRect(), r=el.getBoundingClientRect();
    var g=document.createElement("span");
    g.className="glyph-pop";
    g.textContent=pad.glyph;
    g.style.left=(r.left-sr.left+r.width/2-16)+"px";
    g.style.top=(r.top-sr.top-10)+"px";
    stage.appendChild(g);
    if(g.animate){
      g.animate([
        {transform:"translate(0,0) scale(.6)", opacity:1},
        {transform:"translate(0,-92px) scale(1.3)", opacity:0}
      ],{duration:680, easing:"cubic-bezier(.2,.7,.3,1)"});
    }
    setTimeout(function(){ g.remove(); }, 720);
  }
  function spawnConfetti(n){
    var sr=stage.getBoundingClientRect();
    var cols=["#ff595e","#ffe066","#57cc62","#38bdf8","#c084fc","#ff85a8"];
    for(var i=0;i<(n||38);i++){
      var c=document.createElement("div"); c.className="confetti";
      c.style.background=cols[i%cols.length];
      c.style.left=(sr.width*0.5)+"px"; c.style.top=(sr.height*0.3)+"px";
      stage.appendChild(c);
      var dx=(Math.random()-0.5)*sr.width*0.85, dy=130+Math.random()*sr.height*0.46, rot=(Math.random()*2-1)*380;
      if(c.animate){
        c.animate([
          {transform:"translate(0,0) rotate(0deg)", opacity:1},
          {transform:"translate("+dx+"px,"+dy+"px) rotate("+rot+"deg)", opacity:0}
        ],{duration:1100+Math.random()*650, easing:"cubic-bezier(.2,.7,.3,1)"});
      }
      (function(el){ setTimeout(function(){ el.remove(); }, 1850); })(c);
    }
  }

  /* ================= BUILD 4 GIANT PADS ================= */
  PADS.forEach(function(p){
    var b=document.createElement("button");
    b.type="button";
    b.className="inst-pad";
    b.dataset.id=p.id;
    b.style.setProperty("--pcol", p.col);
    b.style.setProperty("--phi", p.hi);
    b.style.setProperty("--pdeep", p.deep);
    b.setAttribute("aria-label", p.id);
    b.innerHTML=p.svg;
    b.addEventListener("pointerdown",function(e){
      e.preventDefault();
      onPadTap(p);
    });
    padGrid.appendChild(b);
    padEls[p.id]=b;
  });

  function hitVisual(p){
    var el=padEls[p.id];
    el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit");
    setTimeout(function(){ el.classList.remove("hit"); }, 260);
    hootLeader.classList.remove("beat"); void hootLeader.offsetWidth; hootLeader.classList.add("beat");
    popGlyph(p, el);
  }

  /* ================= COPY THE BEAT FLOW ================= */
  function renderTrack(highlightIdx){
    beatTrack.innerHTML="";
    if(mode==="jam"){
      beatTrack.style.display="none";
      return;
    }
    beatTrack.style.display="flex";
    pattern.forEach(function(p, i){
      var orb=document.createElement("span");
      var isDone=(phase==="copy" && i<step) || phase==="done" || phase==="won";
      var isLit=(highlightIdx===i);
      orb.className="beat-orb"+(isLit?" lit":"")+(isDone?" done":"");
      if(isLit || isDone){
        orb.style.background=p.col;
        orb.textContent=p.emo;
      } else {
        orb.textContent="●";
        orb.style.color="rgba(255,255,255,.35)";
      }
      beatTrack.appendChild(orb);
    });
  }

  function clearCues(){
    PADS.forEach(function(p){ padEls[p.id].classList.remove("cue"); });
  }

  function buildPattern(len){
    var out=[];
    for(var i=0;i<len;i++){
      var pick=PADS[Math.floor(Math.random()*PADS.length)];
      if(i>0 && len>=3 && pick.id===out[i-1].id && Math.random()<0.6){
        pick=PADS[(PADS.indexOf(pick)+1)%PADS.length];
      }
      out.push(pick);
    }
    return out;
  }

  function playDemo(isFirstBoot){
    clearTimers();
    clearCues();
    phase="demo";
    step=0;
    replayBtn.classList.remove("pulse");
    renderTrack(-1);
    if(!isFirstBoot && hasClip("band-watch-listen")) speakClip("band-watch-listen.mp3", false);

    var startDelay=isFirstBoot?700:550;
    pattern.forEach(function(p, i){
      later(function(){
        if(dead || mode!=="copy") return;
        playPadAudio(p.id);
        hitVisual(p);
        renderTrack(i);
      }, startDelay + i*640);
    });
    later(function(){
      if(dead || mode!=="copy") return;
      phase="copy";
      renderTrack(-1);
      if(hasClip("say-your-turn")) speakClip("say-your-turn.mp3", false);
      padEls[pattern[0].id].classList.add("cue");
    }, startDelay + pattern.length*640 + 280);
  }

  function startTune(isFirstBoot){
    pattern=buildPattern(TUNE_LENS[tuneIdx]);
    playDemo(isFirstBoot);
  }

  function startGame(isFirstBoot){
    clearTimers();
    stopGroove();
    tuneIdx=0; stars=0;
    starCount.textContent="0";
    winOverlay.hidden=true;
    if(mode==="copy"){
      replayBtn.style.display="grid";
      grooveBtn.style.display="none";
      startTune(isFirstBoot);
    } else {
      phase="jam";
      replayBtn.style.display="none";
      grooveBtn.style.display="inline-flex";
      clearCues();
      renderTrack(-1);
    }
  }

  function onPadTap(p){
    audio();
    playPadAudio(p.id);
    hitVisual(p);
    if(mode==="jam"){
      if(hasClip(p.word) && Math.random()<0.35) speakClip(p.word+".mp3", false);
      return;
    }
    if(phase!=="copy") return;
    clearCues();
    var expected=pattern[step];
    if(p.id === expected.id){
      step++;
      renderTrack(step-1);
      if(step>=pattern.length){
        phase="done";
        stars++;
        starCount.textContent=stars;
        starBank.classList.remove("bump"); void starBank.offsetWidth; starBank.classList.add("bump");
        var pr=PRAISE[praiseIdx%PRAISE.length]; praiseIdx++;
        if(!hasClip(pr.replace(".mp3",""))) pr="hoot-great-job.mp3";
        speakClip(pr, false);
        spawnConfetti(26);
        later(function(){
          if(dead || mode!=="copy") return;
          if(tuneIdx>=TUNE_LENS.length-1){
            showWin();
          } else {
            tuneIdx++;
            startTune(false);
          }
        }, 1250);
      } else {
        /* Gentle shimmer on next pad after slight beat */
        padEls[pattern[step].id].classList.add("cue");
      }
    } else {
      /* Kind try-again + highlight the expected pad & pulse replay button */
      speakClip("hoot-try-again.mp3", false);
      padEls[expected.id].classList.add("cue");
      replayBtn.classList.add("pulse");
    }
  }

  function showWin(){
    phase="won";
    winOverlay.hidden=false;
    var st=winStars.children;
    for(var i=0;i<st.length;i++){
      st[i].classList.remove("lit");
      (function(el,ms){ setTimeout(function(){ el.classList.add("lit"); }, ms); })(st[i], 180+i*180);
    }
    spawnConfetti(44);
    speakClip(hasClip("hoot-win-yay")?"hoot-win-yay.mp3":"hoot-amazing.mp3", false);
  }

  /* ================= FUN BACKING GROOVE IN FREE JAM ================= */
  function stopGroove(){
    grooveOn=false;
    if(grooveTimer){ clearInterval(grooveTimer); grooveTimer=null; }
    grooveBtn.classList.remove("active"); grooveBtn.setAttribute("aria-pressed","false");
  }
  function toggleGroove(){
    audio();
    if(grooveOn){ stopGroove(); return; }
    grooveOn=true; grooveStep=0;
    grooveBtn.classList.add("active"); grooveBtn.setAttribute("aria-pressed","true");
    grooveTimer=setInterval(function(){
      if(dead || !grooveOn || !soundOn) return;
      var s=grooveStep%4;
      if(s===0) tone(110,48,0.18,"sine",0.18);
      else if(s===2) noiseBurst(0.06,0.1);
      else tone(220,165,0.08,"triangle",0.07);
      hootLeader.classList.remove("beat"); void hootLeader.offsetWidth; hootLeader.classList.add("beat");
      grooveStep++;
    }, 420);
  }

  /* ================= CONTROLS ================= */
  modeCopyBtn.addEventListener("click",function(){
    audio(); mode="copy";
    modeCopyBtn.classList.add("active"); modeCopyBtn.setAttribute("aria-pressed","true");
    modeJamBtn.classList.remove("active"); modeJamBtn.setAttribute("aria-pressed","false");
    startGame(false);
  });
  modeJamBtn.addEventListener("click",function(){
    audio(); mode="jam";
    modeJamBtn.classList.add("active"); modeJamBtn.setAttribute("aria-pressed","true");
    modeCopyBtn.classList.remove("active"); modeCopyBtn.setAttribute("aria-pressed","false");
    startGame(false);
  });
  grooveBtn.addEventListener("click",toggleGroove);
  replayBtn.addEventListener("click",function(){ audio(); if(mode==="copy") playDemo(false); });
  soundBtn.addEventListener("click",function(){
    soundOn=!soundOn; soundBtn.textContent=soundOn?"🔊":"🔇";
    if(!soundOn && voiceEl) try{voiceEl.pause();}catch(e){}
  });
  $("againBtn").addEventListener("click",function(){ audio(); startGame(false); });

  var lastHootTap=0;
  hootLeader.addEventListener("click",function(){
    audio();
    hootLeader.classList.remove("beat"); void hootLeader.offsetWidth; hootLeader.classList.add("beat");
    if(mode==="copy" && phase==="copy"){ playDemo(false); return; }
    var now=Date.now();
    if(now-lastHootTap>7000){ lastHootTap=now; speakClip("hoot-giggle.mp3", true); }
  });

  window.addEventListener("pagehide",function(){ dead=true; clearTimers(); stopGroove(); if(voiceEl) try{voiceEl.pause();}catch(e){} });

  /* ================= BOOT ================= */
  startGame(true);

  window.__bandGame={
    snapshot:function(){
      return {
        mode:mode, phase:phase, tuneIdx:tuneIdx, patternLen:pattern.length,
        step:step, stars:stars, grooveOn:grooveOn, winShown:!winOverlay.hidden
      };
    }
  };
})();
</script>
