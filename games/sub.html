<!doctype html>
<html lang="en">
<head>
<base href="../">

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Captain Hoot's Submarine Letter Voyage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0b2239;
    --outline:#0c2340;
    --gold:#ffd43b;
    --aqua:#22d3ee;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  [hidden]{ display:none !important; }
  html,body{
    margin:0; width:100%; height:100%; overflow:hidden;
    font-family:"Nunito",system-ui,sans-serif;
    background:#05223c; touch-action:none;
  }

  #stage{
    position:fixed; inset:0; width:100%; height:100dvh;
    overflow:hidden; background:#05223c;
  }
  #gameCanvas{
    position:absolute; inset:0; width:100%; height:100%;
    display:block; z-index:1; touch-action:none; cursor:pointer;
  }

  /* Top HUD — Pre-reader visual clarity, all interactive targets >= 64px */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:max(10px, env(safe-area-inset-top)) 14px 0 14px;
    pointer-events:none;
  }
  .hud-left, .hud-center, .hud-right{
    display:flex; align-items:center; gap:10px; pointer-events:auto;
  }
  .hud-left{ flex:0 0 auto; }
  .hud-center{ flex:0 1 auto; justify-content:center; flex-wrap:nowrap; }
  .hud-right{ flex:0 0 auto; }

  #hootBtn{
    width:68px; height:68px; min-width:64px; min-height:64px;
    flex:0 0 68px; border-radius:50%;
    border:4px solid #fff;
    background:radial-gradient(circle at 35% 28%, #fff6be, #ffd23f 62%, #f09400 100%);
    box-shadow:0 6px 0 var(--outline), 0 0 24px rgba(255,212,59,.68);
    padding:4px; cursor:pointer;
    animation:hootBob 2.4s ease-in-out infinite alternate;
  }
  #hootBtn:active{ transform:scale(.92); }
  @keyframes hootBob{ from{ transform:translateY(0); } to{ transform:translateY(-4px); } }

  /* BIG Crystal-Clear Target Letter Bubble Pill [ A ] [ 🔊 ] */
  #targetPill{
    min-height:68px; min-width:136px;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    padding:5px 14px 5px 8px;
    border-radius:999px;
    border:4px solid #fff;
    background:linear-gradient(180deg, #fffbeb 0%, #fef08a 52%, #f59e0b 100%);
    box-shadow:0 6px 0 var(--outline), 0 0 28px rgba(253,224,71,.85), inset 0 3px 6px rgba(255,255,255,.78);
    cursor:pointer;
    transition:transform .16s cubic-bezier(.34,1.7,.5,1), box-shadow .2s;
  }
  #targetPill:active{ transform:scale(.93); }
  #targetPill.pop{ animation:targetPop .52s cubic-bezier(.34,1.85,.5,1); }
  @keyframes targetPop{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }
  .target-orb{
    width:52px; height:52px; border-radius:50%;
    display:grid; place-items:center;
    background:radial-gradient(circle at 30% 25%, #ffffff 0%, #fef9c3 55%, #bae6fd 100%);
    border:3.5px solid var(--outline);
    box-shadow:inset 0 -3px 6px rgba(14,116,144,.22), 0 2px 6px rgba(0,0,0,.18);
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:34px; line-height:1;
    color:#0b2239;
  }
  .target-spk{
    width:40px; height:40px; border-radius:50%;
    display:grid; place-items:center;
    background:rgba(12,35,64,.14);
    border:2.5px solid rgba(12,35,64,.28);
    font-size:22px; line-height:1;
  }

  /* Zone Switcher Pill (Sunny Reef / Glowing Deep Sea) */
  #zonePill{
    display:inline-flex; align-items:center; gap:5px;
    background:rgba(8,31,56,.82);
    backdrop-filter:blur(10px);
    border:4px solid rgba(255,255,255,.88);
    border-radius:999px;
    padding:3px;
    box-shadow:0 6px 0 var(--outline), 0 10px 24px rgba(0,0,0,.36);
  }
  .zone-btn{
    min-width:64px; min-height:60px;
    border:3px solid transparent; border-radius:999px;
    padding:0 16px;
    font-family:"Fredoka",sans-serif; font-weight:800;
    font-size:17px; line-height:1; white-space:nowrap;
    cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    color:rgba(255,255,255,.82);
    background:transparent;
    transition:transform .16s cubic-bezier(.34,1.7,.5,1), background .22s, color .22s, box-shadow .22s;
  }
  .zone-btn:active{ transform:scale(.94); }
  .zone-btn.active[data-zone="reef"]{
    color:#0b2239;
    border-color:#fff;
    background:linear-gradient(180deg, #fef08a 0%, #38bdf8 100%);
    box-shadow:0 4px 0 #0c4a6e, 0 0 20px rgba(56,189,248,.75);
  }
  .zone-btn.active[data-zone="deep"]{
    color:#fff;
    border-color:#67e8f9;
    background:linear-gradient(180deg, #6366f1 0%, #1e1b4b 100%);
    box-shadow:0 4px 0 #090d24, 0 0 22px rgba(103,232,249,.85);
    text-shadow:0 2px 6px rgba(34,211,238,.7);
  }

  #starPill{
    min-height:64px; min-width:82px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:linear-gradient(180deg, #fffef8 0%, #fef3c7 100%);
    border:4px solid var(--outline); border-radius:999px;
    padding:0 15px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:22px; color:var(--ink);
    box-shadow:0 6px 0 var(--outline), 0 8px 18px rgba(0,0,0,.3);
  }
  #starPill.pop{ animation:pillPop .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes pillPop{ 0%{ transform:scale(1); } 50%{ transform:scale(1.22); } 100%{ transform:scale(1); } }

  #doneBtn{
    min-width:68px; min-height:64px;
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:18px;
    padding:0 18px; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 6px 0 var(--outline), 0 8px 18px rgba(0,0,0,.3);
    text-shadow:0 2px 0 rgba(0,0,0,.32);
  }
  #doneBtn:active{ transform:translateY(3px); box-shadow:0 3px 0 var(--outline); }

  /* Bottom HUD — Optional Up/Down Swim Pad (left), 3-Pearl Treasure Bar (center), Giant Sonar Ping (right) */
  #bottomHud{
    position:absolute; left:0; right:0;
    bottom:max(12px, env(safe-area-inset-bottom));
    z-index:10;
    display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
    padding:0 16px;
    pointer-events:none;
  }

  #swimPad{
    pointer-events:auto;
    display:inline-flex; align-items:center; gap:8px;
  }
  .swim-btn{
    width:66px; height:66px; min-width:64px; min-height:64px;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.92);
    background:radial-gradient(circle at 34% 26%, rgba(186,230,253,.92), rgba(14,116,144,.86) 72%, rgba(8,47,73,.92));
    color:#fff;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:28px; line-height:1;
    display:grid; place-items:center;
    box-shadow:0 6px 0 var(--outline), 0 8px 20px rgba(0,0,0,.35), inset 0 4px 6px rgba(255,255,255,.42);
    cursor:pointer;
    touch-action:none;
    transition:transform .12s, box-shadow .12s;
  }
  .swim-btn.pressed, .swim-btn:active{
    transform:translateY(3px) scale(.93);
    box-shadow:0 3px 0 var(--outline), 0 0 24px rgba(103,232,249,.9);
  }

  #pearlBar{
    pointer-events:auto;
    display:inline-flex; align-items:center; gap:9px;
    background:rgba(7,30,54,.84);
    backdrop-filter:blur(10px);
    border:4px solid rgba(103,232,249,.88);
    border-radius:999px;
    padding:9px 15px;
    box-shadow:0 7px 0 var(--outline), 0 12px 28px rgba(0,0,0,.42);
    transition:border-color .3s, box-shadow .3s;
  }
  #pearlBar.chest-ready{
    border-color:#fde047;
    box-shadow:0 7px 0 var(--outline), 0 0 32px rgba(253,224,71,.92);
    animation:readyBarPulse .7s ease-in-out infinite alternate;
  }
  @keyframes readyBarPulse{
    from{ transform:scale(1); }
    to{ transform:scale(1.05); }
  }
  .pearl-slot{
    width:32px; height:32px; border-radius:50%;
    border:3px solid rgba(186,230,253,.48);
    background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.18), rgba(15,23,42,.55));
    position:relative;
    transition:transform .35s cubic-bezier(.34,1.85,.5,1), background .3s, border-color .3s, box-shadow .3s;
  }
  .pearl-slot.filled{
    border-color:#fff;
    background:radial-gradient(circle at 30% 26%, #ffffff 0%, #fef08a 34%, #67e8f9 72%, #818cf8 100%);
    box-shadow:0 0 14px rgba(253,224,71,.95), inset 0 -3px 6px rgba(59,130,246,.45);
    transform:scale(1.12);
  }
  .pearl-slot.filled::after{
    content:""; position:absolute; top:4px; left:6px; width:8px; height:5px;
    border-radius:50%; background:rgba(255,255,255,.92); transform:rotate(-25deg);
  }
  #chestBadge{
    width:38px; height:38px; border-radius:50%;
    border:3px solid rgba(253,224,71,.5);
    background:rgba(253,224,71,.16);
    display:grid; place-items:center;
    transition:transform .3s, box-shadow .3s, background .3s;
  }
  #pearlBar.chest-ready #chestBadge{
    border-color:#fff;
    background:radial-gradient(circle at 35% 28%, #fef08a, #f59e0b 85%);
    box-shadow:0 0 18px rgba(253,224,71,1);
    transform:scale(1.18);
  }
  #chestBadge svg{ width:24px; height:24px; display:block; }

  /* Giant Sonar Ping Button */
  #sonarBtn{
    pointer-events:auto;
    position:relative;
    width:80px; height:80px; min-width:72px; min-height:72px;
    border-radius:50%;
    border:5px solid #fff;
    background:radial-gradient(circle at 34% 26%, #a5f3fc 0%, #06b6d4 54%, #0e7490 100%);
    box-shadow:0 8px 0 var(--outline), 0 0 30px rgba(34,211,238,.82), inset 0 5px 8px rgba(255,255,255,.55);
    cursor:pointer;
    display:grid; place-items:center;
    font-size:35px; line-height:1;
    transition:transform .14s cubic-bezier(.34,1.8,.5,1), box-shadow .14s;
  }
  #sonarBtn::before{
    content:""; position:absolute; inset:-10px; border-radius:50%;
    border:3px solid rgba(103,232,249,.65);
    animation:sonarHalo 2.1s ease-out infinite;
    pointer-events:none;
  }
  @keyframes sonarHalo{
    0%{ transform:scale(.88); opacity:.9; }
    100%{ transform:scale(1.36); opacity:0; }
  }
  #sonarBtn:active{
    transform:translateY(4px) scale(.92);
    box-shadow:0 4px 0 var(--outline), 0 0 36px rgba(103,232,249,1);
  }
  #sonarBtn.pinged{
    animation:sonarBounce .42s cubic-bezier(.34,1.9,.5,1);
  }
  @keyframes sonarBounce{
    0%{ transform:scale(.84); }
    60%{ transform:scale(1.16); }
    100%{ transform:scale(1); }
  }

  /* Win Overlay */
  #winOverlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(5,22,44,.76); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .win-card{
    background:linear-gradient(180deg, #fffef8 0%, #e0f2fe 100%);
    border:6px solid var(--outline); border-radius:34px;
    padding:26px 24px; text-align:center; max-width:430px; width:100%;
    box-shadow:0 14px 0 var(--outline), 0 26px 50px rgba(0,0,0,.55);
  }
  .win-stars{
    font-family:"Fredoka",sans-serif; font-weight:800;
    font-size:48px; line-height:1.15; margin-bottom:8px; color:#d97706;
    text-shadow:0 4px 0 rgba(12,35,64,.16);
  }
  .win-card h2{
    margin:0 0 12px; font-family:"Fredoka",sans-serif;
    font-size:32px; color:#0b2239;
  }
  .win-stats{
    display:flex; align-items:center; justify-content:center; gap:12px;
    margin:0 0 20px; flex-wrap:wrap;
  }
  .win-stat{
    background:#fff; border:3.5px solid var(--outline); border-radius:999px;
    padding:8px 16px; font-family:"Fredoka",sans-serif; font-weight:800; font-size:20px; color:#0b2239;
    box-shadow:0 4px 0 var(--outline);
  }
  .win-btns{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px;
  }
  .big-play{
    min-height:64px;
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:21px;
    padding:12px 26px; cursor:pointer; box-shadow:0 6px 0 var(--outline);
  }

  /* Responsive Phone Portrait (iPhone 390x844) — zero overflow, all buttons >= 64px */
  @media (max-width: 780px){
    #hud{
      flex-wrap:wrap; align-items:center; gap:6px;
      padding:max(8px, env(safe-area-inset-top)) 8px 0 8px;
    }
    .hud-left{ order:1; gap:6px; }
    .hud-center{ order:2; display:contents; }
    #targetPill{
      order:2; pointer-events:auto;
      min-height:64px; min-width:116px;
      padding:4px 10px 4px 6px; gap:7px;
      margin:0 auto;
    }
    .target-orb{ width:46px; height:46px; font-size:30px; }
    .target-spk{ width:34px; height:34px; font-size:18px; }
    .hud-right{ order:3; gap:6px; }
    #zonePill{
      order:4; pointer-events:auto;
      margin:2px auto 0 auto;
    }
    #hootBtn{ width:64px; height:64px; flex:0 0 64px; }
    #starPill{ min-height:64px; min-width:66px; padding:0 10px; font-size:19px; gap:4px; }
    #doneBtn{ min-width:64px; min-height:64px; padding:0 12px; font-size:19px; }
    #doneBtn .done-lbl{ display:none; }
    .zone-btn{ min-height:60px; padding:0 15px; font-size:16px; }

    #bottomHud{ padding:0 10px; gap:6px; bottom:max(10px, env(safe-area-inset-bottom)); }
    #swimPad{ gap:6px; }
    .swim-btn{ width:64px; height:64px; font-size:25px; }
    #pearlBar{ gap:5px; padding:7px 9px; }
    .pearl-slot{ width:24px; height:24px; border-width:2.5px; }
    #chestBadge{ width:30px; height:30px; }
    #chestBadge svg{ width:19px; height:19px; }
    #sonarBtn{ width:72px; height:72px; min-width:72px; min-height:72px; font-size:31px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gameCanvas" aria-label="Captain Hoot's Submarine Letter Voyage"></canvas>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-left">
      <button id="hootBtn" type="button" aria-label="Captain Hoot cheer">
        <svg viewBox="0 0 200 210" aria-hidden="true">
          <path d="M82 178 L100 205 L118 178 Z" fill="#8a5a33"/>
          <ellipse cx="34" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(14 34 128)"/>
          <ellipse cx="166" cy="128" rx="17" ry="40" fill="#8a5a33" transform="rotate(-14 166 128)"/>
          <ellipse cx="100" cy="118" rx="66" ry="72" fill="#a06a3b"/>
          <ellipse cx="100" cy="140" rx="44" ry="46" fill="#fdeed3"/>
          <path d="M52 44 Q40 14 62 22 Q74 27 70 48 Z" fill="#8a5a33"/>
          <path d="M148 44 Q160 14 138 22 Q126 27 130 48 Z" fill="#8a5a33"/>
          <circle cx="100" cy="72" r="52" fill="#a06a3b"/>
          <ellipse cx="100" cy="28" rx="44" ry="11" fill="#17324f"/>
          <path d="M62 24 Q100 -4 138 24 L132 32 Q100 20 68 32 Z" fill="#ffd23f" stroke="#c27803" stroke-width="3"/>
          <circle cx="100" cy="18" r="5" fill="#fff7cc" stroke="#b45309" stroke-width="2"/>
          <ellipse cx="78" cy="74" rx="24" ry="26" fill="#fdeed3"/>
          <ellipse cx="122" cy="74" rx="24" ry="26" fill="#fdeed3"/>
          <circle cx="78" cy="72" r="11" fill="#17324f"/>
          <circle cx="122" cy="72" r="11" fill="#17324f"/>
          <circle cx="82" cy="68" r="4" fill="#fff"/>
          <circle cx="126" cy="68" r="4" fill="#fff"/>
          <circle cx="56" cy="94" r="8" fill="#ffb59d" opacity=".85"/>
          <circle cx="144" cy="94" r="8" fill="#ffb59d" opacity=".85"/>
          <path d="M90 88 Q100 84 110 88 Q106 102 100 104 Q94 102 90 88 Z" fill="#ff9f1c" stroke="#e07f00" stroke-width="1.5"/>
        </svg>
      </button>
    </div>

    <div class="hud-center">
      <button id="targetPill" type="button" aria-label="Hear target letter">
        <span class="target-orb" id="targetLetterText">A</span>
        <span class="target-spk" aria-hidden="true">🔊</span>
      </button>

      <div id="zonePill" role="group" aria-label="Ocean Zone">
        <button id="reefZoneBtn" type="button" class="zone-btn active" data-zone="reef">☀️ Reef</button>
        <button id="deepZoneBtn" type="button" class="zone-btn" data-zone="deep">✨ Deep Sea</button>
      </div>
    </div>

    <div class="hud-right">
      <div id="starPill" aria-label="Stars earned">⭐ <span id="starCount">0</span></div>
      <button id="doneBtn" type="button" aria-label="Done">🏆<span class="done-lbl"> Done</span></button>
    </div>
  </div>

  <!-- Bottom HUD -->
  <div id="bottomHud">
    <div id="swimPad" role="group" aria-label="Swim Up or Down">
      <button id="swimUpBtn" class="swim-btn" type="button" aria-label="Swim Up">▲</button>
      <button id="swimDownBtn" class="swim-btn" type="button" aria-label="Swim Down">▼</button>
    </div>

    <div id="pearlBar" aria-label="Letters toward sunken treasure chest">
      <span class="pearl-slot" data-slot="0"></span>
      <span class="pearl-slot" data-slot="1"></span>
      <span class="pearl-slot" data-slot="2"></span>
      <span id="chestBadge" aria-hidden="true">
        <svg viewBox="0 0 36 36">
          <rect x="4" y="15" width="28" height="15" rx="3" fill="#92400e" stroke="#451a03" stroke-width="2.5"/>
          <path d="M4 16 Q18 6 32 16 Z" fill="#b45309" stroke="#451a03" stroke-width="2.5"/>
          <rect x="4" y="14" width="28" height="4" fill="#fbbf24"/>
          <rect x="15" y="13" width="6" height="8" rx="1.5" fill="#fde047" stroke="#78350f" stroke-width="1.5"/>
        </svg>
      </span>
    </div>

    <button id="sonarBtn" type="button" aria-label="Sonar Ping">📡</button>
  </div>

  <!-- Celebratory Win Overlay -->
  <div id="winOverlay" hidden>
    <div class="win-card">
      <div class="win-stars" aria-hidden="true">⭐🏆⭐</div>
      <h2 id="winHeading">Ocean Voyager!</h2>
      <div class="win-stats">
        <span class="win-stat">⭐ <span id="winStars">0</span></span>
        <span class="win-stat">🔤 <span id="winLetters">0</span></span>
        <span class="win-stat">💎 <span id="winChests">0</span></span>
      </div>
      <div class="win-btns">
        <button id="againBtn" class="big-play" type="button">↻ Keep Exploring</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================================
     1. VERIFIED HOOT VOICE ENGINE (100% Real Studio Hoot MP3s, Zero TTS)
     ========================================================================= */
  var VBASE = "assets/voice/";
  var voiceAudio = new Audio();
  var voiceGen = 0;
  var PRAISE_CLIPS = ["hoot-great-job", "hoot-amazing", "hoot-super", "hoot-star"];
  var praiseIdx = 0;
  var pendingBootLetter = null;

  function playVoiceSeq(ids, onBlocked){
    if(!ids || !ids.length) return;
    var gen = ++voiceGen, idx = 0;
    voiceAudio.onended = null;
    voiceAudio.onerror = null;
    try{ voiceAudio.pause(); }catch(e){}
    function next(){
      if(gen !== voiceGen || idx >= ids.length) return;
      var id = ids[idx++];
      if(!id){ next(); return; }
      /* Direct path to verified base voice clips in assets/voice/ */
      voiceAudio.src = VBASE + id + ".mp3";
      voiceAudio.onended = next;
      voiceAudio.onerror = next;
      var p = voiceAudio.play();
      if(p && p.catch){
        p.catch(function(){
          if(onBlocked) onBlocked();
        });
      }
    }
    next();
  }

  function nextPraise(){
    var c = PRAISE_CLIPS[praiseIdx % PRAISE_CLIPS.length];
    praiseIdx++;
    return c;
  }

  function speakTargetCallout(letter, isBoot){
    if(!letter) return;
    var clipId = "call-letter-" + letter.toLowerCase();
    var src = VBASE + clipId + ".mp3";
    targetPill.classList.remove("pop");
    void targetPill.offsetWidth;
    targetPill.classList.add("pop");

    if(isBoot){
      try{
        if(window.parent && window.parent !== window && typeof window.parent.__hwPlayAfterIntro === "function"){
          if(window.parent.__hwPlayAfterIntro(src)){
            pendingBootLetter = null;

  function sfxHarpArpeggio(step){
    try{
      var c = getAC(); if(!c) return;
      var t = c.currentTime;
      var chords = [
        [523.25, 659.25, 783.99, 1046.50, 1318.51],
        [587.33, 739.99, 880.00, 1174.66, 1479.98],
        [659.25, 783.99, 987.77, 1318.51, 1567.98],

        [783.99, 987.77, 1174.66, 1567.98, 1975.53]
      ];
      var notes = chords[((step || 1) - 1) % chords.length];
      notes.forEach(function(freq, i){
        var o = c.createOscillator();
        var o2 = c.createOscillator();
        var g = c.createGain();
        var g2 = c.createGain();
        o.type = "triangle";
        o2.type = "sine";
        o.frequency.setValueAtTime(freq, t + i * 0.052);
        o2.frequency.setValueAtTime(freq * 2, t + i * 0.052);
        g.gain.setValueAtTime(0.001, t + i * 0.052);
        g.gain.linearRampToValueAtTime(0.13, t + i * 0.052 + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.052 + 0.52);
        g2.gain.value = 0.25;
        o.connect(g);
        o2.connect(g2); g2.connect(g);
        g.connect(c.destination);
        o.start(t + i * 0.052); o.stop(t + i * 0.052 + 0.56);
        o2.start(t + i * 0.052); o2.stop(t + i * 0.052 + 0.56);

  function sfxSonarPing(){

        o.type = "sine";
        o.frequency.setValueAtTime(1180, t + delay);
        o.frequency.exponentialRampToValueAtTime(1140, t + delay + 0.55);
        var amp = idx === 0 ? 0.19 : (idx === 1 ? 0.09 : 0.04);
        g.gain.setValueAtTime(0.001, t + delay);
        g.gain.linearRampToValueAtTime(amp, t + delay + 0.014);
        g.gain.exponentialRampToValueAtTime(0.0008, t + delay + 0.65);

     5. KID PROFILE & LETTER DECK (Riley kidb: A-J first; Zane kida: A-Z)
     ========================================================================= */
  var isKidB = /(^|[?&])kid=kidb(&|$)/.test(location.search);
  var EARLY_LETTERS = "ABCDEFGHIJ".split("");
  var ALL_LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  function shuffleArr(arr){
    var out = arr.slice();
    for(var i = out.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = out[i]; out[i] = out[j]; out[j] = tmp;
    }
    return out;
  }

  var letterDeck = [];
  var deckPhase = 0;

  function refillDeck(){
    if(isKidB && deckPhase === 0){
      letterDeck = shuffleArr(EARLY_LETTERS);
      deckPhase = 1;
    } else if(isKidB){
      /* Riley loops friendly A-J with gentle occasional K-Z variety on later decks */
      letterDeck = shuffleArr(deckPhase % 2 === 1 ? EARLY_LETTERS : ALL_LETTERS);
      deckPhase++;
    } else {
      letterDeck = shuffleArr(ALL_LETTERS);
      deckPhase++;
    }
  }

  function popNextTargetLetter(avoid){
    if(!letterDeck.length) refillDeck();
    var pick = letterDeck.shift();
    if(pick === avoid && letterDeck.length){
      letterDeck.push(pick);
      pick = letterDeck.shift();
    }
    return pick;
  }

  function randomDistractorLetter(target){
    var pool = (isKidB && deckPhase <= 1) ? EARLY_LETTERS : ALL_LETTERS;
    var tries = 0, ch = "B";
    while(tries < 12){
      ch = pool[Math.floor(Math.random() * pool.length)];
      if(ch !== target) return ch;
      tries++;
    }
    return target === "A" ? "B" : "A";
  }

  function pickBubbleLaneY(avoidY){
    var b = getPlayBounds();
    var r = getBubbleRadius();
    var top = b.minY + r + 14;
    var bot = Math.max(top + 60, b.maxY - r - 24);
    var lanes = 4;
    var bestY = top + (bot - top) * 0.5;
    var bestDist = -1;
    for(var tries = 0; tries < 6; tries++){
      var laneIdx = Math.floor(Math.random() * lanes);
      var cand = top + ((laneIdx + 0.5) / lanes) * (bot - top) + (Math.random() - 0.5) * 26;
      cand = Math.max(top, Math.min(bot, cand));
      var minD = 9999;
      for(var i = 0; i < letterBubbles.length; i++){
        var ob = letterBubbles[i];
        if(ob.x > W * 0.55){
          minD = Math.min(minD, Math.abs(cand - ob.baseY));
        }
      }
      if(avoidY != null) minD = Math.min(minD, Math.abs(cand - avoidY));
      if(minD > bestDist){
        bestDist = minD;
        bestY = cand;
      }
    }
    return bestY;
  }

      var prevLetter = ch;
      state.targetLetter = popNextTargetLetter(prevLetter);
      letterBubbles.forEach(function(ob){

        "call-letter-" + prevLetter.toLowerCase(),
        nextPraise(),
        "call-letter-" + state.targetLetter.toLowerCase()
      ]);

      syncHud();
    } else {
      /* OTHER LETTER: Friendly gentle bubble pop + soft wiggle + speaks letter name (zero fail state!) */
      if(lb.cooldown > 0) return;
      lb.cooldown = 0.95;
      lb.wiggleT = 1;
      sfxBubblePop(3);
      sfxSoftChime();
      spawnBubbleBurst(bx, by, 10, false);
      spawnSparkles(bx, by, 7, "#bae6fd");
      playVoiceSeq(["name-letter-" + ch.toLowerCase()]);
      /* Softly pop & float away non-target bubble */
      if(index >= 0) letterBubbles.splice(index, 1);
    }
  }

  function interactCreature(cr){
    if(cr.cooldown > 0) return;
    cr.cooldown = 1.25;
    cr.flipT = 1;
    cr.waveT = 1.3;
    sub.cheerT = 0.7;
    sfxBubblePop(2);
    spawnBubbleBurst(cr.x, cr.y, 12, true);
    spawnSparkles(cr.x, cr.y, 10, cr.glow);

  function triggerSonar(){
    state.sonarPings++;
    sfxSonarPing();

    sonarBtn.classList.remove("pinged");
    void sonarBtn.offsetWidth;
    sonarBtn.classList.add("pinged");

    var maxR = Math.hypot(W, H) * 0.95;
    sonarWaves.push({ x: sub.x, y: sub.y, r: 24, maxR: maxR, alpha: 1 });
    sonarWaves.push({ x: sub.x, y: sub.y, r: 4, maxR: maxR * 0.82, alpha: 0.72, delayed: 0.14 });

    /* Highlight incoming target letter bubble(s) with bright golden halo & sparkles! */
    var foundTarget = false;
    letterBubbles.forEach(function(lb){
      if(lb.isTarget){
        foundTarget = true;
        lb.sonarGlow = 4.6;
        spawnSparkles(lb.x, lb.y, 14, "#fde047");
      }
    });
    if(!foundTarget){
      spawnLetterBubble(true, W + 24);
      var newest = letterBubbles[letterBubbles.length - 1];
      newest.sonarGlow = 4.6;
      spawnSparkles(newest.x, newest.y, 14, "#fde047");
    }

    /* Sea friends wave happily */
    creatures.forEach(function(cr){
      cr.waveT = 1.5;
      cr.glowBoost = 1.2;
      spawnSparkles(cr.x, cr.y, 4, "#67e8f9");
    });

    /* Also chime target letter callout on Sonar if voice isn't actively playing */
    if(voiceAudio.paused){
      speakTargetCallout(state.targetLetter, false);
    }

    spawnBubbleBurst(sub.x, sub.y, 10, false);
  }

  function switchZone(nextZone){

      });

  /* =========================================================================
     9. POINTER, SWIM BUTTONS & KEYBOARD STEERING

  var dragging = false;
  var swimHold = { up: false, down: false };

  function unlockPendingAudio(){
    getAC();
    if(pendingBootLetter){

  function clampTarget(x, y){
    var b = getPlayBounds();
    return {
      x: Math.max(b.minX, Math.min(b.maxX, x)),
      y: Math.max(b.minY, Math.min(b.maxY, y))
    };
  }

  function handleOceanInput(px, py, isDown){
    unlockPendingAudio();
    var pt = clampTarget(px, py);
    sub.targetX = pt.x;
    sub.targetY = pt.y;
    sub.dashT = 0;
    sub.dashBubbleId = null;
    sub.dashChest = false;

    if(isDown){
      ripples.push({ x: px, y: py, r: 8, life: 1 });
      sfxBubblePop(0);

      /* 1. Direct tap on a Letter Pearl Bubble -> steer Captain Hoot STRAIGHT through it! */
      for(var i = letterBubbles.length - 1; i >= 0; i--){
        var lb = letterBubbles[i];
        var hitR = lb.r * 1.48;
        if(Math.hypot(px - lb.x, py - lb.y) <= hitR){
          sub.targetX = Math.max(getPlayBounds().minX, Math.min(W - 40, lb.x));
          sub.targetY = lb.y;
          sub.dashT = 0.65;
          sub.dashBubbleId = lb.id;
          /* If submarine is already right nearby, collect immediately for snappy feel! */
          if(Math.hypot(sub.x - lb.x, sub.y - lb.y) < lb.r + 92 * getSubScale()){
            collectLetterBubble(lb, i);
          }
          return;
        }
      }

      /* 2. Direct tap on Sunken Treasure Chest -> steer into it or open immediately! */
      if(chest.active && !chest.opened){
        if(Math.hypot(px - chest.x, py - chest.y) <= 86){
          sub.targetX = Math.max(getPlayBounds().minX, Math.min(W - 50, chest.x));
          sub.targetY = chest.y - 12;
          sub.dashT = 0.65;
          sub.dashChest = true;
          openTreasureChest();
          return;
        }
      }

      /* 3. Direct tap on a passing sea friend -> joyful flip! */
      for(var c = creatures.length - 1; c >= 0; c--){
        var cr = creatures[c];
        var crR = Math.max(48, 62 * cr.size);
        if(Math.hypot(px - cr.x, py - cr.y) <= crR){
          interactCreature(cr);
          return;
        }
      }
    }
  }

  function bindSwimBtn(btn, dir){

  /* =========================================================================
     10. PIXAR-STYLE RENDERING (Mirrored Scrolling Backdrop, Parallax, Pearls)
     ========================================================================= */
  function drawMirroredScrollingBg(img, alpha, bgScrollX){
    if(!img || !img.complete || !img.naturalWidth) return false;
    var iw = img.naturalWidth, ih = img.naturalHeight;
    var scale = Math.max(H / ih, W / (iw * 1.35));
    var tileW = Math.ceil(iw * scale);
    var dh = Math.ceil(ih * scale);
    var dy = (H - dh) * 0.5;
    var startTile = Math.floor(bgScrollX / tileW);

    ctx.save();
    ctx.globalAlpha = alpha;
    for(var k = 0; ; k++){
      var tileIdx = startTile + k;
      var drawX = Math.floor(tileIdx * tileW - bgScrollX);
      if(drawX > W + 4) break;
      var isMirrored = (((tileIdx % 2) + 2) % 2) === 1;
      if(isMirrored){
        ctx.save();
        ctx.translate(drawX + tileW + 1, dy);
        ctx.scale(-1, 1);
        ctx.drawImage(img, 0, 0, tileW + 2, dh);
        ctx.restore();
      } else {
        ctx.drawImage(img, drawX, dy, tileW + 2, dh);
      }
    }
    ctx.restore();
    return true;
  }

  function drawStar5(x, y, r, col){
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    for(var i = 0; i < 10; i++){
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var rad = i % 2 === 0 ? r : r * 0.46;
      if(i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    ctx.restore();
  }

  /* Scrolling Midground Coral Reef Ridges (0.70x parallax) */
  function drawScrollingSeabed(){
    var isDeep = state.zone === "deep";
    var px = state.scrollX * 0.70;
    var segW = 260;
    var start = Math.floor(px / segW) - 1;
    var count = Math.ceil(W / segW) + 3;

    ctx.save();
    ctx.fillStyle = isDeep ? "rgba(8, 20, 56, 0.58)" : "rgba(7, 72, 108, 0.34)";
    ctx.beginPath();
    ctx.moveTo(-40, H + 20);
    for(var i = 0; i <= count; i++){
      var idx = start + i;
      var x = idx * segW - px;
      var hWave = 46 + Math.sin(idx * 1.7) * 20 + Math.cos(idx * 0.9) * 14;
      var y = H - hWave;
      if(i === 0) ctx.lineTo(x, y);
      else {
        var prevX = (idx - 1) * segW - px;
        var prevY = H - (46 + Math.sin((idx - 1) * 1.7) * 20 + Math.cos((idx - 1) * 0.9) * 14);
        ctx.quadraticCurveTo((prevX + x) * 0.5, prevY - 12, x, y);
      }
    }
    ctx.lineTo(W + 60, H + 20);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* Foreground Parallax Kelp & Coral Silhouettes (1.38x scroll) */
  function drawForegroundParallax(){
    var isDeep = state.zone === "deep";
    var wrapSpan = Math.max(W + 520, 2400);
    var scrollFg = state.scrollX * 1.38;

    ctx.save();
    fgKelp.forEach(function(kl){
      var sx = wrapSpan - (((scrollFg + kl.worldX) % wrapSpan) + wrapSpan) % wrapSpan - 180;
      if(sx < -120 || sx > W + 120) return;
      ctx.save();
      ctx.translate(sx, H + 12);

      if(kl.coral){
        /* Soft coral branch silhouette */
        ctx.strokeStyle = isDeep ? "rgba(56, 189, 248, 0.24)" : "rgba(15, 76, 117, 0.38)";
        ctx.lineCap = "round";
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-8, -kl.h * 0.45, -24, -kl.h * 0.78);
        ctx.moveTo(-4, -kl.h * 0.32);
        ctx.quadraticCurveTo(10, -kl.h * 0.62, 26, -kl.h * 0.86);
        ctx.moveTo(-2, -kl.h * 0.18);
        ctx.quadraticCurveTo(2, -kl.h * 0.58, 4, -kl.h * 0.94);
        ctx.stroke();
      } else {
        /* Swaying translucent kelp fronds */
        for(var b = 0; b < kl.blades; b++){
          var sway = Math.sin(tAcc * 2.1 + kl.ph + b * 0.9) * 18;
          var bx = (b - 1) * 15;
          var bh = kl.h * (0.78 + (b % 2) * 0.28);
          ctx.fillStyle = isDeep ? "rgba(14, 116, 144, 0.28)" : "rgba(6, 78, 92, 0.34)";
          ctx.beginPath();
          ctx.moveTo(bx - 7, 0);
          ctx.quadraticCurveTo(bx - 12 + sway * 0.5, -bh * 0.5, bx + sway, -bh);
          ctx.quadraticCurveTo(bx + 12 + sway * 0.5, -bh * 0.5, bx + 7, 0);
          ctx.closePath();
          ctx.fill();
        }
      }
      ctx.restore();
    });
    ctx.restore();
  }

  /* ---------- GIANT GLOSSY IRIDESCENT LETTER PEARL BUBBLES ---------- */
  function drawLetterBubbles(){
    letterBubbles.forEach(function(lb){
      var isTgt = lb.isTarget;
      var sonarBoost = lb.sonarGlow > 0 ? Math.min(1, lb.sonarGlow * 0.45) : 0;
      var pulse = isTgt
        ? (1.05 + lb.missBoost + Math.sin(tAcc * 4.4 + lb.phase) * 0.055 + sonarBoost * 0.09)
        : (0.96 + Math.sin(tAcc * 2.8 + lb.phase) * 0.025);
      var r = lb.r * pulse;
      var wig = lb.wiggleT > 0 ? Math.sin(lb.wiggleT * 28) * 0.16 * lb.wiggleT : 0;

      ctx.save();
      ctx.translate(lb.x, lb.y);
      ctx.rotate(wig);

      /* 1. Outer Aura — Target Letter glows extra GOLDEN & sparkles! */
      if(isTgt || sonarBoost > 0.05){
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        var haloR = r * (1.72 + sonarBoost * 0.55 + Math.sin(tAcc * 5 + lb.phase) * 0.1);
        var hg = ctx.createRadialGradient(0, 0, r * 0.65, 0, 0, haloR);
        hg.addColorStop(0, "rgba(255, 250, 195, " + (0.72 + sonarBoost * 0.25).toFixed(2) + ")");
        hg.addColorStop(0.52, "rgba(250, 204, 21, " + (0.42 + sonarBoost * 0.32).toFixed(2) + ")");
        hg.addColorStop(1, "rgba(250, 204, 21, 0)");
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.arc(0, 0, haloR, 0, Math.PI * 2); ctx.fill();

        /* Golden beacon ring (extra bright on Sonar Ping!) */
        ctx.strokeStyle = sonarBoost > 0.1
          ? "rgba(254, 240, 138, 0.96)"
          : "rgba(253, 224, 71, 0.78)";
        ctx.lineWidth = sonarBoost > 0.1 ? 5.5 : 3.5;
        ctx.beginPath();
        ctx.arc(0, 0, r + 8 + Math.sin(tAcc * 6) * 4, 0, Math.PI * 2);
        ctx.stroke();

        /* Orbiting golden sparkle stars around target pearl */
        for(var s = 0; s < 3; s++){
          var sa = tAcc * 1.9 + s * (Math.PI * 2 / 3) + lb.phase;
          var sx = Math.cos(sa) * (r + 12);
          var sy = Math.sin(sa) * (r + 12);
          drawStar5(sx, sy, 7 + sonarBoost * 5, "#fef08a");
        }
        ctx.restore();
      } else {
        /* Gentle iridescent underwater sheen for companion bubbles */
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        var cg = ctx.createRadialGradient(0, 0, r * 0.7, 0, 0, r * 1.32);
        cg.addColorStop(0, "rgba(186, 230, 253, 0.24)");
        cg.addColorStop(1, "rgba(103, 232, 249, 0)");
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.arc(0, 0, r * 1.32, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      /* 2. Glossy Iridescent Pearl Sphere */
      var pg = ctx.createRadialGradient(-r * 0.3, -r * 0.32, r * 0.12, 0, 0, r);
      if(isTgt){
        pg.addColorStop(0, "#ffffff");
        pg.addColorStop(0.45, "#fffbeb");
        pg.addColorStop(0.78, "#fef08a");
        pg.addColorStop(1, "#f59e0b");
      } else {
        pg.addColorStop(0, "#ffffff");
        pg.addColorStop(0.45, "#f0f9ff");
        pg.addColorStop(0.76, "#bae6fd");
        pg.addColorStop(1, "#818cf8");
      }
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();

      /* Crisp luminous pearl outer ring */
      ctx.lineWidth = isTgt ? 5 : 4;
      ctx.strokeStyle = isTgt ? "#fffef0" : "rgba(255,255,255,0.92)";
      ctx.stroke();

      /* Subtle dark outer ink rim for crisp contrast in Sunny Reef */
      ctx.lineWidth = 2;
      ctx.strokeStyle = isTgt ? "rgba(180, 83, 9, 0.55)" : "rgba(12, 74, 110, 0.35)";
      ctx.beginPath();
      ctx.arc(0, 0, r + (isTgt ? 2.5 : 2), 0, Math.PI * 2);
      ctx.stroke();

      /* Iridescent pastel rim arc (pink-cyan) */
      ctx.strokeStyle = isTgt ? "rgba(255,255,255,0.8)" : "rgba(244, 114, 182, 0.42)";
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.84, Math.PI * 0.12, Math.PI * 0.56);
      ctx.stroke();

      /* Top-left glossy specular highlight */
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.beginPath();
      ctx.ellipse(-r * 0.34, -r * 0.36, r * 0.24, r * 0.13, -0.55, 0, Math.PI * 2);
      ctx.fill();

      /* 3. Crisp Bold Dark Letter centered inside the Pearl */
      var fontSize = Math.round(r * 1.12);
      ctx.font = "800 " + fontSize + "px 'Fredoka', 'Nunito', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 5;
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(255,255,255,0.88)";
      ctx.strokeText(lb.letter, 0, 2);
      ctx.fillStyle = "#0b2239";
      ctx.fillText(lb.letter, 0, 2);

      ctx.restore();
    });
  }

  /* ---------- PIXAR 3D SCROLLING SUNKEN TREASURE CHEST ---------- */
  function drawTreasureChest(){
    if(!chest.active) return;
    var s = Math.max(0.84, Math.min(1.22, Math.min(W, H) / 640));
    var wobble = chest.wobbleT > 0 ? Math.sin(chest.wobbleT * 26) * 0.14 * chest.wobbleT : 0;
    var readyBounce = !chest.opened ? Math.abs(Math.sin(tAcc * 4.5)) * 7 : 0;

    ctx.save();
    ctx.translate(chest.x, chest.y - readyBounce);
    ctx.rotate(wobble);
    ctx.scale(s, s);

    /* Golden beacon rays */
    var glowPower = !chest.opened ? (0.82 + Math.sin(tAcc * 5) * 0.18) : Math.max(0.25, chest.openAmt);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var halo = ctx.createRadialGradient(0, -10, 12, 0, -10, 130);
    halo.addColorStop(0, "rgba(255,248,175," + (0.88 * glowPower).toFixed(2) + ")");
    halo.addColorStop(0.45, "rgba(250,204,21," + (0.46 * glowPower).toFixed(2) + ")");
    halo.addColorStop(1, "rgba(250,204,21,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, -10, 130, 0, Math.PI * 2); ctx.fill();

    for(var ri = 0; ri < 7; ri++){
      var ra = -Math.PI * 0.85 + (ri / 6) * Math.PI * 0.7 + Math.sin(tAcc * 2.2 + ri) * 0.06;
      var rg = ctx.createLinearGradient(0, -10, Math.cos(ra) * 155, Math.sin(ra) * 155);
      rg.addColorStop(0, "rgba(255,248,180," + (0.58 * glowPower).toFixed(2) + ")");
      rg.addColorStop(1, "rgba(255,248,180,0)");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(Math.cos(ra - 0.09) * 155, Math.sin(ra - 0.09) * 155);
      ctx.lineTo(Math.cos(ra + 0.09) * 155, Math.sin(ra + 0.09) * 155);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    /* Ground contact shadow */
    ctx.fillStyle = "rgba(6, 20, 38, 0.42)";
    ctx.beginPath();
    ctx.ellipse(0, 34, 58, 13, 0, 0, Math.PI * 2);
    ctx.fill();

    /* Open glowing gold interior */
    if(chest.openAmt > 0.02){
      ctx.save();
      ctx.fillStyle = "#451a03";
      ctx.beginPath();
      ctx.roundRect(-45, -16, 90, 26, 8);
      ctx.fill();
      var goldPile = ctx.createRadialGradient(0, -6, 6, 0, 0, 44);
      goldPile.addColorStop(0, "#fffbeb");
      goldPile.addColorStop(0.5, "#fde047");
      goldPile.addColorStop(1, "#d97706");
      ctx.fillStyle = goldPile;
      ctx.beginPath();
      ctx.ellipse(0, -4, 39, 16 * Math.min(1, chest.openAmt * 1.4), 0, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    /* Animated hinged rounded wooden lid */
    ctx.save();
    ctx.translate(0, -8 - chest.openAmt * 22);

    ctx.beginPath();

    var boxGrad = ctx.createLinearGradient(-48, -8, 48, 32);

    boxGrad.addColorStop(0.55, "#78350f");
    boxGrad.addColorStop(1, "#451a03");

    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.roundRect(-48, -6, 96, 38, 9);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = "rgba(59,23,6,0.45)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-46, 8); ctx.lineTo(46, 8);
    ctx.moveTo(-46, 20); ctx.lineTo(46, 20);

    var rimGrad = ctx.createLinearGradient(0, -8, 0, 32);

  /* ---------- PIXAR 3D GLOSSY SEA FRIENDS (Turtle, Whale, Clownfish, Octopus, Starfish) ---------- */
  function drawGlossyEye(x, y, r, lookX, lookY){
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#0b2239"; ctx.lineWidth = Math.max(1.5, r * 0.18); ctx.stroke();
    ctx.fillStyle = "#0b2239";
    ctx.beginPath(); ctx.arc(x + lookX * r * 0.25, y + lookY * r * 0.2, r * 0.62, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x - r * 0.22, y - r * 0.24, r * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.2, y + r * 0.22, r * 0.12, 0, Math.PI * 2); ctx.fill();
  }

  function drawWhale(t, wave){

  function drawClownfish(t, wave){
    var wag = Math.sin(t * 8 + wave * 8) * 0.28;

    [-12, 6].forEach(function(sx){

      ctx.quadraticCurveTo(sx + 10, 0, sx + 5, -22);

    ctx.fillStyle = "rgba(255,255,255,0.42)";

    ctx.save(); ctx.translate(2, 6); ctx.rotate(0.25 + Math.sin(t * 9) * 0.25);
    ctx.fillStyle = "#fdba74"; ctx.strokeStyle = "#7c2d12"; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(-3, 5, 9, 5, 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();

  function drawOctopus(t, wave){
    ctx.lineCap = "round";
    for(var i = 0; i < 6; i++){
      var spread = -26 + i * 10.4;
      var sway = Math.sin(t * 4.2 + i * 0.9 + wave * 6) * 9;
      ctx.lineWidth = 10.5;
      ctx.strokeStyle = "#581c87";
      ctx.beginPath();
      ctx.moveTo(spread * 0.65, 10);
      ctx.quadraticCurveTo(spread + sway * 0.6, 26, spread * 1.15 + sway, 36);
      ctx.stroke();
      ctx.lineWidth = 6.5;
      ctx.strokeStyle = i % 2 === 0 ? "#c084fc" : "#a855f7";
      ctx.stroke();
      ctx.fillStyle = "#f3e8ff";
      ctx.beginPath(); ctx.arc(spread * 1.12 + sway, 35, 2.3, 0, Math.PI * 2); ctx.fill();
    }

    var oG = ctx.createRadialGradient(-8, -18, 5, 0, -4, 34);
    oG.addColorStop(0, "#f3e8ff");
    oG.addColorStop(0.32, "#c084fc");
    oG.addColorStop(0.78, "#9333ea");
    oG.addColorStop(1, "#581c87");
    ctx.fillStyle = oG; ctx.strokeStyle = "#4c1d95"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, -6, 27, 25, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255,0.42)";
    ctx.beginPath(); ctx.ellipse(-9, -18, 10, 5.5, -0.45, 0, Math.PI * 2); ctx.fill();

    drawGlossyEye(-9, -1, 6.2, 0.2, 0);
    drawGlossyEye(10, -1, 6.2, 0.2, 0);
    ctx.fillStyle = "rgba(244,114,182,0.52)";
    ctx.beginPath(); ctx.ellipse(-17, 7, 4.5, 2.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(18, 7, 4.5, 2.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#4c1d95"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(0.5, 5, 6.5, 0.2, Math.PI - 0.2); ctx.stroke();
  }

  function drawStarfish(t, wave){
    ctx.save();
    ctx.rotate(Math.sin(t * 2.8 + wave * 7) * 0.22);
    var sG = ctx.createRadialGradient(-6, -10, 4, 0, 0, 34);
    sG.addColorStop(0, "#fbcfe8");
    sG.addColorStop(0.4, "#f472b6");
    sG.addColorStop(0.85, "#db2777");
    sG.addColorStop(1, "#9d174d");
    ctx.fillStyle = sG;
    ctx.strokeStyle = "#831843";
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";

    ctx.beginPath();
    for(var i = 0; i < 5; i++){
      var a1 = -Math.PI / 2 + i * (Math.PI * 2 / 5);
      var aMid = a1 + Math.PI / 5;
      var aNext = a1 + Math.PI * 2 / 5;
      var tipX = Math.cos(a1) * 32, tipY = Math.sin(a1) * 32;
      var valX = Math.cos(aMid) * 14, valY = Math.sin(aMid) * 14;
      var tip2X = Math.cos(aNext) * 32, tip2Y = Math.sin(aNext) * 32;
      if(i === 0) ctx.moveTo((tipX + valX) * 0.5, (tipY + valY) * 0.5);
      ctx.quadraticCurveTo(valX, valY, (valX + tip2X) * 0.5, (valY + tip2Y) * 0.5);
      ctx.quadraticCurveTo(tip2X, tip2Y, (tip2X + Math.cos(aNext + Math.PI / 5) * 14) * 0.5, (tip2Y + Math.sin(aNext + Math.PI / 5) * 14) * 0.5);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "rgba(255,241,242,0.75)";
    for(var d = 0; d < 5; d++){
      var da = -Math.PI / 2 + d * (Math.PI * 2 / 5);
      ctx.beginPath(); ctx.arc(Math.cos(da) * 19, Math.sin(da) * 19, 2.5, 0, Math.PI * 2); ctx.fill();
    }

    drawGlossyEye(-7, -2, 5.2, 0.15, 0);
    drawGlossyEye(7, -2, 5.2, 0.15, 0);
    ctx.strokeStyle = "#831843"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(0, 4, 5.5, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.restore();
  }

  function drawCreatures(){
    var baseScale = Math.max(0.68, Math.min(1.02, Math.min(W, H) / 740));
    creatures.forEach(function(cr){
      if(cr.x < -120 || cr.x > W + 120) return;
      var s = baseScale * cr.size;
      var flipRot = cr.flipT > 0 ? (1 - cr.flipT) * Math.PI * 2 : 0;
      var flipJump = cr.flipT > 0 ? Math.sin(cr.flipT * Math.PI) * 24 : 0;
      var waveScale = cr.waveT > 0 ? 1 + Math.sin(cr.waveT * 14) * 0.08 : 1;

      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.translate(cr.x, cr.y - flipJump);
      ctx.rotate(flipRot);
      /* Sea friends swim smoothly left across the scrolling voyage */
      var sx = (cr.kind === "octopus" || cr.kind === "starfish") ? 1 : -1;
      ctx.scale(s * sx * waveScale, s * waveScale);

      if(cr.kind === "turtle") drawTurtle(tAcc + cr.phase, cr.waveT);
      else if(cr.kind === "whale") drawWhale(tAcc + cr.phase, cr.waveT);
      else if(cr.kind === "clownfish") drawClownfish(tAcc + cr.phase, cr.waveT);
      else if(cr.kind === "octopus") drawOctopus(tAcc + cr.phase, cr.waveT);
      else drawStarfish(tAcc + cr.phase, cr.waveT);

      ctx.restore();
    });
  }

  /* ---------- PIXAR 3D BRIGHT-YELLOW CAPTAIN HOOT SUBMARINE ---------- */
  function drawHeadlampCone(s){
    var isDeep = state.zone === "deep";
    var coneLen = (isDeep ? 390 : 250) * s;
    var coneSpread = (isDeep ? 140 : 88) * s;
    var lampX = 62 * s;
    var lampY = 14 * s;

    ctx.save();
    ctx.translate(sub.x, sub.y);
    ctx.rotate(sub.pitch);

    ctx.globalCompositeOperation = "lighter";
    var grad = ctx.createLinearGradient(lampX, lampY, lampX + coneLen, lampY);
    grad.addColorStop(0, isDeep ? "rgba(255, 245, 165, 0.72)" : "rgba(255, 245, 175, 0.34)");
    grad.addColorStop(0.45, isDeep ? "rgba(253, 224, 71, 0.34)" : "rgba(253, 224, 71, 0.14)");
    grad.addColorStop(1, "rgba(253, 224, 71, 0)");

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(lampX, lampY - 9 * s);
    ctx.lineTo(lampX + coneLen, lampY - coneSpread);
    ctx.quadraticCurveTo(lampX + coneLen * 1.08, lampY, lampX + coneLen, lampY + coneSpread);
    ctx.lineTo(lampX, lampY + 9 * s);
    ctx.closePath();
    ctx.fill();

    var coreG = ctx.createLinearGradient(lampX, lampY, lampX + coneLen * 0.72, lampY);
    coreG.addColorStop(0, isDeep ? "rgba(255, 255, 230, 0.65)" : "rgba(255, 255, 230, 0.28)");
    coreG.addColorStop(1, "rgba(255, 245, 165, 0)");
    ctx.fillStyle = coreG;
    ctx.beginPath();
    ctx.moveTo(lampX, lampY - 5 * s);
    ctx.lineTo(lampX + coneLen * 0.72, lampY - coneSpread * 0.42);
    ctx.lineTo(lampX + coneLen * 0.72, lampY + coneSpread * 0.42);
    ctx.lineTo(lampX, lampY + 5 * s);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawSubmarine(){
    var s = getSubScale();
    var bobY = Math.sin(tAcc * 2.8) * 4.5;
    var sq = sub.bounce > 0 ? Math.sin(sub.bounce * Math.PI * 2.5) * sub.bounce * 0.12 : 0;

    drawHeadlampCone(s);

    ctx.save();
    ctx.translate(sub.x, sub.y + bobY);
    ctx.rotate(sub.pitch);
    ctx.scale(s * (1 + sq * 0.55), s * (1 - sq * 0.45));

    /* 1. Rotating Brass Tail Propeller */
    ctx.save();
    ctx.translate(-76, 4);
    var pBlade = Math.sin(sub.propAngle);
    var pBlade2 = Math.cos(sub.propAngle);
    var propG = ctx.createLinearGradient(-12, -24, 8, 24);
    propG.addColorStop(0, "#fde68a");
    propG.addColorStop(0.5, "#d97706");
    propG.addColorStop(1, "#78350f");
    ctx.fillStyle = propG;
    ctx.strokeStyle = "#451a03";
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.ellipse(-5, -13 * Math.abs(pBlade) - 3, 5.5, 13 * Math.abs(pBlade) + 4, -0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-5, 13 * Math.abs(pBlade) + 3, 5.5, 13 * Math.abs(pBlade) + 4, 0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-7, 6 * pBlade2, 4.5, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#f59e0b";
    ctx.beginPath(); ctx.ellipse(0, 0, 8, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();

    /* 2. Tail Dorsal & Ventral Yellow Stabilizer Fins */
    var finG = ctx.createLinearGradient(-74, -36, -50, 32);
    finG.addColorStop(0, "#fef08a");
    finG.addColorStop(0.5, "#facc15");
    finG.addColorStop(1, "#ca8a04");
    ctx.fillStyle = finG; ctx.strokeStyle = "#713f12"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-54, -14);
    ctx.quadraticCurveTo(-74, -40, -68, -4);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-54, 18);
    ctx.quadraticCurveTo(-72, 36, -66, 8);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    /* 3. Periscope & Conning Hatch */
    var periG = ctx.createLinearGradient(-8, -74, 18, -42);
    periG.addColorStop(0, "#fef08a");
    periG.addColorStop(0.55, "#f59e0b");
    periG.addColorStop(1, "#92400e");
    ctx.fillStyle = periG; ctx.strokeStyle = "#713f12"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-4, -44);
    ctx.lineTo(-4, -66);
    ctx.quadraticCurveTo(-4, -76, 8, -76);
    ctx.lineTo(16, -76);
    ctx.lineTo(16, -62);

  /* ---------- DEEP SEA VOLUMETRIC DARKNESS + HEADLAMP + BIOLUMINESCENT PEARLS ---------- */
  function drawDeepSeaLighting(){
    var deepWeight = state.zone === "deep" ? state.zoneFade : (1 - state.zoneFade);
    if(deepWeight <= 0.02) return;

    var lw = lightCanvas.width, lh = lightCanvas.height;
    var sx = lw / W, sy = lh / H;
    var s = getSubScale();

    lightCtx.save();
    lightCtx.clearRect(0, 0, lw, lh);
    lightCtx.fillStyle = "rgba(3, 10, 32, " + (0.52 * deepWeight).toFixed(3) + ")";
    lightCtx.fillRect(0, 0, lw, lh);

    lightCtx.globalCompositeOperation = "destination-out";

    /* Glow around Captain Hoot's yellow submarine */
    var subHalo = lightCtx.createRadialGradient(sub.x * sx, sub.y * sy, 10 * sx, sub.x * sx, sub.y * sy, 148 * s * sx);
    subHalo.addColorStop(0, "rgba(0,0,0,0.96)");
    subHalo.addColorStop(1, "rgba(0,0,0,0)");
    lightCtx.fillStyle = subHalo;
    lightCtx.beginPath();
    lightCtx.arc(sub.x * sx, sub.y * sy, 148 * s * sx, 0, Math.PI * 2);
    lightCtx.fill();

    /* Volumetric headlamp cone */
    lightCtx.save();
    lightCtx.translate(sub.x * sx, sub.y * sy);
    lightCtx.rotate(sub.pitch);
    lightCtx.scale(sx, sy);
    var cLen = 410 * s, cSpr = 152 * s, lx = 58 * s, ly = 14 * s;
    var cg = lightCtx.createLinearGradient(lx, ly, lx + cLen, ly);
    cg.addColorStop(0, "rgba(0,0,0,1)");
    cg.addColorStop(0.65, "rgba(0,0,0,0.84)");
    cg.addColorStop(1, "rgba(0,0,0,0)");
    lightCtx.fillStyle = cg;
    lightCtx.beginPath();
    lightCtx.moveTo(lx, ly - 14 * s);
    lightCtx.lineTo(lx + cLen, ly - cSpr);
    lightCtx.quadraticCurveTo(lx + cLen * 1.1, ly, lx + cLen, ly + cSpr);
    lightCtx.lineTo(lx, ly + 14 * s);
    lightCtx.closePath();
    lightCtx.fill();
    lightCtx.restore();

    /* Bioluminescent punch-out around Letter Pearl Bubbles so letters always pop crystal-clear! */
    letterBubbles.forEach(function(lb){
      var rad = lb.r * (lb.isTarget ? 2.5 : 1.75) * sx;
      var lg = lightCtx.createRadialGradient(lb.x * sx, lb.y * sy, rad * 0.25, lb.x * sx, lb.y * sy, rad);
      lg.addColorStop(0, "rgba(0,0,0," + (lb.isTarget ? "0.98" : "0.78") + ")");
      lg.addColorStop(1, "rgba(0,0,0,0)");
      lightCtx.fillStyle = lg;
      lightCtx.beginPath(); lightCtx.arc(lb.x * sx, lb.y * sy, rad, 0, Math.PI * 2); lightCtx.fill();
    });

    /* Bioluminescent punch-out around Sunken Treasure Chest */
    if(chest.active){
      var chG = lightCtx.createRadialGradient(chest.x * sx, chest.y * sy, 14 * sx, chest.x * sx, chest.y * sy, 175 * sx);
      chG.addColorStop(0, "rgba(0,0,0,0.96)");
      chG.addColorStop(1, "rgba(0,0,0,0)");
      lightCtx.fillStyle = chG;
      lightCtx.beginPath(); lightCtx.arc(chest.x * sx, chest.y * sy, 175 * sx, 0, Math.PI * 2); lightCtx.fill();
    }

    /* Sonar rings illuminate the abyss */
    sonarWaves.forEach(function(sw){
      if(sw.delayed && sw.delayed > 0) return;
      lightCtx.strokeStyle = "rgba(0,0,0," + (sw.alpha * 0.92).toFixed(2) + ")";
      lightCtx.lineWidth = 44 * sx;
      lightCtx.beginPath();
      lightCtx.arc(sw.x * sx, sw.y * sy, sw.r * sx, 0, Math.PI * 2);
      lightCtx.stroke();
    });

    lightCtx.restore();

    ctx.save();
    ctx.drawImage(lightCanvas, 0, 0, W, H);
    ctx.restore();
  }

  /* =========================================================================
     11. MAIN 60FPS OCEAN VOYAGE UPDATE & RENDER LOOP
     ========================================================================= */
  var lastTime = performance.now();

  function update(dt){
    tAcc += dt;

    if(state.zoneFade < 1){
      state.zoneFade = Math.min(1, state.zoneFade + dt * 2.1);
    }

    var b = getPlayBounds();

    /* Continuous Up/Down button & keyboard steering */
    var steerSpd = 380 * dt;
    if(swimHold.up || keys.ArrowUp || keys.KeyW) sub.targetY -= steerSpd;
    if(swimHold.down || keys.ArrowDown || keys.KeyS) sub.targetY += steerSpd;
    if(keys.ArrowLeft || keys.KeyA) sub.targetX -= steerSpd;
    if(keys.ArrowRight || keys.KeyD) sub.targetX += steerSpd;

    /* If dashing to a tapped bubble, keep tracking its drifting position! */
    if(sub.dashT > 0){
      sub.dashT = Math.max(0, sub.dashT - dt);
      if(sub.dashBubbleId != null){
        var foundDash = false;
        for(var di = 0; di < letterBubbles.length; di++){
          if(letterBubbles[di].id === sub.dashBubbleId){
            sub.targetX = Math.max(b.minX, Math.min(W - 36, letterBubbles[di].x));
            sub.targetY = letterBubbles[di].y;
            foundDash = true;
            break;
          }
        }
        if(!foundDash){ sub.dashBubbleId = null; sub.dashT = 0; }
      } else if(sub.dashChest && chest.active && !chest.opened){
        sub.targetX = Math.max(b.minX, Math.min(W - 44, chest.x));
        sub.targetY = chest.y - 12;
      }
    }

    var ct = clampTarget(sub.targetX, sub.targetY);
    sub.targetX = ct.x; sub.targetY = ct.y;

    /* Forward ocean voyage scroll speed — smoothly boosts when dragged forward! */
    var cruiseAnchorX = Math.max(b.minX, W * 0.25);
    var forwardRatio = (sub.x - cruiseAnchorX) / Math.max(120, W * 0.42);
    var targetBoost = Math.max(0.82, Math.min(1.58, 1.0 + forwardRatio * 0.48));
    sub.speedBoost += (targetBoost - sub.speedBoost) * Math.min(1, dt * 4.5);

    var baseVoyageSpeed = Math.max(88, Math.min(132, W * 0.11));
    var voyageSpeed = baseVoyageSpeed * sub.speedBoost;
    state.scrollX += voyageSpeed * dt;

    /* Spring-damper physics for buttery Pixar submarine banking & gliding */
    var dx = sub.targetX - sub.x;
    var dy = sub.targetY - sub.y;
    var stiffness = sub.dashT > 0 ? 28.0 : 14.5;
    var damping = sub.dashT > 0 ? 7.8 : 6.2;
    sub.vx += (dx * stiffness - sub.vx * damping) * dt;
    sub.vy += (dy * stiffness - sub.vy * damping) * dt;
    sub.x += sub.vx * dt;
    sub.y += sub.vy * dt;

    var targetPitch = Math.max(-0.28, Math.min(0.28, sub.vy * 0.00095));
    sub.pitch += (targetPitch - sub.pitch) * Math.min(1, dt * 8.5);

    /* Rotating brass propeller & rich bubble wake */
    var spd = Math.hypot(sub.vx, sub.vy);
    sub.propAngle += dt * (12 * sub.speedBoost + Math.min(24, spd * 0.05));
    sub.bubbleAcc += dt * (6.5 * sub.speedBoost + Math.min(16, spd * 0.035));
    while(sub.bubbleAcc >= 1){
      sub.bubbleAcc -= 1;
      var ss = getSubScale();
      bubbles.push({
        x: sub.x - 76 * ss + (Math.random() - 0.5) * 10,
        y: sub.y + 4 * ss + (Math.random() - 0.5) * 10,
        vx: -(voyageSpeed * 0.62 + 24 + Math.random() * 34),
        vy: -(24 + Math.random() * 44),
        r: 3.5 + Math.random() * 6.5,
        life: 1,
        decay: 0.65 + Math.random() * 0.35,
        hue: 192 + Math.random() * 24,
        rainbow: false
      });
    }

    if(sub.bounce > 0) sub.bounce = Math.max(0, sub.bounce - dt * 1.9);
    if(sub.cheerT > 0) sub.cheerT = Math.max(0, sub.cheerT - dt);
    sub.blinkT -= dt;
    if(sub.blinkT <= 0) sub.blinkT = 2.8 + Math.random() * 2.4;

    /* Update Giant Letter Pearl Bubbles (drifting right-to-left + submarine collision!) */
    var subHitR = 66 * getSubScale();
    var rightmostX = -999;
    for(var i = letterBubbles.length - 1; i >= 0; i--){
      var lb = letterBubbles[i];
      lb.x -= voyageSpeed * lb.speedMul * dt;
      lb.baseY = Math.max(b.minY + lb.r + 10, Math.min(b.maxY - lb.r - 18, lb.baseY));
      lb.y = lb.baseY + Math.sin(tAcc * 2.2 + lb.phase) * lb.amp;
      if(lb.sonarGlow > 0) lb.sonarGlow = Math.max(0, lb.sonarGlow - dt);
      if(lb.wiggleT > 0) lb.wiggleT = Math.max(0, lb.wiggleT - dt * 2.2);
      if(lb.cooldown > 0) lb.cooldown = Math.max(0, lb.cooldown - dt);

      /* Submarine nose / hull touches letter bubble -> collect! */
      var noseX = sub.x + 22 * getSubScale();
      var dSub = Math.min(
        Math.hypot(sub.x - lb.x, sub.y - lb.y),
        Math.hypot(noseX - lb.x, sub.y - lb.y)
      );
      if(dSub < subHitR + lb.r * 0.72){
        collectLetterBubble(lb, i);
        continue;
      }

      /* Off-left cleanup */
      if(lb.x < -lb.r - 40){
        if(lb.isTarget){
          state.missesForTarget = Math.min(3, state.missesForTarget + 1);
        }
        letterBubbles.splice(i, 1);
        continue;
      }

      if(lb.x > rightmostX) rightmostX = lb.x;
    }

    /* Maintain well-spaced stream of Letter Pearl Bubbles */
    var minGap = Math.max(210, Math.min(340, W * 0.31));
    if(letterBubbles.length < 4 && rightmostX < W - minGap + 80){
      spawnLetterBubble(false);
    }

    /* Update Scrolling Sunken Treasure Chest */
    if(chest.active){
      chest.y = Math.min(H - 172, b.maxY - 46);
      if(!chest.opened){
        var sweetX = W * 0.68;
        if(chest.x > sweetX){
          chest.x -= voyageSpeed * 1.05 * dt;
        } else {
          /* Gently cruise slowly in the sweet spot so toddlers can always catch it! */
          chest.x -= voyageSpeed * 0.14 * dt;
          if(chest.x < W * 0.34){
            chest.x = W + 90;
          }
        }
        /* Swim submarine right into the treasure chest -> burst! */
        if(Math.hypot(sub.x - chest.x, sub.y - chest.y) < subHitR + 58){
          openTreasureChest();
        }
      } else {
        chest.openAmt = Math.min(1, chest.openAmt + dt * 4.5);
        chest.celebrateT -= dt;
        chest.x -= voyageSpeed * 0.25 * dt;
        if(chest.celebrateT <= 0){
          chest.departing = true;
          chest.x -= voyageSpeed * 1.15 * dt;
          if(chest.x < -140){
            chest.active = false;
            chest.opened = false;
            chest.departing = false;
            state.pearlCycle = 0;
            syncHud();
          }
        }
      }
      if(chest.wobbleT > 0) chest.wobbleT = Math.max(0, chest.wobbleT - dt * 2.2);
    }

    /* Update Swimming Sea Friends gliding right-to-left */
    creatures.forEach(function(cr){
      cr.x -= voyageSpeed * cr.speedMul * dt;
      if(cr.x < -120){
        cr.x = W + 110 + Math.random() * Math.max(220, W * 0.45);
        cr.baseY = b.minY + 34 + Math.random() * Math.max(100, b.maxY - b.minY - 76);
      }
      cr.baseY = Math.max(b.minY + 28, Math.min(b.maxY - 38, cr.baseY));
      cr.y = cr.baseY + Math.sin(tAcc * 1.8 + cr.phase) * cr.amp;
      if(cr.flipT > 0) cr.flipT = Math.max(0, cr.flipT - dt * 1.25);
      if(cr.waveT > 0) cr.waveT = Math.max(0, cr.waveT - dt);
      if(cr.glowBoost > 0) cr.glowBoost = Math.max(0, cr.glowBoost - dt * 0.65);
      if(cr.cooldown > 0) cr.cooldown = Math.max(0, cr.cooldown - dt);

      if(Math.hypot(sub.x - cr.x, sub.y - cr.y) < subHitR + 18 * cr.size && cr.cooldown <= 0){
        interactCreature(cr);
      }
    });

    /* Update Sonar Waves */
    for(var si = sonarWaves.length - 1; si >= 0; si--){
      var sw = sonarWaves[si];
      if(sw.delayed && sw.delayed > 0){ sw.delayed -= dt; continue; }
      sw.r += dt * Math.max(540, W * 0.62);
      sw.alpha = Math.max(0, 1 - sw.r / sw.maxR);
      if(sw.r >= sw.maxR) sonarWaves.splice(si, 1);
    }

    /* Update Particles */
    for(var bi = bubbles.length - 1; bi >= 0; bi--){
      var bb = bubbles[bi];
      bb.x += (bb.vx - voyageSpeed * 0.25 + Math.sin(tAcc * 5 + bi) * 14) * dt;
      bb.y += bb.vy * dt;
      bb.vx *= 0.96;
      bb.life -= bb.decay * dt;
      if(bb.life <= 0 || bb.y < -30) bubbles.splice(bi, 1);
    }
    for(var ki = sparkles.length - 1; ki >= 0; ki--){
      var sp = sparkles[ki];
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      sp.vx *= 0.94; sp.vy *= 0.94;
      sp.rot += dt * 5;
      sp.life -= sp.decay * dt;
      if(sp.life <= 0) sparkles.splice(ki, 1);
    }
    for(var ci = coins.length - 1; ci >= 0; ci--){
      var co = coins[ci];
      co.x += co.vx * dt;
      co.y += co.vy * dt;
      co.vy += 320 * dt;
      co.vx *= 0.985;
      co.spin += co.spinSpd * dt;
      co.life -= dt * 0.44;
      if(co.life <= 0 || co.y > H + 40) coins.splice(ci, 1);
    }
    for(var ri = ripples.length - 1; ri >= 0; ri--){
      var rp = ripples[ri];
      rp.r += dt * 115;
      rp.life -= dt * 1.9;
      if(rp.life <= 0) ripples.splice(ri, 1);
    }
    for(var fi = flyingStars.length - 1; fi >= 0; fi--){
      var fs = flyingStars[fi];
      fs.t += dt * 1.35;
      if(fs.t >= 1) flyingStars.splice(fi, 1);
    }
    for(var pi = popLetters.length - 1; pi >= 0; pi--){
      var pl = popLetters[pi];
      pl.y -= 64 * dt;
      pl.life -= dt * 1.15;
      if(pl.life <= 0) popLetters.splice(pi, 1);
    }
  }

  function render(now){
    var dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
    lastTime = now;
    update(dt);

    /* 1. Real Continuous Mirrored-Tiling Painted Pixar Ocean Backdrop */
    var bgScrollX = state.scrollX * 0.42;
    ctx.fillStyle = state.zone === "deep" ? "#05122d" : "#0a5a8c";
    ctx.fillRect(0, 0, W, H);
    if(state.zoneFade < 1){
      drawMirroredScrollingBg(bgImages[state.prevZone], 1, bgScrollX);
      drawMirroredScrollingBg(bgImages[state.zone], state.zoneFade, bgScrollX);
    } else {
      drawMirroredScrollingBg(bgImages[state.zone], 1, bgScrollX);
    }

    /* 2. Feathered Diagonal Scrolling Underwater Light Rays (0.55x parallax) */
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var raySpan = Math.max(W + 380, 1400);
    var rayOffset = (state.scrollX * 0.55) % raySpan;
    for(var rb = 0; rb < 4; rb++){
      var bx = raySpan - ((rayOffset + rb * (raySpan / 4)) % raySpan) - 140;
      var rayW = Math.max(95, W * 0.11);
      ctx.save();
      ctx.translate(bx, -20);
      ctx.rotate(0.24 + (rb % 2) * 0.05);
      var rg = ctx.createLinearGradient(-rayW, 0, rayW, 0);
      if(state.zone === "reef"){
        rg.addColorStop(0, "rgba(255, 252, 210, 0)");
        rg.addColorStop(0.5, "rgba(255, 252, 215, 0.085)");
        rg.addColorStop(1, "rgba(255, 252, 210, 0)");
      } else {
        rg.addColorStop(0, "rgba(103, 232, 249, 0)");
        rg.addColorStop(0.5, "rgba(103, 232, 249, 0.07)");
        rg.addColorStop(1, "rgba(103, 232, 249, 0)");
      }
      ctx.fillStyle = rg;
      ctx.fillRect(-rayW, 0, rayW * 2, H * 0.85);
      ctx.restore();
    }
    ctx.restore();

    /* 3. Scrolling Ambient Plankton & Rising Current Motes */
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ambientMotes.forEach(function(m){
      var mx = W - (((state.scrollX * m.drift * 0.001 + m.x) % 1.15) + 1.15) % 1.15 * W;
      var my = ((m.y - tAcc * m.sp + 10) % 1) * H;
      var a = (0.3 + Math.sin(tAcc * 2.5 + m.ph) * 0.22) * (state.zone === "deep" ? 1.35 : 0.78);
      ctx.fillStyle = "hsla(" + m.hue + ", 95%, 84%, " + Math.min(0.88, a).toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(mx, my, m.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    /* 4. Midground Scrolling Seabed Reef Ridge */
    drawScrollingSeabed();

    /* 5. Touch Water Ripples */
    ripples.forEach(function(rp){
      ctx.save();
      ctx.strokeStyle = "rgba(186, 230, 253, " + (rp.life * 0.78).toFixed(2) + ")";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });

    /* 6. Sea Friends, Sunken Treasure Chest, Giant Letter Pearl Bubbles, Captain Hoot Sub */
    drawCreatures();
    drawTreasureChest();
    drawLetterBubbles();
    drawSubmarine();

    /* 7. Deep Sea Volumetric Headlamp & Bioluminescent Pearl Mask */
    drawDeepSeaLighting();

    /* 8. Foreground Parallax Kelp & Coral Silhouettes (1.38x depth!) */
    drawForegroundParallax();

    /* 9. Expanding Turquoise Sonar Rings */
    sonarWaves.forEach(function(sw){
      if(sw.delayed && sw.delayed > 0) return;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "rgba(34, 211, 238, " + (sw.alpha * 0.92).toFixed(2) + ")";
      ctx.lineWidth = 7 * sw.alpha + 2;
      ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "rgba(207, 250, 254, " + (sw.alpha * 0.85).toFixed(2) + ")";
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(sw.x, sw.y, Math.max(1, sw.r - 8), 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });

    /* 10. Rainbow & Wake Bubbles */
    bubbles.forEach(function(bb){
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, bb.life * 0.9));
      ctx.fillStyle = "hsla(" + bb.hue + ", 92%, 82%, " + (bb.rainbow ? "0.34" : "0.18") + ")";
      ctx.strokeStyle = "hsla(" + bb.hue + ", 96%, 80%, 0.92)";
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.beginPath(); ctx.arc(bb.x - bb.r * 0.32, bb.y - bb.r * 0.32, bb.r * 0.24, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    /* 11. Spinning Treasure Coins & Pearls */
    coins.forEach(function(co){
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, co.life * 1.4));
      ctx.translate(co.x, co.y);
      if(co.pearl){
        var pg = ctx.createRadialGradient(-3, -3, 1, 0, 0, co.r);
        pg.addColorStop(0, "#ffffff"); pg.addColorStop(0.6, "#fbcfe8"); pg.addColorStop(1, "#67e8f9");
        ctx.fillStyle = pg;
        ctx.beginPath(); ctx.arc(0, 0, co.r * 0.88, 0, Math.PI * 2); ctx.fill();
      } else {
        var cw = Math.max(0.22, Math.abs(Math.cos(co.spin)));
        ctx.scale(cw, 1);
        var cg = ctx.createRadialGradient(-co.r * 0.3, -co.r * 0.3, 1, 0, 0, co.r);
        cg.addColorStop(0, "#fffbeb"); cg.addColorStop(0.5, "#fde047"); cg.addColorStop(1, "#d97706");
        ctx.fillStyle = cg; ctx.strokeStyle = "#92400e"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, co.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    });

    /* 12. Celebratory Popped Letter Floats */
    popLetters.forEach(function(pl){
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, pl.life));
      var sc = 1 + (1 - pl.life) * 0.7;
      ctx.translate(pl.x, pl.y);
      ctx.scale(sc, sc);
      ctx.font = "800 54px 'Fredoka', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 7;
      ctx.strokeStyle = "#0b2239";
      ctx.strokeText(pl.letter, 0, 0);
      ctx.fillStyle = "#fde047";
      ctx.fillText(pl.letter, 0, 0);
      ctx.restore();
    });

    /* 13. Sparkles & Flying Reward Stars */
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    sparkles.forEach(function(sp){
      ctx.save();
      ctx.globalAlpha = Math.max(0, sp.life);
      ctx.translate(sp.x, sp.y);
      ctx.rotate(sp.rot);
      drawStar5(0, 0, sp.r * 1.4, sp.col);
      ctx.restore();
    });
    ctx.restore();

    flyingStars.forEach(function(fs){
      var u = fs.t, mu = 1 - u;
      var fx = mu * mu * fs.x0 + 2 * mu * u * fs.cx + u * u * fs.x1;
      var fy = mu * mu * fs.y0 + 2 * mu * u * fs.cy + u * u * fs.y1;
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(u * Math.PI * 2.5);
      drawStar5(0, 0, 28 * (1 - u * 0.45), "#fde047");
      ctx.restore();
    });

    requestAnimationFrame(render);
  }

  /* =========================================================================
     12. BOOT VOYAGE!
     ========================================================================= */
  refillDeck();
  state.targetLetter = popNextTargetLetter(null);
  seedCreatures();
  seedInitialBubbles();
  syncHud();
  speakTargetCallout(state.targetLetter, true);
  requestAnimationFrame(render);
})();
</script>
