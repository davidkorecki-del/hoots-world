<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="treehouse";window.__HOOT_SELF_COACH__=true;</script>
<script src="js/hoot-game-head.js?v=llprev3e146"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>My Treehouse Hoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#2b1a0e;
    --cream:#fffdf7;
    --wood-light:#eac086;
    --wood-mid:#cf9150;
    --wood-deep:#8c5222;
    --wood-dark:#5a3112;
    --gold:#ffc93c;
    --mint:#6ed6c3;
    --coral:#ff7676;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; width:100%; margin:0; padding:0; overflow:hidden; }
  body{
    font-family:"Fredoka",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:#8c5222;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ================= FULL TREEHOUSE STAGE ================= */
  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:
      repeating-linear-gradient(90deg,
        rgba(104,54,18,.13) 0px,
        rgba(104,54,18,.13) 3px,
        transparent 3px,
        transparent 92px),
      linear-gradient(180deg, #e7ba7e 0%, #dca464 58%, #c98a4a 76%, #9b5b26 76.5%, #7d4519 100%);
    transition:filter .55s ease;
  }

  /* Cozy night-time dim veil over walls/floor (window stays luminous!) */
  #nightVeil{
    position:absolute;
    inset:0;
    z-index:4;
    pointer-events:none;
    opacity:0;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,212,118,.14) 0%, rgba(26,18,54,.58) 54%, rgba(12,10,34,.78) 100%);
    transition:opacity .65s ease;
  }
  #stage.night #nightVeil{ opacity:1; }

  /* Ceiling wooden rafters & subtle plank grain */
  #ceilingBeam{
    position:absolute;
    top:0; left:0; right:0;
    height:22px;
    z-index:2;
    pointer-events:none;
    background:linear-gradient(180deg, #693814 0%, #8b4d20 75%, #4d260b 100%);
    box-shadow:0 5px 12px rgba(42,20,5,.32);
  }
  .rafter-post{
    position:absolute;
    top:0; bottom:0;
    width:24px;
    z-index:2;
    pointer-events:none;
    background:linear-gradient(90deg, #6b3b17, #8e5225 55%, #5b2f0e);
    opacity:.72;
  }
  .rafter-post.left{ left:0; }
  .rafter-post.right{ right:0; }

  /* ================= TOP HUD (>=64px) ================= */
  #hud{
    position:relative;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 4px max(12px, env(safe-area-inset-left));
    flex:0 0 auto;
    pointer-events:none;
  }
  #hud > *{ pointer-events:auto; }
  .hud-group{ display:flex; align-items:center; gap:8px; }
  .hud-pill{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 14px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,247,.95);
    color:var(--ink);
    font-size:28px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(76,40,12,.34), 0 10px 18px rgba(40,18,4,.2);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .2s;
  }
  .hud-pill.round{ width:64px; padding:0; border-radius:50%; }
  .hud-pill:active{ transform:translateY(3px) scale(.94); }
  .hud-pill.night-on{
    background:linear-gradient(180deg,#312e81,#1e1b4b);
    color:#fde047;
    box-shadow:0 5px 0 #0f0d2b, 0 0 18px rgba(253,224,71,.45);
  }
  #starBank{
    min-height:64px;
    min-width:96px;
    padding:0 16px 0 12px;
    border-radius:999px;
    border:4px solid #fff;
    background:rgba(255,253,247,.96);
    color:#8f5300;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-size:26px;
    font-weight:700;
    box-shadow:0 5px 0 rgba(76,40,12,.32), 0 10px 18px rgba(40,18,4,.18);
  }
  #starBank svg{ width:28px; height:28px; display:block; }
  #starBank.bump{ animation:starBump .46s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.2) rotate(-5deg); }
    100%{ transform:scale(1); }
  }

  /* ================= MAIN TREEHOUSE ROOM STAGE ================= */
  #roomStage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    overflow:hidden;
    z-index:6;
  }

  /* Floor strip with baseboard and warm sunlight pool */
  #floorDeck{
    position:absolute;
    left:0; right:0; bottom:0;
    height:30%;
    min-height:112px;
    background:
      repeating-linear-gradient(90deg,
        rgba(70,34,10,.16) 0px,
        rgba(70,34,10,.16) 2px,
        transparent 2px,
        transparent 118px),
      linear-gradient(180deg, #b87336 0%, #9b5b25 48%, #7e4517 100%);
    border-top:9px solid #6b3915;
    box-shadow:inset 0 8px 18px rgba(45,20,4,.28);
    z-index:1;
    pointer-events:none;
  }
  #sunPool{
    position:absolute;
    left:50%; top:-6px;
    transform:translateX(-50%);
    width:min(70vw, 480px);
    height:92%;
    background:radial-gradient(ellipse at 50% 35%, rgba(255,244,186,.36) 0%, rgba(255,230,148,.12) 52%, transparent 74%);
    transition:opacity .65s ease;
    pointer-events:none;
  }
  #stage.night #sunPool{ opacity:0; }

  /* ================= BIG ROUND TREEHOUSE WINDOW ================= */
  #treeWindow{
    position:absolute;
    left:50%;
    top:clamp(2px, 2vh, 22px);
    transform:translateX(-50%);
    width:clamp(186px, 34vh, 286px);
    height:clamp(186px, 34vh, 286px);
    z-index:5;
    border:none;
    padding:0;
    background:none;
    cursor:pointer;
    border-radius:50%;
    transition:transform .2s cubic-bezier(.34,1.6,.5,1);
  }
  #treeWindow:active{ transform:translateX(-50%) scale(.96); }
  #treeWindow svg{
    width:100%; height:100%; display:block; overflow:visible;
    filter:drop-shadow(0 10px 18px rgba(55,28,8,.28));
  }
  #winDayLayer{ transition:opacity .7s ease; opacity:1; }
  #winNightLayer{ transition:opacity .7s ease; opacity:0; }
  #stage.night #winDayLayer{ opacity:0; }
  #stage.night #winNightLayer{ opacity:1; }

  .cloud-drift-1{ animation:cloudDrift 16s ease-in-out infinite alternate; }
  .cloud-drift-2{ animation:cloudDrift 21s ease-in-out infinite alternate-reverse; }
  @keyframes cloudDrift{ from{ transform:translateX(-14px); } to{ transform:translateX(18px); } }
  .sun-spin{ transform-box:fill-box; transform-origin:center; animation:slowSpin 24s linear infinite; }
  @keyframes slowSpin{ to{ transform:rotate(360deg); } }
  .star-twink{ animation:starTwink 2.4s ease-in-out infinite alternate; }
  .star-twink.t2{ animation-delay:-1.1s; animation-duration:1.9s; }
  .star-twink.t3{ animation-delay:-0.5s; animation-duration:2.8s; }
  @keyframes starTwink{ from{ opacity:.35; transform:scale(.85); } to{ opacity:1; transform:scale(1.18); } }
  .butterfly-flt{ animation:bfly 5.5s ease-in-out infinite; }
  @keyframes bfly{
    0%,100%{ transform:translate(0,0) rotate(-6deg); }
    50%{ transform:translate(20px,-14px) rotate(8deg); }
  }

  /* ================= HANGING BEDTIME LAMP & PULL CORD ================= */
  #lampBtn{
    position:absolute;
    top:16px;
    right:clamp(132px, 16vw, 224px);
    width:92px;
    height:192px;
    min-width:68px;
    min-height:92px;
    z-index:22;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    transform-origin:50% 0%;
    transition:transform .25s ease;
  }
  #lampBtn.sway{ animation:lampSway .95s ease-in-out; }
  @keyframes lampSway{
    0%{ transform:rotate(0deg); }
    22%{ transform:rotate(11deg); }
    50%{ transform:rotate(-8deg); }
    76%{ transform:rotate(4deg); }
    100%{ transform:rotate(0deg); }
  }
  #lampBtn svg{ width:100%; height:100%; display:block; overflow:visible; }
  #lampGlowHalo{
    transition:opacity .55s ease;
    opacity:.92;
  }
  #stage.night #lampGlowHalo{ opacity:.22; }
  #lampBulb{ transition:fill .45s ease; }
  #stage.night #lampBulb{ fill:#b47b38; }
  #lampCordBead{ transition:transform .16s; }
  #lampBtn:active #lampCordBead{ transform:translateY(7px); }

  /* Decorative Treehouse Bunting Pennants */
  #buntingSvg{
    position:absolute;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    width:min(86vw, 760px);
    height:56px;
    z-index:5;
    pointer-events:none;
    opacity:.92;
  }

  /* ================= WOODEN TOY SHELF (UPPER LEFT) ================= */
  #toyShelf{
    position:absolute;
    left:clamp(16px, 4vw, 64px);
    top:clamp(10px, 3vh, 34px);
    width:clamp(138px, 18vw, 210px);
    z-index:12;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .shelf-toys{
    display:flex;
    align-items:flex-end;
    justify-content:space-around;
    width:100%;
    padding:0 4px;
    gap:4px;
  }
  .shelf-toy{
    width:64px;
    height:64px;
    min-width:64px;
    min-height:64px;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:transform .18s cubic-bezier(.34,1.6,.5,1);
    filter:drop-shadow(0 4px 5px rgba(55,25,6,.28));
  }
  .shelf-toy:active{ transform:scale(.9); }
  .shelf-toy.pop{ animation:toyPop .5s cubic-bezier(.34,1.8,.5,1); }
  @keyframes toyPop{
    0%{ transform:translateY(0) scale(1); }
    40%{ transform:translateY(-14px) scale(1.16) rotate(-8deg); }
    72%{ transform:translateY(-4px) scale(1.04) rotate(6deg); }
    100%{ transform:translateY(0) scale(1); }
  }
  .shelf-toy svg{ width:54px; height:54px; display:block; overflow:visible; }
  .shelf-plank{
    width:100%;
    height:15px;
    border-radius:8px;
    background:linear-gradient(180deg, #a8642d 0%, #7d451a 100%);
    border:3px solid #592e0d;
    box-shadow:0 7px 10px rgba(45,20,4,.32);
    margin-top:-6px;
  }

  /* ================= MINIATURE OPENING SNACK FRIDGE (LEFT) ================= */
  #fridgeBtn{
    position:absolute;
    left:clamp(12px, 4.2vw, 68px);
    bottom:clamp(14px, 4.5vh, 42px);
    width:clamp(112px, 16vw, 174px);
    height:clamp(146px, 24vh, 224px);
    min-width:68px;
    min-height:84px;
    z-index:11;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1);
    filter:drop-shadow(0 10px 16px rgba(45,20,4,.32));
  }
  #fridgeBtn:active{ transform:scale(.96); }
  #fridgeBtn svg{ width:100%; height:100%; display:block; overflow:visible; }
  #fridgeDoorGroup{
    transform-box:fill-box;
    transform-origin:8% 50%;
    transition:transform .38s cubic-bezier(.34,1.4,.5,1);
  }
  #fridgeBtn.open #fridgeDoorGroup{
    transform:scaleX(.24) skewY(6deg);
  }
  #fridgeInterior{
    opacity:0;
    transition:opacity .25s ease;
  }
  #fridgeBtn.open #fridgeInterior{ opacity:1; }

  /* ================= COZY BED & STARRY BLANKET NOOK (RIGHT) ================= */
  #bedNook{
    position:absolute;
    right:clamp(10px, 3.8vw, 58px);
    bottom:clamp(14px, 4.5vh, 40px);
    width:clamp(132px, 19vw, 212px);
    height:clamp(112px, 19vh, 174px);
    min-width:72px;
    min-height:72px;
    z-index:11;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1);
    filter:drop-shadow(0 10px 14px rgba(45,20,4,.3));
  }
  #bedNook:active{ transform:scale(.95); }
  #bedNook svg{ width:100%; height:100%; display:block; overflow:visible; }
  #bedBlanketFold{ transition:opacity .35s ease, transform .35s ease; }
  #bedNook.used #bedBlanketFold{ opacity:.35; transform:translateY(8px) scale(.94); }

  /* ================= BRAIDED RUG + GIANT EYE-TRACKING HOOT ================= */
  #rugWrap{
    position:absolute;
    left:50%;
    bottom:clamp(6px, 2.2vh, 24px);
    transform:translateX(-50%);
    width:clamp(220px, 44vw, 390px);
    height:clamp(64px, 12vh, 108px);
    z-index:7;
    pointer-events:none;
  }
  #rugWrap svg{ width:100%; height:100%; display:block; }

  #hootBuddy{
    position:absolute;
    left:50%;
    bottom:clamp(18px, 4.6vh, 48px);
    transform:translateX(-50%);
    width:clamp(176px, 34vh, 290px);
    height:clamp(192px, 37vh, 314px);
    min-width:120px;
    min-height:120px;
    z-index:14;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    outline:none;
    filter:drop-shadow(0 14px 18px rgba(45,20,4,.32));
  }
  #hootBuddy svg{ width:100%; height:100%; display:block; overflow:visible; }

  /* Hoot lively animations */
  #hootBodyGroup{
    transform-box:fill-box;
    transform-origin:50% 85%;
    animation:hootBreathe 3.2s ease-in-out infinite;
  }
  @keyframes hootBreathe{
    0%,100%{ transform:scale(1, 1) translateY(0); }
    50%{ transform:scale(1.022, .982) translateY(2px); }
  }
  #hootBuddy.sleeping #hootBodyGroup{
    animation:hootSleepBreathe 3.8s ease-in-out infinite;
  }
  @keyframes hootSleepBreathe{
    0%,100%{ transform:scale(1, 1) translateY(2px); }
    50%{ transform:scale(1.036, .965) translateY(5px); }
  }
  #hootBuddy.giggle #hootBodyGroup{
    animation:hootGiggle .62s cubic-bezier(.34,1.6,.5,1);
  }
  @keyframes hootGiggle{
    0%{ transform:scale(1) translateY(0) rotate(0deg); }
    25%{ transform:scale(1.1, .9) translateY(-16px) rotate(-6deg); }
    55%{ transform:scale(.95, 1.08) translateY(-22px) rotate(6deg); }
    80%{ transform:scale(1.05, .96) translateY(-4px) rotate(-2deg); }
    100%{ transform:scale(1) translateY(0) rotate(0deg); }
  }
  #hootBuddy.chomp #hootBodyGroup{
    animation:hootChomp .55s ease-in-out;
  }
  @keyframes hootChomp{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.09, .93) translateY(-8px); }
    60%{ transform:scale(.97, 1.05) translateY(-2px); }
    100%{ transform:scale(1); }
  }
  #hootBuddy.hat-pop #hootHeadGroup{
    animation:hatBounce .52s cubic-bezier(.34,1.8,.5,1);
  }
  #hootHeadGroup{ transform-box:fill-box; transform-origin:50% 70%; }
  @keyframes hatBounce{
    0%{ transform:scale(1) rotate(0deg); }
    35%{ transform:scale(1.08, .92) translateY(-8px) rotate(-5deg); }
    70%{ transform:scale(.97, 1.04) translateY(-2px) rotate(4deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }

  #wingL, #wingR{
    transform-box:fill-box;
    transition:transform .18s ease;
  }
  #wingL{ transform-origin:82% 28%; }
  #wingR{ transform-origin:18% 28%; }
  #hootBuddy.flap #wingL{ animation:flapL .52s ease-in-out; }
  #hootBuddy.flap #wingR{ animation:flapR .52s ease-in-out; }
  @keyframes flapL{
    0%,100%{ transform:rotate(0deg); }
    30%{ transform:rotate(34deg) translateY(-6px); }
    62%{ transform:rotate(-8deg); }
    82%{ transform:rotate(24deg); }
  }
  @keyframes flapR{
    0%,100%{ transform:rotate(0deg); }
    30%{ transform:rotate(-34deg) translateY(-6px); }
    62%{ transform:rotate(8deg); }
    82%{ transform:rotate(-24deg); }
  }

  /* Eyes, blink, open mouth, blush, blanket, hats */
  #eyesOpen{ opacity:1; transition:opacity .12s; }
  #eyesSleep, #eyesHappy{ opacity:0; transition:opacity .12s; }
  #hootBuddy.blink #eyesOpen{ opacity:0; }
  #hootBuddy.blink #eyesSleep{ opacity:1; }
  #hootBuddy.sleeping #eyesOpen{ opacity:0; }
  #hootBuddy.sleeping #eyesSleep{ opacity:1; }
  #hootBuddy.happy-eyes #eyesOpen{ opacity:0; }
  #hootBuddy.happy-eyes #eyesHappy{ opacity:1; }

  #beakOpen{ opacity:0; transform-box:fill-box; transform-origin:50% 25%; transition:opacity .12s, transform .14s; }
  #beakClosed{ opacity:1; transition:opacity .12s; }
  #hootBuddy.mouth-open #beakOpen{ opacity:1; transform:scale(1.08); }
  #hootBuddy.mouth-open #beakClosed{ opacity:0; }

  .hoot-cheek{ opacity:.68; transition:opacity .25s, transform .25s; transform-box:fill-box; transform-origin:center; }
  #hootBuddy.blush .hoot-cheek{ opacity:1; transform:scale(1.25); }

  .hat-layer{ display:none; }
  .hat-layer.on{ display:inline; }

  #hootBlanket{
    opacity:0;
    transform:translateY(26px) scale(.94);
    transform-box:fill-box;
    transform-origin:50% 85%;
    transition:opacity .4s ease, transform .45s cubic-bezier(.34,1.5,.5,1);
    pointer-events:none;
  }
  #hootBuddy.tucked #hootBlanket{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  /* ================= PHYSICS RAINBOW BEACH BALL ================= */
  #beachBall{
    position:absolute;
    left:0;
    top:0;
    width:74px;
    height:74px;
    min-width:64px;
    min-height:64px;
    z-index:20;
    background:none;
    border:none;
    padding:0;
    cursor:grab;
    touch-action:none;
    will-change:transform;
    filter:drop-shadow(0 8px 10px rgba(45,20,4,.3));
  }
  #beachBall:active{ cursor:grabbing; }
  #beachBall svg{ width:100%; height:100%; display:block; }

  /* ================= FLOATING FX LAYER ================= */
  #fxLayer{
    position:absolute;
    inset:0;
    z-index:26;
    pointer-events:none;
    overflow:hidden;
  }
  .fx-pop{
    position:absolute;
    font-size:28px;
    line-height:1;
    pointer-events:none;
    will-change:transform, opacity;
  }
  .fx-zzz{
    position:absolute;
    font-size:28px;
    font-weight:700;
    color:#fef08a;
    text-shadow:0 3px 8px rgba(30,27,75,.65);
    pointer-events:none;
    will-change:transform, opacity;
  }
  .fx-confetti{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:3px;
    pointer-events:none;
    will-change:transform, opacity;
  }
  .drag-ghost{
    position:fixed;
    z-index:50;
    pointer-events:none;
    width:82px;
    height:82px;
    margin-left:-41px;
    margin-top:-41px;
    display:grid;
    place-items:center;
    font-size:58px;
    filter:drop-shadow(0 12px 14px rgba(0,0,0,.32));
    transition:transform .08s;
  }

  /* ================= BOTTOM WOODEN TOY DOCK (>=64px) ================= */
  #toyDock{
    position:relative;
    z-index:28;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    padding:8px max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    background:linear-gradient(180deg, #985826 0%, #733f17 100%);
    border-top:5px solid #c98646;
    box-shadow:0 -8px 20px rgba(32,14,3,.34);
  }
  .dock-tabs{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .dock-sep{
    width:4px;
    height:48px;
    border-radius:999px;
    background:rgba(255,235,198,.28);
  }
  .station-btn{
    min-width:64px;
    min-height:64px;
    width:68px;
    height:64px;
    border-radius:20px;
    border:4px solid #fff;
    background:linear-gradient(180deg, #fffdf7 0%, #f5e6cc 100%);
    font-size:30px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(56,28,8,.42);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .18s;
  }
  .station-btn:active{ transform:translateY(3px) scale(.93); }
  .station-btn.active{
    background:linear-gradient(180deg, #ffe778 0%, #ffc42e 100%);
    box-shadow:0 5px 0 #b87800, 0 0 0 3px #fff, 0 0 18px rgba(255,212,68,.55);
  }
  .station-btn.tuck-on{

  }

  .tray-panel{
    display:none;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .tray-panel.show{ display:flex; }

  .snack-btn, .hat-btn{
    min-width:64px;
    min-height:64px;
    width:72px;
    height:64px;
    border-radius:20px;
    border:4px solid #fff;
    background:linear-gradient(180deg, #ffffff 0%, #fff3df 100%);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:4px;
    box-shadow:0 5px 0 rgba(56,28,8,.38);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .18s, border-color .18s;
    touch-action:none;
  }
  .snack-btn:active, .hat-btn:active{ transform:translateY(3px) scale(.92); }
  .snack-btn{ font-size:36px; cursor:grab; }
  .snack-btn:active{ cursor:grabbing; }
  .hat-btn svg{ width:48px; height:48px; display:block; overflow:visible; }
  .hat-btn.sel{
    background:linear-gradient(180deg, #fff1a6 0%, #ffd046 100%);
    border-color:#ff5e57;
    box-shadow:0 5px 0 #c1322b, 0 0 0 3px #fff;

    #fridgeBtn{

      bottom:10px;

      height:64px;
      bottom:6px;
    }

      height:196px;

      height:64px;

  /* ================= WEB AUDIO TACTILE SOUND ENGINE ================= */
  var AC = null;
  function audio(){
    if(!AC){
      try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ AC = null; }
    }
    if(AC && AC.state === "suspended") AC.resume();
    return AC;
  }

  function playChime(freqs, dur, type, vol){
    if(!soundOn || dead) return;
    var ac = audio(); if(!ac) return;
    var now = ac.currentTime;
    freqs.forEach(function(f, idx){
      var t = now + idx * 0.065;
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.14, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.42));
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + (dur || 0.42) + 0.04);
    });
  }

  function playBoing(boost){
    if(!soundOn || dead) return;
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    var base = 180 + Math.min(boost || 0, 220);
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base * 2.1, t + 0.09);
    o.frequency.exponentialRampToValueAtTime(base * 1.25, t + 0.24);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.3);
  }

  function playLampClick(isNight){
    if(!soundOn || dead) return;
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(isNight ? 520 : 680, t);
    o.frequency.exponentialRampToValueAtTime(isNight ? 280 : 940, t + 0.06);
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.09);
    if(isNight){
      setTimeout(function(){ playChime([523.25, 440, 392, 329.63], 0.65, "sine", 0.09); }, 90);
    } else {
      /* Morning birdsong chime */
      setTimeout(function(){ playChime([587.33, 783.99, 987.77, 1174.66], 0.45, "sine", 0.11); }, 90);
    }
  }

  function playSleepPurr(){
    if(!soundOn || dead || !blanketOn) return;
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(196, t);
    o.frequency.exponentialRampToValueAtTime(164, t + 0.9);
    lfo.frequency.setValueAtTime(6.5, t);
    lg.gain.setValueAtTime(14, t);
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.05);
    o.connect(g); g.connect(ac.destination);
    o.start(t); lfo.start(t);
    o.stop(t + 1.1); lfo.stop(t + 1.1);
  }

  function playDuckSqueak(){
    if(!soundOn || dead) return;
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(760, t);
    o.frequency.exponentialRampToValueAtTime(1240, t + 0.07);
    o.frequency.exponentialRampToValueAtTime(840, t + 0.16);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.17, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.21);
  }

  function playCrunchPop(){
    if(!soundOn || dead) return;
    var ac = audio(); if(!ac) return;
    [0, 0.12].forEach(function(delay){
      var t = ac.currentTime + delay;
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(240 + delay * 500, t);
      o.frequency.exponentialRampToValueAtTime(95, t + 0.06);
      g.gain.setValueAtTime(0.08, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.08);
    });
  }

  /* ================= VERIFIED STUDIO HOOT VOICE ================= */
  var VBASE = "assets/voice/";
  var voiceEl = null;

    try{
      var d = window.parent && window.parent.document;
      if(!d || d === document) return false;
      var b = d.querySelector('.voice-btn[data-voice="off"]');
      return !!(b && (b.classList.contains("sel") || b.classList.contains("active") || b.getAttribute("aria-pressed") === "true"));
    }catch(e){ return false; }
  }
  function speakClip(file, isGiggle){

  function updateEyeTargetFromClient(cx, cy){
    var hr = hootBuddy.getBoundingClientRect();

    var ey = hr.top + hr.height * 0.43;
    var dx = cx - ex;
    var dy = cy - ey;
    var dist = Math.hypot(dx, dy) || 1;
    var maxShift = 7.2;
    var scale = Math.min(maxShift, dist / 24);
    eyeTarget.x = (dx / dist) * scale;
    eyeTarget.y = (dy / dist) * scale;
  }

  function tossSnackToHoot(snackKey, startClientX, startClientY){
    var info = SNACK_MAP[snackKey] || SNACK_MAP.apple;
    if(blanketOn) setBlanket(false, true);
    fridgeOpen = true;
    fridgeBtn.classList.add("open");

    hootBuddy.classList.add("mouth-open");
    playChime([392, 523.25], 0.22, "triangle", 0.11);

    var start = roomCoords(startClientX, startClientY);
    var target = hootCenterRoom();
    var fly = document.createElement("span");
    fly.className = "fx-pop";
    fly.style.fontSize = "52px";
    fly.textContent = info.emo;
    fly.style.left = (start.x - 26) + "px";
    fly.style.top = (start.y - 26) + "px";
    fxLayer.appendChild(fly);

    var midX = (start.x + target.beakX) * 0.5;
    var midY = Math.min(start.y, target.beakY) - 110;
    var t0 = performance.now();
    var dur = 380;

    function step(now){
      if(dead){ fly.remove(); return; }
      var u = Math.min(1, (now - t0) / dur);
      var inv = 1 - u;
      var x = inv * inv * start.x + 2 * inv * u * midX + u * u * target.beakX;
      var y = inv * inv * start.y + 2 * inv * u * midY + u * u * target.beakY;
      var sc = 1 + Math.sin(u * Math.PI) * 0.32 - u * 0.28;
      fly.style.left = (x - 26) + "px";
      fly.style.top = (y - 26) + "px";
      fly.style.transform = "scale(" + sc.toFixed(2) + ") rotate(" + (u * 300) + "deg)";
      if(u < 1){
        requestAnimationFrame(step);
      } else {
        fly.remove();
        completeFeed(snackKey);
      }
    }
    requestAnimationFrame(step);
  }

  /* Support BOTH drag-to-beak AND quick 1-tap toss on every snack button */
  document.querySelectorAll(".snack-btn").forEach(function(btn){
    var dragState = null;
    btn.addEventListener("pointerdown", function(e){
      e.preventDefault();
      audio();
      var key = btn.dataset.snack;
      var info = SNACK_MAP[key] || SNACK_MAP.apple;
      var ghost = document.createElement("div");
      ghost.className = "drag-ghost";
      ghost.textContent = info.emo;
      ghost.style.left = e.clientX + "px";
      ghost.style.top = e.clientY + "px";
      ghost.style.opacity = "0";
      document.body.appendChild(ghost);
      dragState = {
        id: e.pointerId,
        key: key,
        sx: e.clientX,
        sy: e.clientY,
        moved: false,
        ghost: ghost
      };
      try{ btn.setPointerCapture(e.pointerId); }catch(err){}
    });

    btn.addEventListener("pointermove", function(e){
      if(!dragState || dragState.id !== e.pointerId) return;
      var dist = Math.hypot(e.clientX - dragState.sx, e.clientY - dragState.sy);
      if(dist > 14){
        dragState.moved = true;
        dragState.ghost.style.opacity = "1";
      }
      if(dragState.moved){
        dragState.ghost.style.left = e.clientX + "px";
        dragState.ghost.style.top = e.clientY + "px";
        updateEyeTargetFromClient(e.clientX, e.clientY);
        var hr = hootBuddy.getBoundingClientRect();
        var near = Math.hypot(e.clientX - (hr.left + hr.width * 0.5), e.clientY - (hr.top + hr.height * 0.5)) < Math.max(hr.width * 0.85, 130);
        hootBuddy.classList.toggle("mouth-open", near);
      }
    });

    function endDrag(e){
      if(!dragState || dragState.id !== e.pointerId) return;
      var st = dragState;
      dragState = null;
      st.ghost.remove();
      hootBuddy.classList.remove("mouth-open");
      if(!st.moved){
        var br = btn.getBoundingClientRect();
        tossSnackToHoot(st.key, br.left + br.width * 0.5, br.top + br.height * 0.3);
      } else {
        var hr = hootBuddy.getBoundingClientRect();
        var droppedOnHoot =
          e.clientX >= hr.left - 45 && e.clientX <= hr.right + 45 &&
          e.clientY >= hr.top - 45 && e.clientY <= hr.bottom + 45;
        if(droppedOnHoot){
          completeFeed(st.key);
        } else {
          /* Kid let go partway — generously toss it into Hoot's mouth anyway (zero fail state!) */
          tossSnackToHoot(st.key, e.clientX, e.clientY);
        }
      }
    }
    btn.addEventListener("pointerup", endDrag);
    btn.addEventListener("pointercancel", endDrag);
  });

  /* ================= 2D PHYSICS RAINBOW BEACH BALL ================= */
  var BALL_SIZE = 74;
  var ball = {
    x: 120,
    y: 260,
    vx: 0,
    vy: 0,
    rot: 0,
    vrot: 0,
    dragging: false,
    ptrId: null,
    lastPx: 0,
    lastPy: 0,
    lastPt: 0,
    inited: false,
    activeUntil: 0
  };

  function placeBallRest(){
    var rr = roomStage.getBoundingClientRect();
    if(!rr.width || !rr.height) return;
    var floorY = rr.height - BALL_SIZE - Math.max(10, rr.height * 0.03);
    ball.x = rr.width < 520
      ? Math.max(14, rr.width - BALL_SIZE - 18)
      : Math.max(18, Math.min(rr.width * 0.28, rr.width - BALL_SIZE - 18));
    ball.y = rr.width < 520 ? Math.max(198, floorY - 118) : floorY;
    ball.vx = 0;
    ball.vy = 0;
    ball.vrot = 0;
    ball.inited = true;
    renderBall();
  }

  function clampBallToRoom(){
    var rr = roomStage.getBoundingClientRect();
    if(!rr.width || !rr.height) return;
    var floorY = rr.height - BALL_SIZE - Math.max(10, rr.height * 0.03);
    var maxX = rr.width - BALL_SIZE - 8;
    var changed = false;
    if(ball.x < 8){ ball.x = 8; changed = true; }
    if(ball.x > maxX){ ball.x = maxX; changed = true; }
    if(ball.y < 8){ ball.y = 8; changed = true; }
    if(ball.y > floorY){ ball.y = floorY; changed = true; }
    if(changed) renderBall();
  }

  function renderBall(){
    beachBall.style.transform = "translate3d(" + ball.x.toFixed(1) + "px," + ball.y.toFixed(1) + "px,0) rotate(" + ball.rot.toFixed(1) + "deg)";
  }

  function launchBall(fromDock){
    audio();
    if(blanketOn) setBlanket(false, true);
    var rr = roomStage.getBoundingClientRect();
    var midAir = ball.y < rr.height - BALL_SIZE - 46;
    var dir = (ball.x < rr.width * 0.5) ? 1 : -1;
    ball.vx = dir * (240 + Math.random() * 240);
    ball.vy = -(560 + Math.random() * 210);
    ball.vrot = dir * (280 + Math.random() * 240);
    ballActive = true;
    ball.activeUntil = performance.now() + 4500;
    playBoing(Math.abs(ball.vy) * 0.25);
    spawnBurst(ball.x + BALL_SIZE * 0.5, ball.y + BALL_SIZE * 0.5, ["🌈", "✨", "⭐"], 7);

    if(midAir){
      earnStar(1);
      hootBuddy.classList.add("flap");
      setTimeout(function(){ hootBuddy.classList.remove("flap"); }, 520);
    }
    if(fromDock){
      speakClip("word-ball.mp3", false);
    }
  }

  btnBallKick.addEventListener("click", function(){ launchBall(true); });

  beachBall.addEventListener("pointerdown", function(e){
    e.preventDefault();
    e.stopPropagation();
    audio();
    var rr = roomStage.getBoundingClientRect();
    ball.dragging = true;
    ball.ptrId = e.pointerId;
    ball.lastPx = e.clientX;
    ball.lastPy = e.clientY;
    ball.lastPt = performance.now();
    ball.dragMoved = false;
    ball.vx = 0;
    ball.vy = 0;
    ballActive = true;
    ball.activeUntil = performance.now() + 4500;
    /* Snap ball center cleanly toward grab without teleport jump */
    ball.grabOffX = (e.clientX - rr.left) - ball.x;
    ball.grabOffY = (e.clientY - rr.top) - ball.y;
    try{ beachBall.setPointerCapture(e.pointerId); }catch(err){}
  });

  beachBall.addEventListener("pointermove", function(e){
    if(!ball.dragging || ball.ptrId !== e.pointerId) return;
    var rr = roomStage.getBoundingClientRect();
    var now = performance.now();
    var dt = Math.max(0.008, (now - ball.lastPt) / 1000);
    var nx = Math.max(6, Math.min(rr.width - BALL_SIZE - 6, (e.clientX - rr.left) - ball.grabOffX));
    var ny = Math.max(6, Math.min(rr.height - BALL_SIZE - 6, (e.clientY - rr.top) - ball.grabOffY));
    if(Math.hypot(e.clientX - ball.lastPx, e.clientY - ball.lastPy) > 6){
      ball.dragMoved = true;
    }
    ball.vx = Math.max(-1100, Math.min(1100, (nx - ball.x) / dt));
    ball.vy = Math.max(-1100, Math.min(1100, (ny - ball.y) / dt));
    ball.x = nx;
    ball.y = ny;
    ball.rot += ball.vx * dt * 0.4;
    ball.lastPx = e.clientX;
    ball.lastPy = e.clientY;
    ball.lastPt = now;
    renderBall();
  });

  function releaseBall(e){
    if(!ball.dragging || ball.ptrId !== e.pointerId) return;
    ball.dragging = false;
    ball.ptrId = null;
    if(!ball.dragMoved || Math.hypot(ball.vx, ball.vy) < 120){
      launchBall(false);
    } else {
      ball.vrot = ball.vx * 0.9;
      ballActive = true;
      ball.activeUntil = performance.now() + 4500;
      playBoing(Math.hypot(ball.vx, ball.vy) * 0.2);
      spawnBurst(ball.x + BALL_SIZE * 0.5, ball.y + BALL_SIZE * 0.5, ["✨", "⭐"], 5);
    }
  }
  beachBall.addEventListener("pointerup", releaseBall);
  beachBall.addEventListener("pointercancel", releaseBall);

  /* ================= MAIN ANIMATION LOOP (PHYSICS + EYE TRACKING) ================= */
  var lastFrame = performance.now();
  function tick(now){
    if(dead) return;
    var dt = Math.min(0.036, Math.max(0.001, (now - lastFrame) / 1000));
    lastFrame = now;

    /* 1. Beach Ball 2D Physics */
    var rr = roomStage.getBoundingClientRect();
    if(rr.width > 0 && rr.height > 0){
      if(!ball.inited) placeBallRest();
      var floorY = rr.height - BALL_SIZE - Math.max(10, rr.height * 0.03);
      var maxX = rr.width - BALL_SIZE - 8;

      if(!ball.dragging){
        var speed = Math.hypot(ball.vx, ball.vy);
        var offFloor = ball.y < floorY - 1.5;
        if(speed > 6 || offFloor){
          ball.vy += 1260 * dt;
          ball.x += ball.vx * dt;
          ball.y += ball.vy * dt;
          ball.rot += ball.vrot * dt;

          /* Left / Right wall bounce */
          if(ball.x < 8){
            ball.x = 8;
            ball.vx = Math.abs(ball.vx) * 0.8;
            ball.vrot = Math.abs(ball.vrot) * 0.85;
            if(Math.abs(ball.vx) > 90) playBoing(Math.abs(ball.vx) * 0.16);
          } else if(ball.x > maxX){
            ball.x = maxX;
            ball.vx = -Math.abs(ball.vx) * 0.8;
            ball.vrot = -Math.abs(ball.vrot) * 0.85;
            if(Math.abs(ball.vx) > 90) playBoing(Math.abs(ball.vx) * 0.16);
          }

          /* Ceiling bounce */
          if(ball.y < 8){
            ball.y = 8;
            ball.vy = Math.abs(ball.vy) * 0.72;
          }

          /* Wooden floor bounce */
          if(ball.y >= floorY){
            ball.y = floorY;
            if(Math.abs(ball.vy) > 130){
              ball.vy = -Math.abs(ball.vy) * 0.76;
              ball.vx *= 0.94;
              playBoing(Math.abs(ball.vy) * 0.18);
            } else {
              ball.vy = 0;
              ball.vx *= Math.pow(0.28, dt);
              ball.vrot = ball.vx * 0.85;
              if(Math.abs(ball.vx) < 12){
                ball.vx = 0;
                ball.vrot = 0;
              }
            }
          }
          renderBall();
        } else {
          if(ball.y > floorY || ball.x > maxX || ball.x < 8 || ball.y < 8){
            ball.x = Math.max(8, Math.min(maxX, ball.x));
            ball.y = Math.max(8, Math.min(floorY, ball.y));
            renderBall();
          }
          if(ballActive && now > ball.activeUntil){
            ballActive = false;
          }
        }
      }

      /* Hoot watches the bouncing beach ball whenever it's in motion! */
      if(ballActive && !blanketOn){
        updateEyeTargetFromClient(rr.left + ball.x + BALL_SIZE * 0.5, rr.top + ball.y + BALL_SIZE * 0.5);
      }
    }

    /* 2. Smooth Eye-Tracking Interpolation */
    eyeCur.x += (eyeTarget.x - eyeCur.x) * Math.min(1, dt * 13);
    eyeCur.y += (eyeTarget.y - eyeCur.y) * Math.min(1, dt * 13);
    var tf = "translate(" + eyeCur.x.toFixed(2) + "px," + eyeCur.y.toFixed(2) + "px)";
    pupilL.style.transform = tf;
    pupilR.style.transform = tf;

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.addEventListener("resize", function(){
    var rr = roomStage.getBoundingClientRect();
    if(!rr.width) return;
    var floorY = rr.height - BALL_SIZE - Math.max(10, rr.height * 0.03);
    ball.x = Math.max(8, Math.min(rr.width - BALL_SIZE - 8, ball.x));
    ball.y = Math.max(8, Math.min(floorY, ball.y));
    renderBall();
  });

  soundBtn.addEventListener("click", function(){
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    if(soundOn) playChime([523.25, 659.25], 0.22, "sine", 0.1);
  });

  window.addEventListener("pagehide", function(){
    dead = true;
    if(blinkTimer) clearTimeout(blinkTimer);
    if(zzzInterval) clearInterval(zzzInterval);
    if(voiceEl){ try{ voiceEl.pause(); }catch(e){} }
  });

  /* ================= VERIFICATION SNAPSHOT API ================= */
  window.__treehouseGame = {
    snapshot: function(){
      return {
        kidId: kidId,
        hat: currentHat,
        nightMode: nightMode,
        fedCount: fedCount,
        ballActive: ballActive,
        stars: stars,
        blanketOn: blanketOn,
        fridgeOpen: fridgeOpen
      };
    }
  };
})();
</script>
