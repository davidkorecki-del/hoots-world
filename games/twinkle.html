<style>
  :root{ --ink:#121b38; --gold:#fde047; --outline:#121b38; --warm:#fffdf7; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }

  html,body{ margin:0; width:100%; height:100%; overflow:hidden; font-family:"Nunito",system-ui,sans-serif; background:#090d24; touch-action:none; }

  #stage{ position:fixed; inset:0; width:100%; height:100dvh; overflow:hidden; background:#090d24; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:1; touch-action:none; }

  /* Top HUD */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding:max(10px, env(safe-area-inset-top)) 14px 0 14px;

  .hud-left{ display:flex; align-items:center; gap:10px; pointer-events:auto; max-width:min(58vw, 530px); }
  #hootBtn{

    box-shadow:0 6px 0 var(--outline), 0 0 24px rgba(253,224,71,.62);
    padding:4px; cursor:pointer;
    animation:hootBob 2.2s ease-in-out infinite alternate;
  }
  #hootBtn:active{ transform:scale(.9); }
  @keyframes hootBob{ from{ transform:translateY(0); } to{ transform:translateY(-4px); } }
  #promptBubble{
    background:rgba(255,253,247,.95); color:var(--ink);
    border:4px solid var(--outline); border-radius:22px;
    padding:8px 14px; font-family:"Fredoka",sans-serif; font-weight:700;
    font-size:clamp(13.5px, 1.9vw, 17px); line-height:1.22;
    box-shadow:0 6px 0 var(--outline), 0 12px 26px rgba(0,0,0,.42);
  }
  #promptBubble b{ color:#7c3aed; }

  .hud-right{ display:flex; align-items:center; gap:8px; pointer-events:auto; flex-shrink:0; }
  #skyBadges{
    display:flex; align-items:center; gap:5px;
    background:rgba(15,23,54,.86); border:3.5px solid #fde047;
    border-radius:999px; padding:4px 9px; box-shadow:0 5px 0 var(--outline);
  }
  .sbadge{
    position:relative; width:38px; height:38px; border-radius:50%;
    border:3px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12);
    display:grid; place-items:center; font-size:20px; cursor:pointer; padding:0;
    filter:grayscale(1) opacity(.48); transition:transform .35s cubic-bezier(.34,1.8,.5,1), filter .3s;
  }
  .sbadge.active-sky{ border-color:#38bdf8; box-shadow:0 0 12px rgba(56,189,248,.95); filter:grayscale(.2) opacity(.95); }
  .sbadge.lit{
    filter:none; border-color:var(--outline);
    background:radial-gradient(circle at 32% 28%, #fef08a, #facc15 65%, #f59e0b 100%);
    box-shadow:0 0 16px rgba(250,204,21,.95);
    animation:popBadge .55s cubic-bezier(.34,1.8,.5,1);
  }
  .sbadge-chk{
    position:absolute; right:-4px; bottom:-4px; font-size:11px; line-height:1;
    background:#16a34a; color:#fff; border-radius:50%; width:16px; height:16px;

  }
  @keyframes popBadge{ 0%{ transform:scale(.4) rotate(-18deg); } 65%{ transform:scale(1.28) rotate(8deg); } 100%{ transform:scale(1) rotate(0); } }

  #starPill{
    display:flex; align-items:center; gap:6px;

    padding:6px 13px; font-family:"Fredoka",sans-serif; font-weight:800; font-size:19px; color:var(--ink);

  }
  #doneBtn{
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:16px;
    padding:8px 15px; cursor:pointer; white-space:nowrap;
    box-shadow:0 5px 0 var(--outline); text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  #doneBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--outline); }

  /* Color Target Pill (shown only in Rainbow Color Match mode!) */
  #colorCard{
    position:absolute; right:14px; top:84px; z-index:11;
    background:rgba(15,23,54,.92); border:4px solid #fde047; border-radius:22px;
    padding:8px 14px; display:flex; align-items:center; gap:10px;
    box-shadow:0 7px 0 var(--outline), 0 0 28px rgba(253,224,71,.45);

  #colorCard img{ width:44px; height:44px; object-fit:contain; filter:drop-shadow(0 0 10px rgba(255,255,255,.7)); animation:starPulse .9s ease-in-out infinite alternate; }
  @keyframes starPulse{ from{ transform:scale(1) rotate(-6deg); } to{ transform:scale(1.14) rotate(6deg); } }

  /* Big Hero Action Pill (SHAKE JAR! / NEXT SKY!) — sits cleanly ABOVE the glass jar so all trapped stars stay 100% visible! */
  #actionStage{
    position:absolute; left:0; right:0; bottom:max(290px, 38vh); z-index:12;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;

  .hero-action-btn{
    pointer-events:auto;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    border:5px solid #fff; border-radius:999px;

    text-shadow:0 3px 0 rgba(18,27,56,.48);

  .hero-action-btn:active{ transform:translateY(5px); }
  #shakeBtn{
    background:radial-gradient(circle at 35% 25%, #fef08a 0%, #f59e0b 55%, #d97706 100%);

  #nextSkyBtn{
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);

  @keyframes heroPulse{
    from{ transform:scale(1); box-shadow:0 9px 0 var(--outline), 0 0 0 0 rgba(253,224,71,.7); }

  .tap-finger{ display:inline-block; font-size:26px; line-height:1; animation:fingerHop .5s ease-in-out infinite alternate; }

  /* Bottom Starlight Dock */
  #bottomDock{
    position:absolute; left:50%; bottom:max(10px, env(safe-area-inset-bottom));

  }
  .dock-group{ display:flex; align-items:center; gap:7px; flex-wrap:nowrap; }

  #jarCounter{
    display:flex; align-items:center; gap:6px;

  #winOverlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(9,13,36,.78); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; padding:18px;

  .win-card{
    background:linear-gradient(180deg, #fffef8 0%, #fef3c7 100%);
    border:6px solid var(--outline); border-radius:34px;
    padding:26px 24px; text-align:center; max-width:450px; width:100%;
    box-shadow:0 14px 0 var(--outline), 0 26px 50px rgba(0,0,0,.58);
  }
  .win-trophy{ font-size:62px; line-height:1.1; margin-bottom:8px; }
  .win-card h2{ margin:0 0 8px; font-family:"Fredoka",sans-serif; font-size:32px; color:var(--ink); }
  .win-card p{ margin:0 0 18px; font-weight:800; font-size:17px; color:#334155; }
  .big-play{
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:20px;
    padding:12px 26px; cursor:pointer; box-shadow:0 6px 0 var(--outline);

  @media (max-width: 740px){
    #hud{ flex-wrap:wrap; align-items:center; gap:6px; padding:max(8px, env(safe-area-inset-top)) 10px 0; }
    .hud-left{ display:contents; }
    #hootBtn{ width:52px; height:52px; flex:0 0 52px; order:1; border-width:3px; }
    .hud-right{ order:2; margin-left:auto; gap:6px; }
    #skyBadges{ display:none; }
    #starPill{ font-size:16px; padding:5px 11px; border-width:3px; }
    #doneBtn{ font-size:14.5px; padding:6px 12px; border-width:3px; }
    #promptBubble{
      order:3; flex:1 0 100%; width:100%;
      padding:7px 12px; border-width:3px; border-radius:16px;
      font-size:13.5px; line-height:1.2; text-align:center;
    }
    #colorCard{ left:10px; right:auto; top:126px; padding:6px 10px; border-width:3px; font-size:14px; }
    #colorCard img{ width:34px; height:34px; }
    #bottomDock{
      width:min(96vw, 440px); border-radius:24px; border-width:3px; padding:6px 8px;
      flex-direction:column; gap:5px;
    }
    .dock-group{ width:100%; justify-content:center; gap:5px; }
    .d-pill{ flex:1 1 0; min-width:0; min-height:42px; padding:6px 6px; font-size:12.5px; border-width:3px; text-align:center; }
    #jarCounter{ font-size:14.5px; }
    #actionStage{ bottom:308px; }
    .hero-action-btn{ padding:10px 22px; font-size:20px; border-width:4px; }
  }
</style>

<script>
(function(){
  "use strict";

  /* =========================================================================
     1. VOICE ENGINE (100% Real Studio Muse Hoot Clips, Gated + Fallbacks!)
     ========================================================================= */
  var voiceA = new Audio();
  var voiceGen = 0, lastStepClips = null, idleHelpTimer = null, idleHelpReminded = false;
  var won = false;

  function hasClip(id){
    try{
      if(window.parent && window.parent.HOOT_HAVE && window.parent.HOOT_HAVE[id]) return true;
      if(window.HOOT_HAVE && window.HOOT_HAVE[id]) return true;
    }catch(e){}
    return false;
  }
  function resolveCmd(preferredId, fallbacks){
    if(preferredId && hasClip(preferredId)) return [preferredId];
    return (fallbacks && fallbacks.length) ? fallbacks.slice() : [];
  }
  function clearIdleHelp(){
    if(idleHelpTimer){ clearTimeout(idleHelpTimer); idleHelpTimer = null; }
  }
  function armIdleHelp(){
    clearIdleHelp();
    if(won || !lastStepClips || !lastStepClips.length || idleHelpReminded) return;
    idleHelpTimer = setTimeout(function(){
      if(won || !lastStepClips || !lastStepClips.length) return;
      idleHelpReminded = true;
      playVoice(lastStepClips);
    }, 11500);
  }
  window.addEventListener("pointerdown", function(){
    idleHelpReminded = false;
    armIdleHelp();
  }, true);

  function playVoice(clips){
    if(!clips || !clips.length) return;
    var myGen = ++voiceGen, i = 0;
    voiceA.onended = null; voiceA.onerror = null;
    try{ voiceA.pause(); }catch(e){}
    function step(){
      if(myGen !== voiceGen || i >= clips.length) return;
      var id = clips[i++];
      if(!id){ step(); return; }
      voiceA.src = "assets/voice/" + id + ".mp3";
      voiceA.onended = step; voiceA.onerror = step;
      var p = voiceA.play(); if(p && p.catch) p.catch(function(){});
    }
    step();
  }
  function setStepVoice(preferredId, fallbacks, speakNow){
    var seq = resolveCmd(preferredId, fallbacks);
    lastStepClips = seq;
    idleHelpReminded = false;
    armIdleHelp();
    if(speakNow !== false && seq.length) playVoice(seq);
  }

  /* =========================================================================
     2. CELESTA MUSIC-BOX WEBAUDIO SYNTH (Plays Twinkle Twinkle Little Star!)
     ========================================================================= */
  var actx = null;
  function ac(){
    if(!actx){ var A = window.AudioContext || window.webkitAudioContext; if(A) actx = new A(); }
    if(actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  /* Classic Twinkle Twinkle Little Star melody frequencies (C5..A5) */
  var TWINKLE_NOTES = [523.25, 523.25, 783.99, 783.99, 880.00, 880.00, 783.99, 698.46, 698.46, 659.25, 659.25, 587.33, 587.33, 523.25];
  function sfxStarChime(idx){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime, f = TWINKLE_NOTES[(idx || 0) % TWINKLE_NOTES.length];
      [1, 2].forEach(function(mult, k){
        var o = c.createOscillator(), g = c.createGain();
        o.type = k === 0 ? "triangle" : "sine";
        o.frequency.setValueAtTime(f * mult, t);
        g.gain.setValueAtTime(k === 0 ? 0.16 : 0.06, t);
        g.gain.exponentialRampToValueAtTime(0.0008, t + (k === 0 ? 0.55 : 0.28));
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + 0.6);
      });
    }catch(e){}
  }
  function sfxJarClink(step){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime, base = 880 + (step || 0) * 180;
      [0, 0.06, 0.12].forEach(function(dt, k){
        var o = c.createOscillator(), g = c.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(base + k * 210, t + dt);
        g.gain.setValueAtTime(0.11, t + dt);
        g.gain.exponentialRampToValueAtTime(0.001, t + dt + 0.22);
        o.connect(g); g.connect(c.destination);
        o.start(t + dt); o.stop(t + dt + 0.24);
      });
    }catch(e){}
  }
  function sfxCorkPop(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime, o = c.createOscillator(), g = c.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(920, t + 0.11);
      g.gain.setValueAtTime(0.20, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.18);
    }catch(e){}
  }
  function sfxCloudPuff(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime, len = Math.floor(c.sampleRate * 0.22);
      var buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.4));
      var src = c.createBufferSource(); src.buffer = buf;
      var lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 950;
      var g = c.createGain(); g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      src.connect(lp); lp.connect(g); g.connect(c.destination);
      src.start(t);
    }catch(e){}
  }
  function sfxConstellationFanfare(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime;
      [523.25, 523.25, 783.99, 783.99, 880.0, 880.0, 783.99].forEach(function(f, k){
        var o = c.createOscillator(), g = c.createGain();
        o.type = "triangle"; o.frequency.value = f;
        var dt = k * 0.14;
        g.gain.setValueAtTime(0.13, t + dt);
        g.gain.exponentialRampToValueAtTime(0.001, t + dt + 0.42);
        o.connect(g); g.connect(c.destination);
        o.start(t + dt); o.stop(t + dt + 0.46);
      });

    /* Check glowing Star Lantern Jar tap / shake */
    var jr = jarRect();
    if(Math.abs(px - jr.cx) < jr.w * 0.68 && Math.abs(py - jr.cy) < jr.h * 0.62){
      if(phase === "shake"){
        shakingJarDrag = true; lastShakeX = px; dragShakeAccum = 0;
        performJarShake();
        return;
      } else if(jarStars.length > 0){
        jarShakeAmt = 0.55; jarWobbleVel = 8; sfxJarClink(1);
        jarStars.forEach(function(js){ js.vy -= 140; js.vx += (Math.random() - 0.5) * 180; });
        return;
      }
    }

    if(phase === "catch"){
      swipingNet = true;
      netTrail.push({ x: px, y: py, life: 1.0 });
      if(!hitTestCatch(px, py)){
        /* Sparkle dust anywhere you tap the night sky! */
        spawnSparkles(px, py, "#fef08a", 6);
      }
    }
  });

  window.addEventListener("pointermove", function(e){
    var rect = cv.getBoundingClientRect();
    var px = e.clientX - rect.left, py = e.clientY - rect.top;
    if(phase === "catch" && swipingNet){
      netTrail.push({ x: px, y: py, life: 1.0 });
      if(netTrail.length > 26) netTrail.shift();
      hitTestCatch(px, py);
    } else if(phase === "shake" && shakingJarDrag){
      var dx = px - lastShakeX; lastShakeX = px;
      dragShakeAccum += Math.abs(dx);
      jarTilt = Math.max(-0.28, Math.min(0.28, dx * 0.015));
      if(dragShakeAccum > 95){
        dragShakeAccum = 0;
        performJarShake();
      }
    }
  });
  window.addEventListener("pointerup", function(){ swipingNet = false; shakingJarDrag = false; });
  window.addEventListener("pointercancel", function(){ swipingNet = false; shakingJarDrag = false; });

  /* UI Button Handlers */
  shakeBtn.addEventListener("pointerdown", function(e){ e.preventDefault(); e.stopPropagation(); performJarShake(); });
  nextSkyBtn.addEventListener("pointerdown", function(e){
    e.preventDefault(); e.stopPropagation();
    if(phase !== "celebrated") return;
    skyIdx = (skyIdx + 1) % SKIES.length;
    startSky(true);
  });
  function setMode(m){
    mode = m;
    document.getElementById("mode5Btn").classList.toggle("sel", m === "count5");
    document.getElementById("mode10Btn").classList.toggle("sel", m === "count10");
    document.getElementById("modeColorBtn").classList.toggle("sel", m === "colors");
    sfxStarChime(2);
    startSky(true);
  }
  document.getElementById("mode5Btn").addEventListener("click", function(){ setMode("count5"); });
  document.getElementById("mode10Btn").addEventListener("click", function(){ setMode("count10"); });
  document.getElementById("modeColorBtn").addEventListener("click", function(){ setMode("colors"); });
  document.getElementById("showerBtn").addEventListener("pointerdown", function(e){
    e.preventDefault(); e.stopPropagation();
    sfxConstellationFanfare();
    for(var i = 0; i < 4; i++) spawnFlyingStar(mode === "colors" && i < 2 ? COLOR_DEFS[targetColorIdx].key : undefined);
    spawnSparkles(W * 0.5, H * 0.28, null, 24);
  });
  document.getElementById("hootBtn").addEventListener("click", function(){
    if(lastStepClips && lastStepClips.length) playVoice(lastStepClips);
  });
  document.querySelectorAll(".sbadge").forEach(function(b){
    b.addEventListener("click", function(){
      skyIdx = parseInt(b.getAttribute("data-si"), 10) || 0;
      sfxStarChime(3); startSky(true);
    });
  });
  document.getElementById("doneBtn").addEventListener("click", function(){
    roundGen++; won = true; clearIdleHelp();
    var litCnt = Object.keys(litSkies).length;
    document.getElementById("winSummary").textContent = litCnt >= 4
      ? "You lit up all 4 magical constellations, unlocked Rainbow Aurora Wizard Mode, and caught " + totalStars + " twinkling stars!"
      : "Amazing star catching! You lit up " + litCnt + " constellation" + (litCnt === 1 ? "" : "s") + " and earned " + totalStars + " stars!";
    winOverlay.hidden = false;
    playVoice(["hoot-win-star"]);
  });
  document.getElementById("againBtn").addEventListener("click", function(){
    won = false; winOverlay.hidden = true; startSky(true);
  });

  /* =========================================================================
     7. 60FPS PIXAR STARLIGHT RENDER & PHYSICS LOOP
     ========================================================================= */
  var tAcc = 0, lastT = performance.now();

  function drawCoverImg(im){
    if(!im || !im.complete || !im.naturalWidth) return;
    var sc = Math.max(W / im.naturalWidth, H / im.naturalHeight);
    var dw = im.naturalWidth * sc, dh = im.naturalHeight * sc;
    ctx.drawImage(im, (W - dw) * 0.5, (H - dh) * 0.5, dw, dh);
  }

  function render(now){
    requestAnimationFrame(render);
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now; tAcc += dt;

    var sky = SKIES[skyIdx % SKIES.length];
    var jr = jarRect(), bp = buddyPos(), cb = constellationBox();

    /* 1. Full-bleed Pixar Starry Night World Backdrop */
    ctx.fillStyle = "#090d24";
    ctx.fillRect(0, 0, W, H);
    drawCoverImg(IMG[sky.bg]);

    /* Soft upper sky night depth gradient so glowing constellations & stars pop dramatically */
    var skyWash = ctx.createLinearGradient(0, 0, 0, H * 0.72);
    skyWash.addColorStop(0, "rgba(7,10,32,0.46)");
    skyWash.addColorStop(0.65, "rgba(12,18,52,0.18)");
    skyWash.addColorStop(1, "rgba(12,18,52,0)");
    ctx.fillStyle = skyWash;
    ctx.fillRect(0, 0, W, H);

    /* Unlocked Rainbow Aurora Borealis ribbons — silky soft glowing curved waves (zero hard rectangle edge!) */
    if(wizardUnlocked || phase === "celebrated"){
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.lineCap = "round";
      var aurCols = ["rgba(74,222,128,0.22)", "rgba(192,132,252,0.22)", "rgba(56,189,248,0.20)"];
      for(var ai = 0; ai < 3; ai++){
        ctx.strokeStyle = aurCols[ai];
        ctx.lineWidth = 52 - ai * 8;
        ctx.shadowColor = aurCols[ai];
        ctx.shadowBlur = 34;
        ctx.beginPath();
        for(var ax = -40; ax <= W + 40; ax += 48){
          var ay = H * (0.15 + ai * 0.065) + Math.sin(ax * 0.0045 + tAcc * (1.1 + ai * 0.35) + ai * 1.4) * 30;
          if(ax === -40) ctx.moveTo(ax, ay); else ctx.lineTo(ax, ay);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    /* Ambient twinkling background micro-stars */
    for(var ti = 0; ti < bgTwinkles.length; ti++){
      var bt = bgTwinkles[ti];
      var tw = 0.28 + 0.72 * (Math.sin(tAcc * 2.8 + bt.ph) * 0.5 + 0.5);
      ctx.fillStyle = "rgba(255,250,220," + (tw * 0.75).toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(bt.x * W, bt.y * H, bt.r * (0.7 + tw * 0.45), 0, Math.PI * 2); ctx.fill();
    }

    /* 2. Glowing Constellation Blueprint & Lit Golden Starlight Beams! */
    ctx.save();
    var allLit = phase === "celebrated";
    if(allLit) constGlowT = Math.min(1, constGlowT + dt * 1.5);
    /* Draw edges */
    sky.edges.forEach(function(ed){
      var p0 = sky.pts[ed[0]], p1 = sky.pts[ed[1]];
      var x0 = cb.cx + p0[0] * cb.rx, y0 = cb.cy + p0[1] * cb.ry;
      var x1 = cb.cx + p1[0] * cb.rx, y1 = cb.cy + p1[1] * cb.ry;
      var edgeLit = litNodes[ed[0]] && litNodes[ed[1]];
      ctx.save();
      if(edgeLit){
        ctx.strokeStyle = allLit ? "#fef08a" : sky.glow;
        ctx.lineWidth = allLit ? (5.5 + Math.sin(tAcc * 5) * 1.4) : 4.2;
        ctx.shadowColor = sky.glow; ctx.shadowBlur = allLit ? 22 : 12;
        ctx.setLineDash([]);
      } else {
        ctx.strokeStyle = "rgba(255,248,220,0.28)";
        ctx.lineWidth = 2.5;
        ctx.setLineDash([7, 8]);
      }
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.restore();
    });
    /* Draw constellation anchor sockets & snapped glowing Pixar stars */
    sky.pts.forEach(function(pt, ni){
      var nx = cb.cx + pt[0] * cb.rx, ny = cb.cy + pt[1] * cb.ry;
      if(litNodes[ni]){
        var sImg = IMG.star_gold;
        var sSz = (allLit ? 44 : 38) + Math.sin(tAcc * 4.5 + ni) * 3.5;
        var g = ctx.createRadialGradient(nx, ny, 2, nx, ny, sSz * 0.95);
        g.addColorStop(0, "rgba(255,250,190,0.85)"); g.addColorStop(1, "rgba(255,220,90,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(nx, ny, sSz * 0.95, 0, Math.PI * 2); ctx.fill();
        if(sImg && sImg.complete && sImg.naturalWidth){
          ctx.drawImage(sImg, nx - sSz * 0.5, ny - sSz * 0.5, sSz, sSz);
        }
      } else {
        ctx.fillStyle = "rgba(255,250,220,0.32)";
        ctx.beginPath(); ctx.arc(nx, ny, 5.5, 0, Math.PI * 2); ctx.fill();
      }
    });
    if(allLit){
      ctx.save();
      ctx.font = '800 ' + Math.round(isPortrait() ? 24 : 32) + 'px "Fredoka",sans-serif';
      ctx.textAlign = "center"; ctx.fillStyle = "#fef08a";
      ctx.shadowColor = sky.glow; ctx.shadowBlur = 18;
      ctx.fillText(sky.emo + " " + sky.name + "!", cb.cx, cb.cy + cb.ry + 32);
      ctx.restore();
    }
    ctx.restore();

    /* 3. Drifting Puffy Moonlit Clouds hiding giggling secret stars! */
    for(var ci = 0; ci < clouds.length; ci++){
      var cl = clouds[ci];
      if(cl.popped){
        cl.respawnT -= dt;
        if(cl.respawnT <= 0 && phase === "catch"){
          cl.popped = false; cl.x = cl.vx > 0 ? -cl.w : W + cl.w;
        }
        continue;
      }
      cl.x += cl.vx * dt;
      if(cl.x > W + cl.w) cl.x = -cl.w;
      if(cl.x < -cl.w) cl.x = W + cl.w;
      /* Little peeking star ear behind the cloud to tempt curious taps! */
      var peekY = cl.y - cl.h * 0.30 + Math.sin(tAcc * 3.2 + cl.peekPh) * 5;
      if(IMG.star_rainbow.complete && IMG.star_rainbow.naturalWidth){
        ctx.drawImage(IMG.star_rainbow, cl.x - 18, peekY - 18, 36, 36);
      }
      if(IMG.cloud.complete && IMG.cloud.naturalWidth){
        ctx.drawImage(IMG.cloud, cl.x - cl.w * 0.5, cl.y - cl.h * 0.5, cl.w, cl.h);
      }
    }

    /* 4. Flying Catchable 3D Pixar Twinkle Stars! */
    if(phase === "catch"){
      spawnAccum += dt;
      if(spawnAccum > 0.92 && flyingStars.length < 6){
        spawnAccum = 0;
        spawnFlyingStar();
      }
    }
    for(var si = flyingStars.length - 1; si >= 0; si--){
      var st = flyingStars[si];
      st.x += st.vx * dt;
      st.y += st.vy * dt + Math.sin(tAcc * 2.6 + st.ph) * 28 * dt;
      st.rot += st.vr * dt;
      if(st.wrongShake > 0) st.wrongShake = Math.max(0, st.wrongShake - dt * 3);

      /* Keep gently inside upper catchable sky */
      var minY = isPortrait() ? 138 : 108;
      var maxY = jr.cy - jr.h * 0.55;
      if(st.y < minY){ st.y = minY; st.vy = Math.abs(st.vy) * 0.6; }
      if(st.y > maxY){ st.y = maxY; st.vy = -Math.abs(st.vy) * 0.6; }
      if((st.vx > 0 && st.x > W + 85) || (st.vx < 0 && st.x < -85)){
        flyingStars.splice(si, 1);
        continue;
      }

      /* Shimmering comet tail */
      st.trail.push({ x: st.x, y: st.y });
      if(st.trail.length > 10) st.trail.shift();
      for(var k = 0; k < st.trail.length - 1; k++){
        var frac = (k + 1) / st.trail.length;
        ctx.fillStyle = "rgba(255,244,180," + (frac * 0.42).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(st.trail[k].x, st.trail[k].y, st.sz * 0.14 * frac, 0, Math.PI * 2); ctx.fill();
      }

      /* Glowing halo (extra bright ring if target color in Color Match mode!) */
      var isWantedCol = mode === "colors" && (st.colorKey === COLOR_DEFS[targetColorIdx].key || st.colorKey === "rainbow");
      var gRad = st.sz * (isWantedCol ? 0.92 : 0.72);
      var sg = ctx.createRadialGradient(st.x, st.y, 4, st.x, st.y, gRad);
      sg.addColorStop(0, isWantedCol ? "rgba(255,255,220,0.85)" : "rgba(255,242,160,0.48)");
      sg.addColorStop(1, "rgba(255,220,100,0)");
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(st.x, st.y, gRad, 0, Math.PI * 2); ctx.fill();

      var imgStar = IMG["star_" + st.colorKey] || IMG.star_gold;
      if(imgStar && imgStar.complete && imgStar.naturalWidth){
        ctx.save();
        var shOff = st.wrongShake > 0 ? Math.sin(st.wrongShake * Math.PI * 6) * 8 : 0;
        ctx.translate(st.x + shOff, st.y);
        ctx.rotate(Math.sin(tAcc * 2.5 + st.ph) * 0.16);
        var pulse = 1 + Math.sin(tAcc * 4.5 + st.ph) * (isWantedCol ? 0.08 : 0.04);
        ctx.scale(pulse, pulse);
        ctx.drawImage(imgStar, -st.sz * 0.5, -st.sz * 0.5, st.sz, st.sz);
        ctx.restore();
      }
    }

    /* 5. Stars Arcing Smoothly Into the Glass Star Lantern Mouth! */
    for(var ii = intoJarStars.length - 1; ii >= 0; ii--){
      var isObj = intoJarStars[ii];
      isObj.t = Math.min(1, isObj.t + dt * 2.3);
      var u = isObj.t, e = 1 - Math.pow(1 - u, 2.2);
      var mx = (isObj.x0 + isObj.x1) * 0.5, my = Math.min(isObj.y0, isObj.y1) - 85;
      var bx = (1 - e) * (1 - e) * isObj.x0 + 2 * (1 - e) * e * mx + e * e * isObj.x1;
      var by = (1 - e) * (1 - e) * isObj.y0 + 2 * (1 - e) * e * my + e * e * isObj.y1;
      var imI = IMG["star_" + isObj.colorKey] || IMG.star_gold;
      var curSz = isObj.sz * (1 - u * 0.35);
      if(imI && imI.complete && imI.naturalWidth){
        ctx.save(); ctx.translate(bx, by); ctx.rotate(u * 5.0);
        ctx.drawImage(imI, -curSz * 0.5, -curSz * 0.5, curSz, curSz);
        ctx.restore();
      }
      if(u >= 1){
        /* Land inside glass jar with buoyant magical zero-G star-jar bobbing & rattling! */
        var jIdx = jarStars.length;
        var row = Math.floor(jIdx / 3), col = jIdx % 3;
        jarStars.push({
          lx: (col - 1) * jr.w * 0.20 + (Math.random() - 0.5) * 12,
          ly: jr.h * (0.18 - row * 0.16),
          homeY: jr.h * (0.18 - row * 0.16),
          vx: (Math.random() - 0.5) * 75,
          vy: 50,
          rot: (Math.random() - 0.5) * 0.6, vr: (Math.random() - 0.5) * 3,
          ph: jIdx * 1.3,
          sz: jr.w * (goalCount > 6 ? 0.30 : 0.38),
          colorKey: isObj.colorKey
        });
        jarShakeAmt = 0.35; jarWobbleVel = 5;
        sfxJarClink(0);
        intoJarStars.splice(ii, 1);
      }
    }

    /* 6. Grounded Pixar Animal Buddy Cheering on the Left Starlight Hill! */
    if(buddyHopT > 0) buddyHopT = Math.max(0, buddyHopT - dt * 2.0);
    if(buddyFlipT > 0) buddyFlipT = Math.max(0, buddyFlipT - dt * 1.15);
    var bImg = IMG[sky.buddyKey];
    if(bImg && bImg.complete && bImg.naturalWidth){
      var hopY = (buddyHopT > 0 ? Math.sin(buddyHopT * Math.PI) * 32 : Math.sin(tAcc * 2.2) * 4);
      var flipA = buddyFlipT > 0 ? Math.sin(buddyFlipT * Math.PI * 2) * 0.32 : Math.sin(tAcc * 1.8) * 0.03;
      /* Soft contact shadow */
      ctx.fillStyle = "rgba(8,12,32,0.42)";
      ctx.beginPath(); ctx.ellipse(bp.x, bp.y + bp.h * 0.44, bp.w * 0.38, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.save();
      ctx.translate(bp.x, bp.y - hopY);
      ctx.rotate(flipA);
      ctx.drawImage(bImg, -bp.w * 0.5, -bp.h * 0.5, bp.w, bp.h);
      ctx.restore();
    }

    /* 7. 3D GLASS STAR WISHING LANTERN JAR (Back Glass -> Bouncing 3D Stars -> Front Specular Glass -> Cork!) */
    if(jarShakeAmt > 0){
      jarShakeAmt = Math.max(0, jarShakeAmt - dt * 2.4);
      jarWobbleVel -= jarTilt * 160 * dt;
      jarWobbleVel *= 0.86;
      jarTilt += jarWobbleVel * dt;
    } else if(!shakingJarDrag){
      jarTilt *= 0.85;
    }
    var fillFrac = Math.min(1, (jarStars.length + intoJarStars.length) / Math.max(1, goalCount));

    /* Warm radial lantern glow illuminating the clouds & meadow around the jar! */
    var glowR = jr.h * (0.65 + fillFrac * 0.55 + (phase === "shake" ? Math.sin(tAcc * 7) * 0.12 : 0));
    var jg = ctx.createRadialGradient(jr.cx, jr.cy, 10, jr.cx, jr.cy, glowR);
    jg.addColorStop(0, "rgba(255,240,145," + (0.22 + fillFrac * 0.46).toFixed(2) + ")");
    jg.addColorStop(0.55, "rgba(251,191,36," + (0.10 + fillFrac * 0.22).toFixed(2) + ")");
    jg.addColorStop(1, "rgba(251,191,36,0)");
    ctx.fillStyle = jg; ctx.beginPath(); ctx.arc(jr.cx, jr.cy, glowR, 0, Math.PI * 2); ctx.fill();

    /* Grounded shadow beneath glass jar */
    ctx.fillStyle = "rgba(8,10,28,0.48)";
    ctx.beginPath(); ctx.ellipse(jr.cx, jr.cy + jr.h * 0.48, jr.w * 0.44, 13, 0, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.translate(jr.cx, jr.cy);
    ctx.rotate(jarTilt);

    /* Back translucent glass layer */
    if(IMG.jar_back.complete && IMG.jar_back.naturalWidth){
      ctx.drawImage(IMG.jar_back, -jr.w * 0.5, -jr.h * 0.5, jr.w, jr.h);
    }

    /* Buoyant glowing 3D stars floating & rattling visibly inside the glass jar! */
    var boundX = jr.w * 0.27, minIY = -jr.h * 0.24, maxIY = jr.h * 0.28;
    for(var ji = 0; ji < jarStars.length; ji++){
      var js = jarStars[ji];
      var targetY = (js.homeY !== undefined ? js.homeY : jr.h * 0.12) + Math.sin(tAcc * 3.1 + (js.ph || ji)) * 6;
      js.vy += (targetY - js.ly) * 14 * dt;
      js.vy *= 0.90; js.vx *= 0.93; js.vr *= 0.92;
      js.lx += js.vx * dt;
      js.ly += js.vy * dt;
      js.rot += js.vr * dt;
      if(js.ly > maxIY){ js.ly = maxIY; js.vy *= -0.55; }
      if(js.ly < minIY){ js.ly = minIY; js.vy = Math.abs(js.vy) * 0.5; }
      if(js.lx < -boundX){ js.lx = -boundX; js.vx = Math.abs(js.vx) * 0.6; }
      if(js.lx >  boundX){ js.lx =  boundX; js.vx = -Math.abs(js.vx) * 0.6; }
      var imJ = IMG["star_" + js.colorKey] || IMG.star_gold;
      if(imJ && imJ.complete && imJ.naturalWidth){
        ctx.save(); ctx.translate(js.lx, js.ly); ctx.rotate(js.rot * 0.45);
        ctx.drawImage(imJ, -js.sz * 0.5, -js.sz * 0.5, js.sz, js.sz);
        ctx.restore();
      }
    }

    /* Front curved glass specular reflection & antique brass collar */
    if(IMG.jar_front.complete && IMG.jar_front.naturalWidth){
      ctx.drawImage(IMG.jar_front, -jr.w * 0.5, -jr.h * 0.5, jr.w, jr.h);
    }

    /* Natural cork stopper (bobs excitedly in shake stage, pops off in launch stage!) */
    if(!corkPopped && IMG.jar_cork.complete && IMG.jar_cork.naturalWidth){
      var corkW = jr.w * 0.52, corkH = corkW * (120 / 220);
      var corkBob = phase === "shake" ? Math.abs(Math.sin(tAcc * 9)) * 7 : 0;
      ctx.drawImage(IMG.jar_cork, -corkW * 0.5, -jr.h * 0.56 - corkBob, corkW, corkH);
    }
    ctx.restore();

    /* Flying popped cork animation */
    if(corkPopped && corkState.y < H + 80){
      corkState.vy += 920 * dt;
      corkState.x += corkState.vx * dt;
      corkState.y += corkState.vy * dt;
      corkState.rot += corkState.vr * dt;
      if(IMG.jar_cork.complete && IMG.jar_cork.naturalWidth){
        var cw2 = jr.w * 0.52, ch2 = cw2 * (120 / 220);
        ctx.save(); ctx.translate(corkState.x, corkState.y); ctx.rotate(corkState.rot);
        ctx.drawImage(IMG.jar_cork, -cw2 * 0.5, -ch2 * 0.5, cw2, ch2);
        ctx.restore();
      }
    }

    /* 8. Launching Constellation Stars Rocketing From Jar to Sky! */
    for(var li = 0; li < launchStars.length; li++){
      var ls = launchStars[li];
      if(ls.done) continue;
      if(ls.delay > 0){ ls.delay -= dt; continue; }
      ls.t = Math.min(1, ls.t + dt * 1.9);
      var lu = ls.t, le = 1 - Math.pow(1 - lu, 2.5);
      var lx = ls.x0 + (ls.x1 - ls.x0) * le + Math.sin(lu * Math.PI) * ((li % 2 ? 1 : -1) * 45);
      var ly = ls.y0 + (ls.y1 - ls.y0) * le;
      var lImg = IMG["star_" + ls.colorKey] || IMG.star_gold;
      if(Math.random() < 0.55) spawnSparkles(lx, ly, "#fde047", 1);
      if(lImg && lImg.complete && lImg.naturalWidth){
        ctx.save(); ctx.translate(lx, ly); ctx.rotate(lu * 6);
        ctx.drawImage(lImg, -26, -26, 52, 52);
        ctx.restore();
      }
      if(lu >= 1){
        ls.done = true;
        litNodes[ls.idx] = true;
        sfxStarChime(ls.idx);
        spawnSparkles(ls.x1, ls.y1, sky.glow, 14);
      }
    }

    /* 9. Shimmering Golden Magic Star-Net Swipe Trail */
    for(var ni2 = netTrail.length - 1; ni2 >= 0; ni2--){
      netTrail[ni2].life -= dt * 3.8;
      if(netTrail[ni2].life <= 0) netTrail.splice(ni2, 1);
    }
    if(netTrail.length > 1){
      ctx.save();
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      for(var nk = 1; nk < netTrail.length; nk++){
        var aN = netTrail[nk].life;
        ctx.strokeStyle = "rgba(254,240,138," + (aN * 0.85).toFixed(2) + ")";
        ctx.lineWidth = 4 + aN * 12;
        ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.moveTo(netTrail[nk - 1].x, netTrail[nk - 1].y);
        ctx.lineTo(netTrail[nk].x, netTrail[nk].y);
        ctx.stroke();
      }
      ctx.restore();
    }

    /* 10. Ambient Fireflies + Soft Sparkle Particles + Popping Numbers */
    for(var ff = 0; ff < fireflies.length; ff++){
      var fl = fireflies[ff];
      var fx = (fl.x + Math.sin(tAcc * fl.spd + fl.ph) * 0.03) * W;
      var fy = (fl.y + Math.cos(tAcc * fl.spd * 0.8 + fl.ph) * 0.025) * H;
      var fa = 0.25 + 0.65 * (Math.sin(tAcc * 2.5 + fl.ph) * 0.5 + 0.5);
      ctx.fillStyle = "rgba(255,244,160," + fa.toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(fx, fy, 3.2, 0, Math.PI * 2); ctx.fill();
    }

    for(var pi = particles.length - 1; pi >= 0; pi--){
      var p = particles[pi];
      p.life -= dt * p.decay;
      if(p.life <= 0){ particles.splice(pi, 1); continue; }
      p.vy += 160 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.col;
      ctx.shadowColor = p.col; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    for(var fi3 = floatTexts.length - 1; fi3 >= 0; fi3--){
      var ft = floatTexts[fi3];
      ft.life -= dt * 1.1;
      if(ft.life <= 0){ floatTexts.splice(fi3, 1); continue; }
      ft.y -= dt * 52;
      ft.scale += (1 - ft.scale) * Math.min(1, dt * 14);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, ft.life * 1.4));
      ctx.translate(ft.x, ft.y); ctx.scale(ft.scale, ft.scale);
      ctx.font = '800 30px "Fredoka",sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineWidth = 6; ctx.strokeStyle = "#121b38"; ctx.strokeText(ft.txt, 0, 0);
      ctx.fillStyle = ft.col; ctx.fillText(ft.txt, 0, 0);
      ctx.restore();
    }
  }

  /* =========================================================================
     8. START!
     ========================================================================= */
  startSky(true);
  requestAnimationFrame(render);

  /* Read-only debug handle for QA */
  window.__TWINKLE_DEBUG__ = function(){
    return {
      phase: phase, mode: mode, sky: SKIES[skyIdx % SKIES.length].key,
      caught: caughtCount, goal: goalCount, shakes: shakeCount,
      flying: flyingStars.length, inJar: jarStars.length,
      litCount: litNodes.filter(Boolean).length, stars: totalStars,
      wizardUnlocked: wizardUnlocked
    };
  };
  /* Preserve compatibility hook name too */
  window.__twinkleGame = { snapshot: window.__TWINKLE_DEBUG__ };
})();
</script>
