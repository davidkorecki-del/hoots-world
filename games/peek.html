<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="peek";window.__HOOT_SELF_COACH__=true;</script>
<script src="js/hoot-game-head.js?v=llprev3e132"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Peekaboo Forest</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#17324f;
    --cream:#fffdf7;
    --sun:#ffc93c;
    --leaf:#3cc858;
    --coral:#ff5d52;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#5dc1f5;
    touch-action:none;
    user-select:none; -webkit-user-select:none;
  }

  #stage{
    position:fixed; inset:0; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
    background:linear-gradient(180deg, #53bcf5 0%, #a5e4ff 36%, #d9f8de 62%, #59cc62 100%);
    transition:background .55s ease;
  }
  #stage.night-mode{
    background:linear-gradient(180deg, #102042 0%, #1d3566 42%, #1d4a3a 68%, #15382c 100%);
  }

  /* ================= STORYBOOK FOREST SCENERY (DAY + STARLIT NIGHT!) ================= */
  #scenery{ position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  #forestHillsSvg{
    position:absolute; left:0; right:0; bottom:18%;
    width:100%; height:56%; display:block;
    transition:filter .55s ease;
  }
  #stage.night-mode #forestHillsSvg{ filter:brightness(.55) saturate(1.1); }
  #stage.night-mode #forestTreeL, #stage.night-mode #forestTreeR{ filter:brightness(.58) drop-shadow(0 8px 14px rgba(0,0,0,.4)); }

  #forestTreeL{
    position:absolute; left:-22px; bottom:28%;
    width:clamp(118px, 20vw, 204px);
    filter:drop-shadow(0 8px 14px rgba(23,50,79,.16));
    transition:filter .55s ease;
  }
  #forestTreeR{
    position:absolute; right:-22px; bottom:28%;
    width:clamp(124px, 21vw, 212px);
    filter:drop-shadow(0 8px 14px rgba(23,50,79,.16));
    transition:filter .55s ease;
  }

  .decor{ position:absolute; border:none; background:none; padding:0; cursor:pointer; pointer-events:auto; }
  #sunBtn{ top:74px; right:16px; width:82px; height:82px; z-index:2; transition:opacity .4s, transform .4s; }
  #sunBtn svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 16px rgba(255,183,3,.5)); }
  #sunBtn .rays{ transform-box:fill-box; transform-origin:center; animation:sunSpin 44s linear infinite; }
  #sunBtn.zing .rays{ animation:sunSpin .9s cubic-bezier(.34,1.5,.5,1) 1; }
  @keyframes sunSpin{ to{ transform:rotate(360deg); } }
  #stage.night-mode #sunBtn{ opacity:0; transform:scale(.5) translateY(-20px); pointer-events:none; }

  /* Smiling Moon & Twinkling Night Stars (visible in Night Flashlight mode!) */
  #moonBtn{
    top:74px; right:18px; width:80px; height:80px; z-index:2;
    opacity:0; transform:scale(.5) translateY(-20px); pointer-events:none;
    transition:opacity .45s, transform .45s;
  }
  #stage.night-mode #moonBtn{ opacity:1; transform:scale(1) translateY(0); pointer-events:auto; }
  #moonBtn svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 0 18px rgba(255,236,130,.75)); }

  #nightStars{
    position:absolute; inset:0 0 46% 0; opacity:0; transition:opacity .55s; pointer-events:none;
  }
  #stage.night-mode #nightStars{ opacity:1; }
  .nstar{
    position:absolute; width:8px; height:8px; border-radius:50%; background:#fff8c5;
    box-shadow:0 0 10px 3px rgba(255,244,160,.8);
    animation:twinkle 2.2s ease-in-out infinite alternate;
  }
  @keyframes twinkle{ from{ opacity:.35; transform:scale(.7); } to{ opacity:1; transform:scale(1.25); } }

  .cloud{ z-index:1; width:124px; height:56px; opacity:.95; animation:cloudDrift linear infinite; transition:opacity .4s; }
  #stage.night-mode .cloud{ opacity:.22; }
  .cloud svg{ width:100%; height:100%; display:block; transition:transform .25s cubic-bezier(.34,1.8,.5,1); }
  .cloud.puff svg{ transform:scale(1.24, 1.34); }
  @keyframes cloudDrift{ from{ transform:translateX(-150px); } to{ transform:translateX(112vw); } }

  .firefly{
    position:absolute; z-index:3; width:34px; height:34px; border:none; background:none; padding:0;
    cursor:pointer; pointer-events:auto; animation:ffFloat 5.5s ease-in-out infinite alternate;
  }
  .firefly i{
    display:block; width:12px; height:12px; margin:11px auto; border-radius:50%;
    background:#fff49c; box-shadow:0 0 14px 5px rgba(255,235,110,.9);
    animation:ffGlow 1.4s ease-in-out infinite alternate;
  }
  @keyframes ffGlow{ from{ opacity:.5; transform:scale(.8); } to{ opacity:1; transform:scale(1.25); } }
  @keyframes ffFloat{ 0%{ transform:translate(0,0); } 50%{ transform:translate(20px,-18px); } 100%{ transform:translate(-12px,-4px); } }

  /* Warm Flashlight Spotlight Overlay in Night Mode! */
  #flashBeam{
    position:fixed; inset:0; z-index:11; pointer-events:none; opacity:0;
    transition:opacity .35s ease;
    background:radial-gradient(circle 140px at var(--fx, 50%) var(--fy, 68%), rgba(255,248,195,.22) 0%, rgba(16,32,66,.2) 55%, rgba(10,20,44,.62) 100%);
  }
  #stage.night-mode #flashBeam{ opacity:1; }

  /* ================= CLEAN PICTURE-ONLY TOP BAR (ALL >=64PX) ================= */
  #hud{
    position:relative; z-index:15;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:max(8px, env(safe-area-inset-top)) 12px 0;
    pointer-events:none;
  }
  .hud-group{ display:flex; align-items:center; gap:8px; pointer-events:auto; }
  .mode-pill{
    min-width:68px; height:66px; padding:0 12px; border-radius:22px;
    border:4px solid #fff; background:rgba(255,253,247,.95);
    box-shadow:0 5px 0 rgba(23,50,79,.22), 0 8px 18px rgba(23,50,79,.14);
    display:flex; align-items:center; justify-content:center; gap:4px;
    font-size:26px; cursor:pointer;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1), background .15s, box-shadow .15s;
  }
  .mode-pill:active{ transform:translateY(3px) scale(.95); }
  .mode-pill.on{
    background:linear-gradient(180deg, #ffe885 0%, #ffc93c 100%);
    border-color:#17324f;
    box-shadow:0 5px 0 #17324f, 0 0 22px rgba(255,201,60,.82);
    transform:translateY(-2px) scale(1.04);
  }

  #soundBtn{
    width:66px; height:66px; border-radius:50%;
    border:4px solid #fff; background:rgba(255,253,247,.96);
    box-shadow:0 5px 0 rgba(23,50,79,.22), 0 8px 18px rgba(23,50,79,.14);
    display:grid; place-items:center; cursor:pointer;
  }
  #soundBtn:active{ transform:translateY(3px) scale(.94); }
  #soundBtn svg{ width:30px; height:30px; }

  #starPill{
    height:66px; padding:0 18px 0 14px; border-radius:999px;
    border:4px solid #fff; background:rgba(255,253,247,.96);
    box-shadow:0 5px 0 rgba(23,50,79,.22), 0 8px 18px rgba(23,50,79,.14);
    display:flex; align-items:center; gap:8px;
    font-weight:800; font-size:26px; color:#17324f;
  }
  #starPill svg{ width:30px; height:30px; display:block; }
  #starPill.bump{ animation:starBump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{ 0%{ transform:scale(1); } 45%{ transform:scale(1.22) rotate(-4deg); } 100%{ transform:scale(1); } }

  /* ================= CENTER STAGE: PICTURE CLOUD + SAFARI HOOT ================= */
  #centerStage{
    position:relative; z-index:12; flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding:4px 10px 4px; gap:4px;
  }

  #orderCloud{
    position:relative; z-index:13;
    display:flex; align-items:center; gap:12px;
    background:#fffdf8; border:5px solid #17324f; border-radius:36px;
    padding:8px 14px 8px 18px;
    box-shadow:0 8px 0 #17324f, 0 16px 32px rgba(23,50,79,.22);
    margin-bottom:10px;
    max-width:94vw;
  }
  #orderCloud::after{
    content:""; position:absolute; left:50%; bottom:-16px; transform:translateX(-50%);
    width:20px; height:20px; border-radius:50%;
    background:#fffdf8; border:5px solid #17324f;
    box-shadow:0 4px 0 #17324f;
  }
  #orderCloud.pop-in{ animation:cloudPop .46s cubic-bezier(.34,1.75,.5,1); }
  @keyframes cloudPop{ 0%{ transform:scale(.62) translateY(14px); opacity:0; } 100%{ transform:scale(1) translateY(0); opacity:1; } }

  #cloudInner{ display:flex; align-items:center; gap:10px; }
  .cloud-animal-badge{
    width:60px; height:60px; border-radius:20px;
    background:#fff6d8; border:3.5px solid #f59e0b;
    display:grid; place-items:center; padding:4px;
  }
  .cloud-animal-badge svg{ width:100%; height:100%; display:block; }
  .cloud-q{
    width:56px; height:56px; border-radius:20px;
    background:#eff6ff; border:3.5px dashed #3b82f6;
    display:grid; place-items:center; font-size:28px;
  }
  .cloud-arrow{ font-size:24px; color:#16a34a; font-weight:900; }
  .cloud-stars{ display:flex; align-items:center; gap:4px; font-size:25px; color:#d8e4f0; }
  .cloud-stars span.lit{ color:#ffc93c; text-shadow:0 2px 6px rgba(245,158,11,.55); display:inline-block; animation:slotFed .45s cubic-bezier(.34,1.85,.5,1); }
  @keyframes slotFed{ 0%{ transform:scale(.45) rotate(-14deg); } 60%{ transform:scale(1.26) rotate(6deg); } 100%{ transform:scale(1) rotate(0); } }

  #repeatBtn{
    width:64px; height:64px; border-radius:50%; flex:0 0 auto;
    border:4px solid #17324f; background:linear-gradient(180deg, #ffe47a 0%, #ffb703 100%);
    box-shadow:0 5px 0 #17324f; display:grid; place-items:center; cursor:pointer;
  }
  #repeatBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 #17324f; }
  #repeatBtn svg{ width:30px; height:30px; }

  #hootBtn{
    position:relative; border:none; background:none; padding:0; cursor:pointer;
    width:clamp(118px, 22vh, 172px);
    filter:drop-shadow(0 10px 14px rgba(23,50,79,.24));
    transform-origin:50% 94%;
    animation:hootIdle 3.1s ease-in-out infinite;
    margin-bottom:-6px;
  }
  #hootBtn svg{ width:100%; height:auto; display:block; overflow:visible; }
  @keyframes hootIdle{ 0%,100%{ transform:translateY(0) rotate(-.8deg); } 50%{ transform:translateY(-5px) rotate(.8deg); } }
  #hootBtn .wing-l{ transform-box:fill-box; transform-origin:85% 18%; transition:transform .2s; }
  #hootBtn .wing-r{ transform-box:fill-box; transform-origin:15% 18%; transition:transform .2s; }
  #hootBtn .eyelids{ transform-box:fill-box; transform-origin:center; animation:hootBlink 4.4s infinite; }
  @keyframes hootBlink{ 0%,93%,100%{ transform:scaleY(0); } 96%{ transform:scaleY(1); } }
  #hootBtn.happy-jump{ animation:hootHappy .52s cubic-bezier(.34,1.7,.5,1) 3; }
  @keyframes hootHappy{ 0%,100%{ transform:translateY(0) scale(1); } 40%{ transform:translateY(-22px) scale(.96,1.06) rotate(-3deg); } 75%{ transform:translateY(2px) scale(1.05,.95); } }
  #hootBtn.happy-jump .wing-l{ animation:flapL .22s ease-in-out infinite alternate; }
  #hootBtn.happy-jump .wing-r{ animation:flapR .22s ease-in-out infinite alternate; }
  @keyframes flapL{ from{ transform:rotate(0); } to{ transform:rotate(38deg); } }
  @keyframes flapR{ from{ transform:rotate(0); } to{ transform:rotate(-38deg); } }
  #hootBtn.head-wobble{ animation:headWobble .42s ease-in-out 2; }
  @keyframes headWobble{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-8deg); } 75%{ transform:rotate(8deg); } }
  #hootBtn.talking{ animation:talkPulse .22s ease-in-out infinite alternate; }
  @keyframes talkPulse{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-3px) scale(1.02); } }

  /* ================= FOREST HIDING SPOTS + CHECKERED PICNIC BLANKET ================= */
  #forestDeck{
    position:relative; z-index:12; width:100%;
    padding:14px 12px max(10px, env(safe-area-inset-bottom));
    background:linear-gradient(180deg, #4ec658 0%, #37a544 55%, #2b8a38 100%);
    border-top:6px solid #17324f;
    box-shadow:0 -10px 26px rgba(23,50,79,.22), inset 0 6px 0 rgba(255,255,255,.28);
    transition:background .55s ease;
  }
  #stage.night-mode #forestDeck{
    background:linear-gradient(180deg, #1f5a3e 0%, #164430 60%, #103224 100%);
  }

  #spotsGrid{
    max-width:960px; margin:0 auto;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:clamp(10px, 2.2vw, 20px);
    min-height:132px;
  }

  .spot-btn{
    position:relative;
    width:clamp(102px, 27vw, 134px); height:clamp(102px, 27vw, 134px);
    border-radius:32px;
    border:5px solid #17324f;
    background:radial-gradient(circle at 35% 28%, #ffffff 0%, #fffdf6 66%, #e3f5e6 100%);
    box-shadow:0 8px 0 #17324f, 0 14px 22px rgba(23,50,79,.26), inset 0 -5px 0 #d0ebd5;
    padding:8px; cursor:pointer; touch-action:manipulation;
    display:grid; place-items:center;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1), box-shadow .16s, border-color .16s, background .35s;
  }
  #stage.night-mode .spot-btn{
    background:radial-gradient(circle at 35% 28%, #344d73 0%, #243757 70%, #1a2944 100%);
    border-color:#0b1526;
    box-shadow:0 8px 0 #0b1526, 0 12px 24px rgba(0,0,0,.45);
  }
  .spot-btn svg.spot-art{ width:100%; height:100%; display:block; filter:drop-shadow(0 4px 5px rgba(23,50,79,.16)); pointer-events:none; transition:filter .3s; }
  #stage.night-mode .spot-btn:not(.revealed) svg.spot-art{ filter:brightness(.72) saturate(.85); }
  .spot-btn:active{ transform:translateY(4px) scale(.95); }

  /* Subtle live wiggle clue when target friend is giggling inside! */
  .spot-btn.wiggle-clue{ animation:spotRustle .55s ease-in-out 2; }
  @keyframes spotRustle{
    0%,100%{ transform:rotate(0) scale(1); }
    25%{ transform:rotate(-5deg) scale(1.05); }
    75%{ transform:rotate(5deg) scale(1.05); }
  }
  .spot-btn.shaking{ animation:spotShake .12s ease-in-out 4 alternate; }
  @keyframes spotShake{ from{ transform:translateX(-6px) rotate(-4deg); } to{ transform:translateX(6px) rotate(4deg); } }

  /* Glowing curious eyes peeking out in Night Flashlight mode! */
  .peek-eyes{
    position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    display:none; gap:8px; pointer-events:none; z-index:4;
    animation:eyesBlink 3.2s infinite;
  }
  #stage.night-mode .spot-btn.has-hider:not(.revealed) .peek-eyes{ display:flex; }
  .peek-eyes span{
    width:13px; height:13px; border-radius:50%;
    background:#fff7a8; border:2.5px solid #17324f;
    box-shadow:0 0 12px 3px rgba(255,244,140,.95);
    display:grid; place-items:center;
  }
  .peek-eyes span::after{ content:""; width:5px; height:5px; border-radius:50%; background:#17324f; }
  @keyframes eyesBlink{ 0%,88%,100%{ transform:translate(-50%,-50%) scaleY(1); } 94%{ transform:translate(-50%,-50%) scaleY(.1); } }

  /* Animal springing up out of hiding spot on PEEKABOO! */
  .spot-friend{
    position:absolute; left:50%; top:-24px; transform:translateX(-50%) scale(0) translateY(34px);
    width:86%; height:86%; pointer-events:none; z-index:5;
    filter:drop-shadow(0 10px 14px rgba(23,50,79,.36));
    transition:transform .42s cubic-bezier(.34,1.88,.5,1);
  }
  .spot-btn.revealed{
    background:radial-gradient(circle at 50% 35%, #fff9db 0%, #dcfce7 100%) !important;
    border-color:#16a34a !important;
    box-shadow:0 8px 0 #14532d, 0 0 34px rgba(255,232,120,.95) !important;
    transform:scale(1.08);
  }
  .spot-btn.revealed .spot-friend{ transform:translateX(-50%) scale(1) translateY(0); }

  /* Gentle idle / wrong-tap golden cue */
  .spot-btn.nudge-glow{
    border-color:#ffb703 !important;
    box-shadow:0 8px 0 #17324f, 0 0 0 8px rgba(255,201,60,.72), 0 0 28px rgba(255,183,3,.95) !important;
    animation:spotNudge .65s ease-in-out infinite alternate;
  }
  @keyframes spotNudge{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-8px) scale(1.06); } }
  .nudge-hand{
    position:absolute; right:-10px; bottom:-14px; font-size:36px; line-height:1;
    pointer-events:none; z-index:7; filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));
    animation:handTap .55s ease-in-out infinite alternate;
  }
  @keyframes handTap{ from{ transform:translate(0,0) rotate(-10deg); } to{ transform:translate(-6px,-8px) rotate(4deg); } }

  /* Cozy Checkered Picnic Blanket Strip for Found Forest Friends! */
  #picnicBlanket{
    max-width:520px; margin:12px auto 0;
    padding:7px 14px; border-radius:22px;
    border:4px solid #17324f;
    background:repeating-conic-gradient(#ff6b7a 0% 25%, #fff7f8 0% 50%) 0 0 / 22px 22px;
    box-shadow:0 5px 0 #17324f;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  #picnicBlanket[hidden]{ display:none !important; }
  .bslot{
    width:46px; height:46px; border-radius:50%;
    background:rgba(255,253,247,.72); border:3px dashed rgba(23,50,79,.45);
    display:grid; place-items:center; padding:4px;
  }
  .bslot.filled{
    background:#fffdf7; border:3px solid #17324f;
    box-shadow:0 3px 0 #17324f;
    animation:slotFed .48s cubic-bezier(.34,1.85,.5,1);
  }
  .bslot svg{ width:100%; height:100%; display:block; }

  /* Sparkles, leaves & floating emojis */
  .fx-dot{ position:fixed; z-index:35; pointer-events:none; border-radius:50%; }
  .fx-pop{
    position:fixed; z-index:36; pointer-events:none;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:36px;
    color:#fff; -webkit-text-stroke:2px #17324f;
    text-shadow:0 4px 0 #17324f;
    animation:popFloat .95s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes popFloat{
    0%{ transform:translate(-50%, 0) scale(.4); opacity:0; }
    25%{ transform:translate(-50%, -18px) scale(1.22); opacity:1; }
    100%{ transform:translate(-50%, -68px) scale(1); opacity:0; }
  }

  /* ================= ONE-TAP START PEEKABOO BUSH (ZERO READING!) ================= */
  #startVeil{
    position:fixed; inset:0; z-index:30;
    background:rgba(23,50,79,.24); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  #goPeekBtn{
    width:min(86vw, 304px); min-height:202px;
    border:6px solid #17324f; border-radius:42px;
    background:linear-gradient(180deg, #fffdf7 0%, #dff8e5 100%);
    box-shadow:0 12px 0 #17324f, 0 24px 48px rgba(23,50,79,.38);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    padding:20px; cursor:pointer;
    animation:goPulse 1.25s ease-in-out infinite alternate;
  }
  @keyframes goPulse{ from{ transform:scale(1); } to{ transform:scale(1.05); } }
  #goPeekBtn:active{ transform:translateY(5px) scale(.97); box-shadow:0 7px 0 #17324f; }
  .go-play-pill{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:184px; min-height:72px; padding:10px 28px; border-radius:999px;
    border:5px solid #17324f;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-size:32px; font-weight:800;
    box-shadow:0 6px 0 #14532d; text-shadow:0 2px 0 rgba(0,0,0,.3);
  }

  /* ================= CELEBRATION WIN OVERLAY ================= */
  #winOverlay{
    position:fixed; inset:0; z-index:45;
    background:rgba(23,50,79,.45); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  #winCard{
    width:min(92vw, 440px);
    background:#fffdf8; border:6px solid #17324f; border-radius:36px;
    box-shadow:0 12px 0 #17324f, 0 28px 60px rgba(23,50,79,.4);
    padding:22px 20px 20px; text-align:center;
  }
  #winStars{ font-size:40px; letter-spacing:6px; color:#dbe7f3; line-height:1; }
  #winStars span.lit{ color:#ffc93c; text-shadow:0 0 18px rgba(255,201,60,.95); display:inline-block; animation:slotFed .45s cubic-bezier(.34,1.8,.5,1); }
  #winTitle{ font-size:clamp(26px, 6.5vw, 34px); margin:10px 0 8px; color:#17324f; }
  #winFriends{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:10px 0 18px; }
  .win-mini{ width:56px; height:56px; border-radius:50%; background:#e6faec; border:3px solid #17324f; padding:6px; }
  .win-mini svg{ width:100%; height:100%; display:block; }
  .win-btns{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; }
  #againBtn, .win-btn{
    min-width:190px; min-height:72px; padding:12px 28px; border-radius:999px;
    border:5px solid #17324f;

  /* ================= CONTROLS & LIVING SCENE TAPS ================= */
  function syncModePills(){
    Array.prototype.forEach.call(document.querySelectorAll(".mode-pill"), function(b){
      b.classList.toggle("on", b.getAttribute("data-mode") === mode);
    });
  }
  function beginSession(selectedMode, withHello){
    roundTok++;
    clearTimers();
    foundFriends = [];
    queue = shuffle(FRIENDS).slice(0, GOAL);
    hootBtn.classList.remove("happy-jump");
    winOverlay.hidden = true;
    startVeil.hidden = true;
    mode = selectedMode || mode || "hide";
    syncModePills();
    presentNextRound(withHello);
  }

  $("goPeekBtn").addEventListener("click", function(){
    audio(); sfxPop();
    beginSession("hide", true);
  });
  $("againBtn").addEventListener("click", function(){
    audio(); sfxPop();
    beginSession(mode === "surprise" ? "hide" : mode, false);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".mode-pill"), function(b){
    b.addEventListener("click", function(){
      audio(); sfxPop();
      startVeil.hidden = true;
      winOverlay.hidden = true;
      beginSession(b.getAttribute("data-mode"), false);
    });
  });

  $("repeatBtn").addEventListener("click", function(){
    audio();
    if(state === "playing") speakPrompt(false);
  });
  hootBtn.addEventListener("click", function(){
    audio();
    var r = hootBtn.getBoundingClientRect();
    popBadge(r.left + r.width / 2, r.top + 20, "🎵");
    hootBtn.classList.remove("happy-jump"); void hootBtn.offsetWidth; hootBtn.classList.add("happy-jump");
    setTimeout(function(){ hootBtn.classList.remove("happy-jump"); }, 900);
    sayClips(["hoot-giggle.mp3"], true);
    if(state === "playing" && mode !== "surprise"){
      setTimeout(function(){ if(state === "playing" && !vPlaying) speakPrompt(false); }, 1150);
    }
  });

  $("soundBtn").addEventListener("click", function(){
    soundOn = !soundOn;
    $("sndOnSvg").style.display = soundOn ? "block" : "none";
    $("sndOffSvg").style.display = soundOn ? "none" : "block";
    if(!soundOn) clearVoice();
    else { audio(); sfxPop(); }
  });
  $("sunBtn").addEventListener("click", function(){
    audio(); $("sunBtn").classList.remove("zing"); void $("sunBtn").offsetWidth; $("sunBtn").classList.add("zing"); sfxStar();
  });
  $("moonBtn").addEventListener("click", function(){
    audio(); sfxStar();
    var r = $("moonBtn").getBoundingClientRect();
    burstLeaves(r.left + 40, r.top + 40, "#ffe680", 10);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".firefly"), function(ff){
    ff.addEventListener("click", function(){
      audio(); sfxPop();
      var r = ff.getBoundingClientRect();
      burstLeaves(r.left + 17, r.top + 17, "#fff49c", 8);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".cloud"), function(cl){
    cl.addEventListener("click", function(){
      audio(); sfxPop();
      cl.classList.remove("puff"); void cl.offsetWidth; cl.classList.add("puff");
      setTimeout(function(){ cl.classList.remove("puff"); }, 400);
    });
  });

  window.addEventListener("pagehide", function(){ dead = true; clearTimers(); clearVoice(); });
  document.addEventListener("visibilitychange", function(){ if(document.hidden) clearVoice(); });

  /* Pre-populate lush forest clearing behind the Start Peekaboo Bush! */
  targetFriend = FRIENDS[1]; /* Bunny */
  buildSpots(SPOTS.slice(0, 3), { bush: FRIENDS[1] });
  renderCloud(false);
  renderBlanket();

  window.__peekGame = {
    snapshot: function(){
      return {
        state: state, mode: mode, stars: stars,
        target: targetFriend ? targetFriend.id : null,
        foundCount: foundFriends.length, goal: GOAL,
        nightMode: stage.classList.contains("night-mode"),
        winShown: !winOverlay.hidden, voicePlaying: vPlaying
      };
    }
  };
})();
</script>
