<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="peek";window.__HOOT_SELF_COACH__=true;</script>
<script src="js/hoot-game-head.js?v=llprev3e157"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Peekaboo Forest</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#17324f;
    --cream:#fffdf7;
    --sun:#ffc93c;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#3c9e47;
    touch-action:none;
    user-select:none; -webkit-user-select:none;
  }

  /* ================= FULL-SCREEN IMMERSIVE PIXAR ENCHANTED FOREST ================= */
  #world{
    position:fixed; inset:0; height:100dvh; overflow:hidden;
    background:linear-gradient(180deg, #56c0f7 0%, #9ce2ff 24%, #b9f1c9 37%, #6dd165 40%, #48b44c 66%, #31943c 100%);
    transition:background .55s ease;
  }
  #world.night-mode{
    background:linear-gradient(180deg, #0b1633 0%, #162954 26%, #14363b 39%, #134232 45%, #0e3226 70%, #09231b 100%);
  }

  .pixar-backdrop{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    background-image:url("assets/worlds3d/bg_peek.jpg"), linear-gradient(180deg, #56c0f7 0%, #9ce2ff 24%, #b9f1c9 37%, #6dd165 40%, #48b44c 66%, #31943c 100%);
    transition:filter .55s ease;
  }
  .pixar-backdrop::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 54%, rgba(255,253,240,.04) 28%, rgba(16,42,24,.24) 100%);
  }
  #world.night-mode .pixar-backdrop{
    filter:brightness(.36) saturate(1.15) hue-rotate(8deg);
  }

  #nightStars{
    position:absolute; inset:0 0 60% 0; z-index:2; pointer-events:none; opacity:0; transition:opacity .55s;
  }
  #world.night-mode #nightStars{ opacity:1; }
  .nstar{
    position:absolute; width:8px; height:8px; border-radius:50%; background:#fff8c5;
    box-shadow:0 0 12px 3px rgba(255,244,160,.85);
    animation:twinkle 2s ease-in-out infinite alternate;
  }
  @keyframes twinkle{ from{ opacity:.3; transform:scale(.7); } to{ opacity:1; transform:scale(1.3); } }

  /* 64x64 Toddler-Tappable Glowing Fireflies */
  .firefly{
    position:absolute; z-index:9; width:64px; height:64px; min-width:64px; min-height:64px;
    border:none; background:none; padding:0;
    display:grid; place-items:center;
    cursor:pointer; animation:ffFloat 5.5s ease-in-out infinite alternate;
  }
  .firefly i{
    display:block; width:14px; height:14px; border-radius:50%;
    background:#fff49c; box-shadow:0 0 16px 6px rgba(255,235,110,.95);
    animation:ffGlow 1.3s ease-in-out infinite alternate;
  }
  @keyframes ffGlow{ from{ opacity:.45; transform:scale(.75); } to{ opacity:1; transform:scale(1.3); } }
  @keyframes ffFloat{ 0%{ transform:translate(0,0); } 50%{ transform:translate(22px,-20px); } 100%{ transform:translate(-14px,-4px); } }

  /* ================= CLEAN FLOATING TOP BAR (ALL >=64PX) ================= */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:22;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
    pointer-events:none;
  }
  .hud-group{ display:flex; align-items:center; gap:8px; pointer-events:auto; }
  .mode-pill{
    min-width:66px; min-height:64px; height:64px; padding:0 12px; border-radius:22px;
    border:4px solid #fff; background:rgba(255,253,247,.96);
    box-shadow:0 5px 0 rgba(23,50,79,.26), 0 8px 18px rgba(23,50,79,.18);
    display:flex; align-items:center; justify-content:center; gap:4px;
    font-size:25px; cursor:pointer;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1), background .15s;
  }
  .mode-pill:active{ transform:translateY(3px) scale(.95); }
  .mode-pill.on{
    background:linear-gradient(180deg, #ffe885 0%, #ffc93c 100%);
    border-color:#17324f;
    box-shadow:0 5px 0 #17324f, 0 0 22px rgba(255,201,60,.85);
    transform:translateY(-2px) scale(1.04);
  }
  #soundBtn{
    min-width:64px; min-height:64px; width:64px; height:64px; border-radius:50%;
    border:4px solid #fff; background:rgba(255,253,247,.96);
    box-shadow:0 5px 0 rgba(23,50,79,.26); display:grid; place-items:center; cursor:pointer;
  }
  #soundBtn:active{ transform:translateY(3px) scale(.94); }
  #soundBtn svg{ width:28px; height:28px; }
  #starPill{
    min-height:64px; height:64px; padding:0 16px 0 12px; border-radius:999px;
    border:4px solid #fff; background:rgba(255,253,247,.96);
    box-shadow:0 5px 0 rgba(23,50,79,.26);
    display:flex; align-items:center; gap:7px;
    font-weight:800; font-size:25px; color:#17324f;
  }
  #starPill svg{ width:28px; height:28px; display:block; }
  #starPill.bump{ animation:starBump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{ 0%{ transform:scale(1); } 45%{ transform:scale(1.22) rotate(-4deg); } 100%{ transform:scale(1); } }

  /* ================= TREE-BRANCH PERCHED HOOT (LEFT CANOPY) ================= */
  #branchPerch{
    position:fixed; left:-8px; top:max(76px, calc(env(safe-area-inset-top) + 70px)); z-index:18;
    display:flex; align-items:flex-start; gap:8px; pointer-events:none;
  }
  #branchSvg{
    position:absolute; left:0; top:68px; width:168px; height:44px; pointer-events:none;
    filter:drop-shadow(0 5px 6px rgba(23,50,79,.32));
  }
  #hootBtn{
    position:relative; z-index:2; margin-left:18px;
    min-width:64px; min-height:64px;
    border:none; background:none; padding:0; cursor:pointer; pointer-events:auto;
    width:98px; height:102px;
    filter:drop-shadow(0 8px 14px rgba(23,50,79,.36));
    transform-origin:50% 90%;
    animation:owlBob 3.2s ease-in-out infinite;
  }
  #hootBtn svg{ width:100%; height:100%; display:block; overflow:visible; }
  @keyframes owlBob{ 0%,100%{ transform:translateY(0) rotate(-1deg); } 50%{ transform:translateY(-4px) rotate(1deg); } }
  #hootBtn.talking{ animation:talkBob .2s ease-in-out infinite alternate; }
  @keyframes talkBob{ from{ transform:scale(1); } to{ transform:scale(1.04) translateY(-3px); } }
  #hootBtn.happy-jump{ animation:hootCheer .45s cubic-bezier(.34,1.7,.5,1) 3; }
  @keyframes hootCheer{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-16px) rotate(-4deg); } }

  /* Compact Picture-Only Finder Bubble Next to Hoot's Branch */
  #finderBubble{
    position:relative; z-index:2; margin-top:10px; pointer-events:auto;
    display:flex; align-items:center; gap:8px;
    background:rgba(255,253,248,.97); border:4.5px solid #17324f; border-radius:28px;
    padding:6px 10px;
    box-shadow:0 7px 0 #17324f, 0 12px 24px rgba(23,50,79,.28);
  }
  #finderBubble::before{
    content:""; position:absolute; left:-11px; top:26px;
    width:16px; height:16px; border-radius:50%;
    background:#fffdf8; border:4px solid #17324f;
  }
  #finderBubble.pop-in{ animation:bubPop .42s cubic-bezier(.34,1.8,.5,1); }
  @keyframes bubPop{ 0%{ transform:scale(.6); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  #wantedIcon{
    width:58px; height:58px; border-radius:18px;
    background:#fff6d6; border:3px solid #f59e0b;
    display:grid; place-items:center; padding:3px;
  }
  #wantedIcon svg{ width:100%; height:100%; display:block; }
  #repeatBtn{
    min-width:64px; min-height:64px; width:64px; height:64px; border-radius:50%;
    border:4px solid #17324f; background:linear-gradient(180deg, #ffe47a 0%, #ffb703 100%);
    box-shadow:0 4px 0 #17324f; display:grid; place-items:center; cursor:pointer;
  }
  #repeatBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #17324f; }
  #repeatBtn svg{ width:28px; height:28px; }

  /* ================= ORGANIC FULL-SCREEN FOREST PROPS ================= */
  #clearing{
    position:absolute; inset:0; z-index:8;
  }

  .forest-prop{
    position:absolute; border:none; background:none; padding:0;
    min-width:96px; min-height:96px;
    width:clamp(118px, 24vw, 182px); height:clamp(118px, 24vw, 182px);
    cursor:pointer; touch-action:manipulation;
    transform:translate(-50%, -50%);
    transition:transform .2s cubic-bezier(.34,1.6,.5,1);
    overflow:visible;
  }
  .forest-prop:active{ transform:translate(-50%, -50%) scale(.93); }

  /* Ground contact shadow under every organic forest prop */
  .prop-shadow{
    position:absolute; left:10%; right:10%; bottom:2%; height:20%;
    border-radius:50%; background:rgba(15,38,20,.46); pointer-events:none;
    filter:blur(2px);
  }

  /* The hiding animal tucked BEHIND the bush/tent/log */
  .prop-hider{
    position:absolute; left:50%; bottom:16%; width:76%; height:76%;
    transform:translateX(-50%) translateY(22%) scale(.55);
    opacity:0; pointer-events:none; z-index:2;
    filter:drop-shadow(0 8px 14px rgba(23,50,79,.4));
    transition:transform .42s cubic-bezier(.34,1.88,.5,1), opacity .22s;
  }
  .prop-hider svg{ width:100%; height:100%; display:block; }

  /* Sneaky live peek-a-boo tease! */
  .forest-prop.peeking-tease .prop-hider{
    opacity:1;
    animation:sneakyPeek 1.55s ease-in-out 1;
  }
  @keyframes sneakyPeek{
    0%{ transform:translateX(-50%) translateY(22%) scale(.6); }
    35%{ transform:translateX(-50%) translateY(-48%) scale(.88) rotate(-6deg); }
    65%{ transform:translateX(-50%) translateY(-44%) scale(.88) rotate(5deg); }
    100%{ transform:translateX(-50%) translateY(22%) scale(.6); }
  }

  /* When FOUND: animal springs HIGH out front in joyful PEEKABOO! */
  .forest-prop.revealed .prop-hider{
    opacity:1; z-index:6;
    transform:translateX(-50%) translateY(-54%) scale(1.08);
  }
  .forest-prop.revealed .prop-front{
    transform:scale(1.08, .86) translateY(8px);
  }

  /* Front bush / tent / mushroom / log layers with bright halo for crisp contrast against Pixar forest */
  .prop-front{
    position:relative; z-index:4; width:100%; height:100%;
    filter:drop-shadow(0 0 6px rgba(255,253,240,.55)) drop-shadow(0 12px 16px rgba(15,38,20,.42));
    transition:transform .32s cubic-bezier(.34,1.6,.5,1), filter .3s;
    pointer-events:none;
  }
  .prop-front svg{ width:100%; height:100%; display:block; overflow:visible; }

  .forest-prop.rustling .prop-front{ animation:propRustle .45s ease-in-out 2; }
  @keyframes propRustle{
    0%,100%{ transform:rotate(0) scale(1); }
    25%{ transform:rotate(-7deg) scale(1.05, .96); }
    75%{ transform:rotate(7deg) scale(1.05, .96); }
  }

  /* Glowing curious eyes peeking out in Night Flashlight Mode! */
  .night-eyes{
    position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    display:none; gap:10px; z-index:5; pointer-events:none;
    animation:eyeBlink 3.1s infinite;
  }
  #world.night-mode .forest-prop.has-hider:not(.revealed) .night-eyes{ display:flex; }
  .night-eyes span{
    width:15px; height:15px; border-radius:50%;
    background:#fff7a8; border:2.5px solid #17324f;
    box-shadow:0 0 14px 4px rgba(255,244,140,.95);
    display:grid; place-items:center;
  }
  .night-eyes span::after{ content:""; width:5px; height:5px; border-radius:50%; background:#17324f; }
  @keyframes eyeBlink{ 0%,88%,100%{ transform:translate(-50%,-50%) scaleY(1); } 94%{ transform:translate(-50%,-50%) scaleY(.1); } }

  /* Warm Golden Nudge Glow & Bouncing Finger */
  .forest-prop.nudge-glow .prop-front{
    filter:drop-shadow(0 0 16px #ffd23f) drop-shadow(0 0 28px rgba(255,201,60,.98));
    animation:propNudge .68s ease-in-out infinite alternate;
  }
  @keyframes propNudge{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-8px) scale(1.07); } }
  .nudge-hand{
    position:absolute; right:4%; bottom:-6%; font-size:40px; line-height:1;
    z-index:10; pointer-events:none; filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));
    animation:handTap .55s ease-in-out infinite alternate;
  }
  @keyframes handTap{ from{ transform:translate(0,0) rotate(-10deg); } to{ transform:translate(-6px,-10px) rotate(4deg); } }

  /* ================= REAL FOREGROUND PICNIC BLANKET ON THE GRASS! ================= */
  #grassBlanket{
    position:fixed; left:50%; bottom:max(8px, env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:14;
    width:min(92vw, 520px); height:84px;
    border-radius:36px 36px 22px 22px;
    border:5px solid #17324f;
    background:repeating-conic-gradient(#ff6374 0% 25%, #fff8f8 0% 50%) 0 0 / 26px 26px;
    box-shadow:0 8px 0 #17324f, 0 14px 26px rgba(23,50,79,.36);
    display:flex; align-items:flex-end; justify-content:space-evenly;
    padding:0 14px 6px;
    transition:filter .5s ease;
  }
  #grassBlanket[hidden]{ display:none !important; }
  #world.night-mode #grassBlanket{ filter:brightness(.82); }
  .blanket-guest{
    width:72px; height:72px; margin-bottom:4px;
    border-radius:50%;
    background:rgba(255,253,247,.62); border:3px dashed rgba(23,50,79,.42);
    display:grid; place-items:center;
    transition:transform .35s cubic-bezier(.34,1.85,.5,1);
  }
  .blanket-guest.seated{
    background:none; border:none;
    width:86px; height:86px; margin-bottom:2px;
    filter:drop-shadow(0 6px 8px rgba(23,50,79,.36));
    animation:guestBounce 2.2s ease-in-out infinite alternate;
  }
  .blanket-guest.seated svg{ width:100%; height:100%; display:block; }
  @keyframes guestBounce{ from{ transform:translateY(0) rotate(-3deg); } to{ transform:translateY(-6px) rotate(3deg); } }

  /* ================= FULL-SCREEN NIGHT FLASHLIGHT CONE OVERLAY ================= */
  #nightVeil{
    position:fixed; inset:0; z-index:15; pointer-events:none; opacity:0;
    transition:opacity .45s ease;
    background:radial-gradient(circle 175px at var(--fx, 50%) var(--fy, 58%),
      rgba(255,248,195,.18) 0%,
      rgba(255,242,170,.06) 44%,
      rgba(8,18,40,.62) 74%,
      rgba(5,12,28,.82) 100%);
  }
  #world.night-mode #nightVeil{ opacity:1; }

  #torchBadge{
    position:fixed; z-index:17; pointer-events:none; opacity:0;
    left:var(--fx, 50%); top:var(--fy, 58%);
    transform:translate(38px, 38px) rotate(-35deg);
    font-size:44px; filter:drop-shadow(0 6px 12px rgba(0,0,0,.5));
    transition:opacity .35s;
  }
  #world.night-mode #torchBadge{ opacity:.95; }

  /* Flying rescued friend + sparkles */
  .fly-friend{ position:fixed; z-index:35; width:96px; height:96px; pointer-events:none; filter:drop-shadow(0 12px 16px rgba(23,50,79,.35)); }
  .fly-friend svg{ width:100%; height:100%; display:block; }
  .fx-dot{ position:fixed; z-index:35; pointer-events:none; border-radius:50%; }
  .fx-pop{
    position:fixed; z-index:36; pointer-events:none;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:38px;
    color:#fff; -webkit-text-stroke:2px #17324f;
    text-shadow:0 4px 0 #17324f;
    animation:popFloat .95s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes popFloat{
    0%{ transform:translate(-50%, 0) scale(.4); opacity:0; }
    25%{ transform:translate(-50%, -20px) scale(1.25); opacity:1; }
    100%{ transform:translate(-50%, -70px) scale(1); opacity:0; }
  }

  /* ================= WIN CELEBRATION OVERLAY ================= */
  #winOverlay{
    position:fixed; inset:0; z-index:45;
    background:rgba(23,50,79,.45); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  #winCard{
    width:min(92vw, 440px);
    background:#fffdf8; border:6px solid #17324f; border-radius:36px;
    box-shadow:0 12px 0 #17324f, 0 28px 60px rgba(23,50,79,.4);
    padding:22px 20px 20px; text-align:center;
  }
  #winStars{ font-size:40px; letter-spacing:6px; color:#dbe7f3; line-height:1; }
  #winStars span.lit{ color:#ffc93c; text-shadow:0 0 18px rgba(255,201,60,.95); display:inline-block; animation:bubPop .45s cubic-bezier(.34,1.8,.5,1); }
  #winTitle{ font-size:clamp(26px, 6.5vw, 34px); margin:10px 0 8px; color:#17324f; }
  #winFriends{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:10px 0 18px; }
  .win-mini{ width:56px; height:56px; border-radius:50%; background:#e6faec; border:3px solid #17324f; padding:6px; }
  .win-mini svg{ width:100%; height:100%; display:block; }
  .win-btns{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; }
  #againBtn, .win-btn{
    min-width:168px; min-height:72px; padding:12px 24px; border-radius:999px;
    border:5px solid #17324f;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:inherit; font-size:26px; font-weight:800; cursor:pointer;
    box-shadow:0 7px 0 #14532d; text-shadow:0 2px 0 rgba(0,0,0,.3);
  }
  #againBtn:active, .win-btn:active{ transform:translateY(4px); box-shadow:0 3px 0 #14532d; }

  @media (max-width:460px){
    #hud{ padding:max(8px, env(safe-area-inset-top)) 6px 0; gap:4px; }
    .hud-group{ gap:4px; }
    .mode-pill{ min-width:64px; height:64px; padding:0 6px; font-size:20px; border-radius:18px; gap:1px; }
    #soundBtn{ width:64px; height:64px; min-width:64px; min-height:64px; }
    #starPill{ height:64px; min-height:64px; padding:0 10px 0 8px; gap:4px; font-size:21px; }
    #starPill svg{ width:23px; height:23px; }
    #branchPerch{ top:max(78px, calc(env(safe-area-inset-top) + 74px)); }
    #hootBtn{ width:80px; height:84px; margin-left:10px; }
    #branchSvg{ top:54px; width:132px; }
    #finderBubble{ padding:5px 8px; gap:6px; margin-top:4px; }
    #wantedIcon{ width:48px; height:48px; }
    .forest-prop{ width:clamp(110px, 31vw, 136px); height:clamp(110px, 31vw, 136px); }
    #grassBlanket{ height:74px; padding:0 8px 4px; }
    .blanket-guest{ width:56px; height:56px; }
    .blanket-guest.seated{ width:68px; height:68px; }
  }
</style>
</head>
<body>
<div id="world">
  <!-- Pixar 3D Enchanted Forest Backdrop (with gradient fallback underneath) -->
  <div id="pixarBg" class="pixar-backdrop" aria-hidden="true"></div>

  <!-- Night Sky Stars & 64px Interactive Glowing Fireflies -->
  <div id="nightStars" aria-hidden="true">
    <span class="nstar" style="left:14%;top:12%;animation-delay:.1s"></span>
    <span class="nstar" style="left:32%;top:18%;animation-delay:.7s"></span>
    <span class="nstar" style="left:48%;top:9%;animation-delay:1.2s"></span>
    <span class="nstar" style="left:65%;top:16%;animation-delay:.4s"></span>
    <span class="nstar" style="left:82%;top:11%;animation-delay:1.0s"></span>
    <span class="nstar" style="left:90%;top:24%;animation-delay:.6s"></span>
  </div>
  <button class="firefly" type="button" style="left:18%;top:29%" aria-label="Tap firefly"><i></i></button>
  <button class="firefly" type="button" style="right:14%;top:28%;animation-delay:-2.2s" aria-label="Tap firefly"><i></i></button>

  <!-- Clean Picture-Only Top Bar -->
  <div id="hud">
    <div class="hud-group" role="group" aria-label="Game modes">
      <button type="button" class="mode-pill on" data-mode="hide" aria-label="Sunny Forest Peekaboo" aria-pressed="true">
        <span aria-hidden="true">🌿</span><span aria-hidden="true">👀</span>
      </button>
      <button type="button" class="mode-pill" data-mode="night" aria-label="Night Flashlight Peekaboo" aria-pressed="false">
        <span aria-hidden="true">🔦</span><span aria-hidden="true">🌙</span>
      </button>
      <button type="button" class="mode-pill" data-mode="surprise" aria-label="Peekaboo Surprise Toybox" aria-pressed="false">
        <span aria-hidden="true">🎉</span><span aria-hidden="true">🐾</span>
      </button>
    </div>
    <div class="hud-group">
      <button type="button" id="soundBtn" aria-label="Sound on or off">
        <svg id="sndOnSvg" viewBox="0 0 24 24" fill="none" stroke="#17324f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="#ffc93c"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.8a9 9 0 0 1 0 12.4"/></svg>

  }
  function playBootClip(clips){
    if(dead || !soundOn || hubMuted() || !clips || !clips.length) return;
    var first = clips[0].indexOf(".mp3") > -1 ? clips[0] : (clips[0] + ".mp3");
    try{
      if(window.parent && window.parent !== window && typeof window.parent.__hwPlayAfterIntro === "function"){
        if(window.parent.__hwPlayAfterIntro(VBASE + first)) return;
      }
    }catch(e){}
    sayClips(clips, true);
  }
  function childKey(){
    try{ return window.parent && window.parent.__llNameKey ? window.parent.__llNameKey() : null; }catch(e){ return null; }
  }
  function speakPrompt(isBoot, withIntro){
    if(mode === "surprise"){
      var surpClip = resolveClip("hoot-peek-surprise", "hoot-ready-go");
      if(isBoot) playBootClip([surpClip]);
      else sayClips([surpClip], true);
      return;
    }
    if(!targetFriend) return;
    var whereClip = "peek-where-" + targetFriend.id + ".mp3";
    if(isBoot){
      var inHub = false;
      try{ inHub = !!(window.parent && window.parent !== window && typeof window.parent.__hwPlayAfterIntro === "function"); }catch(e){}
      if(inHub){
        playBootClip([whereClip]);
      } else {
        var introClip = resolveClip("hoot-peek-intro", null);
        sayClips(introClip ? [introClip, whereClip] : [whereClip], true);
      }
      return;
    }
    if(mode === "night" && hasHootClip("hoot-peek-night")){
      sayClips(["hoot-peek-night.mp3", whereClip], true);
    } else if(withIntro && hasHootClip("hoot-peek-intro")){
      sayClips(["hoot-peek-intro.mp3", whereClip], true);
    } else {
      sayClips([whereClip], true);
    }
  }
  function speakFound(friend, isOdd){
    var ck = "hoot-peek-" + friend.id;
    if(hasHootClip(ck)){ sayClips([ck + ".mp3"], true); return; }
    var k = childKey();
    var cheer = (isOdd && k === "kida") ? "great-job-kida.mp3" : (isOdd && k === "kidb") ? "great-job-kidb.mp3" : "hoot-amazing.mp3";
    sayClips(["word-" + friend.id + ".mp3", cheer], true);
  }

  /* ================= HELPERS & FX ================= */
  function shuffle(a){
    a = a.slice();
    for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function burstLeaves(cx, cy, colorHex, count){
    var cols = [colorHex || "#4ade80", "#ffc93c", "#ffffff", "#ff7aa2"];
    for(var i = 0; i < (count || 14); i++){
      var d = document.createElement("div");
      d.className = "fx-dot";
      var sz = 10 + Math.random() * 10;
      d.style.width = sz + "px"; d.style.height = sz + "px";
      d.style.left = (cx - sz / 2) + "px"; d.style.top = (cy - sz / 2) + "px";
      d.style.background = cols[i % cols.length];
      d.style.border = "2px solid #17324f";
      document.body.appendChild(d);
      var ang = (Math.PI * 2 * i) / (count || 14) + Math.random() * 0.4;
      var dist = 44 + Math.random() * 70;
      if(d.animate){
        d.animate([
          { transform:"translate(0,0) scale(1)", opacity:1 },
          { transform:"translate(" + (Math.cos(ang)*dist).toFixed(1) + "px," + (Math.sin(ang)*dist + 18).toFixed(1) + "px) scale(.2)", opacity:0 }
        ], { duration:560 + Math.random() * 240, easing:"cubic-bezier(.2,.8,.3,1)" });
      }
      (function(el){ setTimeout(function(){ el.remove(); }, 820); })(d);
    }
  }
  function popBadge(cx, cy, text){
    var p = document.createElement("div");
    p.className = "fx-pop"; p.textContent = text;
    p.style.left = cx + "px"; p.style.top = cy + "px";
    document.body.appendChild(p);
    setTimeout(function(){ p.remove(); }, 980);
  }
  function showerConfetti(){
    var w = window.innerWidth, cols = ["#ffc93c","#4ade80","#ff6b7a","#38bdf8","#a855f7"];
    for(var i = 0; i < 28; i++){
      var c = document.createElement("div");
      c.className = "fx-dot"; c.style.width = "13px"; c.style.height = "13px"; c.style.borderRadius = "4px";
      c.style.background = cols[i % cols.length];
      c.style.left = (w * 0.15 + Math.random() * w * 0.7) + "px"; c.style.top = "18%";
      document.body.appendChild(c);
      var dx = (Math.random() - 0.5) * 320, dy = 240 + Math.random() * 340, rot = (Math.random() - 0.5) * 520;
      if(c.animate){
        c.animate([
          { transform:"translate(0,0) rotate(0deg)", opacity:1 },
          { transform:"translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg)", opacity:0 }
        ], { duration:1150 + Math.random() * 650, easing:"cubic-bezier(.2,.7,.3,1)" });
      }
      (function(el){ setTimeout(function(){ el.remove(); }, 1850); })(c);
    }
  }

  /* Smooth eye tracking + physical Night Flashlight spotlight following finger! */
  function moveLight(x, y){
    var r = hootBtn.getBoundingClientRect();
    var dx = Math.max(-5, Math.min(5, (x - (r.left + r.width / 2)) / 36));
    var dy = Math.max(-4, Math.min(5, (y - (r.top + r.height * 0.36)) / 36));
    hootPupils.setAttribute("transform", "translate(" + dx.toFixed(1) + "," + dy.toFixed(1) + ")");
    if(mode === "night"){
      world.style.setProperty("--fx", x + "px");
      world.style.setProperty("--fy", y + "px");
    }
  }
  world.addEventListener("pointermove", function(e){ moveLight(e.clientX, e.clientY); });
  world.addEventListener("pointerdown", function(e){ moveLight(e.clientX, e.clientY); });

  /* ================= LIVE SNEAKY PEEK TEASE + ~9s SPOKEN IDLE NUDGE ================= */
  function clearClues(){
    if(peekInitTimer){ clearTimeout(peekInitTimer); peekInitTimer = null; }
    if(peekTimer){ clearInterval(peekTimer); peekTimer = null; }
    if(idleVisualTimer){ clearTimeout(idleVisualTimer); idleVisualTimer = null; }
    if(idleVoiceTimer){ clearTimeout(idleVoiceTimer); idleVoiceTimer = null; }
    Array.prototype.forEach.call(clearing.querySelectorAll(".forest-prop"), function(b){
      b.classList.remove("nudge-glow", "peeking-tease");
      var h = b.querySelector(".nudge-hand"); if(h) h.remove();
    });
  }
  function addHandTo(el){
    if(!el || el.querySelector(".nudge-hand")) return;
    var h = document.createElement("span");
    h.className = "nudge-hand"; h.setAttribute("aria-hidden", "true"); h.textContent = "👆";
    el.appendChild(h);
  }
  function targetPropBtn(){
    if(!targetFriend) return null;
    var btns = clearing.querySelectorAll(".forest-prop");
    for(var i = 0; i < btns.length; i++){
      var f = propMap[btns[i].getAttribute("data-prop")];
      if(f && f.id === targetFriend.id) return btns[i];
    }
    return null;
  }
  function triggerSneakyPeek(){
    if(state !== "playing" || dead || inputLock) return;
    var tb = targetPropBtn();
    if(!tb) return;
    tb.classList.remove("peeking-tease", "rustling");
    void tb.offsetWidth;
    tb.classList.add("peeking-tease", "rustling");
  }
  function armClues(){
    clearClues();
    if(state !== "playing" || dead || mode === "surprise") return;
    peekInitTimer = setTimeout(triggerSneakyPeek, IS_RILEY ? 1000 : 1200);
    peekTimer = setInterval(triggerSneakyPeek, IS_RILEY ? 2400 : 2900);
    idleVisualTimer = setTimeout(function(){
      if(state !== "playing" || dead || inputLock) return;
      var tb = targetPropBtn();
      if(tb){ tb.classList.add("nudge-glow"); addHandTo(tb); }
    }, IS_RILEY ? 4200 : 5400);
    if(!idleVoiceReminded){
      idleVoiceTimer = setTimeout(function(){
        if(state !== "playing" || dead || inputLock || !targetFriend) return;
        idleVoiceReminded = true;
        if(!vPlaying){
          if(hasHootClip("hoot-peek-idle")){
            sayClips(["hoot-peek-idle.mp3", "peek-where-" + targetFriend.id + ".mp3"], true);
          } else {
            sayClips(["peek-where-" + targetFriend.id + ".mp3"], true);
          }
        }
      }, 9000);
    }
  }

  /* ================= RENDER FINDER BUBBLE & REAL FOREGROUND PICNIC BLANKET ================= */
  function renderFinder(pop){
    if(mode === "surprise"){
      wantedIcon.innerHTML = '<span style="font-size:32px;line-height:1">🎉</span>';
    } else if(targetFriend){
      wantedIcon.innerHTML = targetFriend.svg;
    }
    if(pop){ finderBubble.classList.remove("pop-in"); void finderBubble.offsetWidth; finderBubble.classList.add("pop-in"); }
  }
  function renderBlanket(){
    if(mode === "surprise"){ grassBlanket.hidden = true; return; }
    grassBlanket.hidden = false;
    grassBlanket.innerHTML = "";
    for(var i = 0; i < GOAL; i++){
      var slot = document.createElement("div");
      var f = foundFriends[i];
      slot.className = "blanket-guest" + (f ? " seated" : "");
      if(f) slot.innerHTML = f.svg;
      grassBlanket.appendChild(slot);
    }
  }

  function layoutProps(){
    var portrait = window.innerHeight > window.innerWidth;
    Array.prototype.forEach.call(clearing.querySelectorAll(".forest-prop"), function(btn){
      var pid = btn.getAttribute("data-prop");
      var pr = PROPS.filter(function(p){ return p.id === pid; })[0];
      if(!pr) return;
      btn.style.left = (portrait ? pr.mx : pr.x) + "%";
      btn.style.top = (portrait ? pr.my : pr.y) + "%";
    });
  }
  window.addEventListener("resize", layoutProps);

  function buildClearing(propList, assignments){
    propMap = assignments || {};
    clearing.innerHTML = "";
    propList.forEach(function(pr){
      var hider = propMap[pr.id] || null;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "forest-prop" + (hider ? " has-hider" : "");
      btn.setAttribute("data-prop", pr.id);
      btn.setAttribute("aria-label", pr.name);
      btn.innerHTML =
        '<div class="prop-shadow"></div>' +
        '<div class="prop-hider">' + (hider ? hider.svg : '') + '</div>' +
        '<div class="prop-front">' + pr.svg + '</div>' +
        '<div class="night-eyes" aria-hidden="true"><span></span><span></span></div>';
      btn.addEventListener("click", function(){ onPropTap(btn, pr); });
      clearing.appendChild(btn);
    });
    layoutProps();
  }

  function flyToBlanket(friend, fromRect, seatIdx, cb){
    var seat = grassBlanket.children[seatIdx];
    if(!seat){ if(cb) cb(); return; }
    var fly = document.createElement("div");
    fly.className = "fly-friend"; fly.innerHTML = friend.svg;
    var x0 = fromRect.left + fromRect.width / 2 - 48, y0 = fromRect.top - 10;
    var sr = seat.getBoundingClientRect();
    var x1 = sr.left + sr.width / 2 - 48, y1 = sr.top + sr.height / 2 - 48;
    fly.style.left = x0 + "px"; fly.style.top = y0 + "px";
    document.body.appendChild(fly);
    var done = false;
    function end(){ if(done) return; done = true; fly.remove(); if(cb) cb(); }
    if(fly.animate){
      var a = fly.animate([
        { transform:"translate(0,0) scale(1.05)" },
        { transform:"translate(" + ((x1-x0)*0.5).toFixed(1) + "px," + ((y1-y0)*0.5 - 70).toFixed(1) + "px) scale(1.1) rotate(8deg)", offset:0.5 },
        { transform:"translate(" + (x1-x0).toFixed(1) + "px," + (y1-y0).toFixed(1) + "px) scale(.85)" }
      ], { duration:520, easing:"cubic-bezier(.26,.72,.36,1)" });
      a.onfinish = end; setTimeout(end, 600);
    } else setTimeout(end, 100);
  }

  function awardStar(){
    stars++;
    starCountEl.textContent = String(stars);
    starPill.classList.remove("bump"); void starPill.offsetWidth; starPill.classList.add("bump");
    sfxStar();
    try{ if(window.parent && window.parent.hwAddStar) window.parent.hwAddStar(1); }catch(e){}
  }

  function onPropTap(btn, pr){
    if(state !== "playing" || inputLock || dead) return;
    unlockAudioOnce();
    audio();
    var r = btn.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    moveLight(cx, cy);

    var hider = propMap[pr.id];
    if(mode === "surprise"){
      sfxRustle();
      btn.classList.remove("rustling"); void btn.offsetWidth; btn.classList.add("rustling");
      setTimeout(function(){
        if(dead || !hider) return;
        sfxPeekaboo();
        btn.classList.add("revealed");
        burstLeaves(cx, r.top + 18, hider.color, 14);
        popBadge(cx, r.top, hider.fx);
        var ck = "hoot-peek-" + hider.id;
        sayClips([hasHootClip(ck) ? (ck + ".mp3") : ("word-" + hider.id + ".mp3")], true);
        setTimeout(function(){ if(!dead) btn.classList.remove("revealed"); }, 1650);
      }, 220);
      return;
    }

    clearClues();
    if(!targetFriend) return;

    if(!hider || hider.id !== targetFriend.id){
      inputLock = true;
      sfxRustle();
      btn.classList.remove("rustling"); void btn.offsetWidth; btn.classList.add("rustling");
      setTimeout(function(){
        if(dead) return;
        sfxBoing();
        var critters = ["🦋", "🐞", "🍃", "🌼"];
        popBadge(cx, r.top + 8, critters[Math.floor(Math.random() * critters.length)]);
        sayClips([resolveClip("hoot-peek-empty", "hoot-try-again")], true);
        inputLock = false;
        var tb = targetPropBtn();
        if(tb){ tb.classList.add("nudge-glow"); addHandTo(tb); triggerSneakyPeek(); }
        armClues();
      }, 260);
      return;
    }

    /* FOUND!! Animal springs out behind the real prop, celebrates, then hops onto the picnic blanket! */
    inputLock = true;
    sfxRustle();
    btn.classList.remove("rustling"); void btn.offsetWidth; btn.classList.add("rustling");
    setTimeout(function(){
      if(dead) return;
      sfxPeekaboo();
      btn.classList.add("revealed");
      awardStar();
      burstLeaves(cx, r.top + 14, targetFriend.color, 18);
      popBadge(cx, r.top - 10, targetFriend.fx);
      hootBtn.classList.remove("happy-jump"); void hootBtn.offsetWidth; hootBtn.classList.add("happy-jump");
      var foundNow = targetFriend;
      speakFound(foundNow, (foundFriends.length + 1) % 2 === 1);

      var tok = ++roundTok;
      setTimeout(function(){
        if(dead || tok !== roundTok) return;
        btn.classList.remove("revealed");
        var seatIdx = foundFriends.length;
        flyToBlanket(foundNow, r, seatIdx, function(){
          if(dead || tok !== roundTok) return;
          foundFriends.push(foundNow);
          renderBlanket();
          /* Wait for Hoot's peekaboo cheer to finish cleanly before calling the next friend! */
          afterVoice(function(){
            if(dead || tok !== roundTok) return;
            hootBtn.classList.remove("happy-jump");
            if(foundFriends.length >= GOAL) showWinCelebration();
            else presentNextRound(false, false);
          }, 550, 3000);
        });
      }, 1000);
    }, 240);
  }

  function presentNextRound(isBoot, withIntro){
    state = "playing";
    inputLock = false;
    idleVoiceReminded = false;
    world.classList.toggle("night-mode", mode === "night");

    if(mode === "surprise"){
      var shF = shuffle(FRIENDS);
      var mAll = {};
      PROPS.forEach(function(pr, idx){ mAll[pr.id] = shF[idx % shF.length]; });
      buildClearing(PROPS, mAll);
      renderFinder(true);
      renderBlanket();
      speakPrompt(!!isBoot, !!withIntro);
      return;
    }

    var rem = queue.filter(function(f){ return foundFriends.indexOf(f) < 0; });
    targetFriend = rem[0] || FRIENDS[0];
    var map = {};
    var hideProp = PROPS[Math.floor(Math.random() * PROPS.length)];
    PROPS.forEach(function(pr){ map[pr.id] = (pr.id === hideProp.id) ? targetFriend : null; });
    buildClearing(PROPS, map);
    renderFinder(true);
    renderBlanket();
    speakPrompt(!!isBoot, !!withIntro);
    armClues();
  }

  function showWinCelebration(){
    state = "won";
    inputLock = false;
    clearClues();
    showerConfetti();
    winFriends.innerHTML = "";
    foundFriends.forEach(function(f){
      var d = document.createElement("div"); d.className = "win-mini"; d.innerHTML = f.svg; winFriends.appendChild(d);
    });
    var stEls = winStars.children;
    for(var i = 0; i < stEls.length; i++){
      stEls[i].classList.remove("lit");
      (function(el, ms){ setTimeout(function(){ el.classList.add("lit"); }, ms); })(stEls[i], 140 + i * 140);
    }
    winOverlay.hidden = false;
    sayClips([resolveClip("hoot-peek-win", "hoot-win-yay")], true);
  }

  function syncModePills(){
    Array.prototype.forEach.call(document.querySelectorAll(".mode-pill"), function(b){
      var on = b.getAttribute("data-mode") === mode;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }
  function beginSession(selectedMode, isBoot, withIntro){
    roundTok++;
    clearClues();
    foundFriends = [];
    queue = shuffle(FRIENDS).slice(0, GOAL);
    hootBtn.classList.remove("happy-jump");
    winOverlay.hidden = true;
    mode = selectedMode || mode || "hide";
    syncModePills();
    presentNextRound(!!isBoot, !!withIntro);
  }

  $("againBtn").addEventListener("click", function(){ unlockAudioOnce(); audio(); sfxPop(); beginSession(mode === "surprise" ? "hide" : mode, false, false); });
  Array.prototype.forEach.call(document.querySelectorAll(".mode-pill"), function(b){
    b.addEventListener("click", function(){
      unlockAudioOnce();
      audio(); sfxPop(); winOverlay.hidden = true;
      var nextMode = b.getAttribute("data-mode");
      beginSession(nextMode, false, nextMode === "hide");
    });
  });
  $("repeatBtn").addEventListener("click", function(){ unlockAudioOnce(); audio(); if(state === "playing") speakPrompt(false, false); });
  hootBtn.addEventListener("click", function(){
    unlockAudioOnce();
    audio();
    var r = hootBtn.getBoundingClientRect();
    popBadge(r.left + r.width / 2, r.top + 16, "🎵");
    hootBtn.classList.remove("happy-jump"); void hootBtn.offsetWidth; hootBtn.classList.add("happy-jump");
    setTimeout(function(){ hootBtn.classList.remove("happy-jump"); }, 900);
    sfxPop();
    if(state === "playing") speakPrompt(false, false);
  });
  $("soundBtn").addEventListener("click", function(){
    soundOn = !soundOn;
    $("sndOnSvg").style.display = soundOn ? "block" : "none";
    $("sndOffSvg").style.display = soundOn ? "none" : "block";
    if(!soundOn) clearVoice(); else { unlockAudioOnce(); audio(); sfxPop(); if(state === "playing") speakPrompt(false, false); }
  });
  Array.prototype.forEach.call(document.querySelectorAll(".firefly"), function(ff){
    ff.addEventListener("click", function(){
      unlockAudioOnce(); audio(); sfxPop(); var r = ff.getBoundingClientRect(); burstLeaves(r.left + 32, r.top + 32, "#fff49c", 8);
    });
  });

  window.addEventListener("pagehide", function(){ dead = true; clearClues(); clearVoice(); });
  document.addEventListener("visibilitychange", function(){ if(document.hidden) clearVoice(); });

  /* Boot directly into lush Pixar Peekaboo Forest (zero blocking start veil!) */
  beginSession("hide", true, true);

  window.__peekGame = {
    snapshot: function(){
      return {
        state: state, mode: mode, isRiley: IS_RILEY, stars: stars,
        target: targetFriend ? targetFriend.id : null,
        foundCount: foundFriends.length, goal: GOAL,
        propCount: clearing.querySelectorAll(".forest-prop").length,
        nightMode: world.classList.contains("night-mode"),
        winShown: !winOverlay.hidden, voicePlaying: vPlaying
      };
    }
  };
})();
</script>
