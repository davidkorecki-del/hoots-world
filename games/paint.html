<!doctype html>
<html lang="en" class="hw-paint-v2 hw-paint-v3">
<head>
<base href="../">
<script>
window.__HOOT_GAME_KEY__="paint";
window.__HOOT_SELF_COACH__=true;
</script>
<script src="js/hoot-game-head.js?v=llprev3e137"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Finger Paint Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1b2c47;
    --cream:#fffdf6;
    --wood:#c58446;
    --wood-dark:#804b1d;
    --wood-lite:#e4ac6d;
    --sun:#ffc93c;
    --coral:#ff5c52;
    --leaf:#4bc85b;
    --sky:#38b6ff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; width:100%; margin:0; padding:0; overflow:hidden; }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#f9e6c4;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ================= SUNNY WOODEN ART STUDIO STAGE ================= */
  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(circle at 80% 10%, rgba(255,244,196,.9) 0%, rgba(255,244,196,0) 44%),
      repeating-linear-gradient(90deg, rgba(197,132,70,.07) 0 46px, rgba(197,132,70,.02) 46px 92px),
      linear-gradient(180deg, #fff5dc 0%, #f7e1b8 100%);
  }

  /* Festive rainbow bunting string at top of studio */
  #buntingSvg{
    position:absolute;
    top:0; left:0; width:100%; height:44px;
    pointer-events:none;
    z-index:1;
    opacity:.92;
  }

  /* ================= TOP STUDIO BAR (>=64px) ================= */
  #topbar{
    position:relative;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left));
    flex:0 0 auto;
  }
  .bar-group{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .studio-btn{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 14px;
    border-radius:20px;
    border:4px solid #fff;
    background:var(--cream);
    color:var(--ink);
    font-size:28px;
    font-family:"Fredoka",sans-serif;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(88,52,18,.24), 0 8px 16px rgba(88,52,18,.14);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .15s;
    flex:0 0 auto;
  }
  .studio-btn:active{ transform:translateY(3px) scale(.94); }
  .studio-btn:disabled{ opacity:.4; pointer-events:none; }
  .studio-btn.round{ width:64px; padding:0; border-radius:50%; }
  .studio-btn.mode-btn.on{
    background:linear-gradient(180deg,#ffe678,#ffc93c);
    box-shadow:0 5px 0 #c98600, 0 0 0 3.5px var(--ink);
  }
  #clearBtn{
    background:linear-gradient(180deg,#ff766c,#e6392f);
    color:#fff;
    box-shadow:0 5px 0 #9e1b14, 0 8px 16px rgba(230,57,47,.28);
  }
  #saveBtn{
    background:linear-gradient(180deg,#38d2c6,#119e96);
    color:#fff;
    box-shadow:0 5px 0 #0a6b65;
  }
  #starBank{
    min-height:64px;
    padding:0 16px 0 11px;
    border-radius:999px;
    border:4px solid #fff;
    background:var(--cream);
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:24px;
    font-weight:700;
    box-shadow:0 5px 0 rgba(88,52,18,.2);
    flex:0 0 auto;
  }
  #starBank svg{ width:28px; height:28px; display:block; }
  #starBank.bump{ animation:starPop .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starPop{ 0%{transform:scale(1)} 45%{transform:scale(1.2) rotate(-4deg)} 100%{transform:scale(1)} }

  /* ================= SUB-STRIP (COLORING PAGES / TRACE PICKER / STAMPS) ================= */
  #subStrip{
    position:relative;
    z-index:9;
    display:none;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:2px 10px 6px;
    overflow-x:auto;
    scrollbar-width:none;
    flex:0 0 auto;
  }
  #subStrip::-webkit-scrollbar{ display:none; }
  #subStrip.show{ display:flex; }
  .sub-pill{
    min-width:64px;
    min-height:58px;
    padding:4px 12px;
    border-radius:18px;
    border:3.5px solid #fff;
    background:rgba(255,253,246,.95);
    font-size:28px;
    font-family:"Fredoka",sans-serif;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 0 rgba(88,52,18,.18);
    flex:0 0 auto;
    transition:transform .12s;
  }
  .sub-pill:active{ transform:scale(.92); }
  .sub-pill.on{
    background:#ffe473;
    box-shadow:0 4px 0 #c98600, 0 0 0 3px var(--ink);
    transform:scale(1.06);
  }

  /* ================= MAIN WORKSPACE (CANVAS EASEL + DOCK) ================= */
  #workspace{
    position:relative;
    z-index:5;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:2px max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }

  /* Wooden Framed Easel Canvas */
  #easelFrame{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    padding:10px;
    border-radius:26px;
    background:linear-gradient(145deg, #d89652 0%, #b47032 55%, #8f531f 100%);
    box-shadow:
      0 8px 0 #663812,
      0 16px 32px rgba(68,36,10,.26),
      inset 0 2px 3px rgba(255,235,200,.55);
    display:flex;
  }
  /* Wooden top easel clip */
  #easelFrame::before{
    content:"";
    position:absolute;
    top:-7px;
    left:50%;
    transform:translateX(-50%);
    width:72px;
    height:18px;
    border-radius:8px;
    background:linear-gradient(180deg,#e9b374,#b57234);
    border:3px solid #6b3b13;
    box-shadow:0 3px 6px rgba(0,0,0,.22);
    z-index:4;
    pointer-events:none;
  }
  #canvasWrap{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    border-radius:18px;
    overflow:hidden;
    background:#fffdf6;
    box-shadow:inset 0 3px 10px rgba(34,48,74,.1);
  }
  #canvasWrap.night-paper{
    background:radial-gradient(circle at 50% 45%, #1c2c52 0%, #0f1a33 100%);
  }
  #canvasWrap.just-cleared{
    animation:wipeFlash .45s ease;
  }
  @keyframes wipeFlash{
    0%{ box-shadow:inset 0 0 0 10px #ffd93b; }
    100%{ box-shadow:inset 0 3px 10px rgba(34,48,74,.1); }
  }
  #canvasWrap canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  #paintCanvas{ z-index:1; touch-action:none; cursor:crosshair; }
  #guideCanvas{ z-index:2; pointer-events:none; }
  #fxCanvas{ z-index:3; pointer-events:none; }

  /* Floating Artist Hoot buddy tucked cleanly at bottom-right easel corner */
  #hootBuddy{
    position:absolute;
    right:12px;
    bottom:10px;
    z-index:6;
    width:clamp(66px, 9vw, 88px);
    height:clamp(66px, 9vw, 88px);
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    filter:drop-shadow(0 6px 10px rgba(30,20,10,.26));
    transition:transform .16s cubic-bezier(.34,1.6,.5,1);
  }
  #hootBuddy:active{ transform:scale(.9); }
  #hootBuddy.celebrate{ animation:hootHop .65s cubic-bezier(.34,1.65,.5,1) 2; }
  @keyframes hootHop{ 0%,100%{transform:translateY(0) rotate(0)} 45%{transform:translateY(-16px) rotate(-6deg)} }
  #hootBuddy.talking{ animation:hootBob .22s ease-in-out infinite alternate; }
  @keyframes hootBob{ from{transform:translateY(0)} to{transform:translateY(-5px)} }
  #hootBuddy svg{ width:100%; height:100%; display:block; overflow:visible; }

  /* Floating Paper Theme + Gallery mini pills inside top-right corner of easel */
  #easelCorner{
    position:absolute;
    top:12px;
    right:12px;
    z-index:6;
    display:flex;
    gap:6px;
  }
  .corner-pill{
    width:50px;
    height:50px;
    border-radius:50%;
    border:3px solid #fff;
    background:rgba(255,253,246,.92);
    box-shadow:0 3px 0 rgba(27,44,71,.2);
    font-size:23px;
    display:grid;
    place-items:center;
    cursor:pointer;
  }
  .corner-pill:active{ transform:scale(.9); }
  .corner-pill.on{ background:#1e2f59; color:#ffe66d; border-color:#ffe66d; }

  /* ================= PAINT POTS & TOOLS PALETTE ================= */
  #palette{
    position:relative;
    z-index:6;
    flex:0 0 auto;
    background:rgba(255,249,235,.96);
    border:4px solid #fff;
    border-radius:24px;
    padding:8px 10px;
    box-shadow:0 6px 0 rgba(128,75,29,.22), 0 12px 24px rgba(88,52,18,.14);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  #potsRow{
    display:flex;
    align-items:center;
    gap:10px;
    overflow-x:auto;
    padding:4px 4px 6px;
    scrollbar-width:none;
  }
  #potsRow::-webkit-scrollbar, #toolsRow::-webkit-scrollbar{ display:none; }

  /* Glossy 3D Paint Pot Button */
  .pot{
    position:relative;
    width:64px;
    height:64px;
    min-width:64px;
    min-height:64px;
    flex:0 0 auto;
    border-radius:50%;
    border:4px solid #fff;
    cursor:pointer;
    padding:0;
    box-shadow:
      0 5px 0 rgba(27,44,71,.24),
      0 0 0 2.5px rgba(27,44,71,.3),
      inset 0 -8px 12px rgba(0,0,0,.22);
    transition:transform .16s cubic-bezier(.34,1.65,.5,1), box-shadow .16s;
  }
  .pot::before{
    content:"";
    position:absolute;
    top:10%; left:18%;
    width:38%; height:22%;
    border-radius:50%;
    background:rgba(255,255,255,.55);
    transform:rotate(-22deg);
    pointer-events:none;
  }
  .pot.on{
    transform:scale(1.13) translateY(-3px);
    box-shadow:
      0 0 0 4.5px var(--ink),
      0 0 0 8.5px var(--sun),
      0 10px 18px rgba(27,44,71,.32);
  }
  .pot:active{ transform:scale(.92); }

  #toolsRow{
    display:flex;
    align-items:center;
    gap:8px;
    overflow-x:auto;
    padding:2px 2px 4px;
    scrollbar-width:none;
  }
  .tool-btn{
    min-width:64px;
    min-height:64px;
    height:64px;
    padding:0 12px;
    border-radius:18px;
    border:3.5px solid var(--ink);
    background:var(--cream);
    color:var(--ink);
    font-size:28px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
    box-shadow:0 4px 0 rgba(27,44,71,.24);
    transition:transform .14s cubic-bezier(.34,1.6,.5,1), background .14s;
  }
  .tool-btn:active{ transform:translateY(3px) scale(.94); }
  .tool-btn.on{
    background:linear-gradient(180deg,#3b82f6,#1d4ed8);
    color:#fff;
    box-shadow:0 0 0 3.5px var(--sun), 0 4px 0 #12328a;
    transform:translateY(-2px);
  }

  /* 3 Chunky Brush Size Dots */
  #sizeGroup{
    display:flex;
    align-items:center;
    gap:6px;
    padding:4px 8px;
    border-radius:18px;
    background:#f4e8ce;
    border:3px solid #fff;
    flex:0 0 auto;
  }
  .sz-btn{
    width:52px;
    height:52px;
    border-radius:50%;
    border:3px solid transparent;
    background:var(--cream);
    display:grid;
    place-items:center;
    cursor:pointer;
    padding:0;
  }
  .sz-btn span{
    border-radius:50%;
    background:var(--ink);
    display:block;
  }
  .sz-btn.on{
    border-color:var(--ink);
    background:var(--sun);
    transform:scale(1.06);
  }

  /* ================= GALLERY & SAVED PREVIEW MODAL ================= */
  #galleryModal, #savedModal{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(27,44,71,.52);
    padding:16px;
  }
  #galleryModal[hidden], #savedModal[hidden]{ display:none; }
  #galleryCard, #savedCard{
    background:var(--cream);
    border:6px solid #fff;
    border-radius:30px;
    padding:18px;
    width:min(92vw, 520px);
    max-height:86vh;
    overflow-y:auto;
    text-align:center;
    box-shadow:0 14px 36px rgba(20,30,50,.38);
  }
  #savedCard{ width:min(92vw, 440px); }
  #savedPreviewImg{
    width:100%;
    max-height:46vh;
    object-fit:contain;
    border-radius:16px;
    border:5px solid #b87436;
    background:#fff;
    margin:10px 0 8px;
    box-shadow:0 6px 14px rgba(0,0,0,.18);
  }
  #savedWhere{
    font-size:16px;
    font-weight:700;
    color:#2b4368;
    margin:4px 0 12px;
  }
  .saved-actions{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
  }
  .saved-btn{
    min-width:118px;
    min-height:60px;
    padding:0 20px;
    border-radius:999px;
    border:4px solid #fff;
    font-family:"Fredoka",sans-serif;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .saved-btn.dl{ background:linear-gradient(180deg,#38bdf8,#0284c7); color:#fff; box-shadow:0 5px 0 #075985; }
  .saved-btn.ok{ background:linear-gradient(180deg,#6ce078,#40b84f); color:#fff; box-shadow:0 5px 0 #268432; }
  #galleryGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(132px,1fr));
    gap:12px;
    margin:12px 0 16px;
  }
  .g-item{
    position:relative;
    border:5px solid #b87436;
    border-radius:14px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.18);
  }
  .g-item img{ width:100%; height:98px; object-fit:cover; display:block; }
  .g-item-bar{
    display:flex;
    justify-content:space-between;
    padding:4px 6px;
    background:#fff8e8;
    border-top:2px solid #ecd4ad;
  }
  .g-mini{
    border:none;
    background:#fff;
    border-radius:8px;
    padding:3px 8px;
    font-size:15px;
    cursor:pointer;
    text-decoration:none;
    box-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  #closeGalleryBtn{
    min-width:120px;
    min-height:60px;
    border-radius:999px;
    border:4px solid #fff;
    background:var(--leaf);
    color:#fff;
    font-family:"Fredoka",sans-serif;
    font-size:24px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 5px 0 #268432;
  }

  /* ================= LANDSCAPE IPAD / DESKTOP / PHONE FULL-HEIGHT SIDEBAR (ZERO SCROLL!) ================= */
  @media (orientation:landscape) and (min-width:640px){
    #stage{
      display:grid;
      grid-template-columns:236px minmax(0, 1fr);
      grid-template-rows:auto auto minmax(0, 1fr);
      column-gap:12px;
      row-gap:6px;
      padding:max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }
    #workspace{
      display:contents;
    }
    #palette{
      grid-column:1;
      grid-row:1 / 4;
      width:100%;
      height:100%;
      min-height:0;
      padding:10px;
      gap:8px;
      overflow:hidden;
      justify-content:space-between;
    }
    #topbar{
      grid-column:2;
      grid-row:1;
      padding:0;
    }
    #subStrip{
      grid-column:2;
      grid-row:2;
      padding:0;
      justify-content:flex-start;
    }
    #easelFrame{
      grid-column:2;
      grid-row:3;
      min-height:0;
      height:100%;
    }
    #potsRow{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:9px;
      justify-items:center;
      align-items:center;
      overflow:visible;
      padding:4px 2px;
    }
    .pot{
      width:58px;
      height:58px;
      min-width:58px;
      min-height:58px;
    }
    #toolsRow{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:8px;
      overflow:visible;
      padding:8px 0 0;
      border-top:3px dashed rgba(128,75,29,.22);
    }
    .tool-btn{
      min-width:0;
      width:100%;
      min-height:58px;
      height:58px;
      padding:0;
      font-size:26px;
      border-radius:16px;
    }
    #sizeGroup{
      grid-column:1 / -1;
      justify-content:space-around;
      padding:4px 6px;
    }
    .sz-btn{
      width:48px;
      height:48px;
    }
  }

  /* Medium-short landscape screens (520px..660px tall): still 100% zero scroll */
  @media (orientation:landscape) and (min-width:640px) and (max-height:660px){
    #stage{ grid-template-columns:220px minmax(0, 1fr); row-gap:4px; }
    #palette{ padding:7px 8px; gap:6px; }
    #potsRow{ gap:6px; padding:2px; }
    .pot{ width:48px; height:48px; min-width:48px; min-height:48px; border-width:3px; }
    #toolsRow{ gap:6px; padding-top:6px; }
    .tool-btn{ min-height:48px; height:48px; font-size:22px; border-radius:14px; border-width:3px; }
    .sz-btn{ width:40px; height:40px; }
    .studio-btn{ min-width:54px; min-height:54px; height:54px; font-size:24px; }
    .studio-btn.round{ width:54px; }
    #starBank{ min-height:54px; font-size:20px; }
    .sub-pill{ min-width:52px; min-height:48px; font-size:24px; }
  }

  /* Compact phone landscape (e.g. iPhone 844x390): 4x3 pots + 3x3 tools -> ZERO scroll! */
  @media (orientation:landscape) and (min-width:640px) and (max-height:519px){
    #stage{ grid-template-columns:236px minmax(0, 1fr); padding:5px 8px; column-gap:8px; row-gap:4px; }
    #palette{ padding:6px; gap:5px; border-width:3px; border-radius:18px; }
    #potsRow{ grid-template-columns:repeat(4, 1fr); gap:5px; padding:1px; }
    .pot{ width:40px; height:40px; min-width:40px; min-height:40px; border-width:3px; box-shadow:0 3px 0 rgba(27,44,71,.22), 0 0 0 2px rgba(27,44,71,.28), inset 0 -5px 8px rgba(0,0,0,.2); }
    .pot.on{ transform:scale(1.08); box-shadow:0 0 0 3px var(--ink), 0 0 0 6px var(--sun); }
    #toolsRow{ grid-template-columns:repeat(3, 1fr); gap:5px; padding-top:5px; }
    .tool-btn{ min-height:40px; height:40px; font-size:20px; border-radius:12px; border-width:2.5px; box-shadow:0 3px 0 rgba(27,44,71,.22); }
    #sizeGroup{ padding:2px 4px; gap:4px; }
    .sz-btn{ width:34px; height:34px; }
    .studio-btn{ min-width:48px; min-height:48px; height:48px; font-size:22px; border-radius:14px; border-width:3px; }
    .studio-btn.round{ width:48px; }
    #starBank{ min-height:48px; font-size:18px; }
    .sub-pill{ min-width:46px; min-height:42px; font-size:20px; border-radius:12px; }
    #easelFrame{ padding:6px; border-radius:18px; }
    #hootBuddy{ width:50px; height:50px; right:6px; bottom:6px; }
  }

  /* Compact Phone Portrait (390x844 etc.) */
  @media (max-width:540px){
    .studio-btn{ min-width:56px; min-height:56px; height:56px; padding:0 10px; font-size:24px; border-radius:16px; }
    .studio-btn.round{ width:56px; }
    #starBank{ display:none; }
    #easelFrame{ padding:7px; border-radius:20px; }
    #palette{ padding:6px 8px; gap:6px; border-radius:20px; }
    .pot{ width:56px; height:56px; min-width:56px; min-height:56px; }
    .tool-btn{ min-width:56px; min-height:56px; height:56px; font-size:24px; border-radius:15px; }
    .sz-btn{ width:46px; height:46px; }
    #hootBuddy{ width:58px; height:58px; right:8px; bottom:8px; }
  }
</style>
</head>
<body>
<div id="stage">
  <!-- Playful Studio Rainbow Bunting -->

<script>
(function(){
  "use strict";

  /* ================= STUDIO DATA ================= */
  var PAINTS=[
    {name:"Red",hex:"#ef4444",clip:"red"},
    {name:"Orange",hex:"#f97316",clip:"orange"},
    {name:"Yellow",hex:"#ffd21f",clip:"yellow"},
    {name:"Green",hex:"#4cc85a",clip:"green"},
    {name:"Teal",hex:"#14b8a6",clip:"green"},
    {name:"Sky Blue",hex:"#38bdf8",clip:"blue"},
    {name:"Blue",hex:"#3b5bdb",clip:"blue"},
    {name:"Purple",hex:"#9333ea",clip:"purple"},
    {name:"Pink",hex:"#f472b6",clip:"pink"},
    {name:"Brown",hex:"#9a6232",clip:"brown"},
    {name:"Black",hex:"#1e293b",clip:"black"},
    {name:"White",hex:"#ffffff",clip:"white"}
  ];

  var STAMPS=[
    {id:"star",emo:"⭐"},
    {id:"heart",emo:"❤️"},
    {id:"flower",emo:"🌸"},
    {id:"butterfly",emo:"🦋"},
    {id:"sun",emo:"☀️"},
    {id:"rainbow",emo:"🌈"},
    {id:"dino",emo:"🦖"},
    {id:"hoot",emo:"🦉"}
  ];

  var PICTURES=[
    {id:"hoot",emo:"🦉"},
    {id:"rocket",emo:"🚀"},
    {id:"butterfly",emo:"🦋"},
    {id:"fish",emo:"🐠"},
    {id:"flower",emo:"🌸"},
    {id:"castle",emo:"🏰"},
    {id:"dino",emo:"🦕"},
    {id:"truck",emo:"🚒"}
  ];

  var TRACE_SETS={
    letters:"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),
    numbers:"123456789".split(""),
    shapes:["Circle","Square","Triangle","Star","Heart"]
  };
  var TRACE_TABS=[
    {id:"letters",label:"ABC"},
    {id:"numbers",label:"123"},
    {id:"shapes",label:"⭐"}
  ];

  var PRAISE=["hoot-amazing.mp3","hoot-great-job.mp3","hoot-star.mp3","hoot-super.mp3","hoot-yay-2.mp3"];

  /* ================= STATE ================= */
  var mode="free"; /* free | colour | trace */
  var tool="brush"; /* brush | rainbow | glitter | bucket | spray | stamp | eraser */
  var colour=PAINTS[0].hex;
  var brushSize=28;
  var mirror=false;
  var nightPaper=false;
  var picture="hoot";
  var picStarred={};
  var stampIdx=0;
  var traceKind="letters", traceIdx=0, traceSamples=[], traceHits=0, traceDone=false;
  var stars=0, hue=0, soundOn=true, dead=false, praiseIdx=0;
  var drawing=false, lastX=0, lastY=0, dirty=false, colourDabs=0;
  var undoStack=[], galleryItems=[];
  var sparkles=[];

  /* ================= DOM ================= */
  function $(id){ return document.getElementById(id); }
  var wrap=$("canvasWrap"),
      paintCanvas=$("paintCanvas"), guideCanvas=$("guideCanvas"), fxCanvas=$("fxCanvas"),
      pctx=paintCanvas.getContext("2d", {willReadFrequently:true}),
      gctx=guideCanvas.getContext("2d"),
      fctx=fxCanvas.getContext("2d"),
      subStrip=$("subStrip"),
      potsRow=$("potsRow"),
      hootBuddy=$("hootBuddy"),
      starCount=$("starCount"), starBank=$("starBank"),
      undoBtn=$("undoBtn"), clearBtn=$("clearBtn"), saveBtn=$("saveBtn"),
      paperBtn=$("paperBtn"), galleryBtn=$("galleryBtn"),
      galleryModal=$("galleryModal"), galleryGrid=$("galleryGrid"),
      mirrorBtn=$("mirrorBtn"), soundBtn=$("soundBtn"),
      stampToolBtn=$("stampToolBtn");

  var W=300, H=220, DPR=1;

  /* ================= SOUND FX ================= */
  var AC=null;
  function audio(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
    if(AC&&AC.state==="suspended") AC.resume();
    return AC;
  }
  function tone(f0,f1,dur,type,vol,delay){
    if(!soundOn) return;
    var ac=audio(); if(!ac) return;
    var t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.11,t+0.014);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
  }
  function popSfx(){ tone(520,240,0.09,"triangle",0.12); }
  function splashFillSfx(){ tone(320,760,0.14,"sine",0.13); tone(760,1180,0.11,"triangle",0.1,0.07); }
  function sparkleSfx(){ tone(1180,1560,0.09,"sine",0.08); tone(1560,2090,0.12,"sine",0.07,0.06); }
  function stampSfx(){ tone(440,680,0.08,"triangle",0.12); tone(680,880,0.1,"sine",0.1,0.05); }
  function starSfx(){ tone(880,880,0.08,"triangle",0.1); tone(1175,1175,0.08,"triangle",0.1,0.06); tone(1568,1568,0.14,"triangle",0.1,0.12); }
  function whooshSfx(){ tone(260,90,0.2,"triangle",0.13); }

  /* ================= STUDIO HOOT VOICE ================= */
  var VBASE="assets/voice/";
  var voiceEl=null, vQueue=[], vPlaying=false;
  function hasClip(id){
    try{ var H=window.parent&&window.parent.HOOT_HAVE; if(H) return !!H[id]; }catch(e){}
    return true;
  }
  function getVoice(){
    if(!voiceEl){
      voiceEl=new Audio(); voiceEl.preload="auto";
      voiceEl.addEventListener("ended",function(){
        var e=voiceEl;
        if(e.__hwT && Date.now()-e.__hwT<350){
          if(!e.paused && !e.ended) return;
          if(!e.__hwRetry){ e.__hwRetry=1; try{e.currentTime=0;}catch(x){} var p=e.play(); if(p&&p.catch) p.catch(vNext); return; }
        }
        vNext();
      });
      voiceEl.addEventListener("error",vNext);
    }
    return voiceEl;
  }
  function hubQuiet(){
    try{
      var d=window.parent&&window.parent.document;
      if(!d||d===document) return false;
      var b=d.querySelector('.voice-btn[data-voice="off"]');
      return !!(b&&(b.classList.contains("sel")||b.classList.contains("active")||b.getAttribute("aria-pressed")==="true"));
    }catch(e){ return false; }
  }
  function vNext(){
    if(!vPlaying){ pumpVoice(); return; }
    vPlaying=false; hootBuddy.classList.remove("talking"); pumpVoice();
  }
  function pumpVoice(){
    if(vPlaying||dead) return;
    var item=vQueue.shift(); if(!item) return;
    if(!soundOn||hubQuiet()){ pumpVoice(); return; }
    var el=getVoice();
    vPlaying=true; hootBuddy.classList.add("talking");
    if(item.giggle) window.__bellyArmed=true;
    el.__hwT=Date.now(); el.__hwRetry=0;
    el.src=VBASE+item.file;
    var p=el.play();
    if(item.giggle) setTimeout(function(){ window.__bellyArmed=false; }, 120);
    if(p&&p.catch) p.catch(vNext);
  }
  function clearVoice(stop){
    vQueue.length=0;
    if(stop && voiceEl){
      voiceEl.__hwT=0; voiceEl.__hwRetry=1;
      try{ voiceEl.pause(); }catch(e){}
      vPlaying=false; hootBuddy.classList.remove("talking");
    }
  }
  function enqueue(file,opts){
    if(!file) return;
    vQueue.push({file:file, giggle:!!(opts&&opts.giggle)});
    pumpVoice();
  }
  function speakColorName(clip){
    if(!clip) return;
    clearVoice(true);
    enqueue("name-color-"+clip+".mp3");
  }
  function speakPraise(){
    var f=PRAISE[praiseIdx%PRAISE.length];
    praiseIdx++;
    if(!hasClip(f.replace(".mp3",""))) f="hoot-great-job.mp3";
    enqueue(f);
  }
  function celebrateHoot(){
    hootBuddy.classList.remove("celebrate"); void hootBuddy.offsetWidth; hootBuddy.classList.add("celebrate");
  }
  function addStar(){
    stars++; starCount.textContent=stars;
    starBank.classList.remove("bump"); void starBank.offsetWidth; starBank.classList.add("bump");
    starSfx();
  }

  /* ================= CANVAS SIZING (RETAINS ARTWORK) ================= */
  function fitCanvases(keep){
    var r=wrap.getBoundingClientRect();
    DPR=Math.min(window.devicePixelRatio||1, 2);
    var snap=null;
    if(keep && paintCanvas.width && paintCanvas.height){
      snap=document.createElement("canvas");
      snap.width=paintCanvas.width; snap.height=paintCanvas.height;
      snap.getContext("2d").drawImage(paintCanvas,0,0);
    }
    W=Math.max(80, Math.round(r.width));
    H=Math.max(80, Math.round(r.height));
    [paintCanvas,guideCanvas,fxCanvas].forEach(function(cv){
      cv.width=Math.round(W*DPR);
      cv.height=Math.round(H*DPR);
    });
    pctx.setTransform(DPR,0,0,DPR,0,0);
    gctx.setTransform(DPR,0,0,DPR,0,0);
    fctx.setTransform(DPR,0,0,DPR,0,0);
    if(snap){
      pctx.drawImage(snap, 0, 0, W, H);
    }
    drawGuide();
  }
  window.addEventListener("resize",function(){ fitCanvases(true); });
  window.addEventListener("orientationchange",function(){ setTimeout(function(){ fitCanvases(true); }, 150); });

  /* ================= UNDO ================= */
  function pushUndo(){
    try{
      undoStack.push(paintCanvas.toDataURL());
      if(undoStack.length>20) undoStack.shift();
      undoBtn.disabled=!undoStack.length;
    }catch(e){}
  }
  undoBtn.addEventListener("click",function(){
    if(!undoStack.length) return;
    audio(); popSfx();
    var url=undoStack.pop();
    undoBtn.disabled=!undoStack.length;
    var img=new Image();
    img.onload=function(){ pctx.clearRect(0,0,W,H); pctx.drawImage(img,0,0,W,H); };
    img.src=url;
  });

  /* ================= LIVE SPARKLE FX OVERLAY ================= */
  function burstSparkles(x,y,col,n){
    var cols=col?[col,"#ffe066","#ffffff"]:["#ff5c52","#ffc93c","#4bc85b","#38bdf8","#c084fc","#ffffff"];
    for(var i=0;i<(n||12);i++){
      var a=Math.random()*Math.PI*2;
      var sp=1.2+Math.random()*4.2;
      sparkles.push({
        x:x, y:y,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1.2,
        r:3+Math.random()*5,
        life:1,
        col:cols[i%cols.length]
      });
    }
  }
  function drawStarShape(ctx,x,y,r,col,alpha){
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=col;
    ctx.translate(x,y);
    ctx.beginPath();
    for(var i=0;i<8;i++){
      var a=i*Math.PI/4;
      var rad=(i%2===0)?r:r*0.36;
      if(i===0) ctx.moveTo(Math.cos(a)*rad, Math.sin(a)*rad);
      else ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  (function fxLoop(){
    if(!dead){
      if(sparkles.length){
        fctx.clearRect(0,0,W,H);
        for(var i=sparkles.length-1;i>=0;i--){
          var s=sparkles[i];
          s.x+=s.vx; s.y+=s.vy; s.vy+=0.08; s.life-=0.035;
          if(s.life<=0){ sparkles.splice(i,1); continue; }
          drawStarShape(fctx,s.x,s.y,s.r,s.col,s.life);
        }
      }
      requestAnimationFrame(fxLoop);
    }
  })();

  /* ================= BOLD STORYBOOK COLORING PAGES (CLEAN NON-OVERLAPPING LINES!) ================= */
  function drawColoringBook(id){
    var cx=W/2, cy=H/2, u=Math.min(W,H)/110;
    gctx.save();
    gctx.strokeStyle=nightPaper?"#e2eeff":"#1b2c47";
    gctx.lineWidth=Math.max(4, u*1.45);
    gctx.lineCap="round";
    gctx.lineJoin="round";

    /* Clean coloring-book primitive: clears any background strokes inside this foreground
       shape via destination-out so outlines NEVER cross awkwardly, while leaving the
       interior 100% transparent for paint + flood-fill underneath! */
    function shape(drawPath, open){
      gctx.beginPath();
      drawPath();
      if(!open){
        gctx.save();
        gctx.globalCompositeOperation="destination-out";
        gctx.fillStyle="#000";
        gctx.fill();
        gctx.restore();
      }
      gctx.stroke();
    }
    function C(x,y,r){ shape(function(){ gctx.arc(cx+x*u,cy+y*u,r*u,0,Math.PI*2); }); }
    function E(x,y,rx,ry,rot){ shape(function(){ gctx.ellipse(cx+x*u,cy+y*u,rx*u,ry*u,rot||0,0,Math.PI*2); }); }
    function P(pts,close){
      shape(function(){
        pts.forEach(function(p,i){ if(i) gctx.lineTo(cx+p[0]*u,cy+p[1]*u); else gctx.moveTo(cx+p[0]*u,cy+p[1]*u); });
        if(close!==false) gctx.closePath();
      }, close===false);
    }

    if(id==="hoot"){
      /* Back-to-front clean storybook owl! */
      P([[-14,40],[-22,50],[-14,40],[-10,51]],false);
      P([[14,40],[22,50],[14,40],[10,51]],false);
      E(-30,12,11,22,0.28);
      E(30,12,11,22,-0.28);
      E(0,12,30,33);
      E(0,22,19,20);
      P([[-18,-30],[-30,-48],[-6,-36]]);
      P([[18,-30],[30,-48],[6,-36]]);
      C(0,-16,25);
      C(-10,-16,9.5); C(10,-16,9.5);
      C(-10,-16,3.5); C(10,-16,3.5);
      P([[-6,-6],[6,-6],[0,4]]);
    } else if(id==="rocket"){
      P([[-18,4],[-34,28],[-18,22]]);
      P([[18,4],[34,28],[18,22]]);
      P([[-10,22],[10,22],[0,44]]);
      P([[0,-46],[18,-18],[18,22],[-18,22],[-18,-18]]);
      P([[-18,-16],[18,-16]],false);
      C(0,2,10);
      C(-34,-26,5); C(36,-14,4); C(32,36,5);
    } else if(id==="butterfly"){
      E(-24,-14,22,16,-0.25); E(24,-14,22,16,0.25);
      E(-20,16,16,12,0.25); E(20,16,16,12,-0.25);
      C(-26,-16,7); C(26,-16,7);
      C(-20,16,5); C(20,16,5);
      P([[-4,-30],[-16,-44]],false); P([[4,-30],[16,-44]],false);
      C(-16,-44,3.5); C(16,-44,3.5);
      E(0,4,7.5,25);
      C(0,-24,8.5);
    } else if(id==="fish"){
      P([[26,4],[48,-16],[48,24]]);
      P([[-8,-18],[8,-35],[16,-16]]);
      P([[-6,26],[8,39],[14,24]]);

  /* ================= MAGIC TRACE LAYER ================= */
  function tracePath(ctx2,cx,cy,s){
    var item=TRACE_SETS[traceKind][traceIdx];
    ctx2.save(); ctx2.translate(cx,cy);
    if(traceKind==="shapes"){
      ctx2.beginPath();
      if(item==="Circle") ctx2.arc(0,0,s*0.42,0,Math.PI*2);
      else if(item==="Square") ctx2.rect(-s*0.38,-s*0.38,s*0.76,s*0.76);
      else if(item==="Triangle"){ ctx2.moveTo(0,-s*0.44); ctx2.lineTo(s*0.44,s*0.36); ctx2.lineTo(-s*0.44,s*0.36); ctx2.closePath(); }
      else if(item==="Heart"){ ctx2.moveTo(0,s*0.42); ctx2.bezierCurveTo(-s*0.92,-s*0.04,-s*0.56,-s*0.54,-s*0.2,-s*0.54); ctx2.bezierCurveTo(-s*0.04,-s*0.54,0,-s*0.4,0,-s*0.28); ctx2.bezierCurveTo(0,-s*0.4,s*0.04,-s*0.54,s*0.2,-s*0.54); ctx2.bezierCurveTo(s*0.56,-s*0.54,s*0.92,-s*0.04,0,s*0.42); ctx2.closePath(); }
      else if(item==="Star"){ for(var i=0;i<10;i++){ var a=-Math.PI/2+i*Math.PI/5, r=i%2?s*0.2:s*0.44; if(i) ctx2.lineTo(Math.cos(a)*r,Math.sin(a)*r); else ctx2.moveTo(Math.cos(a)*r,Math.sin(a)*r); } ctx2.closePath(); }
    } else {
      ctx2.font="700 "+Math.round(s*0.92)+"px Fredoka, sans-serif";
      ctx2.textAlign="center";
      ctx2.textBaseline="middle";
      ctx2.fillText(item,0,s*0.04);
    }
    ctx2.restore();
  }

  function buildTraceSamples(){
    traceSamples=[]; traceHits=0; traceDone=false;
    var s=Math.min(W,H)*0.74;
    var mask=document.createElement("canvas");
    mask.width=Math.max(2,W); mask.height=Math.max(2,H);
    var mctx=mask.getContext("2d");
    mctx.fillStyle="#000";
    if(traceKind==="shapes"){ tracePath(mctx,W/2,H/2,s); mctx.lineWidth=22; mctx.stroke(); }
    else tracePath(mctx,W/2,H/2,s);
    var data=null;
    try{ data=mctx.getImageData(0,0,mask.width,mask.height).data; }catch(e){}
    if(!data) return;
    for(var y=10;y<H;y+=16){
      for(var x=10;x<W;x+=16){
        var idx=((y*mask.width)+x)*4;
        if(data[idx+3]>40) traceSamples.push({x:x,y:y,hit:false});
      }
    }
  }

  function drawGuide(){
    gctx.clearRect(0,0,W,H);
    if(mode==="colour"){
      drawColoringBook(picture);
    } else if(mode==="trace"){
      var s=Math.min(W,H)*0.74;
      gctx.save();
      gctx.fillStyle=nightPaper?"rgba(255,255,255,.16)":"rgba(27,44,71,.12)";
      gctx.strokeStyle=nightPaper?"rgba(255,224,102,.78)":"rgba(38,108,184,.58)";
      gctx.lineWidth=5;
      gctx.setLineDash([12,10]);
      if(traceKind==="shapes"){
        tracePath(gctx,W/2,H/2,s);
        gctx.fill(); gctx.stroke();
      } else {
        tracePath(gctx,W/2,H/2,s);
        gctx.lineWidth=3.5;
        gctx.font="700 "+Math.round(s*0.92)+"px Fredoka, sans-serif";
        gctx.textAlign="center"; gctx.textBaseline="middle";
        gctx.strokeText(TRACE_SETS[traceKind][traceIdx], W/2, H/2+s*0.04);
      }
      gctx.restore();
      buildTraceSamples();
    }
  }

  /* ================= MAGIC FLOOD-FILL BUCKET ================= */
  function hexToRgba(hex){
    return [
      parseInt(hex.slice(1,3),16),
      parseInt(hex.slice(3,5),16),
      parseInt(hex.slice(5,7),16),
      255
    ];
  }
  function magicFloodFill(cssX, cssY){
    var pw=paintCanvas.width, ph=paintCanvas.height;
    var sx=Math.max(0, Math.min(pw-1, Math.round(cssX*DPR)));
    var sy=Math.max(0, Math.min(ph-1, Math.round(cssY*DPR)));

    var pImg=pctx.getImageData(0,0,pw,ph);
    var pData=pImg.data;
    var gData=null;
    if(mode==="colour" || mode==="trace"){
      gData=gctx.getImageData(0,0,pw,ph).data;
    }

    var startOff=(sy*pw+sx)*4;
    if(gData && gData[startOff+3]>120){
      /* Tapped directly on an outline — gently ignore */
      popSfx();
      return;
    }

    var fillCol=hexToRgba(colour);
    var sr=pData[startOff], sg=pData[startOff+1], sb=pData[startOff+2], sa=pData[startOff+3];
    if(sa>240 && Math.abs(sr-fillCol[0])<8 && Math.abs(sg-fillCol[1])<8 && Math.abs(sb-fillCol[2])<8){
      splashFillSfx();
      burstSparkles(cssX,cssY,colour,10);
      return;
    }

    var visited=new Uint8Array(pw*ph);
    var stack=new Int32Array(pw*ph);
    var sp=0;
    stack[sp++]=sy*pw+sx;
    visited[sy*pw+sx]=1;
    var filled=0;

    function match(idx){
      var o=idx*4;
      if(gData && gData[o+3]>110) return false;
      var da=Math.abs(pData[o+3]-sa);
      if(sa<20) return pData[o+3]<60;
      return da<45 && Math.abs(pData[o]-sr)<40 && Math.abs(pData[o+1]-sg)<40 && Math.abs(pData[o+2]-sb)<40;
    }

    while(sp>0){
      var idx=stack[--sp];
      var o=idx*4;
      pData[o]=fillCol[0]; pData[o+1]=fillCol[1]; pData[o+2]=fillCol[2]; pData[o+3]=255;
      filled++;
      var x=idx%pw, y=(idx-x)/pw;
      if(x>0 && !visited[idx-1] && match(idx-1)){ visited[idx-1]=1; stack[sp++]=idx-1; }
      if(x<pw-1 && !visited[idx+1] && match(idx+1)){ visited[idx+1]=1; stack[sp++]=idx+1; }
      if(y>0 && !visited[idx-pw] && match(idx-pw)){ visited[idx-pw]=1; stack[sp++]=idx-pw; }
      if(y<ph-1 && !visited[idx+pw] && match(idx+pw)){ visited[idx+pw]=1; stack[sp++]=idx+pw; }
    }

    pctx.putImageData(pImg,0,0);
    dirty=true;
    splashFillSfx();
    burstSparkles(cssX,cssY,colour,16);
    if(mode==="colour" && filled>400){
      colourDabs+=16;
      checkColorProgress();
    }
  }

  /* ================= TACTILE BRUSHES & STAMPS ================= */
  function dab(x,y,col,sz){
    pctx.save();
    pctx.fillStyle=col;
    pctx.beginPath();
    pctx.arc(x,y,sz/2,0,Math.PI*2);
    pctx.fill();
    pctx.restore();
  }
  function strokeLine(x1,y1,x2,y2,col,sz){
    pctx.save();
    pctx.strokeStyle=col;
    pctx.lineWidth=sz;
    pctx.lineCap="round";
    pctx.lineJoin="round";
    pctx.beginPath();
    pctx.moveTo(x1,y1);
    pctx.lineTo(x2,y2);
    pctx.stroke();
    pctx.restore();
  }
  function drawGlitterDot(x,y,r){
    var cols=["#ffffff","#ffe066","#ff9ebb","#99e9ff"];
    for(var i=0;i<3;i++){
      var a=Math.random()*Math.PI*2, d=Math.random()*r;
      drawStarShape(pctx, x+Math.cos(a)*d, y+Math.sin(a)*d, 3+Math.random()*4.5, cols[(Math.random()*cols.length)|0], 0.92);
    }
  }
  function stampSticker(x,y){
    var emo=STAMPS[stampIdx].emo;
    var sz=Math.round(brushSize*1.75+30);
    var pts=mirror?[[x,y],[W-x,y]]:[[x,y]];
    pts.forEach(function(pt){
      pctx.save();
      pctx.font=sz+"px serif";
      pctx.textAlign="center";
      pctx.textBaseline="middle";
      pctx.fillText(emo, pt[0], pt[1]+2);
      pctx.restore();
      burstSparkles(pt[0],pt[1],null,10);
    });
    dirty=true;
    stampSfx();
    markTrace(x,y,brushSize);
    if(mode==="colour"){ colourDabs+=6; checkColorProgress(); }
  }

  function markTrace(x,y,r){
    if(mode!=="trace" || traceDone || !traceSamples.length) return;
    var grew=false;
    var rr=(r+12)*(r+12);
    for(var i=0;i<traceSamples.length;i++){
      var sm=traceSamples[i];
      if(sm.hit) continue;
      var dx=sm.x-x, dy=sm.y-y;
      if(dx*dx+dy*dy<=rr){ sm.hit=true; traceHits++; grew=true; }
    }
    if(grew && traceHits/traceSamples.length>=0.52){
      traceDone=true;
      addStar();
      celebrateHoot();
      burstSparkles(W/2, H/2, null, 28);
      var item=TRACE_SETS[traceKind][traceIdx];
      clearVoice(true);
      if(traceKind==="letters"){
        var lid="name-letter-"+item.toLowerCase();
        if(hasClip(lid)) enqueue(lid+".mp3");
      } else if(traceKind==="numbers"){
        var nid="call-number-"+item;
        if(hasClip(nid)) enqueue(nid+".mp3");
      } else if(traceKind==="shapes"){
        var sid="call-shape-"+item.toLowerCase();
        if(hasClip(sid)) enqueue(sid+".mp3");
      }
      speakPraise();
      setTimeout(function(){
        if(dead || mode!=="trace") return;
        traceIdx=(traceIdx+1)%TRACE_SETS[traceKind].length;
        pctx.clearRect(0,0,W,H);
        drawGuide();
      }, 1700);
    }
  }

  function checkColorProgress(){
    if(mode!=="colour" || picStarred[picture]) return;
    if(colourDabs>=44){
      picStarred[picture]=true;
      addStar();
      celebrateHoot();
      burstSparkles(W/2,H/2,null,26);
      speakPraise();
    }
  }

  function paintStroke(x,y,px,py,isStart){
    hue=(hue+3.2)%360;
    var col=(tool==="rainbow")?("hsl("+hue+",94%,56%)"):colour;
    var pts=mirror?[[x,y],[W-x,y]]:[[x,y]];
    var ppts=mirror?[[px,py],[W-px,py]]:[[px,py]];

    pts.forEach(function(pt,i){
      var cx=pt[0], cy=pt[1], ox=ppts[i][0], oy=ppts[i][1];
      if(tool==="brush" || tool==="rainbow" || tool==="glitter"){
        if(isStart) dab(cx,cy,col,brushSize);
        else strokeLine(ox,oy,cx,cy,col,brushSize);
        if(tool==="glitter"){
          drawGlitterDot(cx,cy,brushSize*0.85);
          if(Math.random()<0.35) burstSparkles(cx,cy,col,2);
        }
      } else if(tool==="spray"){
        for(var k=0;k<12;k++){
          var a=Math.random()*Math.PI*2;
          var rad=Math.random()*brushSize*0.95;
          dab(cx+Math.cos(a)*rad, cy+Math.sin(a)*rad, col, 3+Math.random()*4.5);
        }
      } else if(tool==="eraser"){
        pctx.save();
        pctx.globalCompositeOperation="destination-out";
        if(isStart) dab(cx,cy,"rgba(0,0,0,1)",brushSize*1.4);
        else strokeLine(ox,oy,cx,cy,"rgba(0,0,0,1)",brushSize*1.4);
        pctx.restore();
      }
    });

    dirty=true;
    markTrace(x,y,brushSize/2);
    if(mode==="colour" && tool!=="eraser"){ colourDabs++; checkColorProgress(); }
  }

  /* ================= POINTER INPUT ================= */
  function getPt(e){
    var r=paintCanvas.getBoundingClientRect();
    return { x:e.clientX-r.left, y:e.clientY-r.top };
  }
  paintCanvas.addEventListener("pointerdown",function(e){
    audio(); e.preventDefault();
    var p=getPt(e);
    pushUndo();
    if(tool==="bucket"){
      magicFloodFill(p.x,p.y);
      return;
    }
    if(tool==="stamp"){
      stampSticker(p.x,p.y);
      return;
    }
    drawing=true;
    lastX=p.x; lastY=p.y;
    paintStroke(p.x,p.y,p.x,p.y,true);
    try{ paintCanvas.setPointerCapture(e.pointerId); }catch(err){}
  });
  paintCanvas.addEventListener("pointermove",function(e){
    if(!drawing) return;
    var p=getPt(e);
    if(Math.abs(p.x-lastX)+Math.abs(p.y-lastY)<2) return;
    paintStroke(p.x,p.y,lastX,lastY,false);
    lastX=p.x; lastY=p.y;
  });
  function stopDraw(){ drawing=false; }
  paintCanvas.addEventListener("pointerup",stopDraw);
  paintCanvas.addEventListener("pointercancel",stopDraw);

  function renderSubStrip(){
    subStrip.innerHTML="";
    if(tool==="stamp"){
      STAMPS.forEach(function(st,idx){
        var b=document.createElement("button");
        b.type="button";
        b.className="sub-pill"+(idx===stampIdx?" on":"");
        b.textContent=st.emo;
        b.setAttribute("aria-label","Stamp "+st.id);
        b.addEventListener("click",function(){
          audio(); stampSfx();
          stampIdx=idx;
          stampToolBtn.textContent=st.emo;
          renderSubStrip();
        });
        subStrip.appendChild(b);
      });
      subStrip.classList.add("show");
      requestAnimationFrame(function(){ fitCanvases(true); });
      return;
    }
    if(mode==="colour"){
      PICTURES.forEach(function(pic){
        var b=document.createElement("button");
        b.type="button";
        b.className="sub-pill"+(pic.id===picture?" on":"");
        b.textContent=pic.emo;
        b.setAttribute("aria-label","Color "+pic.id);
        b.addEventListener("click",function(){
          audio(); popSfx();
          picture=pic.id;
          clearCanvasData();
          drawGuide();
          renderSubStrip();
        });
        subStrip.appendChild(b);
      });
      subStrip.classList.add("show");
      requestAnimationFrame(function(){ fitCanvases(true); });
      return;
    }
    if(mode==="trace"){
      TRACE_TABS.forEach(function(tab){
        var b=document.createElement("button");
        b.type="button";
        b.className="sub-pill"+(tab.id===traceKind?" on":"");
        b.textContent=tab.label;
        b.setAttribute("aria-label","Trace "+tab.id);
        b.addEventListener("click",function(){
          audio(); popSfx();
          traceKind=tab.id; traceIdx=0;
          clearCanvasData();
          drawGuide();
          renderSubStrip();
        });
        subStrip.appendChild(b);
      });
      /* Next trace item button */
      var nxt=document.createElement("button");
      nxt.type="button";
      nxt.className="sub-pill";
      nxt.textContent="➡️";
      nxt.setAttribute("aria-label","Next trace item");
      nxt.addEventListener("click",function(){
        audio(); popSfx();
        traceIdx=(traceIdx+1)%TRACE_SETS[traceKind].length;
        clearCanvasData();
        drawGuide();
      });
      subStrip.appendChild(nxt);
      subStrip.classList.add("show");
      requestAnimationFrame(function(){ fitCanvases(true); });
      return;
    }
    subStrip.classList.remove("show");
    requestAnimationFrame(function(){ fitCanvases(true); });
  }

  /* Save Snapshot to Persistent Memories & Studio Gallery */
  function activeKidId(){
    try{
      if(window.parent && window.parent.__llActiveProfileId) return window.parent.__llActiveProfileId;
    }catch(e){}
    try{
      var p=localStorage.getItem("hootworld.activeProfile.v1");
      if(p) return p;
    }catch(e){}
    return "kida";
  }
  function galleryKey(){ return "hw.paint.gallery.v1."+activeKidId(); }
  function loadSavedGallery(){
    try{
      var raw=localStorage.getItem(galleryKey());
      var arr=raw?JSON.parse(raw):[];
      galleryItems=Array.isArray(arr)?arr:[];
    }catch(e){ galleryItems=[]; }
    galleryBtn.style.display=galleryItems.length?"grid":"none";
  }
  function persistGallery(){
    try{ localStorage.setItem(galleryKey(), JSON.stringify(galleryItems)); }catch(e){
      while(galleryItems.length>1){
        galleryItems.pop();
        try{ localStorage.setItem(galleryKey(), JSON.stringify(galleryItems)); break; }catch(e2){}
      }
    }
    galleryBtn.style.display=galleryItems.length?"grid":"none";
  }
  function flattenArt(){
    var out=document.createElement("canvas");
    var maxW=720, scale=Math.min(1, maxW/Math.max(1,W));
    out.width=Math.max(160, Math.round(W*scale));
    out.height=Math.max(120, Math.round(H*scale));
    var cx=out.getContext("2d");
    cx.fillStyle=nightPaper?"#13203d":"#fffdf6";
    cx.fillRect(0,0,out.width,out.height);
    cx.drawImage(paintCanvas,0,0,out.width,out.height);
    cx.drawImage(guideCanvas,0,0,out.width,out.height);
    return out.toDataURL("image/jpeg", 0.84);
  }

      return;
    }
    galleryItems.forEach(function(item,idx){
      var src=(typeof item==="string")?item:item.url;
      var d=document.createElement("div");
      d.className="g-item";
      d.innerHTML='<img src="'+src+'" alt="Saved painting">'
        +'<div class="g-item-bar">'
        +'<a class="g-mini" href="'+src+'" download="hoots-painting-'+(idx+1)+'.jpg" aria-label="Download painting">⬇️</a>'
        +'<button class="g-mini" type="button" data-del="'+idx+'" aria-label="Delete painting">🗑️</button>'
        +'</div>';
      d.querySelector("[data-del]").addEventListener("click",function(){
        audio(); popSfx();
        galleryItems.splice(idx,1);
        persistGallery();
        renderGalleryGrid();
      });
      galleryGrid.appendChild(d);
    });
  }
  saveBtn.addEventListener("click",function(){
    audio();
    var url=flattenArt();
    galleryItems.unshift({ url:url, ts:Date.now() });
    if(galleryItems.length>12) galleryItems.length=12;
    persistGallery();
    celebrateHoot();
    sparkleSfx();
    burstSparkles(W/2,H/2,null,22);
    $("savedPreviewImg").src=url;
    $("savedDownloadBtn").href=url;
    $("savedModal").hidden=false;
  });
  $("closeSavedBtn").addEventListener("click",function(){
    audio(); popSfx();
    $("savedModal").hidden=true;
  });

  galleryBtn.addEventListener("click",function(){
    audio(); popSfx();
    renderGalleryGrid();
    galleryModal.hidden=false;
  });
  $("closeGalleryBtn").addEventListener("click",function(){
    audio(); popSfx();
    galleryModal.hidden=true;
  });

  /* Direct tap on Artist Hoot -> cute hop + giggle (belly-only rule!) */
  var lastHootTap=0;
  hootBuddy.addEventListener("click",function(){
    audio();
    celebrateHoot();
    burstSparkles(W-48, H-48, "#ffc93c", 10);
    var now=Date.now();
    if(now-lastHootTap>8000){
      lastHootTap=now;
      clearVoice(true);
      enqueue("hoot-giggle.mp3",{giggle:true});
    } else {
      sparkleSfx();
    }
  });

  window.addEventListener("pagehide",function(){ dead=true; clearVoice(true); });
  document.addEventListener("visibilitychange",function(){ if(document.hidden) clearVoice(false); });

  /* ================= INIT ================= */
  buildPots();
  loadSavedGallery();
  requestAnimationFrame(function(){ fitCanvases(false); });
  enqueue("hoot-game-hello.mp3");

  window.__paintGame={
    snapshot:function(){
      return {
        mode:mode, tool:tool, colour:colour, brushSize:brushSize, mirror:mirror,
        nightPaper:nightPaper, stars:stars, dirty:dirty, galleryCount:galleryItems.length,
        picture:picture, traceKind:traceKind, traceItem:TRACE_SETS[traceKind][traceIdx],
        undoDepth:undoStack.length
      };
    }
  };
})();
</script>
