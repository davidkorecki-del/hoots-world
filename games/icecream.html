<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="icecream";window.__HOOT_SELF_COACH__=true;</script>
<script src="js/hoot-game-head.js?v=llprev3e149"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🍦</text></svg>" />
<title>Hoot's Ice Cream Truck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --outline:#4A2511;
    --ink:#3B1D0E;
    --cream:#FFFDF5;
    --mint:#A7F3D0;
    --mint-deep:#34D399;
    --pink:#FF85B3;
    --pink-deep:#EC4899;
    --gold:#FFD43B;
    --gold-deep:#F59E0B;
    --wood:#D99B58;
    --wood-dark:#9A5B25;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  [hidden]{ display:none !important; }
  html,body{
    margin:0; width:100%; height:100%; overflow:hidden;
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    background:#3B1D0E; touch-action:manipulation;
  }

  /* Full-bleed Ice Cream Truck Stage */
  #stage{
    position:fixed; inset:0; width:100%; height:100dvh; overflow:hidden;
    background:#5C3018;
  }
  #bgLayer{
    position:absolute; inset:0; z-index:0; overflow:hidden;
  }
  #bgImg{
    width:100%; height:100%; object-fit:cover; object-position:50% 48%;
    display:block; pointer-events:none;
    filter:saturate(1.06) brightness(1.02);
  }
  /* Warm subtle sunlight bloom inside the serving window */
  #sunGlow{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse 46% 36% at 50% 34%, rgba(255,250,215,0.28) 0%, rgba(255,244,200,0) 72%);
  }

  /* 60fps Canvas Particle Layer (sprinkles, cream puffs, hearts, frost, confetti) */
  #fxCv{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:20; pointer-events:none; display:block;
  }

  /* GLOW-ONLY ATTENTION PULSES — Never animate transform on clickable buttons! */
  @keyframes glowGold{
    0%, 100%{ box-shadow:0 6px 0 var(--outline), 0 0 12px 2px rgba(255,212,59,.55), inset 0 3px 0 rgba(255,255,255,.7); }
    50%{ box-shadow:0 6px 0 var(--outline), 0 0 30px 10px rgba(255,212,59,.98), inset 0 3px 0 rgba(255,255,255,.9); }
  }
  @keyframes glowPink{
    0%, 100%{ box-shadow:0 6px 0 var(--outline), 0 0 12px 2px rgba(244,114,182,.55), inset 0 3px 0 rgba(255,255,255,.7); }
    50%{ box-shadow:0 6px 0 var(--outline), 0 0 28px 9px rgba(244,114,182,.95), inset 0 3px 0 rgba(255,255,255,.88); }
  }
  @keyframes glowMint{
    0%, 100%{ box-shadow:0 6px 0 var(--outline), 0 0 12px 2px rgba(52,211,153,.55), inset 0 3px 0 rgba(255,255,255,.7); }
    50%{ box-shadow:0 6px 0 var(--outline), 0 0 28px 9px rgba(74,222,128,.96), inset 0 3px 0 rgba(255,255,255,.9); }
  }

  /* Tactile spring button press */
  .spring-btn{
    transition:transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 160ms ease, filter 160ms ease;
  }
  .spring-btn:active{
    transform:translateY(5px) scale(0.94);
  }

  /* Bouncing Visual Guide Pointer (Pre-reader cue!) */
  #guideHand{
    position:fixed; z-index:26; pointer-events:none;
    font-size:38px; line-height:1;
    filter:drop-shadow(0 4px 0 rgba(74,37,17,.65)) drop-shadow(0 8px 14px rgba(0,0,0,.32));
    transition:left 340ms cubic-bezier(0.34, 1.4, 0.64, 1), top 340ms cubic-bezier(0.34, 1.4, 0.64, 1), opacity 220ms ease;
    animation:handBob 0.85s ease-in-out infinite;
    transform-origin:center top;
  }
  @keyframes handBob{
    0%, 100%{ transform:translate(-50%, 0px) rotate(-6deg); }
    50%{ transform:translate(-50%, -11px) rotate(4deg); }
  }

  /* =========================================================================
     TOP HUD — Big Pre-Reader Visual Targets, Zero Text Walls
     ========================================================================= */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:15;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:max(10px, env(safe-area-inset-top)) 14px 0 14px;
    pointer-events:none;
  }
  .hud-left, .hud-right{
    display:flex; align-items:center; gap:8px; pointer-events:auto;
  }

  #hootBtn{
    width:66px; height:66px; min-width:64px; min-height:64px; flex:0 0 auto;
    border-radius:50%; border:4px solid var(--outline);
    background:radial-gradient(circle at 35% 28%, #FFF9D2 0%, #FFD43B 62%, #F59E0B 100%);
    box-shadow:0 6px 0 var(--outline), 0 0 16px rgba(255,212,59,.55), inset 0 3px 0 rgba(255,255,255,.78);
    padding:3px; cursor:pointer; display:grid; place-items:center;
  }

  /* 4-Step Visual Progress Pill (Cone -> Scoop -> Toppings -> Bell) */
  #stepTrack{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,253,245,.95);
    border:4px solid var(--outline); border-radius:999px;
    padding:5px 10px;
    box-shadow:0 6px 0 var(--outline), 0 10px 20px rgba(59,29,14,.28);
  }
  .step-dot{
    width:40px; height:40px; border-radius:50%;
    border:3px solid #D6B28D; background:#FFF3DF;
    display:grid; place-items:center; font-size:20px;
    opacity:0.55; transition:all 260ms cubic-bezier(0.34,1.56,0.64,1);
    position:relative;
  }
  .step-dot.done{
    opacity:1; background:#DCFCE7; border-color:#16A34A;
  }
  .step-dot.active{
    opacity:1; background:linear-gradient(180deg, #FEF08A 0%, #FACC15 100%);
    border-color:var(--outline); transform:scale(1.12);
    box-shadow:0 0 14px rgba(250,204,21,.85);
  }
  .step-arrow{
    font-size:13px; color:#B47B48; font-weight:900;
  }

  /* Stars & Served Pills + Done Button */
  .stat-pill{
    display:flex; align-items:center; gap:5px;
    background:var(--cream); border:4px solid var(--outline); border-radius:999px;
    padding:7px 14px; font-weight:800; font-size:20px; color:var(--ink);
    box-shadow:0 5px 0 var(--outline); min-height:52px;
  }
  #servedPill{
    background:linear-gradient(180deg, #FFF5F8 0%, #FDE2EC 100%);
  }
  #doneBtn{
    min-width:64px; min-height:64px;
    border:4px solid var(--outline); border-radius:999px;
    background:linear-gradient(180deg, #4ADE80 0%, #16A34A 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:18px;
    padding:8px 18px; cursor:pointer; white-space:nowrap;
    box-shadow:0 6px 0 var(--outline), inset 0 3px 0 rgba(255,255,255,.5);
    text-shadow:0 2px 0 rgba(59,29,14,.45);
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
  }

  /* =========================================================================
     INTERACTIVE CENTER PLAYFIELD (Window Customer + Counter Cone + Counter Bells)
     ========================================================================= */
  #playStage{
    position:absolute; inset:0; z-index:6; pointer-events:none;
  }

  /* Serving Window Customer Peeking Over Wooden Counter Sill */
  #customerArea{
    position:absolute; left:63%; bottom:33.5%;
    transform:translateX(-50%);
    width:clamp(220px, 27vw, 305px);
    height:clamp(200px, 32vh, 280px);
    display:flex; align-items:flex-end; justify-content:center;
    pointer-events:none; z-index:4;
    overflow:visible;
  }
  #customerWrap{
    position:relative; width:100%; height:100%;
    display:flex; align-items:flex-end; justify-content:center;
    transition:transform 480ms cubic-bezier(0.34, 1.4, 0.64, 1), opacity 320ms ease;
    transform-origin:center bottom;
  }
  #customerWrap.entering{
    transform:translateY(70px) scale(0.84); opacity:0;
  }
  #customerWrap.leaving{
    transform:translateX(140px) translateY(20px) scale(0.88); opacity:0;
  }
  #customerWrap.idle-bob #customerSvg{
    animation:custBob 2.6s ease-in-out infinite;
  }
  #customerWrap.excited #customerSvg{
    animation:custHop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  }
  #customerWrap.shiver #customerSvg{
    animation:custShiver 0.11s linear infinite;
  }
  #customerSvg{
    width:100%; height:100%; overflow:visible;
    filter:drop-shadow(0 6px 8px rgba(59,29,14,.26));
    transform-origin:center bottom;
  }
  @keyframes custBob{
    0%, 100%{ transform:translateY(0px) rotate(0deg); }
    50%{ transform:translateY(-4px) rotate(1.1deg); }
  }
  @keyframes custHop{
    0%, 100%{ transform:translateY(0px) scale(1, 1); }
    45%{ transform:translateY(-16px) scale(0.97, 1.05); }
    75%{ transform:translateY(2px) scale(1.04, 0.96); }
  }
  @keyframes custShiver{
    0%{ transform:translate(-4px, -2px) rotate(-2deg); }
    25%{ transform:translate(4px, 1px) rotate(2deg); }
    50%{ transform:translate(-3px, 2px) rotate(-1.5deg); }
    75%{ transform:translate(3px, -1px) rotate(1.5deg); }
    100%{ transform:translate(-4px, -2px) rotate(-2deg); }
  }

  /* Customer Visual Reaction Bubble (Pure emoji/icon — zero text walls!) */
  #custBubble{
    position:absolute; right:-14px; top:8%;
    min-width:64px; height:64px; padding:7px 11px;
    background:rgba(255,253,245,.97);
    border:4px solid var(--outline); border-radius:26px;
    box-shadow:0 6px 0 var(--outline), 0 10px 18px rgba(59,29,14,.24);
    display:flex; align-items:center; justify-content:center; gap:4px;
    font-size:32px;
    transform-origin:left bottom;
    animation:bubbleFloat 2.2s ease-in-out infinite;
  }
  #custBubble::after{
    content:""; position:absolute; left:-10px; bottom:12px;
    width:16px; height:16px; background:var(--cream);
    border-left:4px solid var(--outline); border-bottom:4px solid var(--outline);
    transform:rotate(32deg); border-radius:3px;
  }
  @keyframes bubbleFloat{
    0%, 100%{ transform:translateY(0px) scale(1); }
    50%{ transform:translateY(-5px) scale(1.04); }
  }

  /* =========================================================================
     HERO ICE CREAM CREATION STAGE (Standing Proudly on the Wooden Counter!)
     ========================================================================= */
  #coneStage{
    position:absolute; left:42%; bottom:128px;
    transform:translateX(-50%);
    width:clamp(210px, 26vw, 272px);
    height:clamp(275px, 44vh, 366px);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:8; pointer-events:none;
  }
  #iceCreamGroup{
    transition:transform 580ms cubic-bezier(0.34, 1.32, 0.64, 1);
    transform-box:fill-box; transform-origin:center bottom;
  }
  #coneStage.serving-up #iceCreamGroup{
    transform:translate(112px, -62px) rotate(11deg) scale(0.86);
  }
  #coneStage.bitten #iceCreamGroup{
    transform:translate(106px, -54px) rotate(5deg) scale(0.83);
  }
  #coneSvg{
    width:100%; height:100%; overflow:visible;
    filter:drop-shadow(0 10px 12px rgba(59,29,14,.34));
  }

  /* Squash & Stretch Physics Keyframes for Vessel, Scoops, Whip, Cherry, Drizzle */
  @keyframes vesselPop{
    0%{ transform:translateY(40px) scale(0.4, 1.45); opacity:0; }
    55%{ transform:translateY(-8px) scale(1.12, 0.88); opacity:1; }
    78%{ transform:translateY(3px) scale(0.96, 1.05); }
    100%{ transform:translateY(0) scale(1, 1); opacity:1; }
  }
  @keyframes scoopDrop{
    0%{ transform:translateY(-130px) scale(0.76, 1.32); opacity:0; }
    20%{ opacity:1; }
    62%{ transform:translateY(6px) scale(1.24, 0.72); }
    78%{ transform:translateY(-9px) scale(0.92, 1.11); }
    90%{ transform:translateY(2px) scale(1.04, 0.96); }
    100%{ transform:translateY(0) scale(1, 1); opacity:1; }
  }
  @keyframes whipSwirlIn{
    0%{ transform:translateY(-55px) scale(0.3, 1.4); opacity:0; }
    60%{ transform:translateY(4px) scale(1.18, 0.82); opacity:1; }
    82%{ transform:translateY(-4px) scale(0.95, 1.06); }
    100%{ transform:translateY(0) scale(1, 1); opacity:1; }
  }
  @keyframes cherryPlop{
    0%{ transform:translateY(-110px) scale(0.7, 1.35) rotate(-18deg); opacity:0; }
    58%{ transform:translateY(6px) scale(1.25, 0.74) rotate(8deg); opacity:1; }
    78%{ transform:translateY(-8px) scale(0.94, 1.08) rotate(-4deg); }
    100%{ transform:translateY(0) scale(1, 1) rotate(0deg); opacity:1; }
  }
  @keyframes drizzlePour{
    0%{ transform:scaleY(0.1); opacity:0; }
    45%{ opacity:1; }
    100%{ transform:scaleY(1); opacity:1; }
  }
  @keyframes sprinklesPop{
    0%{ transform:translateY(-46px) scale(0.7); opacity:0; }
    65%{ transform:translateY(4px) scale(1.06); opacity:1; }
    100%{ transform:translateY(0) scale(1); opacity:1; }
  }
  .anim-vessel{ transform-box:fill-box; transform-origin:center bottom; animation:vesselPop 460ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  .anim-scoop{ transform-box:fill-box; transform-origin:center bottom; animation:scoopDrop 520ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  .anim-whip{ transform-box:fill-box; transform-origin:center bottom; animation:whipSwirlIn 440ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  .anim-cherry{ transform-box:fill-box; transform-origin:center bottom; animation:cherryPlop 480ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  .anim-drizzle{ transform-box:fill-box; transform-origin:center top; animation:drizzlePour 440ms ease-out both; }
  .anim-sprinkles{ transform-box:fill-box; transform-origin:center center; animation:sprinklesPop 420ms ease-out both; }

  /* Subtle glowing dotted silhouette on counter during Step 1 */
  #emptyHint{
    transition:opacity 240ms ease;
    animation:hintPulse 1.6s ease-in-out infinite;
  }
  @keyframes hintPulse{
    0%, 100%{ opacity:0.65; }
    50%{ opacity:1; }
  }

  /* =========================================================================
     COUNTER SIDE ACTION BUTTONS (Toppings Jump Button + Giant Shiny Serve Bell!)
     ========================================================================= */
  #goToppingsBtn{
    position:absolute; left:clamp(14px, 6vw, 84px); bottom:146px; z-index:12;
    pointer-events:auto;
    min-width:86px; min-height:86px; padding:8px 14px;
    border-radius:28px; border:4px solid var(--outline);
    background:linear-gradient(180deg, #FCE7F3 0%, #F472B6 100%);
    color:#fff; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:15px;
    text-shadow:0 2px 0 rgba(74,37,17,.5);
    animation:glowPink 1.25s ease-in-out infinite;
  }
  #backScoopBtn{
    position:absolute; left:clamp(14px, 6vw, 84px); bottom:146px; z-index:12;
    pointer-events:auto;
    min-width:78px; min-height:78px; padding:8px 12px;
    border-radius:26px; border:4px solid var(--outline);
    background:linear-gradient(180deg, #FEF3C7 0%, #FBBF24 100%);
    color:var(--ink); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:14px;
    box-shadow:0 6px 0 var(--outline), inset 0 3px 0 rgba(255,255,255,.7);
  }

  /* Giant Shiny Brass Serve Bell (Always tappable once >=1 scoop!) */
  #serveBellBtn{
    position:absolute; right:clamp(14px, 6vw, 84px); bottom:142px; z-index:12;
    pointer-events:auto;
    width:98px; height:98px; min-width:86px; min-height:86px;
    border-radius:50%; border:5px solid var(--outline);
    background:radial-gradient(circle at 32% 24%, #FFFCE0 0%, #FDE047 45%, #F59E0B 100%);
    cursor:pointer; padding:6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    animation:glowGold 1.1s ease-in-out infinite;
  }
  #serveBellBtn.ringing svg{
    animation:bellShake 0.45s ease-in-out;
  }
  @keyframes bellShake{
    0%,100%{ transform:rotate(0deg); }
    20%{ transform:rotate(-16deg) scale(1.08); }
    45%{ transform:rotate(14deg) scale(1.08); }
    70%{ transform:rotate(-9deg); }
    85%{ transform:rotate(6deg); }
  }
  .bell-tag{
    position:absolute; bottom:-12px; left:50%; transform:translateX(-50%);
    background:#16A34A; color:#fff; border:3px solid var(--outline); border-radius:999px;
    padding:2px 11px; font-size:13px; font-weight:800; white-space:nowrap;
    box-shadow:0 3px 0 var(--outline);
  }

  /* =========================================================================
     BOTTOM TACTILE COUNTER DOCK (All Targets >= 68px!)
     ========================================================================= */
  #counterDock{
    position:absolute; left:50%; bottom:max(10px, env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:14;
    width:min(96vw, 680px);
    background:linear-gradient(180deg, #FFFBF0 0%, #FDE8C8 100%);
    border:5px solid var(--outline);
    outline:3px solid #FF9BC2; outline-offset:-9px;
    border-radius:30px; padding:10px 14px;
    box-shadow:0 9px 0 #3B1D0E, 0 16px 32px rgba(0,0,0,.42);
    display:flex; align-items:center; justify-content:center;
  }
  .dock-row{
    display:flex; align-items:center; justify-content:center; gap:12px; width:100%;
  }

  /* Step 1: Big Glossy Vessel Choice Buttons */
  .vessel-btn{
    flex:1 1 0; min-width:86px; max-width:168px; min-height:90px;
    border-radius:24px; border:4px solid var(--outline);
    background:linear-gradient(180deg, #FFFFFF 0%, #FFF1D6 100%);
    cursor:pointer; padding:6px 8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    animation:glowGold 1.45s ease-in-out infinite;
    color:var(--ink); font-family:"Fredoka",sans-serif; font-weight:800; font-size:15px;
  }
  .vessel-btn svg{ width:56px; height:58px; overflow:visible; pointer-events:none; }

  /* Step 2: 4 Big Retro Flavor Pull-Lever Buttons */
  .flavor-btn{
    position:relative; flex:1 1 0; min-width:74px; max-width:142px; min-height:92px;
    border-radius:24px; border:4px solid var(--outline);
    cursor:pointer; padding:6px 6px 6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--ink); font-family:"Fredoka",sans-serif; font-weight:800; font-size:14px;
    box-shadow:0 6px 0 var(--outline), inset 0 3px 0 rgba(255,255,255,.78);
  }
  .flavor-btn.strawberry{ background:linear-gradient(180deg, #FFE4EE 0%, #FF9BC2 100%); }
  .flavor-btn.vanilla{    background:linear-gradient(180deg, #FFFDF5 0%, #FDE68A 100%); }
  .flavor-btn.chocolate{  background:linear-gradient(180deg, #E8C5A5 0%, #B87344 100%); color:#FFFDF5; text-shadow:0 2px 0 #4A2511; }
  .flavor-btn.rainbow{    background:linear-gradient(135deg, #FFC2DC 0%, #BAE6FD 50%, #FDE68A 100%); }
  .flavor-btn.pulse{ animation:glowPink 1.35s ease-in-out infinite; }
  .flavor-btn svg{ width:54px; height:54px; overflow:visible; pointer-events:none; }
  .lever-arm{ transform-origin:50% 75%; transition:transform 180ms cubic-bezier(0.34,1.56,0.64,1); }
  .flavor-btn.pulled .lever-arm{ transform:scaleY(0.55) translateY(10px); }

  /* Step 3: 4 Big Topping Dispenser Buttons */
  .top-btn{
    position:relative; flex:1 1 0; min-width:74px; max-width:142px; min-height:92px;
    border-radius:24px; border:4px solid var(--outline);
    background:linear-gradient(180deg, #FFFFFF 0%, #E0F2FE 100%);
    cursor:pointer; padding:6px 6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--ink); font-family:"Fredoka",sans-serif; font-weight:800; font-size:14px;
    box-shadow:0 6px 0 var(--outline), inset 0 3px 0 rgba(255,255,255,.82);
  }
  .top-btn.sprinkles{ background:linear-gradient(180deg, #FFF8E7 0%, #FBCFE8 100%); }
  .top-btn.drizzle{   background:linear-gradient(180deg, #FEF3C7 0%, #D6A276 100%); }
  .top-btn.whip{      background:linear-gradient(180deg, #FFFFFF 0%, #DBEAFE 100%); }
  .top-btn.cherry{    background:linear-gradient(180deg, #FFE4E6 0%, #FCA5A5 100%); }
  .top-btn.suggest{   animation:glowMint 1.3s ease-in-out infinite; }
  .top-btn svg{ width:54px; height:54px; overflow:visible; pointer-events:none; }
  .top-check{
    position:absolute; top:-8px; right:-6px;
    width:26px; height:26px; border-radius:50%;
    background:#22C55E; color:#fff; border:3px solid var(--outline);
    display:grid; place-items:center; font-size:14px; font-weight:900;
    box-shadow:0 3px 0 var(--outline);
  }

  /* Step 4: Serving Celebration Action */
  #nextCustomerBtn{
    min-height:74px; min-width:236px; padding:10px 30px;
    border-radius:999px; border:5px solid var(--outline);
    background:linear-gradient(180deg, #4ADE80 0%, #16A34A 100%);
    color:#fff; font-family:"Fredoka",sans-serif; font-weight:800; font-size:24px;
    text-shadow:0 3px 0 rgba(59,29,14,.5);
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:10px;
    animation:glowMint 1.15s ease-in-out infinite;
  }

  /* Floating Scoop Count Pop Badge on Counter */
  #scoopCounterBadge{
    position:absolute; left:42%; bottom:44%;
    transform:translate(-50%, 0); z-index:16; pointer-events:none;

<script>
(function(){
  "use strict";

  /* =========================================================================
     1. VERIFIED SINGLE-CHANNEL HOOT VOICE ENGINE (ZERO SYNTHESIS!)
        Every .mp3 path verified against git ls-tree origin/main assets/voice/
     ========================================================================= */
  var voiceA = new Audio();
  var lastIdleClip = "hoot-idle-tap";
  var idleTimer = null, idleReminded = false;
  var PRAISE_CLIPS = ["hoot-amazing", "hoot-great-job", "hoot-win-yay", "hoot-super", "hoot-yay-2", "hoot-nice-2", "hoot-win-star"];
  var BITE_CLIPS   = ["hoot-feed-bite-1", "hoot-feed-bite-2", "hoot-feed-bite-3"];
  var praiseIdx = 0, biteIdx = 0;

  function stopParentVoice(){
    try{
      if(window.parent && window.parent !== window){
        if(window.parent.__hwStopIntro) window.parent.__hwStopIntro();
        if(window.parent.__hootStopClip) window.parent.__hootStopClip();
      }
    }catch(e){}
  }

  function playVoice(id){
    if(!id) return;
    stopParentVoice();
    try{ voiceA.pause(); voiceA.currentTime = 0; }catch(e){}
    voiceA.src = "assets/voice/" + id + ".mp3";
    var p = voiceA.play();
    if(p && p.catch) p.catch(function(){});
  }

  function armIdle(){
    if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    if(!winOverlay.hidden || idleReminded) return;
    idleTimer = setTimeout(function(){
      if(!winOverlay.hidden) return;
      idleReminded = true;
      playVoice(lastIdleClip);
    }, 12500);
  }
  window.addEventListener("pointerdown", function(){
    idleReminded = false;
    armIdle();
  }, true);
  window.addEventListener("pagehide", function(){
    try{ voiceA.pause(); }catch(e){}
    if(idleTimer) clearTimeout(idleTimer);
  });

  /* =========================================================================
     2. TACTILE ICE CREAM SHOP WEBAUDIO FOLEY SFX ENGINE
     ========================================================================= */
  var actx = null;
  function ac(){
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
    }catch(e){}
    return actx;
  }
  var PENTA = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];

  function sfxConePop(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime;
      var o = c.createOscillator(), g = c.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(240, t);
      o.frequency.exponentialRampToValueAtTime(520, t + 0.09);
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.17);
    }catch(e){}
  }

  function sfxScoopPlop(n){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime;
      /* Soft lever click + creamy plop bounce */
      var o1 = c.createOscillator(), g1 = c.createGain();
      o1.type = "sine";
      var base = 290 + (n || 1) * 75;
      o1.frequency.setValueAtTime(base * 0.65, t);
      o1.frequency.exponentialRampToValueAtTime(base * 1.38, t + 0.09);
      o1.frequency.exponentialRampToValueAtTime(base * 1.05, t + 0.19);
      g1.gain.setValueAtTime(0.24, t);
      g1.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      o1.connect(g1); g1.connect(c.destination);
      o1.start(t); o1.stop(t + 0.25);
    }catch(e){}
  }

  function sfxSprinkles(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime;
      for(var i = 0; i < 6; i++){
        var o = c.createOscillator(), g = c.createGain();
        o.type = "triangle";
        o.frequency.value = PENTA[(i * 2) % PENTA.length] * (1.45 + Math.random() * 0.4);
        var dt = i * 0.042;
        g.gain.setValueAtTime(0.09, t + dt);
        g.gain.exponentialRampToValueAtTime(0.001, t + dt + 0.07);
        o.connect(g); g.connect(c.destination);
        o.start(t + dt); o.stop(t + dt + 0.08);
      }
    }catch(e){}
  }

  function sfxDrizzle(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime;
      var o = c.createOscillator(), g = c.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(420, t);
      o.frequency.exponentialRampToValueAtTime(190, t + 0.16);
      o.frequency.exponentialRampToValueAtTime(340, t + 0.30);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.35);
    }catch(e){}
  }

  function sfxWhipSwirl(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime, len = Math.floor(c.sampleRate * 0.24);
      var buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / len) * Math.PI);
      var src = c.createBufferSource(); src.buffer = buf;
      var flt = c.createBiquadFilter(); flt.type = "bandpass";
      flt.frequency.setValueAtTime(1100, t);
      flt.frequency.exponentialRampToValueAtTime(2400, t + 0.22);
      flt.Q.value = 1.6;
      var g = c.createGain();
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      src.connect(flt); flt.connect(g); g.connect(c.destination);
      src.start(t);
    }catch(e){}
  }

  function sfxCherryPop(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime;
      [659.25, 1046.5].forEach(function(f, idx){
        var o = c.createOscillator(), g = c.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(f, t + idx * 0.06);
        g.gain.setValueAtTime(0.16, t + idx * 0.06);
        g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.06 + 0.22);
        o.connect(g); g.connect(c.destination);
        o.start(t + idx * 0.06); o.stop(t + idx * 0.06 + 0.24);
      });
    }catch(e){}
  }

  function sfxBellDing(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime;
      [1318.5, 2637.0, 3955.5].forEach(function(f, k){
        var o = c.createOscillator(), g = c.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.16 / (k + 1), t);
        g.gain.exponentialRampToValueAtTime(0.0008, t + 0.92 - k * 0.16);
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + 0.96);
      });
    }catch(e){}
  }

  function sfxShiver(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime;
      for(var i = 0; i < 6; i++){
        var o = c.createOscillator(), g = c.createGain();
        o.type = "triangle";
        o.frequency.value = (i % 2 === 0 ? 920 : 1140) + i * 35;
        g.gain.setValueAtTime(0.08, t + i * 0.06);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.06);
        o.connect(g); g.connect(c.destination);
        o.start(t + i * 0.06); o.stop(t + i * 0.06 + 0.07);
      }
    }catch(e){}
  }

  function sfxCheer(){
    try{
      var c = ac(); if(!c) return;
      var t = c.currentTime;
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function(f, k){
        var o = c.createOscillator(), g = c.createGain();
        o.type = "triangle"; o.frequency.value = f;
        g.gain.setValueAtTime(0.12, t + k * 0.055);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.42 + k * 0.055);
        o.connect(g); g.connect(c.destination);
        o.start(t + k * 0.055); o.stop(t + 0.45 + k * 0.055);
      });
    }catch(e){}
  }

  /* =========================================================================
     3. 60FPS PARTICLE FX CANVAS (Sprinkles, Cream Puffs, Hearts, Frost, Confetti)
     ========================================================================= */
  var fxCv = document.getElementById("fxCv");
  var fctx = fxCv.getContext("2d");
  var W = 1024, H = 768, DPR = 1;
  var particles = [];

  function resizeFx(){
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    fxCv.width = W * DPR; fxCv.height = H * DPR;
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resizeFx);
  resizeFx();

  function centerOf(el){
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width * 0.5, y: r.top + r.height * 0.5, r: r };
  }

  function spawnCreamPuffs(x, y, col){
    for(var i = 0; i < 12; i++){
      var a = (i / 12) * Math.PI * 2 + Math.random() * 0.35;
      var spd = 48 + Math.random() * 110;
      particles.push({
        kind: "puff", x: x + (Math.random() - 0.5) * 32, y: y + (Math.random() - 0.5) * 14,
        vx: Math.cos(a) * spd, vy: Math.sin(a) * spd * 0.6 - 24,
        r: 9 + Math.random() * 12, col: col || "#FFFDF5",
        life: 1, decay: 1.55
      });
    }
  }

  function spawnSprinkleRain(cx, topY){
    var cols = ["#EF4444", "#FACC15", "#38BDF8", "#4ADE80", "#F472B6", "#C084FC", "#FB923C"];
    for(var i = 0; i < 32; i++){
      particles.push({
        kind: "sprinkle",
        x: cx + (Math.random() - 0.5) * 130,
        y: topY - 20 - Math.random() * 90,
        vx: (Math.random() - 0.5) * 55,
        vy: 150 + Math.random() * 150,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 10,
        col: cols[i % cols.length],
        life: 1, decay: 0.95 + Math.random() * 0.35
      });
    }
  }

  function spawnChocDrops(cx, topY){
    for(var i = 0; i < 16; i++){
      particles.push({
        kind: "drop",
        x: cx + (Math.random() - 0.5) * 90,
        y: topY - 10 - Math.random() * 55,
        vx: (Math.random() - 0.5) * 35,
        vy: 140 + Math.random() * 110,
        r: 5 + Math.random() * 5,
        col: "#5C2A12",
        life: 1, decay: 1.2
      });
    }
  }

  function spawnHearts(x, y, count){
    var cols = ["#FF4D79", "#FF85B3", "#FFD43B", "#FB7185"];
    for(var i = 0; i < (count || 14); i++){
      particles.push({
        kind: "heart",
        x: x + (Math.random() - 0.5) * 140,
        y: y + (Math.random() - 0.5) * 50,
        vx: (Math.random() - 0.5) * 60,
        vy: -(75 + Math.random() * 95),
        r: 13 + Math.random() * 11,
        col: cols[i % cols.length],
        rot: (Math.random() - 0.5) * 0.45,
        life: 1, decay: 0.62 + Math.random() * 0.22
      });
    }
  }

  function spawnFrost(x, y, count){
    var cols = ["#BAE6FD", "#7DD3FC", "#E0F2FE", "#FFFFFF"];
    for(var i = 0; i < (count || 18); i++){
      var a = Math.random() * Math.PI * 2;
      var spd = 55 + Math.random() * 120;
      particles.push({
        kind: "frost",
        x: x + (Math.random() - 0.5) * 110,
        y: y + (Math.random() - 0.5) * 70,
        vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 35,
        r: 7 + Math.random() * 7,
        col: cols[i % cols.length],
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 5,
        life: 1, decay: 0.8 + Math.random() * 0.3
      });
    }
  }

  function spawnSparkles(x, y, count){
    var cols = ["#FFD43B", "#FF85B3", "#4ADE80", "#38BDF8", "#FFFFFF", "#FB923C"];
    for(var i = 0; i < (count || 20); i++){
      var a = (i / (count || 20)) * Math.PI * 2 + Math.random() * 0.25;
      var spd = 85 + Math.random() * 195;
      particles.push({
        kind: "sparkle",
        x: x, y: y,
        vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 65,
        r: 5 + Math.random() * 6,
        col: cols[i % cols.length],
        life: 1, decay: 0.9 + Math.random() * 0.35
      });
    }
  }

  function drawHeart(x, y, r, col, rot){
    fctx.save();
    fctx.translate(x, y); fctx.rotate(rot || 0);
    fctx.fillStyle = col; fctx.strokeStyle = "#4A2511"; fctx.lineWidth = 2.4;
    fctx.beginPath();
    fctx.moveTo(0, r * 0.35);
    fctx.bezierCurveTo(-r, -r * 0.45, -r * 0.95, -r * 1.15, 0, -r * 0.42);
    fctx.bezierCurveTo(r * 0.95, -r * 1.15, r, -r * 0.45, 0, r * 0.35);
    fctx.fill(); fctx.stroke();
    fctx.restore();
  }

  var lastT = performance.now();
  function fxTick(now){
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    if(particles.length){
      fctx.clearRect(0, 0, W, H);
      for(var i = particles.length - 1; i >= 0; i--){
        var p = particles[i];
        p.life -= dt * p.decay;
        if(p.life <= 0){ particles.splice(i, 1); continue; }
        if(p.kind === "sparkle" || p.kind === "sprinkle" || p.kind === "drop") p.vy += 260 * dt;
        if(p.vr) p.rot += p.vr * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;

        fctx.save();
        fctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        if(p.kind === "puff"){
          fctx.fillStyle = p.col; fctx.strokeStyle = "#4A2511"; fctx.lineWidth = 2;
          fctx.beginPath(); fctx.arc(p.x, p.y, p.r * (0.6 + p.life * 0.6), 0, Math.PI * 2);
          fctx.fill(); fctx.stroke();
        } else if(p.kind === "sprinkle"){
          fctx.translate(p.x, p.y); fctx.rotate(p.rot);
          fctx.fillStyle = p.col; fctx.strokeStyle = "#4A2511"; fctx.lineWidth = 1.6;
          fctx.beginPath();
          fctx.roundRect(-6, -2.5, 12, 5, 2.5);
          fctx.fill(); fctx.stroke();
        } else if(p.kind === "drop"){
          fctx.fillStyle = p.col; fctx.strokeStyle = "#4A2511"; fctx.lineWidth = 1.6;
          fctx.beginPath(); fctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          fctx.fill(); fctx.stroke();
        } else if(p.kind === "heart"){
          drawHeart(p.x, p.y, p.r * (0.75 + p.life * 0.3), p.col, p.rot);
        } else if(p.kind === "frost"){
          fctx.translate(p.x, p.y); fctx.rotate(p.rot);
          fctx.strokeStyle = p.col; fctx.lineWidth = 2.8; fctx.lineCap = "round";
          for(var s = 0; s < 3; s++){
            fctx.rotate(Math.PI / 3);
            fctx.beginPath(); fctx.moveTo(-p.r, 0); fctx.lineTo(p.r, 0); fctx.stroke();
          }
        } else if(p.kind === "sparkle"){
          fctx.fillStyle = p.col; fctx.strokeStyle = "#4A2511"; fctx.lineWidth = 1.8;
          fctx.beginPath(); fctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
          fctx.fill(); fctx.stroke();
        }
        fctx.restore();
      }
      if(!particles.length) fctx.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(fxTick);
  }
  requestAnimationFrame(fxTick);

  /* =========================================================================
     4. ILLUSTRATED STORYBOOK ANIMAL CUSTOMERS (Crisp Thick-Outlined SVG!)
        0: Bunny  |  1: Puppy  |  2: Bear  |  3: Baby Dino
     ========================================================================= */
  var CUSTOMERS = [
    { key: "bunny", name: "Bunny", crave: "🍓" },
    { key: "puppy", name: "Puppy", crave: "🍫" },
    { key: "bear",  name: "Bear",  crave: "🍨" },
    { key: "dino",  name: "Baby Dino", crave: "🌈" }
  ];

  function buildCustomerSVG(key, mood){

  /* Vertical stacking coordinates for scoops 0, 1, 2 (base Y depends slightly on cone vs cup) */
  function scoopCenterY(idx){
    var base = (state.vessel === "cup") ? 202 : 196;
    return base - idx * 54;
  }

  function scoopSVG(flavor, idx){
    var m = FLAVOR_META[flavor] || FLAVOR_META.strawberry;
    var cy = scoopCenterY(idx);
    var r  = 46 - idx * 2.5;
    var cx = 130 + (idx === 1 ? -3 : (idx === 2 ? 2 : 0));

    var extra = "";
    if(m.seeds){
      extra = '<circle cx="'+(cx-16)+'" cy="'+(cy+6)+'" r="2.2" fill="#BE185D" opacity="0.65"/>' +
              '<circle cx="'+(cx+14)+'" cy="'+(cy-4)+'" r="2.2" fill="#BE185D" opacity="0.65"/>' +
              '<circle cx="'+(cx+4)+'" cy="'+(cy+12)+'" r="2.2" fill="#BE185D" opacity="0.65"/>' +
              '<circle cx="'+(cx-4)+'" cy="'+(cy-14)+'" r="2" fill="#BE185D" opacity="0.55"/>';

      extra = '<path d="M'+(cx-r*0.72)+' '+(cy+4)+' Q'+cx+' '+(cy-18)+' '+(cx+r*0.72)+' '+(cy-2)+'" fill="none" stroke="#FFF" stroke-width="5.5" stroke-linecap="round" opacity="0.52"/>' +
              '<path d="M'+(cx-r*0.55)+' '+(cy+16)+' Q'+(cx+4)+' '+(cy+2)+' '+(cx+r*0.62)+' '+(cy+14)+'" fill="none" stroke="#FF85B3" stroke-width="5" stroke-linecap="round" opacity="0.5"/>';

              '<circle cx="'+(cx+16)+'" cy="'+(cy+2)+'" r="1.6" fill="#92400E" opacity="0.5"/>' +
              '<circle cx="'+(cx+2)+'" cy="'+(cy-10)+'" r="1.5" fill="#92400E" opacity="0.45"/>';

      extra = '<path d="M'+(cx-18)+' '+(cy+12)+' Q'+cx+' '+(cy+22)+' '+(cx+20)+' '+(cy+10)+'" fill="none" stroke="#4A220D" stroke-width="4" stroke-linecap="round" opacity="0.42"/>';
    }

    /* Lush thick-outlined dome with scalloped ruffled creamy skirt! */
    return '<g class="anim-scoop" data-scoop-idx="'+idx+'">' +
      '<path d="M'+(cx-r)+' '+(cy+12)+' ' +
        'C'+(cx-r)+' '+(cy-r*0.92)+' '+(cx-r*0.42)+' '+(cy-r*1.04)+' '+cx+' '+(cy-r*1.04)+' ' +

        'C'+(cx-r*0.08)+' '+(cy+35)+' '+(cx-r*0.28)+' '+(cy+35)+' '+(cx-r*0.44)+' '+(cy+27)+' ' +
        'C'+(cx-r*0.70)+' '+(cy+34)+' '+(cx-r-7)+' '+(cy+24)+' '+(cx-r)+' '+(cy+12)+' Z" ' +
        'fill="'+m.fill+'" stroke="#4A2511" stroke-width="4.4" stroke-linejoin="round"/>' +

  function topScoopPeakY(){

    var r  = 46 - topIdx * 2.5;

        'C'+(cx+r*0.82)+' '+(cy+14)+' '+(cx+r*0.62)+' '+(cy+26)+' '+(cx+r*0.52)+' '+(cy+12)+' ' +
        'C'+(cx+r*0.42)+' '+(cy+2)+' '+(cx+r*0.32)+' '+(cy+28)+' '+(cx+r*0.18)+' '+(cy+24)+' ' +
        'C'+(cx+r*0.04)+' '+(cy+20)+' '+(cx+r*0.02)+' '+(cy+2)+' '+(cx-r*0.12)+' '+(cy+16)+' ' +
        'C'+(cx-r*0.26)+' '+(cy+32)+' '+(cx-r*0.44)+' '+(cy+22)+' '+(cx-r*0.44)+' '+(cy+8)+' ' +
        'C'+(cx-r*0.54)+' '+(cy+22)+' '+(cx-r*0.76)+' '+(cy+14)+' '+(cx-r*0.78)+' '+(cy-4)+' Z" ' +
        'fill="url(#gSyrup)" stroke="#4A2511" stroke-width="3.2" stroke-linejoin="round"/>' +
      '<path d="M'+(cx-r*0.35)+' '+(yTop+10)+' Q'+(cx-r*0.1)+' '+(yTop+5)+' '+(cx+r*0.22)+' '+(yTop+9)+'" fill="none" stroke="#B87344" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>' +
    '</g>';
  }

  function sprinklesSVG(){
    if(state.scoops.length === 0) return "";
    var cols = ["#EF4444", "#FACC15", "#38BDF8", "#4ADE80", "#F472B6", "#C084FC", "#FB923C"];
    var out = '<g class="anim-sprinkles">';
    var pts = [
      [-26, -12, -28], [-12, -24, 18], [6, -26, -14], [22, -16, 32],
      [-30, 6, 22], [-10, 2, -35], [12, 4, 24], [28, 8, -20],
      [-20, 18, 12], [2, 16, -24], [18, 20, 36]
    ];
    for(var s = 0; s < state.scoops.length; s++){
      var cy = scoopCenterY(s);
      var cx = 130 + (s === 1 ? -3 : (s === 2 ? 2 : 0));
      var sc = (46 - s * 2.5) / 46;
      for(var i = 0; i < pts.length; i++){
        if(s < state.scoops.length - 1 && i < 4) continue; /* only top visible surface on lower scoops */
        var px = cx + pts[i][0] * sc;
        var py = cy + pts[i][1] * sc;
        var rot = pts[i][2] + s * 17;
        var col = cols[(i + s * 3) % cols.length];
        out += '<rect x="'+(px-5.5)+'" y="'+(py-2.3)+'" width="11" height="4.6" rx="2.3" fill="'+col+'" stroke="#4A2511" stroke-width="1.5" transform="rotate('+rot+' '+px+' '+py+')"/>';
      }
    }
    out += '</g>';
    return out;
  }

  function whipSVG(){
    var py = topScoopPeakY() + 8;
    var cx = 130 + (state.scoops.length === 2 ? -3 : (state.scoops.length === 3 ? 2 : 0));
    return '<g class="anim-whip">' +
      '<path d="M'+(cx-30)+' '+(py+4)+' C'+(cx-36)+' '+(py+2)+' '+(cx-35)+' '+(py-12)+' '+(cx-22)+' '+(py-12)+' ' +
        'C'+(cx-26)+' '+(py-23)+' '+(cx-12)+' '+(py-28)+' '+(cx-4)+' '+(py-26)+' ' +
        'C'+(cx-4)+' '+(py-38)+' '+(cx+6)+' '+(py-44)+' '+(cx+11)+' '+(py-41)+' ' +
        'C'+(cx+8)+' '+(py-32)+' '+(cx+14)+' '+(py-27)+' '+(cx+21)+' '+(py-22)+' ' +
        'C'+(cx+31)+' '+(py-18)+' '+(cx+32)+' '+(py-8)+' '+(cx+25)+' '+(py-5)+' ' +
        'C'+(cx+35)+' '+(py-2)+' '+(cx+34)+' '+(py+8)+' '+(cx+25)+' '+(py+8)+' Z" ' +
        'fill="url(#gWhip)" stroke="#4A2511" stroke-width="3.8" stroke-linejoin="round"/>' +
      '<path d="M'+(cx-20)+' '+(py-2)+' Q'+cx+' '+(py-8)+' '+(cx+20)+' '+(py-2)+' M'+(cx-14)+' '+(py-14)+' Q'+cx+' '+(py-18)+' '+(cx+14)+' '+(py-14)+'" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>' +
    '</g>';
  }

  function cherrySVG(){
    var py = topScoopPeakY() + (state.toppings.whip ? -30 : -2);
    var cx = 130 + (state.scoops.length === 2 ? -3 : (state.scoops.length === 3 ? 2 : 0));
    return '<g class="anim-cherry">' +
      '<path d="M'+cx+' '+(py-10)+' C'+(cx+4)+' '+(py-28)+' '+(cx+18)+' '+(py-36)+' '+(cx+28)+' '+(py-32)+'" fill="none" stroke="#4A2511" stroke-width="4.2" stroke-linecap="round"/>' +
      '<path d="M'+(cx+10)+' '+(py-24)+' Q'+(cx+20)+' '+(py-34)+' '+(cx+26)+' '+(py-24)+' Q'+(cx+17)+' '+(py-18)+' '+(cx+10)+' '+(py-24)+' Z" fill="#4ADE80" stroke="#4A2511" stroke-width="2.6" stroke-linejoin="round"/>' +
      '<circle cx="'+cx+'" cy="'+py+'" r="17.5" fill="url(#gCherry)" stroke="#4A2511" stroke-width="3.8"/>' +
      '<ellipse cx="'+(cx-6)+'" cy="'+(py-6)+'" rx="5.5" ry="3.5" fill="#FFF" opacity="0.82" transform="rotate(-30 '+(cx-6)+' '+(py-6)+')"/>' +
    '</g>';
  }

  /* =========================================================================
     6. GAME STATE MACHINE & UI CONTROLLER
     ========================================================================= */
  var state = {
    step: "cone",          /* "cone" | "scoop" | "toppings" | "serve" */
    vessel: null,          /* null | "waffle" | "chocdip" | "cup" */
    scoops: [],            /* array of flavor keys, max 3 */
    toppings: { sprinkles: false, drizzle: false, whip: false, cherry: false },
    toppingsCount: 0,
    customerIdx: 0,
    servedCount: 0,
    stars: 0,
    servingBusy: false
  };

  /* DOM References */
  var sdCone = document.getElementById("sdCone");
  var sdScoop = document.getElementById("sdScoop");
  var sdTop = document.getElementById("sdTop");
  var sdServe = document.getElementById("sdServe");
  var servedCountEl = document.getElementById("servedCountEl");
  var starCountEl = document.getElementById("starCountEl");
  var customerWrap = document.getElementById("customerWrap");
  var customerSvg = document.getElementById("customerSvg");
  var custBubble = document.getElementById("custBubble");
  var coneStage = document.getElementById("coneStage");
  var emptyHint = document.getElementById("emptyHint");
  var vesselLayer = document.getElementById("vesselLayer");
  var scoopsLayer = document.getElementById("scoopsLayer");
  var toppingsLayer = document.getElementById("toppingsLayer");
  var biteMarkLayer = document.getElementById("biteMarkLayer");
  var scoopCounterBadge = document.getElementById("scoopCounterBadge");
  var dockCone = document.getElementById("dockCone");
  var dockScoop = document.getElementById("dockScoop");
  var dockToppings = document.getElementById("dockToppings");
  var dockServe = document.getElementById("dockServe");
  var goToppingsBtn = document.getElementById("goToppingsBtn");
  var backScoopBtn = document.getElementById("backScoopBtn");
  var serveBellBtn = document.getElementById("serveBellBtn");
  var nextCustomerBtn = document.getElementById("nextCustomerBtn");
  var guideHand = document.getElementById("guideHand");
  var winOverlay = document.getElementById("winOverlay");
  var winSummary = document.getElementById("winSummary");

  var autoNextTimer = null;
  var serveTimers = [];

  function clearServeTimers(){
    if(autoNextTimer){ clearTimeout(autoNextTimer); autoNextTimer = null; }
    while(serveTimers.length){ clearTimeout(serveTimers.pop()); }
  }

  function showCountPop(txt){
    scoopCounterBadge.textContent = txt;
    scoopCounterBadge.classList.remove("pop");
    void scoopCounterBadge.offsetWidth;
    scoopCounterBadge.classList.add("pop");
  }

  function renderCustomer(mood){
    var cust = CUSTOMERS[state.customerIdx % CUSTOMERS.length];
    customerSvg.innerHTML = buildCustomerSVG(cust.key, mood || "happy");
    if(mood === "heart"){
      custBubble.textContent = "😍";
    } else if(mood === "freeze"){
      custBubble.textContent = "🥶";
    } else if(mood === "open"){
      custBubble.textContent = "😋";
    } else {
      custBubble.textContent = cust.crave;
    }
  }

  function renderToppingsLayer(){
    var html = "";
    if(state.toppings.drizzle)   html += drizzleSVG();
    if(state.toppings.sprinkles) html += sprinklesSVG();
    if(state.toppings.whip)      html += whipSVG();
    if(state.toppings.cherry)    html += cherrySVG();
    toppingsLayer.innerHTML = html;
  }

  function updateGuideHand(){
    var target = null;
    if(!winOverlay.hidden){
      guideHand.style.opacity = "0";
      return;
    }
    if(state.step === "cone"){
      target = dockCone.querySelector(".vessel-btn");
    } else if(state.step === "scoop"){
      if(state.scoops.length === 0){
        target = dockScoop.querySelector(".flavor-btn");
      } else {
        target = dockScoop.querySelectorAll(".flavor-btn")[state.scoops.length % 4];
      }
    } else if(state.step === "toppings"){
      if(state.toppingsCount === 0){
        target = dockToppings.querySelector(".top-btn");
      } else {
        target = serveBellBtn;
      }
    } else if(state.step === "serve" && !nextCustomerBtn.hidden){
      target = nextCustomerBtn;
    }

    if(!target || target.hidden){
      guideHand.style.opacity = "0";
      return;
    }
    var r = target.getBoundingClientRect();
    if(!r.width || !r.height){
      guideHand.style.opacity = "0";
      return;
    }
    guideHand.style.opacity = "1";
    guideHand.style.left = Math.round(r.left + r.width * 0.5) + "px";
    guideHand.style.top  = Math.round(r.top - 32) + "px";
  }

  function syncUI(){
    servedCountEl.textContent = String(state.servedCount);
    starCountEl.textContent   = String(state.stars);

    /* Step dots */
    var stepOrder = { cone: 0, scoop: 1, toppings: 2, serve: 3 };
    var idx = stepOrder[state.step] || 0;
    [sdCone, sdScoop, sdTop, sdServe].forEach(function(el, i){
      el.classList.toggle("active", i === idx);
      el.classList.toggle("done", i < idx);
    });

    /* Docks */
    dockCone.hidden     = (state.step !== "cone");
    dockScoop.hidden    = (state.step !== "scoop");
    dockToppings.hidden = (state.step !== "toppings");
    dockServe.hidden    = (state.step !== "serve");

    /* Counter side controls */
    var canServe = (state.scoops.length >= 1) && (state.step === "scoop" || state.step === "toppings");
    serveBellBtn.hidden  = !canServe;
    goToppingsBtn.hidden = !(state.step === "scoop" && state.scoops.length >= 1 && state.scoops.length < 3);
    backScoopBtn.hidden  = !(state.step === "toppings" && state.scoops.length < 3);

    /* Flavor pulse highlight when waiting for first scoop */
    dockScoop.querySelectorAll(".flavor-btn").forEach(function(b){
      b.classList.toggle("pulse", state.step === "scoop" && state.scoops.length === 0);
    });

    /* Topping checkmarks & gentle suggest glow */
    dockToppings.querySelectorAll(".top-btn").forEach(function(b){
      var k = b.getAttribute("data-topping");
      var applied = !!state.toppings[k];
      var chk = b.querySelector(".top-check");
      if(chk) chk.hidden = !applied;
      b.classList.toggle("suggest", state.step === "toppings" && !applied && state.toppingsCount === 0);
    });

    /* Empty dotted cone hint */
    emptyHint.style.display = state.vessel ? "none" : "";

    /* Update visual pointer after layout settles */
    requestAnimationFrame(updateGuideHand);
  }
  window.addEventListener("resize", function(){ requestAnimationFrame(updateGuideHand); });

  /* =========================================================================
     7. GAMEPLAY ACTIONS
     ========================================================================= */
  function startNewCone(opts){
    clearServeTimers();
    state.step = "cone";
    state.vessel = null;
    state.scoops = [];
    state.toppings = { sprinkles: false, drizzle: false, whip: false, cherry: false };
    state.toppingsCount = 0;
    state.servingBusy = false;

    vesselLayer.innerHTML = "";
    scoopsLayer.innerHTML = "";
    toppingsLayer.innerHTML = "";
    biteMarkLayer.innerHTML = "";
    coneStage.classList.remove("serving-up", "bitten");
    serveBellBtn.classList.remove("ringing");
    nextCustomerBtn.hidden = false;

    customerWrap.className = "entering";
    renderCustomer("happy");
    void customerWrap.offsetWidth;
    setTimeout(function(){
      customerWrap.className = "idle-bob";
    }, 40);

    lastIdleClip = "hoot-idle-tap";
    if(opts && opts.voice){
      playVoice(opts.voice);
    }
    armIdle();
    syncUI();
  }

  /* Step 1: Pick Cone or Cup */
  function pickVessel(vesselKey){
    if(state.step !== "cone") return;
    state.vessel = vesselKey;
    state.step = "scoop";
    vesselLayer.innerHTML = vesselSVG(vesselKey);
    sfxConePop();
    var c = centerOf(coneStage);
    spawnSparkles(c.x, c.y + 60, 12);
    lastIdleClip = "hoot-tap-big-btn";
    syncUI();
  }

  /* Step 2: Pull Flavor Lever -> Drop Bouncy Scoop (up to 3!) */
  function addScoop(flavorKey, btnEl){
    if(state.step !== "scoop" || state.scoops.length >= 3) return;
    if(btnEl){
      btnEl.classList.add("pulled");
      setTimeout(function(){ btnEl.classList.remove("pulled"); }, 220);
    }
    var idx = state.scoops.length;
    state.scoops.push(flavorKey);
    scoopsLayer.insertAdjacentHTML("beforeend", scoopSVG(flavorKey, idx));

    var n = state.scoops.length;
    sfxScoopPlop(n);
    showCountPop(n + "!");
    playVoice("name-number-" + n);

    var c = centerOf(coneStage);
    var m = FLAVOR_META[flavorKey] || FLAVOR_META.strawberry;
    spawnCreamPuffs(c.x, c.y + 30 - idx * 44, m.puff);

    /* Excited customer wiggle! */
    customerWrap.className = "excited";
    setTimeout(function(){
      if(state.step !== "serve") customerWrap.className = "idle-bob";
    }, 520);

    /* Automatically open Toppings Bar when 3 scoops are stacked! */
    if(n >= 3){
      state.step = "toppings";
    }
    syncUI();
  }

  /* Step 3: Add Toppings (Sprinkles, Chocolate Drizzle, Whipped Cream, Red Cherry) */
  function addTopping(topKey){
    if(state.step !== "toppings" || state.scoops.length === 0) return;
    var already = !!state.toppings[topKey];
    state.toppings[topKey] = true;
    if(!already){
      state.toppingsCount++;
    }
    renderToppingsLayer();

    var c = centerOf(coneStage);
    var topY = c.r.top + 80;
    if(topKey === "sprinkles"){
      sfxSprinkles();
      spawnSprinkleRain(c.x, topY);
    } else if(topKey === "drizzle"){
      sfxDrizzle();
      spawnChocDrops(c.x, topY);
    } else if(topKey === "whip"){
      sfxWhipSwirl();
      spawnCreamPuffs(c.x, topY + 12, "#FFFFFF");
    } else if(topKey === "cherry"){
      sfxCherryPop();
      spawnSparkles(c.x, topY, 16);
    }

    customerWrap.className = "excited";
    setTimeout(function(){
      if(state.step !== "serve") customerWrap.className = "idle-bob";
    }, 420);

    syncUI();
  }

  /* Step 4: Ring the Bell & Serve Customer! */
  function serveCone(){
    if(state.servingBusy || state.scoops.length === 0) return;
    if(state.step !== "scoop" && state.step !== "toppings") return;
    clearServeTimers();

    state.servingBusy = true;
    state.step = "serve";
    nextCustomerBtn.hidden = true;
    serveBellBtn.classList.add("ringing");
    sfxBellDing();
    syncUI();

    /* Phase A: Glide ice cream up to sunny serving window, customer opens mouth wide! */
    coneStage.classList.add("serving-up");
    customerWrap.className = "excited";
    renderCustomer("open");

    /* Phase B (520ms): HUGE ANIMATED BITE! */
    serveTimers.push(setTimeout(function(){
      coneStage.classList.add("bitten");
      /* Draw cartoon bite mark on top scoop */
      var py = topScoopPeakY() + 26;
      biteMarkLayer.innerHTML =
        '<g opacity="0.95">' +
          '<circle cx="156" cy="'+py+'" r="22" fill="#FFFDF5" opacity="0.22"/>' +
          '<path d="M138 '+(py-18)+' Q154 '+(py-14)+' 152 '+(py-2)+' Q164 '+(py+4)+' 156 '+(py+16)+' Q144 '+(py+20)+' 136 '+(py+10)+'" fill="none" stroke="#4A2511" stroke-width="3.6" stroke-dasharray="5 5" stroke-linecap="round"/>' +
        '</g>';

      var biteClip = BITE_CLIPS[(biteIdx++) % BITE_CLIPS.length];
      playVoice(biteClip);
      var cc = centerOf(customerWrap);
      spawnCreamPuffs(cc.x, cc.y + 18, "#FFFDF5");
    }, 520));

    /* Phase C (1120ms): Heart-Eyes OR Silly Brain-Freeze Shiver + Star + Cheer! */
    serveTimers.push(setTimeout(function(){
      var isBrainFreeze = (state.servedCount % 2 === 1);
      state.servedCount++;
      var earned = (state.scoops.length >= 3 && state.toppingsCount >= 1) ? 2 : 1;
      state.stars += earned;
      servedCountEl.textContent = String(state.servedCount);
      starCountEl.textContent   = String(state.stars);

      var cc = centerOf(customerWrap);
      if(isBrainFreeze){
        customerWrap.className = "shiver";
        renderCustomer("freeze");
        sfxShiver();
        spawnFrost(cc.x, cc.y - 10, 20);
        showCountPop("BRRR! 🥶");

        /* Shiver melts into huge happy heart-eyes giggle! */
        serveTimers.push(setTimeout(function(){
          customerWrap.className = "excited";
          renderCustomer("heart");
          sfxCheer();
          spawnHearts(cc.x, cc.y - 12, 14);
          spawnSparkles(cc.x, cc.y - 16, 20);
          playVoice(PRAISE_CLIPS[(praiseIdx++) % PRAISE_CLIPS.length]);
        }, 780));
      } else {
        customerWrap.className = "excited";
        renderCustomer("heart");
        sfxCheer();
        spawnHearts(cc.x, cc.y - 12, 16);
        spawnSparkles(cc.x, cc.y - 16, 22);
        showCountPop("⭐ +" + earned);
        playVoice(PRAISE_CLIPS[(praiseIdx++) % PRAISE_CLIPS.length]);
      }

      nextCustomerBtn.hidden = false;
      requestAnimationFrame(updateGuideHand);
    }, 1120));

    /* Gentle automatic walk-up for next customer after celebration so 2-year-olds never stall */
    autoNextTimer = setTimeout(function(){
      advanceToNextCustomer();
    }, 4600);
  }

  function advanceToNextCustomer(){
    clearServeTimers();
    state.customerIdx = (state.customerIdx + 1) % CUSTOMERS.length;
    customerWrap.className = "leaving";
    setTimeout(function(){
      startNewCone({ voice: "hoot-next-one" });
    }, 300);
  }

  /* =========================================================================
     8. EVENT WIRING
     ========================================================================= */
  dockCone.querySelectorAll(".vessel-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      pickVessel(btn.getAttribute("data-vessel"));
    });
  });

  dockScoop.querySelectorAll(".flavor-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      addScoop(btn.getAttribute("data-flavor"), btn);
    });
  });

  dockToppings.querySelectorAll(".top-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      addTopping(btn.getAttribute("data-topping"));
    });
  });

  goToppingsBtn.addEventListener("click", function(){
    if(state.step === "scoop" && state.scoops.length >= 1){
      state.step = "toppings";
      sfxConePop();
      syncUI();
    }
  });

  backScoopBtn.addEventListener("click", function(){
    if(state.step === "toppings" && state.scoops.length < 3){
      state.step = "scoop";
      sfxConePop();
      syncUI();
    }
  });

  serveBellBtn.addEventListener("click", serveCone);
  nextCustomerBtn.addEventListener("click", advanceToNextCustomer);

  document.getElementById("hootBtn").addEventListener("click", function(){
    sfxCherryPop();
    playVoice(state.step === "cone" ? "hoot-welcome" : "hoot-tap-big-btn");
  });

  document.getElementById("doneBtn").addEventListener("click", function(){
    clearServeTimers();
    sfxCheer();
    winSummary.textContent = "⭐ " + state.stars + "   •   🍦 " + state.servedCount;
    winOverlay.hidden = false;
    guideHand.style.opacity = "0";
    playVoice("hoot-win-yay");
  });

  document.getElementById("againBtn").addEventListener("click", function(){
    winOverlay.hidden = true;
    state.servedCount = 0;
    state.stars = 0;
    state.customerIdx = 0;
    startNewCone({ voice: "hoot-ready-go" });
  });

  /* Natural eye blink on idle customer */
  setInterval(function(){
    if(state.step === "serve" || !winOverlay.hidden) return;
    var eyes = customerSvg.querySelector(".cust-eyes");
    if(!eyes) return;
    eyes.style.transformOrigin = "120px 112px";
    eyes.style.transform = "scaleY(0.12)";
    setTimeout(function(){ if(eyes) eyes.style.transform = ""; }, 130);
  }, 3600);

  /* =========================================================================
     9. PUBLIC TEST & INSPECTION API
     ========================================================================= */
  window.__icecreamGame = {
    snapshot: function(){
      return {
        step: state.step,
        vessel: state.vessel,
        scoopCount: state.scoops.length,
        toppingsCount: state.toppingsCount,
        customerIdx: state.customerIdx,
        servedCount: state.servedCount,
        stars: state.stars
      };
    }
  };

  /* Boot Hoot's Ice Cream Truck! */
  startNewCone({ voice: "hoot-welcome" });
})();
</script>
