<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="animals";window.__HOOT_SELF_COACH__=true;</script>
<script src="js/hoot-game-head.js?v=llprev3e131"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Animal Homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#17324f;
    --cream:#fffdf7;
    --sun:#ffc93c;
    --leaf:#3cc858;
    --coral:#ff5d52;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#66c7f7;
    touch-action:none;
    user-select:none; -webkit-user-select:none;
  }

  #stage{
    position:fixed; inset:0; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
    background:linear-gradient(180deg, #4db7f5 0%, #9de2ff 40%, #d8f8de 66%, #59cc62 100%);
  }

  /* ================= STORYBOOK SUNNY WOODLAND SCENERY ================= */
  #scenery{ position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  #meadowSvg{
    position:absolute; left:0; right:0; bottom:12%;
    width:100%; height:62%; display:block;
  }
  #pineLeft{
    position:absolute; left:-18px; bottom:26%;
    width:clamp(112px, 19vw, 190px);
    filter:drop-shadow(0 8px 14px rgba(23,50,79,.16));
  }
  #oakRight{
    position:absolute; right:-20px; bottom:28%;
    width:clamp(118px, 20vw, 200px);
    filter:drop-shadow(0 8px 14px rgba(23,50,79,.16));
  }

  .decor{ position:absolute; border:none; background:none; padding:0; cursor:pointer; pointer-events:auto; }
  #sunBtn{ top:74px; right:16px; width:80px; height:80px; z-index:2; }
  #sunBtn svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 16px rgba(255,183,3,.5)); }
  #sunBtn .rays{ transform-box:fill-box; transform-origin:center; animation:sunSpin 44s linear infinite; }
  #sunBtn.zing .rays{ animation:sunSpin .9s cubic-bezier(.34,1.5,.5,1) 1; }
  @keyframes sunSpin{ to{ transform:rotate(360deg); } }

  .cloud{ z-index:1; width:124px; height:56px; opacity:.95; animation:cloudDrift linear infinite; }
  .cloud svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 10px rgba(23,50,79,.08)); transition:transform .25s cubic-bezier(.34,1.8,.5,1); }
  .cloud.puff svg{ transform:scale(1.24, 1.34); }
  @keyframes cloudDrift{ from{ transform:translateX(-150px); } to{ transform:translateX(112vw); } }

  #bflyBtn{
    left:16%; top:21%; width:66px; height:66px; z-index:3;
    display:grid; place-items:center; animation:bflyFloat 6.8s ease-in-out infinite alternate;
  }
  #bflyBtn svg{ width:50px; height:40px; overflow:visible; }
  #bflyBtn .bw{ transform-box:fill-box; animation:flapW .2s ease-in-out infinite alternate; }
  #bflyBtn .bw-l{ transform-origin:100% 50%; }
  #bflyBtn .bw-r{ transform-origin:0% 50%; }
  @keyframes flapW{ from{ transform:scaleX(1); } to{ transform:scaleX(.42); } }
  @keyframes bflyFloat{
    0%{ transform:translate(0,0) rotate(-5deg); }
    50%{ transform:translate(24px,-16px) rotate(6deg); }
    100%{ transform:translate(-10px,-4px) rotate(-3deg); }
  }

  /* ================= CLEAN PICTURE-ONLY TOP BAR (ALL >=64PX) ================= */
  #hud{
    position:relative; z-index:12;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:max(8px, env(safe-area-inset-top)) 12px 0;
    pointer-events:none;
  }
  .hud-group{ display:flex; align-items:center; gap:8px; pointer-events:auto; }
  .mode-pill{
    min-width:68px; height:66px; padding:0 12px; border-radius:22px;
    border:4px solid #fff; background:rgba(255,253,247,.95);
    box-shadow:0 5px 0 rgba(23,50,79,.22), 0 8px 18px rgba(23,50,79,.14);
    display:flex; align-items:center; justify-content:center; gap:4px;
    font-size:26px; cursor:pointer;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1), background .15s, box-shadow .15s;
  }
  .mode-pill:active{ transform:translateY(3px) scale(.95); }
  .mode-pill.on{
    background:linear-gradient(180deg, #ffe885 0%, #ffc93c 100%);
    border-color:#17324f;
    box-shadow:0 5px 0 #17324f, 0 0 22px rgba(255,201,60,.78);
    transform:translateY(-2px) scale(1.04);
  }

  #soundBtn{
    width:66px; height:66px; border-radius:50%;
    border:4px solid #fff; background:rgba(255,253,247,.96);
    box-shadow:0 5px 0 rgba(23,50,79,.22), 0 8px 18px rgba(23,50,79,.14);
    display:grid; place-items:center; cursor:pointer;
  }
  #soundBtn:active{ transform:translateY(3px) scale(.94); }
  #soundBtn svg{ width:30px; height:30px; }

  #starPill{
    height:66px; padding:0 18px 0 14px; border-radius:999px;
    border:4px solid #fff; background:rgba(255,253,247,.96);
    box-shadow:0 5px 0 rgba(23,50,79,.22), 0 8px 18px rgba(23,50,79,.14);
    display:flex; align-items:center; gap:8px;
    font-weight:800; font-size:26px; color:#17324f;
  }
  #starPill svg{ width:30px; height:30px; display:block; }
  #starPill.bump{ animation:starBump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{ 0%{ transform:scale(1); } 45%{ transform:scale(1.22) rotate(-4deg); } 100%{ transform:scale(1); } }

  /* ================= CENTER STAGE: HOOT + HERO ANIMAL STUMP + THOUGHT CLOUD ================= */
  #centerStage{
    position:relative; z-index:6; flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding:4px 10px 6px;
    gap:6px;
  }

  /* 100% Picture-Only Puffy Thought Cloud */
  #orderCloud{
    position:relative; z-index:9;
    display:flex; align-items:center; gap:12px;
    background:#fffdf8; border:5px solid #17324f; border-radius:36px;
    padding:8px 14px 8px 18px;
    box-shadow:0 8px 0 #17324f, 0 16px 32px rgba(23,50,79,.22);
    max-width:94vw;
    transition:transform .22s cubic-bezier(.34,1.7,.5,1);
  }
  #orderCloud::after{
    content:""; position:absolute; left:50%; bottom:-16px; transform:translateX(-50%);
    width:20px; height:20px; border-radius:50%;
    background:#fffdf8; border:5px solid #17324f;
    box-shadow:0 4px 0 #17324f;
  }
  #orderCloud.pop-in{ animation:cloudPop .46s cubic-bezier(.34,1.75,.5,1); }
  @keyframes cloudPop{ 0%{ transform:scale(.62) translateY(14px); opacity:0; } 100%{ transform:scale(1) translateY(0); opacity:1; } }

  #cloudInner{ display:flex; align-items:center; gap:10px; }
  .cloud-animal-badge{
    width:62px; height:62px; border-radius:20px;
    background:#fff6d8; border:3.5px solid #f59e0b;
    display:grid; place-items:center; padding:4px;
  }
  .cloud-animal-badge svg{ width:100%; height:100%; display:block; }
  .cloud-arrow{ font-size:26px; color:#16a34a; font-weight:900; }
  .cloud-q{
    width:58px; height:58px; border-radius:20px;
    background:#eff6ff; border:3.5px dashed #3b82f6;
    display:grid; place-items:center; font-size:30px;
  }
  .cloud-stars{ display:flex; align-items:center; gap:4px; font-size:26px; color:#d8e4f0; }
  .cloud-stars span.lit{ color:#ffc93c; text-shadow:0 2px 6px rgba(245,158,11,.55); display:inline-block; animation:slotFed .45s cubic-bezier(.34,1.85,.5,1); }
  @keyframes slotFed{ 0%{ transform:scale(.45) rotate(-14deg); } 60%{ transform:scale(1.26) rotate(6deg); } 100%{ transform:scale(1) rotate(0); } }

  #repeatBtn{
    width:64px; height:64px; border-radius:50%; flex:0 0 auto;
    border:4px solid #17324f; background:linear-gradient(180deg, #ffe47a 0%, #ffb703 100%);
    box-shadow:0 5px 0 #17324f; display:grid; place-items:center; cursor:pointer;
  }
  #repeatBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 #17324f; }
  #repeatBtn svg{ width:30px; height:30px; }

  /* Hoot + Hero Animal Stump Duo */
  #heroRow{
    position:relative; z-index:7;
    display:flex; align-items:flex-end; justify-content:center;
    gap:clamp(14px, 4vw, 38px);
    width:100%;
  }

  #hootBtn{
    position:relative; border:none; background:none; padding:0; cursor:pointer;
    width:clamp(124px, 24vh, 184px);
    filter:drop-shadow(0 10px 14px rgba(23,50,79,.24));
    transform-origin:50% 94%;
    animation:hootIdle 3.1s ease-in-out infinite;
  }
  #hootBtn svg{ width:100%; height:auto; display:block; overflow:visible; }
  @keyframes hootIdle{ 0%,100%{ transform:translateY(0) rotate(-.8deg); } 50%{ transform:translateY(-5px) rotate(.8deg); } }
  #hootBtn .wing-l{ transform-box:fill-box; transform-origin:85% 18%; transition:transform .2s; }
  #hootBtn .wing-r{ transform-box:fill-box; transform-origin:15% 18%; transition:transform .2s; }
  #hootBtn .eyelids{ transform-box:fill-box; transform-origin:center; animation:hootBlink 4.4s infinite; }
  @keyframes hootBlink{ 0%,93%,100%{ transform:scaleY(0); } 96%{ transform:scaleY(1); } }
  #hootBtn.happy-jump{ animation:hootHappy .52s cubic-bezier(.34,1.7,.5,1) 3; }
  @keyframes hootHappy{ 0%,100%{ transform:translateY(0) scale(1); } 40%{ transform:translateY(-22px) scale(.96,1.06) rotate(-3deg); } 75%{ transform:translateY(2px) scale(1.05,.95); } }
  #hootBtn.happy-jump .wing-l{ animation:flapL .22s ease-in-out infinite alternate; }
  #hootBtn.happy-jump .wing-r{ animation:flapR .22s ease-in-out infinite alternate; }
  @keyframes flapL{ from{ transform:rotate(0); } to{ transform:rotate(38deg); } }
  @keyframes flapR{ from{ transform:rotate(0); } to{ transform:rotate(-38deg); } }
  #hootBtn.head-wobble{ animation:headWobble .42s ease-in-out 2; }
  @keyframes headWobble{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-8deg); } 75%{ transform:rotate(8deg); } }
  #hootBtn.talking{ animation:talkPulse .22s ease-in-out infinite alternate; }
  @keyframes talkPulse{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-3px) scale(1.02); } }

  /* Giant Draggable Hero Animal on Sunlit Tree Stump */
  #heroAnimalWrap{
    position:relative; display:flex; flex-direction:column; align-items:center;
    margin-bottom:2px;
  }
  #heroAnimalWrap[hidden]{ display:none !important; }
  #heroAnimalBtn{
    position:relative; z-index:3; border:none; background:none; padding:0;
    width:clamp(112px, 21vh, 152px); height:clamp(112px, 21vh, 152px);
    cursor:grab; touch-action:none;
    filter:drop-shadow(0 12px 16px rgba(23,50,79,.28));
    animation:animalWave 2.1s ease-in-out infinite alternate;
  }
  #heroAnimalBtn svg{ width:100%; height:100%; display:block; overflow:visible; pointer-events:none; }
  #heroAnimalBtn.dragging-src{ opacity:.25; transform:scale(.88); animation:none; }
  #heroAnimalBtn.gone{ opacity:0; transform:scale(.3); transition:opacity .2s, transform .2s; animation:none; }
  @keyframes animalWave{
    0%{ transform:translateY(0) rotate(-3deg) scale(1); }
    100%{ transform:translateY(-10px) rotate(3deg) scale(1.04); }
  }
  #stumpSvg{
    width:clamp(108px, 20vh, 146px); height:auto; margin-top:-20px; z-index:1;
    filter:drop-shadow(0 6px 8px rgba(23,50,79,.22)); pointer-events:none;
  }

  /* ================= MEADOW HABITAT STAGE (3 GIANT HOMES OR 6 EXPLORE HOMES) ================= */
  #meadowDeck{
    position:relative; z-index:8; width:100%;
    padding:14px 12px max(12px, env(safe-area-inset-bottom));
    background:linear-gradient(180deg, #5fd166 0%, #3fb64c 52%, #2f9c3e 100%);
    border-top:6px solid #17324f;
    box-shadow:0 -10px 26px rgba(23,50,79,.22), inset 0 6px 0 rgba(255,255,255,.32);
  }
  #homesGrid{
    max-width:840px; margin:0 auto;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:clamp(12px, 3vw, 26px);
    min-height:132px;
  }
  #homesGrid.explore-mode{ max-width:960px; gap:clamp(10px, 2vw, 18px); }

  .home-btn{
    position:relative;
    width:clamp(108px, 27vw, 152px); height:clamp(108px, 27vw, 152px);
    border-radius:34px;
    border:5px solid #17324f;
    background:radial-gradient(circle at 35% 28%, #ffffff 0%, #fffdf6 64%, #e5f5ec 100%);
    box-shadow:0 8px 0 #17324f, 0 14px 24px rgba(23,50,79,.26), inset 0 -6px 0 #d5ebd8;
    padding:10px; cursor:pointer; touch-action:manipulation;
    display:grid; place-items:center;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1), box-shadow .16s, border-color .16s;
  }
  #homesGrid.explore-mode .home-btn{
    width:clamp(96px, 26vw, 126px); height:clamp(96px, 26vw, 126px);
    border-radius:28px; padding:8px;
  }
  .home-btn svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 4px 5px rgba(23,50,79,.16)); pointer-events:none; }
  .home-btn:active{ transform:translateY(4px) scale(.95); box-shadow:0 4px 0 #17324f; }

  .home-btn.drop-hover{
    border-color:#ffb703;
    box-shadow:0 8px 0 #17324f, 0 0 0 9px rgba(255,201,60,.75), 0 0 30px rgba(255,183,3,.95);
    transform:translateY(-8px) scale(1.08);
  }
  .home-btn.nudge-glow{
    border-color:#ffb703;
    box-shadow:0 8px 0 #17324f, 0 0 0 8px rgba(255,201,60,.68), 0 0 28px rgba(255,183,3,.95);
    animation:homeNudge .65s ease-in-out infinite alternate;
  }
  @keyframes homeNudge{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-8px) scale(1.06); } }

  .home-btn.knocking{ animation:doorKnock .14s ease-in-out 4 alternate; }
  @keyframes doorKnock{ from{ transform:rotate(-5deg) scale(1.03); } to{ transform:rotate(5deg) scale(1.05); } }

  .home-btn.celebrating{
    background:radial-gradient(circle at 50% 35%, #fff9db 0%, #dcfce7 100%);
    border-color:#16a34a;
    box-shadow:0 8px 0 #14532d, 0 0 30px rgba(74,222,128,.95);
    transform:scale(1.08);
  }

  /* Peek-out animal badge inside home when solved or knocked open! */
  .home-resident{
    position:absolute; left:50%; top:-16px; transform:translateX(-50%) scale(0);
    width:72%; height:72%; pointer-events:none;
    filter:drop-shadow(0 8px 12px rgba(23,50,79,.32));
    transition:transform .38s cubic-bezier(.34,1.85,.5,1);
  }
  .home-btn.has-resident .home-resident{ transform:translateX(-50%) scale(1); }

  /* Knock-knock badge in Knock Surprise mode */
  .knock-badge{
    position:absolute; right:-8px; top:-10px;
    width:40px; height:40px; border-radius:50%;
    background:linear-gradient(180deg, #ffe47a 0%, #ffb703 100%);
    border:3.5px solid #17324f; box-shadow:0 4px 0 #17324f;
    display:grid; place-items:center; font-size:20px; pointer-events:none;
    animation:knockBob .7s ease-in-out infinite alternate;
  }
  @keyframes knockBob{ from{ transform:scale(1) rotate(-8deg); } to{ transform:scale(1.14) rotate(8deg); } }

  .nudge-hand{
    position:absolute; right:-10px; bottom:-14px; font-size:36px; line-height:1;
    pointer-events:none; filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));
    animation:handTap .55s ease-in-out infinite alternate;
  }
  @keyframes handTap{ from{ transform:translate(0,0) rotate(-10deg); } to{ transform:translate(-6px,-8px) rotate(4deg); } }

  /* Rescued Village Strip (tiny happy neighbors at bottom of meadow!) */
  #villageStrip{
    max-width:740px; margin:10px auto 0;
    display:flex; align-items:center; justify-content:center; gap:8px;
    min-height:46px;
  }
  #villageStrip[hidden]{ display:none !important; }
  .vslot{
    width:46px; height:46px; border-radius:16px;
    background:rgba(255,253,247,.32); border:3px dashed rgba(255,255,255,.65);
    display:grid; place-items:center; padding:4px;
    transition:transform .3s cubic-bezier(.34,1.8,.5,1), background .2s;
  }
  .vslot.filled{
    background:#fffdf7; border:3px solid #17324f;
    box-shadow:0 3px 0 #17324f;
    animation:slotFed .48s cubic-bezier(.34,1.85,.5,1);
  }
  .vslot svg{ width:100%; height:100%; display:block; }

  /* Floating dragged / flying animal */
  .drag-ghost, .fly-animal{
    position:fixed; z-index:40; width:108px; height:108px; pointer-events:none;
    filter:drop-shadow(0 16px 20px rgba(23,50,79,.36));
  }
  .drag-ghost svg, .fly-animal svg{ width:100%; height:100%; display:block; }

  /* Sparkles, splashes & floating emojis */
  .fx-dot{ position:fixed; z-index:35; pointer-events:none; border-radius:50%; }
  .fx-pop{
    position:fixed; z-index:36; pointer-events:none;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:36px;
    color:#fff; -webkit-text-stroke:2px #17324f;
    text-shadow:0 4px 0 #17324f;
    animation:popFloat .95s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes popFloat{
    0%{ transform:translate(-50%, 0) scale(.4); opacity:0; }
    25%{ transform:translate(-50%, -18px) scale(1.22); opacity:1; }
    100%{ transform:translate(-50%, -68px) scale(1); opacity:0; }
  }

  /* ================= ONE-TAP START TREEHOUSE (ZERO READING!) ================= */
  #startVeil{
    position:fixed; inset:0; z-index:30;
    background:rgba(23,50,79,.22); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  #goTreehouseBtn{
    width:min(86vw, 304px); min-height:202px;
    border:6px solid #17324f; border-radius:42px;
    background:linear-gradient(180deg, #fffdf7 0%, #dff8e5 100%);
    box-shadow:0 12px 0 #17324f, 0 24px 48px rgba(23,50,79,.38);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    padding:20px; cursor:pointer;
    animation:goPulse 1.25s ease-in-out infinite alternate;
  }
  @keyframes goPulse{ from{ transform:scale(1); } to{ transform:scale(1.05); } }
  #goTreehouseBtn:active{ transform:translateY(5px) scale(.97); box-shadow:0 7px 0 #17324f; }
  .go-play-pill{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:184px; min-height:72px; padding:10px 28px; border-radius:999px;
    border:5px solid #17324f;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-size:32px; font-weight:800;
    box-shadow:0 6px 0 #14532d; text-shadow:0 2px 0 rgba(0,0,0,.3);
  }

  /* ================= CELEBRATION WIN OVERLAY ================= */
  #winOverlay{
    position:fixed; inset:0; z-index:45;
    background:rgba(23,50,79,.45); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  #winCard{
    width:min(92vw, 440px);
    background:#fffdf8; border:6px solid #17324f; border-radius:36px;
    box-shadow:0 12px 0 #17324f, 0 28px 60px rgba(23,50,79,.4);
    padding:22px 20px 20px; text-align:center;
  }
  #winStars{ font-size:40px; letter-spacing:6px; color:#dbe7f3; line-height:1; }
  #winStars span.lit{ color:#ffc93c; text-shadow:0 0 18px rgba(255,201,60,.95); display:inline-block; animation:slotFed .45s cubic-bezier(.34,1.8,.5,1); }
  #winTitle{ font-size:clamp(26px, 6.5vw, 34px); margin:10px 0 8px; color:#17324f; }
  #winFriends{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:10px 0 18px; }
  .win-mini{ width:56px; height:56px; border-radius:50%; background:#e6faec; border:3px solid #17324f; padding:6px; }
  .win-mini svg{ width:100%; height:100%; display:block; }
  .win-btns{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; }
  #againBtn, .win-btn{
    min-width:190px; min-height:72px; padding:12px 28px; border-radius:999px;
    border:5px solid #17324f;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-family:inherit; font-size:26px; font-weight:800; cursor:pointer;
    box-shadow:0 7px 0 #14532d; text-shadow:0 2px 0 rgba(0,0,0,.3);
  }
  #againBtn:active, .win-btn:active{ transform:translateY(4px); box-shadow:0 3px 0 #14532d; }

  @media (max-width:460px){
    #hud{ padding:max(8px, env(safe-area-inset-top)) 8px 0; gap:4px; }
    .hud-group{ gap:5px; }
    .mode-pill{ min-width:64px; height:64px; padding:0 8px; font-size:22px; border-radius:18px; gap:2px; }
    #soundBtn{ width:64px; height:64px; }
    #starPill{ height:64px; padding:0 11px 0 9px; gap:5px; font-size:22px; }
    #starPill svg{ width:24px; height:24px; }
    #orderCloud{ padding:7px 10px 7px 12px; gap:7px; }
    #cloudInner{ gap:6px; }
    .cloud-animal-badge{ width:48px; height:48px; border-radius:15px; padding:3px; }

  }
  function showerConfetti(){
    var w = window.innerWidth, cols = ["#ffc93c","#4ade80","#ff6b7a","#38bdf8","#a855f7"];
    for(var i = 0; i < 28; i++){
      var c = document.createElement("div");
      c.className = "fx-dot";
      c.style.width = "13px"; c.style.height = "13px"; c.style.borderRadius = "4px";
      c.style.background = cols[i % cols.length];
      c.style.left = (w * 0.15 + Math.random() * w * 0.7) + "px";
      c.style.top = "18%";
      document.body.appendChild(c);
      var dx = (Math.random() - 0.5) * 320, dy = 240 + Math.random() * 340, rot = (Math.random() - 0.5) * 520;
      if(c.animate){
        c.animate([
          { transform:"translate(0,0) rotate(0deg)", opacity:1 },
          { transform:"translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg)", opacity:0 }
        ], { duration:1150 + Math.random() * 650, easing:"cubic-bezier(.2,.7,.3,1)" });
      }
      (function(el){ setTimeout(function(){ el.remove(); }, 1850); })(c);
    }
  }

  /* ================= GENTLE IDLE POINTER NUDGE ================= */
  function clearIdle(){
    if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    Array.prototype.forEach.call(homesGrid.querySelectorAll(".home-btn"), function(b){
      b.classList.remove("nudge-glow");
      var h = b.querySelector(".nudge-hand"); if(h) h.remove();
    });
  }
  function addHandTo(el){
    if(!el || el.querySelector(".nudge-hand")) return;
    var h = document.createElement("span");
    h.className = "nudge-hand"; h.setAttribute("aria-hidden", "true"); h.textContent = "👆";
    el.appendChild(h);
  }
  function armIdle(){
    clearIdle();
    if(state !== "playing" || dead || mode === "explore") return;
    idleTimer = setTimeout(function(){
      if(state !== "playing" || dead || inputLock || !current) return;
      var match = homesGrid.querySelector('.home-btn[data-id="' + current.id + '"]');
      if(match){ match.classList.add("nudge-glow"); addHandTo(match); }
      if(!vPlaying) speakPrompt(false);
    }, 6400);
  }

  /* ================= THOUGHT CLOUD & VILLAGE STRIP ================= */
  function renderCloud(pop){
    cloudInner.innerHTML = "";
    if(mode === "explore"){
      cloudInner.innerHTML = '<div style="display:flex;align-items:center;gap:8px;font-size:32px;padding:4px 6px;"><span>🏡</span><span>👆</span><span>🐾</span></div>';
    } else if(current){
      var starsHtml = '<div class="cloud-stars">';
      for(var i = 0; i < GOAL; i++){
        starsHtml += '<span class="' + (i < homed.length ? 'lit' : '') + '">★</span>';
      }
      starsHtml += '</div>';
      var rightIcon = mode === "knock" ? "🚪" : "🏠";
      cloudInner.innerHTML =
        '<div class="cloud-animal-badge">' + current.animal + '</div>' +
        '<span class="cloud-arrow">➜</span>' +
        '<div class="cloud-q">' + rightIcon + '</div>' +
        starsHtml;
    }
    if(pop){
      orderCloud.classList.remove("pop-in"); void orderCloud.offsetWidth; orderCloud.classList.add("pop-in");
    }
  }

  function renderVillageStrip(){
    if(mode === "explore"){
      villageStrip.hidden = true;
      return;
    }
    villageStrip.hidden = false;
    villageStrip.innerHTML = "";
    for(var i = 0; i < GOAL; i++){
      var slot = document.createElement("div");
      var p = homed[i];
      slot.className = "vslot" + (p ? " filled" : "");
      if(p) slot.innerHTML = p.animal;
      villageStrip.appendChild(slot);
    }
  }

  /* ================= DRAG HERO ANIMAL TO HOME (PLUS 1-TAP ON ANY HOME!) ================= */
  (function bindHeroDrag(){
    var ghost = null, activeId = null, moved = false, startX = 0, startY = 0, hovered = null;

    function clearHover(){
      if(hovered){ hovered.classList.remove("drop-hover"); hovered = null; }
    }
    function findHomeUnder(x, y){
      var btns = homesGrid.querySelectorAll(".home-btn");
      var best = null, bestD = 110;
      for(var i = 0; i < btns.length; i++){
        var r = btns[i].getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        var d = Math.hypot(x - cx, y - cy);
        if(d < bestD){ bestD = d; best = btns[i]; }
      }
      return best;
    }

    heroAnimalBtn.addEventListener("pointerdown", function(e){
      if(state !== "playing" || mode !== "takehome" || inputLock || dead || !current) return;
      e.preventDefault();
      audio();
      clearIdle();
      activeId = e.pointerId;
      startX = e.clientX; startY = e.clientY; moved = false;
      try{ heroAnimalBtn.setPointerCapture(e.pointerId); }catch(_){}
      lookAtPoint(e.clientX, e.clientY);
    });

    heroAnimalBtn.addEventListener("pointermove", function(e){
      if(activeId !== e.pointerId || !current) return;
      if(!moved && Math.hypot(e.clientX - startX, e.clientY - startY) > 10){
        moved = true;
        sfxPop();
        heroAnimalBtn.classList.add("dragging-src");
        ghost = document.createElement("div");
        ghost.className = "drag-ghost";
        ghost.innerHTML = current.animal;
        document.body.appendChild(ghost);
      }
      if(moved && ghost){
        ghost.style.left = (e.clientX - 54) + "px";
        ghost.style.top = (e.clientY - 54) + "px";
        lookAtPoint(e.clientX, e.clientY);
        var h = findHomeUnder(e.clientX, e.clientY);
        if(h !== hovered){ clearHover(); hovered = h; if(hovered) hovered.classList.add("drop-hover"); }
      }
    });

    function finish(e, cancelled){
      if(activeId !== e.pointerId) return;
      activeId = null;
      resetEyes();
      var dropHome = hovered;
      clearHover();
      if(ghost){ ghost.remove(); ghost = null; }
      heroAnimalBtn.classList.remove("dragging-src");
      if(cancelled){ armIdle(); return; }
      if(!moved){
        /* Tapped the animal directly -> cute habitat sound + repeat prompt! */
        sfxHabitat(current.sfx);
        var r = heroAnimalBtn.getBoundingClientRect();
        popBadge(r.left + r.width / 2, r.top + 10, current.fx);
        speakPrompt(false);
        armIdle();
        return;
      }
      if(dropHome){
        var pid = dropHome.getAttribute("data-id");
        var picked = PAIRS.filter(function(p){ return p.id === pid; })[0];
        if(picked) handleHomeChoice(dropHome, picked, { x: e.clientX, y: e.clientY });
      } else {
        armIdle();
      }
    }
    heroAnimalBtn.addEventListener("pointerup", function(e){ finish(e, false); });
    heroAnimalBtn.addEventListener("pointercancel", function(e){ finish(e, true); });
  })();

  function flyAnimalToHome(pair, fromRect, homeBtn, cb){
    var fly = document.createElement("div");
    fly.className = "fly-animal";
    fly.innerHTML = pair.animal;
    var x0 = fromRect.left + fromRect.width / 2 - 54;
    var y0 = fromRect.top + fromRect.height / 2 - 54;
    var tr = homeBtn.getBoundingClientRect();
    var x1 = tr.left + tr.width / 2 - 54;
    var y1 = tr.top + tr.height * 0.35 - 54;
    fly.style.left = x0 + "px"; fly.style.top = y0 + "px";
    document.body.appendChild(fly);
    sfxPop();
    var done = false;
    function end(){
      if(done) return; done = true;
      fly.remove();
      if(cb) cb(x1 + 54, y1 + 54);
    }
    if(fly.animate){
      var a = fly.animate([
        { transform:"translate(0,0) scale(1) rotate(0deg)" },
        { transform:"translate(" + ((x1-x0)*0.5).toFixed(1) + "px," + ((y1-y0)*0.5 - 64).toFixed(1) + "px) scale(1.12) rotate(10deg)", offset:0.52 },
        { transform:"translate(" + (x1-x0).toFixed(1) + "px," + (y1-y0).toFixed(1) + "px) scale(.7) rotate(-4deg)" }
      ], { duration:460, easing:"cubic-bezier(.26,.72,.36,1)" });
      a.onfinish = end;
      setTimeout(end, 560);
    } else {
      setTimeout(end, 120);
    }
  }

  /* ================= CORE GAMEPLAY: TAKE HOME / KNOCK-KNOCK / EXPLORE ================= */
  function awardStar(){
    stars++;
    starCountEl.textContent = String(stars);
    starPill.classList.remove("bump"); void starPill.offsetWidth; starPill.classList.add("bump");
    sfxStar();
  }

  function handleHomeChoice(homeBtn, pickedPair, dropPt){
    if(state !== "playing" || inputLock || dead) return;
    audio();
    clearIdle();

    if(mode === "explore"){
      sfxKnock();
      homeBtn.classList.remove("knocking"); void homeBtn.offsetWidth; homeBtn.classList.add("knocking");
      var r = homeBtn.getBoundingClientRect();
      setTimeout(function(){
        if(dead) return;
        homeBtn.classList.add("has-resident", "celebrating");
        sfxHabitat(pickedPair.sfx);
        burstSparkles(r.left + r.width / 2, r.top + 28, pickedPair.color, 12);
        popBadge(r.left + r.width / 2, r.top + 10, pickedPair.fx);
        var ck = "hoot-home-" + pickedPair.id;
        if(hasVoice(ck)) sayClips([ck + ".mp3"], true);
        else sayClips(["word-" + pickedPair.id + ".mp3", "word-home-" + pickedPair.homeSlug + ".mp3"], true);
        setTimeout(function(){ homeBtn.classList.remove("celebrating"); }, 1400);
      }, 280);
      return;
    }

    if(!current) return;
    var isRight = pickedPair.id === current.id;

    if(mode === "knock"){
      inputLock = true;
      sfxKnock();
      homeBtn.classList.remove("knocking"); void homeBtn.offsetWidth; homeBtn.classList.add("knocking");
      var kr = homeBtn.getBoundingClientRect();
      setTimeout(function(){
        if(dead) return;
        if(!isRight){
          sfxBoing();
          popBadge(kr.left + kr.width / 2, kr.top + 14, "💤");
          hootBtn.classList.remove("head-wobble"); void hootBtn.offsetWidth; hootBtn.classList.add("head-wobble");
          sayClips(["word-home-" + pickedPair.homeSlug + ".mp3", "hoot-try-again.mp3"], true);
          inputLock = false;
          var match = homesGrid.querySelector('.home-btn[data-id="' + current.id + '"]');
          if(match){ match.classList.add("nudge-glow"); addHandTo(match); }
          return;
        }
        /* Knock-knock RIGHT HOME -> door bursts open & animal pops out! */
        var kb = homeBtn.querySelector(".knock-badge"); if(kb) kb.remove();
        homeBtn.classList.add("has-resident", "celebrating");
        celebrateSuccess(homeBtn, kr.left + kr.width / 2, kr.top + 24);
      }, 360);
      return;
    }

    /* Take Me Home mode */
    if(!isRight){
      inputLock = true;
      sfxBoing();
      hootBtn.classList.remove("head-wobble"); void hootBtn.offsetWidth; hootBtn.classList.add("head-wobble");
      if(homeBtn.animate){
        homeBtn.animate([
          { transform:"translateX(0)" }, { transform:"translateX(-10px) rotate(-5deg)" },
          { transform:"translateX(10px) rotate(5deg)" }, { transform:"translateX(0)" }
        ], { duration:380 });
      }
      sayClips(["word-home-" + pickedPair.homeSlug + ".mp3", "hoot-try-again.mp3"], true);
      setTimeout(function(){
        inputLock = false;
        var match = homesGrid.querySelector('.home-btn[data-id="' + current.id + '"]');
        if(match){ match.classList.add("nudge-glow"); addHandTo(match); }
      }, 450);
      return;
    }

    inputLock = true;
    var fromRect = dropPt
      ? { left: dropPt.x - 48, top: dropPt.y - 48, width: 96, height: 96 }
      : heroAnimalBtn.getBoundingClientRect();
    heroAnimalBtn.classList.add("gone");
    flyAnimalToHome(current, fromRect, homeBtn, function(cx, cy){
      if(dead) return;
      homeBtn.classList.add("has-resident", "celebrating");
      celebrateSuccess(homeBtn, cx, cy);
    });
  }

  function celebrateSuccess(homeBtn, cx, cy){
    var pairNow = current;
    homed.push(pairNow);
    awardStar();
    sfxHabitat(pairNow.sfx);
    burstSparkles(cx, cy, pairNow.color, 16);
    popBadge(cx, cy - 22, pairNow.fx);
    hootBtn.classList.remove("happy-jump"); void hootBtn.offsetWidth; hootBtn.classList.add("happy-jump");
    renderCloud(false);
    renderVillageStrip();
    speakCelebrate(pairNow, homed.length % 2 === 1);

    var tok = ++roundTok;
    setTimeout(function(){
      if(dead || tok !== roundTok) return;
      hootBtn.classList.remove("happy-jump");
      if(homed.length >= GOAL){
        if(mode === "takehome"){
          /* Exciting Bonus Finale: 2 Knock-Knock Surprise rounds before the win party! */
          showWinCelebration();
        } else {
          showWinCelebration();
        }
      } else {
        presentNextRound(false);
      }
    }, 1750);
  }

  function buildHomeCards(list, isKnock, isExplore){
    homesGrid.innerHTML = "";
    homesGrid.classList.toggle("explore-mode", !!isExplore);
    list.forEach(function(p){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "home-btn";
      b.setAttribute("data-id", p.id);
      b.setAttribute("aria-label", p.home);
      b.innerHTML =
        p.homeSvg +
        '<div class="home-resident">' + p.animal + '</div>' +
        (isKnock ? '<span class="knock-badge" aria-hidden="true">✊</span>' : '');
      b.addEventListener("click", function(){ handleHomeChoice(b, p, null); });
      homesGrid.appendChild(b);
    });
  }

  function presentNextRound(withHello){
    state = "playing";
    inputLock = false;

    if(mode === "explore"){
      heroAnimalWrap.hidden = true;
      exploreSet = shuffle(PAIRS).slice(0, 6);
      buildHomeCards(exploreSet, false, true);
      renderCloud(true);
      renderVillageStrip();
      speakPrompt(!!withHello);
      return;
    }

    var remaining = queue.filter(function(p){ return homed.indexOf(p) < 0; });
    current = remaining[0] || PAIRS[0];

    if(mode === "takehome"){
      heroAnimalWrap.hidden = false;
      heroAnimalBtn.classList.remove("gone", "dragging-src");
      heroAnimalBtn.innerHTML = current.animal;
      heroAnimalBtn.setAttribute("aria-label", current.name);
    } else {
      heroAnimalWrap.hidden = true;
    }

    var distractors = shuffle(PAIRS.filter(function(p){ return p.id !== current.id; })).slice(0, 2);
    buildHomeCards(shuffle([current].concat(distractors)), mode === "knock", false);
    renderCloud(true);
    renderVillageStrip();
    speakPrompt(!!withHello);
    armIdle();
  }

  function showWinCelebration(){
    state = "won";
    inputLock = false;
    showerConfetti();
    winFriends.innerHTML = "";
    homed.forEach(function(p){
      var d = document.createElement("div");
      d.className = "win-mini";
      d.innerHTML = p.animal;
      winFriends.appendChild(d);
    });
    var stEls = winStars.children;
    for(var i = 0; i < stEls.length; i++){
      stEls[i].classList.remove("lit");
      (function(el, ms){ setTimeout(function(){ el.classList.add("lit"); }, ms); })(stEls[i], 140 + i * 140);
    }
    winOverlay.hidden = false;
    sayClips(["hoot-win-yay.mp3"], true);
  }

  /* ================= CONTROLS & LIVING SCENE TAPS ================= */
  function syncModePills(){
    Array.prototype.forEach.call(document.querySelectorAll(".mode-pill"), function(b){
      b.classList.toggle("on", b.getAttribute("data-mode") === mode);
    });
  }
  function beginSession(selectedMode, withHello){
    roundTok++;
    clearIdle();
    homed = [];
    queue = shuffle(PAIRS).slice(0, GOAL);
    hootBtn.classList.remove("happy-jump");
    winOverlay.hidden = true;
    startVeil.hidden = true;
    mode = selectedMode || mode || "takehome";
    syncModePills();
    presentNextRound(withHello);
  }

  $("goTreehouseBtn").addEventListener("click", function(){
    audio(); sfxPop();
    beginSession("takehome", true);
  });
  $("againBtn").addEventListener("click", function(){
    audio(); sfxPop();
    beginSession(mode === "explore" ? "takehome" : mode, false);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".mode-pill"), function(b){
    b.addEventListener("click", function(){
      audio(); sfxPop();
      startVeil.hidden = true;
      winOverlay.hidden = true;
      beginSession(b.getAttribute("data-mode"), false);
    });
  });

  $("repeatBtn").addEventListener("click", function(){
    audio();
    if(state === "playing") speakPrompt(false);
  });
  hootBtn.addEventListener("click", function(){
    audio();
    var r = hootBtn.getBoundingClientRect();
    popBadge(r.left + r.width / 2, r.top + 20, "🎵");
    hootBtn.classList.remove("happy-jump"); void hootBtn.offsetWidth; hootBtn.classList.add("happy-jump");
    setTimeout(function(){ hootBtn.classList.remove("happy-jump"); }, 900);
    sayClips(["hoot-giggle.mp3"], true);
    if(state === "playing" && mode !== "explore"){
      setTimeout(function(){ if(state === "playing" && !vPlaying) speakPrompt(false); }, 1150);
    }
  });

  $("soundBtn").addEventListener("click", function(){
    soundOn = !soundOn;
    $("sndOnSvg").style.display = soundOn ? "block" : "none";
    $("sndOffSvg").style.display = soundOn ? "none" : "block";
    if(!soundOn) clearVoice();
    else { audio(); sfxPop(); }
  });

  $("sunBtn").addEventListener("click", function(){
    audio();
    $("sunBtn").classList.remove("zing"); void $("sunBtn").offsetWidth; $("sunBtn").classList.add("zing");
    sfxStar();
  });
  $("bflyBtn").addEventListener("click", function(){
    audio(); sfxPop();
    var r = $("bflyBtn").getBoundingClientRect();
    burstSparkles(r.left + 32, r.top + 32, "#60a5fa", 8);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".cloud"), function(cl){
    cl.addEventListener("click", function(){
      audio(); sfxPop();
      cl.classList.remove("puff"); void cl.offsetWidth; cl.classList.add("puff");
      setTimeout(function(){ cl.classList.remove("puff"); }, 400);
    });
  });

  window.addEventListener("pagehide", function(){ dead = true; clearIdle(); clearVoice(); });
  document.addEventListener("visibilitychange", function(){ if(document.hidden) clearVoice(); });

  /* Pre-populate lush preview scene behind the start treehouse! */
  current = PAIRS[1]; /* Frog */
  heroAnimalBtn.innerHTML = current.animal;
  buildHomeCards([PAIRS[0], PAIRS[1], PAIRS[2]], false, false);
  renderCloud(false);
  renderVillageStrip();

  window.__animalsGame = {
    snapshot: function(){
      return {
        state: state, mode: mode, stars: stars,
        current: current ? current.id : null,
        homedCount: homed.length, goal: GOAL,
        winShown: !winOverlay.hidden, voicePlaying: vPlaying
      };
    }
  };
})();
</script>
