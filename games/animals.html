<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="animals";</script>
<script src="js/hoot-game-head.js?v=llprev3e71"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />

<title>Animal Homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#17324f; --ink-soft:#3d5a78; --paper:#fffdf6;
    --sun:#ffc93c; --coral:#ff6b5e; --teal:#17bebb; --leaf:#57cc62; --leaf-dark:#3da147;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{ margin:0; font-family:"Nunito",system-ui,sans-serif; color:var(--ink); overflow:hidden; background:#aee7ff; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  #stage{ position:fixed; inset:0; height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#6ec9f7 0%,#a5e3ff 30%,#d9f6e3 58%,#eafce8 100%); }

  /* ---------- living meadow decor ---------- */
  .decor{ position:absolute; border:none; background:none; padding:0; cursor:pointer; font-family:inherit; }
  #sun{ top:6px; right:6px; width:74px; height:74px; z-index:1; }
  #sun svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 10px rgba(232,169,12,.35)); }
  #sun .rays{ transform-box:fill-box; transform-origin:center; animation:sunSpin 46s linear infinite; }
  @keyframes sunSpin{ to{ transform:rotate(360deg); } }
  #sun.zing .rays{ animation:sunSpin 1.1s cubic-bezier(.34,1.4,.5,1) 1; }
  #sun:active{ transform:scale(.93); }
  .cloud{ z-index:1; width:104px; height:46px; opacity:.95; animation:drift linear infinite; }
  .cloud svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 5px 8px rgba(23,50,79,.12)); transition:transform .25s cubic-bezier(.34,1.8,.5,1); }
  .cloud.puff svg{ transform:scale(1.22,1.35); }
  @keyframes drift{ from{ transform:translateX(-130px); } to{ transform:translateX(112vw); } }
  .bfly{ z-index:2; width:38px; height:30px; animation:flutter 7s ease-in-out infinite alternate; }
  .bfly svg{ width:100%; height:100%; display:block; overflow:visible; }
  .bfly .bw{ transform-box:fill-box; animation:flapB .22s ease-in-out infinite alternate; }
  .bfly .bw-l{ transform-origin:100% 50%; } .bfly .bw-r{ transform-origin:0% 50%; }
  @keyframes flapB{ from{ transform:scaleX(1);} to{ transform:scaleX(.45);} }
  @keyframes flutter{ 0%{ transform:translate(0,0) rotate(-4deg);} 50%{ transform:translate(24px,-18px) rotate(5deg);} 100%{ transform:translate(-12px,-6px) rotate(-3deg);} }

  /* ---------- HUD ---------- */
  #hud{ position:relative; z-index:6; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:max(8px,env(safe-area-inset-top)) 10px 0; }
  .hud-btns{ display:flex; gap:8px; }
  .round-btn{ width:50px; height:50px; border-radius:50%; border:3px solid #fff; background:rgba(255,253,246,.96); color:var(--ink); display:grid; place-items:center; box-shadow:0 4px 0 rgba(23,50,79,.18),0 8px 16px rgba(23,50,79,.12); cursor:pointer; transition:transform .12s ease; }
  .round-btn:active{ transform:scale(.9); }
  .round-btn svg{ width:25px; height:25px; }
  #starBank{ display:flex; align-items:center; gap:7px; background:rgba(255,253,246,.96); border:3px solid #fff; border-radius:999px; padding:6px 16px 6px 10px; box-shadow:0 4px 0 rgba(23,50,79,.14),0 8px 16px rgba(23,50,79,.1); font-family:"Fredoka",sans-serif; font-weight:700; font-size:22px; }
  #starBank .star-ic{ width:25px; height:25px; }
  #starBank.bump{ animation:bankBump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes bankBump{ 0%{ transform:scale(1);} 40%{ transform:scale(1.16) rotate(-3deg);} 100%{ transform:scale(1);} }

  /* ---------- target card ---------- */
  #targetCard{ position:relative; z-index:6; margin:8px auto 0; display:flex; align-items:center; gap:12px; background:rgba(255,253,246,.97); border:3px solid #fff; border-radius:20px; box-shadow:0 5px 0 rgba(23,50,79,.12),0 12px 22px rgba(23,50,79,.12); padding:7px 10px 7px 16px; max-width:min(94vw,480px); }
  #targetCard.new-target{ animation:tcIn .45s cubic-bezier(.34,1.7,.5,1); }
  @keyframes tcIn{ 0%{ transform:scale(.8); opacity:0;} 100%{ transform:scale(1); opacity:1;} }
  #targetMain{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(22px,6vw,30px); line-height:1; color:var(--leaf-dark); white-space:nowrap; }
  .tc-label{ font-weight:900; font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); }
  #progressDots{ display:flex; gap:5px; margin-top:4px; }
  #progressDots i{ width:11px; height:11px; border-radius:50%; background:#dcebf5; border:2px solid #bcd6ea; display:block; }
  #progressDots i.on{ background:var(--sun); border-color:#e8a90c; }
  #hearBtn{ width:44px; height:44px; flex:0 0 auto; border-radius:50%; border:3px solid #ffe1a8; background:#fff6dd; display:grid; place-items:center; cursor:pointer; box-shadow:0 3px 0 rgba(232,169,12,.35); }
  #hearBtn:active{ transform:scale(.9); }
  #hearBtn svg{ width:23px; height:23px; }

  /* ---------- scene ---------- */
  #scene{ position:relative; flex:1 1 auto; min-height:0; z-index:1; }
  #meadow{ position:absolute; left:0; right:0; bottom:0; height:46%; z-index:0; pointer-events:none; }
  /* the presented animal / home on its wooden perch */
  #perch{ position:absolute; z-index:5; left:50%; top:2%; transform:translateX(-50%); width:clamp(104px,30vw,148px); text-align:center; }
  #perchArt{ filter:drop-shadow(0 8px 10px rgba(23,50,79,.25)); animation:perchBob 2.6s ease-in-out infinite; }
  #perchArt svg{ width:100%; display:block; }
  @keyframes perchBob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  #perch.shake #perchArt{ animation:perchShake .45s ease-in-out 2; }
  @keyframes perchShake{ 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-8px) rotate(-3deg);} 75%{ transform:translateX(8px) rotate(3deg);} }
  #perchName{ display:inline-block; margin-top:2px; background:#8a5a2b; color:#fff6dd; font-family:"Fredoka",sans-serif; font-weight:600; font-size:15px; padding:3px 14px; border-radius:999px; box-shadow:0 3px 0 rgba(90,55,20,.5); }
  #perchPole{ width:10px; height:26px; margin:0 auto; background:linear-gradient(90deg,#8a5a2b,#a9713d,#8a5a2b); border-radius:4px; }
  /* choice spots */
  .spot{ position:absolute; z-index:4; width:clamp(96px,28vw,138px); border:none; background:none; padding:0; cursor:pointer; font-family:inherit; text-align:center; transition:transform .12s ease; }
  .spot:active{ transform:scale(.93); }
  .spot .zone{ border-radius:50%; padding:10px; border:3px dashed rgba(255,255,255,.0); transition:border-color .2s, background .2s; }
  .spot-l{ left:2%; bottom:24%; } .spot-l .zone{ background:radial-gradient(circle at 50% 60%,rgba(87,204,98,.35),rgba(87,204,98,0) 70%); }
  .spot-c{ left:50%; transform:translateX(-50%); bottom:19%; } .spot-c:active{ transform:translateX(-50%) scale(.93); }
  .spot-c .zone{ background:radial-gradient(circle at 50% 60%,rgba(246,201,60,.4),rgba(246,201,60,0) 70%); }
  .spot-r{ right:2%; bottom:24%; } .spot-r .zone{ background:radial-gradient(circle at 50% 60%,rgba(78,168,224,.38),rgba(78,168,224,0) 70%); }
  .spot svg{ width:100%; display:block; filter:drop-shadow(0 6px 8px rgba(23,50,79,.22)); }
  .spot .spot-name{ display:inline-block; margin-top:1px; background:rgba(255,253,246,.96); border:2px solid #fff; color:var(--ink); font-family:"Fredoka",sans-serif; font-weight:600; font-size:14.5px; padding:2px 12px; border-radius:999px; box-shadow:0 3px 0 rgba(23,50,79,.15); }
  .spot.right .zone{ border-color:#fff; background:radial-gradient(circle at 50% 60%,rgba(255,201,60,.55),rgba(255,201,60,.08) 72%); animation:spotGlow .5s ease-in-out 3 alternate; }
  @keyframes spotGlow{ from{ transform:scale(1);} to{ transform:scale(1.07);} }
  .spot.wrong{ animation:spotWiggle .4s ease-in-out; }
  @keyframes spotWiggle{ 0%,100%{ transform:rotate(0);} 25%{ transform:rotate(-4deg);} 75%{ transform:rotate(4deg);} }
  .spot-c.wrong{ animation:spotWiggleC .4s ease-in-out; }
  @keyframes spotWiggleC{ 0%,100%{ transform:translateX(-50%) rotate(0);} 25%{ transform:translateX(-50%) rotate(-4deg);} 75%{ transform:translateX(-50%) rotate(4deg);} }
  /* animal choice buttons (Who Lives Here) */
  .choice-row{ position:absolute; z-index:4; left:0; right:0; bottom:21%; display:flex; justify-content:center; gap:4vw; padding:0 8px; }
  .animal-choice{ width:clamp(88px,26vw,124px); border:none; background:none; padding:0; cursor:pointer; font-family:inherit; text-align:center; }
  .animal-choice:active{ transform:scale(.93); }
  .animal-choice svg{ width:100%; display:block; filter:drop-shadow(0 6px 8px rgba(23,50,79,.22)); animation:perchBob 2.8s ease-in-out infinite; }
  .animal-choice .spot-name{ display:inline-block; background:rgba(255,253,246,.96); border:2px solid #fff; font-family:"Fredoka",sans-serif; font-weight:600; font-size:14.5px; padding:2px 12px; border-radius:999px; box-shadow:0 3px 0 rgba(23,50,79,.15); }
  .animal-choice.wrong{ animation:spotWiggle .4s ease-in-out; }
  /* number chips (Count mode) */
  .num-chip{ width:64px; height:64px; border-radius:50%; border:3px solid #fff; background:var(--teal); color:#fff; font-family:"Fredoka",sans-serif; font-weight:700; font-size:30px; cursor:pointer; box-shadow:0 5px 0 rgba(14,116,120,.5); }
  .num-chip:active{ transform:scale(.9); }
  .num-chip.wrong{ animation:spotWiggle .4s ease-in-out; background:#b9cbd8; }
  /* count minis + meet grid */
  .mini-pair{ position:absolute; z-index:3; width:64px; text-align:center; pointer-events:none; }
  .mini-pair .mp-home{ width:64px; } .mini-pair .mp-an{ width:44px; margin:-30px auto 0; position:relative; }
  .mini-pair svg{ width:100%; display:block; }
  .mini-pair.bounce .mp-an{ animation:miniBounce .5s cubic-bezier(.34,1.8,.5,1); }
  @keyframes miniBounce{ 0%{ transform:translateY(0);} 40%{ transform:translateY(-14px);} 100%{ transform:translateY(0);} }
  #meetGrid{ position:absolute; z-index:4; inset:4px 6px 70px; display:grid; grid-template-columns:repeat(4,1fr); gap:2px 4px; align-content:start; }
  .meet-home{ border:none; background:none; padding:0; cursor:pointer; font-family:inherit; }
  .meet-home svg{ width:100%; max-height:64px; display:block; filter:drop-shadow(0 4px 5px rgba(23,50,79,.2)); transition:transform .15s ease; }
  .meet-home:active svg{ transform:scale(.9); }
  .meet-home.met svg{ filter:drop-shadow(0 0 9px rgba(255,201,60,.95)); }
  .meet-home .mh-name{ display:block; font-family:"Fredoka",sans-serif; font-weight:600; font-size:11.5px; color:var(--ink); background:rgba(255,253,246,.85); border-radius:99px; padding:0 4px; margin-top:-4px; }
  /* village strip — homed animals live here */
  #village{ position:absolute; z-index:4; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:5px; padding:14px 6px 4px;
    background:linear-gradient(180deg,rgba(87,204,98,0),rgba(87,204,98,.35) 30%,rgba(61,161,71,.4)); }
  #village::before{ content:""; position:absolute; left:0; right:0; top:8px; height:5px; background:repeating-linear-gradient(90deg,#a9713d 0 16px,#8a5a2b 16px 20px); opacity:.75; border-radius:3px; }
  .plot{ position:relative; width:15.5%; max-width:62px; height:56px; }
  .plot .pl-home{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:88%; opacity:.45; filter:grayscale(.4); }
  .plot .pl-an{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%); width:62%; display:none; }
  .plot.filled .pl-home{ opacity:1; filter:none; }
  .plot.filled .pl-an{ display:block; }
  .plot svg{ width:100%; display:block; }
  .plot.filled .pl-an svg{ animation:liveBob 1.6s ease-in-out infinite alternate; }
  .plot.filled.water .pl-an svg{ animation:liveSplash 1.1s ease-in-out infinite; }
  .plot.filled.flyer .pl-an svg{ animation:liveFlit 2.2s ease-in-out infinite; }
  @keyframes liveBob{ from{ transform:translateY(0);} to{ transform:translateY(-4px);} }
  @keyframes liveSplash{ 0%,100%{ transform:translateY(0) rotate(0);} 30%{ transform:translateY(-9px) rotate(-6deg);} 55%{ transform:translateY(1px);} }
  @keyframes liveFlit{ 0%,100%{ transform:translate(0,0);} 30%{ transform:translate(5px,-7px);} 65%{ transform:translate(-4px,-3px);} }
  .note-float{ position:absolute; z-index:7; font-size:17px; color:#2f83c4; pointer-events:none; animation:noteUp 1.6s ease-out forwards; }
  @keyframes noteUp{ 0%{ transform:translateY(0); opacity:0;} 15%{ opacity:1;} 100%{ transform:translateY(-44px) rotate(10deg); opacity:0;} }

  /* ---------- Hoot row ---------- */
  #groundRow{ position:relative; z-index:6; display:flex; align-items:flex-end; gap:6px; padding:0 10px max(8px,env(safe-area-inset-bottom)); }
  #hootZone{ display:flex; align-items:flex-end; gap:8px; flex:1 1 auto; min-width:0; }
  #hootFig{ position:relative; border:none; background:none; padding:0; cursor:pointer; width:clamp(104px,29vw,168px); flex:0 0 auto; filter:drop-shadow(0 8px 10px rgba(23,50,79,.25)); animation:hootBob 3.2s ease-in-out infinite; transform-origin:50% 92%; }
  #hootFig svg{ width:100%; display:block; overflow:visible; }
  @keyframes hootBob{ 0%,100%{ transform:translateY(0) rotate(0);} 50%{ transform:translateY(-4px) rotate(-1deg);} }
  #hootFig.celebrate{ animation:hootJump .55s cubic-bezier(.34,1.6,.5,1) 3; }
  @keyframes hootJump{ 0%{ transform:translateY(0);} 35%{ transform:translateY(-26px) rotate(-3deg);} 70%{ transform:translateY(2px);} 100%{ transform:translateY(0);} }
  #hootFig.shake{ animation:hootShake .5s ease-in-out 2; }
  @keyframes hootShake{ 0%,100%{ transform:rotate(0);} 25%{ transform:rotate(-5deg);} 75%{ transform:rotate(5deg);} }
  #hootFig.talking{ animation:hootTalk .22s ease-in-out infinite alternate; }
  @keyframes hootTalk{ from{ transform:translateY(0) scale(1);} to{ transform:translateY(-2px) scale(1.018);} }
  #hootFig.wave .wing-r{ animation:wingWave .45s ease-in-out 6 alternate; }
  #hootFig .wing-r{ transform-box:fill-box; transform-origin:15% 12%; }
  #hootFig .wing-l{ transform-box:fill-box; transform-origin:85% 12%; }
  @keyframes wingWave{ from{ transform:rotate(0);} to{ transform:rotate(-38deg);} }
  #hootFig.celebrate .wing-l{ animation:wingFlapL .28s ease-in-out infinite alternate; }
  #hootFig.celebrate .wing-r{ animation:wingFlapR .28s ease-in-out infinite alternate; }
  @keyframes wingFlapL{ from{ transform:rotate(0);} to{ transform:rotate(30deg);} }
  @keyframes wingFlapR{ from{ transform:rotate(0);} to{ transform:rotate(-30deg);} }
  #hootFig .eyes{ transform-box:fill-box; transform-origin:center; animation:blink 4.6s infinite; }
  @keyframes blink{ 0%,92%,100%{ transform:scaleY(1);} 95%{ transform:scaleY(.08);} }
  #bubbleCol{ flex:1 1 auto; min-width:0; padding-bottom:6px; }
  #bubble{ position:relative; background:var(--paper); border:3px solid #fff; border-radius:20px; box-shadow:0 5px 0 rgba(23,50,79,.14),0 12px 24px rgba(23,50,79,.14); padding:10px 14px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(15px,4.1vw,19px); line-height:1.3; color:var(--ink); }
  #bubble::after{ content:""; position:absolute; left:-11px; bottom:16px; border:6px solid transparent; border-right:9px solid var(--paper); }
  #bubble .b-big{ color:#d84a3d; font-size:1.22em; font-weight:700; }
  #hootName{ display:inline-block; margin-top:5px; margin-left:8px; background:#17324f; color:#ffe9a8; font-family:"Fredoka",sans-serif; font-weight:700; font-size:11px; letter-spacing:.22em; padding:2px 10px 2px 12px; border-radius:99px; }

  /* fly clone + particles */
  .fly-clone{ position:absolute; z-index:9; pointer-events:none; }
  .fly-clone svg{ width:100%; display:block; }
  .particle{ position:absolute; z-index:9; width:10px; height:10px; border-radius:3px; pointer-events:none; }
  .confetti{ position:absolute; z-index:9; width:11px; height:11px; border-radius:3px; pointer-events:none; }

  /* ---------- start panel / win ---------- */
  #startPanel{ position:absolute; z-index:8; left:50%; top:45%; transform:translate(-50%,-50%); width:min(94vw,452px); background:rgba(255,253,246,.98); border:3px solid #fff; border-radius:26px; box-shadow:0 10px 0 rgba(23,50,79,.12),0 24px 48px rgba(23,50,79,.25); padding:16px 18px 14px; text-align:center; max-height:92dvh; overflow:auto; }
  #startPanel[hidden]{ display:none; }
  #startPanel h1{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(26px,7vw,36px); margin:0; color:var(--ink); }
  #startPanel h1 .t-a{ color:var(--leaf-dark); } #startPanel h1 .t-b{ color:#e07f00; }
  #startPanel p{ font-weight:800; color:var(--ink-soft); font-size:15px; line-height:1.4; margin:7px 0 0; }
  .mode-row{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:13px 0 4px; }
  .mode-chip{ flex:1 1 46%; border:3px solid #dcebf5; background:#f2f9ff; border-radius:16px; padding:8px 6px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:15.5px; color:var(--ink); cursor:pointer; line-height:1.15; }
  .mode-chip small{ display:block; font-family:"Nunito",sans-serif; font-weight:800; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .mode-chip.selected{ border-color:var(--sun); background:#fff6dd; box-shadow:0 4px 0 rgba(232,169,12,.4); }
  #playBtn{ margin-top:12px; border:none; cursor:pointer; background:var(--leaf); color:#fff; font-family:"Fredoka",sans-serif; font-weight:700; font-size:23px; padding:12px 44px; border-radius:999px; box-shadow:0 6px 0 var(--leaf-dark),0 14px 24px rgba(61,161,71,.35); transition:transform .12s ease; }
  #playBtn:active{ transform:scale(.95); }
  #winOverlay{ position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(23,50,79,.38); padding:14px; }
  #winOverlay[hidden]{ display:none; }
  #winCard{ background:var(--paper); border:3px solid #fff; border-radius:26px; box-shadow:0 12px 0 rgba(23,50,79,.15),0 30px 60px rgba(23,50,79,.3); padding:20px 22px 18px; text-align:center; width:min(94vw,470px); max-height:92dvh; overflow:auto; }
  #winStars{ font-size:30px; letter-spacing:6px; color:#e3edf5; line-height:1; }
  #winStars span{ display:inline-block; }
  #winStars span.lit{ color:var(--sun); text-shadow:0 0 14px rgba(255,201,60,.8); animation:starLit .4s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starLit{ 0%{ transform:scale(.3) rotate(-30deg);} 100%{ transform:scale(1) rotate(0);} }
  #winCard h2{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(25px,6.6vw,34px); margin:8px 0 0; }
  #winRecap{ font-weight:800; color:var(--ink-soft); font-size:15.5px; line-height:1.45; margin:8px 0 0; }
  #winChips{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
  .chip{ background:#eaf7ec; border:2px solid #bfe6c6; color:var(--ink); font-family:"Fredoka",sans-serif; font-weight:600; font-size:14px; padding:4px 12px; border-radius:999px; }
  .win-btns{ display:flex; gap:9px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .win-btn{ border:none; cursor:pointer; font-family:"Fredoka",sans-serif; font-weight:700; font-size:18px; padding:11px 24px; border-radius:999px; }
  #againBtn{ background:var(--leaf); color:#fff; box-shadow:0 5px 0 var(--leaf-dark); }
  #winHomeBtn{ background:#eef5fb; color:var(--ink); box-shadow:0 5px 0 #cfdfec; }
  .win-btn:active{ transform:scale(.95); }

  @media (max-height:500px) and (min-width:560px){
    #hootFig{ width:clamp(80px,24vh,104px); }
    #perch{ width:clamp(80px,22vh,104px); }
    #targetCard{ margin-top:4px; padding:4px 8px 4px 12px; }
    #startPanel{ top:50%; padding:10px 16px; }
    .spot{ width:clamp(76px,22vh,104px); }
    .plot{ height:44px; }
  }
  @media (prefers-reduced-motion:reduce){
    .cloud,.bfly,#perchArt,.animal-choice svg{ animation:none !important; }
  }
</style>
</head>
<body>
<div id="stage">
  <button class="decor" id="sun" type="button" aria-label="Sun — tap for a sparkle">

     started) lines can be replaced when the game moves on. The hub's

     voice in the app the same way. No device text-to-speech anywhere.

      targetMain.textContent=pair.home; tcLabel.textContent="Who lives in the "+pair.home+"?";
      say("Look — a <span class='b-big'>"+pair.home+"</span>! "+pair.clue+" Who lives here? Tap the animal!");
      (function(){var h=(function(){var P={};try{P=window.parent||{};}catch(e){}return P.HOOT_HAVE||{};})(),k="word-home-"+pair.home.toLowerCase().replace(/ /g,"-");if(h[k]) enqueue(k+".mp3","name","",null);})(); /* 3e44 */
      if((function(n){try{return !!((window.parent.HOOT_HAVE||{})[n]);}catch(e){return false;}})("ask-who-lives-in")){ clearPending(); enqueue("ask-who-lives-in.mp3","callout","",null); enqueue("word-home-"+String(pair.home).toLowerCase().replace(/ +/g,"-")+".mp3","callout","",null); } /* 3e51 */
      var others=shuffle(PAIRS.filter(function(p){ return p.id!==pair.id; })).slice(0,2);
      var animals=shuffle([pair].concat(others));
      choiceRow.innerHTML=""; choiceRow.hidden=false;
      animals.forEach(function(p){
        var b=document.createElement("button"); b.type="button"; b.className="animal-choice";
        b.setAttribute("aria-label",p.name);
        b.innerHTML=ART_ANIMAL[p.id]+'<span class="spot-name">'+p.name+'</span>';
        b.addEventListener("click",function(){ onAnimalTap(b,p); });
        choiceRow.appendChild(b);
      });
    }
    targetCard.style.display="flex";
    targetCard.classList.remove("new-target"); void targetCard.offsetWidth; targetCard.classList.add("new-target");
    setDots(GOAL,homed.length);
    inputLock=false;
  }
  function nextPair(){
    if(dead||state!=="playing") return;
    if(homed.length>=GOAL){ winRound(); return; }
    var remaining=queue.filter(function(p){ return homed.indexOf(p)<0; });
    presentPair(remaining[0]);
  }
  function correctHome(spotEl,pair){
    inputLock=true;
    spotEl.classList.add("right");
    var pairNow=current;
    stars++; bumpStars(); updateHUD();
    hootReact("celebrate",1750); popSound();
    say("<span class='b-big'>"+pairNow.name+" lives in the "+pairNow.home+"!</span> "+pairNow.homeFact+" Star for you!");
    (function(){var h=(function(){var P={};try{P=window.parent||{};}catch(e){}return P.HOOT_HAVE||{};})(),k="word-home-"+pairNow.home.toLowerCase().replace(/ /g,"-");if(h[k]) enqueue(k+".mp3","name","",null);})(); /* 3e44: Hoot names the home */
    enqueuePraise();
    var fromRect=(mode==="takehome"?perchArt:spotEl).getBoundingClientRect();
    /* the praised animal flies home and moves into the village */
    setTimeout(function(){
      if(dead) return;
      homed.push(pairNow); settleInVillage(pairNow); starSound();
      var plot=$("plot"+(homed.length-1));
      if(plot){ var r=plot.getBoundingClientRect(); burst(r.left+r.width/2,r.top+10); }
      setDots(GOAL,homed.length);
    }, mode==="takehome"?650:500);
    if(mode==="takehome"){
      flyAnimalTo(pairNow,fromRect,spotEl,function(){});
    }
    perch.hidden=true;
    /* Established rule: correct answers auto-advance — about 1.6s of
       praise, fact and star, then the next round. No Next button. */
    var tk=++roundToken;
    setTimeout(function(){
      if(dead||tk!==roundToken||state!=="playing") return;
      clearScene(); nextPair();
    },1750);
  }
  function onHomeTap(b,p){
    if(state!=="playing"||inputLock||dead) return;
    if(b.dataset.done) return;
    audio();
    if(p.id===current.id){ b.dataset.done="1"; correctHome(b,p); }
    else {
      boingSound(); hootReact("shake",1000);
      perch.classList.remove("shake"); void perch.offsetWidth; perch.classList.add("shake");
      b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
      say("That&rsquo;s the <span class='b-big'>"+p.home+"</span> — not "+current.name+"&rsquo;s home! "+current.clue+" Try again!");
      enqueueHint();
    }
  }
  function onAnimalTap(b,p){
    if(state!=="playing"||inputLock||dead) return;
    if(b.dataset.done) return;
    audio();
    if(p.id===current.id){ b.dataset.done="1"; correctHome(b,p); }
    else {
      boingSound(); hootReact("shake",1000);
      b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
      say("That&rsquo;s <span class='b-big'>"+p.name+"</span>! "+p.name+" doesn&rsquo;t live in the "+current.home+". "+current.clue+" Who else could it be?");
      enqueueHint();
    }
  }

  /* ---------- Meet the Neighbours ---------- */
  function startMeet(){
    clearScene();
    targetMain.textContent="Neighbours"; tcLabel.textContent="Tap a home — who lives inside?";
    targetCard.style.display="flex";
    setDots(PAIRS.length,Object.keys(met).length);
    say("Welcome to the village! Tap any home and see who pops out to say hello!");
    enqueue("hoot-game-hello.mp3","hello","",null);
    meetGrid.hidden=false;
    PAIRS.forEach(function(p){
      var b=document.createElement("button"); b.type="button"; b.className="meet-home"+(met[p.id]?" met":"");
      b.setAttribute("aria-label",p.home);
      b.innerHTML=ART_HOME[p.homeId]+'<span class="mh-name">'+p.home+'</span>';
      b.addEventListener("click",function(){
        if(state!=="playing"||dead) return;
        audio(); popSound();
        perchArt.innerHTML=ART_ANIMAL[p.id]; perchName.textContent=p.name; perch.hidden=false;
        say("<span class='b-big'>"+p.name+"</span> lives in the "+p.home+"! "+p.fact);
        clearPending(); enqueue("word-"+p.id+".mp3","name","",null); enqueue("word-home-"+String(p.home).toLowerCase().replace(/ +/g,"-")+".mp3","name","",null); /* 3e51: Meet the Neighbours says who popped out and its home */
        hootReact("celebrate",1100);
        if(!met[p.id]){
          met[p.id]=1; b.classList.add("met"); stars++; bumpStars(); updateHUD();
          if(window.__hootSpeak) window.__hootSpeak("idle");
          setDots(PAIRS.length,Object.keys(met).length);
          if(Object.keys(met).length>=PAIRS.length){
            var tk=++roundToken;
            (window.__hwFastWin||setTimeout)(function(){ if(!dead&&tk===roundToken&&state==="playing") winRound(); },400);
          }
        } else {
          if(window.__hootSpeak) window.__hootSpeak("idle");
        }
      });
      meetGrid.appendChild(b);
    });
  }

  /* ---------- Count the Neighbours ---------- */
  var COUNT_SPOTS=[[4,6],[30,2],[56,8],[78,3],[16,30],[44,26],[70,30],[88,24],[58,44]];
  function startCountRound(){
    clearScene();
    countK=2+Math.floor(Math.random()*8); /* 2..9 */
    targetMain.textContent="How many?"; tcLabel.textContent="How many neighbours are home?";
    targetCard.style.display="flex";
    setDots(COUNT_ROUNDS,countRound);
    say("Some neighbours are home! Count them with me — how many animals can you see?");
    enqueue((function(n){try{return !!((window.parent.HOOT_HAVE||{})[n]);}catch(e){return false;}})("ask-how-many-animals")?"ask-how-many-animals.mp3":"hoot-look-closely.mp3","look","",null); /* 3e51: ask the real question */
    var chosen=shuffle(PAIRS.slice()).slice(0,countK);
    countLayer.innerHTML="";
    chosen.forEach(function(p,i){
      var d=document.createElement("div"); d.className="mini-pair"; d.id="mini"+i;
      d.style.left=COUNT_SPOTS[i][0]+"%"; d.style.top=COUNT_SPOTS[i][1]+"%";
      d.innerHTML='<div class="mp-home">'+ART_HOME[p.homeId]+'</div><div class="mp-an">'+ART_ANIMAL[p.id]+'</div>';
      countLayer.appendChild(d);
    });
    var opts=shuffle([countK].concat(shuffle([countK-1,countK+1,countK+2].filter(function(v){ return v>0&&v!==countK; })).slice(0,2)));
    choiceRow.innerHTML=""; choiceRow.hidden=false;
    opts.forEach(function(v){
      var b=document.createElement("button"); b.type="button"; b.className="num-chip"; b.textContent=v;
      b.setAttribute("aria-label","Number "+v);
      b.addEventListener("click",function(){ onCountTap(b,v,chosen); });
      choiceRow.appendChild(b);
    });
    inputLock=false;
  }
  function onCountTap(b,v,chosen){
    if(state!=="playing"||inputLock||dead) return;
    audio();
    if(v!==countK){
      boingSound(); hootReact("shake",1000);
      b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
      say("Good counting try! Let&rsquo;s count together slowly — touch each neighbour: 1, 2, 3…");
      enqueueHint();
      return;
    }
    inputLock=true;
    stars++; bumpStars(); updateHUD();
    countAnswers.push(countK);
    hootReact("celebrate",1600);
    say("Let&rsquo;s count out loud together!");
    clearPending();
    for(var i=0;i<countK;i++){
      (function(n){
        enqueue("call-number-"+n+".mp3","count","",function(){
          var m=$("mini"+(n-1));
          if(m){ m.classList.remove("bounce"); void m.offsetWidth; m.classList.add("bounce"); }
          say("Counting neighbours… <span class='b-big'>"+n+"!</span>");
        });
      })(i+1);
    }
    enqueuePraise();
    var tk=++roundToken;
    setTimeout(function(){
      if(dead||tk!==roundToken||state!=="playing") return;
      countRound++;
      if(countRound>=COUNT_ROUNDS){ winRound(); } else { startCountRound(); }
    },1400+countK*620);
  }

  /* ================= START / WIN ================= */
  function startRound(){
    clearPending(); roundToken++;
    stars=0; homed=[]; met={}; countRound=0; countAnswers=[]; inputLock=false; wonRoundFlag=false;
    buildVillage();
    village.style.display=(mode==="meet")?"none":"flex";
    winOverlay.hidden=true; startPanel.hidden=true;
    state="playing"; updateHUD(); clearScene();
    if(mode==="meet"){ startMeet(); return; }
    if(mode==="count"){ startCountRound(); return; }
    queue=shuffle(PAIRS.slice()).slice(0,GOAL);
    enqueue("hoot-game-hello.mp3","hello","",function(){
      say(mode==="takehome" ? "Hello! Let&rsquo;s take every animal home!" : "Hello! Let&rsquo;s play Who Lives Here?");
    });
    presentPair(queue[0]);
  }
  var wonRoundFlag=false;
  function winRound(){
    if(wonRoundFlag) return; wonRoundFlag=true; state="won";
    clearScene(); village.style.display="flex";
    targetCard.style.display="none";
    vQueue=vQueue.filter(function(q){ return q.kind==="praise"; });
    enqueue("hoot-you-learned.mp3","recap","",null);
    winChips.innerHTML="";
    if(mode==="meet"){
      winTitle.textContent="You Met Everyone!";
      winRecap.innerHTML="You met all <b>12 neighbours</b> and learned where every one of them lives!";
      PAIRS.forEach(function(p){ var c=document.createElement("span"); c.className="chip"; c.textContent=p.name+" → "+p.home; winChips.appendChild(c); });
      setDots(PAIRS.length,PAIRS.length);
    } else if(mode==="count"){
      winTitle.textContent="Counting Star!";
      winRecap.innerHTML="You counted the neighbours four times: <b>"+listWords(countAnswers.map(String))+"</b> — and Hoot counted out loud with you!";
      countAnswers.forEach(function(n){ var c=document.createElement("span"); c.className="chip"; c.textContent=n+" neighbours"; winChips.appendChild(c); });
    } else {
      winTitle.textContent="Everybody's Home!";
      var pairs=homed.slice();
      winRecap.innerHTML="Every animal is home and happy: <b>"+listWords(pairs.map(function(p){ return p.name+" in the "+p.home; }))+"</b>!";
      pairs.forEach(function(p){ var c=document.createElement("span"); c.className="chip"; c.textContent=p.name+" → "+p.home; winChips.appendChild(c); });
    }
    var starEls=winStars.children;
    for(var i=0;i<starEls.length;i++){
      starEls[i].classList.remove("lit");
      (function(el,d){ setTimeout(function(){ el.classList.add("lit"); },d); })(starEls[i],200+i*180);
    }
    (window.__hwFastWin||setTimeout)(function(){ if(state==="won"&&!dead){ winOverlay.hidden=false; confetti(); sparkleSound(); } },350);
  }
  function resetToStart(){
    clearPending(); roundToken++;
    state="start"; inputLock=false; wonRoundFlag=false;
    winOverlay.hidden=true; startPanel.hidden=false;
    targetCard.style.display="none";
    clearScene(); buildVillage(); village.style.display="flex";
    say("Hi! I&rsquo;m Hoot! Every animal has a home — tap <span class='b-big'>Play</span> and let&rsquo;s take them home together!");
    hootFig.classList.add("wave");
    setTimeout(function(){ hootFig.classList.remove("wave"); },2900);
  }

  /* ================= CONTROLS ================= */
  function hearAgain(){
    audio();
    if(state==="playing"&&current&&(mode==="takehome"||mode==="who")) presentPair(current);
    else if(state!=="playing"&&!vPlaying) if(window.__hootSpeak) window.__hootSpeak("idle");
  }
  hootFig.addEventListener("click",hearAgain);
  $("hearBtn").addEventListener("click",function(){
    audio();
    if(state==="playing"&&current&&(mode==="takehome"||mode==="who")){
      say(mode==="takehome" ? "Where does <span class='b-big'>"+current.name+"</span> live? "+current.clue
                             : "Who lives in the <span class='b-big'>"+current.home+"</span>? "+current.clue);
      if(!vPlaying) enqueue("hoot-look-closely.mp3","look","",null);
    } else hearAgain();
  });
  $("soundBtn").addEventListener("click",function(){
    soundOn=!soundOn;
    $("soundOnIc").style.display=soundOn?"block":"none";
    $("soundOffIc").style.display=soundOn?"none":"block";
    $("soundBtn").setAttribute("aria-label",soundOn?"Turn sound off":"Turn sound on");
    if(!soundOn){ clearPending(); }
    else { audio(); tone(660,660,0.1,"triangle",0.12); }
  });
  $("homeBtn").addEventListener("click",function(){ audio(); tone(520,520,0.09,"triangle",0.1); resetToStart(); });
  document.querySelectorAll(".mode-chip").forEach(function(ch){
    ch.addEventListener("click",function(){
      mode=ch.getAttribute("data-mode");
      document.querySelectorAll(".mode-chip").forEach(function(c){ c.classList.toggle("selected",c===ch); });
      tone(660,660,0.1,"triangle",0.1);
    });
  });
  $("playBtn").addEventListener("click",function(){ audio(); tone(740,740,0.1,"triangle",0.12); startRound(); });
  $("againBtn").addEventListener("click",function(){ audio(); tone(740,740,0.1,"triangle",0.12); startRound(); });
  $("winHomeBtn").addEventListener("click",function(){ audio(); resetToStart(); });

  /* ================= LIVING SCENE TAPS ================= */
  $("sun").addEventListener("click",function(){
    audio(); var s=$("sun"); s.classList.remove("zing"); void s.offsetWidth; s.classList.add("zing");
    sparkleSound();
    if(state==="start") say("That&rsquo;s Mr. Sun! He watches over all the animal homes!");
  });
  document.querySelectorAll(".cloud").forEach(function(c){
    c.addEventListener("click",function(){ audio(); c.classList.add("puff"); tone(220,120,0.16,"triangle",0.09); setTimeout(function(){ c.classList.remove("puff"); },300); });
  });
  document.querySelectorAll(".bfly").forEach(function(bf){
    bf.addEventListener("click",function(){
      audio(); sparkleSound();
      if(bf.animate) bf.animate([{transform:"rotate(0deg) scale(1)"},{transform:"rotate(360deg) scale(1.25)"}],{duration:560,easing:"ease-in-out"});
    });
  });

  /* ================= LEAVING THE GAME ================= */
  function teardown(){ dead=true; clearPending(); hootTalking(false); }
  window.addEventListener("pagehide",teardown);
  document.addEventListener("visibilitychange",function(){ if(document.hidden) clearPending(); });

  /* ================= INIT ================= */
  buildVillage();
  updateHUD();
  hootFig.classList.add("wave");
  setTimeout(function(){ hootFig.classList.remove("wave"); },2900);

  /* Probe/debug handle: read-only snapshot of the round state. */
  window.__animalsGame={
    snapshot:function(){
      return { state:state, mode:mode, stars:stars,
        current:current?current.id:null, homed:homed.map(function(p){ return p.id; }),
        met:Object.keys(met).length, countK:countK, countRound:countRound,
        winShown:!winOverlay.hidden, voicePlaying:vPlaying,
        voiceQueue:vQueue.map(function(q){ return q.file; }) };
    }
  };
})();
</script>
