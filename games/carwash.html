<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>
window.__HOOT_GAME_KEY__="carwash";
window.__HOOT_SELF_COACH__=true;
</script>
<script src="js/hoot-game-head.js?v=llprev3e159"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Hoot's Muddy Truck Car Wash</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --sky-top:#1daeff;
    --sky-mid:#6cd4ff;
    --sky-low:#c6f2ff;
    --aqua-hi:#22d3ee;
    --aqua-deep:#0284c7;
    --foam-white:#ffffff;
    --gold:#ffd84d;
    --gold-deep:#c98200;
    --ink:#17344d;
    --bay-blue:#0ea5e9;
    --bay-dark:#0369a1;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{
    height:100%;
    width:100%;
    margin:0;
    padding:0;
    overflow:hidden;
  }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#38bdf8;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ================= FULLSCREEN SUNNY CAR WASH STAGE ================= */
  #stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:linear-gradient(180deg, #25b4ff 0%, #6cd8ff 44%, #bceeff 72%, #e6f9ff 100%);
  }

  /* Pixar 3D Car Wash Backdrop with sunny aqua fallback underneath */
  #carwashBg{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    background-image:url("assets/carwash3d/bg_carwash.jpg"), linear-gradient(180deg, #25b4ff 0%, #6cd8ff 44%, #bceeff 72%, #e6f9ff 100%);
  }
  #carwashBg::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 44%, rgba(255,255,255,.08) 30%, rgba(3,58,99,.24) 100%),
      linear-gradient(180deg, rgba(14,165,233,.14) 0%, rgba(255,255,255,0) 24%, rgba(2,132,199,.18) 100%);
  }

  /* Gentle Ambient Floating Soap Bubbles in Sky */
  #ambientBubbles{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    overflow:hidden;
  }
  .amb-bub{
    position:absolute;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.72);
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.85) 0%, rgba(186,230,253,.28) 45%, rgba(244,114,182,.18) 80%, rgba(255,255,255,.08) 100%);
    opacity:.68;
    animation:ambFloat 11s ease-in-out infinite;
  }
  @keyframes ambFloat{
    0%,100%{ transform:translateY(0) translateX(0) scale(1); }
    50%{ transform:translateY(-22px) translateX(10px) scale(1.06); }
  }

  /* ================= TOP HUD (4 VEHICLE PILLS + STARS + SOUND) ================= */
  #hud{
    position:relative;
    z-index:20;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 4px max(12px, env(safe-area-inset-left));
    pointer-events:none;
  }
  #vehicleBar{
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:auto;
  }
  .vehicle-pill{
    position:relative;
    min-width:66px;
    min-height:66px;
    width:68px;
    height:68px;
    padding:4px;
    border-radius:22px;
    border:4px solid #ffffff;
    background:var(--pill-bg, linear-gradient(180deg,#ff6b6b,#dc2626));
    box-shadow:0 5px 0 var(--pill-shadow, #991b1b), 0 8px 18px rgba(12,50,82,.26);
    display:grid;
    place-items:center;
    cursor:pointer;
    outline:none;
    transition:transform .16s cubic-bezier(.34,1.65,.5,1), box-shadow .16s;
  }
  .vehicle-pill svg{
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.22));
  }
  .vehicle-pill:active{
    transform:translateY(3px) scale(.93);
  }
  .vehicle-pill.active{
    transform:translateY(-3px) scale(1.08);
    border-color:#ffd84d;
    box-shadow:0 6px 0 var(--pill-shadow, #991b1b), 0 0 0 4px rgba(255,216,77,.68), 0 10px 22px rgba(12,50,82,.3);
  }
  .vehicle-pill .clean-badge{
    position:absolute;
    top:-6px;
    right:-6px;
    width:24px;
    height:24px;
    border-radius:50%;
    background:linear-gradient(180deg, #fff59d 0%, #f59e0b 100%);
    border:2.5px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,.28);
    display:grid;
    place-items:center;
    font-size:13px;
    line-height:1;
    opacity:0;
    transform:scale(.3);
    transition:opacity .28s, transform .38s cubic-bezier(.34,1.9,.5,1);
    pointer-events:none;
  }
  .vehicle-pill.washed .clean-badge{
    opacity:1;
    transform:scale(1);
  }

  .hud-right{
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:auto;
  }
  #starPill{
    min-height:64px;
    height:64px;
    padding:0 16px 0 12px;
    border-radius:999px;
    border:4px solid #ffffff;
    background:linear-gradient(180deg, #fff9d6 0%, #ffe08a 100%);
    box-shadow:0 5px 0 #c98200, 0 8px 18px rgba(12,50,82,.22);
    display:inline-flex;
    align-items:center;
    gap:7px;
    color:var(--ink);
  }
  #starPill.bump{ animation:starBump .46s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.18) rotate(-4deg); }
    100%{ transform:scale(1); }
  }
  .star-glyph{
    font-size:28px;
    line-height:1;
    color:#f59e0b;
    filter:drop-shadow(0 2px 0 rgba(255,255,255,.85));
  }
  #starNum{
    font-size:26px;
    font-weight:700;
    line-height:1;
    min-width:20px;
    text-align:center;
  }
  .hud-dots{
    display:flex;
    align-items:center;
    gap:4px;
    margin-left:2px;
  }
  .mini-dot{
    width:14px;
    height:14px;
    border-radius:50%;
    border:2px solid #c98200;
    background:rgba(255,255,255,.7);
    transition:transform .3s cubic-bezier(.34,1.8,.5,1), background .25s;
  }
  .mini-dot.lit{
    background:var(--d-col, #22c55e);
    border-color:#fff;
    box-shadow:0 0 8px var(--d-col, #22c55e);
    transform:scale(1.22);
  }

  #soundBtn{
    min-width:64px;
    min-height:64px;
    width:66px;
    height:66px;
    border-radius:50%;
    border:4px solid #ffffff;
    background:linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
    box-shadow:0 5px 0 #075985, 0 8px 18px rgba(12,50,82,.26);
    color:#fff;
    font-size:28px;
    line-height:1;
    display:grid;
    place-items:center;
    cursor:pointer;
    outline:none;
    transition:transform .14s cubic-bezier(.34,1.6,.5,1);
  }
  #soundBtn:active{ transform:translateY(3px) scale(.93); }

  /* ================= MAIN ARENA: CAR-WASH HOOT + WASH BAY ================= */
  #arena{
    position:relative;
    z-index:10;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:1160px;
    margin:0 auto;
    padding:4px clamp(10px, 2.2vw, 24px) 6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(10px, 2.2vw, 24px);
  }

  /* Car-Wash Hoot Buddy (Yellow Rain Hat + Bubbly Sponge) */
  #hootWrap{
    position:relative;
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    align-self:flex-end;
    padding-bottom:6px;
    z-index:14;
  }
  #hootBtn{
    width:clamp(120px, 15.5vw, 178px);
    height:clamp(134px, 17.2vw, 198px);
    min-width:64px;
    min-height:64px;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    outline:none;
    position:relative;
    filter:drop-shadow(0 10px 14px rgba(10,48,80,.3));
    transition:transform .2s cubic-bezier(.34,1.65,.5,1);
    animation:hootIdle 3.2s ease-in-out infinite;
  }
  #hootBtn svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }
  #hootBtn.cheer{
    animation:hootCheer .65s cubic-bezier(.34,1.8,.5,1) 2 !important;
  }
  #hootBtn.scrubbing #hootSpongeArm{
    animation:hootScrubWave .22s ease-in-out infinite alternate;
  }
  @keyframes hootIdle{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-5px) rotate(-1.6deg); }
  }
  @keyframes hootCheer{
    0%,100%{ transform:translateY(0) scale(1) rotate(0deg); }
    40%{ transform:translateY(-20px) scale(1.1) rotate(-6deg); }
    72%{ transform:translateY(-5px) scale(1.03) rotate(5deg); }
  }
  @keyframes hootScrubWave{
    from{ transform:rotate(-18deg) translate(0, 0); }
    to{ transform:rotate(14deg) translate(6px, -5px); }
  }
  #hootSpongeArm{
    transform-origin:162px 150px;
  }

  /* ================= SUNNY WASH BAY STAGE ================= */
  #playStage{
    position:relative;
    flex:1 1 auto;
    min-width:0;
    height:100%;
    max-width:780px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  /* Wash Bay Arch Frame */
  #washBayFrame{
    position:relative;
    width:min(100%, 730px, calc((100dvh - 208px) * 1.52));
    max-width:100%;
    max-height:100%;
    aspect-ratio:640 / 420;
    border-radius:34px;
    padding:12px;
    background:linear-gradient(180deg, #38bdf8 0%, #0284c7 48%, #0369a1 100%);
    border:5px solid #ffffff;
    box-shadow:
      0 10px 0 #075985,
      0 20px 36px rgba(8,47,73,.36),
      inset 0 4px 10px rgba(255,255,255,.62);
    display:flex;
    flex-direction:column;
  }

  /* Step Progress Ribbon Mounted on Top of Wash Arch */
  #stepRibbon{
    position:absolute;
    top:-22px;
    left:50%;
    transform:translateX(-50%);
    z-index:16;
    display:flex;
    align-items:center;
    gap:8px;
    padding:5px 12px;
    border-radius:999px;
    background:linear-gradient(180deg, #ffffff 0%, #e0f2fe 100%);
    border:3.5px solid #38bdf8;
    box-shadow:0 4px 0 #0284c7, 0 8px 16px rgba(8,47,73,.22);
    pointer-events:none;
  }
  .step-pip{
    position:relative;
    width:36px;
    height:36px;
    border-radius:50%;
    background:rgba(14,165,233,.14);
    border:2.5px solid rgba(2,132,199,.3);
    display:grid;
    place-items:center;
    font-size:19px;
    line-height:1;
    transition:transform .28s cubic-bezier(.34,1.8,.5,1), background .25s, border-color .25s, box-shadow .25s;
  }
  .step-pip.active{
    background:linear-gradient(180deg, #fff59d 0%, #fbbf24 100%);
    border-color:#ffffff;
    box-shadow:0 0 0 3px #f59e0b, 0 4px 10px rgba(245,158,11,.5);
    transform:scale(1.18);
  }
  .step-pip.done{
    background:linear-gradient(180deg, #86efac 0%, #22c55e 100%);
    border-color:#ffffff;
    box-shadow:0 2px 6px rgba(22,163,74,.4);
  }
  .step-pip.done::after{
    content:"✓";
    position:absolute;
    bottom:-4px;
    right:-4px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#15803d;
    color:#fff;
    font-size:10px;
    font-weight:900;
    display:grid;
    place-items:center;
    border:1.5px solid #fff;
  }

  /* Inner Glossy Wash Bay Arena */
  #washBayInner{
    position:relative;
    width:100%;
    height:100%;
    border-radius:23px;
    overflow:hidden;
    background:linear-gradient(180deg,
      rgba(224,247,255,.78) 0%,
      rgba(186,238,255,.70) 58%,
      rgba(125,211,252,.82) 74%,
      rgba(56,189,248,.92) 100%);
    box-shadow:inset 0 0 24px rgba(3,105,161,.26);
    touch-action:none;
  }

  /* Sunny tiled wash bay floor + overhead nozzle bar */
  #washBayDecor{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
  }
  .bay-floor{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:26%;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.26) 0 48px, rgba(255,255,255,.06) 48px 96px),
      linear-gradient(180deg, #7dd3fc 0%, #38bdf8 36%, #0284c7 100%);
    border-top:4px solid rgba(255,255,255,.85);
  }
  .bay-drain{
    position:absolute;
    left:50%;
    bottom:8%;
    transform:translateX(-50%);
    width:56%;
    height:10px;
    border-radius:999px;
    background:repeating-linear-gradient(90deg, rgba(7,89,133,.55) 0 12px, rgba(186,230,253,.45) 12px 20px);
    opacity:.55;
  }
  .bay-arch-nozzles{
    position:absolute;
    top:0;
    left:8%;
    right:8%;
    height:18px;
    border-radius:0 0 14px 14px;
    background:linear-gradient(180deg, #e2e8f0 0%, #94a3b8 100%);
    border-bottom:3px solid #64748b;
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
    padding:0 16px;
  }
  .nozzle-tip{
    width:14px;
    height:8px;
    border-radius:0 0 6px 6px;
    background:#334155;
    transform:translateY(5px);
  }

  /* Progress meter tucked cleanly along bottom-left/right inside bay */
  #cleanMeterWrap{
    position:absolute;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
    z-index:12;
    width:min(72%, 340px);
    height:16px;
    border-radius:999px;
    background:rgba(12,74,110,.36);
    border:2.5px solid rgba(255,255,255,.92);
    overflow:hidden;
    pointer-events:none;
    box-shadow:0 3px 8px rgba(8,47,73,.25);
    transition:opacity .3s;
  }
  #stage[data-phase="celebrate"] #cleanMeterWrap{
    opacity:0;
  }
  #cleanMeterFill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, #f472b6 0%, #fbbf24 38%, #34d399 72%, #38bdf8 100%);
    transition:width .14s ease-out;
  }

  /* Truck Container (Roll-in, Honk Bounce, Dry Shake, Zoom-out!) */
  #truckMotion{
    position:absolute;
    inset:0;
    z-index:3;
    will-change:transform;
  }
  #truckMotion.roll-in{
    animation:truckRollIn .72s cubic-bezier(.22,1.18,.38,1) forwards;
  }
  #truckMotion.zoom-out{
    animation:truckZoomOut .62s cubic-bezier(.45,0,.78,.22) forwards;
  }
  #truckMotion.honk-hop{
    animation:truckHonkHop .52s cubic-bezier(.34,1.8,.5,1);
  }
  #truckMotion.dry-wiggle{
    animation:truckDryWiggle .28s ease-in-out 4;
  }
  @keyframes truckRollIn{
    0%{ transform:translateX(-110%) rotate(-2deg); }
    72%{ transform:translateX(3%) rotate(1.5deg); }
    88%{ transform:translateX(-1%) rotate(-.8deg); }
    100%{ transform:translateX(0) rotate(0deg); }
  }
  @keyframes truckZoomOut{
    0%{ transform:translateX(0) scale(1); }
    22%{ transform:translateX(-4%) scale(1.04, .95); }
    100%{ transform:translateX(120%) scale(1.02); }
  }
  @keyframes truckHonkHop{
    0%,100%{ transform:translateY(0) scale(1); }
    35%{ transform:translateY(-16px) scale(1.06, .95) rotate(-2deg); }
    70%{ transform:translateY(3px) scale(.97, 1.04) rotate(1.5deg); }
  }
  @keyframes truckDryWiggle{
    0%,100%{ transform:translateX(0) rotate(0deg); }
    25%{ transform:translateX(-6px) rotate(-1.5deg); }
    75%{ transform:translateX(6px) rotate(1.5deg); }
  }

  /* Truck SVG Layer */
  #truckSvg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
    filter:drop-shadow(0 12px 14px rgba(8,47,73,.26));
  }

  /* Glossy Diagonal Shine Sweep (Dry & Celebrate) */
  #shineSweep{
    position:absolute;
    inset:0;
    z-index:7;
    pointer-events:none;
    overflow:hidden;
    opacity:0;
  }
  #shineSweep.flash{
    opacity:1;
  }
  #shineSweep::before{
    content:"";
    position:absolute;
    top:-30%;
    left:-60%;
    width:46%;
    height:170%;
    transform:rotate(24deg);
    background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.88) 50%, rgba(255,255,255,0) 100%);
  }
  #shineSweep.flash::before{
    animation:shineGlide .88s cubic-bezier(.25,.75,.35,1) forwards;
  }
  @keyframes shineGlide{
    from{ left:-60%; }
    to{ left:135%; }
  }

  /* Interactive Canvases (Mud, Soap Foam, FX Particles) */
  #mudCanvas, #foamCanvas, #fxCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  #mudCanvas{ z-index:4; touch-action:none; cursor:grab; }
  #foamCanvas{ z-index:5; touch-action:none; pointer-events:none; }
  #fxCanvas{ z-index:8; pointer-events:none; }

  #stage[data-phase="rinse"] #mudCanvas{ pointer-events:none; }
  #stage[data-phase="rinse"] #foamCanvas{ pointer-events:auto; cursor:crosshair; }
  #stage[data-phase="dry"] #mudCanvas,
  #stage[data-phase="dry"] #foamCanvas{ pointer-events:none; }
  #stage[data-phase="celebrate"] #mudCanvas,
  #stage[data-phase="celebrate"] #foamCanvas{ pointer-events:none; }

  /* Full-bay tap target during Dry & Celebrate so tapping the truck ALWAYS responds! */
  #truckTapOverlay{
    position:absolute;
    inset:0;
    z-index:9;
    border:none;
    background:transparent;
    padding:0;
    cursor:pointer;
    outline:none;
  }

  /* Honk Sound Burst Badge */
  #honkBurst{
    position:absolute;
    top:12%;
    right:9%;
    z-index:11;
    pointer-events:none;
    opacity:0;
    font-size:46px;
    line-height:1;
    filter:drop-shadow(0 4px 10px rgba(245,158,11,.65));
  }
  #honkBurst.show{
    animation:honkPop 1.05s cubic-bezier(.25,1.5,.5,1);
  }
  @keyframes honkPop{
    0%{ opacity:0; transform:scale(.35) rotate(-12deg); }
    28%{ opacity:1; transform:scale(1.24) rotate(8deg); }
    70%{ opacity:1; transform:scale(1.06) rotate(-4deg); }
    100%{ opacity:0; transform:scale(1.28) translateY(-18px) rotate(10deg); }
  }

  /* Follow-Finger Tool Cursor (Bubbly Sponge / Water Hose Nozzle) */
  #toolCursor{
    position:absolute;
    left:50%;
    top:50%;
    width:74px;
    height:74px;
    margin:-37px 0 0 -37px;
    z-index:13;
    pointer-events:none;
    opacity:0;
    transform:scale(.82);
    transition:opacity .12s ease, transform .12s ease;
    filter:drop-shadow(0 6px 10px rgba(8,47,73,.34));
  }
  #toolCursor.active{
    opacity:1;
    transform:scale(1.08) rotate(-8deg);
  }
  #toolCursor svg{ width:100%; height:100%; display:block; }

  /* Idle Hint Finger */
  #bayHint{
    position:absolute;
    left:50%;
    top:52%;
    z-index:14;
    pointer-events:none;
    font-size:48px;
    line-height:1;
    opacity:0;
    transform:translate(-50%, -50%);
    filter:drop-shadow(0 5px 10px rgba(8,47,73,.42));
  }
  #bayHint.show{
    opacity:1;
    animation:hintRub 1.5s ease-in-out infinite;
  }
  @keyframes hintRub{
    0%,100%{ transform:translate(-66%, -50%) rotate(-10deg) scale(1); }
    50%{ transform:translate(-34%, -58%) rotate(10deg) scale(1.14); }
  }

  /* Celebration Action Row (Honk + Next Truck — sits right below wash bay or docked cleanly) */
  #celebrateActions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    z-index:15;
    flex:0 0 auto;
  }
  .action-fab{
    min-width:74px;
    min-height:74px;
    height:74px;
    padding:0 22px;
    border-radius:999px;
    border:4px solid #ffffff;
    font-family:"Fredoka",sans-serif;
    font-size:32px;
    font-weight:700;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
    outline:none;
    transition:transform .16s cubic-bezier(.34,1.65,.5,1);
  }

  var audioCtx = null;

  function hasHootClip(id){
    try{
      if(window.parent && window.parent.HOOT_HAVE && window.parent.HOOT_HAVE[id]) return true;
    }catch(e){}
    return false;
  }

  function resolveClip(customId, fallbackId){
    var chosen = (customId && hasHootClip(customId)) ? customId : fallbackId;
    return chosen ? (chosen.indexOf(".mp3") >= 0 ? chosen : chosen + ".mp3") : null;
  }

  function getAudioCtx(){
    if(!soundOn) return null;
    try{
      if(!audioCtx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(AC) audioCtx = new AC();
      }
      if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }catch(e){}
    return audioCtx;
  }

  function unlockAudioOnce(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    getAudioCtx();
    try{
      if(!voicePlaying){
        voiceEl.muted = true;
        var p = voiceEl.play();
        if(p && p.then){
          p.then(function(){
            voiceEl.pause();
            voiceEl.currentTime = 0;
            voiceEl.muted = false;
            if(pendingBootClip){
              var c = pendingBootClip;
              pendingBootClip = null;
              enqueueVoice(c, true);
            }
          }).catch(function(){ voiceEl.muted = false; });
        } else {
          voiceEl.muted = false;
        }
      }
    }catch(e){ voiceEl.muted = false; }
  }
  stage.addEventListener("pointerdown", unlockAudioOnce, { passive: true, capture: true });

  function clearVoice(stopCurrent){
    voiceQueue.length = 0;
    if(stopCurrent){
      voicePlaying = false;
      try{ voiceEl.pause(); voiceEl.currentTime = 0; }catch(e){}
    }
  }

  function pumpVoice(){
    if(dead || !soundOn || voicePlaying || !voiceQueue.length) return;
    var clip = voiceQueue.shift();
    voicePlaying = true;
    voiceEl.muted = false;
    voiceEl.src = "assets/voice/" + clip;
    var p = voiceEl.play();
    if(p && p.catch){
      p.catch(function(){
        voicePlaying = false;
        if(!audioUnlocked && !pendingBootClip) pendingBootClip = clip;
        pumpVoice();
      });
    }
  }
  voiceEl.addEventListener("ended", function(){
    voicePlaying = false;
    pumpVoice();
  });
  voiceEl.addEventListener("error", function(){
    voicePlaying = false;
    pumpVoice();
  });

  function enqueueVoice(clip, interrupt){
    if(dead || !soundOn || !clip) return;
    if(clip.indexOf(".mp3") < 0) clip = clip + ".mp3";
    if(interrupt) clearVoice(true);
    voiceQueue.push(clip);
    pumpVoice();
  }

  function playCarWashGuide(customId, fallbackId, isBoot){
    var clip = resolveClip(customId, fallbackId);
    if(!clip || dead || !soundOn) return;
    if(isBoot){
      try{
        if(window.parent && typeof window.parent.__hwPlayAfterIntro === "function"){
          window.parent.__hwPlayAfterIntro(function(){
            if(!dead && phase === "sponge" && !hasInteractedThisTruck){
              enqueueVoice(clip, true);
            }
          });
          return;
        }
      }catch(e){}
    }
    enqueueVoice(clip, true);
  }

    if(phase === "sponge"){

    } else if(phase === "dry"){
      playCarWashGuide("hoot-cw-dry", "hoot-tap-big-btn", false);
    } else if(phase === "celebrate"){
      var v = VEHICLES[vehicleId] || VEHICLES.firetruck;
      playCarWashGuide(v.cleanClip, v.cleanFallback, false);
    }
  }

     ============================================================================ */
  var noiseBuffer = null;
  function getNoiseBuffer(ctx){
    if(noiseBuffer) return noiseBuffer;
    var len = Math.floor(ctx.sampleRate * 0.45);
    noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = noiseBuffer.getChannelData(0);
    for(var i = 0; i < len; i++){
      data[i] = (Math.random() * 2 - 1);
    }
    return noiseBuffer;
  }

  /* Bubbly rainbow soap pop SFX */
  function bubblePopSfx(){
    var ctx = getAudioCtx();
    if(!ctx) return;
    var now = Date.now();
    if(now - lastSfxAt < 70) return;
    lastSfxAt = now;
    var t = ctx.currentTime;
    try{
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      var base = 420 + Math.random() * 440;
      osc.type = "sine";
      osc.frequency.setValueAtTime(base, t);
      osc.frequency.exponentialRampToValueAtTime(base * 2.1, t + 0.085);
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.14, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.12);
    }catch(e){}
  }

  /* Shimmering water hose spray whoosh SFX */
  function waterSpraySfx(){
    var ctx = getAudioCtx();
    if(!ctx) return;
    var now = Date.now();
    if(now - lastSfxAt < 85) return;
    lastSfxAt = now;
    var t = ctx.currentTime;
    try{
      var src = ctx.createBufferSource();
      src.buffer = getNoiseBuffer(ctx);
      var filt = ctx.createBiquadFilter();
      filt.type = "bandpass";
      filt.frequency.setValueAtTime(1800 + Math.random() * 900, t);
      filt.Q.value = 1.1;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.09, t + 0.025);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      src.connect(filt);
      filt.connect(g);
      g.connect(ctx.destination);
      src.start(t);
      src.stop(t + 0.18);
    }catch(e){}
  }

      var g = ctx.createGain();

      g.gain.setValueAtTime(0.14, t + 0.62);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.96);
      src.connect(filt);
      filt.connect(g);

  /* ============================================================================
     STEP 1 & STEP 2: CANVAS MUD LAYER + RAINBOW FOAM LAYER + TARGET FINDING
     ============================================================================ */
  function drawRoundedRectPath(ctx, x, y, w, h, r){
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function clipToVehicleZones(ctx, id){
    var zones = VEHICLES[id].mudZones;
    ctx.beginPath();
    zones.forEach(function(z){
      drawRoundedRectPath(ctx, z.x, z.y, z.w, z.h, z.rx);
    });
    ctx.clip();
  }

  function paintMudLayer(){
    mudCtx.save();
    mudCtx.globalCompositeOperation = "source-over";
    mudCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    clipToVehicleZones(mudCtx, vehicleId);

    /* Deterministic rich cartoon mud splatters covering the truck */
    var seed = vehicleId.charCodeAt(0) * 131 + 19;
    function rand(){
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    }

    /* Warm base mud coat over vehicle silhouette */
    var g = mudCtx.createLinearGradient(110, 120, 520, 340);
    g.addColorStop(0, "rgba(126, 78, 38, 0.86)");
    g.addColorStop(0.5, "rgba(104, 62, 28, 0.92)");
    g.addColorStop(1, "rgba(84, 46, 18, 0.94)");
    mudCtx.fillStyle = g;
    mudCtx.fillRect(80, 65, 480, 290);

    /* Thick squishy mud blobs & splash splatters */
    for(var i = 0; i < 64; i++){
      var cx = 110 + rand() * 420;
      var cy = 110 + rand() * 215;
      var rx = 18 + rand() * 34;
      var ry = 14 + rand() * 26;
      mudCtx.fillStyle = i % 3 === 0 ? "#5c3314" : (i % 3 === 1 ? "#7a4720" : "#91582a");
      mudCtx.beginPath();
      mudCtx.ellipse(cx, cy, rx, ry, rand() * Math.PI, 0, Math.PI * 2);
      mudCtx.fill();
    }

    /* Mud speckles & cute cartoon drip highlights */
    for(var s = 0; s < 150; s++){
      var sx = 104 + rand() * 432;
      var sy = 100 + rand() * 230;
      var sr = 2.5 + rand() * 5.5;
      mudCtx.fillStyle = s % 2 === 0 ? "rgba(62, 32, 10, 0.65)" : "rgba(168, 114, 64, 0.55)";
      mudCtx.beginPath();
      mudCtx.arc(sx, sy, sr, 0, Math.PI * 2);
      mudCtx.fill();
    }

    mudCtx.restore();

    /* Sample active mud pixels on an 8px grid for ultra-fast accurate progress */
    mudSamples = [];
    var data = mudCtx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;
    for(var py = 72; py < 350; py += 8){
      for(var px = 92; px < 548; px += 8){
        if(data[(py * CANVAS_W + px) * 4 + 3] >= 110){
          mudSamples.push({ x: px, y: py });
        }
      }
    }
    mudCleanedRatio = 0;
    cleanMeterFill.style.width = "0%";
  }

    var data = foamCtx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;
    for(var py = 72; py < 350; py += 8){
      for(var px = 92; px < 548; px += 8){
        if(data[(py * CANVAS_W + px) * 4 + 3] >= 95){
          foamSamples.push({ x: px, y: py });
        }
      }
    }
    foamCleanedRatio = 0;
    cleanMeterFill.style.width = "0%";
  }

  function stampBubblySudsAt(cx, cy){
    foamCtx.save();
    foamCtx.globalCompositeOperation = "source-over";
    clipToVehicleZones(foamCtx, vehicleId);
    var cols = ["rgba(255,255,255,.85)", "rgba(224,247,255,.82)", "rgba(252,231,243,.78)", "rgba(254,249,195,.78)"];
    for(var i = 0; i < 4; i++){
      var ox = (Math.random() - 0.5) * 44;
      var oy = (Math.random() - 0.5) * 44;
      var rr = 12 + Math.random() * 18;
      foamCtx.fillStyle = cols[i % cols.length];
      foamCtx.beginPath();
      foamCtx.arc(cx + ox, cy + oy, rr, 0, Math.PI * 2);
      foamCtx.fill();
    }
    foamCtx.restore();
  }

  function findRemainingTargetPoint(){
    if(phase === "dry") return { x: 320, y: 220 };
    var samples = phase === "sponge" ? mudSamples : foamSamples;
    var ctx = phase === "sponge" ? mudCtx : foamCtx;
    if(!samples.length) return { x: 320, y: 220 };
    var data = ctx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;
    var sumX = 0, sumY = 0, cnt = 0;
    for(var i = 0; i < samples.length; i += 5){
      var s = samples[i];
      if(data[(s.y * CANVAS_W + s.x) * 4 + 3] >= 95){
        sumX += s.x;
        sumY += s.y;
        cnt++;
      }
    }
    if(!cnt) return { x: 320, y: 220 };
    return { x: sumX / cnt, y: sumY / cnt };
  }

  function spawnRainbowBubbles(cx, cy, count){
    var hues = ["#f472b6", "#38bdf8", "#facc15", "#a855f7", "#34d399"];
    for(var i = 0; i < count; i++){
      if(bubbles.length > 90) bubbles.shift();
      bubbles.push({
        x: cx + (Math.random() - 0.5) * 48,
        y: cy + (Math.random() - 0.5) * 40,
        vx: (Math.random() - 0.5) * 2.2,
        vy: -1.4 - Math.random() * 2.6,
        r: 8 + Math.random() * 14,
        col: hues[Math.floor(Math.random() * hues.length)],
        life: 1
      });
    }
  }

  function spawnWaterDroplets(cx, cy, count){
    for(var i = 0; i < count; i++){
      if(droplets.length > 110) droplets.shift();
      var ang = Math.random() * Math.PI * 2;
      var spd = 2.2 + Math.random() * 5.2;
      droplets.push({
        x: cx + (Math.random() - 0.5) * 34,
        y: cy + (Math.random() - 0.5) * 34,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 2.2,
        r: 3.5 + Math.random() * 5.5,
        life: 1
      });
    }
  }

  function spawnWindRibbons(){
    for(var i = 0; i < 16; i++){
      windRibbons.push({
        x: -60 - Math.random() * 160,
        y: 80 + Math.random() * 250,
        vx: 14 + Math.random() * 9,
        len: 75 + Math.random() * 95,
        amp: 6 + Math.random() * 10,
        phase: Math.random() * Math.PI * 2,
        life: 1
      });
    }
  }

  function spawnCanvasSparkles(cx, cy, count){
    for(var i = 0; i < count; i++){
      if(sparkles.length > 60) sparkles.shift();
      sparkles.push({
        x: cx + (Math.random() - 0.5) * 360,
        y: cy + (Math.random() - 0.5) * 180,
        sz: 8 + Math.random() * 12,
        life: 1
      });
    }
  }

  function scrubMudAt(x1, y1, x2, y2, radiusScale){
    var rad = BRUSH_RADIUS * (radiusScale || 1);
    mudCtx.save();
    mudCtx.globalCompositeOperation = "destination-out";
    var dx = x2 - x1;
    var dy = y2 - y1;
    var dist = Math.hypot(dx, dy);
    var steps = Math.max(1, Math.ceil(dist / 12));
    for(var i = 0; i <= steps; i++){
      var t = i / steps;
      var cx = x1 + dx * t;
      var cy = y1 + dy * t;
      var rg = mudCtx.createRadialGradient(cx, cy, rad * 0.55, cx, cy, rad);
      rg.addColorStop(0, "rgba(0,0,0,1)");
      rg.addColorStop(1, "rgba(0,0,0,0)");
      mudCtx.fillStyle = rg;
      mudCtx.beginPath();
      mudCtx.arc(cx, cy, rad, 0, Math.PI * 2);
      mudCtx.fill();
    }
    mudCtx.restore();

    stampBubblySudsAt(x2, y2);
    spawnRainbowBubbles(x2, y2, radiusScale && radiusScale > 1.1 ? 8 : 4);
    animateHootArm();
    bubblePopSfx();
  }

  function rinseFoamAt(x1, y1, x2, y2, radiusScale){
    var rad = BRUSH_RADIUS * (radiusScale || 1);
    foamCtx.save();
    foamCtx.globalCompositeOperation = "destination-out";
    var dx = x2 - x1;
    var dy = y2 - y1;
    var dist = Math.hypot(dx, dy);
    var steps = Math.max(1, Math.ceil(dist / 12));
    for(var i = 0; i <= steps; i++){
      var t = i / steps;
      var cx = x1 + dx * t;
      var cy = y1 + dy * t;
      var rg = foamCtx.createRadialGradient(cx, cy, rad * 0.55, cx, cy, rad);
      rg.addColorStop(0, "rgba(0,0,0,1)");
      rg.addColorStop(1, "rgba(0,0,0,0)");
      foamCtx.fillStyle = rg;
      foamCtx.beginPath();
      foamCtx.arc(cx, cy, rad, 0, Math.PI * 2);
      foamCtx.fill();
    }
    foamCtx.restore();

    spawnWaterDroplets(x2, y2, radiusScale && radiusScale > 1.1 ? 12 : 6);
    animateHootArm();
    waterSpraySfx();
  }

  function animateHootArm(){
    hootBtn.classList.add("scrubbing");
    if(spongeArmTimer) clearTimeout(spongeArmTimer);
    spongeArmTimer = setTimeout(function(){ hootBtn.classList.remove("scrubbing"); }, 220);
  }

  function checkScrubProgress(forceNow){
    if(dead || isTransitioning) return;
    if(phase !== "sponge" && phase !== "rinse") return;
    var now = Date.now();
    if(!forceNow && now - lastCheckAt < 80) return;
    lastCheckAt = now;

    if(phase === "sponge"){
      if(!mudSamples.length) return;
      var data = mudCtx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;
      var cleared = 0;
      for(var i = 0; i < mudSamples.length; i++){
        var s = mudSamples[i];
        if(data[(s.y * CANVAS_W + s.x) * 4 + 3] < 90) cleared++;
      }
      mudCleanedRatio = cleared / mudSamples.length;
      var pct = Math.min(100, (mudCleanedRatio / CLEAN_THRESHOLD) * 100);
      cleanMeterFill.style.width = pct.toFixed(1) + "%";
      if(mudCleanedRatio >= CLEAN_THRESHOLD){
        completeSpongeStep(false);
      }
    } else if(phase === "rinse"){
      if(!foamSamples.length) return;
      var fdata = foamCtx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;
      var fcleared = 0;
      for(var j = 0; j < foamSamples.length; j++){
        var fs = foamSamples[j];
        if(fdata[(fs.y * CANVAS_W + fs.x) * 4 + 3] < 90) fcleared++;
      }
      foamCleanedRatio = fcleared / foamSamples.length;
      var fpct = Math.min(100, (foamCleanedRatio / CLEAN_THRESHOLD) * 100);
      cleanMeterFill.style.width = fpct.toFixed(1) + "%";
      if(foamCleanedRatio >= CLEAN_THRESHOLD){
        completeRinseStep(false);
      }
    }
  }

  /* ============================================================================
     STEP TRANSITIONS (SPONGE -> RINSE -> DRY -> CELEBRATE)
     ============================================================================ */
  function updatePhaseUI(){
    stage.setAttribute("data-phase", phase);
    var curIdx = STEP_ORDER.indexOf(phase);
    stepPips.forEach(function(pip, idx){
      pip.classList.toggle("active", idx === curIdx);
      pip.classList.toggle("done", idx < curIdx);
    });

    spongeDock.hidden = (phase !== "sponge");
    rinseDock.hidden = (phase !== "rinse");
    dryDock.hidden = (phase !== "dry");
    stickerDock.hidden = (phase !== "celebrate");
    celebrateActions.hidden = (phase !== "celebrate");
    truckTapOverlay.hidden = (phase === "sponge" || phase === "rinse");

    if(phase === "sponge"){
      toolCursor.innerHTML = SPONGE_CURSOR_SVG;
    } else if(phase === "rinse"){
      toolCursor.innerHTML = HOSE_CURSOR_SVG;
    } else {
      toolCursor.classList.remove("active");
    }
  }

  function completeSpongeStep(instant){
    if(phase !== "sponge" || isTransitioning) return;
    isScrubbing = false;
    toolCursor.classList.remove("active");
    mudCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    mudCleanedRatio = 1;
    cleanMeterFill.style.width = "100%";

    if(instant){
      enterRinsePhase();
      return;
    }
    isTransitioning = true;
    sparkleChimeSfx(1);
    hootCheer();
    spawnRainbowBubbles(320, 210, 22);
    var br = mudCanvas.getBoundingClientRect();
    if(br.width) spawnSparkles(br.left + br.width * 0.5, br.top + br.height * 0.5, 12);
    later(function(){
      isTransitioning = false;
      enterRinsePhase();
    }, 520);
  }

  function enterRinsePhase(){
    phase = "rinse";
    idleVoiceReminded = false;
    paintFoamBlanket();
    updatePhaseUI();
    speakCurrentStepGuide(false);
    armIdle(true);
  }

  function completeRinseStep(instant){
    if(phase !== "rinse" || isTransitioning) return;
    isScrubbing = false;
    toolCursor.classList.remove("active");
    foamCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    foamCleanedRatio = 1;
    cleanMeterFill.style.width = "100%";

    if(instant){
      enterDryPhase();
      return;
    }
    isTransitioning = true;
    sparkleChimeSfx(2);
    hootCheer();
    spawnWaterDroplets(320, 200, 26);
    var br = foamCanvas.getBoundingClientRect();
    if(br.width) spawnSparkles(br.left + br.width * 0.5, br.top + br.height * 0.5, 14);
    later(function(){
      isTransitioning = false;
      enterDryPhase();
    }, 520);
  }

  function enterDryPhase(){
    phase = "dry";
    isDrying = false;
    idleVoiceReminded = false;
    cleanMeterFill.style.width = "0%";
    updatePhaseUI();
    speakCurrentStepGuide(false);
    armIdle(true);
  }

  function triggerBreezyDry(instant){
    if(dead || phase !== "dry" || isDrying) return;
    unlockAudioOnce();
    getAudioCtx();
    hideIdleHints();
    hasInteractedThisTruck = true;

    if(instant){
      enterCelebratePhase(true);
      return;
    }

    isDrying = true;
    blowerWhooshSfx();
    spawnWindRibbons();
    spawnCanvasSparkles(320, 210, 22);
    cleanMeterFill.style.width = "100%";
    hootCheer();

    truckMotion.classList.remove("roll-in", "zoom-out", "honk-hop", "dry-wiggle");
    void truckMotion.offsetWidth;
    truckMotion.classList.add("dry-wiggle");

    shineSweep.classList.remove("flash");
    void shineSweep.offsetWidth;
    shineSweep.classList.add("flash");

    later(function(){
      isDrying = false;
      truckMotion.classList.remove("dry-wiggle");
      if(phase === "dry"){
        enterCelebratePhase(false);
      }
    }, 920);
  }

  function enterCelebratePhase(instant){
    phase = "celebrate";
    idleVoiceReminded = false;
    hideIdleHints();
    washedCount++;
    stars++;
    washedMap[vehicleId] = true;

    var nextIdx = (VEHICLE_ORDER.indexOf(vehicleId) + 1) % VEHICLE_ORDER.length;
    var nextId = VEHICLE_ORDER[nextIdx];
    nextTruckIcon.textContent = VEHICLES[nextId].emoji;
    nextTruckBtn.dataset.nextVehicle = nextId;

    updateHudProgress(true);
    updatePhaseUI();

    stickerBtns.forEach(function(btn){
      btn.classList.toggle("picked", btn.dataset.sticker === chosenSticker);
    });

    if(instant) return;

    shineSweep.classList.remove("flash");
    void shineSweep.offsetWidth;
    shineSweep.classList.add("flash");

    var allFourDone = VEHICLE_ORDER.every(function(k){ return !!washedMap[k]; });
    sparkleChimeSfx(3);
    showerConfetti(allFourDone ? 68 : 44);
    spawnCanvasSparkles(320, 210, 24);
    var br = mudCanvas.getBoundingClientRect();
    if(br.width) spawnSparkles(br.left + br.width * 0.5, br.top + br.height * 0.45, 16);
    hootCheer();

    later(function(){
      triggerVehicleHonk(true);
    }, 340);

    later(function(){
      if(allFourDone && !allFourCelebrated){
        allFourCelebrated = true;
        playCarWashGuide("hoot-cw-win", "hoot-win-yay", false);
      } else {
        var v = VEHICLES[vehicleId] || VEHICLES.firetruck;
        playCarWashGuide(v.cleanClip, v.cleanFallback, false);
      }
    }, 980);
  }

  function triggerVehicleHonk(fromAuto){
    if(dead || phase !== "celebrate") return;
    unlockAudioOnce();
    getAudioCtx();
    vehicleHornSfx(vehicleId);

    truckMotion.classList.remove("roll-in", "zoom-out", "honk-hop", "dry-wiggle");
    void truckMotion.offsetWidth;
    truckMotion.classList.add("honk-hop");

    honkBurst.textContent = (VEHICLES[vehicleId] && VEHICLES[vehicleId].honkGlyph) || "📣🎶";
    honkBurst.classList.remove("show");
    void honkBurst.offsetWidth;
    honkBurst.classList.add("show");

    hootCheer();
    var br = mudCanvas.getBoundingClientRect();
    if(br.width) spawnSparkles(br.left + br.width * 0.65, br.top + br.height * 0.32, 10);

    if(!fromAuto){
      playCarWashGuide("hoot-cw-honk", "hoot-great-job", false);
    }
  }

  function applyHoodSticker(stickerId){
    if(dead || phase !== "celebrate" || !STICKER_GLYPHS[stickerId]) return;
    unlockAudioOnce();
    getAudioCtx();
    chosenSticker = stickerId;

  /* ============================================================================
     LIVE 60FPS FX CANVAS LOOP (BUBBLES, WATER SPRAY, WIND, SPARKLES, GLOW HINTS)
     ============================================================================ */
  var hintTarget = { x: 320, y: 210 };
  var lastTargetUpdate = 0;

  function tickFx(ts){
    if(dead) return;
    fxRaf = requestAnimationFrame(tickFx);
    fxCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);

    var t = (ts || 0) * 0.0035;

    /* Soft pulsing glowing target circle on dirty / soapy spots for Riley */
    if((phase === "sponge" || phase === "rinse") && !isTransitioning){
      if(ts - lastTargetUpdate > 420){
        lastTargetUpdate = ts;
        hintTarget = findRemainingTargetPoint();
      }
      var pulse = 0.5 + 0.5 * Math.sin(t * 1.4);
      fxCtx.save();
      fxCtx.strokeStyle = phase === "sponge"
        ? "rgba(255, 244, 150, " + (0.32 + pulse * 0.42).toFixed(2) + ")"
        : "rgba(186, 238, 255, " + (0.38 + pulse * 0.46).toFixed(2) + ")";
      fxCtx.lineWidth = 4.5;
      fxCtx.setLineDash([12, 10]);
      fxCtx.lineDashOffset = -t * 18;
      fxCtx.beginPath();
      fxCtx.arc(hintTarget.x, hintTarget.y, 46 + pulse * 9, 0, Math.PI * 2);
      fxCtx.stroke();
      fxCtx.restore();
    }

    /* Glistening wet water drops while waiting in Step 3 (Dry) */
    if(phase === "dry" && !isDrying){
      var dropPts = [[210,190],[310,170],[410,205],[265,255],[375,245],[465,195]];
      for(var d = 0; d < dropPts.length; d++){
        var dyOff = ((t * 18 + d * 17) % 24);
        var dxp = dropPts[d][0];
        var dyp = dropPts[d][1] + dyOff;
        fxCtx.fillStyle = "rgba(186, 238, 255, 0.85)";
        fxCtx.strokeStyle = "rgba(2, 132, 199, 0.55)";
        fxCtx.lineWidth = 2;
        fxCtx.beginPath();
        fxCtx.moveTo(dxp, dyp - 10);
        fxCtx.quadraticCurveTo(dxp + 8, dyp + 2, dxp, dyp + 8);
        fxCtx.quadraticCurveTo(dxp - 8, dyp + 2, dxp, dyp - 10);
        fxCtx.fill();
        fxCtx.stroke();
      }
    }

    /* Floating Rainbow Soap Bubbles */
    for(var b = bubbles.length - 1; b >= 0; b--){
      var bub = bubbles[b];
      bub.x += bub.vx + Math.sin(t + b) * 0.45;
      bub.y += bub.vy;
      bub.life -= 0.016;
      if(bub.life <= 0){
        bubbles.splice(b, 1);
        continue;
      }
      fxCtx.save();
      fxCtx.globalAlpha = Math.min(1, bub.life * 1.4);
      fxCtx.fillStyle = bub.col;
      fxCtx.globalAlpha *= 0.24;
      fxCtx.beginPath();
      fxCtx.arc(bub.x, bub.y, bub.r, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.globalAlpha = Math.min(1, bub.life * 1.3);
      fxCtx.strokeStyle = "#ffffff";
      fxCtx.lineWidth = 2.2;
      fxCtx.stroke();
      fxCtx.fillStyle = "#ffffff";
      fxCtx.beginPath();
      fxCtx.arc(bub.x - bub.r * 0.32, bub.y - bub.r * 0.32, bub.r * 0.26, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.restore();
    }

    /* Shimmering Water Spray Droplets */
    for(var w = droplets.length - 1; w >= 0; w--){
      var dr = droplets[w];
      dr.x += dr.vx;
      dr.y += dr.vy;
      dr.vy += 0.24;
      dr.life -= 0.032;
      if(dr.life <= 0){
        droplets.splice(w, 1);
        continue;
      }
      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, dr.life);
      fxCtx.fillStyle = w % 2 === 0 ? "#e0f2fe" : "#38bdf8";
      fxCtx.beginPath();
      fxCtx.arc(dr.x, dr.y, dr.r * dr.life, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.restore();
    }

    /* Swirling Wind Ribbons (Step 3 Breezy Dryer) */
    for(var r = windRibbons.length - 1; r >= 0; r--){
      var wr = windRibbons[r];
      wr.x += wr.vx;
      wr.life -= 0.022;
      if(wr.life <= 0 || wr.x > CANVAS_W + 140){
        windRibbons.splice(r, 1);
        continue;
      }
      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, wr.life * 0.85);
      fxCtx.strokeStyle = r % 2 === 0 ? "#ffffff" : "#bae6fd";
      fxCtx.lineWidth = 6;
      fxCtx.lineCap = "round";
      fxCtx.beginPath();
      fxCtx.moveTo(wr.x - wr.len, wr.y);
      fxCtx.quadraticCurveTo(wr.x - wr.len * 0.5, wr.y - wr.amp * Math.sin(t * 4 + wr.phase), wr.x, wr.y);
      fxCtx.stroke();
      fxCtx.restore();
    }

    /* Four-Point Star Sparkles */
    for(var k = sparkles.length - 1; k >= 0; k--){
      var spk = sparkles[k];
      spk.life -= 0.024;
      if(spk.life <= 0){
        sparkles.splice(k, 1);
        continue;
      }
      var sz = spk.sz * Math.sin(spk.life * Math.PI);
      fxCtx.save();
      fxCtx.translate(spk.x, spk.y);
      fxCtx.fillStyle = "rgba(255, 249, 178, " + Math.min(1, spk.life * 1.4).toFixed(2) + ")";
      fxCtx.beginPath();
      fxCtx.moveTo(0, -sz);
      fxCtx.quadraticCurveTo(2, -2, sz, 0);
      fxCtx.quadraticCurveTo(2, 2, 0, sz);
      fxCtx.quadraticCurveTo(-2, 2, -sz, 0);
      fxCtx.quadraticCurveTo(-2, -2, 0, -sz);
      fxCtx.fill();
      fxCtx.restore();
    }
  }

  /* ============================================================================
     POINTER HANDLERS (RUBBING + FORGIVING 1.35x TAP-PUFF BURST FOR TODDLERS!)
     ============================================================================ */
  function canvasPointFromEvent(e){
    var r = mudCanvas.getBoundingClientRect();
    if(!r.width || !r.height) return { x: 320, y: 210 };
    return {
      x: ((e.clientX - r.left) / r.width) * CANVAS_W,
      y: ((e.clientY - r.top) / r.height) * CANVAS_H
    };
  }

  function positionToolCursor(pt){
    toolCursor.style.left = ((pt.x / CANVAS_W) * 100).toFixed(2) + "%";
    toolCursor.style.top = ((pt.y / CANVAS_H) * 100).toFixed(2) + "%";
    toolCursor.classList.add("active");
  }

  function attachScrubCanvas(canvas, activePhase, scrubFn){
    canvas.addEventListener("pointerdown", function(e){
      if(dead || isTransitioning || phase !== activePhase) return;
      e.preventDefault();
      unlockAudioOnce();
      getAudioCtx();
      hasInteractedThisTruck = true;
      idleVoiceReminded = false;
      hideIdleHints();
      isScrubbing = true;
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      var pt = canvasPointFromEvent(e);
      lastPt = pt;
      positionToolCursor(pt);
      /* Forgiving 1.35x tap-puff burst so 2-year-olds who tap instead of drag still wash cleanly! */
      scrubFn(pt.x, pt.y, pt.x + 0.5, pt.y + 0.5, 1.35);
      checkScrubProgress(true);
      armIdle(false);
    });

    canvas.addEventListener("pointermove", function(e){
      if(dead || !isScrubbing || isTransitioning || phase !== activePhase) return;
      e.preventDefault();
      var pt = canvasPointFromEvent(e);
      positionToolCursor(pt);
      if(lastPt){
        scrubFn(lastPt.x, lastPt.y, pt.x, pt.y, 1);
      }
      lastPt = pt;
      checkScrubProgress(false);
    });

    function endScrub(e){
      if(!isScrubbing) return;
      isScrubbing = false;
      lastPt = null;
      toolCursor.classList.remove("active");
      try{ if(e && e.pointerId != null) canvas.releasePointerCapture(e.pointerId); }catch(err){}
      checkScrubProgress(true);
      armIdle(false);
    }
    canvas.addEventListener("pointerup", endScrub);
    canvas.addEventListener("pointercancel", endScrub);
  }

  attachScrubCanvas(mudCanvas, "sponge", scrubMudAt);
  attachScrubCanvas(foamCanvas, "rinse", rinseFoamAt);

  /* Bottom Tool Buttons ALSO help toddlers who tap the glowing tool directly! */
  spongeToolBtn.addEventListener("click", function(){
    if(dead || isTransitioning || phase !== "sponge") return;
    unlockAudioOnce();
    getAudioCtx();
    hasInteractedThisTruck = true;
    hideIdleHints();
    var pt = findRemainingTargetPoint();
    scrubMudAt(pt.x - 16, pt.y, pt.x + 16, pt.y, 1.4);
    checkScrubProgress(true);
    armIdle(false);
  });

  hoseToolBtn.addEventListener("click", function(){
    if(dead || isTransitioning || phase !== "rinse") return;
    unlockAudioOnce();
    getAudioCtx();
    hasInteractedThisTruck = true;
    hideIdleHints();
    var pt = findRemainingTargetPoint();
    rinseFoamAt(pt.x - 16, pt.y, pt.x + 16, pt.y, 1.4);
    checkScrubProgress(true);
    armIdle(false);
  });

  dryerToolBtn.addEventListener("click", function(){
    triggerBreezyDry(false);
  });

  truckTapOverlay.addEventListener("click", function(){
    if(phase === "dry"){
      triggerBreezyDry(false);
    } else if(phase === "celebrate"){
      triggerVehicleHonk(false);
    }
  });

  honkBtn.addEventListener("click", function(){
    triggerVehicleHonk(false);
  });

  stickerBtns.forEach(function(btn){
    btn.addEventListener("click", function(){
      applyHoodSticker(btn.dataset.sticker);
    });
  });

  /* Zoom clean truck out, then roll next muddy truck in! */
  nextTruckBtn.addEventListener("click", function(){
    if(dead || isTransitioning) return;
    unlockAudioOnce();
    getAudioCtx();
    isTransitioning = true;
    clickPopSfx(820);
    vehicleHornSfx(vehicleId);
    var targetId = nextTruckBtn.dataset.nextVehicle || VEHICLE_ORDER[(VEHICLE_ORDER.indexOf(vehicleId) + 1) % VEHICLE_ORDER.length];

    truckMotion.classList.remove("roll-in", "honk-hop", "dry-wiggle");
    void truckMotion.offsetWidth;
    truckMotion.classList.add("zoom-out");

    later(function(){
      isTransitioning = false;
      startVehicle(targetId, false);
    }, 580);
  });

  /* ============================================================================
     HUD, START VEHICLE, SOUND & CAR-WASH HOOT INTERACTIONS
     ============================================================================ */
  function updateHudProgress(animateStar){
    starNum.textContent = String(stars);
    if(animateStar){
      starPill.classList.remove("bump");
      void starPill.offsetWidth;
      starPill.classList.add("bump");
    }
    vehiclePills.forEach(function(btn){
      var id = btn.dataset.vehicle;
      var isAct = id === vehicleId;
      btn.classList.toggle("active", isAct);
      btn.setAttribute("aria-pressed", isAct ? "true" : "false");
      btn.classList.toggle("washed", !!washedMap[id]);
    });
    document.querySelectorAll(".mini-dot").forEach(function(dot){
      dot.classList.toggle("lit", !!washedMap[dot.dataset.v]);
    });
  }

  function startVehicle(id, isBoot){
    if(!VEHICLES[id]) id = "firetruck";
    clearTimers();
    clearVoice(true);
    vehicleId = id;
    phase = "sponge";
    chosenSticker = null;
    isTransitioning = false;
    isDrying = false;
    isScrubbing = false;
    hasInteractedThisTruck = false;
    idleVoiceReminded = false;
    bubbles.length = 0;
    droplets.length = 0;
    windRibbons.length = 0;
    sparkles.length = 0;

    truckSvg.innerHTML = vehicleSvg(vehicleId, null);
    foamCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    paintMudLayer();

    truckMotion.classList.remove("roll-in", "zoom-out", "honk-hop", "dry-wiggle");
    void truckMotion.offsetWidth;
    truckMotion.classList.add("roll-in");

    updateHudProgress(false);
    updatePhaseUI();
    speakCurrentStepGuide(!!isBoot);
    armIdle(true);
  }

  /* Populate static HUD vehicle pill art & tap handlers */
  vehiclePills.forEach(function(btn){
    var id = btn.dataset.vehicle;
    btn.querySelector(".pill-art").innerHTML = pillSvg(id);
    btn.addEventListener("click", function(){
      unlockAudioOnce();
      getAudioCtx();
      clickPopSfx(740);
      startVehicle(id, false);
    });
  });

  soundBtn.addEventListener("click", function(){
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    soundBtn.setAttribute("aria-label", soundOn ? "Turn Sound Off" : "Turn Sound On");
    if(!soundOn){
      clearVoice(true);
    } else {
      unlockAudioOnce();
      getAudioCtx();
      clickPopSfx(880);
      speakCurrentStepGuide(false);
    }
  });

  /* Tap Car-Wash Hoot -> happy bounce + repeats current spoken step instruction! */
  hootBtn.addEventListener("click", function(){
    unlockAudioOnce();
    getAudioCtx();
    hootCheer();
    clickPopSfx(960);
    window.__bellyArmed = true;
    setTimeout(function(){ window.__bellyArmed = false; }, 500);
    speakCurrentStepGuide(false);
  });

  /* Smooth eye-tracking on Car-Wash Hoot */
  function trackEyes(x, y){
    var r = hootBtn.getBoundingClientRect();
    if(!r.width) return;
    var dx = Math.max(-4.5, Math.min(4.5, (x - (r.left + r.width * 0.5)) / 48));
    var dy = Math.max(-3.5, Math.min(4.5, (y - (r.top + r.height * 0.42)) / 48));
    hootPupils.setAttribute("transform", "translate(" + dx.toFixed(1) + "," + dy.toFixed(1) + ")");
  }
  stage.addEventListener("pointermove", function(e){ trackEyes(e.clientX, e.clientY); });
  stage.addEventListener("pointerdown", function(e){ trackEyes(e.clientX, e.clientY); });

  /* Clean Teardown */
  function teardown(){
    dead = true;
    clearTimers();
    if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    if(idleVoiceTimer){ clearTimeout(idleVoiceTimer); idleVoiceTimer = null; }
    if(fxRaf) cancelAnimationFrame(fxRaf);
    clearVoice(true);
  }
  window.addEventListener("pagehide", teardown);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) clearVoice(false);
  });

  /* ============================================================================
     BOOT & PUBLIC TEST HOOK (window.__carwashGame)
     ============================================================================ */
  startVehicle("firetruck", true);
  fxRaf = requestAnimationFrame(tickFx);

  function snapshot(){
    return {
      vehicleId: vehicleId,
      phase: phase,
      stepIndex: STEP_ORDER.indexOf(phase),
      mudCleanedRatio: Number(mudCleanedRatio.toFixed(3)),
      foamCleanedRatio: Number(foamCleanedRatio.toFixed(3)),
      sticker: chosenSticker,
      washedCount: washedCount,
      washedMap: Object.assign({}, washedMap),
      stars: stars,
      isRiley: IS_RILEY,
      brushRadius: BRUSH_RADIUS,
      cleanThreshold: CLEAN_THRESHOLD
    };
  }

  window.__carwashGame = {
    snapshot: snapshot,
    finishStepForTest: function(){
      isTransitioning = false;
      isDrying = false;
      if(phase === "sponge"){
        completeSpongeStep(true);
      } else if(phase === "rinse"){
        completeRinseStep(true);
      } else if(phase === "dry"){
        triggerBreezyDry(true);
      } else if(phase === "celebrate"){
        var nextIdx = (VEHICLE_ORDER.indexOf(vehicleId) + 1) % VEHICLE_ORDER.length;
        startVehicle(VEHICLE_ORDER[nextIdx], false);
      }
      return snapshot();
    }
  };
})();
</script>
