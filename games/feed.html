<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="feed";</script>
<script src="js/hoot-game-head.js?v=llprev3e66"></script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />

<title>Feed Hoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#17324f; --ink-soft:#3d5a78; --paper:#fffdf6;
    --sun:#ffc93c; --coral:#ff6b5e; --coral-dark:#d84a3d; --teal:#17bebb; --leaf:#57cc62; --leaf-dark:#3da147;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{ margin:0; font-family:"Nunito",system-ui,sans-serif; color:var(--ink); overflow:hidden; background:#aee7ff; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  #stage{ position:fixed; inset:0; height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#6ec9f7 0%,#a5e3ff 30%,#d9f6e3 60%,#eafce8 100%); }

  /* ---------- orchard decor ---------- */
  .decor{ position:absolute; border:none; background:none; padding:0; cursor:pointer; font-family:inherit; }
  #sun{ top:6px; right:6px; width:74px; height:74px; z-index:1; }
  #sun svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 10px rgba(232,169,12,.35)); }
  #sun .rays{ transform-box:fill-box; transform-origin:center; animation:sunSpin 46s linear infinite; }
  @keyframes sunSpin{ to{ transform:rotate(360deg); } }
  #sun.zing .rays{ animation:sunSpin 1.1s cubic-bezier(.34,1.4,.5,1) 1; }
  #sun:active{ transform:scale(.93); }
  .cloud{ z-index:1; width:104px; height:46px; opacity:.95; animation:drift linear infinite; }
  .cloud svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 5px 8px rgba(23,50,79,.12)); transition:transform .25s cubic-bezier(.34,1.8,.5,1); }
  .cloud.puff svg{ transform:scale(1.22,1.35); }
  @keyframes drift{ from{ transform:translateX(-130px); } to{ transform:translateX(112vw); } }
  #tree{ position:absolute; z-index:1; left:-14px; top:2%; width:clamp(110px,30vw,170px); pointer-events:none; }
  #tree svg{ width:100%; display:block; }
  #tree .tap-apple{ pointer-events:auto; cursor:pointer; }
  .bfly{ z-index:2; width:38px; height:30px; animation:flutter 7s ease-in-out infinite alternate; }
  .bfly svg{ width:100%; height:100%; display:block; overflow:visible; }
  .bfly .bw{ transform-box:fill-box; animation:flapB .22s ease-in-out infinite alternate; }
  .bfly .bw-l{ transform-origin:100% 50%; } .bfly .bw-r{ transform-origin:0% 50%; }
  @keyframes flapB{ from{ transform:scaleX(1);} to{ transform:scaleX(.45);} }
  @keyframes flutter{ 0%{ transform:translate(0,0) rotate(-4deg);} 50%{ transform:translate(24px,-18px) rotate(5deg);} 100%{ transform:translate(-12px,-6px) rotate(-3deg);} }

  /* ---------- HUD ---------- */
  #hud{ position:relative; z-index:6; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:max(8px,env(safe-area-inset-top)) 10px 0; }
  .hud-btns{ display:flex; gap:8px; }
  .round-btn{ width:50px; height:50px; border-radius:50%; border:3px solid #fff; background:rgba(255,253,246,.96); color:var(--ink); display:grid; place-items:center; box-shadow:0 4px 0 rgba(23,50,79,.18),0 8px 16px rgba(23,50,79,.12); cursor:pointer; transition:transform .12s ease; }
  .round-btn:active{ transform:scale(.9); }
  .round-btn svg{ width:25px; height:25px; }
  #starBank{ display:flex; align-items:center; gap:7px; background:rgba(255,253,246,.96); border:3px solid #fff; border-radius:999px; padding:6px 16px 6px 10px; box-shadow:0 4px 0 rgba(23,50,79,.14),0 8px 16px rgba(23,50,79,.1); font-family:"Fredoka",sans-serif; font-weight:700; font-size:22px; }
  #starBank .star-ic{ width:25px; height:25px; }
  #starBank.bump{ animation:bankBump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes bankBump{ 0%{ transform:scale(1);} 40%{ transform:scale(1.16) rotate(-3deg);} 100%{ transform:scale(1);} }

  /* ---------- request card + tummy meter ---------- */
  #targetCard{ position:relative; z-index:6; margin:8px auto 0; display:flex; align-items:center; gap:12px; background:rgba(255,253,246,.97); border:3px solid #fff; border-radius:20px; box-shadow:0 5px 0 rgba(23,50,79,.12),0 12px 22px rgba(23,50,79,.12); padding:7px 10px 7px 16px; max-width:min(94vw,500px); }
  #targetCard.new-target{ animation:tcIn .45s cubic-bezier(.34,1.7,.5,1); }
  @keyframes tcIn{ 0%{ transform:scale(.8); opacity:0;} 100%{ transform:scale(1); opacity:1;} }
  #targetMain{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(21px,5.8vw,29px); line-height:1.05; color:var(--coral-dark); white-space:nowrap; }
  .tc-label{ font-weight:900; font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); }
  #tummy{ margin-top:3px; }
  #tummyLabel{ font-weight:900; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:#d84a3d; }
  #hearts{ display:flex; gap:3px; margin-top:1px; flex-wrap:wrap; max-width:170px; }
  #hearts svg{ width:19px; height:19px; display:block; }
  #hearts .h-on path{ fill:#ff6b5e; stroke:#d84a3d; }
  #hearts .h-off path{ fill:#f3e3e1; stroke:#dcb8b4; }
  #hearts .h-pop{ animation:heartPop .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes heartPop{ 0%{ transform:scale(.4);} 100%{ transform:scale(1);} }
  #hearBtn{ width:44px; height:44px; flex:0 0 auto; border-radius:50%; border:3px solid #ffe1a8; background:#fff6dd; display:grid; place-items:center; cursor:pointer; box-shadow:0 3px 0 rgba(232,169,12,.35); }
  #hearBtn:active{ transform:scale(.9); }
  #hearBtn svg{ width:23px; height:23px; }

  /* ---------- scene ---------- */
  #scene{ position:relative; flex:1 1 auto; min-height:0; z-index:1; display:flex; flex-direction:column; }
  #meadow{ position:absolute; left:0; right:0; bottom:0; height:40%; z-index:0; pointer-events:none; }
  #hootStage{ position:relative; z-index:3; flex:1 1 auto; display:flex; align-items:flex-end; justify-content:center; min-height:0; }
  #hootFig{ position:relative; border:none; background:none; padding:0; cursor:pointer; width:clamp(150px,44vw,232px); max-height:100%; filter:drop-shadow(0 10px 12px rgba(23,50,79,.25)); animation:hootBob 3.2s ease-in-out infinite; transform-origin:50% 92%; }
  #hootFig svg{ width:100%; display:block; overflow:visible; }
  @keyframes hootBob{ 0%,100%{ transform:translateY(0) rotate(0);} 50%{ transform:translateY(-4px) rotate(-1deg);} }
  #hootFig.celebrate{ animation:hootJump .55s cubic-bezier(.34,1.6,.5,1) 3; }
  @keyframes hootJump{ 0%{ transform:translateY(0);} 35%{ transform:translateY(-24px) rotate(-3deg);} 70%{ transform:translateY(2px);} 100%{ transform:translateY(0);} }
  #hootFig.shake{ animation:hootShake .45s ease-in-out 2; }
  @keyframes hootShake{ 0%,100%{ transform:rotate(0);} 25%{ transform:rotate(-6deg);} 75%{ transform:rotate(6deg);} }
  #hootFig.talking{ animation:hootTalk .22s ease-in-out infinite alternate; }
  @keyframes hootTalk{ from{ transform:translateY(0) scale(1);} to{ transform:translateY(-2px) scale(1.018);} }
  #hootFig.munching{ animation:hootMunch .18s ease-in-out 5 alternate; }
  @keyframes hootMunch{ from{ transform:translateY(0) scale(1,1);} to{ transform:translateY(3px) scale(1.04,.96);} }
  #hootFig.wave .wing-r{ animation:wingWave .45s ease-in-out 6 alternate; }
  #hootFig .wing-r{ transform-box:fill-box; transform-origin:15% 12%; }
  #hootFig .wing-l{ transform-box:fill-box; transform-origin:85% 12%; }
  @keyframes wingWave{ from{ transform:rotate(0);} to{ transform:rotate(-38deg);} }
  #hootFig.celebrate .wing-l{ animation:wingFlapL .28s ease-in-out infinite alternate; }
  #hootFig.celebrate .wing-r{ animation:wingFlapR .28s ease-in-out infinite alternate; }
  @keyframes wingFlapL{ from{ transform:rotate(0);} to{ transform:rotate(30deg);} }
  @keyframes wingFlapR{ from{ transform:rotate(0);} to{ transform:rotate(-30deg);} }
  #hootFig .eyes{ transform-box:fill-box; transform-origin:center; animation:blink 4.6s infinite; }
  @keyframes blink{ 0%,92%,100%{ transform:scaleY(1);} 95%{ transform:scaleY(.08);} }
  #hootFig .beak-low{ transform-box:fill-box; transform-origin:50% 0%; }
  #hootFig.munching .beak-low{ animation:beakChomp .18s ease-in-out 5 alternate; }
  @keyframes beakChomp{ from{ transform:rotate(0);} to{ transform:rotate(16deg);} }
  #hootFig .belly{ transform-box:fill-box; transform-origin:center; transition:transform .5s cubic-bezier(.34,1.6,.5,1); }
  #hootFig.full .belly{ }
  /* picnic blanket */
  #blanket{ position:relative; z-index:4; margin:2px auto max(6px,env(safe-area-inset-bottom)); width:min(96vw,560px);
    background:repeating-conic-gradient(#ff8fa3 0% 25%, #fff3f5 0% 50%) 0 0/44px 44px;
    border:3px solid #fff; border-radius:22px; box-shadow:0 8px 0 rgba(23,50,79,.12),0 16px 28px rgba(23,50,79,.15);
    padding:10px 8px; display:flex; flex-wrap:wrap; justify-content:center; gap:7px; min-height:96px; align-content:center; }
  .food{ width:clamp(62px,17.5vw,80px); height:clamp(62px,17.5vw,80px); border:3px solid #fff; border-radius:50%; background:rgba(255,253,246,.95); padding:7px; cursor:pointer; box-shadow:0 4px 0 rgba(23,50,79,.15); transition:transform .12s ease; position:relative; }
  .food svg{ width:100%; height:100%; display:block; }
  .food:active{ transform:scale(.9); }
  .food.eaten{ visibility:hidden; }
  .food.hint-glow{ animation:foodGlow .5s ease-in-out 3 alternate; border-color:var(--sun); }
  @keyframes foodGlow{ from{ transform:scale(1);} to{ transform:scale(1.1);} }

  /* bubble row */
  #bubbleRow{ position:relative; z-index:6; padding:0 10px max(8px,env(safe-area-inset-bottom)); }
  #bubble{ position:relative; background:var(--paper); border:3px solid #fff; border-radius:20px; box-shadow:0 5px 0 rgba(23,50,79,.14),0 12px 24px rgba(23,50,79,.14); padding:10px 14px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(15px,4.1vw,19px); line-height:1.3; color:var(--ink); max-width:640px; margin:0 auto; }
  #bubble .b-big{ color:#d84a3d; font-size:1.22em; font-weight:700; }
  #hootName{ display:inline-block; margin-top:5px; margin-left:8px; background:#17324f; color:#ffe9a8; font-family:"Fredoka",sans-serif; font-weight:700; font-size:11px; letter-spacing:.22em; padding:2px 10px 2px 12px; border-radius:99px; }

  .fly-clone{ position:absolute; z-index:9; pointer-events:none; }
  .fly-clone svg{ width:100%; display:block; }
  .particle{ position:absolute; z-index:9; width:10px; height:10px; border-radius:3px; pointer-events:none; }
  .confetti{ position:absolute; z-index:9; width:11px; height:11px; border-radius:3px; pointer-events:none; }
  .nom{ position:absolute; z-index:9; font-family:"Fredoka",sans-serif; font-weight:700; color:#d84a3d; font-size:17px; pointer-events:none; animation:nomUp .8s ease-out forwards; }
  @keyframes nomUp{ 0%{ transform:translateY(0) scale(.7); opacity:0;} 20%{ opacity:1;} 100%{ transform:translateY(-34px) scale(1.1); opacity:0;} }

  /* ---------- start panel / win ---------- */
  #startPanel{ position:absolute; z-index:8; left:50%; top:45%; transform:translate(-50%,-50%); width:min(94vw,452px); background:rgba(255,253,246,.98); border:3px solid #fff; border-radius:26px; box-shadow:0 10px 0 rgba(23,50,79,.12),0 24px 48px rgba(23,50,79,.25); padding:16px 18px 14px; text-align:center; max-height:92dvh; overflow:auto; }
  #startPanel[hidden]{ display:none; }
  #startPanel h1{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(26px,7vw,36px); margin:0; color:var(--ink); }
  #startPanel h1 .t-a{ color:var(--coral-dark); } #startPanel h1 .t-b{ color:#e07f00; }
  #startPanel p{ font-weight:800; color:var(--ink-soft); font-size:15px; line-height:1.4; margin:7px 0 0; }
  .mode-row{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:13px 0 4px; }
  .mode-chip{ flex:1 1 46%; border:3px solid #dcebf5; background:#f2f9ff; border-radius:16px; padding:8px 6px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:15.5px; color:var(--ink); cursor:pointer; line-height:1.15; }
  .mode-chip small{ display:block; font-family:"Nunito",sans-serif; font-weight:800; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .mode-chip.selected{ border-color:var(--sun); background:#fff6dd; box-shadow:0 4px 0 rgba(232,169,12,.4); }
  #playBtn{ margin-top:12px; border:none; cursor:pointer; background:var(--coral); color:#fff; font-family:"Fredoka",sans-serif; font-weight:700; font-size:23px; padding:12px 44px; border-radius:999px; box-shadow:0 6px 0 var(--coral-dark),0 14px 24px rgba(216,74,61,.35); transition:transform .12s ease; }
  #playBtn:active{ transform:scale(.95); }
  #winOverlay{ position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(23,50,79,.38); padding:14px; }
  #winOverlay[hidden]{ display:none; }
  #winCard{ background:var(--paper); border:3px solid #fff; border-radius:26px; box-shadow:0 12px 0 rgba(23,50,79,.15),0 30px 60px rgba(23,50,79,.3); padding:20px 22px 18px; text-align:center; width:min(94vw,470px); max-height:92dvh; overflow:auto; }
  #winStars{ font-size:30px; letter-spacing:6px; color:#e3edf5; line-height:1; }
  #winStars span{ display:inline-block; }
  #winStars span.lit{ color:var(--sun); text-shadow:0 0 14px rgba(255,201,60,.8); animation:starLit .4s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starLit{ 0%{ transform:scale(.3) rotate(-30deg);} 100%{ transform:scale(1) rotate(0);} }
  #winCard h2{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(25px,6.6vw,34px); margin:8px 0 0; }
  #winRecap{ font-weight:800; color:var(--ink-soft); font-size:15.5px; line-height:1.45; margin:8px 0 0; }
  #winChips{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
  .chip{ background:#fdf0ec; border:2px solid #f6cfc7; color:var(--ink); font-family:"Fredoka",sans-serif; font-weight:600; font-size:14px; padding:4px 12px; border-radius:999px; }
  .win-btns{ display:flex; gap:9px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .win-btn{ border:none; cursor:pointer; font-family:"Fredoka",sans-serif; font-weight:700; font-size:18px; padding:11px 24px; border-radius:999px; }
  #againBtn{ background:var(--coral); color:#fff; box-shadow:0 5px 0 var(--coral-dark); }
  #winHomeBtn{ background:#eef5fb; color:var(--ink); box-shadow:0 5px 0 #cfdfec; }
  .win-btn:active{ transform:scale(.95); }

  @media (max-height:500px) and (min-width:560px){
    #hootFig{ width:clamp(110px,30vh,150px); }
    #targetCard{ margin-top:4px; padding:4px 8px 4px 12px; }
    #startPanel{ top:50%; padding:10px 16px; }
    .food{ width:56px; height:56px; }
    #blanket{ min-height:72px; padding:6px; }
  }
  @media (prefers-reduced-motion:reduce){
    .cloud,.bfly{ animation:none !important; }
  }
#hearts.food-row{max-width:250px;gap:4px}#hearts.food-row .fd{display:inline-block;width:34px;height:34px}#hearts.food-row svg{width:34px;height:34px}#hearts.food-row .fd-off{filter:saturate(.55);opacity:.45}#hearts.food-row .fd-pop{animation:heartPop .45s cubic-bezier(.34,1.8,.5,1)}@media (max-width:420px){#hearts.food-row .fd,#hearts.food-row svg{width:28px;height:28px}}</style>
</head>
<body>
<div id="stage">
  <button class="decor" id="sun" type="button" aria-label="Sun — tap for a sparkle">
    <svg viewBox="0 0 100 100" aria-hidden="true"><g class="rays" stroke="#ffb703" stroke-width="6" stroke-linecap="round"><path d="M50 2v12M50 86v12M2 50h12M86 50h12M16 16l8 8M76 76l8 8M84 16l-8 8M24 76l-8 8"/></g><circle cx="50" cy="50" r="27" fill="#ffc93c" stroke="#f0a500" stroke-width="3"/><circle cx="41" cy="46" r="3.4" fill="#17324f"/><circle cx="59" cy="46" r="3.4" fill="#17324f"/><path d="M40 58 Q50 66 60 58" stroke="#17324f" stroke-width="3.4" fill="none" stroke-linecap="round"/></svg>
  </button>
  <button class="decor cloud" type="button" style="top:9%;animation-duration:88s;animation-delay:-40s" aria-label="Cloud — tap for a puff"><svg viewBox="0 0 120 54" aria-hidden="true"><ellipse cx="38" cy="38" rx="30" ry="14" fill="#fff"/><ellipse cx="66" cy="28" rx="26" ry="19" fill="#fff"/><ellipse cx="88" cy="38" rx="24" ry="13" fill="#fff"/></svg></button>

  <div id="hud">
    <div class="hud-btns">
      <button class="round-btn" id="soundBtn" type="button" aria-label="Turn sound off">
        <svg id="soundOnIc" viewBox="0 0 24 24" fill="none" stroke="#17324f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="#ffc93c" stroke="#17324f"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.2 6a9 9 0 0 1 0 12"/></svg>
        <svg id="soundOffIc" viewBox="0 0 24 24" fill="none" stroke="#17324f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z" fill="#dbe7f2" stroke="#17324f"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
      </button>
      <button class="round-btn" id="homeBtn" type="button" aria-label="Back to the start screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="#17324f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M6 10v9h12v-9" fill="#aee7ff"/></svg>
      </button>
    </div>
    <div id="starBank" aria-label="Stars collected">
      <svg class="star-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z" fill="#ffc93c" stroke="#e8a90c" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <span id="starCount">0</span>
    </div>
  </div>

  <div id="targetCard" style="display:none">
    <div>
      <div id="targetMain">3 Apples</div>
      <div class="tc-label" id="tcLabel">Hoot is hungry for…</div>
      <div id="tummy"><span id="tummyLabel">Hoot&rsquo;s Tummy</span><div id="hearts"></div></div>
    </div>
    <button id="hearBtn" type="button" aria-label="Hear Hoot's order again">
      <svg viewBox="0 0 24 24" fill="none" stroke="#17324f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="#ffc93c" stroke="#17324f"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.2 6a9 9 0 0 1 0 12"/></svg>
    </button>
  </div>

  <div id="scene">
    <svg id="meadow" viewBox="0 0 400 110" preserveAspectRatio="none" aria-hidden="true"><path d="M0 55 Q90 15 200 48 Q310 78 400 40 L400 110 L0 110Z" fill="#8edd7e"/><path d="M0 78 Q110 45 230 72 Q330 92 400 66 L400 110 L0 110Z" fill="#57cc62"/></svg>
    <div id="tree" aria-hidden="true">
      <svg viewBox="0 0 160 190"><path d="M74 190 L80 108 L86 190 Z" fill="#8a5a2b"/><path d="M80 130 L52 100 M80 118 L110 92" stroke="#8a5a2b" stroke-width="9" stroke-linecap="round"/><circle cx="52" cy="66" r="42" fill="#57cc62"/><circle cx="104" cy="52" r="38" fill="#3da147"/><circle cx="80" cy="34" r="34" fill="#57cc62"/><g class="tap-apple"><circle cx="46" cy="58" r="9" fill="#e23b3b"/><circle cx="86" cy="26" r="9" fill="#e23b3b"/><circle cx="112" cy="62" r="9" fill="#e23b3b"/><circle cx="66" cy="86" r="9" fill="#e23b3b"/></g></svg>
    </div>
    <button class="decor bfly" type="button" style="right:12%;top:16%" aria-label="Butterfly — tap for a twirl"><svg viewBox="0 0 40 32" aria-hidden="true"><g class="bw bw-l"><ellipse cx="10" cy="11" rx="9" ry="7" fill="#ff8fab"/><ellipse cx="11" cy="23" rx="7" ry="5.5" fill="#ffb3c8"/></g><g class="bw bw-r"><ellipse cx="30" cy="11" rx="9" ry="7" fill="#ff8fab"/><ellipse cx="29" cy="23" rx="7" ry="5.5" fill="#ffb3c8"/></g><ellipse cx="20" cy="16" rx="3" ry="9" fill="#17324f"/></svg></button>
    <div id="hootStage">
      <button id="hootFig" type="button" aria-label="Hoot — tap to hear his order again">
        <svg viewBox="0 0 200 210" aria-hidden="true">
          <path d="M82 178 L100 205 L118 178 Z" fill="#8a5a33"/>

  /* ================= HOOT'S VOICE — one line at a time, chained on 'ended' =================
     Every clip goes through this single queue on a single Audio element.
     A line that has started always finishes: the next clip is only loaded
     from the 'ended' event, never from a timer, and pending (not yet
     started) lines can be replaced when the game moves on. The hub's
     injected voice governor arbitrates this element against every other
     voice in the app the same way. No device text-to-speech anywhere.
     Hoot's orders use the recorded number and colour clips; food names
     themselves have no recorded clip, so they live in his bubble and on
     the request card while his voice carries the numbers and colours. */
  var VBASE="assets/voice/";
  var voiceEl=null, vQueue=[], vPlaying=false, vCurrent=null;
  function getVoice(){
    if(!voiceEl){
      voiceEl=new Audio(); voiceEl.preload="auto";
      voiceEl.addEventListener("ended",function(){var e=voiceEl;if(e.__hwT&&Date.now()-e.__hwT<400){if(!e.paused&&!e.ended)return;if(!e.__hwRetry){e.__hwRetry=1;try{e.currentTime=0;}catch(x){}var p=e.play();if(p&&p.catch)p.catch(function(){vNext();});return;}}vNext();});

    }catch(e){ return false; }

    if(!vPlaying){ pumpVoice(); return; }

  }
  function pumpVoice(){
    if(vPlaying||dead) return;
    var item=vQueue.shift(); if(!item) return;
    if(item.onStart){ try{ item.onStart(); }catch(e){} }

    return clone;
  }
  function spitFood(food,fromBtn){
    /* the rejected bite pops back out of Hoot's beak and drops away */
    var clone=document.createElement("div"); clone.className="fly-clone";
    clone.innerHTML=foodSVG(food);
    var sr=scene.getBoundingClientRect(), hr=hootFig.getBoundingClientRect();
    var w=44;
    var x0=hr.left+hr.width/2-sr.left-w/2, y0=hr.top+hr.height*0.36-sr.top-w/2;
    clone.style.width=w+"px"; clone.style.left=x0+"px"; clone.style.top=y0+"px";
    scene.appendChild(clone);
    poofSound();
    if(clone.animate){
      clone.animate([
        {transform:"translate(0,0) rotate(0deg)",opacity:1},
        {transform:"translate(-30px,90px) rotate(-160deg)",opacity:.9,offset:0.7},
        {transform:"translate(-44px,190px) rotate(-260deg)",opacity:0}
      ],{duration:640,easing:"cubic-bezier(.3,.6,.4,1)"});
    }
    setTimeout(function(){ clone.remove(); },680);
  }

  /* ================= BLANKET ================= */
  function layBlanket(list){
    blanket.innerHTML="";
    list.forEach(function(f){
      var b=document.createElement("button"); b.type="button"; b.className="food";
      b.dataset.id=f.id; b.setAttribute("aria-label",f.name);
      b.innerHTML=foodSVG(f);
      b.addEventListener("click",function(){ onFoodTap(b,f); });
      blanket.appendChild(b);
    });
  }
  function blanketFoodsForRequest(){
    var list=[];
    for(var i=0;i<reqNeed;i++) list.push(reqFood);
    var others=shuffle(FOODS.filter(function(f){ return f.id!==reqFood.id; }));
    var fill=Math.min(9-list.length,5);
    for(var j=0;j<fill;j++) list.push(others[j]);
    return shuffle(list);
  }

  /* ================= REQUESTS ================= */
  function newRequest(){
    if(dead||state!=="playing") return;
    reqFood=(function(){var P={};try{P=window.parent||{};}catch(e){}var H=P.HOOT_HAVE||{},SAY={apple:1,banana:1,orange:1};var ok=FOODS.filter(function(f){return SAY[f.id]||H["food-"+f.id];});if(!ok.length)ok=FOODS;var last=window.__hwLastFood;var pick=ok.filter(function(f){return f.id!==last;});if(!pick.length)pick=ok;var f=pick[Math.floor(Math.random()*pick.length)];window.__hwLastFood=f.id;return f;})(); /* 3e44: only ask for foods Hoot can say, so a child who cannot read hears what to find */
    reqNeed=1+Math.floor(Math.random()*6); /* 1..6 */
    if(reqNeed<2&&Math.random()<0.6) reqNeed=2;
    reqGot=0;
    var plural=PLURALS[reqFood.id];
    targetMain.textContent=qty(reqNeed,reqFood.id);
    tcLabel.textContent="Hoot is hungry for…";
    targetCard.style.display="flex";
    targetCard.classList.remove("new-target"); void targetCard.offsetWidth; targetCard.classList.add("new-target");
    renderHearts(reqNeed,0);
    layBlanket(blanketFoodsForRequest());
    clearPending();
    var f=reqFood, n=reqNeed;
    (function(){var P={};try{P=window.parent||{};}catch(e){}if((P.HOOT_HAVE||{})["feed-hungry-for"]) enqueue("feed-hungry-for.mp3","line","",null);})(); /* 3e44: "I'm hungry for…" then the number, then the food */
    enqueue("call-number-"+n+".mp3","name","",function(){
      say("I&rsquo;m hungry for <span class='b-big'>"+qty(n,f.id)+"</span>! Tap the "+PLURALS[f.id].toLowerCase()+" on the blanket — count them into my beak!");
    });__hwFood(f,n);
    inputLock=false;
  }
  function newSortColor(){
    if(dead||state!=="playing") return;
    var colors=["red","yellow","orange","green","purple"].filter(function(c){ return c!==sortColor; });
    sortColor=colors[Math.floor(Math.random()*colors.length)];
    sortGot=0;
    targetMain.textContent=sortColor.toUpperCase()+" foods";
    tcLabel.textContent="Hoot wants only…";
    targetCard.style.display="flex";
    targetCard.classList.remove("new-target"); void targetCard.offsetWidth; targetCard.classList.add("new-target");
    renderHearts(SORT_GOAL,sortTotal);
    var ofColor=shuffle(FOODS.filter(function(f){ return f.color===sortColor; }));
    var others=shuffle(FOODS.filter(function(f){ return f.color!==sortColor; }));
    /* Some colours have fewer than SORT_PER_COLOR distinct foods (only
       one purple food exists!), so the blanket repeats that colour's
       foods — there are always enough correct bites to fill the call. */
    var list=[];
    for(var i=0;i<SORT_PER_COLOR;i++) list.push(ofColor[i%ofColor.length]);
    list=list.concat(others.slice(0,5));
    while(list.length<8) list.push(others[list.length%others.length]);
    layBlanket(shuffle(list));
    clearPending();
    var c=sortColor;
    enqueue("call-color-"+c+".mp3","name","",function(){
      say("Today I only want <span class='b-big'>"+c.toUpperCase()+"</span> foods! Feed me something "+c+"!");
    });
    inputLock=false;
  }
  function startSnack(){
    targetMain.textContent="Snack Time!";
    tcLabel.textContent="Feed Hoot anything he likes";
    targetCard.style.display="flex";
    renderHearts(SNACK_GOAL,0);
    layBlanket(shuffle(FOODS.slice()).slice(0,9));
    say("Snack time! Tap ANY food and I&rsquo;ll munch it and tell you what it is!");
    if(window.__hootSpeak) window.__hootSpeak("idle");
    inputLock=false;
  }

  /* ================= FEEDING ================= */
  function onFoodTap(btn,food){
    if(state!=="playing"||inputLock||dead) return;
    if(btn.dataset.done) return;
    audio();
    if(mode==="snack"){ btn.dataset.done="1"; eatFood(btn,food,true); return; }
    if(mode==="number"){
      if(food.id===reqFood.id){ btn.dataset.done="1"; eatFood(btn,food,true); }
      else rejectFood(btn,food,"That&rsquo;s a <span class='b-big'>"+food.name+"</span>, not a "+reqFood.name+"! I&rsquo;m hungry for "+PLURALS[reqFood.id]+" — tap a "+reqFood.name+"!");
      return;
    }
    /* sort */
    if(food.color===sortColor){ btn.dataset.done="1"; eatFood(btn,food,true); }
    else rejectFood(btn,food,"Yuck! That&rsquo;s <span class='b-big'>"+food.color+"</span> — today I only want "+sortColor.toUpperCase()+" foods!");
  }
  function eatFood(btn,food,correct){
    inputLock=true;
    btn.classList.add("eaten");
    flyFood(food,btn,true,function(){
      if(dead) return;
      munch();
      totalBites++; growBelly();
      totals[food.id]=(totals[food.id]||0)+1;
      if(mode==="number"){
        reqGot++;
        renderHearts(reqNeed,reqGot);
        var got=reqGot, f=reqFood, need=reqNeed;
        if(got<need){
          enqueue("call-number-"+got+".mp3","count","",function(){
            say("That&rsquo;s <span class='b-big'>"+got+"</span>! "+(need-got===1?"One more "+f.name+"!":"Feed me "+(need-got)+" more!"));
          });
          inputLock=false;
        } else {
          requestComplete();
        }
      } else if(mode==="sort"){
        sortGot++; sortTotal++;
        renderHearts(SORT_GOAL,sortTotal);
        __hwFood(food,1); /* 3e51 */
        say("Mmm, <span class='b-big'>"+food.color+" "+food.name+"</span>! "+food.fact);
        if(sortTotal>=SORT_GOAL){ sortComplete(); }
        else if(sortGot>=SORT_PER_COLOR){
          stars++; bumpStars(); updateHUD(); enqueuePraise();
          var tk=++roundToken;
          setTimeout(function(){ if(!dead&&tk===roundToken&&state==="playing") newSortColor(); },1500);
        } else inputLock=false;
      } else { /* snack */
        snackEaten++;
        renderHearts(SNACK_GOAL,snackEaten);
        __hwFood(food,1); /* 3e51: Snack Time says the food's name, not only writes it */
        say("<span class='b-big'>"+food.name+"!</span> "+food.fact);
        if(snackEaten%3===0) if(window.__hootSpeak) window.__hootSpeak("idle");
        if(snackEaten>=SNACK_GOAL){ snackComplete(); }
        else {
          /* keep the blanket stocked */
          if(blanket.querySelectorAll(".food:not(.eaten)").length<3){
            var extra=shuffle(FOODS.slice()).slice(0,5);
            extra.forEach(function(f){
              var b=document.createElement("button"); b.type="button"; b.className="food";
              b.dataset.id=f.id; b.setAttribute("aria-label",f.name); b.innerHTML=foodSVG(f);
              b.addEventListener("click",function(){ onFoodTap(b,f); });
              blanket.appendChild(b);
            });
          }
          inputLock=false;
        }
      }
    });
  }
  function rejectFood(btn,food,msg){
    inputLock=true;
    /* flies in, Hoot shakes his head and spits it out with a giggle */
    flyFood(food,btn,true,function(){
      if(dead) return;
      hootReact("shake",800);
      spitFood(food,btn);
      say("<span class='b-big'>Yuck!</span> "+msg);
      clearPending();
      __hwFood(food,1); enqueue("hoot-try-again.mp3","hint","",null); /* 3e51: says what was tapped, then try again */
      setTimeout(function(){ if(!dead&&state==="playing") inputLock=false; },650);
    });
  }
  function requestComplete(){
    stars++; bumpStars(); updateHUD(); starSound();
    requestsDone++;
    hootReact("celebrate",1600);
    var f=reqFood, n=reqNeed;
    say("You fed me <span class='b-big'>"+qty(n,f.id)+"</span>! "+f.fact+" My tummy is happy!");
    clearPending(); enqueuePraise();
    var tk=++roundToken;
    setTimeout(function(){
      if(dead||tk!==roundToken||state!=="playing") return;
      if(requestsDone>=REQUESTS_GOAL) winRound();
      else newRequest();
    },1750);
  }
  function sortComplete(){
    starSound(); hootReact("celebrate",1600);
    say("My tummy is FULL of colours! What a rainbow snack!");
    var tk=++roundToken;
    setTimeout(function(){ if(!dead&&tk===roundToken&&state==="playing") winRound(); },1400);
  }
  function snackComplete(){
    starSound(); hootReact("celebrate",1600);
    say("BURP! Excuse me! My tummy is completely full!");
    var tk=++roundToken;
    setTimeout(function(){ if(!dead&&tk===roundToken&&state==="playing") winRound(); },1400);
  }

  /* ================= START / WIN ================= */
  function startRound(){
    clearPending(); roundToken++;
    stars=0; requestsDone=0; reqGot=0; snackEaten=0; sortTotal=0; sortGot=0; sortColor=null; totalBites=0; totals={};
    inputLock=false; wonFlag=false;
    growBelly();
    winOverlay.hidden=true; startPanel.hidden=true;
    state="playing"; updateHUD();
    enqueue("hoot-game-hello.mp3","hello","",function(){ say("Hello! My tummy is rumbly — let&rsquo;s eat!"); });
    if(mode==="number") newRequest();
    else if(mode==="sort") newSortColor();
    else startSnack();
  }
  function winRound(){
    if(wonFlag) return; wonFlag=true; state="won";
    targetCard.style.display="none";
    stars=Math.max(stars,1); updateHUD();
    vQueue=vQueue.filter(function(q){ return q.kind==="praise"; });
    enqueue("hoot-you-learned.mp3","recap","",function(){
      say("I&rsquo;m full and happy! Thank you for feeding me!");
    });
    var parts=[];
    Object.keys(totals).forEach(function(id){ parts.push(qty(totals[id],id)); });
    winChips.innerHTML="";
    Object.keys(totals).forEach(function(id){
      var c=document.createElement("span"); c.className="chip"; c.textContent=qty(totals[id],id); winChips.appendChild(c);
    });
    if(mode==="number"){
      winTitle.textContent="Hoot Is Full!";
      winRecap.innerHTML="You counted out every snack Hoot asked for — <b>"+parts.join(", ")+"</b>! Counting with a hungry friend is counting that sticks.";
    } else if(mode==="sort"){
      winTitle.textContent="Rainbow Tummy!";
      winRecap.innerHTML="You sorted Hoot&rsquo;s snacks by colour — he ate <b>"+parts.join(", ")+"</b>, and only the colours he called for!";
    } else {
      winTitle.textContent="Snack Star!";
      winRecap.innerHTML="Hoot tasted <b>"+parts.join(", ")+"</b> — "+totalBites+" happy bites in all! His tummy is full and round.";
    }
    var starEls=winStars.children;
    for(var i=0;i<starEls.length;i++){
      starEls[i].classList.remove("lit");
      (function(el,d){ setTimeout(function(){ el.classList.add("lit"); },d); })(starEls[i],200+i*180);
    }
    setTimeout(function(){ if(state==="won"&&!dead){ winOverlay.hidden=false; confetti(); sparkleSound(); } },650);
  }
  function resetToStart(){
    clearPending(); roundToken++;
    state="start"; inputLock=false; wonFlag=false;
    winOverlay.hidden=true; startPanel.hidden=false;
    targetCard.style.display="none";
    blanket.innerHTML="";
    say("Hi! I&rsquo;m Hoot, and my tummy is rumbly! Tap <span class='b-big'>Play</span> and feed me just what I ask for!");
    hootFig.classList.add("wave");
    setTimeout(function(){ hootFig.classList.remove("wave"); },2900);
  }

  /* ================= CONTROLS ================= */
  function hearAgain(){
    audio();
    if(state!=="playing"){ if(!vPlaying) if(window.__hootSpeak) window.__hootSpeak("idle"); hootReact("celebrate",1000); return; }
    clearPending();
    if(mode==="number"&&reqFood){
      var f=reqFood, n=reqNeed;
      enqueue("call-number-"+n+".mp3","name","",function(){
        say("I&rsquo;m hungry for <span class='b-big'>"+qty(n,f.id)+"</span>! I&rsquo;ve eaten "+reqGot+" so far!");
      });__hwFood(f,n);
    } else if(mode==="sort"&&sortColor){
      var c=sortColor;
      enqueue("call-color-"+c+".mp3","name","",function(){
        say("Today I only want <span class='b-big'>"+c.toUpperCase()+"</span> foods!");
      });
    } else if(!vPlaying) if(window.__hootSpeak) window.__hootSpeak("idle");
  }
  hootFig.addEventListener("click",hearAgain);
  $("hearBtn").addEventListener("click",hearAgain);
  $("soundBtn").addEventListener("click",function(){
    soundOn=!soundOn;
    $("soundOnIc").style.display=soundOn?"block":"none";
    $("soundOffIc").style.display=soundOn?"none":"block";
    $("soundBtn").setAttribute("aria-label",soundOn?"Turn sound off":"Turn sound on");
    if(!soundOn){ clearPending(); }
    else { audio(); tone(660,660,0.1,"triangle",0.12); }
  });
  $("homeBtn").addEventListener("click",function(){ audio(); tone(520,520,0.09,"triangle",0.1); resetToStart(); });
  document.querySelectorAll(".mode-chip").forEach(function(ch){
    ch.addEventListener("click",function(){
      mode=ch.getAttribute("data-mode");
      document.querySelectorAll(".mode-chip").forEach(function(c){ c.classList.toggle("selected",c===ch); });
      tone(660,660,0.1,"triangle",0.1);
    });
  });
  $("playBtn").addEventListener("click",function(){ audio(); tone(740,740,0.1,"triangle",0.12); startRound(); });
  $("againBtn").addEventListener("click",function(){ audio(); tone(740,740,0.1,"triangle",0.12); startRound(); });
  $("winHomeBtn").addEventListener("click",function(){ audio(); resetToStart(); });

  /* ================= LIVING SCENE TAPS ================= */
  $("sun").addEventListener("click",function(){
    audio(); var s=$("sun"); s.classList.remove("zing"); void s.offsetWidth; s.classList.add("zing");
    sparkleSound();
    if(state==="start") say("Mr. Sun grows all my picnic food in the orchard!");
  });
  document.querySelectorAll(".cloud").forEach(function(c){
    c.addEventListener("click",function(){ audio(); c.classList.add("puff"); poofSound(); setTimeout(function(){ c.classList.remove("puff"); },300); });
  });
  document.querySelectorAll(".bfly").forEach(function(bf){
    bf.addEventListener("click",function(){
      audio(); sparkleSound();
      if(bf.animate) bf.animate([{transform:"rotate(0deg) scale(1)"},{transform:"rotate(360deg) scale(1.25)"}],{duration:560,easing:"ease-in-out"});
    });
  });
  document.querySelectorAll("#tree .tap-apple").forEach(function(a){
    a.addEventListener("click",function(){
      audio(); sparkleSound();
      say("Crunch! Fresh apples grow right here in my orchard!");
      if(!vPlaying) if(window.__hootSpeak) window.__hootSpeak("idle");
    });
  });

  /* ================= LEAVING THE GAME ================= */
  function teardown(){ dead=true; clearPending(); hootTalking(false); }
  window.addEventListener("pagehide",teardown);
  document.addEventListener("visibilitychange",function(){ if(document.hidden) clearPending(); });

  /* ================= INIT ================= */
  updateHUD();
  hootFig.classList.add("wave");
  setTimeout(function(){ hootFig.classList.remove("wave"); },2900);

  /* Probe/debug handle: read-only snapshot of the round state. */
  window.__feedGame={
    snapshot:function(){
      return { state:state, mode:mode, stars:stars,
        reqFood:reqFood?reqFood.id:null, reqNeed:reqNeed, reqGot:reqGot, requestsDone:requestsDone,
        sortColor:sortColor, sortTotal:sortTotal, snackEaten:snackEaten, totals:totals,
        winShown:!winOverlay.hidden, voicePlaying:vPlaying,
        voiceQueue:vQueue.map(function(q){ return q.file; }) };
    }
  };
})();
</script>
