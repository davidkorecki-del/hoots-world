<!doctype html>
<html lang="en">
<head>
<base href="../">
<script>window.__HOOT_GAME_KEY__="feed";window.__HOOT_SELF_COACH__=true;</script>
<script src="js/hoot-game-head.js?v=llprev3e128"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Feed Hoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#17324f;
    --cream:#fffdf7;
    --sun:#ffc93c;
    --coral:#ff5d52;
    --leaf:#3cc858;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:#6ecbf9;
    touch-action:none;
    user-select:none; -webkit-user-select:none;
  }

  #stage{
    position:fixed; inset:0; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
    background:linear-gradient(180deg, #4eb8f5 0%, #9be0ff 42%, #daf7df 68%, #68d362 100%);
  }

  /* ================= SUNNY STORYBOOK ORCHARD SCENERY ================= */
  #scenery{ position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  #meadowSvg{
    position:absolute; left:0; right:0; bottom:18%;
    width:100%; height:56%; display:block;
  }
  #orchardTree{
    position:absolute; left:-14px; bottom:24%;
    width:clamp(145px, 26vw, 248px);
    pointer-events:none; filter:drop-shadow(0 8px 14px rgba(23,50,79,.16));
  }
  #orchardTree .tree-apple{
    pointer-events:auto; cursor:pointer;
    transform-box:fill-box; transform-origin:center; transition:transform .18s cubic-bezier(.34,1.7,.5,1);
  }
  #orchardTree .tree-apple:active{ transform:scale(1.3); }

  .decor{ position:absolute; border:none; background:none; padding:0; cursor:pointer; pointer-events:auto; }
  #sunBtn{ top:74px; right:16px; width:82px; height:82px; z-index:2; }
  #sunBtn svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 16px rgba(255,183,3,.5)); }
  #sunBtn .rays{ transform-box:fill-box; transform-origin:center; animation:sunSpin 44s linear infinite; }
  #sunBtn.zing .rays{ animation:sunSpin .9s cubic-bezier(.34,1.5,.5,1) 1; }
  @keyframes sunSpin{ to{ transform:rotate(360deg); } }

  .cloud{ z-index:1; width:124px; height:56px; opacity:.95; animation:cloudDrift linear infinite; }
  .cloud svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 6px 10px rgba(23,50,79,.08)); transition:transform .25s cubic-bezier(.34,1.8,.5,1); }
  .cloud.puff svg{ transform:scale(1.24, 1.34); }
  @keyframes cloudDrift{ from{ transform:translateX(-150px); } to{ transform:translateX(112vw); } }

  #bflyBtn{
    right:17%; top:21%; width:66px; height:66px; z-index:3;
    display:grid; place-items:center; animation:bflyFloat 6.5s ease-in-out infinite alternate;
  }
  #bflyBtn svg{ width:50px; height:40px; overflow:visible; }
  #bflyBtn .bw{ transform-box:fill-box; animation:flapW .2s ease-in-out infinite alternate; }
  #bflyBtn .bw-l{ transform-origin:100% 50%; }
  #bflyBtn .bw-r{ transform-origin:0% 50%; }
  @keyframes flapW{ from{ transform:scaleX(1); } to{ transform:scaleX(.42); } }
  @keyframes bflyFloat{
    0%{ transform:translate(0,0) rotate(-5deg); }
    50%{ transform:translate(22px,-16px) rotate(6deg); }
    100%{ transform:translate(-10px,-4px) rotate(-3deg); }
  }

  /* ================= CLEAN PICTURE-ONLY TOP BAR (ALL >=64PX) ================= */
  #hud{
    position:relative; z-index:12;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:max(8px, env(safe-area-inset-top)) 12px 0;
    pointer-events:none;
  }
  .hud-group{ display:flex; align-items:center; gap:8px; pointer-events:auto; }
  .mode-pill{
    min-width:68px; height:66px; padding:0 12px; border-radius:22px;
    border:4px solid #fff; background:rgba(255,253,247,.95);
    box-shadow:0 5px 0 rgba(23,50,79,.22), 0 8px 18px rgba(23,50,79,.14);
    display:flex; align-items:center; justify-content:center; gap:5px;
    font-size:26px; cursor:pointer;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1), background .15s, box-shadow .15s;
  }
  .mode-pill:active{ transform:translateY(3px) scale(.95); }
  .mode-pill.on{
    background:linear-gradient(180deg, #ffe885 0%, #ffc93c 100%);
    border-color:#17324f;
    box-shadow:0 5px 0 #17324f, 0 0 22px rgba(255,201,60,.78);
    transform:translateY(-2px) scale(1.04);
  }
  .mode-pill .mp-num{ font-weight:800; font-size:20px; color:#17324f; letter-spacing:-.02em; }

  #soundBtn{
    width:66px; height:66px; border-radius:50%;
    border:4px solid #fff; background:rgba(255,253,247,.96);
    box-shadow:0 5px 0 rgba(23,50,79,.22), 0 8px 18px rgba(23,50,79,.14);
    display:grid; place-items:center; cursor:pointer;
  }
  #soundBtn:active{ transform:translateY(3px) scale(.94); }
  #soundBtn svg{ width:30px; height:30px; }

  #starPill{
    height:66px; padding:0 18px 0 14px; border-radius:999px;
    border:4px solid #fff; background:rgba(255,253,247,.96);
    box-shadow:0 5px 0 rgba(23,50,79,.22), 0 8px 18px rgba(23,50,79,.14);
    display:flex; align-items:center; gap:8px;
    font-weight:800; font-size:26px; color:#17324f;
  }
  #starPill svg{ width:30px; height:30px; display:block; }
  #starPill.bump{ animation:starBump .45s cubic-bezier(.34,1.8,.5,1); }
  @keyframes starBump{ 0%{ transform:scale(1); } 45%{ transform:scale(1.22) rotate(-4deg); } 100%{ transform:scale(1); } }

  /* ================= CENTER STAGE: PICTURE CLOUD + HOOT + BLENDER ================= */
  #centerStage{
    position:relative; z-index:6; flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding:0 10px;
  }

  /* Puffy Dream Cloud showing ONLY pictures (zero reading!) */
  #orderCloud{
    position:relative; z-index:9;
    display:flex; align-items:center; gap:12px;
    background:#fffdf8; border:5px solid #17324f; border-radius:36px;
    padding:10px 14px 10px 18px;
    box-shadow:0 8px 0 #17324f, 0 16px 32px rgba(23,50,79,.22);
    margin-bottom:8px; max-width:94vw;
    transition:transform .22s cubic-bezier(.34,1.7,.5,1);
  }
  #orderCloud::after{
    content:""; position:absolute; left:50%; bottom:-17px; transform:translateX(-50%);
    width:22px; height:22px; border-radius:50%;
    background:#fffdf8; border:5px solid #17324f;
    box-shadow:0 4px 0 #17324f;
  }
  #orderCloud.pop-in{ animation:cloudPop .48s cubic-bezier(.34,1.75,.5,1); }
  @keyframes cloudPop{ 0%{ transform:scale(.62) translateY(14px); opacity:0; } 100%{ transform:scale(1) translateY(0); opacity:1; } }

  #orderSlots{
    display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:nowrap;
  }
  .oslot{
    position:relative; width:clamp(54px, 13vw, 68px); height:clamp(54px, 13vw, 68px);
    border-radius:20px; background:#fff8e8; border:3.5px dashed #f59e0b;
    display:grid; place-items:center; padding:5px;
    transition:transform .25s cubic-bezier(.34,1.8,.5,1), background .2s, border-color .2s;
  }
  .oslot svg{ width:100%; height:100%; display:block; opacity:.78; transition:opacity .2s, transform .25s; }
  .oslot.filled{
    background:#dcfce7; border:3.5px solid #16a34a;
    box-shadow:0 4px 0 rgba(22,163,74,.32);
  }
  .oslot.filled svg{ opacity:1; }
  .oslot.just-fed{ animation:slotFed .5s cubic-bezier(.34,1.85,.5,1); }
  @keyframes slotFed{ 0%{ transform:scale(.5) rotate(-14deg); } 60%{ transform:scale(1.24) rotate(6deg); } 100%{ transform:scale(1) rotate(0); } }
  .oslot-num{
    position:absolute; right:-6px; bottom:-6px; width:25px; height:25px; border-radius:50%;
    background:#16a34a; color:#fff; border:2.5px solid #fff;
    font-size:14px; font-weight:800; display:grid; place-items:center;
    box-shadow:0 2px 5px rgba(0,0,0,.25);
  }
  .color-splat-badge{ display:flex; align-items:center; gap:8px; }
  .color-splat-svg{ width:64px; height:64px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.18)); animation:splatPulse 1.5s ease-in-out infinite alternate; }
  @keyframes splatPulse{ from{ transform:scale(.96); } to{ transform:scale(1.06); } }

  #repeatBtn{
    width:64px; height:64px; border-radius:50%; flex:0 0 auto;
    border:4px solid #17324f; background:linear-gradient(180deg, #ffe47a 0%, #ffb703 100%);
    box-shadow:0 5px 0 #17324f; display:grid; place-items:center; cursor:pointer;
  }
  #repeatBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 #17324f; }
  #repeatBtn svg{ width:30px; height:30px; }

  /* ================= EXPRESSIVE HOOT CHARACTER ================= */
  #hootArea{
    position:relative; display:flex; align-items:flex-end; justify-content:center; gap:14px;
    margin-bottom:-12px; z-index:6;
  }
  #mouthHalo{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(.75);
    width:118px; height:118px; border-radius:50%; pointer-events:none; opacity:0;
    background:radial-gradient(circle, rgba(255,232,110,.88) 0%, rgba(255,201,60,.28) 58%, rgba(255,201,60,0) 76%);
    border:4px dashed rgba(255,255,255,.96);
    transition:opacity .12s, transform .18s cubic-bezier(.34,1.6,.5,1);
  }
  #hootWrap{ position:relative; display:inline-flex; align-items:flex-end; justify-content:center; }
  #hootArea.mouth-open #mouthHalo{ opacity:1; transform:translate(-50%,-50%) scale(1.08); animation:haloSpin 6s linear infinite; }
  @keyframes haloSpin{ to{ transform:translate(-50%,-50%) scale(1.08) rotate(360deg); } }

  #hootBtn{
    position:relative; border:none; background:none; padding:0; cursor:pointer;
    width:clamp(168px, 33vh, 244px);
    filter:drop-shadow(0 12px 16px rgba(23,50,79,.26));
    transform-origin:50% 94%;
    animation:hootIdle 3.1s ease-in-out infinite;
  }
  #hootBtn svg{ width:100%; height:auto; display:block; overflow:visible; }
  @keyframes hootIdle{ 0%,100%{ transform:translateY(0) rotate(-.8deg); } 50%{ transform:translateY(-5px) rotate(.8deg); } }

  #hootBtn .wing-l{ transform-box:fill-box; transform-origin:85% 18%; transition:transform .2s; }
  #hootBtn .wing-r{ transform-box:fill-box; transform-origin:15% 18%; transition:transform .2s; }
  #hootBtn .eyelids{ transform-box:fill-box; transform-origin:center; animation:hootBlink 4.4s infinite; }
  @keyframes hootBlink{ 0%,93%,100%{ transform:scaleY(0); } 96%{ transform:scaleY(1); } }

  /* Instant crisp wide-open hungry mouth (no half-transparent overlap!) */
  #hootMouthOpen{ display:none; }
  #hootArea.mouth-open #hootMouthOpen{ display:block; }
  #hootArea.mouth-open #hootBeakClosed{ display:none; }
  #hootArea.mouth-open #hootBtn .wing-l{ transform:rotate(26deg); }
  #hootArea.mouth-open #hootBtn .wing-r{ transform:rotate(-26deg); }

  #hootBtn.munching{ animation:hootChomp .17s ease-in-out 6 alternate; }
  @keyframes hootChomp{ from{ transform:translateY(0) scale(1,1); } to{ transform:translateY(4px) scale(1.06,.94); } }
  #hootBtn.munching #hootBeakLow{ animation:jawChomp .17s ease-in-out 6 alternate; transform-box:fill-box; transform-origin:50% 0; }
  @keyframes jawChomp{ from{ transform:translateY(0); } to{ transform:translateY(7px); } }

  #hootBtn.happy-jump{ animation:hootHappy .52s cubic-bezier(.34,1.7,.5,1) 3; }
  @keyframes hootHappy{ 0%,100%{ transform:translateY(0) scale(1); } 40%{ transform:translateY(-26px) scale(.96,1.06) rotate(-3deg); } 75%{ transform:translateY(2px) scale(1.05,.95); } }
  #hootBtn.happy-jump .wing-l{ animation:flapL .24s ease-in-out infinite alternate; }
  #hootBtn.happy-jump .wing-r{ animation:flapR .24s ease-in-out infinite alternate; }
  @keyframes flapL{ from{ transform:rotate(0); } to{ transform:rotate(38deg); } }
  @keyframes flapR{ from{ transform:rotate(0); } to{ transform:rotate(-38deg); } }

  #hootBtn.super-flex{ animation:superPuff .65s cubic-bezier(.34,1.8,.5,1) 2; }
  @keyframes superPuff{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.14, 1.1); } }
  #hootBtn.super-flex .wing-l{ transform:rotate(52deg) scale(1.12); }
  #hootBtn.super-flex .wing-r{ transform:rotate(-52deg) scale(1.12); }

  #hootBtn.berry-blush .cheek{ fill:#ff4d79 !important; opacity:1 !important; }
  #hootBtn.head-wobble{ animation:headWobble .42s ease-in-out 2; }
  @keyframes headWobble{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-8deg); } 75%{ transform:rotate(8deg); } }
  #hootBtn.talking{ animation:talkPulse .22s ease-in-out infinite alternate; }
  @keyframes talkPulse{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-3px) scale(1.02); } }

  /* ================= MAGIC SMOOTHIE BLENDER STATION ================= */
  #blenderWrap{
    position:relative; z-index:8; display:flex; align-items:flex-end; justify-content:center; gap:18px;
    margin-bottom:2px;
  }
  #blenderWrap[hidden]{ display:none !important; }
  #blenderBox{
    position:relative; width:clamp(142px, 27vh, 192px);
    filter:drop-shadow(0 12px 18px rgba(23,50,79,.28));
  }
  #blenderBox.whirring{ animation:blenderShake .09s linear infinite; }
  @keyframes blenderShake{
    0%{ transform:translate(-3px, 1px) rotate(-1.5deg); }
    25%{ transform:translate(3px, -2px) rotate(1.5deg); }
    50%{ transform:translate(-2px, -1px) rotate(1deg); }
    75%{ transform:translate(2px, 2px) rotate(-1deg); }
    100%{ transform:translate(0,0); }
  }
  #blendGoBtn{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    width:86px; height:86px; border-radius:50%;
    border:5px solid #fff;
    background:radial-gradient(circle at 35% 30%, #6ee7b7 0%, #22c55e 58%, #15803d 100%);
    box-shadow:0 7px 0 #14532d, 0 0 0 8px rgba(255,201,60,.7), 0 0 32px rgba(34,197,94,.98);
    color:#fff; font-size:40px; display:grid; place-items:center; cursor:pointer;
    animation:blendPulse .62s ease-in-out infinite alternate;
  }
  #blendGoBtn[hidden]{ display:none !important; }
  @keyframes blendPulse{ from{ transform:translateX(-50%) scale(1); } to{ transform:translateX(-50%) scale(1.13); } }
  #blendGoBtn:active{ transform:translateX(-50%) translateY(4px) scale(.95); }

  /* Frosty Rainbow Smoothie Cup (supports BOTH tap & drag to Hoot!) */
  #smoothieCupBtn{
    position:relative; width:128px; height:156px; border:none; background:none; padding:0;
    cursor:grab; touch-action:none;
    filter:drop-shadow(0 12px 18px rgba(23,50,79,.32)) drop-shadow(0 0 20px rgba(255,201,60,.8));
    animation:cupBounce .75s ease-in-out infinite alternate;
  }
  #smoothieCupBtn[hidden]{ display:none !important; }
  @keyframes cupBounce{ from{ transform:translateY(0) rotate(-2deg) scale(1); } to{ transform:translateY(-10px) rotate(2deg) scale(1.06); } }

  /* ================= GINGHAM PICNIC TABLE & GIANT PORCELAIN PLATES ================= */
  #picnicTable{
    position:relative; z-index:7; width:100%;
    padding:16px 12px max(14px, env(safe-area-inset-bottom));
    background:
      repeating-conic-gradient(#ff6374 0% 25%, #fff7f8 0% 50%) 0 0 / 48px 48px;
    border-top:6px solid #17324f;
    box-shadow:0 -10px 28px rgba(23,50,79,.22), inset 0 6px 0 rgba(255,255,255,.6);
  }
  #plateGrid{
    max-width:780px; margin:0 auto;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:clamp(10px, 2.4vw, 18px);
    min-height:112px;
  }
  .plate-btn{
    position:relative;
    width:clamp(88px, 22vw, 114px); height:clamp(88px, 22vw, 114px);
    border-radius:50%;
    border:5px solid #17324f;
    background:radial-gradient(circle at 36% 32%, #ffffff 0%, #fffdf7 62%, #e9f1f8 100%);
    box-shadow:0 7px 0 #17324f, 0 12px 22px rgba(23,50,79,.24), inset 0 -5px 0 #dce7f2;
    padding:12px; cursor:grab; touch-action:none;
    display:grid; place-items:center;
    transition:transform .16s cubic-bezier(.34,1.6,.5,1), opacity .2s;
  }
  .plate-btn::before{
    content:""; position:absolute; inset:7px; border-radius:50%;
    border:2px solid rgba(23,50,79,.09); pointer-events:none;
  }
  .plate-btn svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 4px 5px rgba(23,50,79,.18)); pointer-events:none; }
  .plate-btn:active{ transform:scale(.93); }
  .plate-btn.eaten{ opacity:0; transform:scale(.4); pointer-events:none; }
  .plate-btn.dragging-src{ opacity:.28; transform:scale(.9); }

  /* Gentle idle visual cue for 3-year-olds */
  .plate-btn.nudge-glow{
    border-color:#ffb703;
    box-shadow:0 7px 0 #17324f, 0 0 0 8px rgba(255,201,60,.68), 0 0 28px rgba(255,183,3,.95);
    animation:plateNudge .65s ease-in-out infinite alternate;
  }
  @keyframes plateNudge{ from{ transform:translateY(0) scale(1); } to{ transform:translateY(-8px) scale(1.07); } }
  .nudge-hand{
    position:absolute; right:-10px; bottom:-14px; font-size:36px; line-height:1;
    pointer-events:none; filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));
    animation:handTap .55s ease-in-out infinite alternate;
  }
  @keyframes handTap{ from{ transform:translate(0,0) rotate(-10deg); } to{ transform:translate(-6px,-8px) rotate(4deg); } }

  /* Floating dragged food + flying arc clone */
  .drag-ghost, .fly-food{
    position:fixed; z-index:40; width:96px; height:96px; pointer-events:none;
    filter:drop-shadow(0 14px 18px rgba(23,50,79,.36));
  }
  .drag-ghost svg, .fly-food svg{ width:100%; height:100%; display:block; }

  /* Juice droplets, crumbs, hearts & floating numerals */
  .fx-dot{ position:fixed; z-index:35; pointer-events:none; border-radius:50%; }
  .fx-pop{
    position:fixed; z-index:36; pointer-events:none;
    font-family:"Fredoka",sans-serif; font-weight:800; font-size:34px;
    color:#fff; -webkit-text-stroke:2px #17324f;
    text-shadow:0 4px 0 #17324f;
    animation:popFloat .85s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes popFloat{
    0%{ transform:translate(-50%, 0) scale(.4); opacity:0; }
    25%{ transform:translate(-50%, -18px) scale(1.2); opacity:1; }
    100%{ transform:translate(-50%, -62px) scale(1); opacity:0; }
  }

  /* ================= ONE-TAP AUDIO UNLOCK BASKET (NO TEXT WALL!) ================= */
  #startVeil{
    position:fixed; inset:0; z-index:30;
    background:rgba(23,50,79,.22); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  #goBasketBtn{
    width:min(86vw, 304px); min-height:196px;
    border:6px solid #17324f; border-radius:42px;
    background:linear-gradient(180deg, #fffdf7 0%, #ffeab8 100%);
    box-shadow:0 12px 0 #17324f, 0 24px 48px rgba(23,50,79,.38);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    padding:20px; cursor:pointer;
    animation:goPulse 1.25s ease-in-out infinite alternate;
  }
  @keyframes goPulse{ from{ transform:scale(1); } to{ transform:scale(1.05); } }
  #goBasketBtn:active{ transform:translateY(5px) scale(.97); box-shadow:0 7px 0 #17324f; }
  .go-play-pill{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    min-width:184px; min-height:72px; padding:10px 28px; border-radius:999px;
    border:5px solid #17324f;
    background:linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
    color:#fff; font-size:32px; font-weight:800;
    box-shadow:0 6px 0 #14532d; text-shadow:0 2px 0 rgba(0,0,0,.3);
  }

  /* ================= CELEBRATION WIN OVERLAY (PICTURE-FIRST!) ================= */
  #winOverlay{
    position:fixed; inset:0; z-index:45;
    background:rgba(23,50,79,.45); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  #winCard{
    width:min(92vw, 440px);
    background:#fffdf8; border:6px solid #17324f; border-radius:36px;
    box-shadow:0 12px 0 #17324f, 0 28px 60px rgba(23,50,79,.4);
    padding:22px 20px 20px; text-align:center;
  }
  #winStars{ font-size:40px; letter-spacing:6px; color:#dbe7f3; line-height:1; }
  #winStars span.lit{ color:#ffc93c; text-shadow:0 0 18px rgba(255,201,60,.95); display:inline-block; animation:slotFed .45s cubic-bezier(.34,1.8,.5,1); }
  #winTitle{ font-size:clamp(26px, 6.5vw, 34px); margin:10px 0 8px; color:#17324f; }
  #winPlates{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:10px 0 18px; }
  .win-mini{ width:54px; height:54px; border-radius:50%; background:#fff6dd; border:3px solid #17324f; padding:6px; }
  .win-mini svg{ width:100%; height:100%; display:block; }
  .win-btns{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; }

      fly.remove();
      if(openBeak) hootArea.classList.remove("mouth-open");
      if(cb) cb(x1 + 48, y1 + 48);
    }
    if(fly.animate){
      var a = fly.animate([
        { transform:"translate(0,0) scale(1) rotate(0deg)" },
        { transform:"translate(" + ((x1-x0)*0.5).toFixed(1) + "px," + ((y1-y0)*0.5 - 56).toFixed(1) + "px) scale(1.14) rotate(10deg)", offset:0.52 },
        { transform:"translate(" + (x1-x0).toFixed(1) + "px," + (y1-y0).toFixed(1) + "px) scale(.42) rotate(-8deg)" }
      ], { duration:430, easing:"cubic-bezier(.26,.72,.36,1)" });
      a.onfinish = end;
      setTimeout(end, 520);
    } else {
      setTimeout(end, 120);
    }
  }

  /* ================= GAMEPLAY LOGIC: EAT, REACT, COUNT & BLEND ================= */
  function handlePlateChoice(btn, food, dropPt){
    if(state !== "playing" || inputLock || dead) return;
    var startRect = dropPt ? { left: dropPt.x - 44, top: dropPt.y - 44, width: 88, height: 88 } : btn.getBoundingClientRect();

    if(mode === "blender"){
      if(blendItems.length >= 3) return;
      inputLock = true;
      btn.classList.add("eaten");
      flyToTarget(food, startRect, blenderBox, false, function(cx, cy){
        if(dead) return;
        blendItems.push(food);
        eatenHistory.push(food);
        burstJuice(cx, cy, food.hex, 10);
        popBadge(cx + 34, cy - 26, String(blendItems.length));
        updateBlenderVisual();
        renderOrderCloud(false);
        var n = blendItems.length;
        sayClips(["name-number-" + n + ".mp3", foodClip(food, 1)], true);
        if(n >= 3){
          blendGoBtn.hidden = false;
          plateGrid.innerHTML = "";
          sfxStar();
        }
        inputLock = false;
        armIdle();
      });
      return;
    }

    var isMatch = (mode === "number") ? (food.id === reqFood.id) : (food.color === sortColor);
    if(!isMatch){
      inputLock = true;
      sfxBoing();
      hootBtn.classList.remove("head-wobble"); void hootBtn.offsetWidth; hootBtn.classList.add("head-wobble");
      if(btn.animate){
        btn.animate([
          { transform:"translateX(0)" }, { transform:"translateX(-10px) rotate(-6deg)" },
          { transform:"translateX(10px) rotate(6deg)" }, { transform:"translateX(0)" }
        ], { duration:380 });
      }
      sayClips([foodClip(food, 1), "hoot-try-again.mp3"], true);
      setTimeout(function(){
        inputLock = false;
        var m = findMatchingPlate();
        if(m){ m.classList.add("nudge-glow"); addHandTo(m); }
      }, 450);
      return;
    }

    inputLock = true;
    btn.classList.add("eaten");
    flyToTarget(food, startRect, hootBtn, true, function(cx, cy){
      if(dead) return;
      sfxChomp();
      totalBites++;
      eatenHistory.push(food);
      var bScale = (1 + Math.min(totalBites, 9) * 0.036).toFixed(3);
      hootBellyGrp.style.transform = "scale(" + bScale + ")";
      triggerHootFoodReaction(food, cx, cy);

      if(mode === "number"){
        reqGot++;
        popBadge(cx + 36, cy - 24, String(reqGot));
        renderOrderCloud(false);
        if(reqGot < reqNeed){
          sayClips(["name-number-" + reqGot + ".mp3"], true);
          inputLock = false;
          armIdle();
        } else {
          completeOrder();
        }
      } else if(mode === "color"){
        sortGot++;
        popBadge(cx + 36, cy - 24, "★");
        renderOrderCloud(false);
        if(sortGot < sortNeed){
          sayClips([foodClip(food, 1)], true);
          inputLock = false;
          armIdle();
        } else {
          completeOrder();
        }
      }
    });
  }

  function triggerHootFoodReaction(food, cx, cy){
    burstJuice(cx, cy, food.hex, 14);
    hootBtn.classList.remove("munching", "super-flex", "berry-blush");
    void hootBtn.offsetWidth;
    if(food.react === "super"){
      hootBtn.classList.add("super-flex");
      popBadge(cx - 46, cy - 30, "💪");
      setTimeout(function(){ hootBtn.classList.remove("super-flex"); }, 1250);
    } else if(food.react === "berry"){
      hootBtn.classList.add("munching", "berry-blush");
      popBadge(cx - 42, cy - 26, "💗");
      setTimeout(function(){ hootBtn.classList.remove("munching", "berry-blush"); }, 1150);
    } else {
      hootBtn.classList.add("munching");
      setTimeout(function(){ hootBtn.classList.remove("munching"); }, 950);
    }
  }

  function awardStar(){
    stars++;
    starCountEl.textContent = String(stars);
    starPill.classList.remove("bump"); void starPill.offsetWidth; starPill.classList.add("bump");
    sfxStar();
  }

  function completeOrder(){
    clearIdle();
    awardStar();
    ordersDone++;
    hootBtn.classList.remove("happy-jump"); void hootBtn.offsetWidth; hootBtn.classList.add("happy-jump");
    var ck = childKey();
    var cheer = (ordersDone % 2 === 1 && ck === "kida") ? "great-job-kida.mp3"
              : (ordersDone % 2 === 1 && ck === "kidb") ? "great-job-kidb.mp3"
              : "hoot-amazing.mp3";
    sayClips([cheer], true);

    var tok = ++roundTok;
    setTimeout(function(){
      if(dead || tok !== roundTok) return;
      hootBtn.classList.remove("happy-jump");
      if(ordersDone >= 3){
        startBlenderBonus();
      } else {
        if(mode === "number") setupNumberOrder(false);
        else setupColorOrder(false);
      }
    }, 1550);
  }

  /* ================= SETUP ROUNDS ================= */
  function setupNumberOrder(withHello){
    blenderWrap.hidden = true;
    orderCloud.hidden = false;
    state = "playing";
    inputLock = false;
    var pool = FOODS.filter(function(f){ return !reqFood || f.id !== reqFood.id; });
    reqFood = pool[Math.floor(Math.random() * pool.length)];
    reqNeed = ordersDone === 0 ? (1 + Math.floor(Math.random() * 2))
            : ordersDone === 1 ? (2 + Math.floor(Math.random() * 2))
            : (3 + Math.floor(Math.random() * 2));
    reqGot = 0;

    var list = [];
    for(var i = 0; i < reqNeed; i++) list.push(reqFood);
    var distract = shuffle(FOODS.filter(function(f){ return f.id !== reqFood.id; }));
    while(list.length < 6) list.push(distract[list.length % distract.length]);

    renderOrderCloud(true);
    buildPlates(shuffle(list));
    speakCurrentOrder(!!withHello);
    armIdle();
  }

  function setupColorOrder(withHello){
    blenderWrap.hidden = true;
    orderCloud.hidden = false;
    state = "playing";
    inputLock = false;
    var cols = ["red", "yellow", "orange", "green", "purple"].filter(function(c){ return c !== sortColor; });
    sortColor = cols[Math.floor(Math.random() * cols.length)];
    sortNeed = 3;
    sortGot = 0;

    var matching = shuffle(FOODS.filter(function(f){ return f.color === sortColor; }));
    var others = shuffle(FOODS.filter(function(f){ return f.color !== sortColor; }));
    var list = [];
    for(var i = 0; i < 3; i++) list.push(matching[i % matching.length]);
    for(var j = 0; j < 3; j++) list.push(others[j]);

    renderOrderCloud(true);
    buildPlates(shuffle(list));
    speakCurrentOrder(!!withHello);
    armIdle();
  }

  /* ================= MAGIC SMOOTHIE BLENDER MODE & BONUS ================= */
  function startBlenderBonus(){
    mode = "blender";
    syncModePills();
    setupBlenderStation(false);
  }
  function setupBlenderStation(withHello){
    clearIdle();
    state = "playing";
    inputLock = false;
    blendItems = [];
    blendReadyToDrink = false;
    blenderWrap.hidden = false;
    blendGoBtn.hidden = true;
    smoothieCupBtn.hidden = true;
    blenderBox.hidden = false;
    orderCloud.hidden = false;
    updateBlenderVisual();
    renderOrderCloud(true);
    buildPlates(shuffle(FRUITS_FOR_BLENDER).slice(0, 6));
    speakCurrentOrder(!!withHello);
    armIdle();
  }
  function updateBlenderVisual(){
    var n = blendItems.length;
    var topY = 128 - n * 28;
    var col = n ? blendItems[n - 1].hex : "#ff7aa2";
    blenderLiquid.setAttribute("d", "M" + (48 - n * 2) + " " + topY + " L" + (112 + n * 2) + " " + topY + " L112 128 L48 128 Z");
    blenderLiquid.setAttribute("fill", col);
    blenderFruits.innerHTML = blendItems.map(function(f, idx){
      var x = idx === 1 ? 66 : 56;
      var y = 88 - idx * 24;
      return '<g transform="translate(' + x + ',' + y + ') scale(0.42)"><svg viewBox="0 0 100 100" width="100" height="100">' + f.svg + '</svg></g>';
    }).join("");
  }

  blendGoBtn.addEventListener("click", function(){
    if(inputLock || blendItems.length < 3 || dead) return;
    audio();
    clearIdle();
    inputLock = true;
    blendGoBtn.hidden = true;
    blenderBox.classList.add("whirring");
    sfxWhir();
    var swCols = ["#ff5d8f", "#ffc93c", "#4ade80", "#38bdf8", "#a855f7"];
    var step = 0;
    var iv = setInterval(function(){
      step++;
      blenderLiquid.setAttribute("fill", swCols[step % swCols.length]);
      var r = blenderBox.getBoundingClientRect();
      burstJuice(r.left + r.width / 2, r.top + 30, swCols[step % swCols.length], 4);
      if(step >= 12){
        clearInterval(iv);
        blenderBox.classList.remove("whirring");
        blenderFruits.innerHTML = "";
        smoothieCupBtn.hidden = false;
        blendReadyToDrink = true;
        orderCloud.hidden = false;
        renderOrderCloud(true);
        sfxStar();
        sayClips(["hoot-giggle.mp3"], true);
        inputLock = false;
        armIdle();
      }
    }, 115);
  });

  function feedSmoothieToHoot(){
    if(inputLock || !blendReadyToDrink || dead) return;
    audio();
    clearIdle();
    inputLock = true;
    var cr = smoothieCupBtn.getBoundingClientRect();
    var hr = hootBtn.getBoundingClientRect();
    hootArea.classList.add("mouth-open");
    sfxSlurp();
    if(smoothieCupBtn.animate){
      smoothieCupBtn.animate([
        { transform:"translate(0,0) scale(1)" },
        { transform:"translate(" + (hr.left - cr.left + 20) + "px," + (hr.top - cr.top + 10) + "px) rotate(-28deg) scale(.75)" }
      ], { duration:860, easing:"cubic-bezier(.3,.7,.3,1)" });
    }
    setTimeout(function(){
      if(dead) return;
      hootArea.classList.remove("mouth-open");
      smoothieCupBtn.hidden = true;
      blenderWrap.hidden = true;
      awardStar();
      showerConfetti();
      hootBtn.classList.add("happy-jump");
      showWinCelebration();
    }, 900);
  }
  smoothieCupBtn.addEventListener("pointerup", function(){ feedSmoothieToHoot(); });
  smoothieCupBtn.addEventListener("click", function(){ feedSmoothieToHoot(); });

  function showWinCelebration(){
    state = "won";
    inputLock = false;
    winPlates.innerHTML = "";
    eatenHistory.slice(-8).forEach(function(f){
      var d = document.createElement("div");
      d.className = "win-mini";
      d.innerHTML = foodSvg(f);
      winPlates.appendChild(d);
    });
    var stEls = winStars.children;
    for(var i = 0; i < stEls.length; i++){
      stEls[i].classList.remove("lit");
      (function(el, ms){ setTimeout(function(){ el.classList.add("lit"); }, ms); })(stEls[i], 140 + i * 140);
    }
    winOverlay.hidden = false;
    sayClips(["hoot-win-yay.mp3"], true);
  }

  /* ================= CONTROLS & LIVING SCENE TAPS ================= */
  function syncModePills(){
    Array.prototype.forEach.call(document.querySelectorAll(".mode-pill"), function(b){
      b.classList.toggle("on", b.getAttribute("data-mode") === mode);
    });
  }
  function beginSession(selectedMode, withHello){
    roundTok++;
    ordersDone = 0;
    totalBites = 0;
    eatenHistory = [];
    hootBellyGrp.style.transform = "scale(1)";
    hootBtn.classList.remove("happy-jump");
    winOverlay.hidden = true;
    startVeil.hidden = true;
    mode = selectedMode || mode || "number";
    syncModePills();
    if(mode === "number") setupNumberOrder(withHello);
    else if(mode === "color") setupColorOrder(withHello);
    else setupBlenderStation(withHello);
  }

  $("goBasketBtn").addEventListener("click", function(){
    audio(); sfxPop();
    beginSession("number", true);
  });
  $("againBtn").addEventListener("click", function(){
    audio(); sfxPop();
    beginSession("number", false);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".mode-pill"), function(b){
    b.addEventListener("click", function(){
      audio(); sfxPop();
      startVeil.hidden = true;
      winOverlay.hidden = true;
      beginSession(b.getAttribute("data-mode"), false);
    });
  });

  $("repeatBtn").addEventListener("click", function(){
    audio();
    if(state === "playing") speakCurrentOrder(false);
  });
  hootBtn.addEventListener("click", function(){
    audio();
    var r = hootBtn.getBoundingClientRect();
    popBadge(r.left + r.width / 2, r.top + 24, "🎵");
    hootBtn.classList.remove("happy-jump"); void hootBtn.offsetWidth; hootBtn.classList.add("happy-jump");
    setTimeout(function(){ hootBtn.classList.remove("happy-jump"); }, 900);
    if(state === "playing"){
      sayClips(["hoot-giggle.mp3"], true);
      setTimeout(function(){ if(state === "playing" && !vPlaying) speakCurrentOrder(false); }, 1100);
    } else {
      sayClips(["hoot-giggle.mp3"], true);
    }
  });

  $("soundBtn").addEventListener("click", function(){
    soundOn = !soundOn;
    $("sndOnSvg").style.display = soundOn ? "block" : "none";
    $("sndOffSvg").style.display = soundOn ? "none" : "block";
    if(!soundOn) clearVoice();
    else { audio(); sfxPop(); }
  });

  $("sunBtn").addEventListener("click", function(){
    audio();
    $("sunBtn").classList.remove("zing"); void $("sunBtn").offsetWidth; $("sunBtn").classList.add("zing");
    sfxStar();
  });
  $("bflyBtn").addEventListener("click", function(){
    audio(); sfxPop();
    var r = $("bflyBtn").getBoundingClientRect();
    burstJuice(r.left + 32, r.top + 32, "#ff7aa2", 8);
  });
  Array.prototype.forEach.call(document.querySelectorAll("#orchardTree .tree-apple"), function(ap){
    ap.addEventListener("click", function(e){
      audio(); sfxPop();
      burstJuice(e.clientX || 80, e.clientY || 120, "#e63946", 8);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".cloud"), function(cl){
    cl.addEventListener("click", function(){
      audio(); sfxPop();
      cl.classList.remove("puff"); void cl.offsetWidth; cl.classList.add("puff");
      setTimeout(function(){ cl.classList.remove("puff"); }, 400);
    });
  });

  window.addEventListener("pagehide", function(){ dead = true; clearIdle(); clearVoice(); });
  document.addEventListener("visibilitychange", function(){ if(document.hidden) clearVoice(); });

  /* Pre-populate initial preview scene behind the Play basket so the orchard looks alive immediately! */
  reqFood = FOODS[1]; reqNeed = 3; reqGot = 0;
  renderOrderCloud(false);
  buildPlates(FOODS.slice(0, 6));

  window.__feedGame = {
    snapshot: function(){
      return {
        state: state, mode: mode, stars: stars,
        reqFood: reqFood ? reqFood.id : null, reqNeed: reqNeed, reqGot: reqGot,
        ordersDone: ordersDone, blendCount: blendItems.length, blendReady: blendReadyToDrink,
        winShown: !winOverlay.hidden, voicePlaying: vPlaying
      };
    }
  };
})();
</script>
